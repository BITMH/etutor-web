  </g>
  <g id="layer-eyes">
    <ellipse cx="108" cy="100" rx="10.5" ry="10.5" fill="#FFFFFF" stroke="#1E2430" stroke-width="2.2"/>
    <circle cx="109" cy="100" r="5.6" fill="#1E1B18"/>
    <circle cx="111.5" cy="97.5" r="2" fill="#FFFFFF"/>
    <ellipse cx="152" cy="100" rx="10.5" ry="10.5" fill="#FFFFFF" stroke="#1E2430" stroke-width="2.2"/>
    <circle cx="151" cy="100" r="5.6" fill="#1E1B18"/>
    <circle cx="153.5" cy="97.5" r="2" fill="#FFFFFF"/>
  </g>
  <g id="layer-brows">
    <path d="M 94 84 Q 108 79 120 84" fill="none" stroke="#181B22" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 140 84 Q 152 79 166 84" fill="none" stroke="#181B22" stroke-width="4.4" stroke-linecap="round"/>
  </g>
  <g id="layer-mouth">
    <path d="M 116 133 Q 130 144 144 133" fill="none" stroke="#1E2430" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
