/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  border-radius: 20px;
  padding: 22px;

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-inggeris-t4-bab02","subject":"Bahasa Inggeris","subjectGroup":"teras","form":4,"chapterNumber":2,"title":"Ready for Anything","subtitle":"Countable/uncountable nouns, quantifiers, defining & non-defining relative clauses, Past Simple vs Past Continuous, phrasal verbs with 'keep' & narrative writing.","estimatedMinutes":24,"themeAccent":"#0284c7","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/bi42-u1.jpg","voiceReactions":{"correct":"[excited] Spot on! Your grammar accuracy and vocabulary instincts are sharp!","combo":"[cheering] Brilliant streak! Keep mastering those relative clauses and tenses!","encourage":"[gentle] Almost there! Check countable noun traps and comma rules carefully.","celebrate":"[cheering] Congratulations! You have completed Module 2: Ready for Anything!"},"units":[{"id":"bi42-u1","title":"Countable vs Uncountable Nouns & Quantifiers","subtitle":"Module 2 (p.22-24): Nouns always plural, uncountables, (a) few vs (a) little & verb/noun pairs","iconType":"scale","iconUrl":"../assets/icons/bi42-u1.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u1-s1","voiceToneLabel":"Grammar Alert","voiceCaption":"Uncountable nouns like advice, luggage and equipment take singular verbs, while 'a few/a little' feel positive and 'few/little' feel negative.","voiceScript":"[warm] Welcome to Module Two, Ready for Anything! [curious] Watch out for tricky uncountable nouns such as advice, luggage, furniture, and equipment. They never take an s and always use a singular verb. Also notice how adding the article a before few or little changes the mood from negative to positive!","title":"Nouns & Quantifiers (p.22-24)","summary":"Distinguishing countable, always-plural, and uncountable nouns prevents classic SPM Paper 1 Error Identification traps.","bullets":["<strong>Always Plural Countables:</strong> people, clothes, police, goods, and two-part items (glasses, trousers, jeans, scissors — counted with 'a pair of').","<strong>Uncountable (Singular Verb, No a/an):</strong> advice, information, luggage, baggage, furniture, money, traffic, equipment.","<strong>(a) few vs (a) little:</strong> 'a few / a little' = some (positive enough); 'few / little' = hardly any (negative shortage).","<strong>Dual-meaning nouns:</strong> 'hair' (on head) vs 'cat hairs'; 'wood' (material) vs 'woods' (forest); 'experience' (skill) vs 'exciting experiences' (events)."],"formula":"Countable: many, (a) few  |  Uncountable: much, (a) little","examTip":"In SPM Cloze & Editing, NEVER write 'informations', 'furnitures', or 'an advice' — write 'a piece of advice' or 'some equipment'.","mediaKey":"bi42_quantifiers_scale","labId":"bi42_quantifiers_lab","labTitle":"Lab 2.1: Countable vs Uncountable Checker","labCaption":"Compare positive vs negative quantifiers and test tricky uncountable nouns."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Classify Nouns","voiceCaption":"Sort each noun or phrase into Countable (Takes many/few) or Uncountable (Takes much/little).","voiceScript":"[friendly] Test your grammar radar by sorting these everyday nouns into countable or uncountable categories.","prompt":"Classify each noun into Countable or Uncountable:","buckets":[{"id":"count","label":"Countable (many / a few / plural verb)"},{"id":"uncount","label":"Uncountable (much / a little / singular verb)"}],"items":[{"text":"camping equipment","bucketId":"uncount","note":"Equipment is always uncountable in English."},{"text":"pairs of climbing boots","bucketId":"count","note":"'Pair of' turns two-part items into countable units."},{"text":"medical advice","bucketId":"uncount","note":"Advice cannot be counted; use 'a piece of advice'."},{"text":"emergency volunteers","bucketId":"count","note":"Plural countable noun taking 'many' or 'a few'."}],"explanation":"'Equipment' and 'advice' are uncountable nouns (never pluralised), whereas 'pairs of boots' and 'volunteers' are countable plurals."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Nuance Check","voiceCaption":"Predict whether 'a little' or 'very little' fits when rescuers must hurry because time is almost gone.","voiceScript":"[curious] Read the urgency cue carefully: There is blank time left before sunset, so the rescue team must hurry! Should you choose a little or very little?","prompt":"There is _____ time left before the storm hits, so the hikers must reach shelter immediately!","options":["very little","a little","very few"],"correctIndex":0,"explanation":"'Time' is uncountable (ruling out 'few'). The urgent warning ('must reach shelter immediately') signals a shortage, so 'very little' (almost none) fits."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Prepositions & Confusables","voiceCaption":"Choose the correct word pair from Module 2 vocabulary: earn/raise and out of/in.","voiceScript":"[calm] Module Two highlights prepositional phrases with in and out of, plus commonly confused verbs. Pick the sentence with completely accurate vocabulary.","prompt":"Complete the sentence: 'After running uphill without water, Maya was _____ breath, yet she managed to _____ RM500 for the wildlife charity.'","options":["out of ... raise","out of ... earn","in ... gain","away from ... win"],"correctIndex":0,"explanation":"The prepositional phrase is 'out of breath' (panting). We 'raise' money for charity, whereas we 'earn' a salary and 'gain' experience."}]},{"id":"bi42-u2","title":"Defining & Non-Defining Relative Clauses","subtitle":"Module 2 (p.25 & p.159): who, which, that, whose, where & comma rules","iconType":"atom","iconUrl":"../assets/icons/bi42-u2.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Comma Rule","voiceCaption":"Defining clauses give essential ID without commas; non-defining clauses give extra info inside commas and never accept 'that'.","voiceScript":"[serious] Watch the comma rule in Relative Clauses! [warm] A defining clause needs no commas and allows who, which, or that. A non-defining clause sits inside commas to give extra information, and it strictly forbids the word that!","title":"Defining vs Non-Defining Relative Clauses","summary":"Relative clauses link descriptions using who/that (people), which/that (things), whose (possession), and where (places).","bullets":["<strong>Defining (No commas):</strong> Essential to identify the noun. 'The firefighter who/that rescued the cat is my uncle.' Object pronouns can be omitted.","<strong>Non-Defining (MUST have commas):</strong> Extra detail about a specific named noun. 'Zorbing, which comes from New Zealand, is popular.'","<strong>Strict Rule:</strong> In non-defining clauses (after a comma), NEVER use 'that' and NEVER omit the pronoun.","<strong>Place Trap:</strong> Use 'where' when action happens IN/AT the place ('the camp where we stayed'); use 'which' if describing the place itself ('the camp which won an award')."],"formula":"Comma + who / which / whose / where (NEVER 'that'!)","examTip":"In SPM Paper 1 Rational Cloze, spot a comma right before the blank? Immediately eliminate 'that' as an option!","mediaKey":"bi42_relative_comma_split","labId":"bi42_relative_lab","labTitle":"Lab 2.2: Relative Clause Checker","labCaption":"Inspect defining, non-defining, 'where', and 'whose' sentence patterns."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s2","voiceToneLabel":"Spot the Trap","voiceCaption":"Select the grammatically accurate non-defining relative clause sentence.","voiceScript":"[curious] Check the commas and relative pronouns carefully. Which sentence is grammatically accurate?","prompt":"Which sentence uses a relative clause correctly?","options":["Mr Charles, who lives next door, is a retired detective.","Mr Charles, that lives next door, is a retired detective.","Venezuela, that Maria was born, is famous for waterfalls.","Dave, who's mum works here, helped us pack."],"correctIndex":0,"explanation":"'that' cannot follow a comma in a non-defining clause; 'where' is needed for 'born (in)'; and possession requires 'whose', not 'who's' (who is)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Sentence Builder","voiceCaption":"Combine two facts about Helen Partridge into one non-defining relative clause sentence.","voiceScript":"[friendly] Build a smooth non-defining relative clause sentence describing Helen Partridge.","prompt":"Assemble a correct non-defining relative clause sentence:","answerTokens":["Helen,","who","won","the quiz,","was interviewed","on radio."],"distractors":["that","whose","which"],"explanation":"Use 'who' (never 'that') between commas to add extra information about a named person, Helen."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Vocabulary Match","voiceCaption":"Match Module 2 personality adjectives and 'keep' expressions with their meanings.","voiceScript":"[warm] Module Two also equips you with personality adjectives and phrasal verbs using keep. Match each phrase on the left with its meaning.","prompt":"Match each Module 2 expression or adjective with its meaning:","pairs":[{"id":"p1","left":"keep in mind","right":"remember an important fact or warning"},{"id":"p2","left":"keep an eye on","right":"watch carefully to protect or guard"},{"id":"p3","left":"stubborn","right":"unwilling to change one's mind easily"},{"id":"p4","left":"courageous","right":"brave enough to face danger without panic"}],"explanation":"These expressions appear in the Module 2 listening witness interviews and character description tasks."}]},{"id":"bi42-u3","title":"Past Simple vs Past Continuous & Time Clauses","subtitle":"Module 2 (p.28 & p.160): Interrupted actions, parallel actions and 'as soon as'","iconType":"pendulum","iconUrl":"../assets/icons/bi42-u3.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Action Timeline","voiceCaption":"Use Past Continuous for the ongoing background action and Past Simple for the sudden interrupting event.","voiceScript":"[excited] Great stories mix background scenery with sudden action! [warm] Use Past Continuous for the longer ongoing action, and Past Simple for the short event that interrupts it. Remember that as soon as always pairs with Past Simple!","title":"Past Simple vs Past Continuous (p.28 & p.160)","summary":"Time clauses with when, while, as, and as soon as signal how past events overlap or follow one another in narratives.","bullets":["<strong>Interruption:</strong> Longer background action = Past Continuous (was/were + V-ing); shorter interrupting action = Past Simple ('While they were hiking, they saw a bear').","<strong>Parallel Background Actions:</strong> Two simultaneous ongoing actions both take Past Continuous ('While I was checking the map, my friend was holding the torch').","<strong>Scene Setting:</strong> 'It was raining heavily and the wind was blowing.'","<strong>Immediate Sequence ('as soon as'):</strong> Always takes Past Simple ('As soon as we arrived, we ran to help')."],"formula":"While/As + Past Continuous, + Past Simple  |  as soon as + Past Simple","examTip":"In narrative essays, avoid putting stative verbs ('know', 'see', 'realise') in Past Continuous; write 'When she saw the smoke', never 'was seeing'.","mediaKey":"bi42_past_interruption_arc","labId":"bi42_past_tenses_lab","labTitle":"Lab 2.3: Story Tense Simulator","labCaption":"Compare interruption, parallel background, and sequential 'as soon as' patterns."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Tense Choice","voiceCaption":"Predict the correct verbs when the lights suddenly go out during a shower.","voiceScript":"[curious] Picture the scene: I was taking a shower when suddenly all the lights went out. Which tense pair captures the long action versus the sudden interruption?","prompt":"Choose the best completion: 'Liam _____ down the steep path when he _____ his ankle.'","options":["was jogging ... twisted","jogged ... was twisting","was jogging ... was twisting"],"correctIndex":0,"explanation":"Jogging was the ongoing background action (Past Continuous), interrupted by the sudden short event 'twisted' (Past Simple)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s3","voiceToneLabel":"Sentence Transformation","voiceCaption":"Choose the closest transformation using 'as soon as' from Module 2 Exam Practice.","voiceScript":"[calm] In Exam Practice page one hundred forty-one, Laura bought the red skateboard immediately when she saw it. Which sentence rewrites this accurately with as soon as?","prompt":"Rewrite: 'Laura saw a red skateboard in the shop and immediately bought it.'","options":["Laura bought a red skateboard as soon as she saw it.","Laura was buying a red skateboard as soon as she was seeing it.","Laura buys a red skateboard as soon as she saw it.","Laura had bought a red skateboard while she saw it."],"correctIndex":0,"explanation":"'As soon as' links two rapid consecutive events using Past Simple in both clauses ('bought ... as soon as she saw')."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Phrasal Verbs","voiceCaption":"Match phrasal verbs with 'keep' and vocabulary pairs from Module 2.","voiceScript":"[friendly] Match each expression with keep or rescue noun-verb pair with its exact definition.","prompt":"Match each Module 2 phrase or verb with its meaning:","pairs":[{"id":"p1","left":"keep up with","right":"move or progress at the same speed"},{"id":"p2","left":"keep off","right":"stay away from or avoid stepping on"},{"id":"p3","left":"out of date","right":"old-fashioned or no longer valid"},{"id":"p4","left":"out of the question","right":"completely impossible or not allowed"}],"explanation":"All four phrases appear directly in Module 2 vocabulary drills (p.24 & p.30-31)."}]},{"id":"bi42-u4","title":"Describing a Person & Writing a Dramatic Story","subtitle":"Module 2 Writing Skills (p.27 & p.32-33): Supporting opinions & narrative linkers","iconType":"book","iconUrl":"../assets/icons/bi42-u4.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Writing Craft","voiceCaption":"A strong narrative uses time, cause, result and emphasis linkers, while person descriptions justify traits with real examples.","voiceScript":"[warm] In SPM Writing Part Two and Part Three, simply calling a hero brave is not enough. [excited] Support every personality adjective with evidence, and weave your story together using strong linking phrases of time, cause, result, and sudden emphasis!","title":"Narrative Linkers & Supporting Opinions","summary":"Module 2 develops two high-scoring SPM writing skills: justifying character descriptions and pacing stories with cohesive linkers.","bullets":["<strong>Supporting an Opinion:</strong> Pair a personality trait with concrete proof ('She is courageous; for instance, she entered the smoky room to rescue the child').","<strong>Time Linkers:</strong> initially, meanwhile, suddenly, in the end, after a while, as soon as.","<strong>Result / Consequence:</strong> consequently, as a result, therefore, so.","<strong>Cause / Reason & Emphasis:</strong> owing to, because of (+ noun), since (+ clause); above all, without a doubt."],"formula":"Trait + Concrete Evidence  |  Setting -> Climax -> Resolution","examTip":"Remember the preposition split: 'because of / owing to' + NOUN ('owing to the fog'), whereas 'because / since / as' + SUBJECT + VERB.","callout":""},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Linker Categories","voiceCaption":"Classify each cohesive linker into Time Sequence, Cause/Reason, or Result/Consequence.","voiceScript":"[friendly] Sort these cohesive devices according to their function in a dramatic story.","prompt":"Classify each narrative linker by its communicative function:","buckets":[{"id":"time","label":"Time / Sequence"},{"id":"cause","label":"Cause / Reason"},{"id":"result","label":"Result / Consequence"}],"items":[{"text":"meanwhile","bucketId":"time","note":"Shows another event happening at the same time."},{"text":"owing to","bucketId":"cause","note":"Means 'because of' (+ noun phrase)."},{"text":"consequently","bucketId":"result","note":"Introduces the outcome of a previous event."},{"text":"all of a sudden","bucketId":"time","note":"Signals an unexpected turning point in time."}],"explanation":"Cohesive devices clarify timeline ('meanwhile', 'all of a sudden'), causes ('owing to'), and consequences ('consequently') for SPM Writing marks."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Cohesion Fix","voiceCaption":"Assemble a smooth sentence justifying a hero's bravery using 'because of'.","voiceScript":"[calm] Arrange the tokens to write a strong sentence supporting a character trait using the cause phrase because of.","prompt":"Order the tokens to justify why the witness stayed safe:","answerTokens":["Because of","the lifeguard's","quick thinking,","everybody","reached shore","safely."],"distractors":["Because","meanwhile","consequently"],"explanation":"'Because of' is followed by a noun phrase ('the lifeguard's quick thinking'), whereas 'because' requires a full clause with a verb."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Story Structure","voiceCaption":"Identify the strongest opening line for an SPM narrative titled 'Ready for Anything'.","voiceScript":"[curious] Which opening sentence sets atmosphere immediately using Past Continuous before the turning point?","prompt":"Which story opening best uses Module 2 techniques to hook the reader immediately?","options":["Thick mist was creeping across the ridge as we checked our compasses one final time.","Last week I went to a mountain with my friends and it was very fun and interesting.","In my opinion, hiking is good because it makes teenagers healthy and strong.","First, we woke up at 6am, then we ate breakfast, then we took a bus."],"correctIndex":0,"explanation":"Using Past Continuous ('was creeping') plus sensory detail ('thick mist', 'ridge') sets an atmospheric scene immediately."}]},{"id":"bi42-u5","title":"Module 2 Mastery Boss Challenge","subtitle":"SPM Paper 1 & 2 Synthesis: Quantifiers, Relative Clauses, Past Tenses & Editing","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Level 1","voiceCaption":"Spot the correct completion from the Module 2 Exam Practice cloze on stunt work.","voiceScript":"[excited] Welcome to the Module Two Boss Challenge! Choose the accurate quantifier for an uncountable noun meaning almost none.","prompt":"Most of the stunts in the action film were performed by the lead actress herself, so very _____ work had to be done by a stuntperson.","options":["little","few","many","some"],"correctIndex":0,"explanation":"'Work' is uncountable, and 'very little' expresses that almost no work remained for a stuntperson."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Level 2","voiceCaption":"Choose the correct relative pronoun after a comma referring to an entire film title.","voiceScript":"[curious] Notice the comma right before the blank in: Salt, blank is a thrilling action film, starred Angelina Jolie. What is the only valid pronoun here?","prompt":"This becomes obvious when you watch the rescue documentary, _____ won three international awards last year.","options":["which","that","what"],"correctIndex":0,"explanation":"Non-defining relative clauses (separated by a comma) NEVER take 'that', and 'which' refers to things or documentaries."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Level 3","voiceCaption":"Complete the Exam Practice key-word transformation using 'familiar' (Module 2 p.141).","voiceScript":"[serious] Transform the sentence 'Laura and Sandra don't know any skateboarding tricks' into the exact pattern using familiar.","prompt":"Complete the rewrite: 'Laura and Sandra don't know any skateboarding tricks' -> 'Laura and Sandra...'","answerTokens":["aren't","familiar","with","any","skateboarding","tricks."],"distractors":["isn't","familiar","about","known"],"explanation":"Adjective + preposition accuracy: 'be familiar WITH something' (plural subject takes 'aren't familiar with')."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s4","voiceToneLabel":"Final Boss","voiceCaption":"Solve the multi-rule narrative sentence combining Past Continuous, Past Simple, and an uncountable noun.","voiceScript":"[excited] Final Boss question for Module Two! Combine your knowledge of Past Continuous, Past Simple, and uncountable nouns.","prompt":"While the paramedics _____ the hiker's heavy _____, the police _____ for any witnesses near the gate.","options":["were carrying ... luggage ... were looking","carried ... luggages ... looked","were carrying ... luggages ... were looking","had carried ... luggage ... are looking"],"correctIndex":0,"explanation":"'Luggage' has no plural '-s', 'police' takes a plural verb ('were looking'), and two parallel ongoing background actions use Past Continuous."}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {

    const cases = [

        btn: "a few vs few",
        ex1: "I have a few close friends who always support me.",
        ex2: "Very few people entered the burning building.",
        rule: "Use (a) few with PLURAL COUNTABLE nouns. 'a few' = some (positive); 'few' = almost none (negative).",
      },
      {
        btn: "a little vs little",
        ex1: "We still have a little time before the rescue boat leaves.",
        ex2: "There is very little luggage space left in the van.",
        rule: "Use (a) little with UNCOUNTABLE nouns. 'a little' = some (positive); 'little' = hardly any (negative).",
      },

        btn: "Tricky Uncountables",
        ex1: "The rescue team gave us useful advice and information.",
        ex2: "Two pairs of scissors and new equipment were packed.",
        rule: "Words like advice, information, luggage, furniture, and equipment are ALWAYS uncountable (no '-s', singular verb). Glasses/jeans/scissors take 'a pair of'.",

      },
      {

        note: "Extra information after a specific name. MUST use commas and NEVER use 'that'!",

      {
        label: "That is the mountain ridge where the hikers lost their signal.",
        type: "Relative Adverb 'where'",
        note: "Use 'where' (not 'which') when referring to an action happening IN/AT a place (no preposition left behind).",

  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

        footer.appendChild(prevBtn);

        var nextBtn = document.createElement("button");

        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";

        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";

        skipBtn.addEventListener("click", function () {

          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
