/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}

.nota-topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface-card);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-primary) 58%, var(--brand-accent) 100%);
  color: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 12px 28px rgba(30, 58, 138, 0.22);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #dbeafe; line-height: 1.5; }

.hero-mastery-box {
  background: rgba(15, 23, 42, 0.28);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #eff6ff; }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  text-align: center;
  width: 100%;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

  border: 2px solid var(--border-subtle);

  padding: 22px;

  display: flex;
  flex-direction: column;

}

  align-items: center;

  align-self: flex-start;

.step-summary { margin: 0; font-size: 0.96rem; color: var(--text-secondary); line-height: 1.6; }

.concept-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.concept-bullets li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.bullet-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.step-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.step-top-row--right { justify-content: flex-end; }
.step-acronym-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #312e81 0%, #2563eb 100%);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.03em;

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

}

.lab-shell {

}
.lab-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lab-title-pill { font-family: var(--font-heading); font-size: 0.82rem; font-weight: 700; color: var(--brand-primary); }
.lab-interacted-pill {

  font-weight: 700;

  border: 1px solid #a7f3d0;
}
.lab-stage {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px;
  overflow: hidden;
}
.lab-stage svg, .lab-stage canvas { display: block; width: 100%; height: auto; }
.lab-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.lab-seg-btn {
  min-height: 44px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}
.lab-seg-btn[aria-pressed="true"] { border-color: var(--brand-accent); background: var(--brand-accent); color: #ffffff; }
.lab-pause-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 12px;
  border-radius: 10px;

  background: var(--surface-card);

}
.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-tokoh-pill {
  min-height: 38px;
  padding: 6px 11px;

  border: 1.5px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.lab-tokoh-pill[aria-pressed="true"] { border-color: var(--dom-media); background: #f5f3ff; color: #5b21b6; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1.5px solid var(--border-subtle);
  font-size: 0.79rem;
  line-height: 1.42;
  color: var(--text-secondary);
}
.lab-phase-step strong { display: block; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--brand-primary); margin-bottom: 2px; }
.lab-metric-card { padding: 10px 12px; border-radius: 12px; background: var(--surface-card); border: 1.5px solid var(--brand-border); }

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.lab-meter {
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
}
.lab-meter-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.lab-meter-val { display: block; font-family: var(--font-mono); font-size: 0.94rem; font-weight: 800; color: var(--brand-navy); }
.lab-callout {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border-left: 4px solid var(--brand-accent);

  color: var(--text-primary);
}
.stimulus-box {
  padding: 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);

}

/* Modals & Celebration */
.modal-overlay {

  inset: 0;

  background: rgba(15, 23, 42, 0.62);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal-overlay[hidden] { display: none; }
.confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 71; }
.modal-card {
  position: relative;
  z-index: 72;
  width: 100%;
  max-width: 440px;
  background: var(--surface-card);

@media (prefers-reduced-motion: no-preference) {

}
.cel-eyebrow {

}
.cel-title { font-family: var(--font-heading); font-size: 1.35rem; color: var(--brand-navy); margin: 8px 0 6px; }
.cel-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin: 0 0 16px; line-height: 1.5; }
.cel-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {
  width: 60px;
  height: 60px;
  margin: 0 auto 10px;
  border-radius: 50%;
  background: var(--status-danger-soft);
  color: var(--status-danger);

}

/* Butang Suara Tunggal Gaya Duolingo (Khusus ElevenLabs v4 + WCAG 1.4.2) */

.voice-eq-bars {
  display: inline-flex;

  justify-content: center;
  gap: 2.5px;
  height: 16px;
}
.voice-eq-bar {
  width: 3px;
  height: 5px;
  border-radius: 2px;
  background: #ffffff;
}
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(1) { animation: voiceEqPulse 0.65s ease-in-out infinite 0s; }
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(2) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.16s; }
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }
.cikgu-mascot-svg .cikgu-wing-r { transform-box: fill-box; transform-origin: left center; }
.cikgu-companion-bar.is-speaking .cikgu-mascot-svg { animation: owlSpeakBob 0.55s ease-in-out infinite; }
.cikgu-companion-bar.is-speaking .cikgu-wing-l { animation: owlWingL 0.45s ease-in-out infinite; }
.cikgu-companion-bar.is-speaking .cikgu-wing-r { animation: owlWingR 0.45s ease-in-out infinite; }
@keyframes owlSpeakBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes owlWingL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit"></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-inggeris-t4-mod01","subject":"Bahasa Inggeris","form":4,"chapterNumber":1,"title":"Module 1: Let's Chat (1119 CEFR Grammar & Communication)","subtitle":"Present Simple vs Continuous, Stative Verbs, Comparisons, Past Simple, Used to vs Be/Get Used to, Suffix Nouns (-ion/-ation/-ment) & Informal Email Writing.","estimatedMinutes":22,"themeAccent":"#2563eb","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Interactive Multimedia & AI Coach","enableMultimediaEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/bi-u1.jpg","voiceReactions":{"correct":"[excited] Spot on! Your English grammar mastery is truly impressive!","combo":"[laughs warmly] Brilliant combo! Keep this amazing momentum going!","encourage":"[softly] Almost there... check the time markers and stative verb rules below.","celebrate":"[excited] Well done! You've conquered another Module 1 unit!"},"units":[{"id":"bi-u1","title":"Unit 1: Present Simple, Present Continuous & Stative Verbs","subtitle":"Module 1 (p.9) — Permanent Habits vs Temporary Actions & Mental States","iconType":"crown","iconUrl":"../assets/icons/bi-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c1","voiceToneLabel":"Present Simple vs Present Continuous","voiceCaption":"Use Present Simple for daily habits and timetables, and Present Continuous for actions happening right now or fixed plans.","voiceScript":"[warm] Welcome to Module One, Let's Chat! Use Present Simple for daily habits and train timetables, while Present Continuous shows actions happening at the moment, fixed plans, or an annoying always!","title":"Present Simple vs Present Continuous (p.9)","acronym":"HABIT vs NOW","mediaKey":"bi_video_chat_teens","summary":"Time expressions quickly reveal whether an action is a repeated routine or an action currently unfolding.","bullets":["Present Simple (every day, usually, timetables): 'Tanya enjoys using SN sites every day.' | 'What time does the train leave?' (transport timetable).","Present Continuous (at the moment, these days, tonight, annoying 'always'): 'She is playing a game now.' | 'Emma is always chatting on the Net!' (complaint)."],"labId":"bi_tenses_timeline_lab","labTitle":"Interactive SVG Tenses Timeline","labProps":{"ctxKey":"habit"},"examTip":"Schedule future verbs (trains, flights, lessons) stay in Present Simple, NOT Continuous!","hook":"Exam Alert: Bus schedules, train timetables & flights ALWAYS take Present Simple ('leaves at 8'), NOT Continuous!"},{"type":"sort","voiceIdKey":"u1-s2","voiceToneLabel":"Sort: Present Simple vs Continuous","voiceCaption":"Sort these textbook sentences by tense rule: Habit/Stative vs Happening Now/Temporary/Plan.","voiceScript":"[curious] Uji kepekaan tatabahasa kamu! Isihkan enam ayat daripada halaman sembilan hingga dua puluh buku teks kepada Present Simple atau Present Continuous.","prompt":"Classify each sentence below according to the correct Present tense form.","buckets":[{"id":"ps","label":"Present Simple (Habit / Timetable / Stative)"},{"id":"pc","label":"Present Continuous (Now / Temporary / Plan)"}],"items":[{"text":"What time does the train to Brighton leave?","bucketId":"ps","note":"Official transport timetables always take Present Simple."},{"text":"He is staying with us for a few days.","bucketId":"pc","note":"Temporary situation happening around now."},{"text":"I don't understand this complicated text.","bucketId":"ps","note":"'understand' is a stative verb; never write 'am not understanding'."},{"text":"These days, Peter is studying hard for his SPM.","bucketId":"pc","note":"Temporary ongoing action around the present period ('these days')."},{"text":"Ethan receives emails from Australia every day.","bucketId":"ps","note":"Repeated daily routine ('every day')."},{"text":"I'm thinking of buying a new laptop this week.","bucketId":"pc","note":"Considering/planning in the near future (dynamic use of 'think')."}],"explanation":"Spotting time markers ('every day', 'these days', 'at the moment') and stative verbs quickly solves Error Correction and Rational Cloze items.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c2","voiceToneLabel":"The Stative Verbs Shield","voiceCaption":"Stative verbs express states of mind, feelings, senses and possession, so they normally do not take -ing.","voiceScript":"[curious] Watch out for the Stative Verb trap! Verbs of feelings, thinking, and possession like love, understand, and belong stay under the Stative Shield and almost never take i-n-g!","title":"Stative Verbs: Mind, Feelings & Possession (No -ing!)","acronym":"M•F•P","mediaKey":"bi_stative_shield","summary":"Unlike physical actions, mental states and permanent feelings are expressed in simple tense forms.","bullets":["4 Stative Categories: Feelings (like, love, hate), Thinking/Opinions (believe, understand, imagine, know), Senses (see, hear, smell), and Possession (own, have, belong).","Common Exam Error: Write 'I understand the rule now', NEVER 'I am understanding the rule now'."],"examTip":"Notice the signal 'now' can trick students—always check if the verb itself is stative!","hook":"Stative verbs ('know', 'love', 'own', 'believe') describe states of mind/feeling — NEVER add '-ing' to them!"},{"type":"match","voiceIdKey":"u1-s4","voiceToneLabel":"Match: ICT & Communication Collocations","voiceCaption":"Match the technology verbs and communication phrases from textbook page 10.","voiceScript":"[warm] Halaman sepuluh menyenaraikan kolokasi komputer dan frasa perhubungan seperti calling back, lost touch dan drop me a line. Cuba padankan makna tepat setiap frasa!","prompt":"Match each communication collocation from page 10 with its exact meaning.","pairs":[{"id":"v1","left":"drop me a line","right":"send a short letter, email or message"},{"id":"v2","left":"lost touch with old friends","right":"stopped communicating over time"},{"id":"v3","left":"attach a document","right":"add a file/image to an email"},{"id":"v4","left":"have a word with someone","right":"speak to someone for a short time"}],"explanation":"Collocations like 'drop a line', 'keep in touch', 'receive a reply', and 'install an antivirus program' frequently appear in SPM Paper 1 & Writing.","xp":15,"mediaKey":"bi_dual_meaning_split"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c3","voiceToneLabel":"Dual-Meaning Stative vs Dynamic Verbs","voiceCaption":"Some verbs like think, have, and see change meaning when used in the continuous form to describe an active process.","voiceScript":"[confident] Here is the clever Round-Up page twenty trap! Compare 'I think he is right' as an opinion with 'I am thinking of going to the cinema' as an active plan! Play the trap zapper below!","title":"Dual-Meaning Alert: think / have / see (Round-up p.20)","acronym":"STAT vs DYN","summary":"When a stative verb shifts to describe a temporary action or mental planning, the -ing form becomes grammatical.","bullets":["think: 'I think he is right' (Stative: opinion) vs 'I am thinking of going to the cinema' (Dynamic: considering/planning).","have & see: 'have a laptop' (possess -> stative) vs 'having dinner/a party' (activity -> dynamic); 'see a doctor' (meet -> dynamic)."],"labId":"bi_tenses_timeline_lab","labTitle":"Stative Shield & Dual-Meaning Zapper","labProps":{"ctxKey":"stative"},"examTip":"Ask yourself: 'Is this an opinion/possession, or an action happening step by step?'","mediaKey":"bi_dual_meaning_split","hook":"'I think it's cool' = opinion (Static); 'I am thinking about you' = mental process happening right now (Dynamic)!"},{"type":"predict","voiceIdKey":"u1-s3","voiceToneLabel":"Predict: Stative Verbs in Dialogue","voiceCaption":"Choose the right verb forms for the Round-up B1 dialogue on page 20.","voiceScript":"[curious] Lengkapkan dialog Round up B satu ini: A berkata 'Saya sedang berkira-kira hendak ke pawagam Sabtu ini, awak ikutkah?', manakala B membalas 'Saya rasa tidak, adik saya perlukan bantuan Matematik'. Pilih gandingan yang paling tepat!","prompt":"Complete the dialogue (Round-up p.20): A: 'I ____ (think) of going to the cinema on Saturday. ____ you ____ (come)?' B: 'I ____ (not think) so. My brother ____ (need) help with his Maths.'","scenario":"Compare 'think of' (active plan) vs 'think so' (opinion) and stative verb 'need'.","options":["think / Do... come / am not thinking / is needing","am thinking / Are... coming / don't think / needs","am thinking / Do... come / don't think / is needing","think / Are... coming / am not thinking / needs"],"correctIndex":1,"proofLabId":"bi_tenses_timeline_lab","proofState":{"ctxKey":"stative"},"explanation":"'I am thinking of...' = active consideration/plan; 'Are you coming?' = fixed near-future plan; 'I don't think so' = opinion (stative); 'needs' = stative verb (no -ing).","xp":20},{"type":"mcq","voiceIdKey":"u1-s5","voiceToneLabel":"Check: Social Networking Reading Vocab","voiceCaption":"Answer this vocabulary question from 'Your Opinion: Social Networking Sites' (p.8–9).","voiceScript":"[curious] Merujuk petikan bacaan halaman lapan dan sembilan mengenai pandangan empat remaja tentang media sosial: apakah maksud perkataan 'drawback' dan 'deactivating' dalam konteks Alicia dan Emma?","prompt":"In the reading text (p.8–9), Alicia writes 'I can't see any drawback there' while Emma says 'I'm thinking about deactivating it'. What do both words mean?","options":["drawback = advantage; deactivating = deleting permanently","drawback = disadvantage; deactivating = making something stop working","drawback = highlight; deactivating = updating a status","drawback = cyberbullying; deactivating = inviting friends"],"correctIndex":1,"explanation":"Activity C (p.9) confirms: drawback = disadvantage, nasty = unpleasant, constantly = continuously, update = give latest info, highlights = best parts, deactivating = making something stop working.","xp":20}]},{"id":"bi-u2","title":"Unit 2: Comparisons & Attitude Expressions","subtitle":"Module 1 (p.11–12) — Comparative, Superlative, Proportional & Likes/Dislikes","iconType":"scale","iconUrl":"../assets/icons/bi-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c1","voiceToneLabel":"Comparatives & Superlatives","voiceCaption":"Short adjectives take -er and -est, whereas longer adjectives take more and the most.","voiceScript":"[warm] Let's compare gadgets in Unit Two! One-syllable adjectives add e-r plus than or the e-s-t, while multi-syllable adjectives like creative use more and the most!","title":"Comparatives (-er / more) & Superlatives (-est / most)","acronym":"-ER vs MORE","summary":"Adjective syllable length and irregular forms govern accurate gadget and personality comparisons.","bullets":["Comparative + than: 1 syllable (+er: faster than), 2+ syllables (more + adj + than: more reliable than). Never double up ('more faster' is WRONG!).","Superlative & Irregulars: the + adj-est / the most + adj ('Alice is the most creative'); irregulars: good -> better -> the best, bad -> worse -> the worst, far -> further."],"labId":"bi_comparison_slider_lab","labTitle":"Gadget Comparison Bar Race","labProps":{"mode":"comp"},"examTip":"Short adjectives ending in -y drop y for -ier/-iest: early -> earlier -> the earliest.","mediaKey":"bi_podium_compare","hook":"NEVER write 'more faster' or 'most prettiest'! Use either '-er/-est' OR 'more/most', never both together!"},{"type":"sort","voiceIdKey":"u2-s4","voiceToneLabel":"Sort: Laptop vs Desktop Features","voiceCaption":"Classify desktop and laptop traits from the Speaking activity on textbook page 17.","voiceScript":"[warm] Halaman tujuh belas melatih kemahiran Speaking membandingkan desktop dan laptop. Isihkan enam kata kunci berikut kepada ciri utama Desktop atau Laptop.","prompt":"Sort these computer comparison features (Speak p.17) into the device category they describe.","buckets":[{"id":"laptop","label":"Laptop / Smartphone Key Traits"},{"id":"desktop","label":"Desktop Computer Key Traits"}],"items":[{"text":"portable & convenient to carry","bucketId":"laptop","note":"Easy to carry to cafés, libraries and school."},{"text":"takes up room & has more cables","bucketId":"desktop","note":"Requires a dedicated desk with monitor and CPU cables."},{"text":"battery needs frequent charging","bucketId":"laptop","note":"Key limitation of portable mobile devices."},{"text":"usually has a larger screen & easier to repair","bucketId":"desktop","note":"Modular components and larger display screen."},{"text":"small keyboard & lighter weight","bucketId":"laptop","note":"Compact design built for portability."},{"text":"harder to steal from a room","bucketId":"desktop","note":"Lower theft risk compared to carrying it in public."}],"explanation":"This p.17 vocabulary equips you to compare devices confidently in SPM Speaking Part 2 & Part 3.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c2","voiceToneLabel":"As...As & Proportional Comparisons","voiceCaption":"Keep the base adjective inside as...as, and use The + comparative..., the + comparative... for cause-and-effect trends.","voiceScript":"[curious] Look at these two high-scoring comparison patterns: keep the base adjective inside 'not as popular as', and connect two trends cleanly with 'The earlier we leave, the better'!","title":"Equality (as...as) & Proportional (The..., the...)","acronym":"AS • THE..THE","summary":"These special comparison patterns compare equal value, gradual change, and direct cause-effect relationships.","bullets":["Equality: '(not) as + BASE adjective + as' -> 'Postcards are NOT as popular as emails.' (Never put -er or more inside as...as!).","Continuous & Proportional: 'getting harder and harder' | 'The earlier we leave, the better.' | 'The more young people text, the less time they talk.'"],"labId":"bi_comparison_slider_lab","labTitle":"As...As Shield & Double-Comparative Gauge","labProps":{"mode":"prop"},"formula":"The + comparative..., the + comparative...","examTip":"In 'The earlier..., the better', BOTH halves must use the comparative form with 'the'!","mediaKey":"bi_podium_compare","hook":"Cause-and-effect flex: 'The MORE you practise, the FASTER you score!' — always pair two comparatives!"},{"type":"predict","voiceIdKey":"u2-s3","voiceToneLabel":"Predict: Proportional Comparison","voiceCaption":"Predict the exact comparative forms for 'The ____ we leave, the better' (Round-up D3).","voiceScript":"[curious] Untuk binaan perbandingan berkadaran 'Lebih awal kita bertolak, lebih baik', apakah bentuk yang wajib digunakan selepas 'The'?","prompt":"Complete the sentence (Round-up p.20 D3 & p.11): 'The ____ (early) we leave for the train station, the ____ (good).'","scenario":"Correlative Comparative ('the..., the...'): BOTH halves require the comparative form.","options":["earliest / best","early / better","earlier / better","more early / good"],"correctIndex":2,"proofLabId":"bi_comparison_slider_lab","proofState":{"mode":"proportional"},"explanation":"'The + comparative, the + comparative' requires 'earlier' (NOT earliest/early) and 'better' (irregular comparative of good).","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c3","voiceToneLabel":"Must-Know Attitude Prepositions","voiceCaption":"Expressing likes and dislikes accurately in Module 1 requires pairing each phrase with its exact fixed preposition.","voiceScript":"[confident] Want to sound natural in speaking and emails? Match every attitude adjective with its exact preposition partner: crazy about, keen on, interested in, and fed up with!","title":"Attitude Expressions & Fixed Prepositions (p.12)","acronym":"A•O•I•W","summary":"Different English adjectives lock tightly onto specific prepositions—mixing them up is a common SPM error.","bullets":["ABOUT / ON / IN: crazy ABOUT, enthusiastic ABOUT, keen ON, interested IN (+ noun or V-ing).","OF / WITH: fond OF, tired OF, sick OF, a big fan OF, fed up WITH, bored WITH ('I'm fed up with waiting!')."],"labId":"bi_comparison_slider_lab","labTitle":"Attitude Preposition Chips (p.12)","labProps":{"mode":"att"},"examTip":"Always put V-ing (gerund) after a preposition: 'keen on playing', NOT 'keen on play'!","mediaKey":"bi_attitude_stickers","hook":"Prepositions are glued to attitude phrases: 'crazy ABOUT', 'keen ON', 'interested IN', 'fed up WITH'!"},{"type":"match","voiceIdKey":"u2-s2","voiceToneLabel":"Match: Attitude Fixed Prepositions","voiceCaption":"Match the likes and dislikes phrases from page 12 with their fixed prepositions.","voiceScript":"[curious] Jangan tertukar preposisi! Padankan empat ungkapan minat dan ketidakpuasan hati dari halaman dua belas ini dengan kata sendinya yang betul.","prompt":"Match each attitude expression with its correct fixed preposition (textbook p.12):","pairs":[{"id":"a1","left":"David is keen ...","right":"... ON sports (positive meaning)"},{"id":"a2","left":"Julie is fond ...","right":"... OF cooking (positive meaning)"},{"id":"a3","left":"Emma is fed up ...","right":"... WITH her old computer (negative meaning)"},{"id":"a4","left":"We are enthusiastic ...","right":"... ABOUT our trip to Finland (positive meaning)"}],"explanation":"Positive: crazy about, keen on, fond of, fan of, interested in, enthusiastic about. Negative: tired of, fed up with, sick of, bored with.","xp":15},{"type":"mcq","voiceIdKey":"u2-s5","voiceToneLabel":"Check: Not As... As & Comparisons","voiceCaption":"Choose the grammatically accurate comparison sentence from Round-up D (p.20).","voiceScript":"[confident] Uji ketepatan struktur 'not as plus kata sifat asal plus as' serta 'much more'. Pilih satu sahaja ayat yang seratus peratus betul.","prompt":"Which of the following sentences is 100% grammatically accurate according to Round-up p.20 D?","options":["Postcards are not as more popular as emails.","I think Science is a lot difficult than History.","Betty is getting taller and taller every day.","The journey was more long than we expected."],"correctIndex":2,"explanation":"Double comparatives use 'taller and taller'. Option A wrongly puts 'more' inside 'as...as'; B is missing 'more'; D should use 'longer' (1 syllable).","xp":20}]},{"id":"bi-u3","title":"Unit 3: Brick to Smartphone & Used to / Be Used to","subtitle":"Module 1 (p.14–15) — 1G–4G Evolution, Past Simple & Used to vs Be/Get Used to","iconType":"press","iconUrl":"../assets/icons/bi-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c1","voiceToneLabel":"Brick to Smartphone & Past Simple","voiceCaption":"Mobile phones shrank from the 1 kg 1983 DynaTAC brick to 4G smartphones, while Past Simple uses did or didn't plus base verb.","voiceScript":"[warm] From the one-kilogram Motorola DynaTAC brick in nineteen eighty-three to pocket smartphones today! When asking questions in Past Simple, remember did and didn't already carry the past tense, so keep the main verb in base form!","title":"From Brick to Smartphone & Past Simple Rules (p.14–15)","acronym":"1G->4G • DID+V1","summary":"Tracing cellular history highlights the grammar contrast between finished past events and ongoing evolution.","bullets":["Phone Timeline (p.14): 1973 Martin Cooper prototype -> 1983 DynaTAC 'brick' (1 kg, 1 hr battery) -> 1992 first UK SMS -> 2004 Indian Ocean tsunami citizen videos -> 3G/4G.","Past Simple Trap: After 'did' / 'didn't', use BASE verb V1: 'Did you download songs yesterday?' (NEVER 'Did you downloaded')."],"labId":"bi_brick_to_smart_lab","labTitle":"Interactive 1G–5G Brick-to-Smart Explorer","labProps":{"tab":"timeline"},"examTip":"Citizen journalism via phone video first became major global news during the 2004 tsunami.","mediaKeys":["motorola_dynatac","modern_smartphone"],"hook":"In 1983, the Motorola DynaTAC 8000X weighed almost 1 kg and cost USD 3,995 just for 30 minutes of talk time!"},{"type":"mcq","voiceIdKey":"u3-s5","voiceToneLabel":"Check: 'From Brick to Smartphone' Reading","voiceCaption":"Identify the true statement from the reading comprehension task on page 15.","voiceScript":"[curious] Berdasarkan petikan From Brick to Smartphone, kenyataan manakah yang BENAR tentang sejarah mesej S M S pertama dan teknologi rangkaian tiga G?","prompt":"According to the text 'From Brick to Smartphone' (p.14–15), which statement is TRUE?","options":["DynaTAC phones in 1983 were cheap and nobody bought them.","The first mobile phone was nicknamed 'dinosaur' by Martin Cooper.","People couldn't send SMS text messages before the 1990s; smartphones emerged with 3G in the early 2000s.","Solar-powered flexible phones became compulsory in Malaysia in 2004."],"correctIndex":2,"explanation":"Page 14 notes 2G arrived in the 1990s (first UK SMS on 3 Dec 1992), while 3G in the early 2000s made smartphones real. DynaTAC was nicknamed 'the brick', not 'dinosaur'.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c2","voiceToneLabel":"Used to + Base Verb for Past Habits","voiceCaption":"Use 'used to' plus base verb for old habits that no longer happen, and drop the 'd' after didn't or did.","voiceScript":"[curious] Look at this vintage rotary dial telephone! When describing things people did in the past that no longer happen now, say used to plus base verb. In questions or negatives, drop the d to write use to!","title":"Used to + Base Verb (Past Habits & States)","acronym":"USED -> V1","mediaKey":"rotary_telephone_retro","summary":"'Used to' expresses a finished past habit or state that contrasts sharply with life today.","bullets":["Affirmative: 'Early mobile phones used to be huge.' (Followed by base verb V1, NEVER V-ing!).","Questions & Negatives: 'Did you use to send letters?' / 'People didn't use to have smartphones.' (Drop -d from used!)."],"formula":"(+) used to + V1   |   (- / ?) did / didn't + USE to + V1","examTip":"Spot 'didn't' or 'Did...'? Immediately drop the -d on 'use to'!","hook":"Watch the sneaky 'didn't' trap: 'He didn't USE to text' drops the '-d' once 'did/didn't' steals the past tense!"},{"type":"wordbank","voiceIdKey":"u3-s4","voiceToneLabel":"Build: Past Simple 'Used To' Question","voiceCaption":"Assemble a grammatically correct 'Did you use to...?' question without the extra '-d' trap.","voiceScript":"[confident] Susunkan perkataan berikut menjadi satu ayat tanya masa lampau tentang tabiat telefon era sembilan puluhan tanpa kesilapan tatabahasa.","prompt":"Arrange these blocks into a grammatically accurate Past Simple 'used to' question:","hint":"Auxiliary 'Did' + subject 'your parents' + 'use to' (NO -d!) + base verb 'carry'...","answerTokens":["Did","your parents","use to","carry heavy brick phones?"],"distractors":["used to","carrying"],"explanation":"After the auxiliary 'Did', always drop the -d and use base 'use to' followed by the base verb 'carry'.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c3","voiceToneLabel":"Be / Get Used To + Noun or V-ing","voiceCaption":"When 'be' or 'get' comes before 'used to', 'to' acts as a preposition followed by a noun or V-ing.","voiceScript":"[confident] Don't confuse 'used to' with 'be used to' or 'get used to'! Whenever be or get sits in front, you are talking about familiarity, so follow it with a noun or i-n-g verb!","title":"Be / Get Used To + V-ing / Noun (Familiarity)","acronym":"BE/GET -> -ING","mediaKey":"bi_used_to_retro","summary":"'Be used to' means already accustomed to something; 'get used to' means gradually adjusting to something new.","bullets":["Be Used To (Already normal now): 'Teenagers are used to SENDING instant texts every hour.'","Get Used To (Process of adapting): 'I still can't get used to DRIVING on the left side of the road!'"],"labId":"bi_brick_to_smart_lab","labTitle":"Used To vs Be/Get Used To Switcher","labProps":{"tab":"grammar"},"formula":"used to + V1   vs   be/get used to + V-ing / Noun","examTip":"Check the word right BEFORE 'used to': no be/get -> V1; has am/is/are/get -> V-ing!","hook":"Huge difference: 'I used to wake early' (past habit, stopped now) vs 'I am used to WAK-ING early' (normal/familiar now)!"},{"type":"predict","voiceIdKey":"u3-s2","voiceToneLabel":"Predict: Infinitive vs Gerund after Used To","voiceCaption":"Choose between 'wake/waking' and 'walk/walking' from textbook p.15 & p.20.","voiceScript":"[curious] Cuba jawab soalan Round up C dengan pantas! Lihat pada ayat pertama: 'I still cannot get used to wake atau waking up early?' dan ayat kedua: 'My father did not use to walk atau walking to work?'.","prompt":"Complete both sentences (Round-up p.20 C): (1) 'I still can't get used to ____ up early in the morning.' (2) 'My father didn't use to ____ to work, but now he does.'","scenario":"'get used to' = adapting to something (+ V-ing); 'didn't use to' = past habit (+ base verb V1).","options":["waking / walking","wake / walk","waking / walk","wake / walking"],"correctIndex":2,"proofLabId":"bi_brick_to_smart_lab","proofState":{"tab":"grammar"},"explanation":"In 'get used to', 'to' is a preposition taking V-ing -> 'waking'; in 'didn't use to', the auxiliary pattern takes base V1 -> 'walk'.","xp":20,"mediaKeys":["motorola_dynatac","modern_smartphone"]},{"type":"match","voiceIdKey":"u3-s3","voiceToneLabel":"Match: DynaTAC Article Vocabulary","voiceCaption":"Match highlighted vocabulary from 'From Brick to Smartphone' (Activity C p.15).","voiceScript":"[warm] Dalam Aktiviti C halaman lima belas, kamu perlu meneka makna perkataan yang digaris dalam artikel telefon bimbit. Padankan kesemua empat padanan ini.","prompt":"Match each word from the page 14 article with its definition in Activity C (p.15):","pairs":[{"id":"k1","left":"come up with","right":"think of, suggest (e.g. a new idea)"},{"id":"k2","left":"flexible","right":"easy to bend"},{"id":"k3","left":"crew","right":"group of people with special skills working together"},{"id":"k4","left":"store / weak","right":"keep information / not strong (signal)"}],"explanation":"All these expressions appear directly in the 1G–4G article (e.g. 'weak signals', 'camera crew', 'flexible phone', 'coming up with new ideas').","xp":15}]},{"id":"bi-u4","title":"Unit 4: Word Building (-ion/-ment) & Informal Email","subtitle":"Module 1 (p.16, 18–19) — Noun Word Building & SPM 1119 Part 1 Informal Email","iconType":"book","iconUrl":"../assets/icons/bi-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c1","voiceToneLabel":"Word Building (-ion, -ation, -ment)","voiceCaption":"Turn verbs into nouns using -ion, -ation, and -ment while watching for spelling shifts like dropping the final -e in argument.","voiceScript":"[warm] Let's build nouns from verbs accurately! Most words take i-o-n, a-t-i-o-n, or m-e-n-t, but watch out for the sneaky spelling trap: argue drops the letter e to become a-r-g-u-m-e-n-t!","title":"Word Building: Forming Nouns (-ion, -ation, -ment)","acronym":"-ION / -MENT","summary":"Mastering noun suffixes expands vocabulary for SPM Part 1 reading and directed writing.","bullets":["Common Suffixes (p.16): express -> expression | discuss -> discussion | imagine -> imagination | invite -> invitation | create -> creation | inform -> information.","Drop -e Spelling Trap: improve -> improvement (keeps -e), whereas argue -> ARGUMENT (final -e is dropped!)."],"labId":"bi_email_architect_lab","labTitle":"Email Architect & Drop -e Trap Studio","examTip":"Memorise the #1 spelling trap in Module 1: argue -> argument (NO 'e' before -ment!).","mediaKey":"bi_word_factory","hook":"Turn action verbs into sleek SPM essay nouns by snapping on '-tion', '-ation', or '-ment' endings!"},{"type":"match","voiceIdKey":"u4-s2","voiceToneLabel":"Match: Noun Suffixes (p.16)","voiceCaption":"Match each base verb with its accurate noun spelling ending in -ion, -ation, or -ment.","voiceScript":"[curious] Uji ketelitian ejaan Bahasa Inggeris kamu pada bahagian Word Building! Perhatikan perkataan 'argue' dan 'discuss' mempunyai ejaan kata nama khas.","prompt":"Match each verb on the left with the correctly spelled derived noun (p.16 B):","pairs":[{"id":"w1","left":"argue (verb)","right":"argument (drop -e + -ment)"},{"id":"w2","left":"imagine (verb)","right":"imagination (-ation)"},{"id":"w3","left":"discuss (verb)","right":"discussion (-ion)"},{"id":"w4","left":"improve / invite","right":"improvement / invitation"}],"explanation":"'argue' drops the final 'e' to form 'argument' (NEVER 'arguement'!); 'imagine' -> 'imagination'; 'invite' -> 'invitation'.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c2","voiceToneLabel":"5-Part Informal Email Blueprint (G-I-B-C)","voiceCaption":"A top-scoring SPM Part 1 informal email follows five clean blocks: Greeting, Opening, Main Part, Closing and Signing Off.","voiceScript":"[curious] How do you score full marks in SPM Part One Informal Email? Follow the five-step blueprint: Greeting, friendly Opening, Main Part covering every prompt, Closing line, and Signing Off!","title":"Informal Email Blueprint: G -> O -> Main -> C -> Sign Off","acronym":"G•O•M•C•S","mediaKey":"bi_email_blueprint","summary":"Expanding every prompt smoothly instead of copying question sentences word-for-word lifts communicative achievement scores.","bullets":["Opening & Greeting (p.19): Greeting ('Hi Mark,') -> Friendly Opening ('Sorry I haven't written for so long, how's everything?').","Body, Closing & Sign-Off: Expand ALL prompts in Main Part -> Closing ('Write back soon.') -> Sign off ('Best wishes, / Yours,')."],"examTip":"NEVER copy the prompts from the exam question verbatim—paraphrase with natural details!","hook":"SPM Email Part 1 = 20 golden marks in ~80 words! Just follow the 5 rocket layers: G -> O -> Main -> C -> Sign Off."},{"type":"sort","voiceIdKey":"u4-s3","voiceToneLabel":"Sort: Accept vs Decline Email Phrases","voiceCaption":"Sort these page 19 email expressions by purpose: Accepting / Showing Enthusiasm vs Refusing Politely.","voiceScript":"[warm] Semasa membalas e-mel kawan seperti Simon dalam latihan muka surat lapan belas, pilih frasa yang sepadan dengan nada sama ada menerima atau menolak jemputan dengan berbudi bahasa.","prompt":"Classify each informal email phrase (Activity D p.19) according to its communicative purpose.","buckets":[{"id":"accept_joy","label":"Express Enthusiasm / Accept Invitation"},{"id":"refuse","label":"Refuse an Invitation Politely"}],"items":[{"text":"Count me in! How could I say no?","bucketId":"accept_joy","note":"Accepting an invitation with genuine enthusiasm."},{"text":"Unfortunately, I'll have to let you down.","bucketId":"refuse","note":"Declining an invitation gently and politely."},{"text":"I'm afraid I can't make it because I have the flu.","bucketId":"refuse","note":"Declining an invitation while giving a clear reason."},{"text":"Wow! That's fantastic news! I'm glad to hear that.","bucketId":"accept_joy","note":"Expressing excitement over a friend's good news."},{"text":"It was nice of you to invite me, but I've made other plans.","bucketId":"refuse","note":"Thanking the sender first before explaining alternative plans."},{"text":"Sounds brilliant! I wouldn't miss it for the world!","bucketId":"accept_joy","note":"Very enthusiastic agreement (used in Mark's reply to Simon)."}],"explanation":"Using varied natural expressions boosts your Communicative Achievement mark in SPM Writing Paper 2.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c3","voiceToneLabel":"Functional Email Phrases & Style Rules","voiceCaption":"Use natural expressions for accepting or declining invitations, connect ideas with linkers and avoid extreme SMS slang.","voiceScript":"[confident] Finish your email like a native communicator! Use warm phrases such as Count me in to accept or I'm afraid I can't make it to refuse politely, link ideas with and, but or because, and avoid text slang like wanna!","title":"Email Phrases, Linkers & Style Rules (p.13 & p.19)","acronym":"NO SMS SLANG","summary":"Standard contractions like I'm and didn't sound friendly and natural, while extreme text-speak lowers language marks.","bullets":["Key Functional Phrases: Enthusiasm ('Wow! That's wonderful news!'), Accepting ('Count me in!'), Refusing ('I'm afraid I can't make it because...'), News ('Let me fill you in.').","Linkers & Contractions (p.13 & p.19): Connect ideas with and/but/so/because/or; use natural contractions (I'm, didn't), NEVER 'wanna' or 'cu l8r'."],"examTip":"Always give a polite reason after 'I'm afraid I can't make it because...' when declining an invitation.","mediaKey":"bi_email_blueprint","hook":"Never start an informal email to a friend with 'Dear Sir/Madam' — keep it warm with 'Hi [Name],' and 'Take care,'!"},{"type":"wordbank","voiceIdKey":"u4-s4","voiceToneLabel":"Build: Polite Refusal Email Paragraph","voiceCaption":"Assemble a logical email paragraph declining a weekend trip using 'because'.","voiceScript":"[confident] Susun semula pecahan ayat e-mel di bawah menjadi satu respon yang kemas, bersopan dan gramatis.","prompt":"Arrange the clauses to write a polite refusal to a weekend camping invite (Activity D1 p.19):","hint":"Thank your friend + decline gently + give reason ('because') + suggest another time.","answerTokens":["Thanks for asking me to join you,","but I'm afraid I can't make it","because I have caught the flu.","Maybe we can go some other time."],"distractors":["wanna go cu l8r","I don't care why you went."],"explanation":"This mirrors the exact p.19 structure: thanks -> soft refusal ('I'm afraid...') -> reason ('because...') -> future follow-up.","xp":20},{"type":"mcq","voiceIdKey":"u4-s5","voiceToneLabel":"Check: Informal Email Rules & Style","voiceCaption":"Spot the practice you MUST AVOID when writing an SPM informal email (Tips p.19).","voiceScript":"[curious] Mengikut kotak Tips di muka surat sembilan belas, terdapat beberapa peraturan khusus untuk skor penuh e-mel tidak rasmi. Manakah langkah yang SALAH dan mesti dielakkan?","prompt":"According to the TIPS box on page 19, which practice should be AVOIDED in an SPM informal email?","options":["Using standard contractions like 'I'm' and 'didn't'.","Using informal conversation markers like 'anyway' and 'by the way'.","Using text-speak abbreviations like 'wanna', 'u' and 'cu l8r'.","Rephrasing the prompt notes and adding relevant extra details."],"correctIndex":2,"explanation":"Textbook p.19 explicitly advises: 'Use standard grammar and spelling conventions. Avoid forms such as wanna, cu l8r, etc.'","xp":20}]},{"id":"bi-u5","title":"Unit 5: SPM 1119 Boss Challenge — Let's Chat Synthesis","subtitle":"5 Integrated Challenge Rounds: Paper 1 (Grammar/Vocab) & Paper 2 (Informal Email)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Round 1: Verbs of Communication","voiceCaption":"Distinguish communication verbs from p.16 (gossip, yell, complain, mention, fill in).","voiceScript":"[excited] Welcome to the Module One Boss Challenge! Dalam pusingan pertama, uji perbendaharaan kata komunikasi daripada halaman enam belas dan dua puluh: perkataan manakah bererti bercakap tentang hal peribadi orang lain secara tidak sopan?","prompt":"Choose the best verb pair (Round-up A p.20): (1) 'You shouldn't ____ about other people. It's rude.' (2) 'Let me fill you ____ on what happened yesterday.'","options":["discuss / up","gossip / in","yell / out","mention / off"],"correctIndex":1,"explanation":"'gossip' means talking privately/rudely about others' personal lives (p.16 A8); 'fill someone in (on something)' means updating someone with news (p.20 A8).","xp":25},{"type":"predict","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Round 2: Double Comparatives","voiceCaption":"Combine comparative -ier rules and double comparative structure in one passage.","voiceScript":"[curious] Pusingan kedua menggabungkan latihan tata bahasa komputer halaman sebelas: sekarang, menghantar mesej jauh lebih mudah daripada dulu, dan telefon pintar semakin lama semakin popular!","prompt":"Complete the tech comparison (Grammar p.11): 'Nowadays, it's much ____ (easy) to chat than in the past, and smartphones are getting ____ (popular) and more popular.'","scenario":"'easy' swaps -y for -ier; multi-syllable 'popular' repeats 'more' in double comparatives.","options":["more easy / popularer","easier / more","easiest / most","easy / the most"],"correctIndex":1,"proofLabId":"bi_comparison_slider_lab","proofState":{"mode":"double"},"explanation":"'much easier... than' and 'getting more and more popular' accurately follow short vs 3-syllable adjective comparison rules.","xp":25},{"type":"mcq","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Round 3: Spot the Grammar Error","voiceCaption":"Identify which sentence misuses 'used to' vs 'be used to' in a teen tech context.","voiceScript":"[confident] Pusingan ketiga berformat semakan kesalahan tatabahasa! Ayat manakah di bawah ini SALAH tatabahasanya dan perlukan pembetulan?","prompt":"Which of the four sentences below contains a GRAMMAR ERROR?","options":["Nowadays, teenagers are used to sending text messages instead of calling.","Linda isn't used to living alone, so she feels lonely sometimes.","A few years ago, Larry was used to work for an ICT company.","Monica came across some old pictures while tidying her desk."],"correctIndex":2,"explanation":"To describe a past job/habit ('A few years ago'), write 'used to work' (NO 'was'). 'was used to work' also fails because 'be used to' must take V-ing or a noun.","xp":25},{"type":"wordbank","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Round 4: Word-Building & Linking","voiceCaption":"Build an accurate sentence combining the noun 'discussion' with the linker 'so'.","voiceScript":"[curious] Pusingan keempat! Susunkan ayat tentang mesyuarat perancangan pementasan sekolah menggunakan kata nama terbitan 'discussion' daripada halaman enam belas.","prompt":"Arrange the blocks into a complete sentence using the correct noun form:","hint":"Subject + 'had a' + noun 'discussion' + linker 'so' + result.","answerTokens":["The teachers had a long discussion","about the school play,","so they organised","an online ticket page."],"distractors":["a long discuss","because they organised"],"explanation":"Per p.16 B7, after 'had a...' use the noun 'discussion' (not verb 'discuss'), followed by 'so' to show result.","xp":25},{"type":"mcq","voiceIdKey":"u5-s5","voiceToneLabel":"Boss Final: Social Responses (Round-up E)","voiceCaption":"Choose the most natural everyday spoken response from Round-up E (p.20).","voiceScript":"[excited] Pusingan terakhir Boss Challenge! Rakan kamu berkata: 'Saya akan melawat Sam hujung minggu depan.' Pilih tindak balas paling semula jadi dalam perbualan bahasa Inggeris.","prompt":"Choose the most natural response pair (Round-up p.20 E): (1) 'I'm visiting Sam next weekend.' (2) 'Are you coming to my football match on Saturday?'","options":["(1) What's your phone number? / (2) Is he in trouble again?","(1) Really? Give my regards to him. / (2) Absolutely, I wouldn't miss it for the world!","(1) That's too bad. / (2) I'll come up with something.","(1) You can bring him along. / (2) I haven't received a reply."],"correctIndex":1,"explanation":"'Give my regards to him' sends warm greetings; 'I wouldn't miss it for the world!' shows enthusiastic commitment to attend!","xp":30}]}]};</script>
