  function makeGalleryPlate(key, m, isHigh) {
    if (!m || !m.dataUri) return "";
    var prio = isHigh ? ' fetchpriority="high"' : ' loading="lazy"';
    return '<button type="button" class="archival-plate-btn" data-media-key="' + key + '">' +
      '<img class="archival-plate-img" src="' + m.dataUri + '" width="' + m.width + '" height="' + m.height + '" alt="' + m.label + '"' + prio + '>' +
      '<div class="archival-plate-meta">' +
        '<span class="archival-era-badge">' + m.era + '</span>' +
        '<strong>' + m.label + '</strong>' +
        '<span class="archival-credit-line">' + (m.credit || "") + ' • Click to zoom</span>' +
      '</div></button>';
  }

  /* 1. Animated Time-Track SVG & Stative Shield Arcade (p.9 & p.20) */
  window.ETUTOR_NOTA_LABS.bi_tenses_timeline_lab = function (shell, ctx) {
    var ps = ctx.labProps || ctx.proofState || {};
    var contexts = {
      habit: { short: "HABIT (Simple)", code: "V1 / V-s", tag: "every day / timetables", ex: "Tanya uses SN sites every day.", color: "#2563eb", cx: 145 },
      now: { short: "NOW (Continuous)", code: "am/is/are + V-ing", tag: "at the moment / temp", ex: "He is staying with us now.", color: "#059669", cx: 280 },
      annoying: { short: "ANNOYING Always", code: "is + ALWAYS + V-ing", tag: "complaints / habits", ex: "She is ALWAYS talking on the phone!", color: "#d97706", cx: 395 },
      stative: { short: "STATIVE Shield", code: "NO -ing (Brain/Heart)", tag: "think, want, know, need", ex: "I need help (NOT: needing!)", color: "#dc2626", cx: 485 }
    };
    var traps = [
      { s: "I am knowing the answer!", ok: false, fix: "I know (Stative verb!)" },
      { s: "Look! It is raining outside.", ok: true, fix: "Dynamic action happening NOW!" },
      { s: "She is always losing her keys!", ok: true, fix: "Annoying repetition = always + V-ing!" }
    ];
    var sel = (ps.ctxKey && contexts[ps.ctxKey]) ? ps.ctxKey : "habit";
    var mode = "explore";
    var tIdx = 0;
    var tScore = 0;
    var tRes = null;
    var tBonusDone = false;

    function buildTimelineSvg(cur) {
      var trackDeco = "";
      if (sel === "habit") {
        trackDeco = '<circle class="js-pulse-dot" cx="145" cy="86" r="18" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5 3"/>' +
          '<text x="145" y="138" text-anchor="middle" font-size="11" font-weight="800" fill="#1e40af">REPEAT LOOP: Always True</text>';
      } else if (sel === "now") {
        trackDeco = '<rect class="js-pulse-dot" x="218" y="62" width="124" height="48" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>' +
          '<text x="280" y="138" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">SPOTLIGHT: Right At This Moment</text>';
      } else if (sel === "annoying") {
        trackDeco = '<polygon class="js-wobble" points="395,56 418,104 372,104" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>' +
          '<text x="395" y="96" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">!</text>' +
          '<text x="395" y="138" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">ALWAYS + V-ing = Complaint Alert</text>';
      } else {
        trackDeco = '<path class="js-wobble" d="M 455 62 L 515 62 L 515 96 L 485 114 L 455 96 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>' +
          '<text x="485" y="90" text-anchor="middle" font-size="11" font-weight="800" fill="#dc2626">NO -ing</text>' +
          '<text x="440" y="138" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">SHIELD BLOCKS -ing on Stative Verbs</text>';
      }

      return '<svg viewBox="0 0 560 175" aria-label="Garis Masa Visual Present Tenses">' +
        '<rect x="10" y="8" width="540" height="159" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>' +
        '<rect x="24" y="16" width="512" height="24" rx="10" fill="' + cur.color + '"/>' +
        '<text x="280" y="32" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">' + cur.code + '  •  ' + cur.tag + '</text>' +
        '<line x1="48" y1="86" x2="512" y2="86" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>' +
        '<text x="68" y="74" text-anchor="middle" font-size="9.5" font-weight="800" fill="#64748b">PAST</text>' +
        '<text x="280" y="54" text-anchor="middle" font-size="10" font-weight="800" fill="#0f172a">NOW</text>' +
        '<text x="500" y="74" text-anchor="middle" font-size="9.5" font-weight="800" fill="#64748b">FUTURE</text>' +
        trackDeco +
        '<circle class="js-time-beacon" cx="' + cur.cx + '" cy="86" r="10" fill="' + cur.color + '" stroke="#ffffff" stroke-width="2.5"/>' +
        '<text x="280" y="158" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">"' + cur.ex + '"</text>' +
      '</svg>';
    }

    function render() {
      var topBar =
        '<div class="lab-arcade-bar">' +
          '<div class="lab-controls">' +
            '<button type="button" class="lab-seg-btn" data-m="explore" aria-pressed="' + (mode === "explore") + '">Animated Timeline</button>' +

          '</div>' +
          '<span class="lab-arcade-score tabular-nums">Zap Score: ' + tScore + '/3</span>' +
        '</div>';

      if (mode === "zap") {
        var tr = traps[tIdx];

var CHAPTER = window.__ETUTOR_NOTA_CHAPTER__ || { id: "demo", subject: "SPM", form: 4, chapterNumber: 1, title: "Nota Interaktif", units: [] };

function isEnglishNota() {
  return Boolean(CHAPTER && /inggeris|english/i.test(String(CHAPTER.subject || "")));
}

function tUi(msText, enText) {
  return isEnglishNota() ? enText : msText;
}

var notaState = {
  mode: "map",
  activeUnitIdx: 0,
  activeStepIdx: 0,
  hearts: 5,
  maxHearts: 5,
  xp: 0,
  unitXpEarned: 0,
  combo: 0,
  maxCombo: 0,
  unitCorrect: 0,
  unitTotal: 0,
  completedUnits: {},
  muted: false,
  voiceAutoplay: true,
  answeredCurrent: false,
  activeLabCleanups: []
};

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* Procedural Web Audio Synthesizer — Zero external MP3s, iframe-sandbox safe */
var NotaAudio = (function () {
  var ctx = null;
  function getCtx() {
    if (notaState.muted || typeof window === "undefined") return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") {
      try { ctx.resume(); } catch (e2) {}
    }
    return ctx;
  }
  function tone(freq, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);

  var noiseBuf = null;
  function noiseBurst(dur, filterFreq, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      var len = Math.floor(c.sampleRate * 0.5);
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    var t0 = c.currentTime + (delay || 0);
    var src = c.createBufferSource();
    src.buffer = noiseBuf;
    var filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(filterFreq || 1200, t0);
    filter.Q.setValueAtTime(1.1, t0);
    var gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.09, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }
  function sweepTone(fStart, fEnd, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(fStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

    playSnap: function () {
      tone(620, 0.045, "triangle", 0.1, 0);
      tone(930, 0.08, "sine", 0.11, 0.03);
    },
    playLaserZap: function () {

      tone(210, 0.12, "triangle", 0.06, 0.06);
    },
    playMatch: function () { tone(659.25, 0.1, "sine", 0.11, 0); tone(880, 0.13, "sine", 0.11, 0.06); },
    playCorrect: function (combo) {

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");

  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {

        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;

        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");

        skipBtn.addEventListener("click", function () {

        });

      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {

        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +

      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

function showCelebration() {

  notaState.completedUnits[unit.id] = { stars: bestStars, accuracy: acc, xp: notaState.unitXpEarned };
  saveNotaState();
  NotaAudio.playFanfare();

  }

  function playClip(clipKey, isManual) {
    var url = getPackUrl(clipKey);
    if (!url) return;
    lastKey = clipKey;
    stop();

    if (notaState.muted && !isManual) {
      syncUi();
      return;
    }
    if (notaState.muted && isManual) {
      notaState.muted = false;
      saveNotaState();
      if (typeof renderTopHud === "function") renderTopHud();
    }

    var el = preloadMap[clipKey] || new Audio(url);
    try { el.currentTime = 0; } catch (e0) {}
    audioEl = el;
    isPlaying = true;
    syncUi();

    el.onended = function () {
      if (audioEl !== el) return;
      audioEl = null;
      isPlaying = false;
      syncUi();
    };
    el.onerror = function () {
      if (audioEl !== el) return;
      audioEl = null;
      isPlaying = false;
      syncUi();
    };

    try {
      var p = el.play();
      if (p && typeof p.catch === "function") {
        p.catch(function () {
          if (audioEl === el) {
            audioEl = null;
            isPlaying = false;
            syncUi();
          }
        });
      }
    } catch (err) {
      audioEl = null;
      isPlaying = false;
      syncUi();
    }
  }

  function scheduleClip(clipKey, delayMs) {
    if (!clipKey) return;
    lastKey = clipKey;
    if (pendingTimer) {
      clearTimeout(pendingTimer);
      pendingTimer = null;
    }
    if (notaState.muted || !getPackUrl(clipKey)) {
      syncUi();
      return;
    }
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      playClip(clipKey, false);
    }, delayMs || 150);
  }

  function autoplayStep(unit, step, nextStep) {
    if (!step || !step.voiceIdKey) return;
    if (nextStep && nextStep.voiceIdKey) preloadClip(nextStep.voiceIdKey);
    scheduleClip(step.voiceIdKey, 150);
  }

  function autoplayReaction(isCorrect, combo) {
    var key = isCorrect ? (combo >= 3 ? "reaction-combo" : "reaction-correct") : "reaction-encourage";
    scheduleClip(key, 240);
  }

  function autoplayCelebration() {
    scheduleClip("reaction-celebrate", 320);
  }

  function handleSingleButtonClick() {
    if (isPlaying) {
      stop();
      return;
    }
    if (lastKey) {
      playClip(lastKey, true);
    }
  }

  function onMuteChanged() {
    if (notaState.muted) stop();
    else syncUi();
  }

  function renderSingleButtonHtml() {
    var lbl = isPlaying ? "Hentikan suara penerangan" : "Dengar suara penerangan Cikgu AI";
    return (
      '<button type="button" id="voiceSingleBtn" class="voice-duolingo-btn" aria-pressed="' + (isPlaying ? "true" : "false") + '" aria-label="' + lbl + '" title="' + lbl + '">' +
        (isPlaying ? EQ_BARS_HTML : SPEAKER_SVG) +
      "</button>"
    );
  }

  function wireBarControls(hostEl) {
    if (!hostEl) return;
    var btn = hostEl.querySelector("#voiceSingleBtn");
    if (btn) btn.addEventListener("click", handleSingleButtonClick);
  }

  return {
    stripVoiceTags: stripVoiceTags,
    getCleanStepText: getCleanStepText,
    getCleanReactionText: getCleanReactionText,
    autoplayStep: autoplayStep,
    autoplayReaction: autoplayReaction,
    autoplayCelebration: autoplayCelebration,
    onMuteChanged: onMuteChanged,
    renderSingleButtonHtml: renderSingleButtonHtml,
    wireBarControls: wireBarControls,
    stop: stop
  };
})();

if (typeof window !== "undefined") {
  if (typeof NotaAudio !== "undefined") window.NotaAudio = NotaAudio;
  if (typeof NotaFeel !== "undefined") window.NotaFeel = NotaFeel;
  window.NotaVoice = NotaVoice;
}
})();</script>
</body>
</html>
