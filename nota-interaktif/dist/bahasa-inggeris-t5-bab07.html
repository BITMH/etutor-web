/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-inggeris-t5-bab07","subject":"Bahasa Inggeris","subjectGroup":"teras","form":5,"chapterNumber":7,"title":"The Media","subtitle":"Unit 7 KSSM Form 5: Media Professions, Active-to-Passive Voice, Agents vs Instruments & Impersonal Passives","estimatedMinutes":24,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#0284c7","coverIcon":"../assets/icons/bi57-u1.jpg","voiceReactions":{"correct":"[warmly] Headline-worthy accuracy. You matched the passive tense, agent preposition, and media role cleanly.","combo":"[excited] Broadcast streak! Your control over passive gerunds, get-passives, and impersonal structures is sharp.","encourage":"[gentle] Check whether the noun after the verb is a human agent ('by') or a physical tool ('with') before trying again.","celebrate":"[cheerful] Unit 7 wrapped! You are ready to decode news reports and passive transformations across SPM."},"units":[{"id":"unit-1","number":1,"title":"Media Roles, Broadcast Genres & Prepositions","subtitle":"Distinguishing journalist, correspondent, columnist, editor, newsreader, and media nouns","iconUrl":"../assets/icons/bi57-u1.jpg","steps":[{"id":"u1-s1","type":"concept","title":"Who Shapes News, Opinions & Entertainment?","summary":"Unit 7 contrasts distinct media roles across print, radio, television, and digital platforms, alongside key nouns like commercials, soap operas, and reviews.","bullets":["Correspondent reports live from overseas or specialist locations; sports columnist writes recurring analytical opinion columns; editor selects and refines articles before publication.","Newsreader reads studio news bulletins aloud; presenter hosts live studio shows or documentaries; DJ curates music broadcasts.","Key media prepositions & nouns: 'decrease in' print readership, 'commercials' (paid broadcast ads), 'reviews' (critical evaluations), and 'soap operas' (continuing TV dramas)."],"formula":"Field Report = correspondent | Recurring Opinion = columnist | Final Selection = editor","examTip":"In SPM Paper 1 Part 1 and Part 2, watch fixed prepositions after trend nouns: 'decrease in', 'rise in', 'drop in' (not 'of' before the topic measured).","mediaKey":"bi57_media_roles_lexis","caption":"Visual guide separating newsroom journalists, broadcast presenters, columnists, and media collocations.","alt":"Diagram distinguishing media professions, broadcast genres, and newsroom prepositions","voiceIdKey":"u1-s1","voiceToneLabel":"Warm Coach","voiceCaption":"Separate field correspondents, studio newsreaders, and editors by their daily duties.","voiceScript":"[warmly] Welcome to Unit 7, The Media. [pause] Newsrooms rely on very specific job titles: a foreign correspondent files reports from abroad, an editor clears stories for print, and a sports columnist shares recurring analysis. Also keep an eye on trend nouns paired with 'in', such as a 'decrease in' print subscribers.","xp":15},{"id":"u1-s2","type":"match","prompt":"Match each Unit 7 media profession to its exact responsibility.","pairs":[{"id":"m1","left":"correspondent","right":"Journalist reporting regularly from a distant region or specialist beat"},{"id":"m2","left":"editor","right":"Senior decision-maker who revises copy and approves final layout"},{"id":"m3","left":"sports columnist","right":"Writer publishing recurring opinion articles on athletics and leagues"},{"id":"m4","left":"newsreader","right":"Studio broadcaster delivering prepared news scripts on air"}],"explanation":"Knowing exact media job boundaries prevents confusing 'correspondent' with 'newsreader' in listening and reading items.","voiceIdKey":"u1-s2","voiceToneLabel":"Warm Coach","voiceCaption":"Pair each media title with the exact job it performs.","voiceScript":"[curious] Match each media profession on the left with what that person actually does inside a newsroom or studio.","xp":15},{"id":"u1-s3","type":"predict","prompt":"Complete the headline accurately: 'Survey reveals a sharp ______ newspaper subscriptions among teenagers this year.'","options":["decrease in","decrease at","decrease into","decrease by"],"correctIndex":0,"explanation":"Nouns of change like 'decrease', 'increase', and 'drop' take the preposition 'in' before the affected category.","voiceIdKey":"u1-s3","voiceToneLabel":"Exam Mentor","voiceCaption":"Select the correct preposition following the noun 'decrease'.","voiceScript":"[informative] When 'decrease' functions as a noun followed by what declined, which preposition links them naturally?","xp":15},{"id":"u1-s4","type":"mcq","prompt":"Which sentence uses Unit 7 media terms accurately?","options":["Viewers skipped the mid-show commercials after reading enthusiastic online reviews of the documentary.","The sports columnist read out tonight's breaking traffic news bulletin on television.","Our foreign soap opera filed an urgent live report from Tokyo.","Every film blogger prints paid radio commercials inside newspaper editorials."],"correctIndex":0,"explanation":"Commercials are broadcast ads and reviews are critical evaluations, whereas Option B confuses columnist with newsreader and Option C confuses soap opera with correspondent.","voiceIdKey":"u1-s4","voiceToneLabel":"Warm Coach","voiceCaption":"Choose the single sentence using media nouns and roles naturally.","voiceScript":"[warmly] Scan all four options to find the one sentence that keeps commercials, reviews, and media roles completely accurate.","xp":15}],"boss":false},{"id":"unit-2","number":2,"title":"Passive Voice Across Tenses & Get-Passive","subtitle":"Converting tenses, passive gerunds/infinitives, 'get' passive, and 'by + agent' vs 'with + instrument'","iconUrl":"../assets/icons/bi57-u2.jpg","steps":[{"id":"u2-s1","type":"concept","title":"Mastering Passive Forms, Agents & Tools","summary":"Unit 7 extends the passive voice beyond basic tenses to gerunds ('being + V3'), infinitives ('to be + V3'), informal 'get' passives, and the crucial 'by' vs 'with' distinction.","bullets":["Passive Gerund: 'The editor dislikes being interrupted.' | Passive Infinitive: 'The article needs to be proofread.'","'Get' Passive ('get + V3') highlights sudden or accidental events ('His camera got smashed during the protest').","Agent vs Instrument: use 'by' for the person/cause performing the action ('filmed by a drone operator'), but 'with' for the tool or object used ('edited with open-source software').","Tenses with NO standard passive: Future Continuous, Present Perfect Continuous, and Past Perfect Continuous."],"formula":"be / get + V3 | Person/Doer = by + agent | Tool/Material = with + instrument","examTip":"In Paper 1 Part 2 cloze items, look right after the passive verb: a camera, lens, hammer, or pen requires 'with', not 'by'.","mediaKey":"bi57_passive_tenses_agents","caption":"Reference chart for passive gerunds, infinitives, 'get' passives, and 'by' vs 'with' distinction.","alt":"Diagram showing passive structures, get-passive usage, and by versus with prepositions","voiceIdKey":"u2-s1","voiceToneLabel":"Grammar Coach","voiceCaption":"Use 'by' for the doer of an action and 'with' for the tool or instrument used.","voiceScript":"[informative] Passive voice in Unit 7 goes deeper than simple 'was written'. [pause] Watch two high-value details: first, use 'being + V3' after verbs like dislike or enjoy, and 'to be + V3' after need or expect. Second, never confuse 'by' and 'with'—a lens is smashed 'by' a thief 'with' a stone!","xp":15},{"id":"u2-s2","type":"wordbank","prompt":"Arrange the tokens to form a passive sentence using a passive gerund after 'avoids'.","answerTokens":["The","correspondent","avoids","being","misquoted","by","rival","tabloids"],"distractors":["be","to be","misquoting"],"explanation":"'Avoid' takes a gerund (-ing form); made passive, that becomes 'being + V3' ('being misquoted').","voiceIdKey":"u2-s2","voiceToneLabel":"Grammar Coach","voiceCaption":"Build the passive gerund sentence following the verb 'avoids'.","voiceScript":"[warmly] After 'avoids', English needs a gerund—so combine 'being' with the past participle to form the passive!","xp":15},{"id":"u2-s3","type":"concept","title":"Interactive Newsroom Passive Transformer","summary":"Transform live newsroom headlines across Present Continuous, Past Simple, Passive Gerund, and 'by' vs 'with' structures inside the lab.","bullets":["Observe how active tense shifts directly determine the 'be' auxiliary in passive transformations.","Verify why Future Continuous and Perfect Continuous forms have no passive equivalent."],"formula":"Active Tense -> Matching 'be' Form + V3 (+ by agent / with tool)","examTip":"Keep the original time frame intact: 'is filming' becomes 'is being filmed', never 'was filmed'.","labId":"bi57_media_passive_lab","labTitle":"Newsroom Passive Transformer Lab","labHeight":320,"voiceIdKey":"u2-s3","voiceToneLabel":"Grammar Coach","voiceCaption":"Use the Passive Transformer Lab to switch news headlines between active and passive forms.","voiceScript":"[curious] Test each newsroom headline inside the Passive Lab below to check how continuous auxiliaries, gerunds, and 'with' tools behave.","xp":15},{"id":"u2-s4","type":"mcq","prompt":"Pick the correct preposition to finish the news report: 'The live satellite dish was repaired quickly ______ a spare copper cable.'","options":["with","by","from","at"],"correctIndex":0,"explanation":"A spare copper cable is the physical tool/material used to perform the repair (instrument), so 'with' is required rather than agent 'by'.","voiceIdKey":"u2-s4","voiceToneLabel":"Exam Mentor","voiceCaption":"Choose between agent 'by' and tool 'with' for the satellite dish repair.","voiceScript":"[informative] Did the copper cable repair the dish by itself, or did a technician use it as a tool? Pick the exact preposition.","xp":15}],"boss":false},{"id":"unit-3","number":3,"title":"Impersonal & Personal Passive Structures","subtitle":"Reporting public beliefs formally with 'It is said that...' and 'X is thought to...'","iconUrl":"../assets/icons/bi57-u3.jpg","steps":[{"id":"u3-s1","type":"concept","title":"Two Formal Ways to Report Public Opinion","summary":"Journalists and essay writers use Impersonal and Personal Passive structures with verbs like think, believe, say, know, and report to sound objective without naming one source.","bullets":["Impersonal Passive: 'It is thought that online ads influence young buyers.' (Structure: It + passive reporting verb + that-clause).","Personal Passive (Present/General): 'Online ads are thought to influence young buyers.' (Structure: Subject + passive reporting verb + to + V1).","Personal Passive (Past Action): 'The leaked clip is believed to have spread overnight.' (Structure: Subject + passive reporting verb + to have + V3)."],"formula":"Impersonal: It is [V3] that... | Personal: [Subj] is/are [V3] to V1 / to have V3","examTip":"Personal passives eliminate 'that'! Never write 'He is believed that to know'—drop 'that' completely and jump straight to 'to + verb'.","mediaKey":"bi57_impersonal_personal_passive","caption":"Step-by-step conversion from active reporting ('People think that...') to Impersonal and Personal Passive forms.","alt":"Flowchart comparing active reporting, impersonal passive, and personal passive constructions","voiceIdKey":"u3-s1","voiceToneLabel":"Writing Coach","voiceCaption":"Convert 'People say that...' into formal 'It is said that...' or 'X is said to...' reports.","voiceScript":"[informative] Impersonal and personal passives immediately elevate SPM report and essay marks. [pause] Start with 'It is believed that' for an impersonal statement, OR bring the topic to the front: 'Social media is believed to shape public opinion.' If the event already happened earlier, shift the infinitive to 'to have + V3'.","xp":15},{"id":"u3-s2","type":"sort","prompt":"Classify each sentence as Active Reporting, Impersonal Passive, or Personal Passive.","buckets":[{"id":"imp","label":"Impersonal Passive (It is + V3 + that...)"},{"id":"pers","label":"Personal Passive (Subject + be + V3 + to...)"}],"items":[{"text":"It is reported that print circulation fell again.","bucketId":"imp","note":"Dummy subject 'It' + passive verb + that-clause"},{"text":"Print circulation is reported to have fallen again.","bucketId":"pers","note":"Fronted subject + perfect infinitive 'to have fallen'"},{"text":"Radio podcasts are known to attract commuters.","bucketId":"pers","note":"Fronted plural subject + 'are known to attract'"},{"text":"It is widely believed that reviews guide buyers.","bucketId":"imp","note":"Dummy subject 'It' + passive verb + that-clause"}],"explanation":"Spotting the 'It ... that' frame versus 'Subject ... to V1 / to have V3' avoids blending the two patterns erroneously.","voiceIdKey":"u3-s2","voiceToneLabel":"Grammar Coach","voiceCaption":"Sort these formal media statements into Impersonal or Personal Passive.","voiceScript":"[warmly] Separate these four polished news statements into Impersonal 'It is... that' clauses and Personal fronted infinitive sentences.","xp":15},{"id":"u3-s3","type":"concept","title":"Interactive Impersonal & Personal Passive Converter","summary":"Toggle reporting clauses between Impersonal ('It is reported that...') and Personal ('Broadcast ratings are reported to...') including past perfect infinitives.","bullets":["Check agreement: singular vs plural subjects change 'is' to 'are' in Personal Passive.","Verify when 'to V1' shifts to 'to have V3' for past actions."],"formula":"Plural Subject -> are believed to... | Earlier Event -> to have + V3","examTip":"Watch subject-verb agreement when pulling a plural noun forward: 'It is said that podcasts are growing' -> 'Podcasts ARE said to be growing'.","labId":"bi57_impersonal_passive_lab","labTitle":"Impersonal & Personal Passive Converter","labHeight":320,"voiceIdKey":"u3-s3","voiceToneLabel":"Writing Coach","voiceCaption":"Practise switching between It-clauses and fronted Personal Passive sentences in the lab.","voiceScript":"[curious] Try flipping between active press rumours, impersonal 'It is said that' lines, and fronted personal passives inside the converter lab.","xp":15},{"id":"u3-s4","type":"mcq","prompt":"Choose the accurate Personal Passive rewrite of 'Analysts believe that the streamer lost one million subscribers last quarter.'","options":["The streamer is believed to have lost one million subscribers last quarter.","The streamer is believed to lose one million subscribers last quarter.","The streamer is believed that it lost one million subscribers last quarter.","It is believed the streamer to have lost one million subscribers."],"correctIndex":0,"explanation":"Because 'lost' occurred in the past ('last quarter'), Personal Passive uses the perfect infinitive 'to have lost' with zero 'that'.","voiceIdKey":"u3-s4","voiceToneLabel":"Exam Mentor","voiceCaption":"Select the Personal Passive rewrite preserving the past time reference.","voiceScript":"[informative] Watch 'last quarter' carefully! When the loss happened earlier in the past, how must the infinitive change after 'is believed'?","xp":15}],"boss":false},{"id":"unit-4","number":4,"title":"Critical Reviews & Media Literacy Essays","subtitle":"Evaluating reliability, distinguishing facts from sponsored opinion, and balanced review paragraphs","iconUrl":"../assets/icons/bi57-u4.jpg","steps":[{"id":"u4-s1","type":"concept","title":"Writing Balanced Reviews & Fact-Checking Arguments","summary":"Whether reviewing a documentary in Paper 2 Part 3 or discussing social-media credibility in an essay, high-band writing justifies judgements with specific evidence rather than empty praise.","bullets":["Media literacy checks: cross-verify startling headlines against two independent correspondents, inspect publication dates, and spot sponsored commercials disguised as reviews.","Review structure: brief context (title/genre without spoiling endings), two concrete strengths (cinematography, balanced interviews), one constructive flaw, and target-audience recommendation.","Objective passive phrasing ('Viewers are shown...', 'False claims are often amplified...') keeps analysis authoritative."],"formula":"Summary (No Spoilers) -> Specific Strengths -> Constructive Limitation -> Audience Verdict","examTip":"In a review, never summarise the whole plot from start to finish; dedicate two-thirds of your words to evaluating quality and recommending who will enjoy it.","voiceIdKey":"u4-s1","voiceToneLabel":"Writing Coach","voiceCaption":"Evaluate films and documentaries with specific strengths, mild flaws, and audience recommendations.","voiceScript":"[warmly] When writing a review or media-literacy essay, avoid empty lines like 'it was very nice'. [enthusiastic] Name exact strengths—such as sharp investigative reporting—add one balanced critique, and tell readers clearly who should watch or read it.","xp":15},{"id":"u4-s2","type":"predict","prompt":"A viral post shares a dramatic photo with no journalist name, no publication date, and urgent text demanding 'SHARE BEFORE DELETED!' What is the smartest media-literacy response?","options":["Verify the image source and check reputable news outlets before sharing it","Forward it immediately so friends know about it before newsrooms do","Assume it is factual simply because thousands of accounts liked it","Ignore dates and rely solely on anonymous comment threads"],"correctIndex":0,"explanation":"Fact-checking anonymous viral posts against verifiable journalism prevents spreading misinformation.","voiceIdKey":"u4-s2","voiceToneLabel":"Exam Mentor","voiceCaption":"Predict the responsible media-literacy check for an unverified viral clip.","voiceScript":"[curious] An anonymous post urges you to share immediately without a source or date. What should a digitally literate student do first?","xp":15},{"id":"u4-s3","type":"wordbank","prompt":"Arrange the tokens to form a polished closing recommendation for a documentary review.","answerTokens":["I","would","highly","recommend","this","documentary","to","anyone","interested","in","journalism"],"distractors":["suggesting","for","highly recommended"],"explanation":"'Recommend + noun + to + audience' is the clean, natural review recommendation pattern (never 'recommend you to watch').","voiceIdKey":"u4-s3","voiceToneLabel":"Writing Coach","voiceCaption":"Construct an accurate final recommendation line for a film review.","voiceScript":"[warmly] Build a crisp final review recommendation using 'recommend [something] to [someone]' cleanly.","xp":15},{"id":"u4-s4","type":"mcq","prompt":"Which sentence demonstrates strongest analytical balance inside a documentary review?","options":["Although the pacing slows slightly in the middle interviews, the crisp cinematography and balanced reporting make it compelling viewing.","The documentary lasted ninety minutes and showed three towns, two farms, and one school building.","Everything was totally awesome and anyone who disagrees does not understand media at all.","I recommend you watch it tomorrow night at 8 p.m. because I liked the music."],"correctIndex":0,"explanation":"Option A uses concession ('Although...') to pair a fair minor criticism with clear evaluative strengths.","voiceIdKey":"u4-s4","voiceToneLabel":"Writing Coach","voiceCaption":"Select the review line that pairs constructive critique with reasoned praise.","voiceScript":"[warmly] Which option balances a gentle limitation with well-chosen praise instead of merely listing plot facts?","xp":15}],"boss":false},{"id":"unit-5","number":5,"title":"Boss Challenge: Media & Passive Mastery","subtitle":"Integrate media lexis, active-passive tense shifts, instruments, and impersonal/personal passives","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","prompt":"Solve both blanks accurately: 'The live footage ______ with a handheld smartphone before it ______ to have reached half a million viewers.'","options":["was captured ... was reported","captured ... reported","was captured ... was reported that","got capturing ... is reported"],"correctIndex":0,"explanation":"Past passive ('was captured with a handheld smartphone') combines tool 'with' with Personal Passive ('was reported to have reached').","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Mentor","voiceCaption":"Crack the Boss double-gap combining passive tool phrasing and Personal Passive.","voiceScript":"[dramatic] Final Boss segment! Notice 'with a handheld smartphone' and 'to have reached'—only one passive pair links both seamlessly.","xp":25},{"id":"u5-s2","type":"match","prompt":"Match each Unit 7 grammar structure to its accurate example.","pairs":[{"id":"b1","left":"Passive Gerund","right":"Celebrities hate being chased by paparazzi."},{"id":"b2","left":"Get-Passive (accidental event)","right":"The studio microphone got damaged in transit."},{"id":"b3","left":"Instrument ('with + tool')","right":"The headline was edited with bold red ink."},{"id":"b4","left":"Impersonal Passive","right":"It is thought that live streams will expand."}],"explanation":"Distinguishing all four passive variants gives full control over SPM Paper 1 & 2 syntax.","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Mentor","voiceCaption":"Match each Unit 7 passive rule to its clean example sentence.","voiceScript":"[warmly] Pair all four passive patterns with their exact model examples.","xp":25},{"id":"u5-s3","type":"wordbank","prompt":"Arrange the tokens to form a grammatically spotless Personal Passive sentence referring to a past event.","answerTokens":["The","editor","is","known","to","have","rejected","the","unverified","story"],"distractors":["that","rejecting","been"],"explanation":"Fronted subject + 'is known' + perfect infinitive 'to have rejected' reports a past decision formally without 'that'.","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Mentor","voiceCaption":"Assemble the Personal Passive sentence with a perfect infinitive.","voiceScript":"[informative] Build this headline-grade Personal Passive sentence using 'to have rejected' with no 'that'!","xp":25},{"id":"u5-s4","type":"mcq","prompt":"Final Boss Check: Which sentence is 100% accurate across passive voice, prepositions, and media vocabulary?","options":["Despite a decrease in print ads, investigative correspondents are widely believed to hold strong public trust.","Despite a decrease of print ads, the correspondent was filmed with the camera crew yesterday.","It is reported the editor to have resigned after his desk got smash by a brick.","Presenters usually dislike to being interrupted by live soap opera commercials."],"correctIndex":0,"explanation":"Option A accurately uses 'decrease in' + 'correspondents' + Personal Passive ('are widely believed to hold'). Options B, C, and D misuse 'decrease of / with [person]', blend 'It is reported... to have', and double-mark 'to being'.","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Mentor","voiceCaption":"Claim the Unit 7 badge by selecting the single error-free media sentence.","voiceScript":"[excited] Last Boss question for Unit 7! Spot the single sentence free from preposition errors, mixed passives, and infinitive traps.","xp":25}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {

(function () {
  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function el(tag, text) {
    const node = document.createElement(tag);

  // 1. Passive Voice Tenses, Gerunds, Infinitives & By vs With Lab
  window.ETUTOR_NOTA_LABS.bi57_media_passive_lab = function (mount, ctx) {
    mount.innerHTML = "";
    const wrap = el("div");
    wrap.style.cssText =
      "padding:14px;border-radius:16px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#f8fafc;border:1px solid rgba(56,189,248,0.28);font-family:system-ui,sans-serif;";

    const head = el("div", "Lab 7.1: Media Passive Lab (Gerunds, Infinitives & By/With)");
    head.style.cssText = "font-weight:800;font-size:15px;color:#38bdf8;margin-bottom:8px;";
    wrap.appendChild(head);

    const tabs = [
      { btn: "Gerund Passive", act: "He has stopped publishing my columns.", pas: "My columns have stopped BEING PUBLISHED." },
      { btn: "Full Infinitive Passive", act: "Journalists want their editor to send them abroad.", pas: "Journalists want TO BE SENT abroad by their editor." },
      { btn: "by (Agent) vs with (Tool)", act: "Someone smashed the studio camera using a brick.", pas: "The camera was smashed WITH a brick BY an unknown vandal." },
      { btn: "'Get' Passive (Unexpected)", act: "Someone stole the reporter's laptop at the cafe.", pas: "The reporter's laptop GOT STOLEN at the cafe." },
    ];

    let idx = 0;
    const row = el("div");
    row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;";
    const btns = [];
    const out = el("div");

    tabs.forEach((t, i) => {
      const b = el("button", t.btn);
      b.type = "button";
      b.style.cssText =
        "min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid #475569;color:#f8fafc;font-weight:700;font-size:12px;cursor:pointer;";
      b.addEventListener("click", () => {
        idx = i;
        sfx("click");
        ctx.markInteracted();
        render();
      });
      btns.push(b);
      row.appendChild(b);
    });

    wrap.appendChild(row);
    wrap.appendChild(out);
    mount.appendChild(wrap);

    function render() {
      btns.forEach((b, i) => {

      const t = tabs[idx];

        `<div style="color:#cbd5e1;"><b>Active:</b> ${t.act}</div>` +
        `<div style="color:#4ade80;margin-top:6px;"><b>Passive:</b> ${t.pas}</div>` +
        `</div>`;

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +

      biteTappedMap[bIdx] = true;

      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);

        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();

      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
