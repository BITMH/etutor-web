/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-inggeris-t5-bab08","subject":"Bahasa Inggeris","subjectGroup":"teras","form":5,"chapterNumber":8,"title":"A Hard Day's Work","subtitle":"Unit 8 KSSM Form 5: Employment Lexis, Conditionals (0-3 & Mixed), Connectors & Formal Application Letters","estimatedMinutes":24,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#d97706","coverIcon":"../assets/icons/bi58-u1.jpg","voiceReactions":{"correct":"[warmly] Top candidate precision. You matched the conditional timeframe and workplace term.","combo":"[excited] Interview-ready streak! Your mastery of Mixed Conditionals and career lexis is impressive.","encourage":"[gentle] Check whether each half of a Mixed Conditional describes an unreal past decision or its present result before trying again.","celebrate":"[cheerful] Unit 8 and Form 5 complete! You are fully equipped for SPM Reading, Cloze, and Formal Writing."},"units":[{"id":"unit-1","number":1,"title":"Careers, Remuneration & Workplace Lexis","subtitle":"Distinguishing salary vs wages, qualifications, promotions, and workplace collocations","iconUrl":"../assets/icons/bi58-u1.jpg","steps":[{"id":"u1-s1","type":"concept","title":"Workplace Distinctions Every SPM Candidate Needs","summary":"Unit 8 focuses on employment paths, remuneration types, job interviews, and accurate verb-noun collocations across professional workplaces.","bullets":["Salary vs Wages: a 'salary' is fixed monthly/annual pay for salaried roles; 'wages' are calculated hourly, daily, or weekly (often part-time or shift work).","Career progression: earn 'qualifications' (degrees, diplomas, certificates), 'impress the interviewer' with concrete skills, and 'get promoted' for strong performance—or 'get fired' for misconduct.","Other key contrasts: 'well-paid' (high remuneration), 'make redundant' (job cut because the role is no longer needed, not personal fault), 'apply for a post' (never 'apply a job')."],"formula":"Monthly/Annual = salary | Hourly/Weekly = wages | Role Eliminated = made redundant","examTip":"Watch the preposition after 'apply': you 'apply for' a vacancy and 'apply to' a company or university.","mediaKey":"bi58_workplace_lexis","caption":"Career lexicon separating salary vs wages, interview milestones, promotion, and redundancy.","alt":"Diagram showing career vocabulary: salary vs wages, qualifications, promotion, and redundancy","voiceIdKey":"u1-s1","voiceToneLabel":"Warm Coach","voiceCaption":"Distinguish salary from wages, and redundancy from getting fired.","voiceScript":"[warmly] Welcome to Unit 8, A Hard Day's Work—our final Form 5 chapter! [pause] Start with high-frequency workplace distinctions: 'salary' is fixed monthly or annual pay, whereas 'wages' are paid hourly or weekly. Also remember 'made redundant' means a role closed down, while 'fired' results from poor conduct.","xp":15},{"id":"u1-s2","type":"match","prompt":"Match each Unit 8 employment expression to its exact meaning.","pairs":[{"id":"w1","left":"salary","right":"Fixed monthly or annual pay stated in an employment contract"},{"id":"w2","left":"wages","right":"Earnings paid by the hour, day, or shift completed"},{"id":"w3","left":"qualifications","right":"Official academic certificates, diplomas, or licences held"},{"id":"w4","left":"made redundant","right":"Dismissed because a company downsized and closed the post"}],"explanation":"Clear career vocabulary boosts both workplace reading passages and formal application writing.","voiceIdKey":"u1-s2","voiceToneLabel":"Warm Coach","voiceCaption":"Pair each career term with its precise workplace definition.","voiceScript":"[curious] Match all four Unit 8 employment terms to their exact meanings.","xp":15},{"id":"u1-s3","type":"predict","prompt":"Which preposition completes the candidate's plan cleanly? 'After graduating, Amir intends to apply ______ the junior laboratory technician post at Biotech Utara.'","options":["for","at","with","on"],"correctIndex":0,"explanation":"Use 'apply for' before a specific job, post, or scholarship, and 'apply to' before an organisation.","voiceIdKey":"u1-s3","voiceToneLabel":"Exam Mentor","voiceCaption":"Predict the required preposition between 'apply' and 'post'.","voiceScript":"[informative] Amir is targeting a specific job post. Which preposition always connects 'apply' to the vacancy itself?","xp":15},{"id":"u1-s4","type":"mcq","prompt":"Which sentence applies Unit 8 career collocations naturally and accurately?","options":["Hana impressed the interview panel with her IT qualifications and got promoted within eighteen months.","Because business slowed, fifty diligent staff were praised with getting fired.","My weekend cafe job offers a steady annual wage paid once a year.","She decided to apply the hospital directly without mentioning the post."],"correctIndex":0,"explanation":"'Impressed the interview panel', 'qualifications', and 'got promoted' fit accurately, whereas downsizing is 'made redundant', hourly café pay is 'wages', and 'apply to' needs 'to'.","voiceIdKey":"u1-s4","voiceToneLabel":"Warm Coach","voiceCaption":"Select the sentence using workplace vocabulary accurately.","voiceScript":"[warmly] Read all four sentences closely and pick the only one where every career collocation fits real workplace English.","xp":15}],"boss":false},{"id":"unit-2","number":2,"title":"Zero, First, Second & Third Conditionals","subtitle":"Reviewing real rules, likely future plans, unreal present wishes, and unreal past regrets","iconUrl":"../assets/icons/bi58-u2.jpg","steps":[{"id":"u2-s1","type":"concept","title":"The Conditional Ladder & Formal Connectors","summary":"Before tackling Mixed Conditionals, Unit 8 consolidates Conditionals 0–3 alongside conditional connectors 'unless', 'provided (that)', and 'as/so long as'.","bullets":["Zero (Always true): If + Present Simple, Present Simple ('If shifts exceed 8 hours, overtime applies').","1st (Real future): If + Present Simple, will + V1 ('If she updates her CV, she will stand a better chance').","2nd (Unreal present/future): If + Past Simple ('were' for all subjects formally), would + V1 ('If I were the manager, I would raise apprentice wages').","3rd (Unreal past): If + had + V3, would have + V3 ('If he had checked the address, he wouldn't have arrived late').","Connectors: 'unless' (= if not), 'provided / providing (that)' & 'as long as' (= only if) take Present Simple—never 'will'."],"formula":"Zero: V1/V1 | 1st: V1/will+V1 | 2nd: V2/would+V1 | 3rd: had+V3/would have+V3","examTip":"After 'unless', 'as long as', or 'provided that', drop negative 'not' and drop future 'will': write 'Unless you prepare...', NOT 'Unless you don't will prepare...'.","labId":"bi58_career_lexis_lab","labTitle":"Career Conditionals & Lexis Lab","labHeight":320,"voiceIdKey":"u2-s1","voiceToneLabel":"Grammar Coach","voiceCaption":"Step through Conditionals 0 to 3 and test 'unless' and 'provided that' in the lab.","voiceScript":"[warmly] Let us review the four core conditional rungs before mixing them. [pause] Zero states workplace facts, First covers likely career results, Second imagines a different present, and Third reflects on an unchangeable past. Remember too: 'unless' means 'if not', so never pair it with another negative!","xp":15},{"id":"u2-s2","type":"sort","prompt":"Classify each workplace condition into Real / Likely (Zero or 1st) or Unreal / Hypothetical (2nd or 3rd).","buckets":[{"id":"real","label":"Real Facts & Likely Outcomes (0 / 1st)"},{"id":"unreal","label":"Unreal Present or Past (2nd / 3rd)"}],"items":[{"text":"Provided you attach two references, HR will shortlist your file.","bucketId":"real","note":"Real future condition using 'provided' + Present Simple"},{"text":"If I had accepted the Penang internship, I would have gained lab skills.","bucketId":"unreal","note":"3rd Conditional reflecting on a past decision"},{"text":"If staff wear safety goggles, eye injuries drop sharply.","bucketId":"real","note":"Zero Conditional workplace policy fact"},{"text":"If Nadia spoke Mandarin fluently, she would apply for the export role.","bucketId":"unreal","note":"2nd Conditional unreal present situation"}],"explanation":"Identifying real vs unreal timeframes prevents mixing 'will' into 2nd/3rd conditionals.","voiceIdKey":"u2-s2","voiceToneLabel":"Grammar Coach","voiceCaption":"Sort each workplace conditional sentence into real vs hypothetical.","voiceScript":"[curious] Separate these four career scenarios into real conditions versus hypothetical wishes or regrets.","xp":15},{"id":"u2-s3","type":"wordbank","prompt":"Arrange the tokens to form an accurate Conditional sentence using 'unless' (meaning 'if not').","answerTokens":["You","will","miss","the","interview","unless","you","board","the","early","train"],"distractors":["don't","won't","boarding"],"explanation":"'Unless' already expresses 'if... not', so the verb following it stays affirmative Present Simple ('board').","voiceIdKey":"u2-s3","voiceToneLabel":"Grammar Coach","voiceCaption":"Build a clean conditional sentence with 'unless' and zero double negatives.","voiceScript":"[warmly] Put this warning together cleanly—remember 'unless' already carries the negative meaning, so leave 'don't' out!","xp":15},{"id":"u2-s4","type":"mcq","prompt":"Select the accurate 3rd Conditional sentence about a missed job deadline:","options":["If Farid had submitted his portfolio on Tuesday, the studio would have interviewed him.","If Farid would have submitted his portfolio on Tuesday, the studio interviewed him.","If Farid submitted his portfolio on Tuesday, the studio would have interviewed him.","If Farid had submitted his portfolio on Tuesday, the studio will have interviewed him."],"correctIndex":0,"explanation":"Standard 3rd Conditional places 'had + V3' in the 'if'-clause and 'would have + V3' strictly in the main result clause.","voiceIdKey":"u2-s4","voiceToneLabel":"Exam Mentor","voiceCaption":"Pick the 3rd Conditional that keeps 'would have' out of the 'if'-clause.","voiceScript":"[informative] Never put 'would' inside the 'if'-clause! Spot the single sentence matching 'If + had + V3, would have + V3'.","xp":15}],"boss":false},{"id":"unit-3","number":3,"title":"Mixed Conditionals: Past Action -> Present Result","subtitle":"Connecting an unreal past choice ('had + V3') to an ongoing present outcome ('would + V1 / be + V-ing')","iconUrl":"../assets/icons/bi58-u3.jpg","steps":[{"id":"u3-s1","type":"concept","title":"How Time Shifts Bridge Type 3 and Type 2","summary":"A Mixed Conditional connects a hypothetical past action (3rd Conditional 'if'-clause) with its continuing result right now (2nd Conditional main clause).","bullets":["Pattern A (Unreal Past -> Unreal Present Result): 'If I had accepted that Singapore traineeship in 2023, I would be earning a senior salary NOW.'","Notice the time bridge word at the end: 'now', 'today', or 'currently' signals 'would + V1 / would be + V-ing' instead of 'would have + V3'.","Pattern B (Unreal Permanent Present Trait -> Unreal Past Result): 'If he weren't so careless (always), he wouldn't have misfiled yesterday's invoices (past).'"],"formula":"Unreal Past Choice (If + had + V3) -> Present Result NOW (would + V1 / be + V-ing)","examTip":"Always scan the main clause for 'now' or 'today' after an 'If + had + V3' clause—that single word flips 'would have + V3' into 'would + V1 / be + V-ing'!","mediaKey":"bi58_mixed_conditionals_map","caption":"Time-bridge diagram showing how an unreal past decision ('If + had + V3') drives a present consequence ('would + V1 ... now').","alt":"Diagram illustrating Mixed Conditionals bridging past choices with present career outcomes","voiceIdKey":"u3-s1","voiceToneLabel":"Grammar Coach","voiceCaption":"Link an unreal past choice to a present outcome using 'If + had V3, would + V1 now'.","voiceScript":"[informative] Here is Unit 8's signature grammar point: Mixed Conditionals. [pause] Imagine an unreal decision in the past—'If she had accepted that apprenticeship last year'—but the result happens TODAY: 'she would be working at the hospital now'. Watch out for 'now' or 'today' at the end so you stop at 'would + V1' instead of 'would have + V3'!","xp":15},{"id":"u3-s2","type":"wordbank","prompt":"Arrange the tokens to form a crisp Mixed Conditional sentence linking a past training course to present work.","answerTokens":["If","I","had","taken","that","coding","course,","I","would","work","remotely","today"],"distractors":["have","took","will"],"explanation":"'If I had taken' (unreal past) + 'I would work remotely today' (present result marked by 'today') forms a textbook Mixed Conditional.","voiceIdKey":"u3-s2","voiceToneLabel":"Grammar Coach","voiceCaption":"Assemble the Mixed Conditional ending in 'today'.","voiceScript":"[warmly] Connect that unreal past course decision to a present-day remote job ending with 'today'.","xp":15},{"id":"u3-s3","type":"concept","title":"Interactive Mixed Conditional Time-Bridge Lab","summary":"Compare Pure 3rd Conditionals (past-to-past) with Mixed Conditionals (past-to-present and trait-to-past) inside the time-bridge simulator.","bullets":["Toggle the result clock between 'last month' and 'right now' to see the verb change live.","Check both Mixed directions tested in English Download B1+ Unit 8."],"formula":"Result = Yesterday -> would have + V3 | Result = Today/Now -> would + V1 / be + V-ing","examTip":"Read both halves' time markers before locking your verb choice.","labId":"bi58_mixed_cond_lab","labTitle":"Mixed Conditional Time-Bridge Lab","labHeight":320,"voiceIdKey":"u3-s3","voiceToneLabel":"Grammar Coach","voiceCaption":"Slide the result clock between yesterday and today in the lab to master Mixed Conditionals.","voiceScript":"[curious] Try toggling the consequence clock between 'last year' and 'right now' inside the Time-Bridge Lab below.","xp":15},{"id":"u3-s4","type":"mcq","prompt":"Complete the Mixed Conditional accurately: 'If Mei Ling had checked the contract clause last month, she ______ overtime shifts without extra pay right now.'","options":["wouldn't be working","wouldn't have worked","won't be working","didn't work"],"correctIndex":0,"explanation":"'Right now' signals a present ongoing consequence of an unreal past choice ('had checked'), so 'wouldn't be working' (2nd Conditional Continuous) is exact.","voiceIdKey":"u3-s4","voiceToneLabel":"Exam Mentor","voiceCaption":"Select the verb matching an ongoing consequence happening 'right now'.","voiceScript":"[informative] Spot both time markers: 'last month' in the condition, and 'right now' in the result! Which verb fits right now?","xp":15}],"boss":false},{"id":"unit-4","number":4,"title":"Writing Formal Job Application Letters","subtitle":"Salutation rules, persuasive qualifications framing, and accurate formal sign-offs","iconUrl":"../assets/icons/bi58-u4.jpg","steps":[{"id":"u4-s1","type":"concept","title":"SPM Formal Letter of Application Blueprint","summary":"A strong formal job application letter opens politely with the exact vacancy source, matches your qualifications and soft skills to the role, and closes with interview availability and the matching sign-off.","bullets":["Salutation-to-Sign-off Pair: 'Dear Sir/Madam,' -> 'Yours faithfully,' | 'Dear Ms Tan,' -> 'Yours sincerely,'.","Opening Paragraph: state the post applied for and where you saw the advertisement ('I am writing to apply for the position of Assistant Designer advertised on...').","Body Paragraphs: highlight relevant qualifications, part-time/volunteer experience, and reliable soft skills with zero slang or contractions ('I am', not 'I'm')."],"formula":"Dear Sir/Madam -> Yours faithfully | Dear Mr/Ms [Name] -> Yours sincerely (No Contractions!)","examTip":"Matching 'Yours faithfully' vs 'Yours sincerely' correctly and omitting contractions like 'I'm / can't' is checked immediately by SPM markers for formal register.","mediaKey":"bi58_cover_letter_blueprint","caption":"Visual checklist for formal job application greeting, qualification paragraphs, and matching sign-off.","alt":"Diagram outlining formal cover letter sections and Yours faithfully vs Yours sincerely rule","voiceIdKey":"u4-s1","voiceToneLabel":"Writing Coach","voiceCaption":"Pair 'Dear Sir or Madam' with 'Yours faithfully', and drop contractions completely.","voiceScript":"[warmly] Let us polish your formal application letter format. [informative] State the exact role and where you found the advertisement in line one, match your qualifications to the employer's needs, avoid contractions like 'I'm', and pair 'Dear Sir or Madam' strictly with 'Yours faithfully'.","xp":15},{"id":"u4-s2","type":"match","prompt":"Match each formal letter element to its correct SPM convention.","pairs":[{"id":"l1","left":"Dear Sir/Madam,","right":"Close with 'Yours faithfully,'"},{"id":"l2","left":"Dear Mr Razak,","right":"Close with 'Yours sincerely,'"},{"id":"l3","left":"Opening line","right":"State exact post applied for and advertisement source"},{"id":"l4","left":"Closing body line","right":"Attach CV/documents and express availability for interview"}],"explanation":"Exact salutation pairing and logical paragraph progression secure high Organisation marks.","voiceIdKey":"u4-s2","voiceToneLabel":"Writing Coach","voiceCaption":"Pair each formal letter greeting and section with its exact convention.","voiceScript":"[curious] Match each formal cover-letter element to the exact rule SPM markers check.","xp":15},{"id":"u4-s3","type":"wordbank","prompt":"Arrange the tokens to form a crisp, formal closing line expressing interview availability.","answerTokens":["I","would","welcome","the","opportunity","to","attend","an","interview","at","your","convenience"],"distractors":["I'd","attending","hopes"],"explanation":"'I would welcome the opportunity...' avoids contractions and sounds polite, confident, and professional.","voiceIdKey":"u4-s3","voiceToneLabel":"Writing Coach","voiceCaption":"Build a polite, contraction-free closing sentence requesting an interview.","voiceScript":"[warmly] Put together a refined, contraction-free closing sentence inviting an interview at the employer's convenience.","xp":15},{"id":"u4-s4","type":"mcq","prompt":"Which sentence maintains flawless formal cover-letter tone from start to finish?","options":["I am writing to apply for the part-time receptionist post advertised on your clinic portal, and I enclose my curriculum vitae for your consideration.","Hi Sir! I'm super keen to grab the receptionist job I saw online yesterday, cheers!","I want to apply this receptionist post because I need extra wages asap, thanks.","Dear Ms Lim, please find attached my CV... Yours faithfully, Aina."],"correctIndex":0,"explanation":"Option A avoids contractions, uses 'apply for', names the role and portal formally, and avoids the 'Ms Lim + Yours faithfully' mismatch in Option D.","voiceIdKey":"u4-s4","voiceToneLabel":"Writing Coach","voiceCaption":"Pick the application excerpt that avoids slang, contractions, and sign-off mismatches.","voiceScript":"[warmly] Check every detail—greeting, 'apply for', absence of contractions, and sign-off pairing—to pick the flawless excerpt.","xp":15}],"boss":false},{"id":"unit-5","number":5,"title":"Boss Challenge: Form 5 English Finale","subtitle":"Synthesise career vocabulary, conditional connectors, Mixed Conditionals, and formal register","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","prompt":"Solve both halves accurately: 'If Amir ______ his engineering qualifications earlier, he ______ a well-paid senior salary today.'","options":["had completed ... would be earning","completed ... would have earned","would complete ... earns","had completed ... will earn"],"correctIndex":0,"explanation":"An unreal past event ('had completed ... earlier') paired with 'today' in the result requires Mixed Conditional ('would be earning' / 'would earn').","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Mentor","voiceCaption":"Solve the Mixed Conditional bridging 'earlier' to 'today'.","voiceScript":"[dramatic] Final Form 5 Boss challenge! Watch 'earlier' in the condition and 'today' in the main clause.","xp":25},{"id":"u5-s2","type":"sort","prompt":"Classify each workplace sentence into Correct Form 5 English or Common Exam Error.","buckets":[{"id":"valid","label":"Accurate Form 5 English"},{"id":"err","label":"Common Exam Error"}],"items":[{"text":"Provided that you arrive punctually, the supervisor will brief you.","bucketId":"valid","note":"'Provided that' + Present Simple + 'will'"},{"text":"Unless you don't send the form today, HR will close the portal.","bucketId":"err","note":"Double negative: 'unless' already means 'if not'"},{"text":"Dear Mr Azman, ... Yours sincerely,","bucketId":"valid","note":"Named recipient matches 'Yours sincerely'"},{"text":"If she were the director, she would have raised wages today.","bucketId":"err","note":"2nd Conditional present/general result takes 'would raise', not 'would have raised'"}],"explanation":"Spotting double negatives after 'unless', formal letter sign-off matching, and conditional tense errors safeguards top Paper 1 & 2 marks.","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Mentor","voiceCaption":"Sort these four career sentences into flawless English vs classic exam traps.","voiceScript":"[warmly] Separate the two flawless workplace sentences from the two common exam traps.","xp":25},{"id":"u5-s3","type":"wordbank","prompt":"Arrange the tokens to form a formal Mixed Conditional explaining a lasting character trait's past effect.","answerTokens":["If","she","weren't","so","organised,","she","wouldn't","have","impressed","the","interviewer"],"distractors":["wasn't been","impress","hadn't"],"explanation":"Type 2 + Type 3 Mixed Conditional: permanent present quality ('weren't so organised') -> past interview outcome ('wouldn't have impressed').","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Mentor","voiceCaption":"Assemble the reverse Mixed Conditional from a permanent trait to a past outcome.","voiceScript":"[informative] Now reverse the Mixed Conditional direction: an ongoing present trait affecting a past interview!","xp":25},{"id":"u5-s4","type":"mcq","prompt":"Grand Finale Check: Which sentence is 100% error-free across grammar, career lexis, and formal register?","options":["If Daniel had applied for that apprenticeship last autumn, he would be earning steady wages today.","Dear Sir/Madam, I'm applying the supervisor role and look forward to hearing from you, Yours sincerely.","As long as you will bring your certificates, the panel will consider your salary promotion.","Because fifty workers were made redundant for arriving late, they got promoted elsewhere."],"correctIndex":0,"explanation":"Option A accurately pairs 'apply for', Mixed Conditional ('had applied last autumn -> would be earning ... today'), and 'wages'. Options B, C, and D contain greeting/contraction/register errors, illegal 'will' after 'as long as', and wrong meaning of 'made redundant'.","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Mentor","voiceCaption":"Select the single completely flawless sentence to complete Form 5 English!","voiceScript":"[excited] Grand Finale for Form 5 Bahasa Inggeris! Inspect prepositions, conditional connectors, and career terms—claim your trophy!","xp":25}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {
  "bi58_mixed_conditionals_map": {

  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +

  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
