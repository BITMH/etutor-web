/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

Sejahtera! Pendidikan tidak berakhir di bangku sekolah, sebaliknya berterusan sepanjang hayat melalui latihan vokasional, kursus kemahiran dan pembacaan kendiri. Dalam pemahaman teks Kertas dua S P M, pelajar wajib membezakan maklumat TERSURAT yang tertulis secara langsung dalam petikan, daripada maklumat TERSIRAT yang perlu disimpulkan daripada sebab, kesan atau maksud kiasan penulis! Terokai teknik bacaan pantas K S S M seperti S Q empat R dan C H A T T di bawah!","title":"2.2.1 Pendidikan Sepanjang Hayat, Tersurat vs Tersirat & Teknik Bacaan","acronym":"SQ4R•TT","hook":"Bandingkan langkah teknik bacaan SQ4R, CHATT dan ACID untuk menguasai pemahaman petikan SPM!","mediaKey":"bm42_perpustakaan_ilmu","summary":"Pembelajaran sepanjang hayat memacu modal insan berilmu; kemahiran membaca kritis membezakan isi tersurat (nyata dalam teks) daripada isi tersirat (tafsiran rasional).","bullets":["Pendidikan Sepanjang Hayat & Minda Cerdas: Merangkumi pendidikan formal, latihan kemahiran TVET/kolej komuniti serta pemakanan seimbang (vitamin B untuk tenaga otak, penghasilan sel darah merah penyalur oksigen dan ketenangan diri).","Maklumat Tersurat vs Tersirat (SP 2.2.1): Maklumat tersurat dinyatakan secara terus dalam bahan (fakta, angka, huraian jelas); maklumat tersirat ialah kesimpulan, tujuan atau pengajaran di sebalik teks.","Teknik Bacaan KSSM: SQ4R (Survey, Question, Read, Record, Recite, Review), CHATT (Circle, Highlight, Asterisk, Transfer, Teacher), ACID (Agree, Confusing, Interesting, Disagree)."],"labId":"bm42_teknik_bacaan_lab","labTitle":"Penjelajah Teknik Bacaan KSSM (SQ4R / CHATT / ACID)","labProps":{"tech":"sq4r"},"examTip":"Dalam soalan pemahaman Kertas 2, apabila diminta memberi pendapat berdasarkan petikan (KBAT), jana idea tersirat yang relevan dengan tema teks menggunakan ayat lengkap dan penanda wacana."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Maklumat Tersurat vs Tersirat","voiceCaption":"Kelaskan enam pernyataan berkaitan pembelajaran dan kesihatan minda berikut antara Maklumat Tersurat dengan Maklumat Tersirat.","voiceScript":"[curious] Uji kepekaan pemahaman kamu! Asingkan keenam-enam pernyataan ini kepada Maklumat Tersurat yang berbentuk fakta terus teks, atau Maklumat Tersirat yang merupakan tafsiran lanjutan.","prompt":"Isihkan pernyataan berikut kepada Maklumat Tersurat atau Maklumat Tersirat:","buckets":[{"id":"tersurat","label":"Maklumat Tersurat (Fakta Nyata)"},{"id":"tersirat","label":"Maklumat Tersirat (Tafsiran/Kesimpulan)"}],"items":[{"text":"Oat, ikan dan kekacang membekalkan vitamin B yang membantu penghadaman karbohidrat","bucketId":"tersurat","note":"Betul! Fakta pemakanan yang tercatat secara langsung."},{"text":"Individu yang mengabaikan sarapan berkhasiat berisiko mengalami kesukaran menumpukan perhatian di kelas","bucketId":"tersirat","note":"Tepat! Kesimpulan sebab-dan-akibat yang tersirat di sebalik fungsi vitamin."},{"text":"Universiti Awam dan Kolej Komuniti menawarkan kursus jangka pendek untuk warga dewasa","bucketId":"tersurat","note":"Betul! Maklumat institusi yang dinyatakan jelas dalam bahan."},{"text":"Kerajaan prihatin memastikan rakyat kekal berdaya saing dalam ekonomi digital tanpa mengira peringkat umur","bucketId":"tersirat","note":"Tepat! Tafsiran terhadap hasrat di sebalik pelaksanaan program."},{"text":"Kekurangan oksigen ke otak menyebabkan seseorang kerap lupa dan tertekan","bucketId":"tersurat","note":"Betul! Kesan langsung yang disebut dalam nota minda cerdas."},{"text":"Penguasaan kemahiran baharu merupakan pelaburan jangka panjang demi masa hadapan yang terjamin","bucketId":"tersirat","note":"Tepat! Pengajaran tersirat daripada amalan menuntut ilmu."}],"explanation":"Maklumat tersurat dipetik/diungkap semula daripada fakta bertulis dalam bahan, manakala maklumat tersirat memerlukan penaakulan kritis."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Langkah Teknik Bacaan","voiceCaption":"Padankan empat singkatan teknik bacaan KSSM dengan maksud dan kegunaannya yang tepat.","voiceScript":"[confident] Padankan setiap akronim teknik bacaan K S S M berikut dengan fungsinya yang tepat!","prompt":"Padankan teknik bacaan KSSM berikut dengan penerangannya:","pairs":[{"id":"bm42u1m1","left":"Huruf 'K' dalam teknik bacaan tanda catatan","right":"Menanda kata kunci (kata tebal atau condong) dalam petikan"},{"id":"bm42u1m2","left":"SQ4R (Survey, Question, Read...)","right":"Tinjau, soal, baca, catat, imbas semula dan semak"},{"id":"bm42u1m3","left":"CHATT (Circle, Highlight, Asterisk...)","right":"Bulatkan kata penting, serlahkan isi dan pindah ke jadual"},{"id":"bm42u1m4","left":"ACID (Agree, Confusing, Interesting, Disagree)","right":"Menilai hujah secara kritis sama ada setuju atau keliru"}],"explanation":"Setiap teknik bacaan KSSM melatih pelajar membaca secara aktif dan tidak sekadar membaca pasif dari baris ke baris."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Maksud Ungkapan Minda yang Cerdas","voiceCaption":"Pilih tafsiran yang paling tepat bagi frasa minda yang cerdas dalam konteks pembelajaran sepanjang hayat.","voiceScript":"[confident] Berdasarkan Tema dua buku teks, apakah maksud paling tepat bagi rangkai kata minda yang cerdas?","prompt":"Berdasarkan konteks petikan pendidikan dan kesihatan minda, apakah maksud rangkai kata 'minda yang cerdas'?","options":["Akal fikiran yang tajam, aktif berfikir secara rasional serta berdaya ingatan kuat","Tubuh badan yang berotot tegap hasil latihan sukan berat semata-mata","Sikap terburu-buru membuat keputusan tanpa merujuk sebarang fakta","Hafalan bulat-bulat nota tanpa memahami konsep asasnya"],"correctIndex":0,"explanation":"Minda yang cerdas merujuk keupayaan akal yang tajam, pantas berfikir secara kritis dan kreatif serta disokong kesihatan fizikal yang baik."}]},{"id":"bm42-u2","title":"Unit 2: Kata Terbitan — Stesen Kata Nama, Kerja & Adjektif","subtitle":"SP 5.1.2 — Awalan, Akhiran, Apitan, Sisipan serta Pengimbuhan Kata Pinjaman & Gugus Konsonan","iconType":"formula","iconUrl":"../assets/icons/bm42-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"3 Stesen Kata Terbitan SP 5.1.2","voiceCaption":"Standard pembelajaran lima perpuluhan satu perpuluhan dua membahagikan kata terbitan kepada imbuhan kata nama, kata kerja dan kata adjektif.","voiceScript":"[warm] Selamat datang ke Unit dua, Tatabahasa Kata Terbitan! Dalam Tema dua buku teks, anda diperkenalkan kepada tiga stesen pengimbuhan: Stesen X bagi imbuhan Kata Nama, Stesen Y bagi imbuhan Kata Kerja, dan Stesen Z bagi imbuhan Kata Adjektif! Ingat perbezaan fungsi apitan yang paling kerap diuji dalam S P M: akhiran kan menandakan objek bergerak atau kausatif seperti memasukkan buku, manakala akhiran i menandakan arah atau tempat tetap seperti memasuki bilik darjah! Selain itu, awalan peN dan meN pada kata pinjaman berhuruf gugus konsonan seperti proses dan kritik TIDAK menggugurkan huruf P atau K — ejaannya kekal memproses dan mengkritik! Terokai tiga stesen imbuhan di bawah!","title":"5.1.2 Kata Terbitan Mengikut Golongan Kata & Imbuhan -kan vs -i","acronym":"X•Y•Z","hook":"Klik Stesen X, Y dan Z di bawah untuk melihat gabungan imbuhan dengan kata dasar!","summary":"Kata terbitan dibentuk melalui awalan, akhiran, apitan dan sisipan yang mengubah golongan atau fungsi gramatis kata dasar.","bullets":["Stesen X (Imbuhan Kata Nama): peN- (pelajar, pembaca), peN-...-an (pendidikan, pengetahuan), ke-...-an (kepandaian, kemahiran), -an (bacaan, latihan), juru- (juruukur), sisipan -el- (telunjuk).","Stesen Y (Imbuhan Kata Kerja): meN-...-kan (meningkatkan, membudayakan), meN-...-i (mendalami, menguasai), ber- (berilmu), ter- (terdidik), memper-...-kan (memperkenalkan).","Stesen Z (Imbuhan Kata Adjektif): ter- (terbaik, tertinggi), se- (setanding, secemerlang), ke-...-an (ke-Inggeris-an), sisipan -em- (gemilang, semerbak)."],"labId":"bm42_kata_terbitan_lab","labTitle":"Makmal 3 Stesen Kata Terbitan (SP 5.1.2)","labProps":{"stKey":"kn"},"examTip":"Perangkap ejaan sisipan & apitan: 'memperbaiki' (BUKAN memperbaikikan!), 'memperdalam' (BUKAN memperdalamkan!), tetapi 'memperkatakan' atau 'memperkenalkan' perlu '-kan' kerana kata dasarnya bukan adjektif!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Ejaan Kata Pinjaman & Apitan","voiceCaption":"Ramalkan gabungan kata terbitan yang betul ejaannya mengikut hukum Tatabahasa Dewan apabila kata pinjaman atau kata dasar menerima imbuhan.","voiceScript":"[curious] Berhati-hati dengan hukum gugus konsonan kata pinjaman dan peraturan memper! Antara pilihan berikut, manakah kumpulan kata terbitan yang seratus peratus betul ejaannya?","hook":"Semak peraturan pengecualian gugus konsonan dan apitan memper- pada nota di atas!","scenario":"Empat ayat mengandungi perkataan berimbuhan: (A) memproses / memperdalam / mensyukuri, (B) memeroses / memperdalamkan / menyukuri.","prompt":"Pilih himpunan kata terbitan yang BETUL ejaannya mengikut Tatabahasa Dewan:","options":["memproses, memperdalam, mensyukuri, mengkritik","memeroses, memperdalamkan, menyukuri, mengeritik","memproses, memperdalamkan, menyukuri, mengkritik","memeroses, memperdalam, mensyukuri, mengeritik"],"correctIndex":0,"proofLabId":"bm42_kata_terbitan_lab","proofState":{"stKey":"kk"},"explanation":"Gugus konsonan 'pr', 'kr', 'sy' mengekalkan huruf awal (memproses, mengkritik, mensyukuri). Kata adjektif 'dalam' menerima apitan 'memper-' tanpa '-kan' (memperdalam = menjadikan lebih dalam)."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Imbuhan -kan vs -i & Fungsi","voiceCaption":"Padankan lima kata terbitan dengan penggunaan ayat atau golongan katanya yang tepat.","voiceScript":"[confident] Uji ketepatan kamu membezakan fungsi akhiran kan, akhiran i dan imbuhan kata nama!","prompt":"Padankan setiap kata terbitan berikut dengan contoh penggunaan yang betul:","pairs":[{"id":"bm42u2m1","left":"menghadiahi (akhiran -i)","right":"Cikgu menghadiahinya sebuah kamus baharu (penerima bernyawa)"},{"id":"bm42u2m2","left":"menghadiahkan (akhiran -kan)","right":"Cikgu menghadiahkan sebuah kamus kepada pelajar terbaik"},{"id":"bm42u2m3","left":"pendidikan (apitan peN-...-an)","right":"Kata Terbitan Kata Nama (proses mendidik)"},{"id":"bm42u2m4","left":"terpelajar (awalan ter-)","right":"Kata Terbitan Kata Adjektif / sifatan berilmu"},{"id":"bm42u2m5","left":"gemilang (sisipan -em-)","right":"Sisipan pada kata dasar 'gilang'"}],"explanation":"Kata kerja berakhiran '-i' diikuti oleh penerima bernyawa/tempat, manakala berakhiran '-kan' diikuti oleh objek yang digerakkan atau diberikan."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Kesalahan Imbuhan dalam Ayat","voiceCaption":"Kenal pasti ayat yang menggunakan kata terbitan dengan tepat dan gramatis mengikut konteks pendidikan.","voiceScript":"[confident] Pilih ayat yang menggunakan imbuhan kata terbitan dengan betulnya tanpa sebarang lewah atau salah imbuhan!","prompt":"Pilih ayat yang menggunakan kata terbitan dengan BETUL dan gramatis:","options":["Pihak sekolah memperindah taman bacaan itu untuk keselesaan murid","Pihak sekolah memperindahkan lagi taman bacaan itu untuk murid","Guru itu menghadiahkan Amin sebatang pen kerana rajin membaca","Pelbagai langkah telah diambil untuk mempertingkatkan mutu bacaan"],"correctIndex":0,"explanation":"Adjektif 'indah' hanya menerima 'memper-' (memperindah, BUKAN memperindahkan). 'menghadiahkan' mesti diikuti objek pen, bukan Amin. 'mempertingkatkan' adalah lewah apabila adjektif 'tinggi' sudah ada imbuhan 'per-' (sepatutnya mempertinggi atau meningkatkan)."}]},{"id":"bm42-u3","title":"Unit 3: Apresiasi Prosa Tradisional & Sajak Pendidikan","subtitle":"SP 4.1.1 — Hikayat Hang Tuah, Bahasa Istana, Nilai Kepahlawanan & Kepentingan Ilmu","iconType":"crown","iconUrl":"../assets/icons/bm42-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Prosa Tradisional & Bahasa Klasik","voiceCaption":"Apresiasi prosa tradisional seperti Hikayat Hang Tuah menilai watak, persoalan kepahlawanan, nilai murni dan kemahiran menterjemah bahasa Melayu klasik kepada bahasa Melayu standard.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam Tema dua buku teks, terdapat petikan daripada Hikayat Hang Tuah yang menguji kemahiran empat perpuluhan satu perpuluhan satu serta soalan wajib S P M Kertas dua iaitu menukarkan petikan bahasa Melayu klasik kepada bahasa Melayu standard! Ingat peraturan menukar bahasa Melayu klasik kepada bahasa standard: KEKALKAN semua dialog, nama khas dan jalan cerita asal, tetapi tukarkan kata pangkal ayat klasik seperti hatta, maka, syahadan, arakian kepada penanda wacana moden atau gugurkan jika tidak perlu! Tukarkan juga kosa kata arkaik seperti masyghul menjadi sedih atau murung, beradu menjadi tidur, dan santap menjadi makan!","title":"4.1.1 Apresiasi Prosa Tradisional & Teknik Bahasa Klasik -> Standard","acronym":"K•S•D•N","hook":"Kekalkan maksud & nama watak asal, tetapi ubah struktur pasif klasik dan kosa kata arkaik ke bahasa Melayu moden!","mediaKey":"bm42_manuskrip_melayu","summary":"Prosa tradisional menonjolkan nilai kebijaksanaan, keberanian dan menuntut ilmu; soalan SPM memerlukan penukaran ayat klasik kepada ayat bahasa Melayu standard tanpa mengubah maksud.","bullets":["Kata Pangkal Ayat Klasik (Gugurkan/Tukar): Hatta, Maka, Arakian, Syahadan, Alkisah, Sebermula -> tukar kepada 'Selepas itu', 'Seterusnya', atau mulakan terus dengan subjek ayat.","Kosa Kata Klasik -> Standard: masyghul (sedih/susah hati), pacal (hamba/saya), titah (perintah), gering (sakit), beradu (tidur), murka (marah), anugerah (hadiah/kurniaan).","Nilai Pendidikan dalam Hikayat Hang Tuah: Hang Tuah dan sahabatnya berburu ilmu persilatan serta ilmu bahasa asing (12 bahasa) daripada guru seperti Aria Putera — membuktikan pentingnya kesungguhan menuntut ilmu!"],"examTip":"Amaran Kertas 2 Soalan Bahasa Melayu Standard: JANGAN meringkaskan atau menambah isi baharu! Terjemahkan setiap ayat satu demi satu dengan mengekalkan susunan peristiwa yang sama."},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Kosa Kata Klasik & Standard","voiceCaption":"Padankan lima perkataan bahasa Melayu klasik daripada teks prosa tradisional dengan maksud bahasa Melayu standardnya.","voiceScript":"[confident] Uji penguasaan kosa kata bahasa Melayu klasik dan bahasa istana kamu! Padankan kelima-lima perkataan klasik ini dengan maksud modennya.","prompt":"Padankan perkataan bahasa Melayu klasik berikut dengan padanan bahasa Melayu standardnya:","pairs":[{"id":"bm42u3m1","left":"masyghul","right":"sedih, murung atau berduka cita"},{"id":"bm42u3m2","left":"beradu","right":"tidur (bahasa istana)"},{"id":"bm42u3m3","left":"hatta / arakian","right":"selepas itu / kemudian (kata pangkal ayat)"},{"id":"bm42u3m4","left":"gering","right":"sakit (bahasa istana)"},{"id":"bm42u3m5","left":"mengarau / menuntut ilmu dengan tekun","right":"bersungguh-sungguh mendalami kepakaran"}],"explanation":"Menguasai kata klasik dan bahasa istana memastikan anda tidak kehilangan maksud penting semasa menukar perenggan klasik ke bahasa Melayu standard."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Tukar Ayat Klasik ke Bahasa Standard","voiceCaption":"Susun bahagian ayat untuk menukarkan ayat klasik Hatta maka baginda pun terlalu masyghul mendengarkan sembah Laksamana kepada bahasa Melayu standard yang betul.","voiceScript":"[curious] Susun ayat bahasa Melayu standard yang tepat bagi ayat klasik: Hatta maka baginda pun terlalu masyghul mendengarkan sembah Laksamana.","prompt":"Tukarkan ayat klasik 'Hatta maka baginda pun terlalu masyghul mendengarkan sembah Laksamana' ke bahasa Melayu standard:","hint":"Tukar 'Hatta maka' dan perkataan 'masyghul' serta 'sembah'...","answerTokens":["Selepas itu,","baginda berasa amat sedih","apabila mendengar laporan","yang disampaikan oleh Laksamana."],"distractors":["Hatta maka sultan sangat gembira","serta terus pulang ke rumah."],"explanation":"'Hatta maka' diganti dengan 'Selepas itu,', 'masyghul' ditukar kepada 'sedih', dan 'sembah' bermaksud laporan/ucapan kepada raja."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Nilai Murni Prosa Tradisional","voiceCaption":"Pilih pengajaran utama daripada kesungguhan Hang Tuah mempelajari ilmu pertahanan diri dan pelbagai bahasa.","voiceScript":"[confident] Berdasarkan teks Hikayat Hang Tuah dalam Tema dua, apakah pengajaran utama yang paling relevan dengan tema Insan Terdidik?","prompt":"Apakah pengajaran utama yang boleh diteladani daripada kisah Hang Tuah menuntut ilmu persilatan dan pelbagai bahasa?","options":["Kita mestilah gigih menuntut pelbagai bidang ilmu dan kemahiran sebagai bekalan berbakti kepada negara","Kita hanya perlu mempelajari satu bahasa sahaja supaya tidak keliru","Ilmu pertahanan diri tidak memerlukan bimbingan daripada guru yang berpengalaman","Kejayaan hanya bergantung pada nasib tanpa perlu berusaha"],"correctIndex":0,"explanation":"Kesungguhan berguru dan menguasai ilmu pelbagai bahasa mencerminkan sifat insan terdidik yang berwibawa."}]},{"id":"bm42-u4","title":"Unit 4: Penulisan Perenggan & Kerangka Karangan Pendidikan","subtitle":"SP 3.4.1 & 3.4.3 — Membina Kerangka Karangan, Ayat Topik, Ayat Huraian, Ayat Contoh & Ayat Penegas (AT-AH-AC-AP)","iconType":"scale","iconUrl":"../assets/icons/bm42-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Struktur Perenggan Isi AT-AH-AC-AP","voiceCaption":"Perenggan isi karangan S P M yang mantap dibina dengan formula empat komponen iaitu Ayat Topik, Ayat Huraian, Ayat Contoh dan Ayat Penegas beserta ungkapan menarik.","voiceScript":"[warm] Selamat datang ke Unit empat! Bagaimanakah cara menulis karangan bertema pendidikan sepanjang hayat supaya mendapat markah cemerlang? Gunakan struktur perenggan isi A T A H A C A P! Mulakan dengan Ayat Topik yang menyatakan isi utama secara jelas. Diikuti dengan Ayat Huraian yang menjelaskan MENGAPA dan BAGAIMANA isi itu berlaku menggunakan kata hubung seperti kerana, agar dan sekali gus. Kemudian sertakan Ayat Contoh yang konkrit seperti kursus kolej komuniti, platform pembelajaran dalam talian atau program TVET. Akhir sekali, tutup dengan Ayat Penegas berserta peribahasa relevan seperti di mana ada kemahuan di situ ada jalan!","title":"3.4.1–3.4.3 Kerangka Karangan & Formula Perenggan Isi (AT-AH-AC-AP)","acronym":"AT•AH•AC•AP","hook":"Pastikan setiap perenggan isi mengandungi 4 lapis: Isi (AT) -> Huraian (AH) -> Bukti/Contoh (AC) -> Penutup Isi (AP)!","summary":"Kerangka karangan yang tersusun mengelakkan isi bertindan, manakala formula AT-AH-AC-AP menjamin huraian isi yang matang dan gramatis.","bullets":["4 Lapis Perenggan Isi Cemerlang: (1) Ayat Topik (AT) — isi utama; (2) Ayat Huraian (AH) — huraian sebab/cara/kesan; (3) Ayat Contoh (AC) — bukti nyata/institusi/program; (4) Ayat Penegas (AP) — kesimpulan kecil isi + ungkapan menarik.","Penanda Wacana Berfungsi: Menghurai (Hal ini dikatakan demikian kerana, Dalam konteks ini); Memberi contoh (Sebagai tamsilan, Antaranya termasuklah); Menegas (Tegasnya, Natijahnya).","Kesalahan Ejaan Lazim Karangan: 'disamping' -> 'di samping', 'oleh kerana' -> 'oleh sebab', 'ramai pelajar' -> 'banyak pelajar' / 'ramai manusia', 'di dalam era' -> 'pada era'."],"examTip":"Elakkan kesilapan kata pemeri dan kata hubung dalam karangan: 'Antara faktor-faktornya ialah...' adalah SALAH (lewah!). Tulis 'Antara faktornya termasuklah...' atau 'Faktor utama ialah...'."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Perenggan Isi AT-AH-AC-AP","voiceCaption":"Susun empat ayat berikut menjadi satu perenggan isi yang koheren mengikut turutan Ayat Topik, Ayat Huraian, Ayat Contoh dan Ayat Penegas.","voiceScript":"[confident] Susun keempat-empat ayat ini mengikut formula A T A H A C A P untuk membina perenggan isi karangan pendidikan sepanjang hayat!","prompt":"Susun ayat berikut mengikut urutan AT -> AH -> AC -> AP yang koheren:","hint":"Mulakan dengan isi utama (Ayat Topik), diikuti huraian sebab, contoh kursus, dan penegas...","answerTokens":["Selain itu, pendidikan sepanjang hayat meningkatkan kebolehpasaran pekerja dalam ekonomi moden.","Hal ini dikatakan demikian kerana kemahiran teknologi sentiasa berubah dan menuntut ilmu baharu agar pekerja kekal relevan.","Sebagai contoh, golongan bekerja boleh mengikuti kursus sijil kemahiran digital di kolej komuniti atau secara dalam talian.","Tegasnya, budaya menuntut ilmu tanpa henti menjamin kejayaan kerjaya selaras dengan peribahasa genggam bara api biar sampai jadi arang."],"distractors":["Kesimpulannya, semua pihak harus tidur awal setiap hari.","Walau bagaimanapun, kolej komuniti hanya dibuka pada waktu malam sahaja."],"explanation":"Urutan AT (isi utama) -> AH (sebab perubahan teknologi) -> AC (contoh kolej komuniti) -> AP (tegasnya + peribahasa) menghasilkan wacana yang padu."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Ungkapan Gramatis vs Lewah/Salah","voiceCaption":"Asingkan enam frasa karangan berikut antara Frasa Gramatis dengan Frasa Lewah atau Salah Tatabahasa.","voiceScript":"[curious] Tajamkan penyuntingan karangan kamu! Asingkan keenam-enam frasa ini kepada Frasa Gramatis atau Frasa Lewah dan Salah.","prompt":"Kelaskan frasa berikut kepada Frasa Gramatis atau Frasa Salah/Lewah:","buckets":[{"id":"betul","label":"Frasa Gramatis (Betul)"},{"id":"salah","label":"Frasa Salah / Lewah"}],"items":[{"text":"Antara faedah membaca buku termasuklah...","bucketId":"betul","note":"Betul! Kata 'antara' tidak digandakan kata nama dan diikuti 'termasuklah'."},{"text":"Antara faktor-faktor utama ialah...","bucketId":"salah","note":"SALAH! Lewah selepas 'antara' dan 'ialah' tidak boleh diikuti kata kerja."},{"text":"Oleh sebab kesuntukan masa, ...","bucketId":"betul","note":"Tepat! Sendi nama 'oleh' wajib digandingkan dengan kata nama 'sebab'."},{"text":"Oleh kerana kesuntukan masa, ...","bucketId":"salah","note":"SALAH! 'Kerana' ialah kata hubung, bukan kata nama (sepatutnya oleh sebab)."},{"text":"Di samping itu, pada era globalisasi ini...","bucketId":"betul","note":"Betul! 'di samping' dieja jarak dan 'pada era' menggunakan kata sendi masa."},{"text":"Disamping itu, di dalam era moden ini...","bucketId":"salah","note":"SALAH! 'di samping' mesti jarak dan masa menggunakan 'pada', bukan 'di dalam'."}],"explanation":"Elakkan 'oleh kerana', 'di dalam era', 'disamping', dan 'antara [kata ganda]'; kesilapan ini sangat kerap dikesan pemeriksa Kertas 1."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Pilih Penanda Wacana Penegas","voiceCaption":"Pilih penanda wacana yang paling sesuai untuk memulakan ayat penegas dalam perenggan isi karangan.","voiceScript":"[confident] Lengkapkan ayat penegas perenggan isi karangan berikut dengan penanda wacana yang paling tepat!","prompt":"Pilih penanda wacana yang paling tepat untuk memulakan Ayat Penegas bagi sesuatu perenggan isi:","options":["Tegasnya, penguasaan ilmu sepanjang hayat merupakan pemangkin kemajuan diri dan negara.","Oleh hal demikian, pelajar mestilah membeli banyak buku tanpa membacanya.","Selain itu, apakah maksud sebenar pendidikan formal di sekolah?","Sungguhpun demikian, kerajaan gagal membantu rakyat menimba ilmu."],"correctIndex":0,"explanation":"'Tegasnya,' atau 'Jelaslah bahawa' ialah penanda wacana penegasan isi, bukan penanda isi baharu ('Selain itu,')."}]},{"id":"bm42-u5","title":"Unit 5: Cabaran Boss SPM — Insan Terdidik","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Morfologi Kata Terbitan, Bahasa Melayu Standard, Pemahaman & Suntingan Ayat","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Suntingan Kesalahan Bahasa","voiceCaption":"Soalan Boss pertama menguji pengesanan kesalahan imbuhan dan kata sendi nama dalam ayat bertema pendidikan.","voiceScript":"[excited] Selamat datang ke Unit Boss Tema dua! Soalan pertama menguji kepekaan kamu menyunting kesalahan bahasa bertema pendidikan seperti format Kertas dua!","prompt":"Pilih ayat yang BEBAS daripada sebarang kesalahan tatabahasa dan ejaan:","options":["Program latihan itu diadakan demi meningkatkan kemahiran belia dalam bidang teknologi maklumat","Program latihan itu diadakan demi untuk meningkatkan kemahiran belia di dalam bidang teknologi","Kerajaan akan memperluaskan lagi peluang pendidikan kepada semua lapisan masyarakat","Semua pelajar-pelajar berhak mendapat bimbingan daripada guru yang berpengalaman"],"correctIndex":0,"explanation":"'demi untuk' dan 'semua pelajar-pelajar' adalah lewah, 'memperluaskan' salah (sepatutnya memperluas), dan bidang bukan tempat fizikal (gunakan 'dalam', bukan 'di dalam')."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Kesesuaian Imbuhan Kata Kerja","voiceCaption":"Ramalkan bentuk imbuhan yang paling tepat apabila kata dasar luas menerima imbuhan memper untuk menyatakan maksud menjadi lebih luas.","voiceScript":"[curious] Soalan Boss kedua! Apakah bentuk kata terbitan yang betul apabila kata adjektif luas menerima awalan memper tanpa berlaku kelewahan imbuhan?","hook":"Sahkan hukum imbuhan kata kerja pada Stesen Y Makmal Kata Terbitan!","scenario":"Ayat: 'Kementerian Pendidikan berusaha ________ akses pendidikan digital ke kawasan luar bandar.'","prompt":"Pilih bentuk kata kerja terbitan yang paling gramatis untuk mengisi tempat kosong tersebut:","options":["memperluas (atau meluaskan)","memperluaskan","mempeluaskan","diperluaskan"],"correctIndex":0,"proofLabId":"bm42_kata_terbitan_lab","proofState":{"stKey":"kk"},"explanation":"Hukum Tatabahasa Dewan: kata adjektif (luas, besar, dalam, indah, kecil) tidak boleh menggabungkan 'memper-' dan '-kan' serentak. Guna 'memperluas' atau 'meluaskan'."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Bahasa Klasik ke Standard","voiceCaption":"Susun ayat bahasa Melayu standard yang betul bagi petikan Hikayat Hang Tuah mengenai kesanggupan Hang Tuah berguru dengan Aria Putera.","voiceScript":"[confident] Soalan Boss ketiga menguji terjemahan bahasa Melayu klasik! Susun ayat standard bagi petikan: Maka kata Hang Tuah, 'Baiklah, pacal menurut titah tuanku pergi berguru.'","prompt":"Tukarkan ayat klasik 'Maka kata Hang Tuah, \"Baiklah, pacal menurut titah tuanku pergi berguru.\"' kepada bahasa Melayu standard:","hint":"Gugurkan kata pangkal 'Maka', tukar 'pacal' kepada 'patik' atau 'hamba' dan kekalkan struktur dialog...","answerTokens":["Hang Tuah berkata,","\"Baiklah, patik akan mematuhi","perintah tuanku untuk pergi","menuntut ilmu daripada guru.\""],"distractors":["Maka Hang Tuah pun menolak","titah baginda kerana terlalu jauh."],"explanation":"Kata pangkal 'Maka' digugurkan, 'pacal' (hamba hina) diselaraskan sebagai 'patik' apabila bercakap dengan sultan, dan maksud asal dikekalkan."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Istilah Morfologi & Wacana","voiceCaption":"Padankan empat istilah tatabahasa dan kemahiran membaca dengan contoh atau takrifannya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat istilah tatabahasa dan kemahiran bacaan ini dengan contoh tepatnya.","prompt":"Padankan istilah berikut dengan contoh atau huraian tepatnya:","pairs":[{"id":"bm42b4m1","left":"Kata terbitan bersisipan","right":"telapak, seruling, gemilang"},{"id":"bm42b4m2","left":"Pengecualian hukum K-T-S-P","right":"memproses, mengkaji, menterjemah"},{"id":"bm42b4m3","left":"Maklumat tersirat","right":"Mesej, tujuan atau pengajaran di sebalik teks"},{"id":"bm42b4m4","left":"Komponen penutup perenggan isi","right":"Ayat Penegas (AP)"}],"explanation":"Menggabungkan penguasaan morfologi kata terbitan dengan kemahiran bacaan dan wacana karangan melengkapkan keperluan Tema 2 SPM."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Analisis Isi Tersirat & Wacana","voiceCaption":"Pilih pernyataan kesimpulan yang paling tepat mengenai kepentingan pembelajaran sepanjang hayat dalam era ekonomi digital.","voiceScript":"[excited] Soalan Boss terakhir Tema dua! Pilih hujah paling bernas yang merumuskan kesan pembelajaran sepanjang hayat kepada daya saing negara.","prompt":"Mengapakah pembelajaran sepanjang hayat amat kritikal bagi tenaga kerja Malaysia dalam era Revolusi Industri 4.0?","options":["Membolehkan pekerja meningkatkan kemahiran secara berterusan agar kekal produktif dan berdaya saing menghadapi perubahan teknologi","Memastikan pelajar sekolah rendah tidak perlu menduduki sebarang penilaian pembelajaran","Menggantikan semua peranan universiti dengan perpustakaan awam semata-mata","Menggalakkan pekerja bertukar kerjaya setiap bulan tanpa menguasai kepakaran"],"correctIndex":0,"explanation":"Peningkatan kemahiran semula (reskilling) dan peningkatan kemahiran (upskilling) sepanjang hayat memastikan modal insan kekal relevan dalam ekonomi berteknologi tinggi."}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var unlockedMap = { 0: true };
  var activeNodeIdx = 0;
  var mindMapBonusDone = false;

  var acronymPill = buildAcronymPillHtml(step, nodes);

  var formulaHtml = step.formula
    ? '<div class="concept-formula-box tabular-nums" role="note" tabindex="0"><span class="formula-kicker">' + tUi("RUMUS KILAT", "QUICK FORMULA") + "</span><span>" + escapeHtml(step.formula) + "</span></div>"
    : "";

  var labHtml = step.labId
    ? '<div class="lab-shell">' +
