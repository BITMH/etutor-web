/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab03","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":3,"title":"Memetik Bintang","subtitle":"Tema 3 BM T4 KSSM — Alam Kerjaya & Kebolehpasaran Diri (SP 1.5.3), Kata Ganda & Akronim (SP 5.1.3), Apresiasi Sajak & Puisi Moden (SP 4.1.2) serta Format Surat Kiriman Rasmi & Resume.","estimatedMinutes":26,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab03-labs.js","coverIcon":"../assets/icons/bm43-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Kecekapan kamu membezakan kata ganda, akronim dan format karangan memang hebat!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Semua jenis akronim dan ciri kebolehpasaran kerjaya berjaya kamu kuasai!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula perbezaan antara kata ganda separa, berentak dan akronim.","celebrate":"[excited] Syabas! Tema ketiga Bahasa Melayu Tingkatan empat berjaya kamu selesaikan!"},"units":[{"id":"bm43-u1","title":"Unit 1: Alam Kerjaya & Kebolehpasaran Diri","subtitle":"SP 1.5.3 & 2.3.1 — Kerjaya Penerbangan, Forensik PDRM, Kemahiran Insaniah & Persediaan Temu Duga","iconType":"crown","iconUrl":"../assets/icons/bm43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Kerjaya STEM & Kebolehpasaran","voiceCaption":"Kebolehpasaran diri dalam alam kerjaya memerlukan gabungan kelayakan akademik, kemahiran bahasa, kebolehan teknologi digital serta sahsiah profesional.","voiceScript":"[warm] Selamat datang ke Tema tiga, Memetik Bintang! Tema ini membincangkan penerokaan alam kerjaya masa hadapan seperti juruterbang, pengawal trafik udara dan pegawai sains forensik P D R M. Dalam era persaingan global, sijil akademik semata-mata tidak mencukupi! Majikan mencari calon yang mempunyai KEBOLEHPASARAN DIRI iaitu kemahiran berkomunikasi dalam pelbagai bahasa, kepemimpinan kokurikulum, kemahiran menyelesaikan masalah serta keyakinan sewaktu sesi temu duga! Periksa struktur format surat permohonan rasmi dan resume di bawah!","title":"1.5.3 Kebolehpasaran Diri, Kerjaya Masa Hadapan & Temu Duga","acronym":"K•I•B•P","hook":"Bandingkan keperluan format Surat Kiriman Rasmi dengan struktur Resume Kebolehpasaran di bawah!","mediaKey":"bm43_kerjaya_penerbangan","summary":"Persediaan alam kerjaya menggabungkan kepakaran bidang (penerbangan, forensik, teknologi) dengan kemahiran insaniah, penguasaan bahasa dan etika temu duga.","bullets":["Kerjaya Bidang Khusus (Buku Teks Tema 3): (1) Juruterbang & Pengawal Trafik Udara (ketepatan masa, radar, disiplin komunikasi); (2) Pegawai Forensik Bahagian D10 PDRM (latihan asas kepolisan, ujian kecekapan & analisis bukti saintifik).","Peningkatan Kebolehpasaran Diri (SP 1.5.3): Penguasaan bahasa Melayu, Inggeris dan bahasa ketiga, rekod kepimpinan kokurikulum, sijil kemahiran digital serta kebolehan kerja berpasukan.","Etika Temu Duga Cemerlang: Berpakaian kemas dan sopan, bersikap jujur, menjawab soalan menggunakan bahasa baku yang lancar serta menzahirkan kesediaan belajar."],"labId":"bm43_surat_resume_lab","labTitle":"Arkitek Format Surat Rasmi & Resume Kerjaya","labProps":{"sec":"resume"},"examTip":"Dalam soalan temu bual atau wawancara SPM, pastikan setiap giliran bicara memaparkan kesantunan bahasa (panggilan hormat seperti Tuan/Puan) dan fakta kerjaya yang relevan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Kemahiran Keras vs Insaniah","voiceCaption":"Kelaskan enam ciri pekerja cemerlang berikut antara Kemahiran Teknikal (Keras) dengan Kemahiran Insaniah.","voiceScript":"[curious] Bezakan dua kategori kemahiran majikan ini! Asingkan keenam-enam kebolehan pekerja cemerlang berikut kepada Kemahiran Teknikal atau Kemahiran Insaniah.","prompt":"Kelaskan ciri kebolehpasaran diri berikut kepada Kemahiran Teknikal atau Kemahiran Insaniah:","buckets":[{"id":"teknikal","label":"Kemahiran Teknikal (Hard Skills)"},{"id":"insaniah","label":"Kemahiran Insaniah (Soft Skills)"}],"items":[{"text":"Mengendalikan sistem radar trafik udara dan instrumen kokpit pesawat","bucketId":"teknikal","note":"Betul! Kepakaran operasi peralatan teknikal khusus."},{"text":"Berkomunikasi dengan yakin, jelas dan bertatasusila semasa temu duga","bucketId":"insaniah","note":"Tepat! Kemahiran interpersonal dan komunikasi."},{"text":"Menjalankan ujian forensik makmal ke atas sampel DNA dan cap jari","bucketId":"teknikal","note":"Betul! Kemahiran prosedur sains dan forensik."},{"text":"Mengetuai pasukan secara kolaboratif serta mengurus tekanan kerja","bucketId":"insaniah","note":"Tepat! Kepimpinan dan kecerdasan emosi."},{"text":"Menggunakan perisian pengaturcaraan komputer dan analisis data","bucketId":"teknikal","note":"Betul! Kemahiran digital yang boleh diukur."},{"text":"Bersikap amanah, menepati masa dan beretika tinggi dalam tugas","bucketId":"insaniah","note":"Tepat! Nilai integriti dan profesionalisme diri."}],"explanation":"Graduan cemerlang menggabungkan kemahiran teknikal bidangnya dengan kemahiran insaniah seperti komunikasi, etika dan kepimpinan."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Kerjaya & Tanggungjawabnya","voiceCaption":"Padankan empat profesion yang dibincangkan dalam Tema tiga buku teks dengan tanggungjawab utamanya.","voiceScript":"[confident] Padankan setiap kerjaya daripada Tema tiga buku teks berikut dengan skop tugas utamanya!","prompt":"Padankan kerjaya berikut dengan tugas utamanya yang tepat:","pairs":[{"id":"bm43u1m1","left":"Pengawal Trafik Udara","right":"Menentukan waktu dan laluan selamat bagi pesawat berlepas dan mendarat"},{"id":"bm43u1m2","left":"Pegawai Forensik PDRM","right":"Menyiasat dan menganalisis bahan bukti saintifik di tempat kejadian jenayah"},{"id":"bm43u1m3","left":"Juruterbang Komersial","right":"Menerbangkan pesawat mengikut jadual serta prosedur penerbangan"},{"id":"bm43u1m4","left":"Penterjemah Profesional","right":"Menguasai pelbagai bahasa untuk mengalih teks tanpa mengubah maksud"}],"explanation":"Tema 3 buku teks memperkenalkan pelbagai laluan kerjaya berimpak tinggi bagi menggalakkan murid merancang masa hadapan."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Adab & Bahasa Temu Duga","voiceCaption":"Pilih respons calon temu duga yang paling tepat, sopan dan meyakinkan semasa ditanya mengenai kelemahan diri.","voiceScript":"[confident] Uji teknik menjawab soalan temu duga! Jika penemuduga bertanya tentang aspek diri yang perlu dibaiki, jawapan manakah yang paling profesional?","prompt":"Apakah cara menjawab yang PALING matang apabila penemuduga bertanyakan kelemahan diri anda?","options":["Mengakui kelemahan kecil secara jujur sambil menjelaskan langkah proaktif yang sedang diambil untuk memperbaikinya","Menafikan sebarang kelemahan dengan mengatakan diri sendiri sempurna dalam semua perkara","Menyalahkan guru atau rakan sekelas atas kegagalan masa lalu","Berhenti bercakap dan meminta penemuduga menukar soalan lain"],"correctIndex":0,"explanation":"Kejujuran yang disertai pelan penambahbaikan kendiri menunjukkan kesedaran diri dan kesungguhan untuk berkembang."}]},{"id":"bm43-u2","title":"Unit 2: Kata Ganda & Empat Jenis Akronim","subtitle":"SP 5.1.3 — Kata Ganda Penuh, Separa, Berentak & Berimbuhan serta Pengelasan 4 Jenis Akronim Rasmi","iconType":"formula","iconUrl":"../assets/icons/bm43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kata Ganda & 4 Jenis Akronim","voiceCaption":"Standard pembelajaran lima perpuluhan satu perpuluhan tiga merangkumi empat jenis kata ganda dan empat jenis akronim yang diiktiraf sebagai kata tunggal.","voiceScript":"[warm] Selamat datang ke Unit dua, Tatabahasa Kata Ganda dan Akronim! Pertama, kenali empat bentuk Kata Ganda: kata ganda penuh seperti guru-guru yang menandakan jamak; kata ganda separa seperti dedaun dan lelangit yang menggandakan suku kata awal kata dasar sahaja; kata ganda berentak seperti gunung-ganang dan terkontang-kanting yang menyesuaikan bunyi vokal atau konsonan; dan kata ganda berimbuhan seperti bantu-membantu serta keanak-anakan! Kedua, ingat bahawa AKRONIM tergolong sebagai KATA TUNGGAL, dan terbahagi kepada empat cara pembentukan seperti Yawam, Bernama, Perhilitan dan berdikari! Uji penjelajah akronim di bawah!","title":"5.1.3 Kata Ganda & Pengelasan 4 Jenis Akronim Rasmi DBP","acronym":"P•S•B•A","hook":"Klik empat jenis akronim pada penjelajah di bawah untuk melihat bagaimana rangkai kata dipendekkan!","mediaKey":"bm43_makmal_forensik","summary":"Kata ganda merangkumi penggandaan penuh, separa, berentak dan berimbuhan, manakala akronim ialah kata tunggal hasil cantuman huruf atau suku kata beberapa perkataan.","bullets":["4 Jenis Kata Ganda: (1) Penuh (buku-buku, cantik-cantik); (2) Separa (bebola, tetamu, berlari-lari); (3) Berentak — pengulangan vokal (sayur-mayur), pengulangan konsonan (gunung-ganang), bebas (ulang-alik); (4) Berimbuhan (tolong-menolong, bersalam-salaman).","4 Jenis Akronim (Kata Tunggal): (1) Cantuman huruf awal (ABIM, ADUN, KPM); (2) Cantuman suku kata (pawagam, tadika, cerpen, Yawam); (3) Cantuman huruf dan suku kata (Perhilitan, Intan, Mara); (4) Cantuman bahagian awal kata dengan kata lain (berdikari, purata, debunga).","Hukum Lewah Kata Ganda: Jangan letakkan kata bilangan tentu/jamak sebelum kata ganda penuh! SALAH: 'semua guru-guru', 'pelbagai buku-buku'. BETUL: 'semua guru', 'pelbagai buku'."],"labId":"bm43_akronim_ganda_lab","labTitle":"Penjelajah 4 Jenis Akronim Rasmi DBP (SP 5.1.3)","labProps":{"tab":"sukukata"},"examTip":"Pengecualian kelewahan kata ganda! Kata ganda yang membawa maksud tunggal atau nama khas (cth. rama-rama, kupu-kupu, kanak-kanak, anai-anai) BOLEH didahului oleh kata bilangan seperti 'banyak rama-rama'!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Jenis Kata Ganda & Akronim","voiceCaption":"Kelaskan enam perkataan berikut antara Kata Ganda Separa, Kata Ganda Berentak dan Akronim.","voiceScript":"[curious] Uji pengkelasan tatabahasa kamu! Asingkan keenam-enam perkataan ini kepada Kata Ganda Separa, Kata Ganda Berentak atau Akronim.","prompt":"Kelaskan setiap perkataan berikut mengikut kategori SP 5.1.3 yang tepat:","buckets":[{"id":"separa","label":"Kata Ganda Separa"},{"id":"berentak","label":"Kata Ganda Berentak"},{"id":"akronim","label":"Akronim"}],"items":[{"text":"lelayang, tetamu, kekuda","bucketId":"separa","note":"Betul! Menggandakan suku kata awal kata dasar dengan vokal berubah kepada 'e' pepet."},{"text":"kuih-muih, gotong-royong","bucketId":"berentak","note":"Tepat! Penyesuaian bunyi rima vokal dan konsonan."},{"text":"cerpen (cerita pendek) & pawagam","bucketId":"akronim","note":"Betul! Akronim cantuman suku kata."},{"text":"berdikari (berdiri di atas kaki sendiri)","bucketId":"akronim","note":"Tepat! Akronim cantuman bahagian kata."},{"text":"tercungap-cungap & berlari-lari","bucketId":"separa","note":"Betul! Penggandaan separa kata kerja berimbuhan."},{"text":"compang-camping & simpang-siur","bucketId":"berentak","note":"Tepat! Pengulangan bunyi konsonan berentak."}],"explanation":"Perhatikan bahawa 'tercungap-cungap' hanya menggandakan kata dasar 'cungap' tanpa mengulang imbuhan 'ter-', maka ia tergolong dalam kata ganda separa."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Ejaan Akronim Rasmi","voiceCaption":"Ramalkan cara penulisan huruf besar atau huruf kecil yang betul bagi akronim kata nama am dan kata nama khas.","voiceScript":"[curious] Ramalkan hukum ejaan akronim! Bagaimanakah cara ejaan tepat bagi kata nama khas berbanding kata nama am berbentuk akronim?","hook":"Ingat: kata nama khas seperti Perhilitan bermula dengan huruf besar atau huruf besar penuh seperti ADUN!","scenario":"Empat akronim digunakan dalam ayat: Bernama / pawagam / Perhilitan / ADUN.","prompt":"Manakah padanan hukum ejaan akronim yang BETUL mengikut Pedoman Ejaan DBP?","options":["ADUN (huruf besar semua bagi singkatan nama khas), Perhilitan (huruf besar pangkal), pawagam (huruf kecil semua kerana kata nama am)","Semua akronim wajib dieja dengan huruf besar sepenuhnya termasuk tadika dan cerpen","Akronim tidak boleh menerima sebarang imbuhan seperti berdikari atau dicerpenkan","Pawagam ialah kata majmuk mantap yang terbentuk daripada panggung wayang"],"correctIndex":0,"proofLabId":"bm43_akronim_ganda_lab","proofState":{"tab":"hurufsuku"},"explanation":"Akronim kata nama khas daripada huruf awal penuh ditulis huruf besar semua (ADUN, KPM); akronim nama khas daripada gabungan suku kata ditulis huruf besar pada huruf pertama sahaja (Perhilitan, Bernama); akronim kata nama am ditulis huruf kecil semua (pawagam, tadika, berdikari)."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Kesalahan Kata Ganda Lewah","voiceCaption":"Pilih ayat yang menggunakan kata ganda tanpa sebarang kelewahan bilangan.","voiceScript":"[confident] Pilih ayat yang menggunakan kata ganda dengan betulnya tanpa kelewahan tatabahasa!","prompt":"Pilih ayat yang menggunakan kata ganda dengan BETUL dan tidak lewah:","options":["Banyak rama-rama berterbangan di taman botani pada waktu pagi","Kebanyakan pekerja-pekerja syarikat penerbangan itu mahir berbahasa Inggeris","Saling bantu-membantu amalan mulia di tempat kerja setiap hari","Pelbagai jenis-jenis buah tempatan dijual di pasar tani tersebut"],"correctIndex":0,"explanation":"'rama-rama' ialah kata ganda semu (menunjukkan satu ekor atau haiwan tertentu), maka 'banyak rama-rama' adalah betul! Sebaliknya 'kebanyakan pekerja-pekerja', 'pelbagai jenis-jenis' dan 'saling bantu-membantu' adalah lewah."}]},{"id":"bm43-u3","title":"Unit 3: Format Surat Kiriman Rasmi & Penulisan Kerjaya","subtitle":"SP 3.3.1 & 3.4.3 — Struktur Surat Rasmi Permohonan Kerja, Laras Bahasa Rasmi & Maklumat Resume","iconType":"book","iconUrl":"../assets/icons/bm43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Laras & Format Surat Kiriman Rasmi","voiceCaption":"Surat kiriman rasmi mempunyai format khusus meliputi alamat pengirim, garis pemisah, alamat penerima, tarikh berhuruf besar pada bulan, tajuk bergaris dan pengakuan rasmi.","voiceScript":"[warm] Selamat datang ke Unit tiga! Apabila memohon pekerjaan, biasiswa atau mengemukakan aduan rasmi, penulisan SURAT KIRIMAN RASMI wajib mematuhi format tetap untuk mengelakkan pemotongan markah format dalam karangan S P M! Ingat susunannya: nama dan alamat pengirim di kiri atas diikuti satu garis pemisah panjang. Di bawah garis, tulis jawatan dan alamat penerima di sebelah kiri, manakala tarikh ditulis sejajar dengan baris akhir alamat penerima di sebelah kanan dengan nama bulan berhuruf besar sepenuhnya seperti 27 NOVEMBER 2026! Tajuk surat pula digariskan tanpa titik di hujung, dan perenggan isi bermula dari nombor dua!","title":"Format & Laras Bahasa Surat Kiriman Rasmi Permohonan Kerjaya","acronym":"A•G•T•P","hook":"Semak kedudukan tarikh, panggilan hormat dan penomboran perenggan pada Arkitek Surat Rasmi di bawah!","summary":"Surat kiriman rasmi menggunakan laras bahasa rasmi yang padat, sopan dan teratur mengikut lapan komponen format rasmi DBP/KPM.","bullets":["8 Komponen Format Wajib: (1) Nama & alamat pengirim di kiri atas; (2) Garis pemisah melintang; (3) Jawatan & alamat penerima; (4) Tarikh di kanan sebaris baris akhir alamat penerima (bulan HURUF BESAR); (5) Panggilan hormat (Tuan/Puan); (6) Tajuk surat (huruf besar pada pangkal kata utama & digaris, tiada noktah); (7) Perenggan isi bernombor 2, 3... (perenggan 1 & penutup TIADA nombor); (8) Pengakuan 'Yang benar,' + tandatangan + nama huruf besar.","Laras Bahasa Rasmi: Elakkan singkatan SMS atau kata ganti nama tidak formal; guna 'saya' dan 'pihak tuan/puan'.","Kandungan Surat Permohonan Kerjaya: Nyatakan jawatan dipohon, kelayakan akademik, pengalaman/kemahiran relevan, dan lampiran resume."],"labId":"bm43_surat_resume_lab","labTitle":"Arkitek Format Surat Rasmi & Resume","labProps":{"sec":"surat"},"examTip":"Kesalahan kecil yang sering memotong markah format surat rasmi: (1) Meletakkan noktah di hujung tajuk surat; (2) Menulis nombor '1.' pada perenggan pertama; (3) Menggunakan 'Yang ikhlas,' bukannya 'Yang benar,'!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Komponen Surat Kiriman Rasmi","voiceCaption":"Susun lapan bahagian surat kiriman rasmi dari atas hingga ke penutup mengikut tertib format peperiksaan.","voiceScript":"[confident] Susun komponen-komponen surat kiriman rasmi ini dari bahagian paling atas hingga ke bahagian penutup!","prompt":"Susun urutan format Surat Kiriman Rasmi dari atas ke bawah:","hint":"Mulakan dengan alamat pengirim dan garis pemisah...","answerTokens":["Nama dan alamat pengirim diikuti garis pemisah melintang","Jawatan serta alamat penerima sejajar dengan tarikh di sebelah kanan","Panggilan hormat Tuan atau Puan dan tajuk surat bergaris","Perenggan pendahuluan tanpa nombor, perenggan isi bernombor dan pengakuan Yang benar,"],"distractors":["Ucapan salam mesra dan pengakuan Yang ikhlas, di bahagian penutup","Tarikh ditulis di bahagian paling atas di atas alamat pengirim"],"explanation":"Format surat kiriman rasmi meletakkan alamat pengirim dahulu, garis pemisah, alamat penerima + tarikh di kanan, panggilan hormat, tajuk bergaris, perenggan 1 tanpa nombor, isi bernombor, penutup dan 'Yang benar,'."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Bahagian Surat & Ejaan Betul","voiceCaption":"Padankan empat komponen surat kiriman rasmi dengan format penulisannya yang tepat.","voiceScript":"[curious] Semak ketelitian format penulisan kamu! Padankan setiap bahagian surat kiriman rasmi ini dengan contoh penulisan yang tepat.","prompt":"Padankan bahagian surat kiriman rasmi dengan contoh yang betul:","pairs":[{"id":"bm43u3m1","left":"Penulisan Tarikh Surat Rasmi","right":"27 NOVEMBER 2026 (nama bulan huruf besar)"},{"id":"bm43u3m2","left":"Tajuk Surat Rasmi","right":"Permohonan Jawatan Pegawai Trafik Udara (digaris, tanpa noktah)"},{"id":"bm43u3m3","left":"Pengakuan Penutup Surat Rasmi","right":"Yang benar, (untuk permohonan/aduan individu)"},{"id":"bm43u3m4","left":"Penulisan Alamat Penerima","right":"Baris terakhir alamat (cth. 50480 KUALA LUMPUR.) sejajar tarikh"}],"explanation":"'Yang ikhlas,' digunakan dalam surat kiriman tidak rasmi; surat rasmi menggunakan 'Yang benar,' atau 'Yang menjalankan amanah,' (jika mewakili jawatan rasmi)."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kesalahan Format Surat Rasmi","voiceCaption":"Kenal pasti kesilapan format dalam petikan kepala dan penutup surat kiriman rasmi permohonan kerja.","voiceScript":"[confident] Kenal pasti kesalahan format yang terdapat pada penulisan surat rasmi berikut!","prompt":"Antara yang berikut, manakah format yang SALAH dalam penulisan surat kiriman rasmi?","options":["Menulis nombor '1.' pada perenggan pertama surat dan menutup surat dengan 'Yang ikhlas,'","Meletakkan garis pemisah melintang di bawah alamat pengirim","Menulis nama penuh pengirim dalam huruf besar di bawah tandatangan","Menggariskan tajuk surat tanpa meletakkan tanda noktah di hujungnya"],"correctIndex":0,"explanation":"Perenggan pertama dan perenggan akhir surat rasmi TIDAK boleh dinomborkan, dan pengakuan rasmi ialah 'Yang benar,', bukannya 'Yang ikhlas,'."}]},{"id":"bm43-u4","title":"Unit 4: Apresiasi Sajak & Puisi Waja Diri","subtitle":"SP 4.1.2 — Memahami Maksud Rangkap Sajak, Gaya Bahasa (Metafora, Personifikasi, Anafora) & Nilai Kerjaya","iconType":"scale","iconUrl":"../assets/icons/bm43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Apresiasi Sajak & Gaya Bahasa","voiceCaption":"Apresiasi puisi moden mengupas maksud tersirat setiap rangkap, gaya bahasa seperti metafora dan personifikasi, serta bentuk bebas sajak berbanding puisi tradisional.","voiceScript":"[warm] Selamat datang ke Unit empat, Apresiasi Puisi Moden Sajak! Dalam Tema tiga bertajuk Memetik Bintang, sajak menggambarkan cita-cita tinggi generasi muda untuk mencorak kejayaan melalui usaha yang tidak mengenal penat lelah. Untuk menguasai soalan Kertas dua bahagian puisi, pastikan anda mahir membezakan gaya bahasa utama! Metafora menggabungkan kata konkrit dan abstrak secara langsung tanpa kata seperti, misalnya 'memetik bintang' atau 'lautan ilmu'. Personifikasi memberi sifat manusia kepada benda bukan hidup seperti 'angin berbisik'. Anafora mengulang perkataan di awal baris berturutan, manakala epifora mengulang di akhir baris!","title":"4.1.2 Apresiasi Sajak Moden, Gaya Bahasa & Unsur Bunyi","acronym":"M•P•A•E","hook":"Bezakan metafora (tanpa 'bagai/seperti'), simile (ada 'bagai/seperti'), anafora (awal baris) dan epifora (akhir baris)!","summary":"Sajak berbentuk bebas dan sarat dengan gaya bahasa kiasan seperti metafora, simile, personifikasi, anafora serta unsur bunyi asonansi dan aliterasi.","bullets":["Gaya Bahasa Perbandingan: Simile (menggunakan 'seperti, bak, bagai, laksana, umpama'); Metafora (gabungan langsung konkrit + abstrak tanpa kata pembanding, cth. 'tangga kejayaan'); Personifikasi (benda diberi sifat manusia, cth. 'mentari tersenyum').","Gaya Bahasa Pengulangan: Anafora (pengulangan kata pada AWAL baris berturutan); Epifora (pengulangan kata pada AKHIR baris berturutan); Responsi (pengulangan kata di TENGAH baris).","Unsur Bunyi: Asonansi (pengulangan bunyi VOKAL a, e, i, o, u dalam satu baris); Aliterasi (pengulangan bunyi KONSONAN dalam satu baris)."],"examTip":"Semasa menjawab soalan gaya bahasa di SPM, jika contoh tersebut ialah metafora seperti 'memetik bintang', tulis nama gaya bahasa tepat ('metafora') — jangan hanya menulis 'bahasa kiasan'!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Gaya Bahasa Sajak & Contoh","voiceCaption":"Padankan lima istilah gaya bahasa sajak dengan contoh baris puisi yang tepat.","voiceScript":"[confident] Uji ketajaman analisis puisi kamu! Padankan kelima-lima istilah gaya bahasa ini dengan contoh baris sajaknya.","prompt":"Padankan istilah gaya bahasa puisi dengan contoh yang tepat:","pairs":[{"id":"bm43u4m1","left":"Metafora","right":"Menyusuri lautan ilmu demi memetik bintang impian"},{"id":"bm43u4m2","left":"Simile","right":"Tekad anak muda teguh bak karang di lautan"},{"id":"bm43u4m3","left":"Personifikasi","right":"Ombak cabaran terus memanggil langkah perwira"},{"id":"bm43u4m4","left":"Anafora","right":"Biar keringat membasahi bumi / Biar lelah menguji diri"},{"id":"bm43u4m5","left":"Asonansi","right":"Pengulangan bunyi vokal 'a' dalam baris 'cita-cita anak bangsa'"}],"explanation":"Anafora mengulang kata 'Biar' di permulaan baris; simile menggunakan kata pembanding 'bak'; metafora menggabungkan langsung 'lautan' (konkrit) dan 'ilmu' (abstrak)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Ciri Sajak vs Puisi Tradisional","voiceCaption":"Asingkan enam ciri bentuk puisi berikut antara Sajak (Puisi Moden) dengan Gurindam/Pantun (Puisi Tradisional).","voiceScript":"[curious] Bezakan puisi moden daripada puisi tradisional! Asingkan keenam-enam ciri bentuk berikut.","prompt":"Kelaskan ciri bentuk puisi berikut kepada Sajak (Moden) atau Puisi Tradisional:","buckets":[{"id":"sajak","label":"Sajak (Puisi Moden - Bebas)"},{"id":"tradisi","label":"Puisi Tradisional (Terikat)"}],"items":[{"text":"Bilangan baris setiap rangkap tidak sama dan bebas","bucketId":"sajak","note":"Betul! Sajak tidak terikat kepada bilangan baris tetap."},{"text":"Rima akhir terikat seperti a-a (gurindam) atau a-b-a-b (pantun)","bucketId":"tradisi","note":"Tepat! Puisi tradisional mempunyai pola rima akhir yang tetap."},{"text":"Jumlah suku kata sebaris bebas mengikut aliran nada penyair","bucketId":"sajak","note":"Betul! Tidak terikat 8–12 suku kata sebaris."},{"text":"Terdiri daripada pembayang dan maksud (pantun empat kerat)","bucketId":"tradisi","note":"Tepat! Struktur khas pantun tradisional."},{"text":"Terdiri daripada dua baris serangkap berisi syarat dan akibat (gurindam)","bucketId":"tradisi","note":"Betul! Ciri asas gurindam."},{"text":"Rima akhir bebas (cth. abcd, aabbc)","bucketId":"sajak","note":"Tepat! Sajak bebas memilih rima akhirnya."}],"explanation":"Sajak ialah puisi moden berbentuk bebas, manakala pantun, syair dan gurindam ialah puisi tradisional berbentuk terikat."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Maksud Tersirat Rangkap Sajak","voiceCaption":"Pilih tafsiran yang tepat bagi ungkapan memetik bintang dalam konteks Tema tiga buku teks.","voiceScript":"[confident] Berdasarkan judul Tema tiga Memetik Bintang, apakah maksud perlambangan yang paling tepat bagi ungkapan memetik bintang?","prompt":"Apakah maksud perlambangan bagi ungkapan 'memetik bintang' dalam konteks tema kerjaya dan impian remaja?","options":["Berusaha gigih menggapai cita-cita dan kejayaan tertinggi yang diidamkan","Mencerap planet dan bintang pada waktu malam menggunakan teleskop sahaja","Mengharapkan keajaiban datang tanpa berusaha belajar","Menukar kerjaya dengan kerap sebelum menguasai sebarang kemahiran"],"correctIndex":0,"explanation":"'Memetik bintang' ialah metafora kepada usaha mencapai puncak kecemerlangan dan cita-cita kerjaya yang tinggi."}]},{"id":"bm43-u5","title":"Unit 5: Cabaran Boss SPM — Memetik Bintang","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Morfologi Kata Ganda/Akronim, Surat Rasmi, Puisi & Karangan Kerjaya","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Pemahaman Akronim SP 5.1.3","voiceCaption":"Soalan Boss pertama menguji pengenalpastian kata akronim cantuman huruf awal dan suku kata daripada petikan alam kerjaya.","voiceScript":"[excited] Selamat datang ke Unit Boss Tema tiga! Soalan pertama menguji kepekaan kamu membezakan jenis akronim mengikut Standard Pembelajaran lima perpuluhan satu perpuluhan tiga!","prompt":"Pilih padanan akronim cantuman SUKU KATA sahaja yang kesemuanya betul:","options":["Yawam, tadika, pawagam, cerpen","PDRM, ADUN, KPM, SPM","Perhilitan, Mara, berdikari, PDRM","berdikari, purata, ADUN, tadika"],"correctIndex":0,"explanation":"Yawam (Yayasan Anak Watan Malaysia), tadika (taman didikan kanak-kanak), pawagam (panggung wayang gambar) dan cerpen (cerita pendek) kesemuanya terbentuk daripada cantuman suku kata."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Jenis Akronim & Kata Tunggal","voiceCaption":"Ramalkan golongan bentuk kata bagi perkataan berdikari dan Perhilitan apabila diuji dalam soalan Morfologi Kertas dua.","voiceScript":"[curious] Soalan Boss kedua! Dalam soalan Morfologi Kertas dua yang meminta anda menyenaraikan kata tunggal daripada petikan, adakah akronim seperti berdikari dan Perhilitan dikira sebagai kata tunggal?","hook":"Sahkan kategori akronim dalam Tatabahasa Dewan pada makmal di Unit 2!","scenario":"Calon diminta menyenaraikan kata tunggal daripada satu petikan yang mengandungi perkataan 'berdikari', 'tadika', dan 'kerjaya'.","prompt":"Apakah status golongan bentuk kata bagi akronim seperti 'berdikari' dan 'tadika' mengikut Tatabahasa Dewan?","options":["Tergolong dalam bentuk KATA TUNGGAL walaupun terhasil daripada gabungan beberapa perkataan","Tergolong dalam bentuk kata majmuk kerana berasal daripada lebih daripada satu perkataan","Tergolong dalam kata ganda separa","Bukan mana-mana bentuk kata dalam bahasa Melayu"],"correctIndex":0,"proofLabId":"bm43_akronim_ganda_lab","proofState":{"tab":"bahagian"},"explanation":"Mengikut Tatabahasa Dewan, semua akronim tergolong sebagai kata tunggal (akronim) kerana telah sebati menjadi satu kata baharu yang utuh."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Bina Ayat Permohonan Rasmi","voiceCaption":"Susun ayat pembuka surat kiriman rasmi permohonan pekerjaan yang sopan dan gramatis.","voiceScript":"[confident] Soalan Boss ketiga! Susun ayat pembuka perenggan pertama surat kiriman rasmi permohonan jawatan yang gramatis tanpa kesilapan kata sendi!","prompt":"Susun ayat pendahuluan surat kiriman rasmi permohonan kerja yang paling gramatis:","hint":"Mulakan dengan 'Merujuk perkara di atas,' (BUKAN 'Merujuk kepada perkara di atas')...","answerTokens":["Merujuk perkara di atas,","saya dengan sukacitanya memohon","jawatan Penolong Pegawai Sains","di syarikat tuan."],"distractors":["Merujuk kepada perkara di atas,","aku mahu meminta kerja ini dengan segera."],"explanation":"Kata kerja transitif 'merujuk' diikuti terus oleh objek 'perkara di atas' tanpa kata sendi 'kepada' ('Merujuk kepada' adalah kesalahan lazim!)."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Istilah Morfologi & Puisi","voiceCaption":"Padankan empat istilah bahasa Tema tiga dengan contoh tepatnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat istilah bahasa Tema tiga ini dengan contohnya yang tepat.","prompt":"Padankan istilah berikut dengan contoh yang betul:","pairs":[{"id":"bm43b4m1","left":"Kata ganda separa berimbuhan","right":"berkejar-kejaran / tolong-menolong"},{"id":"bm43b4m2","left":"Akronim huruf dan suku kata","right":"Perhilitan / Intan"},{"id":"bm43b4m3","left":"Penutup surat rasmi individu","right":"Yang benar,"},{"id":"bm43b4m4","left":"Gaya bahasa pengulangan awal baris","right":"Anafora"}],"explanation":"Penguasaan tepat terhadap morfologi SP 5.1.3, format surat rasmi dan gaya bahasa sajak memberi kelebihan besar di Kertas 1 dan Kertas 2."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Suntingan Ayat Kerjaya SPM","voiceCaption":"Pilih ayat yang betul tatabahasanya berkaitan kebolehpasaran graduan dan latihan kemahiran.","voiceScript":"[excited] Soalan Boss terakhir Tema tiga! Pilih ayat yang bebas daripada kesalahan kata sendi, imbuhan dan kata ganda!","prompt":"Pilih ayat yang PALING GRAMATIS untuk dimasukkan ke dalam karangan bertemakan kerjaya:","options":["Graduan perlu menguasai kemahiran komunikasi bagi meningkatkan kebolehpasaran diri dalam sektor pekerjaan","Graduan perlu menguasai kemahiran komunikasi demi untuk meningkatkan kebolehpasaran diri di dalam sektor pekerjaan","Para graduan-graduan dinasihati agar merujuk kepada iklan jawatan kosong di laman sesawang rasmi","Saling hormat-menghormati antara rakan sekerja dapat mewujudkan suasana pejabat yang harmoni"],"correctIndex":0,"explanation":"'demi untuk', 'di dalam sektor', 'para graduan-graduan', 'merujuk kepada' dan 'saling hormat-menghormati' semuanya mengandungi kesalahan kelewahan atau kata sendi."}]}]};</script>

  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";
}

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

    document.body.classList.toggle("wf-edition", Boolean(CHAPTER && CHAPTER.enableWebflowEdition));

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}
