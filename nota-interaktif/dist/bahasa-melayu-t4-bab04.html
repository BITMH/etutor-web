/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab04","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":4,"title":"Menjulang Harapan di Bumi Bertuah","subtitle":"Tema 4 BM T4 KSSM — Pencapaian Atlet Negara & Sektor Agromakanan, Golongan Kata Nama (SP 5.2.1), Apresiasi Gurindam (SP 4.1.2) serta Penyusunan Fakta & Hujah.","estimatedMinutes":26,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab04-labs.js","coverIcon":"../assets/icons/bm44-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan golongan kata nama, penjodoh bilangan dan gurindam kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Semua hukum kata ganti nama dan penyusunan hujah berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula perbezaan kami dengan kita serta penggunaan kata bilangan dan penjodoh bilangan.","celebrate":"[excited] Syabas! Tema keempat Bahasa Melayu Tingkatan empat berjaya kamu selesaikan!"},"units":[{"id":"bm44-u1","title":"Unit 1: Kecemerlangan Sukan & Agromakanan Negara","subtitle":"SP 1.3.1 & 2.2.1 — Kejayaan Atlet Bertaraf Dunia, Sektor Pertanian Moden & Menyusun Fakta Hujah","iconType":"crown","iconUrl":"../assets/icons/bm44-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Sukan Negara & Pertanian Moden","voiceCaption":"Tema empat menyoroti sumbangan atlet kebangsaan di pentas antarabangsa serta transformasi sektor pertanian moden sebagai teras ekonomi bertuah.","voiceScript":"[warm] Selamat datang ke Tema empat Bahasa Melayu Tingkatan empat, Menjulang Harapan di Bumi Bertuah! Tema ini menggabungkan dua bidang kebanggaan negara: pertama, pencapaian gemilang atlet Malaysia seperti acara keirin berbasikal trek, pencak silat dan skuasy di Kejohanan Dunia serta Sukan Asia; kedua, sumbangan para peladang dan usahawan tani moden yang memanfaatkan teknologi hidroponik serta sistem pemasaran bersepadu! Dalam standard satu perpuluhan tiga perpuluhan satu, pelajar dilatih mendengar dan menyusun fakta serta hujah secara tersusun sebelum mengulas atau menulis laporan!","title":"1.3.1 Fakta Sukan & Agromakanan serta Penyusunan Hujah","acronym":"F•H•B•K","hook":"Kenali bagaimana fakta pencapaian dan huraian sebab-akibat disusun membentuk hujah yang bernas!","mediaKey":"bm44_velodrom_basikal","summary":"Tema 4 mengangkat martabat atlet bertaraf dunia dan peladang moden; kemahiran mendengar dan bertutur menekankan susunan fakta, bukti dan hujah secara logik.","bullets":["Kecemerlangan Sukan Malaysia (Buku Teks Tema 4): Atlet keirin (pingat emas Kejohanan Dunia & Sukan Asia), pencak silat (Sukan SEA & Dunia) dan skuasy remaja antarabangsa membuktikan disiplin latihan dan sokongan sains sukan mampu bersaing di peringkat global.","Pertanian Moden & Agromakanan: Penggunaan rumah hijau, fertigasi, biji benih bermutu serta penjenamaan hasil tani menaikkan pendapatan peladang dan menjamin sekuriti makanan negara.","Susunan Hujah Tersusun (SP 1.3.1): Pernyataan fakta -> Huraian mekanisme/sebab -> Bukti pencapaian/angka -> Kesimpulan."],"examTip":"Apabila diminta mengulas bahan grafik seperti jadual pingat atlet atau statistik keluasan tanaman, jangan sekadar menyalin nombor — bandingkan aliran meningkat atau menyusut dan nyatakan puncanya!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Fakta Sukan vs Strategi Agromakanan","voiceCaption":"Kelaskan enam pernyataan berikut mengikut bidang Sukan Berprestasi Tinggi atau Sektor Agromakanan Moden.","voiceScript":"[curious] Asingkan keenam-enam fakta daripada Tema empat buku teks ini kepada sektor Sukan Berprestasi Tinggi atau Agromakanan Moden.","prompt":"Kelaskan pernyataan berikut kepada Sukan Berprestasi Tinggi atau Agromakanan Moden:","buckets":[{"id":"sukan","label":"Sukan Berprestasi Tinggi"},{"id":"tani","label":"Agromakanan & Pertanian Moden"}],"items":[{"text":"Latihan intensif acara pecut dan keirin di velodrom bertaraf antarabangsa","bucketId":"sukan","note":"Betul! Merujuk kejayaan jaguh berbasikal trek negara."},{"text":"Aplikasi sistem fertigasi dan sensor kelembapan tanah secara automatik","bucketId":"tani","note":"Tepat! Inovasi pertanian pintar meningkatkan hasil tanaman."},{"text":"Penerapan sains sukan serta pemakanan atlet untuk ketahanan fizikal","bucketId":"sukan","note":"Betul! Sokongan MSN dan ISN dalam sukan elit."},{"text":"Pembungkusan produk hiliran segar dan pensijilan keselamatan makanan","bucketId":"tani","note":"Tepat! Meningkatkan nilai tambah produk usahawan tani."},{"text":"Pencapaian pingat emas Sukan SEA dan Kejohanan Dunia secara konsisten","bucketId":"sukan","note":"Betul! Rekod kejayaan atlet kebangsaan."},{"text":"Jaminan bekalan makanan negara agar mengurangkan kebergantungan import","bucketId":"tani","note":"Tepat! Matlamat utama sektor agromakanan negara."}],"explanation":"Kedua-dua sektor sukan dan pertanian memerlukan inovasi, disiplin serta sokongan teknologi untuk menjulang nama negara."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Hujah Kejayaan Atlet","voiceCaption":"Susun empat ayat menjadi satu hujah yang logik mengenai peranan sains sukan dalam kejayaan atlet.","voiceScript":"[confident] Susun empat bahagian hujah ini mengikut tertib logik fakta, huraian, bukti dan rumusan!","prompt":"Susun hujah tentang peranan sains sukan dalam kecemerlangan atlet negara:","hint":"Mulakan dengan pernyataan utama, diikuti penjelasan mekanisme, bukti dan rumusan...","answerTokens":["Penerapan sains sukan merupakan faktor utama peningkatan prestasi atlet kebangsaan.","Analisis biomekanik dan pemakanan khusus membantu atlet memaksimumkan kelajuan serta mengurangkan risiko kecederaan.","Buktinya, atlet berbasikal trek dan skuasy negara berjaya menjuarai kejohanan dunia.","Oleh itu, pelaburan berterusan dalam penyelidikan sukan wajar dipergiat."],"distractors":["Walau bagaimanapun, atlet tidak perlu berlatih sekiranya mempunyai alatan mahal.","Kesimpulannya, pertanian moden bergantung pada baja organik sahaja."],"explanation":"Urutan Hujah -> Huraian -> Contoh Bukti -> Kesimpulan menghasilkan penyampaian lisan dan penulisan yang meyakinkan."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ulasan Data Sektor Pertanian","voiceCaption":"Pilih pernyataan ulasan yang paling tepat berdasarkan maklumat peningkatan hasil pertanian moden.","voiceScript":"[confident] Apakah tafsiran paling tepat bagi perubahan nilai eksport hasil tani yang melonjak selepas pengenalan teknologi pertanian pintar?","prompt":"Apakah kesimpulan paling tepat jika nilai eksport buah-buahan tropika meningkat setiap tahun selepas petani mengamalkan pertanian pintar?","options":["Penggunaan teknologi moden meningkatkan kualiti dan kuantiti hasil tani untuk menembusi pasaran antarabangsa","Petani tidak lagi memerlukan tanah atau air untuk menanam pokok buah-buahan","Permintaan makanan di dalam negara telah menurun dengan mendadak","Kos pengangkutan udara menjadi percuma bagi semua pengusaha tani"],"correctIndex":0,"explanation":"Teknologi pertanian pintar meningkatkan produktiviti serta kualiti produk agar memenuhi piawaian eksport."}]},{"id":"bm44-u2","title":"Unit 2: Golongan Kata Nama & Kata Ganti Nama","subtitle":"SP 5.2.1 — Kata Nama Am, Kata Nama Khas, Kata Ganti Nama (kami/kita, beliau/ia) & Penjodoh Bilangan","iconType":"book","iconUrl":"../assets/icons/bm44-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Golongan Kata Nama SP 5.2.1","voiceCaption":"Golongan kata nama terbahagi kepada kata nama am, kata nama khas dan kata ganti nama yang tertakluk kepada hukum penggunaan huruf besar dan kesesuaian konteks.","voiceScript":"[warm] Selamat datang ke Unit dua, Tatabahasa Golongan Kata Nama! Mengikut standard lima perpuluhan dua perpuluhan satu, terdapat tiga subgolongan utama: Kata Nama Am, Kata Nama Khas dan Kata Ganti Nama! Ingat perangkap S P M paling kerap untuk Kata Ganti Nama: pertama, kata ganti nama diri ketiga BELIAU hanya digunakan untuk orang yang dihormati seperti menteri, guru atau tokoh masyarakat — JANGAN sekali-kali guna beliau untuk pencuri atau kanak-kanak! Kedua, KITA merangkumi penutur dan pendengar, manakala KAMI mengecualikan pendengar! Ketiga, kata ganti nama IA hanya untuk manusia, bukan benda atau haiwan! Dan keempat, perhatikan penjodoh bilangan apabila digandingkan dengan kata bilangan seperti setiap, seluruh dan para — tidak boleh digunakan bersama!","title":"5.2.1 Kata Nama Am, Khas, Kata Ganti Nama & Hukum Kata Bilangan","acronym":"A•K•G•B","hook":"Terokai tiga kategori Kata Nama pada makmal di bawah beserta perangkap ejaan dan penggunaannya!","mediaKey":"bm44_pertanian_moden","summary":"Kata nama merangkumi Kata Nama Am, Kata Nama Khas dan Kata Ganti Nama (diri, tunjuk, tanya); penggunaan 'beliau', 'ia', 'kami/kita' serta kata bilangan ada syarat ketat.","bullets":["Kata Nama Am vs Kata Nama Khas: Kata Nama Khas wajib huruf besar pada huruf pertama setiap perkataan utama (cth. Institut Penyelidikan dan Kemajuan Pertanian Malaysia, Sukan SEA); kata sendi/hubung di tengah ('dan', 'di') kekal huruf kecil.","Hukum Kata Ganti Nama Diri: 'beliau' = orang dihormati (salah untuk penjenayah/kanak-kanak); 'dia'/'ia' = manusia sahaja (salah untuk benda, tempat atau haiwan!); 'kita' = termasuk pendengar; 'kami' = tidak termasuk pendengar; 'mereka' tidak boleh digandakan menjadi 'mereka-mereka'.","Kata Bilangan + Penjodoh Bilangan: Kata bilangan tentu (dua orang guru) dan himpunan (ketiga-tiga buah kereta) perlukan penjodoh bilangan; kata bilangan tak tentu ('semua', 'segala', 'seluruh', 'setiap', 'para') DILARANG diikuti penjodoh bilangan (kecuali 'beberapa buah rumah')."],"labId":"bm44_kata_nama_lab","labTitle":"Pengelas Golongan Kata Nama (SP 5.2.1)","labProps":{"knKey":"ganti"},"examTip":"Perangkap klasik SPM: 'setengah-setengah' (betul = sebahagian), 'setengah' (salah jika bermaksud sebahagian, kerana setengah ialah 1/2!). 'berbagai' salah, wajib 'pelbagai' atau 'berbagai-bagai'!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Subgolongan Kata Nama","voiceCaption":"Kelaskan enam perkataan daripada teks sukan dan pertanian kepada Kata Nama Am, Kata Nama Khas atau Kata Ganti Nama.","voiceScript":"[curious] Uji pengenalan kata kamu! Asingkan keenam-enam perkataan ini kepada Kata Nama Am, Kata Nama Khas atau Kata Ganti Nama.","prompt":"Kelaskan setiap perkataan berikut mengikut subgolongan Kata Nama yang betul:","buckets":[{"id":"am","label":"Kata Nama Am"},{"id":"khas","label":"Kata Nama Khas"},{"id":"ganti","label":"Kata Ganti Nama"}],"items":[{"text":"velodrom & kejayaan","bucketId":"am","note":"Betul! Kata nama am konkrit (velodrom) dan abstrak (kejayaan)."},{"text":"Majlis Sukan Negara (MSN)","bucketId":"khas","note":"Tepat! Nama rasmi badan atau institusi."},{"text":"beliau & baginda","bucketId":"ganti","note":"Betul! Kata ganti nama diri ketiga kehormat."},{"text":"Sukan Asia Jakarta-Palembang","bucketId":"khas","note":"Tepat! Nama temasya sukan antarabangsa khusus."},{"text":"sini, situ, sana","bucketId":"ganti","note":"Betul! Kata ganti nama tunjuk tempat."},{"text":"usahawan & benih","bucketId":"am","note":"Tepat! Kata nama am bernyawa dan tak bernyawa."}],"explanation":"Menguasai ketiga-tiga subgolongan kata nama membantu dalam soalan analisis morfologi dan pengesanan kesalahan kata ganti nama di Kertas 2."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kesalahan Kata Ganti & Bilangan","voiceCaption":"Ramalkan ayat yang bebas daripada kesalahan kata ganti nama dan kata bilangan.","voiceScript":"[curious] Kesan perangkap kata ganti nama ia, beliau dan kata bilangan setengah! Ayat manakah yang benar-benar gramatis?","hook":"Periksa kesalahan 'ia' untuk benda dan 'setengah' untuk sebahagian!","scenario":"Empat ayat ditulis mengenai sektor pertanian: penggunaan 'ia', 'beliau', 'setengah' dan 'pelbagai'.","prompt":"Pilih ayat yang BETUL penggunaan kata ganti nama dan kata bilangannya:","options":["Peladang itu berjaya kerana beliau gigih menerapkan teknologi moden di ladangnya","Tanaman hidroponik sangat mudah dijaga kerana ia tidak memerlukan kawasan tanah yang luas","Setengah petani masih menggunakan kaedah tradisional untuk membajak sawah","Berbagai jenis sayur-sayuran segar dipamerkan di ekspo pertanian itu"],"correctIndex":0,"proofLabId":"bm44_kata_nama_lab","proofState":{"knKey":"ganti"},"explanation":"Penggunaan 'beliau' untuk peladang contoh yang berjasa adalah tepat! Sebaliknya 'ia' tidak boleh merujuk tanaman, 'setengah' sepatutnya 'sesetengah', dan 'berbagai' sepatutnya 'pelbagai jenis sayur'."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Pilih Penjodoh Bilangan & Kata Bilangan Tepat","voiceCaption":"Pilih ayat yang menggunakan kata bilangan dan penjodoh bilangan dengan betul.","voiceScript":"[confident] Pilih ayat yang mematuhi hukum kata bilangan dan penjodoh bilangan Dewan Bahasa dan Pustaka!","prompt":"Pilih ayat yang menggunakan kata bilangan dan penjodoh bilangan dengan BETUL:","options":["Ketiga-tiga orang atlet negara itu berjaya meraih pingat emas dalam acara masing-masing","Tiap orang peserta perlu mendaftarkan diri sebelum perlawanan bermula","Para-para peladang dinasihati supaya mengikuti kursus bimbingan pertanian","Setiap ekor lembu-lembu ternakan itu telah diberi suntikan vaksin"],"correctIndex":0,"explanation":"Kata bilangan himpunan berimbuhan 'ketiga-tiga' wajib diikuti penjodoh bilangan ('orang'). Sebaliknya 'tiap' tidak lengkap (wajib 'tiap-tiap' atau 'setiap' tanpa penjodoh), 'para-para' salah (para bermaksud golongan, bukan rak), dan 'setiap' tidak diikuti penjodoh + kata ganda."}]},{"id":"bm44-u3","title":"Unit 3: Apresiasi Gurindam & Penciptaan Puisi","subtitle":"SP 4.1.2 — Mendendangkan dan Mentafsir Gurindam Hati Waja, Ciri Gurindam serta Membina Rangkap Baharu","iconType":"scale","iconUrl":"../assets/icons/bm44-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Struktur & Nilai Gurindam","voiceCaption":"Gurindam ialah puisi tradisional dua baris serangkap berima sama yang mengandungi syarat pada baris pertama dan akibat atau jawapan pada baris kedua.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam Tema empat buku teks, anda mendendangkan Gurindam Hati Waja serta mencipta gurindam tentang sumbangan peladang! Berbeza dengan pantun empat kerat yang mempunyai pembayang dan maksud, GURINDAM mempunyai dua baris serangkap sahaja dan KEDUA-DUA barisnya ialah isi! Baris pertama menyatakan syarat atau perbuatan, manakala baris kedua menyatakan akibat atau balasannya! Rima akhir gurindam biasanya sama iaitu a a, dan mengandungi pengajaran moral yang tajam serta bernas. Bedah anatomi gurindam dalam makmal di bawah!","title":"4.1.2 Ciri, Maksud & Penciptaan Gurindam (Syarat + Akibat)","acronym":"2B•S-A•AA","hook":"Klik Rangkap 1 hingga 3 pada makmal di bawah untuk membezakan baris syarat dan baris akibat!","summary":"Gurindam terdiri daripada dua baris serangkap dengan rima akhir a-a, menghubungkan baris syarat/sebab dengan baris akibat/balasan untuk menyampaikan nasihat.","bullets":["4 Ciri Utama Gurindam: (1) Dua baris serangkap; (2) Sekitar 3–6 patah kata dan 9–14 suku kata sebaris; (3) Rima akhir lazimnya sama (a-a); (4) Tiada pembayang — baris 1 ialah syarat/soalan, baris 2 ialah jawapan/akibat.","Contoh Pemaknaan Gurindam Hati Waja: Memuji keberanian, ketabahan, kegigihan dan kesatuan hati rakyat serta peladang yang berbudi kepada tanah.","Panduan Mencipta Gurindam: Pastikan baris 1 menggunakan kata hubung syarat ('Jika...', 'Apabila...', 'Barang siapa...') dan baris 2 menyempurnakan kesannya dengan rima akhir yang harmoni."],"labId":"bm44_gurindam_struktur_lab","labTitle":"Pembedah Anatomi Gurindam (Syarat & Akibat)","labProps":{"idx":0},"examTip":"Semasa menjawab soalan ciri bentuk puisi tradisional gurindam di SPM, sentiasa nyatakan keempat-empat aspek: bilangan rangkap, bilangan baris serangkap (2 baris), rima akhir (a-a), dan kaitan syarat-akibat."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Bina Rangkap Gurindam Peladang","voiceCaption":"Susun dua baris gurindam tentang kegigihan peladang yang memenuhi syarat, akibat serta rima akhir yang tepat.","voiceScript":"[confident] Susun dua baris gurindam ini agar memenuhi struktur syarat pada baris pertama dan akibat berima sama pada baris kedua!","prompt":"Bina serangkap gurindam yang lengkap mengenai usaha peladang moden (rima akhir a-a):","hint":"Mulakan baris pertama dengan kata syarat 'Apabila...' dan pastikan suku kata hujungnya berima...","answerTokens":["Apabila peladang tekun berusaha,","Hasil bumi melimpah sentiasa."],"distractors":["Tanam padi di tepi paya,","Pergi ke pasar membeli buah mangga."],"explanation":"Baris 'Apabila peladang tekun berusaha,' (syarat, rima -sa) berpasangan tepat dengan 'Hasil bumi melimpah sentiasa.' (akibat, rima -sa)."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Rangkap Gurindam & Maksud","voiceCaption":"Padankan empat rangkap gurindam nasihat dengan pengajaran atau maksudnya yang tepat.","voiceScript":"[curious] Tafsirkan mesej di sebalik setiap rangkap gurindam berikut dan padankan dengan pengajaran tepatnya!","prompt":"Padankan baris gurindam berikut dengan maksud pengajarannya:","pairs":[{"id":"bm44u3m1","left":"Jika latihan digalas tanpa jemu / Kejayaan pasti menanti kamu","right":"Ketekunan dan disiplin latihan menjamin kecemerlangan atlet"},{"id":"bm44u3m2","left":"Apabila tanah subur diusahakan / Rezeki rakyat terus dilimpahkan","right":"Kegigihan petani menjamin bekalan makanan negara"},{"id":"bm44u3m3","left":"Barang siapa menjaga kesihatan diri / Hidup cergas sepanjang hari","right":"Penjagaan kesihatan melahirkan gaya hidup aktif dan sejahtera"},{"id":"bm44u3m4","left":"Jika bersatu teguh hati / Tiada musuh berani dekati","right":"Perpaduan rakyat mempertahankan kedaulatan negara"}],"explanation":"Setiap rangkap gurindam membawa nasihat langsung tanpa perlu berselindung di sebalik pembayang alam seperti pantun."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Bezakan Ciri Gurindam dengan Pantun","voiceCaption":"Pilih pernyataan yang tepat membezakan bentuk gurindam daripada pantun dua kerat.","voiceScript":"[confident] Apakah perbezaan struktur paling ketara antara gurindam dua baris dengan pantun dua kerat?","prompt":"Apakah perbezaan utama antara GURINDAM dengan PANTUN DUA KERAT?","options":["Kedua-dua baris gurindam merupakan isi (syarat dan akibat), manakala pantun dua kerat mempunyai baris pertama sebagai pembayang dan baris kedua sebagai maksud","Gurindam mempunyai empat baris serangkap, manakala pantun dua kerat mempunyai dua baris","Gurindam wajib menggunakan pembayang alam semula jadi pada baris pertama","Pantun dua kerat tidak mempunyai sebarang rima akhir"],"correctIndex":0,"explanation":"Inilah perbezaan penting: pantun dua kerat berstruktur pembayang + maksud, manakala gurindam berstruktur syarat + akibat (kedua-dua baris ialah isi)."}]},{"id":"bm44-u4","title":"Unit 4: Karangan Rencana & Melengkapkan Maklumat Bahan","subtitle":"SP 3.3.1 & 3.4.3 — Format Karangan Rencana Akhbar/Majalah, Olahan Maklumat & Bahasa Berbudaya","iconType":"pendulum","iconUrl":"../assets/icons/bm44-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Format & Gaya Karangan Rencana","voiceCaption":"Karangan rencana mempunyai tajuk di tengah dan nama penulis di bawahnya, menggunakan gaya bahasa ilmiah yang informatif serta disokong fakta sahih.","voiceScript":"[warm] Selamat datang ke Unit empat! Untuk tema sukan dan pertanian dalam Kertas satu S P M, soalan sering meminta pelajar menulis KARANGAN RENCANA untuk akhbar atau majalah sekolah! Jangan keliru formatnya: karangan rencana amat ringkas formatnya — hanya perlukan TAJUK RENCANA yang menarik di bahagian tengah atas menggunakan huruf besar pada pangkal kata utama, diikuti oleh 'Oleh: Nama Penulis' tepat di bawah tajuk! Gaya penulisannya berbentuk penjelasan ilmiah yang padat, menggunakan statistik atau kejayaan tokoh sukan sebagai bukti, serta disulami peribahasa seperti kalau tidak dipecahkan ruyung manakan dapat sagunya!","title":"3.3.1 & 3.4.3 Penulisan Karangan Rencana & Melengkapkan Maklumat","acronym":"T•O•I•K","hook":"Format rencana hanya perlukan Tajuk Rencana (tengah) + Nama Penulis (Oleh: ...) — tanpa alamat atau tandatangan!","summary":"Karangan rencana memerlukan tajuk berpusat dan nama pengarang; penyampaiannya bersifat objektif, informatif, tersusun dengan data serta laras bahasa baku.","bullets":["Format Wajib Karangan Rencana: (1) Tajuk rencana (menarik & relevan, huruf besar pada pangkal kata utama, tiada noktah); (2) Nama penulis di bawah tajuk: 'Oleh : Muhammad Amirul' (tiada tarikh/alamat/tandatangan).","Melengkapkan Maklumat Bahan (SP 3.3.1): Apabila memindahkan maklumat jadual/risalah ke dalam borang atau perenggan, pastikan kata tugas, angka dan ejaan kata nama khas disalin tepat.","Peribahasa Sesuai Tema 4: 'Kalau tidak dipecahkan ruyung, manakan dapat sagunya' (usaha gigih); 'Berakit-rakit ke hulu, berenang-renang ke tepian' (bersusah dahulu); 'Di mana bumi dipijak, di situ langit dijunjung' (patriotisme)."],"examTip":"Elakkan memasukkan kata sapaan berpidato seperti 'Hadirin yang dihormati sekalian' ke dalam karangan rencana! Rencana dibaca oleh pembaca majalah/akhbar, bukan diucapkan di atas pentas."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Jenis Karangan & Ciri Formatnya","voiceCaption":"Padankan empat jenis karangan berformat SPM dengan ciri format utamanya yang tepat.","voiceScript":"[confident] Bezakan format karangan supaya tidak tertukar antara rencana, berita, laporan dan syarahan! Padankan keempat-empat jenis karangan ini.","prompt":"Padankan jenis karangan berformat dengan ciri format wajibnya:","pairs":[{"id":"bm44u4m1","left":"Karangan Rencana","right":"Tajuk di tengah dan 'Oleh: Nama Penulis' di bawah tajuk"},{"id":"bm44u4m2","left":"Karangan Laporan","right":"Tajuk, pengakuan pelapor, tarikh (kanan) & tandatangan/jawatan (kiri)"},{"id":"bm44u4m3","left":"Karangan Berita","right":"Nama tempat (HURUF BESAR), hari/tarikh, diikuti tanda pisah (-)"},{"id":"bm44u4m4","left":"Karangan Syarahan / Pidato","right":"Kata alu-aluan mengikut protokol dan panggilan hormat di perenggan"}],"explanation":"Menguasai perbezaan format rencana, laporan, berita dan syarahan mengelakkan kehilangan markah format (2-3 markah mudah) dalam Kertas 1."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Tajuk & Pembuka Rencana Tani","voiceCaption":"Susun tajuk, baris pengarang dan ayat pembuka karangan rencana bertajuk Pertanian Moden Pemangkin Ekonomi Negara.","voiceScript":"[curious] Susun susunan kepala dan ayat pembuka karangan rencana yang tepat tanpa tersalah memasukkan format laporan atau pidato!","prompt":"Susun kepala dan ayat pembuka karangan rencana tentang pertanian moden:","hint":"Tajuk diikuti baris 'Oleh: ...' sebelum perenggan pendahuluan...","answerTokens":["Pertanian Moden Pemangkin Ekonomi Negara","Oleh : Nurul Hidayah binti Ahmad","Sektor pertanian di Malaysia kini mengalami transformasi pesat","melalui penerapan teknologi pintar demi menjamin sekuriti makanan negara."],"distractors":["Yang berusaha Tuan Pengerusi Majlis dan hadirin sekalian,","Laporan disediakan oleh, Nurul Hidayah (Setiausaha Kelab Pertanian)."],"explanation":"Rencana dimulakan terus dengan Tajuk, baris Oleh, dan wacana pembuka ilmiah tanpa kata sapaan majlis atau penutup laporan."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Pilih Peribahasa Tepat Tema Usaha","voiceCaption":"Pilih peribahasa yang paling tepat menggambarkan kesanggupan atlet menghadapi latihan sukar demi pingat emas.","voiceScript":"[confident] Lengkapkan ayat penutup karangan sukan dengan peribahasa yang paling tepat!","prompt":"Peribahasa manakah yang PALING tepat menggambarkan kesanggupan atlet menempuh latihan perit sebelum meraih kejayaan manis?","options":["Berakit-rakit ke hulu, berenang-renang ke tepian; bersakit-sakit dahulu, bersenang-senang kemudian","Bagai aur dengan tebing","Melentur buluh biarlah dari rebungnya","Ukur baju di badan sendiri"],"correctIndex":0,"explanation":"'Berakit-rakit ke hulu, berenang-renang ke tepian; bersakit-sakit dahulu, bersenang-senang kemudian' tepat menggambarkan pengorbanan latihan sebelum mengecap kejayaan."}]},{"id":"bm44-u5","title":"Unit 5: Cabaran Boss SPM — Menjulang Harapan","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Kata Nama & Kata Ganti Nama, Gurindam, Penjodoh Bilangan & Suntingan Rencana","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Suntingan Kata Ganti Nama","voiceCaption":"Soalan Boss pertama mengesan kesalahan kata ganti nama dan huruf besar kata nama khas dalam laporan sukan.","voiceScript":"[excited] Selamat datang ke Unit Boss Tema empat! Soalan pertama menguji kepekaan kamu terhadap hukum kata ganti nama dan ejaan kata nama khas!","prompt":"Pilih ayat yang BETUL dari segi penggunaan kata ganti nama dan kata nama khas:","options":["Datuk Lee Chong Wei amat disegani kerana beliau telah mengharumkan nama Malaysia di persada dunia","Rumah hijau itu dibina di lereng bukit kerana ia memudahkan pengairan air bersih","Kumpulan peragut tersebut berjaya diberkas dan beliau telah dibawa ke balai polis","Semua ahli-ahli pasukan silat negara akan bertolak ke Singapura esok"],"correctIndex":0,"explanation":"'beliau' tepat bagi tokoh sukan negara yang dihormati. 'ia' salah bagi rumah hijau (benda), 'beliau' salah bagi peragut, dan 'semua ahli-ahli' lewah."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Bezakan Kita vs Kami dalam Dialog","voiceCaption":"Ramalkan penggunaan kata ganti nama diri pertama jamak kita atau kami yang tepat dalam dialog atlet dengan jurulatih.","voiceScript":"[curious] Soalan Boss kedua! Dalam dialog antara kapten pasukan dengan jurulatihnya apabila kapten melaporkan kesediaan para pemain kepada jurulatih, kata ganti nama manakah yang betul: kami atau kita?","hook":"Tanya diri anda: adakah jurulatih termasuk dalam kumpulan yang bermain di padang atau sebagai pendengar luar?","scenario":"Kapten berkata kepada jurulatih: 'Jurulatih, ________ para pemain telah bersedia menentang pasukan lawan sebentar lagi.'","prompt":"Kata ganti nama diri yang manakah PALING tepat mengisi tempat kosong tersebut?","options":["kami (kerana tidak merangkumi jurulatih sebagai pendengar yang dituju)","kita (kerana melibatkan semua rakyat Malaysia)","beta (kerana berstatus ketua pasukan)","mereka (kerana bercakap tentang diri sendiri)"],"correctIndex":0,"proofLabId":"bm44_kata_nama_lab","proofState":{"knKey":"ganti"},"explanation":"Kapten bercakap mewakili pasukan kepada jurulatih (jurulatih ialah pendengar, bukan pemain di padang), maka gunakan 'kami'."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Sunting Ayat Pertanian Moden","voiceCaption":"Susun pembetulan ayat yang mempunyai kesalahan kata bilangan dan penjodoh bilangan menjadi ayat gramatis.","voiceScript":"[confident] Soalan Boss ketiga! Betulkan kesalahan ayat: Setengah peladang-peladang di dalam kawasan itu menggunakan berbagai alatan moden.","prompt":"Susun ayat yang telah DISUNTING dengan betul bagi ayat salah 'Setengah peladang-peladang di dalam kawasan itu menggunakan berbagai alatan moden':","hint":"Tukar 'Setengah peladang-peladang' kepada 'Sesetengah peladang', 'di dalam' kepada 'di', dan 'berbagai' kepada 'pelbagai'...","answerTokens":["Sesetengah peladang","di kawasan itu","menggunakan pelbagai","peralatan moden."],"distractors":["Setengah orang peladang-peladang","di dalam kawasan itu memakai berbagai."],"explanation":"Empat pembetulan serentak: Setengah -> Sesetengah; peladang-peladang -> peladang; di dalam kawasan -> di kawasan; berbagai -> pelbagai."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Kesalahan Bahasa & Pembetulannya","voiceCaption":"Padankan empat bentuk kesalahan kata nama atau kata bilangan yang lazim dalam SPM dengan bentuk pembetulannya.","voiceScript":"[confident] Soalan Boss keempat! Padankan setiap kesalahan bahasa Tema empat dengan pembetulannya yang tepat.","prompt":"Padankan kesalahan bahasa di kiri dengan pembetulannya yang tepat di kanan:","pairs":[{"id":"bm44b4m1","left":"tiap peserta","right":"setiap peserta / tiap-tiap peserta"},{"id":"bm44b4m2","left":"seluruh buah negeri","right":"seluruh negeri (tiada penjodoh bilangan)"},{"id":"bm44b4m3","left":"di antara punca-punca","right":"antara punca (tanpa 'di' dan tanpa gandaan)"},{"id":"bm44b4m4","left":"kedua orang atlet","right":"kedua-dua orang atlet"}],"explanation":"Kata bilangan himpunan 'kedua' hanya merujuk kedudukan nombor dua (tempat kedua); untuk menyatakan bilangan 2 orang, wajib gunakan 'kedua-dua orang'."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Sintesis Gurindam & Nilai","voiceCaption":"Pilih tafsiran nilai murni yang paling tepat daripada gurindam bertemakan usaha peladang dan atlet.","voiceScript":"[excited] Soalan Boss terakhir Tema empat! Baca rangkap gurindam: Jika petani tekun berbudi kepada tanah / Nescaya rezeki subur tidak akan punah. Apakah nilai dan maksud rangkap ini?","prompt":"Berdasarkan rangkap gurindam: 'Jika petani tekun berbudi kepada tanah / Nescaya rezeki subur tidak akan punah', apakah maksud dan nilai utamanya?","options":["Kerajinan dan ketekunan dalam mengusahakan sektor pertanian akan menjamin pulangan rezeki yang berterusan","Tanah pertanian akan subur dengan sendirinya walaupun dibiarkan terbiar","Hasil pertanian tidak membawa sebarang pulangan ekonomi kepada petani","Petani harus meninggalkan bidang pertanian untuk bekerja di kilang"],"correctIndex":0,"explanation":"Baris syarat menekankan nilai kerajinan ('tekun berbudi kepada tanah') dan baris akibat menjelaskan jaminan rezeki berkekalan."}]}]};</script>

  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
