/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab05","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":5,"title":"Memacu Produktiviti","subtitle":"Tema 5 BM T4 KSSM — Industri 4.0, Rumah Pasang Siap IBS, Khazanah Hutan Bakau & Kraf Tangan, Golongan Kata Kerja (SP 5.2.2), Peribahasa dalam Konteks (SP 4.2.1) serta Kerangka Karangan (SP 3.4.1).","estimatedMinutes":26,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab05-labs.js","coverIcon":"../assets/icons/bm45-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan golongan kata kerja dan peribahasa produktiviti kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Kata kerja transitif, ayat pasif dan kerangka karangan berjaya kamu kuasai!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula perbezaan objek selepas kata kerja transitif dengan pelengkap tak transitif.","celebrate":"[excited] Syabas! Tema kelima Bahasa Melayu Tingkatan empat berjaya kamu selesaikan!"},"units":[{"id":"bm45-u1","title":"Unit 1: Industri 4.0, IBS, Hutan Bakau & Kraf Tangan","subtitle":"SP 1.3.2 & 2.3.1 — Menganalisis Maklumat Industri Mutakhir, Rumah Pasang Siap (IBS), Ekoprosperiti Bakau & PKS","iconType":"atom","iconUrl":"../assets/icons/bm45-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Revolusi Industri 4.0 & IBS","voiceCaption":"Tema lima membincangkan bagaimana automasi Industri empat perpuluhan sifar, sistem binaan berindustri dan industri kraf tangan memacu produktiviti ekonomi negara.","voiceScript":"[warm] Selamat datang ke Tema lima Bahasa Melayu Tingkatan empat, Memacu Produktiviti! Dalam tema ini, anda meneroka empat sektor pemacu produktiviti Malaysia: pertama, Revolusi Industri empat perpuluhan sifar yang mengintegrasikan robotik pintar, data raya dan Internet Kebendaan! Kedua, Sistem Binaan Berindustri atau rumah pasang siap I B S yang mempercepat pembinaan serta mengurangkan sisa bahan di tapak! Ketiga, pemuliharaan khazanah hutan bakau yang menjadi penampan hakisan ombak dan sumber ekonomi komuniti! Dan keempat, pemerkasaan industri kraf tangan tempatan seperti batik dan anyaman ke pasaran antarabangsa!","title":"2.3.1 Sektor Pemacu Produktiviti: Industri 4.0, IBS & Kraf Tangan","acronym":"I4•IBS•K","hook":"Fahami kepentingan Industri 4.0 dan kelebihan rumah pasang siap IBS sebagai isi karangan SPM berimpak tinggi!","mediaKey":"bm45_industri_automasi","summary":"Produktiviti moden dipacu oleh automasi Industri 4.0, kecekapan pembinaan IBS, kelestarian sumber alam (hutan bakau) dan inovasi kraf tangan PKS.","bullets":["Kepentingan Industri 4.0: Meningkatkan kecekapan pengeluaran, mengurangkan ralat manusia, mempercepat penyelidikan produk serta menjana pekerjaan berkemahiran tinggi.","Rumah Pasang Siap (IBS — Industrialised Building System): Komponen dinding dan lantai dihasilkan di kilang dalam persekitaran terkawal lalu dipasang di tapak -> menjimatkan masa pembinaan, mengurangkan sisa buangan dan memastikan kualiti seragam.","Khazanah Hutan Bakau & Kraf Tangan: Hutan bakau melindungi pesisir daripada hakisan dan menjadi tapak pembiakan hidupan laut; industri kraf tangan warisan pula menaikkan imej budaya sambil menjana pendapatan usahawan PKS."],"examTip":"Dalam soalan rumusan atau karangan bertema ekonomi/industri, gandingkan fakta teknologi (Industri 4.0 / IBS) dengan kesannya kepada kualiti produk, masa dan kelestarian alam."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Manfaat Teknologi vs Kelestarian","voiceCaption":"Asingkan enam pernyataan daripada Tema lima berikut antara Manfaat Teknologi Pembinaan & Industri 4.0 dengan Manfaat Kelestarian Bakau & Kraf.","voiceScript":"[curious] Asingkan keenam-enam fakta penting daripada Tema lima buku teks ini kepada kategori Teknologi Industri/IBS atau Kelestarian Alam/Kraf Tangan.","prompt":"Kelaskan fakta berikut mengikut sektor pemacu produktiviti dalam Tema 5:","buckets":[{"id":"tek","label":"Industri 4.0 & Sistem IBS"},{"id":"alam","label":"Hutan Bakau & Kraf Warisan"}],"items":[{"text":"Komponen pratuang dihasilkan di kilang dan dipasang di tapak pembinaan","bucketId":"tek","note":"Betul! Ciri teras Sistem Binaan Berindustri (IBS)."},{"text":"Berfungsi sebagai zon penampan semula jadi menghalang hakisan ombak","bucketId":"alam","note":"Tepat! Peranan penting ekosistem hutan paya bakau."},{"text":"Integrasi kecerdasan buatan (AI), robotik dan analisis data raya","bucketId":"tek","note":"Betul! Tonggak Revolusi Industri 4.0."},{"text":"Mengkomersialkan seni canting batik dan anyaman rotan ke pasaran global","bucketId":"alam","note":"Tepat! Memacu pendapatan usahawan kraf tangan tempatan."},{"text":"Mengurangkan kebergantungan kepada tenaga buruh asing di tapak bina","bucketId":"tek","note":"Betul! Kelebihan utama penggunaan IBS dan automasi."},{"text":"Menjadi habitat pembiakan ketam, udang dan anak ikan pesisir","bucketId":"alam","note":"Tepat! Sumbangan ekologi dan ekonomi hutan bakau kepada nelayan."}],"explanation":"Tema 5 menekankan keseimbangan antara kemajuan teknologi industri moden dengan pemeliharaan sumber alam serta warisan tempatan."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Sektor & Kelebihan Produktiviti","voiceCaption":"Padankan empat bahan Tema lima dengan sumbangan utamanya terhadap produktiviti negara.","voiceScript":"[confident] Padankan setiap tajuk kecil Tema lima buku teks ini dengan impak produktivitinya yang tepat!","prompt":"Padankan tajuk bahan Tema 5 berikut dengan sumbangannya:","pairs":[{"id":"bm45u1m1","left":"Rumah Pasang Siap (IBS)","right":"Memendekkan tempoh pembinaan dan mengurangkan pencemaran tapak"},{"id":"bm45u1m2","left":"Maju dalam Industri Mutakhir","right":"Menerapkan automasi pintar demi daya saing global"},{"id":"bm45u1m3","left":"Khazanah Hutan Bakau","right":"Memelihara biodiversiti marin dan menampan hakisan pantai"},{"id":"bm45u1m4","left":"Industri Kraf Tangan","right":"Menjana pendapatan PKS dan memartabatkan seni warisan"}],"explanation":"Kesemua empat tajuk teks dalam Tema 5 memberi perbendaharaan kata dan contoh isi konkrit untuk karangan berteraskan ekonomi dan produktiviti."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Analisis Kesan Sistem IBS","voiceCaption":"Pilih pernyataan yang tepat menjelaskan kelebihan sistem pembinaan pasang siap berbanding kaedah konvensional.","voiceScript":"[confident] Mengapakah kerajaan menggalakkan pemaju menggunakan Sistem Binaan Berindustri atau rumah pasang siap I B S?","prompt":"Apakah kelebihan utama Sistem Binaan Berindustri (IBS) berbanding kaedah pembinaan konvensional?","options":["Menghasilkan komponen bangunan yang seragam di kilang sekali gus menjimatkan masa dan mengurangkan sisa binaan","Memerlukan jumlah pekerja tapak binaan yang jauh lebih ramai tanpa bantuan jentera","Menghasilkan bangunan yang tidak boleh diubah suai saiz pintunya selama-lamanya","Menghabiskan kayu hutan bakau sebagai bahan asas dinding konkrit"],"correctIndex":0,"explanation":"IBS meningkatkan produktiviti pembinaan kerana komponen siap dibuat di kilang dengan kawalan mutu tinggi."}]},{"id":"bm45-u2","title":"Unit 2: Golongan Kata Kerja (Transitif & Tak Transitif)","subtitle":"SP 5.2.2 — Kata Kerja Transitif Aktif & Pasif (diri 1, 2, 3), Kata Kerja Tak Transitif Berpelengkap & Tanpa Pelengkap","iconType":"formula","iconUrl":"../assets/icons/bm45-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kata Kerja Transitif & Tak Transitif","voiceCaption":"Kata kerja terbahagi kepada kata kerja transitif yang wajib diikuti objek secara langsung, dan kata kerja tak transitif yang sama ada memerlukan pelengkap atau lengkap berdiri sendiri.","voiceScript":"[warm] Selamat datang ke Unit dua, Tatabahasa Golongan Kata Kerja! Ini ialah standard lima perpuluhan dua perpuluhan dua yang paling kerap keluar dalam soalan menyunting dan menukar ayat aktif-pasif S P M! Ingat hukum emas pertama: Kata Kerja Transitif Aktif yang bermula dengan meN seperti membincangkan, menjelaskan dan menghasilkan WAJIB diikuti terus oleh OBJEK Frasa Nama tanpa sebarang kata sendi di tengah! Jadi ayat 'membincangkan tentang isu' atau 'mengetahui akan hal itu' adalah SALAH! Hukum emas kedua: dalam ayat PASIF kata ganti nama diri PERTAMA dan KEDUA seperti saya, kami, kita, anda dan awak, imbuhan 'di-' DILARANG! Tulis 'surat itu saya tulis', BUKAN 'surat itu ditulis oleh saya'! Uji struktur kata kerja pada makmal di bawah!","title":"5.2.2 Golongan Kata Kerja & Hukum Ayat Pasif (Diri 1, 2, 3)","acronym":"KT•KTT•P123","hook":"Klik tiga jenis kata kerja pada makmal di bawah untuk membezakan objek, pelengkap dan pasif!","mediaKey":"bm45_kraf_batik","summary":"Kata kerja transitif memerlukan objek secara langsung (tanpa kata sendi di antara kata kerja dan objek) dan boleh dipasifkan; kata kerja tak transitif tidak boleh dipasifkan.","bullets":["Kata Kerja Transitif Aktif: Berimbuhan meN-, memper-..., dll. WAJIB diikuti Objek Frasa Nama terus — SALAH: 'membincangkan tentang', 'menjelaskan mengenai', 'menyatakan bahawa' (jika tanpa objek). BETUL: 'membincangkan isu itu'.","Kata Kerja Pasif (Hukum Ketat SPM!): (a) Diri ke-3 (dia, mereka, Encik Ali): guna 'di-... oleh...' (cth. 'Mesin itu dikendalikan oleh juruteknik'). (b) Diri ke-1 & ke-2 (saya, aku, kami, kita, kamu, anda): DILARANG guna 'di-' atau 'oleh' (cth. 'Projek itu kami laksanakan', BUKAN 'Projek itu dilaksanakan oleh kami').","Kata Kerja Tak Transitif: (1) Tanpa pelengkap ('Produktiviti meningkat.'); (2) Berpelengkap ('Negara kita berteraskan ekonomi digital.') — TIDAK boleh dipasifkan dan tidak boleh menerima imbuhan 'di-'."],"labId":"bm45_kata_kerja_lab","labTitle":"Penguji Kata Kerja Transitif vs Tak Transitif (SP 5.2.2)","labProps":{"kkKey":"transitif"},"examTip":"Pengecualian Kata Kerja Transitif berimbuhan 'ber-' atau 'ter-': Tidak ada kata kerja transitif berawalan 'ber-'! Kata kerja seperti 'bersama', 'berdasarkan' dan 'berpandukan' ialah KATA KERJA TAK TRANSITIF BERPELENGKAP (contoh salah: 'berpandukan kepada' — cukup 'berpandukan peta'!)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Jenis Kata Kerja dalam Ayat","voiceCaption":"Kelaskan enam binaan kata kerja berikut antara Kata Kerja Transitif dengan Kata Kerja Tak Transitif.","voiceScript":"[curious] Uji pengenalan kata kerja kamu! Asingkan keenam-enam binaan kata kerja berikut kepada Kata Kerja Transitif atau Kata Kerja Tak Transitif.","prompt":"Kelaskan binaan kata kerja berikut mengikut golongannya yang tepat:","buckets":[{"id":"trans","label":"Kata Kerja Transitif (Ada Objek)"},{"id":"taktrans","label":"Kata Kerja Tak Transitif (Tiada Objek)"}],"items":[{"text":"Kilang itu mengeluarkan komponen kereta elektrik","bucketId":"trans","note":"Betul! 'mengeluarkan' ialah transitif aktif dengan objek 'komponen kereta elektrik'."},{"text":"Hasil jualan kraf tangan semakin meningkat","bucketId":"taktrans","note":"Tepat! 'meningkat' lengkap berdiri sendiri tanpa objek."},{"text":"Syarikat itu berteraskan inovasi hijau","bucketId":"taktrans","note":"Betul! 'berteraskan' ialah kata kerja tak transitif berpelengkap."},{"text":"Mereka memperkemas strategi pemasaran digital","bucketId":"trans","note":"Tepat! 'memperkemas' ialah transitif aktif dengan objek 'strategi pemasaran digital'."},{"text":"Para pelancong bersiar-siar di kawasan paya bakau","bucketId":"taktrans","note":"Betul! Diikuti keterangan tempat 'di kawasan paya bakau', bukan objek."},{"text":"Laporan produktiviti itu telah kami siapkan semalam","bucketId":"trans","note":"Tepat! Ayat pasif kata kerja transitif pelaku diri pertama."}],"explanation":"Hanya kata kerja transitif mempunyai objek dan boleh bertukar antara bentuk aktif dan pasif; kata kerja tak transitif seperti 'meningkat' dan 'berteraskan' tidak mempunyai suara pasif."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Ayat Pasif Pelaku Diri 1 & 2","voiceCaption":"Ramalkan bentuk ayat pasif yang paling gramatis bagi ayat aktif: Saya telah menghasilkan prototaip mesin itu minggu lepas.","voiceScript":"[curious] Awas dengan hukum kata ganti nama diri pertama! Apakah bentuk ayat pasif yang betul bagi ayat: Saya telah menghasilkan prototaip mesin itu minggu lepas?","hook":"Letakkan kata bantu 'telah' di hadapan pelaku 'saya' dan gugurkan 'di-' serta 'oleh'!","scenario":"Ayat aktif: 'Saya telah menghasilkan prototaip mesin itu minggu lepas.'","prompt":"Manakah tukaran ayat PASIF yang paling gramatis?","options":["Prototaip mesin itu telah saya hasilkan minggu lepas.","Prototaip mesin itu telah dihasilkan oleh saya minggu lepas.","Prototaip mesin itu saya telah hasilkan minggu lepas.","Telah saya menghasilkan prototaip mesin itu minggu lepas."],"correctIndex":0,"proofLabId":"bm45_kata_kerja_lab","proofState":{"kkKey":"transitif"},"explanation":"Dua hukum serentak: (1) Pelaku diri ke-1/ke-2 tidak guna 'di-... oleh...'; (2) Kata bantu ('telah', 'akan', 'mesti') tidak boleh menyelit di antara pelaku 'saya' dan kata kerja 'hasilkan'!"},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Kesalahan Sendi selepas Transitif","voiceCaption":"Pilih ayat yang menggunakan kata kerja transitif dengan betul tanpa menyelipkan kata sendi nama sebelum objek.","voiceScript":"[confident] Kesan ayat yang betul kata kerja transitifnya tanpa menyelipkan kata sendi yang salah seperti tentang atau mengenai!","prompt":"Pilih ayat yang menggunakan kata kerja transitif dengan BETUL:","options":["Panel penasihat sedang membincangkan strategi meningkatkan produktiviti kilang","Panel penasihat sedang membincangkan tentang strategi meningkatkan produktiviti","Penceramah itu menjelaskan mengenai kepentingan Industri 4.0 kepada peserta","Kerajaan amat mengambil berat terhadap masalah pencemaran sungai"],"correctIndex":0,"explanation":"'membincangkan' dan 'menjelaskan' ialah kata kerja transitif yang wajib diikuti terus oleh objek Frasa Nama tanpa 'tentang' atau 'mengenai'. 'mengambil berat' ialah frasa kerja yang menerima objek 'masalah' atau jika guna kata sendi perlu 'akan/terhadap' pada kata adjektif, namun ayat pertama paling tepat dan bersih."}]},{"id":"bm45-u3","title":"Unit 3: Peribahasa dalam Konteks Produktiviti","subtitle":"SP 4.2.1 — Menggunakan Peribahasa Melayu & Menghubung Kait Maksudnya Mengikut Konteks Tema 5","iconType":"scale","iconUrl":"../assets/icons/bm45-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Peribahasa dalam Konteks SP 4.2.1","voiceCaption":"Standard pembelajaran empat perpuluhan dua perpuluhan satu menekankan kebolehan memilih peribahasa yang tepat mengikut konteks situasi serta menggunakannya dalam ayat yang gramatis.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam Tema lima, anda berlatih menggunakan peribahasa yang tepat untuk menghuraikan kegigihan usahawan, inovasi teknologi dan kerjasama pasukan! Ingat peraturan emas peribahasa dalam peperiksaan S P M: pertama, ejaan dan susunan kata peribahasa tidak boleh diubah sesuka hati — contohnya 'bagai aur dengan tebing', bukannya 'bagai aur dan tebing'! Kedua, apabila membina ayat menggunakan peribahasa, JANGAN masukkan definisi peribahasa itu secara berulang, tetapi ceritakan situasi konkrit yang memaparkan maksud peribahasa tersebut!","title":"4.2.1 Penguasaan Peribahasa Mengikut Konteks Tema Produktiviti","acronym":"S•I•P•K","hook":"Pastikan padanan peribahasa tepat dengan konteks situasi: usaha gigih, kerjasama, pemula inovasi atau sikap berhati-hati!","summary":"Peribahasa merangkumi simpulan bahasa, perumpamaan, pepatah dan bidalan yang memperindah wacana apabila tepat konteks dan ejaannya.","bullets":["Peribahasa Usaha & Ketekunan: 'Alah bisa tegal biasa' (kesukaran menjadi mudah apabila selalu diamalkan); 'Genggam bara api biar sampai jadi arang' (buat kerja hingga berjaya); 'Di mana ada kemahuan, di situ ada jalan'.","Peribahasa Kerjasama & Muafakat: 'Bagai aur dengan tebing' (saling membantu); 'Berat sama dipikul, ringan sama dijinjing'; 'Bulat air kerana pembetung, bulat manusia kerana muafakat'.","Peribahasa Inovasi & Pengurusan Risiko: 'Sediakan payung sebelum hujan' (bersiap awal); 'Ingat sebelum kena, jimat sebelum habis'; 'Biar lambat asalkan selamat' (ketelitian mutu kerja)."],"examTip":"Elakkan kesilapan ejaan peribahasa klasik: 'melepaskan batuk di tangga' (SALAH!) — ejaan betul DBP ialah 'melepaskan BATOK di tangga' (batok = tempurung penyedok air basuh kaki!)."},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Peribahasa & Situasi Kerja","voiceCaption":"Padankan lima peribahasa Melayu dengan situasi dunia pekerjaan dan keusahawanan yang sepadan.","voiceScript":"[confident] Uji ketepatan padanan peribahasa kamu! Padankan kelima-lima peribahasa ini dengan situasi keusahawanan dan inovasi yang paling tepat.","prompt":"Padankan peribahasa berikut dengan situasi konteksnya yang tepat:","pairs":[{"id":"bm45u3m1","left":"Alah bisa tegal biasa","right":"Pekerja kilang menjadi mahir mengendalikan mesin baharu setelah berlatih setiap hari"},{"id":"bm45u3m2","left":"Genggam bara api biar sampai jadi arang","right":"Usahawan kraf tangan tetap tabah menghadapi halangan sehingga produknya menembusi pasaran luar"},{"id":"bm45u3m3","left":"Bagai aur dengan tebing","right":"Kerjasama erat antara majikan dengan pekerja dalam memacu produktiviti syarikat"},{"id":"bm45u3m4","left":"Sediakan payung sebelum hujan","right":"Syarikat menyimpan dana kecemasan dan melatih staf sebelum krisis ekonomi berlaku"},{"id":"bm45u3m5","left":"Seperti melepaskan batok di tangga","right":"Kerja kawalan kualiti dilakukan secara sambalewa dan tidak bersungguh-sungguh"}],"explanation":"Mengaitkan peribahasa terus dengan senario industri membuktikan kefahaman mendalam pelajar terhadap maksud tersiratnya."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Bina Ayat dengan Peribahasa Tepat","voiceCaption":"Susun bahagian ayat yang mengaplikasikan peribahasa genggam bara api biar sampai jadi arang dalam konteks keusahawanan.","voiceScript":"[curious] Susun ayat yang gramatis menggunakan peribahasa genggam bara api biar sampai jadi arang dalam konteks kejayaan usahawan!","prompt":"Susun ayat yang mengaplikasikan peribahasa secara tepat dalam konteks usahawan PKS:","hint":"Mulakan dengan subjek usahawan dan tunjukkan ketabahannya menghadapi cabaran...","answerTokens":["Pengusaha batik itu terus berusaha","memperbaiki mutu rekaannya walaupun","pernah mengalami kerugian kerana berpegang pada prinsip","genggam bara api biar sampai jadi arang."],"distractors":["yang bermaksud memegang bara api sehingga panas","sambil berputus asa di pertengahan jalan."],"explanation":"Ayat tidak menerangkan maksud secara mekanikal, sebaliknya memaparkan kesungguhan menghadapi cabaran kerugian hingga berjaya."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ejaan & Bentuk Peribahasa DBP","voiceCaption":"Pilih peribahasa yang ditulis dengan ejaan dan susunan kata yang tepat mengikut Kamus Dewan.","voiceScript":"[confident] Kesan bentuk ejaan peribahasa yang seratus peratus betul mengikut Kamus Dewan Bahasa!","prompt":"Antara peribahasa berikut, manakah yang dieja dan disusun dengan BETUL?","options":["Hendak seribu daya, tak hendak seribu dalih","Seperti melepaskan batuk di tangga","Bagai aur dan tebing","Alah bisa tegar biasa"],"correctIndex":0,"explanation":"Ejaan tepat ialah 'batok' (bukan batuk), 'bagai aur DENGAN tebing' (bukan dan), dan 'alah bisa TEGAL biasa' (bukan tegar)."}]},{"id":"bm45-u4","title":"Unit 4: Kerangka Karangan & Analisis Isi Industri 4.0","subtitle":"SP 3.4.1 — Menyenaraikan Isi Penting daripada Pelbagai Bahan & Membina Kerangka Karangan Lengkap","iconType":"book","iconUrl":"../assets/icons/bm45-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Membina Kerangka Karangan SP 3.4.1","voiceCaption":"Kerangka karangan yang mantap memetakan pendahuluan, tiga hingga empat isi penting berbeza berserta huraian dan contoh, serta penutup sebelum menulis karangan lengkap.","voiceScript":"[warm] Selamat datang ke Unit empat! Sebelum menulis karangan respons terbuka tiga ratus lima puluh hingga lima ratus patah perkataan dalam Kertas satu S P M, peruntukkan lima minit untuk membina KERANGKA KARANGAN seperti yang dilatih dalam Standard Pembelajaran tiga perpuluhan empat perpuluhan satu! Semak tiga peraturan merangka isi: pertama, pastikan setiap perenggan isi menjawab TUGASAN SOALAN secara tepat — jika soalan meminta 'langkah', jangan tulis 'punca' sebagai isi utama! Kedua, pastikan isi satu hingga isi empat tidak bertindih atau membawa maksud sama! Ketiga, catatkan kata kunci contoh dan peribahasa di sebelah setiap isi dalam kerangka! Uji pembina kerangka Industri empat perpuluhan sifar di bawah!","title":"3.4.1 Menganalisis Bahan & Membina Kerangka Karangan Tersusun","acronym":"T•A•I•C","hook":"Klik Pendahuluan, Isi 1, Isi 2 dan Penutup pada Pembina Kerangka Karangan di bawah!","summary":"Kerangka karangan menyaring isi daripada bahan rangsangan mengikut kehendak kata tugas soalan (faktor, kesan, langkah, kepentingan) tanpa pertindihan idea.","bullets":["Analisis Kehendak Soalan (Kunci Markah): Kenal pasti Tema (cth. Industri 4.0 / Kraf Tangan), Tugasan (Kepentingan / Langkah / Cabaran), dan Format (Umum / Rencana / Syarahan).","Elakkan Pertindihan Isi: Contoh bertindih — Isi 1: 'meningkatkan ekonomi negara' dan Isi 2: 'menjana pendapatan negara' (hampir sama!). Pisahkan mengikut fokus: Isi 1: kecekapan pengeluaran kilang; Isi 2: penjanaan peluang pekerjaan berteknologi; Isi 3: peningkatan daya saing eksport.","Penutup Karangan Berkualiti: Rumusan (Kesimpulannya,) + Cadangan pihak terlibat (semua pihak mestilah...) + Harapan berwawasan (agar negara mencapai status negara maju)."],"labId":"bm45_kerangka_karangan_lab","labTitle":"Pembina Kerangka Karangan Industri 4.0 (SP 3.4.1)","labProps":{"slot":0},"examTip":"Jika terkeluar tajuk atau tersalah fokus (cth. soalan tanya 'langkah memajukan industri kraf', tetapi 3 isi menulis 'kepentingan kraf'), karangan tidak dapat mencapai peringkat Kepujian atau Cemerlang!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Isi Langkah vs Kepentingan Kraf","voiceCaption":"Asingkan enam isi karangan bertema industri kraf tangan berikut antara Isi Kepentingan dengan Isi Langkah Memajukan.","voiceScript":"[curious] Elakkan kesalahan terpesong tugasan soalan! Asingkan keenam-enam isi karangan kraf tangan ini kepada Kepentingan atau Langkah Memajukan.","prompt":"Kelaskan isi karangan industri kraf tangan berikut mengikut fokus tugasan soalan:","buckets":[{"id":"kepentingan","label":"Kepentingan / Faedah Industri Kraf"},{"id":"langkah","label":"Langkah Memajukan Industri Kraf"}],"items":[{"text":"Menjana sumber pendapatan sampingan dan utama kepada usahawan desa","bucketId":"kepentingan","note":"Betul! Kesan baik atau faedah kepada ekonomi rakyat."},{"text":"Mempromosikan produk kraf melalui platform e-dagang dan media sosial","bucketId":"langkah","note":"Tepat! Tindakan atau usaha memperluas pasaran."},{"text":"Memelihara warisan seni budaya tradisional daripada pupus ditelan zaman","bucketId":"kepentingan","note":"Betul! Nilai kepentingan budaya dan warisan."},{"text":"Menawarkan geran modal dan latihan reka bentuk moden oleh agensi kerajaan","bucketId":"langkah","note":"Tepat! Usaha pihak berkuasa membantu usahawan PKS."},{"text":"Menarik kehadiran pelancong asing membeli cenderamata autentik tempatan","bucketId":"kepentingan","note":"Betul! Faedah kepada sektor pelancongan negara."},{"text":"Menganjurkan pameran kraf tangan peringkat kebangsaan dan antarabangsa","bucketId":"langkah","note":"Tepat! Tindakan mempopularkan produk tempatan."}],"explanation":"Sentiasa semak setiap Ayat Topik anda terhadap kata tugas soalan ('langkah' bermaksud tindakan/cara; 'kepentingan' bermaksud faedah/manfaat)."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Perenggan Penutup Karangan","voiceCaption":"Susun tiga unsur penting perenggan penutup karangan bertema produktiviti iaitu rumusan, cadangan dan harapan.","voiceScript":"[confident] Susun perenggan penutup karangan yang lengkap dengan tiga komponen: rumusan, cadangan berserta peribahasa, dan harapan!","prompt":"Susun ayat-ayat berikut menjadi perenggan penutup karangan Industri 4.0 yang mantap:","hint":"Mulakan dengan penanda rumusan 'Kesimpulannya,', diikuti cadangan kerjasama dan harapan...","answerTokens":["Kesimpulannya, penguasaan teknologi Industri 4.0 amat penting bagi memacu produktiviti ekonomi negara.","Oleh itu, kerajaan dan sektor swasta perlu berganding bahu bagai aur dengan tebing untuk melatih tenaga kerja mahir.","Dengan komitmen padu semua pihak, Malaysia pasti mampu berdiri sama tinggi, duduk sama rendah dengan negara maju."],"distractors":["Selain itu, hutan bakau perlu ditebang untuk membina kilang baharu.","Apakah maksud sebenar produktiviti pada masa hadapan?"],"explanation":"Penutup karangan terbaik mengandungi Rumusan -> Cadangan + Peribahasa -> Harapan masa hadapan yang optimis."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Kesan Isi Bertindan dalam Kerangka","voiceCaption":"Kenal pasti pasangan isi yang bertindan dan patut digabungkan atau diganti dalam satu kerangka karangan.","voiceScript":"[confident] Dalam satu kerangka karangan kepentingan I B S, pasangan isi manakah yang bertindih idea dan perlu digantikan salah satunya?","prompt":"Manakah pasangan isi kerangka karangan kepentingan rumah pasang siap (IBS) yang BERTINDIH dan perlu diubah?","options":["Isi 1: Menjimatkan tempoh masa pembinaan rumah; Isi 2: Mempercepat kerja menyiapkan projek perumahan","Isi 1: Mempercepat tempoh siap pembinaan; Isi 2: Mengurangkan sisa bahan binaan dan pencemaran tapak","Isi 1: Menjamin kawalan kualiti komponen kilang; Isi 2: Mengurangkan kebergantungan kepada buruh asing","Isi 1: Meningkatkan keselamatan pekerja di tapak; Isi 2: Menjimatkan kos pengurusan jangka panjang"],"correctIndex":0,"explanation":"'Menjimatkan masa' dan 'mempercepat kerja menyiapkan projek' merujuk idea yang sama! Isi berbeza mesti meliputi aspek masa, kebersihan tapak, kualiti dan kebergantungan buruh."}]},{"id":"bm45-u5","title":"Unit 5: Cabaran Boss SPM — Memacu Produktiviti","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Kata Kerja Transitif & Pasif, Peribahasa Konteks, Kerangka & Suntingan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Suntingan Ayat Kata Kerja","voiceCaption":"Soalan Boss pertama mengesan kesilapan tatabahasa kata kerja transitif, kata kerja pasif dan kata bantu.","voiceScript":"[excited] Selamat datang ke Unit Boss Tema lima! Soalan pertama menguji kepekaan kamu terhadap ayat aktif dan ayat pasif kata kerja transitif!","prompt":"Pilih ayat yang BETUL tatabahasanya mengikut Tatabahasa Dewan:","options":["Pelan tindakan produktiviti itu sedang kami teliti sebelum dibentangkan kepada pengurusan","Pelan tindakan produktiviti itu sedang diteliti oleh kami sebelum dibentangkan","Mesyuarat tadi membincangkan tentang langkah memperkenalkan sistem IBS di tapak bina","Pekerja kilang itu saling bantu-membantu demi menyiapkan tempahan pelanggan"],"correctIndex":0,"explanation":"'sedang kami teliti' mematuhi susunan ayat pasif diri pertama (kata bantu + pelaku + kata kerja dasar tanpa di-/oleh). Pilihan lain salah kerana 'diteliti oleh kami', 'membincangkan tentang', dan 'saling bantu-membantu'."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Kesalahan Imbuhan & Pelengkap","voiceCaption":"Ramalkan pembetulan yang tepat bagi kata kerja tidak transitif berpelengkap yang disalahgunakan bersama kata sendi.","voiceScript":"[curious] Soalan Boss kedua! Dalam ayat 'Pembangunan industri tempatan perlulah berlandaskan kepada teknologi hijau', mengapakah terdapat kesalahan dan bagaimanakah cara membetulkannya?","hook":"Sahkan hukum kata kerja tak transitif berpelengkap pada makmal di Unit 2!","scenario":"Ayat diuji: 'Pembangunan industri tempatan perlulah berlandaskan kepada teknologi hijau.'","prompt":"Apakah kesalahan dan pembetulan yang TEPAT bagi ayat tersebut?","options":["Gugurkan 'kepada' kerana 'berlandaskan' sudah mengandungi akhiran '-kan' (betul: berlandaskan teknologi hijau / berlandas pada teknologi hijau)","Tukar 'berlandaskan' kepada 'melandaskan tentang'","Kekalkan 'kepada' kerana semua kata kerja berawalan ber- wajib diikuti 'kepada'","Tukar 'perlulah' kepada 'adalah perlu di'"],"correctIndex":0,"proofLabId":"bm45_kata_kerja_lab","proofState":{"kkKey":"tk_pelengkap"},"explanation":"Hukum imbuhan apitan 'ber-...-kan': 'berdasarkan', 'berlandaskan', 'berpandukan', 'berteraskan' TIDAK boleh diikuti kata sendi 'pada' atau 'kepada'!"},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Tukar Ayat Pasif kepada Aktif","voiceCaption":"Susun tukaran ayat pasif 'Batik canting bermutu tinggi telah dihasilkan oleh usahawan desa itu' kepada ayat aktif yang gramatis.","voiceScript":"[confident] Soalan Boss ketiga! Tukarkan ayat pasif ini kepada ayat aktif yang lengkap tanpa mengubah maksud dan waktunya!","prompt":"Tukarkan ayat pasif 'Batik canting bermutu tinggi telah dihasilkan oleh usahawan desa itu' kepada ayat aktif:","hint":"Letakkan pelaku 'Usahawan desa itu' sebagai subjek di hadapan ayat...","answerTokens":["Usahawan desa itu","telah menghasilkan","batik canting","bermutu tinggi."],"distractors":["Telah dihasilkan oleh usahawan desa","tentang batik canting bermutu tinggi."],"explanation":"Subjek pasif ('Batik canting bermutu tinggi') bertukar menjadi objek selepas kata kerja transitif aktif ('telah menghasilkan'), dan kata sendi 'oleh' digugurkan."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Ayat & Kesalahan Bahasa","voiceCaption":"Padankan empat frasa kerja yang sering disalahgunakan dalam SPM dengan bentuk pembetulannya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat frasa kerja yang kerap memerangkap pelajar dengan pembetulannya yang tepat.","prompt":"Padankan frasa kerja salah di kiri dengan pembetulannya yang gramatis di kanan:","pairs":[{"id":"bm45b4m1","left":"berpandukan kepada peta","right":"berpandukan peta (gugurkan 'kepada')"},{"id":"bm45b4m2","left":"memberi sokongan kepada kami semua","right":"memberikan sokongan kepada kami (objek tak bernyawa guna -kan)"},{"id":"bm45b4m3","left":"mengetahui akan kepentingan bakau","right":"mengetahui kepentingan bakau (tiada 'akan')"},{"id":"bm45b4m4","left":"dibuat oleh anda","right":"anda buat (pasif pelaku diri ke-2)"}],"explanation":"Ingat pasangan akhiran 'memberi + penerima' (memberi adik wang) vs 'memberikan + objek' (memberikan wang kepada adik)!"},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Pilihan Peribahasa & Isi Karangan","voiceCaption":"Pilih gandingan isi karangan dan peribahasa yang paling tepat untuk menutup perenggan pemuliharaan hutan bakau.","voiceScript":"[excited] Soalan Boss terakhir Tema lima! Pilih ayat penegas yang paling tepat menggabungkan kepentingan hutan bakau dengan peribahasa yang sesuai.","prompt":"Antara ayat penegas berikut, manakah yang PALING tepat untuk menutup perenggan isi tentang pemuliharaan hutan paya bakau?","options":["Tegasnya, pemuliharaan hutan paya bakau mesti dilakukan sejak awal sebelum ekosistem pantai terjejas teruk, bak kata peribahasa sediakan payung sebelum hujan","Tegasnya, pokok bakau perlu ditebang segera kerana harimau mati meninggalkan belang, manusia mati meninggalkan nama","Jelaslah bahawa industri robotik menggantikan hutan bakau kerana bagai kacang lupakan kulit","Kesimpulannya, para nelayan wajar berhenti menangkap ikan bak kata peribahasa seperti katak di bawah tempurung"],"correctIndex":0,"explanation":"'Sediakan payung sebelum hujan' tepat menyokong langkah pemuliharaan pencegahan sebelum kerosakan ekosistem pantai berlaku."}]}]};</script>

(function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") window.NotaAudio.playTypewriterTick();

  function renderArchivalGallery(keys, headLabel) {

    var items = (keys || []).map(function (k) { return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null; }).filter(Boolean);
    if (items.length === 0) return "";
    var cards = items.map(function (it, idx) {
      var r = it.rec;
      var src = r.dataUri || r.src || "";
      var prio = idx === 0 ? ' fetchpriority="high"' : ' loading="lazy"';
      return (
        '<button type="button" class="archival-plate-btn" data-bm45-plate="' + esc(it.key) + '">' +

    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};

  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
