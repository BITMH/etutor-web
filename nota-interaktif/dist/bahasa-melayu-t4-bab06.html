/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab06","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":6,"title":"Dunia Pelancongan","subtitle":"Tema 6 BM T4 KSSM — Malaysia Syurga Makanan, Taman Negara, Tapak Warisan UNESCO & Pelancong Hijau, Jenis Perenggan Pendahuluan (SP 3.4.2), Kata Adjektif & Penguat (SP 5.2.3) serta Peribahasa (SP 4.2.1).","estimatedMinutes":26,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab06-labs.js","coverIcon":"../assets/icons/bm46-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan perenggan pendahuluan, kata adjektif dan kata penguat kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Hukum penguat darjah penghabisan dan jenis pendahuluan berjaya kamu kuasai!","encourage":"[softly] Hampir kena... jangan berputus asa! [warm] Semak semula larangan gandingan paling dengan sekali dan imbuhan ter dengan sekali.","celebrate":"[excited] Syabas! Tema keenam Bahasa Melayu Tingkatan empat berjaya kamu selesaikan!"},"units":[{"id":"bm46-u1","title":"Unit 1: Ekopelancongan, Gastronomi & Warisan Dunia","subtitle":"SP 1.4.1 & 2.3.1 — Malaysia Syurga Makanan, Taman Negara, Tapak Warisan UNESCO & Pelancong Hijau","iconType":"map","iconUrl":"../assets/icons/bm46-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Segmen Pelancongan Malaysia","voiceCaption":"Tema enam meneroka potensi pelancongan Malaysia merangkumi pelancongan gastronomi, ekopelancongan Taman Negara, Tapak Warisan Dunia UNESCO serta inap desa komuniti.","voiceScript":"[warm] Selamat datang ke Tema enam Bahasa Melayu Tingkatan empat, Dunia Pelancongan! Malaysia mempunyai produk pelancongan bertaraf dunia daripada kepelbagaian sajian makanan warisan hinggalah ke Tapak Warisan Dunia UNESCO seperti Taman Negara Gunung Mulu, Taman Kinabalu, Bandar Raya Melaka, George Town dan Lembah Lenggong! Dalam buku teks, anda turut diperkenalkan kepada konsep PELANCONG HIJAU serta pengalaman inap desa Pos Kuala Mu yang membolehkan pelancong menghayati keindahan alam tanpa mencemarkan ekosistem atau budaya masyarakat setempat!","title":"2.3.1 Kepelbagaian Produk Pelancongan & Pelancongan Hijau","acronym":"G•E•W•I","hook":"Kenali 4 segmen pelancongan utama Malaysia sebagai bank contoh konkrit untuk karangan SPM!","mediaKey":"bm46_taman_negara_mulu","summary":"Sektor pelancongan Malaysia merangkumi pelancongan gastronomi, ekopelancongan hijau, pelancongan warisan UNESCO serta agropelancongan inap desa.","bullets":["Pelancongan Gastronomi (Malaysia Syurga Makanan): Keunikan makanan berbilang kaum (laksa, nasi lemak, dim sum, roti canai, kuih tradisional) menarik minat pelancong antarabangsa.","Ekopelancongan & Pelancong Hijau (Tahan Menghijau & Pos Kuala Mu): Menikmati alam semula jadi seperti Taman Negara dan perkampungan Orang Asli secara bertanggungjawab — sifar pembuangan sampah dan menyokong ekonomi komuniti tempatan.","Tapak Warisan Dunia UNESCO Malaysia: Meliputi kategori tapak semula jadi (Taman Kinabalu, Taman Negara Gunung Mulu) dan tapak warisan budaya/arkeologi (George Town, Melaka, Lembah Lenggong)."],"examTip":"Semasa menulis karangan langkah memajukan sektor pelancongan, selitkan nama destinasi sebenar seperti Taman Negara Gunung Mulu atau Lembah Lenggong sebagai contoh konkrit yang matang!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Warisan Semula Jadi vs Budaya","voiceCaption":"Kelaskan enam tarikan pelancongan daripada Tema enam berikut antara Ekopelancongan Alam dengan Pelancongan Budaya & Gastronomi.","voiceScript":"[curious] Asingkan keenam-enam produk pelancongan Malaysia ini mengikut kategorinya: Ekopelancongan Alam atau Pelancongan Budaya dan Gastronomi.","prompt":"Kelaskan tarikan pelancongan berikut mengikut segmennya yang tepat:","buckets":[{"id":"eko","label":"Ekopelancongan & Alam Semula Jadi"},{"id":"budaya","label":"Warisan Budaya, Sejarah & Gastronomi"}],"items":[{"text":"Meniti jambatan gantung kanopi di Taman Negara Pahang","bucketId":"eko","note":"Betul! Aktiviti ekopelancongan hutan hujan tropika."},{"text":"Menikmati hidangan kuih warisan dan laksa tempatan di pasar malam","bucketId":"budaya","note":"Tepat! Tarikan pelancongan gastronomi."},{"text":"Meneroka formasi batu kapur di Taman Negara Gunung Mulu","bucketId":"eko","note":"Betul! Tapak Warisan Dunia UNESCO kategori semula jadi."},{"text":"Melawat seni bina bersejarah di Melaka dan George Town","bucketId":"budaya","note":"Tepat! Tapak Warisan Dunia UNESCO kategori budaya."},{"text":"Menginap di calet eko Pos Kuala Mu tanpa pencemaran plastik","bucketId":"eko","note":"Betul! Amalan pelancongan hijau dan komuniti."},{"text":"Menyaksikan persembahan tarian kebudayaan dan kraf tradisional","bucketId":"budaya","note":"Tepat! Pelancongan warisan seni."}],"explanation":"Mengenal pasti segmen pelancongan membantu pelajar mempelbagaikan isi karangan pelancongan supaya tidak hanya mengulang lokasi pantai semata-mata."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Tanggungjawab Pelancong Hijau","voiceCaption":"Padankan empat prinsip Pelancong Hijau dengan amalan konkritnya di destinasi pelancongan.","voiceScript":"[confident] Padankan setiap prinsip Pelancong Hijau berikut dengan amalan bertanggungjawab yang sepatutnya dilakukan!","prompt":"Padankan prinsip Pelancong Hijau berikut dengan amalannya:","pairs":[{"id":"bm46u1m1","left":"Mengurangkan jejak karbon perjalanan","right":"Menggunakan pengangkutan awam atau berbasikal di kawasan warisan"},{"id":"bm46u1m2","left":"Pemeliharaan biodiversiti rimba","right":"Tidak memetik flora liar atau mengganggu habitat haiwan"},{"id":"bm46u1m3","left":"Sokongan ekonomi komuniti tempatan","right":"Membeli hasil kraf dan menginap di inap desa penduduk setempat"},{"id":"bm46u1m4","left":"Pengurusan sisa sifar plastik","right":"Membawa botol air guna semula dan membawa keluar sampah sendiri"}],"explanation":"Konsep Pelancong Hijau mengimbangi keseronokan bercuti dengan tanggungjawab memulihara alam dan menyokong komuniti."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Tujuan Inap Desa Komuniti","voiceCaption":"Pilih pernyataan yang tepat menjelaskan kelebihan pelancongan inap desa seperti di Pos Kuala Mu kepada penduduk kampung.","voiceScript":"[confident] Apakah faedah utama pembangunan projek inap desa seperti di Pos Kuala Mu kepada masyarakat setempat?","prompt":"Mengapakah program inap desa seperti di Pos Kuala Mu wajar diperluas di kawasan luar bandar?","options":["Menjana pendapatan langsung kepada penduduk kampung sambil memperkenalkan keunikan budaya tradisional kepada pelancong","Menggantikan semua kawasan hutan dengan pusat beli-belah bertingkat tinggi","Menghalang pelancong daripada berinteraksi dengan penduduk tempatan","Menghapuskan bahasa ibunda serta adat resam masyarakat desa"],"correctIndex":0,"explanation":"Inap desa memberi limpahan ekonomi terus kepada penduduk desa di samping memelihara warisan budaya."}]},{"id":"bm46-u2","title":"Unit 2: Jenis Perenggan Pendahuluan Karangan","subtitle":"SP 3.4.2 — Menulis Pendahuluan Jenis Sejarah, Suasana, Peribahasa, Definisi & Persoalan yang Gramatis","iconType":"book","iconUrl":"../assets/icons/bm46-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Jenis Pendahuluan Karangan SP 3.4.2","voiceCaption":"Perenggan pendahuluan yang memikat boleh dibina mengikut jenis sejarah, suasana, peribahasa, definisi atau persoalan sebelum diakhiri dengan ayat arah tugasan soalan.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam Tema enam buku teks, Standard Pembelajaran tiga perpuluhan empat perpuluhan dua melatih anda menulis pelbagai jenis PERENGGAN PENDAHULUAN yang memukau pemeriksa! Elakkan pendahuluan klise yang membosankan seperti 'Pada zaman moden ini, pelancongan sangat penting'! Sebaliknya, pilih satu daripada gaya mantap ini: pendahuluan jenis SEJARAH yang memetik zaman Kesultanan Melaka; jenis SUASANA yang melukis keindahan alam Taman Negara; jenis PERIBAHASA seperti jauh perjalanan luas pemandangan; atau jenis DEFINISI Kamus Dewan! Ingat, setiap pendahuluan wajib diakhiri dengan AYAT ARAH yang menjawab fokus soalan! Uji pembina pendahuluan di bawah!","title":"3.4.2 Pelbagai Jenis Perenggan Pendahuluan + Ayat Arah","acronym":"S•S•P•D","hook":"Bandingkan 4 jenis ayat rangsangan dan ayat arah dalam Makmal Pendahuluan di bawah!","mediaKey":"bm46_gastronomi_melaka","summary":"Perenggan pendahuluan terdiri daripada Ayat Rangsangan (mengikut teknik sejarah, suasana, peribahasa, definisi atau persoalan) dan Ayat Arah yang memfokuskan tugasan soalan.","bullets":["Struktur Pendahuluan Ideal (3–5 ayat): Ayat Rangsangan (AR — memperkenalkan tema melalui sejarah/suasana/peribahasa/definisi) -> Ayat Huraian Isu Semasa -> Ayat Arah (AA — menyatakan tugasan soalan seperti punca/langkah/kepentingan).","Larangan Penting Pendahuluan: JANGAN masukkan isi-isi utama (seperti 'langkah pertama ialah...') secara terperinci dalam pendahuluan! Simpan isi untuk perenggan isi.","Kesalahan Ayat Pendahuluan Klise: Elakkan memulakan karangan dengan 'Sejak akhir-akhir ini, isu...' berulang-ulang tanpa variasi kosa kata."],"labId":"bm46_pendahuluan_lab","labTitle":"Penjelajah Jenis Perenggan Pendahuluan (SP 3.4.2)","labProps":{"pKey":"sejarah"},"examTip":"Pendahuluan Gabungan (Peribahasa + Suasana atau Definisi + Isu Semasa) sering meraih markah impresi tertinggi bagi karangan cemerlang SPM!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Jenis Pendahuluan & Contoh Ayat","voiceCaption":"Padankan empat jenis perenggan pendahuluan dengan ayat pembukanya yang tepat.","voiceScript":"[confident] Kenal pasti gaya pembukaan setiap perenggan pendahuluan berikut dan padankan dengan jenisnya yang tepat!","prompt":"Padankan jenis pendahuluan dengan contoh ayat rangsangannya:","pairs":[{"id":"bm46u2m1","left":"Pendahuluan Jenis Sejarah","right":"Sejak zaman Kesultanan Melayu Melaka, pelabuhan di Selat Melaka menjadi tumpuan pengembara dunia."},{"id":"bm46u2m2","left":"Pendahuluan Jenis Suasana","right":"Kedinginan bayu pagi dan kicauan unggas di puncak gunung menyegarkan jiwa setiap pengunjung."},{"id":"bm46u2m3","left":"Pendahuluan Jenis Peribahasa","right":"Peribahasa jauh perjalanan luas pemandangan membuktikan melancong memperkaya pengetahuan."},{"id":"bm46u2m4","left":"Pendahuluan Jenis Persoalan","right":"Mengapakah Malaysia terus menjadi pilihan jutaan pelancong asing saban tahun?"}],"explanation":"Menguasai pelbagai jenis pendahuluan membolehkan anda menyesuaikan nada karangan mengikut format (rencana, fakta atau deskriptif)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Pendahuluan Jenis Peribahasa","voiceCaption":"Susun bahagian ayat menjadi perenggan pendahuluan jenis peribahasa yang diakhiri dengan ayat arah.","voiceScript":"[curious] Susun ayat-ayat berikut menjadi satu perenggan pendahuluan jenis peribahasa yang mantap bagi tajuk langkah memajukan ekopelancongan!","prompt":"Susun perenggan pendahuluan jenis peribahasa bagi karangan 'Langkah Memajukan Ekopelancongan':","hint":"Mulakan dengan peribahasa, kaitkan dengan tema alam, dan akhiri dengan ayat arah langkah...","answerTokens":["Peribahasa ada menyebut, tak kenal maka tak cinta yang menzahirkan kepentingan meneroka keunikan dunia luar.","Malaysia bertuah kerana memiliki khazanah hutan hujan tertua di dunia seperti Taman Negara Pahang.","Oleh itu, pelbagai langkah proaktif perlu dilaksanakan untuk memajukan sektor ekopelancongan secara mampan."],"distractors":["Langkah pertama yang perlu dibuat ialah membina hotel mewah di puncak gunung.","Kesimpulannya, semua pelancong mesti pulang sebelum senja."],"explanation":"Pendahuluan bergerak daripada ungkapan umum (AR) -> konteks Malaysia -> Ayat Arah tugasan ('pelbagai langkah proaktif...'), tanpa membocorkan isi terperinci."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Kelemahan Pendahuluan Karangan","voiceCaption":"Kenal pasti kesilapan struktur dalam draf perenggan pendahuluan yang menyertakan huraian isi penuh.","voiceScript":"[confident] Mengapakah draf pendahuluan yang sudah menghuraikan tiga isi utama beserta contoh terperinci dianggap lemah dalam peperiksaan S P M?","prompt":"Mengapakah pelajar TIDAK digalakkan memasukkan huraian isi terperinci ke dalam perenggan pendahuluan?","options":["Menyebabkan pengulangan isi apabila menulis perenggan isi dan menjadikan perenggan pendahuluan terlalu panjang tanpa fokus","Kerana perenggan pendahuluan hanya dibenarkan mengandungi satu patah perkataan sahaja","Kerana ayat arah tidak boleh ditulis pada akhir perenggan pendahuluan","Kerana peribahasa diharamkan di dalam perenggan pendahuluan"],"correctIndex":0,"explanation":"Perenggan pendahuluan berperanan memperkenalkan isu dan menyatakan fokus tugasan (ayat arah), bukannya menghuraikan isi."}]},{"id":"bm46-u3","title":"Unit 3: Golongan Kata Adjektif & Hukum Kata Penguat","subtitle":"SP 5.2.3 — 9 Jenis Kata Adjektif serta Hukum Penguat Hadapan, Belakang & Bebas","iconType":"formula","iconUrl":"../assets/icons/bm46-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kata Adjektif & 3 Kata Penguat","voiceCaption":"Kata adjektif menerangkan sifat kata nama dan boleh disertai kata penguat hadapan, kata penguat belakang atau kata penguat bebas mengikut peraturan gandingan yang ketat.","voiceScript":"[warm] Selamat datang ke Unit tiga, Tatabahasa Kata Adjektif dan Kata Penguat! Dalam Tema pelancongan, kata adjektif seperti indah, permai, nyaman, enak dan bersejarah menghidupkan deskripsi destinasi! Mengikut Standard Pembelajaran lima perpuluhan dua perpuluhan tiga, ingat tiga hukum maut kata penguat S P M! Pertama, kata penguat hadapan seperti paling dan terlalu TIDAK BOLEH digabungkan dengan kata adjektif berawalan ter seperti 'paling terbaik' atau 'terlalu tercantik'! Kedua, kata penguat hadapan seperti 'paling' dan 'agak' TIDAK BOLEH digabungkan dengan penguat belakang 'sekali' seperti 'paling indah sekali'! Ketiga, hanya penguat bebas iaitu amat, sangat dan sungguh dibenarkan berganding dengan 'sekali' di belakang seperti 'amat indah sekali'! Uji gandingan sah dan salah pada makmal di bawah!","title":"5.2.3 Golongan Kata Adjektif & Hukum Kata Penguat","acronym":"H•B•BBS","hook":"Bandingkan gandingan sah vs salah bagi Penguat Hadapan, Belakang dan Bebas dalam makmal di bawah!","summary":"Kata adjektif terdiri daripada 9 jenis (sifatan, warna, ukuran, bentuk, waktu, jarak, cara, perasaan, pancaidera); gandingan dengan kata penguat dan awalan 'ter-' mematuhi hukum larangan kelewahan.","bullets":["3 Jenis Kata Penguat: (1) Hadapan: terlalu, paling, agak, cukup, makin; (2) Belakang: sekali, benar, nian, betul; (3) Bebas: amat, sangat, sungguh.","Hukum Larangan Gandaan Darjah Penghabisan: SALAH -> 'paling terbaik', 'terlalu tercantik', 'terindah sekali', 'paling indah sekali', 'agak besar sekali'. BETUL -> 'terbaik' / 'paling baik' / 'baik sekali' / 'amat baik sekali' / 'teramat baik'.","Pengujian Frasa Adjektif: Kata adjektif boleh disertai kata penguat 'sangat/amat' (cth. sangat indah -> adjektif; tetapi 'sangat membaca' -> SALAH kerana membaca ialah kata kerja!)."],"labId":"bm46_adjektif_penguat_lab","labTitle":"Penguji Hukum Kata Penguat & Kata Adjektif (SP 5.2.3)","labProps":{"pType":"hadapan"},"examTip":"Pengecualian penting 'amat/sangat/sungguh': Penguat bebas BOLEH digandingkan dengan 'sekali' ('sungguh cantik sekali') DAN boleh menguatkan kata adjektif berawalan 'ter-' dalam bentuk 'teramat indah' atau 'tersangat indah'!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Frasa Adjektif Gramatis vs Lewah","voiceCaption":"Asingkan enam frasa adjektif berikut antara Frasa Gramatis dengan Frasa Lewah atau Salah.","voiceScript":"[curious] Elakkan perangkap darjah penghabisan S P M! Asingkan keenam-enam frasa adjektif berikut kepada Frasa Gramatis atau Frasa Lewah dan Salah.","prompt":"Kelaskan frasa adjektif berikut kepada Frasa Gramatis atau Frasa Salah/Lewah:","buckets":[{"id":"sah","label":"Frasa Adjektif Gramatis"},{"id":"salah","label":"Frasa Salah / Lewah"}],"items":[{"text":"amat indah sekali pemandangan di puncak gunung itu","bucketId":"sah","note":"Betul! Penguat bebas 'amat' boleh berganding dengan 'sekali'."},{"text":"paling tertinggi di Semenanjung Malaysia","bucketId":"salah","note":"SALAH! Gandaan darjah penghabisan 'paling' + 'ter-'."},{"text":"sungguh enak nian masakan tradisional Pahang ini","bucketId":"sah","note":"Betul! Penguat bebas 'sungguh' berganding dengan penguat belakang 'nian'."},{"text":"paling cantik sekali di antara semua destinasi","bucketId":"salah","note":"SALAH! Penguat hadapan 'paling' tidak boleh berganding dengan 'sekali' (serta 'di antara' bagi perbandingan abstrak adalah salah)."},{"text":"terlalu mahal bagi pelancong bajet","bucketId":"sah","note":"Betul! Penguat hadapan 'terlalu' digunakan tepat."},{"text":"terindah sekali di rantau Asia Tenggara","bucketId":"salah","note":"SALAH! Awalan 'ter-' tidak boleh berganding dengan 'sekali'."}],"explanation":"Hanya penguat bebas (amat, sangat, sungguh) boleh berpasangan dengan penguat belakang (sekali, benar, nian)!"},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Jenis Kata Adjektif & Contoh","voiceCaption":"Padankan lima subgolongan kata adjektif dengan perkataan contohnya dalam konteks pelancongan.","voiceScript":"[confident] Padankan lima jenis kata adjektif mengikut Tatabahasa Dewan dengan contoh perkataannya dalam teks pelancongan!","prompt":"Padankan subgolongan kata adjektif berikut dengan contoh perkataannya:","pairs":[{"id":"bm46u3m1","left":"Kata Adjektif Pancaindera (rasa/lihat/dengar)","right":"lazat, merdu, harum, rupawan"},{"id":"bm46u3m2","left":"Kata Adjektif Sifatan / Keadaan","right":"ramah, gigih, bersih, aman"},{"id":"bm46u3m3","left":"Kata Adjektif Waktu","right":"silam, baharu, segera, lampau"},{"id":"bm46u3m4","left":"Kata Adjektif Jarak","right":"jauh, dekat, hampir, nyaris"},{"id":"bm46u3m5","left":"Kata Adjektif Cara","right":"pantas, deras, lincah, gopoh"}],"explanation":"Kesemua sembilan jenis kata adjektif memperkaya gaya penulisan deskriptif dan naratif dalam karangan SPM."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Pilih Ayat Adjektif Tanpa Kesalahan","voiceCaption":"Pilih ayat yang betul penggunaan kata adjektif, kata penguat dan kata sendi namanya.","voiceScript":"[confident] Kenal pasti ayat yang seratus peratus betul kata adjektif dan kata penguatnya!","prompt":"Pilih ayat yang menggunakan kata adjektif dan kata penguat dengan BETUL:","options":["Pemandangan matahari terbenam di pantai itu sungguh mempesonakan sekali","Suasana malam di perkampungan inap desa itu paling damai sekali","Gunung Kinabalu merupakan puncak yang paling tertinggi di Malaysia","Rasa rendang daging buatan nenek sangat lazat sekali"],"correctIndex":3,"explanation":"Pembetulan teliti! Pilihan A 'mempesonakan' ialah kata kerja transitif (bukan adjektif, jadi tidak boleh bersama 'sekali'); pilihan B salah ('paling... sekali'); pilihan C salah ('paling tertinggi'). Pilihan D 'sangat lazat sekali' adalah BETUL kerana 'lazat' ialah kata adjektif dan 'sangat' ialah penguat bebas yang sah berganding dengan 'sekali'!"}]},{"id":"bm46-u4","title":"Unit 4: Peribahasa Pelancongan & Pengolahan Grafik","subtitle":"SP 4.2.1 & 3.5.2 — Komik Peribahasa 'Sambil Menyelam Minum Air', Menilai Bahan Pelancongan & Ulasan Grafik","iconType":"scale","iconUrl":"../assets/icons/bm46-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Peribahasa & Olahan Bahan Grafik","voiceCaption":"Penggunaan peribahasa seperti sambil menyelam minum air serta kebolehan mentafsir statistik pelancongan mengukuhkan kemahiran penulisan ulasan dan rumusan Kertas dua.","voiceScript":"[warm] Selamat datang ke Unit empat! Dalam Tema enam buku teks, anda diuji dengan Komik Peribahasa seperti 'sambil menyelam minum air', 'jauh perjalanan luas pemandangan', dan 'hujan emas di negeri orang, hujan batu di negeri sendiri'! Selain itu, Standard Pembelajaran tiga perpuluhan lima perpuluhan dua melatih anda mengolah maklumat grafik seperti data jumlah pelancong dan pendapatan negara menjadi perenggan laporan atau ulasan yang lancar menggunakan penanda wacana perbandingan!","title":"4.2.1 & 3.5.2 Peribahasa Konteks Pelancongan & Olahan Data","acronym":"P•D•U•G","hook":"Gabungkan data statistik (bilangan pelancong & pendapatan) dengan kesimpulan peribahasa tepat!","summary":"Peribahasa bertema pengembaraan memperindah wacana, manakala kemahiran mengolah data grafik melatih keupayaan menulis Rumusan serta Karangan Bahan Rangsangan SPM.","bullets":["Peribahasa Konteks Pelancongan (Tema 6): 'Sambil menyelam minum air' (melakukan dua kerja bermanfaat serentak, cth. bercuti sambil belajar budaya); 'Jauh perjalanan, luas pemandangan' (melancong menambah pengalaman); 'Masuk kandang kambing mengembek, masuk kandang kerbau menguak' (menyesuaikan diri dengan adat tempatan).","Olahan Maklumat Grafik ke Prosa (SP 3.5.2): Nyatakan trend utama (meningkat/menurun), bandingkan angka tertinggi vs terendah, dan rumuskan faktor penyebab tanpa menyenaraikan angka secara mekanikal.","Ejaan Istilah Pelancongan DBP: 'e-mel' (bersempang), 'inap desa' (jarak), 'cenderamata' (cantum), 'pelancong' (bukan pelancung!)."],"examTip":"Awas ejaan perkataan dalam Tema 6: 'pelancong' (orang yang melancong) vs 'pelancung' (penipu!). Pastikan huruf 'o' pada 'pelancong' dan 'melancong'!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Peribahasa Pengembaraan & Maksud","voiceCaption":"Padankan empat peribahasa berkaitan perjalanan dan budaya dengan maksud tepatnya.","voiceScript":"[confident] Padankan keempat-empat peribahasa pelancongan ini dengan situasi dan maksudnya yang tepat!","prompt":"Padankan peribahasa berikut dengan maksudnya dalam konteks pelancongan:","pairs":[{"id":"bm46u4m1","left":"Sambil menyelam minum air","right":"Menghadiri seminar kerja sambil bercuti melawat tempat bersejarah"},{"id":"bm46u4m2","left":"Masuk kandang kambing mengembek, masuk kandang kerbau menguak","right":"Menghormati dan menyesuaikan diri dengan adat resam masyarakat tempatan"},{"id":"bm46u4m3","left":"Hujan emas di negeri orang, hujan batu di negeri sendiri, lebih baik di negeri sendiri","right":"Seindah mana pun negara luar, tanah air sendiri tetap paling dicintai"},{"id":"bm46u4m4","left":"Tak kenal maka tak cinta","right":"Setelah melawat dan merasai budaya tempatan barulah timbul rasa kasih"}],"explanation":"Kesemua peribahasa ini amat sesuai diselitkan dalam karangan pelancongan domestik dan antarabangsa."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Pembetulan Ejaan Pelancongan","voiceCaption":"Ramalkan kumpulan ejaan perkataan yang betul semuanya mengikut Kamus Dewan bagi penulisan brosur dan karangan pelancongan.","voiceScript":"[curious] Elakkan kesilapan ejaan yang memotong markah! Manakah senarai ejaan perkataan pelancongan yang kesemuanya tepat?","hook":"Perhatikan ejaan jarak/rapat bagi 'inap desa', 'cenderamata', 'pelancong' dan 'pasar raya'!","scenario":"Empat perkataan disemak untuk brosur pelancongan: inap desa, cenderamata, pelancong, pasar raya.","prompt":"Pilih himpunan perkataan yang kesemuanya DIEJA BETUL mengikut Kamus Dewan:","options":["inap desa, cenderamata, pelancong, pasar raya, e-mel","inapdesa, cendera mata, pelancung, pasaraya, emel","inap desa, cendera mata, pelancong, pasaraya, e-mel","inapdesa, cenderamata, pelancung, pasar raya, emel"],"correctIndex":0,"proofLabId":"bm46_pendahuluan_lab","proofState":{"pKey":"definisi"},"explanation":"'inap desa', 'pasar raya' dan 'e-mel' dieja terpisah/bersempang; 'cenderamata' dieja rapat; 'pelancong' menggunakan huruf 'o'."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ulasan Data Pelancongan Tepat","voiceCaption":"Pilih ayat olahan data statistik pelancongan yang paling padat, jelas dan gramatis.","voiceScript":"[confident] Pilih ayat olahan grafik terbaik berdasarkan data dua puluh perpuluhan satu juta pelancong dengan pendapatan enam puluh enam perpuluhan satu bilion ringgit!","prompt":"Berdasarkan data 20.1 juta pelancong yang menjana RM66.1 bilion, pilih ayat olahan maklumat yang PALING gramatis:","options":["Kehadiran seramai 20.1 juta orang pelancong antarabangsa berjaya menjana pendapatan negara sebanyak RM66.1 bilion","Kehadiran seramai 20.1 juta pelancong-pelancong antarabangsa telah memberi pendapatan sebanyak RM66.1 billion","Pelancong yang ramai sebanyak 20.1 juta telah membeli makanan RM66.1 bilion","Di antara pelancong yang datang ialah seramai 20.1 juta orang di Malaysia"],"correctIndex":0,"explanation":"Ejaan tepat ialah 'bilion' (satu 'l' dalam bahasa Melayu, bukan 'billion'), tiada gandaan selepas bilangan ('20.1 juta pelancong-pelancong' salah), dan menggunakan penjodoh bilangan 'orang'."}]},{"id":"bm46-u5","title":"Unit 5: Cabaran Boss SPM — Dunia Pelancongan","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Kata Adjektif & Penguat, Pendahuluan Karangan, Ejaan & Peribahasa","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Suntingan Ayat Penguat & Adjektif","voiceCaption":"Soalan Boss pertama mengesan ayat yang bebas daripada kesalahan kata penguat, kata adjektif dan ejaan pelancongan.","voiceScript":"[excited] Selamat datang ke Unit Boss Tema enam! Soalan pertama menguji penguasaan keseluruhan tatabahasa kata penguat dan ejaan dalam ayat pelancongan!","prompt":"Pilih ayat yang BEBAS daripada sebarang kesalahan bahasa dan ejaan:","options":["Keindahan pulau peranginan di Sabah sungguh memukau hati setiap pelancong yang berkunjung ke sana","Pulau Tioman merupakan antara pulau yang paling tercantik sekali di Malaysia","Pelbagai cendera mata dijual di pasaraya berdekatan kawasan inapdesa tersebut","Masakan tradisi negeri Pahang itu terlalu sedap sekali sehingga digemari pelancong"],"correctIndex":0,"explanation":"'sungguh memukau hati' adalah betul ('sungguh' menguatkan frasa kerja emotif 'memukau hati'). Sebaliknya 'paling tercantik sekali', 'terlalu sedap sekali', 'cendera mata', 'pasaraya', dan 'inapdesa' semuanya salah!"},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Gandingan Teramat & Tersangat","voiceCaption":"Ramalkan keabsahan bentuk gandingan kata penguat teramat dan tersangat dengan kata adjektif mengikut Tatabahasa Dewan.","voiceScript":"[curious] Soalan Boss kedua menguji hukum khusus Tatabahasa Dewan! Antara frasa berikut, manakah bentuk darjah penghabisan dengan awalan ter yang dibenarkan secara rasmi?","hook":"Ingat pengecualian: 'teramat' + adjektif dan 'tersangat' + adjektif adalah SAH!","scenario":"Empat frasa diuji: (A) teramat indah, (B) paling terindah, (C) terindah sekali, (D) sangat terindah.","prompt":"Manakah frasa adjektif yang SAH mengikut Tatabahasa Dewan?","options":["teramat indah (dan tersangat indah)","paling terindah","terindah sekali","terlalu terindah"],"correctIndex":0,"proofLabId":"bm46_adjektif_penguat_lab","proofState":{"pType":"bebas"},"explanation":"Mengikut Tatabahasa Dewan, 'teramat + adjektif' dan 'tersangat + adjektif' (dan 'amat + adjektif + sekali') adalah bentuk yang gramatis."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Bina Pendahuluan Jenis Suasana","voiceCaption":"Susun ayat menjadi satu perenggan pendahuluan jenis suasana yang diakhiri ayat arah tentang kepentingan pelancongan hijau.","voiceScript":"[confident] Soalan Boss ketiga! Susun ayat-ayat berikut menjadi perenggan pendahuluan jenis suasana yang mantap bagi karangan pelancongan hijau!","prompt":"Susun perenggan pendahuluan jenis suasana tentang pelancongan hijau:","hint":"Mulakan dengan gambaran suasana alam, sambung realiti semasa, dan akhiri dengan ayat arah...","answerTokens":["Deruan air sungai yang jernih dan udara rimba yang nyaman menjadi terapi ketenangan kepada pengunjung Taman Negara.","Keaslian ekosistem ini menjadikan Malaysia destinasi ekopelancongan pilihan pelawat tempatan mahupun antarabangsa.","Oleh hal demikian, amalan pelancongan hijau amat penting dipupuk bagi melestarikan khazanah alam negara."],"distractors":["Paling indah sekali pemandangan di sana sehingga pelancung datang setiap hari.","Jelaslah, semua kilang perlu dibina di dalam hutan simpan tersebut."],"explanation":"Pendahuluan jenis suasana memikat pembaca melalui imej deria alam sebelum mengemukakan Ayat Arah mengenai kepentingan pelancongan hijau."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Kesalahan Kata & Pembetulannya","voiceCaption":"Padankan empat kesalahan bahasa lazim dalam karangan pelancongan dengan bentuk yang betul.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat kesalahan ejaan dan tatabahasa pelancongan ini dengan pembetulannya.","prompt":"Padankan kesalahan bahasa di kiri dengan pembetulan tepatnya di kanan:","pairs":[{"id":"bm46b4m1","left":"pelancung asing","right":"pelancong asing"},{"id":"bm46b4m2","left":"amat cantik sekali vs paling cantik sekali","right":"'amat cantik sekali' BETUL; 'paling cantik sekali' SALAH"},{"id":"bm46b4m3","left":"RM66.1 billion","right":"RM66.1 bilion"},{"id":"bm46b4m4","left":"memperluaskan promosi pelancongan","right":"memperluas promosi pelancongan"}],"explanation":"Menyedari kesalahan ejaan pinjaman ('bilion'), kosa kata ('pelancong'), dan hukum penguat/imbuhan memastikan karangan anda bebas daripada pemotongan markah bahasa."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Rumusan Tema Pelancongan Lestari","voiceCaption":"Pilih pernyataan kesimpulan yang paling tepat mengenai keseimbangan pembangunan pelancongan dengan pemuliharaan alam sekitar.","voiceScript":"[excited] Soalan Boss terakhir Tema enam! Apakah prinsip teras yang perlu dipatuhi dalam membangunkan destinasi warisan dan ekopelancongan negara?","prompt":"Bagaimanakah negara dapat memacu pertumbuhan sektor pelancongan tanpa menjejaskan Tapak Warisan Dunia dan alam sekitar?","options":["Menguatkuasakan amalan pelancongan hijau, kawalan had pengunjung serta penglibatan aktif komuniti setempat","Membina lebuh raya merentasi seluruh kawasan taman negara tanpa kajian impak alam sekitar","Menghentikan promosi pelancongan ke luar negara secara menyeluruh","Menggantikan bangunan warisan sejarah dengan bangunan pencakar langit moden"],"correctIndex":0,"explanation":"Pelancongan mampan menggabungkan pemuliharaan alam, kawalan daya tampung destinasi dan pemerkasaan ekonomi komuniti."}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
