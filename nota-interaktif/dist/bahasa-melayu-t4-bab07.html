/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab07","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":7,"title":"Demi Kedamaian","subtitle":"Tema 7 BM T4 KSSM — Keselamatan Pekerjaan NIOSH, Ancaman Siber & Penipuan Macau, Kata Adjektif (SP 5.2.3), Pendahuluan Pelbagai Jenis (SP 3.4.2), Skrip Drama & Misi BSMM.","estimatedMinutes":26,"themeAccent":"#0284c7","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab07-labs.js","coverIcon":"../assets/icons/bm47-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Kepekaan kamu terhadap tatabahasa kata adjektif dan keselamatan sangat cemerlang!","combo":"[laughs warmly] Kombo yang sangat hebat! [excited] Teruskan ketelitian menganalisis modus operandi dan ayat gramatis!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula jenis kata adjektif atau perbezaan pendahuluan statistik dan suasana.","celebrate":"[excited] Tahniah! Tema ketujuh Demi Kedamaian Bahasa Melayu Tingkatan empat berjaya kamu kuasai sepenuhnya!"},"units":[{"id":"bm47-u1","title":"Unit 1: Muafakat Korporat NIOSH & Jebak Digital","subtitle":"SP 1.3.2 & 2.3.2 — Budaya Keselamatan KKP Sekolah serta Modus Operandi Cinta Siber & Penipuan Macau","iconType":"book","iconUrl":"../assets/icons/bm47-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Keselamatan Sekolah & Jebak Siber","voiceCaption":"Program keselamatan pekerjaan di sekolah dan kesedaran jenayah digital melindungi warga sekolah daripada ancaman fizikal serta penipuan siber.","voiceScript":"[warm] Selamat datang ke Tema tujuh Bahasa Melayu Tingkatan empat, Demi Kedamaian! Dalam Unit satu, kita menelusuri peranan N I O S H sejak tahun dua ribu lima belas melalui Program Keselamatan dan Kesihatan Pekerjaan di sekolah seperti Pelan Tindakan Kecemasan dan Program Jejak Ancaman. Selain keselamatan fizikal, warga digital masa kini perlu waspada terhadap dua jebak siber utama iaitu Kes Pesona Cinta Siber dan Kes Penipuan Macau yang menyamar sebagai pegawai polis atau bank melalui panggilan dan S M S palsu!","title":"1.3.2 & 2.3.2 Muafakat NIOSH KKP & Banding Beza Jenayah Siber","acronym":"KKP•SIBER","hook":"Kenali langkah keselamatan fizikal di sekolah dan bezakan taktik penipuan Cinta Siber dengan Penipuan Macau!","mediaKey":"bm47_keselamatan_siber","summary":"NIOSH memupuk budaya kerja dan belajar yang selamat menerusi KKP, manakala pengguna bijak menangkis penipuan siber dengan semakan rasmi dan tidak memuat turun aplikasi mencurigakan.","bullets":["Program KKP NIOSH di Sekolah (SP 1.3.2): Menjamin keselamatan pekerja, murid dan pelawat melalui kursus kesedaran, pertolongan cemas, Pelan Tindakan Kecemasan, Program Lima Minit dan Jejak Ancaman.","Cinta Siber vs Penipuan Macau (SP 2.3.2): Cinta siber memancing emosi mangsa melalui janji manis jangka pendek hingga sanggup memindahkan wang; penipuan Macau menyamar sebagai pegawai penguat kuasa atau bank untuk menakut-nakutkan mangsa.","Langkah Pencegahan Panggilan & SMS Palsu: Jangan panik, minta butiran pemanggil dan semak di pejabat rasmi, jangan muat turun fail A P K atau perisian hasad, serta semak kesalahan ejaan dan tatabahasa pada S M S mencurigakan."],"examTip":"Dalam soalan membanding beza bahan (SP 2.3.2), nyatakan kedua-dua persamaan (sama-sama menyasarkan kerugian kewangan melalui telefon/internet) dan perbezaan modus operandi (pujukan emosi vs ugutan undang-undang)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Taktik Cinta Siber vs Macau","voiceCaption":"Kelaskan enam ciri dan taktik penipuan digital berikut antara Kes Pesona Cinta Siber dengan Kes Penipuan Macau.","voiceScript":"[curious] Uji kecekapan analisis banding beza kamu! Asingkan keenam-enam situasi ini kepada Kes Pesona Cinta Siber atau Kes Penipuan Macau.","prompt":"Isihkan ciri modus operandi penipuan berikut ke kategori yang betul:","buckets":[{"id":"cinta","label":"Kes Pesona Cinta Siber"},{"id":"macau","label":"Kes Penipuan Macau"}],"items":[{"text":"Menggunakan ayat cinta dan janji manis dalam masa singkat","bucketId":"cinta","note":"Betul! Pujukan emosi jarak jauh ialah senjata utama sindiket cinta siber."},{"text":"Menyamar sebagai pegawai polis, mahkamah, bank atau kastam","bucketId":"macau","note":"Tepat! Penyamaran pihak berkuasa mencetuskan rasa takut mangsa."},{"text":"Meminta bantuan kewangan kononnya terdesak keluar daripada kesusahan diri","bucketId":"cinta","note":"Betul! Mangsa berkorban wang demi pasangan maya."},{"text":"Mendakwa mangsa terlibat dalam kesalahan perundangan atau hutang bank","bucketId":"macau","note":"Tepat! Taktik ugutan agar mangsa membuat bayaran penyelesaian."},{"text":"Menyasarkan mangsa yang kesunyian, lurus dan mudah percaya kenalan baharu","bucketId":"cinta","note":"Betul! Profil mangsa lazim dalam kes cinta siber."},{"text":"Mengarahkan mangsa tidak memberitahu sesiapa dan memuat turun aplikasi bank palsu","bucketId":"macau","note":"Tepat! Aplikasi hasad mendedahkan kata laluan dan butiran perbankan."}],"explanation":"Kedua-dua jenayah digital mengeksploitasi psikologi manusia, sama ada melalui keasyikan perasaan atau ketakutan terhadap undang-undang."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Program NIOSH & Langkah Waspada","voiceCaption":"Padankan aktiviti KKP sekolah dan langkah mencegah penipuan digital dengan tujuannya yang tepat.","voiceScript":"[confident] Padankan empat inisiatif keselamatan NIOSH dan langkah pencegahan panggilan palsu ini dengan fungsinya.","prompt":"Padankan aktiviti dan langkah keselamatan berikut dengan penerangannya:","pairs":[{"id":"bm47u1m1","left":"Program Jejak Ancaman (NIOSH)","right":"Mengenal pasti tanda bahaya di persekitaran sekolah sebelum kemalangan"},{"id":"bm47u1m2","left":"Pelan Tindakan Kecemasan","right":"Panduan laluan selamat dan tindakan pantas semasa krisis atau kebakaran"},{"id":"bm47u1m3","left":"Semak Talian Rasmi Agensi","right":"Menghubungi nombor laman web rasmi bank, bukan nombor dalam SMS"},{"id":"bm47u1m4","left":"Tolak Muat Turun Aplikasi Asing","right":"Mengelakkan pemasangan perisian intip yang mencuri data peribadi"}],"explanation":"Keselamatan fizikal dan digital bermula daripada kepekaan mengenal pasti punca bahaya sebelum bertindak."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Tindakan Bijak Mengelak Penipuan SMS","voiceCaption":"Pilih tindakan paling tepat apabila menerima SMS yang mengandungi pautan mencurigakan daripada nombor tidak dikenali.","voiceScript":"[confident] Jika seseorang menerima S M S mendakwa akaun banknya disekat dengan pautan pelik serta kesalahan ejaan, apakah tindakan terbaik?","prompt":"Apakah tindakan paling bijak apabila menerima SMS berunsur penipuan daripada nombor asing?","options":["Mengabaikan SMS tersebut, tidak menghubungi nombor tertera dan menyekatnya melalui penyedia perkhidmatan","Menekan pautan dalam SMS dengan segera untuk menyemak baki akaun","Menghubungi nombor telefon pengirim SMS untuk memarahinya","Memuat turun aplikasi pengesahan yang dihantar oleh pengirim SMS"],"correctIndex":0,"explanation":"Berdasarkan buku teks Tema 7, pengguna perlu menyemak ejaan dan tatabahasa SMS, mengabaikan mesej meragukan, menghubungi talian rasmi bank serta menyekat nombor spam."}]},{"id":"bm47-u2","title":"Unit 2: Golongan Kata Adjektif & Darjah Perbandingan","subtitle":"SP 5.2.3 — Sembilan Jenis Kata Adjektif serta Hukum Darjah Bandingan & Penghabisan","iconType":"formula","iconUrl":"../assets/icons/bm47-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"9 Jenis Kata Adjektif SP 5.2.3","voiceCaption":"Kata adjektif menerangkan sifat kata nama dan terbahagi kepada sembilan subgolongan termasuk sifatan, warna, ukuran, bentuk, waktu, jarak, cara, perasaan dan pancaindera.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam petikan Jebak Digital dan keselamatan badan air, terdapat banyak kata adjektif seperti licik, gundah-gulana, cemas, curam, licin dan nyaman. Mengikut Tatabahasa Dewan untuk S P lima perpuluhan dua perpuluhan tiga, kata adjektif mempunyai sembilan jenis. Jangan keliru antara kata adjektif pancaindera seperti pahit dan nyaman, kata adjektif perasaan seperti cemas dan gundah, serta kata adjektif cara seperti pantas dan cermat! Terokai kesemua sembilan kategori serta hukum darjah penghabisan dalam makmal interaktif di bawah!","title":"5.2.3 Sembilan Golongan Kata Adjektif & Darjah Perbandingan","acronym":"9•KA•DP","hook":"Klik kesemua 9 jenis Kata Adjektif dan semak peraturan darjah bandingan serta penghabisan dalam makmal!","summary":"Kata adjektif menjadi inti frasa adjektif dan boleh disertai kata penguat hadapan (terlalu, paling, agak), belakang (sekali, benar, nian) atau bebas (amat, sangat, sungguh).","bullets":["Sembilan Jenis Kata Adjektif: (1) Sifatan (bijak, licik), (2) Warna (merah, biru), (3) Ukuran (dalam, tinggi), (4) Bentuk (curam, bulat), (5) Waktu (segera, silam), (6) Jarak (jauh, rapat), (7) Cara (cermat, pantas), (8) Perasaan (cemas, gundah), (9) Pancaindera (licin, pahit, nyaman).","Darjah Bandingan & Penghabisan: Awalan 'ter-' dan penguat 'paling' TIDAK BOLEH disertai kata penguat belakang 'sekali' (SALAH: paling selamat sekali / terdalam sekali).","Kata Penguat Bebas (amat, sangat, sungguh) boleh menerima 'sekali' di belakang: amat cemas sekali, sungguh nyaman sekali."],"labId":"bm47_kata_adjektif_lab","labTitle":"Makmal 9 Golongan Kata Adjektif (SP 5.2.3)","labProps":{"catKey":"sifatan"},"examTip":"Dalam soalan pengeditan Kertas 2, perangkap utama Kata Adjektif ialah gandingan 'amat paling' atau 'terpaling' serta 'paling ... sekali' yang semuanya lewah dan salah."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Frasa Adjektif Gramatis","voiceCaption":"Ramalkan gabungan kata penguat dan kata adjektif yang betul mengikut peraturan darjah penghabisan Tatabahasa Dewan.","voiceScript":"[curious] Berhati-hati dengan hukum darjah penghabisan! Antara keempat-empat frasa adjektif berikut, manakah yang seratus peratus betul tatabahasanya?","hook":"Ingat: 'ter-' dan 'paling' tidak boleh bergandingan dengan 'sekali'!","scenario":"Empat ayat keselamatan membandingkan tahap kecerunan tebing sungai dan ketenangan suasana.","prompt":"Pilih frasa adjektif darjah penghabisan yang BETUL tatabahasanya:","options":["sungguh curam sekali / paling dalam / amat cemas sekali","paling curam sekali / terdalam sekali / amat paling cemas","terpaling curam / terlalu dalam sekali / sangat paling cemas","paling terdalam / agak curam sekali / teramat sekali cemas"],"correctIndex":0,"proofLabId":"bm47_kata_adjektif_lab","proofState":{"catKey":"bentuk"},"explanation":"Penguat bebas (sungguh, amat, sangat) boleh disertai 'sekali'; penguat hadapan 'paling' tidak boleh diikuti 'sekali'; awalan 'ter-' tidak bergabung dengan 'paling' atau 'sekali'."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Kata Adjektif Mengikut Jenis","voiceCaption":"Padankan lima kata adjektif daripada petikan Tema 7 dengan subgolongan katanya yang tepat.","voiceScript":"[confident] Uji pengelasan sembilan jenis kata adjektif! Padankan setiap perkataan daripada petikan Tema tujuh dengan golongannya.","prompt":"Padankan kata adjektif berikut dengan jenisnya mengikut Tatabahasa Dewan:","pairs":[{"id":"bm47u2m1","left":"licik / lurus (perwatakan)","right":"Kata Adjektif Sifatan atau Keadaan"},{"id":"bm47u2m2","left":"gundah-gulana / cemas","right":"Kata Adjektif Perasaan"},{"id":"bm47u2m3","left":"curam / leper","right":"Kata Adjektif Bentuk"},{"id":"bm47u2m4","left":"nyaman / pahit / licin","right":"Kata Adjektif Pancaindera"},{"id":"bm47u2m5","left":"segera / lampau","right":"Kata Adjektif Waktu"}],"explanation":"'Licik' menerangkan sifat akal, 'cemas' merujuk perasaan, 'curam' menerangkan bentuk muka bumi, 'licin/nyaman' ditanggapi pancaindera, dan 'segera' merujuk waktu."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Betulkan Kesalahan Frasa Adjektif","voiceCaption":"Pilih ayat yang menggunakan kata adjektif dan kata penguat dengan tepat mengikut konteks.","voiceScript":"[confident] Kenal pasti satu-satunya ayat yang bebas daripada kesalahan kata adjektif dan kata penguat!","prompt":"Pilih ayat yang menggunakan frasa adjektif dengan BETUL:","options":["Mangsa penipuan itu berasa amat kesal atas kecuaiannya memindahkan wang","Tebing air terjun itu paling licin sekali selepas hujan lebat turun","Laluan ke puncak bukit itu terlalu curam sekali untuk didaki pada waktu malam","Pegawai itu bertindak dengan terpantas sekali bagi menyekat akaun tersebut"],"correctIndex":0,"explanation":"'paling licin sekali', 'terlalu curam sekali' dan 'terpantas sekali' semuanya salah kerana 'paling', 'terlalu' (penguat hadapan) dan 'ter-' tidak boleh bergandingan dengan 'sekali'."}]},{"id":"bm47-u3","title":"Unit 3: Geruh-Gerah Badan Air & Teknik Pendahuluan","subtitle":"SP 3.4.2 — Membaca Data Kecemasan JBPM serta Menulis Pendahuluan Suasana, Persoalan, Statistik & Gabungan","iconType":"scale","iconUrl":"../assets/icons/bm47-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Jenis Pendahuluan Karangan SP 3.4.2","voiceCaption":"Perenggan pendahuluan karangan boleh dibina menggunakan jenis suasana, persoalan, statistik sahih atau gabungan untuk menarik minat pemeriksa.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam bahagian Geruh-gerah Badan Air, buku teks membentangkan jadual operasi lemas Jabatan Bomba dan Penyelamat Malaysia tahun dua ribu lapan belas serta dua belas panduan keselamatan di air seperti mewaspadai kepala air dan arus karau. Untuk S P tiga perpuluhan empat perpuluhan dua, kita menguasai empat jenis perenggan pendahuluan iaitu pendahuluan suasana, pendahuluan persoalan, pendahuluan statistik dan pendahuluan gabungan. Jangan sesekali memasukkan isi utama atau cadangan ke dalam pendahuluan! Gunakan makmal di bawah untuk membandingkan binaan kesemuanya.","title":"3.4.2 Keselamatan Badan Air & Jenis Perenggan Pendahuluan","acronym":"S•P•ST•G","hook":"Lihat perbezaan binaan Pendahuluan Suasana, Persoalan, Statistik dan Skrip Drama dalam makmal!","mediaKey":"bm47_misi_bsmm","summary":"Perenggan pendahuluan yang mantap terdiri daripada ayat rangsangan (suasana/persoalan/statistik), ayat huraian isu dan ayat arahan tugasan tanpa mencuri isi perenggan isi.","bullets":["Risiko Badan Air (Data JBPM 2018): Sungai dan tali air mencatat kes tertinggi (225 kehadiran, 182 maut) diikuti pantai (84 kehadiran, arus karau), tasik/lombong (37) dan air terjun (27, kepala air) daripada jumlah 380 operasi.","12 Panduan Keselamatan: Patuhi bendera keselamatan, jangan berenang bersendirian, elak berenang jika sakit atau terlalu kenyang, dan kenali tanda kepala air.","Jenis Pendahuluan (SP 3.4.2): Jenis Suasana (melukiskan keadaan/latar), Persoalan (mengajukan soalan retoris berfokus), Statistik (memetik data sahih), dan Gabungan (kombinasi teknik dengan ayat fokus)."],"labId":"bm47_pendahuluan_drama_lab","labTitle":"Bengkel Pendahuluan & Skrip Drama (SP 3.4.2 & 4.3.1)","labProps":{"mode":"statistik"},"examTip":"Dalam pendahuluan jenis statistik, sentiasa tafsirkan angka tersebut kepada trend isu keselamatan (contoh: 'Angka ini membuktikan sungai menjadi lokasi paling berisiko tinggi') sebelum menutup dengan ayat fokus."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Bina Pendahuluan Statistik & Persoalan","voiceCaption":"Susun bahagian ayat untuk membina satu perenggan pendahuluan gabungan statistik dan persoalan yang tepat bagi karangan keselamatan badan air.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk satu perenggan pendahuluan karangan keselamatan di badan air yang koheren!","prompt":"Susun segmen berikut menjadi perenggan pendahuluan jenis statistik dan persoalan yang gramatis:","hint":"Mulakan dengan data rasmi JBPM, diikuti persoalan kesedaran dan ditutup dengan ayat fokus karangan...","answerTokens":["Berdasarkan statistik Jabatan Bomba dan Penyelamat Malaysia tahun 2018,","sebanyak 380 operasi kes lemas direkodkan dengan sungai mencatat angka tertinggi iaitu 225 kes.","Persoalannya, mengapakah tragedi menyayat hati ini terus berulang walaupun amaran telah dipasang?","Oleh itu, langkah pencegahan yang berkesan wajar diperhalusi demi menjamin keselamatan pengunjung."],"distractors":["Kesimpulannya, semua sungai di negara ini perlu ditutup selama-lamanya.","Selain itu, ikan di laut juga memerlukan air yang bersih."],"explanation":"Urutan data statistik -> tafsiran angka -> persoalan retoris -> ayat fokus tugasan menghasilkan pendahuluan yang sangat matang."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Lokasi Badan Air & Bahaya Khusus","voiceCaption":"Padankan empat lokasi badan air daripada buku teks dengan risiko bahaya semula jadi utamanya.","voiceScript":"[curious] Padankan jenis badan air dengan fenomena bahaya khusus yang diterangkan dalam Tema tujuh.","prompt":"Padankan lokasi badan air berikut dengan ancaman utamanya:","pairs":[{"id":"bm47u3m1","left":"Pantai","right":"Ombak besar dan arus karau yang menarik perenang ke tengah laut"},{"id":"bm47u3m2","left":"Sungai / Air Terjun","right":"Fenomena kepala air mengejut, arus deras dan batu licin"},{"id":"bm47u3m3","left":"Tasik / Lombong Tinggal","right":"Kedalaman yang berbeza secara mendadak dan objek tenggelam"},{"id":"bm47u3m4","left":"Langkah Semasa Kejang Otot","right":"Tenangkan diri dan bergerak perlahan-lahan ke tempat selamat"}],"explanation":"Setiap persekitaran air mempunyai bentuk bahaya tersendiri; arus karau lazim di pantai manakala kepala air berlaku di hulu sungai dan air terjun."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Etika Keselamatan Aktiviti Air","voiceCaption":"Pilih pernyataan yang menepati panduan keselamatan di badan air mengikut buku teks Tema 7.","voiceScript":"[confident] Mengikut panduan keselamatan di badan air, pernyataan manakah yang betul dan selamat?","prompt":"Antara berikut, manakah amalan yang MENEPATI panduan keselamatan di badan air?","options":["Sentiasa meneliti ramalan cuaca, keadaan air pasang surut serta mematuhi bendera amaran keselamatan","Berenang bersendirian di kawasan tasik yang dalam selepas makan terlalu kenyang","Mengabaikan taklimat keselamatan sekiranya pernah berkunjung ke air terjun tersebut","Berada berterusan di dalam sungai yang airnya mula keruh serta membawa ranting kayu"],"correctIndex":0,"explanation":"Air keruh membawa daun dan ranting merupakan tanda awal kepala air; elakkan berenang bersendirian atau ketika terlalu kenyang."}]},{"id":"bm47-u4","title":"Unit 4: Gema Belantara, Skrip Drama & Misi Suci BSMM","subtitle":"SP 1.4.2, 4.3.1 & 3.4.3 — Ancaman Hutan & Skrip Drama Forum serta Sejarah Bulan Sabit Merah Malaysia","iconType":"crown","iconUrl":"../assets/icons/bm47-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Jelajah Hutan, Drama & Misi BSMM","voiceCaption":"Aktiviti jelajah hutan menuntut kesiapsiagaan terhadap hidupan liar dan cuaca, manakala Bulan Sabit Merah Malaysia menggalas misi kemanusiaan sejak tahun 1948.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian Gema Belantara mengingatkan penjelajah hutan supaya berwaspada apabila suasana rimba tiba-tiba sunyi atau monyet berhenti mengerih kerana itu mungkin petanda kehadiran pemangsa atau bencana. Pelbagai ancaman hutan termasuk haiwan seperti harimau belang, beruang matahari, gajah, serta tumbuhan berbisa seperti jelatang dan rengas. Sementara itu, dalam bahagian Tentang Bulan, kita mempelajari penubuhan Palang Merah di Borneo Utara pada April seribu sembilan ratus empat puluh lapan sebelum ditukar nama kepada Bulan Sabit Merah Malaysia di bawah Akta seribu sembilan ratus tujuh puluh lima!","title":"4.3.1 & 3.4.3 Skrip Drama Belantara & Perenggan Isi Misi BSMM","acronym":"BSMM•DRAMA","hook":"Kuasai ciri skrip drama (arahan pentas + dialog) dan sejarah misi kemanusiaan BSMM untuk penulisan perenggan isi!","summary":"Skrip drama memerlukan dialog semula jadi beserta arahan pentas dalam kurungan; penulisan perenggan isi tentang BSMM memerlukan huraian kritis berlandaskan fakta sejarah dan punca penglibatan sukarelawan.","bullets":["Ancaman Jelajah Hutan (Perhilitan): Hidupan liar menyerang jika terkejut atau anak terancam (gajah naik minyak, beruang tertarik sisa makanan), bencana cuaca (kepala air, tanah runtuh) serta tumbuhan berduri/berbisa (rotan, jelatang, rengas).","Ciri Skrip Drama (SP 4.3.1): Senarai watak, latar masa dan tempat, arahan pentas/pergerakan dalam tanda kurung (), serta dialog yang mencerminkan konflik dan penyelesaian.","Sejarah & Misi BSMM (SP 3.4.3): Bermula April 1948 di Borneo Utara sebagai Cawangan Palang Merah British; bertukar nama kepada BSMM pada tahun 1975 di bawah Akta 162 untuk tugas bantuan masa aman dan perang."],"examTip":"Apabila menulis perenggan isi mengenai punca kurangnya penyertaan murid dalam khidmat masyarakat (SP 3.4.3), kemukakan isi, sebab (beban akademik atau kurang kesedaran empati), contoh aktiviti BSMM dan penegas yang jelas."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Ancaman Haiwan vs Tumbuhan/Bencana","voiceCaption":"Kelaskan risiko aktiviti jelajah hutan mengikut punca ancaman hidupan liar atau punca alam semula jadi dan tumbuhan.","voiceScript":"[curious] Asingkan risiko jelajah hutan berikut antara ancaman hidupan liar dengan ancaman alam semula jadi dan tumbuhan!","prompt":"Kelaskan risiko jelajah hutan berikut ke kategori punca yang betul:","buckets":[{"id":"haiwan","label":"Ancaman Hidupan Liar"},{"id":"alam","label":"Alam Semula Jadi & Tumbuhan"}],"items":[{"text":"Beruang matahari yang tertarik pada bau sisa makanan perkhemahan","bucketId":"haiwan","note":"Betul! Sisa makanan mesti disimpan kemas agar tidak mengundang beruang."},{"text":"Getah pokok rengas dan daun jelatang yang berbisa serta gatal","bucketId":"alam","note":"Tepat! Tumbuhan hutan berbisa memerlukan pengetahuan pengecaman flora."},{"text":"Gajah jantan yang naik minyak atau merempuh laluan biasa kumpulannya","bucketId":"haiwan","note":"Betul! Elakkan berkhemah di denai gajah."},{"text":"Lereng cenuram licin serta kejadian kepala air dan tanah runtuh ketika hujan","bucketId":"alam","note":"Tepat! Faktor muka bumi dan cuaca hujan sangat kritikal."},{"text":"Harimau kumbang dan harimau belang yang menyerang apabila cedera atau terancam","bucketId":"haiwan","note":"Betul! Pemangsa bertindak balas apabila berasa terancam."},{"text":"Pepanjat berduri seperti rotan serta dahan mati yang mudah patah","bucketId":"alam","note":"Tepat! Bahaya fizikal di laluan denai hutan."}],"explanation":"Persediaan latihan fizikal, alat navigasi dan kesedaran flora-fauna mengurangkan risiko kemalangan semasa jelajah hutan."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Perenggan Isi Khidmat Masyarakat","voiceCaption":"Susun ayat untuk membina satu perenggan isi yang kritis tentang usaha menggalakkan murid menyertai misi sukarela BSMM.","voiceScript":"[confident] Susun keempat-empat ayat ini menjadi perenggan isi S P tiga perpuluhan empat perpuluhan tiga yang padat dan gramatis!","prompt":"Susun ayat berikut menjadi satu perenggan isi tentang pemupukan semangat sukarelawan murid:","hint":"Mulakan dengan ayat topik (langkah pihak sekolah), diikuti huraian, contoh misi BSMM dan ayat penegas...","answerTokens":["Pihak sekolah wajar mempergiat kempen kesedaran tentang manfaat kerja kesukarelawanan kepada murid.","Langkah ini penting agar generasi muda memahami nilai empati serta kesediaan membantu mangsa bencana tanpa mengharapkan balasan.","Sebagai contoh, murid boleh menyertai latihan pertolongan cemas dan misi bantuan banjir anjuran Bulan Sabit Merah Malaysia.","Tegasnya, penglibatan aktif dalam aktiviti kemasyarakatan melahirkan insan yang prihatin dan berdaya tahan."],"distractors":["Oleh itu, semua murid tidak dibenarkan mendaki bukit pada waktu pagi.","Tambahan pula, telefon bimbit hendaklah dibuang ke dalam sungai."],"explanation":"Struktur AT -> AH -> AC (BSMM) -> AP menepati standard penulisan perenggan isi SP 3.4.3."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Fakta Sejarah & Akta BSMM","voiceCaption":"Pilih pernyataan sejarah yang tepat mengenai pertukaran nama Bulan Sabit Merah Malaysia.","voiceScript":"[confident] Bilakah dan di bawah akta apakah Palang Merah Malaysia bertukar nama kepada Bulan Sabit Merah Malaysia?","prompt":"Manakah fakta sejarah yang TEPAT mengenai penubuhan Bulan Sabit Merah Malaysia (BSMM)?","options":["Bermula pada April 1948 di Borneo Utara dan ditukar nama kepada BSMM pada tahun 1975 di bawah Akta 162","Ditubuhkan pada tahun 1975 di Kuala Lumpur tanpa kaitan dengan Palang Merah British","Ditubuhkan hanya untuk tugas sukan tahunan sekolah pada tahun 1992","Bertukar nama di bawah Akta Keselamatan Siber pada tahun 2015"],"correctIndex":0,"explanation":"Cawangan pertama bermula April 1948 di Borneo Utara (Sabah) dan bertukar nama kepada BSMM pada 1975 melalui Akta 162."}]},{"id":"bm47-u5","title":"Unit 5: Cabaran Boss Tema 7 — Demi Kedamaian","subtitle":"Penilaian Bersepadu KSSM Tema 7: Kata Adjektif, Pendahuluan, Skrip Drama, Keselamatan Siber & BSMM","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Analisis Ayat & Adjektif","voiceCaption":"Pilih ayat yang menggunakan kesemua kata adjektif dan kata penguat dengan tepat mengikut konteks keselamatan.","voiceScript":"[excited] Cabaran Boss Tema tujuh bermula! Antara keempat-empat ayat berikut, pilih satu ayat yang menggunakan kata adjektif dan darjah perbandingan dengan betulnya!","prompt":"Pilih ayat yang menggunakan kata adjektif dan kata penguat secara GRAMATIS:","options":["Walaupun suasana rimba terasa amat sunyi sekali, ketua ekspedisi kekal tenang memandu pasukan","Mangsa sindiket itu paling terkejut sekali apabila menerima panggilan palsu dari luar negara","Sungai yang terdalam sekali di kawasan itu telah meragut ramai nyawa pelancong","Peserta perkhemahan dinasihatkan supaya berjalan dengan amat laju sekali di tebing curam"],"correctIndex":0,"explanation":"'amat sunyi sekali' betul kerana 'amat' ialah penguat bebas; 'paling terkejut sekali', 'terdalam sekali' semuanya salah."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Kesesuaian Jenis Pendahuluan","voiceCaption":"Ramalkan jenis pendahuluan yang digambarkan oleh petikan pembukaan karangan keselamatan jalan dan air berikut.","voiceScript":"[curious] Kenal pasti jenis pendahuluan bagi contoh perenggan yang menggabungkan suara ombak di pantai dengan persoalan kesedaran pengunjung!","hook":"Perhatikan elemen gabungan gambaran latar dan tanda tanya dalam perenggan ini!","scenario":"Petikan: 'Ketenangan air sungai yang jernih sering mengaburi mata pengunjung. Namun, sejauh manakah kita bersedia berdepan risiko kepala air yang boleh berlaku pada bila-bila masa?'","prompt":"Apakah jenis perenggan pendahuluan yang diaplikasikan dalam contoh di atas?","options":["Pendahuluan Jenis Gabungan (Suasana + Persoalan)","Pendahuluan Jenis Definisi Kamus semata-mata","Pendahuluan Jenis Statistik JBPM semata-mata","Perenggan Penutup / Kesimpulan Karangan"],"correctIndex":0,"explanation":"Ayat pertama melukis suasana air sungai yang tenang, diikuti soalan retoris ('sejauh manakah...'), membentuk pendahuluan gabungan yang berkesan."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Format Skrip Drama","voiceCaption":"Susun elemen struktur penulisan skrip drama mengikut tertib yang betul.","voiceScript":"[confident] Susun elemen pembinaan skrip drama S P empat perpuluhan tiga perpuluhan satu mengikut urutan yang kemas!","prompt":"Susun turutan komponen penulisan skrip drama keselamatan yang lengkap:","hint":"Mulakan dengan tajuk/watak & latar, arahan pentas, dialog berkonflik dan peleraian...","answerTokens":["Senarai Watak dan Latar Tempat serta Masa","Arahan Pentas dalam tanda kurung bagi aksi pelakon","Dialog watak yang membina konflik keselamatan hutan","Peleraian konflik berserta pengajaran nilai murni"],"distractors":["Senarai rujukan bibliografi buku teks di bahagian awal","Jadual pengiraan kos tiket bas"],"explanation":"Skrip drama memerlukan senarai watak & latar, arahan pentas jelas, dialog bertenaga yang menggerakkan konflik serta peleraian bermesej."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Agensi & Konsep Tema 7","voiceCaption":"Padankan agensi dan istilah keselamatan Tema 7 dengan peranannya.","voiceScript":"[confident] Padankan keempat-empat istilah keselamatan Tema tujuh dengan huraian tepatnya!","prompt":"Padankan istilah dan agensi keselamatan berikut dengan maksud tepatnya:","pairs":[{"id":"bm47u5m1","left":"NIOSH (1992)","right":"Membudayakan Keselamatan dan Kesihatan Pekerjaan (KKP) termasuk di sekolah"},{"id":"bm47u5m2","left":"JBPM (2018)","right":"Merekodkan 380 operasi kes lemas dengan risiko tertinggi di sungai"},{"id":"bm47u5m3","left":"Perhilitan","right":"Menggariskan panduan keselamatan terhadap hidupan liar dan alam hutan"},{"id":"bm47u5m4","left":"BSMM (Akta 162)","right":"Memberikan bantuan kecemasan serta kemanusiaan masa aman dan perang"}],"explanation":"Keempat-empat organisasi ini melengkapkan kerangka ilmu Tema 7 Demi Kedamaian."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Pemurnian & Rumusan Tema 7","voiceCaption":"Pilih pernyataan yang paling tepat merumuskan gabungan kemahiran bahasa dan nilai keselamatan Tema 7.","voiceScript":"[excited] Soalan penutup Boss Tema tujuh! Pilih rumusan yang paling tepat mengenai penggunaan kata adjektif serta kesedaran keselamatan diri.","prompt":"Manakah ayat yang menggabungkan fakta Tema 7 dan tatabahasa Kata Adjektif yang paling TEPAT?","options":["Sikap cermat dan bijak pengguna dalam meneliti panggilan mencurigakan menjadi benteng terkuat menangkis jenayah siber","Sikap cermat dan paling bijak sekali pengguna dapat menangkis penipuan siber","Penduduk kampung berasa amat takut sekali dan paling cemas sekali apabila banjir melanda","Sungai yang paling terdalam itu tidak sesuai untuk mandi-manda kerana arus terlalu deras sekali"],"correctIndex":0,"explanation":"Pilihan A menggunakan kata adjektif sifatan ('cermat', 'bijak') dan darjah penghabisan ('terkuat') dengan betul tanpa penguat berganda."}]}]};</script>

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;

    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +

    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
