/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-bab08","subject":"Bahasa Melayu","subjectGroup":"teras","form":4,"chapterNumber":8,"title":"Dalam Lipatan Kenangan","subtitle":"Tema 8 BM T4 KSSM — Rumah Pusaka Chow Kit, Teknik QUACK Fort Margherita vs Singapura Diserang Todak, Kata Tugas (SP 5.2.4), Kesimpulan Karangan (SP 3.4.4), Kain Telepuk & Taiping Bandar Warisan.","estimatedMinutes":26,"themeAccent":"#b45309","isFreePreview":false,"labScript":"bahasa-melayu-t4-bab08-labs.js","coverIcon":"../assets/icons/bm48-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Syabas! Pemahaman kamu terhadap warisan sejarah dan kata tugas amat membanggakan!","combo":"[laughs warmly] Kombo cemerlang! [excited] Teruskan ketepatan membezakan praklausa, pascakata dan binaan kesimpulan!","encourage":"[softly] Hampir tepat... semak semula golongan kata tugas atau fakta sejarah warisan yang diuji!","celebrate":"[excited] Cemerlang! Kelapan-lapan tema Bahasa Melayu Tingkatan empat berjaya kamu tamatkan dengan penuh gemilang!"},"units":[{"id":"bm48-u1","title":"Unit 1: Rumah Pusaka Chow Kit & Seni Menyoal","subtitle":"SP 1.5.1 — Menyelamatkan Rumah Degil (1926) serta Jenis, Kesesuaian Soalan & Kesesuaian Masa","iconType":"book","iconUrl":"../assets/icons/bm48-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Rumah Pusaka & Seni Menyoal","voiceCaption":"Kisah pemeliharaan Rumah Pusaka Chow Kit mengajarkan kepentingan menghargai warisan seni bina serta etika mengemukakan soalan secara bertatasusila.","voiceScript":"[warm] Selamat datang ke Tema kelapan Bahasa Melayu Tingkatan empat, Dalam Lipatan Kenangan! Unit satu mengisahkan Rumah Pusaka Nombor empat puluh satu Jalan Chow Kit yang dibina pada tahun seribu sembilan ratus dua puluh enam oleh Haji Jaafar Sutan Sinombar dan digelar Rumah Degil kerana kekal utuh di celah bangunan konkrit sebelum dipelihara oleh Persatuan Rumah Pusaka Chow Kit dan Jabatan Warisan Negara. Melalui S P satu perpuluhan lima perpuluhan satu, kita belajar tiga perkara penting dalam temu bual: jenis soalan dengan atau tanpa kata tanya, soalan terbuka atau tertutup, serta kesesuaian soalan mengikut usia, status sosial dan masa!","title":"1.5.1 Rumah Pusaka Chow Kit (1926) & Kesesuaian Soalan Temu Bual","acronym":"JENIS•MASA","hook":"Fahami usaha pemeliharaan Rumah Degil Chow Kit dan bezakan soalan terbuka, tertutup serta kesesuaian masa!","mediaKey":"bm48_rumah_pusaka","summary":"Temu bual warisan memerlukan soalan yang beradab, sesuai dengan situasi emosi responden, usia serta status sosial, sama ada berbentuk terbuka mahupun tertutup.","bullets":["Rumah Pusaka Chow Kit (1926): Kediaman kayu tradisional Melayu di No. 41 Jalan Chow Kit milik Sutan Mangatas; penghuni terakhir Puan Norma Manjawali (lahir 1932); dibuka kayu demi kayu dan ditanda oleh arkitek Ir. Tan Kay Chay bersama sukarelawan sebelum dipindahkan ke pekarangan Balai Seni Negara.","Jenis Soalan (SP 1.5.1): (1) Dengan kata tanya (Apakah, Bagaimanakah) vs tanpa kata tanya (intonasi naik); (2) Soalan terbuka (jawapan huraian pelbagai) vs soalan tertutup (jawapan Ya/Tidak).","Kesesuaian Soalan & Masa: Sesuaikan laras kata ganti diri mengikut usia/status dan elakkan soalan sensitif ketika responden dalam kesedihan atau kepayahan."],"examTip":"Dalam Ujian Bertutur Kertas 3, gunakan soalan terbuka ('Bagaimanakah usaha...') untuk mendapatkan jawapan matang berbanding soalan tertutup ('Adakah anda suka...')."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Soalan Terbuka vs Soalan Tertutup","voiceCaption":"Asingkan enam contoh soalan temu bual warisan berikut kepada Soalan Terbuka atau Soalan Tertutup.","voiceScript":"[curious] Bezakan soalan terbuka yang menjana huraian panjang daripada soalan tertutup yang hanya memerlukan jawapan ya atau tidak!","prompt":"Kelaskan soalan temu bual berikut mengikut jenis jawapan yang diharapkan:","buckets":[{"id":"terbuka","label":"Soalan Terbuka (Jawapan Pelbagai)"},{"id":"tertutup","label":"Soalan Tertutup (Ya / Tidak)"}],"items":[{"text":"Bagaimanakah kayu Rumah Pusaka Chow Kit ditanda sebelum dipasang semula?","bucketId":"terbuka","note":"Betul! Memerlukan penerangan proses secara terperinci."},{"text":"Adakah Rumah Pusaka Chow Kit dibina pada tahun 1926?","bucketId":"tertutup","note":"Tepat! Jawapannya ringkas iaitu Ya atau Tidak."},{"text":"Mengapakah bangunan kayu warisan itu digelar Rumah Degil oleh masyarakat?","bucketId":"terbuka","note":"Betul! Memerlukan huraian latar belakang sejarah."},{"text":"Pernahkah anda melawat Galeri Balai Seni Negara di Kuala Lumpur?","bucketId":"tertutup","note":"Tepat! Hanya memerlukan jawapan Pernah (Ya) atau Tidak."},{"text":"Apakah cadangan anda untuk menarik minat belia menghargai seni bina lama?","bucketId":"terbuka","note":"Betul! Membolehkan responden mengemukakan idea kreatif."},{"text":"Rumah tradisional itu masih utuh hingga tahun 2014, bukan?","bucketId":"tertutup","note":"Tepat! Soalan pengesahan tertutup."}],"explanation":"Soalan terbuka bermula dengan kata tanya huraian (Bagaimana, Mengapa, Apakah cadangan), manakala soalan tertutup menggunakan 'Adakah', 'Pernahkah', atau '...bukan?'."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Kronologi Rumah Pusaka Chow Kit","voiceCaption":"Padankan tokoh dan institusi yang terlibat dalam sejarah serta penyelamatan Rumah Pusaka Chow Kit.","voiceScript":"[confident] Padankan setiap tokoh dan badan warisan dengan peranannya dalam menyelamatkan Rumah Pusaka Chow Kit!","prompt":"Padankan watak dan pihak berikut dengan peranannya:","pairs":[{"id":"bm48u1m1","left":"Haji Jaafar Sutan Sinombar","right":"Pemilik asal yang membina rumah tradisional itu pada tahun 1926"},{"id":"bm48u1m2","left":"Puan Norma binti Manjawali","right":"Penghuni terakhir yang lahir dan dibesarkan di rumah tersebut sejak 1932"},{"id":"bm48u1m3","left":"Ir. Tan Kay Chay & Sukarelawan","right":"Menubuhkan Persatuan Rumah Pusaka Chow Kit serta melabel setiap kayu"},{"id":"bm48u1m4","left":"Jabatan Warisan & Balai Seni Negara","right":"Mengambil alih dan menyediakan tapak pembinaan semula warisan"}],"explanation":"Sinergi sukarelawan, arkitek dan agensi kerajaan berjaya menyelamatkan warisan daripada lenyap."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Etika Kesesuaian Masa Menyoal","voiceCaption":"Pilih pertimbangan paling tepat mengenai kesesuaian masa ketika menemu bual pemilik bangunan warisan yang baru berpindah.","voiceScript":"[confident] Apakah pertimbangan paling berhemah dalam kesesuaian masa dan soalan S P satu perpuluhan lima perpuluhan satu?","prompt":"Situasi manakah yang menunjukkan kesesuaian masa dan tatasusila menyoal yang BETUL?","options":["Menangguhkan soalan mengenai nilai jualan tanah yang sensitif ketika penghuni asal sedang bersedih meninggalkan rumah pusakanya","Mendesak penghuni menjawab soalan peribadi di hadapan orang ramai sejurus selepas perpindahan","Menggunakan kata ganti diri kasar tanpa mengambil kira usia warga emas yang ditemu bual","Mengajukan sepuluh soalan serentak tanpa memberi ruang responden berfikir"],"correctIndex":0,"explanation":"Buku teks menegaskan kesesuaian masa amat penting agar kita tidak mengajukan soalan sensitif ketika seseorang sedang bersedih."}]},{"id":"bm48-u2","title":"Unit 2: Kata Tugas & Teknik QUACK (Fort Margherita)","subtitle":"SP 5.2.4 & 2.3.2 — Praklausa, Pascakata (-nya Penekan vs Pembenda) serta Perbandingan Teks Sejarah","iconType":"formula","iconUrl":"../assets/icons/bm48-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Kelompok Kata Tugas & Pascakata","voiceCaption":"Golongan kata tugas terbahagi kepada kata penyambung ayat, kata praklausa, kata prafrasa dan kata pascakata seperti akhiran nya sebagai kata penekan atau pembenda.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam Tema kelapan buku teks, kita membandingkan keberanian Suntong menawan Fort Margherita dengan kebijaksanaan Hang Nadim dalam peristiwa Singapura Diserang Todak menggunakan teknik bacaan Q U A C K, sambil mengenal pasti kata tugas khususnya praklausa dan pascakata untuk S P lima perpuluhan dua perpuluhan empat! Ingat perbezaan fungsi akhiran nya sebagai kata pascakata: jika memberi penegasan pada kata tugas atau adjektif seperti sesungguhnya dan cekapnya dalam ayat seruan, itu Kata Penekan; jika menukar kata kerja atau adjektif menjadi Kata Nama subjek seperti Lajunya arus sungai atau Mudahnya kita merempuh, itu Kata Pembenda!","title":"5.2.4 Golongan Kata Tugas (Praklausa, Prafrasa & Pascakata)","acronym":"P•P•P•P","hook":"Bezakan 4 kelompok Kata Tugas serta fungsi -nya Penekan dan -nya Pembenda dalam makmal interaktif!","summary":"Kata tugas tidak boleh menjadi unsur inti frasa utama (kecuali kata sendi nama), sebaliknya menjalankan tugas gramatis penyambung, penegas, nafi, pemeri, praklausa atau pascakata.","bullets":["Kata Praklausa: Hadir di hadapan klausa — Kata Seru (Wah, Aduh), Kata Tanya (mengapa, bagaimana), Kata Perintah (sila, jangan), Kata Pembenar (ya, benar, betul), Kata Pangkal Ayat (hatta, maka).","Kata Pascakata (-nya): (1) Kata Penekan — menegaskan kata (sesungguhnya, bahawasanya, cekapnya lapan pejuang itu!); (2) Kata Pembenda — membendakan kata bukan nama menjadi kata nama (lajunya, sakitnya, berdirinya).","Teknik Bacaan QUACK (SP 2.3.2): Q (Question mark ? pada bahagian sukar), U (Underline fakta penting), A (Asterisk * idea utama), C (Circle kata kunci), K (Keywords catatan ringkas)."],"labId":"bm48_kata_tugas_lab","labTitle":"Penganalisis 4 Kelompok Kata Tugas (SP 5.2.4)","labProps":{"grp":"pascakata"},"examTip":"Bezakan Kata Nafi 'bukan' (untuk Frasa Nama dan Frasa Sendi Nama) dengan 'tidak' (untuk Frasa Kerja dan Frasa Adjektif), serta Kata Pemeri 'ialah' (FN) vs 'adalah' (FA/FSN)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Fungsi Pascakata -nya","voiceCaption":"Ramalkan sama ada perkataan berakhiran -nya dalam ayat berikut berfungsi sebagai Kata Penekan atau Kata Pembenda.","voiceScript":"[curious] Uji pemahaman kamu terhadap kata pascakata! Dalam ayat 'Lajunya aliran sejarah menjadikan kita lebih matang', apakah fungsi perkataan Lajunya?","hook":"Lihat kedudukan perkataan di pangkal ayat sebagai subjek frasa nama!","scenario":"Bandingkan dua ayat: (1) 'Sesungguhnya perjuangan Suntong patut dikenang.' (2) 'Lajunya arus sungai menyukarkan perahu musuh.'","prompt":"Apakah fungsi bentuk '-nya' pada kata 'Lajunya' dalam ayat (2) di atas?","options":["Kata Pembenda kerana mengubah kata adjektif 'laju' menjadi kata nama subjek ayat","Kata Penekan kerana berfungsi sebagai kata seru di hadapan ayat","Kata Ganti Nama Diri Orang Ketiga yang merujuk seorang raja","Kata Hubung Pancangan Komplemen yang menggabungkan dua klausa"],"correctIndex":0,"proofLabId":"bm48_kata_tugas_lab","proofState":{"grp":"pascakata"},"explanation":"'Lajunya' ialah Kata Pembenda (menjadikan kata adjektif 'laju' berfungsi sebagai Kata Nama subjek), manakala 'Sesungguhnya' ialah Kata Penekan."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Subjenis Kata Praklausa & Prafrasa","voiceCaption":"Padankan lima contoh kata tugas dengan subgolongannya yang tepat mengikut Tatabahasa Dewan.","voiceScript":"[confident] Padankan setiap perkataan tugas berikut dengan kategori gramatisnya yang betul!","prompt":"Padankan perkataan berikut dengan subgolongan kata tugasnya:","pairs":[{"id":"bm48u2m1","left":"Ya / Benar / Betul","right":"Kata Pembenar (Praklausa)"},{"id":"bm48u2m2","left":"Hatta / Arakian / Syahadan","right":"Kata Pangkal Ayat (Praklausa)"},{"id":"bm48u2m3","left":"Sesungguhnya / Nampaknya","right":"Kata Penekan (Pascakata)"},{"id":"bm48u2m4","left":"Ialah (diikuti Frasa Nama)","right":"Kata Pemeri (Prafrasa)"},{"id":"bm48u2m5","left":"Aduh / Wah / Syabas","right":"Kata Seru (Praklausa)"}],"explanation":"Mengenal pasti subjenis praklausa, prafrasa dan pascakata mengelakkan kekeliruan dalam soalan analisis morfologi SPM."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Banding Beza Teks Sejarah dengan QUACK","voiceCaption":"Pilih persamaan utama antara petikan Fort Margherita dengan peristiwa Singapura Diserang Todak.","voiceScript":"[confident] Menggunakan teknik Q U A C K, apakah persamaan teras antara perjuangan Suntong di Fort Margherita dengan kisah Hang Nadim dalam Singapura Diserang Todak?","prompt":"Berdasarkan kedua-dua petikan dalam Tema 8, apakah PERSAMAAN utama antara kisah Fort Margherita dengan Singapura Diserang Todak?","options":["Kedua-duanya menonjolkan kebijaksanaan strategi dan keberanian mempertahankan tanah air daripada ancaman","Kedua-duanya berlaku di kubu batu Kuching pada abad ke-20","Kedua-duanya melibatkan serangan ikan todak di Sungai Sarawak","Kedua-duanya berakhir dengan kekalahan penduduk tempatan"],"correctIndex":0,"explanation":"Suntong menggunakan kemahiran persilatan dan selok-belok sungai manakala Hang Nadim mencadangkan benteng batang pisang; kedua-duanya melambangkan kepintaran strategi menghadapi ancaman."}]},{"id":"bm48-u3","title":"Unit 3: Sejarah Mendewasakan Kita & Tekstil Kain Telepuk","subtitle":"SP 3.4.4, 1.3.1 & 4.3.1 — Perenggan Kesimpulan Lengkap serta Fakta & Alat Seni Kain Telepuk","iconType":"scale","iconUrl":"../assets/icons/bm48-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kesimpulan Karangan & Kain Telepuk","voiceCaption":"Perenggan kesimpulan merangkumkan pendirian, cadangan dan harapan dengan ungkapan menarik, manakala tekstil kain telepuk menggunakan acuan penerap dan kertas emas.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam bahagian Sejarah Mendewasakan Kita, kita mempelajari teknik S P tiga perpuluhan empat perpuluhan empat iaitu membina perenggan kesimpulan lengkap yang mengandungi ayat kesimpulan, cadangan, huraian kesan atau ancaman, serta harapan dengan ungkapan menarik seperti Tak lapuk dek hujan, tak lekang dek panas. Di samping itu, bahagian Tekstil Warisan memperkenalkan seni kain telepuk Melayu yang menggunakan alat khusus iaitu sudip, acuan dan penerap, gam Arab serta berus untuk melekatkan kertas perada emas bermotif bunga dan pucuk rebung!","title":"3.4.4 Perenggan Kesimpulan Berkesan & Seni Tekstil Kain Telepuk","acronym":"K•C•A•H","hook":"Buka bengkel kesimpulan dan teknik QUACK untuk menyusun empat komponen penutup karangan SPM!","mediaKey":"bm48_tekstil_telepuk","summary":"Kesimpulan karangan yang bermutu mengelakkan ulangan isi mentah-mentah dan menggabungkan cadangan tindakan, risiko jika diabaikan serta harapan berwawasan.","bullets":["Empat Elemen Kesimpulan (SP 3.4.4): (1) Kesimpulan / Penegasan topik, (2) Cadangan konkrit, (3) Ancaman / Huraian kesan jika alpa, (4) Harapan + peribahasa atau ungkapan menarik.","Alat Menelepuk Kain Telepuk: Sudip, acuan dan penerap (ukiran kayu bermotif), Gam Arab (pelekat semula jadi), berus dan kertas emas (perada).","Langkah Susunan Fakta (SP 1.3.1): Susun fakta tekstil secara kronologi daripada penyediaan kain berkanji dan licin, penyapuan gam Arab pada acuan penerap, hingga penekapan kertas emas."],"labId":"bm48_kesimpulan_sejarah_lab","labTitle":"Bengkel Kesimpulan Karangan & QUACK (SP 3.4.4 & 2.3.2)","labProps":{"tab":"kesimpulan"},"examTip":"Gunakan penanda wacana penutup yang tepat seperti 'Kesimpulannya', 'Intihanya', atau 'Akhir kalam' — JANGAN tulis 'Kesimpulannya, saya bersetuju dengan tajuk di atas' tanpa huraian cadangan dan harapan."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Perenggan Kesimpulan Warisan","voiceCaption":"Susun keempat-empat ayat berikut mengikut urutan Kesimpulan, Cadangan, Ancaman dan Harapan yang lengkap.","voiceScript":"[confident] Susun segmen ini mengikut struktur K C A H untuk menghasilkan perenggan kesimpulan karangan pemeliharaan sejarah dan warisan!","prompt":"Susun ayat berikut membentuk perenggan kesimpulan bertema sejarah dan tekstil warisan:","hint":"Mulakan dengan ayat Kesimpulan, diikuti Cadangan, Ancaman dan diakhiri Harapan + peribahasa...","answerTokens":["Kesimpulannya, pemahaman sejarah dan pemuliharaan tekstil warisan merupakan tanggungjawab bersama seluruh rakyat Malaysia.","Oleh itu, institusi pendidikan dan muzium perlu memperbanyak bengkel seni kain telepuk kepada generasi muda.","Sekiranya khazanah silam ini diabaikan, jati diri bangsa berisiko terhakis ditelan arus pemodenan.","Semoga warisan berharga ini terus subur tak lapuk dek hujan, tak lekang dek panas demi membina negara berdaulat."],"distractors":["Selain itu, semua rumah kayu lama harus dijual kepada pemaju perumahan.","Justeru, pelajaran sejarah tidak perlu diajar lagi di sekolah menengah."],"explanation":"Urutan Kesimpulan -> Cadangan -> Ancaman -> Harapan dengan peribahasa menepati kriteria cemerlang SP 3.4.4."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Alatan & Proses Kain Telepuk","voiceCaption":"Padankan alat dan langkah dalam penghasilan kain telepuk warisan dengan fungsinya.","voiceScript":"[curious] Uji pengetahuan seni kraf Melayu kamu! Padankan alatan dan bahan kain telepuk ini dengan peranannya.","prompt":"Padankan peralatan seni kain telepuk berikut dengan kegunaannya:","pairs":[{"id":"bm48u3m1","left":"Acuan dan Penerap Kayu","right":"Mencetak corak motif bunga atau flora di atas permukaan kain"},{"id":"bm48u3m2","left":"Gam Arab","right":"Bahan pelekat semula jadi yang disapu pada acuan sebelum menerap"},{"id":"bm48u3m3","left":"Berus & Sudip","right":"Menyapu gam dengan sekata dan meratakan bahan perada"},{"id":"bm48u3m4","left":"Kertas Perada Emas","right":"Dilekatkan di atas kesan terapan gam sehingga menyerlah kilauan"}],"explanation":"Seni telepuk menggabungkan ketelitian ukiran kayu penerap, sapuan gam Arab dan keemasan perada pada kain berkanji."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kesilapan Lazim Perenggan Kesimpulan","voiceCaption":"Kenal pasti perkara yang PERLU DIELAKKAN semasa menulis perenggan penutup karangan.","voiceScript":"[confident] Dalam penulisan kesimpulan S P M, apakah kesilapan yang sering menyebabkan markah penutup kurang menyerlah?","prompt":"Apakah perkara yang PERLU DIELAKKAN semasa menulis perenggan kesimpulan karangan?","options":["Mengemukakan isi baharu yang sepatutnya dihuraikan dalam perenggan isi serta mengulang ayat isi tanpa pengubahsuaian","Menyatakan cadangan tindakan bersepadu daripada pelbagai pihak","Menyertakan harapan masa hadapan dengan ungkapan atau peribahasa yang tepat","Menghubungkan kepentingan tema dengan pembinaan jati diri bangsa"],"correctIndex":0,"explanation":"Perenggan kesimpulan berfungsi merumus, mencadangkan, mengingatkan risiko dan menyatakan harapan — bukan membuka isi baharu."}]},{"id":"bm48-u4","title":"Unit 4: Taiping Bandar Warisan, Talibun & Prosa Moden","subtitle":"SP 2.3.3 — Ceritera Pertama di Taiping, Prosa 'Ala, Emak Kahwinkan Aku!' & Pelestarian Kuih Warisan","iconType":"crown","iconUrl":"../assets/icons/bm48-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Taiping Bandar Warisan & Membuat Kesimpulan","voiceCaption":"Talibun Taiping Bandar Warisan merakamkan banyak tarikan pertama di Malaysia seperti Muzium Taiping dan landasan kereta api 1885, manakala kemahiran membaca memerlukan teknik merumus fakta.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian Tercatat dalam Sejarah mengangkat bandar Taiping atau nama asalnya Klian Pauh yang mencatat pelbagai sejarah pertama di negara kita: Taman Tasik Taiping dengan jajaran pokok angsana, Muzium Taiping, Muzium Telegraf pertama di Asia Tenggara, landasan kereta api tertua menghubungkan Taiping ke Port Weld pada tahun seribu lapan ratus lapan puluh lima, serta Penjara Taiping! Untuk menguasai S P dua perpuluhan tiga perpuluhan tiga iaitu membaca dan membuat kesimpulan daripada bahan, lakukan tiga langkah mudah: baca secara pantas untuk gambaran awal, catat maklumat penting, dan bina kesimpulan menyeluruh. Tema lapan juga mengajak kita menghayati cerpen Ala Emak Kahwinkan Aku serta memelihara kuih warisan daripada ancaman kepupusan!","title":"2.3.3 Taiping Bandar Warisan, Langkah Kesimpulan Bacaan & Kuih Warisan","acronym":"3•LANGKAH","hook":"Ikuti 3 langkah membuat kesimpulan bahan bacaan dan kenali fakta 'pertama di Malaysia' di Taiping!","summary":"Bandar Taiping merupakan khazanah sejarah negara dengan prasarana tertua sejak abad ke-19; bacaan kritis meringkaskan fakta penting kepada kesimpulan bernas.","bullets":["Khazanah Pertama di Taiping (Talibun): Nama asal Klian Pauh; Taman Tasik buatan terawal; Muzium Taiping (tertua); Muzium Telegraf pertama di Asia Tenggara; Landasan kereta api tertua Taiping–Port Weld (1885) mengangkut bijih timah; Penjara Taiping (Penjara Larut).","3 Langkah Membuat Kesimpulan Bacaan (SP 2.3.3): (1) Skim pantas seluruh teks untuk idea keseluruhan, (2) Baca teliti dan catat fakta penting, (3) Rumuskan kesimpulan menyeluruh.","Kuih & Adat Warisan: Menilai konflik keluarga dalam cerpen 'Ala, Emak Kahwinkan Aku!' (watak Tahir) serta menangkis ancaman terhadap kuih tradisional melalui dokumentasi dan inovasi pemasaran."],"examTip":"Dalam soalan rumusan Kertas 2, pastikan kesimpulan mempunyai DUA unsur wajib: cadangan/gesaan agar sasaran bertindak dan kesannya ('agar warisan kekal terpelihara')."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Warisan Taiping vs Usaha Kuih Warisan","voiceCaption":"Kelaskan fakta berikut antara rekod sejarah Bandar Warisan Taiping dengan langkah melestarikan kuih warisan.","voiceScript":"[curious] Asingkan keenam-enam fakta ini kepada Khazanah Sejarah Taiping atau Langkah Pelestarian Kuih Warisan!","prompt":"Kelaskan pernyataan berikut mengikut konteks bahannya:","buckets":[{"id":"taiping","label":"Khazanah Sejarah Taiping"},{"id":"kuih","label":"Pelestarian Kuih Warisan"}],"items":[{"text":"Landasan kereta api pertama dibina pada 1885 dari Taiping ke Port Weld","bucketId":"taiping","note":"Betul! Dibina asalnya untuk mengangkut hasil bijih timah."},{"text":"Mengadakan demonstrasi pembuatan resipi turun-temurun kepada generasi muda","bucketId":"kuih","note":"Tepat! Pemindahan kemahiran mengelakkan resipi pupus."},{"text":"Muzium Telegraf yang pertama di rantau Asia Tenggara","bucketId":"taiping","note":"Betul! Tercatat dalam Talibun Ceritera Pertama di Taiping."},{"text":"Membungkus produk tradisional secara moden dan bersih untuk pasaran pelancongan","bucketId":"kuih","note":"Tepat! Inovasi pembungkusan menambah daya tarikan komersial."},{"text":"Asalnya dikenali sebagai Klian Pauh dan memiliki Taman Tasik serta Bukit Larut","bucketId":"taiping","note":"Betul! Identiti asal bandar warisan Taiping."},{"text":"Mendokumentasikan sukatan bahan asli dalam buku atau portal digital","bucketId":"kuih","note":"Tepat! Dokumentasi menjamin keaslian rasa terjaga."}],"explanation":"Pemeliharaan sejarah bandar dan seni kulinari tradisional sama-sama menjamin kesinambungan identiti budaya."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan 3 Langkah Membuat Kesimpulan","voiceCaption":"Padankan urutan langkah membuat kesimpulan daripada teks dengan tujuannya.","voiceScript":"[confident] Padankan setiap langkah SP dua perpuluhan tiga perpuluhan tiga dalam membuat kesimpulan daripada bahan bacaan!","prompt":"Padankan langkah membuat kesimpulan berikut dengan huraiannya:","pairs":[{"id":"bm48u4m1","left":"Langkah 1: Baca secara cepat","right":"Memperoleh gambaran keseluruhan dan tema utama petikan"},{"id":"bm48u4m2","left":"Langkah 2: Baca teliti & catat isi","right":"Mengenal pasti fakta penting dan menyingkirkan huraian berulang"},{"id":"bm48u4m3","left":"Langkah 3: Bina kesimpulan","right":"Menyatukan idea teras dalam satu pernyataan rasional yang padu"},{"id":"bm48u4m4","left":"Talibun Ceritera Taiping","right":"Puisi tradisional berangkap bebas yang merakam fakta sejarah tempatan"}],"explanation":"Langkah sistematik ini sangat membantu pelajar menjawab bahagian Rumusan Kertas 2 SPM dengan tepat."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Analisis Sikap & Dilema Watak Prosa","voiceCaption":"Pilih pernyataan yang tepat mengenai konflik dan pertimbangan adat dalam cerpen 'Ala, Emak Kahwinkan Aku!'.","voiceScript":"[confident] Mengapakah perbandingan antara majlis perkahwinan Melayu tradisional dengan moden diketengahkan melalui konflik watak Tahir?","prompt":"Mengapakah konflik watak Tahir dalam petikan 'Ala, Emak Kahwinkan Aku!' sesuai dibincangkan bersama warisan budaya?","options":["Mengajak pembaca menimbang nilai kesederhanaan, tanggungjawab keluarga dan keaslian adat dalam arus modenisasi","Menunjukkan bahawa adat tradisional perlu dihapuskan serta-merta tanpa rundingan","Membuktikan bahawa semua keputusan hidup tidak perlu mengambil kira nasihat ibu bapa","Menekankan perbelanjaan mewah sebagai ukuran tunggal kebahagiaan"],"correctIndex":0,"explanation":"Prosa moden dalam Tema 8 mengimbangi nilai kekeluargaan, persediaan kendiri dan kelestarian adat yang positif."}]},{"id":"bm48-u5","title":"Unit 5: Cabaran Boss Tema 8 — Dalam Lipatan Kenangan","subtitle":"Penilaian Akhir BM Tingkatan 4: Kata Tugas, QUACK, Kesimpulan, Rumah Pusaka & Warisan Taiping","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Kata Tugas & Pascakata","voiceCaption":"Pilih ayat yang mengandungi Kata Pascakata Pembenda dengan betul.","voiceScript":"[excited] Cabaran Boss Tema lapan bermula! Antara empat ayat berikut, manakah yang menggunakan Kata Pascakata Pembenda dengan tepat?","prompt":"Pilih ayat yang menggunakan Kata Pascakata PEMBENDA dengan tepat:","options":["Keteguhan dan tingginya nilai sejarah Rumah Pusaka Chow Kit mengagumkan pengkaji","Sesungguhnya generasi muda harus menghormati jasa pahlawan terdahulu","Wah, indahnya ukiran kayu pada pintu gerbang muzium lama itu!","Bahawasanya warisan tekstil Melayu telah menembusi pasaran antarabangsa"],"correctIndex":0,"explanation":"'Tingginya' dalam frasa subjek 'tingginya nilai sejarah' membendakan adjektif 'tinggi', sedangkan 'Sesungguhnya' dan 'Bahawasanya' ialah kata penekan."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Kesalahan Kata Pemeri/Nafi","voiceCaption":"Ramalkan ayat manakah yang menggunakan kata nafi dan kata pemeri dengan betul tanpa kesalahan tatabahasa.","voiceScript":"[curious] Ramalkan ayat yang mematuhi hukum Kata Pemeri dan Kata Nafi Tatabahasa Dewan sepenuhnya!","hook":"Semak pasangan ialah+FN, adalah+FA/FSN, bukan+FN/FSN, tidak+FK/FA!","scenario":"Calon menulis nota sejarah tentang Muzium Taiping dan kain telepuk menggunakan kata tugas.","prompt":"Pilih ayat yang menggunakan Kata Pemeri dan Kata Nafi dengan BETUL:","options":["Muzium Taiping ialah muzium tertua di Malaysia, manakala pembuatan kain telepuk tidak mudah dilaksanakan","Muzium Taiping adalah muzium tertua di Malaysia, manakala kain telepuk bukan mudah dibuat","Projek pemeliharaan ini ialah untuk tatapan generasi masa hadapan","Rumah Degil itu tidak dibina daripada konkrit, tetapi adalah rumah batu moden"],"correctIndex":0,"explanation":"'ialah' diikuti frasa nama ('muzium tertua'); 'tidak' menafikan kata adjektif ('mudah'). 'adalah untuk...' betul tetapi 'ialah untuk...' dalam C salah."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Teknik QUACK","voiceCaption":"Susun lima singkatan langkah teknik bacaan QUACK mengikut urutan huruf Q hingga K.","voiceScript":"[confident] Su /* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
