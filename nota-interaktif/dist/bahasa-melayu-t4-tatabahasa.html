  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t4-tatabahasa","subject":"Bahasa Melayu","form":4,"chapterNumber":1,"title":"Sistem Bahasa KSSM: Morfologi & Sintaksis (SP 5.1–5.3)","subtitle":"Kata tunggal, majmuk, terbitan, ganda & akronim, golongan kata, frasa, 4 pola ayat dasar, ayat songsang, majmuk serta ragam ayat SPM.","estimatedMinutes":22,"themeAccent":"#2563eb","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Multimedia & Suara AI","enableMultimediaEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/bm-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Bahasa kamu sungguh gramatis dan mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Penguasaan tatabahasa kamu memang cemerlang!","encourage":"[softly] Hampir tepat... teliti semula hukum imbuhan dan struktur ayat dalam nota panduan.","celebrate":"[excited] Tahniah! Satu lagi unit Sistem Bahasa berjaya dikuasai!"},"units":[{"id":"bm-u1","title":"Unit 1: Bentuk Kata — Tunggal, Majmuk, Terbitan, Ganda & Akronim","subtitle":"SP 5.1.1, 5.1.2 & 5.1.3 Buku Teks BM T4 — Pembentukan Kata & Imbuhan","iconType":"book","iconUrl":"../assets/icons/bm-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c1","voiceToneLabel":"Kata Tunggal, Akronim & Kata Majmuk","voiceCaption":"Kata tunggal tidak berimbuhan, akronim menggabungkan suku kata, manakala 15 kata majmuk mantap dieja bercantum.","voiceScript":"[warm] Selamat datang ke Bengkel Morfologi! Kenali tiga bentuk asas kata: kata tunggal termasuk akronim seperti tadika dan Yawam, serta kata majmuk yang dieja terpisah kecuali lima belas bentuk mantap!","title":"5.1.1 Kata Tunggal, Akronim & 15 Kata Majmuk Mantap","acronym":"T•A•15M","mediaKey":"bm_kata_tunggal","summary":"Kata majmuk lazimnya dieja terpisah kecuali 15 kata majmuk mantap dan kata majmuk berimbuhan apitan.","bullets":["Kata Tunggal & Akronim: Kata dasar bebas imbuhan; akronim rasmi buku teks termasuk Yawam (Yayasan Anak Watan Malaysia), Permam, tadika dan berdikari.","Kata Majmuk: Dieja TERPISAH (papan pintar, sari kata), KECUALI 15 bentuk mantap (antarabangsa, kerjasama, tanggungjawab, warganegara, dll.) serta bentuk berapitan seperti 'menyebarluaskan'."],"examTip":"Perangkap lazim SPM: 'diambil alih' (pisah kerana awalan sahaja) vs 'pengambilalihan' (cantum kerana apitan!).","hook":"Awas! 15 Kata Majmuk Mantap (cth: antarabangsa, tanggungjawab, sukacita) WAJIB dieja rapat — terpisah terus hilang markah!"},{"type":"sort","voiceIdKey":"u1-s2","voiceToneLabel":"Isih Bentuk Kata Tepat","voiceCaption":"Kelaskan perkataan daripada petikan buku teks mengikut bentuk kata: Majmuk Mantap, Kata Ganda atau Akronim.","voiceScript":"[curious] Uji pengamatan ejaan Dewan Bahasa dan Pustaka kamu! Isihkan enam perkataan daripada petikan buku teks ini kepada kategori Kata Majmuk Mantap, Kata Ganda atau Akronim.","prompt":"Kelaskan setiap perkataan berikut mengikut kategori pembentukan kata yang betul.","buckets":[{"id":"mantap","label":"Kata Majmuk Bentuk Mantap (Dieja Rapat)"},{"id":"ganda","label":"Kata Ganda (Penuh / Separa / Berentak)"},{"id":"akronim","label":"Akronim"}],"items":[{"text":"tanggungjawab","bucketId":"mantap","note":"Salah satu daripada 15 kata majmuk mantap yang wajib dieja rapat."},{"text":"terkontang-kanting","bucketId":"ganda","note":"Kata ganda berentak (Tema 13 m/s 177)."},{"text":"Yawam (Yayasan Anak Watan Malaysia)","bucketId":"akronim","note":"Akronim cantuman huruf awal suku kata (m/s 59 teks Alam Kerjaya)."},{"text":"warganegara","bucketId":"mantap","note":"Bentuk mantap bercantum (m/s 141 teks Kad Pengenalan)."},{"text":"dedaun & kekuda","bucketId":"ganda","note":"Kata ganda separa terbentuk daripada penggandaan suku kata pertama."},{"text":"tadika & pawagam","bucketId":"akronim","note":"Gabungan suku kata beberapa perkataan asas."}],"explanation":"Menguasai 15 kata majmuk mantap dan jenis akronim/kata ganda memudahkan penentuan jawapan soalan Morfologi SPM Kertas 2.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c2","voiceToneLabel":"Kata Terbitan & Hukum K-T-S-P","voiceCaption":"Apabila awalan meN- atau peN- bertemu kata dasar bermula huruf K, T, S, atau P, huruf awal itu digugurkan menjadi bunyi sengau.","voiceScript":"[curious] Mengapakah kata kupas menjadi mengupas, bukan mengkupas? Inilah Hukum K T S P! Uji konsol morph interaktif di bawah untuk melihat huruf K, T, S dan P digugurkan secara langsung!","title":"5.1.2 Kata Terbitan & Hukum Pengguguran K-T-S-P","acronym":"K•T•S•P","summary":"Pengimbuhan awalan, akhiran, apitan dan sisipan melahirkan kata terbitan dengan perubahan bunyi nasal tertentu.","bullets":["4 Jenis Imbuhan: Awalan (mem-, ber-, ter-, di-), Akhiran (-an, -kan, -i), Apitan (meN-...-kan, ke-...-an), dan Sisipan (-el-, -er-, -em-, -in-: telapak, seruling, gemilang).","Hukum K-T-S-P: k -> ng (mengupas), t -> n (menulis), s -> ny (menyapu), p -> m (memilih); KECUALI kata pinjaman dua suku/konsonan rangkap seperti 'memproses' atau 'mengkaji' (kaji bukan pinjaman tetapi kekecualian/lihat konteks)."],"labId":"bm_morfologi_builder","labTitle":"Konsol Morph Hukum K-T-S-P & Magnet Apitan","labProps":{"mode":"meN"},"examTip":"Kata dasar 'sapu' -> 'menyapu' (gugur s), 'tulis' -> 'menulis' (gugur t), 'pilih' -> 'memilih' (gugur p).","mediaKey":"bm_ktsp_forge","hook":"Rahsia K-T-S-P: huruf K, T, S, P pada kata akar GUGUR dan berubah menjadi ng, n, ny, m apabila menerima awalan meN-/peN-!"},{"type":"predict","voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Hukum Pengguguran meN-","voiceCaption":"Ramalkan ejaan kata terbitan yang betul apabila awalan meN- bertemu kata dasar bermula dengan huruf k, p, t, s.","voiceScript":"[curious] Berhati-hati dengan hukum fonologi awalan meN apabila bertemu huruf awal k, p, t, s dan pinjaman! Apakah ejaan terbitan yang betul bagi kata dasar kupas, kawal, dan teroka?","prompt":"Pilih bentuk kata terbitan yang MEMATUHI hukum pengguguran bunyi huruf awal (k, p, t, s) dan pengecualian pinjaman:","scenario":"Hukum D.B.P.: Bunyi k -> ng, p -> m, t -> n, s -> ny bagi kata dasar jati (kecuali kata pinjaman/gugus konsonan seperti mengkaji, memproses, mengkritik).","options":["mengkupas, menkawalkan, menteroka","mengupas, mengawal, meneroka","mengupas, mengkawal, meneroka","mengkupas, mengawal, menteroka"],"correctIndex":1,"proofLabId":"bm_morfologi_builder","proofState":{"mode":"meN"},"explanation":"kupas -> mengupas (k gugur -> ng), kawal -> mengawal (k gugur -> ng), teroka -> meneroka (t gugur -> n). Semua kata dasar ini ialah kata jati Melayu.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c3","voiceToneLabel":"3 Jenis Kata Ganda (Penuh, Separa, Berentak)","voiceCaption":"Kata ganda terdiri daripada ganda penuh, ganda separa pada suku kata awal, dan ganda berentak yang menyelaraskan bunyi.","voiceScript":"[confident] Bentuk kata keempat ialah kata ganda! Bezakan ganda penuh seperti murid-murid, ganda separa yang menyingkatkan suku kata seperti dedaun, dan ganda berentak seperti terkontang-kanting!","title":"5.1.3 Kata Ganda: Penuh, Separa & Berentak","acronym":"P•S•B","summary":"Penggandaan menandakan jamak, kesamaan rupa, atau kekerapan perbuatan dalam ayat.","bullets":["Ganda Penuh & Separa: Penuh menggandakan seluruh kata dasar (murid-murid, nilai-nilai); Separa menggandakan suku kata pertama dengan pelemahan vokal (dedaun, kekuda, lelayang).","Ganda Berentak: Penggandaan dengan persamaan/penyesuaian bunyi vokal atau konsonan (terkontang-kanting, bergolok bergadai, geruh-gerah)."],"labId":"bm_morfologi_builder","labTitle":"Magnet Apitan & Bengkel Kata Ganda","labProps":{"mode":"ganda"},"examTip":"Jangan gandakan lagi selepas kata ganda: 'para murid-murid' SALAH -> 'para murid' atau 'murid-murid' BETUL!","mediaKey":"bm_kata_ganda_mirror","hook":"Jangan buat kesalahan klasik: 'berbagai-bagai' atau 'pelbagai' sudah jamak — JANGAN tambah lagi 'para' atau kata ganda di belakangnya!"},{"type":"match","voiceIdKey":"u1-s4","voiceToneLabel":"Padan Jenis Kata Terbitan","voiceCaption":"Padankan perkataan daripada buku teks dengan jenis imbuhannya (awalan, akhiran, apitan, sisipan).","voiceScript":"[warm] Cuba padankan keempat-empat perkataan berikut dengan jenis pengimbuhan tatabahasa yang betul!","prompt":"Padankan perkataan berikut dengan jenis imbuhan yang membentuknya.","pairs":[{"id":"m1","left":"gemilang / telapak","right":"Kata Terbitan Sisipan (-em- / -el-)"},{"id":"m2","left":"pembakaran / pengubahsuaian","right":"Kata Terbitan Apitan (peN-...-an)"},{"id":"m3","left":"syarahan / binaan","right":"Kata Terbitan Akhiran (-an)"},{"id":"m4","left":"berubah / terkubur","right":"Kata Terbitan Awalan (ber- / ter-)"}],"explanation":"Perhatikan apitan peN-...-an ke atas kata majmuk 'ubah suai' mencantumkan ejaan kepada 'pengubahsuaian'.","xp":15,"mediaKey":"bm_ktsp_forge"},{"type":"mcq","voiceIdKey":"u1-s5","voiceToneLabel":"Uji Ejaan Kata Majmuk Berimbuhan","voiceCaption":"Pilih ayat dengan ejaan kata majmuk dan kata ganda yang paling tepat mengikut tatabahasa DBP.","voiceScript":"[curious] Periksa keempat-empat pilihan jawapan dengan teliti. Manakah ejaan kata majmuk dan imbuhan yang seratus peratus menepati Sistem Ejaan Rumi Bahasa Melayu?","prompt":"Antara ayat berikut, yang manakah mengandungi ejaan kata majmuk berimbuhan yang BETUL sepenuhnya?","options":["Guru mengambil alih tugas itu selepas pengambil alihan syarikat selesai.","Kerajaan mengemaskini pangkalan data dan menyebar luaskan panduan keselamatan.","Jabatan Pendaftaran Negara mengemas kini sistem kad pintar dan menyebarluaskan maklumat MyKad.","Semua warga negara wajib bekerjasama membaiki semula alat yang rosak."],"correctIndex":2,"explanation":"'kemas kini' dengan awalan meN- sahaja kekal terpisah ('mengemas kini'); 'sebar luas' dengan apitan meN-...-kan bercantum ('menyebarluaskan'). 'warganegara' ialah kata majmuk mantap yang mesti dieja rapat.","xp":20}]},{"id":"bm-u2","title":"Unit 2: Golongan Kata (Nama, Kerja, Adjektif & Tugas)","subtitle":"SP 5.2.1–5.2.4 — Fungsi Tatabahasa & Perangkap Lazim Kata Tugas","iconType":"scale","iconUrl":"../assets/icons/bm-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c1","voiceToneLabel":"Kata Nama & Kata Kerja Transitif","voiceCaption":"Kata nama menamakan benda atau ganti nama, manakala kata kerja transitif wajib diikuti objek.","voiceScript":"[warm] Jom imbas golongan kata! Kata nama terbahagi kepada khas, am dan ganti nama. Bagi kata kerja pula, kata kerja transitif mesti terus diikuti frasa nama objek tanpa kata sendi di tengahnya!","title":"5.2.1–5.2.2 Kata Nama & Kata Kerja Transitif/Tak Transitif","acronym":"KN • KK","summary":"Membezakan kata kerja transitif yang perlukan objek langsung daripada tak transitif membantu membina ayat gramatis.","bullets":["Kata Nama (SP 5.2.1): Khas (Taman Negara Mulu, Jabatan Pendaftaran Negara), Am (terarium, kad pintar), dan Kata Ganti Nama (patik, baginda, beliau, mereka).","Kata Kerja (SP 5.2.2): Transitif wajib diikuti objek langsung (memupuk nilai murni); Tak Transitif terbahagi kepada Tanpa Pelengkap (berterbangan) dan Berpelengkap (berasal daripada Latin)."],"labId":"bm_golongan_analyzer","labTitle":"Pengimbas Sinar Token Golongan Kata","labProps":{"sampleIdx":0},"examTip":"Kata kerja transitif TIDAK boleh disisip kata sendi 'akan': 'menyayangi akan ibu' SALAH -> 'menyayangi ibu' BETUL!","mediaKey":"bm_morfologi_workshop","hook":"Uji Kata Kerja Transitif dengan soalan 'APA?': jika wajib diikuti objek ('Ali membaca [buku]'), itulah KKT!"},{"type":"sort","voiceIdKey":"u2-s3","voiceToneLabel":"Isih Kata Kerja & Kata Tugas","voiceCaption":"Kelaskan kata kunci berikut kepada Kata Kerja Transitif, Kata Kerja Tak Transitif atau Kata Tugas.","voiceScript":"[warm] Asingkan enam frasa yang dipetik daripada buku teks berikut mengikut golongan katanya: Kata Kerja Transitif yang memerlukan objek, Kata Kerja Tak Transitif, atau Kata Tugas!","prompt":"Kelaskan perkataan bergaris (dalam konteks) ke dalam golongan kata yang betul.","buckets":[{"id":"kkt","label":"Kata Kerja Transitif (Ada Objek)"},{"id":"kktt","label":"Kata Kerja Tak Transitif"},{"id":"kt","label":"Kata Tugas (Sendi / Hubung / Bantu / Pemeri)"}],"items":[{"text":"membaca teks syarahan","bucketId":"kkt","note":"Kata kerja 'membaca' diikuti langsung oleh objek 'teks syarahan'."},{"text":"berterbangan pada waktu senja","bucketId":"kktt","note":"'berterbangan' tidak memerlukan objek langsung."},{"text":"walaupun / malahan / agar","bucketId":"kt","note":"Kata hubung (subkategori Kata Tugas)."},{"text":"menghadapi perubahan era 4.0","bucketId":"kkt","note":"Memerlukan objek 'perubahan era 4.0'."},{"text":"ialah / adalah / di / kepada","bucketId":"kt","note":"Kata pemeri dan kata sendi nama tergolong dalam Kata Tugas."},{"text":"terselamat daripada aniaya","bucketId":"kktt","note":"Kata kerja tak transitif berapitan/berawalan tanpa objek."}],"explanation":"Ujian pantas: Kata Kerja Transitif boleh dipasifkan dengan menukar imbuhan meN- kepada di- ('teks syarahan dibaca').","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c2","voiceToneLabel":"Kata Adjektif & Kata Penguat","voiceCaption":"Kata penguat bebas boleh berada di depan atau belakang kata adjektif, namun penguat hadapan seperti paling tidak boleh bergabung dengan sekali.","voiceScript":"[curious] Hati-hati dengan kata penguat kata adjektif! Kata penguat bebas seperti amat dan sungguh boleh duduk di hadapan atau belakang, tetapi kata paling dan terlalu haram digabungkan dengan sekali!","title":"5.2.3 Kata Adjektif & Peraturan Kata Penguat","acronym":"K•P•B","summary":"Mengenal 9 jenis kata adjektif dan batas gandingan kata penguat mengelakkan kesalahan kelewahan bahasa dalam SPM.","bullets":["9 Jenis Adjektif: Sifatan, warna, ukuran, bentuk, waktu, jarak, cara, pancaindera, dan perasaan.","Hukum Penguat: Penguat bebas ('amat bijak' / 'bijak amat'); Penguat hadapan ('paling bijak', 'terlalu laju') TIDAK BOLEH ditambah 'sekali' atau imbuhan 'ter-'."],"examTip":"'Paling bijak sekali' atau 'teramat paling bijak' adalah SALAH; pilih satu sahaja: 'paling bijak' atau 'bijak sekali'.","mediaKey":"bm_adjektif_meter","hook":"Perangkap no. 1 Kertas 2 BM: 'terpaling cantik' dan 'tercantik sekali' SALAH! Awalan 'ter-' & 'paling' tak boleh diganding dengan 'sekali'!"},{"type":"match","voiceIdKey":"u2-s4","voiceToneLabel":"Padan Pasangan Hukum Sendi Nama","voiceCaption":"Padankan pasangan kata tugas yang sering disalahgunakan dalam soalan suntingan kesalahan bahasa SPM.","voiceScript":"[curious] Padankan keempat-empat situasi tatabahasa berikut dengan penggunaan kata tugas yang betul mengikut D B P!","prompt":"Padankan konteks ayat sebelah kiri dengan kata tugas yang betul di sebelah kanan.","pairs":[{"id":"g1","left":"Kajian penyelidik ... Universiti South Carolina","right":"... di ... (tempat/institusi, bukan 'daripada')"},{"id":"g2","left":"Jauh lebih baik ... ubat tiruan","right":"... daripada ... (perbandingan)"},{"id":"g3","left":"Berbincang ... isu kerjaya muda","right":"... tentang ... (kata kerja tak transitif + 'tentang')"},{"id":"g4","left":"Diperkenalkan sejak tahun 1960 ... 1972","right":"... hingga ... (dari tahun 1960 hingga tahun 1972)"}],"explanation":"Kata kerja tak transitif 'berbincang' perlu diikuti kata sendi 'tentang', berbeza dengan kata kerja transitif 'membincangkan isu' (tiada 'tentang').","xp":15,"mediaKey":"bm_adjektif_meter"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c3","voiceToneLabel":"Kata Pemeri 'ialah' vs 'adalah' & Kata Sendi","voiceCaption":"Kata pemeri ialah hanya hadir di hadapan frasa nama, manakala adalah hadir di hadapan frasa adjektif atau frasa sendi nama.","voiceScript":"[confident] Ini perangkap paling kerap keluar dalam peperiksaan! Kata pemeri ialah hanya berpasangan dengan frasa nama, manakala adalah berpasangan dengan frasa adjektif atau frasa sendi nama!","title":"5.2.4 Kata Tugas: 'ialah' vs 'adalah' & Kata Sendi","acronym":"I:FN • A:FA/FS","mediaKey":"bm_kata_tugas_bridge","summary":"Kata tugas menjadi jambatan struktur ayat yang tepat mengikut jenis frasa di belakangnya.","bullets":["Pemeri 'ialah' vs 'adalah': 'ialah' + Frasa Nama ('Parasetamol ialah sebatian...'); 'adalah' + Frasa Adjektif/Sendi ('Langkah ini adalah sangat berkesan / adalah untuk mendidik').","Kata Sendi Tepat: 'dari' (arah/tempat/masa) vs 'daripada' (asal/punca/perbandingan); 'di' (tempat) vs 'pada' (masa/benda abstrak/manusia)."],"examTip":"JANGAN letak 'adalah' di hadapan kata kerja! Contohnya 'Tujuan program adalah untuk memupuk' BETUL, tetapi 'adalah memupuk' SALAH!","hook":"Kod kilat 'I-F / A-A': 'ialah' HANYA mendahului Frasa Nama; 'adalah' HANYA mendahului Frasa Adjektif atau Frasa Sendi Nama!"},{"type":"predict","voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Hukum Kata Pemeri & Sendi","voiceCaption":"Ramalkan gandingan kata pemeri dan kata sendi nama yang paling gramatis dalam laras rencana buku teks.","voiceScript":"[curious] Teliti ayat berikut tentang sejarah Kad Pengenalan dan Terarium daripada buku teks. Yang manakah menggunakan kata pemeri dan kata sendi nama tanpa sebarang lewah atau kesalahan tatabahasa?","prompt":"Pilih ayat yang menggunakan kata pemeri ('ialah'/'adalah') dan kata sendi nama ('dari'/'daripada') dengan TEPAT:","scenario":"Hukum Tatabahasa Dewan: 'dari' (arah, tempat, masa) vs 'daripada' (punca, asal kejadian, perbezaan, perbandingan, bahagian).","options":["Terarium adalah bekas kaca yang berasal dari perkataan Latin.","Terarium ialah bekas kaca yang berasal daripada perkataan Latin, dan kegunaannya adalah untuk memupuk minat berkebun.","MyKad ialah diperbuat dari bahan polikarbonat yang tahan lama.","Tujuan kad ini adalah mengawal keselamatan daripada pencerobohan pada masa lalu."],"correctIndex":1,"proofLabId":"bm_golongan_analyzer","proofState":{"sampleIdx":1},"explanation":"'bekas kaca...' ialah Frasa Nama maka gunakan 'ialah'; 'asal kata' ialah punca/asal maka gunakan 'daripada'; '...untuk memupuk' ialah Frasa Sendi Nama maka gunakan 'adalah'.","xp":20},{"type":"wordbank","voiceIdKey":"u2-s5","voiceToneLabel":"Bina Ayat Pasif Diri Pertama","voiceCaption":"Tukarkan ayat aktif Kata Ganti Nama Diri Pertama kepada ayat pasif yang gramatis.","voiceScript":"[confident] Ingat rumus ayat pasif diri pertama dan kedua: buang imbuhan meN, letak kata ganti nama diri sebelum kata kerja dasar! Susun ayat pasif bagi 'Saya membaca surat itu dengan teliti'.","prompt":"Tukarkan ayat aktif 'Saya telah meneliti surat rasmi itu semalam.' kepada ayat PASIF yang tepat:","hint":"Objek di depan -> kata bantu -> KGN Diri Pertama + kata kerja tanpa meN- -> keterangan.","answerTokens":["Surat rasmi itu","telah","saya teliti","semalam."],"distractors":["diteliti oleh saya","meneliti"],"explanation":"Hukum Tatabahasa: Kata Ganti Nama Diri Pertama & Kedua ('saya', 'kami', 'anda') TIDAK boleh menggunakan 'di-... oleh', sebaliknya mesti berbentuk 'telah saya teliti'.","xp":20}]},{"id":"bm-u3","title":"Unit 3: Binaan Frasa & Empat Pola Ayat Dasar","subtitle":"SP 5.3.1 & 5.3.2 — FN, FK, FA, FSN, Hukum D-M & 4 Pola Ayat Dasar KSSM","iconType":"map","iconUrl":"../assets/icons/bm-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c1","voiceToneLabel":"Hukum D-M dalam Binaan Frasa Nama","voiceCaption":"Mengikut Hukum D-M, perkataan diterangkan iaitu inti terletak di hadapan dan penerangnya di belakang.","voiceScript":"[warm] Pernahkah kamu nampak papan tanda menulis 'cili sos' atau 'mini pasar'? Mengikut Hukum D M, unsur diterangkan mesti di hadapan dan penerang di belakang, jadi yang betul ialah sos cili dan pasar mini!","title":"5.3.1 Hukum D-M (Diterangkan–Menerangkan) & Binaan Frasa","acronym":"INTI + PEN","mediaKey":"bm_pola_ayat_blocks","summary":"Susunan teratur antara unsur inti (D) dan unsur penerang (M) menjamin kegramatisan frasa nama Bahasa Melayu.","bullets":["Prinsip D-M: Inti (benda yang diterangkan) wajib mendahului Penerang -> 'sos cili' (betul), bukan 'cili sos'; 'pasar mini' (betul), bukan 'mini pasar'.","Frasa Nama Kompleks: Penjodoh bilangan/bilangan diikuti inti diikuti penerang dan penentu (cth: 'kedai kopi Pak Ali')."],"examTip":"Kekecualian terhad D-M hanya berlaku pada gelaran jawatan seperti 'Perdana Menteri', 'Timbalan Pengarah', 'Ibu Pejabat'.","hook":"Hukum D-M: Diterangkan dahulu, Menerangkan kemudian! Sebab itu 'sos cili' betul manakala 'cili sos' SALAH!"},{"type":"predict","voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Kesalahan Hukum D-M","voiceCaption":"Kenal pasti rangkai kata yang mematuhi Hukum D-M serta pengecualian jawatan/gelaran.","voiceScript":"[curious] Ingat! Hukum D M mempunyai beberapa pengecualian rasmi bagi nama jawatan seperti Perdana Menteri dan Ibu Pejabat. Manakah senarai yang mengandungi kesemuanya betul mengikut Hukum D M?","prompt":"Pilih pasangan frasa nama yang mematuhi Hukum D-M sepenuhnya dalam bahasa Melayu:","scenario":"Hukum D-M: 'Goreng pisang' merujuk perbuatan menggoreng pisang; jika merujuk makanan, ia wajib disebut 'Pisang goreng'.","options":["lain-lain hal, mini bas, tomato sos","hal-hal lain, bas mini, sos tomato","Kelinik Gigi Ali, cili sos, ayam goreng berempah","hal-hal lain, Perdana Menteri, goreng cempedak"],"correctIndex":1,"proofLabId":"bm_pola_ayat_lab","proofState":{"pattern":"FN_FA"},"explanation":"'hal-hal lain' (D=hal, M=lain), 'bas mini' (D=bas, M=mini), dan 'sos tomato' (D=sos, M=tomato) kesemuanya betul mengikuti Hukum D-M.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c2","voiceToneLabel":"Pola Ayat Dasar 1 (FN+FN) dan Pola 2 (FN+FK)","voiceCaption":"Pola Pertama memadankan subjek frasa nama dengan predikat frasa nama, manakala Pola Kedua menggunakan predikat frasa kerja.","voiceScript":"[curious] Semua ayat Bahasa Melayu berpunca daripada empat pola ayat dasar! Mari teliti dua pola terawal: Pola Satu ialah Frasa Nama campur Frasa Nama, manakala Pola Dua ialah Frasa Nama campur Frasa Kerja!","title":"5.3.2 Pola Ayat Dasar 1 (FN+FN) & Pola 2 (FN+FK)","acronym":"FN+FN / FK","summary":"Mengenal pasti kategori perkataan pertama predikat menentukan jenis pola ayat dasar dengan pantas.","bullets":["Pola 1 (FN + FN): Taman Negara Mulu [FN] + khazanah biodiversiti negara [FN] (menyatakan takrif atau identiti subjek).","Pola 2 (FN + FK): Pasukan Bomba dan Penyelamat [FN] + mengesan lokasi mangsa [FK] (menyatakan perbuatan subjek)."],"labId":"bm_pola_ayat_lab","labTitle":"Jambatan Cabang 4 Pola Ayat Dasar","labProps":{"pattern":"FN_FN"},"examTip":"Jika predikat bermula kata kerja ('sedang mengesan', 'telah melancarkan'), ayat itu tetap Pola 2 (FN + FK)!","mediaKey":"bm_pola_ayat_blocks","hook":"Semua ayat bahasa Melayu yang panjang bermula daripada cuma 4 Pola Ayat Dasar (FN+FN, FN+FK, FN+FA, FN+FS)!"},{"type":"match","voiceIdKey":"u3-s2","voiceToneLabel":"Padan Ayat kepada 4 Pola Dasar","voiceCaption":"Padankan empat ayat contoh bertema buku teks dengan pola ayat dasarnya (FN+FN/FK/FA/FSN).","voiceScript":"[curious] Kenal pasti bahagian Subjek dan Predikat pada setiap ayat sebelah kiri, lalu padankan dengan Pola Ayat Dasar yang tepat di sebelah kanan!","prompt":"Padankan setiap ayat dengan Pola Ayat Dasar yang sepadan.","pairs":[{"id":"p1","left":"Akaun SSPN-i ialah simpanan pendidikan.","right":"Pola 1: FN + FN"},{"id":"p2","left":"Kelawar gua berterbangan pada waktu senja.","right":"Pola 2: FN + FK"},{"id":"p3","left":"Laluan udara kanopi itu amat panjang.","right":"Pola 3: FN + FA"},{"id":"p4","left":"Mereka ke Karnival Kerjaya pagi tadi.","right":"Pola 4: FN + FSN"}],"explanation":"Predikat 'ialah simpanan...' ialah FN; 'berterbangan...' ialah FK; 'amat panjang' ialah FA; 'ke Karnival...' ialah FSN.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c3","voiceToneLabel":"Pola Ayat Dasar 3 (FN+FA) dan Pola 4 (FN+FSN)","voiceCaption":"Pola Ketiga berpredikat frasa adjektif menyifatkan subjek, manakala Pola Keempat berpredikat frasa sendi nama.","voiceScript":"[confident] Dua pola seterusnya ialah Pola Tiga dan Pola Empat! Apabila predikat menerangkan sifat seperti 'sungguh berdaya tahan', itu Pola Tiga FN campur FA; jika bermula kata sendi 'di' atau 'ke', itu Pola Empat!","title":"Pola Ayat Dasar 3 (FN+FA) & Pola 4 (FN+FSN)","acronym":"FN+FA / FSN","summary":"Mengenal pasti kata adjektif atau kata sendi nama sebagai kepala predikat membezakan Pola 3 daripada Pola 4.","bullets":["Pola 3 (FN + FA): Kad pengenalan polikarbonat ini [FN] + sungguh berdaya tahan [FA] (kata penguat + kata adjektif).","Pola 4 (FN + FSN): Ibu dan ayah Aiman [FN] + di ruang tamu rumah [FSN] (bermula kata sendi nama di, ke, dari, daripada, kepada, untuk)."],"labId":"bm_pola_ayat_lab","labTitle":"Cabang Pola 3 (FA) & Pola 4 (FSN)","labProps":{"pattern":"FN_FA"},"examTip":"Kata penguat ('sungguh', 'amat') di depan predikat menandakan Frasa Adjektif (Pola 3)!","mediaKey":"bm_pola_ayat_blocks","hook":"Lihat perkataan pertama selepas subjek: Kata Adjektif = FN+FA; Kata Sendi (di/ke/dari) = FN+FS!"},{"type":"sort","voiceIdKey":"u3-s4","voiceToneLabel":"Isih Jenis Frasa Predikat","voiceCaption":"Asingkan enam binaan predikat mengikut sama ada ia Frasa Kerja, Frasa Adjektif atau Frasa Sendi Nama.","voiceScript":"[warm] Asingkan enam contoh predikat berikut kepada jenis frasa yang betul: Frasa Kerja, Frasa Adjektif atau Frasa Sendi Nama!","prompt":"Isih setiap predikat berikut mengikut jenis frasanya yang tepat.","buckets":[{"id":"fk","label":"Frasa Kerja (FK)"},{"id":"fa","label":"Frasa Adjektif (FA)"},{"id":"fsn","label":"Frasa Sendi Nama (FSN)"}],"items":[{"text":"sedang mengkaji struktur terarium","bucketId":"fk","note":"Kata bantu 'sedang' + kata kerja 'mengkaji'."},{"text":"paling canggih pada abad ini","bucketId":"fa","note":"Kata penguat 'paling' + kata adjektif 'canggih'."},{"text":"dari Jabatan Pendaftaran Negara","bucketId":"fsn","note":"Dimulakan oleh kata sendi nama 'dari'."},{"text":"untuk keselamatan warganegara","bucketId":"fsn","note":"Dimulakan oleh kata sendi nama 'untuk'."},{"text":"akan menyertai uji bakat penyiaran","bucketId":"fk","note":"Kata bantu aspek 'akan' + kata kerja transitif."},{"text":"masih segar dan wangi sekali","bucketId":"fa","note":"Kata bantu + kata adjektif 'segar dan wangi'."}],"explanation":"Mengenal pasti inti frasa membolehkan pelajar membezakan pola ayat dasar serta menukar ayat susunan biasa ke susunan songsang dengan betul.","xp":20},{"type":"wordbank","voiceIdKey":"u3-s5","voiceToneLabel":"Bina Frasa Nama Kompleks Gramatis","voiceCaption":"Susun binaan Frasa Nama kompleks mengikut susunan Penjodoh Bilangan -> Inti -> Penerang -> Penentu Belakang.","voiceScript":"[confident] Susunkan perkataan berikut supaya membentuk satu Frasa Nama yang lengkap dan menepati susunan tatabahasa: bilangan, penjodoh bilangan, inti, penerang, dan penentu belakang.","prompt":"Susun perkataan berikut menjadi satu Frasa Nama yang lengkap dan gramatis:","hint":"Urutan: Bilangan -> Penjodoh Bilangan -> Kata Nama Inti -> Kata Adjektif/Penerang -> Penentu 'itu'.","answerTokens":["tiga","buah","kereta elektrik baharu","itu"],"distractors":["baharu elektrik kereta","ini tersebut"],"explanation":"Susunan FN penuh: Kata Bilangan ('tiga') + Penjodoh Bilangan ('buah') + Inti ('kereta elektrik') + Penerang Adjektif ('baharu') + Penentu Belakang ('itu').","xp":20}]},{"id":"bm-u4","title":"Unit 4: Ayat Songsang, Ayat Majmuk & 4 Jenis Ayat","subtitle":"SP 5.3.3 & 5.3.4 — Pendepanan Predikat, Gabungan/Pancangan & Ragam Ayat SPM","iconType":"crown","iconUrl":"../assets/icons/bm-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c1","voiceToneLabel":"Ayat Susunan Biasa vs Songsang","voiceCaption":"Ayat susunan songsang terhasil apabila keseluruhan atau sebahagian predikat dibawa ke hadapan subjek.","voiceScript":"[warm] Lihat pentas pembalikan ayat! Ayat susunan biasa mendahulukan subjek, tetapi untuk penegasan gaya bahasa, kita boleh mengedepankan predikat ke hadapan subjek menjadi ayat susunan songsang!","title":"5.3.3 Transformasi Ayat Susunan Biasa <-> Songsang","acronym":"P + S","mediaKey":"bm_ayat_flip_stage","summary":"Pendepanan predikat tidak mengubah makna ayat, tetapi memberi penekanan khusus pada tindakan, sifat atau keterangan.","bullets":["Susunan Biasa (Subjek + Predikat): 'Penggodam telah ditangkap di bilik pameran itu.'","Susunan Songsang (Predikat + Subjek): 'Telah ditangkap penggodam...' (pendepanan seluruh/kata kerja) atau 'Di dalam bilik pameran terarium itu...' (pendepanan frasa sendi)."],"labId":"bm_ayat_transform_lab","labTitle":"Pentas Tukar Susunan Ayat Biasa <-> Songsang","labProps":{"tab":"songsang"},"examTip":"Apabila menukar kepada songsang, jangan tinggalkan subjek atau ubah imbuhan kata kerja!","hook":"Transformasi Ayat Songsang memindahkan seluruh Predikat ke hadapan Subjek untuk memberi penegasan puitis & gramatis!"},{"type":"wordbank","voiceIdKey":"u4-s2","voiceToneLabel":"Bina Ayat Susunan Songsang","voiceCaption":"Tukarkan ayat susunan biasa kepada susunan songsang dengan mengedepankan seluruh predikatnya.","voiceScript":"[confident] Tukarkan ayat biasa 'Pasukan Bomba telah tiba di Gunung Jerai pada waktu pagi' kepada susunan songsang dengan mendepankan predikatnya!","prompt":"Tukarkan ayat susunan biasa 'Pasukan penyelamat bergegas ke Gunung Jerai pagi tadi.' kepada AYAT SUSUNAN SONGSANG (pendepanan seluruh predikat):","hint":"Letakkan seluruh frasa kerja + keterangan [bergegas ke Gunung Jerai pagi tadi] sebelum Subjek [pasukan penyelamat].","answerTokens":["Bergegas ke Gunung Jerai pagi tadi","pasukan penyelamat itu."],"distractors":["Pasukan penyelamat itu","ke Gunung Jerai bergegas pagi tadi."],"explanation":"Susunan Biasa = Subjek + Predikat; Susunan Songsang (pendepanan penuh) = Predikat ('Bergegas ke Gunung Jerai pagi tadi') + Subjek ('pasukan penyelamat itu').","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c2","voiceToneLabel":"3 Jenis Ayat Majmuk: Gabungan, Pancangan & Campuran","voiceCaption":"Ayat majmuk terbina daripada gabungan klausa setara atau pemancangan klausa relatif, komplemen dan keterangan.","voiceScript":"[curious] Satu ayat panjang selalunya ialah ayat majmuk! Kenali tiga jenis utamanya: Majmuk Gabungan dengan 'dan' atau 'tetapi', Majmuk Pancangan dengan 'yang', 'bahawa' atau 'kerana', serta Majmuk Campuran!","title":"Tiga Jenis Ayat Majmuk (Gabungan, Pancangan, Campuran)","acronym":"G•P•C","summary":"Mengenal pasti kata hubung utama mendedahkan struktur sama ada klausa-klausa ayat bersifat setara atau bertingkat.","bullets":["Ayat Majmuk Gabungan: Mencantumkan dua klausa setara menggunakan kata hubung 'dan', 'atau', 'tetapi', 'lalu', 'serta'.","Pancangan & Campuran: Relatif ('yang'), Komplemen ('bahawa', 'untuk'), Keterangan ('kerana', 'jika', 'apabila'); Campuran menggabungkan lebih daripada satu jenis ayat majmuk."],"labId":"bm_ayat_transform_lab","labTitle":"Penukar Blok 3 Jenis Ayat Majmuk","labProps":{"tab":"majmuk"},"examTip":"Kehadiran 'yang' + 'bahawa'/'kerana' bersama 'dan'/'tetapi' dalam satu ayat panjang hampir pasti ialah Majmuk Campuran!","mediaKey":"bm_ayat_majmuk_train","hook":"Kenali kata hubung: 'dan/atau' (Gabungan sama taraf), 'bahawa/yang/kerana' (Pancangan tidak setara)!"},{"type":"predict","voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Cerakinan Ayat Majmuk","voiceCaption":"Analisis jenis ayat majmuk dalam petikan perubatan 'Saudari Jaklin tidak perlu risau...' m/s 215.","voiceScript":"[curious] Perhatikan ayat daripada halaman dua ratus lima belas buku teks: 'Ada yang mendakwa bahawa makanan tambahan ini lebih baik berbanding ubat'. Apakah dua jenis klausa pancangan di dalam ayat majmuk campuran ini?","prompt":"Teliti ayat majmuk: 'Ada yang mendakwa bahawa makanan tambahan ini amat selamat.' Apakah gabungan klausa pancangan dalam ayat tersebut?","scenario":"Analisis Kata Hubung Pancangan: 'yang' menandai klausa relatif; 'bahawa' menandai klausa komplemen.","options":["Ayat Majmuk Gabungan sahaja dengan 'yang'.","Ayat Majmuk Pancangan Relatif ('yang') + Pancangan Komplemen ('bahawa').","Ayat Majmuk Pancangan Keterangan syarat + Ayat Tunggal.","Ayat Dasar Pola 1 tanpa sebarang kata hubung."],"correctIndex":1,"proofLabId":"bm_ayat_transform_lab","proofState":{"tab":"majmuk"},"explanation":"Kata hubung 'yang' membentuk Ayat Majmuk Pancangan Relatif manakala 'bahawa' dan 'untuk' membentuk Ayat Majmuk Pancangan Komplemen.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c3","voiceToneLabel":"4 Jenis Ayat: Penyata, Tanya, Perintah, Seruan","voiceCaption":"Bahasa Melayu mempunyai empat jenis ayat: penyata, tanya berpartikel kah, perintah empat subjenis dan seruan.","voiceScript":"[confident] Mengakhiri sistem sintaksis, kenali empat jenis ayat: ayat penyata, ayat tanya dengan partikel kah di hadapan, empat subjenis ayat perintah, serta ayat seruan berakhir tanda seru!","title":"5.3.4 Empat Jenis Ayat & Subjenis Ayat Perintah","acronym":"P•T•P•S","summary":"Setiap jenis ayat membawa tujuan komunikasi serta tanda baca dan kata tugas tersendiri yang sering diuji dalam SPM.","bullets":["Penyata & Tanya: Penyata memberi maklumat; Ayat Tanya meletakkan kata tanya di depan + partikel '-kah' ('Mengapakah...', 'Apakah...'), bukan 'Anda berasal dari manakah?'!","Perintah & Seruan: 4 subjenis Perintah (suruhan, larangan 'jangan/usah', silaan 'sila/jemput', permintaan 'minta/tolong'); Seruan guna kata seru + tanda '!' di hujung."],"labId":"bm_ayat_transform_lab","labTitle":"Penyelaras 4 Jenis Ayat SPM","labProps":{"tab":"jenis"},"examTip":"Partikel '-kah' hanya boleh melekat pada kata tanya apabila kata tanya diletak di AWAL ayat ('Siapakah nama anda?').","mediaKey":"bm_ayat_flip_stage","hook":"Empat jenis ayat mudah dikenal pada intonasi & penamatnya: Penyata (.), Tanya (?), Perintah (.), Seruan (!)."},{"type":"sort","voiceIdKey":"u4-s3","voiceToneLabel":"Isih 4 Jenis Ayat Perintah","voiceCaption":"Bezakan empat subjenis Ayat Perintah (Suruhan, Larangan, Silaan, Permintaan) daripada situasi buku teks.","voiceScript":"[curious] Ayat Perintah terbahagi kepada empat bentuk mengikut kata perintahnya. Isihkan enam ayat berikut mengikut subjenis Surah, Larangan, Silaan atau Permintaan!","prompt":"Kelaskan ayat perintah berikut ke dalam kategori yang betul.","buckets":[{"id":"suruh_larang","label":"Ayat Suruhan / Larangan (Tanpa 'sila/tolong')"},{"id":"sila_minta","label":"Ayat Silaan / Permintaan ('Sila/Jemput/Tolong/Minta')"}],"items":[{"text":"Jangan muat turun aplikasi yang mencurigakan.","bucketId":"suruh_larang","note":"Ayat Larangan menggunakan kata larangan 'jangan'."},{"text":"Tolong turunkan layar latihan 5G itu sekarang.","bucketId":"sila_minta","note":"Ayat Permintaan (dialog Kapten & Rob-My2 m/s 235)."},{"text":"Sila lengkapkan borang penilaian kendiri anda.","bucketId":"sila_minta","note":"Ayat Silaan menggunakan 'sila' atau 'jemput'."},{"text":"Hubungi penyedia perkhidmatan telefon segera.","bucketId":"suruh_larang","note":"Ayat Suruhan terus kepada kata kerja perintah."},{"text":"Minta semua calon mengambil tempat duduk.","bucketId":"sila_minta","note":"Ayat Permintaan menggunakan kata 'minta'."},{"text":"Usah biarkan penipuan SMS berleluasa.","bucketId":"suruh_larang","note":"Ayat Larangan menggunakan kata larangan 'usah'."}],"explanation":"Membezakan Ayat Permintaan ('tolong/minta') daripada Ayat Suruhan dan Larangan ('jangan/usah') sering diuji dalam soalan penukaran ragam ayat.","xp":20},{"type":"mcq","voiceIdKey":"u4-s5","voiceToneLabel":"Kesan Kesalahan Ayat Tanya","voiceCaption":"Pilih ayat tanya dan ayat seruan yang menepati peraturan tanda baca dan partikel -kah.","voiceScript":"[warm] Perangkap besar pelajar ialah meletakkan partikel kah pada kata tanya di hujung ayat, atau menggabungkan kata seru tanpa tanda seru! Pilih ayat yang seratus peratus betul.","prompt":"Antara ayat berikut, yang manakah betul dari segi binaan Ayat Tanya dan Ayat Seruan dalam bahasa Melayu?","options":["Siapa nama pengetua baharu sekolah awak itu kah?","Wah, cantiknya terarium bertema hutan hujan tropika ini!","Mengapa penduduk perlu menanam bahan makanan sendiri!","Adakah yang dikatakan oleh Rob-My1 semalam?"],"correctIndex":1,"explanation":"'Wah, cantiknya terarium bertema hutan hujan tropika ini!' menepati binaan Ayat Seruan ('Wah,' diikuti koma dan berakhir dengan tanda seru '!'). 'Adakah' digunakan untuk pertanyaan ya/tidak, bukan pengganti 'Apakah'.","xp":20}]},{"id":"bm-u5","title":"Unit 5: Cabaran Boss SPM — Sistem & Aplikasi Bahasa","subtitle":"5 Pusingan Sintesis Morfologi, Sintaksis, Hukum Tatabahasa & Penyuntingan Kertas 2","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Sunting Kesalahan Bahasa","voiceCaption":"Kenal pasti dua kesalahan bahasa dalam ayat iklan dan betulkan mengikut Kertas 2 SPM Soalan 3.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M Bahasa Melayu! Pusingan pertama menguji kemahiran Penyuntingan Kertas Dua: kenal pasti gabungan kesalahan dalam ayat 'Setengah pelajar tidak mengendahkan di atas nasihat kaunselor itu'.","prompt":"Teliti ayat berikut: 'Setengah pelajar kurang mengendahkan akan nasihat kaunselor tentang peluang kerjaya pada masa depan.' Apakah pembetulan tepat mengikut Kertas 2 SPM?","options":["'Setengah' -> 'Sesetengah'; buang kata sendi 'akan' selepas kata kerja transitif 'mengendahkan'.","'kurang' -> 'bukan'; 'tentang' -> 'ke atas'.","'mengendahkan' -> 'diendahkan'; 'pada' -> 'di'.","'Setengah' -> 'Separuh'; 'kaunselor' -> 'kaunselor-kaunselor'."],"correctIndex":0,"explanation":"'Setengah' bermaksud pecahan 1/2, manakala sebilangan orang ialah 'Sesetengah/Setengah-setengah'. 'mengendahkan' ialah kata kerja transitif maka objek 'nasihat' mesti terus menyusulinya tanpa 'akan'.","xp":25},{"type":"predict","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Pusingan 2: Analisis Ayat Pasif","voiceCaption":"Tentukan binaan ayat pasif yang sah apabila subjeknya didahului Kata Ganti Nama Diri ke-3 vs ke-1.","voiceScript":"[curious] Pusingan kedua! Bandingkan dua ayat tentang buku teks Pendidikan Era Empat Perpuluhan sifar ini. Manakah transformasi ayat aktif ke ayat pasif yang paling tepat?","prompt":"Tukarkan ayat aktif 'Mereka sedang menghasilkan puisi muzikal menerusi papan pintar.' kepada ayat PASIF yang paling tepat:","scenario":"'Mereka' ialah Kata Ganti Nama Diri KETIGA (menggunakan binaan pasif 'di-... oleh + mereka').","options":["Puisi muzikal sedang mereka hasilkan menerusi papan pintar.","Puisi muzikal sedang dihasilkan oleh mereka menerusi papan pintar.","Menerusi papan pintar mereka sedang menghasilkan puisi muzikal.","Puisi muzikal telah menghasilkan mereka menerusi papan pintar."],"correctIndex":1,"proofLabId":"bm_ayat_transform_lab","proofState":{"tab":"biasa"},"explanation":"Kerana 'mereka' ialah Kata Ganti Nama Diri KETIGA, bentuk pasif wajib menggunakan 'di-... oleh mereka' (bukan 'mereka hasilkan' yang khusus untuk diri pertama & kedua sahaja).","xp":25},{"type":"mcq","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Pusingan 3: Penggandaan & Kata Ganda","voiceCaption":"Elakkan hukum lewah bahasa yang menggabungkan kata bilangan jamak dengan kata ganda penuh.","voiceScript":"[confident] Pusingan ketiga! Ingat larangan lewah bahasa dalam penulisan karangan dan sintaksis S P M. Ayat manakah bebas daripada kesalahan kelewahan jamak dan penanda wacana?","prompt":"Pilih ayat yang BEBAS daripada sebarang kesalahan kelewahan bahasa mengikut Tatabahasa Dewan:","options":["Pelbagai langkah-langkah proaktif dilaksanakan demi kedamaian negara.","Semua murid-murid Tingkatan 4 menghadiri pameran inovasi 5G tersebut.","Berbagai-bagai aktiviti menarik disediakan untuk memupuk perpaduan anak muda.","Antara faktor-faktor kecemerlangan pelajar termasuklah pengurusan masa."],"correctIndex":2,"explanation":"Kata bilangan himpunan 'pelbagai/semua' tidak boleh diikuti kata ganda jamak ('pelbagai langkah', 'semua murid', 'antara faktor'). Namun 'berbagai-bagai aktiviti' betul kerana kata ganda diletakkan pada kata bilangannya.","xp":25},{"type":"wordbank","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Pusingan 4: Gabungkan Menjadi Ayat Majmuk","voiceCaption":"Gabungkan dua ayat tunggal menjadi satu Ayat Majmuk Pancangan Keterangan yang lancar.","voiceScript":"[curious] Pusingan keempat! Gabungkan dua ayat tunggal: pertama, 'Aiman amat gembira'; kedua, 'Ayah telah membuka akaun S S P N i sejak Aiman berumur satu hari' menggunakan kata hubung keterangan sebab yang tepat!","prompt":"Susun gabungan dua ayat tunggal berikut menjadi satu Ayat Majmuk Pancangan Keterangan yang gramatis:","hint":"Ayat induk [Aiman amat gembira] + kata hubung keterangan sebab ['kerana'] + klausa sebab.","answerTokens":["Aiman amat gembira","kerana ayah telah membuka akaun SSPN-i","sejak dia berumur satu hari."],"distractors":["yang ayah telah membuka","tetapi ayah telah membuka"],"explanation":"Hubungan sebab-akibat memerlukan kata hubung keterangan sebab ('kerana' atau 'lantaran'), bukan 'yang' (relatif) atau 'tetapi' (pertentangan).","xp":25},{"type":"mcq","voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Peribahasa & Klasik Sulalatus Salatin","voiceCaption":"Hubungkan petikan klasik 'Singapura Diserang Todak' (m/s 127) dengan peribahasa tema buku teks.","voiceScript":"[excited] Pusingan penentu Cabaran Boss Bahasa Melayu! Dalam petikan klasik 'Singapura Diserang Todak', seorang budak pintar mencadangkan kota batang pisang sehingga menyelamatkan rakyat. Pilih pasangan peribahasa atau ungkapan buku teks yang sepadan dengan iktibar ilmu dan usaha!","prompt":"Berdasarkan petikan 'Alam Kerjaya' (m/s 59) dan tema buku teks, apakah maksud peribahasa 'jika pengayuh sayang dibasahkan, sampan tidak akan sampai ke seberang'?","options":["Seseorang tidak akan memperoleh kejayaan jika takut bersusah payah atau enggan berusaha.","Semua masalah dapat diselesaikan dengan menunggu bantuan tanpa berbuat apa-apa.","Berhijrah ke negeri orang sentiasa lebih baik daripada berbakti di tanah air sendiri.","Kata-kata manis tidak semestinya membawa kepada pengkhianatan."],"correctIndex":0,"explanation":"Peribahasa 'jika pengayuh sayang dibasahkan, sampan tidak akan sampai ke seberang' (m/s 59) bermaksud cita-cita tidak akan tercapai sekiranya takut menghadapi kepayahan atau enggan berusaha.","xp":30}]}]};</script>

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }
  renderMindMap(null);

  if (step.labId) {
    var mount = document.getElementById("conceptLabMount");
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  var btn = document.getElementById("conceptDoneBtn");
  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

        }

        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {

/* 05-feedback-and-celebration.js — Drawer Feedback, Heart Recovery, Confetti & Boot */
function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function hideFeedbackDrawer() {
  var drawer = document.getElementById("feedbackDrawer");
  if (drawer) drawer.hidden = true;
}

function showFeedbackDrawer(cfg) {
  var drawer = document.getElementById("feedbackDrawer");
  var iconEl = document.getElementById("feedbackBadgeIcon");
  var titleEl = document.getElementById("feedbackTitle");
  var xpTag = document.getElementById("feedbackXpTag");

  var ok = Boolean(cfg && cfg.isCorrect);

  if (iconEl) iconEl.innerHTML = getSvgIcon(ok ? "check" : "x", "");
  if (titleEl) titleEl.textContent = ok
    ? (notaState.combo >= 2 ? tUi("Hebat! Kombo x", "Awesome! Combo x") + notaState.combo : tUi("Tepat Sekali!", "Spot On!"))
    : tUi("Hampir Tepat!", "Almost There!");
  if (xpTag) {
    xpTag.hidden = !ok || !cfg.xpGain;
    xpTag.textContent = "+" + (cfg.xpGain || 0) + " XP";
  }
  if (expEl) expEl.textContent = (cfg && cfg.explanation) || "";
  if (btn) {
    btn.className = "btn-3d " + (ok ? "btn-3d-green" : "btn-3d-blue") + " feedback-continue-btn";
  }
  drawer.hidden = false;
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

function showCelebration() {
  runLabCleanups();
  hideFeedbackDrawer();
  var units = CHAPTER.units || [];
  var unit = units[notaState.activeUnitIdx] || { id: "u", title: "Unit" };
  var acc = notaState.unitTotal > 0 ? Math.round((notaState.unitCorrect / notaState.unitTotal) * 100) : 100;
  var stars = acc >= 85 ? 3 : (acc >= 60 ? 2 : 1);

  var prev = notaState.completedUnits[unit.id];
  var bestStars = prev ? Math.max(Number(prev.stars) || 0, stars) : stars;
  notaState.completedUnits[unit.id] = { stars: bestStars, accuracy: acc, xp: notaState.unitXpEarned };
  saveNotaState();
  NotaAudio.playFanfare();
  launchConfetti();

  var starsRow = document.getElementById("celStarsRow");
  if (starsRow) {
    starsRow.innerHTML = [1, 2, 3].map(function (n) {
      return '<svg class="cel-star-slot ' + (n <= stars ? "earned" : "") + '" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' + NOTA_ICONS.star + "</svg>";
    }).join("");
  }

  document.getElementById("celTitle").textContent = unit.boss
    ? tUi("Cabaran Boss Bab Berjaya!", "Boss Challenge Conquered!")
    : tUi("Unit Berjaya Dikuasai!", "Unit Mastered!");
  document.getElementById("celSubtitle").textContent = "Unit " + (notaState.activeUnitIdx + 1) + ": " + unit.title;
  document.getElementById("celAccuracy").textContent = acc + "%";
  document.getElementById("celXp").textContent = "+" + notaState.unitXpEarned + " XP";

  var nextBtn = document.getElementById("celNextBtn");
  if (nextBtn) {
    nextBtn.hidden = notaState.activeUnitIdx + 1 >= units.length;
  }

  var overlay = document.getElementById("celebrationOverlay");
  if (overlay) overlay.hidden = false;
  if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayCelebration) {
    NotaVoice.autoplayCelebration();
  }

  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { unitId: unit.id, unitStars: stars, accuracyPct: acc });
  var stats = getChapterStats();
  if (stats.completedUnits >= stats.totalUnits && stats.totalUnits > 0) {
    emitPortalEvent("ETUTOR_NOTA_COMPLETED", { accuracyPct: acc, maxCombo: notaState.maxCombo });
