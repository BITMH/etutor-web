/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

an Cergaskan Dirimu, kita membezakan makna dan fungsi istilah kecergasan di gimnasium dan di alam hijau untuk S P satu perpuluhan satu perpuluhan satu. Seterusnya, dalam bahagian Seni Memberikan Erti, kita menghayati kisah Wan Jamila atau Artjamila yang menggunakan terapi seni melalui lukisan sebagai saluran ekspresi emosi serta membina kemahiran S P tiga perpuluhan satu perpuluhan satu iaitu menjelaskan maksud ayat mengikut konteks! Tonton juga video panduan wacana karangan yang terpaut pada langkah ini!","title":"1.1.1 & 3.1.1 Kecergasan Diri, Terapi Seni & Teknik Maksud Ayat","acronym":"SIHAT•SENI","hook":"Tonton video panduan wacana karangan dan kuasai teknik menjelaskan maksud ayat dalam makmal!","mediaKey":"bm51_terapi_seni","videoClip":{"src":"../assets/bahasa-melayu-t5-wacana/video/bm5_video_wacana_karangan.mp4","hasNarration":false,"posterKey":"bm51_amalan_sihat","caption":"Panduan menyusun kesinambungan idea dan penanda wacana karangan SPM bertemakan gaya hidup sihat."},"summary":"Kesihatan holistik merangkumi kecergasan fizikal, ketenangan minda menerusi terapi seni dan ketajaman bahasa memahami serta menghuraikan maksud ayat petikan.","bullets":["Perbezaan Istilah Kecergasan (SP 1.1.1): Bersenam menggunakan peralatan bebanan di gimnasium membina daya tahan otot, manakala senaman di alam hijau menyegarkan sistem pernafasan dan meredakan tekanan minda.","Terapi Seni Artjamila (Wan Jamila Wan Shaiful Bahri): Lukisan spontan, lukisan keluarga dan potret diri membantu luahan emosi serta terapi jiwa tanpa bergantung pada pertuturan semata-mata.","Menjelaskan Maksud Ayat (SP 3.1.1): Tukar kata kiasan atau istilah khusus dengan makna literalnya dalam ayat penyata lengkap."],"labId":"bm51_wacana_komsas_lab","labTitle":"Makmal Maksud Ayat & Intonasi Teks (SP 3.1.1 & 2.1.1)","labProps":{"panel":"maksud"},"examTip":"Dalam soalan pemahaman Kertas 2 yang meminta 'Berikan maksud rangkai kata...', pastikan setiap perkataan penting diganti dengan padanan makna yang tepat dan gramatis."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Manfaat Terapi Seni vs Senaman","voiceCaption":"Asingkan enam fakta berikut antara Terapi Seni Lukisan dengan Aktiviti Kecergasan Fizikal.","voiceScript":"[curious] Asingkan keenam-enam ciri berikut kepada Terapi Seni Lukisan atau Aktiviti Kecergasan Fizikal!","prompt":"Kelaskan pernyataan berikut mengikut komponen kesihatan holistiknya:","buckets":[{"id":"seni","label":"Terapi Seni Lukisan"},{"id":"fizikal","label":"Kecergasan Fizikal"}],"items":[{"text":"Menggunakan lukisan keluarga, potret diri dan contengan spontan untuk meluahkan emosi","bucketId":"seni","note":"Betul! Teknik asas dalam terapi seni melalui lukisan."},{"text":"Melatih kekuatan otot serta ketahanan kardiovaskular di gimnasium atau taman","bucketId":"fizikal","note":"Tepat! Manfaat utama gerak cergas fizikal."},{"text":"Boleh dilakukan sendiri tanpa perlu mahir melukis secara profesional","bucketId":"seni","note":"Betul! Fokusnya ialah penyembuhan emosi, bukan pertandingan seni."},{"text":"Membantu mengawal berat badan dan membendung risiko obesiti","bucketId":"fizikal","note":"Tepat! Senaman berkala mengurangkan faktor risiko kanser dan penyakit kronik."},{"text":"Dimanfaatkan oleh pelukis istimewa seperti Wan Jamila (Artjamila)","bucketId":"seni","note":"Betul! Kisah inspirasi daripada buku teks Tema 1."},{"text":"Menggabungkan senaman berintensiti di ruang tertutup atau udara segar alam hijau","bucketId":"fizikal","note":"Tepat! Dua latar aktiviti kecergasan dalam Unit 1."}],"explanation":"Keseimbangan kesihatan jasmani dan ketenangan emosi melalui seni membentuk individu yang sihat sejahtera."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Ungkapan dengan Maksud Ayat","voiceCaption":"Padankan empat ungkapan daripada petikan Tema 1 dengan maksud tepatnya mengikut konteks SP 3.1.1.","voiceScript":"[confident] Uji kemahiran S P tiga perpuluhan satu perpuluhan satu! Padankan setiap rangkai kata berikut dengan maksud tepatnya.","prompt":"Padankan ungkapan berikut dengan maksud tepatnya mengikut konteks:","pairs":[{"id":"bm51u1m1","left":"Medium terapi jiwa","right":"Saluran atau perantara untuk merawat serta menenangkan emosi dalaman"},{"id":"bm51u1m2","left":"Pola penularan terkawal","right":"Corak jangkitan penyakit berada pada tahap terurus tanpa lonjakan luar biasa"},{"id":"bm51u1m3","left":"Mencegah sebelum parah","right":"Mengambil langkah awal kawalan kesihatan sebelum penyakit melarat"},{"id":"bm51u1m4","left":"Wabak penyakit berjangkit","right":"Penularan penyakit berjangkit yang merebak luas dalam komuniti"}],"explanation":"Penjelasan maksud memerlukan ketepatan semantik tanpa mengubah laras makna asal ayat."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Prinsip Terapi Seni Melalui Lukisan","voiceCaption":"Pilih pernyataan yang betul mengenai terapi seni lukisan berdasarkan petikan buku teks.","voiceScript":"[confident] Berdasarkan maklumat Terapi Seni melalui Lukisan dalam Tema satu, pernyataan manakah yang paling tepat?","prompt":"Manakah fakta yang BENAR mengenai amalan Terapi Seni melalui Lukisan?","options":["Tidak mewajibkan seseorang mahir melukis dan dapat dilakukan sebagai saluran ekspresi emosi serta terapi minda","Hanya dibenarkan untuk pelukis bertaraf profesional yang memiliki ijazah seni halus","Bertujuan semata-mata untuk menggantikan rawatan kecemasan pembedahan di hospital","Melarang penggunaan teknik lukisan spontan dan potret diri"],"correctIndex":0,"explanation":"Buku teks menjelaskan terapi seni bertujuan membantu luahan emosi dan ketenangan diri tanpa memerlukan kemahiran melukis peringkat profesional."}]},{"id":"bm51-u2","title":"Unit 2: Kata Tunggal & Kata Majmuk (Wabak Influenza)","subtitle":"SP 5.1.1 & 2.1.1 — Analisis Morfologi Berita Influenza serta Hukum Ejaan Kata Majmuk & Imbuhan","iconType":"formula","iconUrl":"../assets/icons/bm51-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kata Tunggal & Kata Majmuk SP 5.1.1","voiceCaption":"Standard pembelajaran lima perpuluhan satu perpuluhan satu membezakan kata tunggal daripada kata majmuk bebas, istilah khusus, kiasan dan lima belas kata majmuk mantap.","voiceScript":"[warm] Selamat datang ke Unit dua! Petikan Serangan Influenza Meningkat tetapi Terkawal mengandungi banyak Kata Tunggal seperti wad, sabun, tisu, gejala, mutasi dan influenza, serta Kata Majmuk seperti bandar raya, Ketua Pengarah, sapu tangan, cuti sakit, pelitup muka, garis panduan dan terima kasih! Ingat peraturan emas S P lima perpuluhan satu perpuluhan satu: semua kata majmuk DIEJA TERPISAH kecuali lima belas kata majmuk mantap seperti kerjasama dan kakitangan! Apabila kata majmuk menerima awalan atau akhiran sahaja, ejaannya kekal terpisah seperti berterima kasih; tetapi apabila menerima APITAN serentak, barulah dirapatkan seperti menandatangani atau mengemaskinikan!","title":"5.1.1 Kata Tunggal (1–4 Suku Kata) & Hukum Kata Majmuk","acronym":"KT•KM•15","hook":"Buka makmal morfologi untuk melihat senarai penuh 15 kata majmuk mantap dan peraturan pengimbuhan!","mediaKey":"bm51_amalan_sihat","summary":"Kata tunggal kekal sebagai satu bentuk dasar tanpa imbuhan atau penggandaan, manakala kata majmuk merangkaikan dua kata dasar untuk makna baharu yang khusus.","bullets":["Kata Tunggal Tema 1: 1 suku kata (wad), 2 suku kata (sabun, batuk, tisu, wabak, sukar), 3 suku kata (gejala, syarikat, mutasi, tropika), 4 suku kata (influenza). Termasuk juga kata tugas (di, ke, dan, oleh, bagi).","Kata Majmuk Terpisah: Rangkai kata bebas (bandar raya, Ketua Pengarah, cuti sakit, sapu tangan, pelitup muka, terima kasih), istilah khusus (garis panduan) dan kiasan (makan angin).","Kata Majmuk Mantap (Dieja Rapat): Contoh dalam Tema 1 ialah 'kerjasama' dan 'kakitangan'. Kata majmuk terpisah hanya dirapatkan jika menerima apitan (contoh: 'mengambil alih' vs 'pengambilalihan')."],"labId":"bm51_kata_tunggal_majmuk_lab","labTitle":"Makmal Kata Tunggal & Kata Majmuk (SP 5.1.1)","labProps":{"tab":"mantap"},"examTip":"Perangkap ejaan SPM paling kerap: 'bandaraya' SALAH (sepatutnya 'bandar raya'), 'kerjasama' BETUL (mantap), 'mengambilalih' SALAH (sepatutnya 'mengambil alih'), 'pengambilalihan' BETUL (apitan)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Ejaan Kata Majmuk & Imbuhan","voiceCaption":"Ramalkan himpunan kata majmuk terpisah, kata majmuk mantap dan kata majmuk berapitan yang betul ejaannya.","voiceScript":"[curious] Berhati-hati dengan perbezaan antara kata majmuk mantap dengan kata majmuk berimbuhan! Manakah kumpulan ejaan yang seratus peratus betul?","hook":"Semak: bandar raya terpisah, kakitangan mantap, berterima kasih hanya berawalan!","scenario":"Guru menyemak karangan murid tentang langkah pencegahan influenza di bandar raya.","prompt":"Pilih himpunan kata majmuk yang BETUL ejaannya mengikut Tatabahasa Dewan:","options":["bandar raya, pelitup muka, kerjasama, berterima kasih, pengemaskinian","bandaraya, pelitupmuka, kerja sama, berterimakasih, pengemas kinian","bandar raya, saputangan, kakitangan, mengambilalih, pengemaskinian","bandaraya, garis panduan, kaki tangan, berterima kasih, mengemaskinikan"],"correctIndex":0,"proofLabId":"bm51_kata_tunggal_majmuk_lab","proofState":{"tab":"bebas"},"explanation":"'bandar raya', 'pelitup muka' terpisah; 'kerjasama' ialah 1 daripada 15 kata majmuk mantap; 'berterima kasih' hanya berawalan 'ber-' maka kekal terpisah; 'pengemaskinian' berapitan maka dirapatkan."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Kategori Kata Tunggal & Majmuk","voiceCaption":"Padankan perkataan daripada Tema 1 dengan pengelasan morfologinya yang betul.","voiceScript":"[confident] Padankan lima perkataan daripada senarai Tema satu berikut dengan pengelasan kata tunggal atau kata majmuknya!","prompt":"Padankan perkataan berikut dengan kategori morfologinya:","pairs":[{"id":"bm51u2m1","left":"wad / tisu / influenza","right":"Kata Tunggal (1, 2 dan 4 suku kata)"},{"id":"bm51u2m2","left":"kerjasama / kakitangan","right":"Kata Majmuk Mantap (dieja rapat)"},{"id":"bm51u2m3","left":"bandar raya / sapu tangan","right":"Kata Majmuk Rangkai Kata Bebas (terpisah)"},{"id":"bm51u2m4","left":"makan angin / ringan tulang","right":"Kata Majmuk Maksud Kiasan (simpulan bahasa)"},{"id":"bm51u2m5","left":"garis-garis panduan","right":"Penggandaan Kata Majmuk (unsur pertama sahaja diulang)"}],"explanation":"Penggandaan kata majmuk terpisah hanya mengulang kata pertama ('bandar-bandar raya', 'Ketua-Ketua Pengarah'), manakala kata majmuk mantap digandakan penuh ('kakitangan-kakitangan')."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Nada Bacaan Berita vs Pengumuman","voiceCaption":"Pilih pernyataan tepat tentang perbezaan intonasi antara membaca berita televisyen dengan pengumuman kesihatan awam.","voiceScript":"[confident] Mengikut S P dua perpuluhan satu perpuluhan satu, apakah perbezaan nada antara berita televisyen dengan pengumuman garis panduan wabak?","prompt":"Apakah perbezaan bacaan antara teks berita televisyen dengan pengumuman panduan menghadapi wabak penyakit?","options":["Berita dibaca dengan intonasi formal dan objektif melaporkan fakta, manakala pengumuman menggunakan nada tegas serta jeda jelas pada arahan tindakan","Berita dibaca sambil berbisik perlahan, manakala pengumuman dinyanyikan berirama","Kedua-duanya dibaca tanpa tanda berhenti atau penekanan kata kunci langsung","Pengumuman menggunakan nada sedih meratap seperti puisi klasik"],"correctIndex":0,"explanation":"SP 2.1.1 menekankan kesesuaian intonasi dan nada mengikut jenis teks dan khalayak."}]},{"id":"bm51-u3","title":"Unit 3: Kebersihan Persekitaran & Gerai Pak Sardi","subtitle":"SP 1.1.2, 2.1.2 & 4.1.1 — Persekitaran Bersih, Cerpen 'Petua Tuk Nan', Sajak 'Menguak Kamar Kenangan' & Menu Bersih","iconType":"scale","iconUrl":"../assets/icons/bm51-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kebersihan Premis & Apresiasi Karya","voiceCaption":"Penjagaan kebersihan kawasan perumahan, etika pengendali makanan di gerai Pak Sardi serta penghayatan cerpen Petua Tuk Nan dan sajak Menguak Kamar Kenangan membentuk amalan kebersihan menyeluruh.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam dialog Persekitaran Bersih Idaman Semua, penduduk seperti Fandi, Mun Chew dan Durga Devi bekerjasama melaporkan kawasan semak terbengkalai yang menjadi sarang tikus, lipas dan nyamuk kepada Tuk Ketua Nazri untuk tindakan pihak berkuasa tempatan. Dalam petikan Menu Lazat Lokasi Bersih pula, pemilik gerai Pak Sardi mewajibkan pekerjanya memakai apron dan penutup kepala, tidak memakai barang kemas semasa memasak, menggunakan penyepit makanan dan menutup lauk dengan penutup lut sinar! Seterusnya, kita menghayati cerpen Petua Tuk Nan serta sajak Menguak Kamar Kenangan karya Nimoiz T Y tentang nilai bilik tidur sebagai jantung diri!","title":"1.1.2 & 4.1.1 Kebersihan Komuniti, Premis Makanan & Apresiasi Karya","acronym":"PREMIS•SENI","hook":"Teliti piawaian kebersihan gerai Pak Sardi serta unsur menarik dalam cerpen dan sajak kebersihan!","summary":"Kebersihan persekitaran dan keselamatan penyediaan makanan mencegah haiwan perosak serta keracunan, manakala karya sastera menyemai kesedaran menjaga ruang peribadi.","bullets":["Amalan Kebersihan Gerai Pak Sardi: Jauh daripada pencemaran dan tangki septik; tong sampah bertutup; bebas jam tangan/gelang dan larangan merokok ketika memasak; pemakaian apron, penutup kepala dan penyepit/sudip makanan; penutup lauk lut sinar.","Tindakan Komuniti Bersih (SP 1.1.2): Pelaporan terancang melalui Jawatankuasa Penduduk dan Pihak Berkuasa Tempatan (PBT) bagi mengatasi kawasan terbiar berisiko pembiakan vektor penyakit.","Apresiasi Cerpen & Sajak (SP 4.1.1): Sajak 'Menguak Kamar Kenangan' (Nimoiz T.Y.) mengangkat pesan bonda bahawa bilik tidur mencerminkan keperibadian ('bilik tidur ialah jantung diri') dengan gaya bahasa metafora."],"examTip":"Apabila diminta mengulas aspek menarik sesebuah cerpen atau sajak (SP 4.1.1), kaitkan persoalan karya dengan gaya bahasa (metafora, personifikasi) serta pengajaran yang mudah diamalkan oleh remaja."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Amalan Kebersihan Pengendali Makanan","voiceCaption":"Kelaskan amalan pengendali makanan di gerai Pak Sardi kepada Amalan Dipuji atau Amalan Dilarang.","voiceScript":"[curious] Asingkan enam amalan di premis makanan ini kepada Amalan Dipuji dan Wajib atau Amalan Dilarang!","prompt":"Kelaskan amalan pengendali makanan berikut mengikut piawaian kebersihan Pak Sardi:","buckets":[{"id":"patuh","label":"Amalan Dipuji & Wajib"},{"id":"larang","label":"Amalan Dilarang Keras"}],"items":[{"text":"Memakai apron bersih dan penutup kepala serta menggunakan penyepit makanan","bucketId":"patuh","note":"Betul! Mengelakkan rambut atau pencemaran tangan jatuh ke dalam lauk."},{"text":"Memakai jam tangan dan gelang semasa menyediakan lauk-pauk","bucketId":"larang","note":"Tepat! Barang kemas boleh memerangkap kotoran dan jatuh ke makanan."},{"text":"Menggunakan penutup makanan lut sinar supaya pelanggan melihat tanpa membuka penutup","bucketId":"patuh","note":"Betul! Menghalang lalat tanpa menjejaskan daya tarikan makanan."},{"text":"Merokok, mengunyah sirih atau batuk terus di hadapan hidangan terbuka","bucketId":"larang","note":"Tepat! Melanggar etika kebersihan diri pengendali makanan."},{"text":"Meletakkan tong sampah bertutup jauh dari tempat penyediaan hidangan","bucketId":"patuh","note":"Betul! Mencegah bau dan kehadiran tikus serta lipas."},{"text":"Mengambil lauk secara terus dengan jari tanpa sudip atau sarung tangan","bucketId":"larang","note":"Tepat! Berisiko menyebabkan keracunan makanan."}],"explanation":"Kebersihan fizikal premis, tatacara pengendali dan peralatan tertutup menjadi tunjang premis makanan berprestij."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Watak, Sajak & Pengajaran","voiceCaption":"Padankan elemen daripada petikan komunikasi lisan, cerpen dan sajak Tema 1 dengan peranannya.","voiceScript":"[confident] Padankan setiap petikan dan watak dalam Unit tiga dengan pengajaran atau maklumat tepatnya!","prompt":"Padankan unsur berikut dengan penerangannya:","pairs":[{"id":"bm51u3m1","left":"Dialog Fandi, Mun Chew & Durga Devi","right":"Melaporkan sarang ular, tikus dan nyamuk di bangunan terbiar kepada PBT"},{"id":"bm51u3m2","left":"Gerai Pak Sardi","right":"Model kebersihan gerai makan yang bebas vektor perosak dan kemas"},{"id":"bm51u3m3","left":"'Bilik tidur ialah jantung diri'","right":"Metafora daripada sajak Menguak Kamar Kenangan tentang kebersihan kamar"},{"id":"bm51u3m4","left":"Cerpen Petua Tuk Nan","right":"Prosa moden yang menonjolkan amalan petua kesihatan dan kebersihan tradisi"}],"explanation":"Setiap bahan sastera dan dialog dalam Tema 1 memupuk kesedaran kebersihan dari kamar peribadi hingga komuniti."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Mesej Sajak Menguak Kamar Kenangan","voiceCaption":"Pilih tafsiran tepat bagi nasihat bonda 'bilik tidur ialah jantung diri' dalam sajak Nimoiz T.Y.","voiceScript":"[confident] Apakah maksud tersirat nasihat bonda bahawa bilik tidur ialah jantung diri dalam sajak Menguak Kamar Kenangan?","prompt":"Apakah mesej utama di sebalik ungkapan 'bilik tidur ialah jantung diri' dalam sajak Menguak Kamar Kenangan?","options":["Keadaan bilik tidur yang bersih dan teratur mencerminkan keperibadian, disiplin serta ketenangan jiwa pemiliknya","Bilik tidur hanya perlu dibersihkan setahun sekali ketika musim perayaan","Bilik tidur mesti dibina berbentuk jantung manusia","Penghuni tidak dibenarkan meninggalkan bilik tidur sepanjang hidupnya"],"correctIndex":0,"explanation":"Metafora 'jantung diri' melambangkan betapa pentingnya ruang tidur yang bersih dan rapi sebagai nadi kesejahteraan seseorang."}]},{"id":"bm51-u4","title":"Unit 4: Makan Sayur, Anda Sihat & Hari Kanser Sedunia","subtitle":"SP 3.1.1 — Lima Khasiat Sayur serta Statistik & Faktor Risiko Hari Kanser Sedunia (WHO & KKM)","iconType":"scale","iconUrl":"../assets/icons/bm51-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Khasiat Sayur & Pencegahan Kanser","voiceCaption":"Pemakanan kaya serat, vitamin dan antioksida daripada sayur-sayuran serta gaya hidup sihat mampu mencegah tiga puluh hingga lima puluh peratus kes kanser menurut WHO.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian akhir Tema satu menggabungkan dua bahan kritikal iaitu Makan Sayur Anda Sihat dan infografik Hari Kanser Sedunia pada empat Februari! Sayur-sayuran membekalkan serat tinggi, vitamin dan mineral pengawal kesihatan, bahan antioksida pencegah penyakit, serta kandungan air pelembap kulit. Sementara itu, data Pertubuhan Kesihatan Sedunia menunjukkan satu daripada enam kematian berpunca daripada kanser, namun tiga puluh hingga lima puluh peratus kes kanser boleh dicegah melalui gaya hidup sihat dengan menjauhi rokok, alkohol, obesiti dan kekurangan senaman!","title":"Khasiat Sayur & Analisis Data Hari Kanser Sedunia (WHO / KKM)","acronym":"5•KHASIAT","hook":"Pelajari 5 khasiat utama sayur-sayuran dan fakta statistik kesedaran kanser WHO serta KKM!","summary":"Amalan pemakanan seimbang tinggi sayur-sayuran serta pengesanan awal mengurangkan risiko penyakit kronik dan kematian akibat kanser tahap lewat.","bullets":["5 Khasiat Sayur-sayuran: (1) Kandungan serat tinggi untuk pencernaan, (2) Kaya vitamin dan mineral, (3) Sumber antioksida pelawan penyakit, (4) Kandungan air melembapkan kulit, (5) Sebatian kimia semula jadi pencegah pelbagai penyakit.","Statistik WHO (Hari Kanser Sedunia, 4 Feb): Kanser penyebab kematian kedua tertinggi dunia (1 daripada 6 kematian); 30%–50% kes dapat dicegah menerusi gaya hidup sihat.","Data Pendaftar Kanser Kebangsaan Malaysia (2012–2016): Kanser paling kerap termasuk payudara (19%; 34.1% wanita), kolorektal (13.5%; 16.9% lelaki) dan paru-paru (9.8%); kes lewat dikesan (tahap 3 & 4) meningkat daripada 58.7% kepada 63.7%."],"examTip":"Apabila diminta menghuraikan infografik kesihatan dalam karangan berpandu Kertas 1, gabungkan statistik utama (30%–50% boleh dicegah) bersama faktor risiko dan langkah saringan awal."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Huraian Pencegahan Kanser","voiceCaption":"Susun ayat untuk membina satu perenggan kesedaran mengenai pencegahan awal kanser berdasarkan data WHO dan KKM.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk satu perenggan ucapan awam Hari Kanser Sedunia yang padat dan tepat!","prompt":"Susun bahagian ucapan Hari Kanser Sedunia berikut mengikut urutan huraian yang berkesan:","hint":"Mulakan dengan fakta WHO tentang pencegahan, diikuti faktor risiko utama dan penegasan saringan awal...","answerTokens":["Menurut Pertubuhan Kesihatan Sedunia, antara 30 hingga 50 peratus kes kanser sebenarnya dapat dicegah.","Oleh itu, masyarakat perlu mengawal berat badan bagi mengelakkan obesiti serta memperbanyak pengambilan sayur dan buah-buahan.","Selain itu, amalan bersenam secara konsisten dan menjauhi tabiat merokok atau alkohol amat kritikal.","Tegasnya, pemeriksaan kesihatan berkala penting kerana kebanyakan kes di negara kita dikesan pada tahap tiga dan empat."],"distractors":["Justeru, sayur-sayuran tidak mengandungi sebarang serat atau vitamin.","Tambahan pula, tidur lewat setiap malam dapat menyembuhkan kanser."],"explanation":"Perenggan ini menggabungkan fakta WHO (30%–50%), amalan pemakanan/senaman dan isu pengesanan lewat tahap 3 dan 4 daripada laporan KKM."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Khasiat Sayur & Data Kanser","voiceCaption":"Padankan lima maklumat kesihatan daripada bahagian akhir Tema 1 dengan fungsi atau perangkaannya.","voiceScript":"[curious] Padankan setiap fakta pemakanan sayur dan statistik kanser K K M ini dengan huraian tepatnya!","prompt":"Padankan fakta kesihatan berikut dengan penerangan atau angkanya:","pairs":[{"id":"bm51u4m1","left":"Kandungan antioksida dalam sayur","right":"Melindungi sel tubuh daripada kerosakan dan pelbagai penyakit"},{"id":"bm51u4m2","left":"Kandungan air dalam sayur","right":"Membantu melembapkan serta menyihatkan kulit secara semula jadi"},{"id":"bm51u4m3","left":"Kanser Payudara (34.1% wanita)","right":"Kanser paling kerap berlaku dalam kalangan perempuan di Malaysia"},{"id":"bm51u4m4","left":"Kanser Kolorektal (16.9% lelaki)","right":"Antara kanser utama lelaki yang berkait rapat dengan diet rendah serat"}],"explanation":"Diet tinggi serat daripada sayur membantu kesihatan usus sekali gus mengurangkan risiko kanser kolorektal."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Analisis Trend Pengesanan Lewat KKM","voiceCaption":"Pilih tafsiran tepat berdasarkan peningkatan kes kanser tahap tiga dan empat daripada 58.7% kepada 63.7%.","voiceScript":"[confident] Berdasarkan laporan Pendaftar Kanser Kebangsaan yang meningkat daripada lima puluh lapan perpuluhan tujuh peratus kepada enam puluh tiga perpuluhan tujuh peratus kes tahap lewat, apakah kesimpulan paling rasional?","prompt":"Apakah tafsiran paling tepat terhadap peningkatan kes kanser lewat dikesan (tahap 3 dan 4) daripada 58.7% kepada 63.7%?","options":["Kesedaran orang ramai untuk menjalani saringan kesihatan awal masih rendah sehingga penyakit hanya dikesan pada peringkat serius","Semua jenis kanser telah berjaya dicegah seratus peratus sebelum tahun 2016","Kanser hanya menyerang golongan kanak-kanak dan remaja sahaja","Sayur-sayuran menyebabkan peningkatan kes kanser tahap empat"],"correctIndex":0,"explanation":"Peningkatan peratusan pengesanan lewat menunjukkan perlunya kempen saringan awal yang lebih agresif dalam masyarakat."}]},{"id":"bm51-u5","title":"Unit 5: Cabaran Boss Tema 1 — Anda Bersih, Anda Sihat","subtitle":"Penilaian Bersepadu KSSM Tema 1 T5: Kata Tunggal & Majmuk, Terapi Seni, Kebersihan Premis & Wacana","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Audit Ejaan Kata Majmuk","voiceCaption":"Pilih ayat yang mengandungi kesemua kata majmuk yang dieja dengan betul.","voiceScript":"[excited] Cabaran Boss Tema satu bermula! Pilih ayat yang bebas daripada sebarang kesalahan ejaan kata majmuk!","prompt":"Pilih ayat yang menggunakan ejaan kata majmuk dengan BETUL:","options":["Kerjasama antara kakitangan kesihatan dengan penduduk bandar raya itu berjaya mengekang wabak influenza","Kerja sama antara kaki tangan kesihatan dengan penduduk bandaraya itu amat membanggakan","Pengendali makanan wajib memakai pelitupmuka dan menerima garis-garis panduan baharu","Ketua Pengarah merakamkan ucapan berterimakasih atas sokongan warga sukarela"],"correctIndex":0,"explanation":"'Kerjasama' dan 'kakitangan' ialah kata majmuk mantap (dieja rapat), manakala 'bandar raya' ialah rangkai kata bebas (dieja terpisah)."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Pengimbuhan Kata Majmuk","voiceCaption":"Ramalkan bentuk ejaan yang betul apabila kata majmuk 'sapu tangan' atau 'ambil alih' menerima imbuhan awalan vs apitan.","voiceScript":"[curious] Ramalkan pasangan kata terbitan daripada kata majmuk 'ambil alih' dan 'campur aduk' yang mematuhi hukum Tatabahasa Dewan!","hook":"Ingat peraturan: awalan/akhiran sahaja kekal TERPISAH; apitan wajib DIRAPATKAN!","scenario":"Calon ingin menulis ayat tentang pengambilalihan pengurusan kebersihan gerai dan pencampuran sisa.","prompt":"Pilih pasangan bentuk imbuhan kata majmuk yang BETUL ejaannya:","options":["mengambil alih (awalan) & pengambilalihan (apitan)","mengambilalih (awalan) & pengambil alihan (apitan)","berterimakasih (awalan) & diterimakasihtanpa jarak","bercampuraduk (awalan) & mencampur adukkan (apitan)"],"correctIndex":0,"explanation":"'mengambil alih' hanya menerima awalan 'meN-' maka terpisah; 'pengambilalihan' menerima apitan 'peN-...-an' maka rapat."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Wacana Kebersihan Premis","voiceCaption":"Susun empat langkah kawalan kebersihan premis makanan mengikut kronologi penyediaan hidangan selamat.","voiceScript":"[confident] Susun langkah penjagaan kebersihan pengendali makanan dari persiapan awal hingga penyajian kepada pelanggan!","prompt":"Susun langkah kebersihan premis makanan berikut mengikut urutan yang logik:","hint":"Mulakan dengan persediaan diri pengendali, penjarakan lokasi sisa, cara mengambil lauk dan penutupan hidangan...","answerTokens":["Pengendali menanggalkan jam tangan dan memakai apron serta penutup kepala bersih","Sisa makanan dibuang ke dalam tong bertutup jauh dari tempat memasak","Lauk diambil menggunakan sudip atau penyepit khas yang bersih","Semua hidangan ditutup dengan penutup lut sinar agar terhindar daripada lalat"],"distractors":["Pengendali merokok di sebelah periuk lauk ketika memasak","Tong sampah diletakkan tanpa penutup di atas meja pelanggan"],"explanation":"Amalan kebersihan berurutan daripada persediaan diri, pengurusan sisa hingga perlindungan hidangan menjamin keselamatan makanan."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Komponen Tema 1 T5","voiceCaption":"Padankan empat bahan utama Tema 1 Tingkatan 5 dengan fokus pembelajarannya.","voiceScript":"[confident] Padankan setiap bahan utama Tema satu dengan kemahiran K S S M yang dipelajari!","prompt":"Padankan bahan Tema 1 berikut dengan fokus pembelajarannya:","pairs":[{"id":"bm51u5m1","left":"Serangan Influenza Terkawal","right":"Aplikasi Kata Tunggal & Kata Majmuk serta nada bacaan berita (SP 5.1.1)"},{"id":"bm51u5m2","left":"Terapi Seni Wan Jamila (Artjamila)","right":"Menjelaskan maksud ayat tentang rawatan emosi melalui lukisan (SP 3.1.1)"},{"id":"bm51u5m3","left":"Menguak Kamar Kenangan & Tuk Nan","right":"Apresiasi aspek menarik sajak serta cerpen bertema kebersihan (SP 4.1.1)"},{"id":"bm51u5m4","left":"Hari Kanser Sedunia & Sayur","right":"Pencegahan 30%-50% risiko kanser melalui diet berserat dan saringan awal"}],"explanation":"Keempat-empat komponen ini memastikan liputan menyeluruh Tema 1 Anda Bersih, Anda Sihat."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Pengenalpastian Kata Tunggal","voiceCaption":"Pilih senarai yang kesemuanya merupakan Kata Tunggal daripada petikan Influenza Tema 1.","voiceScript":"[excited] Soalan penutup Boss Tema satu! Kenal pasti himpunan perkataan yang seratus peratus terdiri daripada Kata Tunggal tanpa sebarang imbuhan atau pemajmukan!","prompt":"Manakah himpunan yang KESEMUANYA Kata Tunggal mengikut senarai Tema 1 KSSM?","options":["wad, sabun, tisu, gejala, influenza, tropika","bandar raya, sapu tangan, kerjasama, kesihatan, melukis","kebersihan, pencemaran, kakitangan, berwaspada, penyakit","pelitup muka, garis panduan, menyembuhkan, cuti sakit"],"correctIndex":0,"explanation":"Semua perkataan dalam pilihan A ialah kata tunggal 1 hingga 4 suku kata tanpa imbuhan atau pemajmukan."}]}]};</script>

  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";
}

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

    document.body.classList.toggle("wf-edition", Boolean(CHAPTER && CHAPTER.enableWebflowEdition));

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
