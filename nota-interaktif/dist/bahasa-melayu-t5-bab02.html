/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

Sukan dan Rekreasi! Dalam bahagian Lentikan Emas, kita mengenali istilah khusus sukan gimrama yang menggabungkan tarian dan akrobatik dengan peralatan seperti belantan, reben, gelung, bola dan tali bagi S P satu perpuluhan satu perpuluhan satu. Seterusnya dalam Cabaran Petanque dan Bola yang Meleret, S P dua perpuluhan dua perpuluhan satu mengajak kita membaca untuk membandingkan persamaan serta perbezaan sukan petanque yang menggunakan bola besi di atas gelanggang berbatu kerikil atau berpasir, berbanding boling padang yang menggunakan bola tidak sfera sempurna berbias di atas padang rumput rata atau karpet!","title":"1.1.1 & 2.2.1 Gimrama & Banding Beza Petanque vs Boling Padang","acronym":"PET•BOL","hook":"Lihat jadual banding beza terperinci antara sukan Petanque dengan Boling Padang dalam makmal!","mediaKey":"bm52_petanque_sukan","summary":"Kemahiran membanding beza teks sukan mengenal pasti persamaan (sasaran mendekati bola sasaran/jack) dan perbezaan (bahan bola, permukaan gelanggang dan teknik balingan).","bullets":["Sukan Gimrama (Lentikan Emas, SP 1.1.1): Sukan estetik berirama yang membezakan fungsi perkataan dan istilah khusus pergerakan serta peralatan (gelung, bola, belantan, reben, tali).","Petanque vs Boling Padang (SP 2.2.1): Petanque menggunakan bola logam (boule) yang dilontar atau dileretkan atas gelanggang tanah/berpasir/berkerikil ke arah cochonnet (jack).","Boling Padang (Bola yang Meleret): Menggunakan bola kayu/komposit bertitik berat tidak seimbang (bias melengkung) yang digulingkan atas padang rumput khas atau karpet tiruan."],"labId":"bm52_justifikasi_klasik_lab","labTitle":"Jadual Banding Beza & Justifikasi Sukan (SP 2.2.1 & 3.2.1)","labProps":{"mode":"banding"},"examTip":"Dalam soalan membanding beza SP 2.2.1, wajib sertakan kata hubung pertentangan seperti 'manakala', 'berbeza daripada' dan 'sebaliknya' supaya perbandingan jelas berpasangan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Ciri Petanque vs Boling Padang","voiceCaption":"Asingkan enam fakta berikut mengikut sukan Petanque atau sukan Boling Padang.","voiceScript":"[curious] Uji pemerhatian kamu terhadap bahan sukan! Asingkan keenam-enam ciri gelanggang dan alatan ini kepada Petanque atau Boling Padang.","prompt":"Kelaskan ciri pertandingan dan alatan berikut ke sukan yang tepat:","buckets":[{"id":"petanque","label":"Sukan Petanque"},{"id":"boling","label":"Sukan Boling Padang"}],"items":[{"text":"Menggunakan bola besi (boule) dan bola sasaran kecil (jack/cochonnet)","bucketId":"petanque","note":"Betul! Boule diperbuat daripada keluli tahan karat atau aloi logam."},{"text":"Bola mempunyai bias (berat sebelah) agar dapat meluncur melengkung","bucketId":"boling","note":"Tepat! Bentuk tidak sfera sempurna menghasilkan lencongan unik."},{"text":"Dimainkan di gelanggang bertanah, berpasir, berbatu kerikil atau berumput biasa","bucketId":"petanque","note":"Betul! Permukaan terbuka yang fleksibel."},{"text":"Dimainkan di padang rumput rata terpelihara atau permukaan berkarpet khas","bucketId":"boling","note":"Tepat! Memerlukan permukaan licin dan rata yang dinamakan green."},{"text":"Pemain berdiri di dalam bulatan balingan semasa melontar atau meleret","bucketId":"petanque","note":"Betul! Posisi kaki wajib kekal dalam bulatan undian."},{"text":"Pemain menggulingkan bola dari atas tikar khas menuju jack berwarna putih/kuning","bucketId":"boling","note":"Tepat! Teknik gulingan rendah atas green."}],"explanation":"Walaupun kedua-duanya sukan sasaran tanpa sentuhan, bahan bola, bentuk gelanggang dan teknik gulingannya berbeza."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Istilah Sukan Gimrama & Petanque","voiceCaption":"Padankan empat istilah khusus daripada Unit 1 dengan maksud atau peranannya dalam sukan.","voiceScript":"[confident] Padankan istilah sukan daripada Tema dua ini dengan penerangannya yang tepat!","prompt":"Padankan istilah sukan berikut dengan maksudnya:","pairs":[{"id":"bm52u1m1","left":"Gimrama (Lentikan Emas)","right":"Sukan gabungan tari, muzik dan keanjalan dengan alatan seperti reben"},{"id":"bm52u1m2","left":"Gelanggang Petanque","right":"Kawasan bertanda di permukaan berpasir atau kerikil berukuran standard"},{"id":"bm52u1m3","left":"Persamaan Petanque & Boling Padang","right":"Menghimpunkan bola pemain sedekat mungkin ke bola sasaran (jack)"},{"id":"bm52u1m4","left":"Acara Perseorangan & Berpasangan","right":"Format pertandingan individu (single) atau berpasukan (double/triple)"}],"explanation":"Menjelaskan perbezaan fungsi istilah sukan memenuhi kemahiran lisan SP 1.1.1 dan pemahaman SP 2.2.1."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Analisis Persamaan Sukan Sasaran","voiceCaption":"Pilih pernyataan tepat tentang persamaan antara petanque dengan boling padang.","voiceScript":"[confident] Apakah persamaan paling utama yang menghubungkan sukan petanque dan sukan boling padang?","prompt":"Manakah PERSAMAAN utama antara sukan petanque dengan boling padang?","options":["Kedua-duanya ialah sukan ketepatan yang menguji strategi mendekatkan bola ke sasaran (jack) dan boleh dipertandingkan secara individu atau berpasukan","Kedua-duanya menggunakan kayu pemukul hoki untuk memukul bola plastik","Kedua-duanya dimainkan di dalam kolam renang olimpik","Kedua-duanya hanya menggunakan bola besi seberat lima kilogram"],"correctIndex":0,"explanation":"Kedua-duanya menguji ketepatan, fokus dan pengiraan jarak mendekati bola sasaran (jack)."}]},{"id":"bm52-u2","title":"Unit 2: Kata Terbitan dalam Laras Sukan (SP 5.1.2)","subtitle":"SP 5.1.2 — Analisis Imbuhan Awalan, Akhiran, Apitan & Sisipan daripada Bahan Petanque","iconType":"formula","iconUrl":"../assets/icons/bm52-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Jenis Kata Terbitan SP 5.1.2","voiceCaption":"Kata terbitan terbentuk melalui proses pengimbuhan awalan, akhiran, apitan dan sisipan yang mengubah makna serta golongan kata dasar dalam konteks sukan.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam bahagian jawapan buku teks Tema dua halaman lapan belas hingga sembilan belas, terdapat puluhan contoh kata terbitan daripada petikan petanque: kata berawalan seperti jurulatih, pemain, pengukur, melontar, berumput, dan diperbuat; kata berakhiran seperti undian, bulatan, lontaran, leretan dan lantunan; serta kata berapitan seperti pertandingan, dipertandingkan, menggunakan, kecergasan dan pergerakan! Ingat juga jenis keempat iaitu sisipan e l, e r, e m, i n seperti geligi, serabut, gemilang dan sinambung! Terokai pembahagian keempat-empat imbuhan tersebut dalam makmal kata terbitan di bawah!","title":"5.1.2 Kata Terbitan: Awalan, Akhiran, Apitan & Sisipan","acronym":"AW•AK•AP•SIS","hook":"Klik tab AWALAN, AKHIRAN, APITAN dan SISIPAN dalam makmal untuk membedah kata dasar sukan!","summary":"Kata terbitan mengikut Tatabahasa Dewan merangkumi awalan (di depan), akhiran (di belakang), apitan (serentak depan dan belakang) dan sisipan (di celah konsonan pertama).","bullets":["Kata Berawalan Tema 2: jurulatih (juru-), pemain/pengukur (peN-), diundang/dibina/dikelilingi? (AWAS: 'dikelilingi' ialah APITAN di-...-i, bukan awalan!), melontar/melakar (meN-), berpasir/berkarpet (ber-), diperbuat (diper-).","Kata Berakhiran Tema 2: undian (undi + -an), bulatan (bulat + -an), lontaran, leretan, balingan, lantunan.","Kata Berapitan Tema 2: pertandingan (per-...-an), dipertandingkan (diper-...-kan), menyampaikan (meN-...-kan), diliputi/dihampari/dikelilingi (di-...-i), kecergasan (ke-...-an)."],"labId":"bm52_kata_terbitan_lab","labTitle":"Makmal Morfologi Kata Terbitan Sukan (SP 5.1.2)","labProps":{"kind":"apitan"},"examTip":"Jangan keliru: 'diukur' ialah awalan (di- + ukur), tetapi 'diliputi' dan 'dikelilingi' ialah APITAN (di-...-i + liput / keliling)!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Pengelasan Imbuhan Awalan vs Apitan","voiceCaption":"Ramalkan pengelasan kata terbitan sukan berikut supaya tidak terkeliru antara awalan dengan apitan.","voiceScript":"[curious] Uji ketelitian analisis morfologi kamu! Antara empat pasangan kata berikut, manakah yang kesemuanya kata berapitan?","hook":"Pastikan setiap perkataan ada imbuhan di HADAPAN dan di BELAKANG serentak!","scenario":"Calon diminta mengeluarkan 4 kata berapitan daripada jadual Tema 2 Sukan dan Rekreasi.","prompt":"Pilih kumpulan perkataan yang KESEMUANYA terdiri daripada Kata Terbitan Berapitan:","options":["dipertandingkan, kecergasan, diliputi, pergerakan","lontaran, bulatan, pemain, dibina","jurulatih, melontar, undian, dihampari","berumput, diperbuat, leretan, seorang"],"correctIndex":0,"proofLabId":"bm52_kata_terbitan_lab","proofState":{"kind":"apitan"},"explanation":"'diper-...-kan' (tanding), 'ke-...-an' (cergas), 'di-...-i' (liput) dan 'per-...-an' (gerak) kesemuanya mempunyai awalan dan akhiran serentak."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Jenis Imbuhan & Contoh Tema 2","voiceCaption":"Padankan jenis imbuhan dengan perkataan sukan serta kata dasarnya yang tepat.","voiceScript":"[confident] Padankan kesemua lima kata terbitan ini dengan jenis imbuhan dan kata dasarnya yang betul!","prompt":"Padankan kata terbitan berikut dengan jenis imbuhan dan kata dasarnya:","pairs":[{"id":"bm52u2m1","left":"jurulatih (juru- + latih)","right":"Awalan Kata Nama (gelaran pakar/pelatih)"},{"id":"bm52u2m2","left":"leretan (leret + -an)","right":"Akhiran Kata Nama (hasil perbuatan)"},{"id":"bm52u2m3","left":"dihampari (di-...-i + hampar)","right":"Apitan Kata Kerja Pasif (merujuk tempat)"},{"id":"bm52u2m4","left":"diperbuat (diper- + buat)","right":"Awalan Rangkap Kata Kerja Pasif"},{"id":"bm52u2m5","left":"gemuruh (guruh + -em-)","right":"Sisipan Kata Adjektif (sorakan penyokong)"}],"explanation":"'diperbuat' ialah awalan rangkap 'diper-' tanpa akhiran, manakala 'dihampari' mempunyai apitan 'di-...-i'."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ketepatan Ayat Berimbuhan Sukan","voiceCaption":"Pilih ayat sukan yang menggunakan kata terbitan secara gramatis.","voiceScript":"[confident] Pilih ayat yang menggunakan imbuhan kata terbitan dengan tepat tanpa kesalahan hukum meN- atau memper-!","prompt":"Pilih ayat sukan yang menggunakan kata terbitan dengan BETUL:","options":["Jurulatih itu menasihati pemain supaya meningkatkan ketepatan lontaran dalam bulatan undian","Jurulatih itu menasihatkan pemain supaya mempertingkatkan mutu lontaran","Gelanggang baharu yang berkeluasan luas itu diperbesarkan oleh pekerja kontrak","Pemain petanque memeroses strategi baharu sebelum perlawanan bermula"],"correctIndex":0,"explanation":"'menasihati' menerima objek bernyawa ('pemain'); 'mempertingkatkan' dan 'diperbesarkan' lewah dengan '-kan' bagi adjektif; 'memeroses' salah gugus konsonan (sepatutnya memproses)."}]},{"id":"bm52-u3","title":"Unit 3: Rampanau, Terompah Tempurung & Permainan Dam","subtitle":"SP 3.2.1 & 4.1.1 — Justifikasi Permainan Tradisional serta Apresiasi Prosa Tradisional 'Pertarungan Minda'","iconType":"scale","iconUrl":"../assets/icons/bm52-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Permainan Tradisional & Prosa Klasik","voiceCaption":"Permainan tradisional seperti rampanau dan terompah tempurung wajar dimartabatkan dengan justifikasi rasional, manakala prosa klasik riadah istana ditukarkan ke bahasa Melayu baku.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam Tema dua, kita diperkenalkan kepada permainan tradisional Rampanau di Sabah yang menggunakan galah buluh berkaki dan cara membina Terompah Tempurung menggunakan tempurung kelapa, kayu kecil satu setengah inci serta tali dua meter! Di bawah S P tiga perpuluhan dua perpuluhan satu, pelajar perlu menulis JUSTIFIKASI mengapa permainan tradisional wajar dimartabatkan dengan bukti yang kukuh. Sementara itu, bahagian Dari Petak ke Petak memaparkan prosa klasik Pertarungan Minda dan Riadah Orang Istana mengenai permainan dam atau catur istana untuk ditukarkan kepada bahasa Melayu baku!","title":"3.2.1 Justifikasi Permainan Tradisional & 4.1.1 Riadah Orang Istana","acronym":"JUST•BAKU","hook":"Lihat struktur membina ayat justifikasi mantap dalam makmal dan fahami langkah menukar prosa klasik dam istana!","mediaKey":"bm52_permainan_tradisional","summary":"Justifikasi memerlukan pendirian tegas disokong alasan logik (kesihatan, kos rendah, interaksi sosial), manakala prosa tradisional menonjolkan kebijaksanaan dan riadah berstrategi.","bullets":["Rampanau & Terompah Tempurung (SP 3.2.1): Permainan fizikal warisan menggunakan bahan semula jadi (buluh/tempurung kelapa) yang melatih imbangan badan, koordinasi otot dan semangat berpasukan.","Menulis Justifikasi (SP 3.2.1): Nyatakan pendirian ('wajar dimartabatkan'), diikuti kata hubung sebab ('kerana', 'disebabkan') dan hujah kesan positif kepada fizikal serta budaya murid.","Prosa Tradisional 'Riadah Orang Istana' (SP 4.1.1): Permainan berpetak seperti dam atau catur melatih ketajaman akal dan strategi; semasa menukarkan ke bahasa Melayu baku, kekalkan dialog dan maksud asal serta ganti kata klasik."],"labId":"bm52_justifikasi_klasik_lab","labTitle":"Pembina Justifikasi Sukan Tradisional (SP 3.2.1)","labProps":{"mode":"justifikasi"},"examTip":"Soalan justifikasi Kertas 2 tidak akan mendapat markah penuh jika pelajar sekadar menulis 'kerana seronok' — sertakan impak kesihatan, ekonomi mesra alam atau perpaduan."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Bina Ayat Justifikasi Warisan Sukan","voiceCaption":"Susun segmen ayat untuk menghasilkan justifikasi lengkap tentang kepentingan memartabatkan terompah tempurung dan rampanau.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk satu perenggan justifikasi S P tiga perpuluhan dua perpuluhan satu yang mantap!","prompt":"Susun ayat justifikasi berikut mengikut urutan pendirian, hujah bukti dan kesan:","hint":"Mulakan dengan pendirian utama, diikuti alasan kos dan fizikal, serta kesan warisan budaya...","answerTokens":["Permainan tradisional seperti rampanau dan terompah tempurung wajar dimartabatkan dalam aktiviti kokurikulum.","Hal ini demikian kerana peralatan tersebut hanya menggunakan bahan semula jadi tempatan seperti buluh dan tempurung kelapa yang menjimatkan kos.","Selain melatih keseimbangan badan serta kekuatan otot murid, permainan ini turut mengeratkan kerjasama berpasukan.","Jelaslah bahawa pemeliharaan sukan warisan mampu mengurangkan ketagihan gajet dalam kalangan remaja."],"distractors":["Oleh itu, semua gelanggang moden perlu dirobohkan serta-merta.","Tambahan pula, tempurung kelapa tidak boleh ditebuk dengan sebarang alat."],"explanation":"Urutan pendirian -> justifikasi bahan mesra alam -> manfaat fizikal/sosial -> penegas membina hujah yang meyakinkan."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Bahan Terompah & Unsur Prosa","voiceCaption":"Padankan komponen pembuatan terompah tempurung dan aspek riadah istana dengan fungsinya.","voiceScript":"[curious] Padankan bahan permainan tradisional dan istilah prosa klasik ini dengan keterangan tepatnya!","prompt":"Padankan bahan permainan dan konsep berikut dengan peranannya:","pairs":[{"id":"bm52u3m1","left":"Tempurung kelapa bersih","right":"Tapak pijakan kaki kanan dan kiri pemain"},{"id":"bm52u3m2","left":"Tali berukuran 2 meter","right":"Ditalikan mengikut ketinggian pemain sebagai pemegang"},{"id":"bm52u3m3","left":"Kayu kecil 1.5 inci","right":"Penahan simpulan tali di bahagian dalam tempurung agar tidak tercabut"},{"id":"bm52u3m4","left":"Riadah Orang Istana (Dam)","right":"Permainan berpetak yang menguji kebijaksanaan taktikal dan kesabaran"}],"explanation":"Langkah penghasilan terompah tempurung yang jelas dalam buku teks melatih pemahaman teks prosedur."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Syarat Tukar Prosa Klasik ke Baku","voiceCaption":"Pilih peraturan tepat semasa menukar petikan prosa tradisional 'Pertarungan Minda' kepada bahasa Melayu baku.","voiceScript":"[confident] Apabila menukarkan prosa tradisional riadah istana kepada bahasa Melayu baku mengikut S P empat perpuluhan satu perpuluhan satu, apakah syarat utama yang wajib dipatuhi?","prompt":"Apakah peraturan UTAMA semasa menukar petikan prosa tradisional ke bahasa Melayu baku?","options":["Mengekalkan bentuk asal peristiwa, watak dan dialog sambil menggantikan kata klasik serta struktur ayat songsang kepada ayat moden gramatis","Meringkaskan seluruh petikan menjadi satu ayat pendek dan membuang semua dialog","Menambah watak baharu yang tiada dalam petikan asal untuk memanjangkan cerita","Mengubah pengakhiran cerita supaya berbeza daripada teks klasik"],"correctIndex":0,"explanation":"Penukaran ke bahasa Melayu standard/baku tidak boleh meringkaskan atau mengubah jalan cerita serta dialog asal."}]},{"id":"bm52-u4","title":"Unit 4: Rekreasi Mencandat Sotong & Pelbagai Jenis Ayat","subtitle":"SP 1.2.1 & 3.3.1 — Merancang Aktiviti Mencandat Sotong di Pantai Timur & Memberi Respons Pelbagai Jenis Ayat","iconType":"crown","iconUrl":"../assets/icons/bm52-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Mencandat Sotong & Respons Ayat","voiceCaption":"Aktiviti mencandat sotong memerlukan perancangan rapi termasuk musim sesuai, candat, lampu dan jaket keselamatan, sambil melatih kemahiran memberi respons dalam pelbagai jenis ayat.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian akhir Tema dua Sukan dan Rekreasi membawakan rekreasi maritim ikonik Malaysia iaitu Mencandat Sotong! Untuk merancang aktiviti mencandat sotong dengan selamat dan melengkapkan maklumat di bawah S P tiga perpuluhan tiga perpuluhan satu, peserta perlu mengetahui musim puncak sekitar Mac hingga Ogos di perairan Terengganu atau Pantai Timur, menyediakan mata candat, lampu pemikat sotong, jaket keselamatan serta ubat mabuk laut! Di samping itu, S P satu perpuluhan dua perpuluhan satu menguji keupayaan kita memberi respons menggunakan empat ragam ayat iaitu ayat penyata, ayat tanya, ayat perintah dan ayat seruan tanpa mengubah maksud konteks!","title":"1.2.1 & 3.3.1 Rekreasi Mencandat Sotong & Respons Pelbagai Ayat","acronym":"4•AYAT•LAUT","hook":"Kuasai logistik mencandat sotong dan bezakan respons dalam ayat penyata, tanya, perintah serta seruan!","summary":"Rekreasi mencandat sotong memajukan ekopelancongan komuniti nelayan; tindak balas komunikasi berkesan memanfaatkan keempat-empat jenis ayat mengikut situasi.","bullets":["Logistik Mencandat Sotong (SP 3.3.1): Pilih musim laut tenang (sekitar April–Ogos di Pantai Timur), guna candat berwarna terang/berlampu, jaket keselamatan wajib, tali tangsi dan bekalan air serta ubat mabuk laut.","Empat Jenis Ayat Komunikasi (SP 1.2.1): (1) Ayat Penyata — memberi keterangan fakta; (2) Ayat Tanya — mendapatkan maklumat/kepastian; (3) Ayat Perintah (suruhan, larangan, silaan, permintaan) — panduan keselamatan; (4) Ayat Seruan — meluahkan rasa teruja.","Nilai Eko-Rekreasi: Menambah pendapatan sampingan nelayan tempatan sambil memupuk kerjasama keluarga dan rakan."],"examTip":"Semasa menukar jenis ayat dalam soalan sintaksis atau respons lisan (contoh: ayat penyata kepada ayat perintah), elakkan mengubah maksud teras mesej."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Jenis Ayat Rekreasi Mencandat","voiceCaption":"Kelaskan ayat mengenai aktiviti mencandat sotong berikut kepada Ayat Penyata, Ayat Tanya atau Ayat Perintah/Seruan.","voiceScript":"[curious] Asingkan keenam-enam ayat rekreasi laut ini mengikut jenis ayatnya yang tepat!","prompt":"Kelaskan ayat komunikasi rekreasi berikut ke kategori jenis ayatnya:","buckets":[{"id":"penyata","label":"Ayat Penyata / Seruan"},{"id":"tanya_perintah","label":"Ayat Tanya / Perintah"}],"items":[{"text":"Aktiviti mencandat sotong lazimnya giat dijalankan antara bulan April hingga Ogos.","bucketId":"penyata","note":"Betul! Ayat penyata yang menerangkan fakta musim."},{"text":"Sila pakai jaket keselamatan sebelum menaiki bot nelayan itu.","bucketId":"tanya_perintah","note":"Tepat! Ayat perintah jenis silaan demi keselamatan."},{"text":"Wah, banyaknya sotong yang berjaya dicandat pada malam ini!","bucketId":"penyata","note":"Betul! Ayat seruan berintonasi keterujaan."},{"text":"Mengapakah lampu terang dihalakan ke permukaan air semasa mencandat?","bucketId":"tanya_perintah","note":"Tepat! Ayat tanya untuk memperoleh sebab teknikal."},{"text":"Cahaya lampu bot menarik kehadiran anak ikan dan sotong ke permukaan laut.","bucketId":"penyata","note":"Betul! Ayat penyata penerangan saintifik."},{"text":"Jangan berdiri di tepi bot ketika ombak beralun kuat.","bucketId":"tanya_perintah","note":"Tepat! Ayat perintah jenis larangan."}],"explanation":"Menguasai empat jenis ayat memastikan komunikasi lisan dan penulisan skrip lebih hidup dan tepat."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Kelengkapan Mencandat Sotong","voiceCaption":"Padankan empat persediaan aktiviti mencandat sotong dengan tujuan atau peranannya.","voiceScript":"[confident] Padankan peralatan dan persediaan mencandat sotong berikut dengan fungsinya yang betul!","prompt":"Padankan peralatan mencandat sotong berikut dengan kegunaannya:","pairs":[{"id":"bm52u4m1","left":"Lampu pemancar bot","right":"Memikat plankton dan sotong berkumpul berhampiran bot pada waktu malam"},{"id":"bm52u4m2","left":"Mata candat (jig)","right":"Umpan berjaring mata kail tanpa umpan hidup yang digerakkan menegak"},{"id":"bm52u4m3","left":"Jaket keselamatan","right":"Langkah keselamatan wajib sepanjang berada di atas bot di laut"},{"id":"bm52u4m4","left":"Laporan ramalan cuaca & angin","right":"Menjamin pelayaran selamat semasa musim laut tenang Pantai Timur"}],"explanation":"Setiap langkah perancangan (SP 3.3.1) mengutamakan keselamatan maritim dan kelancaran aktiviti."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Respons Ayat Tanpa Ubah Maksud","voiceCaption":"Pilih ayat tanya yang betul sebagai respons kepada pernyataan 'Semua peserta wajib memakai jaket keselamatan sebelum bot bertolak' tanpa mengubah maksud.","voiceScript":"[confident] Mengikut S P satu perpuluhan dua perpuluhan satu, pilih ayat tanya atau perintah paling tepat yang mengekalkan maksud larangan berada di bot tanpa jaket keselamatan!","prompt":"Pilih ayat perintah larangan yang MENGEKALKAN maksud 'Semua peserta wajib memakai jaket keselamatan sebelum bot bertolak':","options":["Jangan naik ke atas bot sebelum anda memakai jaket keselamatan dengan kemas.","Sila tanggalkan jaket keselamatan apabila bot sudah memulakan pelayaran.","Bolehkah peserta berenang ke tengah laut tanpa pengawasan tekong?","Wah, jaket keselamatan berwarna jingga ini sangat selesa dipakai!"],"correctIndex":0,"explanation":"Ayat perintah larangan 'Jangan naik sebelum memakai jaket' mengekalkan syarat keselamatan yang sama tepat dengan pernyataan asal."}]},{"id":"bm52-u5","title":"Unit 5: Cabaran Boss Tema 2 — Sukan dan Rekreasi","subtitle":"Penilaian Bersepadu KSSM Tema 2 T5: Kata Terbitan, Banding Beza Petanque, Justifikasi Tradisional & Prosa Klasik","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Pengelasan Kata Terbitan","voiceCaption":"Pilih pernyataan morfologi yang tepat mengenai kata terbitan daripada petikan sukan petanque.","voiceScript":"[excited] Cabaran Boss Tema dua bermula! Kenal pasti analisis kata terbitan yang seratus peratus betul bagi perkataan sukan Tema dua!","prompt":"Manakah analisis Kata Terbitan (SP 5.1.2) yang TEPAT?","options":["'dipertandingkan' = apitan (diper-...-kan); 'lontaran' = akhiran (-an); 'jurulatih' = awalan (juru-)","'diliputi' = awalan (di-); 'berpasangan' = akhiran (-an); 'pemain' = apitan","'bulatan' = sisipan (-ul-); 'kecergasan' = awalan (ke-); 'dibina' = apitan","'melontar' = akhiran (-ar); 'pertandingan' = awalan (per-); 'undian' = sisipan"],"correctIndex":0,"explanation":"'dipertandingkan' (diper-...-kan), 'lontaran' (lontar + -an), dan 'jurulatih' (juru- + latih) menepati binaan morfologi Tatabahasa Dewan."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Pembetulan Kesalahan Imbuhan","voiceCaption":"Ramalkan ayat yang membetulkan kesemua kesalahan kata terbitan sukan secara tepat.","voiceScript":"[curious] Ramalkan ayat yang berjaya membetulkan penggunaan imbuhan awalan dan apitan sukan dengan sempurna!","hook":"Periksa hukum imbuhan -kan vs -i dan memper- pada kata adjektif!","scenario":"Ayat asal mengandungi ralat: 'Pihak majlis memperluaskan padang boling dan mengurniakan pemain medal.'","prompt":"Pilih pembetulan ayat yang paling GRAMATIS:","options":["Pihak majlis memperluas padang boling dan mengurniai pemain pingat emas","Pihak majlis memperluaskan padang boling dan mengurniai pingat kepada pemain","Pihak majlis meluaskan lagi padang boling dan mengurniakan pemain pingat emas","Pihak majlis terluaskan padang boling dan berkurniakan pemain pingat"],"correctIndex":0,"explanation":"Adjektif 'luas' hanya menerima 'memper-' tanpa '-kan' (memperluas), dan penerima bernyawa ('pemain') menerima akhiran '-i' (mengurniai)."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Tukaran Prosa Riadah Istana","voiceCaption":"Susun segmen ayat untuk menukar ayat klasik permainan istana kepada bahasa Melayu baku yang gramatis.","voiceScript":"[confident] Susun segmen ini untuk menukarkan ayat klasik 'Maka baginda pun gemar bermain catur bersama-sama segala menteri di balairung seri' kepada bahasa Melayu baku!","prompt":"Susun ayat bahasa Melayu baku bagi ayat klasik permainan istana tersebut:","hint":"Gugurkan kata pangkal 'Maka' dan 'pun', serta tukar 'segala menteri' kepada 'para menteri'...","answerTokens":["Baginda raja sangat gemar","bermain catur bersama-sama","para menteri","di balai penghadapan istana."],"distractors":["Maka baginda tidur di padang rumput","selepas membuang papan catur."],"explanation":"'Maka ... pun' digugurkan dan 'segala menteri' diperkemas kepada 'para menteri' tanpa mengubah maksud asal."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Komponen Tema 2 T5","voiceCaption":"Padankan empat subtopik sukan dan rekreasi Tema 2 dengan fokus kemahirannya.","voiceScript":"[confident] Padankan kesemua empat subtopik Tema dua ini dengan penerangannya!","prompt":"Padankan subtopik Tema 2 berikut dengan kandungan pembelajarannya:","pairs":[{"id":"bm52u5m1","left":"Lentikan Emas (Gimrama)","right":"Istilah dan ungkapan khusus sukan berirama serta alatan (SP 1.1.1)"},{"id":"bm52u5m2","left":"Petanque vs Boling Padang","right":"Banding beza bola logam/kayu serta kata terbitan (SP 2.2.1 & 5.1.2)"},{"id":"bm52u5m3","left":"Rampanau & Terompah Tempurung","right":"Penulisan justifikasi memartabatkan permainan warisan (SP 3.2.1)"},{"id":"bm52u5m4","left":"Mencandat Sotong","right":"Perancangan keselamatan rekreasi laut & respons 4 jenis ayat (SP 1.2.1)"}],"explanation":"Keempat-empat komponen ini merangkumi keseluruhan Tema 2 Sukan dan Rekreasi."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Perbandingan Lengkap Sukan","voiceCaption":"Pilih pernyataan yang merangkumi banding beza tepat antara sukan petanque, boling padang dan terompah tempurung.","voiceScript":"[excited] Soalan penutup Boss Tema dua! Pilih pernyataan paling tepat merumuskan perbezaan jenis sukan dan nilai rekreasi dalam Tema dua!","prompt":"Manakah rumusan yang paling TEPAT mengenai sukan dan permainan dalam Tema 2?","options":["Petanque dan boling padang ialah sukan ketepatan berstruktur moden, manakala rampanau dan terompah tempurung ialah warisan tradisional yang wajar dimartabatkan demi kecergasan serta perpaduan","Rampanau dimainkan menggunakan bola besi di atas gelanggang karpet tiruan","Boling padang mewajibkan peserta memakai terompah tempurung dan mencandat sotong","Gimrama hanya mempertandingkan acara gulingan bola kayu atas padang rumput"],"correctIndex":0,"explanation":"Rumusan ini tepat membezakan sukan sasaran moden daripada permainan tradisional warisan sambil mengekalkan nilai kecergasan."}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
