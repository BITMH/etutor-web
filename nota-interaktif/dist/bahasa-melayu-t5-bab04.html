/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t5-bab04","subject":"Bahasa Melayu","subjectGroup":"teras","form":5,"chapterNumber":4,"title":"Bersatu Teguh","subtitle":"Tema 4 BM T5 KSSM — RIMUP & Ziarah Komuniti (SP 1.4.1), Sentuhan Diplomasi Wisma Putra (SP 2.3.3), Golongan Kata (SP 5.2.1), Perenggan Isi Kritis (SP 3.4.2) serta Bahasa Berbudaya & Perbandingan Semacam (SP 4.2.1).","estimatedMinutes":25,"themeAccent":"#dc2626","isFreePreview":false,"labScript":"bahasa-melayu-t5-bab04-labs.js","coverIcon":"../assets/icons/bm54-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Semangat perpaduan dan penguasaan golongan kata kamu sungguh cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Bahasa berbudaya dan inferens teks kamu kuasai dengan baik!","encourage":"[softly] Hampir tepat... semak semula empat golongan kata utama atau maksud kiasan perpaduan!","celebrate":"[excited] Tahniah! Tema keempat Bersatu Teguh Bahasa Melayu Tingkatan lima berjaya kamu kuasai!"},"units":[{"id":"bm54-u1","title":"Unit 1: Bulat Air kerana Pembetung (RIMUP & Mesyuarat)","subtitle":"SP 1.4.1 — Idea Baharu Program RIMUP, Ziarah Komuniti & Agenda Mesyuarat Kelab Rukun Negara","iconType":"book","iconUrl":"../assets/icons/bm54-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Program RIMUP & Mesyuarat Rukun Negara","voiceCaption":"Rancangan Integrasi Murid untuk Perpaduan atau RIMUP memperkukuh muafakat pelbagai kaum melalui ziarah komuniti, pertunjukan kebudayaan dan mesyuarat beragenda.","voiceScript":"[warm] Selamat datang ke Tema empat Bahasa Melayu Tingkatan lima, Bersatu Teguh! Dalam Unit satu, kita mendalami peribahasa Bulat air kerana pembetung, bulat manusia kerana muafakat melalui Rancangan Integrasi Murid untuk Perpaduan atau R I M U P! Murid pelbagai kaum berkolaborasi menganjurkan Ziarah Komuniti dan Pertunjukan Kebudayaan serta mempraktikkan simulasi Mesyuarat Kelab Rukun Negara yang merangkumi empat agenda piawai: ucapan alu-aluan pengerusi, pembentangan dan pengesahan minit mesyuarat, perkara berbangkit, serta perancangan pelaksanaan program secara bertatasusila untuk S P satu perpuluhan empat perpuluhan satu!","title":"1.4.1 Program RIMUP, Ziarah Komuniti & Etika Mesyuarat","acronym":"RIMUP•4A","hook":"Fahami peranan RIMUP serta empat agenda teras dalam simulasi mesyuarat Kelab Rukun Negara!","mediaKey":"bm54_perpaduan_rimup","summary":"Program RIMUP merentas sekolah memupuk persefahaman antara murid berbilang kaum menerusi kerjasama sukan, kebudayaan, khidmat masyarakat dan pengurusan mesyuarat tertib.","bullets":["Rancangan Integrasi Murid untuk Perpaduan (RIMUP): Menggabungkan murid pelbagai aliran dan latar budaya dalam aktiviti Ziarah Komuniti, sukaneka muhibah serta Pertunjukan Kebudayaan.","4 Agenda Mesyuarat Rasmi: (1) Ucapan alu-aluan pengerusi, (2) Pembentangan dan pengesahan minit mesyuarat terdahulu, (3) Perkara berbangkit, (4) Perbincangan program RIMUP / hal-hal lain.","Maklum Balas Idea Baharu (SP 1.4.1): Gunakan ungkapan santun seperti 'Pada pendapat saya...', 'Saya mencadangkan...' dan elakkan memotong percakapan ahli mesyuarat."],"examTip":"Apabila diminta mengemukakan idea baharu bagi aktiviti perpaduan dalam Kertas 3 (Bertutur), kaitkan cadangan dengan impak langsung kepada hubungan antara kaum serta kelestarian jangka panjang."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Susun Agenda Mesyuarat Kelab Rukun Negara","voiceCaption":"Susun empat agenda mesyuarat Kelab Rukun Negara mengikut tertib mesyuarat rasmi dalam buku teks.","voiceScript":"[confident] Susun keempat-empat agenda mesyuarat Kelab Rukun Negara mengikut urutan rasmi yang tercatat dalam buku teks Tema empat!","prompt":"Susun agenda mesyuarat Kelab Rukun Negara berikut mengikut tertib yang betul:","hint":"Mulakan dengan ucapan pengerusi, pengesahan minit, perkara berbangkit dan pelaksanaan program...","answerTokens":["1. Ucapan alu-aluan pengerusi mesyuarat","2. Pembentangan dan pengesahan minit mesyuarat","3. Perkara berbangkit daripada mesyuarat lalu","4. Perancangan pelaksanaan program RIMUP"],"distractors":["Pembubaran kelab sebelum membaca minit","Pengiraan markah peperiksaan akhir tahun"],"explanation":"Tertib agenda rasmi memastikan mesyuarat berjalan lancar, berfokus dan dapat direkodkan dalam minit dengan teratur."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Aktiviti RIMUP & Impak Perpaduan","voiceCaption":"Padankan empat komponen aktiviti perpaduan Tema 4 dengan manfaat utamanya kepada masyarakat majmuk.","voiceScript":"[curious] Padankan aktiviti perpaduan daripada Tema empat ini dengan impak sosialnya yang tepat!","prompt":"Padankan aktiviti perpaduan berikut dengan kesannya:","pairs":[{"id":"bm54u1m1","left":"Ziarah Komuniti RIMUP","right":"Menyantuni warga emas dan keluarga kurang bernasib baik merentas kaum"},{"id":"bm54u1m2","left":"Pertunjukan Kebudayaan","right":"Memperkenalkan tarian, pakaian serta muzik warisan pelbagai etnik"},{"id":"bm54u1m3","left":"Simulasi Mesyuarat Rukun Negara","right":"Melatih murid menyumbang idea baharu secara demokratik dan sopan"},{"id":"bm54u1m4","left":"Sukaneka Muhibah antara Sekolah","right":"Mengeratkan ukhuwah antara murid sekolah kebangsaan dengan jenis kebangsaan"}],"explanation":"Aktiviti bersemuka dan kolaborasi pelbagai kaum membina toleransi yang tulus sejak di bangku sekolah."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Tatasusila Memberi Maklum Balas Mesyuarat","voiceCaption":"Pilih cara paling tepat dan bertatasusila untuk mengemukakan idea baharu dalam mesyuarat RIMUP.","voiceScript":"[confident] Mengikut S P satu perpuluhan empat perpuluhan satu, bagaimanakah cara memberi maklum balas berbentuk idea baharu dalam perbualan atau mesyuarat secara bertatasusila?","prompt":"Manakah contoh penyampaian idea baharu dalam mesyuarat yang paling BERTATASUSILA?","options":["'Terima kasih saudari pengerusi. Saya ingin mencadangkan agar program RIMUP kali ini melibatkan pameran makanan warisan pelbagai kaum.'","'Idea awak tadi langsung tidak masuk akal dan membazirkan masa kami semua!'","'Saya tidak mahu mendengar pendapat orang lain kecuali cadangan saya diterima serta-merta.'","'Biar saya sahaja yang bercakap tanpa perlu mengikut agenda pengerusi.'"],"correctIndex":0,"explanation":"Penghargaan kepada pengerusi diikuti cadangan membina yang jelas melambangkan tatasusila komunikasi tinggi."}]},{"id":"bm54-u2","title":"Unit 2: Sentuhan Diplomasi Negara & Golongan Kata","subtitle":"SP 2.3.3 & 5.2.1 — Peranan Wisma Putra, Teknik Membuat Inferens serta Analisis 4 Golongan Kata","iconType":"formula","iconUrl":"../assets/icons/bm54-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Wisma Putra, Inferens & Golongan Kata","voiceCaption":"Hubungan luar Malaysia berteraskan diplomasi dan penolakan paksaan melalui Wisma Putra, sambil melatih kemahiran membuat inferens serta mengelaskan empat golongan kata.","voiceScript":"[warm] Selamat datang ke Unit dua! Bahagian Sentuhan Diplomasi Negara menelusuri dasar luar Malaysia yang diterajui oleh Wisma Putra dengan prinsip berteraskan perundingan, menghormati kedaulatan negara lain dan menolak sebarang paksaan! Melalui S P dua perpuluhan tiga perpuluhan tiga, kita melatih diri membuat inferens atau kesimpulan logik dengan menggabungkan fakta petikan bersama pengetahuan sedia ada. Dari segi tatabahasa S P lima perpuluhan dua perpuluhan satu pula, kesemua perkataan dalam bahasa Melayu tergolong dalam empat golongan utama: Kata Nama seperti Malaysia dan strategi, Kata Kerja seperti mengamalkan dan menolak, Kata Adjektif seperti teguh dan harmoni, serta Kata Tugas seperti yang, pada, telah dan melalui! Terokai pengelasan teks Tema empat dalam makmal di bawah!","title":"5.2.1 Empat Golongan Kata Utama & 2.3.3 Teknik Membuat Inferens","acronym":"KN•KK•KA•KT","hook":"Buka makmal Golongan Kata untuk menganalisis kosa kata diplomasi Wisma Putra mengikut 4 golongan kata!","mediaKey":"bm54_wisma_putra","summary":"Inferens ialah kesimpulan tersirat berdasarkan bukti teks dan logik; empat golongan kata (Kata Nama, Kata Kerja, Kata Adjektif, Kata Tugas) menjadi asas sintaksis ayat bahasa Melayu.","bullets":["4 Golongan Kata Tema 4 (SP 5.2.1): Kata Nama (Malaysia, strategi, perundingan, paksaan, operasi), Kata Kerja (merupakan, berteraskan, menolak, menghormati, mengamalkan), Kata Adjektif (teguh, komprehensif, aman, harmoni, asing), Kata Tugas (yang, pada, telah, tidak, melalui, untuk).","Prinsip Diplomasi Wisma Putra: Mengutamakan rundingan damai, dasar berkecuali ASEAN (ZOPFAN) dan menolak campur tangan kuasa asing.","Membuat Inferens (SP 2.3.3): Fakta Teks ('Malaysia menolak paksaan dalam hubungan antarabangsa') + Pengetahuan Sedia Ada -> Inferens ('Dasar berkecuali memastikan kestabilan ekonomi dan keselamatan serantau terpelihara')."],"labId":"bm54_golongan_kata_lab","labTitle":"Makmal 4 Golongan Kata Tema 4 (SP 5.2.1)","labProps":{"grp":"nama"},"examTip":"Awas perangkap golongan kata: perkataan 'asing' atau 'luar' dalam konteks 'negara luar' / 'dasar luar' berfungsi sebagai kata adjektif/penerang, manakala 'merupakan' ialah kata kerja!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Kata Nama/Kerja vs Adjektif/Tugas","voiceCaption":"Asingkan enam perkataan daripada petikan Sentuhan Diplomasi Negara mengikut golongan katanya.","voiceScript":"[curious] Uji kecekapan menganalisis golongan kata S P lima perpuluhan dua perpuluhan satu! Asingkan perkataan daripada jadual Tema empat ini.","prompt":"Kelaskan perkataan daripada petikan diplomasi berikut mengikut golongan katanya:","buckets":[{"id":"nk","label":"Kata Nama / Kata Kerja"},{"id":"at","label":"Kata Adjektif / Kata Tugas"}],"items":[{"text":"perundingan / strategi / operasi","bucketId":"nk","note":"Betul! Kata Nama terbitan dan kata nama pinjaman."},{"text":"teguh / aman / komprehensif","bucketId":"at","note":"Tepat! Kata Adjektif yang menerangkan sifat atau keadaan."},{"text":"berteraskan / mengamalkan / menolak","bucketId":"nk","note":"Betul! Kata Kerja terbitan dalam binaan predikat."},{"text":"melalui / pada / telah / untuk","bucketId":"at","note":"Tepat! Kata Tugas (sendi nama dan kata bantu)."},{"text":"paksaan / Malaysia","bucketId":"nk","note":"Betul! Kata Nama terbitan dan Kata Nama Khas."},{"text":"harmoni / yang / tidak","bucketId":"at","note":"Tepat! Gabungan Kata Adjektif dan Kata Tugas."}],"explanation":"Setiap perkataan boleh berubah fungsi bergantung pada imbuhan serta kedudukannya dalam struktur frasa ayat."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Perkataan Tema 4 dengan Golongannya","voiceCaption":"Padankan lima perkataan khusus daripada halaman 44–45 buku teks dengan golongan katanya.","voiceScript":"[confident] Padankan setiap perkataan berikut dengan golongan kata tepatnya mengikut Tatabahasa Dewan!","prompt":"Padankan perkataan berikut dengan golongan kata tepatnya:","pairs":[{"id":"bm54u2m1","left":"perundingan","right":"Kata Nama (terbitan peN-...-an)"},{"id":"bm54u2m2","left":"menghormati","right":"Kata Kerja Transitif (apitan meN-...-i)"},{"id":"bm54u2m3","left":"komprehensif / harmoni","right":"Kata Adjektif Sifatan"},{"id":"bm54u2m4","left":"telah (aspek) / tidak (nafi)","right":"Kata Tugas Prafrasa"},{"id":"bm54u2m5","left":"merupakan","right":"Kata Kerja Tak Transitif Berpelengkap"}],"explanation":"'merupakan' dan 'menjadi' ialah kata kerja berpelengkap (bukan kata pemeri!); hanya 'ialah' dan 'adalah' tergolong sebagai kata pemeri."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Membuat Inferens Dasar Diplomasi","voiceCaption":"Pilih inferens paling tepat tentang sebab Malaysia mengutamakan rundingan damai berbanding paksaan.","voiceScript":"[confident] Berdasarkan teks Sentuhan Diplomasi Negara, apakah inferens paling logik tentang dasar luar Malaysia?","prompt":"Apakah INFERENS paling tepat bagi prinsip Wisma Putra yang menolak paksaan dalam hubungan antarabangsa?","options":["Keamanan serantau lebih berkekalan apabila perselisihan diselesaikan melalui meja rundingan tanpa mencabuli kedaulatan negara lain","Malaysia tidak mempunyai sebarang hubungan dagangan dengan negara luar","Semua kedutaan asing di Malaysia akan ditutup mulai tahun hadapan","Diplomasi hanya dilaksanakan apabila berlaku peperangan besar"],"correctIndex":0,"explanation":"Inferens menghubungkan maklumat tersurat teks dengan rasional kestabilan politik serta pertumbuhan ekonomi serantau."}]},{"id":"bm54-u3","title":"Unit 3: Perenggan Isi Kritis & Bahasa Berbudaya (SP 4.2.1)","subtitle":"SP 3.4.2 & 4.2.1 — Menghuraikan Perenggan Isi dengan Perbandingan Semacam, Kata Hikmat, Kiasan, Madah Pujangga & Bahasa Berirama","iconType":"scale","iconUrl":"../assets/icons/bm54-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Bahasa Berbudaya & Perenggan Isi","voiceCaption":"Standard pembelajaran empat perpuluhan dua perpuluhan satu memperkaya perenggan isi karangan menggunakan perbandingan semacam, kata-kata hikmat, kiasan, madah pujangga dan bahasa berirama.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam Tema empat, kemahiran S P tiga perpuluhan empat perpuluhan dua iaitu menghuraikan perenggan isi secara kritis dan kreatif digabungkan dengan S P empat perpuluhan dua perpuluhan satu tentang lima ragam bahasa berbudaya! Kenali kelima-limanya: pertama, Perbandingan Semacam menggunakan kata bak, umpama atau laksana seperti bersatu teguh laksana lidi seberkas; kedua, Kata-kata Hikmat seperti Bersatu teguh, bercerai roboh; ketiga, Kiasan untuk menegur atau menasihati secara halus; keempat, Madah Pujangga yang sarat falsafah seperti Bulat air kerana pembetung; dan kelima, Bahasa Berirama yang berentak indah seperti Ke bukit sama didaki, ke lurah sama dituruni! Terokai kelima-lima contoh dalam makmal di bawah!","title":"3.4.2 & 4.2.1 Menghuraikan Perenggan Isi dengan 5 Ragam Bahasa Berbudaya","acronym":"5•BUDAYA","hook":"Klik kesemua ragam Bahasa Berbudaya dalam makmal untuk memperindah perenggan isi karangan perpaduan!","summary":"Penggunaan ungkapan bahasa berbudaya sebagai penyeri huraian atau ayat penegas meningkatkan gaya bahasa karangan ke tahap cemerlang.","bullets":["Perbandingan Semacam: Membandingkan sifat atau keadaan dengan objek lain melalui kata pembanding (seperti, bagai, bak, umpama, laksana) — contoh: teguh bagai aur dengan tebing.","Kata-kata Hikmat & Madah Pujangga: Ungkapan berfalsafah bernilai tinggi seperti 'Bersatu teguh, bercerai roboh', 'Tak kenal maka tak cinta', dan 'Muafakat membawa berkat'.","Kiasan & Bahasa Berirama: Kiasan menyampaikan maksud tersirat secara halus ('buang yang keruh, ambil yang jernih'), manakala bahasa berirama menekankan kesepaduan irama ('berat sama dipikul, ringan sama dijinjing')."],"labId":"bm54_huraian_bahasa_berbudaya_lab","labTitle":"Makmal 5 Ragam Bahasa Berbudaya (SP 4.2.1)","labProps":{"st":"perbandingan"},"examTip":"Pastikan peribahasa atau madah pujangga yang diselitkan dalam karangan benar-benar menepati konteks huraian isi — jangan menampal peribahasa secara paksa tanpa kaitan!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Bina Perenggan Isi Bahasa Berbudaya","voiceCaption":"Susun ayat untuk menghasilkan perenggan isi kritis tentang perpaduan kaum berserta ungkapan bahasa berbudaya yang tepat.","voiceScript":"[confident] Susun keempat-empat ayat ini supaya membentuk perenggan isi perpaduan S P tiga perpuluhan empat perpuluhan dua yang lengkap dengan madah berbudaya!","prompt":"Susun segmen berikut menjadi perenggan isi tentang amalan gotong-royong komuniti:","hint":"Mulakan dengan Ayat Topik, huraian sebab, contoh aktiviti kejiranan dan penegas dengan ungkapan berirama...","answerTokens":["Selain itu, amalan gotong-royong di kawasan kejiranan berupaya memupuk perpaduan kaum yang utuh.","Aktiviti membersihkan balai raya secara bersama membolehkan jiran pelbagai etnik berinteraksi sekali gus meruntuhkan tembok prasangka.","Sebagai contoh, program Ziarah Komuniti dan kenduri rakyat membuktikan kerjasama ikhlas mampu mengatasi sikap mementingkan diri.","Tegasnya, perpaduan yang terjalin laksana aur dengan tebing akan menjamin keharmonian negara selaras dengan kata hikmat bersatu teguh, bercerai roboh."],"distractors":["Oleh itu, penduduk tidak perlu mengenali jiran di sebelah rumah.","Kesimpulannya, gotong-royong hanya dilakukan di atas kertas sahaja."],"explanation":"Gabungan huraian logik, contoh konkrit serta dua ungkapan berbudaya menepati kehendak SP 3.4.2 dan SP 4.2.1."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Jenis Bahasa Berbudaya & Contoh","voiceCaption":"Padankan ragam bahasa berbudaya SP 4.2.1 dengan contoh ungkapannya yang tepat.","voiceScript":"[curious] Padankan jenis bahasa berbudaya dalam S P empat perpuluhan dua perpuluhan satu dengan contoh ungkapannya!","prompt":"Padankan jenis bahasa berbudaya berikut dengan contoh tepatnya:","pairs":[{"id":"bm54u3m1","left":"Perbandingan Semacam","right":"Teguh laksana lidi seberkas / adil seperti hakim"},{"id":"bm54u3m2","left":"Kata-kata Hikmat","right":"Bersatu teguh, bercerai roboh"},{"id":"bm54u3m3","left":"Bahasa Berirama","right":"Ke bukit sama didaki, ke lurah sama dituruni"},{"id":"bm54u3m4","left":"Kiasan / Perumpamaan Halus","right":"Buang yang keruh, ambil yang jernih"}],"explanation":"Mengetahui ciri pembeza setiap ragam memudahkan pemilihan ungkapan mengikut nada karangan atau pidato."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Pilih Ungkapan Tepat Konteks Perpaduan","voiceCaption":"Pilih peribahasa atau ungkapan berbudaya yang paling sesuai melengkapkan ayat tentang kepentingan komunikasi mesra antara jiran.","voiceScript":"[confident] Apakah ungkapan paling sesuai untuk menggambarkan semangat saling membantu dalam kejiranan berbilang bangsa?","prompt":"Pilih ungkapan bahasa berbudaya yang PALING SESUAI bagi konteks kerjasama masyarakat majmuk menghadapi bencana banjir:","options":["Berat sama dipikul, ringan sama dijinjing","Bagai mencurah air ke daun keladi","Seperti katak di bawah tempurung","Bagai anjing dengan kucing"],"correctIndex":0,"explanation":"'Berat sama dipikul, ringan sama dijinjing' melambangkan perkongsian beban dan semangat muafakat semasa senang mahupun susah."}]},{"id":"bm54-u4","title":"Unit 4: Perpaduan Nasional & Pemurnian Ayat","subtitle":"Aplikasi SP 5.2.1 & 3.6.1 — Penyuntingan Golongan Kata, Ejaan & Kesinambungan Idea dalam Wacana Muafakat","iconType":"crown","iconUrl":"../assets/icons/bm54-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Penyuntingan Wacana Perpaduan","voiceCaption":"Pemurnian teks perpaduan membetulkan kesalahan ejaan kata sendi, hukum D-M, penggunaan kata kerja serta pertindihan kata tugas.","voiceScript":"[warm] Selamat datang ke Unit empat! Sebelum menghadapi Cabaran Boss Tema empat, mari kita tajamkan kemahiran menyunting dan memurnikan ayat bertema perpaduan! Antara kesalahan bahasa paling kerap dalam karangan Bersatu Teguh ialah penggunaan 'di kalangan' yang sepatutnya 'dalam kalangan', 'demi untuk' yang lewah dan sepatutnya 'demi' atau 'untuk' sahaja, serta kekeliruan 'saling hormat-menghormati' yang sepatutnya 'saling menghormati' atau 'hormat-menghormati'! Ketelitian mengenal pasti golongan kata menyelamatkan markah bahasa kita dalam Kertas satu dan Kertas dua!","title":"Pemurnian Golongan Kata & Kesalahan Lazim Wacana Perpaduan","acronym":"SUNTING•BM","hook":"Kenal pasti pasangan frasa gramatis vs salah lewah dalam wacana perpaduan nasional!","summary":"Pemurnian bahasa memastikan ketepatan sendi nama, kata ganda berimbuhan 'saling', hukum D-M dan ketiadaan kata tugas bertindan.","bullets":["Sendi Nama 'dalam' vs 'di': Guna 'dalam kalangan rakyat', BUKAN 'di kalangan rakyat' ('di' hanya untuk tempat fizikal nyata).","Kata Ganda 'saling': Guna 'saling menghormati' ATAU 'hormat-menghormati', BUKAN 'saling hormat-menghormati' (lewah!).","Penanda Tugas Bertindan: 'demi untuk', 'agar supaya', 'selain daripada itu', 'oleh kerana' -> mesti diringkaskan kepada 'demi', 'agar', 'selain itu', 'oleh sebab'."],"examTip":"Dalam soalan pengeditan Kertas 2, periksa tiga perkara utama pada setiap baris: (1) Ejaan kata majmuk/sendi, (2) Imbuhan meN-/di- dan (3) Kelewahan jamak atau kata tugas."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Frasa Perpaduan Gramatis vs Lewah","voiceCaption":"Asingkan enam ungkapan bertema perpaduan kepada Frasa Gramatis atau Frasa Lewah/Salah.","voiceScript":"[curious] Tajamkan mata penyuntingan kamu! Kelaskan enam ungkapan ini kepada Frasa Gramatis atau Frasa Salah dan Lewah!","prompt":"Kelaskan ungkapan berikut kepada Frasa Gramatis atau Frasa Salah/Lewah:","buckets":[{"id":"gramatis","label":"Frasa Gramatis (Betul)"},{"id":"lewah","label":"Frasa Lewah / Salah"}],"items":[{"text":"dalam kalangan masyarakat majmuk","bucketId":"gramatis","note":"Betul! 'dalam kalangan' digunakan untuk kelompok abstrak/manusia."},{"text":"saling hormat-menghormati antara kaum","bucketId":"lewah","note":"Salah! Berganda makna saling; pilih 'saling menghormati' atau 'hormat-menghormati'."},{"text":"oleh sebab permuafakatan yang utuh","bucketId":"gramatis","note":"Betul! 'oleh' diikuti kata nama 'sebab'."},{"text":"demi untuk mengekalkan keamanan negara","bucketId":"lewah","note":"Salah! Kata tugas 'demi' dan 'untuk' bertindan."},{"text":"berbincang tentang pelaksanaan program RIMUP","bucketId":"gramatis","note":"Betul! Kata kerja tak transitif 'berbincang' mesti diikuti 'tentang'."},{"text":"membincangkan tentang agenda mesyuarat","bucketId":"lewah","note":"Salah! Kata kerja transitif 'membincangkan' terus diikuti objek tanpa 'tentang'."}],"explanation":"Mengenal pasti gabungan 'membincangkan + objek' berbanding 'berbincang tentang + objek' ialah asas sintaksis SPM."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Ayat Suntingan Terbaik","voiceCaption":"Ramalkan ayat yang membetulkan kesemua ralat dalam ayat 'Para pemimpin-pemimpin membincangkan tentang strategi perpaduan di kalangan belia.'","voiceScript":"[curious] Ramalkan pembetulan penuh bagi ayat yang mempunyai tiga kesalahan: 'Para pemimpin-pemimpin membincangkan tentang strategi perpaduan di kalangan belia'!","hook":"Betulkan ketiga-tiganya: jamak berganda, transitif tanpa 'tentang', dan 'dalam kalangan'!","scenario":"Tiga kesalahan dikesan dalam draf minit mesyuarat Kelab Rukun Negara.","prompt":"Pilih ayat pembetulan yang seratus peratus GRAMATIS:","options":["Para pemimpin membincangkan strategi perpaduan dalam kalangan belia","Pemimpin-pemimpin membincangkan tentang strategi perpaduan dalam kalangan belia","Para pemimpin-pemimpin berbincang strategi perpaduan di kalangan belia","Semua pemimpin-pemimpin membincangkan strategi perpaduan di kalangan belia"],"correctIndex":0,"explanation":"'Para pemimpin' (tanpa gandaan), 'membincangkan strategi' (terus diikuti objek) dan 'dalam kalangan belia' membetulkan kesemua tiga ralat."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Fungsi Kata Kerja Berpelengkap","voiceCaption":"Pilih ayat yang menggunakan kata kerja tak transitif berpelengkap atau kata pemeri dengan betul.","voiceScript":"[confident] Pilih ayat diplomasi dan perpaduan yang menggunakan kata kerja serta kata pemeri dengan betul!","prompt":"Pilih ayat yang BETUL penggunaan kata kerja dan kata pemerinya:","options":["Strategi perundingan merupakan tunjang keamanan, manakala perpaduan ialah aset berharga negara","Strategi perundingan ialah berteraskan keamanan dan perpaduan adalah aset negara","Program RIMUP adalah satu langkah yang berteraskan dengan muafakat","Wisma Putra merupakan kepada agensi dasar luar Malaysia"],"correctIndex":0,"explanation":"'merupakan' (kata kerja) diikuti objek/pelengkap; 'ialah' (kata pemeri) diikuti frasa nama ('aset berharga negara')."}]},{"id":"bm54-u5","title":"Unit 5: Cabaran Boss Tema 4 — Bersatu Teguh","subtitle":"Penilaian Bersepadu KSSM Tema 4 T5: RIMUP, Diplomasi Wisma Putra, 4 Golongan Kata & Bahasa Berbudaya","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Golongan Kata Teks Diplomasi","voiceCaption":"Pilih pengelasan golongan kata yang seratus peratus tepat bagi perkataan Tema 4.","voiceScript":"[excited] Cabaran Boss Tema empat bermula! Kenal pasti pengelasan keempat-empat golongan kata berikut yang betul sepenuhnya!","prompt":"Manakah padanan keempat-empat perkataan dengan golongan katanya yang TEPAT?","options":["perundingan (Kata Nama), mengamalkan (Kata Kerja), komprehensif (Kata Adjektif), melalui (Kata Tugas)","Malaysia (Kata Adjektif), teguh (Kata Kerja), menolak (Kata Tugas), pada (Kata Nama)","strategi (Kata Kerja), harmoni (Kata Nama), telah (Kata Adjektif), operasi (Kata Tugas)","paksaan (Kata Tugas), menghormati (Kata Adjektif), yang (Kata Kerja), luar (Kata Nama)"],"correctIndex":0,"explanation":"Padanan dalam pilihan A menepati jadual rasmi Tema 4 Bersatu Teguh."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Bahasa Berbudaya SP 4.2.1","voiceCaption":"Ramalkan pengelasan ungkapan berikut antara Perbandingan Semacam, Kata Hikmat dan Bahasa Berirama.","voiceScript":"[curious] Ramalkan jenis ragam bahasa berbudaya bagi tiga ungkapan: 'tegak bagai aur dengan tebing', 'bersatu teguh, bercerai roboh', dan 'berat sama dipikul, ringan sama dijinjing'!","hook":"Perhatikan penggunaan kata pembanding 'bagai' berbanding irama seimbang!","scenario":"Pelajar menyemak kategori gaya bahasa sebelum memasukkannya ke dalam karangan.","prompt":"Pilih padanan ragam bahasa berbudaya (SP 4.2.1) yang BETUL mengikut turutan:","options":["Perbandingan Semacam / Kata-kata Hikmat / Bahasa Berirama","Bahasa Berirama / Kata Ganda / Akronim","Kata Tugas / Pascakata / Kata Majmuk","Perbandingan Semacam / Ayat Perintah / Ayat Seruan"],"correctIndex":0,"explanation":"'bagai aur...' membandingkan dua keadaan (perbandingan semacam), 'bersatu teguh...' ialah kata hikmat, dan 'berat sama dipikul...' ialah bahasa berirama."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Perenggan Diplomasi & Perpaduan","voiceCaption":"Susun segmen ayat membentuk kesimpulan wacana diplomasi dan perpaduan nasional yang gramatis.","voiceScript":"[confident] Susun segmen ini untuk melengkapkan kesimpulan wacana perpaduan dalam negara dan diplomasi serantau!","prompt":"Susun ayat kesimpulan bertema perpaduan dan diplomasi berikut:","hint":"Mulakan dengan penegasan peranan perpaduan dalaman, hubungan Wisma Putra, ancaman perpecahan dan harapan...","answerTokens":["Kesimpulannya, perpaduan domestik yang kukuh menjadi landasan kestabilan diplomasi negara di mata dunia.","Oleh itu, program seperti RIMUP dan dasar rundingan aman Wisma Putra wajar terus diperkasa.","Jika semangat toleransi terhakis, keharmonian negara pasti tergugat oleh anasir perpecahan.","Semoga seluruh rakyat kekal muafakat kerana bulat air kerana pembetung, bulat manusia kerana muafakat."],"distractors":["Justeru, semua kedutaan luar negara tidak perlu mengadakan rundingan.","Selain daripada itu, program ziarah komuniti harus dihentikan."],"explanation":"Kesimpulan yang menghubungkan kestabilan dalam negeri (RIMUP) dan diplomasi antarabangsa (Wisma Putra) sangat bernas."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Konsep Utama Tema 4","voiceCaptio   units.forEach(function (u) {

  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
