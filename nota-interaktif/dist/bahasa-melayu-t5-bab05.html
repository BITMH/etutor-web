/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t5-bab05","subject":"Bahasa Melayu","subjectGroup":"teras","form":5,"chapterNumber":5,"title":"Pendidikan untuk Semua","subtitle":"Tema 5 BM T5 KSSM — Pendidikan Khas & Autisme (Anak Syurga), Sekolah Bimbingan Jalinan Kasih & Resipi Tauhu Bergedel, Frasa FN/FK/FA/FSN (SP 5.3.1), Ulasan Analogi (SP 2.3.4) & Kem Motivasi Sahsiah (SP 3.4.3 & 4.2.1).","estimatedMinutes":26,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"bahasa-melayu-t5-bab05-labs.js","coverIcon":"../assets/icons/bm55-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Syabas! Pemahaman empat jenis frasa dan nilai pendidikan inklusif kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat hebat! [excited] Teruskan ketepatan membezakan FN, FK, FA, FSN dan membuat analogi!","encourage":"[softly] Hampir tepat... semak semula kata inti bagi Frasa Nama, Frasa Kerja, Frasa Adjektif atau Frasa Sendi Nama!","celebrate":"[excited] Cemerlang! Tema kelima Pendidikan untuk Semua Bahasa Melayu Tingkatan lima berjaya kamu kuasai!"},"units":[{"id":"bm55-u1","title":"Unit 1: Mendidik Insan Istimewa & Pendidikan Khas","subtitle":"Pendidikan Inklusif, Program Pendidikan Khas Integrasi (PPKI), Autisme & Soalan Terbuka","iconType":"book","iconUrl":"../assets/icons/bm55-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pendidikan Khas & Murid Autisme","voiceCaption":"Sistem pendidikan negara memastikan Murid Berkeperluan Khas mendapat peluang belajar melalui Sekolah Pendidikan Khas, PPKI dan Program Pendidikan Inklusif.","voiceScript":"[warm] Selamat datang ke Tema lima Bahasa Melayu Tingkatan lima, Pendidikan untuk Semua! Unit satu membawa kita menyelami hak pendidikan saksama bagi Murid Berkeperluan Khas atau M B K menerusi tiga saluran utama di Malaysia: Sekolah Pendidikan Khas, Program Pendidikan Khas Integrasi atau P P K I di sekolah harian, serta Program Pendidikan Inklusif! Bahagian Anak Syurga turut mendidik masyarakat mengenali ciri autisme — gangguan perkembangan saraf yang mempengaruhi komunikasi dan interaksi sosial — serta membuktikan bahawa individu autisme seperti tokoh muda berjaya dalam buku teks mampu menyerlah apabila diberi bimbingan dan empati masyarakat!","title":"Pendidikan Khas (SPK, PPKI, Inklusif) & Kesedaran Autisme","acronym":"SPK•PPKI","hook":"Kenali 3 laluan pendidikan Murid Berkeperluan Khas serta pendekatan mesra murid autisme!","mediaKey":"bm55_pendidikan_inklusif","summary":"Pendidikan inklusif memartabatkan keadilan pendidikan tanpa mengira keupayaan fizikal atau neurologi menerusi modul khas dan sokongan komuniti.","bullets":["3 Saluran Pendidikan Murid Berkeperluan Khas (MBK): (1) Sekolah Pendidikan Khas (SPK), (2) Program Pendidikan Khas Integrasi (PPKI), (3) Program Pendidikan Inklusif (belajar bersama-sama murid arus perdana).","Kesedaran Autisme (Anak Syurga): Menghargai bakat unik individu autisme (seni, matematik, muzik, pengaturcaraan) serta mengelakkan stigma sosial.","Soalan Terbuka (Kertas 3 & Kajian Lapangan): Ajukan soalan seperti 'Bagaimanakah modul pembelajaran khas disesuaikan mengikut keperluan murid autisme?' untuk menggali maklumat mendalam."],"examTip":"Dalam karangan bertema pendidikan untuk semua, bezakan istilah 'pendidikan inklusif' (menggabungkan MBK di kelas arus perdana) daripada pengasingan pendidikan."},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Saluran Pendidikan Khas & Peranan","voiceCaption":"Padankan saluran pendidikan khas dan konsep Tema 5 dengan penerangannya yang tepat.","voiceScript":"[confident] Padankan setiap konsep pendidikan khas dalam Tema lima ini dengan huraian tepatnya!","prompt":"Padankan konsep pendidikan inklusif berikut dengan penerangannya:","pairs":[{"id":"bm55u1m1","left":"Sekolah Pendidikan Khas (SPK)","right":"Sekolah yang dibina khusus sepenuhnya untuk Murid Berkeperluan Khas"},{"id":"bm55u1m2","left":"Program Pendidikan Khas Integrasi (PPKI)","right":"Kelas khas yang ditempatkan di dalam sekolah harian arus perdana"},{"id":"bm55u1m3","left":"Program Pendidikan Inklusif","right":"Murid MBK belajar bersama-sama rakan sebaya dalam kelas biasa"},{"id":"bm55u1m4","left":"Sokongan terhadap Anak Syurga (Autisme)","right":"Memupuk empati, terapi komunikasi dan pengesanan bakat istimewa"}],"explanation":"Ketiga-tiga laluan SPK, PPKI dan Inklusif memastikan tiada murid berkeperluan khas terpinggir daripada sistem pendidikan kebangsaan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Isih Tindakan Menyokong vs Meminggirkan MBK","voiceCaption":"Kelaskan enam sikap masyarakat terhadap murid autisme dan MBK kepada Amalan Inklusif atau Sikap Negatif.","voiceScript":"[curious] Asingkan enam sikap berikut kepada Amalan Pendidikan Inklusif atau Sikap Meminggirkan!","prompt":"Kelaskan tindakan berikut terhadap Murid Berkeperluan Khas:","buckets":[{"id":"sokong","label":"Amalan Menyokong & Inklusif"},{"id":"pinggir","label":"Sikap Meminggirkan"}],"items":[{"text":"Menyediakan laluan mesra OKU serta bahan bantu belajar visual dan sensori","bucketId":"sokong","note":"Betul! Persekitaran kondusif membantu potensi murid."},{"text":"Mengejek kesukaran pertuturan rakan berkeperluan khas di sekolah","bucketId":"pinggir","note":"Tepat! Buli dan stigma menjejaskan keyakinan diri mereka."},{"text":"Mengadakan pameran kesedaran autisme untuk memupuk empati warga sekolah","bucketId":"sokong","note":"Betul! Salah satu aktiviti dicadangkan dalam Tema 5."},{"text":"Menganggap murid autisme tidak berhak menyertai aktiviti kokurikulum","bucketId":"pinggir","note":"Tepat! Menafikan hak dan bakat semula jadi mereka."},{"text":"Menggalakkan penglibatan rakan sebaya membimbing pembelajaran berkumpulan","bucketId":"sokong","note":"Betul! Sistem sokongan rakan sebaya memperkukuh integrasi."},{"text":"Membiarkan murid tercicir tanpa sebarang program pemulihan atau bimbingan","bucketId":"pinggir","note":"Tepat! Bercanggah dengan prinsip Pendidikan untuk Semua."}],"explanation":"Kejayaan pendidikan inklusif bergantung pada prasarana fizikal dan penerimaan empati seluruh warga sekolah."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Tujuan Pameran Kesedaran Autisme","voiceCaption":"Pilih matlamat utama penganjuran pameran kesedaran autisme di sekolah.","voiceScript":"[confident] Mengapakah buku teks Tema lima menggalakkan murid menganjurkan pameran kesedaran autisme?","prompt":"Apakah matlamat utama penganjuran pameran kesedaran autisme dalam kalangan pelajar?","options":["Meningkatkan kefahaman masyarakat tentang ciri autisme, memupuk keprihatinan serta mengiktiraf potensi golongan istimewa","Mengasingkan murid autisme daripada semua sekolah di Malaysia","Menunjukkan bahawa murid autisme tidak perlu belajar membaca","Menggantikan mata pelajaran Bahasa Melayu dengan aktiviti melukis"],"correctIndex":0,"explanation":"Kesedaran masyarakat menghapuskan salah faham dan membuka peluang sokongan kepada murid autisme."}]},{"id":"bm55-u2","title":"Unit 2: Sekolah Jalinan Kasih & 4 Jenis Frasa (SP 5.3.1)","subtitle":"SP 5.3.1 & 2.3.4 — Frasa Nama, Frasa Kerja, Frasa Adjektif & Frasa Sendi Nama serta Ulasan Analogi","iconType":"formula","iconUrl":"../assets/icons/bm55-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Jenis Frasa & Sekolah Jalinan Kasih","voiceCaption":"Sekolah Bimbingan Jalinan Kasih Chow Kit membela murid tercicir dengan modul khas dan terapi muzik, sambil membekalkan contoh Frasa Nama, Frasa Kerja, Frasa Adjektif dan Frasa Sendi Nama untuk SP 5.3.1.","voiceScript":"[warm] Selamat datang ke Unit dua! Kisah Sekolah Bimbingan Jalinan Kasih di Chow Kit membuktikan tiada kanak-kanak wajar tercicir biarpun tanpa dokumen pengenalan diri atau daripada keluarga kurang berkemampuan — mereka dibimbing melalui terapi muzik dan kemahiran kulinari seperti membuat tauhu bergedel! Dari segi tatabahasa S P lima perpuluhan tiga perpuluhan satu pula, perhatikan empat jenis frasa mengikut kata intinya: Frasa Nama seperti modul pembelajaran khas dan setengah cawan lobak merah; Frasa Kerja seperti bermain alat muzik dan memasak tauhu bergedel; Frasa Adjektif seperti amat istimewa, terlalu lembut dan sangat enak; serta Frasa Sendi Nama seperti terletak di Chow Kit dan diagihkan kepada setiap ahli! Kenali juga kemahiran S P dua perpuluhan tiga perpuluhan empat iaitu mengulas bahan dengan ANALOGI yang tepat! Uji keempat-empat frasa dalam makmal sekarang.","title":"5.3.1 Empat Jenis Frasa (FN, FK, FA, FSN) & 2.3.4 Ulasan Analogi","acronym":"FN•FK•FA•FSN","hook":"Klik makmal Frasa untuk menyemak Hukum D-M dan contoh FN, FK, FA, FSN daripada Tema 5!","summary":"Jenis frasa ditentukan oleh kata inti utamanya (nama, kerja, adjektif atau kata sendi nama); analogi membandingkan dua perkara berlainan yang mempunyai ciri kesamaan logik untuk memperjelas hujah.","bullets":["Frasa Nama (FN): Kata inti Kata Nama ('Sekolah Bimbingan Jalinan Kasih', 'kanak-kanak tanpa dokumen pengenalan diri', 'tauhu kering'). Patuh Hukum D-M!","Frasa Kerja (FK): Kata inti Kata Kerja ('mula beroperasi', 'bermain alat muzik', 'menyediakan juadah tauhu bergedel', 'telah dikupas').","Frasa Adjektif (FA) & Frasa Sendi Nama (FSN): FA ('amat istimewa', 'terlalu lembut', 'sangat enak'); FSN ('di Chow Kit', 'kepada pelanggan', 'dari pasar', 'bagi membolehkan')."],"labId":"bm55_frasa_laras_lab","labTitle":"Makmal 4 Jenis Frasa Tema 5 (SP 5.3.1)","labProps":{"fk":"fn"},"examTip":"Awas membezakan Kata Sendi 'sehingga masak' (dalam jadual teks atau kata hubung keterangan) vs Frasa Sendi Nama tulen: FSN sentiasa terdiri daripada Kata Sendi Nama (di, ke, dari, daripada, kepada, pada, bagi) + Frasa Nama!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Pengelasan Frasa & Hukum D-M","voiceCaption":"Ramalkan himpunan frasa yang betul padanan jenisnya serta mematuhi Hukum D-M Tatabahasa Dewan.","voiceScript":"[curious] Berhati-hati dengan kata inti frasa dan Hukum D-M! Antara keempat-empat pilihan berikut, manakah pengelasan frasa dan ejaan Hukum D-M yang betul?","hook":"Semak kata inti frasa pertama: 'modul pembelajaran' (Diterangkan = modul, Menerangkan = pembelajaran)!","scenario":"Calon menyusun senarai frasa daripada petikan Sekolah Bimbingan Jalinan Kasih dan resipi tauhu bergedel.","prompt":"Pilih padanan frasa dan pengelasannya yang BETUL mengikut Tatabahasa Dewan:","options":["modul pembelajaran khas (FN) / menyediakan juadah (FK) / sangat enak (FA) / di Chow Kit (FSN)","pembelajaran modul khas (FN) / terlalu lembut (FK) / bermain muzik (FA) / anak yatim (FSN)","amat istimewa (FN) / di pasar (FK) / tauhu bergedel (FA) / sangat enak (FSN)","Chow Kit restoran (FN) / dari pasar (FK) / agak pandai (FSN) / memasak kentang (FA)"],"correctIndex":0,"proofLabId":"bm55_frasa_laras_lab","proofState":{"fk":"fsn"},"explanation":"Pilihan A memadankan setiap frasa mengikut kata intinya ('modul'=FN, 'menyediakan'=FK, 'enak'=FA, 'di'=FSN) serta mematuhi Hukum D-M."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan 4 Jenis Frasa daripada Petikan Tema 5","voiceCaption":"Padankan lima frasa daripada halaman 58–59 dan halaman 249 buku teks dengan jenis frasanya.","voiceScript":"[confident] Padankan setiap frasa daripada petikan Sekolah Bimbingan Jalinan Kasih dan resipi tauhu bergedel dengan jenis frasanya!","prompt":"Padankan frasa berikut dengan kategori yang betul:","pairs":[{"id":"bm55u2m1","left":"kanak-kanak tanpa dokumen pengenalan diri","right":"Frasa Nama (FN)"},{"id":"bm55u2m2","left":"menerima undangan persembahan","right":"Frasa Kerja Transitif (FK)"},{"id":"bm55u2m3","left":"terlalu lembut / sangat enak","right":"Frasa Adjektif (FA)"},{"id":"bm55u2m4","left":"dari pasar / kepada pelanggan","right":"Frasa Sendi Nama (FSN)"},{"id":"bm55u2m5","left":"setengah cawan lobak merah","right":"Frasa Nama (ukuran + bahan)"}],"explanation":"Mengenal pasti kata inti frasa merupakan kunci penguasaan sintaksis SP 5.3.1."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ulasan Menggunakan Analogi Tepat","voiceCaption":"Pilih analogi yang paling tepat untuk menggambarkan peranan Sekolah Bimbingan Jalinan Kasih bagi kanak-kanak tercicir.","voiceScript":"[confident] Mengikut S P dua perpuluhan tiga perpuluhan empat, apakah analogi yang paling tepat menggambarkan peranan Sekolah Bimbingan Jalinan Kasih?","prompt":"Manakah ANALOGI paling sesuai untuk mengulas peranan Sekolah Bimbingan Jalinan Kasih kepada anak-anak terpinggir?","options":["Umpama pelita yang menyuluh jalan gelap supaya anak-anak tercicir mampu melihat peluang masa hadapan yang cerah","Umpama jam tangan rosak yang dibuang ke dalam tong sampah","Bagai laut yang kering kontang tanpa setitik air hujan","Seperti kereta tanpa tayar yang diletakkan di garaj terkunci"],"correctIndex":0,"explanation":"Analogi pelita menerangi kegelapan melambangkan bimbingan ilmu dan harapan yang diberikan kepada murid terpinggir."}]},{"id":"bm55-u3","title":"Unit 3: Kem Motivasi Sahsiah Unggul & Bahasa Berbudaya","subtitle":"SP 3.4.3 & 4.2.1 — Membina Sahsiah Unggul (5W1H), Karangan Berbudaya & Peribahasa Usaha Tumpu Jaya","iconType":"scale","iconUrl":"../assets/icons/bm55-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kem Motivasi & Karangan Berbudaya","voiceCaption":"Program kem motivasi Usaha Tumpu Jaya membina disiplin dan keyakinan diri melalui aktiviti lasak sambil mengaplikasikan teknik 5W1H serta peribahasa berbudaya.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bahagian Membina Sahsiah Unggul memaparkan aktiviti kem motivasi Usaha Tumpu Jaya seperti berkawad, merentas hutan, menjelajah gua, berjalan malam, turun cenuram dan luncur keluang untuk membentuk disiplin serta keyakinan diri! Untuk menghasilkan karangan lengkap S P tiga perpuluhan empat perpuluhan tiga, kembangkan isi menggunakan teknik bacaan lima W satu H iaitu Apa, Siapa, Bila, Di mana, Mengapa dan Bagaimana, lalu serlahkan gaya bahasa S P empat perpuluhan dua perpuluhan satu dengan ungkapan dalam teks iaitu cerdik seperti kancil, rajin seperti semut, usaha tangga kejayaan, hemat pangkal kaya rajin pangkal pandai, serta bara yang digenggam biar sampai menjadi arang! Terokai makmal analogi dan bahasa berbudaya di bawah!","title":"3.4.3 & 4.2.1 Kem Motivasi Sahsiah, Teknik 5W1H & Ungkapan Tema 5","acronym":"5W1H•SAHSIAH","hook":"Lihat padanan peribahasa Usaha Tumpu Jaya dan teknik analogi dalam makmal interaktif!","mediaKey":"bm55_kem_motivasi","summary":"Pengembangan isi karangan menggunakan 5W1H menjadikan huraian konkrit dan berfakta, manakala peribahasa berbudaya memperindah laras karangan.","bullets":["Aktiviti Kem Motivasi (Usaha Tumpu Jaya): Berkawad (disiplin), merentas hutan & menjelajah gua (kerjasama), berjalan malam, turun cenuram (abseiling) dan luncur keluang (flying fox) untuk keberanian.","Teknik Pengembangan Isi 5W1H: What (Apa aktiviti), Who (Siapa sasaran), When (Bila sesuai), Where (Di mana lokasi selamat), Why (Mengapa penting untuk sahsiah), How (Bagaimana pelaksanaan berjaya).","Ungkapan Tema 5 (SP 4.2.1): Perbandingan semacam ('cerdik seperti kancil', 'rajin seperti semut') serta kata hikmat ('Hemat pangkal kaya, rajin pangkal pandai'; 'Bara yang digenggam biar sampai menjadi arang'; 'Usaha tangga kejayaan')."],"labId":"bm55_karangan_analogi_lab","labTitle":"Makmal Analogi & Bahasa Berbudaya (SP 2.3.4 & 4.2.1)","labProps":{"tab":"bahasa"},"examTip":"Elakkan terjemahan Inggeris literal seperti 'flying fox' atau 'abseiling' dalam karangan BM — gunakan istilah bahasa Melayu rasmi buku teks: 'luncur keluang' dan 'turun cenuram'!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Perenggan Karangan Kem Motivasi","voiceCaption":"Susun bahagian ayat untuk membina satu perenggan isi lengkap bertema kem motivasi membina sahsiah unggul.","voiceScript":"[confident] Susun keempat-empat ayat ini menjadi satu perenggan isi karangan S P tiga perpuluhan empat perpuluhan tiga yang padat dengan ungkapan berbudaya!","prompt":"Susun ayat berikut membentuk perenggan isi bertema kem motivasi remaja:","hint":"Mulakan dengan ayat topik manfaat kem motivasi, huraian sebab, contoh aktiviti Usaha Tumpu Jaya dan ayat penegas berungkapan...","answerTokens":["Kem motivasi luar bilik darjah amat berkesan membentuk jati diri serta keyakinan pelajar.","Cabaran fizikal secara berkumpulan melatih remaja mengatasi rasa gentar sekali gus membina semangat juang yang kental.","Sebagai contoh, aktiviti berkawad, turun cenuram dan luncur keluang memupuk disiplin tinggi serta keberanian membuat keputusan pantas.","Tegasnya, ketekunan peserta yang rajin seperti semut akan membuahkan kejayaan kerana usaha tangga kejayaan."],"distractors":["Selain itu, pelajar wajar tidur sepanjang kem tanpa menyertai aktiviti.","Tambahan pula, telefon pintar mesti digunakan ketika menuruni cenuram."],"explanation":"Menggunakan istilah tepat buku teks ('turun cenuram', 'luncur keluang') dan ungkapan teks menepati SP 3.4.3 & SP 4.2.1."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Peribahasa Tema 5 dengan Maksud","voiceCaption":"Padankan lima peribahasa dan perbandingan semacam daripada buku teks Tema 5 dengan maksudnya.","voiceScript":"[curious] Padankan kelima-lima peribahasa dan perbandingan semacam daripada bahagian Membina Sahsiah Unggul ini dengan maksudnya!","prompt":"Padankan ungkapan Tema 5 berikut dengan maksudnya yang betul:","pairs":[{"id":"bm55u3m1","left":"Cerdik seperti kancil","right":"Kepintaran berfikir dan tangkas menyelesaikan masalah"},{"id":"bm55u3m2","left":"Rajin seperti semut","right": an.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian Demi Masa Hadapan mengajak murid Tingkatan lima merancang hala tuju selepas tamat persekolahan — sama ada melalui Tingkatan Enam S T P M, Matrikulasi, Asasi Universiti, Diploma Politeknik, atau laluan kemahiran T V E T di Institut Latihan Kemahiran serta Kolej Vokasional! Dalam S P lima perpuluhan tiga perpuluhan satu juga, kita harus peka membezakan penggunaan frasa dalam PELBAGAI LARAS BAHASA: laras pendidikan menggunakan ayat rasmi dan istilah akademik seperti modul pembelajaran khas, manakala laras resipi prosedur seperti Tauhu Bergedel menggunakan ayat perintah ringkas dan frasa ukuran seperti setengah cawan lobak merah serta tumis bawang putih!","title":"Hala Tuju Pasca-SPM & Penggunaan Frasa Mengikut Laras Bahasa","acronym":"SPM•LARAS","hook":"Bandingkan pemilihan frasa dalam laras pendidikan rasmi berbanding laras prosedur masakan!","summary":"Perancangan pasca-SPM yang bijak memilih laluan sesuai minat; kecekapan berbahasa menyesuaikan struktur FN, FK, FA dan FSN mengikut laras teks.","bullets":["Laluan Hala Tuju Pasca-SPM: Laluan Akademik (STPM, Matrikulasi, Asasi, Diploma IPTA/IPTS) dan Laluan Kemahiran/TVET (Politeknik, IKM, IKBN, Kolej Komuniti, Sijil Kemahiran Malaysia).","Laras Pendidikan / Ilmiah: Menggunakan ayat lengkap, kata kerja formal ('mula beroperasi', 'diagihkan kepada') serta istilah pendidikan ('kurikulum', 'pendidikan inklusif').","Laras Prosedur / Masakan (Resipi Tauhu Bergedel): Menggunakan kata kerja perintah ringkas ('Rebus kentang', 'Tumis bawang putih', 'Tuskan kentang') dan frasa ukuran tepat ('setengah cawan isi ayam')."],"examTip":"Semasa menulis karangan atau surat permohonan pasca-SPM, pastikan laras bahasa formal dipatuhi tanpa mencampuradukkan bahasa percakapan harian."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Frasa Laras Pendidikan vs Laras Prosedur","voiceCaption":"Asingkan enam frasa daripada Tema 5 mengikut Laras Pendidikan/Laporan atau Laras Prosedur Resipi.","voiceScript":"[curious] Asingkan keenam-enam frasa daripada Tema lima berikut mengikut laras bahasanya yang tepat!","prompt":"Kelaskan frasa berikut mengikut laras bahasa yang sesuai:","buckets":[{"id":"didik","label":"Laras Pendidikan & Laporan"},{"id":"prosedur","label":"Laras Prosedur Masakan"}],"items":[{"text":"modul pembelajaran khas bagi murid berkeperluan khas","bucketId":"didik","note":"Betul! Istilah khusus laras pendidikan."},{"text":"rebus kentang yang telah dikupas sehingga empuk","bucketId":"prosedur","note":"Tepat! Ayat arahan prosedur masakan."},{"text":"terapi jiwa untuk melupakan kesusahan hidup","bucketId":"didik","note":"Betul! Laras laporan sosial dan pendidikan."},{"text":"setengah cawan lobak merah yang dihiris halus","bucketId":"prosedur","note":"Tepat! Frasa sukatan bahan resipi."},{"text":"memperoleh pendapatan sampingan untuk ahli kumpulan","bucketId":"didik","note":"Betul! Huraian laporan impak program."},{"text":"tuskan air dan lenyek kentang bersama lada sulah","bucketId":"prosedur","note":"Tepat! Kata kerja arahan penyediaan makanan."}],"explanation":"Laras bahasa menentukan pemilihan kata kerja perintah, ukuran bahan atau istilah rasmi dalam sesuatu wacana."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Laluan Pasca-SPM & Kelebihannya","voiceCaption":"Padankan laluan pengajian selepas Tingkatan 5 dengan ciri dan kelebihannya.","voiceScript":"[confident] Padankan setiap pilihan hala tuju selepas Tingkatan lima dengan penerangannya yang tepat!","prompt":"Padankan laluan pasca-SPM berikut dengan ciri utamanya:","pairs":[{"id":"bm55u4m1","left":"Tingkatan Enam (STPM)","right":"Laluan pantas kos rendah yang diiktiraf ke universiti tempatan dan luar negara"},{"id":"bm55u4m2","left":"Program Matrikulasi / Asasi","right":"Program persediaan berfokus selama 1–2 tahun menuju ijazah sarjana muda"},{"id":"bm55u4m3","left":"Laluan TVET (Politeknik / IKM)","right":"Latihan kemahiran amali tinggi dengan kebolehpasaran pantas dalam industri"},{"id":"bm55u4m4","left":"Diploma Kemahiran & Akademik","right":"Menggabungkan teori dan amali selama 2.5 hingga 3 tahun untuk kerjaya serta ijazah"}],"explanation":"Setiap laluan pasca-SPM menawarkan peluang kecemerlangan selari dengan kecenderungan akademik atau kemahiran amali pelajar."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ketepatan Sendi Nama 'Dari' vs 'Daripada'","voiceCaption":"Pilih ayat yang menggunakan frasa sendi nama 'dari' dan 'daripada' dengan betul dalam konteks Tema 5.","voiceScript":"[confident] Uji ketepatan Frasa Sendi Nama! Pilih satu-satunya ayat yang betul menggunakan kata sendi 'dari' dan 'daripada'!","prompt":"Pilih ayat yang menggunakan Frasa Sendi Nama (FSN) dengan BETUL:","options":["Murid itu pulang dari pasar lalu belajar membuat bergedel daripada resipi ibunya","Murid itu pulang daripada pasar lalu belajar membuat bergedel dari resipi ibunya","Sumbangan pendidikan khas diterima dari pertubuhan bukan kerajaan sejak dari pagi","Prestasi peserta kem motivasi tahun ini jauh lebih cemerlang dari tahun lalu"],"correctIndex":0,"explanation":"'dari' digunakan untuk arah, tempat ('dari pasar') dan masa; 'daripada' digunakan untuk punca/sumber ('daripada resipi', 'daripada pertubuhan') dan perbandingan ('lebih cemerlang daripada')."}]},{"id":"bm55-u5","title":"Unit 5: Cabaran Boss Tema 5 — Pendidikan untuk Semua","subtitle":"Penilaian Bersepadu KSSM Tema 5 T5: 4 Jenis Frasa, Pendidikan Inklusif, Analogi & Sahsiah","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Analisis Jenis Frasa SP 5.3.1","voiceCaption":"Pilih pengelasan frasa daripada Tema 5 yang betul keempat-empat jenisnya.","voiceScript":"[excited] Cabaran Boss Tema lima bermula! Kenal pasti barisan frasa yang tepat pengelasannya untuk Frasa Nama, Frasa Kerja, Frasa Adjektif dan Frasa Sendi Nama!","promp var CHAPTER = window.__ETUTOR_NOTA_CHAPTER__ || { id: "demo", subject: "SPM", form: 4, chapterNumber: 1, title: "Nota Interaktif", units: [] };

function isEnglishNota() {
  return Boolean(CHAPTER && /inggeris|english/i.test(String(CHAPTER.subject || "")));
}

function tUi(msText, enText) {
  return isEnglishNota() ? enText : msText;

var notaState = {

  activeUnitIdx: 0,

function getStorageKey() {

}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;

    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars

}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,

function applySavedStateJson(rawJson) {

  try {

    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

    if (typeof localStorage !== "undefined") {

}

function saveNotaState() {

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {

  return true;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        });

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
