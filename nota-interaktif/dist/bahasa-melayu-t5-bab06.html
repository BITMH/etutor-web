/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t5-bab06","subject":"Bahasa Melayu","subjectGroup":"teras","form":5,"chapterNumber":6,"title":"Sains, Teknologi dan Inovasi","subtitle":"Tema 6 BM T5 KSSM — Alat Inovasi I-Force & Keseimbangan Daya (SP 2.4.1), Ayat Terbitan (SP 5.3.2), Astrofotografi Bimasakti (SP 3.5.1), Teknologi Kultur Tisu Pisang & Potensi Hidrogen (SP 3.5.2) serta Skrip Drama Nanoteknologi 'Sidang Zentaron' (SP 1.7.1 & 4.3.1).","estimatedMinutes":26,"themeAccent":"#4f46e5","isFreePreview":false,"labScript":"bahasa-melayu-t5-bab06-labs.js","coverIcon":"../assets/icons/bm56-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan ayat terbitan dan inovasi saintifik kamu sungguh cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Teruskan ketepatan membezakan proses pengguguran, penyusunan semula dan peluasan!","encourage":"[softly] Hampir tepat... semak semula tiga proses penerbitan ayat atau langkah kultur tisu pisang!","celebrate":"[excited] Tahniah! Tema keenam Sains, Teknologi dan Inovasi Bahasa Melayu Tingkatan lima berjaya kamu kuasai!"},"units":[{"id":"bm56-u1","title":"Unit 1: Inovasi I-Force & Ayat Terbitan (SP 5.3.2)","subtitle":"SP 2.4.1 & 5.3.2 — Alat Keseimbangan Daya I-Force serta 3 Proses Ayat Terbitan (Pengguguran, Penyusunan Semula, Peluasan)","iconType":"book","iconUrl":"../assets/icons/bm56-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Inovasi I-Force & 3 Proses Ayat Terbitan","voiceCaption":"Bahan maujud inovasi I-Force membantu pelajar memahami keseimbangan daya fizik sambil membekalkan contoh ayat terbitan melalui pengguguran, penyusunan semula dan peluasan.","voiceScript":"[warm] Selamat datang ke Tema enam Bahasa Melayu Tingkatan lima, Sains Teknologi dan Inovasi! Unit satu memaparkan inovasi alat bantu belajar Fizik iaitu I Force daripada dua batang pembaris lut sinar untuk menunjukkan arah daya berat dan daya normal pada objek pegun atau bergerak dengan halaju seragam! Melalui S P dua perpuluhan empat perpuluhan satu dan S P lima perpuluhan tiga perpuluhan dua, ayat-ayat daripada manual I Force seperti 'Putar anak panah berwarna biru mengikut arah pusingan jam' ialah Ayat Terbitan! Mengikut Tatabahasa Dewan, ayat terbitan terhasil daripada tiga proses utama ke atas ayat dasar: pertama, Pengguguran seperti menggugurkan kata ganti diri orang kedua 'kamu' dalam ayat perintah; kedua, Penyusunan Semula seperti menukar ayat aktif menjadi ayat pasif atau songsang; dan ketiga, Peluasan seperti menambah klausa relatif 'yang' atau kata hubung keterangan 'apabila'! Terokai makmal ayat terbitan di bawah!","title":"5.3.2 & 2.4.1 Inovasi I-Force dan 3 Proses Ayat Terbitan","acronym":"GUG•SUN•LUAS","hook":"Klik ketiga-tiga proses penerbitan ayat (Pengguguran, Penyusunan Semula, Peluasan) pada ayat I-Force dalam makmal!","mediaKey":"bm56_inovasi_iforce","summary":"Ayat terbitan lahir apabila satu atau lebih unsur ayat dasar diubah melalui proses pengguguran, penyusunan semula atau peluasan.","bullets":["Inovasi I-Force (SP 2.4.1): Alat bantu mengajar fizik menggunakan pembaris lut sinar dan anak panah berwarna biru (daya berat) serta kuning (daya normal) bagi menggambarkan keseimbangan daya paduan sifar.","Proses 1 — Pengguguran: Menghilangkan unsur berulang atau subjek 'kamu/anda' dalam ayat perintah ('Putar anak panah berwarna biru...').","Proses 2 & 3 — Penyusunan Semula & Peluasan: Penyusunan semula menukar aktif ke pasif ('I-Force digunakan untuk menentukan arah daya'); Peluasan menambah klausa relatif/keterangan ('...jika daya paduannya sifar')."],"labId":"bm56_ayat_terbitan_lab","labTitle":"Makmal 3 Proses Ayat Terbitan (SP 5.3.2)","labProps":{"proc":"pengguguran"},"examTip":"Dalam soalan sintaksis Kertas 2, apabila menukar ayat biasa kepada ayat songsang (proses penyusunan semula), pastikan predikat berpindah ke hadapan tanpa mengubah makna atau menambah partikel salah."},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Proses Penerbitan Ayat I-Force","voiceCaption":"Ramalkan proses penerbitan ayat yang menghasilkan ayat 'Putar anak panah berwarna biru ke bawah' daripada 'Kamu putar anak panah berwarna biru ke bawah'.","voiceScript":"[curious] Uji pemahaman proses ayat terbitan kamu! Apakah proses transformasi yang menggugurkan perkataan 'Kamu' dalam ayat perintah manual I Force?","hook":"Bandingkan ayat dasar 'Kamu putar...' dengan ayat terbitan 'Putar...'!","scenario":"Manual I-Force menulis: 'Putar anak panah berwarna biru mengikut arah pusingan jam.'","prompt":"Proses penerbitan ayat manakah yang berlaku untuk membentuk ayat perintah tersebut?","options":["Proses Pengguguran (menggugurkan kata ganti nama diri orang kedua sebagai subjek)","Proses Pemajmukan (menggabungkan dua kata dasar menjadi kata baharu)","Proses Peluasan Frasa Sendi Nama sahaja","Proses Penggandaan Berentak"],"correctIndex":0,"proofLabId":"bm56_ayat_terbitan_lab","proofState":{"proc":"pengguguran"},"explanation":"Ayat perintah dalam bahasa Melayu diterbitkan melalui proses pengguguran subjek orang kedua ('kamu'/'engkau')."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Contoh Ayat Terbitan & Prosesnya","voiceCaption":"Padankan empat ayat daripada manual I-Force dengan proses penerbitan ayatnya yang tepat.","voiceScript":"[confident] Padankan setiap ayat terbitan daripada Tema enam berikut dengan proses transformasi sintaksisnya!","prompt":"Padankan contoh ayat Tema 6 berikut dengan proses penerbitan ayatnya:","pairs":[{"id":"bm56u1m1","left":"Pusing anak panah berwarna kuning.","right":"Proses Pengguguran subjek perintah 'kamu'"},{"id":"bm56u1m2","left":"Bahan maujud sering digunakan oleh guru.","right":"Proses Penyusunan Semula (ayat aktif kepada ayat pasif)"},{"id":"bm56u1m3","left":"Objek itu pegun jika daya paduannya sifar.","right":"Proses Peluasan dengan klausa keterangan syarat 'jika'"},{"id":"bm56u1m4","left":"Daya yang bertindak pada objek diukur.","right":"Proses Peluasan melalui pemancangan klausa relatif 'yang'"}],"explanation":"Menguasai ketiga-tiga proses penerbitan ayat membantu menjawab soalan sintaksis Kertas 2 SPM."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Kegunaan Bahan Maujud I-Force","voiceCaption":"Pilih pernyataan tepat mengenai fungsi alat inovasi I-Force dalam pembelajaran Fizik.","voiceScript":"[confident] Berdasarkan teks bahan ilmiah I Force dalam Tema enam, apakah fungsi utama alat inovasi tersebut?","prompt":"Apakah fungsi utama inovasi I-Force mengikut petikan Tema 6?","options":["Membantu murid mengenal pasti arah daya berat dan daya normal yang bertindak pada objek pegun serta memahami keseimbangan daya","Mengukur kelajuan cahaya bintang Bimasakti menggunakan kanta kamera digital","Membiakkan tisu anak pokok pisang di dalam medium makmal steril","Menggantikan sepenuhnya eksperimen makmal kimia dan biologi"],"correctIndex":0,"explanation":"I-Force menggunakan anak panah biru (daya berat) dan kuning (daya normal) untuk memvisualisasikan keseimbangan daya."}]},{"id":"bm56-u2","title":"Unit 2: Indahnya Bimasakti & Justifikasi Astrofotografi","subtitle":"SP 3.5.1 — Mengolah Maklumat & Membuat Justifikasi tentang Alatan, Cuaca dan Lokasi Astrofotografi","iconType":"scale","iconUrl":"../assets/icons/bm56-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Astrofotografi & Olahan Maklumat","voiceCaption":"Kejayaan merakam keindahan Bimasakti melalui astrofotografi bergantung pada empat faktor iaitu alatan teleskop dan kamera digital, cuaca cerah serta lokasi gelap tanpa pencemaran cahaya.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam bahagian Indahnya Bimasakti daripada Majalah Dunia Sains, kita meneroka seni dan sains astrofotografi — teknik merakam imej objek samawi seperti galaksi Bimasakti, bulan dan bintang! Di bawah S P tiga perpuluhan lima perpuluhan satu, murid perlu mengolah maklumat daripada pelbagai sumber serta membuat justifikasi tentang empat syarat utama astrofotografi: pertama, alatan berkualiti seperti teleskop dan kamera digital berkemampuan dedahan panjang; kedua, faktor cuaca tanpa litupan awan tebal atau hujan; ketiga, lokasi jauh dari lampu bandar bagi mengelakkan pencemaran cahaya; dan keempat, ketepatan masa pencerapan!","title":"3.5.1 Olahan Maklumat & Justifikasi Astrofotografi Bimasakti","acronym":"ALAT•CUACA","hook":"Lihat bagaimana empat syarat astrofotografi digabungkan menjadi penulisan berjustifikasi tinggi!","summary":"Astrofotografi bukan sekadar hobi fotografi, malah menyumbang kepada dokumentasi astronomi, pendidikan sains angkasa dan pelancongan langit gelap.","bullets":["Syarat Kejayaan Astrofotografi: (1) Alatan — teleskop, tripod kukuh dan kamera digital sensitif cahaya, (2) Cuaca — langit cerah bebas awan, (3) Lokasi — kawasan luar bandar/tinggi yang bebas pencemaran cahaya.","Kepentingan Astrofotografi: Mendokumentasikan fenomena astronomi (gerhana, hujan meteor), menyemai minat STEM dalam kalangan remaja dan menarik ekopelancongan langit malam.","Kemahiran SP 3.5.1: Mengolah fakta daripada bahan grafik/artikel majalah kepada perenggan penulisan dengan justifikasi rasional."],"examTip":"Dalam soalan mengolah maklumat bahan grafik (SP 3.5.1), gabungkan semua kata kunci rajah ('Alatan', 'Cuaca', 'Lokasi') dengan kata hubung keterangan seperti 'supaya' dan 'agar' untuk menjelaskan justifikasinya."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Justifikasi Pemilihan Lokasi Astrofotografi","voiceCaption":"Susun segmen ayat untuk menghasilkan olahan berjustifikasi tentang kepentingan memilih lokasi gelap dan cuaca cerah bagi astrofotografi.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk satu perenggan olahan maklumat astrofotografi yang lengkap!","prompt":"Susun ayat berikut membentuk perenggan justifikasi faktor kejayaan astrofotografi:","hint":"Mulakan dengan keperluan lokasi bebas pencemaran cahaya, diikuti peranan cuaca cerah, keperluan teleskop/kamera dan manfaatnya...","answerTokens":["Pemilihan lokasi pencerapan yang jauh daripada kawasan bandar amat penting dalam bidang astrofotografi.","Hal ini demikian kerana ketiadaan pencemaran cahaya tiruan membolehkan kamera digital merakam cahaya bintang Bimasakti yang malap dengan jelas.","Selain itu, keadaan cuaca yang cerah tanpa litupan awan tebal memastikan teleskop dapat memfokus objek samawi dengan tepat.","Tegasnya, gabungan lokasi strategik, cuaca baik dan alatan sesuai menjadikan rakaman astronomi lebih bermutu tinggi."],"distractors":["Tambahan pula, astrofotografi paling sesuai dilakukan di bawah lampu stadium yang terang.","Oleh itu, gambar bulan perlu dirakam ketika ribut petir berlaku."],"explanation":"Urutan huraian lokasi -> sebab saintifik (pencemaran cahaya) -> cuaca/alatan -> penegas memenuhi kehendak SP 3.5.1."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Komponen Astrofotografi & Justifikasinya","voiceCaption":"Padankan empat elemen pencerapan bintang dalam Tema 6 dengan sebab teknikalnya.","voiceScript":"[curious] Padankan elemen astrofotografi daripada Majalah Dunia Sains dengan fungsinya yang tepat!","prompt":"Padankan elemen astrofotografi berikut dengan peranannya:","pairs":[{"id":"bm56u2m1","left":"Teleskop & Kamera Digital","right":"Mengumpul cahaya objek angkasa jauh dan merakam imej beresolusi tinggi"},{"id":"bm56u2m2","left":"Lokasi Luar Bandar / Tanah Tinggi","right":"Mengelakkan pencemaran cahaya lampu neon bandar"},{"id":"bm56u2m3","left":"Cuaca Cerah Tanpa Awan","right":"Memastikan laluan pandangan ke jalur Bimasakti tidak terhalang"},{"id":"bm56u2m4","left":"Laras Sastera Sajak Bimasakti","right":"Menyerlahkan keindahan ciptaan alam semesta melalui diksi puitis"}],"explanation":"Buku teks menggabungkan fakta saintifik astrofotografi dengan kreativiti mencipta sajak bertema bimasakti."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Utama Pencerapan Bandar","voiceCaption":"Pilih faktor utama yang menyebabkan jalur Bimasakti sukar dirakam di pusat bandar raya.","voiceScript":"[confident] Mengapakah pencerapan dan rakaman galaksi Bimasakti sukar dilakukan di tengah-tengah ibu kota pada waktu malam?","prompt":"Apakah punca UTAMA langit malam di kawasan bandar raya sukar dirakam dalam astrofotografi?","options":["Pencemaran cahaya daripada lampu jalan dan bangunan menenggelamkan cahaya bintang yang malap","Teleskop hanya boleh berfungsi di tepi pantai berombak besar","Kamera digital rosak apabila menghala ke arah bintang","Bimasakti hanya wujud di kawasan kutub utara sahaja"],"correctIndex":0,"explanation":"Pencemaran cahaya bandar mengurangkan kontras langit malam sehingga bintang redup dan galaksi Bimasakti tidak kelihatan."}]},{"id":"bm56-u3","title":"Unit 3: Nanoteknologi, Kultur Tisu Pisang & Hidrogen","subtitle":"SP 1.7.1, 3.5.2 & 4.3.1 — Hujah Nanoteknologi 'Sidang Zentaron', Kultur Tisu (Fusarium/Moko) & Potensi Hidrogen","iconType":"scale","iconUrl":"../assets/icons/bm56-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Nanoteknologi, Kultur Tisu & Hidrogen","voiceCaption":"Bioteknologi kultur tisu menyelamatkan tanaman pisang daripada penyakit Layu Fusarium dan Moko, manakala nanoteknologi dan tenaga hidrogen memacu teknologi hijau masa hadapan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bahagian Kecil tetapi Raksasa memperkenalkan nanoteknologi melalui petikan Sidang Zentaron karya Alias bin Derais untuk S P satu perpuluhan tujuh perpuluhan satu iaitu berhujah secara rasional dan bertatasusila sama ada menerima atau menolak teknologi zarah bersaiz nano! Seterusnya, melalui S P tiga perpuluhan lima perpuluhan dua dan empat perpuluhan tiga perpuluhan satu, kita mengolah maklumat proses penghasilan Kultur Tisu Pisang daripada pengambilan sulur sihat, pembasmian kuman, pemindahan ke medium permulaan, penggandaan tunas hingga pemindahan ke polibeg selepas empat hingga enam minggu untuk menentang penyakit Layu Fusarium dan penyakit Moko, di samping meneroka Potensi Hidrogen sebagai bahan api bersih!","title":"3.5.2 & 4.3.1 Kultur Tisu Pisang, Nanoteknologi & Tenaga Hidrogen","acronym":"NANO•TISU","hook":"Semak 4 peringkat Kultur Tisu Pisang dan aplikasi drama nanoteknologi dalam makmal!","mediaKey":"bm56_kultur_tisu","summary":"Pengolahan maklumat proses bioteknologi dan penulisan skrip drama sains memerlukan susunan langkah kronologi, penanda wacana tepat dan hujah pro-kontra yang seimbang.","bullets":["4 Peringkat Kultur Tisu Pisang (SP 3.5.2): (1) Tisu pemula daripada sulur sihat dirapikan dan disterilkan; (2) Dimasukkan ke medium permulaan; (3) Dipindahkan ke medium baharu untuk penggandaan tunas & pengakaran; (4) Selepas 4–6 minggu, dipindahkan ke polibeg.","Kelebihan Kultur Tisu: Menghasilkan benih seragam bebas penyakit Layu Fusarium dan Moko dalam kuantiti besar.","Nanoteknologi & Hidrogen (SP 1.7.1 & 4.3.1): Nanoteknologi memanipulasi jirim skala nanometer (10^-9 m) untuk perubatan/bahan pintar; hidrogen berpotensi menggantikan bahan api fosil tanpa pelepasan karbon."],"labId":"bm56_penulisan_ilmiah_drama_lab","labTitle":"Makmal Kultur Tisu & Skrip Drama Sains (SP 3.5.2 & 4.3.1)","labProps":{"t":"kultur"},"examTip":"Semasa menulis karangan proses (SP 3.5.2), wajib gunakan penanda wacana urutan kronologi: 'Pada peringkat pertama...', 'Seterusnya...', 'Selepas itu...', 'Akhir sekali, selepas empat hingga enam minggu...'."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun 4 Peringkat Kultur Tisu Pisang","voiceCaption":"Susun keempat-empat peringkat penghasilan anak pokok kultur tisu pisang mengikut urutan makmal yang tepat.","voiceScript":"[confident] Susun semula empat peringkat proses kultur tisu pisang daripada pengambilan sulur hingga ke polibeg!","prompt":"Susun langkah penghasilan kultur tisu pisang berikut mengikut urutan kronologi yang betul:","hint":"Bermula dengan pembasmian kuman tisu sulur, medium permulaan, penggandaan tunas/akar dan polibeg...","answerTokens":["1. Tisu pemula daripada sulur pisang yang baik dirapikan dan dibasmi kuman.","2. Tisu pemula dimasukkan ke dalam medium permulaan secara steril.","3. Tunas dipindahkan ke medium baharu bagi penggandaan tunas dan penghasilan akar.","4. Selepas empat hingga enam minggu, anak pokok dipindahkan ke dalam polibeg."],"distractors":["Anak pokok terus dituai buahnya pada hari pertama di dalam tabung uji.","Tisu pemula direbus di dalam minyak panas sebelum ditanam."],"explanation":"Urutan aseptik 4 peringkat ini menjamin anak pokok pisang bebas daripada patogen Layu Fusarium dan Moko."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Teknologi Masa Hadapan Tema 6","voiceCaption":"Padankan empat konsep sains dan teknologi daripada Tema 6 dengan manfaat atau peranannya.","voiceScript":"[curious] Padankan keempat-empat bidang inovasi sains Tema enam ini dengan penerangannya!","prompt":"Padankan teknologi berikut dengan kegunaannya mengikut Tema 6:","pairs":[{"id":"bm56u3m1","left":"Kultur Tisu Pisang","right":"Menghasilkan anak pokok seragam dan rintang penyakit Layu Fusarium & Moko"},{"id":"bm56u3m2","left":"Nanoteknologi (Sidang Zentaron)","right":"Kejuruteraan bahan dan perubatan bersaiz zarah nano berketepatan tinggi"},{"id":"bm56u3m3","left":"Potensi Tenaga Hidrogen","right":"Sumber tenaga alternatif bersih yang mengurangkan pencemaran karbon"},{"id":"bm56u3m4","left":"Alat Fizik I-Force","right":"Memvisualisasikan daya berat dan daya normal pada objek seimbang"}],"explanation":"Keempat-empat inovasi ini menggambarkan spektrum Sains, Teknologi dan Inovasi Tingkatan 5."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Etika Berhujah Menerima atau Menolak Teknologi","voiceCaption":"Pilih cara berhujah yang betul mengikut SP 1.7.1 semasa membahaskan penggunaan nanoteknologi dalam skrip drama.","voiceScript":"[confident] Apabila membahaskan kelebihan dan risiko nanoteknologi di bawah S P satu perpuluhan tujuh perpuluhan satu, bagaimanakah seseorang murid patut menolak hujah pihak lawan?","prompt":"Bagaimanakah cara menolak hujah rakan secara rasional dan bertatasusila (SP 1.7.1) dalam isu nanoteknologi?","options":["Menghargai pandangan rakan terlebih dahulu sebelum mengemukakan bukti saintifik dan pertimbangan etika keselamatan yang seimbang","Menjerit dan menuduh rakan anti-kemajuan tanpa mengemukakan sebarang fakta","Mengabaikan terus soal keselamatan alam sekitar dan kesan sampingan zarah nano","Menamatkan perbincangan dengan mengejek gaya pertuturan rakan"],"correctIndex":0,"explanation":"Perbincangan bertatasusila menimbang bukti rasional tanpa menyerang peribadi pihak lawan."}]},{"id":"bm56-u4","title":"Unit 4: Sintaksis Lanjutan Ayat Terbitan & Penulisan Ilmiah","subtitle":"SP 5.3.2 & 3.5.2 — Transformasi Ayat Dasar -> Ayat Terbitan serta Penanda Wacana Hubung Kait Maklumat","iconType":"crown","iconUrl":"../assets/icons/bm56-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Transformasi Ayat & Penanda Wacana","voiceCaption":"Penguasaan ayat terbitan melatih pelajar menukar ayat aktif, pasif, songsang dan ayat majmuk berangkai dalam penulisan laporan sains.","voiceScript":"[warm] Selamat datang ke Unit empat! Sebelum menghadapi Cabaran Boss Tema enam, mari kita kukuhkan kecekapan menukar bentuk ayat di bawah S P lima perpuluhan tiga perpuluhan dua dan S P tiga perpuluhan lima perpuluhan dua! Ingat, setiap ayat terbitan bermula daripada empat pola ayat dasar iaitu F N tambah F N, F N tambah F K, F N tambah F A, dan F N tambah F S N. Apabila kita menyusun semula ayat 'Penyelidik bioteknologi memindahkan tunas pisang ke dalam polibeg' menjadi ayat pasif atau ayat songsang, makna asas wajib kekal sama! Pada masa sama, hubung kait maklumat proses sains dengan penanda wacana sebab-akibat dan urutan seperti 'sehubungan dengan itu', 'oleh yang demikian' dan 'hal ini memastikan'!","title":"Transformasi Ayat Terbitan (SP 5.3.2) & Wacana Penulisan Ilmiah","acronym":"4•POLA•AT","hook":"Pastikan transformasi ayat aktif ke pasif dan songsang menepati kata ganti diri dan penanda wacana ilmiah!","summary":"Ayat terbitan yang gramatis mengekalkan keseimbangan subjek-predikat serta menggunakan penanda wacana yang sesuai bagi menghubung kait maklumat pelbagai sumber.","bullets":["Penyusunan Semula Aktif <-> Pasif: 'Saintis mensterilkan tisu pisang' -> 'Tisu pisang disterilkan oleh saintis' (orang ke-3). Jika orang ke-1: 'Kami mensterilkan...' -> '...kami sterilkan' (TANPA 'di-' dan 'oleh'!).","Penyusunan Semula Ayat Songsang: 'Teknologi hidrogen berpotensi menggantikan petrol' -> 'Berpotensi menggantikan petrol teknologi hidrogen.'","Penanda Wacana Hubung Kait (SP 3.5.2): Urutan ('Pertama sekali', 'Seterusnya'), Sebab-Kesan ('Hasilnya', 'Oleh sebab itu'), Perbandingan ('Berbeza dengan kaedah tradisional')."],"examTip":"Dalam soalan penukaran ayat songsang Kertas 2, anda boleh mengedepankan seluruh predikat atau sebahagian predikat (pendepanan frasa kerja/adjektif/sendi nama) mengikut kesesuaian ayat."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Proses Pengguguran, Penyusunan & Peluasan","voiceCaption":"Kelaskan enam ayat sains berikut mengikut proses penerbitan ayatnya (Pengguguran, Penyusunan Semula atau Peluasan).","voiceScript":"[curious] Uji pengesanan proses ayat terbitan! Asingkan keenam-enam ayat sains Tema enam mengikut proses sintaksisnya.","prompt":"Kelaskan ayat terbitan berikut mengikut proses penerbitan utamanya:","buckets":[{"id":"susun","label":"Penyusunan Semula (Pasif/Songsang)"},{"id":"luas","label":"Peluasan / Pengguguran"}],"items":[{"text":"Benih pisang kultur tisu itu ditanam oleh petani di ladang moden.","bucketId":"susun","note":"Betul! Ayat pasif hasil penyusunan semula daripada ayat aktif."},{"text":"Kamera digital yang beresolusi tinggi diperlukan untuk merakam Bimasakti.","bucketId":"luas","note":"Tepat! Peluasan subjek melalui klausa relatif 'yang'."},{"text":"Amat canggih sekali sistem makmal nanoteknologi baharu itu.","bucketId":"susun","note":"Betul! Ayat songsang (predikat frasa adjektif dikedepankan)."},{"text":"Sterilkan tisu pemula itu sebelum memasukkannya ke dalam medium.","bucketId":"luas","note":"Tepat! Pengguguran subjek perintah 'kamu' + peluasan keterangan masa."},{"text":"Keputusan eksperimen daya itu kami bentangkan di dalam kelas.","bucketId":"susun","note":"Betul! Ayat pasif diri pertama hasil penyusunan semula."},{"text":"Tenaga hidrogen dibangunkan agar pelepasan karbon dapat dikurangkan.","bucketId":"luas","note":"Tepat! Peluasan predikat dengan klausa keterangan tujuan 'agar'."}],"explanation":"Menguasai variasi ayat terbitan menjadikan laras penulisan laporan sains lebih profesional dan gramatis."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Ayat Songsang Gramatis","voiceCaption":"Ramalkan ayat songsang yang betul bagi ayat 'Alat inovasi I-Force memudahkan pelajar memahami keseimbangan daya.'","voiceScript":"[curious] Tukarkan ayat biasa 'Alat inovasi I-Force memudahkan pelajar memahami keseimbangan daya' kepada ayat songsang yang betul!","hook":"Pindahkan seluruh predikat ke hadapan subjek tanpa membuang objek 'pelajar'!","scenario":"Ayat biasa: [Subjek: Alat inovasi I-Force] + [Predikat: memudahkan pelajar memahami keseimbangan daya].","prompt":"Pilih bentuk Ayat Songsang yang BETUL bagi ayat di atas:","options":["Memudahkan pelajar memahami keseimbangan daya alat inovasi I-Force.","Alat inovasi memudahkan pelajar I-Force keseimbangan daya.","Dimudahkan oleh alat inovasi I-Force keseimbangan daya pelajar.","Keseimbangan daya alat inovasi I-Force memudahkan pelajar."],"correctIndex":0,"explanation":"Pendepanan seluruh predikat ('Memudahkan pelajar memahami keseimbangan daya') di hadapan subjek ('alat inovasi I-Force') membentuk ayat songsang yang tepat."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Penghubungkaitan Sumber Maklumat Sains","voiceCaption":"Pilih ayat yang menggunakan penanda wacana hubungan sebab dan kesan paling tepat bagi isu penyakit Layu Fusarium.","voiceScript":"[confident] Pilih ayat yang menghubung kait masalah penyakit tanaman pisang dengan penyelesaian kultur tisu secara tepat!","prompt":"Pilih ayat olahan maklumat SP 3.5.2 yang paling KOHEREN:","options":["Serangan penyakit Layu Fusarium sering menjejaskan hasil ladang; oleh itu, teknik kultur tisu diperkenalkan untuk menghasilkan anak benih yang sihat dan seragam.","Serangan penyakit Layu Fusarium sering menjejaskan hasil ladang; sebaliknya, anak pokok tidak perlu disterilkan.","Teknik kultur tisu mengambil tisu sulur pisang; tambahan pula, astrofotografi memerlukan teleskop.","Penyakit Moko sangat berbahaya; walau bagaimanapun, pisang tidak lagi boleh dimakan."],"correctIndex":0,"explanation":"Penanda wacana 'oleh itu' menghubungkan punca (penyakit Layu Fusarium) dengan penyelesaian bioteknologi (kultur tisu) secara logik."}]},{"id":"bm56-u5","title":"Unit 5: Cabaran Boss Tema 6 — Sains, Teknologi dan Inovasi","subtitle":"Penilaian Bersepadu KSSM Tema 6 T5: Ayat Terbitan, I-Force, Bimasakti, Kultur Tisu, Hidrogen & Nanoteknologi","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Pengenalpastian Proses Ayat Terbitan","voiceCaption":"Pilih pernyataan yang betul mengenai ketiga-tiga proses ayat terbitan dalam bahasa Melayu.","voiceScript":"[excited] Cabaran Boss Tema enam bermula! Pilih pernyataan yang benar tentang proses pengguguran, penyusunan semula dan peluasan ayat!","prompt":"Manakah padanan proses penerbitan ayat (SP 5.3.2) yang TEPAT?","options":["Ayat pasif = Penyusunan Semula | Ayat perintah tanpa subjek = Pengguguran | Penambahan klausa 'yang' = Peluasan","Ayat perintah tanpa subjek = Peluasan | Penambahan klausa 'agar' = Pengguguran | Ayat songsang = Kata Majmuk","Ayat songsang = Pengguguran predikat | Ayat pasif = Kata Ganda | Penambahan kata adjektif = Akronim","Ayat majmuk campuran = Pengguguran kata kerja utama"],"correctIndex":0,"explanation":"Ketiga-tiga proses penerbitan ayat (pengguguran, penyusunan semula, peluasan) diterangkan tepat oleh pilihan A."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Tukaran Pasif Orang Pertama","voiceCaption":"Ramalkan ayat pasif yang betul bagi 'Kami menghasilkan anak pokok pisang kultur tisu di dalam makmal.'","voiceScript":"[curious] Tukarkan ayat aktif kata ganti diri pertama 'Kami menghasilkan anak pokok pisang kultur tisu di dalam makmal' kepada ayat pasif yang gramatis!","hook":"Ingat hukum pasif orang pertama: objek + kami + kata kerja dasar TANPA 'di-' dan 'oleh'!","scenario":"Subjek = Kami (kata ganti diri pertama), Kata kerja = menghasilkan, Objek = anak pokok pisang kultur tisu.","prompt":"Pilih bentuk Ayat Pasif yang BETUL bagi ayat di atas:","options":["Anak pokok pisang kultur tisu kami hasilkan di dalam makmal.","Anak pokok pisang kultur tisu dihasilkan oleh kami di dalam makmal.","Anak pokok pisang kultur tisu kami menghasilkan di dalam makmal.","Di dalam makmal dihasilkan kami anak pokok pisang kultur tisu."],"correctIndex":0,"explanation":"Pasif kata ganti diri pertama/kedua wajib meletakkan kata ganti diri terus di hadapan kata kerja tanpa awalan 'di-' atau kata sendi 'oleh'."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Laporan Proses & Manfaat Inovasi","voiceCaption":"Susun ayat membentuk rumusan bernas tentang kepentingan inovasi teknologi tempatan dalam Tema 6.","voiceScript":"[confident] Susun keempat-empat segmen ini untuk membentuk kesimpulan karangan bertema Sains, Teknologi dan Inovasi!","prompt":"Susun ayat kesimpulan bertema Sains, Teknologi dan Inovasi berikut:","hint":"Mulakan dengan kesimpulan peranan inovasi, contoh bidang (kultur tisu, I-Force, hidrogen), ancaman ketinggalan dan harapan...","answerTokens":["Kesimpulannya, penguasaan sains, teknologi dan inovasi menjadi pemangkin utama kemajuan negara.","Oleh itu, penyelidikan dalam bidang kultur tisu, nanoteknologi dan tenaga hidrogen perlu terus disokong melalui pendidikan STEM.","Jika masyarakat enggan berinovasi, negara bakal ketinggalan dalam persaingan ekonomi global.","Semoga generasi muda berani meneroka ciptaan baharu demi kesejahteraan sejagat dan kelestarian alam."],"distractors":["Justeru, makmal sains dan teleskop tidak perlu disediakan di sekolah.","Tambahan pula, penyakit Layu Fusarium patut dibiarkan merebak."],"explanation":"Rumusan ini menggabungkan semua bidang inovasi Tema 6 dalam struktur penutup yang lengkap."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Bahan Ilmiah Tema 6","voiceCaption":"Padankan empat bahan utama Tema 6 dengan konsep sains atau kemahiran bahasanya.","voiceScript":"[confident] Padankan kesemua empat bahan Tema enam dengan fokus pembelajarannya!","prompt":"Padankan bahan Tema 6 berikut dengan penerangan tepatnya:","pairs":[{"id":"bm56u5m1","left":"Inovasi I-Force","right":"Visualisasi daya paduan sifar dan analisis Ayat Terbitan (SP 5.3.2)"},{"id":"bm56u5m2","left":"Indahnya Bimasakti","right":"Justifikasi alatan, cuaca dan lokasi astrofotografi (SP 3.5.1)"},{"id":"bm56u5m3","left":"Sidang Zentaron","right":"Perbahasan rasional & skrip drama nanoteknologi (SP 1.7.1 & 4.3.1)"},{"id":"bm56u5m4","left":"Kultur Tisu & Hidrogen","right":"Olah maklumat proses bioteknologi & tenaga bersih (SP 3.5.2)"}],"explanation":"Keempat-empat komponen memastikan liputan menyeluruh Tema 6 Sains, Teknologi dan Inovasi."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Semakan Ejaan & Ayat Terbitan","voiceCaption":"Pilih ayat saintifik yang seratus peratus bebas daripada kesalahan ejaan, imbuhan dan struktur ayat terbitan.","voiceScript":"[excited] Soalan penutup Boss Tema enam! Pilih satu-satunya ayat yang paling tepat dari segi ejaan istilah sains dan sintaksis!","prompt":"Pilih ayat bertema sains dan teknologi yang BETUL tatabahasa serta ejaannya:","options":["Penggunaan tenaga hidrogen wajar diperluas oleh kerajaan agar pencemaran udara dapat dikurangkan secara berkesan","Penggunaan tenaga hidrogen wajar diperluaskan oleh kerajaan agar supaya pencemaran berkurang","Bintang di langit malam Bimasakti akan kami cerapi menggunakan teleskop canggih","Anak pokok pisang kultur tisu itu dipindahkan ke dalam polibeg oleh saya selepas enam minggu"],"correctIndex":0,"explanation":"'diperluas' betul (tiada '-kan' pada adjektif 'luas'); pilihan B lewah ('diperluaskan', 'agar supaya'), C salah imbuhan ('cerap' bukan 'cerapi'), D salah pasif orang pertama ('saya pindahkan')."}]}]};</script>

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
