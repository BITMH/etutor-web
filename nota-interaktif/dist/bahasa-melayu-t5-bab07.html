/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t5-bab07","subject":"Bahasa Melayu","subjectGroup":"teras","form":5,"chapterNumber":7,"title":"Pertanian, Penternakan dan Perikanan","subtitle":"Tema 7 BM T5 KSSM — Taman Herba & Justifikasi (Penawar dalam Sajian), Penternakan Ayam Piru & 5 Jenis Ayat Majmuk (SP 5.3.3), FAMA & Gurindam (SP 3.5.1 & 4.3.2), Akuakultur Ikan Hiasan RM340 Juta serta Taman Anggur Khatulistiwa (SP 3.5.2).","estimatedMinutes":27,"themeAccent":"#65a30d","isFreePreview":false,"labScript":"bahasa-melayu-t5-bab07-labs.js","coverIcon":"../assets/icons/bm57-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan lima jenis ayat majmuk dan pengetahuan agromakanan kamu sangat mantap!","combo":"[laughs warmly] Kombo yang sangat luar biasa! [excited] Teruskan ketelitian membezakan ayat majmuk relatif, komplemen dan keterangan!","encourage":"[softly] Hampir tepat... semak semula kata hubung penanda relatif 'yang', komplemen 'bahawa' atau keterangan 'kerana' dan 'sekiranya'!","celebrate":"[excited] Syabas! Tema ketujuh Pertanian, Penternakan dan Perikanan Bahasa Melayu Tingkatan lima berjaya kamu kuasai!"},"units":[{"id":"bm57-u1","title":"Unit 1: Penawar dalam Sajian & Penternakan Ayam Piru","subtitle":"SP 2.1.1 & 5.3.3 — Taman Pokok Herba serta Ayat Majmuk Gabungan, Pancangan (Relatif, Komplemen, Keterangan) & Campuran","iconType":"book","iconUrl":"../assets/icons/bm57-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pokok Herba & 5 Jenis Ayat Majmuk","voiceCaption":"Tema tujuh bermula dengan rundingan pemilihan pokok herba berkhasiat serta analisis lima jenis ayat majmuk daripada petikan penternakan ayam piru Encik Harris.","voiceScript":"[warm] Selamat datang ke Tema tujuh Bahasa Melayu Tingkatan lima, Pertanian Penternakan dan Perikanan! Dalam bahagian Penawar dalam Sajian, kita berunding memilih pokok herba bernilai perubatan seperti kari, tepus tanah, kemangi, telang, asam gelugur, kunyit, cengkih dan senduduk! Seterusnya, dalam surat penternakan ayam piru oleh Encik Harris, kita menguasai S P lima perpuluhan tiga perpuluhan tiga iaitu lima jenis Ayat Majmuk: Ayat Majmuk Gabungan menggunakan kata hubung setara seperti dan serta manakala; Ayat Majmuk Pancangan Relatif menggunakan perkataan 'yang'; Ayat Majmuk Pancangan Komplemen menggunakan perkataan 'bahawa' atau 'untuk'; Ayat Majmuk Pancangan Keterangan menggunakan 'kerana', 'apabila' atau 'sekiranya'; serta Ayat Majmuk Campuran yang menggabungkan beberapa jenis serentak! Terokai kesemua contoh sebenar Tema tujuh dalam makmal!","title":"5.3.3 Lima Jenis Ayat Majmuk & Rundingan Taman Herba","acronym":"GAB•REL•KOM","hook":"Klik kesemua 5 jenis Ayat Majmuk daripada petikan Ayam Piru dalam makmal interaktif!","mediaKey":"bm57_agro_fama","summary":"Ayat majmuk mencantumkan dua atau lebih ayat tunggal; jenisnya dikenal pasti melalui kata hubung utama (setara, relatif, komplemen, keterangan atau campuran).","bullets":["Ayat Majmuk Gabungan: Mencantumkan klausa setara dengan 'dan', 'atau', 'serta', 'selain', 'manakala' ('Baka warisan cepat membesar dan dagingnya banyak pada dada serta paha').","Ayat Majmuk Pancangan Relatif & Komplemen: Relatif menggunakan 'yang' ('Encik Harris ialah penternak ayam piru yang berjaya'); Komplemen menggunakan 'bahawa' atau 'untuk' ('Tahukah saudari bahawa ayam piru dikenali sebagai ayam belanda?').","Ayat Majmuk Pancangan Keterangan & Campuran: Keterangan menggunakan kata hubung syarat/sebab/waktu ('Sekiranya pembesaran ayam ini terbantut, penternak akan rugi'); Campuran menggabungkan lebih daripada satu bentuk majmuk."],"labId":"bm57_ayat_majmuk_lab","labTitle":"Makmal 5 Jenis Ayat Majmuk (SP 5.3.3)","labProps":{"tp":"gabungan"},"examTip":"Ujian pantas membezakan Relatif ('yang') daripada Komplemen ('bahawa'/'untuk'): 'bahawa' melengkapkan kata kerja transitif ('mengetahui bahawa...', 'berharap agar/bahawa...'), manakala 'yang' menerangkan kata nama sebelumya!"},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Jenis Ayat Majmuk Ayam Piru","voiceCaption":"Ramalkan jenis ayat majmuk bagi ayat 'Tahukah saudari bahawa ayam piru juga dikenali sebagai ayam belanda?' daripada halaman 250 buku teks.","voiceScript":"[curious] Perhatikan kata hubung 'bahawa' dalam ayat penternakan ayam piru! Apakah jenis ayat majmuk tersebut mengikut Tatabahasa Dewan?","hook":"Lihat fungsi klausa selepas perkataan 'bahawa' sebagai pelengkap maksud!","scenario":"Ayat buku teks: 'Tahukah saudari bahawa ayam piru juga dikenali sebagai ayam belanda?'","prompt":"Apakah jenis Ayat Majmuk bagi ayat di atas?","options":["Ayat Majmuk Pancangan Komplemen","Ayat Majmuk Gabungan","Ayat Majmuk Pancangan Relatif","Ayat Tunggal Susunan Biasa"],"correctIndex":0,"proofLabId":"bm57_ayat_majmuk_lab","proofState":{"tp":"komplemen"},"explanation":"Kata hubung 'bahawa' berfungsi sebagai kata hubung komplemen yang melengkapkan predikat ayat induk."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Ayat Ayam Piru dengan Jenis Majmuk","voiceCaption":"Padankan lima ayat daripada halaman 250–251 buku teks dengan kategori ayat majmuknya yang tepat.","voiceScript":"[confident] Padankan kesemua lima ayat daripada Tema tujuh ini dengan jenis ayat majmuknya mengikut Tatabahasa Dewan!","prompt":"Padankan ayat Tema 7 berikut dengan jenis ayat majmuknya:","pairs":[{"id":"bm57u1m1","left":"Terdapat dua jenis ayam piru, iaitu baka warisan dan baka komersial.","right":"Ayat Majmuk Gabungan"},{"id":"bm57u1m2","left":"Encik Harris ialah penternak ayam piru yang berjaya.","right":"Ayat Majmuk Pancangan Relatif"},{"id":"bm57u1m3","left":"Tahukah saudari bahawa ayam piru ialah ayam belanda?","right":"Ayat Majmuk Pancangan Komplemen"},{"id":"bm57u1m4","left":"Sekiranya pembesaran ayam terbantut, penternak akan rugi.","right":"Ayat Majmuk Pancangan Keterangan (syarat)"},{"id":"bm57u1m5","left":"Baka warisan ialah baka asal, manakala baka komersial melalui genetik yang moden.","right":"Ayat Majmuk Campuran"}],"explanation":"Kelima-lima contoh ini dipetik tepat mengikut klasifikasi buku teks Tingkatan 5 halaman 250–251."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Pengurusan Anak Ayam Piru & Baka","voiceCaption":"Pilih fakta yang tepat mengenai baka dan penjagaan ayam piru berdasarkan teks Tema 7.","voiceScript":"[confident] Berdasarkan surat penternakan ayam piru oleh Encik Harris, pernyataan manakah yang betul tentang keperluan nutrien dan baka ayam piru?","prompt":"Manakah fakta yang BENAR tentang penternakan ayam piru mengikut teks Tema 7?","options":["Anak ayam piru memerlukan kandungan protein tinggi dalam tiga bulan pertama dan perhatian rapi pada minggu 1–8","Ayat piru tidak boleh membesar jika diberi makanan berprotein","Hanya terdapat satu baka ayam piru sahaja iaitu baka hiasan akuarium","Jabatan Perkhidmatan Veterinar melarang penternakan ayam piru di Pulau Pinang"],"correctIndex":0,"explanation":"Teks menyatakan ayam piru memerlukan protein tinggi pada 3 bulan pertama serta penjagaan rapi peringkat anak (1–8 minggu) dan pembesaran (9–12 minggu)."}]},{"id":"bm57-u2","title":"Unit 2: FAMA Rakan Kongsi Petani & Gurindam Pertanian","subtitle":"SP 3.5.1 & 4.3.2 — Program Agrobazaar Online, GBBS, Karavan Tani & Pasar Tani serta Penciptaan Gurindam","iconType":"scale","iconUrl":"../assets/icons/bm57-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"FAMA & Penciptaan Gurindam SP 4.3.2","voiceCaption":"Lembaga Pemasaran Pertanian Persekutuan atau FAMA membantu petani memasarkan hasil melalui Agrobazaar Online, GBBS, Karavan Tani dan Pasar Tani sambil menginspirasikan penciptaan gurindam.","voiceScript":"[warm] Selamat datang ke Unit dua! Bahagian F A M A: Rakan Kongsi Petani menerangkan bagaimana Lembaga Pemasaran Pertanian Persekutuan mengatasi masalah orang tengah dan memperluas jualan petani menerusi empat saluran utama: Agrobazaar Online secara e-dagang, Gerai Buah-buahan Segar atau G B B S, Karavan Tani bergerak dan Pasar Tani! Di bawah S P tiga perpuluhan lima perpuluhan satu, pelajar mengolah maklumat peranan F A M A serta membuat justifikasi mengapa platform digital seperti Agrobazaar Online berkesan. Seterusnya, S P empat perpuluhan tiga perpuluhan dua melatih murid mencipta gurindam pertanian secara tertib — dua baris serangkap, berima sama a-a, dengan baris pertama menyatakan syarat atau amalan tani dan baris kedua menyatakan hasilnya!","title":"3.5.1 Saluran Pemasaran FAMA & 4.3.2 Seni Cipta Gurindam","acronym":"FAMA•GUR","hook":"Lihat saluran pemasaran FAMA dan struktur gurindam pertanian dalam makmal interaktif!","summary":"FAMA memodenkan rantaian pemasaran pertanian melalui e-dagang dan gerai fizikal sistematik; gurindam tradisional mengungkapkan hikmah pertanian dalam dua baris berima.","bullets":["4 Program Pemasaran FAMA: (1) Agrobazaar Online (pasaran digital terus kepada pembeli), (2) Gerai Buah-buahan Segar / GBBS (gerai standard buah tempatan), (3) Karavan Tani (jualan bergerak ke kawasan perumahan), (4) Pasar Tani (jualan terus tanpa orang tengah).","Justifikasi Manfaat FAMA (SP 3.5.1): Meningkatkan margin keuntungan petani, menjamin harga berpatutan kepada pengguna dan menyeragamkan penggredan serta pembungkusan produk.","Peraturan Mencipta Gurindam (SP 4.3.2): (1) Dua baris serangkap; (2) Rima hujung a-a sejajar; (3) Baris 1 = syarat/usaha tani, Baris 2 = akibat/pulangan hasil."],"labId":"bm57_agromarketing_gurindam_lab","labTitle":"Makmal Strategi FAMA & Gurindam Tani (SP 3.5.1 & 4.3.2)","labProps":{"v":"gurindam"},"examTip":"Jangan samakan gurindam dengan pantun dua kerat! Pantun dua kerat ada pembayang pada baris pertama, sedangkan kedua-dua baris gurindam ialah MAKSUD (syarat -> akibat)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Bina Gurindam Pertanian Berima","voiceCaption":"Susun dua rangkap gurindam bertema pertanian dan FAMA supaya baris syarat, baris jawab dan rima akhirnya tepat.","voiceScript":"[confident] Susun keempat-empat baris ini untuk membentuk dua rangkap gurindam pertanian yang sempurna rima dan maksudnya!","prompt":"Susun baris berikut menjadi dua rangkap gurindam pertanian yang tertib:","hint":"Rangkap 1 berima '-an' (tekun/tanaman -> pulangan), Rangkap 2 berima '-ani' (tani -> berani)...","answerTokens":["Apabila gigih berbudi pada tanah tanaman,","Pasti rezeki melimpah membawa pulangan.","Jika pemasaran dibantu oleh pasar tani,","Usahawan muda tampil melangkah berani."],"distractors":["Buah cempedak di luar pagar,","Ambil galah tolong jolokkan."],"explanation":"Kedua-dua rangkap mengandungi baris syarat ('Apabila...', 'Jika...') dan baris kesan yang berima serasi tanpa pembayang pantun."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Program FAMA & Kelebihannya","voiceCaption":"Padankan empat program FAMA daripada buku teks Tema 7 dengan fungsi pemasaran utamanya.","voiceScript":"[curious] Padankan keempat-empat saluran pemasaran F A M A ini dengan peranan tepatnya!","prompt":"Padankan program FAMA berikut dengan ciri utamanya:","pairs":[{"id":"bm57u2m1","left":"Agrobazaar Online","right":"Platform e-dagang bagi jualan hasil tani dan produk IKS secara dalam talian"},{"id":"bm57u2m2","left":"Gerai Buah-buahan Segar (GBBS)","right":"Rangkaian gerai beridentiti seragam menjual buah tempatan berkualiti"},{"id":"bm57u2m3","left":"Karavan Tani","right":"Kenderaan jualan bergerak terus ke kawasan tumpuan penduduk"},{"id":"bm57u2m4","left":"Pasar Tani","right":"Medan jualan langsung petani kepada pengguna tanpa lapisan orang tengah"}],"explanation":"Kepelbagaian saluran fizikal dan digital memastikan hasil pertanian segar mudah dicapai oleh pengguna."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Perbezaan Gurindam vs Pantun Dua Kerat","voiceCaption":"Pilih pernyataan yang tepat membezakan ciri gurindam daripada pantun dua kerat.","voiceScript":"[confident] Dalam penciptaan puisi S P empat perpuluhan tiga perpuluhan dua, apakah perbezaan utama antara gurindam dengan pantun dua kerat?","prompt":"Apakah perbezaan struktur UTAMA antara gurindam dengan pantun dua kerat?","options":["Kedua-dua baris gurindam mengandungi maksud bertalian syarat dan akibat, manakala pantun mempunyai baris pembayang dan baris maksud","Gurindam wajib mempunyai empat belas baris dalam satu rangkap","Gurindam tidak mempunyai sebarang nilai pengajaran atau rima","Pantun dua kerat hanya membicarakan topik perikanan laut dalam"],"correctIndex":0,"explanation":"Gurindam tidak menggunakan pembayang alam pada baris pertama; baris pertamanya ialah syarat atau sebab kepada baris kedua."}]},{"id":"bm57-u3","title":"Unit 3: Ikan Hiasan RM340 Juta & Taman Anggur","subtitle":"SP 3.5.2 — Spesies Cyprinids, Anabantids & Osteoglossids serta Proses Penanaman Anggur Khatulistiwa & Cuka Kelapa","iconType":"scale","iconUrl":"../assets/icons/bm57-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Ikan Hiasan & Taman Anggur Khatulistiwa","voiceCaption":"Industri ikan hiasan Malaysia menjanakan RM340 juta melalui tiga keluarga spesies popular, manakala penanaman anggur tropika varieti IAC dan Alphonso Lavalle memerlukan penyediaan para serta pemangkasan sistematik.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bahagian Pesona Ikan Hiasan membentangkan potensi ekonomi akuakultur bernilai tiga ratus empat puluh juta ringgit melalui tiga kumpulan spesies popular iaitu Cyprinids seperti ikan mas dan koi, Anabantids seperti ikan laga dan pelaga, serta Osteoglossids seperti ikan kelisa atau arowana, di samping tiga cabaran utama iaitu meningkatkan produktiviti, memajukan inovasi dan jaminan kualiti! Seterusnya, dalam bahagian Taman Anggur Khatulistiwa serta Proses Penghasilan Cuka Air Kelapa Matang, S P tiga perpuluhan lima perpuluhan dua melatih kita mengolah maklumat proses penanaman anggur varieti I A C dan Alphonso Lavalle daripada penyediaan kawasan, penanaman dan pengairan hingga penyelenggaraan seperti pemangkasan, penyediaan para dan pembajaan!","title":"3.5.2 Akuakultur Ikan Hiasan (RM340 Juta) & Penanaman Anggur Tropika","acronym":"IKAN•ANGGUR","hook":"Teliti cabaran industri ikan hiasan dan fasa penanaman serta penyelenggaraan Taman Anggur Khatulistiwa!","mediaKey":"bm57_ikan_hiasan","summary":"Transformasi sektor perikanan dan tanaman bernilai tinggi (anggur khatulistiwa) membuahkan pulangan lumayan apabila teknologi, kualiti dan pengurusan ladang dipatuhi.","bullets":["3 Kumpulan Ikan Hiasan & Cabaran (RM340 Juta): Cyprinids, Anabantids, Osteoglossids; 3 cabaran utama — (1) Meningkatkan produktiviti, (2) Memajukan teknologi & inovasi, (3) Menetapkan jaminan kualiti.","Fasa Penanaman Anggur Khatulistiwa (IAC & Alphonso Lavalle): Penyediaan kawasan -> Penyediaan benih -> Penanaman -> Pengairan -> Kawalan rumpai -> Kawalan penyakit & perosak.","Fasa Penyelenggaraan & Inovasi Produk: Pemangkasan (merangsang tunas buah), Penyediaan para (sokongan menjalar), Pembajaan; selain penghasilan nilai tambah seperti cuka air kelapa matang."],"examTip":"Dalam rumusan dan ulasan (SP 3.5.2), susun fakta 'Cabaran Industri Ikan Hiasan' secara selari dengan langkah mengatasinya (contoh: kualiti air dijaga dengan teknologi penapisan pintar)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Fasa Penanaman vs Penyelenggaraan Anggur","voiceCaption":"Kelaskan enam aktiviti ladang Taman Anggur Khatulistiwa mengikut Fasa Penanaman Awal atau Fasa Penyelenggaraan.","voiceScript":"[curious] Asingkan keenam-enam aktiviti ladang Taman Anggur Khatulistiwa ini antara Fasa Penanaman dengan Fasa Penyelenggaraan!","prompt":"Kelaskan aktiviti tanaman anggur tropika berikut mengikut fasanya dalam buku teks:","buckets":[{"id":"tanam","label":"Fasa Penanaman & Asas"},{"id":"selenggara","label":"Fasa Penyelenggaraan Pokok"}],"items":[{"text":"Penyediaan kawasan ladang, pemilihan benih bermutu dan penanaman","bucketId":"tanam","note":"Betul! Peringkat permulaan A, B dan C dalam jadual buku teks."},{"text":"Pemangkasan dahan secara berkala untuk merangsang pembungaan","bucketId":"selenggara","note":"Tepat! Peringkat kritikal fasa penyelenggaraan anggur tropika."},{"text":"Pemasangan sistem pengairan titis serta kawalan rumpai dan perosak","bucketId":"tanam","note":"Betul! Memastikan pokok muda mendapat air tanpa serangan penyakit."},{"text":"Penyediaan struktur para bagi menyokong sulur paut pokok anggur menjalar","bucketId":"selenggara","note":"Tepat! Pokok anggur bersifat memanjat dan memerlukan para kukuh."},{"text":"Pemilihan varieti tahan iklim panas seperti IAC dan Alphonso Lavalle","bucketId":"tanam","note":"Betul! Varieti yang berjaya dituai di Pantai Timur."},{"text":"Program pembajaan berjadual mengikut peringkat pertumbuhan buah","bucketId":"selenggara","note":"Tepat! Menjamin kemanisan dan saiz gugusan buah anggur."}],"explanation":"Buku teks memecahkan pengurusan Taman Anggur Khatulistiwa kepada fasa Penanaman (A–F) dan fasa Penyelenggaraan (A–C)."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Ikan Hiasan, Anggur & Cuka Kelapa","voiceCaption":"Padankan empat maklumat agromakanan daripada bahagian akhir Tema 7 dengan keterangannya.","voiceScript":"[confident] Padankan istilah akuakultur ikan hiasan dan tanaman nilai tinggi ini dengan maksud tepatnya!","prompt":"Padankan istilah pertanian dan perikanan berikut dengan maklumatnya:","pairs":[{"id":"bm57u3m1","left":"Cyprinids, Anabantids & Osteoglossids","right":"Tiga kumpulan spesies ikan hiasan popular bernilai RM340 juta"},{"id":"bm57u3m2","left":"Pembelajaran Berbalik","right":"Teknik menganalisis bahan sebelum membincangkannya dalam forum kelas"},{"id":"bm57u3m3","left":"IAC & Alphonso Lavalle","right":"Varieti tanaman anggur yang berjaya diusahakan di iklim khatulistiwa"},{"id":"bm57u3m4","left":"Cuka Air Kelapa Matang","right":"Contoh produk nilai tambah bioproses hasil pertanian tempatan"}],"explanation":"Penerokaan tanaman bernilai tinggi, ikan hiasan dan produk hiliran meningkatkan pendapatan usahawan tani."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Sektor Ikan Hiasan Malaysia","voiceCaption":"Pilih tiga cabaran utama industri ikan hiasan negara berdasarkan petikan Tema 7.","voiceScript":"[confident] Mengikut infografik Ikan Hiasan Menjanakan Pulangan tiga ratus empat puluh juta ringgit, apakah tiga cabaran utama yang dihadapi industri ini?","prompt":"Manakah tiga cabaran UTAMA industri ikan hiasan Malaysia mengikut Tema 7?","options":["Meningkatkan produktiviti, memajukan teknologi dan inovasi, serta menetapkan jaminan kualiti","Menghentikan eksport ikan kelisa, menutup semua kolam dan menaikkan cukai","Menggantikan ikan hiasan dengan tanaman pokok kari di dalam akuarium","Mengurangkan keluasan kolam ternakan dan melarang penggunaan penapis"],"correctIndex":0,"explanation":"Buku teks menyenaraikan tiga cabaran jelas: (1) Meningkatkan produktiviti, (2) Memajukan teknologi dan inovasi, (3) Menetapkan jaminan kualiti."}]},{"id":"bm57-u4","title":"Unit 4: Analisis Sintaksis Ayat Majmuk dalam Wacana Tani","subtitle":"SP 5.3.3 — Memisahkan Ayat Majmuk kepada Ayat Tunggal serta Menggabungkan Ayat Tunggal","iconType":"crown","iconUrl":"../assets/icons/bm57-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Cerakinkan & Gabungkan Ayat Majmuk","voiceCaption":"Kemahiran sintaksis Kertas 2 kerap menguji keupayaan mencerakinkan satu ayat majmuk kepada beberapa ayat tunggal dan menggabungkan ayat tunggal menjadi ayat majmuk.","voiceScript":"[warm] Selamat datang ke Unit empat! Salah satu soalan paling popular dalam Bahagian Sintaksis Kertas dua S P M berkaitan rapat dengan S P lima perpuluhan tiga perpuluhan tiga: pertama, MENCERAKINKAN satu ayat majmuk panjang kepada tiga atau empat ayat tunggal lengkap dengan subjek dan predikat; kedua, MENGGABUNGKAN beberapa ayat tunggal menjadi satu ayat majmuk campuran yang lancar! Semasa mencerakinkan ayat yang ada kata hubung relatif 'yang', gantikan 'yang' dengan kata nama yang diterangkannya! Contohnya, 'Encik Harris ialah penternak yang berjaya' dicerakinkan kepada: satu, Encik Harris ialah penternak; dua, Penternak itu berjaya!","title":"Teknik Mencerakin & Menggabung Ayat Majmuk (Sintaksis Kertas 2)","acronym":"CERAKIN•GAB","hook":"Pastikan setiap ayat tunggal hasil cerakinan lengkap bersubjek dan berpredikat tanpa kata hubung tertinggal!","summary":"Mencerakinkan ayat membuang kata hubung majmuk dan mengulang subjek lengkap bagi setiap klausa; menggabungkan ayat memilih kata hubung relatif, komplemen, keterangan atau gabungan yang paling tepat.","bullets":["Teknik Mencerakin Ayat Majmuk: (1) Bulatkan semua kata hubung ('dan', 'yang', 'bahawa', 'kerana', 'agar'); (2) Pisahkan klausa; (3) Ulang kata nama subjek yang digugurkan supaya setiap ayat tunggal lengkap!","Contoh Cerakin: 'Petani menanam anggur kerana hasilnya lumayan.' -> (a) Petani menanam anggur. (b) Hasilnya lumayan.","Contoh Gabung: (a) FAMA membantu petani. (b) Petani memasarkan buah segar. (c) Pemasaran melalui Agrobazaar Online. -> 'FAMA membantu petani memasarkan buah segar melalui Agrobazaar Online agar pendapatan meningkat.'"],"examTip":"Semasa mencerakinkan ayat majmuk, JANGAN tinggalkan kata hubung seperti 'yang' atau 'dan' dalam ayat tunggal hasil cerakinan — kalau masih ada 'kerana' atau 'yang', ayat itu belum menjadi ayat tunggal!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Cerakinan Ayat Majmuk Tepat","voiceCaption":"Ramalkan hasil cerakinan betul bagi ayat 'Penternak itu memelihara ayam piru yang sihat dan membina reban baharu.'","voiceScript":"[curious] Cerakinkan ayat majmuk campuran ini menjadi tiga ayat tunggal yang lengkap subjek dan predikatnya tanpa sebarang kata hubung!","hook":"Ada dua kata hubung: 'yang' dan 'dan' -> mesti menghasilkan 3 ayat tunggal!","scenario":"Ayat majmuk: 'Penternak itu memelihara ayam piru yang sihat dan membina reban baharu.'","prompt":"Pilih hasil cerakinan kepada 3 Ayat Tunggal yang BETUL:","options":["(1) Penternak itu memelihara ayam piru. (2) Ayam piru itu sihat. (3) Penternak itu membina reban baharu.","(1) Penternak itu memelihara ayam piru yang sihat. (2) Membina reban baharu.","(1) Memelihara ayam piru. (2) Sihat dan membina reban baharu.","(1) Penternak itu memelihara ayam piru. (2) Yang sihat. (3) Dan membina reban baharu."],"correctIndex":0,"explanation":"Setiap ayat tunggal wajib mempunyai subjek dan predikat sendiri serta bebas daripada kata hubung 'yang' dan 'dan'."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Gabungkan Ayat Tunggal Menjadi Majmuk","voiceCaption":"Susun segmen berikut untuk menggabungkan ayat tunggal tentang pokok herba menjadi satu ayat majmuk campuran yang gramatis.","voiceScript":"[confident] Gabungkan maklumat tentang taman herba dan pokok kari serta kunyit ini menjadi satu ayat majmuk campuran yang lancar!","prompt":"Susun segmen berikut menjadi satu ayat majmuk campuran yang gramatis:","hint":"Gunakan kata hubung relatif 'yang' dan kata hubung keterangan 'agar' atau 'kerana'...","answerTokens":["Sekolah menubuhkan taman herba","yang ditanam dengan pokok kunyit serta kemangi","kerana tumbuhan tersebut berkhasiat sebagai penawar semula jadi","agar murid menghargai nilai perubatan tradisional."],"distractors":["dan yang bahawa kerana supaya tanpa objek","tetapi pokok kari adalah ikan hiasan air tawar."],"explanation":"Gabungan klausa relatif ('yang') dan dua klausa keterangan ('kerana', 'agar') membentuk ayat majmuk campuran."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Kesalahan Kata Hubung Majmuk","voiceCaption":"Pilih ayat majmuk yang paling betul penggunaan kata hubungnya dalam konteks agropelancongan.","voiceScript":"[confident] Kenal pasti satu-satunya ayat majmuk yang tidak mencampuradukkan kata hubung yang bercanggah maksud!","prompt":"Pilih ayat majmuk yang BETUL penggunaan kata hubungnya:","options":["Walaupun penanaman anggur memerlukan penyediaan para yang teliti, hasilnya tetap lumayan","Walaupun penanaman anggur memerlukan para yang teliti, namun hasilnya tetap lumayan","Pengusaha menyedari yang pasaran ikan hiasan sangat luas di Asia","Oleh kerana harga baja meningkat, maka petani memilih kaedah kompos"],"correctIndex":0,"explanation":"Pasangan 'Walaupun... namun' dan 'Oleh kerana... maka' adalah salah/lewah kerana menggandingkan dua kata hubung serentak; 'menyedari bahawa...' lebih tepat daripada 'menyedari yang...'."}]},{"id":"bm57-u5","title":"Unit 5: Cabaran Boss Tema 7 — Pertanian, Penternakan dan Perikanan","subtitle":"Penilaian Bersepadu KSSM Tema 7 T5: 5 Jenis Ayat Majmuk, FAMA, Gurindam, Ikan Hiasan & Taman Anggur","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Pengelasan 5 Ayat Majmuk","voiceCaption":"Pilih padanan ayat dan jenis ayat majmuknya yang seratus peratus tepat.","voiceScript":"[excited] Cabaran Boss Tema tujuh bermula! Pilih padanan ayat majmuk dan jenisnya yang betul sepenuhnya mengikut Tatabahasa Dewan!","prompt":"Manakah padanan jenis Ayat Majmuk (SP 5.3.3) yang TEPAT?","options":["'Saya berharap bahawa projek anggur berjaya' (Komplemen) & 'Mereka menanam kunyit yang subur' (Relatif)","'Saya berharap bahawa projek berjaya' (Relatif) & 'Mereka menanam kunyit yang subur' (Gabungan)","'Jika hujan turun, petani berehat' (Gabungan) & 'Kari dan kemangi ditanam' (Keterangan)","'Ayam piru memerlukan protein tinggi' (Ayat Majmuk Campuran)"],"correctIndex":0,"explanation":"'bahawa' menandakan pancangan komplemen manakala 'yang' menerangkan kata nama 'kunyit' menandakan pancangan relatif."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Cerakinan Ayat Komplemen","voiceCaption":"Ramalkan cara mencerakinkan 'Guru menjelaskan bahawa ikan kelisa tergolong dalam spesies Osteoglossids.'","voiceScript":"[curious] Cerakinkan ayat pancangan komplemen ini menjadi dua ayat tunggal lengkap tanpa perkataan 'bahawa'!","hook":"Gantikan klausa komplemen sebagai ayat penyata kedua dan beri objek ganti atau ayat penyata tersendiri!","scenario":"Ayat majmuk komplemen: 'Guru menjelaskan bahawa ikan kelisa tergolong dalam spesies Osteoglossids.'","prompt":"Pilih hasil cerakinan kepada 2 Ayat Tunggal yang BETUL:","options":["(1) Guru menjelaskan perkara itu. (2) Ikan kelisa tergolong dalam spesies Osteoglossids.","(1) Guru menjelaskan bahawa. (2) Ikan kelisa spesies Osteoglossids.","(1) Menjelaskan perkara itu. (2) Tergolong dalam spesies Osteoglossids.","(1) Guru menjelaskan. (2) Bahawa ikan kelisa tergolong dalam Osteoglossids."],"correctIndex":0,"explanation":"Untuk mencerakinkan ayat komplemen berobjek, ayat pertama dilengkapkan dengan 'perkara itu'/'hal itu' dan ayat kedua berdiri sebagai ayat penyata lengkap."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Rumusan Agromakanan Moden","voiceCaption":"Susun segmen ayat membentuk kesimpulan wacana pemodenan pertanian, penternakan dan perikanan.","voiceScript":"[confident] Susun keempat-empat segmen ini membentuk kesimpulan karangan bertema Pertanian, Penternakan dan Perikanan!","prompt":"Susun ayat kesimpulan agromakanan moden berikut:","hint":"Mulakan dengan penegasan sektor agromakanan, sokongan FAMA & inovasi, kesan pergantungan import dan harapan...","answerTokens":["Kesimpulannya, sektor pertanian, penternakan dan perikanan berpotensi besar menjana ekonomi berpendapatan tinggi.","Oleh itu, petani wajar memanfaatkan inovasi teknologi serta saluran pemasaran FAMA seperti Agrobazaar Online.","Sekiranya bidang agromakanan terus dimodenkan, kebergantungan negara terhadap makanan import dapat dikurangkan.","Semoga penglibatan generasi muda mengukuhkan jaminan sekuriti makanan negara pada masa hadapan."],"distractors":["Justeru, semua kolam ikan hiasan perlu ditimbus menjadi tempat letak kereta.","Tambahan pula, tanaman anggur tidak memerlukan sistem pengairan langsung."],"explanation":"Penutup merangkum nilai ekonomi agromakanan, peranan FAMA, impak sekuriti makanan dan harapan."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Subtopik Tema 7 T5","voiceCaption":"Padankan empat bahan utama Tema 7 dengan kandungan utamanya.","voiceScript":"[confident] Padankan kesemua empat komponen Tema tujuh ini dengan fokus pembelajarannya!","prompt":"Padankan bahan Tema 7 berikut dengan fokus pembelajarannya:","pairs":[{"id":"bm57u5m1","left":"Penawar dalam Sajian","right":"Justifikasi pemilihan pokok herba (kari, kunyit, telang, senduduk)"},{"id":"bm57u5m2","left":"Kluq! Kluq! Kluq! (Ayam Piru)","right":"5 jenis Ayat Majmuk serta perbandingan baka warisan dan komersial"},{"id":"bm57u5m3","left":"FAMA & Gurindam Tani","right":"Agrobazaar Online, GBBS, Karavan Tani & penciptaan gurindam (SP 4.3.2)"},{"id":"bm57u5m4","left":"Ikan Hiasan & Anggur Khatulistiwa","right":"Eksport RM340 juta serta teknik pemangkasan dan penyediaan para anggur"}],"explanation":"Keempat-empat komponen memastikan liputan Zero-Skip bagi Tema 7."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Semakan Ayat Majmuk Campuran","voiceCaption":"Pilih satu ayat majmuk campuran Tema 7 yang seratus peratus betul tatabahasa dan ejaannya.","voiceScript":"[excited] Soalan penutup Boss Tema tujuh! Pilih satu ayat majmuk campuran yang lengkap, tepat dan bebas daripada sebarang kesalahan bahasa!","prompt":"Pilih ayat majmuk campuran yang seratus peratus BETUL tatabahasanya:","options":["Petani yang mengamalkan teknik pemangkasan sistematik mampu menghasilkan buah anggur bermutu tinggi agar dapat dipasarkan melalui Agrobazaar Online","Walaupun penternakan ayam piru menguntungkan, tetapi penternak yang rajin mesti menjaga kebersihan reban","Usahawan itu memberitahu yang spesies Cyprinids dan Anabantids amat laris oleh kerana warnanya cantik","Jika sekiranya pengairan dijaga dengan baik, maka pokok kunyit akan membesar dengan subur"],"correctIndex":0,"explanation":"Pilihan A menggabungkan klausa relatif ('yang') dan keterangan tujuan ('agar') dengan betul; B/C/D mengandungi ralat 'Walaupun... tetapi', 'yang' ganti 'bahawa', 'oleh kerana', dan 'Jika sekiranya... maka'."}]}]};</script>

  muted: false,
  voiceAutoplay: true,
  answeredCurrent: false,
  activeLabCleanups: []
};

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

        nextBtn.addEventListener("click", function () {

      } else if (canSkip) {

        skipBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
