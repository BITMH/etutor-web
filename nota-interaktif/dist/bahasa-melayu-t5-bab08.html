/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"bahasa-melayu-t5-bab08","subject":"Bahasa Melayu","subjectGroup":"teras","form":5,"chapterNumber":8,"title":"Melancong Mencari Makna","subtitle":"Tema 8 BM T5 KSSM — Pelancongan Mampan & Drama Alam Sekitar (SP 1.8.2), Pulau Mutiara & Ragam Ayat Aktif/Pasif (SP 5.3.4), Pemurnian Wacana Cuti-cuti Borneo (SP 3.6.1) serta Arkeopelancongan Lembah Lenggong (SP 1.7.2 & 4.4.1).","estimatedMinutes":27,"themeAccent":"#0d9488","isFreePreview":false,"labScript":"bahasa-melayu-t5-bab08-labs.js","coverIcon":"../assets/icons/bm58-u1.jpg","editionBadge":"Edisi Multimedia & Tatabahasa Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Syabas! Penguasaan ragam ayat aktif, pasif dan pemurnian bahasa kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Teruskan ketepatan membezakan pasif orang pertama, kedua dan ketiga!","encourage":"[softly] Hampir tepat... semak semula susunan kata ganti diri dalam ayat pasif orang pertama dan kedua!","celebrate":"[excited] Tahniah! Kelapan-lapan tema Bahasa Melayu Tingkatan lima berjaya kamu tamatkan dengan penuh kecemerlangan!"},"units":[{"id":"bm58-u1","title":"Unit 1: Lestarikan Bumi & Ragam Ayat (SP 5.3.4)","subtitle":"SP 1.8.2 & 5.3.4 — Pelancongan Mampan, Boria Pulau Mutiara serta Ragam Ayat Aktif & Pasif (Orang ke-1, 2 & 3)","iconType":"book","iconUrl":"../assets/icons/bm58-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pelancongan Mampan & Ragam Ayat","voiceCaption":"Pelancongan mampan mengimbangi alam sekitar, budaya dan ekonomi, manakala SP 5.3.4 menguji penukaran ragam ayat aktif kepada ayat pasif mengikut kata ganti diri.","voiceScript":"[warm] Selamat datang ke Tema lapan Bahasa Melayu Tingkatan lima, Melancong Mencari Makna! Dalam bahagian Lestarikan Keindahan Bumi Kita, kita menilai karya bahasa berirama Pelancongan Mampan dan drama Antara Alam Sekitar dengan Pembangunan bagi S P satu perpuluhan lapan perpuluhan dua yang menekankan empat tiang kelestarian: sumber semula jadi, kualiti alam sekitar, keharmonian sosial budaya serta pemeliharaan pembangunan fizikal! Seterusnya dalam Mutiara yang Bersinar bertemakan Boria Pulau Pinang, kita menguasai S P lima perpuluhan tiga perpuluhan empat tentang ragam Ayat Aktif dan Ayat Pasif! Ingat peraturan emas: bagi kata ganti diri pertama dan kedua seperti 'kami', 'aku', 'saya' dan 'anda', ayat pasif WAJIB meletakkan kata ganti diri sebelum kata kerja dasar TANPA awalan 'di' dan TANPA 'oleh' — contoh tepat daripada buku teks ialah 'Bukit Bendera dan Taman Negara akan kami kunjungi' serta 'sajak yang aku nukil'! Terokai hukum penuh ragam ayat dalam makmal!","title":"5.3.4 Ragam Ayat Aktif/Pasif & 1.8.2 Pelancongan Mampan","acronym":"AKT•PAS•MAMPAN","hook":"Klik makmal Ragam Ayat untuk membandingkan Ayat Aktif, Pasif Orang 1/2 dan Pasif Orang Ke-3!","mediaKey":"bm58_mutiara_borneo","summary":"Pelancongan mampan menjaga kelestarian alam dan budaya tempatan; penukaran ragam aktif kepada pasif tertakluk pada peraturan kata ganti diri orang pertama, kedua dan ketiga.","bullets":["Pelancongan Mampan (SP 1.8.2): Menilai kekuatan dan kelemahan karya secara kritis berdasarkan 4 aspek — sumber alam lestari, kualiti udara/air, keseimbangan budaya sosial dan pemuliharaan tapak warisan.","Ayat Aktif (SP 5.3.4): Subjek ialah pelaku, kata kerja berawalan 'meN-' ('Kami merentas Jambatan Kedua Pulau Pinang'; 'Kami mengunjungi Bukit Bendera').","Ayat Pasif Orang Ke-1/Ke-2 vs Ke-3: Orang ke-1/2: 'Bukit Bendera akan kami kunjungi' (TIADA 'di-' atau 'oleh'!). Orang ke-3: 'Lagu Boria Pulau Pinang diputarkan oleh juruhebah radio.'"],"labId":"bm58_ragam_ayat_lab","labTitle":"Makmal Ragam Ayat Aktif & Pasif (SP 5.3.4)","labProps":{"rg":"pasif12"},"examTip":"Perangkap klasik SPM Kertas 2: 'Bilik hotel itu telah ditempah oleh kami' adalah SALAH! Pembetulan: 'Bilik hotel itu telah kami tempah.'"},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Ayat Pasif Diri Pertama Tema 8","voiceCaption":"Ramalkan ayat pasif yang betul mengikut buku teks bagi 'Kami akan mengunjungi Bukit Bendera, Muzium Perang dan Fort Cornwallis.'","voiceScript":"[curious] Tukarkan ayat aktif 'Kami akan mengunjungi Bukit Bendera dan Muzium Perang' kepada ayat pasif kata ganti diri pertama yang betul!","hook":"Kekalkan kata bantu 'akan' di hadapan 'kami', bukan 'akan dikunjungi oleh kami'!","scenario":"Subjek pelaku ialah 'Kami' (kata ganti diri pertama); kata bantu aspek ialah 'akan'.","prompt":"Pilih bentuk Ayat Pasif yang BETUL bagi ayat di atas:","options":["Bukit Bendera dan Muzium Perang akan kami kunjungi.","Bukit Bendera dan Muzium Perang akan dikunjungi oleh kami.","Bukit Bendera dan Muzium Perang kami akan kunjungi.","Akan mengunjungi kami Bukit Bendera dan Muzium Perang."],"correctIndex":0,"proofLabId":"bm58_ragam_ayat_lab","proofState":{"rg":"pasif12"},"explanation":"Kata bantu ('akan', 'telah', 'hendak', 'mesti') wajib diletakkan SEBELUM kata ganti diri ('akan kami kunjungi'), bukan di celah 'kami ... kunjungi' dan tanpa 'di-'/'oleh'."},{"type":"sort","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Isih Ayat Aktif vs Ayat Pasif Halaman 251","voiceCaption":"Kelaskan enam ayat daripada buku teks Tema 8 (halaman 251) kepada Ayat Aktif atau Ayat Pasif.","voiceScript":"[curious] Asingkan keenam-enam ayat pelancongan Pulau Pinang daripada halaman dua ratus lima puluh satu buku teks ini kepada Ayat Aktif atau Ayat Pasif!","prompt":"Kelaskan ayat daripada petikan Pulau Mutiara berikut mengikut ragamnya:","buckets":[{"id":"aktif","label":"Ayat Aktif"},{"id":"pasif","label":"Ayat Pasif"}],"items":[{"text":"Kami sudah pun merentas Jambatan Kedua Pulau Pinang.","bucketId":"aktif","note":"Betul! Pelaku 'Kami' menjadi subjek dengan kata kerja 'merentas'."},{"text":"Lagu Boria Pulau Pinang diputarkan oleh stesen radio tempatan.","bucketId":"pasif","note":"Tepat! Objek dikedepankan dan kata kerja berawalan 'di-'."},{"text":"Kami mengambil keputusan untuk turun ke pantai Batu Feringgi.","bucketId":"aktif","note":"Betul! Kata kerja aktif transitif 'mengambil'."},{"text":"Sajak indah itu aku nukil dalam perjalanan ke Pulau Pinang.","bucketId":"pasif","note":"Tepat! Ayat pasif kata ganti diri orang pertama ('aku nukil')."},{"text":"Kami tidak melepaskan peluang untuk menyumbangkan suara.","bucketId":"aktif","note":"Betul! Subjek pelaku aktif dengan imbuhan 'meN-'."},{"text":"Kami mendaftar masuk di hotel yang telah ditempah oleh ayah lebih awal.","bucketId":"pasif","note":"Tepat! Mengandungi klausa pasif 'telah ditempah oleh ayah'."}],"explanation":"Mengenal pasti kata kerja berimbuhan 'meN-' berbanding 'di-' atau 'kata ganti diri 1/2 + kata dasar' menentukan ragam ayat."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Penilaian Kritis Pelancongan Mampan","voiceCaption":"Pilih pernyataan yang tepat mengenai matlamat pelancongan mampan berdasarkan puisi berirama Tema 8.","voiceScript":"[confident] Berdasarkan bahasa berirama Pelancongan Mampan dalam Tema lapan, apakah fokus utama seorang pelancong mampan?","prompt":"Apakah ciri UTAMA konsep Pelancongan Mampan mengikut karya Tema 8?","options":["Mengimbangi kemajuan ekonomi pelancongan dengan pemuliharaan alam semula jadi, budaya serta seni warisan tempatan","Mengutamakan pembinaan bangunan pencakar langit di seluruh hutan simpan tanpa had","Membeli tiket penerbangan ke luar negara tanpa mengambil tahu sejarah destinasi","Mengabaikan kualiti air sungai dan tanah demi keuntungan segera"],"correctIndex":0,"explanation":"Pelancongan mampan memastikan sumber alam lestari, pembangunan sosial harmoni dan tapak fizikal dipulihara."}]},{"id":"bm58-u2","title":"Unit 2: Cuti-cuti Borneo & Pemurnian Bahasa (SP 3.6.1)","subtitle":"SP 3.6.1 — Memurnikan Kesalahan Bahasa, Ejaan, Sendi Nama, Hukum D-M & Kejituan Idea Wacana","iconType":"formula","iconUrl":"../assets/icons/bm58-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Pemurnian Teks Cuti-cuti Borneo","voiceCaption":"Standard pembelajaran tiga perpuluhan enam perpuluhan satu melatih murid mengesan kesalahan ejaan, imbuhan, kata sendi dan kejituan idea dalam petikan Cuti-cuti Borneo.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam bahagian Indahnya Negaraku melalui petikan Cuti-cuti Borneo, kita mempraktikkan kemahiran paling bernilai dalam Kertas dua iaitu S P tiga perpuluhan enam perpuluhan satu: memurnikan kesalahan bahasa dan menganalisis kejituan serta kesinambungan idea dalam pelbagai teks! Antara kesilapan klasik yang perlu anda sunting dalam wacana pelancongan ialah ejaan 'perlancongan' yang sepatutnya 'pelancongan', 'bercuti di masa hadapan' yang sepatutnya 'pada masa hadapan', kata hubung bertindan 'selain daripada itu' yang sepatutnya 'selain itu', serta penggunaan imbuhan pinjaman atau kata kerja pasif yang tidak seragam! Ketahui juga kepentingan kejituan idea — setiap ayat dalam perenggan mesti menyokong satu fokus utama tanpa menyimpang!","title":"3.6.1 Pemurnian Kesalahan Bahasa & Kejituan Idea (Cuti-cuti Borneo)","acronym":"MURNI•JITU","hook":"Klik makmal Pemurnian Wacana untuk melihat senarai kesilapan ejaan dan kejituan idea pelancongan!","summary":"Pemurnian bahasa membetulkan kesalahan morfologi dan sintaksis, manakala analisis kejituan idea memastikan kohesi (tautan bentuk) dan koheren (kesinambungan makna).","bullets":["Kesalahan Ejaan & Sendi Pelancongan: 'perlancongan' -> 'pelancongan'; 'di masa cuti' -> 'pada masa cuti'; 'di dalam negara' -> 'dalam negara' (abstrak/umum); 'antara tempat-tempat' -> 'antara tempat'.","Kesalahan Frasa & Kata Tugas: 'selain daripada itu' -> 'selain itu'; 'oleh kerana' -> 'oleh sebab'; 'memperindahkan pantai' -> 'memperindah pantai'.","Kejituan & Kesinambungan Idea (SP 3.6.1): Menggunakan penanda wacana tepat ('Justeru', 'Walau bagaimanapun') dan menggugurkan ayat terkeluar topik dalam sesuatu perenggan."],"labId":"bm58_pemurnian_arkeopelancongan_lab","labTitle":"Makmal Pemurnian Wacana & Lenggong (SP 3.6.1 & 1.7.2)","labProps":{"pn":"murni"},"examTip":"Bezakan ejaan 'pelancongan' (aktiviti melancong, tiada 'r') daripada 'perancangan' (perbuatan merancang, ada 'r')!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Frasa Murni vs Perlu Dimurnikan","voiceCaption":"Kelaskan enam frasa pelancongan berikut kepada Frasa Murni (Betul) atau Frasa Perlu Dimurnikan (Salah).","voiceScript":"[curious] Asingkan keenam-enam ungkapan bertema pelancongan Borneo ini kepada Frasa Murni atau Frasa yang Perlu Dimurnikan!","prompt":"Kelaskan frasa pelancongan berikut mengikut ketepatan bahasanya:","buckets":[{"id":"murni","label":"Frasa Murni (Gramatis)"},{"id":"ralat","label":"Perlu Dimurnikan (Ralat)"}],"items":[{"text":"sektor pelancongan negara pada masa hadapan","bucketId":"murni","note":"Betul! Ejaan 'pelancongan' dan kata sendi masa 'pada' tepat."},{"text":"industri perlancongan di masa cuti sekolah","bucketId":"ralat","note":"Ralat! Sepatutnya 'pelancongan' dan 'pada masa cuti'."},{"text":"memperindah kawasan pesisir pantai Borneo","bucketId":"murni","note":"Betul! Kata adjektif 'indah' hanya menerima 'memper-' tanpa '-kan'."},{"text":"selain daripada itu, keindahan pulau memukau","bucketId":"ralat","note":"Ralat! Lewah; sepatutnya 'selain itu'."},{"text":"antara destinasi menarik di Sabah termasuklah Gunung Kinabalu","bucketId":"murni","note":"Betul! Tidak menggandakan 'destinasi-destinasi' selepas 'antara'."},{"text":"antara tempat-tempat menarik ialah Taman Negara Bako","bucketId":"ralat","note":"Ralat! Kata 'antara' sudah bermaksud jamak dan diikuti 'termasuklah'."}],"explanation":"Pengesanan ralat ejaan, sendi masa dan kata jamak selepas 'antara' menyumbang markah penuh dalam bahagian penyuntingan."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Jenis Kesalahan Bahasa & Pembetulan","voiceCaption":"Padankan empat kesilapan lazim petikan pelancongan dengan sebab tatabahasanya.","voiceScript":"[confident] Padankan setiap kesilapan bahasa dalam petikan pelancongan dengan penjelasan tatabahasanya yang betul!","prompt":"Padankan kesalahan bahasa berikut dengan sebab tatabahasanya:","pairs":[{"id":"bm58u2m1","left":"'perlancongan' -> 'pelancongan'","right":"Kesalahan ejaan imbuhan pe-...-an bagi kata dasar 'lancong'"},{"id":"bm58u2m2","left":"'di musim cuti' -> 'pada musim cuti'","right":"Kesalahan kata sendi tempat 'di' menggantikan sendi waktu 'pada'"},{"id":"bm58u2m3","left":"'saling hormat-menghormati' -> 'saling menghormati'","right":"Kesalahan kelewahan kata ganda bermakna salingan"},{"id":"bm58u2m4","left":"Menggugurkan ayat terkeluar topik","right":"Memastikan kejituan dan kesinambungan idea perenggan (SP 3.6.1)"}],"explanation":"Pembetulan bukan sekadar menukar ejaan, malah menuntut kefahaman sebab gramatis di sebaliknya."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Analisis Kesinambungan Idea Perenggan","voiceCaption":"Kenal pasti ayat yang MENGGANGGU kejituan idea dalam perenggan mengenai pelancongan ekologi Borneo.","voiceScript":"[confident] Dalam perenggan yang menghuraikan keindahan ekopelancongan Taman Negara Mulu dan Gunung Kinabalu, ayat manakah yang menjejaskan kejituan idea?","prompt":"Ayat manakah yang MENJEJASKAN kejituan idea perenggan bertema ekopelancongan Borneo?","options":["Harga telefon pintar keluaran baharu meningkat sebanyak lima peratus pada bulan lalu.","Gua batu kapur dan kepelbagaian flora menjadi tarikan penyelidik dari seluruh dunia.","Pemandu pelancong terlatih memastikan pengunjung mematuhi laluan denai hutan yang ditetapkan.","Oleh itu, ekopelancongan di Sarawak dan Sabah menjanakan ekonomi komuniti tempatan secara lestari."],"correctIndex":0,"explanation":"Isu harga telefon pintar langsung tidak berkaitan dengan fokus ekopelancongan Borneo sekali gus merosakkan kesatuan idea perenggan."}]},{"id":"bm58-u3","title":"Unit 3: Arkeopelancongan Lembah Lenggong","subtitle":"SP 1.7.2 & 4.4.1 — Bukit Bunuh, Gua Badak, Gua Kajang & Strategi Rundingan Promosi Warisan UNESCO","iconType":"scale","iconUrl":"../assets/icons/bm58-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Lembah Lenggong & Rundingan Promosi","voiceCaption":"Lembah Lenggong Perak menempatkan tapak arkeologi Bukit Bunuh, Gua Badak dan Gua Kajang yang sesuai dipromosikan melalui pakej murid dan multimedia kreatif.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bahagian Lenggong Oh Lenggong memperkenalkan konsep arkeopelancongan di Lembah Lenggong, Perak — Tapak Warisan Dunia U N E S C O yang berpusat di Pusat Lapangan Arkeologi U S M serta merangkumi tapak prasejarah Bukit Bunuh, Gua Badak, Gua Kajang dan Galeri Arkeologi Lembah Lenggong! Melalui S P satu perpuluhan tujuh perpuluhan dua, kita berunding secara kritis untuk mencadangkan cara paling berkesan mempromosikan arkeopelancongan seperti pakej murid dua hari satu malam, lawatan berpandu penyelidik arkeologi dan persembahan drama multimedia untuk S P empat perpuluhan empat perpuluhan satu! Kenali potensi tapak bersejarah ini dengan mendalam.","title":"1.7.2 & 4.4.1 Arkeopelancongan Lembah Lenggong & Multimedia","acronym":"UNESCO•ARKEO","hook":"Lihat keistimewaan Bukit Bunuh, Gua Badak, Gua Kajang dan strategi promosi arkeopelancongan!","mediaKey":"bm58_lembah_lenggong","summary":"Arkeopelancongan memulihara tapak prasejarah sebagai produk pelancongan ilmu; persembahan drama multimedia dan pakej pendidikan meningkatkan tarikan pelawat muda.","bullets":["Tarikan Lembah Lenggong (Perak): Pusat Lapangan Arkeologi USM, Bukit Bunuh (kesan hentaman meteorit & alat batu paleolitik), Gua Badak (lukisan gua arang), Gua Kajang dan Galeri Arkeologi Lembah Lenggong.","Strategi Promosi Rundingan (SP 1.7.2): Pakej murid 2 hari 1 malam dengan penginapan tersedia, jelajah gua berpandu pakar, serta dokumentari digital media sosial.","Persembahan Drama Multimedia (SP 4.4.1): Menggabungkan skrip lakonan berkesan, audio latar, tayangan foto artifak serta pencahayaan dramatik bagi menghidupkan kisah prasejarah."],"examTip":"Dalam soalan perundingan SP 1.7.2, pertimbangkan faktor kos pelajar, pemeliharaan tapak sensitif dan daya tarikan visual apabila mengukuhkan cadangan promosi terbaik."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Hujah Rundingan Promosi Lenggong","voiceCaption":"Susun bahagian hujah rundingan bagi mempromosikan pakej arkeopelancongan Lembah Lenggong kepada sekolah.","voiceScript":"[confident] Susun keempat-empat segmen hujah ini menjadi usul rundingan promosi arkeopelancongan Lembah Lenggong yang meyakinkan!","prompt":"Susun segmen berikut membentuk hujah rundingan promosi arkeopelancongan yang padu:","hint":"Mulakan dengan cadangan pakej murid dan multimedia, sebab tarikan artifak Bukit Bunuh/Gua Badak, kawalan pemuliharaan dan kesimpulan...","answerTokens":["Saya berpendapat bahawa pakej lawatan murid dua hari satu malam yang digabungkan dengan video multimedia ialah cara paling berkesan.","Hal ini demikian kerana pelajar dapat menerokai sendiri Bukit Bunuh, Gua Badak dan Galeri Arkeologi Lembah Lenggong secara berpandu.","Pada masa sama, kawalan jumlah pelawat memastikan artifak serta lukisan gua tidak rosak oleh pengunjung.","Kesimpulannya, pendekatan pendidikan dan pelancongan mampan ini menjadikan Lembah Lenggong destinasi ilmu bertaraf dunia."],"distractors":["Sebaliknya, semua artifak prasejarah patut dibenarkan dibawa pulang oleh murid.","Selain itu, gua batu kapur wajar diratakan menjadi padang golf."],"explanation":"Hujah rundingan menggabungkan keberkesanan promosi, pengalaman amali murid serta jaminan pemuliharaan tapak UNESCO."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Tapak & Elemen Arkeopelancongan","voiceCaption":"Padankan komponen arkeopelancongan Lembah Lenggong daripada buku teks dengan maklumatnya.","voiceScript":"[curious] Padankan lokasi dan institusi arkeologi Lembah Lenggong ini dengan peranannya!","prompt":"Padankan komponen Lembah Lenggong berikut dengan huraiannya:","pairs":[{"id":"bm58u3m1","left":"Pusat Lapangan Arkeologi USM","right":"Pangkalan penyelidikan saintifik dan penerokaan tapak prasejarah Lenggong"},{"id":"bm58u3m2","left":"Bukit Bunuh & Gua Badak","right":"Tapak penemuan alat batu paleolitik serta lukisan arang prasejarah"},{"id":"bm58u3m3","left":"Galeri Arkeologi Lembah Lenggong","right":"Mempamerkan artifak sejarah termasuk rangka manusia prasejarah"},{"id":"bm58u3m4","left":"Drama Multimedia Arkeologi","right":"Gabungan lakonan pentas, video visual dan audio untuk menghidupkan sejarah"}],"explanation":"Lembah Lenggong menggabungkan nilai penyelidikan USM, khazanah gua prasejarah dan pelancongan ilmu."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kelebihan Persembahan Drama Multimedia","voiceCaption":"Pilih sebab utama persembahan drama berbentuk multimedia berkesan mempromosikan Lembah Lenggong.","voiceScript":"[confident] Mengapakah pementasan drama bertemakan arkeopelancongan dalam bentuk multimedia disarankan dalam S P empat perpuluhan empat perpuluhan satu?","prompt":"Apakah kelebihan utama mempersembahkan drama arkeopelancongan dalam bentuk multimedia (SP 4.4.1)?","options":["Menggabungkan lakonan berkesan dengan paparan visual gua, bunyi alam dan maklumat arkeologi agar mudah dikongsi secara digital","Menghapuskan keperluan skrip, dialog dan watak pelakon sepenuhnya","Memaksa pelancong menghafal koordinat GPS tanpa melihat gambar","Mengurangkan minat pelajar terhadap sejarah tanah air"],"correctIndex":0,"explanation":"Multimedia memperkaya pengalaman emosi penonton serta membolehkan karya dimuat naik ke platform digital untuk promosi meluas."}]},{"id":"bm58-u4","title":"Unit 4: Transformasi Ragam Ayat Aktif & Pasif Lanjutan","subtitle":"SP 5.3.4 — Menukar Pelbagai Bentuk Ayat Aktif, Pasif (Orang ke-1, 2, 3), Ayat Perintah & Ayat Tanya","iconType":"crown","iconUrl":"../assets/icons/bm58-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Transformasi Ragam Ayat SPM","voiceCaption":"Penguasaan penuh SP 5.3.4 memerlukan kebolehan menukar ayat aktif berobjek tunggal atau berganda kepada ayat pasif yang tepat termasuk bagi ayat tanya dan ayat perintah.","voiceScript":"[warm] Selamat datang ke Unit empat! Sebelum menghadapi Cabaran Boss terakhir Bahasa Melayu Tingkatan lima, mari kita mantapkan kemahiran S P lima perpuluhan tiga perpuluhan empat untuk soalan sintaksis S P M Kertas dua! Pertama, apabila menukar ayat aktif dengan kata ganti diri kedua 'anda' atau 'awak', seperti 'Anda perlu mematuhi peraturan Taman Negara', ayat pasifnya ialah 'Peraturan Taman Negara perlu anda patuhi' — kata bantu 'perlu' kekal sebelum 'anda' dan imbuhan 'me-' gugur menjadi 'patuhi'! Kedua, jika kata kerja berimbuhan 'memper-...-kan' seperti 'kami mempersembahkan drama', apabila dipasifkan dengan kata ganti diri pertama, awalan 'me-' sahaja digugurkan supaya menjadi 'Drama itu kami persembahkan'! Ketiga, dalam ayat tanya pasif, partikel '-kah' boleh hadir di hujung subjek predikat yang dipasifkan!","title":"Transformasi Ragam Ayat Lanjutan (Imbuhan memper- & Kata Bantu)","acronym":"PER•PASIF","hook":"Perhatikan bagaimana 'mempersembahkan' bertukar menjadi 'kami persembahkan' dan 'dipersembahkan oleh mereka'!","summary":"Dalam ayat pasif orang pertama dan kedua, hanya awalan 'meN-' digugurkan manakala imbuhan 'per-...-kan' atau '-i' kekal bersama kata ganti diri di hadapannya.","bullets":["Hukum Imbuhan Pasif Orang 1 & 2: 'Kami mempersembahkan drama' -> 'Drama itu kami persembahkan' (gugur 'me-', kekal 'per-...-kan'!).","Hukum Ayat Kerja Dua Objek: 'Pemandu pelancong menunjukkan gambar Gua Badak kepada murid' -> 'Gambar Gua Badak ditunjukkan oleh pemandu pelancong kepada murid.'","Kedudukan Kata Bantu Aspek/Ragam: 'telah', 'sedang', 'akan', 'mesti', 'perlu', 'dapat' WAJIB diletakkan SEBELUM pelaku pertama/kedua ('mesti anda patuhi', bukan 'anda mesti patuhi')."],"examTip":"Semak setiap kali menukar ayat aktif -> pasif: adakah kata ganti dirinya 'saya/aku/kita/kami/anda/kamu/awak/tuanku/baginda'? Ingat, 'baginda' atau 'mereka' ialah orang KETIGA maka guna 'di-... oleh baginda/mereka'!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Struktur Pasif Betul vs Salah","voiceCaption":"Kelaskan enam ayat pasif pelancongan berikut kepada Struktur Pasif Betul atau Struktur Pasif Salah.","voiceScript":"[curious] Uji kepekaan sintaksis ayat pasif kamu! Asingkan keenam-enam ayat pelancongan ini kepada Struktur Pasif Betul atau Struktur Pasif Salah!","prompt":"Kelaskan ayat pasif berikut mengikut ketepatan hukum tatabahasanya:","buckets":[{"id":"betul","label":"Struktur Pasif Betul"},{"id":"salah","label":"Struktur Pasif Salah"}],"items":[{"text":"Drama arkeologi itu telah kami persembahkan di dewan sekolah.","bucketId":"betul","note":"Betul! Kata bantu 'telah' di depan 'kami' dan gugur awalan 'mem-'."},{"text":"Pakej Lembah Lenggong itu akan disertai oleh anda minggu depan.","bucketId":"salah","note":"Salah! 'anda' ialah kata ganti diri ke-2; sepatutnya 'akan anda sertai'."},{"text":"Kebersihan Pulau Aman mesti kita pelihara bersama-sama.","bucketId":"betul","note":"Betul! Kata bantu 'mesti' mendahului 'kita' dan kata dasar 'pelihara'."},{"text":"Masakan nasi kandar itu saya telah nikmati di Pulau Pinang.","bucketId":"salah","note":"Salah! Kata bantu 'telah' tidak boleh diselit antara 'saya' dan 'nikmati'."},{"text":"Artifak Bukit Bunuh itu dipamerkan oleh kurator di galeri khas.","bucketId":"betul","note":"Betul! Pelaku orang ketiga ('kurator') menggunakan 'di-... oleh'."},{"text":"Peraturan gua itu kita mesti patuhi demi keselamatan semua.","bucketId":"salah","note":"Salah! Sepatutnya 'mesti kita patuhi'."}],"explanation":"Pematuhan hukum kata ganti diri dan kedudukan kata bantu adalah penentu utama markah penuh sintaksis ayat pasif."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Tukaran Pasif 'memperkenalkan' (Orang ke-2)","voiceCaption":"Ramalkan ayat pasif yang betul bagi 'Anda perlu memperkenalkan warisan Boria Pulau Pinang kepada generasi muda.'","voiceScript":"[curious] Tukarkan ayat aktif 'Anda perlu memperkenalkan warisan Boria Pulau Pinang kepada generasi muda' kepada ayat pasif kata ganti diri kedua!","hook":"Perhatikan kata bantu 'perlu', pelaku 'anda', dan imbuhan 'mem-per-kenalkan'!","scenario":"Ayat aktif: 'Anda perlu memperkenalkan warisan Boria Pulau Pinang kepada generasi muda.'","prompt":"Pilih ayat pasif yang paling GRAMATIS bagi ayat di atas:","options":["Warisan Boria Pulau Pinang perlu anda perkenalkan kepada generasi muda.","Warisan Boria Pulau Pinang anda perlu perkenalkan kepada generasi muda.","Warisan Boria Pulau Pinang perlu diperkenalkan oleh anda kepada generasi muda.","Warisan Boria Pulau Pinang perlu anda kenal kepada generasi muda."],"correctIndex":0,"explanation":"Kata bantu 'perlu' mendahului 'anda', dan awalan 'mem-' digugurkan supaya kekal 'perkenalkan'."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ayat Pasif dengan Kata Kerja 'Kena'","voiceCaption":"Pilih ayat yang menggunakan bentuk pasif kata 'kena' secara tepat mengikut Tatabahasa Dewan.","voiceScript":"[confident] Pilih ayat pasif menggunakan kata 'kena' yang betul bagi konteks pemeliharaan alam sekitar!","prompt":"Pilih ayat pasif berstruktur 'kena' yang BETUL:","options":["Pelancong yang merosakkan batu karang itu kena denda oleh pihak taman laut.","Pelancong yang merosakkan batu karang itu didenda kena oleh taman laut.","Batu karang itu kena rosak akan pelancong.","Kami kena nikmati nasi kandar Pulau Pinang pagi tadi."],"correctIndex":0,"explanation":"Menurut Tatabahasa Dewan, 'kena' digunakan bersama kata kerja dasar tanpa imbuhan ('kena denda', 'kena saman') sebagai ragam pasif."}]},{"id":"bm58-u5","title":"Unit 5: Cabaran Boss Tema 8 — Melancong Mencari Makna","subtitle":"Penilaian Penutup BM Tingkatan 5: Ragam Ayat Aktif/Pasif, Pemurnian Cuti-cuti Borneo & Lenggong","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Semakan Ragam Ayat SP 5.3.4","voiceCaption":"Pilih ayat yang kesemuanya menepati hukum ayat aktif dan ayat pasif bahasa Melayu.","voiceScript":"[excited] Cabaran Boss Tema lapan bermula! Pilih satu-satunya ayat yang betul struktur pasifnya mengikut Tatabahasa Dewan!","prompt":"Pilih ayat pasif yang seratus peratus BETUL tatabahasanya:","options":["Keindahan Taman Negara Pulau Pinang dan Pulau Aman akan kami lawati hujung bulan ini.","Keindahan Taman Negara Pulau Pinang dan Pulau Aman akan dilawati oleh kami hujung bulan ini.","Keindahan Taman Negara Pulau Pinang kami akan lawati pada hujung bulan ini.","Oleh kami dilawati keindahan Pulau Aman pada hujung bulan ini."],"correctIndex":0,"explanation":"Kata bantu 'akan' mendahului 'kami' dan kata kerja mengekalkan akhiran '-i' tanpa 'di-' atau 'oleh' ('akan kami lawati')."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Pemurnian Cuti-cuti Borneo","voiceCaption":"Ramalkan ayat yang memurnikan kesemua kesalahan bahasa dalam draf artikel pelancongan Borneo.","voiceScript":"[curious] Ramalkan ayat yang membetulkan kesemua tiga kesalahan dalam ayat 'Sektor perlancongan di masa hadapan dijangka maju selain daripada itu rakyat beruntung'!","hook":"Betulkan 'perlancongan', 'di masa hadapan' dan 'selain daripada itu'!","scenario":"Draf Borneo mengandungi kesilapan ejaan imbuhan, kata sendi masa dan penanda wacana lewah.","prompt":"Pilih ayat pemurnian SP 3.6.1 yang paling GRAMATIS:","options":["Sektor pelancongan pada masa hadapan dijangka pesat; selain itu, pendapatan komuniti tempatan turut meningkat.","Sektor perlancongan di masa hadapan dijangka maju; selain daripada itu, rakyat beruntung.","Sektor pelancongan di masa hadapan pesat; oleh kerana itu, penduduk gembira.","Industri perlancongan pada masa depan pesat selain daripada itu budaya terjaga."],"correctIndex":0,"explanation":"'pelancongan', 'pada masa hadapan' dan 'selain itu' membetulkan kesemua ralat dengan kohesi idea yang mantap."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Wacana Pelancongan Mampan","voiceCaption":"Susun segmen ayat membentuk kesimpulan wacana Melancong Mencari Makna yang menyatukan alam sekitar, budaya dan arkeopelancongan.","voiceScript":"[confident] Susun keempat-empat segmen ini untuk melengkapkan kesimpulan terakhir Bahasa Melayu Tingkatan lima!","prompt":"Susun ayat kesimpulan bertema Melancong Mencari Makna berikut:","hint":"Mulakan dengan kesimpulan nilai pengembaraan, cadangan promosi mampan dan Lembah Lenggong, risiko pencemaran serta harapan...","answerTokens":["Kesimpulannya, aktiviti pelancongan bukan sekadar hiburan, malah menjadi wahana menghargai warisan dan alam sekitar.","Oleh itu, destinasi unik seperti Pulau Mutiara, Borneo dan Lembah Lenggong wajar dipromosikan berteraskan pelancongan mampan.","Sekiranya kelestarian ekologi dan tapak prasejarah diabaikan, khazanah bernilai negara pasti musnah.","Semoga generasi berilmu terus memelihara keindahan tanah air agar kekal terpelihara sepanjang zaman."],"distractors":["Justeru, semua tapak arkeologi Gua Kajang perlu ditutup daripada penyelidik.","Tambahan pula, pelancong tidak perlu mematuhi peraturan taman negara."],"explanation":"Kesimpulan merangkum seluruh tema 8 daripada Pulau Mutiara, Borneo hingga Lembah Lenggong secara matang."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Subtopik Tema 8 T5","voiceCaption":"Padankan empat bahan utama Tema 8 dengan fokus pembelajarannya.","voiceScript":"[confident] Padankan kesemua empat bahan utama Tema lapan dengan kemahiran K S S M masing-masing!","prompt":"Padankan komponen Tema 8 berikut dengan fokus pembelajarannya:","pairs":[{"id":"bm58u5m1","left":"Pelancongan Mampan (Puisi & Drama)","right":"Merumus kekuatan dan kelemahan karya secara kritis (SP 1.8.2)"},{"id":"bm58u5m2","left":"Mutiara yang Bersinar (Boria)","right":"Aplikasi ragam Ayat Aktif & Pasif pelbagai pelaku (SP 5.3.4)"},{"id":"bm58u5m3","left":"Indahnya Negaraku (Borneo)","right":"Pemurnian kesalahan bahasa & kejituan idea teks (SP 3.6.1)"},{"id":"bm58u5m4","left":"Lenggong, Oh, Lenggong!","right":"Rundingan promosi arkeopelancongan & drama multimedia (SP 1.7.2 & 4.4.1)"}],"explanation":"Keempat-empat komponen melengkapkan keseluruhan Tema 8 Melancong Mencari Makna."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Penutup: Tukar Pasif kepada Aktif","voiceCaption":"Pilih ayat aktif yang paling tepat bagi ayat pasif 'Tapak arkeologi Bukit Bunuh telah anda terokai bersama-sama pasukan USM.'","voiceScript":"[excited] Soalan penutup keseluruhan Bahasa Melayu Tingkatan lima! Tukarkan ayat pasif 'Tapak arkeologi Bukit Bunuh telah anda terokai bersama-sama pasukan U S M' kepada ayat aktif yang gramatis!","prompt":"Pilih bentuk Ayat Aktif yang BETUL bagi 'Tapak arkeologi Bukit Bunuh telah anda terokai bersama-sama pasukan USM':","options":["Anda telah menerokai tapak arkeologi Bukit Bunuh bersama-sama pasukan USM.","Pasukan USM telah diterokai oleh anda di Bukit Bunuh.","Anda telah diterokai tapak arkeologi Bukit Bunuh bersama-sama pasukan USM.","Bukit Bunuh telah menerokai anda bersama-sama pasukan USM."],"correctIndex":0,"explanation":"Pelaku 'Anda' menjadi subjek hadapan, kata bantu 'telah' kekal sebelum kata kerja aktif 'menerokai' (awalan meN- kembali), dan objek 'tapak arkeologi Bukit Bunuh' mengikuti kata kerja."}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();

    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
