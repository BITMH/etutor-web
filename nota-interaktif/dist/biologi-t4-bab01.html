  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab01","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":1,"title":"Pengenalan kepada Biologi dan Peraturan Makmal","subtitle":"Subtopik 1.1-1.4 KSSM — Bidang Biologi & Kerjaya Revolusi Industri 4.0, PPE & Sisa Biologi Kategori A-D, Jadual/Graf/Lukisan/Satah Anatomi serta 8 Langkah Penyiasatan Saintifik.","estimatedMinutes":25,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t4-bab01-labs.js","coverIcon":"../assets/icons/bio41-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Asas Biologi dan peraturan keselamatan makmal kamu sangat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Setiap bidang, kategori sisa dan satah anatomi berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak semula panduan P P E, kategori sisa biologi dan paksi graf di bawah.","celebrate":"[excited] Tahniah! Satu lagi unit Biologi Tingkatan empat Bab satu berjaya kamu takluki!"},"units":[{"id":"bio41-u1","title":"Unit 1: Bidang Biologi, Sumbangan & Kerjaya","subtitle":"Subtopik 1.1 — Bios & Logos, 5 Bidang Kajian, Sumbangan Teknologi Biologi & Kerjaya Moden","iconType":"atom","iconUrl":"../assets/icons/bio41-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Maksud & Bidang Biologi","voiceCaption":"Biologi berasal daripada perkataan Yunani bios (hidup) dan logos (kajian), merangkumi botani, fisiologi, ekologi, genetik dan mikrobiologi.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan empat, Bab satu, Pengenalan kepada Biologi dan Peraturan Makmal! Perkataan biologi berasal daripada bahasa Yunani, iaitu bios yang bermaksud hidup, dan logos yang bermaksud kajian. Biologi mengkaji struktur dan fungsi organisma hidup serta interaksinya dengan persekitaran semula jadi. Lima bidang kajian asas yang perlu kamu kuasai ialah botani, fisiologi, ekologi, genetik dan mikrobiologi, selain bidang moden seperti bioinformatik, nanobioteknologi dan pencetakan bio tiga dimensi!","title":"1.1 Maksud Biologi & Bidang Kajian Utama","acronym":"B•F•E•G•M","hook":"Biologi bukan sekadar menghafal nama organ — teknologi pencetakan bio 3D kini mampu mencetak tisu tiruan dan perancah cangkerang untuk rawatan pergigian!","mediaKey":"bio41_bidang_biologi","summary":"Biologi ialah kajian terperinci tentang hidupan serta hubungannya dengan alam sekitar, berkembang pesat melalui bioteknologi, nanobioteknologi dan bioinformatik.","bullets":["5 Bidang Asas Biologi: Botani (kajian kehidupan tumbuhan), Fisiologi (kajian fungsi dan mekanisme dalam organisma), Ekologi (interaksi organisma dengan persekitaran), Genetik (kajian pewarisan dan variasi genetik) serta Mikrobiologi (kajian mikroorganisma).","Kemajuan Revolusi Industri 4.0 & Inovasi Malaysia: Bidang baharu merangkumi bioteknologi, nanobioteknologi dan bioinformatik. Teknik bioprinting 3D mencetak tisu tiruan dalam kejuruteraan perubatan, manakala penyelidik Malaysia berjaya menghasilkan perancah biologi daripada cangkerang hidupan laut untuk rawatan pergigian."],"labId":"bio41_bidang_kerjaya_lab","labTitle":"Penjelajah Bidang Biologi & Kerjaya I.R. 4.0","labProps":{"tab":"bidang"},"examTip":"Skema S.P.M.: Pastikan kamu dapat membezakan Fisiologi (fungsi dan mekanisme tubuh) daripada Ekologi (hubungan antara organisma dan persekitaran)."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Bidang Kajian Biologi","voiceCaption":"Padankan lima bidang kajian biologi berikut dengan fokus kajian yang tepat.","voiceScript":"[curious] Mari uji kepantasan kamu mengenal pasti skop kajian setiap cabang biologi! Padankan lima bidang di sebelah kiri dengan huraian tepatnya di sebelah kanan.","prompt":"Padankan bidang biologi berikut dengan fokus kajiannya yang betul:","pairs":[{"id":"b1","left":"Botani","right":"Kajian terperinci tentang struktur dan kehidupan tumbuhan"},{"id":"b2","left":"Fisiologi","right":"Kajian tentang fungsi dan mekanisme proses dalam organisma"},{"id":"b3","left":"Ekologi","right":"Kajian interaksi antara organisma hidup dengan persekitarannya"},{"id":"b4","left":"Genetik","right":"Kajian tentang pewarisan ciri dan variasi genetik antara generasi"},{"id":"b5","left":"Mikrobiologi","right":"Kajian terhadap mikroorganisma seperti bakteria, kulat dan virus"}],"explanation":"Lima cabang utama Biologi T4 ialah Botani (tumbuhan), Fisiologi (fungsi/mekanisme), Ekologi (interaksi persekitaran), Genetik (pewarisan/variasi) dan Mikrobiologi (mikroorganisma)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Sumbangan & Kerjaya Biologi","voiceCaption":"Pengetahuan biologi menyumbang besar dalam perubatan, farmaseutikal, pengeluaran makanan dan pertanian moden.","voiceScript":"[warm] Bagaimanakah biologi mengubah kehidupan harian kita? Dalam bidang perubatan, kita ada persenyawaan in vitro, perancangan keluarga dan terapi gen. Dalam bidang farmaseutikal pula, insulin sintetik, vaksin dan vitamin dihasilkan. Dalam sektor makanan, mikroorganisma membantu penghasilan keju, kicap, tapai dan tempe, manakala dalam pertanian moden terdapat tanaman transgenik serta teknologi hidroponik dan aeroponik!","title":"Sumbangan Biologi dalam Kehidupan & Laluan Kerjaya","acronym":"P•F•M•P","hook":"Daripada penghasilan tempe tradisional hingga pegawai bioinformatik yang mencipta ubat dengan teknologi maklumat — semua berakar daripada Biologi!","mediaKey":"bio41_biotek_makanan","summary":"Aplikasi biologi merentasi sektor perubatan, farmaseutikal, pemprosesan makanan dan pertanian lestari serta membuka kerjaya masa hadapan.","bullets":["Perubatan & Farmaseutikal: Perubatan merangkumi persenyawaan in vitro (IVF), perancangan keluarga, pembedahan plastik dan terapi gen; farmaseutikal menghasilkan vitamin sintetik, vaksin, insulin dan enzim sintetik.","Makanan, Pertanian & Kerjaya: Penapaian mikroorganisma menghasilkan keju, kicap, tapai dan tempe; pertanian menggunakan tanaman serta haiwan transgenik, hidroponik dan aeroponik. Contoh kerjaya termasuk ahli bioinformatik, ahli biologi hidupan liar, ahli mikrobiologi, pegawai perubatan dan ahli botani."],"labId":"bio41_bidang_kerjaya_lab","labTitle":"Papan Sumbangan Biologi & Padanan Kerjaya","labProps":{"tab":"sumbangan"},"examTip":"Contoh tempatan Malaysia yang kerap disoal: penggunaan mikroorganisma dalam penghasilan tapai, tempe dan kicap (Makanan), bukan Farmaseutikal."},{"type":"sort","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Isih Sumbangan Biologi","voiceCaption":"Kelaskan enam aplikasi biologi berikut mengikut sektor Perubatan dan Farmaseutikal atau Makanan dan Pertanian.","voiceScript":"[confident] Jom kelaskan keenam-enam aplikasi biologi ini dengan pantas! Bezakan antara aplikasi dalam sektor Perubatan dan Farmaseutikal berbanding sektor Pengeluaran Makanan dan Pertanian.","prompt":"Isihkan sumbangan biologi berikut ke dalam sektor yang tepat:","buckets":[{"id":"med","label":"Perubatan & Farmaseutikal"},{"id":"agri","label":"Makanan & Pertanian"}],"items":[{"text":"Persenyawaan in vitro (IVF) dan terapi gen untuk merawat penyakit baka","bucketId":"med","note":"Tepat! IVF dan terapi gen ialah kemajuan sektor perubatan."},{"text":"Penghasilan insulin sintetik, vaksin dan enzim sintetik secara komersial","bucketId":"med","note":"Betul! Ini tergolong dalam sumbangan bidang farmaseutikal."},{"text":"Penggunaan mikroorganisma untuk membuat keju, kicap, tapai dan tempe","bucketId":"agri","note":"Tepat! Penapaian mikrob ialah aplikasi pengeluaran makanan."},{"text":"Penanaman sayuran melalui teknologi hidroponik dan aeroponik tanpa tanah","bucketId":"agri","note":"Betul! Hidroponik dan aeroponik meningkatkan hasil pertanian."},{"text":"Pembangunan tanaman dan haiwan transgenik yang tahan penyakit","bucketId":"agri","note":"Tepat! Organisma transgenik digunakan meluas dalam pertanian moden."},{"text":"Penggunaan perancah biologi cangkerang dan bioprinting 3D dalam pembedahan","bucketId":"med","note":"Betul! Teknologi kejuruteraan tisu ini menyokong rawatan perubatan."}],"explanation":"Sektor Perubatan & Farmaseutikal memfokuskan rawatan dan ubat (IVF, terapi gen, vaksin, insulin), manakala Makanan & Pertanian melibatkan penapaian (tapai, tempe, keju, kicap) serta teknik tanaman moden."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Cabaran Kerjaya Revolusi 4.0","voiceCaption":"Pilih bidang biologi dan kerjaya yang tepat bagi pakar yang menggabungkan teknologi maklumat untuk menghasilkan ubat.","voiceScript":"[curious] Soalan aplikasi kerjaya! Seorang graduan menggunakan teknologi maklumat dan analisis data genom untuk mereka bentuk ubat baharu. Apakah bidang dan kerjaya yang paling tepat menggambarkan tugasnya?","prompt":"Seorang saintis menggunakan teknologi maklumat, perisian komputer dan pangkalan data genetik untuk membangunkan ubat baharu. Apakah bidang serta kerjaya yang paling tepat?","options":["Bioinformatik — Ahli Bioinformatik","Ekologi — Ahli Biologi Hidupan Liar","Botani — Ahli Agronomi Tumbuhan","Fisiologi — Pegawai Pemuliharaan Hutan"],"correctIndex":0,"explanation":"Bioinformatik menggabungkan biologi molekul, sains komputer dan teknologi maklumat untuk menganalisis data biologi dan mereka bentuk ubat atau terapi farmaseutikal."}]},{"id":"bio41-u2","title":"Unit 2: Keselamatan Makmal & Pengurusan Sisa Biologi","subtitle":"Subtopik 1.2 — 10 Peralatan Keselamatan, Bahan Sinki, Sisa Kategori A-D & SOP Tumpahan Merkuri","iconType":"scale","iconUrl":"../assets/icons/bio41-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Peralatan Keselamatan Makmal","voiceCaption":"Kenali lima kelengkapan perlindungan diri pada murid dan lima kemudahan keselamatan kekal di dalam makmal biologi.","voiceScript":"[warm] Keselamatan ialah keutamaan nombor satu di dalam makmal biologi! Murid wajib memakai gogal, topeng muka, sarung tangan makmal dan baju makmal serta mencuci tangan dengan bahan pencuci tangan. Di dalam makmal pula terdapat lima kemudahan kekal: stesen pancuran kecemasan, stesen pencuci mata, kebuk wasap untuk gas berbahaya seperti klorin, kabinet aliran lamina bagi aliran udara bertapis bersih, dan kabinet keselamatan biologi untuk mengkaji patogen!","title":"1.2 Peralatan Perlindungan Diri (PPE) & Kabinet Makmal","acronym":"K•L•B•P•M","hook":"Jangan tertukar tiga kabinet kaca makmal: Kebuk Wasap untuk gas kimia berbahaya, Kabinet Aliran Lamina untuk ruang kerja steril, dan Kabinet Keselamatan Biologi untuk patogen!","mediaKey":"bio41_kabinet_keselamatan","videoClip":{"src":"../assets/biologi-t4-bab01/video/bio41_video_makmal_biologi_narasi.mp4","hasNarration":true,"posterKey":"bio41_kabinet_keselamatan","caption":"Video Penerangan Bersuara (BM): Keselamatan makmal biologi, kategori pelupusan sisa biologi, satah anatomi dan aras organisasi sel"},"summary":"Setiap kelengkapan perlindungan diri dan peralatan kekal makmal mempunyai fungsi khusus bagi mencegah kecederaan kimia, wap beracun dan jangkitan patogen.","bullets":["5 PPE pada Murid: Gogal (lindung mata daripada bahan kimia berbahaya), Topeng muka (elak terhidu asap, wap dan debu), Sarung tangan makmal (kendali sampel biologi), Pencuci tangan (singkir kuman pada tangan) dan Baju makmal (lindung kulit dan pakaian daripada percikan bahan berbahaya).","5 Kemudahan Kekal Makmal: Stesen pancuran kecemasan (bilas kulit/badan terkena bahan kimia), Stesen pencuci mata (basuh mata terkena bahan berbahaya), Kebuk wasap (elak terhidu gas berbahaya seperti klorin, bromin dan nitrogen dioksida), Kabinet aliran lamina (bekal aliran udara bertapis untuk ruang kerja bersih) dan Kabinet keselamatan biologi (ruang kerja tertutup untuk mengkaji bahan tercemar patogen)."],"labId":"bio41_ppe_sisa_lab","labTitle":"Inspektor PPE, Sisa Kategori A-D & SOP Tumpahan","labProps":{"tab":"ppe"},"examTip":"Bezakan tepat: Kebuk wasap -> gas berbahaya (klorin, bromin, NO2); Kabinet keselamatan biologi -> bahan tercemar patogen; Kabinet aliran lamina -> aliran udara bertapis ruang bersih."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Pilih Kabinet Keselamatan Tepat","voiceCaption":"Ramalkan radas keselamatan yang wajib digunakan apabila seorang penyelidik mengkaji sampel bakteria patogen berjangkit.","voiceScript":"[curious] Bayangkan kamu perlu memindahkan kultur bakteria patogen yang boleh menjangkiti saluran pernafasan. Kabinet manakah yang wajib dipilih dan apakah kesannya jika tersalah guna?","hook":"Uji pilihan kabinet makmal di Inspektor PPE selepas menjawab!","scenario":"Seorang pelajar makmal perlu mengendalikan sampel biologi yang disyaki mengandungi bakteria patogen berbahaya di atas meja kerja.","prompt":"Peralatan manakah yang wajib digunakan bagi memastikan patogen terkurung dan tidak terlepas ke udara makmal?","options":["Kabinet keselamatan biologi kerana ia menyediakan ruang kerja tertutup khusus bagi bahan yang tercemar oleh patogen","Kebuk wasap biasa kerana ia meniup wap terus ke luar tingkap tanpa penapisan patogen","Kabinet aliran lamina terbuka kerana ia menghembus udara bertapis ke arah muka pengguna","Stesen pancuran kecemasan kerana ia mensteril bakteria dengan air bertekanan tinggi"],"correctIndex":0,"proofLabId":"bio41_ppe_sisa_lab","proofState":{"tab":"ppe","pick":"bsc"},"explanation":"Kabinet keselamatan biologi menyediakan ruang kerja tertutup bertekanan terkawal dan penapisan khas untuk mengkaji bahan yang tercemar atau berkemungkinan tercemar oleh patogen."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Pembuangan Sinki & Sisa A-D","voiceCaption":"Hanya bahan pH lima hingga sembilan dan larutan kepekatan rendah tidak berbahaya boleh dibuang ke sinki; sisa biologi diurus mengikut Kategori A hingga D.","voiceScript":"[warm] Tidak semua bahan boleh dituang ke dalam sinki! Hanya bahan ber nilai p H antara lima hingga sembilan serta cecair kepekatan rendah tidak berbahaya seperti larutan sukrosa dan air suling dibenarkan. Bagi sisa biologi pula, kita ikut Prosedur Operasi Piawai empat kategori: Kategori A untuk alat tajam, Kategori B untuk pepejal bukan tajam yang diautoklaf pada seratus dua puluh satu darjah Celsius dan lima belas p s i selama dua puluh minit, Kategori C untuk bangkai haiwan yang dibungkus dan disejuk beku, dan Kategori D untuk cecair biologi seperti darah!","title":"Bahan Sinki & Prosedur Operasi Piawai Sisa Biologi (Kategori A–D)","acronym":"A•B•C•D","summary":"Sisa makmal dikawal ketat mengikut julat pH 5–9 untuk sinki dan Prosedur Operasi Piawai empat kategori sisa biologi (A hingga D) sebelum pelupusan.","bullets":["Sinki (Boleh vs Dilarang): BOLEH dibuang ke sinki — bahan nilai pH 5–9 dan cecair/larutan kepekatan rendah tidak berbahaya (larutan sukrosa, larutan pewarna, air suling). DILARANG dibuang ke sinki — pelarut organik (aseton, alkohol, benzena), pH < 5 atau pH > 9, asid/gris/minyak/hidrogen peroksida, sisa pepejal (kaca, getah), logam berat (merkuri), bahan meruap, toksik, sisa organik (mikroorganisma, bangkai), reaktif dan radioaktif.","4 Kategori Sisa Biologi: Kat A (tajam: picagari, jarum, kaca, skalpel -> tong khas sisa tajam tanpa perlu disteril); Kat B (pepejal bukan tajam: sarung tangan, tisu, piring petri, agar mengeras -> beg plastik biobahaya tahan autoklaf, disteril 121°C, 15 psi selama 20 minit lalu masuk tong biobahaya); Kat C (bangkai haiwan, organ, tisu -> balut bahan penyerap spt tisu, masuk beg biobahaya & sejuk beku); Kat D (cecair: kultur kaldu, darah -> nyahkontaminasi secara autoklaf dan buang segera)."],"labId":"bio41_ppe_sisa_lab","labTitle":"Simulator Pengelasan Sisa Biologi & Sinki","labProps":{"tab":"sisa"},"examTip":"Angka wajib hafal Kertas 1 & 2: Pensterilan autoklaf bagi penyahkontaminasian sisa biologi ialah suhu 121°C, tekanan 15 psi selama 20 minit!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Sisa & Sinki Makmal","voiceCaption":"Kelaskan enam bahan buangan makmal berikut ke dalam tong sisa tajam Kategori A, pengurusan biobahaya Kategori B C D, atau boleh dibuang ke sinki.","voiceScript":"[confident] Mari uji pemahaman SOP pelupusan makmal kamu! Kelaskan enam bahan sisa berikut sama ada ke Kategori A, Kategori B C D, atau selamat dibuang ke dalam sinki.","prompt":"Kelaskan bahan sisa berikut mengikut kaedah pelupusan yang betul:","buckets":[{"id":"kata","label":"Kategori A (Sisa Tajam)"},{"id":"katbcd","label":"Kategori B/C/D (Biobahaya)"},{"id":"sinki","label":"Boleh Dibuang ke Sinki"}],"items":[{"text":"Jarum picagari, bilah skalpel dan serpihan kaca radas","bucketId":"kata","note":"Tepat! Sisa tajam dimasukkan ke tong khas sisa tajam dan tidak perlu disteril."},{"text":"Piring petri berisi agar kultur bakteria yang telah mengeras","bucketId":"katbcd","note":"Betul! Ini sisa Kategori B yang wajib dibungkus beg biobahaya dan diautoklaf."},{"text":"Organ dalaman dan tisu bangkai tikus selepas pembedahan","bucketId":"katbcd","note":"Tepat! Sisa Kategori C dibalut bahan penyerap, dimasukkan beg biobahaya dan disejuk beku."},{"text":"Kultur kaldu cecair dan sampel darah selepas eksperimen","bucketId":"katbcd","note":"Betul! Sisa cecair Kategori D perlu diautoklaf sebelum dibuang segera."},{"text":"Larutan sukrosa berkepekatan rendah dan air suling (pH 7)","bucketId":"sinki","note":"Tepat! Cecair tidak berbahaya dengan pH 5-9 boleh dialirkan ke sinki."},{"text":"Sarung tangan terpakai dan kertas tisu tercemar sampel biologi","bucketId":"katbcd","note":"Betul! Pepejal bukan tajam Kategori B dilarang masuk tong sampah biasa."}],"explanation":"Kategori A (jarum/kaca/skalpel) masuk ke tong khas sisa tajam; Kategori B (pepejal bukan tajam) & D (cecair) diautoklaf; Kategori C (bangkai/tisu) disejuk beku; manakala larutan pH 5–9 tidak berbahaya boleh ke sinki."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"SOP Tumpahan & Amalan Makmal","voiceCaption":"Pelajari perbezaan langkah mengurus tumpahan bahan kimia umum menggunakan pasir berbanding tumpahan merkuri menggunakan serbuk sulfur.","voiceScript":"[warm] Bagaimana pula jika termometer kaca terjatuh dan merkuri tertumpah di atas lantai makmal? Langkah bagi tumpahan kimia umum dan tumpahan merkuri bermula sama: maklumkan kepada guru atau pembantu makmal, kemudian jadikan tempat tumpahan sebagai kawasan larangan. Namun bagi tumpahan kimia umum, sekat dengan pasir, kaut dan buang dengan selamat; manakala bagi tumpahan merkuri yang beracun, taburkan serbuk sulfur untuk menutupinya dan hubungi pihak bomba! Selain itu, patuhi etika pakaian berkasut bertutup serta larangan makan dan minum di dalam makmal.","title":"Mengurus Tumpahan Kimia, Merkuri & Amalan Keselamatan Makmal","acronym":"M•L•S•B","summary":"Tumpahan kimia umum disekat dengan pasir dan dikaut, manakala tumpahan merkuri wajib ditabur serbuk sulfur serta dilaporkan kepada pihak bomba.","bullets":["Tumpahan Bahan Kimia Umum vs Merkuri: (1) Maklumkan kepada guru/pembantu makmal -> (2) Jadikan tempat tumpahan kawasan larangan -> (3) Tumpahan kimia: sekat dengan pasir, kaut dan buang selamat; Tumpahan merkuri: tabur serbuk sulfur untuk menutupi merkuri -> (4) Hubungi pihak bomba untuk tumpahan merkuri.","Amalan Keselamatan, Kebakaran & Spesimen Hidup: Pakai baju makmal, sarung tangan, kasut bertutup (dilarang berselipar) dan gogal; jangan bekerja bersendirian; cuci tangan dengan bahan pencuci antiseptik dan nyahjangkit meja kerja. Jika berlaku kebakaran: hentikan kerja, matikan suis/cabut palam berhampiran, keluar ikut pelan kecemasan tanpa berpatah balik ambil barang, hubungi bomba dan berkumpul di tempat berkumpul."],"labId":"bio41_ppe_sisa_lab","labTitle":"Simulator SOP Tumpahan Kimia vs Merkuri","labProps":{"tab":"tumpahan"},"examTip":"Soalan esei kerap menyoal: Mengapa pasir diganti dengan serbuk sulfur bagi tumpahan merkuri? Sulfur bertindak balas menukar wap/cecair merkuri toksik menjadi merkuri sulfida yang stabil sebelum pihak bomba mengendalikannya."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun SOP Tumpahan Merkuri","voiceCaption":"Susun urutan empat langkah tepat bagi mengendalikan kemalangan tumpahan merkuri daripada termometer yang pecah.","voiceScript":"[confident] Susun semula empat tindakan kecemasan mengikut urutan piawai apabila berlakunya tumpahan merkuri di dalam makmal biologi!","prompt":"Susun langkah mengurus tumpahan merkuri mengikut urutan yang betul:","hint":"Mulakan dengan memaklumkan kepada guru sebelum menutup kawasan dan menggunakan serbuk sulfur.","answerTokens":["Maklumkan kepada guru","Jadikan kawasan larangan","Tabur serbuk sulfur","Hubungi pihak bomba"],"distractors":["Mop menggunakan air paip","Buang terus ke dalam sinki"],"explanation":"SOP tumpahan merkuri (DSKP & Buku Teks): (1) Maklumkan kepada guru, (2) Jadikan tempat tumpahan kawasan larangan, (3) Tabur serbuk sulfur untuk menutupi merkuri, dan (4) Hubungi pihak bomba."}]},{"id":"bio41-u3","title":"Unit 3: Berkomunikasi dalam Biologi (Jadual, Graf, Lukisan & Satah)","subtitle":"Subtopik 1.3 — Paksi Graf & Histogram, Faktor Pembesaran Lukisan Biologi, 3 Satah, 2 Keratan & 7 Arah","iconType":"graph","iconUrl":"../assets/icons/bio41-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Jadual Data & Graf Biologi","voiceCaption":"Dalam jadual dan graf biologi, pemboleh ubah dimanipulasikan diletakkan di lajur kiri atau paksi mendatar X, manakala pemboleh ubah bergerak balas di lajur kanan atau paksi menegak Y.","voiceScript":"[warm] Selepas mengumpul data eksperimen, ahli biologi berkomunikasi secara sistematik melalui jadual dan graf! Dalam jadual, pemboleh ubah dimanipulasikan diletakkan pada lajur kiri, manakala pemboleh ubah bergerak balas pada lajur kanan berserta unit dan tanpa angka pecahan. Apabila melukis graf, paksi mendatar x mewakili pemboleh ubah dimanipulasikan dan paksi menegak y mewakili pemboleh ubah bergerak balas! Kenali juga perbezaan antara graf garis, carta bar berjarak dan histogram tanpa ruang antara bar!","title":"1.3 Pembinaan Jadual Data, Graf Garis, Carta Bar & Histogram","acronym":"X•PM•Y•PB","hook":"Kesilapan kecil menulis nombor dalam bentuk pecahan atau meninggalkan ruang di antara bar histogram boleh memotong markah Kertas 2 dan Amali!","summary":"Jadual data menyusun pemboleh ubah dimanipulasikan (kiri/paksi-X) dan pemboleh ubah bergerak balas (kanan/paksi-Y) secara seragam tanpa nilai pecahan.","bullets":["Jadual Data Eksperimen: Lajur kiri = Pemboleh ubah dimanipulasikan (PM) + unit (cth. Suhu / °C); Lajur kanan = Pemboleh ubah bergerak balas (PB) + unit. Nilai berangka mesti ditulis dalam perpuluhan/nombor bulat, BUKAN pecahan.","Graf Garis, Carta Bar & Histogram: Tajuk graf ditulis 'Graf [PB] melawan [PM]' dengan skala paksi seragam dan titik ditanda simbol 'x'. Carta bar menggunakan bar menegak yang terasing (tidak bersentuhan) untuk membandingkan dua atau lebih item diskret, manakala Histogram mempunyai lebar bar seragam tanpa ruang di antara bar untuk menunjukkan taburan kekerapan data selang kelas."],"labId":"bio41_komunikasi_satah_lab","labTitle":"Makmal Graf, Lukisan Biologi & Satah Organisma","labProps":{"tab":"graf"},"examTip":"Ingat format tajuk graf wajib DSKP: 'Graf (pemboleh ubah bergerak balas) melawan (pemboleh ubah dimanipulasikan)' — jangan terbalikkan urutan PB dan PM!"},{"type":"mcq","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Uji Paksi & Jenis Graf","voiceCaption":"Tentukan perbezaan utama antara carta bar dengan histogram serta kedudukan paksi pemboleh ubah.","voiceScript":"[curious] Cuba semak pemahaman kamu tentang graf biologi! Antara pernyataan berikut, yang manakah menerangkan ciri histogram dan kedudukan pemboleh ubah dengan tepat?","prompt":"Seorang murid ingin memaparkan taburan kekerapan ketinggian anak benih yang dikelompokkan mengikut selang kelas. Apakah jenis graf yang sesuai dan apakah ciri utamanya?","options":["Histogram — paksi-X memaparkan julat data selang kelas dan tiada ruang antara bar yang sama lebar","Carta bar — bar dilukis bercantum dan paksi-Y mewakili pemboleh ubah dimanipulasikan","Graf garis — nilai data dalam jadual perlu ditulis dalam bentuk pecahan supaya lebih tepat","Histogram — setiap bar mesti mempunyai kelebaran yang berbeza dan dipisahkan oleh ruang kosong"],"correctIndex":0,"explanation":"Histogram memaparkan taburan data dan kekerapan bagi julat selang kelas pada paksi-X dengan bar sama lebar tanpa sebarang ruang di antara bar."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Lukisan Biologi, Satah & Arah","voiceCaption":"Lukisan biologi memerlukan garis berterusan tanpa lorekan artistik, manakala satah badan terdiri daripada satah sagital, frontal dan melintang.","voiceScript":"[warm] Dalam lukisan biologi, gunakan pensel tajam untuk melukis garis yang jelas, bersih dan tidak terputus tanpa menggunakan pembaris bagi garis luar spesimen! Garis label pula mesti lurus, tanpa anak panah, dan tidak bersilang. Kira faktor pembesaran dengan membahagikan panjang lukisan dengan panjang spesimen. Akhir sekali, kuasai tiga satah badan iaitu sagital, frontal dan melintang, dua keratan iaitu rentas dan membujur, serta tujuh istilah arah anatomi!","title":"Lukisan Biologi, Faktor Pembesaran, 3 Satah, 2 Keratan & 7 Arah","acronym":"S•F•M•A•P•D•V","hook":"Satah Sagital membahagi kiri-kanan, Frontal depan-belakang, dan Melintang atas-bawah — jangan tertukar dorsal (belakang) dengan ventral (depan/perut)!","mediaKey":"bio41_satah_organisma","summary":"Lukisan biologi pelan atau terperinci mematuhi piawaian saintifik yang ketat bersama rujukan piawai satah badan, keratan dan orientasi arah vertebrata.","formula":"Faktor Pembesaran = Panjang lukisan (cm) / Panjang spesimen (cm)","bullets":["Ciri Lukisan Biologi: Besar dan tepat dengan pensel tajam (bukan pen/pensel warna), tidak berlorek artistik, garis jelas bersih berterusan tanpa pembaris bagi bentuk spesimen, garis label lurus tanpa anak panah dan tidak bersilang, bertajuk serta berskala seimbang. Lukisan pelan hanya menunjukkan garis luar struktur tisu, manakala lukisan terperinci memaparkan sel-sel di dalamnya.","3 Satah, 2 Keratan & 7 Istilah Arah: Satah Sagital (bahagi kiri & kanan), Satah Frontal (bahagi depan & belakang), Satah Melintang/Horizontal (bahagi atas & bawah). Keratan Rentas/Melintang (bahagi atas & bawah secara melintang) vs Keratan Membujur (bahagi kiri & kanan). Arah: Anterior (hadap/kepala), Posterior (ekor/belakang), Dorsal (bahagian belakang/atas), Ventral (bahagian bawah/perut), Superior (atas), Inferior (bawah), Lateral (sisi)."],"labId":"bio41_komunikasi_satah_lab","labTitle":"Simulator Satah Anatomi & Kalkulator Pembesaran","labProps":{"tab":"satah"},"examTip":"Kesalahan klasik kertas amali: meletakkan anak panah pada hujung garis label atau melorek struktur dengan pensel — kedua-duanya menyebabkan kehilangan markah lukisan biologi!"},{"type":"match","xp":15,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Satah & Arah Anatomi","voiceCaption":"Padankan istilah satah dan arah organisma berikut dengan kedudukan anatomi yang betul.","voiceScript":"[confident] Jom uji penguasaan orientasi anatomi kamu! Padankan istilah satah dan arah berikut dengan maksud kedudukannya pada tubuh organisma.","prompt":"Padankan satah dan istilah arah biologi berikut dengan maksud yang tepat:","pairs":[{"id":"st1","left":"Satah Sagital","right":"Membahagikan badan organisma kepada bahagian kiri dan kanan"},{"id":"st2","left":"Satah Frontal","right":"Membahagikan badan organisma kepada bahagian depan dan belakang"},{"id":"st3","left":"Dorsal","right":"Menuju ke arah bahagian atas atau belakang badan organisma"},{"id":"st4","left":"Ventral","right":"Menuju ke arah bahagian bawah atau bahagian perut organisma"},{"id":"st5","left":"Anterior","right":"Menuju ke arah bahagian hadapan atau kepala organisma"}],"explanation":"Sagital memisahkan kiri-kanan; Frontal memisahkan depan-belakang; Melintang memisahkan atas-bawah. Dorsal ialah bahagian belakang/atas, Ventral ialah perut/bawah, Anterior ialah hadapan dan Posterior ialah belakang/ekor."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Kira Faktor Pembesaran Lukisan","voiceCaption":"Kira faktor pembesaran lukisan biologi apabila panjang lukisan ialah tiga perpuluhan enam sentimeter dan panjang spesimen sebenar ialah satu perpuluhan dua sentimeter.","voiceScript":"[curious] Cuba kira faktor pembesaran lukisan sel bawang ini dan semak ciri lukisan yang sah! Panjang lukisan ialah tiga perpuluhan enam sentimeter manakala panjang spesimen sebenar ialah satu perpuluhan dua sentimeter.","hook":"Sahkan pengiraan dan peraturan lukisan biologi pada Makmal Lukisan selepas menjawab!","scenario":"Seorang murid melukis spesimen daun yang panjang sebenarnya 1.2 cm menjadi lukisan sepanjang 3.6 cm menggunakan pensel tajam tanpa lorekan artistik.","prompt":"Apakah faktor pembesaran lukisan biologi tersebut dan peraturan label yang wajib dipatuhi?","options":["3x — garis label mesti lurus tanpa anak panah dan tidak bersilang antara satu sama lain","0.33x — garis label mesti berakhir dengan anak panah tajam ke arah struktur","4.8x — sempadan luar spesimen perlu dilukis menggunakan pembaris dan dilorek","3x — lukisan pelan perlu menunjukkan setiap nukleus dan vakuol secara terperinci"],"correctIndex":0,"proofLabId":"bio41_komunikasi_satah_lab","proofState":{"tab":"lukisan"},"explanation":"Faktor pembesaran = 3.6 cm / 1.2 cm = 3x. Garis label lukisan biologi mestilah lurus, tidak bersilang, dan tidak mempunyai anak panah."}]},{"id":"bio41-u4","title":"Unit 4: Penyiasatan Saintifik dalam Biologi","subtitle":"Subtopik 1.4 — 8 Langkah Kaedah Saintifik, Kawalan Pemboleh Ubah & Penulisan Laporan","iconType":"book","iconUrl":"../assets/icons/bio41-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"8 Langkah Penyiasatan Saintifik","voiceCaption":"Penyiasatan saintifik menguji kesahihan hipotesis melalui lapan langkah sistematik bermula daripada mengenal pasti masalah hingga menulis laporan.","voiceScript":"[warm] Bagaimana ahli biologi membuktikan sesuatu hipotesis itu sahih? Melalui lapan langkah penyiasatan saintifik yang sistematik! Pertama, kenal pasti masalah yang boleh diuji. Kedua, bina hipotesis. Ketiga, kenal pasti dan kawal pemboleh ubah dimanipulasikan, bergerak balas dan dimalarkan serta kaedah pengumpulan data. Keempat, rancang dan jalankan penyiasatan. Kelima, kumpul data. Keenam, tafsir data dan keputusan melalui penaakulan saintifik. Ketujuh, buat kesimpulan, dan kelapan, tulis laporan lengkap! Jika laporan tidak ditulis, eksperimen dianggap tidak sah!","title":"1.4 Lapan Langkah Kaedah Penyiasatan Saintifik","acronym":"M•H•P•R•K•T•S•L","hook":"Jika laporan eksperimen tidak ditulis selepas amali dijalankan, eksperimen tersebut dianggap tidak sah di sisi komuniti saintifik!","summary":"Kaedah saintifik membuktikan kesahihan hipotesis melalui kawalan tiga jenis pemboleh ubah, pengumpulan data objektif dan penulisan laporan.","bullets":["8 Langkah Turutan Rasmi: (1) Mengenal pasti masalah yang boleh diuji -> (2) Membina hipotesis -> (3) Mengenal pasti & mengawal pemboleh ubah serta kaedah pengumpulan data -> (4) Merancang & menjalankan penyiasatan saintifik -> (5) Mengumpul data -> (6) Mentafsir data melalui penaakulan saintifik -> (7) Membentuk kesimpulan -> (8) Menulis laporan.","Contoh Aktiviti 1.1 (Kadar Denyutan Nadi): Pernyataan masalah — Apakah kesan aktiviti cergas terhadap kadar denyutan nadi murid? Hipotesis — Kadar denyutan nadi murid meningkat selepas aktiviti cergas. Pemboleh ubah dimanipulasikan = Aktiviti cergas; bergerak balas = Kadar denyutan nadi murid; dimalarkan = Murid yang sama dan tempoh kiraan nadi (1 minit) dalam keadaan duduk tenang."],"labId":"bio41_penyiasatan_lab","labTitle":"Pembina Reka Bentuk Eksperimen Biologi","labProps":{"stage":"flow"},"examTip":"Sentiasa nyatakan cara mengawal ketiga-tiga pemboleh ubah dalam Kertas 2: apa yang diubah (PM), apa yang diukur/diperhatikan (PB) dan apa yang ditetapkan sama (Malar)."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun 8 Langkah Saintifik","voiceCaption":"Susun urutan fasa penyiasatan saintifik bermula daripada mengenal pasti masalah sehingga penulisan laporan.","voiceScript":"[confident] Susun semula lima fasa utama penyiasatan saintifik berikut mengikut urutan kronologi yang betul!","prompt":"Susun fasa penyiasatan saintifik daripada permulaan hingga akhir:","hint":"Bermula dengan masalah dan hipotesis, diikuti eksperimen, tafsiran data dan laporan.","answerTokens":["Kenal pasti masalah","Bina hipotesis","Kawal pemboleh ubah & jalankan eksperimen","Kumpul & tafsir data","Buat kesimpulan & tulis laporan"],"distractors":["Buat kesimpulan sebelum mengumpul data","Ubah keputusan supaya sama dengan hipotesis"],"explanation":"Urutan penyiasatan saintifik yang sahih ialah: Masalah -> Hipotesis -> Kawal pemboleh ubah & jalankan eksperimen -> Kumpul & tafsir data -> Kesimpulan & Laporan."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Kawalan Pemboleh Ubah","voiceCaption":"Tentukan pemboleh ubah dimanipulasikan, bergerak balas dan dimalarkan bagi eksperimen hidrolisis kanji oleh enzim amilase.","voiceScript":"[curious] Mari uji kemahiran mereka bentuk eksperimen! Dalam eksperimen kesan kepekatan kanji terhadap masa hidrolisis lengkap oleh amilase, apakah pemboleh ubah dimanipulasikan dan bergerak balasnya?","hook":"Buka Pembina Reka Bentuk Eksperimen untuk menyemak jadual pemboleh ubah selepas menjawab!","scenario":"Empat tabung uji diisi dengan kepekatan larutan kanji berbeza (1.0%, 2.0%, 3.0%, 4.0%) dan dicampur isipadu amilase yang sama pada suhu 37°C lalu diuji masa hidrolisis lengkap.","prompt":"Manakah padanan pemboleh ubah yang tepat bagi penyiasatan tersebut?","options":["Dimanipulasikan: Kepekatan kanji (%); Bergerak balas: Masa untuk hidrolisis kanji lengkap (minit); Dimalarkan: Suhu 37°C dan isipadu amilase","Dimanipulasikan: Masa untuk hidrolisis lengkap; Bergerak balas: Kepekatan kanji; Dimalarkan: Jenis tabung uji sahaja","Dimanipulasikan: Suhu bilik; Bergerak balas: Warna larutan iodin awal; Dimalarkan: Kepekatan kanji","Dimanipulasikan: Jenis enzim; Bergerak balas: Suhu air kukus; Dimalarkan: Masa eksperimen"],"correctIndex":0,"proofLabId":"bio41_penyiasatan_lab","proofState":{"stage":"variables"},"explanation":"Kepekatan kanji (%) yang sengaja diubah ialah pemboleh ubah dimanipulasikan; masa hidrolisis yang diukur ialah pemboleh ubah bergerak balas; suhu dan isipadu enzim ditetapkan sebagai pemboleh ubah dimalarkan."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Sikap Saintifik & Nilai Murni","voiceCaption":"Kenal pasti sikap saintifik yang wajib diamalkan apabila data eksperimen sebenar bercanggah dengan hipotesis awal.","voiceScript":"[confident] Soalan nilai murni saintifik! Jika keputusan eksperimen yang direkodkan berbeza daripada jangkaan hipotesis awal, apakah tindakan saintis yang jujur?","prompt":"Data eksperimen seorang murid menunjukkan keputusan yang tidak menyokong hipotesis awalnya. Apakah tindakan yang mencerminkan sikap saintifik dan nilai murni?","options":["Merekodkan data sebenar dengan jujur dan tepat serta menolak atau menyemak semula hipotesis dalam perbincangan laporan","Mengubah angka jadual supaya graf kelihatan sejajar dengan hipotesis asal","Tidak menulis laporan eksperimen dan merahsiakan data daripada guru","Mengabaikan bacaan sebenar dan menyalin keputusan daripada buku rujukan"],"correctIndex":0,"explanation":"Sikap saintifik dan nilai murni menuntut kejujuran dan ketepatan dalam merekod serta mengesahkan data. Hipotesis tidak semestinya diterima; jika data tidak menyokong, hipotesis ditolak secara objektif."}]},{"id":"bio41-u5","title":"Cabaran Boss SPM: Pengenalan Biologi & Makmal","subtitle":"Sintesis KBAT Kertas 1 & 2 — Pengurusan Sisa, Kecemasan Merkuri, Satah Anatomi & Reka Bentuk Eksperimen","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Pelupusan Sisa Biologi","voiceCaption":"Pilih kaedah pengurusan yang tepat bagi bangkai tikus makmal dan kultur cecair bakteria.","voiceScript":"[excited] Selamat datang ke Cabaran Boss S P M Bab satu! Soalan pertama menguji pengurusan sisa biologi Kategori C dan D. Bagaimanakah bangkai tikus yang telah dibedah mesti diuruskan dengan selamat?","prompt":"Selepas menjalankan pembedahan spesimen haiwan kecil, bagaimanakah bangkai dan tisu Kategori C diuruskan mengikut SOP makmal?","options":["Dibalut rapi dengan bahan penyerap seperti kertas tisu, dimasukkan ke dalam beg plastik biobahaya dan disejuk beku sebelum pelupusan","Dibuang terus ke dalam sinki makmal bersama larutan pelarut organik untuk melarutkan tisu","Dimasukkan ke dalam tong khas sisa tajam Kategori A tanpa perlu dibungkus atau disejuk beku","Dibiarkan kering di atas meja makmal sebelum dibuang ke dalam bakul sampah kertas biasa"],"correctIndex":0,"explanation":"Sisa Kategori C (bangkai haiwan, organ dan tisu) mesti dibalut rapi dalam bahan penyerap, dimasukkan ke dalam beg plastik biobahaya dan disejuk beku sebelum pelupusan berjadual."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Satah & Keratan Badan","voiceCaption":"Kelaskan enam pernyataan anatomi berikut kepada Satah Badan atau Istilah Arah.","voiceScript":"[confident] Cabaran kedua Boss S P M! Kelaskan enam istilah anatomi ini sama ada merupakan Satah atau Keratan Badan berbanding Istilah Arah orientasi.","prompt":"Isihkan istilah anatomi berikut kepada kategori Satah/Keratan atau Istilah Arah:","buckets":[{"id":"satah","label":"Satah & Keratan Badan"},{"id":"arah","label":"Istilah Arah Anatomi"}],"items":[{"text":"Sagital — memisahkan bahagian kiri dan kanan tubuh","bucketId":"satah","note":"Tepat! Satah sagital membahagi tubuh kepada kiri dan kanan."},{"text":"Frontal — memisahkan bahagian depan dan belakang tubuh","bucketId":"satah","note":"Betul! Satah frontal membahagi organisma kepada depan dan belakang."},{"text":"Keratan rentas — memotong struktur melintang kepada atas dan bawah","bucketId":"satah","note":"Tepat! Keratan rentas/melintang memotong secara mendatar."},{"text":"Dorsal dan Ventral — merujuk permukaan belakang/atas dan perut/bawah","bucketId":"arah","note":"Betul! Kedua-duanya ialah istilah arah pada vertebrata."},{"text":"Anterior dan Posterior — merujuk hujung kepala dan hujung ekor","bucketId":"arah","note":"Tepat! Anterior ialah hadapan dan posterior ialah belakang."},{"text":"Superior, Inferior dan Lateral — merujuk arah atas, bawah dan sisi","bucketId":"arah","note":"Betul! Ketiga-tiga istilah ini melengkapkan tujuh istilah arah."}],"explanation":"Tiga satah utama ialah sagital, frontal dan melintang; dua keratan ialah rentas dan membujur; tujuh istilah arah ialah anterior, posterior, dorsal, ventral, superior, inferior dan lateral."},{"type":"predict","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Kecemasan Kebakaran & Asid","voiceCaption":"Ramalkan tindakan keselamatan paling tepat apabila baju rakan terbakar atau asid hidroklorik tertumpah di makmal.","voiceScript":"[curious] Soalan situasi KBAT Kertas dua! Jika asid hidroklorik pekat tertumpah di atas meja makmal berhampiran murid, apakah langkah segera yang perlu diambil?","hook":"Sahkan prosedur kecemasan pada Simulator SOP Tumpahan selepas menjawab!","scenario":"Semasa menjalankan eksperimen enzim pepsin, seorang murid secara tidak sengaja menumpahkan 50 ml larutan asid hidroklorik ke lantai makmal.","prompt":"Apakah langkah yang tepat untuk mengendalikan tumpahan asid tersebut?","options":["Maklumkan guru, jadikan kawasan larangan, sekat tumpahan menggunakan pasir supaya tidak merebak, kaut dengan alat sesuai dan buang selamat","Siram dengan air paip yang banyak dan biarkan mengalir ke dalam longkang tanpa memberitahu guru","Tabur serbuk sulfur ke atas asid dan tinggalkan makmal tanpa menyekat kawasan","Lap menggunakan tisu tangan kosong dan buang ke dalam tong sampah biasa"],"correctIndex":0,"proofLabId":"bio41_ppe_sisa_lab","proofState":{"tab":"tumpahan"},"explanation":"Bagi tumpahan bahan kimia umum seperti asid: (1) Maklumkan guru, (2) Jadikan kawasan larangan, (3) Sekat daripada merebak guna pasir, (4) Kaut guna alat sesuai dan (5) Buang dengan selamat."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Sinki & Radas Keselamatan","voiceCaption":"Padankan radas keselamatan dan peraturan pembuangan bahan ke sinki dengan justifikasinya.","voiceScript":"[confident] Satu langkah lagi sebelum tamat Boss S P M! Padankan empat situasi makmal ini dengan tindakan atau peralatan yang tepat.","prompt":"Padankan situasi makmal berikut dengan peraturan keselamatan yang betul:","pairs":[{"id":"bs1","left":"Larutan aseton dan pH 2.0","right":"Dilarang buang ke sinki kerana pelarut organik dan asid kuat mencemar serta mengakis paip"},{"id":"bs2","left":"Gas klorin dan bromin","right":"Dikendalikan di dalam kebuk wasap supaya gas toksik disedut keluar dengan selamat"},{"id":"bs3","left":"Piring petri agar bakteria (Kat B)","right":"Diautoklaf pada 121 darjah Celsius dan 15 psi selama 20 minit dalam beg biobahaya"},{"id":"bs4","left":"Etika kasut makmal","right":"Wajib berkasut bertutup dan dilarang berselipar untuk lindung kaki daripada serpihan kaca serta bahan kimia"}],"explanation":"Pelarut organik dan pH < 5 atau > 9 dilarang masuk ke sinki; gas beracun memerlukan kebuk wasap; sisa Kategori B diautoklaf (121°C, 15 psi, 20 minit); dan kasut bertutup melindungi kaki."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Graf & Pemboleh Ubah","voiceCaption":"Selesaikan soalan sintesis graf kadar hidrolisis kanji melawan kepekatan kanji serta ciri lukisan biologi.","voiceScript":"[excited] Soalan penutup Boss S P M! Kenal pasti format tajuk graf yang betul dan ciri lukisan biologi yang mematuhi piawaian peperiksaan.","prompt":"Berdasarkan data eksperimen kadar hidrolisis kanji (%) terhadap kepekatan kanji (%), bagaimanakah graf dan lukisan pemerhatian mikroskop mesti disediakan?","options":["Graf bertajuk 'Graf kadar hidrolisis kanji melawan kepekatan kanji' dengan kepekatan kanji di paksi-X; lukisan pula dibuat dengan pensel tajam tanpa lorekan artistik","Graf bertajuk 'Graf kepekatan kanji melawan kadar hidrolisis' dengan kadar hidrolisis di paksi-X; lukisan diwarnakan dengan pensel warna","Graf dilukis tanpa unit pada paksi; sempadan lukisan sel digaris menggunakan pembaris dan pen dakwat","Histogram digunakan untuk hubungan selanjar tanpa skala seragam dan garis label diletakkan anak panah"],"correctIndex":0,"explanation":"Paksi-X mewakili pemboleh ubah dimanipulasikan (kepekatan kanji), paksi-Y mewakili pemboleh ubah bergerak balas (kadar hidrolisis), tajuk graf berformat 'Graf PB melawan PM', dan lukisan biologi menggunakan pensel tajam tanpa lorekan artistik atau pembaris."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +

  return '<div class="bite-cards-row">' + cards + "</div>";

    "</div>";

      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +

      "</div>"

  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();

      } else {

      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;

        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {

          }
        }
        NotaAudio.playMatch();

      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
