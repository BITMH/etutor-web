  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab02","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":2,"title":"Biologi Sel dan Organisasi Sel","subtitle":"Subtopik 2.1-2.4 KSSM — Penyediaan Slaid & 13 Komponen Sel, Proses Hidup Amoeba sp. & Paramecium sp., Pengkhususan Sel & Tisu, Kepadatan Organel serta 11 Sistem Organ Manusia.","estimatedMinutes":30,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t4-bab02-labs.js","coverIcon":"../assets/icons/bio42-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pemahaman struktur organel dan organisasi sel kamu sangat cemerlang!","combo":"[laughs warmly] Kombo yang hebat! Setiap sel khusus dan sistem organ berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula peranan setiap organel dan tisu di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Sel Tingkatan empat Bab dua berjaya disempurnakan!"},"units":[{"id":"bio42-u1","title":"Unit 1: Struktur & Fungsi Komponen Sel Haiwan dan Tumbuhan","subtitle":"Subtopik 2.1 — Slaid Lekapan Basah, 13 Komponen Sel (Mikrograf) & Perbandingan Sel Haiwan vs Tumbuhan","iconType":"atom","iconUrl":"../assets/icons/bio42-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Penyediaan Slaid & Organel","voiceCaption":"Kenali teknik lekapan basah serta peranan mitokondrion, nukleus, ribosom, jalinan endoplasma, jasad Golgi, lisosom dan sentriol.","voiceScript":"[warm] Selamat datang ke Bab dua, Biologi Sel dan Organisasi Sel! Untuk memerhati sel bawang menggunakan larutan iodin atau sel pipi menggunakan metilena biru, kita menyediakan slaid lekapan basah dengan menurunkan kaca penutup pada sudut empat puluh lima darjah bagi mengelakkan gelembung udara dan mewarnakannya melalui teknik pengairan! Di dalam sel eukariot pula terdapat organel seperti mitokondrion penjana tenaga A T P, nukleus pengawal aktiviti sel, ribosom tapak sintesis protein, jalinan endoplasma kasar dan licin, jasad Golgi, lisosom serta sentriol!","title":"2.1 Penyediaan Slaid & Komponen Utama Sel Haiwan","acronym":"M•N•R•J•G•L•S","hook":"Setiap sel bertindak seperti sebuah kilang berteknologi tinggi — ribosom membina protein, jalinan endoplasma mengangkutnya, dan jasad Golgi membungkus serta mengeksportnya!","mediaKey":"bio42_sel_eukariot","videoClip":{"src":"../assets/biologi-t4-bab02/video/bio42_video_organel_sel_narasi.mp4","hasNarration":true,"posterKey":"bio42_sel_eukariot","caption":"Video Penerangan Bersuara (BM): Fungsi organel sel haiwan dan tumbuhan serta pengkhususan sel dalam organisasi tisu"},"summary":"Sel ialah unit asas hidupan yang mengandungi pelbagai komponen bermembran dengan fungsi biokimia khusus apabila dilihat menerusi mikrograf.","bullets":["Slaid Lekapan Basah & Pengairan: Sel epidermis bawang diwarnakan dengan larutan iodin, manakala sel pipi manusia diwarnakan dengan larutan metilena biru. Kaca penutup diletakkan pada sudut 45 darjah dengan jarum tenggek untuk mengelak gelembung udara terperangkap, dan pewarna ditarik menggunakan kertas turas (teknik pengairan).","7 Komponen Utama Sel: Mitokondrion (dwimembran berlipat; tapak pengoksidaan glukosa menjana ATP), Nukleus (membran nukleus berliang, kromosom ber-DNA, nukleolus; mengawal semua aktiviti sel), Ribosom (granul RNA & protein; sintesis protein), Jalinan Endoplasma Kasar (angkut protein) & Licin (sintesis/angkut gliserol & lipid serta detoksifikasi dadah), Jasad Golgi (proses, ubah suai, bungkus & angkut protein/karbohidrat/glikoprotein), Lisosom (enzim hidrolitik mencerna bakteria & organel rosak) dan Sentriol (pasangan silinder dalam sel haiwan sahaja; bentuk gentian gelendong)."],"labId":"bio42_sel_organel_lab","labTitle":"Penjelajah Interaktif 13 Komponen Sel & Bandingkan","labProps":{"tab":"organel","focus":"mitokondrion"},"examTip":"Skema S.P.M.: Nyatakan dengan tepat perbezaan fungsi Jalinan Endoplasma Kasar (mengangkut protein yang disintesis oleh ribosom) dengan Jalinan Endoplasma Licin (mensintesis dan mengangkut lipid serta detoksifikasi)."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Organel & Fungsinya","voiceCaption":"Padankan lima organel penting sel dengan fungsi tepatnya mengikut kajian mikrograf.","voiceScript":"[curious] Mari uji ingatan kamu tentang organel sel! Padankan lima komponen sel ini dengan fungsi masing-masing.","prompt":"Padankan setiap komponen sel berikut dengan fungsinya yang tepat:","pairs":[{"id":"o1","left":"Mitokondrion","right":"Tapak penjanaan tenaga berbentuk molekul ATP melalui pengoksidaan glukosa"},{"id":"o2","left":"Jasad Golgi","right":"Memproses, mengubah suai, membungkus dan mengangkut protein serta glikoprotein"},{"id":"o3","left":"Lisosom","right":"Mengandungi enzim hidrolitik untuk menghidrolisis molekul kompleks dan bakteria"},{"id":"o4","left":"Jalinan Endoplasma Licin","right":"Mensintesis dan mengangkut lipid serta menjalankan detoksifikasi dadah"},{"id":"o5","left":"Sentriol","right":"Membentuk gentian gelendong semasa pembahagian sel dalam sel haiwan"}],"explanation":"Mitokondrion menghasilkan ATP; Jasad Golgi memproses dan membungkus bahan rembesan; Lisosom menghidrolisis bakteria/organel rosak; JE Licin mensintesis lipid; dan Sentriol membentuk gentian gelendong dalam sel haiwan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Sel Tumbuhan vs Sel Haiwan","voiceCaption":"Sel tumbuhan mempunyai dinding sel selulosa, kloroplas dan vakuol besar berselaput tonoplas, serta menyimpan karbohidrat dalam bentuk kanji.","voiceScript":"[warm] Selain organel yang dikongsi bersama sel haiwan, sel tumbuhan matang mempunyai tiga struktur istimewa! Pertama, dinding sel daripada gentian selulosa yang tegar dan telap penuh. Kedua, kloroplas dengan pigmen klorofil di dalam grana untuk fotosintesis. Ketiga, vakuol tengah besar berisi sap sel dikelilingi membran tonoplas untuk mengekalkan kesegahan sel! Ingat juga perbezaan simpanan karbohidrat: sel tumbuhan menyimpan kanji, manakala sel haiwan menyimpan glikogen!","title":"Komponen Sel Tumbuhan & Perbandingan Sel Haiwan vs Tumbuhan","acronym":"D•K•V•S","hook":"Mengapa sel tumbuhan tidak meletus apabila menyerap air manakala sel haiwan tidak mempunyai bentuk tetap? Jawapannya terletak pada dinding sel selulosa dan vakuol!","summary":"Sel tumbuhan dan sel haiwan berkongsi tujuh komponen asas tetapi berbeza dari segi dinding sel, kloroplas, saiz vakuol, sentriol dan simpanan karbohidrat.","bullets":["6 Komponen Tambahan & Umum: Dinding Sel (lapisan luar kuat daripada gentian selulosa, telap penuh, mengekalkan bentuk & sokongan mekanikal), Kloroplas (bujur dwimembran, grana berpigmen klorofil menyerap cahaya matahari untuk fotosintesis), Vakuol (kantung sap sel berselaput membran tonoplas; sel tumbuhan muda ada banyak vakuol kecil, matang satu vakuol besar untuk kesegahan), Membran Plasma (protein & fosfolipid, nipis, elastik, separa telap), Sitoplasma (medium seakan jeli bagi tindak balas biokimia).","Persamaan & Perbezaan: Kedua-duanya memiliki nukleus, sitoplasma, membran plasma, jasad Golgi, mitokondrion, jalinan endoplasma dan ribosom. Sel Tumbuhan ada bentuk tetap, dinding sel, kloroplas, vakuol besar, simpanan kanji dan TIADA sentriol; Sel Haiwan tiada bentuk tetap, tiada dinding sel/kloroplas, vakuol tiada/kecil, simpanan glikogen dan ADA sentriol."],"labId":"bio42_sel_organel_lab","labTitle":"Jadual Perbandingan Sel Haiwan vs Tumbuhan","labProps":{"tab":"banding"},"examTip":"Contoh soalan KBAT kerap ditanya: Namakan satu sel tumbuhan yang TIADA kloroplas -> Sel epidermis bawang atau sel akar rambut kerana tidak terdedah kepada cahaya untuk fotosintesis."},{"type":"sort","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Isih Struktur Sel Haiwan & Tumbuhan","voiceCaption":"Kelaskan enam ciri berikut kepada Sel Haiwan sahaja, Sel Tumbuhan sahaja, atau Kedua-dua sel.","voiceScript":"[confident] Asingkan keenam-enam ciri berikut dengan cepat: adakah ia khusus untuk Sel Haiwan, khusus untuk Sel Tumbuhan, atau wujud dalam kedua-dua jenis sel?","prompt":"Kelaskan ciri struktur dan simpanan berikut mengikut jenis sel yang tepat:","buckets":[{"id":"haiwan","label":"Sel Haiwan Sahaja"},{"id":"tumbuhan","label":"Sel Tumbuhan Sahaja"},{"id":"dua","label":"Kedua-dua Sel"}],"items":[{"text":"Mempunyai sepasang sentriol untuk membentuk gentian gelendong","bucketId":"haiwan","note":"Tepat! Sentriol hanya wujud dalam sel haiwan dan tiada dalam sel tumbuhan."},{"text":"Menyimpan lebihan karbohidrat dalam bentuk glikogen","bucketId":"haiwan","note":"Betul! Sel haiwan menyimpan glikogen, manakala sel tumbuhan menyimpan kanji."},{"text":"Mempunyai dinding sel daripada selulosa yang telap penuh","bucketId":"tumbuhan","note":"Tepat! Dinding sel memberi bentuk tetap kepada sel tumbuhan."},{"text":"Memiliki kloroplas berpigmen klorofil dan vakuol tengah yang besar","bucketId":"tumbuhan","note":"Betul! Kloroplas dan vakuol besar berselaput tonoplas ialah ciri sel tumbuhan matang."},{"text":"Mempunyai membran plasma separa telap, nukleus dan mitokondrion","bucketId":"dua","note":"Tepat! Kedua-dua sel eukariot berkongsi organel asas ini."},{"text":"Mengandungi jasad Golgi, ribosom dan jalinan endoplasma","bucketId":"dua","note":"Betul! Organel pemprosesan dan sintesis protein ini ada dalam kedua-duanya."}],"explanation":"Sel haiwan mempunyai sentriol dan menyimpan glikogen tanpa dinding sel/kloroplas; sel tumbuhan mempunyai dinding sel, kloroplas, vakuol besar dan menyimpan kanji; kedua-duanya berkongsi nukleus, mitokondrion, ribosom, JE, jasad Golgi dan membran plasma."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Kesan Ketiadaan Jasad Golgi","voiceCaption":"Ramalkan kesannya terhadap sel kelenjar jika jasad Golgi gagal berfungsi dalam sel.","voiceScript":"[curious] Cuba ramalkan apa yang berlaku di dalam sel kelenjar pankreas sekiranya jasad Golgi mengalami kegagalan fungsi!","hook":"Periksa semula fungsi Jasad Golgi pada Penjelajah Komponen Sel selepas menjawab!","scenario":"Satu mutasi menyebabkan jasad Golgi dalam sel kelenjar gagal membentuk vesikel pengangkutan daripada kantung pipihnya.","prompt":"Apakah proses selular yang akan terjejas secara langsung?","options":["Protein dan karbohidrat gagal diproses, diubah suai, dibungkus menjadi glikoprotein dan dirembes keluar dari sel","Molekul glukosa gagal dioksidakan kepada tenaga ATP di dalam ruang matriks sel","Sel gagal menyerap cahaya matahari kerana kehilangan pigmen klorofil pada grana","Sel tidak dapat membentuk gentian gelendong semasa pembahagian sel haiwan"],"correctIndex":0,"proofLabId":"bio42_sel_organel_lab","proofState":{"tab":"organel","focus":"golgi"},"explanation":"Jasad Golgi berfungsi memproses, mengubah suai, membungkus dan mengangkut bahan kimia seperti protein, karbohidrat dan glikoprotein."}]},{"id":"bio42-u2","title":"Unit 2: Proses Hidup Organisma Unisel","subtitle":"Subtopik 2.2 — 7 Proses Hidup Amoeba sp. & Paramecium sp., Pengosmokawalaturan Vakuol Mengecut & Pembiakan","iconType":"book","iconUrl":"../assets/icons/bio42-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Proses Hidup Amoeba & Paramecium","voiceCaption":"Organisma unisel seperti Amoeba sp. dan Paramecium sp. menjalankan kesemua tujuh proses hidup dalam satu sel tunggal.","voiceScript":"[warm] Walaupun hanya terbina daripada satu sel tunggal, organisma unisel seperti Amoeba spesies dan Paramecium spesies mampu menjalankan kesemua tujuh proses hidup: pergerakan, gerak balas terhadap rangsangan, nutrisi, pertumbuhan, respirasi, perkumuhan dan pembiakan! Amoeba bergerak dengan mengunjurkan pseudopodium atau kaki palsu dan makan melalui fagositosis yang dibantu oleh enzim lisozim dalam lisosom, manakala Paramecium bergerak menggunakan denyutan silium berirama! Di dalam air tawar, vakuol mengecut mengepam keluar air berlebihan melalui pengosmokawalaturan supaya sel tidak meletus!","title":"2.2 Tujuh Proses Hidup Amoeba sp. dan Paramecium sp.","acronym":"P•N•O•B•K","hook":"Apabila air tawar masuk terus ke dalam sel secara osmosis, vakuol mengecut bertindak seperti pam automatik yang mengecut apabila penuh supaya sel tidak pecah!","mediaKey":"bio42_amoeba_paramecium","summary":"Amoeba sp. dan Paramecium sp. ialah protozoa unisel yang menyempurnakan kesemua fungsi kehidupan termasuk pengosmokawalaturan air dan strategi pembiakan.","bullets":["Pergerakan, Rangsangan & Nutrisi: Amoeba sp. mengunjurkan pseudopodium (kaki palsu) diikuti aliran sitoplasma; Paramecium sp. menggunakan denyutan silium berirama. Kedua-duanya menjauhi rangsangan kimia, sentuhan atau cahaya terang. Untuk nutrisi, Amoeba sp. mengepung makanan secara fagositosis membentuk vakuol makanan yang bercantum dengan lisosom (dihidrolisis enzim lisozim), manakala denyutan silium Paramecium sp. menolak makanan ke alur mulut dan sisa disingkir melalui liang dubur.","Pertumbuhan, Pengosmokawalaturan & Pembiakan: Tumbuh dengan mensintesis sitoplasma baharu; gas karbon dioksida & ammonia disingkir secara resapan. Dalam air tawar (hipotonik), air meresap masuk secara osmosis ke dalam vakuol mengecut lalu mengecut apabila saiz maksimum dicapai (pengosmokawalaturan). Semasa keadaan sesuai, kedua-duanya membiak secara aseks melalui belahan dedua (mitosis); semasa keadaan buruk (kering/sejuk/kurang makanan), Amoeba sp. membentuk spora manakala Paramecium sp. menjalani konjugasi seks."],"labId":"bio42_unisel_osmo_lab","labTitle":"Simulator Pengosmokawalaturan Vakuol Mengecut","labProps":{"env":"tawar"},"examTip":"Soalan klasik S.P.M.: Bezakan pembiakan Amoeba sp. semasa keadaan tidak sesuai (pembentukan spora) daripada Paramecium sp. (pembiakan seks melalui konjugasi)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Vakuol Mengecut dalam Air Masin","voiceCaption":"Ramalkan perubahan kadar pengecutan vakuol mengecut apabila Paramecium sp. dipindahkan ke dalam larutan garam pekat.","voiceScript":"[curious] Bayangkan Paramecium spesies yang biasa hidup di kolam air tawar dipindahkan ke dalam larutan garam pekat atau air laut! Apakah yang akan berlaku kepada kekerapan pengecutan vakuol mengecutnya?","hook":"Ubah kepekatan persekitaran pada Simulator Vakuol Mengecut untuk mengesahkan ramalan kamu!","scenario":"Satu spesimen Paramecium sp. daripada kolam air tawar dipindahkan ke dalam titisan larutan garam pekat di atas slaid kaca.","prompt":"Apakah yang berlaku kepada kadar pengecutan vakuol mengecut berbanding ketika berada di dalam air tawar?","options":["Kadar pengecutan berkurangan atau berhenti kerana air tidak lagi meresap masuk secara berlebihan, sebaliknya air meresap keluar secara osmosis","Kadar pengecutan meningkat mendadak kerana garam masuk mengepam vakuol mengecut","Vakuol mengecut membesar hingga sel meletus dalam tempoh beberapa saat","Paramecium sp. segera membentuk spora tahan garam seperti Amoeba sp."],"correctIndex":0,"proofLabId":"bio42_unisel_osmo_lab","proofState":{"env":"laut"},"explanation":"Larutan garam pekat adalah hipertonik kepada sitoplasma; air meresap keluar (bukan masuk) melalui osmosis, maka vakuol mengecut kurang terisi dan kadar pengecutannya berkurang atau berhenti."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Proses Nutrisi Amoeba","voiceCaption":"Susun urutan empat langkah proses fagositosis dan pencernaan makanan dalam Amoeba sp.","voiceScript":"[confident] Susun semula empat peringkat proses pemakanan fagositosis dalam Amoeba spesies bermula daripada mengesan makanan hingga menyingkirkan sisa!","prompt":"Susun proses nutrisi (fagositosis) Amoeba sp. mengikut urutan yang betul:","hint":"Bermula dengan pergerakan pseudopodium sebelum pencernaan oleh enzim lisozim.","answerTokens":["Unjur pseudopodium kepung makanan (fagositosis)","Vakuol makanan bercantum dengan lisosom","Enzim lisozim menghidrolisis zarah makanan","Nutrien diserap ke sitoplasma dan sisa disingkirkan"],"distractors":["Tolak makanan ke alur mulut dengan silia","Singkirkan sisa melalui liang dubur tetap"],"explanation":"Amoeba sp. menggunakan pseudopodium untuk memerangkap makanan (fagositosis), menggabungkan vakuol makanan dengan lisosom supaya enzim lisozim menghidrolisis makanan, menyerap nutrien ke sitoplasma dan menyingkir sisa semasa bergerak."},{"type":"match","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Struktur Unisel","voiceCaption":"Padankan istilah penting proses hidup organisma unisel dengan fungsi atau keadaannya.","voiceScript":"[confident] Uji ingatan pantas kamu! Padankan lima istilah biologi organisma unisel berikut dengan penerangan tepatnya.","prompt":"Padankan setiap istilah organisma unisel berikut dengan huraian yang tepat:","pairs":[{"id":"u1","left":"Pseudopodium","right":"Unjuran kaki palsu bagi pergerakan dan fagositosis Amoeba sp."},{"id":"u2","left":"Silium (Silia)","right":"Rerambut halus berirama untuk pergerakan dan menyapu makanan ke alur mulut Paramecium sp."},{"id":"u3","left":"Vakuol mengecut","right":"Menjalankan pengosmokawalaturan dengan mengepam keluar air osmosis berlebihan"},{"id":"u4","left":"Pembentukan spora","right":"Strategi Amoeba sp. bertahan ketika kering, suhu rendah atau kurang makanan"},{"id":"u5","left":"Konjugasi","right":"Pembiakan seks Paramecium sp. apabila keadaan persekitaran tidak sesuai"}],"explanation":"Pseudopodium untuk Amoeba sp., silium untuk Paramecium sp., vakuol mengecut mengawal osmosis, spora melindungi Amoeba sp. dan konjugasi ialah pembiakan seks Paramecium sp."}]},{"id":"bio42-u3","title":"Unit 3: Pengkhususan Sel, Tisu & Kepadatan Organel","subtitle":"Subtopik 2.3 — Sel Khusus Haiwan/Tumbuhan, 4 Tisu Haiwan & Tisu Tumbuhan, Jadual 2.1 Kepadatan Organel & Penyakit Tay-Sachs","iconType":"graph","iconUrl":"../assets/icons/bio42-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Sel Khusus & Jenis Tisu","voiceCaption":"Sel multisel mengalami pengkhususan struktur agar sepadan dengan fungsinya dan tersusun menjadi tisu haiwan serta tisu tumbuhan.","voiceScript":"[warm] Dalam organisma multisel, setiap sel mempunyai bentuk unik yang sepadan dengan fungsinya! Contohnya, sel darah merah berbentuk cakera dwicekung tanpa nukleus untuk memaksimumkan pengangkutan oksigen, manakala sel akar rambut mempunyai unjuran panjang untuk meluaskan luas permukaan penyerapan air. Sekumpulan sel serupa pula membentuk tisu! Dalam haiwan terdapat empat kelas utama: tisu epitelium, tisu otot (licin, rangka dan kardium), tisu saraf serta tisu penghubung. Dalam tumbuhan pula terdapat tisu meristem dan tisu kekal iaitu tisu epidermis, tisu asas parenkima, kolenkima, sklerenkima serta tisu vaskular xilem dan floem!","title":"2.3 Sel Khusus serta Tisu Haiwan dan Tumbuhan","acronym":"E•O•S•P","hook":"Dari gentian otot jantung yang mengecut tanpa henti hingga salur xilem berongga di batang pokok — struktur unik sentiasa menentukan fungsi!","summary":"Pengkhususan sel membolehkan pembahagian kerja yang cekap melalui empat tisu haiwan dan dua kumpulan utama tisu tumbuhan (meristem dan tisu kekal).","bullets":["Sel Khusus Haiwan & Tumbuhan: Haiwan — sel otot (gentian berjalur berbilang nukleus mengecut/mengendur), sel saraf (panjang/halus hantar impuls), sel darah putih (ubah bentuk musnahkan patogen), sel epitelium (nipis leper lapik organ), sel darah merah (cakera dwicekung tanpa nukleus maksimumkan O2), sel sperma (ekor panjang berenang ke tiub Falopio). Tumbuhan — elemen tiub tapis (silinder panjang angkut bahan organik), salur xilem (tiub berongga berterusan angkut air & garam mineral), sel mesofil palisad (silinder tegak padat kloroplas), sel mesofil berspan (longgar banyak ruang udara untuk pertukaran gas), sel pengawal (dinding dalam lebih tebal kawal buka tutup stoma), sel akar rambut (unjuran panjang tambah luas permukaan).","4 Tisu Haiwan vs Tisu Tumbuhan: Haiwan — Epitelium (kulit, trakea bersilia, salur pencernaan), Otot (licin [peristalsis luar kawal], rangka [terkawal pada tulang], kardium [dinding jantung luar kawal]), Saraf (neuron dengan badan sel, dendrit & akson), Penghubung (longgar, darah, tulang, berserat [tendon sambung otot-tulang & ligamen sambung tulang-tulang], adipos, rawan). Tumbuhan — Meristem (apeks & lateral) dan Tisu Kekal (dermis/epidermis; asas: parenkima [simpan kanji/fotosintesis], kolenkima [sokong batang muda herba], sklerenkima [kekuatan mekanikal bahagian matang]; vaskular: xilem & floem)."],"labId":"bio42_tisu_kepadatan_lab","labTitle":"Peta Tisu Multisel & Kepadatan Organel","labProps":{"tab":"tisu"},"examTip":"Bezakan tepat 3 tisu asas tumbuhan: Parenkima (simpan kanji/air & fotosintesis), Kolenkima (sokong tumbuhan herba/batang muda tak berkayu) dan Sklerenkima (sokong bahagian matang/berkayu)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Tisu Haiwan vs Tumbuhan","voiceCaption":"Kelaskan enam jenis tisu dan sel khusus berikut kepada Tisu Haiwan atau Tisu Tumbuhan.","voiceScript":"[confident] Jom uji penguasaan tisu multisel kamu! Asingkan keenam-enam contoh tisu berikut kepada kategori Tisu Haiwan atau Tisu Tumbuhan.","prompt":"Isihkan jenis tisu dan struktur berikut mengikut kategorinya:","buckets":[{"id":"th","label":"Tisu Haiwan"},{"id":"tt","label":"Tisu Tumbuhan"}],"items":[{"text":"Tisu otot kardium pada dinding jantung dan otot licin pada salur pencernaan","bucketId":"th","note":"Tepat! Otot licin, rangka dan kardium ialah jenis tisu otot haiwan."},{"text":"Tisu penghubung berserat (tendon & ligamen), rawan dan tisu adipos","bucketId":"th","note":"Betul! Ini komponen tisu penghubung dalam badan haiwan dan manusia."},{"text":"Tisu epitelium bersilia melapik trakea dan tisu saraf (neuron)","bucketId":"th","note":"Tepat! Epitelium dan saraf ialah dua daripada empat tisu asas haiwan."},{"text":"Tisu meristem apeks di hujung akar dan meristem lateral","bucketId":"tt","note":"Betul! Tisu meristem tumbuhan membahagi secara aktif melalui mitosis."},{"text":"Tisu asas parenkima, kolenkima dan sklerenkima","bucketId":"tt","note":"Tepat! Ketiga-tiganya membentuk kumpulan tisu asas tumbuhan."},{"text":"Tisu vaskular xilem dan floem (elemen tiub tapis)","bucketId":"tt","note":"Betul! Xilem mengangkut air/mineral dan floem mengangkut bahan organik."}],"explanation":"Haiwan mempunyai 4 tisu (epitelium, otot, saraf, penghubung), manakala tumbuhan terdiri daripada tisu meristem dan tisu kekal (epidermis, parenkima/kolenkima/sklerenkima serta xilem/floem)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Kepadatan Organel & Penyakit","voiceCaption":"Sel khusus mengandungi kepadatan organel tertentu yang tinggi, manakala kegagalan organel seperti lisosom boleh menyebabkan penyakit Tay-Sachs.","voiceScript":"[warm] Mengapakah sel sperma, sel otot penerbangan burung dan sel meristem hujung akar mempunyai ribuan mitokondrion? Kerana semuanya memerlukan tenaga A T P yang sangat tinggi! Sebaliknya, sel pankreas dan sel goblet padat dengan jalinan endoplasma kasar dan jasad Golgi untuk mensintesis dan merembeskan enzim pencernaan serta mukus, manakala sel hati padat dengan jalinan endoplasma licin dan jasad Golgi bagi detoksifikasi dadah! Jika berlaku kegagalan organel seperti kekurangan enzim di dalam lisosom, ia mencetuskan penyakit keturunan Tay Sachs yang menjejaskan pertumbuhan serta perkembangan mental!","title":"Kepadatan Organel (Jadual 2.1) & Kesan Kegagalan Organel","acronym":"M•K•J•G","hook":"Setiap sel menumpukan organel mengikut 'kerjaya' utamanya — apabila satu organel rosak seperti lisosom dalam penyakit Tay-Sachs, seluruh organisma menerima padahnya!","summary":"Kepadatan tinggi sesuatu organel mencerminkan keperluan tenaga, fotosintesis, sintesis enzim atau detoksifikasi sel khusus tersebut.","bullets":["Jadual 2.1 Kepadatan Organel: (1) Mitokondrion tinggi -> Sel sperma (berenang ke tiub Falopio), Sel otot penerbangan serangga/burung (pengecutan aktif), Sel meristem tumbuhan (pembahagian sel aktif); (2) Kloroplas tinggi -> Sel mesofil palisad & mesofil berspan (serap cahaya maksimum untuk fotosintesis); (3) Jalinan Endoplasma Kasar & Jasad Golgi tinggi -> Sel pankreas (sintesis & rembes enzim pencernaan), Sel goblet epitelium usus/respirasi (hasilkan mukus); (4) Jalinan Endoplasma Licin & Jasad Golgi tinggi -> Sel hati (metabolisme karbohidrat & detoksifikasi dadah/racun).","Kesan Kekurangan atau Kegagalan Organel: Disfungsi mitokondrion menyebabkan pertumbuhan terbantut, otot lemah serta masalah pendengaran dan penglihatan. Kegagalan penghasilan enzim dalam lisosom menyebabkan penyakit keturunan Tay-Sachs yang mengakibatkan pertumbuhan terbantut dan terencat akal."],"labId":"bio42_tisu_kepadatan_lab","labTitle":"Kalkulator Kepadatan Organel Jadual 2.1","labProps":{"tab":"kepadatan"},"examTip":"Skema Kertas 2: Apabila menerangkan kepadatan tinggi mitokondrion dalam sel meristem atau sel sperma, wajib kaitkan dengan penghasilan tenaga ATP yang tinggi melalui respirasi sel!"},{"type":"match","xp":15,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Sel & Organel Dominan","voiceCaption":"Padankan jenis sel khusus berikut dengan organel yang paling tinggi kepadatannya menurut Jadual 2.1.","voiceScript":"[confident] Uji ketepatan Jadual dua perpuluhan satu kamu! Padankan lima sel khusus ini dengan organel yang paling padat di dalamnya.","prompt":"Padankan sel khusus berikut dengan organel berketumpatan tinggi yang tepat:","pairs":[{"id":"k1","left":"Sel sperma & sel meristem tumbuhan","right":"Mitokondrion — jana tenaga ATP untuk berenang atau pembahagian sel aktif"},{"id":"k2","left":"Sel mesofil palisad","right":"Kloroplas — serap cahaya matahari maksimum untuk fotosintesis"},{"id":"k3","left":"Sel pankreas & sel goblet","right":"Jalinan endoplasma kasar & jasad Golgi — sintesis dan rembes enzim atau mukus"},{"id":"k4","left":"Sel hati","right":"Jalinan endoplasma licin & jasad Golgi — metabolisme karbohidrat & detoksifikasi racun"}],"explanation":"Sel memerlukan banyak tenaga (sperma, otot, meristem) padat mitokondrion; sel fotosintesis padat kloroplas; sel perembes protein (pankreas, goblet) padat JE kasar & jasad Golgi; sel hati padat JE licin & jasad Golgi."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Kajian Kes Kegagalan Organel","voiceCaption":"Kenal pasti organel yang gagal berfungsi dalam penyakit keturunan Tay-Sachs.","voiceScript":"[curious] Soalan klinikal peperiksaan! Seorang kanak-kanak mengalami penyakit keturunan Tay Sachs yang menyebabkan pertumbuhan terbantut dan masalah saraf akibat kegagalan enzim. Organel manakah yang gagal berfungsi?","prompt":"Penyakit keturunan Tay-Sachs menyebabkan pesakit mengalami pertumbuhan terbantut dan terencat akal. Kegagalan penghasilan enzim pada organel manakah yang mencetuskan penyakit ini?","options":["Lisosom","Kloroplas","Sentriol","Vakuol"],"correctIndex":0,"explanation":"Penyakit Tay-Sachs berpunca daripada kegagalan enzim hidrolitik dihasilkan di dalam lisosom, lalu menyebabkan bahan sisa tidak dapat diuraikan dan memudaratkan sel."}]},{"id":"bio42-u4","title":"Unit 4: Aras Organisasi & 11 Sistem Organ Multisel","subtitle":"Subtopik 2.4 — Urutan Aras Organisasi, Organ Jantung, 11 Sistem Organ Manusia & Sistem Pucuk/Akar Tumbuhan","iconType":"scale","iconUrl":"../assets/icons/bio42-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Aras Organisasi & 11 Sistem","voiceCaption":"Sel membentuk tisu, tisu membentuk organ, organ membentuk sistem dan semua sistem bergabung membentuk organisma multisel yang lengkap.","voiceScript":"[warm] Bagaimana triliunan sel di dalam tubuh kita bekerjasama dengan teratur? Mengikut urutan aras organisasi: sel membentuk tisu, pelbagai tisu bergabung membentuk organ seperti jantung dan kulit, organ bekerjasama membentuk sistem organ, dan kesemua sebelas sistem organ manusia berkoordinasi membentuk satu organisma lengkap! Dalam tumbuhan pula, organisasinya terbahagi kepada dua sistem utama iaitu sistem pucuk yang merangkumi batang, daun, bunga dan buah, serta sistem akar untuk menyerap air, garam mineral dan memberi sokongan!","title":"2.4 Aras Organisasi Sel, 11 Sistem Organ Manusia & Sistem Tumbuhan","acronym":"S•T•O•S•O","hook":"Jantung bukan hanya otot — ia dibina oleh empat tisu sekali gus: tisu epitelium, tisu otot kardium, tisu penghubung darah dan tisu saraf pengawal rentak denyutan!","summary":"Organisma multisel tersusun mengikut hierarki Sel -> Tisu -> Organ -> Sistem -> Organisma yang merangkumi 11 sistem organ manusia serta sistem pucuk dan akar tumbuhan.","bullets":["Hierarki & Contoh Organ Jantung: Sel -> Tisu -> Organ -> Sistem -> Organisma. Jantung ialah organ yang menggabungkan tisu epitelium (isi ruang dalaman), tisu otot kardium (pam darah), tisu penghubung/darah (menghubungkan sistem dalam organ) dan tisu saraf (mengawal atur ritma denyutan jantung). Kulit juga merupakan organ terbesar kerana terdiri daripada gabungan beberapa jenis tisu.","11 Sistem Organ Manusia & 2 Sistem Tumbuhan: Sistem manusia — Endokrin (rembes hormon), Respirasi (pertukaran O2 & CO2), Otot (pengecutan menghasilkan pergerakan), Pembiakan lelaki & perempuan (hasil sperma/ovum & hormon seks), Limfa (imbang bendalir & cegah penyakit berjangkit), Saraf (kesan & hantar impuls), Peredaran darah (angkut nutrien, gas & sisa), Pencernaan (cerna makanan), Urinari (singkir urea & asid urik), Rangka (sokong tubuh & lindung organ dalaman) serta Integumen (kulit lindung kecederaan, jangkitan & penyahhidratan). Tumbuhan pula terdiri daripada Sistem Pucuk (batang, daun, pucuk, bunga, buah) dan Sistem Akar."],"labId":"bio42_organisasi_sistem_lab","labTitle":"Peta Interaktif 11 Sistem Organ & Hierarki Sel","labProps":{"tab":"sistem"},"examTip":"Jika ditanya mengapa kulit atau daun dikelaskan sebagai ORGAN dan bukan tisu: Jawab bahawa ia terdiri daripada beberapa jenis tisu berbeza yang bergabung untuk menjalankan satu fungsi khusus!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Hierarki Organisasi Sel","voiceCaption":"Susun urutan aras organisasi daripada unit asas kehidupan sehingga membentuk satu organisma multisel yang lengkap.","voiceScript":"[confident] Susun lima peringkat hierarki organisasi sel dalam organisma multisel daripada unit paling ringkas hingga paling kompleks!","prompt":"Susun urutan aras organisasi sel dalam organisma multisel:","hint":"Bermula dengan unit asas (Sel) dan berakhir dengan hidupan lengkap (Organisma).","answerTokens":["Sel","Tisu","Organ","Sistem","Organisma"],"distractors":["Molekul","Komuniti"],"explanation":"Urutan aras organisasi dalam organisma multisel ialah: Sel -> Tisu -> Organ -> Sistem -> Organisma."},{"type":"match","xp":15,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Sistem Organ & Fungsi","voiceCaption":"Padankan lima sistem organ manusia berikut dengan organ utama serta fungsinya.","voiceScript":"[confident] Jom uji penguasaan sebelas sistem organ manusia kamu! Padankan lima sistem organ ini dengan organ serta fungsi utamanya.","prompt":"Padankan setiap sistem organ manusia berikut dengan organ dan fungsinya:","pairs":[{"id":"sy1","left":"Sistem Integumen","right":"Kulit — melindungi badan daripada kecederaan fizikal, jangkitan dan penyahhidratan"},{"id":"sy2","left":"Sistem Limfa","right":"Limpa, nodus limfa & salur limfa — mengekalkan keseimbangan bendalir dan cegah jangkitan"},{"id":"sy3","left":"Sistem Urinari","right":"Ginjal, ureter, pundi kencing & uretra — menyingkirkan hasil buangan seperti urea"},{"id":"sy4","left":"Sistem Endokrin","right":"Kelenjar endokrin — merembeskan hormon untuk menyelaras aktiviti badan bersama sistem saraf"},{"id":"sy5","left":"Sistem Pucuk Tumbuhan","right":"Batang, daun, bunga & buah — fotosintesis, sokongan tegak dan pendebungaan"}],"explanation":"Setiap sistem organ terdiri daripada beberapa organ yang bekerjasama melaksanakan fungsi fisiologi khusus dalam organisma multisel."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Ketiadaan Aras Organisasi","voiceCaption":"Ramalkan kesannya jika aras organisasi sel tidak wujud dalam sesuatu organisma multisel kompleks.","voiceScript":"[curious] Soalan KBAT! Cuba ramalkan apa akan terjadi kepada organisma multisel besar sekiranya semua selnya kekal serupa tanpa pengkhususan tisu atau aras organisasi!","hook":"Semak koordinasi antara sistem organ dalam Peta 11 Sistem selepas menjawab!","scenario":"Bayangkan organisma haiwan besar hanya mempunyai sel-sel yang sama tanpa pengkhususan tisu, organ atau sistem organ.","prompt":"Mengapakah organisma multisel kompleks tidak dapat terus hidup tanpa aras organisasi sel?","options":["Sel tidak dapat menjalankan pembahagian tugas yang cekap; fungsi penting seperti pengangkutan oksigen, pencernaan dan koordinasi gagal dilakukan serentak","Semua sel akan bertukar menjadi kloroplas dan menghasilkan kanji berlebihan","Organisma akan membesar terlalu pantas tanpa kawalan melalui belahan dedua","Vakuol mengecut akan menggantikan fungsi jantung dan peparu secara automatik"],"correctIndex":0,"proofLabId":"bio42_organisasi_sistem_lab","proofState":{"tab":"sistem"},"explanation":"Tanpa pengkhususan sel dan aras organisasi (tisu, organ, sistem), tiada pembahagian kerja yang cekap untuk melaksanakan proses hidup kompleks dalam organisma multisel besar."}]},{"id":"bio42-u5","title":"Cabaran Boss SPM: Biologi Sel & Organisasi","subtitle":"Sintesis KBAT Kertas 1 & 2 — Mikrograf Organel, Osmosis Unisel, Kepadatan Organel & Sistem Organ","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Perbandingan Sel & Xilem","voiceCaption":"Kenal pasti penyesuaian salur xilem tumbuhan dalam mengangkut air dan garam mineral.","voiceScript":"[excited] Cabaran Boss S P M Bab dua bermula! Soalan pertama menilai kefahaman pengkhususan sel tumbuhan. Mengapakah salur xilem sesuai untuk mengangkut air dari akar ke pucuk?","prompt":"Antara berikut, bagaimanakah struktur salur xilem disesuaikan untuk menjalankan fungsinya dengan cekap?","options":["Membentuk tiub berongga yang panjang dan berterusan dari akar ke daun tanpa dinding hujung yang menghalang aliran air","Mengandungi ribuan kloroplas pada dinding selnya untuk menghasilkan glukosa semasa pengangkutan","Mempunyai banyak nukleus dan sentriol yang membantu pengecutan aktif menolak air ke atas","Membentuk unjuran sitoplasma panjang yang menangkap makanan secara fagositosis"],"correctIndex":0,"explanation":"Salur xilem ialah tiub berongga yang panjang dan berterusan supaya air dan garam mineral dapat diangkut dari akar ke seluruh tumbuhan tanpa halangan."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Amoeba vs Paramecium","voiceCaption":"Kelaskan enam fakta biologi berikut kepada Amoeba sp. atau Paramecium sp.","voiceScript":"[confident] Cabaran kedua! Bezakan ciri pergerakan, pemakanan dan pembiakan antara Amoeba spesies dengan Paramecium spesies.","prompt":"Isihkan pernyataan berikut kepada organisma unisel yang tepat:","buckets":[{"id":"am","label":"Amoeba sp."},{"id":"pa","label":"Paramecium sp."}],"items":[{"text":"Bergerak dengan mengunjurkan pseudopodium (kaki palsu) dan aliran sitoplasma","bucketId":"am","note":"Tepat! Amoeba sp. tiada bentuk tetap dan bergerak menggunakan pseudopodium."},{"text":"Menangkap zarah makanan secara fagositosis membentuk vakuol makanan","bucketId":"am","note":"Betul! Pseudopodium mengepung zarah makanan secara fagositosis."},{"text":"Membentuk spora apabila keadaan persekitaran kering atau kekurangan makanan","bucketId":"am","note":"Tepat! Spora hanya bercambah apabila persekitaran kembali pulih."},{"text":"Bergerak menggunakan denyutan silium secara berirama seperti dayung","bucketId":"pa","note":"Betul! Paramecium sp. berbentuk tetap dan dilitupi silia."},{"text":"Menyingkirkan makanan tidak tercerna melalui liang dubur","bucketId":"pa","note":"Tepat! Makanan masuk melalui alur mulut dan sisa keluar melalui liang dubur."},{"text":"Menjalani pembiakan seks melalui konjugasi semasa persekitaran buruk","bucketId":"pa","note":"Betul! Konjugasi bertukar bahan genetik dalam Paramecium sp."}],"explanation":"Amoeba sp. bergerak dengan pseudopodium, makan secara fagositosis dan membentuk spora semasa keadaan buruk; Paramecium sp. menggunakan silium, ada alur mulut/liang dubur dan menjalani konjugasi."},{"type":"predict","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Racun Rumpai & Akar Rambut","voiceCaption":"Ramalkan mengapa racun rumpai yang merencat respirasi mitokondrion boleh menghentikan penyerapan mineral oleh sel akar rambut.","voiceScript":"[curious] Soalan aplikasi K B A T S P M! Seorang petani menyembur racun rumpai yang merencatkan fungsi mitokondrion dalam sel akar rambut. Apakah kesannya terhadap penyerapan garam mineral?","hook":"Bandingkan keperluan mitokondrion dalam sel aktif melalui Makmal Kepadatan Organel selepas menjawab!","scenario":"Arif menggunakan sejenis racun rumpai yang merencatkan aktiviti enzim respirasi di dalam mitokondrion tisu akar rambut tumbuhan.","prompt":"Mengapakah pengangkutan garam mineral ke dalam sel akar rambut terhenti?","options":["Mitokondrion gagal menjana tenaga ATP yang diperlukan untuk mengangkut ion mineral melawan kecerunan kepekatan melalui pengangkutan aktif","Racun rumpai melarutkan kloroplas dalam sel akar rambut sehingga fotosintesis berhenti","Dinding sel selulosa akar rambut menjadi separa telap dan menghalang osmosis air","Sentriol gagal membentuk gentian gelendong pada sel epidermis akar"],"correctIndex":0,"proofLabId":"bio42_tisu_kepadatan_lab","proofState":{"tab":"kepadatan"},"explanation":"Penyerapan garam mineral oleh sel akar rambut berlaku secara pengangkutan aktif yang memerlukan tenaga ATP daripada respirasi sel dalam mitokondrion."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Organel & Tisu Khusus","voiceCaption":"Padankan organ pencernaan berenzim, sel hati, tisu epitelium dan sel mesofil dengan organel atau ciri utamanya.","voiceScript":"[confident] Satu soalan lagi menuju kejayaan penuh Bab dua! Padankan keempat-empat situasi sel dan tisu ini dengan fakta tepatnya.","prompt":"Padankan situasi fisiologi berikut dengan komponen atau tisu yang bertanggungjawab:","pairs":[{"id":"b21","left":"Organ pencernaan X merembes enzim protein","right":"Kepadatan tinggi ribosom, jalinan endoplasma kasar dan jasad Golgi"},{"id":"b22","left":"Sel hati menyahtoksik alkohol dan ubat","right":"Kepadatan tinggi jalinan endoplasma licin dan jasad Golgi"},{"id":"b23","left":"Sel epidermis akar rambut tumbuhan","right":"Tiada kloroplas kerana tiada pendedahan cahaya di bawah tanah"},{"id":"b24","left":"Sel lemak (adipos) di bawah dermis kulit","right":"Menyimpan lemak sebagai penebat haba dan perlindungan organ"}],"explanation":"Setiap sel menyesuaikan organel dan strukturnya: sel perembes enzim kaya JE kasar/Golgi; sel hati kaya JE licin/Golgi; sel akar tiada kloroplas; tisu adipos menyimpan lemak."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Tisu & Sistem Organ","voiceCaption":"Bezakan konsep sel, tisu dan organ serta peranan sistem organ dalam mengekalkan kehidupan.","voiceScript":"[excited] Soalan terakhir Boss S P M Bab dua! Bezakan dengan tepat antara tisu epitelium dengan tisu otot serta mengapa kulit dikelaskan sebagai satu organ.","prompt":"Mengapakah kulit dikelaskan sebagai organ dan bukannya tisu, serta apakah fungsi utama sistem integumen?","options":["Kulit terbina daripada gabungan beberapa tisu berbeza (epitelium, penghubung, otot, saraf) yang bekerjasama untuk melindungi badan daripada kecederaan fizikal, jangkitan dan penyahhidratan","Kulit hanya terdiri daripada satu lapisan sel seragam yang membiak melalui belahan dedua","Kulit mengandungi tisu vaskular xilem dan floem untuk menyingkirkan urea dari tubuh","Kulit berfungsi sebagai tisu asas kolenkima bagi menyokong rangka tulang manusia"],"correctIndex":0,"explanation":"Organ ialah gabungan pelbagai jenis tisu yang bekerjasama menjalankan fungsi khusus. Kulit ialah organ utama sistem integumen yang melindungi badan daripada kecederaan fizikal, jangkitan dan penyahhidratan."}]}]};</script>

    function drawFrame() {
      c2d.clearRect(0, 0, 520, 210);
      c2d.fillStyle = env === "tawar" ? "#0c4a6e" : "#3f2e0f";
      c2d.fillRect(0, 0, 520, 210);

      var vacScale = env === "tawar" ? (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.8))) : 0.35;
      c2d.save();
      c2d.translate(260, 108);
      if (org === "paramecium") {
        c2d.fillStyle = "#bae6fd";

  return Boolean(CHAPTER && /inggeris|english/i.test(String(CHAPTER.subject || "")));
}

function tUi(msText, enText) {
  return isEnglishNota() ? enText : msText;
}

var notaState = {
  mode: "map",
  activeUnitIdx: 0,
  activeStepIdx: 0,
  hearts: 5,
  maxHearts: 5,
  xp: 0,
  unitXpEarned: 0,
  combo: 0,
  maxCombo: 0,
  unitCorrect: 0,
  unitTotal: 0,
  completedUnits: {},
  muted: false,
  voiceAutoplay: true,
  answeredCurrent: false,
  activeLabCleanups: []
};

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* Procedural Web Audio Synthesizer — Zero external MP3s, iframe-sandbox safe */
var NotaAudio = (function () {
  var ctx = null;
  function getCtx() {
    if (notaState.muted || typeof window === "undefined") return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") {
      try { ctx.resume(); } catch (e2) {}
    }
    return ctx;
  }
  function tone(freq, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  var noiseBuf = null;
  function noiseBurst(dur, filterFreq, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      var len = Math.floor(c.sampleRate * 0.5);
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    var t0 = c.currentTime + (delay || 0);
    var src = c.createBufferSource();
    src.buffer = noiseBuf;
    var filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(filterFreq || 1200, t0);
    filter.Q.setValueAtTime(1.1, t0);
    var gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.09, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }
  function sweepTone(fStart, fEnd, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(fStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  return {
    playTap: function () { tone(540, 0.06, "triangle", 0.07, 0); },
    playSnap: function () {
      tone(620, 0.045, "triangle", 0.1, 0);
      tone(930, 0.08, "sine", 0.11, 0.03);
    },
    playLaserZap: function () {
      sweepTone(520, 170, 0.18, "sawtooth", 0.065, 0);
      tone(210, 0.12, "triangle", 0.06, 0.06);
    },
    playMatch: function () { tone(659.25, 0.1, "sine", 0.11, 0); tone(880, 0.13, "sine", 0.11, 0.06); },
    playCorrect: function (combo) {
      var shift = Math.min(6, Number(combo) || 0) * 28;
      tone(523.25 + shift, 0.12, "triangle", 0.13, 0);
      tone(659.25 + shift, 0.14, "triangle", 0.13, 0.08);
      tone(783.99 + shift, 0.22, "sine", 0.14, 0.16);
    },
    playWrong: function () {
      tone(240, 0.15, "sawtooth", 0.08, 0);
      tone(190, 0.22, "sawtooth", 0.08, 0.12);
    },
    playFanfare: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        tone(f, 0.24, "triangle", 0.13, i * 0.09);
      });
    },
    playPaperRustle: function () {
      noiseBurst(0.11, 1650, 0.08, 0);
      noiseBurst(0.08, 2200, 0.05, 0.04);
    },
    playPrintingPress: function () {
      sweepTone(145, 70, 0.16, "triangle", 0.14, 0);
      noiseBurst(0.06, 1850, 0.09, 0.04);
      sweepTone(125, 65, 0.15, "triangle", 0.12, 0.13);
      tone(980, 0.06, "square", 0.04, 0.2);
    },
    playOceanWave: function () {
      noiseBurst(0.36, 420, 0.07, 0);
      tone(1046.5, 0.14, "sine", 0.05, 0.06);
    },
    playFortressBoom: function () {
      sweepTone(105, 38, 0.34, "triangle", 0.16, 0);
      noiseBurst(0.18, 480, 0.08, 0.02);
    },
    playTypewriterTick: function () {
      tone(2100, 0.022, "square", 0.035, 0);
    },
    playBossDrum: function () {
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0);
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0.14);
      sweepTone(210, 110, 0.26, "triangle", 0.16, 0.28);
    }
  };
})();

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}

        nextBtn.addEventListener("click", function () {

    }

  };

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function renderSortStep(step, card) {

        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";
          msgEl.textContent = tUi("Kurang tepat — fikirkan semula fungsi atau sifat istilah ini.", "Not quite — check the grammar rule and clues.");
        }
      }
    });
  });
}

    '<div class="step-actions-footer"><button type="button" id="mcqCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button></div>";

  if (typeof bindHeroMediaClicks === "function") bindHeroMediaClicks(card, step);

  var checkBtn = document.getElementById("mcqCheckBtn");
  card.querySelectorAll(".js-mcq-opt").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      NotaAudio.playTap();
      selectedIdx = Number(btn.getAttribute("data-idx"));
      card.querySelectorAll(".js-mcq-opt").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      if (checkBtn) checkBtn.disabled = false;
    });
  });

  if (checkBtn) {
    checkBtn.addEventListener("click", function () {
      if (notaState.answeredCurrent || selectedIdx < 0) return;
      var ok = selectedIdx === Number(step.correctIndex);
      card.querySelectorAll(".js-mcq-opt").forEach(function (b, idx) {
        b.disabled = true;
        if (idx === Number(step.correctIndex)) b.classList.add("is-correct");
        else if (idx === selectedIdx && !ok) b.classList.add("is-wrong");
      });
      checkBtn.disabled = true;
      handleStepOutcome(ok, step.explanation || "", Number(step.xp) || 20, checkBtn);
    });
  }
}

function spawnXpFloat(xpAmount, anchorEl) {

  var badge = document.createElement("span");
  badge.className = "xp-float-badge";

  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}
