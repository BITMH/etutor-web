/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {

}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab03","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":3,"title":"Pergerakan Bahan Merentasi Membran Plasma","subtitle":"Subtopik 3.1-3.4 KSSM — Model Mozek Bendalir, Pengangkutan Pasif & Aktif (Pam Na+-K+ & Proton), Tonisiti Hemolisis/Krenasi/Plasmolisis serta Aplikasi Liposom & Osmosis Berbalik.","estimatedMinutes":30,"themeAccent":"#0284c7","isFreePreview":false,"labScript":"biologi-t4-bab03-labs.js","coverIcon":"../assets/icons/bio43-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan mekanisme membran plasma dan osmosis kamu sangat hebat!","combo":"[laughs warmly] Kombo yang mantap! Daripada resapan ringkas hingga pam natrium kalium, semuanya tepat!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula kecerunan kepekatan dan keupayaan air di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan empat Bab tiga berjaya kamu kuasai!"},"units":[{"id":"bio43-u1","title":"Unit 1: Struktur Model Mozek Bendalir & Ketelapan Membran","subtitle":"Subtopik 3.1 — Dwilapisan Fosfolipid, Protein Liang/Pembawa, Kolesterol, Glikoprotein & Sifat Telap Memilih","iconType":"atom","iconUrl":"../assets/icons/bio43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Model Mozek Bendalir Membran","voiceCaption":"Menurut model mozek bendalir, molekul protein terapung dalam dwilapisan fosfolipid bersama kolesterol, glikoprotein dan glikolipid membentuk struktur dinamik telap memilih.","voiceScript":"[warm] Selamat datang ke Bab tiga, Pergerakan Bahan Merentasi Membran Plasma! Sel hidup memerlukan nutrien dari persekitaran luar dan perlu menyingkirkan bahan buangan metabolisme. Mengikut model mozek bendalir, molekul protein terapung di dalam dwilapisan fosfolipid membentuk corak mozek yang sentiasa berubah dan lentur! Setiap fosfolipid mempunyai kepala berkutub yang bersifat hidrofilik dan ekor tak berkutub yang bersifat hidrofobik. Protein liang, protein pembawa, kolesterol penstabil ketelapan serta glikoprotein dan glikolipid sebagai reseptor hormon menjadikan membran plasma bersifat telap memilih!","title":"3.1 Keperluan Pergerakan Bahan & Model Mozek Bendalir","acronym":"F•P•K•G","hook":"Bayangkan lautan dwilapisan fosfolipid yang sentiasa bergerak dengan 'kapal' protein pengangkut — tonton animasi 3D membran plasma di bawah!","mediaKey":"bio43_membran_mozek","videoClip":{"src":"../assets/biologi-t4-bab03/video/bio43_video_membran_plasma.mp4","hasNarration":false,"posterKey":"bio43_membran_mozek","caption":"Struktur Model Mozek Bendalir membran plasma dan pergerakan molekul."},"summary":"Membran plasma mengawal keluar masuk bahan melalui struktur mozek bendalir bersifat telap memilih yang terdiri daripada dwilapisan fosfolipid, protein dan kolesterol.","bullets":["Dwilapisan Fosfolipid & Protein Pengangkut: Setiap fosfolipid mempunyai kepala berkutub hidrofilik (tertarik kepada air; menghadap bendalir luar sel dan sitoplasma) serta ekor tak berkutub hidrofobik (menolak air; menghadap sesama sendiri di bahagian dalam). Protein liang membentuk terowong bagi ion/zat terlarut kecil, manakala protein pembawa mengangkut molekul khusus merentasi membran.","Kolesterol, Glikoprotein, Glikolipid & Ketelapan: Kolesterol di antara fosfolipid menjadikan dwilapisan lebih kuat, lebih lentur dan kurang telap terhadap bahan larut air seperti ion. Glikoprotein dan glikolipid bertindak sebagai reseptor hormon (contohnya insulin), menstabilkan membran melalui ikatan hidrogen dengan air, serta berfungsi sebagai antigen pengecaman sel. Membran plasma ialah membran telap memilih (hanya membenarkan molekul tertentu merentasinya secara bebas)."],"labId":"bio43_membran_mozek_lab","labTitle":"Peneroka Model Mozek Bendalir 6 Komponen","labProps":{"noChol":false},"examTip":"Skema S.P.M.: Sentiasa terangkan mengapa membran plasma dikatakan 'bendalir' -> komponen fosfolipid, protein dan kolesterol tidak statik tetapi membentuk struktur dinamik dan lentur."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Komponen Membran Plasma","voiceCaption":"Padankan lima komponen utama model mozek bendalir dengan fungsinya yang tepat.","voiceScript":"[curious] Jom uji penguasaan struktur membran plasma kamu! Padankan lima komponen model mozek bendalir ini dengan peranannya yang betul.","prompt":"Padankan komponen membran plasma berikut dengan fungsinya yang tepat:","pairs":[{"id":"m1","left":"Dwilapisan fosfolipid","right":"Menghalang laluan bebas molekul besar dan ion, hanya telap kepada molekul kecil tak berkutub dan larut lipid"},{"id":"m2","left":"Kolesterol","right":"Menguatkan, melenturkan dan mengurangkan ketelapan membran terhadap ion larut air"},{"id":"m3","left":"Glikoprotein & Glikolipid","right":"Bertindak sebagai reseptor hormon insulin, menstabilkan membran dan menjadi antigen pengecaman sel"},{"id":"m4","left":"Protein liang","right":"Membentuk saluran atau terowong untuk membenarkan laluan ion dan zat terlarut kecil"},{"id":"m5","left":"Protein pembawa","right":"Mengikat molekul khusus seperti glukosa dan berubah bentuk untuk mengangkutnya merentasi membran"}],"explanation":"Setiap komponen mempunyai tugas jelas: fosfolipid membina sawar hidrofobik; kolesterol mengawal kelenturan & ketelapan ion; glikoprotein/glikolipid bertindak sebagai reseptor & antigen; protein liang dan pembawa mengangkut bahan tak larut lipid."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Ketiadaan Kolesterol","voiceCaption":"Ramalkan kesan terhadap kekuatan dan ketelapan membran plasma sekiranya kolesterol tiada dalam dwilapisan fosfolipid.","voiceScript":"[curious] Cuba fikirkan soalan ramalan ini! Apakah yang akan berlaku kepada membran plasma sel haiwan sekiranya tiada langsung molekul kolesterol di antara rantai fosfolipid?","hook":"Togol suis Kolesterol pada Peneroka Model Mozek Bendalir untuk menguji perubahan struktur membran!","scenario":"Satu sel haiwan terdedah kepada agen yang menyingkirkan semua molekul kolesterol daripada dwilapisan fosfolipid membran plasmanya.","prompt":"Apakah kesan utama ketiadaan kolesterol terhadap membran plasma sel tersebut?","options":["Membran plasma menjadi kurang kuat, kurang lentur dan lebih telap terhadap bahan larut air seperti ion","Membran plasma bertukar menjadi dinding sel selulosa yang telap penuh","Protein pembawa menghasilkan ATP sendiri tanpa memerlukan mitokondrion","Kepala hidrofilik fosfolipid berpusing menghadap ke bahagian dalam dwilapisan"],"correctIndex":0,"proofLabId":"bio43_membran_mozek_lab","proofState":{"noChol":true},"explanation":"Kolesterol menguatkan dwilapisan fosfolipid, meningkatkan kelenturannya serta menjadikannya kurang telap terhadap bahan larut air seperti ion."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Orientasi Fosfolipid","voiceCaption":"Bina pernyataan tepat tentang kedudukan kepala hidrofilik dan ekor hidrofobik dalam dwilapisan fosfolipid.","voiceScript":"[confident] Susun blok perkataan berikut untuk melengkapkan huraian tepat mengenai susunan dwilapisan fosfolipid membran plasma!","prompt":"Susun pernyataan mengenai orientasi molekul fosfolipid dalam membran plasma:","hint":"Mulakan dengan kepala berkutub hidrofilik dan akhiri dengan ekor tak berkutub hidrofobik.","answerTokens":["Kepala berkutub hidrofilik menghadap bendalir luar dan sitoplasma","manakala ekor tak berkutub hidrofobik","menghadap sesama sendiri di bahagian dalam"],"distractors":["kepala hidrofobik menghadap sitoplasma berair","ekor berkutub larut dalam darah"],"explanation":"Kepala fosfolipid bersifat hidrofilik (tertarik kepada air) menghadap luar sel dan sitoplasma, manakala ekor hidrofobik (menolak air) terlindung di bahagian tengah dwilapisan."}]},{"id":"bio43-u2","title":"Unit 2: Ciri Bahan, Pengangkutan Pasif & Pengangkutan Aktif","subtitle":"Subtopik 3.2 — Tiub Visking, Osmometer, Resapan Ringkas/Osmosis/Berbantu serta Pam Na+-K+ & Proton","iconType":"graph","iconUrl":"../assets/icons/bio43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Ciri Bahan & Pengangkutan Pasif","voiceCaption":"Pengangkutan pasif berlaku menuruni kecerunan kepekatan tanpa tenaga ATP melalui resapan ringkas, osmosis dan resapan berbantu.","voiceScript":"[warm] Molekul apakah yang boleh menembusi membran plasma? Tiga faktor penentunya ialah saiz molekul, kekutuban molekul dan cas ion! Molekul larut lipid seperti asid lemak dan vitamin A D E K serta molekul kecil seperti oksigen dan karbon dioksida meresap terus melalui dwilapisan fosfolipid secara resapan ringkas. Air pula bergerak melalui osmosis daripada keupayaan air tinggi ke rendah, seperti dalam eksperimen tiub Visking dan osmometer ringkas! Molekul besar larut air seperti glukosa, asid amino dan ion pula melalui protein liang atau pembawa secara resapan berbantu tanpa menggunakan tenaga A T P!","title":"3.2 Ciri Bahan, Eksperimen Visking & 3 Jenis Pengangkutan Pasif","acronym":"R•O•B","hook":"Pengangkutan pasif ibarat mengayuh basikal menuruni bukit — bahan bergerak menuruni kecerunan kepekatan tanpa membakar tenaga ATP!","summary":"Pengangkutan pasif tidak memerlukan ATP dan menggerakkan bahan menuruni kecerunan kepekatan sehingga keseimbangan dinamik tercapai.","bullets":["3 Faktor & Tiub Visking (Aktiviti 3.1 & 3.2): Penentu kebolehan merentasi membran ialah saiz molekul, kekutuban dan cas ion. Dalam Tiub Visking (glukosa + kanji di dalam, air suling di luar): molekul glukosa kecil meresap keluar ke bikar (Ujian Benedict positif mendakan merah bata), manakala molekul kanji besar kekal di dalam tiub (Ujian Iodin biru-hitam). Dalam osmometer ringkas (sukrosa 30% dalam tiub Visking direndam air suling), air masuk secara osmosis dan menaikkan aras larutan dalam tiub kapilari.","3 Jenis Pengangkutan Pasif: (1) Resapan ringkas — bahan larut lipid (asid lemak, gliserol, vitamin A, D, E, K, steroid) & molekul kecil tak berkutub (O2, CO2) bergerak menuruni kecerunan kepekatan terus melalui dwilapisan fosfolipid hingga keseimbangan dinamik; (2) Osmosis — pergerakan bersih molekul air dari kawasan keupayaan air tinggi (kepekatan bahan terlarut rendah) ke kawasan keupayaan air rendah merentasi membran telap memilih; (3) Resapan berbantu — ion (K+, Na+, Ca2+, Mg2+) melalui protein liang, manakala molekul besar tak larut lipid (glukosa, asid amino) mengikat pada protein pembawa menuruni kecerunan kepekatan."],"labId":"bio43_pengangkutan_sim","labTitle":"Simulator 60fps Resapan, Osmosis & Pam Aktif","labProps":{"mode":"pasif"},"examTip":"Skema S.P.M. untuk definisi Osmosis: Wajib sebut 'pergerakan bersih molekul air dari kawasan keupayaan air tinggi ke kawasan keupayaan air rendah merentasi membran telap memilih' — bukan sekadar bahan terlarut!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Laluan Bahan Membran","voiceCaption":"Kelaskan enam bahan berikut sama ada merentasi dwilapisan fosfolipid secara resapan ringkas atau memerlukan protein pengangkut.","voiceScript":"[confident] Jom uji kepekaan kamu terhadap ketelapan membran! Kelaskan enam molekul atau ion berikut mengikut laluan pergerakannya.","prompt":"Kelaskan bahan berikut mengikut laluan pergerakan merentasi membran plasma:","buckets":[{"id":"lipid","label":"Terus Melalui Dwilapisan Fosfolipid"},{"id":"protein","label":"Memerlukan Protein Liang / Pembawa"}],"items":[{"text":"Asid lemak, gliserol dan vitamin larut lemak (A, D, E, K)","bucketId":"lipid","note":"Tepat! Bahan larut lipid tak berkutub larut dalam ekor hidrofobik fosfolipid."},{"text":"Gas oksigen (O2) dan karbon dioksida (CO2)","bucketId":"lipid","note":"Betul! Molekul kecil tak berkutub meresap secara resapan ringkas."},{"text":"Molekul glukosa dan asid amino","bucketId":"protein","note":"Tepat! Molekul besar tidak larut lipid ini diangkut oleh protein pembawa."},{"text":"Ion bercas seperti Na+, K+, Ca2+ dan Mg2+","bucketId":"protein","note":"Betul! Ion bercas tidak dapat melepasi teras hidrofobik lalu menggunakan protein liang atau pam."},{"text":"Sebatian steroid tak berkutub","bucketId":"lipid","note":"Tepat! Steroid ialah lipid yang dapat meresap terus melalui dwilapisan."},{"text":"Ion hidrogen (H+) yang dipam keluar sel epitelium perut","bucketId":"protein","note":"Betul! Ion hidrogen dipam secara pengangkutan aktif melalui pam proton."}],"explanation":"Molekul kecil tak berkutub dan bahan larut lipid merentasi dwilapisan fosfolipid secara langsung; molekul besar tak larut lipid dan ion bercas memerlukan protein liang atau protein pembawa."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Pengangkutan Aktif & Pam","voiceCaption":"Pengangkutan aktif menggerakkan molekul atau ion melawan kecerunan kepekatan menggunakan tenaga ATP dan protein pembawa seperti pam natrium-kalium dan pam proton.","voiceScript":"[warm] Bagaimana jika sel perlu mengumpul ion atau bahan melawan kecerunan kepekatan? Di sinilah berlakunya pengangkutan aktif! Ia memerlukan tenaga A T P daripada respirasi sel dan protein pembawa khas yang dipanggil pam, serta mempunyai tapak reseptor untuk mengikat A T P! Contoh terkenal dalam sel haiwan ialah pam natrium kalium: tiga ion natrium terikat pada protein pembawa, A T P terurai menjadi A D P dan kumpulan fosfat lalu mengubah bentuk protein untuk mengepam tiga ion natrium keluar, kemudian dua ion kalium diikat dan diangkut masuk apabila fosfat terpisah! Pam proton pada sel epitelium perut pula mengepam ion hidrogen keluar bagi menghasilkan asid perut!","title":"Pengangkutan Aktif: Pam Natrium-Kalium & Pam Proton","acronym":"A•T•P•M","hook":"Pam Natrium-Kalium menukar bentuk protein dengan bantuan kumpulan fosfat daripada ATP untuk menolak 3 Na+ keluar dan membawa 2 K+ masuk melawan kecerunan!","summary":"Pengangkutan aktif mengumpul atau menyingkirkan bahan melawan kecerunan kepekatan dengan bantuan tenaga ATP dan protein pembawa khusus.","bullets":["Ciri Pengangkutan Aktif & Pam Natrium-Kalium: Berlaku melawan kecerunan kepekatan, memerlukan tenaga ATP daripada respirasi sel dan protein pembawa (pam) dengan reseptor ATP. Dalam Pam Natrium-Kalium: (1) 3 ion Na+ di dalam sel mengikat pada protein pembawa -> (2) Molekul ATP terurai kepada ADP + P (fosfat); ikatan fosfat membekal tenaga mengubah bentuk protein pembawa dan menyingkirkan 3 ion Na+ ke luar sel -> (3) 2 ion K+ dari luar mengikat pada protein pembawa, kumpulan fosfat tertanggal -> (4) Protein kembali ke bentuk asal dan 2 ion K+ diangkut masuk ke dalam sel.","Pam Proton & Perbandingan Pasif vs Aktif: Pam proton pada sel epitelium rongga perut menggunakan ATP untuk mengangkut ion H+ ke bendalir luar sel, menyebabkan pengumpulan ion H+ dan penghasilan asid perut. Perbezaan utama: Pengangkutan aktif memerlukan ATP dan berlaku melawan kecerunan kepekatan (membawa kepada pengumpulan/penyingkiran), sedangkan pengangkutan pasif tiada penggunaan ATP dan menuruni kecerunan hingga keseimbangan dinamik."],"labId":"bio43_pengangkutan_sim","labTitle":"Simulasi Pam Natrium-Kalium & ATP","labProps":{"mode":"aktif"},"examTip":"Skema S.P.M.: Jika soalan menyebut kehadiran racun perencat respirasi (seperti sianida) atau ketiadaan oksigen, pengangkutan aktif berhenti kerana tiada ATP dijana!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Kesan Oksigen ke atas Akar","voiceCaption":"Ramalkan sebab kepekatan garam mineral di dalam akar meningkat apabila kepekatan oksigen larutan dinaikkan sepuluh peratus.","voiceScript":"[curious] Soalan Praktis Formatif tiga perpuluhan dua! Seorang saintis merendam akar tumbuhan dalam larutan garam mineral sambil menaikkan kepekatan oksigen sebanyak sepuluh peratus. Mengapakah penyerapan garam mineral ke dalam akar meningkat?","hook":"Hidupkan mod Pam Aktif dan ATP pada Simulator Pengangkutan selepas menjawab!","scenario":"Akar tumbuhan direndam dalam larutan garam mineral berkepekatan rendah dan kepekatan oksigen terlarut dinaikkan sebanyak 10%.","prompt":"Mengapakah kepekatan garam mineral di dalam sel akar meningkat dengan ketara?","options":["Lebih banyak oksigen meningkatkan kadar respirasi sel untuk menjana lebih banyak tenaga ATP bagi pengangkutan aktif ion mineral melalui protein pembawa","Gas oksigen melarutkan dinding sel selulosa supaya ion mineral meresap secara pasif","Oksigen menurunkan keupayaan air dalam larutan sehingga osmosis berlaku ke arah luar","Ion mineral bergabung dengan oksigen membentuk glukosa yang meresap melalui dwilapisan fosfolipid"],"correctIndex":0,"proofLabId":"bio43_pengangkutan_sim","proofState":{"mode":"aktif"},"explanation":"Oksigen tambahan meningkatkan kadar respirasi aerob sel akar rambut, menjana lebih banyak molekul ATP untuk memacu pengangkutan aktif ion mineral melawan kecerunan kepekatan."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Analisis Eksperimen Tiub Visking","voiceCaption":"Tafsir keputusan ujian Benedict dan ujian Iodin ke atas kandungan tiub Visking serta bikar air suling.","voiceScript":"[confident] Uji tafsiran eksperimen Aktiviti tiga perpuluhan satu! Selepas tiga puluh minit tiub Visking berisi larutan glukosa dan ampaian kanji direndam dalam air suling, apakah keputusan ujian makanan pada air di dalam bikar?","prompt":"Tiub Visking diisi 10 ml larutan glukosa + 10 ml ampaian kanji 1% dan direndam dalam 400 ml air suling selama 30 minit. Apakah pemerhatian pada air di dalam bikar?","options":["Ujian Benedict menghasilkan mendakan merah bata; ujian Iodin kekal perang kekuningan kerana hanya molekul glukosa kecil berjaya meresap keluar melalui liang tiub Visking","Ujian Iodin bertukar biru-hitam kerana molekul kanji besar mudah menembusi liang tiub Visking","Kedua-dua ujian Benedict dan Iodin negatif kerana tiub Visking bersifat tidak telap sepenuhnya","Air di dalam bikar bertukar menjadi larutan sukrosa selepas tindak balas kondensasi"],"correctIndex":0,"explanation":"Liang pada tiub Visking (analog membran telap memilih) cukup besar untuk dilalui oleh molekul glukosa yang kecil, tetapi terlalu kecil untuk molekul kanji yang besar."}]},{"id":"bio43-u3","title":"Unit 3: Tonisiti & Kesan Larutan ke atas Sel Haiwan dan Tumbuhan","subtitle":"Subtopik 3.3 — Contoh Pasif/Aktif Organisma, Isotonik/Hipotonik/Hipertonik, Hemolisis/Krenasi & Plasmolisis/Deplasmolisis","iconType":"scale","iconUrl":"../assets/icons/bio43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Tonisiti & Contoh Organisma","voiceCaption":"Kenali contoh pengangkutan pasif dan aktif dalam organisma hidup serta perbezaan larutan isotonik, hipotonik dan hipertonik.","voiceScript":"[warm] Di manakah pengangkutan pasif dan aktif berlaku di dalam organisma sebenar? Pertukaran gas di alveolus, penyerapan air di ginjal dan akar rambut serta penyerapan fruktosa di vilus ialah pengangkutan pasif! Sebaliknya, penyerapan glukosa dan asid amino di vilus, penyerapan semula glukosa di tubul ginjal, pengangkutan sukrosa ke tisu floem dan penyerapan ion mineral akar ialah pengangkutan aktif! Seterusnya, fahami tiga jenis larutan: isotonik berkepekatan sama, hipotonik berkepekatan bahan terlarut rendah dan keupayaan air tinggi, serta hipertonik berkepekatan bahan terlarut tinggi dan keupayaan air rendah!","title":"3.3 Contoh dalam Organisma & Larutan Isotonik, Hipotonik, Hipertonik","acronym":"I•H•H","hook":"Air sentiasa bergerak secara osmosis dari larutan HIPOTONIK (keupayaan air tinggi) menuju ke larutan HIPERTONIK (keupayaan air rendah)!","summary":"Organisma menggabungkan pengangkutan pasif dan aktif dalam organ khusus, manakala arah osmosis bersih ditentukan oleh tonisiti antara bendalir intrasel dengan bendalir luar sel.","bullets":["Contoh Organisma (Pasif vs Aktif): Pengangkutan PASIF — pertukaran gas antara alveolus dan kapilari darah (resapan ringkas), penyerapan semula air melalui tubul ginjal (osmosis), penyerapan air oleh sel akar rambut (osmosis), penyerapan molekul fruktosa di vilus (resapan berbantu). Pengangkutan AKTIF — penyerapan glukosa dan asid amino di vilus, penyerapan semula glukosa di tubul ginjal, pengangkutan sukrosa dari daun ke tisu floem, penyerapan ion mineral oleh sel akar rambut.","Jadual 3.1 Tonisiti Larutan: Isotonik — larutan A dan B mempunyai kepekatan zat terlarut sama, tiada pergerakan bersih air; Hipotonik — kepekatan zat terlarut rendah dan keupayaan air tinggi (air meresap keluar dari larutan A ke B secara osmosis); Hipertonik — kepekatan zat terlarut tinggi dan keupayaan air rendah (air meresap masuk dari larutan B ke A secara osmosis)."],"labId":"bio43_tonisiti_osmosis_lab","labTitle":"Makmal Tonisiti Sel Darah Merah, Sel Tumbuhan & Kentang","labProps":{"cell":"haiwan","sol":"hipotonik"},"examTip":"Perangkap klasik: Dalam vilus usus kecil, penyerapan FRUKTOSA berlaku melalui resapan berbantu (pasif), manakala GLUKOSA dan ASID AMINO melalui pengangkutan aktif!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Pengangkutan Organisma","voiceCaption":"Padankan proses fisiologi dalam haiwan dan tumbuhan berikut dengan mekanisme pengangkutannya.","voiceScript":"[confident] Uji ingatan kamu tentang proses fisiologi sebenar! Padankan lima proses biologi ini dengan jenis pengangkutan yang tepat.","prompt":"Padankan proses dalam organisma berikut dengan mekanisme pengangkutan yang betul:","pairs":[{"id":"po1","left":"Pertukaran gas O2 & CO2 di alveolus","right":"Resapan ringkas (pengangkutan pasif)"},{"id":"po2","left":"Penyerapan fruktosa di dalam vilus usus kecil","right":"Resapan berbantu (pengangkutan pasif)"},{"id":"po3","left":"Penyerapan air oleh sel akar rambut tumbuhan","right":"Osmosis (pengangkutan pasif)"},{"id":"po4","left":"Penyerapan ion mineral oleh sel akar rambut","right":"Pengangkutan aktif menggunakan ATP"},{"id":"po5","left":"Pengangkutan sukrosa dari daun ke tisu floem","right":"Pengangkutan aktif menggunakan ATP"}],"explanation":"Alveolus menggunakan resapan ringkas; fruktosa di vilus menggunakan resapan berbantu; penyerapan air akar menggunakan osmosis; manakala ion mineral akar dan pemuatan sukrosa ke floem memerlukan ATP (pengangkutan aktif)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Hemolisis, Krenasi & Plasmolisis","voiceCaption":"Sel darah merah mengalami hemolisis dalam larutan hipotonik dan krenasi dalam larutan hipertonik, manakala sel tumbuhan mengalami kesegahan dan plasmolisis.","voiceScript":"[warm] Apa yang terjadi jika sel diletakkan dalam kepekatan larutan yang berbeza? Bagi sel darah merah dalam larutan hipotonik seperti air suling, air meresap masuk secara osmosis sehingga sel mengembang dan akhirnya meletus kerana membran plasma terlalu nipis; fenomena ini dipanggil hemolisis! Dalam larutan hipertonik, air meresap keluar dan sel darah merah mengecut, dipanggil krenasi! Bagi sel tumbuhan pula, dalam larutan hipotonik vakuol mengembang menolak sitoplasma ke dinding sel yang tegar menjadikan sel segah tanpa meletus! Dalam larutan hipertonik, air keluar dari vakuol dan membran plasma tertarik menjauhi dinding sel — itulah plasmolisis, yang boleh dipulihkan melalui deplasmolisis jika direndam semula dalam larutan hipotonik!","title":"Kesan Larutan ke atas Sel Haiwan vs Sel Tumbuhan & Ujian Kentang","acronym":"H•K•S•P•D","hook":"Sel darah merah meletus (hemolisis) dalam air suling, tetapi sel tumbuhan kekal segah selamat kerana mempunyai perisai dinding sel selulosa!","mediaKey":"bio43_osmosis_sel","summary":"Perubahan bentuk sel darah merah (hemolisis, krenasi, normal) dan sel tumbuhan (segah, plasmolisis, deplasmolisis, flasid) bergantung pada arah pergerakan bersih air secara osmosis.","bullets":["Sel Haiwan (Eritrosit / Darah Ayam): Hipotonik (air suling) -> air masuk secara osmosis, sel mengembang & meletus kerana tiada dinding sel (HEMOLYSIS); Hipertonik (NaCl 0.50 M) -> air keluar secara osmosis, sel mengecut & berduri (KRENASI); Isotonik (NaCl 0.15 M / 0.85%) -> kadar air masuk sama dengan keluar, sel kekal normal.","Sel Tumbuhan (Epidermis Bawang & Jalur Kentang): Hipotonik (air suling) -> air masuk ke vakuol, vakuol mengembang menolak membran ke dinding sel, sel menjadi SEGAH (tekanan segah penting untuk sokongan tumbuhan & buka stoma pada sel pengawal); Hipertonik (sukrosa 1.0 M) -> air keluar dari vakuol, sitoplasma mengecut & membran plasma tertarik menjauhi dinding sel (PLASMOLISIS, punca kelayuan); dikembalikan segera ke air suling -> DEPLASMOLISIS; Isotonik -> tiada perubahan bersih air, sel menjadi FLASID. Dalam Aktiviti 3.5 (jalur kentang dalam sukrosa 0.0-0.6 M), kepekatan isotonik sap sel diperoleh pada titik graf memotong paksi-X (0% perubahan jisim)."],"labId":"bio43_tonisiti_osmosis_lab","labTitle":"Simulator Sel Darah Merah, Sel Tumbuhan & Graf Kentang","labProps":{"cell":"tumbuhan","sol":"hipertonik"},"examTip":"Hafal tepat istilah DSKP: Sel haiwan = normal, mengecut (krenasi), meletus (hemolisis). Sel tumbuhan = segah, flasid, plasmolisis dan deplasmolisis."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Fenomena Osmosis Sel","voiceCaption":"Kelaskan enam fenomena osmosis berikut ke dalam keadaan larutan Hipotonik, Hipertonik atau Isotonik.","voiceScript":"[confident] Mari uji ketepatan istilah tonisiti kamu! Kelaskan keenam-enam fenomena sel haiwan dan tumbuhan ini mengikut jenis larutannya.","prompt":"Kelaskan fenomena sel berikut mengikut kepekatan larutan luar sel:","buckets":[{"id":"hipo","label":"Larutan Hipotonik"},{"id":"hiper","label":"Larutan Hipertonik"},{"id":"iso","label":"Larutan Isotonik"}],"items":[{"text":"Hemolisis — sel darah merah membengkak dan meletus dalam air suling","bucketId":"hipo","note":"Tepat! Air meresap masuk secara osmosis daripada larutan hipotonik."},{"text":"Krenasi — sel darah merah mengecut apabila direndam dalam NaCl 0.50 M","bucketId":"hiper","note":"Betul! Air keluar dari eritrosit ke larutan garam hipertonik."},{"text":"Plasmolisis — membran plasma sel bawang tertarik menjauhi dinding sel","bucketId":"hiper","note":"Tepat! Sukrosa pekat 1.0 M adalah hipertonik kepada sap sel tumbuhan."},{"text":"Sel tumbuhan menjadi segah dan sel pengawal membuka liang stoma","bucketId":"hipo","note":"Betul! Tekanan segah terhasil apabila air meresap masuk dari larutan hipotonik."},{"text":"Sel tumbuhan menjadi flasid dan eritrosit kekal bentuk cakera dwicekung normal","bucketId":"iso","note":"Tepat! Kadar pergerakan air masuk dan keluar adalah sama (sifar perubahan bersih)."},{"text":"Deplasmolisis — sel bawang terplasmolisis kembali segah apabila dialirkan air suling","bucketId":"hipo","note":"Betul! Air suling bertindak sebagai larutan hipotonik memulihkan kesegahan."}],"explanation":"Larutan hipotonik menyebabkan hemolisis (haiwan) dan kesegahan/deplasmolisis (tumbuhan); hipertonik menyebabkan krenasi (haiwan) dan plasmolisis (tumbuhan); isotonik mengekalkan bentuk normal eritrosit dan menjadikan sel tumbuhan flasid."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Graf Jalur Kentang","voiceCaption":"Ramalkan bagaimana kepekatan larutan sukrosa yang isotonik dengan sap sel ubi kentang ditentukan daripada graf peratus perbezaan jisim.","voiceScript":"[curious] Cuba ramalkan keputusan Aktiviti tiga perpuluhan lima! Apabila jalur kentang direndam dalam siri larutan sukrosa daripada kosong hingga kosong perpuluhan enam molar selama tiga puluh minit, bagaimanakah kita mengenal pasti kepekatan yang isotonik kepada sap sel kentang?","hook":"Lihat lengkung graf jisim jalur kentang pada Makmal Tonisiti selepas menjawab!","scenario":"Satu graf peratus perbezaan jisim jalur kentang (%) melawan kepekatan larutan sukrosa (M) diplotkan daripada data bikar A (air suling) hingga bikar G (0.6 M).","prompt":"Titik manakah pada graf tersebut yang menunjukkan kepekatan larutan sukrosa yang isotonik kepada sap sel ubi kentang?","options":["Titik pintasan lengkung graf pada paksi mendatar (paksi-X) di mana peratus perubahan jisim jalur kentang ialah 0%","Titik paling tinggi graf pada kepekatan 0.0 M kerana jalur kentang menyerap air maksimum","Titik paling rendah graf pada kepekatan 0.6 M kerana jisim menyusut paling banyak","Purata antara nilai jisim awal dengan jisim akhir dalam bikar air suling sahaja"],"correctIndex":0,"proofLabId":"bio43_tonisiti_osmosis_lab","proofState":{"tab":"kentang"},"explanation":"Apabila larutan luar adalah isotonik kepada sap sel kentang, kadar resapan air masuk sama dengan kadar keluar, jadi tiada perubahan jisim bersih (0% perbezaan jisim pada paksi-X)."}]},{"id":"bio43-u4","title":"Unit 4: Aplikasi Pergerakan Bahan dalam Kehidupan Harian","subtitle":"Subtopik 3.4 — Kelayuan Baja Berlebihan, Pengawetan Makanan, Minuman Rehidrasi/Isotonik, Salin, Liposom & Osmosis Berbalik","iconType":"book","iconUrl":"../assets/icons/bio43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Aplikasi Osmosis Harian","voiceCaption":"Konsep pergerakan bahan merentasi membran diaplikasikan dalam pertanian, pengawetan jeruk/ikan masin, minuman isotonik, liposom dan osmosis berbalik.","voiceScript":"[warm] Mengapakah tumbuhan boleh layu dan mati jika dibubuh baja kimia secara berlebihan? Baja yang larut menjadikan air tanah hipertonik kepada sap sel akar, lalu air meresap keluar daripada akar secara osmosis dan menyebabkan plasmolisis berpanjangan! Prinsip hipertonik yang sama digunakan untuk mengawet jeruk buah dan ikan masin menggunakan gula atau garam pekat supaya bakteria terdehidrat! Dalam perubatan pula kita menggunakan minuman penghidratan oral, minuman isotonik untuk atlet, larutan salin sifar perpuluhan lapan lima hingga sifar perpuluhan sembilan sifar gram natrium klorida per seratus mililiter, serta liposom dwilapisan fosfolipid untuk melindungi ubat daripada jus gastrik! Akhir sekali, teknologi osmosis berbalik mengenakan tekanan tinggi untuk menolak air laut melalui membran separa telap menghasilkan air tawar tulen!","title":"3.4 Kelayuan Tumbuhan, Pengawetan, Liposom & Osmosis Berbalik","acronym":"L•S•O•B","hook":"Dari memelihara ikan masin tahan berbulan-bulan hingga menulenkan air laut menjadi air minuman bersih — semuanya digerakkan oleh osmosis!","summary":"Aplikasi kehidupan harian memanfaatkan prinsip tonisiti, vesikel dwilapisan fosfolipid (liposom) dan tekanan osmosis berbalik.","bullets":["Kelayuan Baja & Pengawetan Makanan: Baja berlebihan menjadikan air tanah hipertonik terhadap sap sel akar -> air meresap keluar dari sap sel akar secara osmosis -> plasmolisis (layu dan mati jika berpanjangan). Pengawetan jeruk/ikan masin menggunakan larutan gula/garam pekat (hipertonik) agar air keluar daripada makanan dan mikroorganisma secara osmosis, menghalang pertumbuhan bakteria.","Perubatan, Kosmetik & Osmosis Berbalik: Minuman penghidratan semula/oral (pulih air & elektrolit pesakit cirit-birit), Minuman isotonik (ganti air, ion K+ dan Na+ atlet), Larutan salin (isotonik kepada plasma darah: 0.85–0.90 g NaCl per 100 ml), Liposom (vesikel larutan akueus bersalut membran dwilapisan fosfolipid melindungi ubat oral daripada dimusnahkan jus gastrik serta menghantar bahan aktif kosmetik ke sel sasaran), dan Osmosis Berbalik (tekanan tinggi menolak air laut merentasi membran separa telap; hanya molekul air tulen melepasi membran tanpa garam, bendasing atau mikroorganisma)."],"labId":"bio43_aplikasi_harian_lab","labTitle":"Simulator Osmosis Berbalik & Baja Tumbuhan","labProps":{"tab":"ro"},"examTip":"Inovasi Malaysia dalam Buku Teks: Penyelidik Malaysia mencipta membran penyulingan Sil-RH daripada sekam padi untuk proses penyahgaraman air laut!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Aplikasi Harian Osmosis","voiceCaption":"Padankan lima aplikasi harian berikut dengan prinsip pergerakan bahan merentasi membrannya.","voiceScript":"[confident] Jom padankan lima aplikasi teknologi dan kehidupan harian ini dengan prinsip sains di sebaliknya!","prompt":"Padankan aplikasi kehidupan harian berikut dengan prinsip biologi yang tepat:","pairs":[{"id":"ap1","left":"Liposom dalam ubat & kosmetik","right":"Vesikel dwilapisan fosfolipid melindungi ubat oral daripada jus gastrik hingga sampai ke sel sasaran"},{"id":"ap2","left":"Larutan salin perubatan","right":"Mengandungi 0.85-0.90 g NaCl per 100 ml yang isotonik kepada plasma darah"},{"id":"ap3","left":"Penambahan baja kimia berlebihan","right":"Menjadikan air tanah hipertonik lalu mencetuskan plasmolisis akar dan kelayuan tumbuhan"},{"id":"ap4","left":"Pengawetan cili jeruk & ikan masin","right":"Larutan gula/garam pekat hipertonik menyahhidratkan sel mikroorganisma melalui osmosis"},{"id":"ap5","left":"Penulenan air laut (Osmosis Berbalik)","right":"Tekanan dikenakan untuk memaksa molekul air tulen merentasi membran separa telap sambil menyekat garam"}],"explanation":"Setiap aplikasi bergantung pada sifat membran dan tonisiti: liposom melindungi ubat, salin menyamai kepekatan plasma darah, baja berlebihan/pengawetan menghasilkan keadaan hipertonik, dan osmosis berbalik menggunakan tekanan melawan kecerunan osmosis."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Selesaikan Masalah Sayuran Layu","voiceCaption":"Jelaskan mengapa sayuran yang layu selepas direndam lama dalam air garam boleh disegarkan semula dengan air paip.","voiceScript":"[curious] Soalan Praktis Sumatif! Mengapakah sayur sawi yang layu selepas direndam terlalu lama dalam air garam dapat dipulihkan kesegahannya apabila direndam semula dalam air paip?","prompt":"Suri rumah merendam sayur dalam air garam untuk menyingkirkan ulat, lalu sayur menjadi layu. Mengapakah merendam semula sayur itu dalam air paip memulihkan kesegarannya?","options":["Air garam hipertonik menyebabkan plasmolisis; merendam dalam air paip (hipotonik) membolehkan air meresap masuk semula ke dalam vakuol melalui osmosis (deplasmolisis)","Air paip membekalkan garam mineral melalui pengangkutan aktif walaupun sel telah mati","Garam melarutkan dinding sel tumbuhan dan diganti dengan selulosa air paip","Air garam bersifat hipotonik yang menyebabkan hemolisis pada daun"],"correctIndex":0,"explanation":"Air garam bersifat hipertonik menyebabkan air keluar (plasmolisis dan layu). Air paip adalah hipotonik kepada sap sel tumbuhan, maka air meresap masuk semula secara osmosis untuk memulihkan kesegahan (deplasmolisis)."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Bina Penerangan Osmosis Berbalik","voiceCaption":"Susun urutan proses osmosis berbalik bagi menulenkan air laut menjadi air tawar.","voiceScript":"[confident] Susun semula blok penerangan bagi menerangkan bagaimana sistem osmosis berbalik menghasilkan air tawar tulen daripada air laut!","prompt":"Susun pernyataan yang menerangkan proses osmosis berbalik dalam penulenan air laut:","hint":"Mulakan dengan aplikasi tekanan ke atas air laut melalui membran separa telap.","answerTokens":["Tekanan dikenakan untuk menolak air laut","melalui membran separa telap","yang membenarkan molekul air sahaja melepasi membran","sambil menyekat garam, bendasing dan mikroorganisma"],"distractors":["menarik garam masuk melalui pam natrium-kalium","membiarkan air tawar meresap masuk ke air laut"],"explanation":"Dalam osmosis berbalik, tekanan luar memaksa molekul air daripada air laut menembusi membran separa telap sambil menghalang garam, zarah asing dan mikroorganisma."}]},{"id":"bio43-u5","title":"Cabaran Boss SPM: Membran Plasma & Tonisiti","subtitle":"Sintesis KBAT Kertas 1 & 2 — Amoeba di Laut, Graf Kadar Pergerakan Bahan, Eritrosit & Minuman Atlet","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Amoeba sp. di Laut","voiceCaption":"Ramalkan apa yang berlaku apabila Amoeba sp. air tawar dipindahkan ke dalam air laut.","voiceScript":"[excited] Cabaran Boss S P M Bab tiga bermula! Jika Amoeba spesies daripada kolam air tawar dipindahkan ke dalam air laut yang masin, apakah yang berlaku terhadap vakuol mengecut dan selnya?","prompt":"Seekor Amoeba sp. air tawar dipindahkan ke dalam air laut. Apakah kesan yang berlaku?","options":["Air laut adalah hipertonik kepada sitoplasma; air meresap keluar daripada Amoeba sp. secara osmosis menyebabkan sel mengecut dan kadar pengecutan vakuol mengecut menurun atau berhenti","Air laut adalah hipotonik menyebabkan Amoeba sp. membengkak dan mengalami hemolisis","Vakuol mengecut mengepam air garam masuk ke dalam nukleus secara aktif","Amoeba sp. menjadi segah kerana mempunyai dinding sel selulosa yang kuat"],"correctIndex":0,"explanation":"Air laut adalah hipertonik berbanding sitoplasma Amoeba sp., menyebabkan pergerakan bersih air keluar secara osmosis; sel mengecut dan vakuol mengecut tidak perlu mengepam air berlebihan."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Pasif vs Pengangkutan Aktif","voiceCaption":"Kelaskan enam ciri berikut antara Pengangkutan Pasif dengan Pengangkutan Aktif.","voiceScript":"[confident] Cabaran kedua Boss S P M! Bezakan ciri pengangkutan pasif berbanding pengangkutan aktif secara menyeluruh.","prompt":"Isihkan pernyataan berikut kepada Pengangkutan Pasif atau Pengangkutan Aktif:","buckets":[{"id":"pas","label":"Pengangkutan Pasif"},{"id":"akt","label":"Pengangkutan Aktif"}],"items":[{"text":"Bergerak menuruni kecerunan kepekatan sehingga mencapai keseimbangan dinamik","bucketId":"pas","note":"Tepat! Resapan ringkas, osmosis dan resapan berbantu menuruni kecerunan."},{"text":"Tidak memerlukan tenaga ATP daripada respirasi sel","bucketId":"pas","note":"Betul! Pengangkutan pasif berlaku secara spontan tanpa ATP."},{"text":"Bergerak melawan kecerunan kepekatan untuk pengumpulan atau penyingkiran bahan","bucketId":"akt","note":"Tepat! Sel akar rambut mengumpul ion mineral melawan kecerunan."},{"text":"Memerlukan tenaga ATP dan protein pembawa (pam) yang berubah bentuk apabila fosfat terikat","bucketId":"akt","note":"Betul! Contohnya pam natrium-kalium dan pam proton."},{"text":"Terhenti apabila sel terdedah kepada perencat respirasi atau ketiadaan oksigen","bucketId":"akt","note":"Tepat! Tanpa respirasi aerob, tiada ATP dijana untuk pam."},{"text":"Contoh: pertukaran gas di alveolus dan penyerapan fruktosa di vilus","bucketId":"pas","note":"Betul! O2/CO2 meresap ringkas dan fruktosa meresap berbantu."}],"explanation":"Pengangkutan pasif menuruni kecerunan tanpa ATP sehingga keseimbangan dinamik; pengangkutan aktif melawan kecerunan menggunakan ATP dan protein pembawa (pam) dan terjejas oleh kekurangan oksigen."},{"type":"predict","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: 3 Tabung Uji Darah","voiceCaption":"Ramalkan keadaan sel darah merah dalam larutan natrium klorida empat perpuluhan lima peratus, air suling dan natrium klorida sifar perpuluhan lapan lima peratus.","voiceScript":"[curious] Soalan esei berformat S P M! Tiga tabung uji mengandungi darah manusia dalam larutan berbeza: empat perpuluhan lima peratus natrium klorida, air suling, dan sifar perpuluhan lapan lima peratus natrium klorida. Tabung uji manakah yang mengekalkan sel darah merah normal dan mengapa?","hook":"Bandingkan ketiga-tiga keadaan sel darah merah di Makmal Tonisiti selepas menjawab!","scenario":"Tabung uji A: 4.5% NaCl | Tabung uji B: Air suling (0%) | Tabung uji C: 0.85% NaCl. Setitis darah manusia dimasukkan ke dalam setiap tabung uji selama 30 minit.","prompt":"Apakah pemerhatian tepat bagi ketiga-tiga tabung uji A, B dan C?","options":["A: Krenasi (mengecut); B: Hemolisis (meletus menjadi larutan merah jernih); C: Bentuk cak
