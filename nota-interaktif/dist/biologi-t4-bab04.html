  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab04","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":4,"title":"Komposisi Kimia dalam Sel","subtitle":"Subtopik 4.1-4.5 KSSM — Sifat Air, Karbohidrat (Monosakarida/Disakarida/Polisakarida & Ujian Benedict), Protein (Ikatan Peptida), Lipid (Trigliserida/Lilin/Fosfolipid/Steroid) serta Asid Nukleik (DNA/RNA & Kromosom).","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"biologi-t4-bab04-labs.js","coverIcon":"../assets/icons/bio44-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan biokimia sel kamu memang luar biasa!","combo":"[laughs warmly] Kombo yang hebat! Daripada ikatan hidrogen air hingga nukleotida D N A, semuanya tepat!","encourage":"[softly] Hampir tepat... jangan mengalah! [warm] Semak semula tindak balas kondensasi dan hidrolisis di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Komposisi Kimia dalam Sel berjaya dikuasai!"},"units":[{"id":"bio44-u1","title":"Unit 1: Sifat Molekul Air dan Kepentingannya dalam Sel","subtitle":"Subtopik 4.1 — Kekutuban & Ikatan Hidrogen, Pelarut Semesta, Daya Lekitan & Lekatan serta Muatan Haba Tentu 4.2 kJ kg-1 C-1","iconType":"atom","iconUrl":"../assets/icons/bio44-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"4 Sifat Penting Molekul Air","voiceCaption":"Air ialah sebatian tak organik berkutub dengan ikatan hidrogen, daya lekitan dan lekatan serta muatan haba tentu tinggi empat perpuluhan dua kilojoule per kilogram darjah Celsius.","voiceScript":"[warm] Selamat datang ke Bab empat, Komposisi Kimia dalam Sel! Air ialah sebatian tak organik daripada unsur hidrogen dan oksigen yang menjadi medium utama tindak balas biokimia! Oleh sebab oksigen lebih elektronegatif daripada hidrogen, molekul air bersifat berkutub dan membentuk ikatan hidrogen yang menjadikannya pelarut semesta! Selain itu, daya lekitan antara molekul air dan daya lekatan pada dinding salur xilem menghasilkan tindakan kapilari! Air juga mempunyai muatan haba tentu yang tinggi iaitu empat perpuluhan dua kilojoule per kilogram per darjah Celsius untuk menstabilkan suhu badan organisma! Tonton video penerangan komposisi sel di bawah!","title":"4.1 Kekutuban Air, Daya Kapilari & Muatan Haba Tentu","acronym":"K•L•L•H","hook":"Sifat unik air membolehkan pokok setinggi 50 meter menyedut air dari akar dan badan manusia kekal seimbang pada 37°C!","mediaKey":"bio44_molekul_air","videoClip":{"src":"../assets/biologi-t4-bab04/video/bio44_video_komposisi_sel_narasi.mp4","hasNarration":true,"posterKey":"bio44_molekul_air","caption":"Komposisi Kimia dalam Sel dan Peranan Molekul Air serta Makromolekul."},"summary":"Sifat kekutuban, ikatan hidrogen, daya lekitan-lekatan dan muatan haba tentu tinggi menjadikan air penting untuk pengangkutan nutrien dan kestabilan suhu sel.","bullets":["Kekutuban & Pelarut Semesta: Atom oksigen menarik elektron lebih kuat (bercas separa negatif, delta-) berbanding hidrogen (delta+). Kekutuban ini menghasilkan ikatan hidrogen antara molekul air serta menjadikan air pelarut semesta bagi mengangkut glukosa dan elektrolit merentasi membran plasma untuk tindak balas biokimia.","Daya Lekitan, Daya Lekatan & Muatan Haba Tentu: Molekul air berpaut sesama sendiri (daya lekitan) dan melekat pada permukaan dinding xilem (daya lekatan) membentuk tindakan kapilari di ruang sempit. Muatan haba tentu air yang tinggi (4.2 kJ kg-1 °C-1) bermaksud 4.2 kJ tenaga haba diperlukan untuk menaikkan suhu 1 kg air sebanyak 1°C — membantu mengekalkan suhu badan organisma agar stabil."],"labId":"bio44_air_makromolekul_lab","labTitle":"Simulator Sifat Air, Daya Kapilari & Suhu Sel","labProps":{"tab":"air","focus":"kutub"},"examTip":"Skema S.P.M.: Jangan keliru! Daya LEKITAN ialah tarikan antara molekul air sesama air; daya LEKATAN ialah tarikan antara molekul air dengan permukaan lain seperti dinding salur xilem."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Sifat Air & Peranan","voiceCaption":"Padankan sifat molekul air berikut dengan kepentingannya dalam sel dan organisma.","voiceScript":"[curious] Mari uji ingatan kamu tentang empat sifat utama molekul air! Padankan setiap sifat air dengan peranan biologinya yang tepat.","prompt":"Padankan sifat air berikut dengan kepentingannya dalam sel dan organisma:","pairs":[{"id":"w1","left":"Kekutuban molekul air","right":"Bertindak sebagai pelarut semesta bagi glukosa dan elektrolit untuk tindak balas biokimia"},{"id":"w2","left":"Daya lekitan","right":"Tarikan antara molekul air sesama sendiri membentuk turus air berterusan"},{"id":"w3","left":"Daya lekatan","right":"Tarikan antara molekul air dengan dinding dalam salur xilem bagi tindakan kapilari"},{"id":"w4","left":"Muatan haba tentu tinggi (4.2 kJ kg-1 °C-1)","right":"Menyerap banyak haba dengan kenaikan suhu kecil untuk menstabilkan suhu badan"}],"explanation":"Kekutuban membolehkan fungsi pelarut semesta; gabungan lekitan dan lekatan memacu tindakan kapilari dalam xilem; muatan haba tentu tinggi melindungi sel daripada perubahan suhu drastik."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Perpeluhan & Haba Air","voiceCaption":"Ramalkan bagaimana proses perpeluhan menurunkan suhu badan manusia berdasarkan sifat air.","voiceScript":"[curious] Cuba jawab soalan Praktis Formatif empat perpuluhan satu ini! Bagaimanakah penyejatan peluh pada permukaan kulit membantu menyejukkan suhu badan selepas bersukan?","hook":"Periksa simulasi tenaga haba air pada Makmal Sifat Air selepas menjawab!","scenario":"Selepas berlari selama 20 minit, badan merembeskan peluh yang kebanyakannya terdiri daripada air ke atas permukaan kulit.","prompt":"Mengapakah penyejatan air peluh berkesan menurunkan suhu badan manusia?","options":["Penyejatan air memerlukan tenaga haba yang tinggi daripada badan untuk memutuskan ikatan hidrogen antara molekul air cecair supaya berubah menjadi wap air","Peluh memutuskan ikatan kovalen di dalam molekul air lalu membebaskan gas oksigen sejuk","Air peluh bertindak sebagai lemak penebat haba di atas kulit","Daya lekatan peluh menarik masuk udara sejuk ke dalam kapilari darah"],"correctIndex":0,"proofLabId":"bio44_air_makromolekul_lab","proofState":{"tab":"air","focus":"haba"},"explanation":"Apabila peluh menyejat dari permukaan kulit, banyak haba badan diserap untuk memutuskan ikatan hidrogen antara molekul air, sekali gus menyejukkan badan."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Ikatan Terputus Semasa Pendidihan","voiceCaption":"Kenal pasti ikatan kimia yang terputus apabila air cecair berubah kepada wap air.","voiceScript":"[confident] Uji ketelitian kimia sel kamu! Apabila air cecair berubah menjadi wap air, ikatan apakah yang terputus?","prompt":"Apakah ikatan yang terputus apabila air berubah daripada keadaan cecair kepada wap air?","options":["Ikatan hidrogen antara molekul air","Ikatan kovalen antara atom hidrogen dan oksigen","Ikatan peptida antara rantai polimer","Ikatan ionik antara elektrolit darah"],"correctIndex":0,"explanation":"Semasa penyejatan atau pendidihan, hanya ikatan hidrogen lemah di antara molekul air terputus; ikatan kovalen di dalam molekul H2O kekal utuh."}]},{"id":"bio44-u2","title":"Unit 2: Karbohidrat (Monosakarida, Disakarida & Polisakarida)","subtitle":"Subtopik 4.2 — Unsur C:H:O (1:2:1), Gula Penurun vs Bukan Penurun, Kondensasi & Hidrolisis serta Ujian Benedict","iconType":"formula","iconUrl":"../assets/icons/bio44-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Monosakarida & Disakarida","voiceCaption":"Karbohidrat terbina daripada unsur karbon, hidrogen dan oksigen dalam nisbah satu kepada dua kepada satu, merangkumi monosakarida, disakarida dan polisakarida.","voiceScript":"[warm] Karbohidrat membekalkan tenaga dan membentuk struktur sel tumbuhan! Unsur di dalamnya ialah karbon, hidrogen dan oksigen dalam nisbah satu kepada dua kepada satu dengan formula am C H dua O dalam kurungan n. Monomer ringkasnya ialah monosakarida iaitu glukosa, fruktosa dan galaktosa — semuanya manis, larut air, menghablur dan merupakan gula penurun yang menghasilkan mendakan merah bata kuprum satu oksida apabila dipanaskan dengan larutan Benedict! Apabila dua monosakarida bergabung melalui kondensasi dengan penyingkiran satu molekul air, terbentuklah disakarida: maltosa daripada glukosa tambah glukosa, sukrosa daripada glukosa tambah fruktosa, dan laktosa daripada glukosa tambah galaktosa! Ingat: maltosa dan laktosa ialah gula penurun, tetapi sukrosa ialah gula bukan penurun!","title":"4.2 Unsur Karbohidrat, Monosakarida & Disakarida","acronym":"G•F•G•M•S•L","hook":"Kesemua monosakarida serta maltosa dan laktosa ialah gula penurun — HANYA SUKROSA dalam senarai ini merupakan gula bukan penurun!","summary":"Monosakarida ialah monomer gula penurun yang berkondensasi membentuk disakarida dan terurai semula melalui tindak balas hidrolisis.","formula":"Monosakarida + Monosakarida  --Kondensasi (-H2O)-->  Disakarida  |  Disakarida + H2O  --Hidrolisis-->  2 Monosakarida","bullets":["Monosakarida (Glukosa, Fruktosa, Galaktosa): Rasanya manis, menghablur, larut air dan mempunyai kuasa penurunan (memindahkan hidrogen/elektron menurunkan larutan Benedict biru [kuprum(II) sulfat] kepada mendakan merah bata kuprum(I) oksida tak larut). Glukosa dalam beras/anggur ialah monosakarida paling umum; fruktosa dalam madu/buah manis; galaktosa dalam susu.","Disakarida (Maltosa, Sukrosa, Laktosa): Terbentuk melalui kondensasi dua monosakarida (singkir 1 molekul air) dan terurai melalui hidrolisis (tambah 1 molekul air). Persamaan perkataan: Glukosa + Glukosa <-> Maltosa + Air; Glukosa + Fruktosa <-> Sukrosa + Air; Glukosa + Galaktosa <-> Laktosa + Air. Laktosa dan maltosa ialah gula penurun, manakala sukrosa ialah gula bukan penurun."],"labId":"bio44_karbohidrat_lab","labTitle":"Reaktor Kondensasi, Hidrolisis & Ujian Gula Penurun","labProps":{"tab":"tindakbalas"},"examTip":"Skema S.P.M.: Jika ditanya hasil ujian Benedict bagi sukrosa: Warna kekal BIRU (tiada mendakan merah bata) melainkan sukrosa dihidrolisiskan dahulu dengan asid cair panas lalu dineutralkan!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Jenis Karbohidrat","voiceCaption":"Kelaskan enam jenis karbohidrat berikut kepada Monosakarida, Disakarida atau Polisakarida.","voiceScript":"[confident] Jom uji pengelasan karbohidrat kamu! Asingkan keenam-enam contoh karbohidrat ini kepada Monosakarida, Disakarida atau Polisakarida.","prompt":"Isihkan jenis karbohidrat berikut ke dalam kumpulan yang tepat:","buckets":[{"id":"mono","label":"Monosakarida"},{"id":"di","label":"Disakarida"},{"id":"poli","label":"Polisakarida"}],"items":[{"text":"Glukosa dan Fruktosa (monomer gula ringkas penurun)","bucketId":"mono","note":"Tepat! Glukosa, fruktosa dan galaktosa ialah monosakarida."},{"text":"Galaktosa daripada gula susu","bucketId":"mono","note":"Betul! Galaktosa ialah monosakarida yang bergabung dengan glukosa membentuk laktosa."},{"text":"Maltosa dan Laktosa (disakarida gula penurun)","bucketId":"di","note":"Tepat! Terdiri daripada dua unit monosakarida."},{"text":"Sukrosa daripada tebu (gula bukan penurun)","bucketId":"di","note":"Betul! Sukrosa ialah disakarida daripada glukosa + fruktosa."},{"text":"Kanji (simpanan tumbuhan) dan Glikogen (simpanan sel otot & hati haiwan)","bucketId":"poli","note":"Tepat! Polimer ratusan glukosa simpanan tenaga."},{"text":"Selulosa pada dinding sel tumbuhan","bucketId":"poli","note":"Betul! Polisakarida struktur yang memberi kekuatan kepada dinding sel."}],"explanation":"Monosakarida: glukosa, fruktosa, galaktosa. Disakarida: maltosa, sukrosa, laktosa. Polisakarida: kanji, glikogen, selulosa."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Polisakarida & Kepentingan","voiceCaption":"Polisakarida seperti kanji, glikogen dan selulosa ialah polimer ratusan monosakarida yang tidak larut air, tidak manis dan tidak menghablur.","voiceScript":"[warm] Apabila ratusan molekul glukosa bergabung melalui kondensasi, terhasillah polisakarida seperti kanji, glikogen dan selulosa! Berbeza dengan monosakarida, polisakarida tidak larut dalam air kerana saiz molekulnya besar, tidak manis dan tidak menghablur! Ia hanya boleh diuraikan melalui hidrolisis oleh asid cair, pendidihan atau tindakan enzim! Dalam sel, glukosa membekalkan tenaga, glikogen menjadi simpanan makanan di dalam sel otot dan hati haiwan, kanji menjadi simpanan utama tumbuhan, dan selulosa membina struktur dinding sel tumbuhan!","title":"Polisakarida (Kanji, Glikogen, Selulosa) & Kepentingan Karbohidrat","acronym":"K•G•S","hook":"Walaupun dibina daripada monomer glukosa yang sama, susunan ikatan berbeza menjadikan kanji sebagai makanan simpanan manakala selulosa sebagai perisai dinding sel!","summary":"Polisakarida bertindak sebagai simpanan makanan (kanji dan glikogen) serta struktur sokongan (selulosa), dan dapat dihidrolisiskan oleh asid cair, pendidihan atau enzim.","bullets":["Sifat & 3 Jenis Polisakarida: Polimer ratusan monomer glukosa melalui kondensasi; tidak larut air, tidak berasa manis dan tidak menghablur; diurai melalui hidrolisis dengan bantuan asid cair, pendidihan dan enzim. Jenis utama: Kanji (simpanan utama tumbuhan dalam kloroplas, bijirin, kentang), Glikogen (simpanan utama haiwan dalam sel otot dan sel hati) dan Selulosa (membina dinding sel tumbuhan). Kitin ialah sejenis polisakarida yang digunakan sebagai benang pembedahan boleh terurai.","3 Kepentingan Karbohidrat dalam Sel: (1) Sumber tenaga utama (cth. glukosa dioksidakan dalam respirasi sel), (2) Simpanan makanan (glikogen dalam sel haiwan, kanji dalam sel tumbuhan), dan (3) Struktur sokongan (selulosa pada dinding sel tumbuhan)."],"labId":"bio44_karbohidrat_lab","labTitle":"Ujian Benedict Gula Penurun vs Sukrosa","labProps":{"tab":"benedict"},"examTip":"Untuk menguji kehadiran SUKROSA (gula bukan penurun): (1) Didihkan larutan sukrosa bersama asid hidroklorik cair (menghidrolisis sukrosa kepada glukosa + fruktosa), (2) Sejukkan dan neutralkan dengan serbuk natrium hidrogen karbonat, (3) Panaskan dengan larutan Benedict -> mendakan merah bata terbentuk!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Bina Persamaan Disakarida","voiceCaption":"Susun persamaan perkataan bagi pembentukan dan penguraian disakarida sukrosa.","voiceScript":"[confident] Susun semula persamaan perkataan tindak balas kondensasi yang menghasilkan disakarida sukrosa!","prompt":"Susun persamaan perkataan bagi pembentukan sukrosa melalui kondensasi:","hint":"Sukrosa terbentuk daripada gabungan glukosa dan fruktosa sambil menyingkirkan air.","answerTokens":["Glukosa + Fruktosa","-- Kondensasi -->","Sukrosa + Air"],"distractors":["Glukosa + Galaktosa","-- Hidrolisis -->","Maltosa + Air"],"explanation":"Glukosa + Fruktosa --(kondensasi)--> Sukrosa + Air. Sebaliknya, Sukrosa + Air --(hidrolisis)--> Glukosa + Fruktosa."},{"type":"predict","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Ramal Ujian Benedict Sukrosa","voiceCaption":"Ramalkan keputusan ujian Benedict ke atas larutan sukrosa sebelum dan selepas dihidrolisiskan dengan asid hidroklorik cair.","voiceScript":"[curious] Cuba ramalkan hasil makmal! Satu sampel air tebu mengandungi sukrosa diuji terus dengan larutan Benedict panas, kemudian sampel kedua dididihkan dengan asid hidroklorik cair dan dineutralkan sebelum ujian Benedict. Apakah pemerhatiannya?","hook":"Jalankan ujian maya pada Makmal Ujian Benedict selepas menjawab!","scenario":"Tabung uji X: Larutan sukrosa + Benedict (dipanaskan terus). Tabung uji Y: Larutan sukrosa dididihkan dengan asid hidroklorik cair, disejukkan, dineutralkan dengan NaHCO3, lalu dipanaskan dengan Benedict.","prompt":"Apakah warna akhir yang diperhatikan pada tabung uji X dan tabung uji Y?","options":["X: Kekal biru (sukrosa ialah gula bukan penurun); Y: Mendakan merah bata terbentuk kerana sukrosa telah terhidrolisis kepada glukosa dan fruktosa","X: Mendakan merah bata; Y: Kekal biru kerana asid memusnahkan kuprum(II) sulfat","Kedua-dua X dan Y bertukar menjadi warna biru-hitam","Kedua-dua X dan Y kekal jernih tanpa mendakan"],"correctIndex":0,"proofLabId":"bio44_karbohidrat_lab","proofState":{"tab":"benedict"},"explanation":"Sukrosa ialah gula bukan penurun (X kekal biru). Setelah dihidrolisiskan dengan asid cair panas dan dineutralkan, monomer glukosa dan fruktosa (gula penurun) dibebaskan lalu menghasilkan mendakan merah bata dalam Y."}]},{"id":"bio44-u3","title":"Unit 3: Protein (Asid Amino, Dipeptida & Polipeptida)","subtitle":"Subtopik 4.3 — Unsur C, H, O, N (S, P), Ikatan Peptida, Kondensasi/Hidrolisis Dipeptida serta Kepentingan Protein","iconType":"book","iconUrl":"../assets/icons/bio44-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Struktur & Kepentingan Protein","voiceCaption":"Protein ialah polimer polipeptida daripada kira-kira dua puluh jenis asid amino semula jadi yang dicantum oleh ikatan peptida melalui kondensasi.","voiceScript":"[warm] Protein terbina daripada unsur karbon, hidrogen, oksigen dan nitrogen, manakala kebanyakan protein juga mengandungi sulfur dan fosforus! Monomer protein ialah asid amino, dan terdapat kira-kira dua puluh jenis asid amino semula jadi! Dua asid amino bergabung melalui tindak balas kondensasi membentuk satu dipeptida melalui ikatan peptida sambil menyingkirkan satu molekul air, dan rantaian berterusan membentuk polipeptida! Protein sangat penting untuk membina sel baharu, membaiki tisu rosak, mensintesis enzim, hormon, antibodi, hemoglobin serta membina keratin pada kulit dan rambut, kolagen pada tulang, dan miosin pada otot!","title":"4.3 Unsur Protein, Pembentukan Dipeptida & Peranan Biologi","acronym":"C•H•O•N•S•P","hook":"Dengan hanya 20 jenis asid amino semula jadi, urutan yang berbeza menghasilkan ribuan protein berlainan daripada rambut keratin hingga antibodi pelawan virus!","summary":"Polipeptida terhasil daripada kondensasi asid amino melalui ikatan peptida dan menjalankan tugas struktur, pemangkinan, pengangkutan serta pertahanan sel.","formula":"Asid Amino + Asid Amino  --Kondensasi (-H2O)-->  Dipeptida + Air  (Ikatan Peptida)","bullets":["Unsur & Ikatan Peptida: Protein mengandungi unsur karbon (C), hidrogen (H), oksigen (O) dan nitrogen (N), serta kebanyakan turut mengandungi sulfur (S) dan fosforus (P). Dua molekul asid amino dihubungkan oleh ikatan peptida melalui kondensasi (menyingkir 1 molekul air) menghasilkan dipeptida; kondensasi berterusan menghasilkan rantai polipeptida (50 hingga ribuan asid amino). Hidrolisis menguraikan dipeptida kembali kepada asid amino.","Kepentingan Protein dalam Sel: Membina sel baharu, membaiki tisu rosak, mensintesis enzim, hormon, antibodi dan hemoglobin, serta membentuk struktur binaan seperti keratin (kulit, rambut, kuku), kolagen (tulang) dan miosin (tisu otot). Pencernaan polipeptida membekalkan asid amino untuk membina semula protein badan."],"labId":"bio44_protein_lipid_lab","labTitle":"Makmal Protein (Dipeptida) & Lipid","labProps":{"tab":"protein"},"examTip":"Nama ikatan wajib tepat dalam Kertas 2: Ikatan yang menghubungkan dua asid amino dalam dipeptida/polipeptida ialah IKATAN PEPTIDA!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Persamaan Dipeptida","voiceCaption":"Susun persamaan perkataan bagi pembentukan dan penguraian dipeptida daripada asid amino.","voiceScript":"[confident] Susun persamaan perkataan yang tepat bagi pembentukan satu molekul dipeptida melalui kondensasi!","prompt":"Susun persamaan perkataan bagi pembentukan dipeptida:","hint":"Dua asid amino bergabung melalui kondensasi dan menyingkirkan satu molekul air.","answerTokens":["Asid amino + Asid amino","-- Kondensasi -->","Dipeptida + Air"],"distractors":["Gliserol + Asid lemak","-- Hidrolisis -->","Trigliserida + Air"],"explanation":"Asid amino + Asid amino --(kondensasi)--> Dipeptida + Air (dihubungkan oleh ikatan peptida). Tindak balas songsang ialah hidrolisis."},{"type":"mcq","xp":15,"voiceIdKey":"u3-s3","voiceToneLabel":"Kesan Kekurangan Protein","voiceCaption":"Ramalkan kesan kekurangan protein dalam diet terhadap struktur rambut dan kuku seseorang.","voiceScript":"[curious] Soalan Praktis Formatif empat perpuluhan tiga! Jika diet harian seseorang individu kekurangan protein dalam tempoh yang panjang, apakah kesannya terhadap rambut dan kukunya?","prompt":"Apakah kesan kekurangan protein dalam diet terhadap rambut dan kuku seorang individu?","options":["Rambut menjadi rapuh, nipis serta mudah gugur dan kuku menjadi lemah atau mudah patah kerana kekurangan protein keratin","Rambut bertukar menjadi gentian selulosa yang keras","Kuku menyimpan lebihan glikogen menggantikan kolagen","Tiada kesan langsung kerana rambut dan kuku terbina daripada lipid lilin"],"correctIndex":0,"explanation":"Rambut, kulit dan kuku terbina daripada protein berstruktur iaitu keratin. Kekurangan asid amino akibat diet rendah protein menjejaskan penghasilan keratin."},{"type":"match","xp":15,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Jenis Protein & Fungsi","voiceCaption":"Padankan lima contoh protein penting dalam tubuh manusia dengan fungsi khususnya.","voiceScript":"[confident] Uji penguasaan peranan protein kamu! Padankan lima jenis protein berikut dengan tugas tepatnya dalam badan.","prompt":"Padankan jenis protein berikut dengan peranannya yang tepat:","pairs":[{"id":"pr1","left":"Keratin","right":"Protein struktur yang membina kulit, rambut dan kuku"},{"id":"pr2","left":"Kolagen","right":"Protein struktur yang memberikan kekuatan dan kelenturan pada tulang serta tisu penghubung"},{"id":"pr3","left":"Miosin","right":"Protein gentian otot yang terlibat dalam pengecutan dan pergerakan"},{"id":"pr4","left":"Haemoglobin","right":"Protein pengangkut dalam sel darah merah untuk mengangkut oksigen"},{"id":"pr5","left":"Antibodi","right":"Protein pertahanan yang meneutralkan dan memusnahkan patogen"}],"explanation":"Keratin (kulit/rambut/kuku), kolagen (tulang), miosin (otot), haemoglobin (pengangkutan O2) dan antibodi (keimunan) ialah contoh utama protein penting dalam sel dan tisu."}]},{"id":"bio44-u4","title":"Unit 4: Lipid (Trigliserida, Lemak Tepu/Tak Tepu, Lilin, Fosfolipid & Steroid)","subtitle":"Subtopik 4.4 — Unsur C, H, O (Nisbah H:O Tinggi), 1 Gliserol + 3 Asid Lemak, Jadual 4.2 serta 4 Jenis Lipid","iconType":"scale","iconUrl":"../assets/icons/bio44-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Trigliserida & Lemak Tepu/Tak Tepu","voiceCaption":"Lipid mengandungi karbon, hidrogen dan oksigen dengan nisbah atom hidrogen kepada oksigen yang jauh lebih tinggi daripada karbohidrat.","voiceScript":"[warm] Lipid ialah sebatian semula jadi bersifat hidrofobik — tidak larut dalam air tetapi larut dalam pelarut organik seperti alkohol, eter dan kloroform! Lemak dan minyak ialah trigliserida, iaitu ester yang terhasil daripada kondensasi satu molekul gliserol dengan tiga molekul asid lemak sambil menyingkirkan tiga molekul air! Asid lemak terbahagi kepada lemak tepu yang hanya mempunyai ikatan tunggal antara karbon dan berkeadaan pepejal pada suhu bilik seperti mentega, serta lemak tak tepu yang mempunyai sekurang-kurangnya satu ikatan ganda dua antara karbon dan berwujud cecair seperti minyak zaitun dan minyak ikan!","title":"4.4 Trigliserida serta Perbandingan Lemak Tepu vs Lemak Tak Tepu","acronym":"1G•3AL•T","hook":"Kedua-dua lemak tepu dan tak tepu adalah sebatian tak berkutub daripada C, H, O — hanya satu ikatan ganda dua C=C membezakan minyak cair daripada mentega pepejal!","summary":"Trigliserida terbentuk daripada 1 gliserol dan 3 asid lemak; kehadiran ikatan ganda dua C=C menentukan perbezaan antara lemak tepu dengan lemak tak tepu.","formula":"1 Gliserol + 3 Asid Lemak  <--Hidrolisis / Kondensasi-->  1 Trigliserida + 3 Air","bullets":["Pembentukan Trigliserida: Lipid dibina daripada unsur C, H dan O dengan nisbah atom H kepada O yang jauh lebih tinggi berbanding karbohidrat. Gliserol ialah alkohol tiga karbon dengan tiga kumpulan hidroksil (-OH). Kondensasi 1 molekul gliserol dengan 3 molekul asid lemak menghasilkan 1 trigliserida + 3 molekul air.","Jadual 4.1 & 4.2 Lemak Tepu vs Tak Tepu: Persamaan — unsur C, H, O; mengandungi gliserol dan asid lemak; molekul tak berkutub. Perbezaan: Lemak TEPU hanya ada ikatan tunggal antara karbon, tidak boleh menerima atom H tambahan, berkeadaan pepejal pada suhu bilik (mentega, lemak haiwan). Lemak TAK TEPU ada sekurang-kurangnya satu ikatan ganda dua antara karbon (-C=C-), masih boleh menerima atom H tambahan, berkeadaan cecair pada suhu bilik (minyak zaitun, minyak ikan)."],"labId":"bio44_protein_lipid_lab","labTitle":"Pembanding Lemak Tepu vs Tak Tepu & 4 Jenis Lipid","labProps":{"tab":"lipid"},"examTip":"Jangan tertukar angka dalam persamaan trigliserida: 1 gliserol + 3 asid lemak menghasilkan 1 trigliserida + TIGA molekul air (bukan 1 air)!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Lemak Tepu vs Tak Tepu","voiceCaption":"Kelaskan enam ciri dan contoh berikut antara Lemak Tepu dengan Lemak Tak Tepu mengikut Jadual 4.2.","voiceScript":"[confident] Asingkan keenam-enam ciri berikut dengan tepat antara Lemak Tepu dengan Lemak Tak Tepu!","prompt":"Isihkan ciri dan sumber berikut kepada Lemak Tepu atau Lemak Tak Tepu:","buckets":[{"id":"tepu","label":"Lemak Tepu"},{"id":"taktepu","label":"Lemak Tak Tepu"}],"items":[{"text":"Asid lemak hanya mempunyai ikatan tunggal antara atom karbon","bucketId":"tepu","note":"Tepat! Tiada ikatan ganda dua pada rantai asid lemak tepu."},{"text":"Tidak dapat membentuk ikatan kimia dengan atom hidrogen tambahan","bucketId":"tepu","note":"Betul! Semua ikatan karbon telah tepu sepenuhnya."},{"text":"Wujud dalam bentuk pepejal pada suhu bilik seperti mentega dan lemak haiwan","bucketId":"tepu","note":"Tepat! Lemak haiwan lazimnya tepu dan pepejal pada suhu bilik."},{"text":"Mempunyai sekurang-kurangnya satu ikatan ganda dua antara karbon (-C=C-)","bucketId":"taktepu","note":"Betul! Kehadiran ikatan ganda dua membengkokkan rantai asid lemak."},{"text":"Masih boleh menerima satu atau lebih atom hidrogen tambahan","bucketId":"taktepu","note":"Tepat! Ikatan ganda dua boleh dibuka dalam tindak balas penghidrogenan."},{"text":"Wujud dalam bentuk cecair pada suhu bilik seperti minyak zaitun dan minyak ikan","bucketId":"taktepu","note":"Betul! Minyak tumbuhan dan minyak ikan kaya lemak tak tepu."}],"explanation":"Lemak tepu mempunyai ikatan tunggal sahaja, tidak menerima H tambahan dan pepejal (mentega/lemak haiwan); lemak tak tepu ada sekurang-kurangnya satu ikatan ganda dua, boleh menerima H tambahan dan cair (minyak zaitun/ikan)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"4 Jenis Lipid & Kepentingan","voiceCaption":"Empat jenis utama lipid ialah lemak, lilin, fosfolipid dan steroid seperti kolesterol, testosteron, estrogen serta progesteron.","voiceScript":"[warm] Selain lemak dan minyak, terdapat tiga lagi kelas utama lipid! Lilin terbina daripada satu molekul alkohol dan satu molekul asid lemak serta bersifat kalis air, terdapat pada kutikel epidermis daun dan sebum kulit manusia! Fosfolipid pula merupakan komponen utama membran plasma yang terdiri daripada satu gliserol, dua asid lemak dan satu kumpulan fosfat! Akhir sekali, steroid ialah lipid yang tidak mengandungi asid lemak — contohnya kolesterol, testosteron, estrogen dan progesteron! Secara keseluruhan, lipid bertindak sebagai simpanan tenaga, penebat haba dan pelapik melindungi organ dalaman!","title":"4 Jenis Lipid (Lemak, Lilin, Fosfolipid, Steroid) & Kepentingan","acronym":"L•L•F•S","hook":"Steroid adalah satu-satunya jenis lipid yang TIDAK mengandungi asid lemak — namun membina hormon seks serta kolesterol membran sel!","summary":"Keempat-empat kelas lipid menjalankan peranan unik sebagai simpanan tenaga, kalis air kutikel, struktur membran plasma dan sintesis hormon steroid.","bullets":["4 Jenis Lipid: (1) Lemak & Minyak (trigliserida: 1 gliserol + 3 asid lemak); (2) Lilin (1 alkohol + 1 asid lemak, kalis air pada kutikel daun, kulit buah & sebum kulit); (3) Fosfolipid (1 gliserol + 2 asid lemak + 1 kumpulan fosfat — membina dwilapisan membran plasma); (4) Steroid (lipid TANPA asid lemak — kolesterol, testosteron, estrogen dan progesteron).","Kepentingan Lipid dalam Sel & Organisma: Lemak menyimpan tenaga simpanan bagi haiwan, berfungsi sebagai pelapik melindungi organ dalaman (seperti ginjal/jantung) serta penebat haba bawah kulit. Lilin kalis air mengurangkan kehilangan air pada kutikel daun & buah. Glikolipid menstabilkan membran plasma dan membantu pengecaman sel, manakala kolesterol penting dalam sintesis hormon steroid."],"labId":"bio44_protein_lipid_lab","labTitle":"Pembanding Struktur 4 Kelas Lipid","labProps":{"tab":"jenis"},"examTip":"Fakta kegemaran soalan objektif S.P.M.: Apakah perbezaan struktur antara fosfolipid dengan trigliserida? Fosfolipid hanya ada DUA asid lemak dan SATU kumpulan fosfat (manakala trigliserida ada TIGA asid lemak)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Banding Komposisi Lipid","voiceCaption":"Kenal pasti jenis lipid berdasarkan kehadiran asid lemak dan kumpulan fosfat dalam komposisi molekulnya.","voiceScript":"[curious] Cuba bezakan komposisi kimia kelas-kelas lipid ini! Molekul X mengandungi satu gliserol, dua asid lemak dan satu kumpulan fosfat, manakala molekul Y tidak mengandungi asid lemak langsung. Apakah X dan Y?","hook":"Periksa kad struktur 4 Kelas Lipid selepas menjawab!","scenario":"Analisis makmal menunjukkan Molekul X mempunyai 1 gliserol + 2 asid lemak + 1 kumpulan fosfat, manakala Molekul Y ialah lipid yang langsung tiada asid lemak.","prompt":"Apakah identiti Molekul X dan Molekul Y?","options":["X ialah fosfolipid (komponen utama membran plasma) dan Y ialah steroid (seperti kolesterol, estrogen dan testosteron)","X ialah trigliserida dan Y ialah lilin kutikel daun","X ialah steroid dan Y ialah asid amino","X ialah lilin dan Y ialah glikogen"],"correctIndex":0,"proofLabId":"bio44_protein_lipid_lab","proofState":{"tab":"jenis","focus":"fosfolipid"},"explanation":"Fosfolipid terbina daripada 1 gliserol + 2 asid lemak + 1 kumpulan fosfat, manakala steroid ialah kelas lipid yang tidak mengandungi asid lemak."}]},{"id":"bio44-u5","title":"Unit 5: Asid Nukleik (Nukleotida, DNA, RNA & Kromosom)","subtitle":"Subtopik 4.5 — Unsur C, H, O, N, P, Struktur Nukleotida, Heliks Ganda Dua DNA vs Rantai Tunggal RNA, Kodon AUG & Histon-Nukleosom","iconType":"atom","iconUrl":"../assets/icons/bio44-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Nukleotida, DNA vs RNA","voiceCaption":"Asid nukleik ialah polinukleotida daripada unsur karbon, hidrogen, oksigen, nitrogen dan fosforus, terdiri daripada DNA dwirantai heliks ganda dua dan RNA rantai tunggal.","voiceScript":"[warm] Mari kita pelajari makromolekul penentu baka kita: Asid Nukleik! Ia mengandungi lima unsur iaitu karbon, hidrogen, oksigen, nitrogen dan fosforus! Monomernya ialah nukleotida, setiap satu terbina daripada tiga bahagian yang berkondensasi: gula pentosa lima karbon iaitu deoksiribosa atau ribosa, bes bernitrogen, dan kumpulan fosfat! D N A mempunyai gula deoksiribosa serta dua rantai polinukleotida antiselari berpintal menjadi heliks ganda dua dengan pasangan bes adenina bersama timina dan guanina bersama sitosina! R N A pula merupakan rantai tunggal pendek dengan gula ribosa, di mana timina digantikan oleh urasil! Tiga jenis R N A iaitu m R N A, r R N A dan t R N A bekerjasama dalam sintesis protein!","title":"4.5 Struktur Nukleotida serta Perbandingan DNA dan RNA","acronym":"G•B•F","hook":"Hanya empat huruf bes bernitrogen (A, T, G, C dalam DNA; A, U, G, C dalam RNA) sudah cukup menyimpan seluruh pelan induk kehidupan!","mediaKey":"bio44_dna_nukleotida","summary":"Nukleotida (gula pentosa + bes bernitrogen + kumpulan fosfat) berkondensasi membentuk DNA dwirantai heliks ganda dua (A-T, G-C) atau RNA rantai tunggal (A, U, G, C).","bullets":["Nukleotida & DNA: Unsur asid nukleik = C, H, O, N, P. Setiap nukleotida terdiri daripada gula pentosa (5-karbon), bes bernitrogen dan kumpulan fosfat. DNA (asid deoksiribonukleik) mengandungi gula deoksiribosa serta bes Adenin (A), Guanin (G), Timina (T) dan Sitosina (C). Dua rantai polinukleotida berpintal bertentangan arah (antiselari) membentuk heliks ganda dua; pasangan bes A=T dan G=C diikat oleh ikatan hidrogen.","RNA (Asid Ribonukleik): Mengandungi gula ribosa dan berstruktur rantai polinukleotida tunggal yang lebih pendek berbanding DNA. Timina dalam DNA digantikan oleh Urasil (U) dalam RNA (bes: A, G, C, U). Tiga jenis utama RNA ialah RNA pengutus (mRNA), RNA ribosom (rRNA) dan RNA pemindah (tRNA) yang semuanya terlibat dalam sintesis protein."],"labId":"bio44_asid_nukleik_lab","labTitle":"Pembina Heliks DNA, Pasangan Bes & Kromosom","labProps":{"tab":"dna"},"examTip":"Soalan lazim S.P.M.: Mengapakah struktur RNA lebih pendek daripada DNA? Kerana RNA hanya terhasil daripada penyalinan (transkripsi) segmen gen tertentu pada DNA sebagai satu rantai tunggal, bukan keseluruhan genom kromosom!"},{"type":"match","xp":15,"voiceIdKey":"u5-s2","voiceToneLabel":"Padan Komponen DNA & RNA","voiceCaption":"Padankan istilah komponen asid nukleik berikut dengan ciri atau pasangannya yang betul.","voiceScript":"[confident] Uji ingatan kamu tentang nukleotida DNA dan RNA! Padankan lima istilah berikut dengan keterangan tepatnya.","prompt":"Padankan komponen asid nukleik berikut dengan penerangan yang betul:","pairs":[{"id":"na1","left":"Gula deoksiribosa","right":"Gula pentosa 5-karbon yang terdapat khusus dalam nukleotida DNA"},{"id":"na2","left":"Bes Urasil (U)","right":"Menggantikan bes Timina (T) dalam struktur rantai tunggal RNA"},{"id":"na3","left":"Pasangan bes DNA (A-T, G-C)","right":"Berpasangan dan diikat bersama oleh ikatan hidrogen dalam heliks ganda dua"},{"id":"na4","left":"mRNA, rRNA dan tRNA","right":"Tiga jenis utama RNA yang bekerjasama dalam proses sintesis protein"},{"id":"na5","left":"Kumpulan fosfat","right":"Satu daripada tiga komponen nukleotida yang menyumbang unsur fosforus (P)"}],"explanation":"DNA menggunakan deoksiribosa dan bes A, T, G, C secara dwirantai heliks ganda dua; RNA menggunakan ribosa dan bes A, U, G, C secara rantai tunggal pendek (mRNA, rRNA, tRNA)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Kod Genetik & Kromosom Histon","voiceCaption":"DNA membawa maklumat pewarisan melalui kod tiga bes seperti kodon AUG bagi metionina, dan melingkari protein histon membentuk nukleosom serta kromosom.","voiceScript":"[warm] Bagaimanakah urutan bes A, T, G dan C menentukan warna mata atau jenis enzim kita? DNA membawa kod genetik dalam siri tiga bes yang ditranskripsikan kepada kodon m R N A, misalnya kodon A U G mengekod asid amino metionina, lalu diterjemahkan menjadi urutan asid amino polipeptida! Selain itu, rantai panjang D N A dibungkus kemas menjadi kromosom dengan melingkar mengelilingi protein histon untuk membentuk nukleosom, dan nukleosom berpintal membentuk struktur kromosom!","title":"Kepentingan Asid Nukleik (Kod Genetik) & Pembentukan Kromosom","acronym":"D•H•N•K","hook":"Protein histon tidak membawa maklumat genetik — tugasnya ialah menjadi 'gelendong benang' agar DNA sepanjang hampir dua meter muat di dalam satu nukleus mikron!","summary":"Asid nukleik membawa maklumat pewarisan dan mengarahkan sintesis protein melalui kod triplet, manakala DNA bergabung dengan protein histon membentuk nukleosom dan kromosom.","bullets":["Pembawa Maklumat Pewarisan & Penghasilan Protein: DNA menentukan ciri organisma melalui kod genetik siri tiga bes (A, G, C, T) yang disalin kepada kodon mRNA (cth. kodon AUG pada mRNA = asid amino metionina) lalu diterjemahkan kepada urutan asid amino rantai polipeptida bagi membentuk protein tertentu.","Pembentukan Kromosom daripada DNA & Protein: Rantai polinukleotida DNA melingkar mengelilingi protein yang dipanggil HISTON (histon tidak membawa maklumat genetik). Gabungan DNA dan protein histon membentuk NUKLEOSOM; nukleosom-nukleosom seterusnya berpintal dan memadat untuk membentuk struktur KROMOSOM."],"labId":"bio44_asid_nukleik_lab","labTitle":"Simulator Kodon AUG & Pembentukan Kromosom","labProps":{"tab":"kromosom"},"examTip":"Hafal istilah tepat Pembentukan Kromosom: DNA + Protein Histon -> Nukleosom -> Berpintal membentuk Kromosom. Jangan tersilap tulis histon membawa maklumat genetik!"},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Susun Pembentukan Kromosom","voiceCaption":"Susun urutan pembentukan struktur kromosom daripada rantai polinukleotida DNA dan protein histon.","voiceScript":"[confident] Susun langkah bagaimana molekul DNA yang panjang dipadatkan menjadi struktur kromosom di dalam nukleus!","prompt":"Susun turutan pembentukan kromosom daripada DNA dan protein:","hint":"DNA melingkari histon untuk membentuk nukleosom sebelum berpintal menjadi kromosom.","answerTokens":["Rantai polinukleotida DNA melingkar mengelilingi protein histon","membentuk unit nukleosom","Nukleosom berpintal dan memadat","membentuk struktur kromosom"],"distractors":["Histon membawa kod tiga bes metionina","Kromosom terurai kepada monosakarida"],"explanation":"Rantai polinukleotida DNA melingkari protein histon membentuk nukleosom, dan nukleosom-nukleosom berpintal membentuk kromosom."}]},{"id":"bio44-u6","title":"Cabaran Boss SPM: Komposisi Kimia dalam Sel","subtitle":"Sintesis KBAT Kertas 1 & 2 — Tindak Balas Kondensasi/Hidrolisis, Lemak vs Fosfolipid, DNA vs Polipeptida & Pemeliharaan Hidupan Akuatik Musim Sejuk","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss SPM: Kutikel Lilin & Air Musim Sejuk","voiceCaption":"Jelaskan fungsi lilin pada kulit buah dan bagaimana air membantu pencernaan serta respirasi.","voiceScript":"[excited] Cabaran Boss S P M Bab empat bermula! Soalan pertama menilai aplikasi biokimia dalam hidupan. Apakah fungsi utama lapisan lilin pada kulit buah dan kutikel daun?","prompt":"Lilin ialah sejenis lipid yang terdapat pada kutikel daun dan kulit buah. Apakah fungsi utama lapisan lilin tersebut?","options":["Bersifat kalis air untuk menghalang kehilangan air berlebihan melalui penyejatan dan melindungi permukaan buah atau daun","Menyerap cahaya matahari untuk menukar tenaga kimia semasa fotosintesis","Memecahkan gula bukan penurun kepada monosakarida secara hidrolisis","Menghasilkan haba melalui tindak balas kondensasi dengan air hujan"],"correctIndex":0,"explanation":"Lilin (1 alkohol + 1 asid lemak) bersifat kalis air, maka lapisan lilin pada kutikel daun, kulit buah dan biji benih menghalang kehilangan air berlebihan serta melindungi daripada patogen."},{"type":"sort","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss SPM: Monomer & Polimer Sel","voiceCaption":"Kelaskan enam pasangan monomer dan polimer atau makromolekul berikut mengikut jenis sebatian organik yang tepat.","voiceScript":"[confident] Cabaran kedua Boss S P M! Kelaskan keenam-enam fakta komposisi molekul ini antara Karbohidrat atau Protein berbanding Asid Nukleik atau Lipid.","prompt":"Isihkan maklumat molekul berikut kepada kategori yang tepat:","buckets":[{"id":"kp","label":"Karbohidrat & Protein"},{"id":"la","label":"Lipid & Asid Nukleik"}],"items":[{"text":"Monomer glukosa berkondensasi membentuk kanji, glikogen dan selulosa (unsur C, H, O)","bucketId":"kp","note":"Tepat! Karbohidrat dibina daripada C, H, O dengan nisbah 1:2:1."},{"text":"Monomer asid amino disambung ikatan peptida membentuk polipeptida (unsur C, H, O, N, S/P)","bucketId":"kp","note":"Betul! Protein terbina daripada 20 jenis asid amino semula jadi."},{"text":"1 gliserol + 3 asid lemak membentuk trigliserida + 3 molekul air","bucketId":"la","note":"Tepat! Lemak dan minyak ialah lipid jenis trigliserida."},{"text":"Nukleotida (gula pentosa + bes bernitrogen + fosfat) membentuk DNA dan RNA","bucketId":"la","note":"Betul! Asid nukleik mengandungi unsur C, H, O, N dan P."},{"text":"Steroid seperti kolesterol dan testosteron tidak mengandungi asid lemak","bucketId":"la","note":"Tepat! Steroid ialah kelas lipid unik tanpa asid lemak."},{"text":"Sukrosa (glukosa + fruktosa) ialah disakarida bukan penurun","bucketId":"kp","note":"Betul! Perlu hidrolisis asid sebelum ujian Benedict."}],"explanation":"Karbohidrat (monomer monosakarida) dan Protein (monomer asid amino) ialah polimer kondensasi penting; Lipid (trigliserida, lilin, fosfolipid, steroid) bersifat hidrofobik; dan Asid Nukleik terbina daripada nukleotida."},{"type":"predict","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss SPM: DNA vs Polipeptida","voiceCaption":"Bandingkan struktur molekul DNA dan molekul polipeptida serta akibat ketiadaan asid nukleik dalam sel.","voiceScript":"[curious] Soalan Praktis Sumatif empat! Jika suatu sel kehilangan asid nukleiknya, apakah dua proses utama sel yang akan gagal serta apakah perbezaan struktur antara D N A dengan polipeptida?","hook":"Bandingkan struktur nukleotida DNA dan asid amino pada Makmal Asid Nukleik selepas menjawab!","scenario":"Satu kajian membandingkan struktur makromolekul DNA dengan polipeptida di dalam sel eukariot.","prompt":"Manakah perbezaan yang tepat antara molekul DNA dengan molekul polipeptida?","options":["DNA terbina daripada monomer nukleotida (unsur C, H, O, N, P) dalam dua rantai heliks ganda dua, manakala polipeptida terbina daripada monomer asid amino (tiada ikatan hidrogen pasangan bes A-T/G-C) melalui ikatan peptida","DNA terbina daripada asid lemak dan gliserol, manakala polipeptida terbina daripada gula deoksiribosa","DNA berbentuk rantai tunggal pendek berbanding polipeptida yang berbentuk heliks ganda dua","DNA mengandungi unsur sulfur tanpa fosforus, manakala polipeptida mempunyai kumpulan fosfat"],"correctIndex":0,"proofLabId":"bio44_asid_nukleik_lab","proofState":{"tab":"dna"},"explanation":"DNA ialah dwirantai polinukleotida (gula deoksiribosa + bes A,T,G,C + fosfat, unsur C,H,O,N,P) dengan pasangan bes ikatan hidrogen, manakala polipeptida terbina daripada asid amino yang disambung ikatan peptida."},{"type":"match","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss SPM: Peranan Biokimia Sel","voiceCaption":"Padankan peranan air dalam respirasi/pencernaan, tindak balas kondensasi/hidrolisis dan aplikasi rumpai laut lestari.","voiceScript":"[confident] Satu langkah lagi sebelum tamat Bab empat! Padankan keempat-empat konsep aplikasi biokimia ini dengan huraian tepatnya.","prompt":"Padankan situasi biokimia berikut dengan penjelasannya yang tepat:","pairs":[{"id":"b41","left":"Peranan air dalam pencernaan","right":"Menjadi bahan tindak balas hidrolisis untuk menguraikan maltosa, dipeptida dan trigliserida"},{"id":"b42","left":"Peranan air dalam respirasi sel","right":"Medium pelarut bagi glukosa, oksigen dan enzim tindak balas biokimia"},{"id":"b43","left":"Cara kurangkan kanji dalam kentang masakan","right":"Rendam hirisan kentang dalam air supaya granul kanji keluar atau didih lembut untuk menghidrolisis sebahagiannya"},{"id":"b44","left":"Ketiadaan asid nukleik dalam sel","right":"Sel gagal mewariskan maklumat genetik dan gagal mensintesis protein serta enzim"}],"explanation":"Air penting sebagai pelarut biokimia respirasi dan reaktan hidrolisis pencernaan; asid nukleik pula wajib bagi pewarisan genetik dan sintesis protein."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss SPM: Sintesis Makromolekul","voiceCaption":"Rumuskan perbezaan unsur, monomer dan hasil tindak balas kondensasi keempat-empat kelas sebatian organik sel.","voiceScript":"[excited] Soalan terakhir Boss S P M Bab empat! Pilih pernyataan sintesis yang tepat merangkumi karbohidrat, protein, lipid dan asid nukleik.","prompt":"Antara kombinasi makromolekul, monomer dan hasil kondensasi berikut, manakah yang 100% tepat mengikut silibus KSSM?","options":["Polipeptida terbentuk daripada monomer asid amino melalui ikatan peptida (+ air); Trigliserida terbentuk daripada 1 gliserol + 3 asid lemak (+ 3 air); Polinukleotida terbentuk daripada monomer nukleotida","Disakarida maltosa terbentuk daripada glukosa + fruktosa; Dipeptida terbentuk melalui ikatan hidrogen tanpa penyingkiran air","Trigliserida mengandungi 1 gliserol + 2 asid lemak + 1 kumpulan fosfat; RNA mengandungi gula deoksiribosa dan timina","Kanji dan glikogen sangat larut dalam air serta menghasilkan mendakan merah bata dengan larutan Benedict tanpa hidrolisis"],"correctIndex":0,"explanation":"Setiap monomer dan ikatannya tepat: asid amino membentuk polipeptida (ikatan peptida); 1 gliserol + 3 asid lemak membentuk trigliserida (+ 3 H2O); nukleotida membentuk polinukleotida DNA/RNA."}]}]};</script>

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        });

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        if (badge) {

          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

/* 05-feedback-and-celebration.js — Drawer Feedback, Heart Recovery, Confetti & Boot */
function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function hideFeedbackDrawer() {

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);

    }
  }
  saveNotaState();

  });

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

function showCelebration() {

  var acc = notaState.unitTotal > 0 ? Math.round((notaState.unitCorrect / notaState.unitTotal) * 100) : 100;
  var stars = acc >= 85 ? 3 : (acc >= 60 ? 2 : 1);

  var prev = notaState.completedUnits[unit.id];
  var bestStars = prev ? Math.max(Number(prev.stars) || 0, stars) : stars;
  notaState.completedUnits[unit.id] = { stars: bestStars, accuracy: acc, xp: notaState.unitXpEarned };
  saveNotaState();
  NotaAudio.playFanfare();
  launchConfetti();

  var starsRow = document.getElementById("celStarsRow");
  if (starsRow) {

      return '<svg class="cel-star-slot ' + (n <= stars ? "earned" : "") + '" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' + NOTA_ICONS.star + "</svg>";

  if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayCelebration) {

  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { unitId: unit.id, unitStars: stars, accuracyPct: acc });

        '<circle cx="19.5" cy="22" r="2.2" fill="#0f172a"/>' +
