  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab05","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":5,"title":"Metabolisme dan Enzim","subtitle":"Subtopik 5.1-5.3 KSSM — Anabolisme vs Katabolisme, Penamaan IUBMB (-ase), Enzim Intrasel vs Ekstrasel, Hipotesis Mangga & Kunci, Tenaga Pengaktifan, 4 Faktor (Suhu/pH/Substrat/Enzim) serta Immobilisasi Enzim.","estimatedMinutes":30,"themeAccent":"#4f46e5","isFreePreview":false,"labScript":"biologi-t4-bab05-labs.js","coverIcon":"../assets/icons/bio45-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan mekanisme enzim dan graf kadar tindak balas kamu sangat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Daripada tenaga pengaktifan hingga faktor pengehad, semuanya tepat!","encourage":"[softly] Hampir kena... jangan risau! [warm] Semak semula suhu optimum, p H optimum dan penyahaslian enzim di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan empat Bab lima berjaya kamu takluki!"},"units":[{"id":"bio45-u1","title":"Unit 1: Metabolisme, Sifat Enzim & Penghasilan Enzim Ekstrasel","subtitle":"Subtopik 5.1 & 5.2 (Awal) — Anabolisme vs Katabolisme, Penamaan -ase, Kofaktor/Perencat & Laluan Organel Enzim Ekstrasel","iconType":"atom","iconUrl":"../assets/icons/bio45-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Anabolisme, Katabolisme & Penamaan","voiceCaption":"Metabolisme merangkumi tindak balas katabolisme yang membebaskan tenaga dan anabolisme yang menyerap tenaga, dimangkinkan oleh enzim.","voiceScript":"[warm] Selamat datang ke Bab lima, Metabolisme dan Enzim! Metabolisme ialah kesemua tindak balas kimia di dalam organisma hidup, dan ia terbahagi kepada dua jenis: katabolisme iaitu penguraian bahan kompleks menjadi ringkas sambil membebaskan tenaga seperti respirasi sel, dan anabolisme iaitu sintesis molekul kompleks daripada molekul ringkas yang menggunakan tenaga seperti fotosintesis! Supaya tindak balas ini berlaku pantas pada suhu badan, sel menghasilkan mangkin organik iaitu enzim! Mengikut sistem penamaan I U B M B, nama enzim dibentuk dengan menambah akhiran ase pada nama substrat seperti laktase untuk laktosa, kecuali enzim lama seperti pepsin, tripsin dan renin!","title":"5.1 Metabolisme (Katabolisme vs Anabolisme) & Penamaan Enzim","acronym":"K•A•I","hook":"Katabolisme MEMECAH dan MEMBEBASKAN tenaga (A -> B + C), manakala Anabolisme MEMBINA dan MENYERAP tenaga (A + B -> C)!","summary":"Metabolisme sel terdiri daripada tindak balas katabolisme dan anabolisme yang dipercepatkan oleh enzim sebagai mangkin organik khusus.","bullets":["Katabolisme vs Anabolisme: Katabolisme mengurai bahan kompleks kepada bahan ringkas dan membebaskan tenaga (A -> B + C, contohnya penguraian glukosa dalam respirasi sel). Anabolisme mensintesis molekul kompleks daripada molekul ringkas dan menyerap/menggunakan tenaga (A + B -> C, contohnya pembentukan glukosa dalam fotosintesis).","Definisi & Penamaan Enzim: Enzim ialah mangkin organik (kebanyakannya protein, namun bukan semua enzim disintesis daripada protein) yang dihasilkan oleh sel hidup; substrat terikat pada tapak aktif membentuk kompleks enzim-substrat. Sistem IUBMB menambah akhiran '-ase' pada substrat (cth. laktase memangkinkan hidrolisis laktosa), kecuali enzim konvensional yang ditemui lebih awal seperti pepsin, tripsin dan renin."],"labId":"bio45_metabolisme_enzim_lab","labTitle":"Pembanding Metabolisme & Simulator Enzim Ekstrasel","labProps":{"tab":"meta"},"examTip":"Nota penting DSKP 5.2.1: Tidak semua enzim disintesis daripada protein (sesetengah molekul RNA seperti ribozim turut bertindak sebagai mangkin)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Katabolisme vs Anabolisme","voiceCaption":"Kelaskan enam proses biologi dan ciri berikut kepada Katabolisme atau Anabolisme.","voiceScript":"[confident] Jom uji pemahaman metabolisme kamu! Asingkan keenam-enam tindak balas dan ciri ini kepada Katabolisme atau Anabolisme.","prompt":"Isihkan tindak balas dan ciri berikut kepada kategori metabolisme yang tepat:","buckets":[{"id":"kata","label":"Katabolisme"},{"id":"ana","label":"Anabolisme"}],"items":[{"text":"Menguraikan molekul kompleks kepada molekul ringkas (A -> B + C)","bucketId":"kata","note":"Tepat! Katabolisme ialah proses pemecahan molekul kompleks."},{"text":"Membebaskan tenaga semasa penguraian glukosa dalam respirasi sel","bucketId":"kata","note":"Betul! Tenaga ATP dibebaskan melalui tindak balas katabolisme."},{"text":"Hidrolisis kanji kepada maltosa dan polipeptida kepada asid amino","bucketId":"kata","note":"Tepat! Pencernaan menguraikan makromolekul kepada monomer ringkas."},{"text":"Mensintesis molekul kompleks daripada molekul ringkas (A + B -> C)","bucketId":"ana","note":"Betul! Anabolisme ialah proses pembinaan molekul baharu."},{"text":"Menggunakan atau menyerap tenaga seperti pembentukan glukosa semasa fotosintesis","bucketId":"ana","note":"Tepat! Tenaga cahaya diserap untuk membina glukosa."},{"text":"Kondensasi asid amino membentuk protein otot dan hormon","bucketId":"ana","note":"Betul! Pembinaan polipeptida memerlukan tenaga sel."}],"explanation":"Katabolisme memecahkan molekul besar kepada kecil sambil membebaskan tenaga (respirasi, pencernaan); Anabolisme membina molekul besar daripada kecil sambil menyerap tenaga (fotosintesis, sintesis protein)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Sifat Enzim & Enzim Ekstrasel","voiceCaption":"Enzim bertindak pantas dalam kuantiti kecil dan boleh diguna semula, manakala enzim ekstrasel dirembes melalui ribosom, jalinan endoplasma kasar dan jasad Golgi.","voiceScript":"[warm] Apakah sifat umum enzim? Enzim bertindak pantas, diperlukan dalam kuantiti kecil dan boleh diguna semula kerana strukturnya kekal tidak berubah selepas tindak balas! Tindak balasnya sangat khusus, berbalik, dan ada enzim memerlukan kofaktor seperti vitamin B atau ion magnesium, manakala logam berat seperti plumbum dan merkuri bertindak sebagai perencat! Bezakan juga enzim intrasel seperti heksokinase yang digunakan di dalam sel itu sendiri, dengan enzim ekstrasel seperti tripsin pankreas yang dirembes keluar sel! Tonton video penerangan enzim serta teliti laluan penghasilan enzim ekstrasel daripada ribosom ke membran plasma!","title":"Sifat Umum Enzim, Enzim Intrasel vs Laluan Enzim Ekstrasel","acronym":"R•J•V•G•M","hook":"Perjalanan enzim ekstrasel bermula di Ribosom -> JE Kasar -> Vesikel Angkutan -> Jasad Golgi -> Vesikel Rembesan -> Membran Plasma!","mediaKey":"bio45_enzim_ekstrasel","videoClip":{"src":"../assets/biologi-t4-bab05/video/bio45_video_enzim_metabolisme_narasi.mp4","hasNarration":true,"posterKey":"bio45_enzim_ekstrasel","caption":"Video Penerangan BM: Metabolisme, Mekanisme Tindakan Enzim dan Penglibatan Organel"},"summary":"Enzim khusus dan boleh diguna semula; enzim intrasel bertindak di dalam sel, manakala enzim ekstrasel diproses melalui sistem endomembran sebelum dirembes keluar.","bullets":["8 Sifat Umum Enzim & Intrasel vs Ekstrasel: Bertindak pantas, perlu dalam kuantiti kecil & boleh diguna semula, struktur tidak berubah selepas tindak balas, mangkin biologi spesifik, sesetengah perlukan kofaktor (vitamin B, ion Mg2+), diperlahankan/dihentikan oleh perencat (logam berat spt plumbum & merkuri), dan kebanyakannya berbalik. Enzim intrasel bertindak di dalam sel (cth. heksokinase dalam glikolisis); enzim ekstrasel dirembes ke luar sel (cth. tripsin dari sel pankreas ke duodenum).","6 Langkah Penghasilan Enzim Ekstrasel: (1) Ribosom mensintesis protein -> (2) Protein masuk ke lumen jalinan endoplasma kasar dan diangkut -> (3) Hujung JE kasar bertunas membentuk vesikel angkutan -> (4) Vesikel angkutan bergerak dan bercantum dengan jasad Golgi -> (5) Dalam jasad Golgi, protein diubah suai menjadi enzim dan dibungkus dalam vesikel rembesan -> (6) Vesikel rembesan bergerak dan bercantum dengan membran plasma untuk merembeskan enzim ekstrasel."],"labId":"bio45_metabolisme_enzim_lab","labTitle":"Peta Laluan 6 Langkah Enzim Ekstrasel","labProps":{"tab":"ekstrasel"},"examTip":"Skema Kertas 2: Jika ditanya apakah berlaku jika ribosom di sel pankreas gagal berfungsi -> Tiada sintesis protein/enzim pencernaan (seperti amilase/tripsin/lipase), lalu pencernaan di duodenum terganggu."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Laluan Enzim Ekstrasel","voiceCaption":"Susun urutan organel yang terlibat dalam penghasilan dan rembesan enzim ekstrasel.","voiceScript":"[confident] Susun semula urutan enam komponen sel yang bekerjasama menghasilkan serta merembeskan enzim ekstrasel seperti tripsin!","prompt":"Susun laluan penghasilan enzim ekstrasel daripada sintesis hingga rembesan:","hint":"Bermula di tapak sintesis protein (Ribosom) dan berakhir di sempadan luar sel (Membran Plasma).","answerTokens":["Ribosom","Jalinan Endoplasma Kasar","Vesikel Angkutan","Jasad Golgi","Vesikel Rembesan","Membran Plasma"],"distractors":["Lisosom","Sentriol"],"explanation":"Urutan rasmi: Ribosom -> Lumen Jalinan Endoplasma Kasar -> Vesikel Angkutan -> Jasad Golgi -> Vesikel Rembesan -> Bercantum dengan Membran Plasma."}]},{"id":"bio45-u2","title":"Unit 2: Mekanisme Tindakan Enzim (Mangga & Kunci serta Tenaga Pengaktifan)","subtitle":"Subtopik 5.2.6 & 5.2.7 — Hipotesis Mangga & Kunci, Kompleks Enzim-Substrat serta Penurunan Tenaga Pengaktifan","iconType":"formula","iconUrl":"../assets/icons/bio45-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Mangga & Kunci serta Tenaga Ea","voiceCaption":"Mengikut hipotesis mangga dan kunci, substrat spesifik sepadan dengan tapak aktif enzim dan enzim mempercepatkan tindak balas dengan menurunkan tenaga pengaktifan.","voiceScript":"[warm] Mengapakah satu jenis enzim hanya bertindak ke atas satu substrat tertentu? Hipotesis mangga dan kunci menerangkannya! Enzim berstruktur tiga dimensi dengan tapak aktif spesifik diibaratkan sebagai mangga, manakala molekul substrat yang saling melengkapi bentuk tapak aktif ialah kunci! Substrat mendekati tapak aktif lalu membentuk kompleks enzim substrat; tindak balas berlaku menghasilkan produk yang kemudiannya meninggalkan tapak aktif manakala enzim kekal bebas untuk diguna semula! Mengikut rajah tenaga pula, enzim mempercepatkan tindak balas dengan menurunkan tenaga pengaktifan iaitu tenaga minimum yang diperlukan untuk memecahkan ikatan substrat!","title":"5.2 Hipotesis 'Mangga dan Kunci' & Rajah Tenaga Pengaktifan","acronym":"M•K•E•S•P","hook":"Enzim tidak mengubah jumlah tenaga bahan atau produk — ia cuma merendahkan 'bukit halangan' tenaga pengaktifan supaya tindak balas meluncur pantas!","summary":"Enzim memangkinkan tindak balas secara khusus melalui pembentukan kompleks enzim-substrat (hipotesis mangga dan kunci) dan merendahkan tenaga pengaktifan.","bullets":["Hipotesis 'Mangga dan Kunci' (Rajah 5.3): Enzim = 'mangga' (rantai polipeptida terlipat 3D membentuk tapak aktif berkonfigurasi spesifik); Substrat = 'kunci'. (1) Substrat spesifik mendekati enzim -> (2) Substrat bergabung tepat dengan tapak aktif membentuk kompleks enzim-substrat -> (3) Tindak balas berlaku menghasilkan produk lalu produk meninggalkan tapak aktif; enzim kekal tidak berubah.","Rajah Tenaga Pengaktifan (Rajah 5.4): Tenaga pengaktifan ialah tenaga yang diperlukan untuk memecahkan ikatan dalam molekul substrat sebelum tindak balas berlaku. Kehadiran enzim menurunkan tenaga pengaktifan (lengkung tenaga lebih rendah), sekali gus meningkatkan kadar tindak balas biokimia dalam sel."],"labId":"bio45_mangga_tenaga_lab","labTitle":"Simulator Mangga & Kunci + Lengkung Tenaga Pengaktifan","labProps":{"withEnzyme":true},"examTip":"Skema Kertas 2: Apabila menerangkan mekanisme enzim, wajib nyatakan istilah 'tapak aktif enzim berkonfigurasi tiga dimensi yang saling melengkapi bentuk substrat tertentu' dan 'membentuk kompleks enzim-substrat'."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Lengkung Tenaga Enzim","voiceCaption":"Ramalkan perubahan pada lengkung tenaga pengaktifan dan sifat tapak aktif apabila enzim hadir dalam tindak balas biokimia.","voiceScript":"[curious] Cuba ramalkan perbandingan dua lengkung tenaga dalam Rajah lima perpuluhan empat! Apabila enzim ditambah ke dalam tindak balas, apakah yang berlaku kepada ketinggian tenaga pengaktifan serta struktur enzim selepas produk terhasil?","hook":"Bandingkan lengkung tenaga dengan dan tanpa enzim di Simulator Mangga & Kunci!","scenario":"Dua tindak balas penguraian substrat X dijalankan: Tindak balas P tanpa enzim dan Tindak balas Q dengan penambahan enzim khusus.","prompt":"Manakah ramalan tepat tentang profil tenaga Q berbanding P?","options":["Q mempunyai puncak tenaga pengaktifan yang jauh lebih rendah berbanding P, manakala tenaga awal substrat dan tenaga akhir produk adalah sama serta enzim Q kekal tidak berubah","Q menaikkan tenaga pengaktifan dan mengurangkan kandungan tenaga produk akhir","Enzim dalam Q dimusnahkan bersama substrat untuk membentuk sebahagian daripada produk","Tapak aktif enzim dalam Q berubah bentuk secara kekal bagi menerima sebarang jenis substrat lain"],"correctIndex":0,"proofLabId":"bio45_mangga_tenaga_lab","proofState":{"withEnzyme":true},"explanation":"Enzim menurunkan tenaga pengaktifan (puncak lengkung lebih rendah) supaya kadar tindak balas meningkat, tanpa mengubah paras tenaga substrat/produk atau merosakkan struktur enzim."},{"type":"match","xp":15,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Mekanisme & Pengawal Enzim","voiceCaption":"Padankan lima istilah penting mekanisme enzim berikut dengan maksud tepatnya.","voiceScript":"[confident] Uji penguasaan mekanisme enzim kamu! Padankan lima istilah berikut dengan fungsinya yang betul.","prompt":"Padankan istilah tindakan enzim berikut dengan keterangannya:","pairs":[{"id":"ez1","left":"Tapak aktif","right":"Kawasan berkonfigurasi 3D spesifik pada enzim tempat substrat mengikat"},{"id":"ez2","left":"Tenaga pengaktifan","right":"Tenaga minimum yang diperlukan untuk memecahkan ikatan substrat; diturunkan oleh enzim"},{"id":"ez3","left":"Kofaktor (cth. Vitamin B, Mg2+)","right":"Bahan bukan protein yang membantu enzim berfungsi dengan lebih cekap"},{"id":"ez4","left":"Perencat (cth. Plumbum, Merkuri)","right":"Logam berat yang memperlahankan atau menghentikan aktiviti enzim"},{"id":"ez5","left":"Kompleks enzim-substrat","right":"Gabungan sementara apabila substrat sepadan terikat pada tapak aktif enzim"}],"explanation":"Substrat mengikat pada tapak aktif membentuk kompleks enzim-substrat; enzim menurunkan tenaga pengaktifan; kofaktor (vitamin B, Mg2+) mengoptimumkan enzim; manakala perencat (Pb, Hg) menghalang aktiviti enzim."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kes Epal Direbus Tidak Perang","voiceCaption":"Jelaskan mengapa hirisan epal yang direbus selepas dikupas tidak berubah menjadi perang.","voiceScript":"[curious] Soalan Praktis Sumatif lima! Mengapakah hirisan buah epal yang direbus seketika selepas dikupas kekal cerah dan tidak berubah menjadi warna perang?","prompt":"Hirisan epal yang dibiarkan di udara akan bertukar perang akibat pengoksidaan bermangkin enzim. Mengapakah epal yang direbus selepas dikupas TIDAK bertukar perang?","options":["Suhu tinggi air mendidih memutuskan ikatan kimia dan menyahasli enzim sehingga tapak aktif berubah bentuk dan tidak lagi melengkapi substrat","Air mendidih melarutkan semua oksigen di udara di sekeliling epal selama-lamanya","Suhu tinggi menambah bilangan tapak aktif enzim supaya produk perang terus terurai","Perebusan menukar enzim epal menjadi hormon pertumbuhan tumbuhan"],"correctIndex":0,"explanation":"Suhu melebihi 60°C (air mendidih 100°C) memutuskan ikatan kimia dalam enzim, menyebabkan penyahaslian — bentuk 3D tapak aktif berubah kekal lalu substrat tidak dapat terikat."}]},{"id":"bio45-u3","title":"Unit 3: Faktor Mempengaruhi Enzim & Eksperimen Amilase/Pepsin","subtitle":"Subtopik 5.2.8 & 5.2.9 — Kesan Suhu (37°C & 60°C), pH (1.5-2.5 / 6.8 / 8.5), Kepekatan Substrat & Enzim (Faktor Pengehad) serta Aktiviti 5.1-5.2","iconType":"graph","iconUrl":"../assets/icons/bio45-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kesan Suhu & pH ke atas Enzim","voiceCaption":"Kadar tindak balas enzim meningkat apabila suhu naik sehingga suhu optimum tiga puluh tujuh darjah Celsius sebelum ternyahasli pada enam puluh darjah Celsius, manakala setiap enzim mempunyai pH optimum tertentu.","voiceScript":"[warm] Empat faktor utama mengawal kelajuan enzim: suhu, p H, kepekatan substrat dan kepekatan enzim! Pada suhu rendah, tenaga kinetik rendah maka kadar tindak balas perlahan. Setiap kenaikan suhu sepuluh darjah Celsius menggandakan kadar tindak balas kerana tenaga kinetik serta frekuensi pelanggaran berkesan meningkat hingga mencapai suhu optimum badan manusia iaitu tiga puluh tujuh darjah Celsius! Melebihi suhu optimum, ikatan kimia dalam enzim terputus lalu menyahasli enzim dan tindak balas terhenti pada enam puluh darjah Celsius! Bagi faktor p H pula, kebanyakan enzim aktif pada p H enam hingga lapan seperti amilase air liur pada p H enam perpuluhan lapan, kecuali pepsin perut pada p H satu perpuluhan lima hingga dua perpuluhan lima dan tripsin duodenum pada p H lapan perpuluhan lima! Perubahan p H mengubah cas ion hidrogen pada tapak aktif, dan p H ekstrem menyahasli enzim!","title":"Kesan Suhu & Kesan pH terhadap Mekanisme Tindakan Enzim","acronym":"37•60•2•7•8.5","hook":"Ingat tiga nombor pH optimum wajib SPM: Pepsin (perut) ~ pH 1.5–2.5, Amilase air liur ~ pH 6.8, Tripsin (duodenum) ~ pH 8.5!","summary":"Suhu mempengaruhi tenaga kinetik dan frekuensi pelanggaran berkesan sebelum penyahaslian pada 60°C, manakala pH mengubah cas ion H+ pada tapak aktif dan substrat.","bullets":["Kesan Suhu (Rajah 5.5): Suhu rendah -> kadar rendah (enzim tak aktif, bukan musnah). Apabila suhu meningkat -> tenaga kinetik substrat dan enzim bertambah -> frekuensi pelanggaran berkesan meningkat (setiap kenaikan 10°C kadar berganda 2x) sehingga suhu optimum (~37°C pada manusia; kadar maksimum). Melebihi suhu optimum -> aktiviti jatuh mendadak dan berhenti pada 60°C kerana enzim ternyahasli (ikatan kimia terputus, struktur 3D tapak aktif berubah, substrat tidak lagi sepadan).","Kesan pH (Rajah 5.6 & 5.7): Umumnya pH optimum antara 6–8 (Amilase air liur ~ pH 6.8). Pengecualian: Pepsin perut (pH 1.5–2.5), Tripsin duodenum (pH 8.5). Perubahan pH mengubah cas (ion H+) pada tapak aktif enzim dan permukaan substrat, menghalang pembentukan kompleks enzim-substrat (kembali pulih jika pH dipulihkan ke optimum); perubahan pH yang ekstrem pula memutuskan ikatan kimia struktur dan menyahasli enzim."],"labId":"bio45_faktor_graf_sim","labTitle":"Makmal Interaktif 4 Graf Faktor Tindakan Enzim","labProps":{"factor":"suhu"},"examTip":"Bezakan tepat dua sebab penurunan aktiviti: (1) Suhu ekstrem / pH ekstrem -> memutuskan ikatan kimia -> enzim TERNYAHASLI secara kekal; (2) Perubahan pH sedikit -> hanya mengubah cas (ion H+) pada tapak aktif (boleh pulih semula)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Aktiviti 5.2 Pepsin & pH","voiceCaption":"Ramalkan kekeruhan campuran ampaian albumen dan pepsin dalam tabung uji P (asid hidroklorik), Q (air suling) dan R (natrium hidroksida) pada tiga puluh tujuh darjah Celsius.","voiceScript":"[curious] Mari ramalkan keputusan Aktiviti lima perpuluhan dua! Tiga tabung uji P, Q dan R diisi ampaian albumen putih telur yang keruh dan larutan pepsin, kemudian ditambah asid hidroklorik dalam P, air suling dalam Q, dan natrium hidroksida dalam R pada suhu tiga puluh tujuh darjah Celsius. Tabung uji manakah menjadi jernih selepas dua puluh minit?","hook":"Laraskan slider pH ke nilai pH 2, pH 7 dan pH 10 di Makmal Faktor Enzim untuk melihat kadar aktiviti pepsin!","scenario":"Semua tabung uji mengandungi 5 ml ampaian albumen (keruh) + 1 ml pepsin 1% pada suhu 37°C selama 20 minit: P (+ 1 ml HCl 0.1 M), Q (+ 1 ml air suling), R (+ 1 ml NaOH 0.1 M).","prompt":"Apakah pemerhatian pada tabung uji P, Q dan R selepas 20 minit?","options":["Tabung uji P menjadi JERNIH kerana pH berasid (~pH 2) ialah pH optimum bagi pepsin menghidrolisiskan albumen; Q dan R kekal keruh","Tabung uji R menjadi jernih kerana pepsin berfungsi paling baik dalam medium alkali","Tabung uji Q menjadi paling jernih kerana air suling mempunyai pH neutral 7.0","Semua tabung uji P, Q dan R menjadi jernih pada kadar yang sama kerana suhu dikekalkan 37°C"],"correctIndex":0,"proofLabId":"bio45_faktor_graf_sim","proofState":{"factor":"ph"},"explanation":"Pepsin bertindak optimum dalam medium berasid (pH 1.5–2.5). Dalam tabung uji P (dengan HCl), albumen keruh dihidrolisiskan menjadi polipeptida larut yang jernih; dalam Q (neutral) dan R (alkali), aktiviti pepsin terencat/ternyahasli."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Kepekatan Substrat, Enzim & Aktiviti 5.1","voiceCaption":"Apabila kepekatan substrat dinaikkan pada kepekatan enzim tetap, kadar meningkat hingga semua tapak aktif tepu dan kepekatan enzim menjadi faktor pengehad.","voiceScript":"[warm] Bagaimana pula dengan kepekatan substrat dan kepekatan enzim? Jika kepekatan enzim ditetapkan dan kepekatan substrat ditambah, kadar tindak balas meningkat kerana peluang pelanggaran berkesan bertambah sehingga mencapai tahap maksimum yang malar — ketika ini semua tapak aktif enzim telah tepu dengan substrat dan kepekatan enzim menjadi faktor pengehad! Sebaliknya, jika kepekatan enzim digandakan dengan bekalan substrat berlebihan, kadar tindak balas juga berganda sehingga kepekatan substrat pula menjadi faktor pengehad! Dalam Aktiviti lima perpuluhan satu pula, kadar hidrolisis kanji oleh amilase dihitung sebagai satu bahagi masa sehingga campuran kekal kuning keperangan apabila diuji dengan larutan iodin!","title":"Kesan Kepekatan Substrat & Enzim (Faktor Pengehad) + Aktiviti 5.1","acronym":"S•E•P","hook":"Apabila graf mendatar pada tahap maksimum, tambahkan bahan yang menjadi FAKTOR PENGEHAD — bukan lagi bahan yang sudah tepu!","summary":"Graf kepekatan substrat mendatar apabila tapak aktif enzim tepu (kepekatan enzim sebagai faktor pengehad), manakala penambahan enzim menggandakan kadar jika substrat berlebihan.","formula":"Kadar tindak balas enzim = 1 / Masa hidrolisis lengkap (minit-1)","bullets":["Kesan Kepekatan Substrat vs Kepekatan Enzim: (1) Kepekatan substrat meningkat (enzim tetap) -> pelanggaran berkesan meningkat -> kadar naik hingga tahap maksimum malar; pada tahap maksimum, semua tapak aktif tepu oleh substrat dan kepekatan ENZIM menjadi faktor pengehad (hanya boleh naik jika enzim ditambah). (2) Kepekatan enzim meningkat (substrat berlebihan) -> lebih banyak tapak aktif tersedia -> kadar berganda 2x jika enzim digandakan, hingga tahap maksimum di mana kepekatan SUBSTRAT menjadi faktor pengehad.","Aktiviti 5.1 (Kesan Suhu pada Amilase): 5 ml ampaian kanji 1% dan 2 ml amilase 0.5% dieram berasingan 5 minit dalam kukus air 20°C, 30°C, 40°C, 50°C dan 60°C untuk menyamakan suhu sebelum dicampurkan. Titisan campuran diuji dengan larutan iodin setiap 30 saat di atas jubin putih berlekuk sehingga warna kekal kuning keperangan (tiada biru-hitam = semua kanji telah dihidrolisiskan)."],"labId":"bio45_faktor_graf_sim","labTitle":"Simulator Graf Faktor Pengehad (Substrat vs Enzim)","labProps":{"factor":"substrat"},"examTip":"Soalan lazim Aktiviti 5.1: Mengapa tabung uji kanji dan amilase perlu dieram 5 minit berasingan sebelum dicampur? Supaya kedua-dua larutan mencapai suhu kukus air yang ditetapkan terlebih dahulu!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Faktor Pengehad & Penyahaslian","voiceCaption":"Kelaskan enam situasi graf dan aktiviti enzim berikut kepada Faktor Pengehad atau Penyahaslian & Perubahan Cas.","voiceScript":"[confident] Asingkan keenam-enam situasi tindak balas enzim ini sama ada melibatkan Faktor Pengehad atau melibatkan Penyahaslian dan Perubahan Cas tapak aktif!","prompt":"Kelaskan situasi berikut kepada kategori yang tepat:","buckets":[{"id":"had","label":"Faktor Pengehad & Pelanggaran"},{"id":"nyah","label":"Penyahaslian & Perubahan Cas"}],"items":[{"text":"Graf mendatar apabila substrat ditambah kerana semua tapak aktif enzim telah tepu","bucketId":"had","note":"Tepat! Kepekatan enzim menjadi faktor pengehad pada aras tepu."},{"text":"Menggandakan kepekatan enzim menggandakan hasil produk per unit masa apabila substrat berlebihan","bucketId":"had","note":"Betul! Lebih banyak tapak aktif disediakan untuk pemangkinan."},{"text":"Kadar tindak balas terhenti kerana kepekatan substrat habis atau menjadi faktor pengehad","bucketId":"had","note":"Tepat! Penambahan substrat diperlukan untuk menaikkan semula kadar."},{"text":"Enzim dipanaskan melebihi suhu optimum hingga 60°C lalu ikatan kimia terputus","bucketId":"nyah","note":"Betul! Penyahaslian mengubah bentuk 3D tapak aktif secara kekal."},{"text":"Perubahan pH mengubah cas ion H+ pada tapak aktif dan permukaan substrat","bucketId":"nyah","note":"Tepat! Kompleks enzim-substrat gagal terbentuk apabila cas terganggu."},{"text":"Pepsin dicampurkan dalam larutan NaOH beralkali pada pH 10","bucketId":"nyah","note":"Betul! pH ekstrem yang jauh daripada optimum 1.5-2.5 menyahasli pepsin."}],"explanation":"Kadar tindak balas mendatar pada kepekatan substrat/enzim tinggi berpunca daripada ketepuan atau faktor pengehad; kejatuhan aktiviti pada suhu > optimum atau pH ekstrem berpunca daripada perubahan cas ion H+ dan penyahaslian."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Kira Kadar Hidrolisis Amilase","voiceCaption":"Hitung kadar tindak balas enzim amilase apabila masa hidrolisis kanji lengkap ialah dua perpuluhan lima minit.","voiceScript":"[curious] Uji kemahiran pengiraan makmal kamu! Dalam eksperimen Aktiviti lima perpuluhan satu pada suhu tiga puluh tujuh darjah Celsius, kanji lengkap dihidrolisiskan dalam masa dua perpuluhan lima minit. Berapakah kadar tindak balas enzim tersebut?","prompt":"Dalam eksperimen Aktiviti 5.1 pada suhu 37°C, masa yang diambil untuk campuran kanji + amilase kekal kuning keperangan dengan larutan iodin ialah 2.5 minit. Berapakah kadar tindak balas enzim?","options":["0.40 minit-1 (dikira melalui 1 / 2.5 minit)","2.50 minit-1 (diambil terus daripada masa tindak balas)","1.25 minit-1 (hasil tambah isipadu dibahagi masa)","0.04 minit-1 (dikira melalui 1 / 25 minit)"],"correctIndex":0,"explanation":"Kadar tindak balas enzim = 1 / masa untuk hidrolisis lengkap = 1 / 2.5 minit = 0.40 minit-1."}]},{"id":"bio45-u4","title":"Unit 4: Aplikasi Enzim & Teknologi Immobilisasi Enzim","subtitle":"Subtopik 5.3 — Immobilisasi Enzim, 6 Sektor Industri (Perubatan, Jus, Bio-detergen, Susu Bebas Laktosa, Ikan & Kulit) serta Bakteria Kolam Air Panas","iconType":"book","iconUrl":"../assets/icons/bio45-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Immobilisasi & Aplikasi Enzim","voiceCaption":"Teknologi immobilisasi enzim menggabungkan enzim dengan bahan lengai tak larut untuk meningkatkan rintangan terhadap suhu dan pH serta memudahkan pengasingan produk.","voiceScript":"[warm] Bagaimana industri menggunakan enzim dengan kos yang jimat? Melalui teknologi immobilisasi enzim! Enzim digabungkan dengan bahan lengai dan tidak larut untuk meningkatkan ketahanannya terhadap perubahan suhu serta p H, mengekalkan kedudukan enzim sepanjang tindak balas, mudah diasingkan daripada produk dan boleh diguna semula! Mari ingat enam aplikasi harian utama: enzim pencernaan dalam sektor perubatan, pektinase dan selulase untuk menghasilkan jus buah lebih jernih dan banyak, amilase, lipase, protease serta selulase dalam bio detergen, laktase untuk menghasilkan susu bebas laktosa, protease untuk mengasingkan kulit ikan, dan tripsin untuk menanggalkan bulu kulit haiwan dalam industri kulit!","title":"5.3 Teknologi Immobilisasi Enzim & 6 Aplikasi Industri","acronym":"P•J•B•L•I•K","hook":"Tukang masak membungkus daging dengan daun betik selama lima jam kerana enzim papain di dalamnya mencerna protein serat daging supaya empuk!","mediaKey":"bio45_aplikasi_industri","summary":"Enzim diekstrak daripada bakteria atau disintesis dan digabungkan secara immobilisasi dengan bahan lengai untuk kegunaan perubatan, makanan, bio-detergen dan kulit.","bullets":["Teknologi Immobilisasi Enzim: Enzim digabungkan dengan bahan lengai dan tak larut -> (1) meningkatkan rintangan enzim terhadap perubahan faktor seperti pH dan suhu, (2) molekul enzim kekal di kedudukan sama sepanjang tindak balas pemangkinan, (3) mudah diasingkan daripada produk akhir dan boleh digunakan berulang kali.","6 Aplikasi Industri & Harian: (1) Enzim pencernaan dalam sektor perubatan; (2) Pektinase & Selulase mencerna pektin dan dinding selulosa dalam pengeluaran jus buah-buahan (ekstrak lebih banyak jus) serta ekstrak agar-agar daripada rumpai laut; (3) Amilase (kanji), lipase (minyak/gris), protease (protein/darah) dan selulase dalam bio-detergen; (4) Laktase menghidrolisis laktosa kepada glukosa + galaktosa bagi susu bebas laktosa; (5) Protease mengasingkan kulit ikan; (6) Tripsin menanggalkan bulu daripada kulit haiwan bagi menghasilkan barangan kulit."],"labId":"bio45_aplikasi_industri_lab","labTitle":"Kilang Aplikasi Enzim & Reaktor Immobilisasi","labProps":{"tab":"industri"},"examTip":"Soalan klasik Kertas 2: Mengapakah pektinase dan selulase menghasilkan lebih banyak jus buah berbanding perahan mekanikal? Kerana selulase menguraikan dinding sel selulosa dan pektinase menguraikan pektin agar jus sel keluar sepenuhnya."},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Enzim Industri & Fungsi","voiceCaption":"Padankan lima enzim berikut dengan aplikasi hariannya dalam industri makanan, pembersihan dan pembuatan.","voiceScript":"[confident] Jom uji penguasaan aplikasi harian Subtopik lima perpuluhan tiga! Padankan lima enzim industri ini dengan tugas tepatnya.","prompt":"Padankan setiap enzim berikut dengan aplikasinya dalam kehidupan harian:","pairs":[{"id":"in1","left":"Pektinase & Selulase","right":"Menguraikan pektin dan dinding sel tumbuhan untuk mengekstrak lebih banyak jus buah jernih"},{"id":"in2","left":"Laktase","right":"Menghasilkan susu bebas laktosa bagi individu yang alah laktosa"},{"id":"in3","left":"Tripsin","right":"Menanggalkan bulu daripada kulit haiwan dalam pembuatan barangan kulit"},{"id":"in4","left":"Protease (seperti papain) & Lipase","right":"Menanggalkan kotoran protein dan lemak dalam bio-detergen serta mengasingkan kulit ikan"},{"id":"in5","left":"Enzim terimmobilisasi","right":"Diikat pada bahan lengai tak larut agar tahan suhu/pH dan mudah diasingkan daripada produk"}],"explanation":"Pektinase/selulase untuk jus buah; laktase untuk susu bebas laktosa; tripsin untuk industri kulit haiwan; protease/lipase untuk bio-detergen dan kulit ikan; dan immobilisasi melindungi enzim industri."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Enzim Bakteria Kolam Panas","voiceCaption":"Ramalkan mengapa enzim yang diekstrak daripada bakteria kolam air panas sangat sesuai ditambah ke dalam serbuk pencuci pakaian.","voiceScript":"[curious] Soalan Pengayaan Praktis Sumatif lima! Mengapakah enzim daripada strain bakteria yang hidup di kawasan kolam air panas sangat bernilai untuk dimasukkan ke dalam serbuk bio detergen pakaian?","hook":"Bandingkan kestabilan suhu enzim biasa berbanding enzim termofil di Makmal Immobilisasi!","scenario":"Bakteria termofil yang hidup di kolam air panas bersuhu 75°C menghasilkan enzim protease dan lipase semula jadi yang diekstrak oleh pengilang detergen.","prompt":"Mengapakah enzim daripada bakteria kolam air panas sesuai digunakan dalam bio-detergen?","options":["Enzim tersebut tahan suhu tinggi (mempunyai suhu optimum tinggi) dan tidak mudah ternyahasli semasa pakaian dicuci menggunakan air panas di dalam mesin basuh","Enzim tersebut hanya aktif pada suhu beku di bawah 0°C sahaja","Enzim tersebut menghasilkan pektin yang mewarnakan semula fabrik pudar","Enzim tersebut bertindak sebagai perencat logam berat kepada air paip"],"correctIndex":0,"proofLabId":"bio45_aplikasi_industri_lab","proofState":{"tab":"immobilisasi"},"explanation":"Enzim bakteria kolam air panas mempunyai suhu optimum yang tinggi dan tidak ternyahasli pada suhu cucian air panas, menjadikannya sangat cekap menanggalkan kotoran."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Bina Huraian Immobilisasi Enzim","voiceCaption":"Susun penerangan mengenai prinsip dan kelebihan teknologi immobilisasi enzim dalam industri.","voiceScript":"[confident] Susun blok perkataan berikut untuk membina huraian lengkap mengenai teknologi immobilisasi enzim!","prompt":"Susun huraian mengenai teknologi immobilisasi enzim:","hint":"Nyatakan bahan penggabungannya serta kesannya terhadap ketahanan dan pengasingan produk.","answerTokens":["Enzim digabungkan dengan bahan lengai dan tidak larut","untuk meningkatkan rintangan terhadap perubahan suhu dan pH","supaya molekul enzim kekal di posisi sama","serta mudah diasingkan daripada produk"],"distractors":["menyebabkan enzim larut terus bersama jus","meningkatkan tenaga pengaktifan tindak balas"],"explanation":"Immobilisasi enzim menggabungkan enzim dengan bahan lengai tak larut bagi meningkatkan rintangan suhu/pH, mengekalkan kedudukan enzim, dan memudahkan pengasingan produk."}]},{"id":"bio45-u5","title":"Cabaran Boss SPM: Metabolisme & Enzim","subtitle":"Sintesis KBAT Kertas 1 & 2 — Racun Sianida, Daun Betik & Daging, Penyahaslian vs Suhu Rendah serta Analisis Graf","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Perencat Sianida & Enzim","voiceCaption":"Jelaskan mengapa keracunan sianida boleh menyebabkan kematian serta-merta dari sudut tindakan enzim.","voiceScript":"[excited] Cabaran Boss S P M Bab lima bermula! Soalan pertama menilai aplikasi perencat enzim: mengapakah keracunan sianida boleh menyebabkan kematian serta-merta kepada manusia?","prompt":"Mengapakah keracunan sianida boleh menyebabkan kematian serta-merta?","options":["Sianida bertindak sebagai perencat enzim yang merencatkan enzim respirasi sel, menyebabkan penghasilan tenaga ATP terhenti secara mendadak","Sianida bertindak sebagai kofaktor yang menggandakan kadar pembahagian sel kulit","Sianida menukarkan semua amilase air liur menjadi pepsin berasid","Sianida menaikkan suhu badan melebihi 100°C secara serta-merta"],"correctIndex":0,"explanation":"Sianida ialah perencat enzim yang mengikat dan menyekat enzim respirasi sel dalam mitokondrion, menghentikan penghasilan ATP untuk fungsi hidup organ penting."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Enzim Pencernaan & Industri","voiceCaption":"Kelaskan enam enzim berikut mengikut sumber atau medium pH optimum serta fungsi utamanya.","voiceScript":"[confident] Cabaran kedua Boss S P M! Kelaskan keenam-enam fakta enzim berikut mengikut pH Optimum Asid/Neutral atau pH Optimum Alkali serta kegunaan industri.","prompt":"Isihkan fakta enzim berikut kepada kategori yang tepat:","buckets":[{"id":"acidneu","label":"Enzim Asid / Neutral (pH 1.5-7)"},{"id":"alkind","label":"Enzim Alkali / Industri Khusus"}],"items":[{"text":"Pepsin di dalam perut — pH optimum 1.5-2.5 menghidrolisiskan protein albumen","bucketId":"acidneu","note":"Tepat! Pepsin memerlukan medium asid hidroklorik perut."},{"text":"Amilase air liur — pH optimum 6.8 menghidrolisiskan kanji kepada maltosa","bucketId":"acidneu","note":"Betul! Amilase aktif pada pH hampir neutral di dalam mulut."},{"text":"Enzim heksokinase — enzim intrasel dalam glikolisis sitoplasma (pH ~7)","bucketId":"acidneu","note":"Tepat! Heksokinase ialah contoh klasik enzim intrasel dalam buku teks."},{"text":"Tripsin di dalam duodenum — pH optimum 8.5 (beralkali) mencerna polipeptida","bucketId":"alkind","note":"Betul! Tripsin berfungsi optimum dalam persekitaran alkali duodenum."},{"text":"Pektinase & Selulase — digunakan untuk mengekstrak lebih banyak jus buah dan agar-agar","bucketId":"alkind","note":"Tepat! Menguraikan pektin dan selulosa dinding sel tumbuhan."},{"text":"Papain (daun betik) & Protease — melembutkan daging dan mengasingkan kulit ikan","bucketId":"alkind","note":"Betul! Menghidrolisiskan protein gentian otot daging dan kulit ikan."}],"explanation":"Pepsin (pH 1.5–2.5) dan amilase (pH 6.8) bertindak dalam julat berasid/neutral; tripsin (pH 8.5) bertindak dalam alkali; manakala pektinase/selulase dan papain/protease dimanfaatkan dalam industri makanan."},{"type":"predict","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Enzim Pada 0°C vs 65°C","voiceCaption":"Ramalkan sama ada aktiviti enzim dapat dipulihkan jika campuran enzim yang disejukkan ke 0°C atau dipanaskan ke 65°C dikembalikan semula ke 37°C.","voiceScript":"[curious] Soalan K B A T paling kerap keluar dalam Kertas dua! Sampel amilase A disejukkan pada sifar darjah Celsius manakala sampel amilase B dipanaskan pada enam puluh lima darjah Celsius, lalu kedua-duanya dikembalikan ke suhu tiga puluh tujuh darjah Celsius. Yang manakah kembali aktif?","hook":"Uji suhu rendah dan suhu tinggi pada Makmal Faktor Enzim selepas menjawab!","scenario":"Tiub A (amilase + kanji) disimpan pada 0°C selama 15 minit, manakala Tiub B dipanaskan pada 65°C selama 15 minit. Kedua-dua tiub kemudiannya dipindahkan ke kukus air 37°C.","prompt":"Apakah keputusan yang berlaku dalam Tiub A dan Tiub B selepas dipindahkan ke suhu 37°C?","options":["Tiub A kembali aktif menghidrolisiskan kanji kerana enzim pada 0°C hanya tidak aktif sementara; Tiub B kekal tiada tindak balas kerana enzim telah ternyahasli secara kekal pada 65°C","Tiub B kembali aktif manakala Tiub A ternyahasli secara kekal akibat hablur ais","Kedua-dua Tiub A dan B kembali aktif pada kadar maksimum","Kedua-dua Tiub A dan B tidak aktif kerana tapak aktif tidak boleh dipulihkan"],"correctIndex":0,"proofLabId":"bio45_faktor_graf_sim","proofState":{"factor":"suhu"},"explanation":"Pada suhu rendah (0°C), tenaga kinetik rendah menyebabkan enzim tidak aktif tetapi strukturnya tidak rosak, maka ia kembali aktif pada 37°C. Pada 65°C (>60°C), ikatan kimia terputus menyebabkan penyahaslian kekal."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Huraian Faktor Enzim","voiceCaption":"Padankan setiap situasi eksperimen enzim berikut dengan penjelasan saintifik yang tepat.","voiceScript":"[confident] Satu langkah lagi menuju kejayaan penuh Bab lima! Padankan keempat-empat situasi makmal ini dengan sebab biokimianya.","prompt":"Padankan situasi eksperimen enzim berikut dengan penjelasan yang betul:","pairs":[{"id":"b51","left":"Daging diperap dengan daun betik selama 5 jam","right":"Enzim protease (papain) dalam daun betik menghidrolisiskan protein serat daging agar empuk"},{"id":"b52","left":"Mengapa enzim hanya diperlukan dalam kuantiti kecil","right":"Struktur enzim tidak musnah atau berubah selepas tindak balas dan boleh diguna semula"},{"id":"b53","left":"Kesan menambah substrat pada graf kepekatan substrat mendatar","right":"Kadar kekal malar kerana semua tapak aktif tepu; hanya penambahan enzim dapat menaikkannya"},{"id":"b54","left":"Fungsi liposom atau salutan enzim pencernaan","right":"Memastikan enzim pencernaan atau ubat tiba ke tapak tindakan tanpa musnah lebih awal"}],"explanation":"Daun betik mengandungi papain (protease) pelembut daging; enzim boleh diguna semula kerana kekal utuh; graf substrat mendatar dikawal oleh kepekatan enzim sebagai faktor pengehad."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Rumusan Hipotesis & Pengehad","voiceCaption":"Selesaikan soalan sintesis hipotesis mangga dan kunci serta ciri-ciri enzim yang menerangkannya.","voiceScript":"[excited] Soalan penutup Boss S P M Bab lima! Ciri enzim manakah yang diterangkan secara langsung oleh hipotesis mangga dan kunci?","prompt":"Berdasarkan hipotesis 'mangga dan kunci', apakah dua ciri enzim yang dapat dijelaskan secara langsung melalui model ini?","options":["Tindakan enzim adalah sangat khusus (hanya substrat sepadan dengan tapak aktif dapat bergabung) dan enzim kekal tidak berubah serta boleh diguna semula selepas tindak balas","Enzim sentiasa memerlukan suhu 60°C dan bertindak sebagai mangkin tak organik","Enzim menaikkan tenaga pengaktifan dan hanya bertindak balas secara sehala","Semua enzim disintesis daripada lipid dan tidak dipengaruhi oleh perubahan pH"],"correctIndex":0,"explanation":"Hipotesis 'mangga dan kunci' menerangkan kekhususan enzim (konfigurasi 3D tapak aktif hanya sepadan dengan substrat tertentu) serta kebolehgunaan semula enzim (mangga kekal tidak berubah selepas kunci/produk terhasil)."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");

    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));

    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {

      mapExitBtn.setAttribute("title", "Back to Chapter Map");

    var unit = units[notaState.activeUnitIdx] || { steps: [] };

    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,

    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i

  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);

  }
  return "";
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

        });

        });

        });

        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),

        });

        });

          label: tUi("Makmal 3D", "3D Lab"),

          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({

        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {

        });

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"
    : "";

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
    isBite: isBite,
    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
