/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab06","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":6,"title":"Pembahagian Sel","subtitle":"Subtopik 6.1-6.4 KSSM — Kariokinesis & Sitokinesis, Haploid/Diploid/Homolog, Kitar Sel (G1-S-G2-M) & Mitosis Haiwan vs Tumbuhan, Meiosis I-II (Sinapsis/Pindah Silang/Kiasma) serta Tumor/Kanser & Trisomi 21 Sindrom Down.","estimatedMinutes":30,"themeAccent":"#7c3aed","isFreePreview":false,"labScript":"biologi-t4-bab06-labs.js","coverIcon":"../assets/icons/bio46-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan fasa mitosis, meiosis dan kitar sel kamu memang hebat!","combo":"[laughs warmly] Kombo yang luar biasa! Daripada fasa S hingga pindah silang Profasa satu, semuanya tepat!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula perbezaan antara kromosom homolog dengan kromatid kembar di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Pembahagian Sel berjaya kamu takluki!"},"units":[{"id":"bio46-u1","title":"Unit 1: Pembahagian Sel & Kitar Sel (Interfasa G1-S-G2)","subtitle":"Subtopik 6.1 & 6.2 (Awal) — Kariokinesis vs Sitokinesis, Sel Soma (2n=46) vs Gamet (n=23), Kromosom Paternal/Maternal & Fasa G1-S-G2","iconType":"atom","iconUrl":"../assets/icons/bio46-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Kariokinesis, Ploidi & Kitar Sel","voiceCaption":"Pembahagian sel melibatkan kariokinesis (pembahagian nukleus) dan sitokinesis (pembahagian sitoplasma) selepas fasa interfasa G1, S dan G2.","voiceScript":"[warm] Selamat datang ke Bab enam, Pembahagian Sel! Pembahagian sel berlaku melalui dua peringkat utama iaitu kariokinesis yang membahagikan nukleus, diikuti sitokinesis yang membahagikan sitoplasma! Sel soma badan manusia mengandungi bilangan kromosom diploid dua n sama dengan empat puluh enam melalui mitosis, manakala gamet atau sel pembiakan mengandungi bilangan kromosom haploid n sama dengan dua puluh tiga melalui meiosis! Dalam sel diploid terdapat pasangan kromosom homolog yang serupa strukturnya, terdiri daripada kromosom paternal daripada bapa dan kromosom maternal daripada ibu! Sebelum memasuki fasa M, sel melalui fasa paling panjang iaitu interfasa: fasa G satu untuk pertumbuhan dan sintesis organel, fasa S untuk replikasi D N A menghasilkan dua kromatid kembar bercantum di sentromer, dan fasa G dua untuk pengumpulan tenaga!","title":"6.1 Istilah Ploidi & 6.2 Kitar Sel (Interfasa G1, S, G2 dan Fasa M)","acronym":"G1•S•G2•M","hook":"Interfasa merangkumi hampir 90% tempoh kitar sel — tanpa replikasi DNA pada fasa S, sel anak tidak akan mewarisi set kromosom lengkap!","summary":"Sel diploid (2n) mempunyai kromosom homolog paternal dan maternal; sebelum fasa M (mitosis + sitokinesis), sel menggandakan DNA dan organel semasa interfasa (G1, S, G2).","bullets":["6.1 Istilah Asas & Ploidi: Kariokinesis (pembahagian nukleus) vs Sitokinesis (pembahagian sitoplasma). Sel soma (sel badan selain gamet; terhasil melalui mitosis; diploid 2n = 46 pada manusia). Gamet (sel pembiakan; terhasil melalui meiosis; haploid n = 23). Kromosom homolog = sepasang kromosom berstruktur sama (1 set kromosom paternal dari induk jantan + 1 set kromosom maternal dari induk betina). Kromatin = kromosom berbentuk bebenang halus panjang.","6.2 Kitar Sel: Interfasa (fasa terpanjang) terdiri daripada: Fasa G1 (sel membesar, mitokondrion & jalinan endoplasma dihasilkan, protein disintesis, nukleus besar berkromatin), Fasa S (sintesis/replikasi DNA; setiap kromosom mengganda menjadi dua kromatid kembar seiras yang bercantum di sentromer), dan Fasa G2 (sel terus membesar, aktif metabolik, kumpul tenaga & buat persediaan akhir) sebelum masuk Fasa M (mitosis + sitokinesis)."],"labId":"bio46_kitar_mitosis_sim","labTitle":"Simulator Kitar Sel & 60fps Mitosis/Meiosis","labProps":{"tab":"kitar"},"examTip":"Skema S.P.M.: Jika ditanya fasa tempat berlakunya replikasi DNA dan penggandaan kromosom menjadi dua kromatid kembar, jawapan tepat ialah FASA S (dalam interfasa)."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Istilah Pembahagian Sel","voiceCaption":"Padankan istilah penting pembahagian sel dan fasa kitar sel dengan huraian tepatnya.","voiceScript":"[curious] Mari uji penguasaan istilah asas Subtopik enam perpuluhan satu dan enam perpuluhan dua! Padankan lima istilah ini dengan maksud tepatnya.","prompt":"Padankan istilah pembahagian sel berikut dengan definisi yang betul:","pairs":[{"id":"cd1","left":"Kariokinesis","right":"Proses pembahagian nukleus semasa pembahagian sel"},{"id":"cd2","left":"Sitokinesis","right":"Proses pembahagian sitoplasma sejurus selepas pembentukan dua nukleus"},{"id":"cd3","left":"Kromosom homolog","right":"Pasangan kromosom paternal dan maternal yang mempunyai ciri struktur yang sama"},{"id":"cd4","left":"Fasa S (Interfasa)","right":"Fasa replikasi DNA menghasilkan dua kromatid kembar bercantum pada sentromer"},{"id":"cd5","left":"Kromatin","right":"Kromosom dalam bentuk bebenang halus panjang semasa interfasa"}],"explanation":"Kariokinesis membahagikan nukleus; sitokinesis membahagikan sitoplasma; kromosom homolog ialah pasangan paternal + maternal; fasa S menggandakan DNA; dan kromatin ialah bebenang kromosom panjang."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kegagalan Sel Gamet Haploid","voiceCaption":"Ramalkan kesannya terhadap generasi anak sekiranya organ pembiakan manusia gagal menghasilkan gamet haploid.","voiceScript":"[curious] Cuba jawab soalan Praktis Formatif enam perpuluhan satu! Apakah yang akan berlaku kepada bilangan kromosom generasi seterusnya sekiranya organ pembiakan gagal menghasilkan sel haploid n sama dengan dua puluh tiga?","hook":"Lihat kesan perubahan ploidi pada Simulator Kitar Sel selepas menjawab!","scenario":"Andai gamet sperma dan ovum manusia gagal menjalani pengurangan kromosom lalu masing-masing kekal diploid (2n = 46) semasa persenyawaan.","prompt":"Apakah kesan utama apabila gamet diploid (2n = 46) bersenyawa?","options":["Zigot yang terbentuk akan mempunyai 92 kromosom (4n) dan bilangan kromosom spesies akan berganda pada setiap generasi","Zigot akan mempunyai 23 kromosom (n) yang normal tanpa sebarang perubahan genetik","Kariokinesis berhenti dan sitokinesis menghasilkan empat sel tanpa nukleus","Semua sel soma bertukar menjadi gamet haploid melalui fasa G1"],"correctIndex":0,"proofLabId":"bio46_kitar_mitosis_sim","proofState":{"tab":"kitar"},"explanation":"Penghasilan gamet haploid (n = 23) melalui meiosis penting untuk mengekalkan bilangan kromosom diploid (2n = 46) spesies dari satu generasi ke generasi berikutnya selepas persenyawaan."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Turutan Kitar Sel","voiceCaption":"Susun urutan fasa kitar sel daripada fasa pertumbuhan G1 hingga pembahagian sitoplasma.","voiceScript":"[confident] Susun lima peringkat kitar sel berikut mengikut urutan kronologi yang betul bermula daripada Fasa G satu!","prompt":"Susun fasa kitar sel mengikut urutan yang tepat:","hint":"Tiga subfasa interfasa (G1, S, G2) diikuti oleh mitosis dan sitokinesis.","answerTokens":["Fasa G1","Fasa S","Fasa G2","Mitosis (PMAT)","Sitokinesis"],"distractors":["Sinapsis","Pindah Silang"],"explanation":"Kitar sel lengkap bermula dengan Interfasa (G1 -> S -> G2) dan diikuti Fasa M (Mitosis -> Sitokinesis)."}]},{"id":"bio46-u2","title":"Unit 2: Mitosis & Sitokinesis (Haiwan vs Tumbuhan)","subtitle":"Subtopik 6.2 — Peringkat PMAT, Sitokinesis Pencerutan vs Plat Sel, Penjanaan Semula, Kultur Tisu & Daging Kultur","iconType":"graph","iconUrl":"../assets/icons/bio46-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Peringkat Mitosis & Sitokinesis","voiceCaption":"Mitosis membahagikan satu nukleus induk kepada dua nukleus anak yang seiras melalui Profasa, Metafasa, Anafasa dan Telofasa diikuti sitokinesis berbeza dalam sel haiwan dan tumbuhan.","voiceScript":"[warm] Mari lihat tarian kromosom semasa mitosis! Dalam Profasa, kromatin memendek dan menebal membentuk kromosom yang terdiri daripada dua kromatid kembar bercantum di sentromer, membran nukleus terurai, nukleolus menghilang dan gentian gelendong terbentuk! Dalam Metafasa, kromosom tersusun sebaris di satah khatulistiwa. Dalam Anafasa, sentromer membahagi dua dan kromatid kembar berpisah menuju ke kutub bertentangan! Dalam Telofasa, kromosom anak kembali menjadi kromatin, nukleolus serta membran nukleus terbentuk semula! Ingat perbezaan sitokinesis: dalam sel haiwan, mikrofilamen mengecut membentuk alur pencerutan di membran plasma, manakala dalam sel tumbuhan yang tiada sentriol, vesikel membentuk plat sel di tengah yang berkembang ke luar membina dinding sel selulosa baharu! Tonton animasi 3D pembahagian sel di bawah!","title":"Peringkat Mitosis (PMAT), Sitokinesis & Kepentingan Mitosis","acronym":"P•M•A•T","hook":"Sel haiwan 'mencerut' di tengah untuk berpisah, manakala sel tumbuhan membina 'dinding pemisah' dari tengah ke luar menggunakan plat sel!","mediaKey":"bio46_mitosis_sel","videoClip":{"src":"../assets/biologi-t4-bab06/video/bio46_video_pembahagian_sel_narasi.mp4","hasNarration":true,"posterKey":"bio46_mitosis_sel","caption":"Video Penerangan BM: Fasa Mitosis (PMAT), Sitokinesis dan Meiosis"},"summary":"Mitosis menghasilkan dua sel anak diploid seiras secara genetik untuk perkembangan embrio, pertumbuhan, penyembuhan luka, penjanaan semula, pembiakan aseks dan kultur tisu.","bullets":["4 Fasa Mitosis: Profasa (kromatin memendek & menebal; sentriol bergerak ke kutub bertentangan membentuk gentian gelendong; membran nukleus & nukleolus terurai) -> Metafasa (kromosom tersusun sebaris di satah khatulistiwa, tamat apabila sentromer mula membahagi) -> Anafasa (sentromer membahagi, kromatid kembar berpisah ditarik ke kutub bertentangan) -> Telofasa (kromosom anak kembali jadi bebenang kromatin, membran nukleus & nukleolus terbentuk semula, gentian gelendong hilang).","Sitokinesis Haiwan vs Tumbuhan & Kepentingan Mitosis: Sel haiwan mempunyai sentriol; sitokinesis berlaku melalui pencerutan membran plasma oleh pengecutan mikrofilamen. Sel tumbuhan TIADA sentriol (tetapi masih membentuk gentian gelendong); sitokinesis berlaku melalui percantuman vesikel membentuk PLAT SEL yang berkembang ke luar serta diperkuat gentian selulosa. Kepentingan & Aplikasi: perkembangan embrio, pertumbuhan, penyembuhan luka kulit, penjanaan semula (cth. ekor cicak), pembiakan aseks (cth. pertunasan Hydra), pengkulturan tisu tumbuhan (FRIM/MARDI/MPOC/MRB), pengkulturan daging daripada sel stem haiwan, dan terapi sel stem."],"labId":"bio46_kitar_mitosis_sim","labTitle":"Simulasi 60fps Mitosis (PMAT) Haiwan vs Tumbuhan","labProps":{"tab":"mitosis"},"examTip":"Perangkap klasik: Jika ditanya bolehkah sel tumbuhan membentuk gentian gelendong walaupun TIADA sentriol? Jawapannya YA — sel tumbuhan tetap membentuk gentian gelendong semasa mitosis!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Peristiwa PMAT & Sitokinesis","voiceCaption":"Kelaskan enam peristiwa pembahagian sel berikut mengikut fasa Profasa atau Metafasa berbanding Anafasa atau Telofasa dan Sitokinesis.","voiceScript":"[confident] Jom uji penguasaan peringkat mitosis kamu! Asingkan keenam-enam peristiwa ini antara peringkat awal Profasa-Metafasa dengan peringkat akhir Anafasa-Telofasa dan Sitokinesis.","prompt":"Isihkan peristiwa mitosis dan sitokinesis berikut mengikut fasa yang tepat:","buckets":[{"id":"pm","label":"Profasa & Metafasa"},{"id":"at","label":"Anafasa, Telofasa & Sitokinesis"}],"items":[{"text":"Kromatin memendek dan menebal; membran nukleus dan nukleolus terurai","bucketId":"pm","note":"Tepat! Peristiwa ini berlaku semasa Profasa."},{"text":"Kromosom tersusun dalam satu baris lurus di satah khatulistiwa","bucketId":"pm","note":"Betul! Susunan sebaris di satah khatulistiwa ialah ciri utama Metafasa."},{"text":"Sentromer membahagi dan kromatid kembar berpisah ke kutub bertentangan","bucketId":"at","note":"Tepat! Pemisahan kromatid kembar berlaku semasa Anafasa."},{"text":"Membran nukleus dan nukleolus terbentuk semula di sekeliling kromatin","bucketId":"at","note":"Betul! Pembentukan semula nukleus berlaku pada Telofasa."},{"text":"Pencerutan membran plasma sel haiwan atau pembentukan plat sel tumbuhan","bucketId":"at","note":"Tepat! Ini mekanisme sitokinesis pada penghujung fasa M."},{"text":"Sentriol bergerak ke kutub bertentangan membentuk gentian gelendong","bucketId":"pm","note":"Betul! Gentian gelendong terbentuk semasa Profasa untuk melekat pada sentromer."}],"explanation":"Profasa memekatkan kromosom dan membina gelendong; Metafasa menyusun sebaris di khatulistiwa; Anafasa memisahkan kromatid kembar; Telofasa membina semula dua nukleus; dan Sitokinesis membahagi sitoplasma."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kegagalan Gentian Gelendong","voiceCaption":"Ramalkan kesannya terhadap sel anak sekiranya gentian gelendong gagal terbentuk semasa mitosis.","voiceScript":"[curious] Soalan Praktis Formatif enam perpuluhan dua! Bayangkan suatu bahan kimia merencatkan pembentukan gentian gelendong dalam sel yang sedang menjalani mitosis. Apakah yang akan berlaku kepada pembahagian kromatid kembar?","hook":"Perhatikan peranan gentian gelendong menarik kromatid pada Simulasi 60fps Mitosis!","scenario":"Satu kultur sel tumbuhan dirawat dengan bahan perencat yang menghalang pembentukan gentian gelendong semasa fasa M.","prompt":"Apakah kesan kegagalan gentian gelendong terbentuk semasa mitosis?","options":["Kromosom tidak dapat disusun di satah khatulistiwa dan kromatid kembar gagal ditarik berpisah ke kutub bertentangan, menghasilkan sel anak dengan bilangan kromosom tidak normal","Dinding sel selulosa membahagi dua kali lebih pantas tanpa kariokinesis","Semua kromosom menjalani pindah silang membentuk gamet haploid","Fasa S berulang secara berterusan tanpa pembesaran sel pada fasa G1"],"correctIndex":0,"proofLabId":"bio46_kitar_mitosis_sim","proofState":{"tab":"mitosis"},"explanation":"Gentian gelendong penting untuk menetapkan kromosom pada satah khatulistiwa (Metafasa) dan menarik kromatid kembar ke kutub bertentangan (Anafasa)."},{"type":"mcq","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Aplikasi Pertanian Kultur Tisu","voiceCaption":"Kenal pasti teknik berasaskan mitosis untuk menghasilkan beribu-ribu anak pokok mangga berkualiti seragam dalam masa singkat.","voiceScript":"[confident] Seorang peladang ingin menghasilkan ribuan anak pokok mangga yang seiras dan berkualiti tinggi dalam masa singkat tanpa persenyawaan. Teknik apakah yang digunakan?","prompt":"Seorang peladang ingin menanam sejumlah besar pokok mangga baka bermutu tinggi dan seragam secara komersial dalam tempoh singkat. Teknik apakah yang berasaskan mitosis?","options":["Teknik pengkulturan tisu tumbuhan daripada sel induk (eksplan) tanpa melalui proses persenyawaan","Persenyawaan ganda dua antara debunga dan pundi embrio","Meiosis di dalam anter dan ovari secara berulang","Konjugasi seksual antara sel epidermis akar pokok mangga"],"correctIndex":0,"explanation":"Pengkulturan tisu tumbuhan menggunakan keupayaan pembahagian mitosis daripada sel/tisu induk untuk mengklonkan ribuan anak pokok seiras dengan ciri genetik sama."}]},{"id":"bio46-u3","title":"Unit 3: Meiosis I & II serta Perbandingan Mitosis vs Meiosis","subtitle":"Subtopik 6.3 — Sinapsis, Bivalen/Tetrad, Pindah Silang & Kiasma (Profasa I), Pemisahan Homolog vs Kromatid Kembar & Jadual Perbandingan","iconType":"scale","iconUrl":"../assets/icons/bio46-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Meiosis I, Pindah Silang & Meiosis II","voiceCaption":"Meiosis berlaku di testis dan ovari untuk menghasilkan empat gamet haploid bervariasi genetik melalui Meiosis I dan Meiosis II.","voiceScript":"[warm] Bagaimana variasi genetik terhasil supaya setiap anak berbeza? Jawapannya ialah Meiosis! Meiosis berlaku dalam organ pembiakan iaitu testis dan ovari untuk menghasilkan gamet haploid melalui gametogenesis dan mengekalkan bilangan kromosom diploid spesies dari satu generasi ke generasi berikutnya! Peristiwa paling kritikal berlaku semasa Profasa satu Meiosis satu: kromosom homolog berpasangan melalui proses sinapsis membentuk bivalen atau tetrad, lalu bertukar segmen bahan genetik di titik kiasma melalui proses pindah silang! Seterusnya pada Metafasa satu pasangan homolog beratur berpasangan di satah khatulistiwa, dan pada Anafasa satu kromosom homolog berpisah ke kutub bertentangan sementara sentromer TIDAK membahagi! Selepas Telofasa satu tanpa replikasi D N A, sel memasuki Meiosis dua di mana sentromer membahagi pada Anafasa dua dan menghasilkan empat sel anak haploid tidak seiras!","title":"6.3 Peringkat Meiosis I & Meiosis II serta Kepentingan Meiosis","acronym":"S•B•P•K","hook":"Ingat dua titik pindah kunci Meiosis: Meiosis I memisahkan KROMOSOM HOMOLOG (sentromer kekal utuh), manakala Meiosis II memisahkan KROMATID KEMBAR!","summary":"Meiosis terdiri daripada Meiosis I (pengurangan bilangan kromosom 2n -> n serta pindah silang di Profasa I) dan Meiosis II untuk menghasilkan 4 gamet haploid unik.","bullets":["Meiosis I (2n -> 2 sel n): Profasa I — sinapsis (kromosom homolog berpasangan membentuk bivalen/tetrad 4 kromatid) diikuti PINDAH SILANG (pertukaran segmen genetik antara kromatid bukan seiras di titik KIASMA, menghasilkan kombinasi gen baharu). Metafasa I — pasangan kromosom homolog tersusun berpasangan di satah khatulistiwa (sentromer belum berpisah). Anafasa I — gentian gelendong mengecut menarik setiap kromosom homolog berpisah ke kutub bertentangan (sentromer tidak membahagi). Telofasa I + Sitokinesis — 2 sel anak haploid (n). Tiada replikasi DNA sebelum Meiosis II.","Meiosis II (2 sel n -> 4 gamet n) & Kepentingan: Profasa II -> Metafasa II (kromosom tersusun rawak sebaris di satah khatulistiwa) -> Anafasa II (sentromer membahagi, kromatid kembar berpisah ke kutub bertentangan) -> Telofasa II + Sitokinesis (4 sel anak haploid tidak seiras secara genetik berkembang menjadi gamet). Kepentingan: pembentukan gamet (gametogenesis), menghasilkan variasi genetik dan mengekalkan nombor kromosom diploid generasi ke generasi."],"labId":"bio46_kitar_mitosis_sim","labTitle":"Simulator Meiosis I & II (Sinapsis & Pindah Silang)","labProps":{"tab":"meiosis"},"examTip":"Perbezaan emas Kertas 2: Bandingkan Metafasa Mitosis (kromosom berbaris tunggal sebaris di khatulistiwa) dengan Metafasa I Meiosis (pasangan kromosom homolog berbaris berpasangan di khatulistiwa)."},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Fasa Meiosis I & II","voiceCaption":"Padankan lima peringkat kritikal Meiosis I dan Meiosis II dengan peristiwa utamanya.","voiceScript":"[confident] Jom uji penguasaan peringkat Meiosis satu dan Meiosis dua! Padankan setiap peringkat di sebelah kiri dengan peristiwa kromosomnya.","prompt":"Padankan peringkat meiosis berikut dengan peristiwa yang berlaku:","pairs":[{"id":"me1","left":"Profasa I","right":"Sinapsis membentuk bivalen/tetrad serta pindah silang di kiasma menghasilkan kombinasi gen baharu"},{"id":"me2","left":"Metafasa I","right":"Pasangan kromosom homolog tersusun berpasangan di satah khatulistiwa"},{"id":"me3","left":"Anafasa I","right":"Kromosom homolog berpisah ke kutub bertentangan tanpa pembahagian sentromer"},{"id":"me4","left":"Anafasa II","right":"Sentromer membahagi dan kromatid kembar berpisah ke kutub bertentangan"},{"id":"me5","left":"Telofasa II & Sitokinesis","right":"Menghasilkan 4 sel anak haploid (n) yang berbeza kandungan genetiknya"}],"explanation":"Profasa I menjalani sinapsis & pindah silang; Metafasa I menyusun homolog berpasangan; Anafasa I memisahkan kromosom homolog; Anafasa II memisahkan kromatid kembar; Telofasa II menghasilkan 4 gamet haploid."},{"type":"sort","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Isih Mitosis vs Meiosis","voiceCaption":"Kelaskan enam ciri pembahagian sel berikut antara Mitosis dengan Meiosis.","voiceScript":"[confident] Asingkan keenam-enam ciri berikut sama ada merujuk kepada proses Mitosis atau proses Meiosis!","prompt":"Kelaskan pernyataan berikut kepada Mitosis atau Meiosis:","buckets":[{"id":"mit","label":"Mitosis"},{"id":"mei","label":"Meiosis"}],"items":[{"text":"Berlaku di sel soma dan tisu meristem menghasilkan 2 sel anak diploid (2n)","bucketId":"mit","note":"Tepat! Mitosis mengekalkan bilangan kromosom 2n."},{"text":"Kandungan genetik sel anak seiras sepenuhnya dengan sel induk tanpa pindah silang","bucketId":"mit","note":"Betul! Tiada sinapsis atau pindah silang berlaku dalam mitosis."},{"text":"Berlaku di testis dan ovari menghasilkan 4 gamet haploid (n)","bucketId":"mei","note":"Tepat! Meiosis mengurangkan bilangan kromosom kepada separuh."},{"text":"Melibatkan dua pusingan pembahagian nukleus (Meiosis I dan Meiosis II)","bucketId":"mei","note":"Betul! Hanya satu kali replikasi DNA diikuti dua pembahagian sel."},{"text":"Berlaku sinapsis kromosom homolog dan pindah silang membentuk variasi genetik","bucketId":"mei","note":"Tepat! Pindah silang di kiasma semasa Profasa I menjana variasi."},{"text":"Penting untuk pertumbuhan, pembaikan tisu luka dan penjanaan semula","bucketId":"mit","note":"Betul! Mitosis membina sel badan baharu yang seiras."}],"explanation":"Mitosis (1 pembahagian di sel soma -> 2 sel 2n seiras, tiada pindah silang); Meiosis (2 pembahagian di organ pembiakan -> 4 gamet n bervariasi genetik, ada sinapsis & pindah silang)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Bina Huraian Pindah Silang","voiceCaption":"Susun huraian lengkap mengenai proses sinapsis dan pindah silang semasa Profasa I meiosis.","voiceScript":"[confident] Susun blok pernyataan untuk menerangkan bagaimana variasi genetik tercetus semasa Profasa satu dalam Meiosis!","prompt":"Susun huraian proses sinapsis dan pindah silang pada Profasa I:","hint":"Mulakan dengan berpasangannya kromosom homolog (sinapsis) sehingga terhasil kombinasi gen baharu.","answerTokens":["Kromosom homolog berpasangan secara sinapsis membentuk bivalen","lalu berlaku pindah silang di titik kiasma","untuk bertukar bahan genetik antara kromatid bukan seiras","dan menghasilkan kombinasi gen baharu"],"distractors":["sentromer membahagi membentuk empat sel diploid","dinding sel membentuk plat sel selulosa"],"explanation":"Semasa Profasa I, sinapsis membentuk bivalen (tetrad) dan pertukaran segmen DNA antara kromatid bukan seiras berlaku di kiasma (pindah silang), menjana kombinasi gen baharu."}]},{"id":"bio46-u4","title":"Unit 4: Isu Pembahagian Sel terhadap Kesihatan Manusia","subtitle":"Subtopik 6.4 — Mitosis Tak Terkawal (Tumor Benigna vs Tumor Malignan/Kanser & Karsinogen) serta Tak Disjungsi Meiosis (Trisomi 21 Sindrom Down)","iconType":"book","iconUrl":"../assets/icons/bio46-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Tumor, Kanser & Sindrom Down","voiceCaption":"Mitosis luar kawalan membentuk tumor benigna atau tumor malignan (kanser), manakala tak disjungsi meiosis menyebabkan individu Sindrom Down mempunyai empat puluh tujuh kromosom.","voiceScript":"[warm] Kitar sel dikawal ketat oleh sistem kawalan di setiap fasa G satu, S, G dua dan M! Jika berlaku kerosakan akibat sinaran X, sinar gama, sinar ultraungu, tar tembakau, karsinogen seperti formaldehid dan benzena, faktor genetik atau virus, mitosis menjadi tidak terkawal lalu membentuk tumor! Tumor benigna tidak berbahaya dan boleh dibedah keluar, sedangkan tumor malignan atau kanser merebak melalui salur darah dan limfa untuk memusnahkan tisu normal serta bersaing mendapatkan nutrien! Sementara itu, ketidaknormalan semasa meiosis iaitu kegagalan gentian gelendong pada Anafasa satu atau Anafasa dua menyebabkan tak disjungsi — kromosom gagal berpisah lalu membentuk gamet berjumlah dua puluh dua atau dua puluh empat kromosom! Persenyawaan antara gamet dua puluh empat dengan gamet normal dua puluh tiga menghasilkan zigot berempat puluh tujuh kromosom iaitu Trisomi dua puluh satu atau Sindrom Down!","title":"6.4 Mitosis Tak Terkawal (Tumor & Kanser) serta Trisomi 21 (Sindrom Down)","acronym":"B•M•T•21","hook":"Satu tambahan kromosom pada pasangan ke-21 (Trisomi 21 -> 47 kromosom) akibat tak disjungsi meiosis mengubah ciri fizikal dan perkembangan seumur hidup!","mediaKey":"bio46_kariotip_trisomi","summary":"Mitosis luar kawalan mencetuskan tumor benigna atau kanser (tumor malignan), manakala tak disjungsi semasa Anafasa I/II meiosis menghasilkan individu Sindrom Down (47 kromosom).","bullets":["Ketidaknormalan Mitosis (Tumor & Kanser): Punca = sinaran (sinar-X, sinar gama, ultraungu), bahan kimia (tar tembakau), karsinogen (formaldehid, benzena), faktor genetik, bakteria dan virus. Tumor Benigna tidak merebak/tidak berbahaya dan boleh dibuang melalui pembedahan. Tumor Malignan (Kanser) membahagi berterusan, bersaing merebut nutrien daripada tisu sekeliling, serta merebak melalui salur limfa dan salur darah membentuk tumor baharu di organ lain (boleh dirawat melalui radioterapi untuk memusnahkan sel kanser yang membahagi cepat).","Ketidaknormalan Meiosis (Tak Disjungsi -> Sindrom Down): Kegagalan fungsi gentian gelendong semasa Anafasa I atau Anafasa II menyebabkan kromosom gagal berpisah (TAK DISJUNGSI), menghasilkan gamet tidak normal (22 atau 24 kromosom). Persenyawaan gamet 24 kromosom dengan gamet normal 23 kromosom menghasilkan zigot dengan 47 kromosom (kromosom tambahan pada pasangan ke-21 = TRISOMI 21). Ciri Sindrom Down: terencat akal, mata sepet/serong dan lidah sedikit terjelir."],"labId":"bio46_isu_kesihatan_lab","labTitle":"Simulator Tak Disjungsi Meiosis & Kanser","labProps":{"tab":"trisomi"},"examTip":"Angka & istilah tepat S.P.M.: Sindrom Down = 47 kromosom (Trisomi pada pasangan kromosom ke-21) berpunca daripada TAK DISJUNGSI akibat kegagalan gentian gelendong semasa Anafasa I atau Anafasa II!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Tak Disjungsi Anafasa I","voiceCaption":"Ramalkan bilangan kromosom dalam kedua-dua sel anak jika sepasang kromosom homolog gagal berpisah semasa Anafasa I.","voiceScript":"[curious] Cuba ramalkan hasil pembentukan gamet sekiranya berlaku tak disjungsi pada pasangan kromosom dua puluh satu semasa Anafasa satu meiosis manusia!","hook":"Simulasikan kegagalan pemisahan kromosom pada Simulator Tak Disjungsi selepas menjawab!","scenario":"Satu sel induk gamet manusia (2n = 46) mengalami tak disjungsi pada pasangan kromosom ke-21 semasa Anafasa I, manakala Meiosis II berjalan normal.","prompt":"Apakah bilangan kromosom bagi gamet-gamet yang terhasil dan akibatnya jika gamet berlebihan bersenyawa dengan gamet normal (n = 23)?","options":["Menghasilkan gamet dengan 24 dan 22 kromosom; persenyawaan gamet 24 dengan gamet normal (23) membentuk zigot 47 kromosom (Trisomi 21 / Sindrom Down)","Menghasilkan empat gamet normal yang semuanya mempunyai 23 kromosom","Menghasilkan sel soma diploid dengan 46 kromosom yang menyebabkan tumor benigna","Zigot terbentuk mempunyai 92 kromosom dan mengalami sitokinesis plat sel"],"correctIndex":0,"proofLabId":"bio46_isu_kesihatan_lab","proofState":{"tab":"trisomi"},"explanation":"Tak disjungsi menghasilkan gamet n+1 (24 kromosom) dan n-1 (22 kromosom). Apabila gamet 24 bersenyawa dengan gamet normal 23, zigot mengandungi 47 kromosom (Trisomi 21)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Tumor Benigna vs Malignan","voiceCaption":"Kelaskan enam ciri kesihatan berikut kepada Tumor Benigna atau Tumor Malignan (Kanser) serta Tak Disjungsi.","voiceScript":"[confident] Kelaskan keenam-enam fakta penyakit pembahagian sel ini sama ada merujuk kepada Tumor dan Kanser atau merujuk kepada Ketidaknormalan Meiosis!","prompt":"Isihkan fakta kesihatan berikut kepada kategori yang tepat:","buckets":[{"id":"kan","label":"Mitosis Tak Terkawal (Tumor/Kanser)"},{"id":"meierr","label":"Meiosis Tak Normal (Sindrom Down)"}],"items":[{"text":"Tumor benigna kekal setempat, tidak berbahaya dan boleh dibuang secara pembedahan","bucketId":"kan","note":"Tepat! Tumor benigna tidak merebak ke organ lain."},{"text":"Sel tumor malignan merebak melalui salur darah dan salur limfa ke organ lain","bucketId":"kan","note":"Betul! Penyebaran ini merosakkan tisu sihat dan organ penting."},{"text":"Dicetuskan oleh karsinogen (formaldehid, benzena), tar tembakau dan sinaran UV/X","bucketId":"kan","note":"Tepat! Agen karsinogen memutasi sistem kawalan kitar sel."},{"text":"Kegagalan gentian gelendong menyebabkan tak disjungsi semasa Anafasa I atau II","bucketId":"meierr","note":"Betul! Ini punca langsung gamet menerima kromosom ekstra atau kurang."},{"text":"Individu mempunyai 47 kromosom akibat kromosom tambahan pada set ke-21 (Trisomi 21)","bucketId":"meierr","note":"Tepat! Mengakibatkan mata sepet/serong, lidah sedikit terjelir dan terencat akal."},{"text":"Radioterapi digunakan untuk membunuh atau mengawal sel yang membahagi terlalu cepat","bucketId":"kan","note":"Betul! Sinar mengion merosakkan DNA sel kanser yang aktif membahagi."}],"explanation":"Ketidaknormalan mitosis menyebabkan tumor benigna dan kanser (tumor malignan); ketidaknormalan meiosis (tak disjungsi) menyebabkan Trisomi 21 (Sindrom Down)."},{"type":"mcq","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Fungsi Radioterapi & Pencegahan Kanser","voiceCaption":"Jelaskan rasional penggunaan radioterapi terhadap sel kanser dan dua langkah pencegahan kanser.","voiceScript":"[confident] Soalan Praktis Formatif enam perpuluhan empat! Mengapakah radioterapi digunakan untuk mengawal atau menghentikan pertumbuhan sel kanser?","prompt":"Mengapakah rawatan radioterapi berkesan mengawal atau menghentikan pertumbuhan tumor malignan?","options":["Sinaran berdos tinggi merosakkan DNA sel kanser yang membahagi dengan pantas dan tidak terkawal supaya sel kanser mati atau berhenti membahagi","Sinaran menggalakkan sel kanser menjalani sinapsis dan pindah silang menjadi gamet","Radioterapi menukarkan tumor malignan menjadi sel stem daging kultur","Sinaran menambah bilangan kromosom kepada 47 supaya sel berhenti membahagi"],"correctIndex":0,"explanation":"Radioterapi menggunakan sinaran bertenaga tinggi untuk memusnahkan DNA sel kanser yang membahagi secara pantas supaya tumor mengecut dan tidak merebak."}]},{"id":"bio46-u5","title":"Cabaran Boss SPM: Pembahagian Sel","subtitle":"Sintesis KBAT Kertas 1 & 2 — Pengenalpastian Fasa Mikroskop, Tak Disjungsi, Kultur Tisu & Teknologi RNA Interference","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Hujung Akar & Metafasa","voiceCaption":"Kenal pasti kepentingan pembahagian sel di hujung akar tumbuhan dan perbezaan antara Metafasa mitosis dengan Metafasa I meiosis.","voiceScript":"[excited] Cabaran Boss S P M Bab enam bermula! Soalan pertama menggabungkan tisu meristem hujung akar dan perbezaan Metafasa. Apakah perbezaan paling ketara antara Metafasa mitosis dengan Metafasa satu meiosis?","prompt":"Nyatakan perbezaan paling tepat antara Metafasa mitosis dengan Metafasa I meiosis:","options":["Dalam Metafasa mitosis, semua kromosom tersusun tunggal sebaris di satah khatulistiwa; dalam Metafasa I meiosis, pasangan kromosom homolog tersusun berpasangan di satah khatulistiwa","Dalam Metafasa mitosis, kromosom homolog berpasangan di kutub; dalam Metafasa I, sentromer membahagi dua","Metafasa mitosis berlaku di testis, manakala Metafasa I berlaku di meristem hujung akar","Tiada gentian gelendong terlibat semasa Metafasa I meiosis"],"correctIndex":0,"explanation":"Metafasa mitosis menyusun kromosom dalam satu baris tunggal di satah khatulistiwa; Metafasa I meiosis menyusun pasangan kromosom homolog berpasangan di satah khatulistiwa."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Meiosis I vs Meiosis II","voiceCaption":"Kelaskan enam peristiwa meiosis berikut kepada Meiosis I atau Meiosis II.","voiceScript":"[confident] Cabaran kedua Boss S P M! Asingkan keenam-enam peristiwa pembahagian sel ini sama ada berlaku semasa Meiosis satu atau semasa Meiosis dua.","prompt":"Isihkan peristiwa meiosis berikut kepada Meiosis I atau Meiosis II:","buckets":[{"id":"m1","label":"Meiosis I"},{"id":"m2","label":"Meiosis II"}],"items":[{"text":"Berlaku sinapsis kromosom homolog membentuk bivalen dan pindah silang di kiasma","bucketId":"m1","note":"Tepat! Sinapsis dan pindah silang ialah ciri eksklusif Profasa I."},{"text":"Kromosom homolog berpisah ke kutub bertentangan (sentromer kekal utuh)","bucketId":"m1","note":"Betul! Berlaku pada Anafasa I."},{"text":"Bilangan kromosom dikurangkan daripada diploid (2n) kepada haploid (n)","bucketId":"m1","note":"Tepat! Pengurangan ploidi berlaku selesai Telofasa I."},{"text":"Sentromer membahagi dua dan kromatid kembar berpisah ke kutub bertentangan","bucketId":"m2","note":"Betul! Pemisahan kromatid kembar berlaku pada Anafasa II."},{"text":"Kromosom tersusun tunggal secara rawak di satah khatulistiwa setiap sel anak","bucketId":"m2","note":"Tepat! Berlaku semasa Metafasa II."},{"text":"Tamat dengan sitokinesis menghasilkan empat sel anak haploid berbeza genetik","bucketId":"m2","note":"Betul! Menghasilkan 4 gamet haploid selepas Telofasa II."}],"explanation":"Meiosis I memisahkan pasangan kromosom homolog selepas pindah silang (2n -> 2 sel n); Meiosis II memisahkan kromatid kembar melalui pembahagian sentromer (2 sel n -> 4 gamet n)."},{"type":"predict","xp":25,"voiceId     }
    var mainEl = document.getElementById("notaMain");

  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var biteTipHtml = isBite && step.examTip

        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
