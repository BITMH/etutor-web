/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab07","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":7,"title":"Respirasi Sel","subtitle":"Subtopik 7.1-7.3 KSSM — Glukosa & Keperluan Tenaga, Respirasi Aerob (Glikolisis + Mitokondrion, 2898 kJ, Respirometer), Fermentasi Alkohol (Yis & Pokok Padi, 210 kJ) serta Fermentasi Asid Laktik (Lactobacillus & Otot Manusia Hutang Oksigen, 150 kJ).","estimatedMinutes":28,"themeAccent":"#ea580c","isFreePreview":false,"labScript":"biologi-t4-bab07-labs.js","coverIcon":"../assets/icons/bio47-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan laluan glikolisis, A T P dan fermentasi kamu memang mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Daripada respirometer hingga hutang oksigen atlet, semuanya tepat!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula hasil tenaga 2898 kJ, 210 kJ dan 150 kJ di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Respirasi Sel Tingkatan empat Bab tujuh berjaya dikuasai!"},"units":[{"id":"bio47-u1","title":"Unit 1: Penghasilan Tenaga & Jenis Respirasi Sel","subtitle":"Subtopik 7.1 — Keperluan Tenaga dalam Anabolisme, Substrat Utama Glukosa serta Respirasi Aerob, Anaerob & Fermentasi","iconType":"atom","iconUrl":"../assets/icons/bio47-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Substrat Glukosa & Jenis Respirasi","voiceCaption":"Respirasi sel mengoksidakan molekul organik khususnya glukosa untuk menghasilkan tenaga kimia bagi proses anabolisme dan aktiviti sel hidup.","voiceScript":"[warm] Selamat datang ke Bab tujuh, Respirasi Sel! Setiap sel hidup memerlukan tenaga kimia untuk menjalankan proses metabolisme termasuk tindak balas anabolisme seperti pembentukan protein otot, pengangkutan aktif, pengecutan otot dan pembahagian sel! Substrat utama penghasilan tenaga ialah glukosa, yang diperoleh oleh manusia serta haiwan melalui pencernaan karbohidrat dan dihasilkan oleh tumbuhan hijau melalui fotosintesis! Respirasi sel terbahagi kepada respirasi aerob dengan kehadiran oksigen, respirasi anaerob tanpa oksigen, serta fermentasi iaitu penguraian glukosa tidak lengkap dalam keadaan oksigen terhad atau tanpa oksigen!","title":"7.1 Keperluan Tenaga, Substrat Glukosa & Jenis Respirasi Sel","acronym":"A•A•F","hook":"Tanpa tenaga ATP daripada respirasi sel, tindak balas pembinaan protein otot dan pengangkutan aktif akan terhenti serta-merta!","mediaKey":"bio47_mitokondrion_atp","videoClip":{"src":"../assets/biologi-t4-bab07/video/bio47_video_respirasi_sel_atp_narasi.mp4","hasNarration":true,"posterKey":"bio47_mitokondrion_atp","caption":"Penghasilan ATP melalui Respirasi Aerob dan Fermentasi."},"summary":"Respirasi sel mengoksidakan glukosa secara berperingkat untuk menjana tenaga kimia dalam bentuk ATP melalui respirasi aerob, anaerob atau fermentasi.","bullets":["Keperluan Tenaga & Substrat Utama: Proses katabolisme membebaskan tenaga manakala proses anabolisme (cth. sintesis protein otot) menggunakan tenaga. Substrat utama respirasi sel ialah GLUKOSA — diperoleh manusia/haiwan daripada pencernaan karbohidrat makanan, dan dihasilkan tumbuhan hijau apabila klorofil memerangkap cahaya matahari semasa fotosintesis.","3 Jenis Laluan: Respirasi aerob (penguraian lengkap glukosa dengan kehadiran oksigen), Respirasi anaerob (berlaku tanpa oksigen) dan Fermentasi (laluan alternatif penguraian glukosa tidak lengkap dalam keadaan oksigen terhad atau tanpa oksigen)."],"labId":"bio47_respirasi_atp_lab","labTitle":"Simulator Respirasi Aerob vs Fermentasi & Respirometer","labProps":{"mode":"aerob"},"examTip":"Skema S.P.M.: Substrat utama respirasi sel ialah GLUKOSA. Selain glukosa, sel juga boleh menggunakan asid lemak/lipid atau asid amino apabila bekalan glukosa kehabisan."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Konsep Asas Respirasi","voiceCaption":"Padankan istilah asas penghasilan tenaga sel berikut dengan huraian tepatnya.","voiceScript":"[curious] Uji ingatan pantas kamu tentang Subtopik tujuh perpuluhan satu! Padankan keempat-empat istilah berikut dengan penerangannya.","prompt":"Padankan istilah asas respirasi sel berikut dengan keterangannya:","pairs":[{"id":"r1","left":"Glukosa","right":"Substrat utama penghasilan tenaga daripada pencernaan karbohidrat atau fotosintesis"},{"id":"r2","left":"Respirasi aerob","right":"Penguraian lengkap glukosa dengan kehadiran oksigen menghasilkan CO2, air dan 2898 kJ tenaga"},{"id":"r3","left":"Fermentasi","right":"Laluan alternatif penguraian glukosa secara tidak lengkap ketika oksigen terhad atau tiada"},{"id":"r4","left":"Anabolisme (cth. sintesis protein)","right":"Proses metabolisme yang menggunakan tenaga ATP daripada respirasi sel"}],"explanation":"Glukosa ialah substrat utama; respirasi aerob memerlukan oksigen; fermentasi berlaku tanpa atau dengan oksigen terhad; dan ATP digunakan untuk proses anabolisme."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s3","voiceToneLabel":"Sumber Glukosa & Kepentingan ATP","voiceCaption":"Kenal pasti lima keperluan tenaga dalam proses metabolisme organisma hidup.","voiceScript":"[confident] Antara proses berikut, yang manakah secara langsung memerlukan bekalan tenaga daripada respirasi sel?","prompt":"Manakah antara berikut memerlukan tenaga kimia ATP hasil daripada respirasi sel?","options":["Sintesis protein otot (anabolisme), pengangkutan aktif ion mineral di akar, pengecutan otot, pembahagian sel dan penghantaran impuls saraf","Resapan ringkas gas oksigen merentasi alveolus menuruni kecerunan tekanan separa","Osmosis air masuk ke dalam vakuol sel tumbuhan daripada air suling","Penyejatan peluh daripada permukaan kulit semasa hari panas"],"correctIndex":0,"explanation":"Anabolisme (sintesis protein/glikogen), pengangkutan aktif, pengecutan otot, pembahagian sel (mitosis/meiosis) dan penghantaran impuls semuanya memerlukan ATP, sedangkan resapan ringkas dan osmosis ialah pengangkutan pasif."}]},{"id":"bio47-u2","title":"Unit 2: Respirasi Aerob (Glikolisis, Mitokondrion & Respirometer)","subtitle":"Subtopik 7.2 — Glikolisis di Sitoplasma, Pengoksidaan Piruvat di Mitokondrion, Kitaran ATP-ADP & Aktiviti 7.1 Respirometer","iconType":"formula","iconUrl":"../assets/icons/bio47-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Glikolisis, Mitokondrion & ATP","voiceCaption":"Respirasi aerob bermula dengan glikolisis di sitoplasma menukar glukosa kepada dua piruvat, diikuti pengoksidaan piruvat di mitokondrion membebaskan 2898 kilojoule tenaga.","voiceScript":"[warm] Mari kita teroka dua peringkat utama respirasi aerob! Peringkat pertama ialah glikolisis yang berlaku di dalam sitoplasma: enzim menguraikan satu molekul glukosa kepada dua molekul piruvat! Peringkat kedua berlaku di dalam mitokondrion apabila piruvat dioksidakan lengkap dengan oksigen menghasilkan karbon dioksida, air dan tenaga sebanyak dua ribu lapan ratus sembilan puluh lapan kilojoule! Tenaga ini digunakan untuk menambahkan fosfat tak organik kepada A D P menjadi molekul A T P yang mempunyai ikatan fosfat lemah — apabila ikatan ini terputus, tenaga dibebaskan kepada sel! Dalam eksperimen respirometer pula, kapur soda menyerap karbon dioksida yang dibebaskan lipas supaya kenaikan aras cecair berwarna mengukur kadar penggunaan oksigen!","title":"7.2 Mekanisme Respirasi Aerob, Sintesis ATP & Respirometer","acronym":"G•P•M•ATP","hook":"Glikolisis sentiasa berlaku di SITOPLASMA untuk kedua-dua respirasi aerob dan fermentasi — hanya pengoksidaan piruvat seterusnya memasuki MITOKONDRION!","summary":"Respirasi aerob mengoksidakan glukosa sepenuhnya melalui glikolisis (sitoplasma) dan pengoksidaan piruvat (mitokondrion) untuk menjana 2898 kJ tenaga dalam bentuk ATP.","formula":"Glukosa + Oksigen  -->  Karbon dioksida + Air + Tenaga (2898 kJ)   |   ADP + fosfat <--> ATP","bullets":["2 Peringkat & Kitaran ATP: (1) Glikolisis di sitoplasma — 1 molekul glukosa diurai oleh enzim kepada 2 molekul piruvat. (2) Pengoksidaan Piruvat di mitokondrion — piruvat dioksidakan menghasilkan CO2, air dan tenaga besar (2898 kJ per mol glukosa) bagi mensintesis ATP (ADP + fosfat -> ATP). Apabila ikatan fosfat lemah ATP terputus (ATP -> ADP + fosfat), tenaga dibekalkan kepada sel.","Eksperimen Respirometer (Aktiviti 7.1): Tabung didih A berisi lipas di atas kasa dawai + 10 g kapur soda; Tabung didih B (kawalan) tiada lipas + 10 g kapur soda; sambungan disapu jeli petroleum agar kedap udara. Kapur soda menyerap gas CO2 yang dibebaskan lipas; pengambilan O2 oleh lipas mengurangkan tekanan udara di dalam tabung A menyebabkan cecair berwarna dalam tiub kapilari menaik."],"labId":"bio47_respirasi_atp_lab","labTitle":"Simulator Respirometer & Kitaran ATP-ADP","labProps":{"mode":"respirometer"},"examTip":"Soalan lazim Aktiviti 7.1: Apakah fungsi KAPUR SODA dalam respirometer? Menyerap karbon dioksida yang dibebaskan oleh lipas supaya perubahan aras cecair berwarna hanya menunjukkan isipadu oksigen yang digunakan!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Aras Cecair Respirometer","voiceCaption":"Ramalkan pergerakan cecair berwarna dalam tiub kapilari respirometer A yang mengandungi lipas dan kapur soda berbanding tabung B.","voiceScript":"[curious] Cuba ramalkan pemerhatian Aktiviti tujuh perpuluhan satu selepas satu jam! Tabung didih A mempunyai lipas dan kapur soda, manakala tabung didih B hanya mempunyai kapur soda sebagai kawalan. Mengapakah cecair berwarna dalam tiub kapilari A bergerak mendekati tabung didih?","hook":"Hidupkan simulasi Respirometer pada Makmal Respirasi Sel selepas menjawab!","scenario":"Respirometer A (lipas + 10 g kapur soda) dan Respirometer B (kosong + 10 g kapur soda) ditutup kedap udara dengan jeli petroleum dan dibiarkan selama 1 jam.","prompt":"Mengapakah aras cecair berwarna pada tiub kapilari A meningkat ke arah tabung didih A?","options":["Lipas menggunakan O2 untuk respirasi aerob dan membebaskan CO2 yang diserap oleh kapur soda; pengurangan isipadu serta tekanan udara di dalam tabung A menarik cecair berwarna naik","Lipas membebaskan oksigen tambahan yang menolak cecair berwarna keluar dari tiub","Kapur soda membebaskan gas nitrogen apabila bertindak balas dengan jeli petroleum","Tabung didih B mengalami kenaikan aras cecair yang lebih tinggi berbanding tabung A"],"correctIndex":0,"proofLabId":"bio47_respirasi_atp_lab","proofState":{"mode":"respirometer"},"explanation":"CO2 yang terhasil daripada respirasi lipas diserap oleh kapur soda, maka hanya pengambilan O2 yang mengurangkan tekanan udara dalam tabung didih A lalu menarik cecair berwarna naik."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Persamaan Respirasi Aerob","voiceCaption":"Susun persamaan perkataan lengkap bagi penguraian glukosa semasa respirasi aerob di dalam sel.","voiceScript":"[confident] Susun persamaan perkataan penuh bagi tindak balas respirasi aerob termasuk jumlah tenaga yang dibebaskan!","prompt":"Susun persamaan perkataan bagi respirasi aerob:","hint":"Glukosa bertindak balas dengan oksigen menghasilkan karbon dioksida, air dan 2898 kJ tenaga.","answerTokens":["Glukosa + Oksigen","-->","Karbon dioksida + Air + Tenaga (2898 kJ)"],"distractors":["Etanol + Karbon dioksida + 210 kJ","Asid laktik + 150 kJ"],"explanation":"Respirasi aerob mengoksidakan glukosa sepenuhnya dengan oksigen menjadi karbon dioksida, air dan tenaga sebanyak 2898 kJ."}]},{"id":"bio47-u3","title":"Unit 3: Fermentasi Alkohol (Yis & Pokok Padi)","subtitle":"Subtopik 7.3 — Fermentasi Alkohol (210 kJ), Pembuatan Roti/Bir/Tapai, Enzim Alkohol Dehidrogenase Padi & Eksperimen Yis","iconType":"book","iconUrl":"../assets/icons/bio47-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Fermentasi Alkohol Yis & Padi","voiceCaption":"Dalam keadaan tanpa oksigen, yis dan pokok padi menjalankan fermentasi alkohol menghasilkan etanol, karbon dioksida dan tenaga dua ratus sepuluh kilojoule.","voiceScript":"[warm] Apabila oksigen terhad atau tiada langsung, piruvat hasil glikolisis tidak masuk ke mitokondrion tetapi menjalani fermentasi di dalam sitoplasma! Dalam fermentasi alkohol oleh yis, glukosa diuraikan secara tidak lengkap kepada etanol, karbon dioksida dan tenaga sebanyak dua ratus sepuluh kilojoule! Gas karbon dioksida yang terbebas inilah yang menaikkan doh roti menjadi gebu! Tahukah kamu pokok padi yang hidup di sawah berair dan kekurangan oksigen juga menjalankan fermentasi alkohol? Sel padi mampu bertahan kerana ia menghasilkan banyak enzim alkohol dehidrogenase yang menguraikan etanol toksik kepada karbon dioksida tidak bertoksik! Dalam eksperimen yis pula, glukosa dididihkan dan disejukkan untuk menyingkirkan oksigen terlarut lalu dilapisi minyak parafin bagi mengekalkan keadaan anaerob!","title":"7.3 Fermentasi Alkohol: Yis, Pokok Padi & Eksperimen Anaerob","acronym":"E•C•210•AD","hook":"Tanpa enzim alkohol dehidrogenase yang banyak, sawah berair akan meracuni akar pokok padi dengan etanol hasil fermentasinya sendiri!","mediaKey":"bio47_fermentasi_yis","summary":"Fermentasi alkohol menguraikan glukosa tidak lengkap kepada etanol, karbon dioksida dan 210 kJ tenaga, dimanfaatkan dalam penaikan roti serta penyesuaian pokok padi di sawah berair.","formula":"Glukosa  -->  Etanol + Karbon dioksida + Tenaga (210 kJ)","bullets":["Yis & Pokok Padi: Yis membebaskan etanol (pembuatan bir/wain) dan gas CO2 (menaikkan doh roti). Pokok padi di kawasan bertakung air (kurang oksigen) menjalankan fermentasi alkohol; sel padi mempunyai toleransi tinggi terhadap etanol kerana menghasilkan banyak enzim ALKOHOL DEHIDROGENASE untuk menguraikan etanol kepada karbon dioksida tidak bertoksik.","Eksperimen Fermentasi Yis (Aktiviti 7.3): Larutan glukosa 5% dididihkan terlebih dahulu untuk menyingkirkan oksigen terlarut dan disejukkan (supaya yis tidak mati oleh haba), lalu ditambah lapisan minyak parafin bagi menghalang oksigen udara melarut masuk. Tanda fermentasi berjaya: suhu campuran meningkat (tenaga haba dibebaskan), air kapur menjadi keruh (gas CO2 terbebas), dan bau etanol terhasil."],"labId":"bio47_fermentasi_lab","labTitle":"Simulator Fermentasi Alkohol (Yis/Padi) & Asid Laktik","labProps":{"tab":"alkohol"},"examTip":"2 langkah kawalan wajib dalam eksperimen yis: (1) Didih dan sejukkan larutan glukosa -> singkir oksigen terlarut tanpa membunuh yis; (2) Letak lapisan minyak parafin -> halang kemasukan O2 dari udara."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Kesan Oksigen & Doh Roti","voiceCaption":"Ramalkan mengapa doh roti tidak naik jika dicampur yis kering tanpa air suam/gula dan mengapa jus anggur berpenutup rapat menukar glukosa kepada alkohol lebih pantas.","voiceScript":"[curious] Soalan Pengayaan Praktis Sumatif tujuh! Mei Ling mendapati jus anggur bercampur yis dalam bekas tertutup tanpa oksigen menghasilkan alkohol lebih cepat pada mulanya, tetapi akhirnya penguraian glukosa menjadi perlahan walaupun masih ada gula berbaki. Mengapa?","hook":"Ubah kepekatan etanol dan suhu doh pada Simulator Fermentasi selepas menjawab!","scenario":"Yis dibiakkan di dalam bekas tertutup berisi jus anggur tanpa oksigen; kepekatan etanol meningkat mendadak tetapi akhirnya kadar penguraian glukosa merosot.","prompt":"Apakah sebab kadar fermentasi yis menjadi perlahan di penghujung eksperimen walaupun glukosa masih berbaki?","options":["Pengumpulan etanol pada kepekatan tinggi menjadi toksik kepada sel yis lalu merencatkan pertumbuhan dan membunuh yis","Yis kehabisan minyak parafin untuk menjalankan glikolisis","Gas karbon dioksida berubah menjadi asid laktik yang dan sel otot manusia semasa senaman cergas.","voiceScript":"[warm] Pernahkah kamu mengalami kekejangan otot selepas berlari pecut seratus meter? Semasa senaman cergas, kadar penggunaan oksigen melebihi bekalan oksigen oleh sistem peredaran darah! Otot berada dalam keadaan kekurangan oksigen yang dipanggil hutang oksigen, lalu menjalankan fermentasi asid laktik yang hanya menjana dua molekul A T P atau seratus lima puluh kilojoule tenaga per molekul glukosa! Pengumpulan asid laktik menyebabkan kelesuan dan kekejangan otot! Selepas senaman berhenti, kita tercungap-cungap menyedut oksigen berlebihan untuk mengoksidakan asid laktik menjadi karbon dioksida, air dan tenaga bagi membayar hutang oksigen! Bakteria Lactobacillus pula menukarkan laktosa susu kepada asid laktik yang menggumpalkan protein kasein untuk membuat yoghurt!","title":"Fermentasi Asid Laktik (Lactobacillus & Otot) + Jadual 7.1 Perbandingan","acronym":"L•K•H•O","hook":"Tercungap-cungap selepas memecut 100 meter ialah cara badan menghirup oksigen tambahan untuk 'membayar balik' hutang oksigen dengan mengoksidakan asid laktik!","summary":"Fermentasi asid laktik berlaku dalam Lactobacillus (penggumpalan kasein yoghurt) dan sel otot manusia semasa hutang oksigen (150 kJ / 2 ATP), berkongsi glikolisis dengan respirasi aerob.","formula":"Glukosa  -->  Asid laktik + Tenaga (150 kJ / 2 ATP)","bullets":["Lactobacillus & Otot Manusia: Bakteria Lactobacillus menapai gula susu (laktosa) menjadi asid laktik; asid laktik menggumpalkan protein susu (KASEIN) membentuk yoghurt dan memberi rasa masam. Dalam sel otot manusia semasa aktiviti cergas, permintaan O2 melebihi bekalan darah (HUTANG OKSIGEN) -> glukosa diurai tidak lengkap menjadi asid laktik + 2 ATP (150 kJ); pengumpulan asid laktik mencetuskan keletihan & kekejangan otot. Selepas berhenti, oksigen berlebihan diambil untuk mengoksidakan asid laktik kepada CO2, air dan tenaga (hutang oksigen dibayar).","Persamaan & Perbandingan Aerob vs Fermentasi (Jadual 7.1): Persamaan — kedua-duanya menjana ATP dan bermula dengan glikolisis (glukosa -> piruvat) di sitoplasma. Perbezaan — Aerob: dengan O2, penguraian lengkap di sitoplasma & mitokondrion, hasilkan air + CO2 + 2898 kJ; Fermentasi: tanpa/kurang O2, penguraian tidak lengkap di sitoplasma sahaja, tiada air terhasil, produk etanol + CO2 (210 kJ) atau asid laktik (150 kJ)."],"labId":"bio47_fermentasi_lab","labTitle":"Simulator Hutang Oksigen Otot & Banding Aerob/Fermentasi","labProps":{"tab":"laktik"},"examTip":"Skema S.P.M. Pelari pecut 100 m vs Pelari jarak jauh: Pelari pecut 100 m menahan nafas dan bergantung pada fermentasi asid laktik lalu menanggung hutang oksigen tinggi selepas larian; pelari jarak jauh bernafas stabil untuk respirasi aerob."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Aerob vs Fermentasi","voiceCaption":"Kelaskan enam ciri dan hasil tenaga berikut antara Respirasi Aerob dengan Fermentasi mengikut Jadual 7.1.","voiceScript":"[confident] Kelaskan keenam-enam fakta respirasi sel berikut mengikut Jadual tujuh perpuluhan satu antara Respirasi Aerob dengan Fermentasi!","prompt":"Isihkan pernyataan berikut kepada Respirasi Aerob atau Fermentasi:","buckets":[{"id":"aer","label":"Respirasi Aerob"},{"id":"fer","label":"Fermentasi"}],"items":[{"text":"Penguraian lengkap glukosa dengan kehadiran oksigen di sitoplasma dan mitokondrion","bucketId":"aer","note":"Tepat! Pengoksidaan piruvat lengkap berlaku di dalam mitokondrion."},{"text":"Menghasilkan molekul air bersama karbon dioksida serta 2898 kJ tenaga","bucketId":"aer","note":"Betul! Satu molekul glukosa menjana 2898 kJ dalam respirasi aerob."},{"text":"Penguraian tidak lengkap glukosa dalam sitoplasma sahaja tanpa menghasilkan air","bucketId":"fer","note":"Tepat! Fermentasi tidak melibatkan mitokondrion atau penghasilan air."},{"text":"Menjana hanya 210 kJ (alkohol) atau 150 kJ (asid laktik / 2 ATP) per molekul glukosa","bucketId":"fer","note":"Betul! Sebahagian besar tenaga masih terperangkap dalam ikatan etanol atau asid laktik."},{"text":"Berlaku dalam Lactobacillus menghasilkan yoghurt dan otot manusia semasa hutang oksigen","bucketId":"fer","note":"Tepat! Kedua-duanya ialah contoh fermentasi asid laktik."},{"text":"Mengoksidakan asid laktik semula kepada CO2 dan air selepas senaman cergas tamat","bucketId":"aer","note":"Betul! Pembayaran hutang oksigen menggunakan bekalan oksigen berlebihan."}],"explanation":"Respirasi aerob berlaku di sitoplasma + mitokondrion dengan O2 menghasilkan air, CO2 dan 2898 kJ; fermentasi berlaku di sitoplasma sahaja tanpa air menghasilkan 210 kJ atau 150 kJ."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Bina Huraian Yoghurt & Hutang Oksigen","voiceCaption":"Susun urutan kejadian fermentasi asid laktik dalam otot manusia semasa pecutan dan selepas berhenti.","voiceScript":"[confident] Susun semula empat peringkat proses hutang oksigen daripada ketika berlari pecut hingga pemulihan selepas larian!","prompt":"Susun turutan berlakunya hutang oksigen dan pemulihannya dalam sel otot:","hint":"Bermula dengan permintaan oksigen melebihi bekalan darah hingga pengoksidaan asid laktik selepas berhenti.","answerTokens":["Permintaan O2 melebihi bekalan darah menyebabkan hutang oksigen","Otot menjalankan fermentasi asid laktik menjana 2 ATP","Asid laktik terkumpul mencetuskan kelesuan dan kekejangan otot","Oksigen berlebihan selepas senaman mengoksidakan asid laktik"],"distractors":["Otot menghasilkan etanol dan membebaskan air","Enzim alkohol dehidrogenase menukar kasein menjadi yoghurt"],"explanation":"Semasa aktiviti cergas, hutang oksigen mencetuskan fermentasi asid laktik (2 ATP) yang menyebabkan kekejangan; selepas berhenti, oksigen berlebihan mengoksidakan asid laktik kepada CO2, air dan tenaga."}]},{"id":"bio47-u5","title":"Cabaran Boss SPM: Respirasi Sel","subtitle":"Sintesis KBAT Kertas 1 & 2 — Yoghurt Rosak Suhu Bilik, Atlet vs Bukan Atlet, Natrium Bikarbonat Otot & Penaikan Roti","iconType":"trop epas 30 minit.","prompt":"Apakah cadangan paling tepat untuk membantu doh roti Susan mengembang dengan baik?","options":["Larutkan yis kering dalam air suam (~37°C) bersama sedikit gula sebelum diuli ke dalam tepung supaya yis menjadi aktif dan menapai gula membebaskan gas CO2 yang menaikkan doh","Masukkan tepung dan yis terus ke dalam peti sejuk beku pada suhu 0°C","Didihkan yis dalam air 100°C selama 10 minit supaya enzim yis lebih pantas","Gantikan yis dengan kapur soda untuk menyerap semua gas karbon dioksida"],"correctIndex":0,"proofLabId":"bio47_fermentasi_lab","proofState":{"tab":"alkohol"},"explanation":"Yis kering tidak aktif tanpa air dan substrat gula pada suhu suam optimum; pengaktifan dalam air suam bergula membolehkan fermentasi alkohol membebaskan gelembung gas CO2 yang memerangkap udara dan menaikkan doh."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Fermentasi Alkohol vs Laktik","voiceCaption":"Kelaskan enam ciri dan aplikasi berikut kepada Fermentasi Alkohol atau Fermentasi Asid Laktik.","voiceScript":"[confident] Cabaran ketiga Boss S P M! Asingkan keenam-enam fakta berikut antara Fermentasi Alkohol dengan Fermentasi Asid Laktik.","prompt":"Isihkan fakta berikut kepada jenis fermentasi yang tepat:","buckets":[{"id":"fa","label":"Fermentasi Alkohol (210 kJ)"},{"id":"fl","label":"Fermentasi Asid Laktik (150 kJ)"}],"items":[{"text":"Berlaku dalam sel yis menghasilkan etanol, gas karbon dioksida dan 210 kJ tenaga","bucketId":"fa","note":"Tepat! Gas CO2 menaikkan doh roti dan air kapur menjadi keruh."},{"text":"Berlaku dalam sel pokok padi di kawasan sawah bertakung air kurang oksigen","bucketId":"fa","note":"Betul! Dibantu enzim alkohol dehidrogenase yang banyak."},{"text":"Digunakan dalam penghasilan tapai, bir, wain dan penaikan roti","bucketId":"fa","note":"Tepat! Etanol dan CO2 ialah produk fermentasi alkohol."},{"text":"Berlaku dalam sel otot manusia semasa larian pecut dan hutang oksigen","bucketId":"fl","note":"Betul! Hanya menghasilkan 2 ATP atau 150 kJ tanpa membebaskan CO2."},{"text":"Bakteria Lactobacillus menukar laktosa menjadi asid laktik lalu menggumpalkan kasein","bucketId":"fl","note":"Tepat! Menghasilkan rasa masam dan tekstur yoghurt."},{"text":"Tidak membebaskan gas karbon dioksida dan dioksidakan semula ketika hutang oksigen dibayar","bucketId":"fl","note":"Betul! Asid laktik diangkut ke hati/otot untuk dioksidakan dengan O2."}],"explanation":"Fermentasi alkohol (yis, pokok padi) menghasilkan etanol + CO2 + 210 kJ; fermentasi asid laktik (Lactobacillus, otot manusia) menghasilkan asid laktik + 150 kJ tanpa gas CO2."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Kesan Latihan & Natrium Bikarbonat","voiceCaption":"Padankan empat situasi KBAT atlet, yoghurt, respirometer dan natrium bikarbonat dengan penjelasan saintifiknya.","voiceScript":"[confident] Satu langkah lagi sebelum menamatkan Bab tujuh! Padankan empat situasi Praktis Sumatif berikut dengan penjelasannya.","prompt":"Padankan situasi KBAT respirasi sel berikut dengan penjelasan yang tepat:","pairs":[{"id":"b71","left":"Individu biasa lebih cepat penat berbanding atlet apabila berlari bersama","right":"Atlet mempunyai isi padu jantung/paru-paru dan kecekapan penghantaran O2 lebih tinggi serta toleransi asid laktik lebih baik"},{"id":"b72","left":"Yoghurt rosak masam melampau jika dibiarkan di suhu bilik","right":"Bakteria Lactobacillus terus aktif membiak dan menapai laktosa menghasilkan asid laktik berlebihan"},{"id":"b73","left":"Pengambilan natrium bikarbonat beralkali sebelum acara pecut","right":"Meneutralkan keasidan pengumpulan asid laktik dalam darah/otot supaya keletihan otot ditangguhkan"},{"id":"b74","left":"Persamaan antara glikolisis aerob dengan fermentasi","right":"Kedua-duanya berlaku di sitoplasma menukar 1 glukosa kepada 2 molekul piruvat dan menjana ATP"}],"explanation":"Atlet kurang bergantung pada fermentasi dan menoleransi asid laktik; penyejukan memperlahan function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;
  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");

  if (heartEl) heartEl.textContent = String(notaState.hearts);

    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
