/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab08","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":8,"title":"Sistem Respirasi dalam Manusia dan Haiwan","subtitle":"Subtopik 8.1-8.4 KSSM — Nisbah JLP/I, Struktur Respirasi Serangga (Trakeol), Ikan (Filamen & Lamela), Amfibia (Kulit & Peparu) & Manusia (Alveolus), Mekanisme Pernafasan, Tekanan Separa O2/CO2 (HCO3- 70%, Karbaminohemoglobin 23%, H2CO3 7%) serta COPD (Asma, Bronkitis Kronik, Emfisema).","estimatedMinutes":30,"themeAccent":"#0284c7","isFreePreview":false,"labScript":"biologi-t4-bab08-labs.js","coverIcon":"../assets/icons/bio48-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan struktur respirasi, tekanan separa dan mekanisme pernafasan kamu sangat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Daripada trakeol serangga hingga ion bikarbonat darah, semuanya tepat!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula peranan otot interkosta, diafragma dan tekanan separa gas di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Sistem Respirasi Tingkatan empat Bab lapan berjaya dikuasai!"},"units":[{"id":"bio48-u1","title":"Unit 1: Struktur Respirasi & Penyesuaian Haiwan serta Manusia","subtitle":"Subtopik 8.1 — Nisbah JLP/I, Trakeol Serangga, Filamen & Lamela Ikan, Kulit/Peparu Katak & Alveolus Manusia","iconType":"atom","iconUrl":"../assets/icons/bio48-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Struktur Respirasi 4 Organisma","voiceCaption":"Organisma besar ber-JLP/I kecil memerlukan struktur respirasi khusus yang nipis, lembap, luas permukaannya dan berkapilari darah kecuali serangga.","voiceScript":"[warm] Selamat datang ke Bab lapan, Sistem Respirasi dalam Manusia dan Haiwan! Mengapakah organisma besar tidak boleh bernafas melalui kulit semata-mata seperti Amoeba? Kerana semakin besar organisma, semakin kecil nisbah jumlah luas permukaan per isi padunya! Oleh itu, haiwan dan manusia mempunyai struktur respirasi khusus dengan empat ciri penyesuaian utama: nisbah luas permukaan per isi padu besar, dinding nipis setebal satu sel, permukaan sentiasa lembap dan jaringan kapilari darah padat, kecuali serangga! Serangga menggunakan sistem trakea dan trakeol melalui spirakel; ikan menggunakan filamen dan lamela insang; katak menggunakan kulit nipis lembap semasa rehat dan peparu berlipat semasa aktif; manakala manusia menggunakan berjuta-juta alveolus! Tonton video penerangan sistem respirasi di bawah!","title":"8.1 Penyesuaian Struktur Respirasi Serangga, Ikan, Katak & Manusia","acronym":"T•F•K•A","hook":"Serangga tidak memerlukan kapilari darah untuk mengangkut oksigen kerana jaringan halus trakeol menghantar gas terus ke setiap sel badan!","mediaKey":"bio48_alveolus_respirasi","videoClip":{"src":"../assets/biologi-t4-bab08/video/bio48_video_respirasi_alveolus_narasi.mp4","hasNarration":true,"posterKey":"bio48_alveolus_respirasi","caption":"Penyesuaian struktur respirasi serangga, ikan dan pertukaran gas di alveolus manusia."},"summary":"Semua struktur respirasi berkongsi ciri luas permukaan besar, nipis dan lembap, serta jaringan kapilari darah (kecuali sistem trakeol serangga).","bullets":["4 Ciri Penyesuaian & Serangga vs Ikan: Ciri umum = (1) Nisbah jumlah luas permukaan per isi padu (JLP/I) besar, (2) Struktur nipis setebal satu sel, (3) Permukaan sentiasa lembap melarutkan gas, (4) Jaringan kapilari darah (KECUALI serangga). Serangga = spirakel pada toraks/abdomen -> trakea -> trakeol nipis lembap + kantung udara untuk penerbangan aktif. Ikan = insang berfilamen dengan unjuran nipis leper iaitu LAMELA yang kaya kapilari darah.","Katak (Amfibia) vs Manusia (Jadual 8.1): Katak tidak aktif menggunakan KULIT nipis, telap gas, lembap & berkapilari darah di bawahnya; katak aktif menggunakan PEPARU berpermukaan berlipat, nipis, lembap & berkapilari darah. Manusia menggunakan ALVEOLUS yang berjumlah besar, berdinding setebal satu sel, sentiasa lembap dan dikelilingi jaringan kapilari darah padat."],"labId":"bio48_struktur_mekanisme_lab","labTitle":"Pembanding Struktur & Mekanisme Pernafasan 4 Spesies","labProps":{"tab":"struktur"},"examTip":"Skema S.P.M.: Jika ditanya mengapa serangga tidak perlukan sistem peredaran untuk angkut gas respirasi? Jawab: Udara masuk melalui spirakel ke trakea dan trakeol yang bercabang terus ke sel badan; oksigen meresap terus dari trakeol ke sel!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Struktur Respirasi Haiwan","voiceCaption":"Padankan organisma berikut dengan struktur respirasi dan mekanisme luas permukaannya yang tepat.","voiceScript":"[curious] Uji ingatan Jadual lapan perpuluhan satu kamu! Padankan keempat-empat organisma berikut dengan struktur respirasi tepatnya.","prompt":"Padankan setiap organisma berikut dengan struktur respirasinya:","pairs":[{"id":"sr1","left":"Serangga (Belalang)","right":"Trakeol (bilangan banyak daripada cabang trakea berspirakel, tanpa kapilari darah)"},{"id":"sr2","left":"Ikan","right":"Filamen dan lamela insang yang nipis serta kaya kapilari darah"},{"id":"sr3","left":"Amfibia (Katak)","right":"Kulit luar nipis lembap (ketika tidak aktif) dan peparu berlipat (ketika aktif)"},{"id":"sr4","left":"Manusia","right":"Berjuta-juta alveolus berdinding setebal satu sel dikelilingi kapilari darah"}],"explanation":"Trakeol (serangga), filamen & lamela (ikan), kulit & peparu berlipat (katak), serta alveolus (manusia) memaksimumkan nisbah JLP/I untuk pertukaran gas cekap."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kesan Insang Ikan Koyak","voiceCaption":"Ramalkan nasib seekor ikan jika filamen dan lamela insangnya terkoyak teruk selepas tersangkut pada pukat.","voiceScript":"[curious] Soalan Praktis Formatif lapan perpuluhan satu! Sekiranya filamen dan lamela insang seekor ikan terkoyak selepas tersangkut pada pukat nelayan, apakah kesannya terhadap respirasi ikan tersebut?","hook":"Periksa struktur filamen dan lamela insang pada Pembanding Struktur Respirasi!","scenario":"Seekor ikan mengalami kecederaan serius yang menyebabkan sebahagian besar filamen dan lamela insangnya koyak dan melekat bersama.","prompt":"Apakah kesan kecederaan insang ini terhadap kemandirian ikan tersebut?","options":["Jumlah luas permukaan insang berkurangan dengan drastik; kadar resapan oksigen ke kapilari darah merosot dan ikan boleh mati lemas akibat kekurangan tenaga ATP","Ikan boleh beralih menggunakan kulit bersisik seperti katak untuk bernafas di dalam air","Tekanan separa karbon dioksida dalam air menjadi lebih tinggi daripada oksigen","Spirakel ikan terbuka lebih luas untuk menyedut udara atmosfera"],"correctIndex":0,"proofLabId":"bio48_struktur_mekanisme_lab","proofState":{"tab":"struktur"},"explanation":"Kerosakan filamen dan lamela mengurangkan jumlah luas permukaan untuk pertukaran gas; pengambilan oksigen terjejas lalu respirasi sel gagal menjana ATP mencukupi."}]},{"id":"bio48-u2","title":"Unit 2: Mekanisme Pernafasan Manusia dan Haiwan","subtitle":"Subtopik 8.2 — Tarikan & Hembusan Nafas Manusia (Otot Interkosta & Diafragma), Serangga (Otot Abdomen), Ikan (Operkulum) & Katak (Rongga Bukofaring)","iconType":"graph","iconUrl":"../assets/icons/bio48-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Mekanisme Tarik & Hembus Nafas","voiceCaption":"Pernafasan manusia dan haiwan melibatkan pengecutan dan pengenduran otot khusus untuk mengubah isi padu serta tekanan udara di dalam rongga respirasi.","voiceScript":"[warm] Bagaimana udara atau air dipam keluar masuk ke permukaan respirasi? Semua mekanisme pernafasan berfungsi dengan mengubah isi padu dan tekanan rongga! Pada manusia semasa menarik nafas, otot interkosta luar mengecut manakala otot interkosta dalam mengendur menyebabkan sangkar rusuk bergerak ke atas dan ke luar; serentak itu otot diafragma mengecut dan mendatar ke bawah! Hasilnya, isi padu rongga toraks bertambah, tekanan udara di dalam toraks berkurangan dan tekanan atmosfera luar yang lebih tinggi menolak udara masuk ke peparu! Semasa menghembus nafas pula prosesnya berlawanan: otot interkosta luar mengendur, otot interkosta dalam mengecut, diafragma mengendur melengkung ke atas berbentuk kubah, isi padu toraks berkurang dan udara ditolak keluar!","title":"8.2 Mekanisme Pernafasan Manusia, Ikan, Katak & Serangga","acronym":"L•K•D•T","hook":"Ingat pasangan antagonistik otot interkosta: Tarik nafas -> Interkosta LUAR mengecut, Diafragma mengecut MENDATAR -> Isi padu NAIK, Tekanan TURUN!","summary":"Perubahan isi padu rongga respirasi oleh tindakan otot mewujudkan perbezaan tekanan yang menggerakkan udara atau air ke permukaan pertukaran gas.","bullets":["Manusia (Tarik vs Hembus Nafas): Tarik Nafas — Otot interkosta luar mengecut (dalam mengendur) -> sangkar rusuk naik ke atas & ke luar; otot diafragma mengecut & turun mendatar -> isi padu toraks bertambah, tekanan berkurang -> tekanan atmosfera lebih tinggi menolak udara masuk ke peparu. Hembus Nafas — Otot interkosta luar mengendur (dalam mengecut) -> sangkar rusuk turun ke bawah & ke dalam; otot diafragma mengendur melengkung ke atas membentuk kubah -> isi padu toraks berkurang, tekanan meningkat -> udara ditolak keluar.","Serangga, Ikan & Katak (Jadual 8.2): Serangga — otot abdomen mengendur (tekanan trakea turun -> udara masuk ikut spirakel) & mengecut (tekanan naik -> udara keluar). Ikan — mulut buka, dasar rongga mulut turun, rongga operkulum membesar & bukaan operkulum tutup (tekanan mulut rendah -> air beroksigen masuk); kemudian mulut tutup, dasar mulut naik, otot operkulum mengendur, tekanan mulut lebih tinggi daripada luar -> air mengalir merentasi lamela insang & keluar melalui bukaan operkulum. Katak — rongga bukofaring turun (tarik udara ikut lubang hidung dengan glotis tutup), kemudian glotis buka, lubang hidung tutup & dasar bukofaring naik menolak udara ke peparu; pengecutan peparu & tekanan abdomen menolak udara keluar."],"labId":"bio48_struktur_mekanisme_lab","labTitle":"Simulator Tarik/Hembus Nafas & 4 Haiwan","labProps":{"tab":"mekanisme"},"examTip":"Kesalahan paling kerap dalam Kertas 2: Pelajar lupa menyebut 'otot interkosta luar mengecut manakala otot interkosta dalam mengendur' secara berpasangan (tindakan antagonistik)!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Tarik vs Hembus Nafas Manusia","voiceCaption":"Kelaskan enam peristiwa otot, diafragma dan tekanan toraks berikut kepada Tarik Nafas atau Hembus Nafas manusia.","voiceScript":"[confident] Jom uji ketepatan mekanisme pernafasan manusia kamu! Kelaskan enam kejadian ini antara Tarik Nafas dengan Hembus Nafas.","prompt":"Isihkan peristiwa pernafasan manusia berikut mengikut fasa yang tepat:","buckets":[{"id":"tarik","label":"Tarik Nafas (Inhalasi)"},{"id":"hembus","label":"Hembus Nafas (Ekshalasi)"}],"items":[{"text":"Otot interkosta luar mengecut dan otot interkosta dalam mengendur","bucketId":"tarik","note":"Tepat! Menarik sangkar rusuk ke atas dan ke luar."},{"text":"Otot diafragma mengecut lalu bergerak ke bawah menjadi rata dan mendatar","bucketId":"tarik","note":"Betul! Pengecutan diafragma membesarkan isi padu rongga toraks."},{"text":"Tekanan udara dalam rongga toraks menurun di bawah tekanan atmosfera","bucketId":"tarik","note":"Tepat! Udara dari luar ditolak masuk ke dalam peparu."},{"text":"Otot interkosta luar mengendur dan otot interkosta dalam mengecut","bucketId":"hembus","note":"Betul! Sangkar rusuk bergerak ke bawah dan ke dalam."},{"text":"Otot diafragma mengendur dan melengkung ke atas membentuk kubah","bucketId":"hembus","note":"Tepat! Mengurangkan isi padu rongga toraks."},{"text":"Tekanan udara dalam rongga toraks meningkat melebihi tekanan atmosfera","bucketId":"hembus","note":"Betul! Menolak udara keluar daripada peparu."}],"explanation":"Semasa tarik nafas: interkosta luar & diafragma mengecut (mendatar) -> isi padu naik -> tekanan turun -> udara masuk. Semasa hembus nafas: interkosta luar & diafragma mengendur (melengkung kubah) -> isi padu turun -> tekanan naik -> udara keluar."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Mekanisme Pernafasan Ikan","voiceCaption":"Susun urutan pergerakan mulut dan operkulum ikan untuk mengalirkan air beroksigen merentasi lamela insang.","voiceScript":"[confident] Susun semula empat peringkat mekanisme pengudaraan ikan daripada ketika mulut dibuka hingga air keluar melalui operkulum!","prompt":"Susun urutan mekanisme pernafasan ikan yang betul:","hint":"Mulakan dengan mulut terbuka dan dasar rongga mulut turun untuk menyedut air masuk.","answerTokens":["Mulut buka, dasar mulut turun & bukaan operkulum tutup","Tekanan rongga mulut turun lalu air beroksigen masuk","Mulut tutup & dasar rongga mulut naik mengurangkan isi padu","Tekanan tinggi menolak air merentasi lamela keluar melalui operkulum"],"distractors":["Otot diafragma mengecut mendatar ke bawah","Spirakel terbuka menyedut udara atmosfera"],"explanation":"Ikan bernafas melalui pam bukal dan operkulum: mulut buka/dasar turun (tekanan rendah -> air masuk) diikuti mulut tutup/dasar naik (tekanan tinggi -> air melepasi lamela keluar ikut operkulum)."},{"type":"mcq","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Kerosakan Diafragma Manusia","voiceCaption":"Jelaskan kesan kepada pernafasan individu sekiranya otot diafragmanya gagal berfungsi normal akibat kemalangan.","voiceScript":"[curious] Soalan Praktis Sumatif lapan! Jika otot diafragma seseorang gagal mengecut atau mengendur secara normal akibat kecederaan saraf, apakah kesannya terhadap mekanisme pernafasannya?","prompt":"Diafragma seorang individu tidak lagi berfungsi normal akibat kemalangan. Bagaimanakah keadaan ini menjejaskan mekanisme pernafasannya?","options":["Perubahan isi padu dan tekanan udara dalam rongga toraks menjadi sangat terhad, menyebabkan kesukaran menyedut masuk dan menghembus keluar udara mencukupi","Otot abdomen akan menggantikan fungsi diafragma melalui spirakel kulit","Oksigen meresap terus melalui tulang sangkar rusuk tanpa memerlukan alveolus","Tekanan separa oksigen dalam atmosfera menurun di bawah 160 mm Hg"],"correctIndex":0,"explanation":"Tanpa pengecutan dan pengenduran diafragma, julat perubahan isi padu dan tekanan dalam rongga toraks berkurang dengan ketara sehingga pengudaraan peparu terganggu."}]},{"id":"bio48-u3","title":"Unit 3: Pertukaran Gas & Pengangkutan O2/CO2 dalam Manusia","subtitle":"Subtopik 8.3 — Tekanan Separa (160 mm Hg), Oksihemoglobin, Pengangkutan CO2 (70% HCO3-, 23% Karbaminohemoglobin, 7% H2CO3) & Karbonik Anhidrase","iconType":"formula","iconUrl":"../assets/icons/bio48-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Tekanan Separa & Pengangkutan Gas","voiceCaption":"Pertukaran gas di alveolus dan sel tisu dipacu oleh perbezaan tekanan separa; tujuh puluh peratus karbon dioksida diangkut sebagai ion bikarbonat.","voiceScript":"[warm] Gas respirasi sentiasa meresap menuruni kecerunan tekanan separa daripada kawasan tekanan separa tinggi ke rendah! Di alveolus, tekanan separa oksigen lebih tinggi daripada kapilari peparu, maka oksigen meresap masuk ke eritrosit dan bergabung dengan hemoglobin membentuk oksihemoglobin! Apabila darah tiba di kapilari tisu yang mempunyai tekanan separa oksigen rendah kerana digunakan oleh respirasi sel, oksihemoglobin terurai membebaskan oksigen ke sel badan! Sementara itu, karbon dioksida dari sel badan diangkut melalui tiga cara: tujuh puluh peratus sebagai ion bikarbonat dalam plasma darah dengan bantuan enzim karbonik anhidrase di dalam eritrosit, dua puluh tiga peratus sebagai karbaminohemoglobin bersama hemoglobin, dan tujuh peratus terlarut sebagai asid karbonik!","title":"8.3 Respirasi Luar & Dalam, Oksihemoglobin & 3 Laluan Pengangkutan CO2","acronym":"70•23•7","hook":"Hafal nisbah 70-23-7 untuk pengangkutan CO2: 70% Ion Bikarbonat (HCO3-), 23% Karbaminohemoglobin, 7% Asid Karbonik (H2CO3)!","summary":"Respirasi luar (alveolus-darah) dan respirasi dalam (darah-tisu) berlaku mengikut kecerunan tekanan separa, dengan enzim karbonik anhidrase memangkinkan penukaran CO2 <-> H2CO3 <-> HCO3- + H+.","formula":"CO2 + H2O  <--Karbonik anhidrase-->  H2CO3  <-->  H+ + HCO3-","bullets":["Respirasi Luar (Peparu) & Dalam (Tisu): Tekanan atmosfera = 760 mm Hg (21% O2 -> tekanan separa O2 = 160 mm Hg; CO2 = 0.23 mm Hg). Di peparu: darah masuk dari arteri pulmonari ber-pO2 rendah & ber-pCO2 tinggi -> O2 meresap dari alveolus ke darah membentuk OKSIHEMOGLOBIN (pulih ke vena pulmonari), manakala CO2 meresap ke alveolus untuk dihembus. Di tisu: sel aktif menggunakan O2 dan membebaskan CO2 -> pO2 darah lebih tinggi daripada sel (oksihemoglobin terurai membebaskan O2 ke sel) dan pCO2 sel lebih tinggi (CO2 meresap ke kapilari tisu).","3 Cara Pengangkutan CO2 & Peranan Karbonik Anhidrase: (1) 70% sebagai ion bikarbonat (HCO3-): CO2 + H2O --(enzim karbonik anhidrase dalam eritrosit)--> asid karbonik (H2CO3) -> terurai menjadi HCO3- + H+; HCO3- meresap ke plasma darah ke peparu; di kapilari peparu HCO3- masuk semula ke eritrosit bergabung dengan H+ membentuk H2CO3 lalu terurai kepada CO2 + H2O untuk dihembus! (2) 23% bergabung dengan hemoglobin membentuk karbaminohemoglobin. (3) 7% terlarut sebagai asid karbonik."],"labId":"bio48_pertukaran_copd_lab","labTitle":"Simulator Tekanan Separa, Ion Bikarbonat & COPD","labProps":{"tab":"gas"},"examTip":"Soalan KBAT popular: Mengapakah pendedahan seketika kepada gas KARBON MONOKSIDA (CO) jauh lebih berbahaya daripada CO2? Kerana CO mempunyai afiniti pengikatan dengan hemoglobin yang jauh lebih tinggi daripada O2 membentuk karboksihemoglobin yang stabil, menyekat pengangkutan oksigen ke sel!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Pengangkutan O2 & CO2","voiceCaption":"Padankan bentuk pengangkutan gas respirasi dan enzim dalam eritrosit dengan peratusan atau fungsinya.","voiceScript":"[confident] Uji penguasaan pengangkutan gas darah kamu! Padankan lima komponen darah berikut dengan peranannya.","prompt":"Padankan komponen pengangkutan gas respirasi berikut dengan huraian yang tepat:","pairs":[{"id":"pg1","left":"Oksihemoglobin","right":"Sebatian tidak stabil terhasil di peparu apabila O2 bergabung dengan hemoglobin; terurai di tisu"},{"id":"pg2","left":"Ion bikarbonat (HCO3-)","right":"Bentuk pengangkutan utama karbon dioksida (70%) di dalam plasma darah menuju peparu"},{"id":"pg3","left":"Karbaminohemoglobin","right":"23% karbon dioksida diangkut dengan cara bergabung secara terus dengan hemoglobin"},{"id":"pg4","left":"Enzim karbonik anhidrase","right":"Enzim di dalam eritrosit yang memangkinkan tindak balas berbalik antara CO2 dan H2O membentuk H2CO3"},{"id":"pg5","left":"Asid karbonik (H2CO3) terlarut","right":"Baki 7% karbon dioksida yang terlarut dan diangkut dalam plasma darah"}],"explanation":"Oksigen diangkut sebagai oksihemoglobin; CO2 diangkut 70% sebagai HCO3- (bermangkin karbonik anhidrase dalam eritrosit), 23% karbaminohemoglobin dan 7% terlarut sebagai asid karbonik."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Laluan HCO3- di Kapilari Peparu","voiceCaption":"Ramalkan urutan tindak balas yang berlaku apabila ion bikarbonat (HCO3-) dari plasma darah tiba di kapilari peparu.","voiceScript":"[curious] Cuba ramalkan tindak balas yang berlaku sebaik sahaja darah berion bikarbonat tiba di kapilari peparu! Bagaimanakah karbon dioksida dibebaskan semula ke dalam alveolus?","hook":"Saksikan animasi arah tindak balas karbonik anhidrase di peparu pada Makmal Gas & COPD!","scenario":"Darah dari vena kava tiba di arteri pulmonari dan memasuki jaringan kapilari yang mengelilingi alveolus peparu.","prompt":"Bagaimanakah ion bikarbonat (HCO3-) daripada plasma darah ditukar semula menjadi gas CO2 untuk dihembus?","options":["HCO3- meresap masuk ke dalam eritrosit, bergabung dengan ion H+ membentuk asid karbonik (H2CO3), lalu terurai kepada CO2 dan air sebelum CO2 meresap ke alveolus","HCO3- bergabung terus dengan gas oksigen membentuk oksihemoglobin yang keluar melalui hidung","Karbonik anhidrase menukarkan HCO3- menjadi glukosa di dalam alveolus","Ion bikarbonat kekal di dalam plasma darah dan diangkut semula ke jantung kiri"],"correctIndex":0,"proofLabId":"bio48_pertukaran_copd_lab","proofState":{"tab":"gas"},"explanation":"Di kapilari peparu, tindak balas berbalik berlaku: HCO3- masuk ke eritrosit -> bergabung dengan H+ membentuk H2CO3 -> terurai kepada CO2 + H2O -> CO2 meresap ke alveolus."}]},{"id":"bio48-u4","title":"Unit 4: Isu Kesihatan Sistem Respirasi (COPD)","subtitle":"Subtopik 8.4 — Penyakit Pulmonari Obstruktif Kronik (COPD): Asma, Bronkitis Kronik & Emfisema serta Kesan Asap Rokok","iconType":"book","iconUrl":"../assets/icons/bio48-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"3 Penyakit COPD & Kesan Rokok","voiceCaption":"Penyakit Pulmonari Obstruktif Kronik atau COPD terdiri daripada asma, bronkitis kronik dan emfisema yang menjejaskan laluan udara serta kecekapan pertukaran gas.","voiceScript":"[warm] Apakah yang berlaku kepada peparu perokok tegar atau penghidap alergi saluran pernafasan? Mereka berisiko mengalami C O P D iaitu Penyakit Pulmonari Obstruktif Kronik yang merangkumi asma, bronkitis kronik dan emfisema! Bagi pesakit asma, dinding bronkiol menjadi bengkak dan tebal sehingga bukaan tiub bronkiol mengecil dan menyempitkan laluan udara! Bagi bronkitis kronik, bronkiol meradang, membengkak dan tersumbat dengan mukus berlebihan serta silium rosak menyebabkan batuk berterusan! Bagi emfisema pula, alveolus kehilangan kekenyalan, membesar dan dindingnya rosak lalu mengurangkan jumlah luas permukaan untuk pertukaran gas!","title":"8.4 Penyakit Pulmonari Obstruktif Kronik (COPD): Asma, Bronkitis Kronik & Emfisema","acronym":"A•B•E","hook":"Asma menyempitkan bronkiol, Bronkitis Kronik menyumbatkan bronkiol dengan mukus & silia rosak, manakala Emfisema merobekkan dinding alveolus!","summary":"Ketiga-tiga penyakit COPD (asma, bronkitis kronik dan emfisema) mengurangkan aliran udara atau luas permukaan pertukaran gas, mencetuskan sesak nafas dan hipoksia.","bullets":["3 Penyakit COPD: (1) Asma — dinding bronkiol menjadi bengkak dan tebal, bukaan tiub bronkiol mengecil & laluan udara sempit menyebabkan sesak nafas (inhaler membantu mengendurkan otot bronkiol supaya laluan udara terbuka semula); (2) Bronkitis Kronik — bronkiol meradang, bengkak dan tersumbat; penghasilan mukus yang banyak mencetuskan batuk berterusan manakala silium yang rosak menyukarkan penyingkiran mukus; (3) Emfisema — alveolus hilang kekenyalan dan saiznya membesar; dinding alveolus rosak mengurangkan jumlah luas permukaan alveolus sehingga pertukaran gas menjadi kurang cekap.","Kesan Tar Rokok & Hemoglobin Janin: Tar dalam asap rokok menghitamkan tisu peparu, memusnahkan silium pada epitelium trakea dan merupakan karsinogen penyebab kanser peparu. (Nota Tambahan Buku Teks: Hemoglobin janin mempunyai peratus ketepuan oksigen lebih tinggi daripada hemoglobin dewasa agar dapat menarik oksigen daripada darah ibu merentasi plasenta)."],"labId":"bio48_pertukaran_copd_lab","labTitle":"Klinik Maya COPD (Asma, Bronkitis & Emfisema)","labProps":{"tab":"copd"},"examTip":"Bezakan tepat 2 sasaran COPD: Asma & Bronkitis Kronik menyerang BRONKIOL (penyempitan & sumbatan mukus); Emfisema merosakkan ALVEOLUS (hilang kekenyalan & luas permukaan berkurang)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih 3 Penyakit COPD","voiceCaption":"Kelaskan enam simptom dan kerosakan struktur berikut kepada Asma, Bronkitis Kronik atau Emfisema.","voiceScript":"[confident] Kelaskan keenam-enam ciri patologi ini mengikut penyakit C O P D yang tepat: Asma, Bronkitis Kronik atau Emfisema!","prompt":"Isihkan ciri penyakit berikut kepada kategori COPD yang betul:","buckets":[{"id":"asm","label":"Asma"},{"id":"brn","label":"Bronkitis Kronik"},{"id":"emf","label":"Emfisema"}],"items":[{"text":"Dinding bronkiol bengkak dan tebal menyebabkan bukaan laluan udara menjadi sempit","bucketId":"asm","note":"Tepat! Penyempitan bronkiol menyukarkan aliran udara masuk dan keluar."},{"text":"Penggunaan inhaler melegakan sesak nafas dengan membuka semula tiub bronkiol","bucketId":"asm","note":"Betul! Ubat sedut (inhaler) mengendurkan otot dinding bronkiol."},{"text":"Bronkiol meradang dan tersumbat dengan mukus berlebihan yang menyebabkan batuk berterusan","bucketId":"brn","note":"Tepat! Ciri klasik bronkitis kronik."},{"text":"Silium rosak menyebabkan pesakit sukar menyingkirkan mukus daripada saluran pernafasan","bucketId":"brn","note":"Betul! Tar asap rokok merosakkan silium pada trakea dan bronkiol."},{"text":"Alveolus kehilangan kekenyalan dan mengembang sehingga dindingnya rosak","bucketId":"emf","note":"Tepat! Kekenyalan alveolus musnah menyebabkan udara terperangkap."},{"text":"Jumlah luas permukaan alveolus menurun menyebabkan kecekapan pertukaran gas merosot","bucketId":"emf","note":"Betul! Luas permukaan pertukaran gas berkurang dengan teruk dalam emfisema."}],"explanation":"Asma menyempitkan dinding bronkiol; Bronkitis kronik meradangkan bronkiol dengan mukus banyak & silium rosak; Emfisema merosakkan kekenyalan dan dinding alveolus."},{"type":"mcq","xp":15,"voiceIdKey":"u4-s3","voiceToneLabel":"Kesan Asap Rokok & Tar","voiceCaption":"Kenal pasti akibat kerosakan silium oleh tar rokok serta mekanisme tindakan inhaler bagi pesakit asma.","voiceScript":"[confident] Mengapakah seorang perokok tegar sering mengalami batuk berpanjangan dan berisiko tinggi menghidap kanser peparu?","prompt":"Apakah kesan utama tar yang terkandung dalam asap rokok terhadap sistem respirasi perokok?","options":["Tar memusnahkan silium pada epitelium saluran pernafasan (menyebabkan mukus dan habuk gagal disapu keluar -> batuk berterusan) serta bertindak sebagai karsinogen penyebab kanser peparu","Tar menambahkan keanjalan dinding alveolus supaya lebih banyak O2 meresap","Tar menukarkan oksihemoglobin kepada ion bikarbonat dalam eritrosit","Tar menaikkan pH darah supaya bronkiol terbuka luas"],"correctIndex":0,"explanation":"Tar dalam asap rokok memusnahkan silium (menyebabkan pengumpulan mukus dan batuk kronik) serta mengandungi bahan karsinogen yang mencetuskan kanser peparu."}]},{"id":"bio48-u5","title":"Cabaran Boss SPM: Sistem Respirasi","subtitle":"Sintesis KBAT Kertas 1 & 2 — Kecekapan Manusia vs Ikan, Amfibia vs Manusia, Pengiraan Tekanan Separa & Petunjuk Pencemaran Udara","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Katak Sebagai Bio-Petunjuk","voiceCaption":"Kenal pasti organisma terbaik sebagai petunjuk pencemaran udara dan jelaskan sebabnya daripada sifat struktur respirasinya.","voiceScript":"[excited] Cabaran Boss S P M Bab lapan bermula! Soalan Pengayaan Praktis Sumatif: jika anda seorang saintis yang ingin memilih haiwan sebagai petunjuk tahap pencemaran udara sesuatu kawasan, haiwan manakah paling sesuai?","prompt":"Jika anda seorang saintis yang memilih haiwan sebagai petunjuk (bio-indikator) tahap pencemaran di sesuatu kawasan, haiwan manakah paling sesuai dan mengapa?","options":["Katak (amfibia) — mempunyai kulit yang sangat nipis, lembap dan telap terhadap gas serta bahan terlarut, maka ia amat sensitif terhadap bahan pencemar udara dan air","Belalang — kerana mempunyai spirakel yang kalis terhadap semua gas kimia","Ikan paus — kerana bernafas menggunakan insang di dasar lautan","Ikan bertulang — kerana sisik keras melindungi keseluruhan badannya daripada air"],"correctIndex":0,"explanation":"Katak menggunakan kulit luar yang nipis, lembap dan sangat telap untuk pertukaran gas dan penyerapan air, menjadikannya amat peka terhadap bahan pencemar persekitaran."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Kadar O2 Manusia vs Ikan","voiceCaption":"Ramalkan dua sebab mengapa kadar bekalan oksigen ke sel badan manusia lebih pantas berbanding sel ikan pada saiz badan yang sama.","voiceScript":"[curious] Soalan Praktis Sumatif lapan! Mengapakah kadar pembekalan oksigen kepada sel badan manusia jauh lebih pantas berbanding sel ikan jika kedua-duanya bersaiz sama?","hook":"Bandingkan kepekatan oksigen udara berbanding air serta sistem peredaran di Klinik Gas & COPD!","scenario":"Manusia (bernafas udara dengan peparu dan peredaran ganda dua) dibandingkan dengan ikan (bernafas air dengan insang dan peredaran tunggal) pada jisim badan setara.","prompt":"Apakah dua sebab utama kadar bekalan oksigen ke sel manusia lebih pantas daripada ikan?","options":["Kepekatan oksigen dalam udara (~21%) jauh lebih tinggi daripada oksigen terlarut dalam air serta resapan gas dalam udara lebih pantas; manusia juga mempunyai peredaran ganda dua bertekanan tinggi berbanding peredaran tunggal ikan","Manusia bernafas menggunakan trakeol terus ke sel manakala ikan tiada hemoglobin","Alveolus manusia lebih tebal daripada lamela insang dan mengandungi kloroplas","Ikan tidak mempunyai tekanan separa O2 dalam kapilari insangnya"],"correctIndex":0,"proofLabId":"bio48_pertukaran_copd_lab","proofState":{"tab":"gas"},"explanation":"Udara mengandungi kepekatan O2 jauh lebih tinggi dan kadar resapan lebih cepat berbanding air; tambahan pula peredaran ganda dua manusia mengepam darah beroksigen pada tekanan lebih tinggi."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Respirasi Luar vs Dalam","voiceCaption":"Kelaskan enam peristiwa pertukaran gas berikut kepada Respirasi Luar (Alveolus-Darah) atau Respirasi Dalam (Darah-Tisu).","voiceScript":"[confident] Cabaran ketiga Boss S P M! Bezakan proses yang berlaku semasa Respirasi Luar di peparu dengan Respirasi Dalam di tisu badan.","prompt":"Isihkan peristiwa pertukaran gas berikut kepada Respirasi Luar atau Respirasi Dalam:","buckets":[{"id":"luar","label":"Respirasi Luar (Alveolus <-> Darah)"},{"id":"dalam","label":"Respirasi Dalam (Darah <-> Tisu)"}],"items":[{"text":"pO2 alveolus lebih tinggi daripada kapilari peparu; O2 meresap masuk membentuk oksihemoglobin","bucketId":"luar","note":"Tepat! Oksihemoglobin terbentuk dalam eritrosit kapilari peparu."},{"text":"HCO3- bergabung semula dengan H+ membentuk H2CO3 dan terurai menjadi CO2 yang dihembus","bucketId":"luar","note":"Betul! Berlaku di kapilari peparu untuk menyingkirkan CO2."},{"text":"Darah meninggalkan peparu melalui vena pulmonari dengan pO2 tinggi dan pCO2 rendah","bucketId":"luar","note":"Tepat! Vena pulmonari membawa darah beroksigen ke atrium kiri jantung."},{"text":"Oksihemoglobin terurai dan O2 meresap keluar daripada kapilari tisu ke sel badan","bucketId":"dalam","note":"Betul! Sel aktif ber-pO2 rendah kerana menggunakan O2 untuk respirasi sel."},{"text":"CO2 daripada respirasi sel meresap ke dalam kapilari tisu dan ditukar menjadi H2CO3 -> H+ + HCO3-","bucketId":"dalam","note":"Tepat! Dimangkinkan oleh enzim karbonik anhidrase di tisu."},{"text":"pCO2 dalam sel badan lebih tinggi daripada kapilari tisu","bucketId":"dalam","note":"Betul! Mewujudkan kecerunan tekanan separa keluar dari sel tisu."}],"explanation":"Respirasi luar menukarkan gas antara alveolus dan kapilari peparu (bentuk oksihemoglobin & hembus CO2); respirasi dalam menukarkan gas antara kapilari tisu dan sel badan (urai oksihemoglobin & serap CO2)."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Perbandingan Mekanisme & Penyakit","voiceCaption":"Padankan empat kes respirasi manusia dan haiwan berikut dengan penjelasan tepatnya.","voiceScript":"[confident] Satu langkah lagi menuju kejayaan penuh Bab lapan! Padankan keempat-empat soalan sintesis berikut dengan jawapan tepatnya.","prompt":"Padankan situasi respirasi berikut dengan penjelasannya:","pairs":[{"id":"b81","left":"Mengapa ikan paus di laut perlu naik ke permukaan air","right":"Paus ialah mamalia berpeparu (tiada insang), jadi ia perlu menyedut udara atmosfera di permukaan melalui lubang sembur"},{"id":"b82","left":"Emfisema mengurangkan kecekapan pertukaran gas","right":"Dinding alveolus rosak dan hilang kekenyalan, mengecilkan jumlah luas permukaan untuk resapan gas"},{"id":"b83","left":"Nilai tekanan separa O2 pada aras laut (760 mm Hg, 21% O2)","right":"0.21 x 760 mm Hg = 160 mm Hg"},{"id":"b84","left":"Mengapa peparu amfibia kurang cekap berbanding peparu manusia","right":"Permukaan dalaman peparu amfibia kurang berlipat dan tiada berjuta-juta alveolus seperti manusia"}],"explanation":"Paus bernafas melalui peparu; emfisema merosakkan dinding alveolus; pO2 atmosfera = 160 mm Hg; dan peparu katak mempunyai luas permukaan lebih kecil daripada alveolus manusia."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Alveolus vs Trakeol","voiceCaption":"Bandingkan persamaan dan perbezaan antara sistem respirasi manusia dengan belalang.","voiceScript":"[excited] Soalan penutup Boss S P M Bab lapan! Nyatakan persamaan dan perbezaan yang paling tepat antara sistem respirasi manusia dengan belalang.","prompt":"Manakah perbandingan yang 100% tepat antara sistem respirasi manusia dengan sistem respirasi belalang?","options":["Persamaan: Kedua-duanya mempunyai permukaan nipis, lembap dan nisbah JLP/I besar; Perbezaan: Alveolus manusia dikelilingi jaringan kapilari darah menggunakan mekanisme otot interkosta/diafragma, manakala trakeol belalang tiada kapilari darah dan dibantu otot abdomen melalui spirakel","Persamaan: Kedua-duanya menggunakan hemoglobin untuk mengangkut gas; Perbezaan: Belalang bernafas melalui in function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");

  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);

    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }

function renderActiveStep(skipViewTransition) {

    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);

    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
