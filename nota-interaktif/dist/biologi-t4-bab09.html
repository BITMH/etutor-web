/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab09","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":9,"title":"Nutrisi dan Sistem Pencernaan Manusia","subtitle":"Subtopik 9.1-9.7 KSSM — Pencernaan Fizikal/Kimia (Mulut, Perut, Duodenum, Ileum & Aktiviti 9.1-9.3), Penyerapan Vilus & Lakteal, Asimilasi Hati & Sel, Penyahtinjaan Usus Besar, Gizi Seimbang (Nilai Tenaga & DCPIP Vitamin C) serta Pintasan Gaster & Isu Pemakanan.","estimatedMinutes":35,"themeAccent":"#d97706","isFreePreview":false,"labScript":"biologi-t4-bab09-labs.js","coverIcon":"../assets/icons/bio49-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan enzim pencernaan, penyerapan vilus dan asimilasi hati kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! Daripada pepsinogen perut hingga pengiraan vitamin C D C P I P, semuanya tepat!","encourage":"[softly] Hampir kena... jangan risau! [warm] Semak semula enzim di mulut, perut, duodenum, ileum serta peranan vena portal hepar di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Nutrisi dan Sistem Pencernaan Manusia berjaya dikuasai!"},"units":[{"id":"bio49-u1","title":"Unit 1: Sistem Pencernaan (Mulut, Perut, Duodenum & Ileum)","subtitle":"Subtopik 9.1 & 9.2 — Pencernaan Fizikal/Kimia, Amilase Liur, Pepsinogen/HCl/Mukus Perut, Hempedu/Pankreas Duodenum & Enzim Ileum","iconType":"atom","iconUrl":"../assets/icons/bio49-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pencernaan Mulut & Perut","voiceCaption":"Pencernaan bermula di mulut oleh amilase air liur (pH 6.5-7.5) dan diteruskan di perut oleh asid hidroklorik serta pepsin (pH 1.5-2.0).","voiceScript":"[warm] Selamat datang ke Bab sembilan, Nutrisi dan Sistem Pencernaan Manusia! Salur alimentari manusia bermula dari mulut hingga ke dubur dibantu oleh hati, pundi hempedu dan pankreas! Pencernaan fizikal melibatkan pengunyahan dan peristalsis, manakala pencernaan kimia melibatkan tindakan hidrolisis oleh enzim! Di mulut, kelenjar liur merembeskan amilase air liur pada p H enam perpuluhan lima hingga tujuh perpuluhan lima untuk menghidrolisiskan kanji kepada maltosa! Bolus ditelan melepasi epiglotis lalu ditolak oleh peristalsis esofagus ke perut! Di dinding perut, sel utama merembeskan pepsinogen tak aktif, sel parietal merembeskan asid hidroklorik untuk mengaktifkan pepsinogen menjadi pepsin serta membunuh bakteria, dan sel mukus merembeskan mukus pelindung dinding perut sehingga kim terbentuk!","title":"9.1-9.2 Pencernaan Fizikal/Kimia di Mulut & Perut","acronym":"M•P•H•K","hook":"Pepsin dirembeskan dalam bentuk tak aktif (pepsinogen) supaya ia tidak mencerna sel perut sendiri sebelum bertemu asid hidroklorik!","summary":"Pencernaan fizikal (mengunyah & peristalsis) menambah luas permukaan untuk pencernaan kimia oleh amilase air liur di mulut dan pepsin di perut.","bullets":["Pencernaan Mulut & Esofagus: Pencernaan fizikal (pengunyahan & peristalsis) vs kimia (enzim hidrolisis). Kelenjar liur merembes air liur (pH 6.5-7.5) mengandungi amilase air liur (kanji + air -> maltosa). Epiglotis menutup bukaan trakea semasa menelan; peristalsis (pengecutan dan pengenduran berirama otot dinding salur) menolak bolus ke perut.","Kelenjar Gaster Perut (3 Jenis Sel Epitelium): Sel utama (rembes pepsinogen tak aktif), Sel parietal (rembes asid hidroklorik HCl: sediakan medium pH 1.5-2.0 untuk pepsin, hentikan tindakan amilase air liur, bunuh bakteria dalam makanan), dan Sel mukus/goblet (rembes mukus melindungi dinding perut daripada hakisan HCl & pepsin). HCl mengaktifkan pepsinogen -> pepsin (protein + air -> polipeptida). Pengadukan membentuk separa cecair iaitu KIM."],"labId":"bio49_pencernaan_enzim_lab","labTitle":"Simulator Salur Pencernaan & Enzim Mulut-Ileum","labProps":{"organ":"perut"},"examTip":"Skema S.P.M.: Hafal tepat ketiga-tiga sel kelenjar gaster perut beserta rembesannya: Sel utama -> Pepsinogen; Sel parietal -> Asid hidroklorik; Sel mukus -> Mukus."},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Sel Perut & Enzim","voiceCaption":"Padankan lima komponen pencernaan mulut dan perut berikut dengan fungsi tepatnya.","voiceScript":"[curious] Mari uji ingatan kamu tentang pencernaan di mulut dan perut! Padankan lima komponen berikut dengan tugas tepatnya.","prompt":"Padankan struktur dan bahan pencernaan berikut dengan fungsinya:","pairs":[{"id":"dg1","left":"Amilase air liur (pH 6.5-7.5)","right":"Menghidrolisiskan kanji kepada maltosa di dalam rongga mulut"},{"id":"dg2","left":"Sel utama kelenjar gaster","right":"Merembeskan enzim tidak aktif pepsinogen ke dalam perut"},{"id":"dg3","left":"Sel parietal (Asid hidroklorik)","right":"Mengaktifkan pepsinogen -> pepsin (pH 1.5-2.0), membunuh bakteria & menghentikan amilase"},{"id":"dg4","left":"Sel mukus / goblet perut","right":"Merembeskan mukus melindungi dinding perut daripada hakisan asid dan enzim"},{"id":"dg5","left":"Epiglotis","right":"Menutup bukaan trakea semasa menelan agar bolus tidak memasuki saluran pernafasan"}],"explanation":"Amilase mulut mencerna kanji; sel utama (pepsinogen), sel parietal (HCl) dan sel mukus (mukus) bekerjasama di perut; epiglotis melindungi trakea."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Duodenum, Hempedu & Ileum","voiceCaption":"Di duodenum, hempedu mengemulsikan lipid dan jus pankreas mencerna kanji, polipeptida serta lipid, sebelum disempurnakan oleh enzim jus usus di ileum.","voiceScript":"[warm] Apabila kim berasid memasuki duodenum, dua organ pembantu bertindak serentak! Hati menghasilkan hempedu yang disimpan di pundi hempedu lalu dialirkan untuk meneutralkan kim berasid, menyediakan medium beralkali p H tujuh perpuluhan enam hingga lapan perpuluhan enam serta mengemulsikan lipid kepada titisan kecil bagi meluaskan luas permukaan tindakan lipase! Pankreas pula merembeskan amilase pankreas, tripsin dan lipase! Seterusnya di ileum, jus usus mengandungi maltase, sukrase, laktase, lipase dan erepsin yang melengkapkan hidrolisis menjadi monosakarida, asid lemak, gliserol dan asid amino! Tonton video penerangan pencernaan dan penyerapan di bawah!","title":"Pencernaan Lengkap di Duodenum & Ileum serta Aktiviti 9.1-9.3","acronym":"M•S•L•L•E","hook":"Hempedu BUKAN enzim — ia melakukan pengemulsian fizikal lemak agar lipase mampu memecahkan titisan lemak dengan lebih pantas!","mediaKey":"bio49_pencernaan_vilus","videoClip":{"src":"../assets/biologi-t4-bab09/video/bio49_video_pencernaan_vilus_narasi.mp4","hasNarration":true,"posterKey":"bio49_pencernaan_vilus","caption":"Tindakan enzim pencernaan dan penyerapan nutrien di vilus usus kecil."},"summary":"Duodenum (hempedu + jus pankreas) dan ileum (jus usus: maltase, sukrase, laktase, lipase, erepsin) melengkapkan pencernaan semua makromolekul makanan.","bullets":["Duodenum (Hempedu & Jus Pankreas): Hati menghasilkan HEMPEDU (disimpan di pundi hempedu) untuk meneutralkan kim berasid, menyediakan medium alkali (pH 7.6-8.6) dan mengemulsikan lipid menjadi titisan halus. Pankreas merembeskan: Amilase pankreas (kanji -> maltosa), Tripsin (polipeptida -> peptida) dan Lipase (lipid -> asid lemak + gliserol).","Ileum (Jus Usus) & Aktiviti 9.3 (Lipase): Ileum merembeskan mukus dan jus usus beralkali: Maltase (maltosa -> glukosa), Sukrase (sukrosa -> glukosa + fruktosa), Laktase (laktosa -> glukosa + galaktosa), Lipase (lipid -> asid lemak + gliserol) dan Erepsin (peptida -> asid amino). Dalam Aktiviti 9.3 (minyak masak + Na2CO3 + cecair pencuci pinggan + fenolftalein + lipase), warna merah jambu fenolftalein bertukar tidak berwarna kerana asid lemak terhasil menurunkan pH."],"labId":"bio49_pencernaan_enzim_lab","labTitle":"Peta Enzim Duodenum, Ileum & Ujian Fenolftalein","labProps":{"organ":"ileum"},"examTip":"Dalam Aktiviti 9.3, apakah fungsi CECAIR PENCUCI PINGGAN? Mengemulsikan minyak masak menjadi titisan halus (menyerupai peranan garam hempedu) supaya luas permukaan untuk tindakan lipase meningkat!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Isih Enzim Pankreas vs Ileum","voiceCaption":"Kelaskan enam enzim dan rembesan berikut kepada rembesan Pankreas & Hati (Duodenum) atau Jus Usus (Ileum).","voiceScript":"[confident] Jom kelaskan keenam-enam rembesan pencernaan usus kecil ini mengikut tapak rembesannya: Pankreas & Hati atau Kelenjar Dinding Ileum!","prompt":"Isihkan enzim dan bahan berikut mengikut sumber rembesannya:","buckets":[{"id":"pd","label":"Pankreas & Hati (ke Duodenum)"},{"id":"il","label":"Kelenjar Dinding Ileum"}],"items":[{"text":"Hempedu — meneutralkan kim berasid dan mengemulsikan lipid menjadi titisan halus","bucketId":"pd","note":"Tepat! Dihasilkan oleh hati dan disimpan di dalam pundi hempedu."},{"text":"Tripsin — menghidrolisiskan polipeptida menjadi peptida pendek","bucketId":"pd","note":"Betul! Tripsin dirembeskan oleh pankreas ke dalam duodenum."},{"text":"Amilase pankreas — menghidrolisiskan kanji yang masih berbaki kepada maltosa","bucketId":"pd","note":"Tepat! Amilase pankreas bertindak dalam medium alkali duodenum."},{"text":"Erepsin — menghidrolisiskan peptida menjadi asid amino","bucketId":"il","note":"Betul! Erepsin dalam jus usus ileum melengkapkan pencernaan protein."},{"text":"Maltase, Sukrase dan Laktase — mencerna disakarida kepada monosakarida","bucketId":"il","note":"Tepat! Ketiga-tiga enzim karbohidrat akhir ini dirembes di ileum."},{"text":"Lipase jus usus — menyempurnakan hidrolisis lipid kepada asid lemak dan gliserol","bucketId":"il","note":"Betul! Lipase dirembes di pankreas dan juga di dalam jus usus ileum."}],"explanation":"Hati (hempedu) dan pankreas (amilase pankreas, tripsin, lipase) merembes ke duodenum; dinding ileum merembeskan maltase, sukrase, laktase, lipase dan erepsin."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Aktiviti 9.3 & Intoleransi Laktosa","voiceCaption":"Ramalkan mengapa sesetengah individu mengalami cirit-birit apabila minum susu serta perubahan warna penunjuk fenolftalein dalam ujian lipase.","voiceScript":"[curious] Soalan Praktis Sumatif sembilan! Mengapakah sesetengah orang mengalami perut kembung dan cirit-birit selepas meminum susu segar?","hook":"Uji tindak balas lipase dan ujian laktase pada Simulator Salur Pencernaan!","scenario":"Seorang murid meminum segelas susu lembu lalu mengalami kekejangan perut, kembung gas dan cirit-birit.","prompt":"Apakah punca biokimia masalah pencernaan tersebut?","options":["Kekurangan enzim laktase dalam jus usus ileum menyebabkan laktosa gagal dicerna menjadi glukosa dan galaktosa, lalu laktosa ditapai bakteria usus menghasilkan gas dan menarik air secara osmosis","Perut merembeskan terlalu banyak amilase air liur sehingga susu menggumpal","Hati gagal menghasilkan hempedu untuk menghidrolisiskan laktosa","Erepsin menukarkan protein susu menjadi asid lemak secara berlebihan"],"correctIndex":0,"proofLabId":"bio49_pencernaan_enzim_lab","proofState":{"organ":"ileum"},"explanation":"Kekurangan enzim laktase di ileum menyebabkan laktosa tidak tercerna; ia menarik air ke dalam lumen usus secara osmosis (cirit-birit) dan ditapai oleh bakteria usus menghasilkan gas (perut kembung)."}]},{"id":"bio49-u2","title":"Unit 2: Penyerapan di Vilus Ileum","subtitle":"Subtopik 9.3 — Penyesuaian Ileum, Vilus (Epitelium 1 Sel, Sel Goblet, Kapilari Darah, Lakteal & Mikrovilus) serta Jadual 9.1 Kaedah Penyerapan","iconType":"graph","iconUrl":"../assets/icons/bio49-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Struktur Vilus & Kaedah Penyerapan","voiceCaption":"Ileum panjang berlipat dengan jutaan vilus dan mikrovilus yang nipis setebal satu sel, lengkap dengan kapilari darah bagi nutrien larut air serta lakteal bagi nutrien larut lipid.","voiceScript":"[warm] Molekul ringkas hasil pencernaan kini diserap di ileum! Mengapakah ileum sangat cekap menyerap nutrien? Kerana ileum sangat panjang, lapisan dalamnya berlipat serta diliputi jutaan unjuran vilus yang mempunyai unjuran halus mikrovilus pada permukaan sel epitelium untuk memaksimumkan luas permukaan! Lapisan epitelium vilus hanya setebal satu sel bagi mempercepatkan penyerapan! Kapilari darah di dalam vilus mengangkut glukosa, galaktosa dan asid amino melalui pengangkutan aktif, fruktosa melalui resapan berbantu, air melalui osmosis serta vitamin B dan C! Lakteal pula mengangkut titisan lipid hasil penyatuan semula asid lemak dan gliserol serta vitamin A, D, E dan K yang meresap masuk secara resapan ringkas!","title":"9.3 Penyesuaian Vilus, Mikrovilus & Jadual 9.1 Kaedah Penyerapan","acronym":"E•G•K•L•M","hook":"Asid lemak dan gliserol meresap masuk ke sel epitelium secara resapan ringkas, bergabung SEMULA menjadi titisan lipid kecil lalu memasuki LAKTEAL — bukan kapilari darah!","summary":"Struktur ileum, vilus dan mikrovilus mengoptimumkan penyerapan melalui pengangkutan aktif, resapan berbantu, osmosis dan resapan ringkas ke kapilari darah atau lakteal.","bullets":["Penyesuaian Ileum, Vilus & Mikrovilus: Ileum panjang, lapisan dalam berlipat, diliputi unjuran VILUS dan MIKROVILUS (luas permukaan sangat besar); epitelium setebal SATU sel; sel goblet merembes mukus; jaringan kapilari darah angkut nutrien larut air; lakteal (kapilari limfa) angkut titisan asid lemak/gliserol; kelenjar usus merembes jus usus.","Jadual 9.1 Laluan & Kaedah Penyerapan: Ke KAPILARI DARAH — Fruktosa (Resapan berbantu), Glukosa & Galaktosa (Pengangkutan aktif), Asid amino (Pengangkutan aktif), Vitamin B & C (diserap bersama air), Air (Osmosis). Ke LAKTEAL — Asid lemak & gliserol bergabung semula melalui kondensasi membentuk titisan lipid halus dalam sel epitelium -> lakteal (Resapan ringkas), Vitamin A, D, E, K larut lipid (Resapan ringkas)."],"labId":"bio49_vilus_asimilasi_lab","labTitle":"Peneroka Struktur Vilus & Laluan Asimilasi Hati","labProps":{"tab":"vilus"},"examTip":"Wajib ingat Jadual 9.1: Glukosa, Galaktosa & Asid Amino -> Pengangkutan Aktif (Kapilari Darah); Fruktosa -> Resapan Berbantu (Kapilari Darah); Asid Lemak, Gliserol & Vitamin A,D,E,K -> Resapan Ringkas (Lakteal)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Laluan Kapilari Darah vs Lakteal","voiceCaption":"Kelaskan enam nutrien berikut sama ada diserap ke dalam Kapilari Darah atau ke dalam Lakteal di dalam vilus.","voiceScript":"[confident] Jom uji penguasaan Jadual sembilan perpuluhan satu! Kelaskan keenam-enam nutrien tercerna ini mengikut saluran penyerapannya di dalam vilus.","prompt":"Kelaskan nutrien berikut mengikut struktur pengangkutnya di dalam vilus:","buckets":[{"id":"darah","label":"Ke Kapilari Darah (Vena Portal Hepar)"},{"id":"lak","label":"Ke Lakteal (Sistem Limfa)"}],"items":[{"text":"Glukosa dan galaktosa yang diserap melalui pengangkutan aktif","bucketId":"darah","note":"Tepat! Monosakarida larut air masuk ke kapilari darah vilus."},{"text":"Asid amino yang diserap melalui pengangkutan aktif","bucketId":"darah","note":"Betul! Asid amino diangkut ke hati melalui vena portal hepar."},{"text":"Fruktosa yang diserap melalui resapan berbantu","bucketId":"darah","note":"Tepat! Fruktosa masuk ke kapilari darah tanpa memerlukan ATP."},{"text":"Vitamin B dan C serta air melalui osmosis","bucketId":"darah","note":"Betul! Vitamin larut air diserap bersama air ke dalam kapilari darah."},{"text":"Asid lemak dan gliserol yang berkondensasi semula membentuk titisan lipid","bucketId":"lak","note":"Tepat! Titisan lipid masuk ke lakteal vilus melalui resapan ringkas."},{"text":"Vitamin A, D, E dan K yang larut dalam lipid","bucketId":"lak","note":"Betul! Vitamin larut lemak diserap bersama titisan lipid ke dalam lakteal."}],"explanation":"Nutrien larut air (glukosa, galaktosa, fruktosa, asid amino, vitamin B/C, air) masuk ke kapilari darah; bahan larut lipid (titisan asid lemak + gliserol, vitamin A/D/E/K) masuk ke lakteal."},{"type":"match","xp":15,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Penyesuaian Vilus & Ileum","voiceCaption":"Padankan ciri struktur ileum dan vilus dengan kepentingannya dalam penyerapan makanan tercerna.","voiceScript":"[confident] Padankan lima ciri penyesuaian struktur ileum dan vilus berikut dengan kelebihan penyerapannya!","prompt":"Padankan ciri ileum dan vilus berikut dengan fungsinya:","pairs":[{"id":"vl1","left":"Epitelium vilus setebal satu sel","right":"Memendekkan jarak resapan dan mempercepatkan kadar penyerapan nutrien"},{"id":"vl2","left":"Mikrovilus pada permukaan sel epitelium","right":"Menyediakan jumlah luas permukaan yang amat besar untuk penyerapan pantas"},{"id":"vl3","left":"Jaringan kapilari darah padat","right":"Mengekalkan kecerunan kepekatan dengan mengangkut cepat nutrien ke seluruh badan"},{"id":"vl4","left":"Lakteal di tengah vilus","right":"Mengangkut titisan lipid dan vitamin A, D, E, K ke duktus toraks"},{"id":"vl5","left":"Sel goblet pada dinding vilus","right":"Merembeskan mukus untuk melicinkan laluan makanan dan membantu pencernaan"}],"explanation":"Setiap ciri struktur vilus memaksimumkan luas permukaan, meminimumkan ketebalan dinding (1 sel), dan mengekalkan pengangkutan berterusan melalui kapilari darah serta lakteal."}]},{"id":"bio49-u3","title":"Unit 3: Asimilasi (Hati & Sel) serta Penyahtinjaan Usus Besar","subtitle":"Subtopik 9.4 & 9.5 — Vena Portal Hepar & Duktus Toraks, 3 Fungsi Hati (Metabolisme/Deaminasi Urea, Simpanan Glikogen & Detoksifikasi) serta Fungsi Usus Besar","iconType":"book","iconUrl":"../assets/icons/bio49-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Asimilasi Hati, Sel & Penyahtinjaan","voiceCaption":"Nutrien larut air diangkut melalui vena portal hepar ke hati untuk metabolisme, penyimpanan glikogen, deaminasi urea dan detoksifikasi sebelum diasimilasi di sel badan.","voiceScript":"[warm] Ke manakah perginya nutrien selepas diserap di vilus? Kapilari darah vilus bercantum menjadi vena portal hepar yang menghantar glukosa dan asid amino terus ke hati! Lakteal pula bercantum ke salur limfa lalu masuk ke duktus toraks dan mengalir ke vena subklavia kiri untuk mengedarkan lipid ke seluruh tubuh! Di dalam hati, asimilasi mengawal atur nutrien melalui tiga fungsi utama: pertama, metabolisme makanan tercerna — asid amino membentuk protein plasma dan enzim, manakala lebihan asid amino yang tidak boleh disimpan diuraikan melalui deaminasi menjadi urea untuk dikumuhkan; kedua, penyimpanan nutrien — lebihan glukosa ditukar kepada glikogen; ketiga, detoksifikasi bahan toksik! Akhir sekali di usus besar, air, garam mineral serta vitamin B, vitamin K dan asid folik hasil bakteria usus diserap semula sambil sisa menjadi tinja untuk penyahtinjaan!","title":"9.4 Asimilasi (Hati & Sel) serta 9.5 Fungsi Usus Besar & Penyahtinjaan","acronym":"M•S•D•U","hook":"Hati ialah pengawal lalu lintas nutrien tubuh — lebihan asid amino tidak boleh disimpan seperti glikogen atau lemak, lalu terus dideaminasikan menjadi urea!","summary":"Sistem peredaran darah (vena portal hepar) dan sistem limfa (duktus toraks -> vena subklavia kiri) menghantar nutrien untuk asimilasi di hati dan sel, manakala usus besar menyerap air/vitamin serta membentuk tinja.","bullets":["Laluan Pengangkutan & 3 Fungsi Hati: Kapilari darah -> Vena portal hepar -> Hati. Lakteal -> Salur limfa -> Duktus toraks -> Vena subklavia kiri -> Darah. Fungsi Hati: (1) Metabolisme — glukosa untuk respirasi; asid amino sintesis protein plasma & enzim; lebihan asid amino melalui DEAMINASI membentuk UREA (dikumuhkan melalui air kencing); tukar asid amino kepada glukosa jika glukosa kurang; (2) Penyimpanan Nutrien — lebihan glukosa -> glikogen (ditukar kembali kepada glukosa jika aras gula darah turun; jika simpanan glikogen penuh -> lemak); (3) Detoksifikasi — singkir bahan toksik (dadah/alkohol) daripada darah.","Asimilasi di Sel & Fungsi Usus Besar (9.5): Di sel badan — asid amino membina protoplasma baharu, baiki tisu rosak, sintesis hormon & enzim; glukosa dioksidakan dalam respirasi sel & lebihan disimpan sebagai glikogen otot; lipid (fosfolipid & kolesterol) membina membran plasma & lemak disimpan di tisu adipos. Di Usus Besar — menyerap semula air, garam mineral serta hasil sampingan metabolik bakteria berfaedah (VITAMIN B, VITAMIN K dan ASID FOLIK); membina tinja (12-24 jam ke rektum) dilincirkan mukus sehingga tekanan rektum merangsang penyahtinjaan melalui dubur."],"labId":"bio49_vilus_asimilasi_lab","labTitle":"Peta Asimilasi Hati, Deaminasi & Usus Besar","labProps":{"tab":"hati"},"examTip":"Skema S.P.M.: Bezakan tepat dua istilah ini — Penyerapan (pergerakan molekul tercerna merentasi vilus ke darah/limfa) vs Asimilasi (penggunaan nutrien oleh sel untuk membentuk sebatian kompleks atau komponen sel)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Pengangkutan Lipid & Deaminasi","voiceCaption":"Susun laluan pengangkutan titisan lipid daripada lakteal sehingga memasuki sistem peredaran darah.","voiceScript":"[confident] Susun semula empat peringkat laluan titisan lipid daripada lakteal di vilus sehingga memasuki aliran darah umum!","prompt":"Susun laluan pengangkutan lipid daripada lakteal ke sistem peredaran darah:","hint":"Bermula di lakteal vilus dan memasuki darah melalui vena subklavia kiri.","answerTokens":["Lakteal dalam vilus","Salur limfa besar","Duktus toraks","Vena subklavia kiri"],"distractors":["Vena portal hepar","Salur hempedu"],"explanation":"Lakteal bercantum membentuk salur limfa lebih besar -> masuk ke duktus toraks -> mengalir masuk ke vena subklavia kiri ke dalam sistem peredaran darah."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Kesan Antibiotik di Usus Besar","voiceCaption":"Ramalkan kesan pengambilan antibiotik secara berlebihan terhadap populasi bakteria berfaedah dan penyerapan vitamin di usus besar.","voiceScript":"[curious] Soalan Cabaran Minda Buku Teks! Apakah kesannya terhadap penghasilan vitamin B dan vitamin K di dalam usus besar sekiranya seseorang mengambil antibiotik secara berpanjangan?","hook":"Periksa fungsi usus besar dan simbiosis bakteria pada Peta Asimilasi & Usus Besar!","scenario":"Seorang pesakit mengambil dos antibiotik spektrum luas secara berpanjangan sehingga memusnahkan sebahagian besar flora bakteria semula jadi di usus besarnya.","prompt":"Apakah kesan sampingan yang mungkin berlaku di usus besar pesakit tersebut?","options":["Penghasilan serta penyerapan vitamin B, vitamin K dan asid folik berkurangan kerana populasi bakteria berfaedah di usus besar menurun","Proses deaminasi asid amino menjadi urea berpindah dari hati ke rektum","Pencernaan kanji oleh amilase di dalam usus besar terhenti serta-merta","Sel parietal usus besar berhenti menghasilkan pepsinogen"],"correctIndex":0,"proofLabId":"bio49_vilus_asimilasi_lab","proofState":{"tab":"hati"},"explanation":"Bakteria berfaedah di dalam usus besar menghasilkan vitamin B, vitamin K dan asid folik. Antibiotik yang membunuh bakteria ini mengurangkan bekalan vitamin tersebut."}]},{"id":"bio49-u4","title":"Unit 4: Gizi Seimbang (Nilai Tenaga & Vitamin C) serta Isu Kesihatan","subtitle":"Subtopik 9.6 & 9.7 — Formula Nilai Tenaga Makanan (4.2 J g-1 C-1), Ujian DCPIP Vitamin C, Pinggan Sihat Malaysia, Obesiti/Pintasan Gaster, Serat & Tabiat Pemakanan","iconType":"scale","iconUrl":"../assets/icons/bio49-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Nilai Tenaga, DCPIP & Isu Pemakanan","voiceCaption":"Nilai tenaga makanan diukur dalam kilojoule per gram, kepekatan vitamin C ditentukan menggunakan larutan biru DCPIP, dan diet diubah suai bagi mencegah penyakit.","voiceScript":"[warm] Bagaimana ahli nutrisi mengukur tenaga dan vitamin C dalam makanan? Nilai tenaga ialah jumlah tenaga haba apabila satu gram makanan dioksidakan lengkap dalam unit kilojoule per gram! Untuk mengukur kandungan vitamin C dalam jus buah atau sayur, kita menitiskan jus ke dalam larutan biru D C P I P sehingga warna birunya luntur menjadi tidak berwarna — lebih sedikit isi padu jus diperlukan, lebih tinggi kepekatan vitamin C di dalamnya! Ingat juga: suhu tinggi merosakkan vitamin C! Dalam kehidupan harian pula, ikuti Pinggan Sihat Malaysia dan amalkan serat tinggi untuk merangsang peristalsis serta mencegah sembelit, kanser kolon dan buasir! Pengubahsuaian organ seperti pembedahan pintasan gaster untuk obesiti pula mempunyai kesan sampingan, manakala tabiat makan tidak sihat boleh mencetuskan gastritis, anoreksia nervosa, bulimia nervosa dan dismorfia otot!","title":"9.6 Nilai Tenaga & Ujian DCPIP + 9.7 Pintasan Gaster, Serat & Tabiat Makan","acronym":"D•C•P•I•P","hook":"Semakin KECIL isi padu jus yang melunturkan larutan biru DCPIP 1%, semakin TINGGI kepekatan vitamin C di dalam jus tersebut!","summary":"Pengiraan nilai tenaga (kJ g-1) dan kepekatan vitamin C (DCPIP) menyokong perancangan diet Pinggan Sihat Malaysia serta pencegahan penyakit pencernaan dan tabiat pemakanan.","formula":"Nilai tenaga (kJ/g) = (Jisim air x 4.2 x Kenaikan suhu) / (Jisim makanan x 1000)  |  Vit C (mg/ml) = (Vol asid askorbik 0.1% / Vol jus) x 1.0","bullets":["Aktiviti 9.4 (Nilai Tenaga) & 9.5-9.6 (Vitamin C DCPIP): 1 kalori = 4.2 J. Nilai tenaga (kJ g-1) = [jisim air (g) x 4.2 J g-1 °C-1 x kenaikan suhu (°C)] / [jisim sampel makanan (g) x 1000]. Dalam ujian DCPIP (piawai: asid askorbik 0.1%), % Vitamin C = (isipadu asid askorbik / isipadu jus) x 0.1; kepekatan (mg ml-1) = (isipadu asid askorbik / isipadu jus) x 1.0. Suhu tinggi (didih) merosakkan vitamin C; simpan jus pada suhu rendah/sejuk.","Diet Penyakit, Pintasan Gaster & Isu Pemakanan (9.6.3 & 9.7): Obesiti kurangkan karbohidrat/lemak tepu (cegah diabetes mellitus, aterosklerosis, hipertensi, infark miokardium & strok). Pintasan gaster (kecilkan saiz perut) berisiko kesan jangka pendek (refluks asid, loya, muntah, jangkitan) & panjang (pening, gula darah rendah, malnutrisi, ulser perut). Serat merangsang peristalsis, serap/singkir toksin, kawal serapan glukosa (diabetes) & cegah sembelit/buasir/kanser kolon. Isu tabiat makan: Gastritis (radang epitelium perut oleh jus gaster ketika tiada makanan -> ulser), Anoreksia nervosa (elak makan), Bulimia nervosa (makan banyak lalu sengaja muntah/guna julap -> dehidrasi & kerosakan ginjal/kardiovaskular), Dismorfia otot (latihan ekstrem & steroid)."],"labId":"bio49_kalori_dcpip_lab","labTitle":"Kalkulator Nilai Tenaga & Simulator Ujian DCPIP Vitamin C","labProps":{"tab":"dcpip"},"examTip":"Semasa menjalankan Aktiviti 9.5 (Ujian DCPIP): Jus MESTI dititiskan perlahan sambil digoncang perlahan (bukan digoncang kuat!) supaya oksigen udara tidak mengoksidakan semula larutan DCPIP."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Kira Nilai Tenaga & Vitamin C","voiceCaption":"Hitung kepekatan vitamin C dalam jus oren jika 2.0 ml jus melunturkan 1 ml DCPIP berbanding 0.5 ml asid askorbik 0.1%.","voiceScript":"[curious] Jom uji kemahiran pengiraan Aktiviti sembilan perpuluhan lima! Jika kosong perpuluhan lima mililiter asid askorbik sifar perpuluhan satu peratus melunturkan satu mililiter D C P I P, dan sebanyak dua perpuluhan sifar mililiter jus oren diperlukan untuk ujian yang sama, berapakah kepekatan vitamin C dalam miligram per mililiter?","hook":"Semak pengiraan formula pada Kalkulator DCPIP & Nilai Tenaga selepas menjawab!","scenario":"Ujian DCPIP piawai memerlukan 0.5 ml asid askorbik 0.1% untuk melunturkan 1 ml DCPIP 1%. Jus oren pula memerlukan 2.0 ml untuk melunturkan warna biru DCPIP yang sama.","prompt":"Berapakah kepekatan vitamin C dalam jus oren tersebut (dalam mg ml-1 dan %)?","options":["0.25 mg ml-1 atau 0.025% (dikira melalui (0.5 / 2.0) x 1.0 mg ml-1)","4.0 mg ml-1 atau 0.40% (dikira melalui 2.0 / 0.5)","1.0 mg ml-1 atau 0.10% (sama dengan larutan piawai)","0.05 mg ml-1 atau 0.50%"],"correctIndex":0,"proofLabId":"bio49_kalori_dcpip_lab","proofState":{"tab":"dcpip"},"explanation":"Kepekatan vitamin C (mg ml-1) = (0.5 / 2.0) x 1.0 = 0.25 mg ml-1; peratus vitamin C = (0.5 / 2.0) x 0.1 = 0.025%."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Isu Tabiat Pemakanan","voiceCaption":"Kelaskan enam simptom dan punca penyakit pemakanan berikut mengikut jenis gangguan tabiat pemakanan yang tepat.","voiceScript":"[confident] Kelaskan keenam-enam ciri isu pemakanan ini sama ada merujuk kepada Gastritis atau Anoreksia/Bulimia Nervosa serta Dismorfia Otot!","prompt":"Isihkan ciri isu kesihatan pemakanan berikut ke dalam kategori yang tepat:","buckets":[{"id":"gas","label":"Gastritis & Masalah Penyahtinjaan"},{"id":"eat","label":"Anoreksia, Bulimia & Dismorfia Otot"}],"items":[{"text":"Keradangan dan hakisan lapisan epitelium perut oleh jus gaster ketika perut kosong","bucketId":"gas","note":"Tepat! Makan tidak teratur dan ubat penahan sakit berlebihan mencetuskan gastritis."},{"text":"Sembelit, buasir dan kanser kolon akibat diet kekurangan serat dan air","bucketId":"gas","note":"Betul! Serat merangsang peristalsis dan melembutkan tinja."},{"text":"Menghindari makanan secara ekstrem kerana obsesi berat badan hingga kekurangan nutrien","bucketId":"eat","note":"Tepat! Merupakan ciri utama anoreksia nervosa."},{"text":"Makan secara berlebihan lalu memuntahkan semula makanan secara paksa atau mengambil julap","bucketId":"eat","note":"Betul! Bulimia nervosa menyebabkan dehidrasi, masalah kardiovaskular & kegagalan ginjal."},{"text":"Mengambil steroid atau suplemen pembina otot secara ekstrem kerana berasa saiz badan terlalu kecil","bucketId":"eat","note":"Tepat! Ciri gangguan psikologi dismorfia otot."},{"text":"Pembedahan pintasan gaster untuk obesiti berisiko refluks asid dan ulser perut","bucketId":"gas","note":"Betul! Pengubahsuaian saiz perut menjejaskan kapasiti dan penyerapan nutrien."}],"explanation":"Gastritis & isu penyahtinjaan berpunca daripada hakisan epitelium perut atau kekurangan serat; anoreksia nervosa, bulimia nervosa dan dismorfia otot ialah gangguan psikologi tabiat makan dan imej tubuh."}]},{"id":"bio49-u5","title":"Cabaran Boss SPM: Nutrisi & Sistem Pencernaan","subtitle":"Sintesis KBAT Kertas 1 & 2 — Kesan Makan Oren Berlebihan di Duodenum, Asimilasi Sarapan Pagi, Pencernaan Lemak hingga Sel & Kapsul Ubat","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Oren Berlebihan & Kanji","voiceCaption":"Jelaskan kesan memakan terlalu banyak buah oren masam terhadap pencernaan kanji oleh amilase.","voiceScript":"[excited] Cabaran Boss S P M Bab sembilan bermula! Soalan Praktis Sumatif empat d: seorang murid gemar memakan terlalu banyak buah oren. Apakah kesannya terhadap pencernaan kanji oleh enzim amilase?","prompt":"Seorang murid gemar memakan buah oren masam dalam kuantiti yang sangat banyak. Bagaimanakah tabiat ini menjejaskan pencernaan kanji?","options":["Asid sitrik dalam oren merendahkan pH di mulut dan duodenum di bawah julat optimum amilase (pH 6.5-8.6), mengubah cas tapak aktif lalu merencatkan atau menyahasli amilase daripada menghidrolisiskan kanji","Vitamin C dalam oren mengaktifkan pepsinogen untuk mencerna kanji menjadi glikogen","Jus oren mengemulsikan kanji menjadi asid lemak di dalam lakteal","Oren menaikkan pH perut kepada pH 9 lalu mempercepatkan tindakan amilase air liur"],"correctIndex":0,"explanation":"Buah oren bersifat berasid; keasidan tinggi merendahkan pH medium di bawah pH optimum amilase air liur/pankreas sehingga aktiviti hidrolisis kanji terencat."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Kapsul Ubat & Hati","voiceCaption":"Ramalkan mengapa struktur molekul ubat kapsul yang diserap di usus kecil berubah apabila sampel darah dianalisis.","voiceScript":"[curious] Soalan Pengayaan Praktis Sumatif sembilan! Ubat berbentuk kapsul tidak terurai di perut tetapi diserap di usus kecil; namun apabila sampel darah dianalisis, struktur molekul ubat tersebut didapati berbeza daripada struktur asal! Mengapa?","hook":"Periksa laluan darah dari vilus melalui vena portal hepar ke hati pada Makmal Asimilasi!","scenario":"Ubat kapsul melepasi perut secara utuh lalu diserap melalui vilus usus kecil ke dalam kapilari darah, namun sampel darah umum menunjukkan struktur kimianya telah berubah.","prompt":"Organ manakah yang bertanggungjawab mengubah struktur kimia ubat tersebut selepas penyerapan dan mengapa?","options":["Hati — darah daripada kapilari vilus mengalir terus ke hati melalui vena portal hepar, di mana sel hati menjalankan detoksifikasi dan memetabolismekan ubat sebelum memasuki peredaran darah umum","Usus besar — bakteria usus menukarkan kapsul ubat menjadi vitamin K dan tinja","Pundi hempedu — garam hempedu mengemulsikan ubat menjadi pepsinogen","Lakteal — duktus toraks menapis dan mencerna ubat sebelum tiba di perut"],"correctIndex":0,"proofLabId":"bio49_vilus_asimilasi_lab","proofState":{"tab":"hati"},"explanation":"Nutrien dan ubat yang diserap ke kapilari darah vilus diangkut melalui vena portal hepar ke hati terlebih dahulu; sel hati menjalankan detoksifikasi dan metabolisme bahan kimia asing."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Nasib Hasil Akhir Sarapan","voiceCaption":"Kelaskan enam proses asimilasi produk pencernaan sarapan (roti mentega, telur, susu, epal) di dalam hati atau sel badan.","voiceScript":"[confident] Cabaran ketiga Boss S P M! Kelaskan keenam-enam nasib asimilasi glukosa, asid amino dan lipid daripada sarapan pagi mengikut lokasi utamanya: Asimilasi di Hati atau Asimilasi di Sel Badan!","prompt":"Isihkan proses asimilasi berikut kepada Asimilasi di Hati atau Asimilasi di Sel Badan:","buckets":[{"id":"ah","label":"Asimilasi Utama di Hati"},{"id":"as","label":"Asimilasi di Sel Badan"}],"items":[{"text":"Lebihan asid amino dideaminasikan menjadi urea untuk dikumuhkan melalui ginjal","bucketId":"ah","note":"Tepat! Deaminasi asid amino berlaku khusus di dalam sel hati."},{"text":"Sintesis protein plasma (fibrinogen, albumin) daripada asid amino","bucketId":"ah","note":"Betul! Hati mensintesis protein plasma penting untuk darah."},{"text":"Detoksifikasi alkohol dan dadah daripada aliran darah vena portal hepar","bucketId":"ah","note":"Tepat! Hati menyahtoksik bahan berbahaya dalam darah."},{"text":"Asid amino digunakan untuk mensintesis protoplasma baharu, hormon dan membaiki tisu rosak","bucketId":"as","note":"Betul! Sel tisu menggunakan asid amino untuk pertumbuhan & pembaikan."},{"text":"Glukosa dioksidakan melalui respirasi sel membebaskan ATP dan lebihan disimpan sebagai glikogen otot","bucketId":"as","note":"Tepat! Sel otot membakar glukosa untuk tenaga dan menyimpan glikogen otot."},{"text":"Lipid (fosfolipid & kolesterol) membina membran plasma dan lebihan disimpan dalam tisu adipos","bucketId":"as","note":"Betul! Sel badan dan tisu adipos bawah kulit menggunakan serta menyimpan lipid."}],"explanation":"Hati mengawal atur darah (deaminasi urea, sintesis protein plasma, simpan glikogen & detoksifikasi); sel badan mengasimilasikan nutrien untuk respirasi sel, membran plasma, pembaikan tisu dan simpanan adipos/otot."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Nilai Tenaga & Diet","voiceCaption":"Padankan eksperimen nilai tenaga kacang tanah, pengubahsuaian diet obesiti dan fungsi serat dengan huraiannya.","voiceScript":"[confident] Satu langkah lagi menuju kejayaan penuh Bab sembilan! Padankan keempat-empat soalan sintesis nutrisi ini dengan jawapan tepatnya.","prompt":"Padankan konsep nutrisi berikut dengan huraian yang tepat:","pairs":[{"id":"b91","left":"Nilai tenaga eksperimen kacang tanah lebih rendah daripada teori","right":"Sebahagian haba pembakaran hilang ke persekitaran dan tidak diserap sepenuhnya oleh air dalam tabung didih"},{"id":"b92","left":"Pengubahsuaian diet untuk pesakit obesiti & kardiovaskular","right":"Kurangkan karbohidrat ringkas, lemak tepu & kolesterol; tambah sayur, buah berserat dan senaman berkala"},{"id":"b93","left":"Peranan serat dalam kawalan diabetes mellitus","right":"Melambatkan dan mengawal atur kadar penyerapan glukosa ke dalam darah selepas makan"},{"id":"b94","left":"Mengapa makanan sejuk beku & segera tinggi berisiko jangka panjang","right":"Tinggi lemak tepu, garam/natrium & gula tambahan yang mencetuskan obesiti, hipertensi dan diabetes jenis 2"}],"explanation":"Kehilangan haba ke persekitaran merendahkan nilai tenaga eksperimen; diet tinggi serat & rendah lemak tepu mencegah obesiti/kardiovaskular/diabetes."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Laluan Lengkap Lemak","voiceCaption":"Rumuskan perjalanan lengkap molekul lemak bermula daripada pengemulsian di duodenum sehingga pengasimilasian di sel badan.","voiceScript":"[excited] Soalan penutup Boss S P M Bab sembilan! Pilih urutan lengkap perjalanan molekul lemak bermula dari duodenum sehingga diasimilasikan oleh sel badan.","prompt":"Manakah turutan perjalanan lengkap molekul lemak daripada duodenum sehingga digunakan oleh sel badan?","options":["Hempedu mengemulsikan lemak -> lipase menghidrolisiskan lemak kepada asid lemak + gliserol -> meresap masuk epitelium vilus & berkondensasi menjadi titisan lipid -> masuk ke lakteal -> duktus toraks -> vena subklavia kiri -> sel badan membina membran plasma/simpan di tisu adipos","Pepsin mencerna lemak di duodenum -> diserap secara pengangkutan aktif ke kapilari darah -> vena portal hepar -> dideaminasikan menjadi urea di hati","Amilase menghidrolisiskan lemak kepada glukosa -> masuk ke usus besar -> diserap bersama vitamin K","Lipase mengubah lemak kepada asid amino -> terus memasuki vena subklavia kanan tanpa melalui lakteal"],"correctIndex":0,"explanation":"Lemak diemulsikan oleh hempedu -> dihidrolisiskan oleh lipase -> asid lemak + gliserol meresap ke epitelium vilus & berkondensasi semula -> lakteal -> duktus toraks -> vena subklavia kiri -> darah -> sel badan."}]}]};</script>

function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;
  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}
