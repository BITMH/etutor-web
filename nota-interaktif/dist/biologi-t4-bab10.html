/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab10","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":10,"title":"Pengangkutan dalam Manusia dan Haiwan","subtitle":"Subtopik 10.1-10.8 KSSM — Peredaran Terbuka/Tertutup (Serangga, Ikan, Amfibia, Manusia), Jantung & Perentak SA/AV/His/Purkinje (Lub-Dub), Pembekuan Darah (Fibrin/Hemofilia/Trombosis), Kumpulan Darah ABO & Faktor Rhesus, Penyakit Kardiovaskular serta Sistem Limfa & Edema.","estimatedMinutes":38,"themeAccent":"#dc2626","isFreePreview":false,"labScript":"biologi-t4-bab10-labs.js","coverIcon":"../assets/icons/bio410-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan jantung miogenik, pembekuan darah dan kumpulan darah kamu memang hebat!","combo":"[laughs warmly] Kombo yang luar biasa! Daripada nodus sinoatrium hingga sistem limfa, semuanya tepat!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula peranan injap bikuspid, trombokinase dan duktus toraks di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Pengangkutan Manusia dan Haiwan berjaya dikuasai!"},"units":[{"id":"bio410-u1","title":"Unit 1: Jenis Sistem Peredaran (Serangga, Ikan, Amfibia & Manusia)","subtitle":"Subtopik 10.1 — Nisbah JLP/I, Sistem Terbuka (Hemolimfa/Hemoselom/Ostium) vs Tertutup (Tunggal, Ganda Dua Tak Lengkap & Lengkap)","iconType":"atom","iconUrl":"../assets/icons/bio410-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"4 Jenis Sistem Peredaran","voiceCaption":"Organisma multisel besar ber-JLP/I kecil memerlukan sistem peredaran terbuka pada serangga atau tertutup pada ikan, amfibia dan manusia.","voiceScript":"[warm] Selamat datang ke Bab sepuluh, Pengangkutan dalam Manusia dan Haiwan! Organisma multisel besar mempunyai nisbah jumlah luas permukaan per isi padu yang kecil serta jarak yang jauh antara sel dalaman dengan persekitaran, jadi ia memerlukan sistem pengangkutan dalaman! Serangga mempunyai sistem peredaran terbuka di mana jantung mengepam hemolimfa ke dalam rongga badan hemoselom dan masuk semula melalui liang ostium! Ikan mempunyai sistem peredaran tertutup tunggal dengan jantung dua ruang iaitu satu atrium dan satu ventrikel! Amfibia mempunyai sistem peredaran ganda dua tidak lengkap dengan tiga ruang iaitu dua atrium dan satu ventrikel, menyebabkan darah beroksigen dan terdeoksigen bercampur separa! Manusia pula mempunyai sistem peredaran ganda dua lengkap dengan empat ruang jantung iaitu dua atrium dan dua ventrikel yang terpisah sepenuhnya!","title":"10.1 Peredaran Terbuka vs Tertutup (Serangga, Ikan, Amfibia, Manusia)","acronym":"2•3•4","hook":"Perhatikan bilangan ruang jantung meningkat daripada 2 (Ikan: tunggal) -> 3 (Amfibia: ganda dua tak lengkap) -> 4 (Manusia: ganda dua lengkap)!","summary":"Sistem peredaran membekalkan O2 dan nutrien serta menyingkirkan CO2 dan sisa bernitrogen melalui peredaran terbuka (serangga) atau tertutup (ikan, amfibia, manusia).","bullets":["Sistem Terbuka (Serangga) vs Tertutup Tunggal (Ikan): Serangga — sistem peredaran TERBUKA; jantung bersegmen mengepam HEMOLIMFA ke dalam rongga badan HEMOSELOM (membasahi sel untuk pertukaran nutrien/sisa; gas diangkut sistem trakea berasingan) lalu kembali ke jantung melalui OSTIUM apabila jantung mengendur. Ikan — peredaran TERTUTUP TUNGGAL; jantung 2 ruang (1 atrium + 1 ventrikel); darah mengalir melalui jantung SEKALI dalam satu kitaran lengkap (ventrikel -> kapilari insang -> kapilari sistemik -> atrium).","Ganda Dua Tak Lengkap (Amfibia) vs Ganda Dua Lengkap (Manusia): Amfibia — peredaran tertutup ganda dua TIDAK LENGKAP; jantung 3 ruang (2 atrium + 1 ventrikel); peredaran pulmokutaneus (peparu & kulit) dan sistemik; darah beroksigen & terdeoksigen bercampur separa dalam satu ventrikel. Manusia — peredaran tertutup ganda dua LENGKAP; jantung 4 ruang (2 atrium + 2 ventrikel terpisah septum); peredaran pulmonari (arteri pulmonari -> peparu -> vena pulmonari -> atrium kiri) dan sistemik (ventrikel kiri -> aorta -> tisu -> vena kava -> atrium kanan); darah melalui jantung DUA KALI tanpa percampuran."],"labId":"bio410_peredaran_jantung_lab","labTitle":"Pembanding 4 Sistem Peredaran & Anatomi Jantung","labProps":{"tab":"banding"},"examTip":"Soalan klasik S.P.M.: Mengapakah cacing pipih (organisma multisel) TIDAK memerlukan sistem peredaran khusus? Kerana badannya leper dengan nisbah JLP/I yang besar dan jarak resapan yang pendek antara sel dengan persekitaran."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 4 Sistem Peredaran","voiceCaption":"Kelaskan enam ciri peredaran berikut mengikut sistem peredaran Terbuka/Tunggal (Serangga & Ikan) atau Ganda Dua (Amfibia & Manusia).","voiceScript":"[confident] Jom kelaskan keenam-enam ciri sistem peredaran ini antara Serangga atau Ikan dengan Amfibia atau Manusia!","prompt":"Isihkan ciri sistem peredaran berikut mengikut kategorinya:","buckets":[{"id":"si","label":"Serangga (Terbuka) & Ikan (Tunggal)"},{"id":"am","label":"Amfibia & Manusia (Ganda Dua)"}],"items":[{"text":"Hemolimfa mengalir terus ke dalam hemoselom dan kembali melalui ostium (Serangga)","bucketId":"si","note":"Tepat! Ciri sistem peredaran terbuka serangga."},{"text":"Jantung dua ruang (1 atrium, 1 ventrikel) mengepam darah melalui insang sekali per kitaran (Ikan)","bucketId":"si","note":"Betul! Ikan mempunyai sistem peredaran tertutup tunggal."},{"text":"Jantung tiga ruang (2 atrium, 1 ventrikel) dengan peredaran pulmokutaneus tak lengkap (Amfibia)","bucketId":"am","note":"Tepat! Darah beroksigen dan terdeoksigen bercampur separa di dalam ventrikel tunggal."},{"text":"Jantung empat ruang terpisah oleh septum dengan peredaran pulmonari dan sistemik (Manusia)","bucketId":"am","note":"Betul! Peredaran ganda dua lengkap tanpa percampuran darah."},{"text":"Darah mengalir melalui jantung dua kali dalam satu kitaran peredaran lengkap","bucketId":"am","note":"Tepat! Definisi sistem peredaran ganda dua."},{"text":"Darah diangkut hanya melalui satu laluan sehala menerusi jantung dalam satu kitaran","bucketId":"si","note":"Betul! Sistem peredaran tunggal ikan mengalami rintangan tinggi selepas kapilari insang."}],"explanation":"Serangga = peredaran terbuka (hemolimfa/hemoselom); Ikan = tertutup tunggal (2 ruang); Amfibia = ganda dua tak lengkap (3 ruang); Manusia = ganda dua lengkap (4 ruang)."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s3","voiceToneLabel":"Kecekapan Ganda Dua vs Tunggal","voiceCaption":"Jelaskan sebab darah dalam peredaran ikan menghadapi rintangan lebih tinggi berbanding peredaran ganda dua manusia.","voiceScript":"[curious] Soalan Praktis Sumatif sepuluh! Mengapakah tekanan darah yang sampai ke tisu badan ikan lebih rendah berbanding manusia, dan bagaimanakah ikan mengatasinya?","prompt":"Mengapakah aliran darah ke tisu sistemik ikan mempunyai tekanan lebih rendah berbanding manusia?","options":["Darah ikan kehilangan tekanan selepas merentasi dua jaringan kapilari (insang kemudian sistemik) tanpa dipam semula oleh jantung; pergerakan renangan otot badan membantu menolak darah kembali ke jantung","Ikan mempunyai sistem peredaran terbuka tanpa sebarang salur darah vena","Jantung ikan mengepam darah sebanyak dua kali setiap kitaran lengkap","Hemoglobin ikan tidak boleh mengikat oksigen di dalam air"],"correctIndex":0,"explanation":"Dalam peredaran tunggal ikan, darah merentasi kapilari insang dahulu lalu tekanannya menurun sebelum ke kapilari sistemik; pengecutan otot rangka semasa berenang membantu mengalirkan darah."}]},{"id":"bio410-u2","title":"Unit 2: Jantung, Salur Darah, Komposisi Darah & Mekanisme Denyutan","subtitle":"Subtopik 10.2 & 10.3 — 4 Ruang & Injap Jantung, Arteri/Kapilari/Vena, 55% Plasma & Sel Darah serta Perentak SA -> AV -> Berkas His -> Gentian Purkinje (Lub-Dub)","iconType":"graph","iconUrl":"../assets/icons/bio410-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Jantung, Darah & Salur Darah","voiceCaption":"Sistem peredaran manusia terdiri daripada jantung berotot kardium miogenik, tiga jenis salur darah serta darah yang mengandungi lima puluh lima peratus plasma dan empat puluh lima peratus komponen sel.","voiceScript":"[warm] Mari lihat jentera utama tubuh kita: jantung, salur darah dan darah! Jantung mempunyai empat ruang yang dipisahkan oleh septum supaya darah beroksigen tidak bercampur dengan darah terdeoksigen! Dinding ventrikel kiri jauh lebih tebal daripada ventrikel kanan kerana ia perlu menjana tekanan lebih tinggi untuk mengepam darah ke seluruh badan melalui aorta! Injap bikuspid di sebelah kiri, injap trikuspid di sebelah kanan dan injap sabit di pangkal aorta serta arteri pulmonari memastikan aliran darah sehala! Darah pula terdiri daripada lima puluh lima peratus plasma — mengandungi sembilan puluh peratus air dan protein plasma fibrinogen, albumin dan globulin — serta empat puluh lima peratus sel darah iaitu eritrosit cakera dwicekung tanpa nukleus, platelet dan leukosit! Tonton video animasi peredaran jantung di bawah!","title":"10.2 Struktur Jantung, Salur Darah & Komposisi Darah Manusia","acronym":"B•T•S•P","hook":"Fibrinogen untuk pembekuan, Albumin mengawal tekanan osmosis darah, dan Globulin ialah antibodi pertahanan — ketiga-tiganya ialah protein plasma penting!","mediaKey":"bio410_jantung_darah","videoClip":{"src":"../assets/biologi-t4-bab10/video/bio410_video_peredaran_jantung.mp4","hasNarration":false,"posterKey":"bio410_jantung_darah","caption":"Struktur jantung empat ruang, injap sehala dan laluan peredaran darah manusia."},"summary":"Jantung berinjap sehala mengepam darah melalui arteri bertekanan tinggi, kapilari setebal satu sel dan vena berinjap, membawa 55% plasma dan 45% sel darah.","bullets":["Jantung & Salur Darah (Jadual 10.4): Ventrikel kiri dinding berotot paling tebal (pam darah ke seluruh badan melalui aorta); ventrikel kanan pam ke peparu melalui arteri pulmonari. Injap bikuspid (2 kelopak, atrium kiri-ventrikel kiri), Injap trikuspid (3 kelopak, atrium kanan-ventrikel kanan), Injap sabit (pangkal aorta & arteri pulmonari), Arteri koronari (bekal O2 ke otot jantung). Arteri (dinding tebal, berotot & elastik, lumen kecil, tekanan tinggi, tiada injap kecuali injap sabit); Kapilari (dinding 1 sel, lumen sangat halus, tekanan rendah); Vena (dinding nipis, lumen besar, tekanan amat rendah, ada injap sehala).","Komposisi Darah (55% Plasma + 45% Sel): Plasma (90% air, protein plasma: fibrinogen [pembekuan], albumin [tekanan osmosis], globulin [antibodi], bahan terlarut, hormon & enzim). Eritrosit (dwicekung tanpa nukleus, hemoglobin bergugus hem beratom besi bentuk oksihemoglobin, hidup 120 hari, dihasilkan sumsum tulang). Platelet (serpihan sitoplasma sumsum tulang, hidup < 1 minggu, pembekuan). Leukosit (berbentuk tak tetap, bernukleus, hidup < 5 hari): Granulosit = Neutrofil (fagositosis), Eosinofil (enzim lawan keradangan/alergi), Basofil (mengandungi heparin anti-beku); Agranulosit = Limfosit (hasilkan antibodi & antitoksin), Monosit (leukosit terbesar, fagositosis)."],"labId":"bio410_peredaran_jantung_lab","labTitle":"Simulator Jantung, Salur Darah & Perentak SA-Purkinje","labProps":{"tab":"jantung"},"examTip":"Soalan berulang Kertas 2: Mengapakah dinding otot ventrikel KIRI jauh lebih tebal daripada ventrikel KANAN? Jawab: Ventrikel kiri perlu menjana tekanan yang lebih besar untuk mengepam darah keluar melalui aorta ke seluruh badan berbanding ventrikel kanan yang hanya mengepam ke peparu berdekatan."},{"type":"match","xp":15,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Komponen Darah & Injap","voiceCaption":"Padankan lima komponen darah dan struktur jantung berikut dengan fungsinya yang tepat.","voiceScript":"[confident] Uji penguasaan komponen darah dan injap jantung kamu! Padankan lima istilah berikut dengan tugas tepatnya.","prompt":"Padankan komponen darah dan struktur jantung berikut dengan fungsinya:","pairs":[{"id":"jd1","left":"Injap bikuspid (mitral)","right":"Menghalang darah di ventrikel kiri daripada mengalir balik ke atrium kiri"},{"id":"jd2","left":"Albumin (protein plasma)","right":"Mengawal atur tekanan osmosis darah di dalam kapilari"},{"id":"jd3","left":"Neutrofil & Monosit","right":"Menelan dan memusnahkan bakteria serta sel mati secara fagositosis"},{"id":"jd4","left":"Basofil","right":"Merembeskan heparin untuk mencegah pembekuan darah tidak normal"},{"id":"jd5","left":"Limfosit","right":"Menghasilkan antibodi dan antitoksin untuk memusnahkan patogen"}],"explanation":"Injap bikuspid mengawal aliran atrium kiri-ventrikel kiri; albumin mengawal tekanan osmosis; neutrofil & monosit menjalankan fagositosis; basofil mengandungi heparin; dan limfosit menghasilkan antibodi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Mekanisme Denyutan & Lub-Dub","voiceCaption":"Otot kardium miogenik dicetuskan oleh nodus sinoatrium (perentak jantung) melalui nodus atrioventrikel, berkas His dan gentian Purkinje, sambil menghasilkan bunyi lub-dub.","voiceScript":"[warm] Bagaimana jantung berdegup secara automatik sepanjang hayat tanpa menunggu arahan otak? Kerana otot kardium bersifat miogenik iaitu mengecut dan mengendur sendiri! Denyutan dimulakan oleh perentak jantung utama iaitu nodus sinoatrium pada dinding atrium kanan! Impuls elektrik merebak ke kedua-dua atrium menyebabkan atrium mengecut mengepam darah ke ventrikel, kemudian impuls tiba di nodus atrioventrikel dan merambat melalui berkas His serta gentian Purkinje ke apeks jantung lalu ke seluruh dinding ventrikel supaya ventrikel mengecut dari bawah ke atas! Bunyi lub terhasil apabila injap trikuspid dan bikuspid tertutup, manakala bunyi dub terhasil apabila injap sabit tertutup! Di dalam vena kaki pula, pengecutan otot rangka di sekeliling vena dan injap sehala menolak darah melawan graviti kembali ke jantung!","title":"10.3 Mekanisme Denyutan Jantung (Miogenik) & Aliran Vena","acronym":"SA•AV•H•P","hook":"LUB = tutup injap trikuspid + bikuspid; DUB = tutup injap sabit! Dan pengecutan otot rangka betis mengepam darah vena naik melawan graviti!","summary":"Impuls elektrik miogenik bergerak mengikut urutan SA -> AV -> Berkas His -> Gentian Purkinje untuk pengecutan berkoordinasi, manakala pengecutan otot rangka membantu aliran vena.","bullets":["4 Langkah Denyutan Jantung & Bunyi Lub-Dub: Otot kardium bersambungan dan bersifat MIOGENIK (berdenyut sendiri tanpa rangsangan sistem saraf). (1) Nodus sinoatrium (SA, perentak di dinding atrium kanan) menjana impuls elektrik -> (2) Impuls merebak serentak ke kedua-dua atrium (atrium mengecut mengepam darah ke ventrikel) -> (3) Impuls tiba di Nodus atrioventrikel (AV) lalu merambat melalui Berkas His dan Gentian Purkinje hingga ke apeks jantung -> (4) Impuls merebak dari apeks ke seluruh dinding ventrikel (ventrikel mengecut mengepam darah keluar ke peparu & badan). Bunyi pertama 'LUB' = penutupan injap trikuspid & bikuspid; bunyi kedua 'DUB' = penutupan injap sabit.","Aliran Darah dalam Vena: Tekanan jantung tidak cukup untuk menolak darah melalui vena melawan graviti. Ia dibantu oleh (a) pengecutan otot licin dinding venul/vena dan (b) pengecutan otot rangka di sekeliling vena yang menekan vena sehingga injap terbuka menghala ke jantung lalu tertutup mencegah pengaliran balik (berdiri/duduk terlalu lama boleh menyebabkan darah berkumpul di kaki dan pengsan)."],"labId":"bio410_peredaran_jantung_lab","labTitle":"Simulator Perentak SA-AV-His-Purkinje & Lub-Dub","labProps":{"tab":"perentak"},"examTip":"Hafal urutan tepat laluan impuls jantung: Nodus Sinoatrium (SA) -> Dinding Atrium -> Nodus Atrioventrikel (AV) -> Berkas His -> Gentian Purkinje (ke apeks) -> Dinding Ventrikel."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Susun Laluan Impuls Jantung","voiceCaption":"Susun urutan struktur pengaliran impuls elektrik daripada perentak jantung sehingga pengecutan ventrikel.","voiceScript":"[confident] Susun semula lima struktur pengaliran impuls elektrik denyutan jantung mengikut urutan yang betul!","prompt":"Susun laluan impuls elektrik dalam mekanisme denyutan jantung:","hint":"Bermula dari perentak utama di dinding atrium kanan hingga ke dinding ventrikel.","answerTokens":["Nodus sinoatrium (SA)","Atrium mengecut serentak","Nodus atrioventrikel (AV)","Berkas His & Gentian Purkinje","Ventrikel mengecut dari apeks"],"distractors":["Injap sabit menutup menghasilkan bunyi lub","Otot rangka betis mengecut"],"explanation":"Nodus SA menjana impuls -> kedua-dua atrium mengecut -> nodus AV -> Berkas His & Gentian Purkinje ke apeks -> ventrikel mengecut."}]},{"id":"bio410-u3","title":"Unit 3: Pembekuan Darah, Kumpulan Darah ABO & Faktor Rhesus","subtitle":"Subtopik 10.4 & 10.5 — Trombokinase + Ca2+ + Vit K, Protrombin -> Trombin, Fibrinogen -> Fibrin, Hemofilia/Trombosis/Embolisme, Jadual ABO & Eritroblastosis Fetalis (Rh)","iconType":"formula","iconUrl":"../assets/icons/bio410-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Mekanisme Pembekuan & Penyakit","voiceCaption":"Apabila luka berlaku, trombokinase bersama ion kalsium dan vitamin K menukar protrombin kepada trombin yang memangkinkan fibrinogen larut menjadi jaringan gentian fibrin.","voiceScript":"[warm] Apabila jari terluka, pembekuan darah segera bertindak menghalang kehilangan darah berlebihan, menyekat kemasukan bakteria serta mengekalkan tekanan darah! Platelet bergumpal bersama sel rosak dan faktor pembekuan membentuk pengaktif trombokinase! Dengan bantuan ion kalsium dan vitamin K, trombokinase menukarkan protein plasma tak aktif protrombin kepada enzim aktif trombin! Trombin seterusnya memangkinkan penukaran fibrinogen yang larut kepada gentian protein tak larut fibrin yang memerangkap eritrosit dan menutup luka! Kekurangan faktor pembekuan genetik menyebabkan hemofilia, pembentukan darah beku dalam salur menyebabkan trombosis, dan darah beku yang bergerak menyumbat salur kecil dipanggil embolisme!","title":"10.4 Mekanisme Pembekuan Darah & Isu Kesihatan (Hemofilia, Trombosis, Embolisme)","acronym":"T•P•T•F•F","hook":"Dalam salur darah normal yang sihat, antikoagulan seperti HEPARIN menghalang darah daripada membeku secara spontan!","summary":"Lata pembekuan darah (Trombokinase -> Trombin -> Fibrin) membentuk jaringan gentian menutup luka; gangguan mekanisme ini mencetuskan hemofilia, trombosis atau embolisme.","formula":"Protrombin  --(Trombokinase, Ca2+, Vit K)-->  Trombin   |   Fibrinogen (larut)  --(Trombin)-->  Fibrin (tak larut)","bullets":["Lata Pembekuan Darah: Platelet bergumpal + sel rosak + faktor pembekuan -> TROMBOKINASE. Trombokinase + ion Kalsium (Ca2+) + Vitamin K menukar PROTROMBIN (protein plasma tak aktif) -> TROMBIN (enzim aktif). Trombin memangkinkan penukaran FIBRINOGEN (larut) -> FIBRIN (gentian protein tak larut) yang membentuk jaringan di permukaan luka untuk memerangkap eritrosit dan menutup luka.","Isu Pembekuan Darah: Hemofilia (penyakit baka kekurangan faktor pembekuan tertentu -> pendarahan berlebihan walaupun luka kecil); Trombosis (pembentukan bekuan darah [trombus] akibat kerosakan salur darah atau aliran perlahan); Embolisme (bekuan darah terlepas dan diangkut darah [embolus] lalu menyumbat salur darah kecil dan menghentikan aliran darah)."],"labId":"bio410_pembekuan_abo_lab","labTitle":"Simulator Pembekuan Darah, Pemadanan ABO & Faktor Rhesus","labProps":{"tab":"beku"},"examTip":"Skema S.P.M.: Nyatakan lengkap kedua-dua pemangkin bersama trombokinase iaitu ION KALSIUM (Ca2+) dan VITAMIN K untuk menukar protrombin kepada trombin!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Lata Pembekuan Darah","voiceCaption":"Susun urutan tindak balas kimia mekanisme pembekuan darah daripada pengaktif trombokinase hingga jaringan fibrin.","voiceScript":"[confident] Susun semula empat peringkat mekanisme pembekuan darah daripada pembentukan trombokinase hingga penutupan luka oleh fibrin!","prompt":"Susun urutan mekanisme pembekuan darah yang tepat:","hint":"Trombokinase mengaktifkan protrombin kepada trombin sebelum fibrinogen menjadi fibrin.","answerTokens":["Platelet bergumpal & sel rosak membentuk trombokinase","Trombokinase + ion Ca2+ + Vitamin K menukar protrombin kepada trombin","Trombin menukarkan fibrinogen larut kepada gentian fibrin tak larut","Jaringan fibrin memerangkap eritrosit dan menutup luka"],"distractors":["Heparin menukar fibrin kepada fibrinogen larut","Anti-D memusnahkan platelet dalam salur darah"],"explanation":"Platelet & sel rosak membentuk trombokinase -> dengan Ca2+ & vitamin K menukar protrombin menjadi trombin -> trombin menukar fibrinogen kepada gentian fibrin tak larut memerangkap eritrosit."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Kumpulan Darah ABO & Faktor Rhesus","voiceCaption":"Pendermaan darah ABO dan kehamilan melibatkan faktor Rhesus mesti mengelakkan pengaglutinatan eritrosit oleh antibodi penerima.","voiceScript":"[warm] Sebelum menerima pemindahan darah, kumpulan darah A, B, A B dan O mesti dipadankan supaya antibodi dalam serum penerima tidak bertindak balas dengan antigen pada eritrosit penderma sehingga menyebabkan pengaglutinatan atau penggumpalan darah! Darah kumpulan O tiada antigen A atau B pada sel darah merahnya, menjadikannya penderma universal; darah kumpulan A B pula tiada antibodi anti A atau anti B dalam serumnya, menjadikannya penerima universal! Selain itu, perhatikan antigen D atau Faktor Rhesus! Jika ibu Rhesus negatif mengandung anak pertama Rhesus positif, serpihan darah janin pada bulan terakhir kehamilan merangsang ibu menghasilkan antibodi anti D! Anak pertama biasanya selamat, tetapi jika anak kedua juga Rhesus positif, antibodi anti D ibu merentasi plasenta memusnahkan sel darah merah janin menyebabkan penyakit eritroblastosis fetalis — namun kini boleh dicegah dengan suntikan globulin anti Rhesus selepas kehamilan pertama!","title":"10.5 Kumpulan Darah ABO & Ketidakserasian Faktor Rhesus Kehamilan","acronym":"A•B•AB•O•Rh","hook":"Pengaglutinatan darah boleh membawa maut — pastikan antibodi serum penerima tidak menyerang antigen eritrosit penderma!","summary":"Kumpulan darah ABO ditentukan oleh antigen A/B pada eritrosit dan antibodi anti-A/anti-B dalam serum, manakala antigen D (Rhesus) berisiko mencetuskan eritroblastosis fetalis pada kehamilan kedua Rh+ ibu Rh-.","bullets":["Jadual 10.5 & 10.6 ABO: Kumpulan A (Antigen A, Anti-B -> derma ke A/AB, terima dari A/O); Kumpulan B (Antigen B, Anti-A -> derma ke B/AB, terima dari B/O); Kumpulan AB (Antigen A & B, TIADA antibodi -> penerima universal dari A,B,AB,O; derma ke AB sahaja); Kumpulan O (TIADA antigen, Anti-A & Anti-B -> penderma universal ke A,B,AB,O; terima dari O sahaja).","Faktor Rhesus & Kehamilan: Individu ada antigen D = Rh-positif (Rh+); tiada antigen D = Rh-negatif (Rh-). Jika ibu Rh- berkahwin dengan bapa Rh+ dan mengandung anak pertama Rh+: pada bulan terakhir kehamilan, serpihan sel darah janin berantigen D merentasi plasenta merangsang leukosit ibu menghasilkan antibodi anti-D (kepekatan belum cukup untuk membahayakan anak pertama, tetapi kekal dalam darah ibu). Jika anak kedua juga Rh+, antibodi anti-D ibu merentasi plasenta dan memusnahkan eritrosit janin -> ERITROBLASTOSIS FETALIS (boleh menyebabkan maut, anemia atau kerencatan akal jika tidak dirawat dengan pemindahan darah Rh- atau suntikan globulin anti-Rhesus kepada ibu selepas kelahiran pertama)."],"labId":"bio410_pembekuan_abo_lab","labTitle":"Simulator Pemadanan Darah ABO & Kes Rhesus","labProps":{"tab":"abo"},"examTip":"Dalam pemindahan darah, periksa ANTIBODI dalam serum penerima berbanding ANTIGEN pada sel darah merah penderma (isipadu antibodi penderma cair dalam darah penerima)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Kes Ibu Rh- & Anak Kedua Rh+","voiceCaption":"Ramalkan sebab anak pertama Rh-positif ibu Rh-negatif selamat tetapi anak kedua Rh-positif berisiko mengalami eritroblastosis fetalis.","voiceScript":"[curious] Soalan Praktis Formatif sepuluh perpuluhan lima! Seorang wanita Rhesus negatif berkahwin dengan lelaki Rhesus positif. Anak pertama Rhesus positif hidup sihat, tetapi anak kedua Rhesus positif mengalami kemusnahan sel darah merah! Mengapakah keadaan ini berlaku?","hook":"Simulasikan kehamilan pertama dan kedua Rh+ pada Simulator Kumpulan Darah & Rhesus!","scenario":"Ibu Rh- melahirkan anak pertama Rh+ yang selamat, namun semasa kehamilan anak kedua yang juga Rh+, janin mengalami pemusnahan eritrosit teruk (eritroblastosis fetalis).","prompt":"Apakah sebab anak kedua Rh+ terancam sedangkan anak pertama selamat?","options":["Pada akhir kehamilan pertama, antigen D janin merangsang darah ibu menghasilkan antibodi anti-D yang kekal dalam darah ibu; pada kehamilan kedua, antibodi anti-D sedia ada merentasi plasenta dalam kepekatan tinggi dan memusnahkan eritrosit janin kedua","Anak pertama mempunyai kumpulan darah O yang tiada antigen A atau B","Antibodi anti-A daripada bapa merentasi plasenta semasa kehamilan kedua","Ibu Rh- secara automatik bertukar menjadi Rh+ selepas bersalin"],"correctIndex":0,"proofLabId":"bio410_pembekuan_abo_lab","proofState":{"tab":"rhesus"},"explanation":"Antibodi anti-D yang terhasil pada akhir kehamilan pertama belum sempat membahayakan anak pertama, tetapi kekal dalam peredaran darah ibu dan segera menyerang eritrosit janin Rh+ kedua."}]},{"id":"bio410-u4","title":"Unit 4: Penyakit Kardiovaskular, Sistem Limfa & Edema","subtitle":"Subtopik 10.6, 10.7 & 10.8 — Aterosklerosis/Arteriosklerosis/Angina/Infark Miokardium/Strok, Pembentukan Bendalir Tisu & Limfa (85% vs 15%), Duktus Toraks/Limfa Kanan serta Edema & Filariasis Brugia sp.","iconType":"scale","iconUrl":"../assets/icons/bio410-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kardiovaskular, Limfa & Edema","voiceCaption":"Limfa mengumpulkan baki lima belas peratus bendalir tisu harian dan mengembalikannya ke sistem darah melalui duktus toraks dan duktus limfa kanan, serta mengangkut lipid dari lakteal.","voiceScript":"[warm] Bagaimana pula kesihatan arteri dan sistem limfa kita? Pemendapan plak kolesterol, lipid, tisu otot mati dan platelet tergumpal pada dinding arteri dipanggil aterosklerosis, dan apabila kalsium termendap menjadikan arteri keras serta hilang kekenyalan, ia menjadi arteriosklerosis! Penyempitan arteri koronari menyebabkan sakit dada angina, dan penyumbatan penuh mencetuskan serangan jantung penginfarkan miokardium, manakala salur darah otak pecah atau tersumbat menyebabkan strok! Sementara itu, di hujung arteriol kapilari darah, tekanan tinggi menolak plasma keluar menjadi bendalir tisu; lapan puluh lima peratus diserap semula di hujung venul, manakala baki lima belas peratus atau kira-kira empat liter sehari masuk ke kapilari limfa buntu sebagai limfa dan dikembalikan ke vena subklavia melalui duktus toraks serta duktus limfa kanan! Jika bendalir tisu gagal kembali akibat cacing Brugia spesies, kekurangan albumin, kehamilan atau terlantar lama, tisu membengkak dan berlakulah edema!","title":"10.6 Kardiovaskular, 10.7 Sistem Limfa & 10.8 Isu Edema/Filariasis","acronym":"85•15•T•K","hook":"Kira-kira 4 liter (15%) bendalir keluar daripada kapilari darah setiap hari — tanpa sistem limfa mengembalikannya, tisu badan akan membengkak menjadi edema!","summary":"Penyakit kardiovaskular berpunca daripada penyempitan/pengerasan arteri, manakala sistem limfa melengkapkan sistem darah, mengangkut lipid serta mempertahankan badan daripada edema.","bullets":["10.6 Penyakit Kardiovaskular: Aterosklerosis (mendapan plak kolesterol, lipid, tisu otot mati & platelet tergumpal menyempitkan lumen arteri -> hipertensi) -> Arteriosklerosis (kalsium termendap pada plak menjadikan arteri keras dan hilang kekenyalan). Arteri koronari sempit -> Angina (sakit dada teruk); tersumbat penuh -> Penginfarkan miokardium (serangan jantung). Arteri halus otak pecah/tersumbat trombus -> Strok.","10.7 Sistem Limfa & 10.8 Edema: Di hujung arteriol, tekanan darah tinggi memaksa plasma keluar ke ruang antara sel menjadi BENDALIR TISU (tiada eritrosit, platelet & protein plasma bersaiz besar). 85% meresap balik di hujung venul (plasma hipertonik); baki 15% (~4 liter/hari) masuk ke kapilari limfa (hujung buntu, dinding 1 sel) menjadi LIMFA (kuning pucat; tinggi lemak & limfosit). Salur limfa (berinjap sehala, dipacu denyut jantung, otot rangka, peristalsis & pernafasan) bercantum ke DUKTUS LIMFA KANAN (tangan kanan, dada/kepala/leher kanan -> vena subklavia kanan) dan DUKTUS TORAKS (kiri kepala/leher/dada + semua bahagian bawah rusuk + lakteal -> vena subklavia kiri). Organ limfa: nodus limfa, limpa, kelenjar timus, sumsum tulang, tonsil, apendiks. Edema (bengkak tisu akibat bendalir tisu terkumpul): punca = kehamilan, kekurangan protein plasma (albumin), jangkitan parasit cacing Brugia sp. melalui gigitan nyamuk (filariasis limfa), dan pesakit lumpuh/strok terlantar lama."],"labId":"bio410_limfa_kardio_lab","labTitle":"Simulator Bendalir Tisu-Limfa & Penyakit Kardiovaskular","labProps":{"tab":"limfa"},"examTip":"Bandingkan tepat Darah vs Bendalir Tisu vs Limfa (Jadual 10.7 & 10.8): Darah ada eritrosit, platelet & protein plasma; Bendalir tisu & Limfa TIADA ketiga-tiga itu, tetapi Limfa mengandungi kandungan lemak & limfosit yang lebih tinggi berbanding bendalir tisu!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Darah, Bendalir Tisu & Limfa","voiceCaption":"Kelaskan enam ciri dan komponen berikut kepada Darah (Plasma & Sel), Bendalir Tisu atau Limfa.","voiceScript":"[confident] Asingkan keenam-enam komponen dan ciri berikut mengikut Jadual sepuluh perpuluhan tujuh dan sepuluh perpuluhan lapan antara Darah dengan Bendalir Tisu atau Limfa!","prompt":"Isihkan ciri berikut kepada jenis bendalir tubuh yang tepat:","buckets":[{"id":"darah","label":"Darah"},{"id":"limfa","label":"Limfa & Bendalir Tisu"}],"items":[{"text":"Mengandungi protein plasma (fibrinogen, albumin, globulin), eritrosit dan platelet","bucketId":"darah","note":"Tepat! Molekul protein plasma, eritrosit dan platelet terlalu besar untuk menembusi dinding kapilari."},{"text":"Mengalir dalam salur tertutup bertekanan tinggi hasil pengepaman jantung","bucketId":"darah","note":"Betul! Darah dipam oleh jantung melalui arteri, kapilari dan vena."},{"text":"Terbentuk daripada baki 15% bendalir antara sel yang masuk ke kapilari berhujung buntu","bucketId":"limfa","note":"Tepat! Limfa dikumpulkan oleh kapilari limfa yang berhujung buntu."},{"text":"Tidak mengandungi eritrosit, platelet mahupun protein plasma bersaiz besar","bucketId":"limfa","note":"Betul! Kedua-dua bendalir tisu dan limfa tidak mengandungi komponen besar tersebut."},{"text":"Mengandungi kandungan lemak, bahan larut lemak (dari lakteal) dan limfosit yang tinggi","bucketId":"limfa","note":"Tepat! Ini membezakan limfa berbanding bendalir tisu biasa."},{"text":"Dikembalikan ke darah melalui duktus toraks (vena subklavia kiri) dan duktus limfa kanan","bucketId":"limfa","note":"Betul! Melengkapkan isipadu serta tekanan darah."}],"explanation":"Darah mengandungi eritrosit, platelet dan protein plasma; Bendalir tisu dan Limfa tiada kesemua itu, namun Limfa lebih kaya dengan lemak/vitamin larut lemak (dari lakteal) dan limfosit."},{"type":"match","xp":15,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Isu Kardiovaskular & Edema","voiceCaption":"Padankan lima penyakit sistem peredaran dan limfa berikut dengan punca tepatnya.","voiceScript":"[confident] Padankan lima penyakit kardiovaskular dan sistem limfa ini dengan punca patologi yang tepat!","prompt":"Padankan penyakit berikut dengan punca utamanya:","pairs":[{"id":"kv1","left":"Aterosklerosis","right":"Pembentukan plak kolesterol, lipid, tisu mati dan platelet tergumpal pada dinding arteri"},{"id":"kv2","left":"Arteriosklerosis","right":"Pemendapan kalsium pada plak menjadikan dinding arteri keras dan hilang kekenyalan"},{"id":"kv3","left":"Angina & Penginfarkan miokardium","right":"Arteri koronari menyempit (sakit dada) atau tersumbat penuh (serangan jantung)"},{"id":"kv4","left":"Filariasis limfa (Edema kaki)","right":"Jangkitan cacing parasit Brugia sp. melalui gigitan nyamuk menyumbat salur limfa"},{"id":"kv5","left":"Edema akibat kekurangan albumin","right":"Tekanan osmosis darah berkurang sehingga kurang air meresap semula ke hujung venul kapilari"}],"explanation":"Plak kolesterol menyebabkan aterosklerosis; kalsium menyebabkan arteriosklerosis; penyumbatan koronari mencetuskan angina/serangan jantung; Brugia sp. dan kekurangan albumin menyebabkan edema."}]},{"id":"bio410-u5","title":"Cabaran Boss SPM: Pengangkutan Manusia & Haiwan","subtitle":"Sintesis KBAT Kertas 1 & 2 — Derma Darah Kumpulan O ke B, Kebas Kaki Bersila, Pembalut Luka Kecemasan, Septum Tidak Lengkap & Arteri Koronari Tersumbat","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss SPM: Pendermaan Darah O kepada B","voiceCaption":"Jelaskan sama ada mangsa kemalangan kumpulan darah B selamat menerima darah daripada penderma kumpulan darah O.","voiceScript":"[excited] Cabaran Boss S P M Bab sepuluh bermula! Seorang mangsa kemalangan berkumpulan darah B memerlukan pemindahan darah segera. Adakah selamat baginya menerima darah kumpulan O?","prompt":"Seorang pesakit berkumpulan darah B memerlukan pemindahan darah kecemasan. Adakah selamat baginya menerima darah kumpulan O?","options":["Selamat — eritrosit penderma kumpulan O tidak mempunyai antigen A atau antigen B, maka antibodi anti-A dalam serum pesakit kumpulan B tidak menyebabkan pengaglutinatan","Tidak selamat — darah kumpulan O mempunyai antigen A yang menggumpal dengan anti-A pesakit B","Tidak selamat — kumpulan O hanya boleh menderma kepada kumpulan AB sahaja","Selamat — kerana darah kumpulan O tidak mempunyai sebarang eritrosit atau platelet"],"correctIndex":0,"explanation":"Darah kumpulan O ialah penderma universal kerana eritrositnya tiada antigen A atau B untuk diserang oleh antibodi anti-A atau anti-B penerima."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss SPM: Bayi Lahir Tanpa Septum Lengkap","voiceCaption":"Ramalkan kualiti darah di dalam aorta sekiranya dinding otot septum antara jantung kiri dan kanan gagal terbentuk lengkap.","voiceScript":"[curious] Soalan Praktis Sumatif sepuluh! Jika seorang bayi dilahirkan dengan dinding otot septum yang tidak terbentuk lengkap dan injap bikuspid tidak tertutup rapat, apakah kesan terhadap darah di dalam aorta?","hook":"Periksa peranan septum pada Anatomi Jantung 4 Ruang selepas menjawab!","scenario":"Seorang bayi dilahirkan dengan kecacatan kongenital pada septum yang meninggalkan bukaan antara ventrikel kiri dengan ventrikel kanan.","prompt":"Apakah akibatnya terhadap kandungan darah yang dipam masuk ke dalam aorta?","options":["Darah beroksigen daripada ventrikel kiri bercampur dengan darah terdeoksigen daripada ventrikel kanan; kandungan oksigen darah yang dihantar melalui aorta ke tisu badan berkurangan","Darah berhenti mengalir terus melalui arteri pulmonari ke peparu","Nodus sinoatrium bertukar menjadi injap trikuspid yang berlipat tiga","Tekanan darah dalam vena kava meningkat melebihi aorta"],"correctIndex":0,"proofLabId":"bio410_peredaran_jantung_lab","proofState":{"tab":"jantung"},"explanation":"Septum memisahkan bahagian kiri (beroksigen) dan kanan (terdeoksigen). Jika tidak lengkap, kedua-dua jenis darah bercampur dan mengurangkan kepekatan oksigen dalam aorta."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss SPM: Arteri vs Vena vs Kapilari","voiceCaption":"Kelaskan enam ciri struktur dan fungsi salur darah berikut kepada Arteri atau Vena & Kapilari.","voiceScript":"[confident] Cabaran ketiga Boss S P M! Kelaskan keenam-enam ciri salur darah mengikut Jadual sepuluh perpuluhan empat antara Arteri dengan Vena dan Kapilari.","prompt":"Isihkan ciri salur darah berikut mengikut kategorinya:","buckets":[{"id":"art","label":"Arteri"},{"id":"vk","label":"Vena & Kapilari"}],"items":[{"text":"Dinding tebal, berotot dan elastik dengan lumen kecil untuk menahan tekanan darah tinggi","bucketId":"art","note":"Tepat! Arteri mengembang dan mengecut menahan denyutan tekanan tinggi jantung."},{"text":"Mengangkut darah keluar dari jantung ke seluruh badan atau peparu (tiada injap kecuali injap sabit)","bucketId":"art","note":"Betul! Aorta dan arteri pulmonari mempunyai injap sabit di pangkalnya."},{"text":"Dinding setebal satu sel tanpa otot dan tanpa tisu elastik bagi pertukaran gas dan nutrien","bucketId":"vk","note":"Tepat! Ciri struktur kapilari darah."},{"text":"Lumen besar dengan dinding nipis, kurang berotot dan tekanan darah sangat rendah","bucketId":"vk","note":"Betul! Ciri struktur vena yang membawa darah kembali ke jantung."},{"text":"Mengandungi injap sehala di sepanjang salur untuk menghalang pengaliran balik darah","bucketId":"vk","note":"Tepat! Injap vena membantu aliran darah melawan graviti."},{"text":"Bercabang menjadi arteriol sebelum membentuk jaringan kapilari di tisu","bucketId":"art","note":"Betul! Arteri bercabang kepada arteriol untuk mengawal aliran darah ke kapilari."}],"explanation":"Arteri berdinding tebal/berotot/elastik, lumen kecil, tekanan tinggi, mengangkut darah keluar jantung; Kapilari setebal 1 sel; Vena berinjap sehala, lumen besar, tekanan amat rendah kembali ke jantung."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss SPM: Kesan Gaya Hidup & Kecemasan","voiceCaption":"Padankan empat kes Praktis Sumatif bab pengangkutan (rendang/nasi lemak, kebas kaki bersila, pembalut luka trombin & eritrosit rendah) dengan penjelasannya.","voiceScript":"[confident] Satu langkah lagi menuju kejayaan penuh Bab sepuluh! Padankan keempat-empat situasi Praktis Sumatif ini dengan penjelasan saintifiknya.","prompt":"Padankan situasi KBAT pengangkutan berikut dengan penjelasannya:","pairs":[{"id":"b101","left":"Kaki Ali kebas selepas duduk bersila selama 1 jam","right":"Aliran darah vena tersekat; berdiri/menggerakkan kaki membolehkan pengecutan otot rangka menolak darah ke jantung"},{"id":"b102","left":"Individu bilangan eritrosit rendah & diet pemulihan","right":"Anemia mengurangkan oksigen & ATP (cepat letih); perlu makan makanan kaya zat besi (bayam/hati/daging) untuk bina hem"},{"id":"b103","left":"Pengambilan rendang daging & nasi lemak berlebihan jangka panjang","right":"Tinggi lemak tepu & kolesterol mencetuskan plak aterosklerosis pada arteri koronari -> serangan jantung/strok"},{"id":"b104","left":"Penambahbaikan pembalut luka kecemasan hospital","right":"Salutan gentian fibrin, trombin atau ion Ca2+ pada pembalut mempercepatkan pembekuan darah menutup luka"}],"explanation":"Gerakan otot rangka mengepam darah vena kaki; zat besi membina gugus hem hemoglobin; lemak tepu memendapkan plak arteri; dan trombin/fibrin mempercepatkan pembekuan luka."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss SPM: Lemak Selepas Makan & Limfa","voiceCaption":"Jelaskan mengapa kepekatan lipid dalam limfa meningkat selepas makan berlemak dan kesannya jika salur limfa kaki tersumbat.","voiceScript":"[excited] Soalan penutup Boss S P M Bab sepuluh! Mengapakah peratus molekul lipid dalam salur limfa meningkat selepas makan makanan berlemak, dan apakah kesannya jika salur limfa di kaki tersumbat?","prompt":"Selepas makan makanan berlemak, kepekatan molekul lipid dalam salur limfa meningkat sebanyak 1%. Manakah penjelasan dan kesan penyumbatan salur limfa kaki yang tepat?","options":["Titisan lipid tidak dapat meresap ke kapilari darah vilus yang terlalu sempit dan hanya meresap ke dalam lakteal (kapilari limfa) menuju duktus toraks; jika salur limfa kaki tersumbat, bendalir tisu terkumpul di ruang antara sel menyebabkan kaki membengkak (edema)","Lipid diserap terus oleh vena portal hepar sebelum dipam oleh nodus limfa ke kaki","Penyumbatan salur limfa kaki meningkatkan tekanan darah arteri koronari secara langsung","Titisan lipid menukar eritrosit kepada fibrinogen di dalam kapilari limfa"],"correctIndex":0,"explanation":"Asid lemak dan gliserol berkondensasi membentuk titisan lipid di epitelium vilus lalu memasuki lakteal (kapilari limfa) ke duktus toraks; sekatan salur limfa menghalang pengembalian bendalir tisu menyebabkan edema."}]}]};</script>

(function () {
