/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab11","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":11,"title":"Keimunan Manusia","subtitle":"Subtopik 11.1-11.4 KSSM — Tiga Barisan Pertahanan, Lima Tindakan Antibodi, Keimunan Aktif & Pasif, Vaksin vs Antiserum serta Isu AIDS, SLE & MRSA.","estimatedMinutes":28,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t4-bab11-labs.js","coverIcon":"../assets/icons/bio411-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[warm] Tepat sekali! Pemahaman anda tentang sistem pertahanan badan amat cemerlang.","combo":"[excited] Hebat! Rantaian jawapan tepat berturut-turut membuktikan penguasaan konsep imunologi anda!","encourage":"[softly] Hampir tepat! Cuba imbas semula peranan antigen, fagosit, dan antibodi spesifik.","celebrate":"[cheerful] Tahniah! Anda berjaya menamatkan bab Keimunan Manusia dan melepasi Ujian Bos SPM!"},"units":[{"id":"bio411-u1","title":"Unit 1: Tiga Barisan Pertahanan Badan","subtitle":"Subtopik 11.1 — Definisi Keimunan/Antigen/Antibodi, Halangan Fizikal-Kimia, Keradangan & Fagositosis serta Limfosit T/B","iconType":"shield","iconUrl":"../assets/icons/bio411-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Benteng Tiga Barisan Pertahanan","voiceCaption":"Keimunan ialah keupayaan badan melawan jangkitan penyakit yang disebabkan oleh patogen melalui tiga barisan pertahanan.","voiceScript":"[warm] Selamat datang ke Bab Sebelas, Keimunan Manusia. Keimunan ialah keupayaan badan melawan jangkitan patogen secara serangan spesifik. Apabila zarah asing atau antigen memasuki badan, limfosit dirangsang menghasilkan protein khas bernama antibodi bagi membentuk tiga lapisan pertahanan badan!","title":"11.1 Pertahanan Badan: Barisan Pertama, Kedua & Ketiga","acronym":"F•K•S","hook":"Kulit dan asid perut ialah pengawal pintu pagar tak spesifik, manakala antibodi dan sel memori ialah unit elit spesifik!","mediaKey":"bio411_keimunan_antibodi","videoClip":{"src":"../assets/biologi-t4-bab11/video/bio411_video_keimunan_antibodi_narasi.mp4","hasNarration":true,"posterKey":"bio411_keimunan_antibodi","caption":"Video Penerangan Bersuara (BM): Tiga barisan pertahanan badan manusia, proses fagositosis dan tindakan spesifik antibodi"},"summary":"Patogen ialah mikroorganisma penyebab penyakit; antigen merangsang gerak balas keimunan supaya limfosit membebaskan antibodi spesifik.","bullets":["Definisi 11.1.1: Keimunan = keupayaan badan melawan jangkitan patogen (bakteria, virus, parasit) melalui serangan spesifik. Antigen = zarah asing yang merangsang tindak balas keimunan. Antibodi = protein pada permukaan limfosit atau dibebaskan ke dalam plasma darah untuk memusnahkan antigen.","Barisan Pertama (Tak Spesifik): Kulit (liat, pengelupasan sel mati, sebum berasid, peluh mengandungi enzim lisozim), membran mukus saluran respirasi + mukus berlisozim, air mata & air liur (lisozim), asid hidroklorik perut, serta mekanisme pembekuan darah pada luka.","Barisan Kedua (Tak Spesifik): Demam (tingkatkan aktiviti fagositosis), Keradangan (tisu rosak bebas histamin -> kapilari mengembang & telap kepada fagosit), Fagositosis (neutrofil & monosit mengepung, menelan & mencerna patogen guna lisozim).","Barisan Ketiga (Spesifik): Limfosit di nodus limfa (nodus membengkak ketika jangkitan; mengandungi makrofaj). Limfosit T menyerang sel terjangkit & merangsang Limfosit B menghasilkan sel memori untuk rembesan antibodi pantas pada serangan ulangan."],"labId":"bio411_barisan_pertahanan","labTitle":"Peneroka Tiga Barisan Pertahanan","labProps":{"layer":0},"examTip":"Bezakan lokasi lisozim: wujud dalam air mata, mukus hidung, air liur, peluh DAN di dalam fagosit untuk mencerna dinding sel bakteria!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Barisan Pertahanan Pertama","voiceCaption":"Padankan komponen barisan pertahanan pertama dengan mekanisme perlindungannya.","voiceScript":"[curious] Sekarang, cuba padankan setiap struktur dalam barisan pertahanan pertama dengan mekanisme perlindungannya yang tepat!","prompt":"Padankan komponen barisan pertahanan pertama berikut dengan cara tindakannya:","pairs":[{"id":"b1","left":"Kulit & pengelupasan sel mati","right":"Halangan fizikal liat dan menyingkirkan mikroorganisma di permukaan"},{"id":"b2","left":"Sebum & asid hidroklorik perut","right":"Mewujudkan keadaan berasid yang membunuh atau merencat bakteria"},{"id":"b3","left":"Air mata, mukus & peluh","right":"Mengandungi enzim lisozim yang mengurai dinding sel bakteria"},{"id":"b4","left":"Pembekuan darah","right":"Menutup luka serta-merta bagi menyekat kemasukan bakteria"}],"explanation":"Barisan pertama menggabungkan halangan fizikal (kulit, pembekuan darah) dan kimia (sebum, HCl, lisozim) secara tak spesifik."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Peranan Histamin","voiceCaption":"Ramalkan kesan pembebasan histamin daripada tisu kulit yang cedera semasa gerak balas keradangan.","voiceScript":"[curious] Apabila jari tertusuk duri, kawasan luka memerah dan bengkak. Mengapakah histamin menyebabkan tindak balas keradangan tersebut?","hook":"Semak tab Barisan 2 untuk mekanisme keradangan selepas menjawab!","scenario":"Tisu kulit yang cedera dijangkiti bakteria lalu membebaskan histamin pada peringkat awal jangkitan.","prompt":"Apakah kesan langsung pembebasan histamin dalam gerak balas keradangan?","options":["Mengembangkan kapilari darah dan meningkatkan kebolehtelapan kapilari kepada fagosit serta faktor pembeku","Merangsang sel memori menghasilkan antibodi kekal dalam masa satu minit","Menurunkan suhu badan secara mendadak untuk melumpuhkan enzim","Menukarkan asid hidroklorik kepada sebum di permukaan kulit"],"correctIndex":0,"proofLabId":"bio411_barisan_pertahanan","proofState":{"layer":1},"explanation":"Histamin menyebabkan kapilari mengembang (lebih banyak darah mengalir -> merah & panas) dan lebih telap supaya fagosit seperti neutrofil dan monosit berkumpul memusnahkan bakteria."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Urutan Tiga Barisan","voiceCaption":"Susun urutan peristiwa apabila patogen menembusi kulit hingga pengaktifan limfosit.","voiceScript":"[confident] Susun empat peringkat ini mengikut urutan perjalanan patogen menembusi barisan pertama hingga barisan ketiga!","prompt":"Susun fasa pertahanan badan mengikut urutan apabila luka dijangkiti patogen:","hint":"Bermula dengan penembusan kulit, diikuti keradangan/fagositosis, dan berakhir dengan gerak balas spesifik.","answerTokens":["Penembusan Kulit","Pembebasan Histamin","Fagositosis oleh Neutrofil","Penghasilan Antibodi & Sel Memori"],"distractors":["Rembesan Asid Perut","Suntikan Antiserum"],"explanation":"Apabila barisan pertama (kulit) ditembusi, barisan kedua (histamin -> keradangan -> fagositosis) bertindak sebelum barisan ketiga (limfosit menghasilkan antibodi & sel memori)."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s5","voiceToneLabel":"Limfosit T, B & Sel Memori","voiceCaption":"Kenal pasti peranan limfosit T, limfosit B dan sel memori dalam barisan pertahanan ketiga.","voiceScript":"[warm] Mengapakah nodus limfa membengkak ketika jangkitan dan apakah fungsi sel memori?","prompt":"Pernyataan manakah paling tepat menerangkan peranan limfosit dalam barisan pertahanan ketiga?","options":["Limfosit T menyerang sel terjangkit dan merangsang limfosit B menghasilkan sel memori untuk penghasilan antibodi pantas apabila diserang patogen sama kelak","Limfosit B menghasilkan histamin manakala sel memori mencerna bakteria menggunakan HCl","Satu jenis antibodi boleh bergabung secara bebas dengan semua jenis antigen","Nodus limfa membengkak kerana ketiadaan makrofaj di dalamnya"],"correctIndex":0,"explanation":"Tindakan antibodi adalah spesifik; nodus limfa mengandungi banyak limfosit dan makrofaj yang berkumpul memusnahkan antigen."}]},{"id":"bio411-u2","title":"Unit 2: Lima Mekanisme Tindakan Antibodi","subtitle":"Subtopik 11.2 — Pengaglutinan, Peneutralan, Pemendakan, Pengopsoninan & Penguraian (Lisis)","iconType":"atom","iconUrl":"../assets/icons/bio411-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Lima Tindakan Antibodi","voiceCaption":"Antibodi memusnahkan antigen asing melalui pengaglutinan, peneutralan, pemendakan, pengopsoninan dan penguraian.","voiceScript":"[warm] Dalam unit kedua ini, kita mendalami lima mekanisme tindakan antibodi terhadap antigen asing. Ada antibodi yang menggumpalkan kuman, meneutralkan toksin, memendakkan antigen terlarut, menandakan patogen untuk dimakan fagosit, atau terus memecahkan dinding sel bakteria!","title":"11.2 Lima Cara Antibodi Memusnahkan Antigen Asing","acronym":"A•N•P•O•L","hook":"Antibodi bukan memakan kuman sendiri — sebaliknya ia menyahaktifkan toksin, menggumpal, memendakkan, menanda atau melisiskan patogen!","summary":"Lima tindakan spesifik antibodi membantu meneutralkan toksin, memusnahkan bakteria atau memudahkan fagosit menelan antigen.","bullets":["Pengaglutinan: Antibodi menggumpalkan patogen supaya mudah diperangkap dan dimusnahkan oleh fagosit.","Peneutralan: Antibodi bergabung dengan toksin bakteria dan meneutralkan kesan toksin tersebut.","Pemendakan: Antibodi bertindak balas dengan antigen terlarut membentuk kompleks tidak larut (mendakan) yang mudah dimusnahkan fagosit.","Pengopsoninan: Antibodi bergabung dengan antigen dan bertindak sebagai penanda untuk pengecaman serta pemusnahan oleh fagosit.","Penguraian (Lisis): Antibodi bergabung dengan antigen lalu menyebabkan sel bakteria pecah dan terurai."],"labId":"bio411_tindakan_antibodi","labTitle":"Simulator 5 Tindakan Antibodi","labProps":{"modeIndex":0},"examTip":"Jangan tertukar Pemendakan (antigen TERLARUT menjadi mendakan pepejal) dengan Pengaglutinan (sel PATOGEN bergumpal bersama)!"},{"type":"match","xp":15,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 5 Tindakan Antibodi","voiceCaption":"Padankan pengaglutinan, peneutralan, pemendakan, pengopsoninan dan penguraian dengan kesannya.","voiceScript":"[curious] Uji ingatan anda dengan memadankan lima mekanisme tindakan antibodi ini dengan penerangan biologi yang tepat.","prompt":"Padankan setiap tindakan antibodi berikut dengan kesannya ke atas antigen:","pairs":[{"id":"ab1","left":"Pengaglutinan","right":"Menggumpalkan patogen agar mudah diperangkap fagosit"},{"id":"ab2","left":"Peneutralan","right":"Mengikat dan menyahaktifkan molekul toksin bakteria"},{"id":"ab3","left":"Pemendakan","right":"Membentuk kompleks mendakan tidak larut daripada antigen terlarut"},{"id":"ab4","left":"Pengopsoninan","right":"Bertindak sebagai penanda di permukaan antigen untuk fagosit"},{"id":"ab5","left":"Penguraian (Lisis)","right":"Memecahkan dan menguraikan sel bakteria secara langsung"}],"explanation":"Kelima-lima tindakan ini memastikan antigen sama ada dimusnahkan terus atau mudah ditelan fagosit."},{"type":"sort","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Isih Sasaran Antibodi","voiceCaption":"Kelaskan tindakan antibodi mengikut sama ada ia memusnahkan/menyahaktifkan terus atau memudahkan fagositosis.","voiceScript":"[confident] Asingkan lima tindakan antibodi ini mengikut hasil akhirnya sama ada menyahaktifkan terus atau membantu fagosit menelan sasaran!","prompt":"Isihkan mekanisme tindakan antibodi berikut kepada dua kategori kesan:","buckets":[{"id":"fag","label":"Memudahkan Tangkapan Fagosit"},{"id":"terus","label":"Menyahaktifkan / Memecah Terus"}],"items":[{"text":"Pengaglutinan (menggumpalkan sel patogen)","bucketId":"fag","note":"Gumpalan patogen menjadi sasaran mudah untuk fagosit."},{"text":"Pemendakan (antigen terlarut menjadi mendakan)","bucketId":"fag","note":"Mendakan tidak larut mudah dimusnahkan fagosit."},{"text":"Pengopsoninan (penanda permukaan patogen)","bucketId":"fag","note":"Penanda antibodi membantu fagosit mengecam antigen."},{"text":"Peneutralan (mengikat toksin bakteria)","bucketId":"terus","note":"Toksin dinyahaktifkan serta-merta oleh pengikatan antibodi."},{"text":"Penguraian / Lisis (memecahkan bakteria)","bucketId":"terus","note":"Bakteria dipecah dan diuraikan secara langsung."}],"explanation":"Pengaglutinan, pemendakan dan pengopsoninan menyediakan sasaran bagi fagosit, manakala peneutralan dan lisis menyahaktifkan atau memecahkan sasaran terus."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Tindakan Terhadap Toksin","voiceCaption":"Ramalkan mekanisme antibodi bagi meneutralkan racun eksotoksin terlarut daripada bakteria tetanus.","voiceScript":"[curious] Bayangkan bakteria tetanus merembeskan toksin berbahaya ke dalam darah. Mekanisme antibodi manakah menyahaktifkan toksin tersebut secara langsung?","hook":"Lihat animasi Peneutralan pada Simulator 5 Tindakan Antibodi!","scenario":"Bakteria tetanus membebaskan molekul toksin bebas yang cuba mengikat sel saraf dan otot.","prompt":"Mekanisme tindakan antibodi manakah menyahaktifkan toksin bakteria tersebut secara langsung?","options":["Peneutralan — antibodi mengikat toksin dan meniadakan kesan racunnya","Lisis — antibodi memecahkan dinding sel toksin tersebut","Fagositosis — antibodi menelan toksin seperti makrofaj","Pengaglutinan — antibodi menyatukan eritrosit menjadi bekuan"],"correctIndex":0,"proofLabId":"bio411_tindakan_antibodi","proofState":{"modeIndex":1},"explanation":"Peneutralan menyekat tapak aktif toksin; toksin ialah molekul kimia tanpa dinding sel untuk dilisiskan."}]},{"id":"bio411-u3","title":"Unit 3: Jenis Keimunan & Graf Imunisasi","subtitle":"Subtopik 11.3 — Keimunan Aktif vs Pasif (Semula Jadi & Buatan), Vaksin Salk/BCG/HPV & Antiserum","iconType":"flask","iconUrl":"../assets/icons/bio411-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Aktif vs Pasif & Graf Antibodi","voiceCaption":"Keimunan aktif menghasilkan antibodi sendiri melalui limfosit manakala keimunan pasif menerima antibodi siap sedia daripada sumber luar.","voiceScript":"[warm] Unit ketiga membincangkan perbandingan penting dalam S-P-M iaitu keimunan aktif berbanding keimunan pasif. Dalam keimunan aktif, limfosit badan sendiri menghasilkan antibodi, sama ada secara semula jadi selepas sembuh daripada jangkitan seperti cacar air, atau secara buatan melalui suntikan vaksin seperti vaksin Salk, B-C-G dan H-P-V. Sebaliknya, keimunan pasif diperoleh daripada sumber luar seperti antibodi ibu melalui plasenta atau kolostrum, ataupun suntikan antiserum bagi rawatan segera!","title":"11.3 Empat Jenis Keimunan & Perbandingan Vaksin vs Antiserum","acronym":"V•A•B•P","hook":"Vaksin mencegah sebelum sakit dengan membina sel memori; Antiserum merawat kecemasan dengan membekalkan antibodi sedia ada!","mediaKey":"bio411_vaksin_imunisasi","summary":"Keimunan aktif kekal lama kerana penghasilan sel memori, sedangkan keimunan pasif bertindak serta-merta tetapi sementara.","bullets":["Keimunan Aktif: Semula Jadi (sembuh dari penyakit cth. cacar air / influenza; sel memori bertindak pantas pada serangan kedua). Buatan / Imunisasi (suntikan VAKSIN: ampaian patogen dilemahkan, mati atau tak virulen cth. Salk poliomielitis, BCG batuk kering, HPV kanser serviks). Suntikan 1 -> aras antibodi rendah (< aras keimunan); Dos Penggalak (2) -> melonjak melepasi aras keimunan.","Keimunan Pasif: Semula Jadi (antibodi ibu merentas plasenta ke fetus & kolostrum susu ibu pada bulan awal bayi). Buatan (suntikan ANTISERUM: serum antibodi spesifik cth. antitetanus, antirabies, antibisa ular). Perlindungan SERTA-MERTA tetapi SEMENTARA; suntikan kedua hanya jika aras antibodi jatuh dan pesakit masih dijangkiti."],"labId":"bio411_graf_keimunan","labTitle":"Simulator Graf Vaksin vs Antiserum","labProps":{"mode":"active"},"examTip":"Soalan klasik: Mengapakah lengkung keimunan pasif menurun? Kerana antibodi luar diuraikan mengikut masa dan tiada sel memori dibentuk!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan 4 Kategori Keimunan","voiceCaption":"Padankan situasi klinikal dengan kategori keimunan aktif/pasif semula jadi dan buatan.","voiceScript":"[curious] Kelaskan empat situasi klinikal ini kepada jenis keimunan aktif atau pasif, semula jadi atau buatan.","prompt":"Padankan situasi berikut dengan jenis keimunan yang tepat:","pairs":[{"id":"im1","left":"Individu sembuh daripada cacar air","right":"Keimunan aktif semula jadi (sel memori kekal terbentuk)"},{"id":"im2","left":"Pelajar diberi suntikan vaksin HPV atau BCG","right":"Keimunan aktif buatan (patogen lemah merangsang limfosit)"},{"id":"im3","left":"Bayi menerima antibodi melalui plasenta & kolostrum","right":"Keimunan pasif semula jadi (antibodi ibu lindungi bayi)"},{"id":"im4","left":"Mangsa luka paku berkarat disuntik antitetanus","right":"Keimunan pasif buatan (antibodi sedia ada bertindak segera)"}],"explanation":"Aktif = badan sendiri bina antibodi; Pasif = antibodi luar; Semula jadi = tanpa suntikan perubatan; Buatan = suntikan vaksin atau antiserum."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Rawatan Patukan Ular","voiceCaption":"Tentukan suntikan kecemasan yang sesuai bagi individu yang dipatuk ular berbisa.","voiceScript":"[serious] Seorang petani dipatuk ular kapak di kebun dan dibawa ke hospital. Mengapakah doktor mesti menyuntik antiserum dan bukannya vaksin?","hook":"Bandingkan kelajuan tindak balas awal pada graf Simulator Vaksin vs Antiserum!","scenario":"Seorang mangsa baru sahaja dipatuk ular sangat berbisa dan memerlukan perlindungan segera sebelum bisa melumpuhkan organ.","prompt":"Apakah rawatan paling tepat dan rasionalnya?","options":["Suntikan antiserum antibisa untuk membekalkan antibodi spesifik secara terus supaya bisa dineutralkan serta-merta (keimunan pasif buatan)","Suntikan vaksin bisa lemah supaya sel memori sempat dibentuk dalam beberapa minggu","Menunggu badan menghasilkan keimunan aktif semula jadi terlebih dahulu","Memberikan susu kolostrum kepada mangsa dewasa"],"correctIndex":0,"proofLabId":"bio411_graf_keimunan","proofState":{"mode":"passive"},"explanation":"Vaksin mengambil masa terlalu lama untuk merangsang penghasilan antibodi, sedangkan antiserum memberikan perlindungan serta-merta."},{"type":"mcq","xp":15,"voiceIdKey":"u3-s4","voiceToneLabel":"Penurunan Aras Antibodi Pasif","voiceCaption":"Jelaskan punca aras antibodi dalam keimunan pasif menurun mengikut masa.","voiceScript":"[curious] Mengapakah aras antibodi keimunan pasif menurun dari semasa ke semasa berbanding keimunan aktif?","prompt":"Selepas suntikan antiserum pertama, aras antibodi dalam darah menurun semula selepas beberapa minggu. Mengapakah ini berlaku?","options":["Antibodi luar yang disuntik terurai secara semula jadi dan limfosit pesakit tidak terangsang membentuk sel memori untuk menghasilkan antibodi baharu","Semua limfosit pesakit dimusnahkan oleh antiserum selepas seminggu","Antiserum menukarkan semua antigen menjadi glikogen","Suntikan antiserum hanya merangsang barisan pertahanan pertama"],"correctIndex":0,"explanation":"Dalam keimunan pasif, badan tidak menghasilkan antibodi sendiri dan tiada sel memori dibentuk."}]},{"id":"bio411-u4","title":"Unit 4: Isu Kesihatan Imun (AIDS, SLE, Alahan & MRSA)","subtitle":"Subtopik 11.4 — Penularan HIV/AIDS, Autoimun SLE, Alahan, Pematuhan Antibiotik & Pencegahan MRSA","iconType":"biohazard","iconUrl":"../assets/icons/bio411-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"HIV/AIDS, SLE, Alahan & MRSA","voiceCaption":"HIV membiak dalam limfosit lalu melumpuhkan keimunan menjadi AIDS selepas 8 hingga 10 tahun. Kenali juga SLE, alahan serta langkah kawalan MRSA.","voiceScript":"[warm] Unit keempat merangkumi isu kesihatan berkaitan keimunan manusia. Virus H-I-V membiak di dalam limfosit dan memusnahkannya secara progresif sehingga membawa kepada sindrom kurang daya tahan melawan penyakit atau AIDS. Selain itu, kita juga meneliti penyakit autoimun S-L-E, reaksi alahan, dan mengapa pesakit mesti menghabiskan dos antibiotik bagi mencegah bakteria rintang seperti M-R-S-A!","title":"11.4 Gangguan Sistem Imun & Pematuhan Antibiotik","acronym":"H•S•A•M","hook":"Pengidap HIV belum tentu terus menghidap AIDS pada awal jangkitan — tetapi berhenti makan antibiotik lebih awal boleh melahirkan bakteria super rintang seperti MRSA!","summary":"HIV melumpuhkan limfosit dalam tempoh 8–10 tahun; SLE dan alahan ialah gangguan imun; habiskan preskripsi antibiotik mencegah strain rintang MRSA.","bullets":["HIV & AIDS: Virus Kurang Daya Tahan Manusia (HIV) memusnahkan limfosit secara progresif; gejala AIDS (cirit-birit kronik, jangkitan kulat) hanya jelas selepas 8–10 tahun hingga sistem imun lumpuh dan pesakit maut akibat jangkitan lain.","Penularan HIV & Pencegahan Ibu-Bayi: Melalui pemindahan bendalir badan (darah, semen), seks tanpa perlindungan, perkongsian jarum tercemar (dadah/tatu), pemindahan darah, serta dari ibu kepada fetus/bayi (plasenta, kelahiran, penyusuan — namun boleh dicegah dengan rawatan perubatan semasa hamil & bersalin).","SLE & Alahan: Systemic Lupus Erythematosus (SLE) = penyakit autoimun apabila antibodi menyerang sel sihat sendiri; Alahan = gerak balas imun berlebihan terhadap alergen.","Pematuhan Antibiotik & MRSA: Habiskan semua antibiotik mengikut preskripsi untuk membasmi semua bakteria supaya bakteria rintang (seperti MRSA di hospital) tidak terseleksi dan membiak."],"labId":"bio411_galeri_imun","labTitle":"Galeri Mikrograf & Klinikal Imunologi","labProps":{},"examTip":"Praktis Sumatif Q7-8: Sentiasa kaitkan keengganan menghabiskan antibiotik dengan kemandirian bakteria mutan rintang antibiotik seperti MRSA!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Tempoh Pendam HIV","voiceCaption":"Jelaskan mengapa seseorang yang dijangkiti HIV tidak semestinya terus menghidap AIDS pada tahun pertama jangkitan.","voiceScript":"[curious] Mengapakah individu yang positif H-I-V tidak semestinya terus menghidap AIDS pada tahun pertama jangkitan?","hook":"Bandingkan bilangan limfosit pada fasa awal berbanding tahun ke-8 hingga ke-10!","scenario":"Ujian darah mengesan kehadiran HIV dalam badan seorang pesakit tetapi beliau belum menunjukkan cirit-birit kronik atau jangkitan kulat.","prompt":"Mengapakah penghidap HIV tidak semestinya menghidap AIDS serta-merta?","options":["HIV memusnahkan limfosit secara berperingkat selama 8 hingga 10 tahun; selagi sistem imun belum lumpuh sepenuhnya dan rawatan diambil, gejala AIDS belum muncul","HIV hanya memusnahkan eritrosit dan tidak menyerang sistem imun","HIV berubah menjadi bakteria tidak berbahaya selepas tiga bulan","Sistem imun menghasilkan vaksin semula jadi untuk menghapuskan HIV"],"correctIndex":0,"proofLabId":"bio411_galeri_imun","proofState":{},"explanation":"Pemusnahan limfosit berlaku secara progresif dan simptom AIDS hanya kelihatan selepas beberapa tahun apabila sistem keimunan menjadi sangat lemah."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Faktor Rintangan MRSA","voiceCaption":"Susun urutan punca tercetusnya rintangan bakteria apabila pesakit berhenti makan antibiotik terlalu awal.","voiceScript":"[confident] Susun langkah bagaimana penghentian antibiotik sebelum tempoh tamat membawa kepada strain bakteria rintang seperti MRSA!","prompt":"Susun urutan peristiwa yang menyebabkan kemunculan strain bakteria rintang antibiotik:","hint":"Bermula dengan dos tidak dihabiskan sehingga bakteria rintang membiak dominan.","answerTokens":["Berhenti Antibiotik Awal","Sebahagian Bakteria Terselamat","Mutasi & Rintangan Terbina","Pembiakan Strain MRSA"],"distractors":["Suntikan Antiserum","Pengaglutinan Sel"],"explanation":"Menghabiskan keseluruhan kursus antibiotik membunuh kesemua bakteria patogen sebelum sempat beradaptasi menjadi strain rintang seperti MRSA."},{"type":"mcq","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Pencegahan MRSA di Hospital","voiceCaption":"Kenal pasti langkah pencegahan terbaik mengelak jangkitan MRSA semasa melawat pesakit di hospital.","voiceScript":"[focused] Semasa melawat rakan di wad hospital, langkah pencegahan manakah paling berkesan mengelakkan jangkitan bakteria MRSA?","prompt":"Apakah amalan pencegahan terbaik semasa melawat pesakit di hospital untuk mengelakkan jangkitan MRSA?","options":["Membasuh tangan dengan sabun atau pensanitasi antiseptik sebelum dan selepas melawat serta mengelak sentuhan luka atau alat perubatan pesakit","Memakan antibiotik milik pesakit lain sebelum memasuki wad hospital","Mendapatkan suntikan antitetanus sebelum melawat wad","Menanggalkan pelitup muka berhampiran pesakit batuk"],"correctIndex":0,"explanation":"Kebersihan tangan yang ketat dan mengawal sentuhan luka mengurangkan penularan silang strain MRSA di hospital."}]},{"id":"bio411-u5","title":"Unit 5: Ujian Bos SPM — Keimunan Manusia","subtitle":"Cabaran Sumatif Kertas 1 & Kertas 2 Biologi Bab 11 (Kes Sinti & Aziman)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Taklimat Bos Imunologi SPM","voiceCaption":"Ujian Bos Bab Sebelas menyepadukan analisis graf vaksin lawan antiserum serta kes Sinti dan Aziman.","voiceScript":"[excited] Tahniah kerana sampai ke Ujian Bos S-P-M Bab Sebelas! Dalam pusingan akhir ini, anda perlu menyepadukan analisis graf vaksin lawan antiserum, membezakan lima tindakan antibodi, serta menjawab kes klinikal Sinti yang terlepas dos ketiga hepatitis dan Aziman yang terpijak paku berkarat!","title":"Sintesis Esei & Graf Imunisasi Kertas 2 SPM","acronym":"BOS•11","hook":"Dalam soalan graf imunisasi SPM, wajib nyatakan kedudukan lengkung terhadap ARAS KEIMUNAN dan peranan SEL MEMORI!","summary":"Vaksin membina keimunan aktif buatan jangka panjang melalui dos penggalak; antiserum membekalkan antibodi segera bagi luka kecemasan.","bullets":["Kes Sinti (Sumatif Q6b): Vaksin hepatitis memerlukan dos penggalak (dos ke-2 & ke-3) supaya aras antibodi melonjak melepasi aras keimunan; jika terlepas dos ke-3, keimunan kekal di bawah aras perlindungan optimum.","Kes Aziman (Sumatif Q6b-iii): Terpijak paku berkarat memerlukan suntikan ANTISERUM ANTITETANUS untuk perlindungan serta-merta menentang toksin tetanus."],"labId":"bio411_graf_keimunan","labTitle":"Bukti Graf Keimunan (Vaksin vs Antiserum)","labProps":{"mode":"active"},"examTip":"Sentiasa sebut sama ada seseorang dirawat SEBELUM dijangkiti (vaksin pencegahan) atau SELEPAS tercedera/dijangkiti (antiserum rawatan segera)."},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Kes Sinti: Terlepas Dos Vaksin","voiceCaption":"Ramalkan kesan keimunan Sinti yang terlepas dos ketiga vaksin hepatitis.","voiceScript":"[curious] Soalan klasik buku teks: ibu Sinti terlupa membawanya menerima dos ketiga vaksin hepatitis. Apakah kesan langsung terhadap perlindungan dirinya?","hook":"Rujuk garisan merah Aras Keimunan pada Simulator Graf!","scenario":"Sinti terlepas jadual suntikan dos ketiga (dos penggalak) vaksin hepatitis yang sepatutnya diterima di klinik.","prompt":"Apakah kesan terhadap tahap keimunan Sinti apabila terlepas dos penggalak ketiga tersebut?","options":["Kepekatan antibodi kekal rendah di bawah aras keimunan, jadi Sinti tidak mendapat perlindungan jangka panjang sepenuhnya daripada jangkitan hepatitis","Badan Sinti terus bertukar menjadi keimunan pasif semula jadi selama seumur hidup","Antibodi dos pertama akan menyebabkan penyakit autoimun SLE serta-merta","Sel memori akan terus hilang selepas satu hari"],"correctIndex":0,"proofLabId":"bio411_graf_keimunan","proofState":{"mode":"active"},"explanation":"Dos penggalak diperlukan untuk merangsang sel memori menghasilkan antibodi dengan banyak sehingga melepasi aras keimunan."},{"type":"sort","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Banding Vaksin vs Antiserum","voiceCaption":"Isihkan ciri keimunan aktif buatan (vaksin) berbanding keimunan pasif buatan (antiserum).","voiceScript":"[confident] Kelaskan enam ciri perbandingan utama antara suntikan vaksin dengan suntikan antiserum mengikut Jadual K-S-S-M!","prompt":"Isihkan ciri perbandingan berikut antara Vaksin (Aktif Buatan) dan Antiserum (Pasif Buatan):","buckets":[{"id":"vak","label":"Vaksin (Aktif Buatan)"},{"id":"ant","label":"Antiserum (Pasif Buatan)"}],"items":[{"text":"Mengandungi ampaian patogen dilemahkan, mati atau tak virulen","bucketId":"vak","note":"Vaksin merangsang limfosit menghasilkan antibodi sendiri."},{"text":"Mengandungi serum antibodi spesifik sedia ada","bucketId":"ant","note":"Antiserum membekalkan antibodi dari sumber luar."},{"text":"Diberikan sebelum dijangkiti untuk tujuan pencegahan jangka panjang","bucketId":"vak","note":"Perlindungan mengambil masa tetapi kekal lama."},{"text":"Diberikan untuk rawatan serta-merta dengan tempoh perlindungan sementara","bucketId":"ant","note":"Kesan segera tetapi merosot apabila antibodi terurai."}],"explanation":"Vaksin = pencegahan awal jangka panjang; Antiserum = rawatan kecemasan serta-merta jangka pendek."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Urutan Tindak Balas Vaksinasi","voiceCaption":"Susun rantaian tindak balas imunisasi daripada dos pertama hingga serangan patogen sebenar.","voiceScript":"[warm] Susun empat peringkat mekanisme keimunan aktif buatan selepas seseorang lengkap menerima jadual vaksinasi!","prompt":"Susun urutan tindak balas badan daripada suntikan vaksin pertama hingga jangkitan patogen sebenar:","hint":"Bermula daripada dos 1, dos penggalak melebihi aras keimunan, hingga tindakan pantas sel memori.","answerTokens":["Vaksin Pertama Rangsang Limfosit","Dos Penggalak Lepasi Aras Keimunan","Sel Memori Kecam Patogen Sebenar","Antibodi Dihasilkan Pantas Memusnahkan Patogen"],"distractors":["Histamin Menyebabkan Bengkak","Penurunan Paras Antibodi Serta-Merta"],"explanation":"Sel memori yang terbentuk semasa vaksinasi memastikan tindak balas antibodi sekunder jauh lebih cepat dan tinggi apabila diserang patogen sebenar."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Soalan Akhir Bos: Kes Aziman","voiceCaption":"Pilih jenis suntikan paling sesuai untuk Aziman yang terpijak paku berkarat semasa mendaki gunung.","voiceScript":"[excited] Soalan penutup Bab Sebelas! Semasa ekspedisi mendaki gunung, Aziman terpijak paku berkarat. Pilih jawapan lengkap bertaraf skema jawapan S-P-M!","prompt":"Aziman terpijak paku berkarat semasa mendaki gunung. Apakah suntikan paling sesuai yang perlu diberikan oleh doktor dan rasionalnya?","options":["Suntikan antiserum antitetanus untuk memberi keimunan pasif buatan dengan membekalkan antibodi sedia ada bagi meneutralkan toksin tetanus serta-merta","Suntikan vaksin BCG untuk merangsang sel memori menentang tetanus selepas enam bulan","Suntikan insulin untuk membekukan darah pada tapak luka paku","Pemberian vitamin C sahaja tanpa rawatan antibodi"],"correctIndex":0,"explanation":"Syabas! Luka paku berkarat berisiko tinggi terhadap bakteria Clostridium tetani; suntikan antitetanus memberi perlindungan serta-merta sebelum toksin merosakkan saraf."}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
