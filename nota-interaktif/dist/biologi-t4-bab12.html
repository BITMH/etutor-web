/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab12","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":12,"title":"Koordinasi dan Gerak Balas dalam Manusia","subtitle":"Subtopik 12.1-12.7 KSSM — Reseptor Deria, Otak & Saraf Tunjang, Neuron & Sinaps, Arka Refleks 2/3 Neuron, Sistem Endokrin, Situasi Cemas & Isu Kesihatan.","estimatedMinutes":32,"themeAccent":"#4f46e5","isFreePreview":false,"labScript":"biologi-t4-bab12-labs.js","coverIcon":"../assets/icons/bio412-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[warm] Tepat sekali! Laluan impuls saraf dan hormon anda betul-betul cekap!","combo":"[excited] Luar biasa! Rantaian jawapan tepat anda menunjukkan penguasaan penuh sistem koordinasi!","encourage":"[softly] Hampir berjaya! Semak semula peranan reseptor, sinaps, arka refleks, atau hormon sasaran.","celebrate":"[cheerful] Tahniah! Anda berjaya menamatkan bab Koordinasi dan Gerak Balas dalam Manusia!"},"units":[{"id":"bio412-u1","title":"Unit 1: Koordinasi, Reseptor Deria & Sistem Saraf","subtitle":"Subtopik 12.1 & 12.2 — Urutan Koordinasi, 6 Reseptor Deria, Otak (Serebrum/Serebelum/Medula/Hipotalamus/Pituitari), Saraf Tunjang & Periferi","iconType":"brain","iconUrl":"../assets/icons/bio412-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Laluan Koordinasi & Otak","voiceCaption":"Koordinasi melibatkan urutan rangsangan, reseptor, pusat integrasi, efektor dan gerak balas melalui sistem saraf pusat dan periferi.","voiceScript":"[warm] Selamat datang ke Bab Dua Belas! Keupayaan mengesan rangsangan luar seperti cahaya dan bunyi atau rangsangan dalam seperti suhu badan dan tekanan osmotik darah dikawal oleh lima komponen utama: rangsangan, reseptor, pusat integrasi, efektor dan gerak balas. Sistem saraf manusia terbahagi kepada sistem saraf pusat iaitu otak dan saraf tunjang, serta sistem saraf periferi yang merangkumi dua belas pasang saraf kranium dan tiga puluh satu pasang saraf spina!","title":"12.1 Komponen Koordinasi & 12.2 Sistem Saraf Pusat/Periferi","acronym":"R•R•P•E•G","hook":"Otak manusia mengandungi lebih 100 bilion neuron — setiap bahagiannya mempunyai tugas khusus daripada menyelesaikan matematik hingga memastikan kita bernafas semasa tidur!","mediaKey":"bio412_otak_endokrin","summary":"Reseptor menukar rangsangan kepada impuls saraf ke pusat integrasi (otak/saraf tunjang), lalu neuron motor menghantar arahan ke efektor (otot/kelenjar).","bullets":["Urutan Koordinasi & 6 Reseptor: Rangsangan -> Reseptor (Fotoreseptor: cahaya; Termoreseptor: suhu; Kemoreseptor: bahan kimia; Baroreseptor: tekanan; Mekanoreseptor: sentuhan/tekanan; Nosireseptor: sakit) -> Pusat Integrasi -> Efektor -> Gerak balas.","Bahagian Otak: Serebrum (terbesar & berlipat; tindakan terkawal, memori, bahasa, emosi), Hipotalamus (kawal homeostasis suhu/air/lapar & rembes GnRH mengawal pituitari), Serebelum (keseimbangan badan & koordinasi pengecutan otot), Kelenjar Pituitari (kelenjar induk endokrin), Medula Oblongata (tindakan luar kawal: degupan jantung, pernafasan, peristalsis, bersin, batuk, muntah).","Saraf Tunjang & Periferi: Saraf tunjang dikelilingi bendalir serebrospina; jirim kelabu bentuk-H (badan sel) dikelilingi jirim putih (akson bermielin) dengan akar dorsal & akar ventral. Periferi = 12 pasang saraf kranium + 31 pasang saraf spina (sistem saraf soma = terkawal; autonomi = luar kawal)."],"labId":"bio412_peta_otak_saraf","labTitle":"Atlas Interaktif Otak & Saraf Tunjang","labProps":{"partIndex":0},"examTip":"Jangan tertukar Serebrum (tindakan terkawal & kecerdasan), Serebelum (imbangan badan) dan Medula Oblongata (luar kawal seperti bersin & degupan jantung)!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan 6 Reseptor Deria","voiceCaption":"Padankan jenis reseptor deria dengan rangsangan yang dikesan.","voiceScript":"[curious] Setiap reseptor peka terhadap rangsangan khusus. Padankan jenis reseptor deria ini dengan rangsangan yang sepadan!","prompt":"Padankan jenis reseptor deria berikut dengan rangsangan yang dikesan:","pairs":[{"id":"rc1","left":"Fotoreseptor & Termoreseptor","right":"Mengesan cahaya serta perubahan suhu"},{"id":"rc2","left":"Kemoreseptor","right":"Mengesan bahan kimia seperti glukosa, CO2 dan bau"},{"id":"rc3","left":"Baroreseptor","right":"Mengesan perubahan tekanan (contoh: tekanan darah)"},{"id":"rc4","left":"Mekanoreseptor & Nosireseptor","right":"Mengesan sentuhan/tekanan mekanikal dan rangsangan sakit"}],"explanation":"Jadual 12.1 menyenaraikan enam reseptor utama untuk mengesan rangsangan luar dan dalam demi kemandirian organisma."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Laluan Menepuk Nyamuk","voiceCaption":"Susun urutan laluan koordinasi daripada gigitan nyamuk di kaki hingga gerak balas tangan menepuk.","voiceScript":"[confident] Berdasarkan Praktis Formatif dua belas perpuluhan satu: anda berasa gigitan nyamuk di kaki lalu menepuknya. Susun urutan koordinasinya!","prompt":"Susun laluan koordinasi daripada rangsangan gigitan nyamuk hingga gerak balas:","hint":"Ikuti urutan: Rangsangan -> Reseptor -> Pusat Integrasi -> Efektor -> Gerak Balas.","answerTokens":["Gigitan Nyamuk (Rangsangan)","Reseptor Menjana Impuls","Otak Mentafsir Impuls","Otot Tangan Menepuk (Efektor)"],"distractors":["Rembesan Insulin Pankreas","Ultraturasan Glomerulus"],"explanation":"Rangsangan luar dikesan oleh reseptor di kulit kaki, dihantar ke otak untuk ditafsirkan dan arahan dihantar melalui neuron motor ke otot tangan."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Kawalan Bersin (Medula Oblongata)","voiceCaption":"Kenal pasti bahagian otak yang mengawal bersin dan sebab kita tidak dapat menahannya.","voiceScript":"[warm] Soalan pengukuhan: mengapakah kita tidak dapat menahan bersin dan bahagian otak manakah yang mengawalnya?","prompt":"Apakah bahagian otak yang mengawal tindakan bersin, denyutan jantung, dan peristalsis?","options":["Medula oblongata; bersin ialah tindakan luar kawal yang berlaku secara automatik tanpa kawalan sedar serebrum","Serebelum; bersin hanya mengawal keseimbangan badan","Serebrum; bersin dikawal oleh sistem saraf soma secara sukarela","Kelenjar pituitari; bersin dicetuskan oleh hormon pertumbuhan"],"correctIndex":0,"explanation":"Medula oblongata mengawal tindakan luar kawal seperti bersin, batuk, muntah, menelan, pernafasan dan degupan jantung."}]},{"id":"bio412-u2","title":"Unit 2: Neuron & Penghantaran Impuls Merentasi Sinaps","subtitle":"Subtopik 12.3 — Neuron Deria, Geganti & Motor, Salut Mielin, Nodus Ranvier, Bonggol Sinaps & Neurotransmiter","iconType":"neuron","iconUrl":"../assets/icons/bio412-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Struktur Neuron & Mekanisme Sinaps","voiceCaption":"Neuron menghantar impuls elektrik di sepanjang akson bermielin dan melompat di nodus Ranvier, manakala sinaps memindahkan isyarat secara kimia sehala.","voiceScript":"[warm] Unit kedua meneroka struktur neuron deria, neuron geganti dan neuron motor serta rahsia sinaps! Dendrit menerima impuls ke badan sel, manakala akson membawa impuls keluar ke bonggol sinaps. Salut mielin melindungi neuron serta menebat impuls elektrik agar melompat pantas dari satu nodus Ranvier ke nodus berikutnya. Di sinaps pula, vesikel sinaps membebaskan neurotransmiter seperti asetilkolina secara kimia supaya impuls hanya bergerak dalam satu arah sahaja!","title":"12.3 Tiga Jenis Neuron & Penghantaran Kimia Sinaps","acronym":"D•B•A•S","hook":"Walaupun impuls di akson bergerak secepat kilat elektrik, pemindahan di celah sinaps lebih perlahan kerana ia berlaku secara kimia — namun inilah sebabnya isyarat saraf sentiasa sehala!","mediaKey":"bio412_neuron_sinaps","videoClip":{"src":"../assets/biologi-t4-bab12/video/bio412_video_koordinasi_saraf_narasi.mp4","hasNarration":true,"posterKey":"bio412_neuron_sinaps","caption":"Video Penerangan Bersuara (BM): Struktur neuron deria dan motor, penghantaran impuls saraf serta pemindahan kimia merentasi sinaps"},"summary":"Salut mielin menebat akson manakala nodus Ranvier mempercepatkan impuls secara lompatan; bonggol sinaps kaya mitokondria membebaskan neurotransmiter merentasi sinaps secara sehala.","bullets":["Struktur Neuron: Dendrit (terima impuls ke badan sel), Badan Sel (nukleus, integrasi isyarat), Akson (bawa impuls keluar), Salut Mielin (penebat elektrik, pelindung & pembekal nutrien), Nodus Ranvier (celahan tak bersalut mielin yang memecutkan aliran impuls secara lompatan).","Bonggol Sinaps & Penghantaran Sinaps: Bonggol sinaps mempunyai BANYAK MITOKONDRIA untuk menjana tenaga (ATP) serta vesikel sinaps berisi neurotransmiter (asetilkolina, noradrenalina, serotonin, dopamina).","Proses di Sinaps: Impuls elektrik tiba -> vesikel bebas neurotransmiter ke celah sinaps -> meresap & bergabung dengan protein reseptor spesifik pada dendrit neuron penerima -> menjana impuls elektrik baharu (sehala sahaja kerana vesikel hanya ada di bonggol sinaps dan reseptor hanya ada pada dendrit)."],"labId":"bio412_simulator_sinaps","labTitle":"Simulator Pemindahan Kimia Sinaps","labProps":{"stepIndex":0},"examTip":"Soalan Kertas 2 kegemaran: Mengapakah bonggol sinaps mengandungi banyak mitokondria? Untuk menjana tenaga (ATP) bagi penghantaran impuls / sintesis & pembebasan neurotransmiter!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Pemindahan Impuls Sinaps","voiceCaption":"Susun urutan proses penghantaran impuls merentasi celah sinaps.","voiceScript":"[confident] Susun empat langkah penghantaran impuls saraf merentasi celah sinaps mengikut turutan yang tepat!","prompt":"Susun turutan proses pemindahan impuls merentasi celah sinaps:","hint":"Bermula dengan ketibaan impuls elektrik di bonggol sinaps hingga penjanaan impuls baharu.","answerTokens":["Impuls Tiba di Bonggol Sinaps","Vesikel Bebaskan Neurotransmiter","Pengikatan pada Reseptor Dendrit","Impuls Elektrik Baharu Terjana"],"distractors":["Penghasilan Sel Memori","Pencerutan Salut Mielin"],"explanation":"Isyarat elektrik -> kimia (neurotransmiter merentas celah sinaps) -> elektrik semula pada neuron penerima secara sehala."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Ketiadaan Salut Mielin","voiceCaption":"Ramalkan kesannya jika suatu neuron tidak mempunyai salut mielin.","voiceScript":"[curious] Ramalkan kesannya jika neuron tidak mempunyai salut mielin seperti dalam penyakit sklerosis berganda!","hook":"Lihat kesan kerosakan salut mielin dan celah sinaps pada simulator!","scenario":"Tindak balas autoimun merosakkan salut mielin pada akson neuron penghantar di saraf tunjang.","prompt":"Apakah kesan langsung kepada penghantaran impuls apabila neuron kehilangan salut mielin?","options":["Penghantaran impuls menjadi perlahan, terganggu atau gagal sampai kerana kehilangan penebat elektrik dan lompatan di nodus Ranvier","Impuls bergerak sepuluh kali lebih laju tanpa rintangan","Bonggol sinaps akan menghasilkan hormon tiroksina","Neuron bertukar menjadi otot rangka secara automatik"],"correctIndex":0,"proofLabId":"bio412_simulator_sinaps","proofState":{"stepIndex":1},"explanation":"Salut mielin menebat impuls elektrik, membekalkan nutrien dan membolehkan lompatan impuls di nodus Ranvier."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Struktur Neuron & Sinaps","voiceCaption":"Asingkan komponen yang berfungsi mempercepatkan impuls di akson berbanding pemindahan sehala di sinaps.","voiceScript":"[warm] Asingkan struktur neuron ini antara komponen pengaliran di sepanjang akson dengan komponen pemindahan kimia di celah sinaps!","prompt":"Isihkan struktur berikut kepada pengaliran di sepanjang akson atau pemindahan di sinaps:","buckets":[{"id":"akson","label":"Sepanjang Akson (Elektrik)"},{"id":"sinaps","label":"Celah Sinaps (Kimia Sehala)"}],"items":[{"text":"Salut mielin (penebat elektrik & nutrien)","bucketId":"akson","note":"Melindungi dan menebat akson."},{"text":"Nodus Ranvier (lompatan impuls lebih pantas)","bucketId":"akson","note":"Mempercepat aliran impuls elektrik."},{"text":"Vesikel sinaps & Asetilkolina","bucketId":"sinaps","note":"Neurotransmiter kimia di bonggol sinaps."},{"text":"Protein reseptor spesifik pada dendrit penerima","bucketId":"sinaps","note":"Menjamin impuls hanya mengalir sehala."}],"explanation":"Salut mielin & nodus Ranvier mempercepat aliran elektrik sepanjang akson; vesikel neurotransmiter & reseptor mengawal pemindahan kimia sehala di sinaps."}]},{"id":"bio412-u3","title":"Unit 3: Tindakan Terkawal, Arka Refleks & Kesihatan Saraf","subtitle":"Subtopik 12.4 & 12.5 — Refleks 3 Neuron vs 2 Neuron (Sentakan Lutut), 8 Penyakit Saraf, Dadah & Alkohol","iconType":"zap","iconUrl":"../assets/icons/bio412-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Arka Refleks & Kesihatan Saraf","voiceCaption":"Tindakan refleks spina menghasilkan gerak balas pantas sama ada melalui 3 neuron atau 2 neuron (sentakan lutut) bagi mengelakkan kecederaan serius.","voiceScript":"[warm] Unit ketiga membincangkan tindakan terkawal yang diputuskan oleh korteks serebrum melalui sistem saraf soma, berbanding tindakan luar kawal oleh medula oblongata dan hipotalamus. Tindakan refleks spina pula ialah gerak balas pantas tanpa menunggu arahan otak bagi mengelakkan kecederaan serius, sama ada melalui arka refleks tiga neuron seperti menarik tangan daripada pin tajam, atau arka refleks dua neuron semasa ujian ketukan lutut!","title":"12.4 Arka Refleks 2/3 Neuron & 12.5 Gangguan Saraf","acronym":"3N•2N•D","hook":"Refleks spina menyelamatkan jari anda daripada terbakar sebelum otak sempat terasa sakit — dan membolehkan otak fokus kepada pemikiran aras tinggi!","summary":"Arka refleks 3 neuron melibatkan neuron geganti; refleks sentakan lutut melibatkan 2 neuron sahaja (deria -> motor). Dadah dan alkohol merosakkan koordinasi sinaps.","bullets":["Tindakan Terkawal vs Luar Kawal: Terkawal (sedar, sistem saraf soma, korteks serebrum, otot rangka) vs Luar Kawal (automatik tanpa sedar, sistem saraf autonomi, medula oblongata/hipotalamus, otot licin & kelenjar).","Arka Refleks 3 Neuron (Pin Tajam) vs 2 Neuron (Sentakan Lutut/Patela): 3 Neuron = Reseptor -> Neuron deria (akar dorsal) -> Neuron geganti (jirim kelabu saraf tunjang) -> Neuron motor (akar ventral) -> Otot rangka. 2 Neuron = Ketukan tendon bawah tempurung lutut meregangkan kuadriseps -> reseptor regangan -> Neuron deria bersinaps TERUS dengan Neuron motor -> kuadriseps mengecut menyentak kaki.","8 Penyakit Saraf (12.5): Sklerosis berganda (serang salut mielin), Alzheimer (lupa & bingung), Parkinson (anggota menggeletar & sukar seimbang), ALS/Lou Gehrig (kematian neuron motor), ADHD, Autisme, Lumpuh otak, Epilepsi.","Penyalahgunaan Dadah & Alkohol: Perangsang (tingkatkan aktiviti SSP -> euforia sementara lalu kemurungan), Penenang (lambatkan impuls saraf), Halusinogen (halusinasi), Narkotik (lambatkan fungsi normal otak), Alkohol (ganggu koordinasi, pemikiran & lambatkan impuls)."],"labId":"bio412_arka_refleks","labTitle":"Simulator Arka Refleks 2 Neuron vs 3 Neuron","labProps":{"arc":"3n"},"examTip":"Sentiasa perhatikan gambar rajah saraf tunjang SPM: Akar DORSAL (belakang) membawa neuron DERIA dan ada ganglion membengkak untuk badan selnya!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Arka Refleks Sentakan Lutut","voiceCaption":"Susun urutan pemindahan impuls dalam arka refleks sentakan lutut (2 neuron).","voiceScript":"[confident] Berdasarkan Praktis Formatif dua belas perpuluhan empat, susun urutan pemindahan impuls dalam arka refleks sentakan lutut!","prompt":"Susun urutan aliran impuls dalam tindakan refleks sentakan lutut (2 neuron):","hint":"Bermula dengan ketukan tendon di bawah tempurung lutut dan tiada neuron geganti terlibat.","answerTokens":["Tendon Lutut Diketuk & Kuadriseps Meregang","Neuron Deria Hantar Impuls","Sinaps Terus ke Neuron Motor","Kuadriseps Mengecut & Kaki Menyentak"],"distractors":["Neuron Geganti Mentafsir","Medula Oblongata Merembes Hormon"],"explanation":"Refleks sentakan lutut hanya melibatkan 2 neuron: neuron deria bersinaps secara langsung dengan neuron motor dalam saraf tunjang."},{"type":"match","xp":15,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Penyakit Saraf & Dadah","voiceCaption":"Padankan penyakit sistem saraf dan kesan dadah atau alkohol dengan puncanya.","voiceScript":"[curious] Padankan empat isu kesihatan saraf dan bahan kimia ini dengan ciri patologi atau kesannya!","prompt":"Padankan keadaan kesihatan saraf atau bahan berikut dengan huraian tepatnya:","pairs":[{"id":"ns1","left":"Sklerosis berganda","right":"Sistem imun merosakkan salut mielin otak dan saraf tunjang"},{"id":"ns2","left":"Penyakit Parkinson","right":"Pengecutan sistem saraf menyebabkan anggota menggeletar dan hilang imbangan"},{"id":"ns3","left":"ALS (Lou Gehrig)","right":"Kemerosotan dan kematian neuron motor yang mengawal otot"},{"id":"ns4","left":"Dadah penenang & Alkohol","right":"Melambatkan penghantaran impuls dan mengganggu koordinasi"}],"explanation":"Mengenal pasti punca selular (salut mielin, neuron motor, sinaps) ialah kunci soalan 12.5 KSSM."},{"type":"mcq","xp":15,"voiceIdKey":"u3-s4","voiceToneLabel":"KBAT: Sakit Anggota Dipotong","voiceCaption":"Jelaskan mengapa individu yang kehilangan kaki masih boleh berasa sakit di kawasan anggota yang telah dipotong.","voiceScript":"[curious] Soalan KBAT buku teks! Mengapakah individu yang kehilangan kaki masih merasakan sakit pada bahagian yang tiada lagi?","prompt":"Seseorang yang kehilangan sebelah kaki kadangkala masih merasakan kesakitan di tempat anggota yang telah dipotong. Mengapakah fenomena ini berlaku?","options":["Hujung neuron deria yang terputus di pangkal luka masih menjana impuls ke otak, lalu korteks serebrum mentafsirkannya seolah-olah berasal daripada kaki tersebut","Tulang yang tertinggal merembeskan adrenalina ke dalam darah","Refleks dua neuron berlaku tanpa sebarang sambungan ke neuron deria","Kelenjar pituitari mencipta saraf spina palsu di udara"],"correctIndex":0,"explanation":"Semua sensasi sakit ditafsir di korteks serebrum apabila impuls daripada laluan neuron deria kaki tersebut tiba di otak."}]},{"id":"bio412-u4","title":"Unit 4: Sistem Endokrin & Ketidakseimbangan Hormon","subtitle":"Subtopik 12.6 & 12.7 — Kelenjar Tanpa Duktus, Situasi Lawan atau Lari, serta 6 Gangguan Hormon","iconType":"flask","iconUrl":"../assets/icons/bio412-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Peta Hormon & Situasi Cemas","voiceCaption":"Kelenjar endokrin tanpa duktus merembes hormon terus ke aliran darah. Pelajari fungsi hormon utama, situasi cemas serta kesan ketidakseimbangan hormon.","voiceScript":"[warm] Unit keempat merungkai sistem endokrin! Kelenjar tanpa duktus merembeskan hormon terus ke aliran darah untuk merangsang tisu sasaran spesifik. Hipotalamus merembeskan G-n-R-H yang mengarahkan pituitari anterior merembes F-S-H, L-H, G-H, T-S-H dan A-C-T-H, sementara pituitari posterior merembes oksitosin dan A-D-H. Dalam situasi cemas apabila dikejar anjing misalnya, hipotalamus menghantar impuls terus ke medula adrenal untuk merembeskan adrenalina dan noradrenalina!","title":"12.6 Kelenjar Endokrin & 12.7 Ketidakseimbangan Hormon","acronym":"G•T•A•P•O","hook":"Satu titis hormon adrenalina dalam situasi cemas mampu menggerakkan jantung, peparu, hati dan otot rangka serentak dalam beberapa saat!","summary":"Setiap hormon hanya bertindak pada sel sasaran yang mempunyai reseptor membran spesifik untuk menyelaras pertumbuhan, pembiakan dan homeostasis.","bullets":["Hipotalamus (GnRH) & Pituitari: Anterior = GH (pertumbuhan tulang & sintesis protein), FSH (folikel/spermatogenesis), LH (ovulasi/korpus luteum/testosteron), TSH (rangsang tiroid), ACTH (rangsang korteks adrenal). Posterior = ADH (serapan semula air di tubul ginjal), Oksitosin (pengecutan uterus semasa bersalin & pengeluaran susu).","Tiroid, Pankreas, Adrenal & Gonad: Tiroid = Tiroksina (tingkat metabolisme & suhu). Pankreas = Insulin (glukosa -> glikogen) & Glukagon (glikogen -> glukosa). Adrenal = Aldosteron (serapan garam di ginjal) & Adrenalina/Noradrenalina (situasi lawan atau lari: tingkat degupan jantung, pernafasan, tekanan darah & glukosa darah). Ovari = Estrogen & Progesteron; Testis = Testosteron.","6 Gangguan Hormon (12.7): Kekerdilan (kurang GH) vs Kegergasian (lebih GH); Hipotiroidisme (kurang tiroksina -> jantung perlahan, sensitif sejuk, berat naik) vs Hipertiroidisme/Goiter (lebih tiroksina -> peluh banyak, berat turun, tiroid membengkak); Diabetes mellitus (kurang insulin) vs Hipoglisemia (lebih insulin); Diabetes insipidus (kurang ADH -> kerap kencing banyak & dahaga)."],"labId":"bio412_makmal_endokrin","labTitle":"Galeri Neuroendokrin & Kelenjar Sasaran","labProps":{},"examTip":"Bezakan Diabetes Mellitus (kurang insulin -> glukosa tinggi dalam darah/urin) dengan Diabetes Insipidus (kurang ADH -> air kencing cair amat banyak akibat kegagalan serapan air)!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Hormon & Penyakit","voiceCaption":"Padankan hormon atau kekurangannya dengan fungsi dan penyakit berkaitan.","voiceScript":"[curious] Uji penguasaan anda terhadap hormon-hormon utama dengan memadankan pasangan yang betul!","prompt":"Padankan hormon atau gangguan rembesannya dengan kesan fisiologi yang betul:","pairs":[{"id":"hr1","left":"Kekurangan Hormon Antidiuresis (ADH)","right":"Diabetes insipidus dengan penghasilan air kencing sangat banyak"},{"id":"hr2","left":"Rembesan berlebihan Hormon Pertumbuhan (GH)","right":"Kegergasian akibat pemanjangan tulang luar biasa ketika kanak-kanak"},{"id":"hr3","left":"Kekurangan Tiroksina (Tiroid)","right":"Hipotiroidisme: degupan jantung perlahan, sensitif sejuk & mudah naik berat"},{"id":"hr4","left":"Hormon Oksitosin (Pituitari Posterior)","right":"Merangsang pengecutan otot uterus ketika bersalin dan pengeluaran susu"}],"explanation":"Setiap penyakit endokrin berpunca daripada rembesan berlebihan atau kekurangan hormon spesifik oleh kelenjar tanpa duktus."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Diet Pesakit Goiter","voiceCaption":"Jelaskan mengapa pesakit goiter digalakkan mengambil makanan laut dalam diet mereka.","voiceScript":"[curious] Soalan Praktis Formatif dua belas perpuluhan tujuh: mengapakah pesakit goiter sering digalakkan makan makanan laut?","hook":"Ingat unsur surih yang membentuk hormon tiroksina!","scenario":"Seorang pesakit mengalami pembesaran kelenjar tiroid dua hingga tiga kali saiz normal (goiter) dan disyorkan doktor mengambil lebih makanan laut.","prompt":"Mengapakah makanan laut membantu pesakit goiter?","options":["Makanan laut kaya dengan unsur iodin yang diperlukan oleh kelenjar tiroid untuk mensintesis hormon tiroksina","Makanan laut membekalkan hormon insulin untuk menurunkan glukosa darah","Makanan laut merembeskan histamin bagi mengecutkan kelenjar pituitari","Makanan laut menggantikan peranan saraf spina dalam metabolisme"],"correctIndex":0,"proofLabId":"bio412_makmal_endokrin","proofState":{},"explanation":"Kekurangan iodin menghalang penghasilan tiroksina; pengambilan iodin daripada makanan laut memulihkan sintesis tiroksina."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Susun Tindak Balas Lawan atau Lari","voiceCaption":"Susun mekanisme situasi cemas apabila seseorang diekori kenderaan mencurigakan.","voiceScript":"[confident] Susun urutan koordinasi sistem saraf dan endokrin dalam situasi lawan atau lari ketika seseorang berasa diekori dalam keadaan cemas!","prompt":"Susun urutan tindak balas lawan atau lari dalam situasi kecemasan:","hint":"Hipotalamus bertindak melalui impuls ke medula adrenal untuk membekalkan tenaga ke otot rangka.","answerTokens":["Hipotalamus Hantar Impuls ke Medula Adrenal","Rembesan Adrenalina & Noradrenalina","Degupan Jantung & Aras Glukosa Meningkat","Bekalan O2 & Tenaga ke Otot Rangka Lari"],"distractors":["Rembesan Insulin Menurunkan Gula","Penghasilan Sel Memori"],"explanation":"Sistem saraf (hipotalamus) mengaktifkan sistem endokrin (medula adrenal -> adrenalina) untuk tindak balas segera 'fight or flight'."}]},{"id":"bio412-u5","title":"Unit 5: Ujian Bos SPM — Koordinasi & Gerak Balas","subtitle":"Cabaran Sumatif Kertas 1 & Kertas 2 Biologi Bab 12 (Saraf Terpotong, Nora & Kelenjar Induk)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Perbandingan Saraf vs Endokrin","voiceCaption":"Ujian Bos Bab Dua Belas menguji perbandingan sistem saraf dengan endokrin serta soalan KBAT saraf spina terpotong dan kes Nora terpijak paku.","voiceScript":"[excited] Selamat datang ke Ujian Bos Bab Dua Belas! Ingat perbezaan utama: sistem saraf menghantar isyarat berbentuk impuls elektrik melalui neuron dengan kesan pantas dan sementara, manakala sistem endokrin menghantar hormon melalui aliran darah dengan kesan lebih perlahan tetapi tahan lebih lama!","title":"Perbandingan Sistem Saraf vs Endokrin & Esei SPM","acronym":"BOS•12","hook":"Persamaan: Kedua-duanya mengawal atur aktiviti badan mengekalkan homeostasis; Perbezaan: Impuls saraf vs Hormon darah!","summary":"Sistem saraf bertindak cepat dan sementara pada efektor khusus, manakala sistem endokrin bertindak lebih perlahan tetapi kesannya tahan lama pada organ sasaran.","bullets":["Sistem Saraf: Isyarat impuls elektrik melalui neuron, sangat pantas, kesan sementara dan setempat (cth. tarik tangan daripada objek panas).","Sistem Endokrin: Isyarat kimia hormon melalui plasma darah, lebih perlahan, kesan tahan lama dan melibatkan organ sasaran meluas (cth. pertumbuhan, kitar haid)."],"labId":"bio412_peta_otak_saraf","labTitle":"Semakan Peta Otak & Sistem Saraf","labProps":{"partIndex":3},"examTip":"Sentiasa jelaskan kedua-dua laluan deria dan motor apabila ditanya tentang saraf spina yang terpotong kerana saraf spina ialah saraf campuran!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Kes Saraf Spina Terpotong","voiceCaption":"Ramalkan kesan pemotongan saraf spina kepada organ yang bersambung dengannya.","voiceScript":"[curious] Soalan Praktis Sumatif dua belas: jika saraf spina terputus sebelum bercabang ke akar dorsal dan ventral, apakah kesannya kepada organ bersambung?","hook":"Ingat bahawa saraf spina membawa gentian deria dan gentian motor bersama-sama!","scenario":"Suatu saraf spina di bahagian Z (sebelum bercabang menjadi akar dorsal dan akar ventral) terpotong akibat kemalangan.","prompt":"Apakah kesan terhadap organ atau anggota yang disambungkan ke saraf spina tersebut?","options":["Organ tersebut kehilangan kedua-dua deria rasa dan keupayaan bergerak kerana impuls deria ke saraf tunjang serta impuls motor ke efektor gagal mengalir","Organ masih boleh bergerak seperti biasa tetapi hilang deria panas sahaja","Kelenjar pituitari akan menggantikan fungsi neuron motor untuk menggerakkan otot","Organ terus mengalami arka refleks dua neuron dengan lebih pantas"],"correctIndex":0,"proofLabId":"bio412_peta_otak_saraf","proofState":{"partIndex":5},"explanation":"Saraf spina ialah saraf campuran yang mengandungi akson neuron deria dan motor; pemotongannya menyebabkan anggota lumpuh dan kebas."},{"type":"match","xp":15,"voiceIdKey":"u5-s3","voiceToneLabel":"Banding Kes Berbasikal & Dadah","voiceCaption":"Padankan kes Azman berbasikal vs pencernaan makanan serta dadah perangsang vs penenang di sinaps.","voiceScript":"[curious] Padankan situasi dan kesan bahan ini dengan mekanisme saraf yang tepat!","prompt":"Padankan situasi Sumatif Bab 12 berikut dengan huraian biologi yang betul:","pairs":[{"id":"b12_1","left":"Azman sedar ketika menunggang basikal","right":"Tindakan terkawal oleh korteks serebrum melalui sistem saraf soma"},{"id":"b12_2","left":"Makanan dicerna dalam perut tanpa disedari","right":"Tindakan luar kawal oleh medula oblongata melalui sistem saraf autonomi"},{"id":"b12_3","left":"Dadah perangsang di celah sinaps","right":"Meningkatkan tindakan neurotransmiter dan aktiviti sistem saraf pusat"},{"id":"b12_4","left":"Dadah penenang di celah sinaps","right":"Menghalang pengikatan neurotransmiter dan melambatkan impuls"}],"explanation":"Soalan Sumatif 7 & 8(b): kawalan sedar otot rangka melibatkan serebrum, pencernaan otot licin dikawal medula oblongata, dan dadah bertindak di sinaps."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Urutan Kes Nora Terpijak Paku","voiceCaption":"Susun urutan tindakan refleks dan persepsi sakit apabila Nora terpijak paku dan menjerit.","voiceScript":"[confident] Kes Kertas Dua S-P-M: Nora terpijak paku dan menjerit sambil memegang kaki yang cedera. Susun urutan peristiwa dari kaki ke saraf tunjang dan otak!","prompt":"Susun urutan peristiwa tindakan refleks dan persepsi sakit apabila Nora terpijak paku:","hint":"Refleks menarik kaki di saraf tunjang berlaku pantas serentak dengan penghantaran isyarat sakit ke serebrum.","answerTokens":["Nosireseptor Kaki Mengesan Sakit","Neuron Deria ke Saraf Tunjang","Neuron Motor Tarik Kaki Pantas","Serebrum Tafsir Sakit & Nora Menjerit"],"distractors":["Pituitari Merembes ADH","Pemvasocerutan Kulit"],"explanation":"Saraf tunjang mencetuskan refleks menarik kaki secara segera sementara impuls ke serebrum menghasilkan rasa sakit dan reaksi menjerit."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Soalan Akhir Bos: Kelenjar Induk Pituitari","voiceCaption":"Jelaskan mengapa kelenjar pituitari dikenali sebagai kelenjar utama sistem endokrin serta pasangan hormon perangsangnya.","voiceScript":"[excited] Soalan penutup untuk menakluk Bab Dua Belas! Kenal pasti sebab pituitari digelar kelenjar induk serta contoh hormon perangsangnya.","prompt":"Mengapakah kelenjar pituitari dianggap kelenjar utama (induk) dalam sistem endokrin dan manakah contoh hormon perangsangnya?","options":["Ia merembeskan hormon perangsang seperti TSH dan ACTH yang mengawal rembesan kelenjar endokrin lain (tiroid dan korteks adrenal)","Ia satu-satunya kelenjar yang mempunyai duktus menghantar insulin ke usus","Ia merembeskan adrenalina untuk mempercepatkan degupan jantung secara langsung","Ia menghasilkan sel darah merah dan platelet di dalam otak"],"correctIndex":0,"explanation":"Syabas! TSH merangsang tiroid merembes tiroksina dan ACTH merangsang korteks adrenal; hormon seperti GH, ADH dan oksitosin pula bertindak langsung pada organ sasaran."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var backBtn = document.getElementById("notaBackBtn");

    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx

  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {

  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
