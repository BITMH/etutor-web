/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab13","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":13,"title":"Homeostasis dan Sistem Urinari Manusia","subtitle":"Subtopik 13.1-13.3 KSSM — Suap Balik Negatif Suhu/Glukosa/CO2/Tekanan Darah, Ginjal & Nefron (Ultraturasan/Penyerapan Semula/Rembesan), Osmokawalaturan ADH, Hemodialisis & Batu Karang.","estimatedMinutes":32,"themeAccent":"#d97706","isFreePreview":false,"labScript":"biologi-t4-bab13-labs.js","coverIcon":"../assets/icons/bio413-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[warm] Tepat sekali! Suap balik negatif dan pengosmokawalaturan ginjal anda sangat mantap!","combo":"[excited] Hebat! Rantaian jawapan tepat ini menunjukkan anda menguasai mekanisme homeostasis dan nefron!","encourage":"[softly] Hampir berjaya! Periksa semula arah suap balik negatif atau bahagian nefron tempat proses itu berlaku.","celebrate":"[cheerful] Tahniah! Anda berjaya menamatkan bab Homeostasis dan Sistem Urinari Manusia!"},"units":[{"id":"bio413-u1","title":"Unit 1: Homeostasis — Suhu Badan & Aras Gula Darah","subtitle":"Subtopik 13.1 — Suap Balik Negatif, Kaedah Fizikal-Kimia Suhu Badan & Kawalan Insulin/Glukagon (75-110 mg/100 ml)","iconType":"thermometer","iconUrl":"../assets/icons/bio413-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Homeostasis Suhu & Glukosa","voiceCaption":"Homeostasis mengekalkan faktor fizikal dan kimia persekitaran dalam pada julat normal melalui mekanisme suap balik negatif.","voiceScript":"[warm] Selamat datang ke Bab Tiga Belas, Homeostasis dan Sistem Urinari Manusia! Homeostasis mengekalkan faktor fizikal seperti suhu, tekanan osmotik darah dan tekanan darah, serta faktor kimia seperti pH, mineral dan gula darah dalam julat normal melalui mekanisme suap balik negatif. Suhu badan tiga puluh tujuh darjah Celsius penting agar enzim tidak ternyahasli apabila terlalu panas dan tindak balas metabolisme tidak perlahan apabila terlalu sejuk. Aras glukosa darah pula dikekalkan antara tujuh puluh lima hingga seratus sepuluh miligram per seratus mililiter oleh sel Langerhans di pankreas!","title":"13.1 Suap Balik Negatif Suhu Badan & Aras Gula Darah","acronym":"F•K•S•N","hook":"Walaupun cuaca luar melonjak 38 darjah Celsius atau jatuh ke bilik sejuk beku, suhu dalaman sel kita mesti kekal sekitar 37 darjah Celsius!","summary":"Homeostasis menyelaras sistem organ melalui suap balik negatif supaya suhu badan dan kepekatan glukosa darah kekal optimum.","bullets":["Faktor Persekitaran Dalam: Fizikal (suhu, tekanan osmotik darah, tekanan darah) & Kimia (nilai pH, kepekatan mineral, kepekatan gula darah 75-110 mg/100 ml).","Kawalan Suhu Apabila Panas (Termoreseptor kulit & hipotalamus): Fizikal (otot erektor kurang dirangsang -> bulu roma condong; arteriol mengembang/pemvasodilatan -> haba hilang melalui sinaran; kelenjar peluh aktif -> penyejatan serap haba; tiada menggigil). Kimia (adrenalina & tiroksina berkurang -> metabolisme turun).","Kawalan Suhu Apabila Sejuk: Fizikal (otot erektor mengecut -> bulu roma menegak memerangkap lapisan udara tebal sebagai penebat; arteriol mencerut/pemvasocerutan; otot rangka menggigil jana haba; tiada peluh). Kimia (adrenalina & tiroksina meningkat -> pengoksidaan glukosa jana haba).","Kawalan Gula Darah: Sel Langerhans pankreas merembes INSULIN bila gula tinggi (glukosa -> glikogen di hati/otot) & GLUKAGON bila gula rendah (glikogen -> glukosa)."],"labId":"bio413_suhu_glukosa","labTitle":"Simulator Homeostasis Suhu & Gula Darah","labProps":{"mode":"hot"},"examTip":"Bezakan PEMVASODILATAN (arteriol mengembang ketika panas -> lebih darah ke kulit) dengan PEMVASOCERUTAN (arteriol mencerut ketika sejuk -> kurang haba hilang)!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Efektor Suhu & Glukosa","voiceCaption":"Padankan gerak balas efektor fizikal, kimia dan hormon pankreas dengan kesannya.","voiceScript":"[curious] Padankan gerak balas efektor fizikal dan kimia ini dengan keadaan suhu badan atau aras gula darah!","prompt":"Padankan gerak balas efektor berikut dengan fungsi homeostasisnya:","pairs":[{"id":"hm1","left":"Pemvasodilatan arteriol kulit & berpeluh","right":"Menyingkirkan haba melalui sinaran dan penyejatan semasa panas"},{"id":"hm2","left":"Pengecutan otot erektor menaikkan bulu roma","right":"Memerangkap lapisan udara tebal sebagai penebat haba semasa sejuk"},{"id":"hm3","left":"Rembesan tiroksina & adrenalina meningkat","right":"Kaedah kimia meningkatkan kadar metabolisme dan penghasilan haba"},{"id":"hm4","left":"Rembesan hormon glukagon oleh pankreas","right":"Menukarkan glikogen di hati kembali kepada glukosa bila gula rendah"}],"explanation":"Homeostasis suhu menggabungkan kaedah fizikal (kulit/otot) dan kimia (hormon adrenalina & tiroksina)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Pejabat Tanpa Penyaman Udara","voiceCaption":"Ramalkan gerak balas efektor pekerja yang berada dalam pejabat panas selepas bekalan elektrik terputus.","voiceScript":"[curious] Berdasarkan Praktis Formatif tiga belas perpuluhan satu: seorang pekerja berada dalam pejabat panas tanpa penghawa dingin. Apakah gerak balas efektornya?","hook":"Pilih tab Suhu Panas pada Simulator Homeostasis untuk menyemak jawapan!","scenario":"Bekalan elektrik di pejabat terputus dan suhu bilik meningkat melebihi julat selesa.","prompt":"Apakah gerak balas efektor fizikal dan kimia yang berlaku untuk menurunkan suhu badan pekerja tersebut?","options":["Otot erektor kurang dirangsang (bulu roma condong), arteriol kulit mengembang (pemvasodilatan), kelenjar peluh aktif, manakala rembesan adrenalina dan tiroksina berkurang","Arteriol kulit mencerut dan otot rangka menggigil pantas","Otot erektor mengecut untuk memerangkap lapisan udara tebal","Sel Langerhans merembeskan lebih banyak glukagon"],"correctIndex":0,"proofLabId":"bio413_suhu_glukosa","proofState":{"mode":"hot"},"explanation":"Pemvasodilatan dan perpeluhan menyingkirkan haba secara fizikal, manakala pengurangan adrenalina dan tiroksina merendahkan metabolisme."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Kawalan Gula Rendah","voiceCaption":"Susun urutan tindakan pankreas dan hati apabila aras glukosa darah menurun di bawah normal.","voiceScript":"[confident] Susun langkah bagaimana pankreas dan hati menaikkan semula aras gula darah yang rendah!","prompt":"Susun urutan pengawalaturan apabila aras glukosa darah turun di bawah 75 mg/100 ml:","hint":"Bermula dengan sel Langerhans pankreas merembes hormon yang menukarkan glikogen di hati.","answerTokens":["Aras Glukosa Darah Menurun","Sel Langerhans Rembes Glukagon","Hati Tukar Glikogen Kepada Glukosa","Aras Glukosa Kembali Normal"],"distractors":["Rembesan Insulin","Pemvasocerutan Arteriol"],"explanation":"Glukagon merangsang hati menukar simpanan glikogen kepada glukosa, berlawanan dengan insulin."}]},{"id":"bio413-u2","title":"Unit 2: Kawal Atur CO2 & Tekanan Darah","subtitle":"Subtopik 13.1 — Kemoreseptor Pusat/Periferi, Asid Karbonik (pH) & Baroreseptor Arka Aorta/Karotid","iconType":"heart","iconUrl":"../assets/icons/bio413-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kemoreseptor CO2 & Baroreseptor","voiceCaption":"Karbon dioksida larut dalam plasma membentuk asid karbonik dan menurunkan pH, manakala baroreseptor di arka aorta dan arteri karotid mengesan tekanan darah.","voiceScript":"[warm] Dalam unit kedua ini, kita meneliti bagaimana badan mengawal atur tekanan separa karbon dioksida dan tekanan darah. Apabila bersenam cergas, respirasi sel menghasilkan lebih banyak karbon dioksida yang bertindak balas dengan air membentuk asid karbonik, lalu mengion kepada ion hidrogen dan ion bikarbonat sehingga nilai pH darah dan bendalir serebrospina menurun. Perubahan pH ini dikesan oleh kemoreseptor pusat dalam medula oblongata serta kemoreseptor periferi pada jasad karotid dan jasad aorta!","title":"13.1 Kawalan pH Darah (CO2) & Tekanan Darah","acronym":"C•B•M","hook":"Pernafasan kita laju selepas berlari bukan semata-mata kerana kekurangan oksigen — tetapi disebabkan peningkatan CO2 yang menurunkan pH darah!","summary":"Kemoreseptor mengesan perubahan pH daripada pengionan asid karbonik, manakala baroreseptor di arka aorta dan arteri karotid mengesan perubahan tekanan darah.","bullets":["Kawalan Tekanan Separa CO2: Aktiviti cergas -> CO2 + H2O <-> H2CO3 <-> H+ + HCO3- -> pH darah & bendalir serebrospina menurun -> dikesan Kemoreseptor Pusat (medula oblongata) & Kemoreseptor Periferi (jasad karotid & jasad aorta) -> pusat kawalan respirasi & kardiovaskular merangsang otot interkosta, diafragma & kardiak -> kadar pernafasan, denyutan jantung & ventilasi meningkat untuk menyingkirkan CO2.","Kawalan Tekanan Darah (Baroreseptor di Arka Aorta & Arteri Karotid): Tekanan Tinggi -> baroreseptor dirangsang -> pusat kawalan kardiovaskular medula oblongata cetus PEMVASODILATAN arteri (kurangkan rintangan) & pengecutan kardiak lemah -> tekanan darah turun. Tekanan Rendah (pendarahan) -> baroreseptor kurang dirangsang -> PEMVASOCERUTAN arteri & pengecutan kardiak kuat -> tekanan darah naik."],"labId":"bio413_co2_tekanan","labTitle":"Simulator Kemoreseptor CO2 & Baroreseptor","labProps":{"tab":"co2"},"examTip":"Jangan keliru: Jasad karotid & Jasad aorta = KEMORESEPTOR periferi; Arteri karotid & Arka aorta = BARORESEPTOR!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Kawalan pH Darah","voiceCaption":"Susun urutan pengawalaturan tekanan separa CO2 semasa aktiviti cergas.","voiceScript":"[confident] Susun empat langkah pengawalaturan tekanan separa karbon dioksida semasa aktiviti cergas daripada pembentukan asid karbonik hingga pengembalian pH normal!","prompt":"Susun urutan peristiwa pengawalaturan tekanan separa CO2 dalam darah:","hint":"Bermula dengan pembentukan asid karbonik, pengesanan kemoreseptor hingga peningkatan kadar pernafasan.","answerTokens":["CO2 Larut Bentuk Asid Karbonik (pH Turun)","Kemoreseptor Pusat & Periferi Terangsang","Medula Oblongata Hantar Impuls","Pernafasan & Jantung Pantas Singkir CO2"],"distractors":["Rembesan Hormon ADH","Otot Erektor Mengecut"],"explanation":"Ion hidrogen daripada asid karbonik menurunkan pH darah dan bendalir serebrospina lalu merangsang kemoreseptor pusat serta periferi."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Tekanan Darah Selepas Larian","voiceCaption":"Ramalkan bagaimana badan Ahmad menurunkan tekanan darah kembali normal sejurus menamatkan larian pecut 100 m.","voiceScript":"[curious] Ahmad baru sahaja menamatkan larian pecut seratus meter dan tekanan darahnya tinggi. Bagaimanakah badan Ahmad menurunkannya kembali normal?","hook":"Pilih tab Tekanan Darah pada simulator untuk mengesahkan tindak balas baroreseptor!","scenario":"Sejurus selepas larian pecut 100 m, tekanan darah arteri Ahmad meningkat melebihi julat normal.","prompt":"Apakah mekanisme yang mengembalikan tekanan darah Ahmad kepada julat normal?","options":["Baroreseptor di arka aorta dan arteri karotid dirangsang -> medula oblongata menyebabkan pemvasodilatan arteri dan pengecutan otot kardiak menjadi lebih lemah","Baroreseptor kurang dirangsang -> pemvasocerutan menambah rintangan aliran darah","Otot erektor mengecut untuk menyerap oksigen melalui kulit","Kelenjar pituitari berhenti merembeskan insulin"],"correctIndex":0,"proofLabId":"bio413_co2_tekanan","proofState":{"tab":"bp"},"explanation":"Pemvasodilatan mengurangkan rintangan terhadap aliran darah dan pengecutan kardiak yang lebih lemah menurunkan tekanan darah."},{"type":"mcq","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Lokasi Kemoreseptor & Baroreseptor","voiceCaption":"Bezakan lokasi tepat kemoreseptor periferi dengan baroreseptor.","voiceScript":"[warm] Jangan terkeliru antara kemoreseptor dengan baroreseptor dalam peperiksaan! Kenal pasti pasangan lokasi dan fungsinya yang betul.","prompt":"Pernyataan manakah benar tentang kemoreseptor dan baroreseptor manusia?","options":["Kemoreseptor periferi terletak pada jasad karotid dan jasad aorta (kesan pH/CO2), manakala baroreseptor terletak pada dinding arka aorta dan arteri karotid (kesan tekanan darah)","Baroreseptor terletak di dalam kapsul Bowman untuk mengesan glukosa","Kemoreseptor pusat terletak di pankreas untuk merembeskan glukagon","Baroreseptor dan kemoreseptor hanya bertindak di korteks serebrum"],"correctIndex":0,"explanation":"Kedua-dua jenis reseptor menghantar impuls berterusan ke pusat kawalan dalam medula oblongata."}]},{"id":"bio413-u3","title":"Unit 3: Ginjal, Nefron & Pembentukan Air Kencing","subtitle":"Subtopik 13.2 — Ultraturasan (Aferen > Eferen), Penyerapan Semula 100% Glukosa/Asid Amino & Rembesan Tubul Distal","iconType":"kidney","iconUrl":"../assets/icons/bio413-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Struktur Nefron & Air Kencing","voiceCaption":"Nefron menjalankan perkumuhan bahan bernitrogen dan pengosmokawalaturan melalui tiga proses: ultraturasan, penyerapan semula dan rembesan.","voiceScript":"[warm] Unit ketiga menumpukan kepada struktur ginjal dan unit fungsinya iaitu nefron. Setiap ginjal terdiri daripada korteks luar, medula dalam dan pelvis yang mengalirkan air kencing ke ureter, pundi kencing dan uretra. Tiga proses utama berlaku di sepanjang nefron: pertama, ultraturasan di glomerulus dan kapsul Bowman akibat tekanan hidrostatik tinggi kerana diameter arteriol aferen lebih besar daripada arteriol eferen. Kedua, penyerapan semula seratus peratus glukosa dan asid amino secara pengangkutan aktif di tubul berlingkar proksimal bersama air secara osmosis. Ketiga, rembesan bahan buangan seperti ion hidrogen, kalium, ammonium, urea dan kreatinina paling aktif di tubul berlingkar distal!","title":"13.2 Nefron & Tiga Proses Pembentukan Air Kencing","acronym":"U•P•R","hook":"Setiap hari ginjal menuras hampir 180 liter hasil turasan glomerulus — tetapi 99% diserap semula supaya hanya sekitar 1.5 liter air kencing dikumuhkan!","mediaKey":"bio413_nefron_ginjal","videoClip":{"src":"../assets/biologi-t4-bab13/video/bio413_video_nefron_homeostasis_narasi.mp4","hasNarration":true,"posterKey":"bio413_nefron_ginjal","caption":"Pembentukan air kencing di nefron (ultraturasan, penyerapan semula, rembesan) dan kawal atur ADH."},"summary":"Ginjal mengandungi korteks dan medula dengan jutaan nefron untuk perkumuhan (urea, asid urik, ammonia, kreatinina) dan pengosmokawalaturan.","bullets":["1. Ultraturasan (Glomerulus -> Kapsul Bowman): Diameter arteriol AFEREN > EFEREN menjana tekanan hidrostatik tinggi. Hasil turasan glomerulus sama seperti plasma darah KECUALI tiada sel darah merah, platelet dan protein plasma (saiz terlalu besar).","2. Penyerapan Semula: Tubul berlingkar proksimal (Na+ pengangkutan aktif, Cl- pasif, 100% glukosa & asid amino pengangkutan aktif, air secara osmosis). Liku Henle di medula (air osmosis, Na+ aktif). Tubul berlingkar distal (air, Na+ & Cl- mengikut keperluan darah).","3. Rembesan (paling aktif di tubul berlingkar distal & duktus pengumpul): Resapan ringkas & pengangkutan aktif menyingkirkan ion H+, K+, NH4+, urea, kreatinina, toksik dan ubat daripada darah ke tubul renal."],"labId":"bio413_simulator_nefron","labTitle":"Simulator 4 Zon Nefron & Pembentukan Urin","labProps":{"zone":0},"examTip":"Soalan Sumatif 5 & 7: Sentiasa nyatakan 100% glukosa dan asid amino diserap semula melalui PENGANGKUTAN AKTIF di tubul berlingkar proksimal!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Bahagian & Proses Nefron","voiceCaption":"Padankan bahagian nefron dengan proses pembentukan air kencing yang dominan berlaku di situ.","voiceScript":"[curious] Uji pengetahuan anatomi nefron anda dengan memadankan empat bahagian nefron ini kepada proses pembentukan air kencingnya!","prompt":"Padankan struktur nefron berikut dengan proses atau ciri utamanya:","pairs":[{"id":"nf1","left":"Glomerulus & Kapsul Bowman","right":"Ultraturasan tekanan tinggi; mengekalkan eritrosit dan protein plasma dalam darah"},{"id":"nf2","left":"Tubul berlingkar proksimal","right":"Penyerapan semula 100% glukosa dan asid amino secara pengangkutan aktif"},{"id":"nf3","left":"Liku Henle (di medula)","right":"Menyerap semula air secara osmosis dan ion natrium secara aktif"},{"id":"nf4","left":"Tubul berlingkar distal","right":"Tapak paling aktif bagi rembesan ion H+, K+, NH4+, urea dan ubat"}],"explanation":"Liku Henle terletak di medula ginjal manakala glomerulus, kapsul Bowman, tubul proksimal dan tubul distal berada di korteks."},{"type":"sort","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Isih Kandungan Turasan Glomerulus","voiceCaption":"Asingkan bahan yang menuras masuk ke kapsul Bowman berbanding bahan yang terlalu besar dan kekal dalam darah.","voiceScript":"[confident] Berdasarkan Soalan Sumatif tujuh b, asingkan bahan darah yang berjaya menuras ke kapsul Bowman berbanding bahan yang tertinggal dalam arteriol eferen!","prompt":"Isihkan komponen darah berikut semasa proses ultraturasan di glomerulus:","buckets":[{"id":"turas","label":"Masuk ke Kapsul Bowman (Hasil Turasan)"},{"id":"kekal","label":"Kekal dalam Darah (Terlalu Besar)"}],"items":[{"text":"Glukosa & Asid amino","bucketId":"turas","note":"Bersaiz kecil, menuras masuk sebelum diserap semula 100%."},{"text":"Urea, air & garam mineral","bucketId":"turas","note":"Menuras masuk membentuk hasil turasan glomerulus."},{"text":"Sel darah merah (eritrosit) & Platelet","bucketId":"kekal","note":"Saiz sel terlalu besar untuk menembusi liang kapilari glomerulus."},{"text":"Protein plasma (cth. albumin)","bucketId":"kekal","note":"Molekul protein plasma terlalu besar untuk dituras."}],"explanation":"Hasil turasan glomerulus mempunyai komposisi sama dengan plasma darah tetapi tanpa eritrosit, platelet dan protein plasma."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Ujian Makmal Diabetes","voiceCaption":"Tentukan ujian makmal di sekolah untuk mengesan kehadiran glukosa dalam air kencing pesakit diabetes.","voiceScript":"[warm] Soalan Praktis Sumatif tiga: nyatakan ujian makmal yang boleh dijalankan untuk menentukan sama ada seseorang menghidap diabetes melalui air kencing!","hook":"Ingat ujian untuk gula penurun dalam Biologi Bab 4!","scenario":"Sampel air kencing pesakit yang disyaki menghidap diabetes melitus diuji di makmal sekolah.","prompt":"Apakah ujian makmal yang sesuai dan pemerhatian positif bagi pesakit diabetes melitus?","options":["Ujian Benedict — panaskan air kencing dengan larutan Benedict; mendakan merah bata terbentuk menunjukkan kehadiran glukosa","Ujian Biuret — menambah kuprum(II) sulfat menghasilkan warna ungu untuk kanji","Ujian Iodin — larutan bertukar biru tua kerana kehadiran glikogen","Ujian Emulsi Etanol — membentuk emulsi keruh putih"],"correctIndex":0,"proofLabId":"bio413_simulator_nefron","proofState":{"zone":1},"explanation":"Apabila kepekatan glukosa darah terlalu tinggi pada pesakit diabetes, tubul proksimal gagal menyerap semua glukosa lalu ia dikesan dengan Ujian Benedict."}]},{"id":"bio413-u4","title":"Unit 4: Osmokawalaturan ADH, Hemodialisis & Batu Karang","subtitle":"Subtopik 13.2 & 13.3 — Suap Balik Negatif ADH, Eksperimen Isipadu Air / NaCl 5%, Hemodialisis & Batu Karang","iconType":"droplet","iconUrl":"../assets/icons/bio413-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kawalan ADH, Hemodialisis & Batu Karang","voiceCaption":"Osmokawalaturan mengekalkan tekanan osmotik darah melalui hormon ADH. Pelajari juga eksperimen pengambilan air, hemodialisis dan punca batu karang.","voiceScript":"[warm] Unit keempat merungkai pengosmokawalaturan! Apabila minum terlalu banyak air, tekanan osmotik darah menurun, osmoreseptor hipotalamus dan pituitari kurang dirangsang lalu kurang hormon A-D-H dirembes. Dinding tubul distal dan duktus pengumpul menjadi kurang telap terhadap air, kurang air diserap semula, dan air kencing cair terhasil dalam isipadu banyak. Sebaliknya, apabila makan makanan masin atau kurang minum air, lebih banyak A-D-H dirembes supaya air diserap semula menghasilkan air kencing pekat yang sedikit!","title":"13.2 Pengosmokawalaturan ADH & 13.3 Kesihatan Urinari","acronym":"O•A•H•B","hook":"Minum 100 ml larutan garam 5% membuatkan anda menghasilkan air kencing jauh lebih sedikit dan lebih pekat berbanding minum 100 ml air suling!","mediaKey":"bio413_hemodialisis","summary":"ADH meningkatkan kebolehtelapan tubul distal dan duktus pengumpul terhadap air; diabetes melitus dan hipertensi ialah punca utama kegagalan ginjal.","bullets":["Tekanan Osmotik Darah Tinggi (makan masin/kurang air): Osmoreseptor hipotalamus terangsang -> pituitari rembes LEBIH ADH -> dinding tubul distal & duktus pengumpul LEBIH TELAP air -> lebih air diserap semula -> sedikit air kencing pekat. (Berlaku sebaliknya bila minum air berlebihan).","Eksperimen 13.2 (250/500/750/1000 ml air): Semakin banyak air diminum, semakin tinggi isipadu air kencing dikumpul. Larutan NaCl 5% meningkatkan tekanan osmotik darah berbanding air suling.","Hemodialisis & 1 Ginjal Rosak: Punca utama kegagalan ginjal ialah diabetes melitus dan tekanan darah tinggi yang merosakkan glomerulus. Hemodialisis menyingkir urea apabila kedua-dua ginjal gagal. Jika hanya SATU ginjal rosak, pesakit tidak semestinya perlukan hemodialisis asalkan menjaga diet (kurangkan garam & protein berlebihan serta minum air cukup).","Batu Karang: Ketulan keras daripada asid urik, kalsium oksalat atau hablur kalsium fosfat yang boleh menyekat ureter; minum air banyak mengurangkan risikonya."],"labId":"bio413_galeri_renal","labTitle":"Galeri Ginjal, Nefron & Hemodialisis","labProps":{},"examTip":"Semasa menghuraikan kesan ADH dalam SPM, wajib nyatakan DUA struktur sasaran iaitu 'tubul berlingkar distal dan duktus pengumpul'!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Osmokawalaturan Air Banyak","voiceCaption":"Susun urutan peristiwa pengosmokawalaturan selepas seseorang minum terlalu banyak air.","voiceScript":"[confident] Susun urutan lengkap mekanisme suap balik negatif apabila seseorang minum air berlebihan sehingga tekanan osmotik darah jatuh di bawah paras normal!","prompt":"Susun urutan pengosmokawalaturan selepas minum air berlebihan:","hint":"Bermula dengan penurunan tekanan osmotik darah, pengurangan ADH hingga penghasilan urin cair yang banyak.","answerTokens":["Tekanan Osmotik Darah Menurun","Osmoreseptor & Pituitari Kurang Terangsang","Kurang ADH Dirembes (Kurang Telap Air)","Urin Cair & Isipadu Banyak Terhasil"],"distractors":["Lebih ADH Dirembeskan","Ureter Tersumbat Batu Karang"],"explanation":"Kurang ADH menyebabkan dinding tubul berlingkar distal dan duktus pengumpul kurang telap kepada air, maka kurang air diserap semula."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Air Suling vs Larutan NaCl 5%","voiceCaption":"Ramalkan perbezaan isipadu air kencing antara peminum 100 ml air suling dengan 100 ml larutan NaCl 5%.","voiceScript":"[curious] Soalan Perbincangan Eksperimen tiga belas perpuluhan dua: apakah perbezaan air kencing antara individu yang minum seratus mililiter air suling berbanding larutan natrium klorida lima peratus?","hook":"Kaitkan garam NaCl 5% dengan tekanan osmotik darah dan rembesan ADH!","scenario":"Individu A minum 100 ml air suling manakala Individu B minum 100 ml larutan natrium klorida 5%.","prompt":"Bagaimanakah isipadu air kencing Individu B (NaCl 5%) berbanding Individu A?","options":["Individu B menghasilkan isipadu air kencing yang lebih sedikit dan lebih pekat kerana NaCl meningkatkan tekanan osmotik darah lalu merangsang lebih banyak rembesan ADH","Individu B menghasilkan lebih banyak air kencing cair kerana garam melarutkan glomerulus","Kedua-duanya menghasilkan isipadu air kencing yang sama tepat","Individu B tidak menghasilkan sebarang air kencing selama seminggu"],"correctIndex":0,"proofLabId":"bio413_galeri_renal","proofState":{},"explanation":"Peningkatan garam meningkatkan tekanan osmotik darah, merangsang rembesan ADH dan meningkatkan penyerapan semula air."},{"type":"mcq","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Kerosakan Satu Ginjal & Batu Karang","voiceCaption":"Tentukan sama ada kerosakan sebelah ginjal sahaja mewajibkan rawatan hemodialisis.","voiceScript":"[warm] Soalan Praktis Formatif tiga belas perpuluhan dua: bolehkah seseorang hidup tanpa hemodialisis jika hanya satu ginjalnya rosak?","prompt":"Seorang individu mengalami kerosakan pada sebelah ginjal sahaja manakala sebelah lagi masih sihat. Adakah beliau perlu menjalani hemodialisis?","options":["Tidak perlu; sebelah ginjal yang sihat masih mampu menjalankan fungsi harian jika beliau mengawal diet (kurangkan garam & protein berlebihan serta minum air secukupnya)","Wajib kerana satu ginjal hanya menjalankan ultraturasan tanpa penyerapan semula","Wajib kerana pankreas akan berhenti merembeskan ADH","Tidak perlu dan pesakit digalakkan makan makanan sangat masin setiap hari"],"correctIndex":0,"explanation":"Ginjal yang masih sihat mampu menampung fungsi perkumuhan dan pengosmokawalaturan dengan pengamalan gaya hidup sihat."}]},{"id":"bio413-u5","title":"Unit 5: Ujian Bos SPM — Homeostasis & Urinari","subtitle":"Cabaran Sumatif Kertas 1 & Kertas 2 Biologi Bab 13 (Liku Henle Haiwan Gurun, Ikan Laut & Ginjal Bio-Buatan)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Sintesis KBAT Bab 13","voiceCaption":"Ujian Bos Bab Tiga Belas merangkumi soalan KBAT SPM tentang panjang liku Henle, diet tinggi protein, ikan air masin, ujian dadah urin dan ginjal bio-buatan.","voiceScript":"[excited] Tahniah kerana mara ke Ujian Bos Bab Tiga Belas! Ingat tiga prinsip K-B-A-T utama buku teks: semakin panjang liku Henle haiwan persekitaran kering seperti unta, semakin tinggi kepekatan garam di sekelilingnya bagi menyerap semula lebih banyak air! Kedua, diet tinggi protein menghasilkan lebih banyak urea di hati lalu meningkatkan perkumuhan urea! Ketiga, ikan laut minum banyak air laut dan mengepam keluar garam berlebihan melalui sel insang serta menghasilkan sedikit air kencing pekat!","title":"Strategi Esei & KBAT Praktis Sumatif Bab 13","acronym":"BOS•13","hook":"Liku Henle panjang = serap semula air maksimum untuk kemandirian di gurun kering!","summary":"Panjang liku Henle berkadar terus dengan keupayaan memekatkan urin; rembesan di tubul distal menyingkirkan dadah ke dalam air kencing.","bullets":["Panjang Liku Henle (Sumatif Q7e): Haiwan habitat kering ada liku Henle LEBIH PANJANG berbanding haiwan habitat lembap untuk menyerap semula air secara maksimum.","Diet Tinggi Protein (Sumatif Q12): Lebih banyak asid amino dideamina di hati menghasilkan lebih banyak urea dalam air kencing.","Ujian Dadah dalam Urin (Pengayaan Q13): Dadah disingkirkan secara aktif daripada darah ke dalam tubul distal melalui proses REMBESAN."],"labId":"bio413_simulator_nefron","labTitle":"Semakan Liku Henle & Tubul Distal","labProps":{"zone":2},"examTip":"Dalam soalan pendaki gunung tinggi (Sumatif Q9), kaitkan tekanan separa O2 rendah dengan peningkatan kadar pernafasan!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"KBAT: Liku Henle Haiwan Kering vs Lembap","voiceCaption":"Ramalkan perbezaan panjang liku Henle haiwan persekitaran kering berbanding haiwan persekitaran lembap.","voiceScript":"[curious] Soalan Sumatif tujuh e: semakin panjang liku Henle, semakin tinggi kepekatan garam di sekelilingnya. Apakah ramalan anda tentang haiwan di persekitaran kering?","hook":"Semak zon ke-3 pada Simulator 4 Zon Nefron!","scenario":"Dua spesies mamalia dikaji: Spesies P hidup di kawasan padang pasir kering manakala Spesies Q hidup di hutan hujan lembap.","prompt":"Bagaimanakah panjang liku Henle Spesies P berbanding Spesies Q?","options":["Spesies P (persekitaran kering) mempunyai liku Henle yang lebih panjang untuk menghasilkan kepekatan garam tinggi di medula supaya lebih banyak air diserap semula secara osmosis","Spesies P tidak mempunyai liku Henle langsung untuk menjimatkan tenaga","Spesies Q (lembap) mempunyai liku Henle lebih panjang kerana terlalu banyak air diminum","Kedua-duanya mempunyai panjang liku Henle yang sentiasa sama tanpa adaptasi"],"correctIndex":0,"proofLabId":"bio413_simulator_nefron","proofState":{"zone":2},"explanation":"Liku Henle yang lebih panjang membolehkan haiwan gurun menyerap semula maksimum air dan menyingkirkan air kencing sangat pekat."},{"type":"match","xp":15,"voiceIdKey":"u5-s3","voiceToneLabel":"Padan 4 Kes KBAT Sumatif","voiceCaption":"Padankan kes pendaki gunung, ikan laut, ujian dadah urin dan pembuangan pankreas dengan penjelasannya.","voiceScript":"[curious] Uji ketangkasan KBAT anda dengan memadankan empat situasi Sumatif Bab Tiga Belas ini!","prompt":"Padankan situasi Sumatif Bab 13 berikut dengan penjelasan biologi yang tepat:","pairs":[{"id":"b13_1","left":"Pendaki di puncak gunung tinggi bernafas lebih laju","right":"Tekanan separa O2 rendah; kemoreseptor merangsang medula oblongata tingkatkan kadar pernafasan"},{"id":"b13_2","left":"Ikan air masin tidak mengalami penyahhidratan","right":"Minum banyak air laut, pam keluar garam melalui insang & hasilkan sedikit urin pekat"},{"id":"b13_3","left":"Ujian air kencing mengesan penyalahgunaan dadah","right":"Bahan kimia dadah dirembeskan aktif ke tubul renal lalu dikumuhkan dalam urin"},{"id":"b13_4","left":"Pesakit dibuang pankreasnya akibat penyakit","right":"Kekurangan enzim pencernaan pankreas serta kekurangan insulin & glukagon"}],"explanation":"Kesemua empat kes ini merumuskan soalan Sumatif 6, 9 dan Pengayaan 12-13 buku teks."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Urutan Kawalan Suhu Bilik Sejuk 6 Jam","voiceCaption":"Susun gerak balas badan pekerja yang berada di dalam bilik sejuk selama 6 jam.","voiceScript":"[confident] Susun gerak balas pengawalaturan suhu bagi seorang pekerja yang berada dalam bilik sejuk selama enam jam!","prompt":"Susun mekanisme kawal atur suhu badan pekerja di dalam bilik sejuk selama 6 jam:","hint":"Bermula dengan termoreseptor & hipotalamus hingga pemvasocerutan, menggigil & hormon tiroksina.","answerTokens":["Termoreseptor & Hipotalamus Dikesan Sejuk","Pemvasocerutan Arteriol & Bulu Roma Menegak","Otot Rangka Menggigil Jana Haba","Adrenalina & Tiroksina Naikkan Metabolisme"],"distractors":["Pemvasodilatan Arteriol","Kelenjar Peluh Merembes Lebih Peluh"],"explanation":"Gabungan tindakan fizikal dan kimia mengurangkan kehilangan haba serta menjana lebih haba dalaman."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Soalan Akhir Bos: Ginjal Bio-Buatan","voiceCaption":"Kenal pasti ciri wajib yang diperlukan oleh ginjal bio-buatan supaya berfungsi menyamai ginjal sebenar.","voiceScript":"[excited] Soalan penutup Bab Tiga Belas bertaraf Pengayaan! Apakah keupayaan wajib bagi ginjal bio-buatan supaya dapat berfungsi seperti ginjal sebenar?","prompt":"Apakah ciri paling kritikal yang wajib dimiliki oleh peranti ginjal bio-buatan untuk menyamai fungsi ginjal sihat?","options":["Mampu menuras urea dan toksin pada tekanan tinggi sambil mengekalkan eritrosit serta protein plasma, dan menyerap semula 100% glukosa, asid amino serta air secara selektif","Menghasilkan insulin dan glukagon untuk mencerna lemak","Menggumpalkan semua eritrosit di kapsul Bowman","Hanya menyingkirkan air tanpa menapis urea"],"correctIndex":0,"explanation":"Syabas! Ginjal sihat menjalankan ultraturasan, penyerapan semula selektif nutrien berguna dan pengosmokawalaturan air serta ion."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var backBtn = document.getElementById("notaBackBtn");

    var backLabel = canStepBack

  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {

  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
