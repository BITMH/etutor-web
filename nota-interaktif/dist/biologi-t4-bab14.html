/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab14","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":14,"title":"Sokongan dan Pergerakan dalam Manusia dan Haiwan","subtitle":"Subtopik 14.1-14.4 KSSM — Tiga Jenis Rangka, Rangka Paksi/Apendaj, Vertebra, Sendi Engsel & Lesung, Otot Antagonis (Lengan/Kaki), Gerak Alih Haiwan & Penjagaan Rangka.","estimatedMinutes":32,"themeAccent":"#e11d48","isFreePreview":false,"labScript":"biologi-t4-bab14-labs.js","coverIcon":"../assets/icons/bio414-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[warm] Tepat sekali! Penguasaan anda tentang rangka, sendi dan otot antagonis amat hebat!","combo":"[excited] Cemerlang! Rentetan jawapan tepat membuktikan anda faham biomekanik pergerakan manusia dan haiwan!","encourage":"[softly] Hampir berjaya! Semak semula pasangan otot yang mengecut dan mengendur serta peranan tendon dengan ligamen.","celebrate":"[cheerful] Tahniah! Anda berjaya menamatkan bab Sokongan dan Pergerakan dalam Manusia dan Haiwan!"},"units":[{"id":"bio414-u1","title":"Unit 1: Jenis Rangka, Rangka Manusia & Turus Vertebra","subtitle":"Subtopik 14.1 & 14.2 — Rangka Hidrostatik/Luar/Dalam, Paksi vs Apendaj & Lima Jenis Vertebra (Serviks, Toraks, Lumbar, Sakrum, Kaudal)","iconType":"bone","iconUrl":"../assets/icons/bio414-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Jenis Rangka & Turus Vertebra","voiceCaption":"Haiwan mempunyai rangka hidrostatik, rangka luar atau rangka dalam, manakala rangka manusia terbahagi kepada rangka paksi dan rangka apendaj serta lima jenis vertebra.","voiceScript":"[warm] Selamat datang ke Bab Empat Belas, Sokongan dan Pergerakan dalam Manusia dan Haiwan! Tiga jenis rangka utama ialah rangka hidrostatik pada cacing tanah, rangka luar pada serangga dan ketam, serta rangka dalam pada manusia dan vertebrata. Sistem rangka manusia pula terdiri daripada rangka paksi iaitu tengkorak, turus vertebra, tulang rusuk dan sternum, serta rangka apendaj yang merangkumi lengkungan pektoral, lengkungan pelvis, tulang lengan dan tulang kaki!","title":"14.1 Jenis Rangka & 14.2 Paksi/Apendaj + 5 Vertebra","acronym":"S•T•L•S•K","hook":"Vertebra Atlas langsung tidak mempunyai sentrum supaya ia dapat memeluk proses odontoid vertebra Aksis untuk membolehkan anda mengangguk dan menggeleng kepala!","mediaKey":"bio414_otot_antagonis","summary":"Vertebra serviks berforamen melintang, vertebra toraks berproses spina panjang & faset rusuk, dan vertebra lumbar bersentrum paling besar.","bullets":["3 Jenis Rangka: Rangka hidrostatik (cacing tanah — bendalir sokong tisu lembut), Rangka luar (serangga/ketam — sokong & lindung), Rangka dalam (vertebrata — kekalkan bentuk, lindungi organ dalaman & tempat pelekatan otot).","Rangka Manusia: Rangka Paksi (tengkorak, turus vertebra, tulang rusuk, sternum) vs Rangka Apendaj (lengkungan pektoral, lengkungan pelvis, anggota atas & anggota bawah).","5 Jenis Vertebra (Semua ada proses spina, proses melintang, sentrum kecuali Atlas, dan salur saraf melindungi saraf tunjang): Serviks (proses spina pendek, proses melintang lebar pendek, sentrum kecil, sepasang FORAMEN MELINTANG; Atlas C1 tiada sentrum bersendi dengan tengkorak; Aksis C2 proses odontoid); Toraks (proses spina panjang, faset tulang rusuk kecuali ke-11 & ke-12); Lumbar (terbesar/terkuat, sentrum besar); Sakrum (5 bercantum segi tiga); Kaudal (4 bercantum hujung tirus)."],"labId":"bio414_atlas_rangka_vertebra","labTitle":"Atlas Perbandingan 5 Jenis Vertebra","labProps":{"tab":0},"examTip":"Petua pantas mengecam rajah vertebra SPM: nampak dua lubang bulat di sisi (foramen melintang) = Serviks; duri belakang panjang tirus = Toraks; badan sentrum amat besar = Lumbar!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Jenis Vertebra","voiceCaption":"Padankan atlas, aksis, vertebra toraks dan lumbar dengan ciri anatomi khasnya.","voiceScript":"[curious] Uji kecekapan anda mengecam tulang belakang dengan memadankan empat jenis vertebra ini kepada ciri khas masing-masing!","prompt":"Padankan jenis vertebra berikut dengan ciri anatomi yang paling tepat:","pairs":[{"id":"vt1","left":"Vertebra Atlas (Serviks ke-1)","right":"Salur saraf besar, tiada sentrum, bersendi dengan tengkorak"},{"id":"vt2","left":"Vertebra Aksis (Serviks ke-2)","right":"Mempunyai proses odontoid dan sepasang foramen melintang"},{"id":"vt3","left":"Vertebra Toraks","right":"Proses spina panjang dan faset artikulasi tulang rusuk"},{"id":"vt4","left":"Vertebra Lumbar","right":"Sentrum paling besar untuk menampung berat bawah badan"}],"explanation":"Hanya vertebra serviks mempunyai sepasang foramen melintang dan hanya vertebra atlas tidak memiliki sentrum."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kedudukan Kaki Tikus vs Buaya","voiceCaption":"Ramalkan kelebihan haiwan darat berkaki di bawah badan berbanding berkaki di sisi badan.","voiceScript":"[curious] Soalan Praktis Formatif empat belas perpuluhan satu: apakah kelebihan kaki berada di bawah badan seperti tikus berbanding di sisi badan seperti buaya?","hook":"Fikirkan pengurangan geseran dan kecekapan menyokong berat badan tegak!","scenario":"Tikus bergerak dengan empat kaki di bawah badan manakala buaya mempunyai kaki yang terjulur di sisi badan.","prompt":"Apakah kelebihan mempunyai kaki di bawah badan berbanding di sisi badan bagi pergerakan di darat?","options":["Berat badan dapat disokong tegak oleh tulang anggota dengan lebih cekap, mengurangkan geseran perut dengan tanah serta membolehkan larian lebih pantas","Membentuk rangka luar kitin yang lebih tebal di kulit perut","Membolehkan pergerakan gelombang peristalsis menggunakan keta","Mengelakkan pembentukan asid laktik dalam otot jantung"],"correctIndex":0,"proofLabId":"bio414_atlas_rangka_vertebra","proofState":{"tab":2},"explanation":"Kaki di bawah badan mengangkat tubuh dari tanah supaya pergerakan lebih laju dan menjimatkan tenaga."},{"type":"mcq","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Kenal Pasti Rangka Paksi","voiceCaption":"Kenal pasti kumpulan tulang yang kesemuanya membentuk rangka paksi manusia.","voiceScript":"[warm] Pastikan anda tahu membezakan rangka paksi daripada rangka apendaj. Pilih kumpulan tulang yang kesemuanya tergolong dalam rangka paksi!","prompt":"Kumpulan struktur manakah yang kesemuanya membentuk rangka paksi manusia?","options":["Tengkorak, turus vertebra, tulang rusuk dan sternum","Lengkungan pektoral, humerus, tulang rusuk dan tengkorak","Lengkungan pelvis, femur, tibia dan fibula","Skapula, klavikel, radius dan ulna"],"correctIndex":0,"explanation":"Lengkungan pektoral/pelvis serta tulang anggota tangan/kaki tergolong dalam rangka apendaj."}]},{"id":"bio414-u2","title":"Unit 2: Sendi, Otot Antagonis & Pergerakan Lengan/Kaki","subtitle":"Subtopik 14.2 & 14.3 — Sendi Engsel vs Lesung, Tendon vs Ligamen, Biseps/Triseps & Mekanisme Berjalan","iconType":"muscle","iconUrl":"../assets/icons/bio414-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Sendi Engsel & Otot Antagonis","voiceCaption":"Otot biseps dan triseps bertindak secara antagonis menerusi tendon ke tulang radius dan ulna pada sendi engsel siku.","voiceScript":"[warm] Dalam unit kedua ini, kita melihat bagaimana tulang, sendi dan otot menghasilkan pergerakan! Sendi terbahagi kepada sendi tidak bergerak seperti sutur kranium, sendi bergerak sedikit seperti cakera rawan antara vertebra, dan sendi bebas bergerak iaitu sendi engsel di siku serta sendi lesung di bahu dan pinggul. Pada sendi engsel siku, rawan menyerap hentak dan mengurangkan geseran, membran sinovia merembes bendalir sinovia sebagai pelincir, ligamen yang kenyal menyambung tulang ke tulang, manakala tendon yang kuat dan tak kenyal menyambung otot biseps dan triseps kepada tulang radius serta ulna!","title":"14.2 Sendi & 14.3 Pergerakan Lengan & Kaki Berjalan","acronym":"B•T•R•U","hook":"Otot tidak pernah boleh menolak tulang — otot hanya menarik! Jadi setiap sendi memerlukan pasangan otot antagonis yang menarik ke arah berlawanan!","videoClip":{"src":"../assets/biologi-t4-bab14/video/bio414_video_otot_antagonis_narasi.mp4","hasNarration":true,"posterKey":"bio414_otot_antagonis","caption":"Video Penerangan Bersuara (BM): Tindakan otot antagonis biseps dan triseps, fungsi tendon dan ligamen pada sendi engsel siku"},"summary":"Tendon (tidak kenyal, otot ke tulang) memindahkan daya tarikan pengecutan otot, manakala ligamen (kenyal, tulang ke tulang) menstabilkan sendi.","bullets":["Jenis Sendi & Strukturnya: Tidak bergerak (sutur kranium), Bergerak sedikit (cakera rawan vertebra, rusuk pertama-sternum), Bebas bergerak (Sendi Lesung = bahu/pinggul putar semua arah; Sendi Engsel = siku/lutut/falanks satu satah). Kapsul (lindung), Rawan (kusyen/serap hentak/kurang geseran), Membran sinovia (rembes bendalir sinovia pelincir).","Tendon vs Ligamen: Tendon (gentian kuat, TIDAK KENYAL tetapi fleksibel; sambung otot ke tulang). Ligamen (kuat, KENYAL & liat; sambung tulang ke tulang).","Lengan Membengkok vs Melurus: Bengkok -> Biseps (fleksor) mengecut, tarik RADIUS ke atas via tendon; Triseps mengendur. Lurus -> Triseps (ekstensor) mengecut, tarik ULNA ke bawah via tendon; Biseps mengendur.","Kaki Berjalan: Otot betis angkat tumit -> biseps femoris (fleksor) mengecut bengkokkan lutut -> berat ditampung kaki kiri -> kuadriseps femoris (ekstensor) mengecut luruskan kaki -> tibialis turunkan tumit."],"labId":"bio414_simulator_lengan_kaki","labTitle":"Simulator Otot Antagonis Lengan","labProps":{"bent":true},"examTip":"Ingat pasangan tepat: Biseps berpaut ke RADIUS; Triseps berpaut ke ULNA!"},{"type":"match","xp":15,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Komponen Sendi Engsel","voiceCaption":"Padankan rawan, membran sinovia, tendon dan ligamen dengan fungsinya.","voiceScript":"[curious] Pastikan anda menguasai peranan setiap komponen sendi engsel! Padankan struktur di sebelah kiri dengan fungsinya yang tepat.","prompt":"Padankan komponen sendi engsel manusia dengan fungsi dan sifatnya:","pairs":[{"id":"sn1","left":"Rawan pada hujung tulang","right":"Menyerap hentakan, menjadi kusyen dan mencegah kehausan tulang"},{"id":"sn2","left":"Membran & bendalir sinovia","right":"Merembes bendalir pelincir mengurangkan geseran antara hujung tulang"},{"id":"sn3","left":"Tendon (tidak kenyal, fleksibel)","right":"Menyambung otot ke tulang dan memindahkan daya tarikan pengecutan"},{"id":"sn4","left":"Ligamen (kenyal, kuat & liat)","right":"Menyambung tulang ke tulang untuk menyokong dan menstabilkan sendi"}],"explanation":"Sifat TIDAK KENYAL tendon amat penting supaya daya pengecutan otot tidak terbuang meregangkan tisu."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Mekanisme Kaki Berjalan","voiceCaption":"Susun urutan tindakan otot betis, biseps femoris, kuadriseps femoris dan tibialis semasa melangkah.","voiceScript":"[confident] Susun empat langkah mekanisme kaki berjalan dari fasa mengangkat tumit hingga meletakkan semula tumit ke lantai!","prompt":"Susun urutan tindakan otot kaki kanan semasa melangkah ke hadapan:","hint":"Otot betis -> fleksor bengkokkan lutut -> ekstensor luruskan kaki -> tibialis turunkan tumit.","answerTokens":["Otot Betis Angkat Tumit","Biseps Femoris Bengkokkan Lutut","Kuadriseps Femoris Luruskan Kaki","Otot Tibialis Turunkan Tumit"],"distractors":["Triseps Menolak Radius","Pektoralis Major Mengecut"],"explanation":"Biseps femoris ialah fleksor lutut manakala kuadriseps femoris ialah ekstensor meluruskan kaki."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Kesan Tendon Biseps Terkoyak","voiceCaption":"Ramalkan masalah pergerakan lengan sekiranya tendon otot biseps terkoyak sepenuhnya.","voiceScript":"[curious] Soalan Sumatif buku teks: apakah kesannya sekiranya tendon yang menyambungkan otot biseps dengan tulang radius terkoyak akibat kemalangan?","hook":"Perhatikan sambungan biseps ke tulang radius pada Simulator Otot Antagonis!","scenario":"Tisu X (tendon otot biseps) pada lengan seorang mangsa kemalangan terkoyak sepenuhnya.","prompt":"Apakah masalah utama yang dihadapi mangsa tersebut?","options":["Daya tarikan daripada pengecutan otot biseps gagal dipindahkan ke tulang radius, lalu mangsa tidak dapat membengkokkan lengan bawahnya ke atas","Bendalir sinovia berhenti merembes lalu sendi bahu menjadi sutur","Otot biseps boleh menolak tulang ulna untuk meluruskan lengan","Tulang radius bertukar menjadi rawan lembut"],"correctIndex":0,"proofLabId":"bio414_simulator_lengan_kaki","proofState":{"bent":true},"explanation":"Tanpa tendon yang utuh dan tidak kenyal, pengecutan biseps tidak mampu menarik tulang radius ke atas."}]},{"id":"bio414-u3","title":"Unit 3: Gerak Alih Ikan, Burung, Cacing Tanah & Belalang","subtitle":"Subtopik 14.3 — Miotom Bentuk W, Pektoralis Major/Minor, Gelombang Peristalsis Keta & Kaki Belakang Z","iconType":"fish","iconUrl":"../assets/icons/bio414-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Biomekanik 4 Haiwan Model","voiceCaption":"Pelajari mekanisme gerak alih ikan, burung, cacing tanah dan belalang melalui tindakan otot antagonis.","voiceScript":"[warm] Unit ketiga merangkumi empat mekanisme gerak alih haiwan wajib dalam S-P-M! Pertama, ikan menggunakan segmen otot miotom berbentuk huruf W yang mengecut secara antagonis kiri dan kanan untuk melibaskan ekor menolak air ke belakang dan tepi. Kedua, burung mengepakkan sayap apabila otot pektoralis major mengecut menarik sayap ke bawah dan pektoralis minor mengecut menaikkan sayap ke atas. Ketiga, cacing tanah bergerak menggunakan rangka hidrostatik melalui gelombang peristalsis otot lingkar dan membujur bersama cengkaman keta. Keempat, belalang melompat seperti lastik apabila otot ekstensor meluruskan kaki belakang yang dilipat berbentuk Z!","title":"14.3 Mekanisme Gerak Alih Haiwan","acronym":"I•B•C•B","hook":"Sama ada berenang, terbang, merayap atau melompat seperti lastik — kesemua empat haiwan bergantung kepada otot antagonis!","mediaKey":"bio414_gerak_alih_haiwan","summary":"Setiap haiwan mengadaptasi rangka (dalam, hidrostatik, luar) bersama pasangan otot antagonis untuk menolak medium sekeliling.","bullets":["Ikan: Turus vertebra fleksibel + miotom berbentuk W. Miotom kanan mengecut & kiri mengendur -> ekor melibas ke kanan menolak air ke belakang & tepi -> tujah ke hadapan. Sirip mengawal arah & imbangan.","Burung: Tulang berongga ringan & kuat. Pektoralis MAJOR mengecut (minor mengendur) -> tarik sayap ke bawah (daya angkat). Pektoralis MINOR mengecut (major mengendur) -> naikkan sayap ke atas.","Cacing Tanah: Rangka hidrostatik + gelombang peristalsis. Otot membujur mengecut & lingkar mengendur -> pendek & tebal (keta cengkam tanah); Otot lingkar mengecut & membujur mengendur -> panjang & nipis ke hadapan.","Belalang: Fleksor & ekstensor di dalam rangka luar. Rehat: fleksor mengecut melipat kaki belakang bentuk huruf Z. Lompat: ekstensor mengecut meluruskan kaki belakang seperti lastik ke depan & atas."],"labId":"bio414_gerak_alih_haiwan","labTitle":"Simulator Gerak Alih 4 Haiwan Model","labProps":{"animal":0},"examTip":"Kesilapan kerap SPM: Apabila cacing memanjang dan menipis, otot LINGKAR yang mengecut (bukan otot membujur)!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Otot Antagonis Haiwan","voiceCaption":"Padankan otot miotom, pektoralis major, otot lingkar dan ekstensor belalang dengan gerak balasnya.","voiceScript":"[curious] Padankan otot haiwan di sebelah kiri dengan gerakan sebenar yang terhasil ketika otot tersebut mengecut!","prompt":"Padankan struktur otot gerak alih haiwan dengan tindakan pengecutannya:","pairs":[{"id":"gh1","left":"Otot miotom kanan ikan mengecut","right":"Miotom kiri mengendur lalu ekor melibas ke kanan menolak air"},{"id":"gh2","left":"Pektoralis major burung mengecut","right":"Menarik sayap ke bawah untuk menjana daya angkat penerbangan"},{"id":"gh3","left":"Otot lingkar anterior cacing mengecut","right":"Otot membujur mengendur menjadikan segmen memanjang dan menipis"},{"id":"gh4","left":"Otot ekstensor kaki belalang mengecut","right":"Meluruskan kaki daripada bentuk Z melastikkan belalang ke udara"}],"explanation":"Kesemua empat sistem ini memerlukan otot pasangan mengendur pada masa otot pasangannya mengecut."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Peristalsis Cacing Tanah","voiceCaption":"Susun fasa pergerakan cacing tanah menggunakan otot lingkar, otot membujur dan keta.","voiceScript":"[confident] Berdasarkan Rajah empat belas perpuluhan dua puluh buku teks, susun urutan pergerakan cacing tanah menuju ke hadapan!","prompt":"Susun urutan tindakan otot dan keta cacing tanah semasa merayap ke hadapan:","hint":"Mulakan dari segmen posterior memendek & keta belakang mencengkam sebelum segmen anterior memanjang.","answerTokens":["Membujur Posterior Mengecut (Pendek & Tebal)","Keta Posterior Cengkam Tanah","Lingkar Anterior Mengecut (Panjang ke Depan)","Keta Anterior Cengkam & Tarik Posterior"],"distractors":["Kaki Dilipat Bentuk Huruf Z","Pektoralis Minor Menarik Sayap"],"explanation":"Pelepasan dan cengkaman keta secara bergilir memastikan cacing tidak tergelincir ke belakang."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Aksi Burung & Belalang","voiceCaption":"Kelaskan tindakan otot semasa sayap burung turun vs naik serta belalang rehat vs melompat.","voiceScript":"[warm] Asingkan keadaan otot burung dan belalang ini mengikut fasa pergerakannya!","prompt":"Isihkan tindakan otot burung dan belalang mengikut kesannya:","buckets":[{"id":"turun","label":"Sayap Turun / Kaki Lurus Melompat"},{"id":"naik","label":"Sayap Naik / Kaki Lipat Z Rehat"}],"items":[{"text":"Pektoralis major burung mengecut (minor mengendur)","bucketId":"turun","note":"Menarik sayap ke bawah menolak udara."},{"text":"Ekstensor kaki belakang belalang mengecut","bucketId":"turun","note":"Meluruskan kaki belakang melastik ke udara."},{"text":"Pektoralis minor burung mengecut (major mengendur)","bucketId":"naik","note":"Mengangkat sayap ke atas."},{"text":"Fleksor kaki belakang belalang mengecut","bucketId":"naik","note":"Melipat kaki membentuk huruf Z ketika rehat."}],"explanation":"Fleksor membengkokkan (lipat Z); ekstensor meluruskan (melompat)."}]},{"id":"bio414-u4","title":"Unit 4: Isu Kesihatan Otot Rangka & Penjagaan Postur","subtitle":"Subtopik 14.4 — Osteoporosis, Osteomalasia/Rikets, Osteoartritis, Skoliosis & 4 Amalan Penjagaan Sihat","iconType":"spine","iconUrl":"../assets/icons/bio414-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"5 Penyakit Tulang & Penjagaan","voiceCaption":"Kenali osteoporosis, osteomalasia, rikets, osteoartritis dan skoliosis serta amalan penjagaan postur, pakaian, senaman dan gizi seimbang.","voiceScript":"[warm] Unit keempat membincangkan lima isu kesihatan sistem otot rangka yang kerap disoal dalam S-P-M. Osteoporosis menyebabkan tulang poros dan mudah patah akibat kehilangan kalsium melebihi penyerapan, terutama dalam kalangan wanita menopaus kerana aras estrogen yang rendah. Kekurangan kalsium, fosforus dan vitamin D menyebabkan osteomalasia pada orang dewasa serta rikets pada kanak-kanak. Pengurangan bendalir sinovia dan kehausan rawan pula mencetuskan osteoartritis, manakala kelengkungan tulang belakang berbentuk S atau C dikenali sebagai skoliosis!","title":"14.4 Gangguan Otot Rangka & Amalan Penjagaan","acronym":"O•R•A•S","hook":"Duduk dengan dompet di poket belakang atau menunduk lama melihat telefon pintar boleh merosakkan penjajaran turus vertebra secara senyap!","summary":"Hormon estrogen, kalsium, fosfat, vitamin D & vitamin C serta senaman dan postur betul penting mengekalkan kepadatan tulang dan kelenturan sendi.","bullets":["Osteoporosis: Kehilangan kalsium melebihi penyerapan -> tulang poros & rapuh (ketinggian susut, postur bongkok). Kerap pada wanita menopaus kerana aras ESTROGEN rendah (estrogen bantu penyerapan kalsium & kurangkan kehilangan kalsium).","Osteomalasia & Rikets: Tulang lembut akibat kekurangan kalsium, fosforus & vitamin D (Osteomalasia pada dewasa / wanita hamil; Rikets pada kanak-kanak).","Osteoartritis & Skoliosis: Osteoartritis (kurang bendalir sinovia, rawan haus menipis, ligamen memendek -> sendi bengkak & sakit). Skoliosis (tulang belakang bengkok ke sisi membentuk huruf S atau C).","4 Amalan Penjagaan: Postur badan betul (elak membongkok, elak dompet di poket belakang, elak menunduk gajet/beg berat), Pakaian & kasut sesuai (pakaian longgar, kasut tumit rendah berkusyen — elak kasut tumit tinggi), Senaman (kukuhkan sendi & tambah mendapan mineral tulang), Gizi seimbang (kalsium, fosfat, vitamin D bantu serap kalsium, VITAMIN C tingkatkan jisim tulang)."],"labId":"bio414_galeri_rangka","labTitle":"Galeri Anatomi Rangka & Keta","labProps":{},"examTip":"Jangan tertukar peranan vitamin: Vitamin D = bantu penyerapan kalsium; Vitamin C = tingkatkan jisim tulang; Estrogen = bantu metabolisme & serapan kalsium!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan 5 Gangguan Otot Rangka","voiceCaption":"Padankan osteoporosis, rikets/osteomalasia, osteoartritis dan skoliosis dengan ciri atau puncanya.","voiceScript":"[curious] Uji kefahaman klinikal anda dengan memadankan penyakit otot rangka ini dengan ciri dan puncanya yang betul!","prompt":"Padankan penyakit sistem otot rangka berikut dengan keterangan tepatnya:","pairs":[{"id":"pk1","left":"Osteoporosis (wanita menopaus)","right":"Penurunan estrogen mengurangkan serapan kalsium menjadikan tulang poros"},{"id":"pk2","left":"Rikets & Osteomalasia","right":"Tulang lembut akibat kekurangan kalsium, fosforus dan vitamin D"},{"id":"pk3","left":"Osteoartritis","right":"Kehausan rawan, pengurangan bendalir sinovia & pemendekan ligamen"},{"id":"pk4","left":"Skoliosis","right":"Tulang belakang membengkok ke sisi membentuk huruf S atau C"}],"explanation":"Rikets ialah versi kanak-kanak bagi osteomalasia dewasa, manakala osteoporosis melibatkan kehilangan jisim mineral tulang."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Tabiat Dompet & Telefon Pintar","voiceCaption":"Ramalkan kesan jangka panjang duduk dengan dompet di poket belakang dan menunduk lama menggunakan telefon pintar.","voiceScript":"[curious] Berdasarkan perbincangan buku teks: apakah kesannya jika seseorang selalu duduk dengan dompet tebal di poket belakang atau menunduk menatap telefon pintar?","hook":"Fikirkan tekanan tidak simetri pada cakera rawan vertebra!","scenario":"Seorang pelajar kerap menunduk lama memandang telefon pintar dan duduk di atas dompet tebal di poket belakang.","prompt":"Apakah kesan tabiat postur buruk tersebut terhadap sistem otot rangka?","options":["Menyebabkan ketidaksejajaran turus vertebra akibat tekanan tidak sekata, sakit belakang dan leher, serta berisiko menekan saraf dan mengganggu peredaran darah","Menukarkan sendi engsel lutut menjadi sendi tidak bergerak","Meningkatkan penyerapan vitamin D melalui tulang pelvis","Menguatkan otot pektoralis major secara automatik"],"correctIndex":0,"proofLabId":"bio414_galeri_rangka","proofState":{},"explanation":"Postur yang betul mengelakkan tekanan berlebihan pada tulang belakang, saraf dan salur darah."},{"type":"mcq","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Nutrien Tulang Patah & Pencegahan","voiceCaption":"Pilih makanan dan nutrien terbaik membantu penyembuhan tulang patah serta pencegahan osteoporosis.","voiceScript":"[warm] Apakah gabungan nutrien dan amalan sejak usia muda yang paling berkesan untuk menyembuhkan tulang patah dan mencegah osteoporosis?","prompt":"Makanan dan amalan manakah paling sesuai untuk pesakit tulang patah serta pencegahan awal osteoporosis?","options":["Susu, keju dan sayur hijau kaya kalsium, fosfat, vitamin D (bantu serap kalsium) serta vitamin C (tingkatkan jisim tulang), disertai senaman berkala","Diet tinggi lemak tepu dan gula ringkas tanpa senaman","Pengambilan garam berlebihan untuk menguatkan ligamen","Berbaring sepanjang hari tanpa sebarang pergerakan"],"correctIndex":0,"explanation":"Kalsium/fosfat membina mineral tulang, vitamin D membantu serap kalsium, vitamin C meningkatkan jisim tulang dan senaman menggalakkan pemendapan mineral."}]},{"id":"bio414-u5","title":"Unit 5: Ujian Bos SPM — Sokongan & Pergerakan","subtitle":"Cabaran Sumatif Kertas 1 & Kertas 2 Biologi Bab 14 (Tulang Berongga, Bekalan Darah Otot & Perancah Tiub Nano Karbon)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Sintesis KBAT Bab 14","voiceCaption":"Ujian Bos Bab Empat Belas merangkumi kelebihan tulang panjang berongga, hubungan vertebra toraks dengan pernafasan, bekalan darah ke otot dan bahan bio-kejuruteraan tulang.","voiceScript":"[excited] Selamat datang ke Ujian Bos Bab Empat Belas! Ingat tiga perkara K-B-A-T penting buku teks: tulang panjang mamalia yang berongga adalah lebih ringan untuk pergerakan tetapi tetap kuat menahan tekanan mampatan, malah rongganya menyimpan sumsum tulang! Kedua, vertebra toraks bersendi dengan tulang rusuk membentuk sangkar rusuk yang bergerak naik dan turun semasa menarik serta menghembus nafas. Ketiga, bekalan darah mencukupi ke otot amat diperlukan untuk membekalkan oksigen dan glukosa bagi menjana tenaga A-T-P pengecutan otot!","title":"Strategi Esei & KBAT Praktis Sumatif Bab 14","acronym":"BOS•14","hook":"Struktur silinder berongga pada tulang panjang memberi kekuatan maksimum dengan berat minimum!","summary":"Tulang berongga ringan dan menempatkan sumsum tulang; pengecutan otot bergantung kepada ATP daripada bekalan oksigen dan glukosa dalam darah.","bullets":["Tulang Berongga Mamalia & Burung (Pengayaan Q11-12): Lebih ringan, teguh menahan tekanan lenturan/mampatan, dan ruang dalamannya mengandungi sumsum tulang (penghasilan sel darah).","Vertebra Toraks & Pernafasan (Sumatif Q6c): Bersendi dengan tulang rusuk membentuk sangkar rusuk yang bergerak menukar isipadu rongga toraks.","Bekalan Darah ke Otot (Sumatif Q5): Menghantar O2 & glukosa untuk respirasi sel menjana ATP, serta menyingkirkan CO2 & asid laktik."],"labId":"bio414_simulator_lengan_kaki","labTitle":"Semakan Koordinasi Otot-Tendon-Sendi","labProps":{"bent":false},"examTip":"Untuk soalan Pengayaan 13 (bahan ganti tulang seperti tiub nano karbon), nyatakan: biokompatibel/tidak toksik, kuat, ringan, tidak mengarat dan berliang untuk pertumbuhan tisu!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"KBAT: Kelebihan Tulang Berongga","voiceCaption":"Ramalkan kelebihan tulang panjang mamalia yang berongga berbanding tulang padat.","voiceScript":"[curious] Soalan Pengayaan sebelas: jelaskan kelebihan tulang panjang mamalia yang berongga berbanding tulang yang padat sepenuhnya!","hook":"Fikirkan jisim tulang, kekuatan silinder dan kandungan di dalam rongga tulang!","scenario":"Keratan memanjang tulang femur mamalia menunjukkan bahagian tengahnya berongga dan tidak padat.","prompt":"Apakah kelebihan utama tulang panjang mamalia yang berongga?","options":["Lebih ringan untuk memudahkan pergerakan, tetap kuat menahan mampatan dan lenturan, serta menempatkan sumsum tulang bagi penghasilan sel darah","Membolehkan otot fleksor tumbuh di dalam rongga tulang","Menukarkan rangka dalam kepada rangka hidrostatik","Mengurangkan keperluan kalsium dalam pemakanan"],"correctIndex":0,"proofLabId":"bio414_simulator_lengan_kaki","proofState":{"bent":true},"explanation":"Rongga tulang mengurangkan berat rangka sambil mengekalkan kekuatan mekanikal dan menyimpan sumsum tulang."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Susun Kerjasama Lengan Membengkok","voiceCaption":"Susun kerjasama antara otot biseps, triseps, tendon, ligamen dan sendi engsel semasa membengkokkan lengan.","voiceScript":"[confident] Susun empat langkah koordinasi otot biseps, triseps, tendon, ligamen dan sendi siku ketika membengkokkan lengan ke atas!","prompt":"Susun urutan peristiwa yang menyebabkan lengan bawah membengkok ke atas:","hint":"Bermula dengan pengecutan biseps/pengenduran triseps, tarikan melalui tendon & sokongan ligamen/sinovia.","answerTokens":["Biseps Mengecut & Triseps Mengendur","Tendon Pindah Daya ke Radius","Ligamen & Bendalir Sinovia Stabilkan Sendi","Tulang Radius Ditarik Bengkok ke Atas"],"distractors":["Triseps Menarik Ulna ke Bawah","Pektoralis Minor Mengecut"],"explanation":"Otot antagonis, tendon tak kenyal, ligamen kenyal dan bendalir sinovia bekerjasama dalam setiap pergerakan sendi."},{"type":"sort","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Isih Faktor Pengecutan Otot & Toraks","voiceCaption":"Kelaskan peranan bekalan darah dalam pengecutan otot dan peranan vertebra toraks dalam pernafasan.","voiceScript":"[warm] Asingkan fakta Sumatif Bab Empat Belas ini mengikut peranan bekalan darah ke otot berbanding peranan vertebra toraks!","prompt":"Isihkan pernyataan berikut mengikut tajuk sokongan atau metabolisme otot:","buckets":[{"id":"darah","label":"Bekalan Darah ke Otot (Sumatif Q5)"},{"id":"toraks","label":"Vertebra Toraks & Pernafasan (Q6c)"}],"items":[{"text":"Membekalkan oksigen dan glukosa untuk respirasi sel menjana ATP","bucketId":"darah","note":"Pengecutan otot memerlukan bekalan tenaga ATP berterusan."},{"text":"Mengangkut keluar karbon dioksida dan asid laktik daripada otot","bucketId":"darah","note":"Mencegah kelesuan dan kekejangan otot."},{"text":"Bersendi dengan tulang rusuk membentuk sangkar rusuk pelindung","bucketId":"toraks","note":"Melindungi jantung dan peparu."},{"text":"Membolehkan sangkar rusuk naik dan turun semasa menarik serta menghembus nafas","bucketId":"toraks","note":"Mengubah tekanan dan isipadu rongga toraks."}],"explanation":"Sistem otot rangka bergantung erat kepada sistem peredaran darah untuk tenaga dan sistem respirasi yang dilindungi oleh vertebra toraks."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Soalan Akhir Bos: Perancah Tulang","voiceCaption":"Pilih ciri wajib bahan baharu (seperti tiub nano karbon) untuk menggantikan dan menyokong pertumbuhan tulang patah.","voiceScript":"[excited] Soalan penutup Bab Empat Belas bertaraf Pengayaan! Apakah ciri utama yang wajib ada pada bahan gantian atau perancah tulang patah seperti tiub nano karbon?","prompt":"Apakah ciri paling penting yang wajib ada pada bahan baharu (seperti tiub nano karbon) bagi merawat dan menggantikan tulang patah?","options":["Kuat menahan tekanan, ringan, lengai secara biologi (tidak toksik/tidak ditolak badan), tahan kakisan dan berliang bagi menyokong pertumbuhan sel tulang baharu","Mudah larut serta-merta dalam air dan lembut seperti getah","Merembeskan asid hidroklorik untuk melarutkan tulang berhampiran","Membentuk rangka luar di luar permukaan kulit"],"correctIndex":0,"explanation":"Syabas! Bahan bioperubatan tulang mesti biokompatibel, kuat, ringan, tidak toksik dan menyokong regenerasi tisu tulang."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var backBtn = document.getElementById("notaBackBtn");

    var backLabel = canStepBack

  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {

  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;

  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
