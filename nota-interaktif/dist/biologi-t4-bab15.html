  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t4-bab15","subject":"Biologi","subjectGroup":"sains","form":4,"chapterNumber":15,"title":"Pembiakan Seks, Perkembangan dan Pertumbuhan dalam Manusia dan Haiwan","subtitle":"Subtopik 15.1-15.7 KSSM — Anatomi Pembiakan, Spermatogenesis vs Oogenesis, Hormon Kitar Haid, HCG & Plasenta, Kembar, Kemandulan, Lengkung Sigmoid & Ekdisis.","estimatedMinutes":35,"themeAccent":"#c026d3","isFreePreview":false,"labScript":"biologi-t4-bab15-labs.js","coverIcon":"../assets/icons/bio415-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[warm] Tepat sekali! Pemahaman anda tentang gametogenesis, hormon kitar haid dan pertumbuhan amat hebat!","combo":"[excited] Luar biasa! Rantaian jawapan tepat ini menunjukkan anda menguasai Bab Penutup Biologi Tingkatan Empat!","encourage":"[softly] Hampir berjaya! Semak semula paras FSH, LH, estrogen, progesteron atau fasa lengkung pertumbuhan.","celebrate":"[cheerful] Tahniah! Anda telah menamatkan kesemua lima belas bab Biologi Tingkatan Empat dengan jayanya!"},"units":[{"id":"bio415-u1","title":"Unit 1: Sistem Pembiakan & Gametogenesis Manusia","subtitle":"Subtopik 15.1 & 15.2 — Anatomi Pembiakan, Spermatogenesis (Testis), Oogenesis (Ovari) & Struktur Sperma/Folikel Graaf","iconType":"dna","iconUrl":"../assets/icons/bio415-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Spermatogenesis vs Oogenesis","voiceCaption":"Gametogenesis menghasilkan gamet haploid n melalui meiosis supaya persenyawaan menghasilkan zigot diploid 2n. Bandingkan spermatogenesis dan oogenesis.","voiceScript":"[warm] Selamat datang ke Bab Lima Belas, bab terakhir Biologi Tingkatan Empat! Dalam pembiakan seks, gametogenesis menghasilkan sperma dan oosit sekunder yang haploid supaya nukleus kedua-duanya bercantum membentuk zigot diploid dua-n. Spermatogenesis berlaku berterusan di tubul seminiferus testis bermula akil baligh hingga tua, di mana satu spermatosit primer menghasilkan empat sperma matang. Sebaliknya, oogenesis bermula semasa fetus perempuan dalam kandungan dan terhenti pada profasa satu sebelum diteruskan semula pada akil baligh sehingga putus haid, menghasilkan hanya satu oosit sekunder berfungsi serta jasad kutub!","title":"15.1 Anatomi Pembiakan & 15.2 Gametogenesis","acronym":"S•O•G•Z","hook":"Jutaan sperma dihasilkan setiap hari di testis sejak akil baligh — tetapi oogenesis dalam ovari sudah bermula sebelum seorang bayi perempuan dilahirkan!","mediaKey":"bio415_kitar_haid","summary":"Spermatogenesis menghasilkan 4 sperma haploid secara berterusan melalui pembezaan, manakala oogenesis menghasilkan 1 oosit sekunder berfungsi yang melengkapkan meiosis II hanya selepas ditembusi sperma.","bullets":["Anatomi Pembiakan: Wanita = Ovari, Tiub Falopio (bersilia + peristalsis bawa oosit/embrio; tapak persenyawaan), Uterus (endometrium kaya salur darah), Serviks & Faraj. Lelaki = Testis dalam skrotum, Vesikel semen (bendalir bernutrien), Kelenjar prostat (bantu pergerakan sperma), Duktus sperma (vas deferens), Zakar & Uretra.","Spermatogenesis (Testis; FSH, LH, Testosteron & Sel Sertoli pembekal nutrien): Sel germa primordium (2n) -> mitosis -> spermatogonium (2n) -> spermatosit primer (2n) -> Meiosis I -> 2 spermatosit sekunder (n) -> Meiosis II -> 4 spermatid (n) -> pembezaan -> 4 Sperma (Kepala bernukleus, Bahagian Tengah padat MITOKONDRIA untuk tenaga, Ekor).","Oogenesis (Ovari; FSH, LH & Estrogen): Bermula SEBELUM LAHIR -> oogonium (2n) -> oosit primer terhenti di PROFASA I meiosis I. Akil baligh -> lengkap meiosis I hasilkan 1 Oosit Sekunder (n) (terhenti di METAFASA II dalam folikel sekunder -> folikel Graaf) + Jasad Kutub 1. Meiosis II hanya lengkap apabila ditembusi sperma -> Ovum (n) + jasad kutub."],"labId":"bio415_gametogenesis_struktur","labTitle":"Simulator Spermatogenesis vs Oogenesis","labProps":{"tab":"sperm"},"examTip":"Peringkat penghentian oogenesis kerap keluar SPM: Sebelum lahir terhenti pada PROFASA I; semasa ovulasi terhenti pada METAFASA II sehingga ditembusi sperma!"},{"type":"match","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Struktur Gametogenesis","voiceCaption":"Padankan sel Sertoli, bahagian tengah sperma, oosit sekunder dan tiub Falopio dengan fungsinya.","voiceScript":"[curious] Padankan istilah penting gametogenesis dan struktur pembiakan ini dengan fungsi tepatnya!","prompt":"Padankan struktur atau fasa gametogenesis berikut dengan huraian tepatnya:","pairs":[{"id":"gm1","left":"Sel Sertoli dalam tubul seminiferus","right":"Membekalkan nutrien sepanjang proses spermatogenesis"},{"id":"gm2","left":"Bahagian tengah sperma","right":"Padat mitokondria untuk menjana tenaga berenang ke tiub Falopio"},{"id":"gm3","left":"Oosit sekunder dalam folikel Graaf","right":"Terhenti pada metafasa II dan lengkap meiosis II bila ditembusi sperma"},{"id":"gm4","left":"Tiub Falopio bersilia dengan peristalsis","right":"Tapak persenyawaan dan menggerakkan embrio ke uterus"}],"explanation":"Bahagian tengah sperma kaya mitokondria manakala sel Sertoli membekalkan nutrisi semasa pembentukan sperma."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Ketiadaan Gametogenesis","voiceCaption":"Ramalkan kesan kepada pembiakan dan bilangan kromosom spesies jika gametogenesis tidak berlaku.","voiceScript":"[curious] Soalan Praktis Formatif lima belas perpuluhan dua: apakah yang akan berlaku sekiranya proses gametogenesis tidak berlaku pada manusia?","hook":"Ingat tujuan utama meiosis dalam membentuk gamet haploid (n)!","scenario":"Proses gametogenesis di gonad lelaki dan wanita terhenti atau gagal menghasilkan gamet haploid.","prompt":"Apakah kesan utama sekiranya gametogenesis tidak berlaku?","options":["Tiada gamet haploid terbentuk untuk persenyawaan (menyebabkan kemandulan), atau jika sel diploid bercantum, bilangan kromosom zigot berganda setiap generasi dan spesies tidak dapat dikekalkan","Individu masih boleh membiak normal melalui mitosis di dalam uterus","Hormon tiroksina mengambil alih fungsi gamet untuk membentuk zigot","Kitar haid menghasilkan empat ovum matang setiap hari"],"correctIndex":0,"proofLabId":"bio415_gametogenesis_struktur","proofState":{"tab":"oogen"},"explanation":"Gametogenesis memastikan gamet adalah haploid (n) supaya persenyawaan memulihkan bilangan kromosom diploid (2n) yang malar."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Fasa Spermatogenesis","voiceCaption":"Susun urutan pembentukan sel daripada sel germa primordium hingga sperma matang.","voiceScript":"[confident] Susun empat peringkat perkembangan sel semasa spermatogenesis dari fasa penggandaan hingga pematangan!","prompt":"Susun turutan pembentukan sperma di dalam tubul seminiferus:","hint":"Mitosis -> membesar jadi spermatosit primer -> meiosis I -> meiosis II -> pembezaan.","answerTokens":["Spermatogonium (2n) oleh Mitosis","Spermatosit Primer (2n)","Dua Spermatosit Sekunder (n)","Empat Spermatid (n) Berbeza Jadi Sperma"],"distractors":["Tiga Jasad Kutub Merosot","Pembentukan Korpus Luteum"],"explanation":"Satu spermatosit primer menghasilkan 4 spermatid yang menjalani pembezaan membentuk 4 sperma."}]},{"id":"bio415-u2","title":"Unit 2: Kitar Haid, Kawalan Hormon & Menopaus","subtitle":"Subtopik 15.3 — GnRH, FSH, LH, Estrogen & Progesteron (Hari 0-28), Keguguran, Sindrom Prahaid (PMS) & Menopaus","iconType":"cycle","iconUrl":"../assets/icons/bio415-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Dinamik Hormon Kitar Haid","voiceCaption":"Interaksi GnRH, FSH, LH, estrogen dan progesteron mengawal perkembangan folikel, ovulasi hari ke-14 dan penebalan endometrium.","voiceScript":"[warm] Unit kedua membedah graf kitar haid yang sangat popular dalam kertas S-P-M! Pada hari sifar hingga lima, aras estrogen dan progesteron rendah menyebabkan endometrium meluruh sebagai haid, manakala hipotalamus merembes G-n-R-H yang merangsang pituitari merembes F-S-H bagi pertumbuhan folikel. Menjelang hari keenam hingga keempat belas, folikel membesar merembes estrogen yang memuncak pada hari kedua belas lalu merangsang lonjakan L-H pada hari ketiga belas secara suap balik positif untuk mencetuskan ovulasi pada hari keempat belas! Selepas ovulasi, korpus luteum merembes progesteron bagi menebalkan endometrium untuk penempelan!","title":"15.3 Perubahan Hormon Sepanjang Kitar Haid 28 Hari","acronym":"F•E•L•P","hook":"Estrogen memuncak Hari ke-12, mencetuskan lonjakan LH Hari ke-13, membebaskan oosit sekunder pada Hari ke-14 — tepat seperti jam biologi!","videoClip":{"src":"../assets/biologi-t4-bab15/video/bio415_video_kitar_haid_narasi.mp4","hasNarration":true,"posterKey":"bio415_kitar_haid","caption":"Kitar haid (FSH, estrogen, LH, progesteron), ovulasi hari ke-14 dan penempelan blastosista."},"summary":"Suap balik positif oleh puncak estrogen merangsang lonjakan LH untuk ovulasi; selepas itu progesteron menebalkan endometrium dan merencat FSH/LH secara suap balik negatif.","bullets":["Hari 0-5 (Haid): Estrogen & progesteron rendah -> endometrium meluruh. Hipotalamus rembes GnRH -> pituitari rembes FSH (rangsang pertumbuhan folikel) & LH; estrogen rendah merencat FSH/LH (suap balik negatif).","Hari 6-14 (Ovulasi): Estrogen membaiki & menebalkan endometrium, lalu MEMUNCAK HARI KE-12 -> merangsang GnRH secara SUAP BALIK POSITIF -> LH MEMUNCAK HARI KE-13 -> OVULASI HARI KE-14 (oosit sekunder keluar dari folikel Graaf) -> sisa folikel jadi KORPUS LUTEUM.","Hari 15-28: Korpus luteum rembes PROGESTERON & estrogen (rencat FSH/LH melalui suap balik negatif; tebalkan endometrium). Tanpa persenyawaan: LH turun -> korpus luteum merosot -> haid. Jika hamil: korpus luteum kekal 3-4 bulan sebelum plasenta ambil alih.","Keguguran, PMS & Menopaus: Kejatuhan progesteron menyebabkan uterus mengecut -> risiko keguguran. Sindrom prahaid (PMS) muncul 7-14 hari sebelum haid akibat ketidakseimbangan estrogen & progesteron. Menopaus (46-50 tahun): rembesan hormon turun dan ovari berhenti menghasilkan ovum."],"labId":"bio415_simulator_kitar_haid","labTitle":"Simulator Fasa Kitar Haid 28 Hari","labProps":{"phase":1},"examTip":"Ingat susunan hari tepat: Hari 12 = Puncak Estrogen; Hari 13 = Puncak LH; Hari 14 = Ovulasi!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Suap Balik Positif Ovulasi","voiceCaption":"Susun rantaian peristiwa hormon daripada puncak estrogen hari ke-12 hingga ovulasi dan penebalan endometrium.","voiceScript":"[confident] Susun empat peristiwa hormon penting daripada hari kedua belas hingga hari kelima belas kitar haid!","prompt":"Susun urutan peristiwa hormon yang mencetuskan ovulasi dan fasa luteum:","hint":"Puncak estrogen -> GnRH tinggi -> puncak LH -> ovulasi -> korpus luteum rembes progesteron.","answerTokens":["Estrogen Memuncak Hari ke-12","GnRH & LH Melonjak Hari ke-13","Ovulasi Oosit Sekunder Hari ke-14","Korpus Luteum Rembes Progesteron"],"distractors":["Endometrium Meluruh Hari ke-14","Menopaus Bermula"],"explanation":"Lonjakan LH pada hari ke-13 adalah pencetus utama ovulasi pada hari ke-14 dan pembentukan korpus luteum."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kesan Pil Perancang Merencat FSH","voiceCaption":"Ramalkan kesan pil perancang kehamilan yang merencatkan rembesan FSH terhadap kitar haid.","voiceScript":"[curious] Soalan Praktis Sumatif enam: apakah kesan kepada kitar haid seorang wanita apabila pil perancang menghalang rembesan hormon perangsang folikel, F-S-H?","hook":"Periksa semula fasa Hari 0-5 pada Simulator Kitar Haid!","scenario":"Seorang wanita mengambil pil perancang kehamilan yang menghalang kelenjar pituitari merembeskan FSH.","prompt":"Apakah kesan pengambilan pil tersebut ke atas kitar haidnya?","options":["Folikel primer gagal berkembang menjadi folikel Graaf, aras estrogen kekal rendah tanpa lonjakan LH, menyebabkan tiada ovulasi berlaku","Korpus luteum membengkak dan membebaskan dua ovum serentak","Hormon HCG dirembeskan walaupun tiada embrio","Oosit primer terus mengalami ekdisis di uterus"],"correctIndex":0,"proofLabId":"bio415_simulator_kitar_haid","proofState":{"phase":0},"explanation":"Tanpa FSH, perkembangan folikel terhenti, tiada puncak estrogen/LH, dan ovulasi dicegah."},{"type":"mcq","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Korpus Luteum Hari 16-24 vs 24-28","voiceCaption":"Kenal pasti perubahan korpus luteum dan aras progesteron pada hari ke-24 hingga ke-28 jika tiada persenyawaan.","voiceScript":"[warm] Soalan Praktis Sumatif tujuh c: bagaimana perubahan korpus luteum dan aras progesteron dari hari dua puluh empat hingga dua puluh lapan jika tiada persenyawaan?","prompt":"Apabila persenyawaan TIDAK berlaku, bagaimanakah perubahan korpus luteum dan aras progesteron dari hari ke-24 hingga ke-28?","options":["Korpus luteum merosot dan mengecut, menyebabkan rembesan progesteron dan estrogen menurun lalu endometrium meluruh sebagai haid","Korpus luteum terus membesar hingga bulan kesembilan","Korpus luteum bertukar menjadi folikel primer dan merembes FSH","Progesteron meningkat dua kali ganda untuk menghentikan haid"],"correctIndex":0,"explanation":"Pada hari ke-16 hingga ke-24, korpus luteum berkembang meningkatkan progesteron; selepas hari ke-24 tanpa persenyawaan, ia merosot menyebabkan haid."}]},{"id":"bio415-u3","title":"Unit 3: Perkembangan Fetus, Kembar & Kemandulan","subtitle":"Subtopik 15.4, 15.5 & 15.6 — Zigot ke Blastosista, HCG, Plasenta & Tali Pusat, Kembar Seiras/Tak Seiras/Siam & IVF","iconType":"cells","iconUrl":"../assets/icons/bio415-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Embrio, Plasenta, Kembar & IVF","voiceCaption":"Pelajari urutan zigot hingga penempelan blastosista, peranan HCG dan plasenta, peredaran darah terasing, tiga jenis kembar serta rawatan kemandulan.","voiceScript":"[warm] Unit ketiga membincangkan perkembangan embrio, pembentukan kembar dan kemandulan! Selepas persenyawaan di tiub Falopio, zigot membahagi secara mitosis membentuk embrio dua sel, morula, dan seterusnya blastosista yang menempel pada endometrium uterus. Plasenta menghasilkan hormon H-C-G pada awal kehamilan untuk mengekalkan korpus luteum agar terus merembes estrogen dan progesteron. Ingat juga mengapa darah ibu dan fetus tidak bercampur di plasenta: untuk melindungi fetus daripada sesetengah bakteria atau toksin, mengelakkan salur darah fetus pecah akibat tekanan darah tinggi ibu, dan mengelakkan pengaglutinan jika kumpulan darah berbeza!","title":"15.4 Perkembangan Fetus, 15.5 Kembar & 15.6 Kemandulan","acronym":"Z•E•M•B•P","hook":"Dua bayi kembar seiras berkongsi satu plasenta dan DNA yang hampir 100% sama — manakala kembar tak seiras mempunyai plasenta masing-masing seperti adik-beradik biasa!","summary":"HCG mengekalkan korpus luteum pada awal kehamilan; plasenta membenarkan pertukaran bahan tanpa mencampurkan darah ibu dengan darah fetus.","bullets":["Perkembangan Awal & HCG: Zigot (2n) -> embrio 2 sel -> MORULA -> BLASTOSISTA -> PENEMPELAN pada endometrium. Hormon HCG (berganda setiap 2-3 hari dalam 4 minggu awal, dikesan dalam urin ibu hamil) memastikan korpus luteum terus merembes estrogen & progesteron hingga bulan ke-4 sebelum plasenta ambil alih.","Plasenta & Tali Pusat: Vena tali pusat bawa darah beroksigen & nutrien ke fetus; Arteri tali pusat bawa CO2 & urea ke plasenta. Membran pemisah melindungi fetus daripada toksin/bakteria tertentu, menghalang tekanan darah tinggi ibu memecahkan salur darah fetus, dan mencegah pengaglutinan darah (namun dadah, nikotin, alkohol, HIV & rubella boleh merentasi).","Kembar & Kemandulan: Seiras (1 ovum + 1 sperma -> embrio bahagi dua -> kongsi 1 plasenta -> genetik/jantina sama); Tak seiras (2 ovum + 2 sperma -> 2 plasenta berasingan -> genetik berbeza); Kembar Siam (pembahagian embrio seiras tidak lengkap). Kemandulan dirawat melalui terapi hormon, pembedahan saluran tersumbat atau IVF."],"labId":"bio415_embrio_kembar","labTitle":"Peneroka Kembar Seiras, Tak Seiras & Siam","labProps":{"mode":"identical"},"examTip":"Awas laluan arah tali pusat: VENA tali pusat membawa darah BEROKSIGEN (dari plasenta ke fetus), manakala ARTERI tali pusat membawa darah TERDEOKSIGEN!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Zigot Hingga Penempelan","voiceCaption":"Susun urutan pembentukan zigot, embrio dua sel, morula, blastosista dan penempelan.","voiceScript":"[confident] Susun empat peringkat perkembangan awal daripada persenyawaan di tiub Falopio hingga penempelan di uterus!","prompt":"Susun urutan peringkat perkembangan awal embrio manusia sehingga penempelan:","hint":"Zigot -> embrio dua sel -> morula -> blastosista -> menempel pada endometrium.","answerTokens":["Persenyawaan Membentuk Zigot (2n)","Mitosis Bentuk Embrio Dua Sel & Morula","Morula Berubah Menjadi Blastosista","Blastosista Menempel di Endometrium"],"distractors":["Ovulasi Folikel Graaf","Kemerosotan Korpus Luteum"],"explanation":"Blastosista merupakan bebola sel berongga berisi bendalir yang menempel pada dinding endometrium."},{"type":"match","xp":15,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Plasenta, HCG & Kembar","voiceCaption":"Padankan vena/arteri tali pusat, hormon HCG dan jenis kembar dengan ciri tepatnya.","voiceScript":"[curious] Padankan empat komponen kehamilan dan pembentukan kembar ini dengan fakta tepatnya!","prompt":"Padankan struktur fetus atau jenis kembar berikut dengan keterangan yang tepat:","pairs":[{"id":"fk1","left":"Vena tali pusat vs Arteri tali pusat","right":"Vena bawa O2/nutrien ke fetus; arteri bawa CO2/urea ke plasenta"},{"id":"fk2","left":"Hormon HCG (awal kehamilan)","right":"Mengekalkan korpus luteum agar terus rembes estrogen & progesteron"},{"id":"fk3","left":"Kembar seiras","right":"1 ovum + 1 sperma, kongsi 1 plasenta, genetik & jantina sama"},{"id":"fk4","left":"Kembar Siam","right":"Pembahagian embrio kembar seiras yang tidak lengkap"}],"explanation":"HCG boleh dikesan melalui ujian kehamilan air kencing ibu."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Percampuran Darah Ibu & Fetus","voiceCaption":"Ramalkan bahaya sekiranya darah ibu bercampur terus dengan darah fetus di dalam plasenta.","voiceScript":"[curious] Soalan Praktis Formatif lima belas perpuluhan empat: apakah yang akan berlaku sekiranya darah ibu bercampur terus dengan darah fetus di dalam plasenta?","hook":"Fikirkan tekanan darah orang dewasa dan kumpulan darah ABO yang berbeza!","scenario":"Membran nipis pemisah darah ibu dan darah fetus di plasenta mengalami kegagalan menyebabkan kedua-dua sistem peredaran darah bercampur.","prompt":"Apakah kesan berbahaya sekiranya darah ibu bercampur langsung dengan darah fetus?","options":["Salur darah halus fetus boleh pecah akibat tekanan darah ibu yang tinggi, serta pengaglutinan darah boleh berlaku jika kumpulan darah ibu dan fetus berbeza","Blastosista terbelah membentuk kembar tak seiras pada bulan kelapan","Fetus terus menghasilkan sperma atau ovum matang di dalam rahim","Hormon HCG berubah menjadi insulin"],"correctIndex":0,"proofLabId":"bio415_embrio_kembar","proofState":{"mode":"identical"},"explanation":"Pemisahan darah oleh membran nipis melindungi salur darah fetus daripada tekanan tinggi serta mencegah tindak balas antigen-antibodi darah."}]},{"id":"bio415-u4","title":"Unit 4: Pertumbuhan Sigmoid & Tangga (Ekdisis)","subtitle":"Subtopik 15.7 — Jisim Kering (100 C) vs Basah, Metamorfosis Lengkap/Tidak Lengkap, 6 Fasa Sigmoid & Instar/Ekdisis","iconType":"graph","iconUrl":"../assets/icons/bio415-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Lengkung Sigmoid & Ekdisis","voiceCaption":"Bandingkan parameter ukuran pertumbuhan serta lengkung pertumbuhan sigmoid enam fasa dengan lengkung tangga serangga melalui ekdisis.","voiceScript":"[warm] Unit keempat membincangkan pertumbuhan dalam manusia dan haiwan! Pertumbuhan ialah proses kekal dan tidak berbalik yang boleh diukur menggunakan ketinggian, jisim basah yang kurang tepat kerana kandungan air berubah, atau jisim kering pada suhu seratus darjah Celsius hingga malar yang sangat tepat tetapi membunuh organisma. Lengkung pertumbuhan manusia berbentuk sigmoid dengan enam fasa iaitu permulaan, pertumbuhan pesat, perlahan, matang, penuaan dan kematian. Haiwan berangka luar kitin seperti belalang pula menunjukkan lengkung berbentuk tangga dengan peringkat mendatar dipanggil instar dan lonjakan menegak semasa ekdisis!","title":"15.7 Pertumbuhan Sigmoid & Lengkung Tangga Ekdisis","acronym":"L•E•S•M•P•K","hook":"Belalang perlu menyedut udara dua kali semasa ekdisis — sekali untuk memecahkan rangka luar lama, dan sekali lagi untuk membesarkan badan sebelum rangka baharu mengeras!","mediaKey":"bio415_ekdisis_pertumbuhan","summary":"Lengkung sigmoid menunjukkan pertumbuhan berterusan 6 fasa, manakala lengkung tangga serangga berselang antara peringkat instar mendatar dan ekdisis menegak.","bullets":["Parameter Pertumbuhan: Jisim kering (ketuhar 100 C berulang hingga jisim malar — tepat tetapi membunuh spesimen) vs Jisim basah (tidak bunuh spesimen tetapi kurang tepat kerana bergantung kandungan air). Metamorfosis: Lengkap (telur->larva->pupa->dewasa, cth. kupu-kupu) vs Tidak Lengkap (beberapa ekdisis, cth. belalang).","6 Fasa Sigmoid: Permulaan/Lag (kadar rendah, penyesuaian), Pertumbuhan Pesat/Eksponen (kadar tertinggi, mitosis & pemanjangan aktif), Pertumbuhan Perlahan/Pegun (kadar malar, pembezaan sel), Matang (pertumbuhan sifar; mitosis = kematian sel), Penuaan (pertumbuhan negatif), Kematian.","Lengkung Tangga (Rangka Luar Kitin): Mendatar = INSTAR (nimfa tidak memanjang, aktif bina tisu). Menegak = EKDISIS (dikawal hormon: rangka baharu terbentuk di bawah rangka lama -> sedut udara kembangkan badan pecahkan rangka lama -> keluar -> sedut udara sekali lagi sebelum rangka baharu mengeras)."],"labId":"bio415_lengkung_pertumbuhan","labTitle":"Simulator Graf Sigmoid vs Tangga","labProps":{"mode":"sigmoid"},"examTip":"Soalan kerap: Apakah aktiviti nimfa semasa garis mendatar (instar) walaupun panjang badannya tidak bertambah? Jawapan: Aktif membina tisu dan menambah isipadu badan!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Fasa Sigmoid & Tangga","voiceCaption":"Padankan fasa pertumbuhan pesat, fasa matang, instar dan ekdisis dengan cirinya.","voiceScript":"[curious] Padankan empat peringkat lengkung pertumbuhan sigmoid dan lengkung tangga ini dengan ciri kadar pertumbuhannya!","prompt":"Padankan peringkat lengkung pertumbuhan berikut dengan ciri yang tepat:","pairs":[{"id":"gr1","left":"Fasa pertumbuhan pesat (eksponen)","right":"Kadar pertumbuhan paling tinggi kerana pembahagian sel sangat aktif"},{"id":"gr2","left":"Fasa matang pada lengkung sigmoid","right":"Pertumbuhan sifar kerana kadar pembahagian sel sama kadar kematian sel"},{"id":"gr3","left":"Bahagian mendatar (Instar) lengkung tangga","right":"Panjang badan nimfa tetap tetapi tisu badan giat dibina"},{"id":"gr4","left":"Bahagian menegak (Ekdisis) lengkung tangga","right":"Serangga menyedut udara pecahkan rangka lama dan membesar pantas"}],"explanation":"Pertumbuhan sifar pada manusia berlaku pada fasa matang, manakala pertumbuhan sifar pada serangga berlaku pada setiap peringkat instar."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Langkah Ekdisis Serangga","voiceCaption":"Susun urutan proses ekdisis daripada pembentukan rangka luar baharu hingga rangka baharu mengeras.","voiceScript":"[confident] Susun empat langkah bagaimana seekor belalang menjalankan ekdisis untuk membesarkan saiz badannya!","prompt":"Susun urutan peristiwa yang berlaku semasa proses ekdisis serangga:","hint":"Rangka baharu terbentuk di bawah rangka lama -> sedut udara pecah rangka lama -> keluar -> sedut udara mengembang sebelum mengeras.","answerTokens":["Rangka Baharu Terbentuk di Bawah Lama","Sedut Udara Pecahkan Rangka Lama","Serangga Keluar dengan Rangka Baharu","Sedut Udara Lagi Sebelum Rangka Mengeras"],"distractors":["Pembentukan Blastosista","Pengecutan Otot Miotom"],"explanation":"Penyeduatan udara kali kedua sebelum rangka kitin mengeras mewujudkan ruang untuk pertumbuhan tisu pada peringkat instar berikutnya."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Jisim Kering vs Jisim Basah","voiceCaption":"Asingkan ciri kaedah jisim kering berbanding jisim basah sebagai parameter mengukur pertumbuhan.","voiceScript":"[warm] Asingkan ciri-ciri mengukur pertumbuhan antara kaedah jisim kering dengan kaedah jisim basah!","prompt":"Isihkan ciri parameter pertumbuhan berikut antara Jisim Kering dan Jisim Basah:","buckets":[{"id":"kering","label":"Jisim Kering (100 C)"},{"id":"basah","label":"Jisim Basah"}],"items":[{"text":"Dipanaskan dalam ketuhar 100 C berulang kali sehingga malar","bucketId":"kering","note":"Menyingkirkan semua air daripada organisma."},{"text":"Sangat tepat tetapi membunuh organisma (sesuai untuk tumbuhan)","bucketId":"kering","note":"Tidak dapat mengukur organisma yang sama berulang kali."},{"text":"Boleh diambil bila-bila masa tanpa membunuh haiwan","bucketId":"basah","note":"Sesuai untuk memantau haiwan hidup atau bayi."},{"text":"Kurang tepat kerana dipengaruhi pengambilan air harian","bucketId":"basah","note":"Kandungan bendalir badan sentiasa berubah-ubah."}],"explanation":"Setiap parameter pertumbuhan dipilih mengikut jenis organisma dan keperluan kajian."}]},{"id":"bio415-u5","title":"Unit 5: Ujian Bos SPM — Pembiakan & Pertumbuhan","subtitle":"Cabaran Sumatif Penutup Biologi T4 (300 Sperma, Rawatan LH, Kembar Terpisah & Ovulasi Kitar 32 Hari)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Sintesis KBAT Bab 15","voiceCaption":"Ujian Bos terakhir merangkumi suntikan hormon menyamai LH, sebab ratusan sperma diperlukan di tapak persenyawaan, kembar seiras terpisah, simpanan darah tali pusat dan pengiraan ovulasi kitar tidak teratur.","voiceScript":"[excited] Tahniah kerana sampai ke Ujian Bos terakhir Biologi Tingkatan Empat! Dalam pusingan penutup ini, fokus pada empat soalan pengayaan dan sumatif berimpak tinggi: pertama, suntikan hormon seakan L-H membantu wanita hamil dengan mencetuskan ovulasi dan pembentukan korpus luteum. Kedua, walaupun hanya satu sperma mempersenyawakan oosit sekunder, beratus-ratus sperma perlu tiba untuk membebaskan enzim bagi melarutkan lapisan sel folikel di sekeliling oosit sekunder! Ketiga, kembar seiras yang dipisahkan boleh berbeza saiz badan akibat faktor persekitaran seperti pemakanan dan gaya hidup! Keempat, darah tali pusat kaya sel stem hematopoietik!","title":"Strategi Esei & KBAT Penutup Biologi Tingkatan 4","acronym":"BOS•15","hook":"Formula DSKP 15.3.1 untuk kitar haid bukan 28 hari: Hari Ovulasi = Panjang Kitar Haid - 14 hari!","summary":"Kerjasama enzim ratusan sperma membolehkan satu sperma bersenyawa; fenotip dipengaruhi persekitaran; darah tali pusat kaya sel stem hematopoietik.","bullets":["Mengapa ~300 Sperma Diperlukan (Pengayaan Q11): Jika hanya 1 sperma tiba, enzim pencerna tidak mencukupi untuk mengurai lapisan sel folikel di sekeliling oosit sekunder.","Rawatan LH (Sumatif Q9): Merangsang ovulasi dan pembentukan korpus luteum merembes progesteron.","Kembar Seiras Berbeza Saiz (Sumatif Q4a) & Darah Tali Pusat (Pengayaan Q13): Nutrisi/persekitaran berbeza menukar berat badan; darah tali pusat mengandungi sel stem hematopoietik."],"labId":"bio415_galeri_akhir","labTitle":"Galeri Mikrograf Histologi & Metamorfosis","labProps":{},"examTip":"Semak soalan pengiraan ovulasi DSKP 15.3.1: Fasa luteum (ovulasi -> haid seterusnya) sentiasa malar 14 hari!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"KBAT: Mengapa 1 Sperma Gagal Bersenyawa?","voiceCaption":"Ramalkan mengapa persenyawaan gagal sekiranya hanya satu sperma sahaja yang sampai ke oosit sekunder.","voiceScript":"[curious] Soalan Pengayaan sebelas: walaupun hanya satu sperma menembusi nukleus oosit sekunder, mengapakah persenyawaan gagal jika hanya satu sperma sahaja yang sampai ke oosit sekunder?","hook":"Lihat lapisan sel folikel yang mengelilingi oosit sekunder pada mikrograf Folikel Graaf!","scenario":"Daripada 300 juta sperma yang diejakulasi, biasanya sekitar 300 tiba di oosit sekunder; namun dalam kes ini hanya 1 sperma tiba.","prompt":"Mengapakah persenyawaan tidak berlaku jika hanya 1 sperma tiba di oosit sekunder?","options":["Enzim yang dibebaskan oleh satu sperma sahaja tidak mencukupi untuk mengurai dan menembusi lapisan sel folikel di sekeliling oosit sekunder","Satu sperma tidak membawa nukleus haploid","Hormon HCG membunuh sperma tunggal tersebut sebelum sampai ke uterus","Oosit sekunder hanya boleh menerima dua sperma serentak membentuk zigot 3n"],"correctIndex":0,"proofLabId":"bio415_galeri_akhir","proofState":{},"explanation":"Kerjasama enzim daripada banyak sperma diperlukan untuk melarutkan lapisan sel folikel sebelum satu sperma akhirnya menembusi membran oosit sekunder."},{"type":"match","xp":15,"voiceIdKey":"u5-s3","voiceToneLabel":"Padan 4 Kes Klinikal Sumatif Bab 15","voiceCaption":"Padankan kes rawatan LH, kembar terpisah, ibu hamil merokok dan darah tali pusat dengan penjelasannya.","voiceScript":"[curious] Uji penguasaan lengkap anda dengan memadankan empat kes klinikal Sumatif Bab Lima Belas ini!","prompt":"Padankan kes Sumatif Bab 15 berikut dengan jawapan biologi yang tepat:","pairs":[{"id":"b15_1","left":"Suntikan hormon bertindak seperti LH","right":"Merangsang ovulasi dan membentuk korpus luteum merembes progesteron"},{"id":"b15_2","left":"Kembar seiras terpisah berbeza berat badan","right":"Faktor persekitaran berbeza seperti nutrisi, aktiviti fizikal & kesihatan"},{"id":"b15_3","left":"Ibu hamil merokok membahayakan fetus","right":"Nikotin dan CO merentas plasenta mengganggu bekalan O2 & pertumbuhan"},{"id":"b15_4","left":"Simpanan darah tali pusat selepas lahir","right":"Sumber sel stem hematopoietik untuk merawat penyakit darah"}],"explanation":"Kesemua empat kes ini merangkumi Soalan Sumatif 4, 9 dan Pengayaan 13 buku teks."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Susun Rantaian Hormon Kehamilan","voiceCaption":"Susun rantaian perubahan hormon daripada puncak estrogen hingga pengekalan endometrium oleh HCG.","voiceScript":"[confident] Susun rantaian hormon kehamilan daripada puncak estrogen hingga pengekalan endometrium oleh H-C-G!","prompt":"Susun urutan peristiwa hormon dan embrio yang mengekalkan kehamilan awal:","hint":"Puncak estrogen -> lonjakan LH/ovulasi -> penempelan blastosista -> HCG kekalkan korpus luteum.","answerTokens":["Puncak Estrogen Cetus Lonjakan LH","Ovulasi & Pembentukan Korpus Luteum","Penempelan Blastosista di Endometrium","HCG Kekalkan Korpus Luteum Rembes Progesteron"],"distractors":["Rembesan Glukagon Pankreas","Ekdisis Dinding Uterus"],"explanation":"HCG menyelamatkan korpus luteum daripada merosot supaya progesteron terus menebalkan endometrium."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Soalan Akhir Bos: Ovulasi Kitar 32 Hari","voiceCaption":"Kira jangkaan hari ovulasi bagi wanita yang mempunyai kitar haid 32 hari mengikut cadangan aktiviti DSKP 15.3.1.","voiceScript":"[excited] Soalan penutup keseluruhan Biologi Tingkatan Empat! Berdasarkan D-S-K-P lima belas perpuluhan tiga perpuluhan satu, tentukan hari ovulasi jika panjang kitar haid ialah tiga puluh dua hari!","prompt":"Sekiranya seorang wanita mempunyai kitar haid sepanjang 32 hari (fasa luteum selepas ovulasi malar function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      "</div>"

    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +

      biteTappedMap[bIdx] = true;

      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);

      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

/* 04-step-minigames.js — Tap-to-Match, Word-Bank Assembly, Card Sort & Tactile MCQ */
function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +

      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function renderSortStep(step, card) {
  var items = shuffleList(Array.isArray(step.items) ? step.items : []);
  var buckets = Array.isArray(step.buckets) ? step.buckets : [];
  var curIdx = 0;
  var misses = 0;

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("graph", "icon-sm") + " <span>" + tUi("Isih Kategori Pantas", "Quick Category Sort") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Pilih kategori yang betul bagi setiap kad:", "Pick the matching category for each card:")) + "</h2>" +
    '<div class="sort-progress-bar"><span>' + tUi("Kad Fakta", "Card") + '</span><span id="sortCounter" class="tabular-nums">1 / ' + items.length + "</span></div>" +
    '<div id="sortActiveCard" class="sort-active-card"></div>' +
    '<div id="sortMiniMsg" class="sort-mini-feedback" hidden></div>' +
    '<div class="sort-buckets-grid">' +
      buckets.map(function (bk) {
        return '<button type="button" class="sort-bucket-btn js-sort-bucket" data-bucket="' + escapeHtml(bk.id) + '">' + escapeHtml(bk.label) + "</button>";
      }).join("") +
    "</div>";

  function showCard() {
    var cEl = document.getElementById("sortActiveCard");
    var cntEl = document.getElementById("sortCounter");
    if (cntEl) cntEl.textContent = Math.min(items.length, curIdx + 1) + " / " + items.length;
    if (cEl && items[curIdx]) cEl.textContent = items[curIdx].text;
  }

  showCard();
  card.querySelectorAll(".js-sort-bucket").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent || curIdx >= items.length) return;
      var item = items[curIdx];
      var bid = btn.getAttribute("data-bucket");
      var msgEl = document.getElementById("sortMiniMsg");

      if (bid === item.bucketId) {
        NotaAudio.playMatch();
        btn.classList.add("is-correct");
        setTimeout(function () { btn.classList.remove("is-correct"); }, 260);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback ok";
          msgEl.textContent = item.note || tUi("Tepat!", "Spot on!");
        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";
          msgEl.textContent = tUi("Kurang tepat — fikirkan semula fungsi atau sifat istilah ini.", "Not quite — check the grammar rule and clues.");
        }
      }
    });
  });
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
