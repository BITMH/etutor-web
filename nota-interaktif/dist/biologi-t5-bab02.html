  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab02","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":2,"title":"Struktur dan Fungsi Daun","subtitle":"Subtopik 2.1–2.5 KSSM — Struktur Luar & Dalaman Lamina Daun, Mekanisme Stoma (K+ & Sukrosa), Transpirasi & Potometer, Kloroplas & Fotosintesis (Cahaya vs Tidak Bersandarkan Cahaya, Video Penerangan) serta Titik Pampasan.","estimatedMinutes":36,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab02-labs.js","coverIcon":"../assets/icons/bio52-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pemahaman kamu terhadap struktur daun dan fotosintesis amat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! [excited] Stoma, potometer, kloroplas dan titik pampasan berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak semula peranan ion kalium, tilakoid vs stroma atau graf titik pampasan di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab dua berjaya kamu takluki sepenuhnya!"},"units":[{"id":"bio52-u1","title":"Unit 1: Struktur Luar & Dalaman Lamina Daun","subtitle":"Subtopik 2.1 — Lamina, Petiol, Mozek Daun, Herbarium serta Kutikel, Epidermis, Mesofil Palisad, Mesofil Berspan & Berkas Vaskular","iconType":"book","iconUrl":"../assets/icons/bio52-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Struktur Luar & Mozek Daun","voiceCaption":"Struktur luar daun terdiri daripada lamina yang leper dan nipis serta petiol yang menyambungkan lamina ke batang dalam susunan mozek daun.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab dua: Struktur dan Fungsi Daun! Pada subtopik dua perpuluhan satu, struktur luar daun hijau terbahagi kepada dua bahagian iaitu lamina dan petiol. Lamina berbentuk leper untuk menyediakan luas permukaan maksimum bagi sel berkloroplas menyerap cahaya matahari, dan berbentuk nipis supaya gas karbon dioksida serta oksigen dapat meresap dengan cekap ke bahagian dalam daun. Petiol pula ialah tangkai yang menyambungkan lamina pada batang serta mengunjur masuk membentuk jaringan urat penyokong. Di samping itu, susunan lamina yang tidak bertindih dikenali sebagai mozek daun agar setiap helai daun mendapat cahaya optimum, manakala koleksi tumbuhan awetan berlabel taksonomi disebut herbarium!","title":"2.1 Struktur Luar Daun, Mozek Daun & Herbarium","acronym":"L•P•M•H","hook":"Terokai bagaimana lamina leper, petiol dan susunan mozek daun memaksimumkan penyerapan cahaya matahari!","mediaKey":"bio52_mozek_daun","summary":"Lamina (leper & nipis untuk cahaya & resapan gas), Petiol (tangkai penyokong & jaringan urat), Mozek daun (susunan tidak bertindih) dan Herbarium (spesimen awetan).","bullets":["Lamina: Bahagian daun yang leper (luas permukaan maksimum untuk sel berkloroplas menyerap cahaya matahari) dan nipis (memudahkan peresapan gas fotosintesis secara cekap ke dalam daun).","Petiol: Tangkai daun yang menyambungkan lamina pada batang dan mengunjur membentuk jaringan urat untuk menyokong lamina.","Mozek Daun & Herbarium: Susunan lamina daun tanpa bertindih untuk menerima cahaya optimum dikenali sebagai mozek daun. Herbarium ialah koleksi spesimen tumbuhan yang diawetkan beserta data taksonomi, morfologi, ekologi dan geografi."],"labId":"bio52_struktur_daun_lab","labTitle":"Pemeriksa Keratan Rentas Lamina Daun (Jadual 2.1)","labProps":{"layer":"kutikel"},"examTip":"Skema S.P.M.: Bezakan kepentingan dua sifat lamina — 'leper' (luas permukaan maksimum serap cahaya) vs 'nipis' (jarak resapan gas pendek/cekap)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Lapisan Dalaman Daun","voiceCaption":"Kelaskan enam ciri struktur dalaman lamina daun berikut antara Lapisan Pelindung/Epidermis dengan Lapisan Mesofil/Vaskular.","voiceScript":"[confident] Uji ingatan kamu tentang Jadual dua perpuluhan satu! Asingkan keenam-enam ciri struktur dalaman daun ini mengikut kumpulannya.","prompt":"Isihkan ciri struktur dalaman lamina daun berikut kepada kumpulan yang tepat:","buckets":[{"id":"pelindung","label":"Kutikel & Epidermis"},{"id":"dalam","label":"Mesofil & Berkas Vaskular"}],"items":[{"text":"Lapisan berlilin, kalis air dan lut sinar menghalang kehilangan air berlebihan","bucketId":"pelindung","note":"Tepat! Inilah ciri kutikel pada epidermis atas dan bawah."},{"text":"Sel epidermis atas tidak mengandungi kloroplas dan lut sinar untuk laluan cahaya","bucketId":"pelindung","note":"Betul! Cahaya dapat menembusi terus ke mesofil palisad."},{"text":"Sel mesofil palisad tersusun tegak dan padat serta penuh dengan kloroplas","bucketId":"dalam","note":"Tepat! Tapak utama fotosintesis untuk penyerapan cahaya maksimum."},{"text":"Sel mesofil berspan berbentuk tidak sekata, tersusun longgar dengan banyak ruang udara","bucketId":"dalam","note":"Betul! Memudahkan peresapan gas karbon dioksida dan wap air."},{"text":"Epidermis bawah mempunyai liang stoma yang diapit oleh sepasang sel pengawal","bucketId":"pelindung","note":"Tepat! Mengawal pertukaran gas dan transpirasi."},{"text":"Xilem berdinding berlignin mengangkut air manakala floem mengangkut bahan organik","bucketId":"dalam","note":"Betul! Berkas vaskular dalam urat daun."}],"explanation":"Lapisan luaran terdiri daripada kutikel, epidermis atas (lut sinar, tiada kloroplas) dan epidermis bawah (berstoma), manakala bahagian dalam terdiri daripada mesofil palisad, mesofil berspan serta berkas vaskular."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Anatomi Dalaman Lamina Daun","voiceCaption":"Sel mesofil palisad tersusun tegak dan padat berkloroplas, manakala sel mesofil berspan tersusun longgar dengan banyak ruang udara bagi pertukaran gas.","voiceScript":"[warm] Sekarang terokai setiap lapisan keratan rentas lamina daun dalam Jadual dua perpuluhan satu! Lapisan paling luar ialah kutikel berlilin, kalis air dan lut sinar yang menyekat penyejatan berlebihan sambil membenarkan cahaya menembusi. Di bawahnya terdapat epidermis atas yang lut sinar dan tidak berkloroplas, kecuali sel pengawal di epidermis bawah yang mengandungi kloroplas! Di bahagian tengah, sel mesofil palisad tersusun tegak dan padat dengan bilangan kloroplas yang amat banyak untuk penyerapan cahaya maksimum, manakala sel mesofil berspan berbentuk tidak sekata serta longgar dengan banyak ruang udara bagi mempercepatkan peresapan karbon dioksida. Berkas vaskular pula membekalkan air melalui xilem berlignin dan mengangkut hasil fotosintesis melalui floem!","title":"Jadual 2.1: Struktur Dalaman Lamina Daun","acronym":"K•E•P•S•V","hook":"Klik setiap lapisan pada keratan rentas lamina daun untuk membandingkan ketumpatan kloroplas dan ruang udara!","summary":"Kutikel & epidermis atas lut sinar membenarkan cahaya sampai ke mesofil palisad (padat kloroplas), sementara mesofil berspan beruang udara memudahkan resapan gas.","bullets":["Kutikel & Epidermis: Kutikel berlilin kalis air dan lut sinar mengurangkan transpirasi. Epidermis atas lut sinar tiada kloroplas; epidermis bawah menempatkan stoma dan sel pengawal berkloroplas.","Mesofil Palisad vs Mesofil Berspan: Palisad tersusun tegak serta padat dan paling kaya kloroplas sebagai tapak utama fotosintesis. Berspan berbentuk tidak sekata dan longgar dengan ruang udara besar untuk peresapan CO2 dan air (kloroplas lebih sedikit).","Berkas Vaskular: Xilem (dinding berlignin tebal menyokong tumbuhan dan mengangkut air serta garam mineral ke daun) dan Floem (mengangkut bahan organik hasil fotosintesis dari daun ke seluruh tumbuhan)."],"labId":"bio52_struktur_daun_lab","labTitle":"Banding Mesofil Palisad vs Mesofil Berspan","labProps":{"layer":"berspan"},"examTip":"Soalan wajaran KSSM: Mengapakah kutikel dan sel epidermis atas bersifat lut sinar? Jawapan: Supaya cahaya matahari dapat menembusi terus ke sel mesofil palisad yang padat dengan kloroplas."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Struktur Daun & Fungsi","voiceCaption":"Padankan lima struktur dalaman daun dengan penyesuaian fungsinya yang tepat.","voiceScript":"[confident] Uji ketepatan kamu memadankan kesemua struktur dalaman daun dengan adaptasinya!","prompt":"Padankan setiap struktur daun berikut dengan fungsinya yang paling tepat:","pairs":[{"id":"b52u1m1","left":"Kutikel berlilin","right":"Menghalang kehilangan air berlebihan tetapi kekal lut sinar untuk cahaya"},{"id":"b52u1m2","left":"Epidermis atas","right":"Sel tanpa kloroplas yang lut sinar bagi laluan cahaya ke mesofil"},{"id":"b52u1m3","left":"Mesofil palisad","right":"Sel tersusun tegak dan padat dengan bilangan kloroplas maksimum"},{"id":"b52u1m4","left":"Mesofil berspan","right":"Sel tersusun longgar dengan ruang udara bagi peresapan gas karbon dioksida"},{"id":"b52u1m5","left":"Tisu xilem daun","right":"Dinding berlignin tebal yang mengangkut air ke daun dan memberi sokongan"}],"explanation":"Setiap lapisan lamina daun mempunyai pengkhususan tersendiri bagi memaksimumkan penembusan cahaya, pertukaran gas dan bekalan air."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Ruang Udara Daun Monokot/Eudikot","voiceCaption":"Ramalkan peranan ruang udara besar pada lapisan mesofil berspan terhadap kecekapan sel mesofil palisad menjalankan fotosintesis.","voiceScript":"[curious] Cuba fikirkan peranan mesofil berspan! Sekiranya semua sel mesofil berspan dimampatkan rapat tanpa ruang udara, apakah kesannya terhadap sel mesofil palisad di atasnya?","hook":"Lihat kedudukan ruang udara di antara mesofil berspan dan stoma pada keratan rentas daun!","scenario":"Struktur dalaman daun mempunyai sel mesofil palisad yang padat di bahagian atas dan sel mesofil berspan yang longgar di bahagian bawah.","prompt":"Mengapakah susunan longgar sel mesofil berspan dengan banyak ruang udara penting kepada proses fotosintesis?","options":["Menambahkan luas permukaan dalam bagi pertukaran gas dan memudahkan peresapan gas karbon dioksida dari stoma ke sel mesofil palisad","Menyimpan air batu supaya daun sentiasa sejuk pada waktu tengah hari","Menghalang cahaya matahari daripada memantul keluar melalui kutikel atas","Menghentikan pengangkutan sukrosa di dalam tiub tapis floem"],"correctIndex":0,"proofLabId":"bio52_struktur_daun_lab","proofState":{"layer":"berspan"},"explanation":"Bentuk tidak sekata dan susunan longgar mesofil berspan mencipta banyak ruang udara yang mempercepatkan peresapan gas karbon dioksida dari liang stoma ke sel-sel mesofil palisad."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Wajaran Mozek Daun","voiceCaption":"Susun blok jawapan menerangkan kepentingan susunan mozek daun dan bentuk lamina leper serta nipis.","voiceScript":"[confident] Susun blok fakta berikut untuk menjelaskan bagaimana susunan mozek daun dan bentuk lamina membantu fotosintesis.","prompt":"Susun huraian lengkap mengenai adaptasi luaran daun untuk fotosintesis optimum:","hint":"Gabungkan konsep susunan mozek daun, lamina leper dan lamina nipis...","answerTokens":["Daun tersusun tidak bertindih dalam susunan mozek daun","manakala lamina berbentuk leper memberi luas permukaan luas bagi menyerap cahaya maksimum","dan lamina yang nipis membolehkan gas karbon dioksida serta oksigen","meresap dengan cekap ke sel mesofil di bahagian dalam daun"],"distractors":["untuk memerangkap serangga bagi mendapatkan nutrien nitrogen","supaya kutikel menjadi legap dan tebal pada waktu siang"],"explanation":"Mozek daun mengelakkan teduhan sesama daun, lamina leper memaksimumkan penyerapan cahaya dan lamina nipis memendekkan jarak resapan gas."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Unit 1: Subtopik 2.1","voiceCaption":"Pilih sel daun yang mengandungi kloroplas dalam senarai struktur dalaman daun berikut.","voiceScript":"[excited] Soalan penutup Unit satu! Kenal pasti struktur atau sel manakah pada keratan rentas daun yang TIDAK mengandungi kloroplas.","prompt":"Antara sel dan lapisan berikut pada daun hijau yang normal, manakah yang TIDAK mengandungi kloroplas?","options":["Sel epidermis atas dan salur xilem","Sel mesofil palisad dan sel pengawal","Sel mesofil berspan dan sel pengawal","Sel mesofil palisad dan sel mesofil berspan"],"correctIndex":0,"explanation":"Sel epidermis atas (dan kebanyakan sel epidermis bawah kecuali sel pengawal) serta salur xilem mati tidak mengandungi kloroplas. Sel pengawal, mesofil palisad dan mesofil berspan mengandungi kloroplas."}]},{"id":"bio52-u2","title":"Unit 2: Stoma — Organ Utama Pertukaran Gas","subtitle":"Subtopik 2.2 — Mekanisme Pembukaan & Penutupan Stoma (Ion K+ & Kepekatan Sukrosa), Taburan Stoma Eudikot vs Monokot & Kekurangan Air","iconType":"scale","iconUrl":"../assets/icons/bio52-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Mekanisme Pembukaan & Penutupan Stoma","voiceCaption":"Pembukaan dan penutupan stoma dikawal oleh kesegahan sel pengawal melalui pergerakan ion kalium serta perubahan kepekatan sukrosa.","voiceScript":"[warm] Selamat datang ke Unit dua: Organ Utama Pertukaran Gas! Liang stoma di epidermis bawah diapit oleh sepasang sel pengawal berkloroplas. Mengapakah stoma terbuka pada waktu siang dan tertutup pada waktu malam? Dua faktor utama mempengaruhinya, iaitu pengambilan ion kalium dan kepekatan sukrosa! Pada waktu siang, ion kalium bergerak masuk ke sel pengawal dan fotosintesis menghasilkan sukrosa berkepekatan tinggi. Hal ini meningkatkan keupayaan larutan lalu menurunkan keupayaan air di dalam sel pengawal! Akibatnya, molekul air dari sel epidermis bersebelahan meresap masuk secara osmosis, menjadikan sel pengawal segah. Oleh sebab dinding dalam sel pengawal lebih tebal serta kurang elastik berbanding dinding luar yang nipis dan lebih elastik, sel pengawal melengkung ke luar lalu membuka liang stoma!","title":"2.2 Mekanisme Pembukaan & Penutupan Stoma (K+ & Sukrosa)","acronym":"K+•S•O•S","hook":"Tukar keadaan Siang, Malam dan Kekurangan Air dalam Simulator Stoma di bawah untuk melihat aliran osmosis dan lengkungan sel pengawal!","mediaKey":"bio52_stoma_daun","summary":"Pemasukan ion K+ atau kepekatan sukrosa tinggi menurunkan keupayaan air sel pengawal -> air masuk secara osmosis -> sel segah melengkung ke luar (dinding dalam tebal, luar nipis) -> stoma terbuka.","bullets":["Pembukaan Stoma (Siang / Bercahaya): (1) Ion K+ bergerak masuk ke sel pengawal DAN fotosintesis meningkatkan kepekatan sukrosa; (2) Keupayaan larutan meningkat, keupayaan air menurun; (3) Air meresap masuk dari sel epidermis secara osmosis; (4) Sel pengawal menjadi segah dan melengkung ke luar -> stoma terbuka.","Penutupan Stoma (Malam / Gelap): Ion K+ bergerak keluar DAN sukrosa ditukarkan menjadi kanji -> keupayaan air sel pengawal meningkat -> air meresap keluar secara osmosis -> sel pengawal menjadi flasid -> stoma tertutup.","Ciri Fizikal Dinding Sel Pengawal: Dinding sebelah DALAM adalah tebal dan kurang elastik, manakala dinding sebelah LUAR lebih nipis dan elastik, membolehkannya melengkung apabila segah."],"labId":"bio52_stoma_osmo_sim","labTitle":"Simulator Osmosis & Kesegahan Sel Pengawal Stoma","labProps":{"condition":"siang"},"examTip":"Skema wajib KSSM: Sentiasa tulis urutan penuh — 'keupayaan larutan meningkat -> keupayaan air menurun -> air meresap masuk secara osmosis -> sel pengawal segah dan melengkung ke luar'."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Aliran Osmosis Malam","voiceCaption":"Ramalkan perubahan arah pergerakan ion kalium, kepekatan sukrosa dan aliran osmosis air pada waktu malam.","voiceScript":"[curious] Cuba ramalkan apa yang berlaku kepada sel pengawal apabila hari mula gelap dan tumbuhan tidak menerima cahaya matahari!","hook":"Uji mod Malam dalam Simulator Stoma selepas menjawab untuk melihat sel pengawal menjadi flasid!","scenario":"Pada waktu malam yang gelap, fotosintesis terhenti di dalam sel pengawal daun pokok bunga raya.","prompt":"Apakah urutan perubahan yang menyebabkan liang stoma tertutup pada waktu malam?","options":["Ion K+ bergerak keluar dan sukrosa ditukar kepada kanji, menaikkan keupayaan air sel pengawal supaya air meresap keluar secara osmosis lalu sel pengawal menjadi flasid","Ion K+ dipam masuk dengan banyak sehingga keupayaan air sel pengawal menjadi sifar","Dinding dalam sel pengawal melengkung keluar dengan lebih kuat akibat tiada cahaya","Sel epidermis bersebelahan menyerap semua kloroplas daripada sel pengawal"],"correctIndex":0,"proofLabId":"bio52_stoma_osmo_sim","proofState":{"condition":"malam"},"explanation":"Tanpa cahaya, ion K+ bergerak keluar dan gula ditukar kepada kanji. Keupayaan air dalam sel pengawal menjadi lebih tinggi daripada sel epidermis, menyebabkan air meresap keluar secara osmosis dan sel menjadi flasid."},{"type":"sort","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Isih Proses Stoma Buka vs Tutup","voiceCaption":"Kelaskan enam peristiwa selular berikut antara keadaan Stoma Terbuka dengan keadaan Stoma Tertutup.","voiceScript":"[confident] Asingkan keenam-enam peristiwa osmosis dan biokimia sel pengawal ini kepada Stoma Terbuka atau Stoma Tertutup!","prompt":"Isihkan pernyataan berikut kepada kategori Stoma Terbuka atau Stoma Tertutup:","buckets":[{"id":"buka","label":"Stoma Terbuka (Segah)"},{"id":"tutup","label":"Stoma Tertutup (Flasid)"}],"items":[{"text":"Ion K+ bergerak masuk ke dalam sel pengawal","bucketId":"buka","note":"Tepat! Meningkatkan keupayaan larutan sel pengawal."},{"text":"Gula larut (sukrosa) ditukarkan kepada kanji pada waktu malam","bucketId":"tutup","note":"Betul! Merendahkan keupayaan larutan sel pengawal."},{"text":"Keupayaan air di dalam sel pengawal menurun lalu air meresap masuk secara osmosis","bucketId":"buka","note":"Tepat! Sel pengawal menjadi segah dan melengkung."},{"text":"Air meresap keluar dari sel pengawal ke sel epidermis secara osmosis","bucketId":"tutup","note":"Betul! Sel pengawal kehilangan kesegahan dan menjadi flasid."},{"text":"Dinding luar yang nipis dan elastik meregang menyebabkan sel melengkung keluar","bucketId":"buka","note":"Tepat! Membuka liang stoma untuk pertukaran gas."},{"text":"Berlaku apabila tumbuhan kekurangan air bagi mengelakkan kelayuan berterusan","bucketId":"tutup","note":"Betul! Mengurangkan kehilangan wap air melalui transpirasi."}],"explanation":"Pemasukan K+ & kepekatan sukrosa tinggi -> osmosis masuk -> sel pengawal segah -> stoma terbuka. Pengeluaran K+ & penukaran sukrosa kepada kanji / kekurangan air -> osmosis keluar -> flasid -> stoma tertutup."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s4","voiceToneLabel":"Taburan Stoma & Kesan Kekurangan Air","voiceCaption":"Taburan stoma lebih padat pada epidermis bawah daun eudikot dan monokot bagi mengurangkan penyejatan air berlebihan akibat dedahan terus cahaya matahari.","voiceScript":"[warm] Mengapakah liang stoma jauh lebih padat pada permukaan epidermis bawah daun berbanding permukaan atas? Dalam Eksperimen dua perpuluhan satu menggunakan pengilat kuku lut sinar ke atas daun pokok keembung sebagai eudikot dan daun pokok bakung sebagai monokot, bilangan stoma didapati lebih tinggi di epidermis bawah kerana bahagian bawah daun terlindung daripada pancaran cahaya matahari terus, sekali gus mencegah kehilangan air yang melampau melalui transpirasi! Sel pengawal daun eudikot berbentuk kacang ginjal, manakala sel pengawal daun monokot berbentuk halter. Selain itu, apabila tumbuhan kekurangan air, sel pengawal menjadi flasid lalu menutup liang stoma bagi mengekalkan kandungan air badan tumbuhan!","title":"Taburan Stoma Eudikot vs Monokot & Kekurangan Air","acronym":"E•M•B•A","hook":"Perhatikan mengapa eksperimen pengilat kuku digunakan untuk mengira taburan stoma di epidermis atas dan bawah!","summary":"Stoma lebih padat di epidermis bawah bagi mengurangkan transpirasi melampau; kekurangan air menjadikan sel pengawal flasid lalu menutup stoma.","bullets":["Eksperimen 2.1 Taburan Stoma: Lapisan pengilat kuku lut sinar disapu pada epidermis atas dan bawah daun pokok keembung (eudikot) dan daun pokok bakung (monokot), dikupas dan dibilang di bawah mikroskop. Keputusan: Epidermis bawah mempunyai bilangan stoma yang jauh lebih padat.","Wajaran Taburan Bawah: Permukaan bawah kurang terdedah kepada cahaya matahari terik dan tiupan angin terus, mengurangkan kadar kehilangan air secara berlebihan sambil mengekalkan pertukaran gas.","Kesan Kekurangan Air: Apabila tumbuhan layu/kekurangan air, sel pengawal menjadi flasid (dinding luar nipis melurus) dan stoma tertutup untuk menyelamatkan tumbuhan daripada dehidrasi."],"labId":"bio52_stoma_osmo_sim","labTitle":"Uji Kesan Kekurangan Air terhadap Stoma","labProps":{"condition":"kemarau"},"examTip":"Aktiviti Model Belon Tiub-Y (Rajah 2.4): Pita/lapisan lebih tebal pada bahagian dalam belon mewakili dinding dalam sel pengawal yang tebal dan kurang elastik; udara yang ditiup mewakili kemasukan air secara osmosis!"},{"type":"match","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Padan Eksperimen Stoma & Struktur","voiceCaption":"Padankan komponen eksperimen model belon serta kajian taburan stoma dengan konsep biologi yang diwakilinya.","voiceScript":"[confident] Padankan kelima-lima item daripada Aktiviti Model Belon dan Eksperimen Taburan Stoma dengan maksud tepatnya!","prompt":"Padankan item aktiviti makmal stoma dengan konsep yang diwakilinya:","pairs":[{"id":"b52u2m1","left":"Kedua-dua belon pada hujung tiub Y","right":"Sepasang sel pengawal yang mengapit liang stoma"},{"id":"b52u2m2","left":"Ruang di antara kedua-dua belon apabila ditiup","right":"Liang stoma yang terbuka akibat sel pengawal segah"},{"id":"b52u2m3","left":"Daun pokok keembung vs daun pokok bakung","right":"Perbandingan taburan stoma antara daun eudikot dengan daun monokot"},{"id":"b52u2m4","left":"Pengilat kuku tidak berwarna","right":"Mengambil cetakan epidermis daun untuk membilang stoma di bawah mikroskop"},{"id":"b52u2m5","left":"Dinding dalam sel pengawal tebal & kurang elastik","right":"Menyebabkan sel melengkung ke luar apabila segah untuk membuka stoma"}],"explanation":"Model belon tiub Y mengilustrasikan bagaimana kesegahan menyebabkan sel pengawal melengkung ke luar membuka liang stoma, manakala pengilat kuku lut sinar merekod cetakan stoma epidermis."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Mekanisme Ion Kalium","voiceCaption":"Susun urutan tepat mekanisme pembukaan stoma yang dicetuskan oleh pengambilan ion kalium pada waktu siang.","voiceScript":"[confident] Susun blok pernyataan ini mengikut urutan kausal pembukaan stoma apabila ion kalium bergerak masuk ke dalam sel pengawal!","prompt":"Susun urutan tepat mekanisme pembukaan stoma melalui pengambilan ion kalium:","hint":"Ion kalium masuk -> keupayaan larutan -> keupayaan air -> osmosis -> bentuk sel...","answerTokens":["Ion kalium bergerak masuk ke dalam sel pengawal","menyebabkan keupayaan larutan meningkat dan keupayaan air menurun","lalu molekul air dari sel epidermis meresap masuk secara osmosis","menjadikan sel pengawal segah, melengkung keluar dan membuka stoma"],"distractors":["menyebabkan keupayaan air meningkat melebihi sel epidermis","lalu sukrosa ditukar menjadi kanji supaya sel menjadi flasid"],"explanation":"Ion K+ masuk -> keupayaan larutan naik -> keupayaan air turun -> air masuk secara osmosis -> sel pengawal segah melengkung keluar -> stoma terbuka."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s7","voiceToneLabel":"Cabaran Unit 2: Subtopik 2.2","voiceCaption":"Pilih penjelasan paling tepat mengapa taburan stoma lebih padat pada epidermis bawah daun berbanding epidermis atas.","voiceScript":"[excited] Soalan penutup Unit dua! Pilih wajaran paling tepat bagi kepadatan stoma di permukaan bawah daun.","prompt":"Mengapakah taburan stoma pada epidermis bawah daun lebih padat berbanding epidermis atas?","options":["Epidermis bawah tidak terdedah secara terus kepada sinaran matahari bagi mengelakkan kehilangan air yang berlebihan melalui transpirasi","Gas karbon dioksida hanya wujud di bawah permukaan daun dan tidak boleh naik ke atas","Sel epidermis atas mempunyai terlalu banyak kloroplas sehingga tiada ruang untuk stoma","Untuk membolehkan kutikel atas menjadi lebih tebal daripada mesofil palisad"],"correctIndex":0,"explanation":"Kepadatan stoma yang tinggi di epidermis bawah yang teduh mengurangkan kehilangan air akibat sejatan terus haba matahari sambil mengekalkan kemasukan CO2 untuk fotosintesis."}]},{"id":"bio52-u3","title":"Unit 3: Organ Utama Transpirasi & Potometer","subtitle":"Subtopik 2.3 — Keperluan Transpirasi, 4 Faktor Persekitaran (Cahaya, Kelembapan, Suhu, Angin) & Eksperimen Potometer Gelembung","iconType":"pendulum","iconUrl":"../assets/icons/bio52-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Keperluan Transpirasi & 90% Stoma","voiceCaption":"Transpirasi ialah kehilangan air dalam bentuk wap air secara sejatan dari tumbuhan ke atmosfera, dengan sembilan puluh peratus berlaku melalui stoma daun.","voiceScript":"[warm] Selamat datang ke Unit tiga: Organ Utama Transpirasi! Transpirasi ialah proses kehilangan air dalam bentuk wap air secara sejatan daripada tumbuhan ke atmosfera, dan sebanyak sembilan puluh peratus daripadanya tersejat keluar melalui liang stoma pada daun! Mengapakah tumbuhan memerlukan transpirasi walaupun ia kehilangan air? Pertama, ia membantu akar menyerap air dan garam mineral dari tanah; kedua, air menyerap tenaga haba daripada daun sebelum tersejat lalu memberi kesan penyejukan kepada tumbuhan; ketiga, ia menjana daya tarikan transpirasi yang menggerakkan air dan mineral secara berterusan di dalam salur xilem dari akar ke seluruh sel tumbuhan!","title":"2.3 Keperluan Transpirasi dalam Tumbuhan","acronym":"S•P•T","hook":"Laraskan cahaya, suhu, angin dan kelembapan pada Simulator Potometer di bawah untuk melihat kesannya terhadap kadar transpirasi!","summary":"90% transpirasi berlaku melalui stoma daun untuk penyejukan daun, penyerapan mineral akar dan daya tarikan pengangkutan xilem.","bullets":["Definisi Transpirasi: Proses kehilangan air dalam bentuk wap air secara sejatan daripada tumbuhan ke atmosfera (90% berlaku melalui liang stoma pada daun, bakinya melalui batang dan bunga).","3 Kepentingan Transpirasi: (1) Membolehkan akar menyerap air dan garam mineral dari tanah; (2) Air menyerap tenaga haba daun dan tersejat untuk kesan penyejukan; (3) Menghasilkan daya tarikan transpirasi yang menggerakkan air serta mineral secara berterusan dalam salur xilem."],"labId":"bio52_potometer_sim","labTitle":"Simulator Potometer Gelembung (Kadar Transpirasi)","labProps":{"light":70,"temp":30,"wind":40,"hum":60},"examTip":"Skema Kertas 2: Bagaimana lumpur banjir yang menyaluti daun mengurangkan transpirasi? Jawapan: Lumpur menyekat liang stoma sehingga wap air sukar meresap keluar dan mengurangkan kadar transpirasi."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Kesan Angin & Kelembapan","voiceCaption":"Ramalkan pergerakan gelembung udara dalam potometer apabila ranting berdaun diletakkan di hadapan kipas berbanding di dalam beg plastik lembap.","voiceScript":"[curious] Uji hipotesis potometer! Apakah perbezaan kadar pergerakan gelembung udara apabila ranting berdaun ditiup angin kipas meja berbanding apabila dilitupi beg plastik lembap?","hook":"Laraskan slider Angin dan Kelembapan pada Simulator Potometer selepas menjawab!","scenario":"Ranting berdaun yang dipotong di dalam air dipasang pada potometer dan diuji dalam dua keadaan: (P) di hadapan kipas meja, dan (Q) dibungkus dengan beg plastik lembap.","prompt":"Apakah pemerhatian dan penerangan yang BETUL bagi keadaan P dan Q?","options":["Gelembung udara bergerak lebih jauh dalam P kerana angin menyingkirkan wap air di sekeliling stoma, manakala perlahan dalam Q kerana kelembapan relatif tinggi merendahkan kecerunan sejatan","Gelembung udara bergerak lebih jauh dalam Q kerana wap air terkumpul menolak air masuk ke daun","Gelembung udara tidak bergerak dalam P kerana kipas menutup semua liang stoma","Kadar transpirasi adalah sama kerana jenis tumbuhan dimalarkan"],"correctIndex":0,"proofLabId":"bio52_potometer_sim","proofState":{"light":70,"temp":30,"wind":90,"hum":30},"explanation":"Angin laju menyingkirkan lapisan wap air tepu di permukaan daun lalu meningkatkan kadar transpirasi, manakala beg plastik lembap menaikkan kelembapan relatif udara dan melambatkan penyejatan wap air."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"4 Faktor Persekitaran & Potometer","voiceCaption":"Keamatan cahaya, suhu dan pergerakan udara meningkatkan kadar transpirasi, manakala kelembapan relatif udara tinggi mengurangkannya.","voiceScript":"[warm] Mari perhalusi keempat-empat faktor persekitaran yang mempengaruhi kadar transpirasi bersama prosedur Eksperimen Potometer! Pertama, keamatan cahaya tinggi merangsang pembukaan stoma dan meningkatkan transpirasi sehingga menjadi malar apabila faktor lain menjadi pengehad. Kedua, peningkatan suhu meningkatkan tenaga kinetik molekul air supaya lebih cepat tersejat. Ketiga, pergerakan udara laju menyingkirkan molekul air yang tersejat di sekitar daun. Keempat, semakin rendah kelembapan relatif udara, semakin tinggi kecerunan resapan dan semakin tinggi kadar transpirasi! Dalam eksperimen potometer, ranting berdaun wajib dipotong di dalam air supaya tiada gelembung udara menyumbat salur xilem, semua sambungan disapu jeli petroleum agar kedap udara, dan kadar transpirasi dihitung dengan membahagikan jarak pergerakan gelembung udara dengan masa!","title":"4 Faktor Persekitaran & Prosedur Eksperimen Potometer","acronym":"C•K•S•A","hook":"Ingat dua langkah berjaga-jaga wajib potometer: potong ranting di dalam air dan sapu jeli petroleum pada sambungan!","summary":"Kadar transpirasi meningkat dengan keamatan cahaya, suhu dan kelajuan angin, tetapi menurun apabila kelembapan relatif udara tinggi. Kadar = Jarak gelembung (cm) / Masa (min).","bullets":["4 Faktor Persekitaran: (1) Keamatan cahaya: naik hingga malar apabila dihadkan faktor lain; (2) Suhu: menaikkan tenaga kinetik molekul air; (3) Pergerakan udara: angin menyingkirkan wap air dari permukaan daun; (4) Kelembapan relatif udara: kelembapan rendah meningkatkan kadar transpirasi.","Prosedur & Formula Potometer: Potometer mengukur kadar pengambilan air oleh pucuk berdaun. Potong ranting di dalam air (elak gelembung udara memasuki xilem) dan sapu jeli petroleum pada sambungan (kedap udara). Kadar transpirasi = Jarak pergerakan gelembung udara (cm) / Masa (min)."],"labId":"bio52_potometer_sim","labTitle":"Kira Kadar Transpirasi dengan Formula Potometer","labProps":{"light":100,"temp":35,"wind":80,"hum":40},"examTip":"Definisi secara operasi bagi transpirasi dalam eksperimen potometer: Kadar transpirasi ialah jarak yang dilalui oleh gelembung udara dalam tiub kapilari potometer dalam masa 10 minit (cm/min)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Kesan Terhadap Transpirasi","voiceCaption":"Kelaskan enam keadaan persekitaran berikut sama ada Meningkatkan Kadar Transpirasi atau Menurunkan Kadar Transpirasi.","voiceScript":"[confident] Asingkan keenam-enam keadaan persekitaran ini sama ada meningkatkan atau menurunkan kadar transpirasi tumbuhan!","prompt":"Isihkan faktor berikut mengikut kesannya terhadap kadar transpirasi:","buckets":[{"id":"naik","label":"Meningkatkan Kadar Transpirasi"},{"id":"turun","label":"Menurunkan Kadar Transpirasi"}],"items":[{"text":"Pergerakan udara laju di hadapan kipas yang menyingkirkan wap air di sekeliling daun","bucketId":"naik","note":"Tepat! Mengalihkan wap air mengekalkan kecerunan penyejatan yang curam."},{"text":"Suhu persekitaran tinggi yang meningkatkan tenaga kinetik molekul air","bucketId":"naik","note":"Betul! Molekul air tersejat lebih pantas melalui stoma."},{"text":"Kelembapan relatif udara yang tinggi di dalam hutan hujan tropika selepas hujan","bucketId":"turun","note":"Tepat! Udara hampir tepu dengan wap air melambatkan sejatan."},{"text":"Keamatan cahaya tinggi yang merangsang pembukaan liang stoma","bucketId":"naik","note":"Betul! Stoma terbuka luas membenarkan lebih banyak wap air tersejat."},{"text":"Daun disaluti lumpur selepas banjir yang menyumbat liang stoma","bucketId":"turun","note":"Tepat! Wap air tidak dapat keluar melalui stoma yang tersumbat."},{"text":"Keadaan gelap pada waktu malam menyebabkan stoma tertutup","bucketId":"turun","note":"Betul! Penutupan stoma menyekat 90% laluan transpirasi."}],"explanation":"Keamatan cahaya, suhu dan kelajuan angin meningkatkan kadar transpirasi, manakala kelembapan relatif udara tinggi, kegelapan atau stoma tersumbat menurunkan kadar transpirasi."},{"type":"match","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Padan Faktor & Langkah Potometer","voiceCaption":"Padankan lima komponen atau faktor eksperimen potometer berikut dengan tujuan atau penjelasannya yang betul.","voiceScript":"[confident] Uji ketepatan pengetahuan amali kamu tentang eksperimen potometer! Padankan kelima-lima pasangan berikut.","prompt":"Padankan komponen eksperimen potometer dan faktor berikut dengan fungsinya:","pairs":[{"id":"b52u3m1","left":"Memotong ranting berdaun di dalam air","right":"Mengelakkan gelembung udara memasuki dan menyekat turus air dalam xilem"},{"id":"b52u3m2","left":"Menyapu jeli petroleum pada sambungan gabus","right":"Memastikan sambungan potometer kedap udara tanpa kebocoran air"},{"id":"b52u3m3","left":"Mengelap daun sehingga kering sebelum mula","right":"Memastikan titisan air luar tidak menghalang sejatan melalui stoma"},{"id":"b52u3m4","left":"Gelembung udara di pangkal tiub kapilari","right":"Penanda untuk mengukur jarak pengambilan air oleh pucuk berdaun"},{"id":"b52u3m5","left":"Mentol 100 W berbanding bilik gelap","right":"Memanipulasi keamatan cahaya untuk menguji kesannya ke atas kadar transpirasi"}],"explanation":"Memotong ranting dalam air (elak sumbatan udara dalam xilem), jeli petroleum (kedap udara), mengelap daun (elak gangguan pada stoma) dan gelembung udara (penanda ukuran jarak)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Kesan Lumpur Banjir","voiceCaption":"Susun jawapan KBAT mengenai kesan daun berlumpur selepas banjir terhadap proses transpirasi pokok.","voiceScript":"[confident] Soalan Praktis Formatif dua perpuluhan tiga! Susun blok pernyataan ini bagi menjelaskan kesan lumpur pada daun terhadap kadar transpirasi.","prompt":"Susun penerangan kesan daun pokok X yang dipenuhi lumpur selepas banjir terhadap transpirasi:","hint":"Kaitkan lumpur dengan liang stoma dan daya tarikan transpirasi...","answerTokens":["Lumpur yang melekat pada permukaan daun menyekat liang stoma","lalu menghalang penyejatan wap air ke atmosfera dan menurunkan kadar transpirasi","yang seterusnya mengurangkan daya tarikan air serta pengangkutan garam mineral","melalui salur xilem dari akar ke daun"],"distractors":["menyebabkan akar menghasilkan lebih banyak klorofil untuk fotosintesis","lalu meningkatkan tenaga kinetik molekul air di dalam mesofil palisad"],"explanation":"Lumpur menyumbat liang stoma -> mengurangkan sejatan wap air (transpirasi) -> daya tarikan transpirasi untuk menarik air dan mineral dalam xilem turut merosot."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Cabaran Unit 3: Subtopik 2.3","voiceCaption":"Hitung kadar transpirasi apabila gelembung udara bergerak sejauh empat perpuluhan lima sentimeter dalam masa sepuluh minit.","voiceScript":"[excited] Soalan pengiraan pantas penutup Unit tiga! Kirakan kadar transpirasi berdasarkan bacaan potometer ini.","prompt":"Dalam satu eksperimen potometer, gelembung udara bergerak sejauh 4.5 cm dalam masa 10 minit. Berapakah kadar transpirasi ranting berdaun tersebut?","options":["0.45 cm/min","45.0 cm/min","2.22 cm/min","0.045 cm/min"],"correctIndex":0,"explanation":"Kadar transpirasi = Jarak pergerakan gelembung udara (4.5 cm) / Masa (10 min) = 0.45 cm/min."}]},{"id":"bio52-u4","title":"Unit 4: Kloroplas, Pigmen & Dua Peringkat Fotosintesis","subtitle":"Subtopik 2.4 — Sejarah van Helmont & Priestley, Kloroplas (Tilakoid, Granum, Stroma), Kromatografi Rf & Reaksi Cahaya vs Tidak Bersandarkan Cahaya","iconType":"atom","iconUrl":"../assets/icons/bio52-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kloroplas, Pigmen & Video Penerangan","voiceCaption":"Tonton video penerangan bersuara mengenai struktur daun serta kloroplas yang terdiri daripada tilakoid, granum, stroma dan pigmen fotosintesis.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik dua perpuluhan empat: Organ Utama Fotosintesis! Tonton dahulu video penerangan bersuara lima belas saat di bawah untuk melihat bagaimana struktur daun dan kloroplas menukarkan tenaga cahaya kepada makanan! Dalam sejarah sains, Jan-Baptista van Helmont pada seribu enam ratus empat puluhan membuktikan pokok membesar daripada air yang disiram bukan daripada tanah, manakala Joseph Priestley pada seribu tujuh ratus tujuh puluh dua membuktikan tumbuhan membebaskan oksigen untuk menyokong kehidupan haiwan. Kloroplas pula mempunyai tilakoid berbentuk cakera yang disusun bertindan menjadi granum bagi menambah luas permukaan, serta dikelilingi bendalir tidak berwarna iaitu stroma. Pigmen daun seperti klorofil a, klorofil b, karotenoid, xantofil dan feofitin boleh diasingkan melalui kromatografi kertas berdasarkan nilai R f!","title":"2.4 Sejarah Fotosintesis, Kloroplas & Kromatografi Pigmen","acronym":"T•G•S•R","hook":"Tonton video penerangan bersuara tentang struktur daun & kloroplas, kemudian teroka tab Kromatografi Pigmen (nilai Rf)!","mediaKey":"bio52_kloroplas_fotosintesis","videoClip":{"src":"../assets/biologi-t5-bab02/video/bio52_video_daun_fotosintesis_narasi.mp4","hasNarration":true,"posterKey":"bio52_kloroplas_fotosintesis","caption":"Struktur dalaman daun, kloroplas dan proses fotosintesis."},"summary":"Kloroplas mengandungi tilakoid (bertindan menjadi granum — tapak tindak balas bersandarkan cahaya) dan stroma (bendalir — tapak tindak balas tidak bersandarkan cahaya).","bullets":["Sejarah Penemuan: Jan-Baptista van Helmont (1640-an: pokok membesar menggunakan air yang disiram, bukan berat tanah) & Joseph Priestley (1772: tumbuhan membebaskan oksigen yang mengekalkan tikus hidup dalam balang tertutup).","Struktur Kloroplas: Tilakoid (kantung cakera mengandungi klorofil; tapak tindak balas bersandarkan cahaya), Granum (timbunan cakera tilakoid meningkatkan luas permukaan fotosintesis) dan Stroma (bendalir tidak berwarna mengelilingi granum; tapak tindak balas tidak bersandarkan cahaya).","Kromatografi Kertas & Nilai Rf (Jadual 2.3): Pelarut (1 bahagian aseton : 9 bahagian eter petroleum) memisahkan pigmen mengikut keterlarutan: Karotenoid (oren, Rf 0.95), Feofitin (kelabu, Rf 0.70), Klorofil a (biru/kehijauan, Rf 0.60), Klorofil b (hijau, Rf 0.50) dan Xantofil (kuning, Rf 0.35)."],"labId":"bio52_fotosintesis_kloroplas_lab","labTitle":"Makmal Kloroplas, Tindak Balas Cahaya/Gelap & Nilai Rf","labProps":{"stage":"pigmen"},"examTip":"Soalan Aktiviti 2.3 Kromatografi: Mengapakah pasir halus digunakan semasa menumbuk daun bersama aseton 80%? Jawapan: Untuk memecahkan dinding sel daun supaya pigmen keluar dengan mudah!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Struktur Kloroplas & Nilai Rf","voiceCaption":"Padankan lima istilah struktur kloroplas, ahli sains dan pigmen fotosintesis berikut dengan maklumat tepatnya.","voiceScript":"[confident] Uji ketepatan kamu mengenai kloroplas, sejarah fotosintesis dan nilai R f pigmen daun!","prompt":"Padankan struktur kloroplas, saintis dan pigmen fotosintesis dengan huraiannya:","pairs":[{"id":"b52u4m1","left":"Tilakoid & Granum","right":"Kantung cakera berklorofil yang bertindan menjadi tapak tindak balas bersandarkan cahaya"},{"id":"b52u4m2","left":"Stroma","right":"Bendalir tidak berwarna tempat tindak balas tidak bersandarkan cahaya menghasilkan glukosa"},{"id":"b52u4m3","left":"Karotenoid (Rf = 0.95)","right":"Pigmen berwarna oren paling larut dalam pelarut kromatografi"},{"id":"b52u4m4","left":"Jan-Baptista van Helmont","right":"Membuktikan pokok membesar daripada air yang disiram bukan daripada jisim tanah"},{"id":"b52u4m5","left":"Joseph Priestley","right":"Membuktikan tumbuhan membebaskan gas oksigen dalam balang tertutup"}],"explanation":"Tilakoid/granum ialah tapak tindak balas bersandarkan cahaya, stroma ialah tapak tindak balas tidak bersandarkan cahaya, dan nilai Rf tertinggi dimiliki karotenoid (0.95)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"2 Peringkat Tindak Balas Fotosintesis","voiceCaption":"Tindak balas bersandarkan cahaya di tilakoid menghasilkan ATP, NADPH dan gas oksigen melalui fotolisis air, manakala tindak balas tidak bersandarkan cahaya di stroma menurunkan karbon dioksida membentuk glukosa.","voiceScript":"[warm] Sekarang fahami dua peringkat utama fotosintesis langkah demi langkah! Pertama, tindak balas bersandarkan cahaya yang berlaku di membran tilakoid: pigmen klorofil menyerap cahaya dan menguja elektron ke aras tinggi; elektron mengalir melalui rantai pengangkut elektron untuk menjana molekul A T P lalu diterima oleh koenzim N A D P positif bersama ion hidrogen daripada fotolisis air membentuk N A D P H sebagai agen penurunan! Semasa fotolisis air, molekul air terurai dengan cahaya dan klorofil menjadi ion hidrogen serta ion hidroksida yang kehilangan elektron lalu membentuk gas oksigen dan air. Kedua, tindak balas tidak bersandarkan cahaya di stroma menggunakan A T P dan N A D P H untuk menurunkan gas karbon dioksida menjadi glukosa!","title":"Tindak Balas Bersandarkan Cahaya vs Tidak Bersandarkan Cahaya","acronym":"F•A•N•G","hook":"Klik tab Cahaya dan Gelap dalam Makmal Kloroplas untuk membandingkan bahan tindak balas, tapak serta hasil!","summary":"Bersandarkan cahaya (Tilakoid): Fotolisis air -> ATP + NADPH + O2. Tidak bersandarkan cahaya (Stroma): CO2 diturunkan oleh NADPH guna ATP -> Glukosa.","bullets":["Tindak Balas Bersandarkan Cahaya (Tilakoid): (1) Klorofil menyerap cahaya dan menguja elektron; (2) Tenaga elektron membentuk ATP melalui siri pengangkut elektron; (3) Fotolisis air menguraikan H2O menjadi H+ dan OH- (OH- kehilangan elektron membentuk gas O2 dan air, manakala elektron menggantikan elektron klorofil); (4) NADP+ menerima elektron dan H+ menjadi agen penurunan NADPH.","Tindak Balas Tidak Bersandarkan Cahaya (Stroma): Menggunakan ATP dan NADPH daripada peringkat cahaya untuk menurunkan gas CO2 menghasilkan glukosa (dimangkinkan enzim).","Persamaan Kimia Keseluruhan: 12H2O + 6CO2 ->(cahaya, klorofil)-> C6H12O6 + 6O2 + 6H2O."],"labId":"bio52_fotosintesis_kloroplas_lab","labTitle":"Banding Peringkat Cahaya (Tilakoid) vs Stroma","labProps":{"stage":"cahaya"},"examTip":"Soalan Kertas 2: Mengapakah tindak balas tidak bersandarkan cahaya tetap terhenti pada waktu malam yang lama? Kerana ia bergantung kepada bekalan ATP dan NADPH yang hanya dihasilkan semasa tindak balas bersandarkan cahaya!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Sumber Oksigen & Fotolisis","voiceCaption":"Ramalkan kesan sekiranya bekalan ATP dan NADPH daripada tilakoid disekat daripada memasuki stroma kloroplas.","voiceScript":"[curious] Cuba ramalkan apa yang akan berlaku di dalam stroma sekiranya tindak balas bersandarkan cahaya dihentikan supaya tiada A T P dan N A D P H dihasilkan!","hook":"Semak anak panah pemindahan ATP dan NADPH dari Tilakoid ke Stroma dalam Makmal Kloroplas!","scenario":"Satu perencat kimia khas menyekat pengangkutan elektron di membran tilakoid kloroplas sehingga tiada ATP dan NADPH dapat disintesis.","prompt":"Apakah kesan langsung terhadap tindak balas tidak bersandarkan cahaya di stroma?","options":["Tindak balas tidak bersandarkan cahaya akan terhenti kerana tiada tenaga ATP dan agen penurunan NADPH untuk menurunkan gas karbon dioksida kepada glukosa","Stroma akan menggantikan tempat tilakoid untuk menjalankan fotolisis air secara langsung","Gas oksigen masih terus dihasilkan daripada penurunan gas karbon dioksida","Klorofil akan berubah menjadi karotenoid serta-merta"],"correctIndex":0,"proofLabId":"bio52_fotosintesis_kloroplas_lab","proofState":{"stage":"gelap"},"explanation":"Walaupun tindak balas di stroma tidak memerlukan cahaya secara langsung, ia tetap bergantung sepenuhnya kepada ATP (sumber tenaga) dan NADPH (agen penurunan) daripada tindak balas bersandarkan cahaya."},{"type":"sort","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Isih Dua Peringkat Fotosintesis","voiceCaption":"Kelaskan enam ciri daripada Rajah dua perpuluhan sembilan belas antara Tindak Balas Bersandarkan Cahaya dengan Tidak Bersandarkan Cahaya.","voiceScript":"[confident] Asingkan keenam-enam ciri daripada Rajah dua perpuluhan sembilan belas ini kepada tindak balas bersandarkan cahaya atau tidak bersandarkan cahaya!","prompt":"Isihkan pernyataan berikut mengikut peringkat tindak balas fotosintesis yang betul:","buckets":[{"id":"cahaya","label":"Bersandarkan Cahaya"},{"id":"gelap","label":"Tidak Bersandarkan Cahaya"}],"items":[{"text":"Tapak tindak balas di tilakoid kloroplas","bucketId":"cahaya","note":"Tepat! Membran tilakoid mengandungi pigmen fotosintesis."},{"text":"Tapak tindak balas di stroma kloroplas","bucketId":"gelap","note":"Betul! Berlaku dalam bendalir stroma."},{"text":"Menghasilkan molekul ATP dan membebaskan gas oksigen serta air","bucketId":"cahaya","note":"Tepat! Oksigen terhasil daripada fotolisis air."},{"text":"Menggunakan molekul ATP dan NADPH untuk menurunkan gas karbon dioksida","bucketId":"gelap","note":"Betul! Menurunkan CO2 untuk membentuk glukosa."},{"text":"Bahan tindak balas ialah air (melalui proses fotolisis)","bucketId":"cahaya","note":"Tepat! Molekul air terurai dengan tenaga cahaya dan klorofil."},{"text":"Bahan tindak balas ialah gas karbon dioksida dan hasilnya ialah glukosa","bucketId":"gelap","note":"Betul! Sintesis karbohidrat berlaku di stroma."}],"explanation":"Kedua-dua tindak balas berlaku dalam kloroplas dan dimangkinkan oleh enzim; tilakoid menjalankan tindak balas cahaya (air -> O2, ATP, NADPH), manakala stroma menjalankan penurunan CO2 kepada glukosa."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Mekanisme Fotolisis Air","voiceCaption":"Susun blok fakta menerangkan proses fotolisis air di tilakoid sehingga pembebasan gas oksigen.","voiceScript":"[confident] Susun blok jawapan ini bagi menjelaskan langkah fotolisis air semasa tindak balas bersandarkan cahaya!","prompt":"Susun urutan peristiwa fotolisis air semasa tindak balas bersandarkan cahaya:","hint":"Mulakan dengan penguraian molekul air oleh tenaga cahaya...","answerTokens":["Dengan kehadiran tenaga cahaya dan klorofil","molekul air terurai melalui fotolisis membentuk ion hidrogen dan ion hidroksida","di mana ion hidrogen bergabung dengan NADP positif menjadi NADPH","manakala ion hidroksida kehilangan elektron membentuk gas oksigen dan air"],"distractors":["di mana gas karbon dioksida dipecahkan kepada atom karbon","lalu menghasilkan molekul kanji terus di dalam membran tilakoid"],"explanation":"Fotolisis air: H2O -> H+ + OH-. H+ + NADP+ + e- -> NADPH, manakala OH- kehilangan elektron untuk menghasilkan gas oksigen (O2) dan air."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s7","voiceToneLabel":"Cabaran Unit 4: Subtopik 2.4","voiceCaption":"Pilih persamaan kimia keseluruhan fotosintesis yang seimbang dan tepat mengikut buku teks KSSM.","voiceScript":"[excited] Soalan penutup Unit empat! Pilih persamaan kimia keseluruhan proses fotosintesis yang seimbang dan tepat.","prompt":"Manakah antara persamaan kimia berikut mewakili proses fotosintesis keseluruhan dengan TEPAT?","options":["12H2O + 6CO2 ->(tenaga cahaya, klorofil)-> C6H12O6 + 6O2 + 6H2O","6H2O + 6O2 ->(tenaga cahaya, klorofil)-> C6H12O6 + 6CO2","C6H12O6 + 6O2 -> 6CO2 + 6H2O + Tenaga","12CO2 + 6H2O ->(stroma)-> C6H12O6 + 12O2"],"correctIndex":0,"explanation":"Persamaan seimbang fotosintesis KSSM ialah 12H2O + 6CO2 -> C6H12O6 + 6O2 + 6H2O dengan kehadiran tenaga cahaya dan klorofil."}]},{"id":"bio52-u5","title":"Unit 5: Faktor Pengehad Fotosintesis & Titik Pampasan","subtitle":"Subtopik 2.4–2.5 — Faktor Pengehad (CO2, Cahaya, Suhu 25–30°C), Eksperimen Hydrilla + NaHCO3, Warna Cahaya, Titik Pampasan & Jadual 2.4","iconType":"graph","iconUrl":"../assets/icons/bio52-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Faktor Pengehad & Spektrum Cahaya","voiceCaption":"Kadar fotosintesis dipengaruhi kepekatan karbon dioksida, keamatan cahaya, suhu optimum dua puluh lima hingga tiga puluh darjah Celsius serta warna cahaya merah dan biru.","voiceScript":"[warm] Selamat datang ke Unit lima! Kadar fotosintesis dipengaruhi oleh kepekatan gas karbon dioksida, keamatan cahaya, suhu dan warna cahaya. Apabila satu faktor dinaikkan sehingga graf menjadi mendatar pada takat ketepuan, ini bermakna faktor lain menjadi faktor pengehad! Bagi suhu, tindak balas dimangkinkan oleh enzim dengan suhu optimum antara dua puluh lima hingga tiga puluh darjah Celsius; suhu terlampau tinggi akan menyahaslikan enzim lalu menghentikan fotosintesis. Dalam eksperimen Hydrilla, larutan natrium hidrogen karbonat digunakan bagi membekalkan gas karbon dioksida! Dari segi spektrum cahaya pula, kadar fotosintesis tertinggi berlaku dalam cahaya merah dan biru kerana kedua-duanya diserap oleh klorofil serta karotenoid, sedangkan cahaya hijau dipantulkan!","title":"2.4 Faktor Pengehad, Eksperimen Hydrilla & Spektrum Cahaya","acronym":"C•C•S•W","hook":"Fahami mengapa daun berklorofil kelihatan hijau dan mengapa NaHCO3 digunakan bersama Hydrilla sp.!","mediaKey":"bio52_hydrilla_akuatik","summary":"CO2, keamatan cahaya dan suhu (optimum 25–30°C) bertindak sebagai faktor pengehad. Kadar fotosintesis tertinggi dalam cahaya merah dan biru (hijau dipantulkan).","bullets":["Faktor Pengehad (CO2, Keamatan Cahaya & Suhu): Peningkatan CO2 atau keamatan cahaya meningkatkan kadar fotosintesis sehingga mendatar di takat P apabila dihadkan oleh faktor lain. Suhu optimum enzim ialah 25°C–30°C; suhu terlalu tinggi menyahaslikan enzim.","Eksperimen A–C (Hydrilla sp.): Memanipulasi jarak mentol (keamatan cahaya), suhu air berais/suam (5°C–75°C) dan kepekatan larutan NaHCO3 (0.01 M–0.10 M, pembekal gas CO2) dengan mengira bilangan gelembung oksigen dalam 5 minit.","Warna Cahaya: Kadar fotosintesis tertinggi dalam cahaya merah (diserap klorofil) dan cahaya biru (diserap karotenoid lalu dipindahkan ke klorofil); daun kelihatan hijau kerana cahaya hijau dipantulkan."],"labId":"bio52_titik_pampasan_lab","labTitle":"Simulator Graf Keamatan Cahaya & Titik Pampasan","labProps":{"lightLux":80},"examTip":"Soalan amali wajib: Apakah fungsi larutan natrium hidrogen karbonat (NaHCO3) 0.2% dalam eksperimen Hydrilla? Jawapan: Membekalkan gas karbon dioksida kepada Hydrilla sp. untuk fotosintesis."},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Ramal Titik Pampasan & Hutan","voiceCaption":"Ramalkan apa yang berlaku terhadap penghasilan glukosa dan pembebasan gas oksigen apabila kadar fotosintesis tepat sama dengan kadar respirasi.","voiceScript":"[curious] Sekarang mari masuk ke subtopik dua perpuluhan lima: Titik Pampasan! Bayangkan sebatang tumbuhan berada tepat pada titik pampasan di mana kadar fotosintesis sama dengan kadar respirasi. Apakah kesannya terhadap simpanan glukosa dan pembebasan oksigen?","hook":"Laraskan slider keamatan cahaya ke 40 unit pada Simulator Titik Pampasan untuk mengesahkan ramalan!","scenario":"Pada pukul 10.00 pagi, sebatang pokok paku pakis di lantai hutan tropika yang teduh mencapai titik pampasan apabila kadar fotosintesis menyamai kadar respirasinya.","prompt":"Apakah kesan keadaan ini terhadap penghasilan glukosa bersih dan pertukaran gas oksigen dengan atmosfera?","options":["Tiada untung bersih glukosa kerana semua glukosa daripada fotosintesis digunakan untuk respirasi, dan tiada pembebasan bersih oksigen ke atmosfera","Simpanan kanji meningkat dengan cepat di dalam akar dan rizom","Tumbuhan membebaskan gas oksigen yang paling maksimum ke atmosfera","Tumbuhan berhenti menjalankan respirasi sel serta-merta"],"correctIndex":0,"proofLabId":"bio52_titik_pampasan_lab","proofState":{"lightLux":40},"explanation":"Pada titik pampasan, kadar fotosintesis = kadar respirasi. Semua glukosa dan oksigen yang dihasilkan oleh fotosintesis digunakan sepenuhnya dalam respirasi sel tanpa sebarang lebihan."},{"type":"sort","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Isih Fotosintesis vs Respirasi","voiceCaption":"Kelaskan enam perbezaan daripada Jadual dua perpuluhan empat antara proses Fotosintesis dengan proses Respirasi sel.","voiceScript":"[confident] Uji Jadual dua perpuluhan empat! Asingkan keenam-enam ciri metabolisme ini kepada Fotosintesis atau Respirasi.","prompt":"Isihkan ciri berikut kepada proses Fotosintesis atau Respirasi:","buckets":[{"id":"foto","label":"Fotosintesis"},{"id":"resp","label":"Respirasi"}],"items":[{"text":"Proses anabolisme yang mensintesis glukosa daripada gas CO2 dan air","bucketId":"foto","note":"Tepat! Membina molekul organik kompleks daripada bahan ringkas."},{"text":"Proses katabolisme yang menguraikan glukosa untuk menghasilkan tenaga","bucketId":"resp","note":"Betul! Berlaku di dalam semua sel organisma hidup."},{"text":"Berlaku di tapak kloroplas dan memerlukan cahaya","bucketId":"foto","note":"Tepat! Menukarkan tenaga cahaya kepada tenaga kimia."},{"text":"Berlaku di tapak mitokondria dan tidak memerlukan cahaya","bucketId":"resp","note":"Betul! Menukarkan tenaga kimia kepada ATP serta membebaskan haba."},{"text":"Menghasilkan hasil utama glukosa serta hasil sampingan gas oksigen dan air","bucketId":"foto","note":"Tepat! Hanya berlaku dalam sel berklorofil dan bakteria fotosintetik."},{"text":"Menggunakan gas oksigen dan glukosa serta membebaskan gas CO2 dan air","bucketId":"resp","note":"Betul! Membebaskan tenaga untuk proses hidup sel."}],"explanation":"Jadual 2.4 membezakan Fotosintesis (anabolisme, kloroplas, guna CO2+air, hasil glukosa+O2, perlu cahaya) daripada Respirasi (katabolisme, mitokondria, guna glukosa+O2, hasil tenaga/ATP+CO2+air)."},{"type":"match","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Padan Titik Pampasan & Cahaya","voiceCaption":"Padankan lima konsep berkaitan titik pampasan, warna cahaya dan faktor pengehad fotosintesis dengan penerangannya.","voiceScript":"[confident] Padankan kelima-lima konsep Subtopik dua perpuluhan empat dan dua perpuluhan lima ini dengan tepat!","prompt":"Padankan konsep berikut dengan huraian tepatnya:","pairs":[{"id":"b52u5m1","left":"Titik pampasan","right":"Aras keamatan cahaya apabila kadar fotosintesis sama dengan kadar respirasi"},{"id":"b52u5m2","left":"Melepasi titik pampasan","right":"Untung bersih glukosa disimpan sebagai kanji dan O2 berlebihan dibebaskan"},{"id":"b52u5m3","left":"Cahaya merah dan cahaya biru","right":"Panjang gelombang cahaya yang memberi kadar fotosintesis paling tinggi"},{"id":"b52u5m4","left":"Larutan NaHCO3 0.2%","right":"Membekalkan gas karbon dioksida kepada Hydrilla sp. dalam eksperimen"},{"id":"b52u5m5","left":"Suhu melebihi 45°C–60°C","right":"Enzim fotosintesis mengalami penyahaslian menyebabkan kadar fotosintesis jatuh"}],"explanation":"Titik pampasan berlaku apabila kadar fotosintesis menyamai kadar respirasi. Melepasi titik ini barulah tumbuhan mencatat untung bersih glukosa untuk pertumbuhan, buah dan biji benih."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Susun Kesan Kekal di Titik Pampasan","voiceCaption":"Susun huraian mengapa kadar fotosintesis harian mesti melebihi kadar respirasi untuk kelangsungan hidup tumbuhan.","voiceScript":"[confident] Susun blok fakta ini untuk menjelaskan mengapa tumbuhan tidak boleh kekal pada titik pampasan sepanjang hari!","prompt":"Susun huraian kepentingan kadar fotosintesis melebihi titik pampasan setiap hari:","hint":"Kaitkan lebihan glukosa dengan pertumbuhan, pembiakan dan pembebasan O2...","answerTokens":["Kadar fotosintesis mesti melebihi kadar respirasi setiap hari","supaya kadar penghasilan glukosa melebihi penggunaannya dalam respirasi","dan glukosa berlebihan boleh disimpan sebagai kanji untuk pertumbuhan, bunga serta buah","sambil membebaskan oksigen berlebihan ke atmosfera untuk hidupan lain"],"distractors":["agar daun memantulkan semua cahaya merah dan biru ke udara","supaya mitokondria berhenti menjalankan respirasi sel"],"explanation":"Jika tumbuhan kekal pada titik pampasan, semua glukosa habis digunakan dalam respirasi dan tiada lebihan untuk membina tisu baharu, bunga, buah atau membekalkan oksigen kepada atmosfera."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s6","voiceToneLabel":"Cabaran Unit 5: Pokok Ara vs Paku Pakis","voiceCaption":"Ramalkan waktu pokok ara yang tinggi di kanopi hutan mencapai titik pampasan berbanding paku pakis di lantai hutan.","voiceScript":"[excited] Soalan Praktis Formatif dua perpuluhan lima! Jika pokok paku pakis di lantai hutan mencapai titik pampasan pada jam sepuluh pagi, bilakah pokok ara yang tinggi di kanopi mencapainya?","prompt":"Titik pampasan bagi pokok paku pakis di lantai hutan tropika berlaku pada jam 10.00 pagi. Bilakah pokok ara yang tumbuh tinggi di kanopi hutan yang sama mencapai titik pampasannya?","options":["Lebih awal daripada jam 10.00 pagi (sekitar jam 7.00–8.00 pagi) kerana pokok ara menerima keamatan cahaya matahari yang tinggi lebih awal","Lebih lewat pada jam 2.00 petang kerana daun pokok ara berada jauh dari akar","Pada waktu tengah malam apabila kelembapan relatif mencapai seratus peratus","Pokok ara tidak mempunyai titik pampasan kerana ia tumbuhan berkayu"],"correctIndex":0,"explanation":"Pokok ara yang tinggi di kanopi tidak diteduhi pokok lain dan menerima keamatan cahaya mencukupi jauh lebih awal pada waktu pagi berbanding paku pakis di lantai hutan yang teduh."}]},{"id":"bio52-u6","title":"Unit 6: Cabaran Boss SPM — Struktur & Fisiologi Daun","subtitle":"Sintesis Kertas 1 & Kertas 2 — Lamina, Stoma, Potometer, Kloroplas, Tindak Balas Cahaya/Gelap & Titik Pampasan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Padanan Fisiologi Daun","voiceCaption":"Padankan lima konsep utama Bab dua daripada struktur daun hingga titik pampasan dengan tepat.","voiceScript":"[excited] Selamat datang ke Cabaran Boss SPM Bab dua! Mulakan dengan memadankan kelima-lima konsep teras struktur dan fungsi daun ini!","prompt":"Padankan istilah dan struktur Bab 2 dengan huraian tepatnya:","pairs":[{"id":"b52boss1","left":"Mesofil palisad","right":"Sel tersusun tegak dan padat dengan banyak kloroplas untuk cahaya maksimum"},{"id":"b52boss2","left":"Ion kalium (K+) masuk sel pengawal","right":"Menurunkan keupayaan air -> osmosis masuk -> sel pengawal segah dan stoma terbuka"},{"id":"b52boss3","left":"Potometer gelembung","right":"Mengukur kadar pengambilan air untuk menentukan kadar transpirasi"},{"id":"b52boss4","left":"Tilakoid vs Stroma","right":"Tilakoid (bersandarkan cahaya -> ATP, NADPH, O2) vs Stroma (CO2 -> glukosa)"},{"id":"b52boss5","left":"Titik pampasan","right":"Kadar fotosintesis sama dengan kadar respirasi sel (untung bersih glukosa = 0)"}],"explanation":"Kesemua 5 subtopik Bab 2 saling berkait: cahaya menembusi lamina ke mesofil palisad, stoma mengawal kemasukan CO2 dan transpirasi, manakala kloroplas menukar cahaya kepada glukosa."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Eksperimen Pokok Pudina vs Taim","voiceCaption":"Ramalkan sampel daun berjeli petroleum yang kehilangan jisim paling sedikit berbanding paling banyak dalam eksperimen taburan stoma.","voiceScript":"[curious] Soalan Praktis Sumatif dua! Tiga sampel daun pudina sama jisim disapu jeli petroleum: Sampel A di kedua-dua permukaan, Sampel B di permukaan bawah sahaja, dan Sampel C tidak disapu langsung. Sampel manakah kehilangan jisim paling sedikit?","hook":"Ingat bahawa 90% transpirasi berlaku melalui stoma yang lebih padat di permukaan bawah daun!","scenario":"Sampel daun A (atas & bawah disapu jeli petroleum), Sampel B (permukaan bawah sahaja disapu), dan Sampel C (tidak disapu jeli petroleum).","prompt":"Sampel manakah mengalami peratus kehilangan jisim paling BANYAK dan paling SEDIKIT selepas 24 jam?","options":["Paling banyak: Sampel C (semua stoma terbuka); Paling sedikit: Sampel A (semua stoma atas dan bawah tertutup jeli petroleum)","Paling banyak: Sampel A; Paling sedikit: Sampel C","Paling banyak: Sampel B; Paling sedikit: Sampel C","Ketiga-tiga sampel kehilangan jisim yang sama kerana jeli petroleum meresap masuk ke xilem"],"correctIndex":0,"proofLabId":"bio52_potometer_sim","proofState":{"light":80,"temp":30,"wind":60,"hum":40},"explanation":"Sampel C tidak disapu jeli petroleum jadi semua stoma di epidermis atas dan bawah membebaskan wap air (kehilangan jisim tertinggi). Sampel A tertutup kedua-dua permukaan sehingga transpirasi melalui stoma terhalang sepenuhnya."},{"type":"sort","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Tindak Balas & Faktor Fotosintesis","voiceCaption":"Asingkan enam komponen dan proses berikut antara Tindak Balas Bersandarkan Cahaya dengan Tindak Balas Tidak Bersandarkan Cahaya.","voiceScript":"[confident] Pusingan ketiga Boss! Asingkan keenam-enam komponen ini antara peringkat bersandarkan cahaya di tilakoid dengan peringkat tidak bersandarkan cahaya di stroma.","prompt":"Isihkan bahan, lokasi dan proses berikut mengikut peringkat fotosintesis yang betul:","buckets":[{"id":"light","label":"Tindak Balas Bersandarkan Cahaya"},{"id":"dark","label":"Tindak Balas Tidak Bersandarkan Cahaya"}],"items":[{"text":"Berlaku di membran tilakoid / granum kloroplas","bucketId":"light","note":"Tepat! Pigmen klorofil berada di membran tilakoid."},{"text":"Berlaku di dalam bendalir stroma kloroplas","bucketId":"dark","note":"Betul! Stroma mengandungi enzim penurunan CO2."},{"text":"Pengujaan elektron klorofil dan fotolisis molekul air","bucketId":"light","note":"Tepat! Menghasilkan ion H+, ATP, NADPH dan membebaskan O2."},{"text":"Penurunan gas karbon dioksida oleh NADPH menggunakan tenaga ATP","bucketId":"dark","note":"Betul! Membentuk glukosa di dalam stroma."},{"text":"Pembentukan gas oksigen daripada ion hidroksida","bucketId":"light","note":"Tepat! Gas oksigen dibebaskan sebagai hasil sampingan."},{"text":"Penghasilan molekul glukosa tanpa memerlukan cahaya secara langsung","bucketId":"dark","note":"Betul! Bergantung pada bekalan ATP dan NADPH."}],"explanation":"Tilakoid menjana ATP, NADPH dan gas O2 daripada air dan cahaya, lalu stroma menggunakan ATP serta NADPH untuk menurunkan CO2 menjadi glukosa."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Aplikasi Rumah Hijau & LED","voiceCaption":"Pilih kombinasi warna cahaya LED dan kawalan persekitaran terbaik untuk memaksimumkan fotosintesis tanaman di rumah hijau.","voiceScript":"[excited] Soalan KBAT Praktis Sumatif dua! Seorang petani menanam anggur di rumah hijau tanah rendah dan mahu memaksimumkan kadar fotosintesis. Gabungan faktor manakah yang paling tepat?","prompt":"Untuk memaksimumkan kadar fotosintesis tanaman di dalam rumah hijau terkawal, apakah gabungan pencahayaan dan faktor persekitaran yang PALING sesuai?","options":["Lampu LED cahaya merah dan biru, kepekatan CO2 diperkaya serta suhu dikekalkan antara 25°C hingga 30°C","Lampu LED cahaya hijau tulen, suhu 55°C dan kelembapan udara seratus peratus tanpa pengudaraan","Lampu putih malap di bawah titik pampasan dengan kepekatan CO2 sifar","Penutupan semua stoma menggunakan semburan berlilin pada permukaan bawah daun"],"correctIndex":0,"explanation":"Klorofil dan karotenoid menyerap cahaya merah serta biru dengan paling cekap, suhu 25–30°C ialah julat optimum enzim fotosintesis dan pengayaan CO2 mengelakkan CO2 menjadi faktor pengehad."},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss 5: Huraian Akuarium & Oksigen","voiceCaption":"Susun jawapan KBAT menerangkan mengapa ikan di dalam akuarium dengan tumbuhan plastik mati apabila pam udara terputus, dan bagaimana tumbuhan hidup mengatasinya.","voiceScript":"[confident] Susun jawapan esei pendek ini mengenai akuarium Aizat dalam Praktis Sumatif dua! Jelaskan mengapa tumbuhan akuatik hidup dapat menyelamatkan ikan berbanding tumbuhan plastik.","prompt":"Susun huraian penyelesaian masalah ikan mati dalam akuarium tanpa elektrik:","hint":"Gantikan tumbuhan plastik dengan tumbuhan akuatik hidup di tempat bercahaya...","answerTokens":["Gantikan tumbuhan plastik dengan tumbuhan akuatik hidup seperti Hydrilla sp.","dan letakkan akuarium di kawasan bercahaya melebihi titik pampasan","supaya tumbuhan menjalankan fotosintesis serta membebaskan gas oksigen terlarut untuk respirasi ikan","sambil menyerap gas karbon dioksida yang dibebaskan oleh ikan"],"distractors":["supaya tumbuhan menjalankan transpirasi dan mengurangkan keupayaan air ikan","dan menutup akuarium dengan kain hitam supaya nilai Rf meningkat"],"explanation":"Pada keamatan cahaya melebihi titik pampasan, tumbuhan akuatik hidup membebaskan lebihan oksigen hasil fotolisis air untuk kegunaan respirasi ikan sambil menyerap karbon dioksida."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Sintesis Penuh Bab 2","voiceCaption":"Pilih pernyataan yang betul kesemuanya merangkumi struktur daun, stoma, transpirasi, kloroplas dan titik pampasan.","voiceScript":"[excited] Soalan terakhir Cabaran Boss Bab dua! Pilih jawapan yang seratus peratus tepat untuk melengkapkan koleksi trofi Bab dua kamu!","prompt":"Antara kombinasi fakta berikut bagi Bab 2, manakah yang BETUL kesemuanya?","options":["Mesofil berspan beruang udara | Stoma terbuka bila sel pengawal segah | Kadar transpirasi naik bila kelembapan rendah | Titik pampasan: fotosintesis = respirasi","Epidermis atas berkloroplas padat | Stoma terbuka bila ion K+ keluar | Potometer ukur kadar fotosintesis | Cahaya hijau diserap paling tinggi","Kutikel menghalang cahaya masuk | Dinding luar sel pengawal paling tebal | NaHCO3 bekal gas oksigen | Stroma tapak fotolisis air","Petiol adalah bahagian leper daun | Air tersejat paling banyak di kutikel | Suhu 65°C optimum untuk enzim | Respirasi ialah proses anabolisme"],"correctIndex":0,"explanation":"Syabas! Mesofil berspan mempunyai ruang udara untuk resapan gas, sel pengawal segah membuka stoma, kelembapan relatif rendah meningkatkan transpirasi dan titik pampasan berlaku apabila kadar fotosintesis menyamai respirasi."}]}]};</script>

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {

    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,

    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
