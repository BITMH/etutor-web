  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab03","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":3,"title":"Nutrisi dalam Tumbuhan","subtitle":"Subtopik 3.1–3.3 KSSM — 9 Makronutrien & 8 Mikronutrien (Fungsi & Kesan Kekurangan), Larutan Kultur Knop (1859) & Eksperimen N:P:K, Struktur Luar/Dalaman Akar + Jalur Casparian serta Kepelbagaian Nutrisi (Parasit, Epifit & Karnivor).","estimatedMinutes":32,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab03-labs.js","coverIcon":"../assets/icons/bio53-u1.jpg","editionBadge":"Edisi Simulasi Interaktif & Makmal KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan nutrisi tumbuhan dan fungsi mineral kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Semua simptom kekurangan nutrien, larutan Knop dan struktur akar berjaya kamu selesaikan!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula fungsi nitrogen, fosforus, kalium atau peranan jalur Casparian di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab tiga berjaya kamu takluki sepenuhnya!"},"units":[{"id":"bio53-u1","title":"Unit 1: Makronutrien & Mikronutrien Tak Organik Utama","subtitle":"Subtopik 3.1 — 9 Makronutrien (C, H, O, N, K, Ca, Mg, P, S) & 8 Mikronutrien (Cl, Fe, Mn, B, Zn, Cu, Ni, Mo) serta Kesan Kekurangan","iconType":"atom","iconUrl":"../assets/icons/bio53-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"9 Makronutrien & Kesan Kekurangan","voiceCaption":"Tumbuhan memerlukan sembilan makronutrien termasuk karbon, hidrogen, oksigen, nitrogen, kalium, kalsium, magnesium, fosforus dan sulfur dalam kuantiti besar.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab tiga: Nutrisi dalam Tumbuhan! Pada subtopik tiga perpuluhan satu, nutrien tak organik yang diperlukan untuk membina karbohidrat dan protein dibahagikan kepada makronutrien dan mikronutrien. Sembilan makronutrien ialah karbon, hidrogen, oksigen, nitrogen, kalium, kalsium, magnesium, fosforus dan sulfur. Karbon, hidrogen dan oksigen diperoleh daripada udara serta air dan membentuk sebahagian besar jisim kering tumbuhan! Nitrogen dan magnesium penting untuk membentuk klorofil; kekurangannya menyebabkan klorosis iaitu daun menguning! Kalium menjaga kesegahan dan sisi daun menjadi kuning jika kurang; kalsium membina lamela tengah dinding sel serta gentian gelendong; fosforus membina A T P, asid nukleik dan fosfolipid; manakala sulfur membina asid amino dan vitamin B!","title":"3.1 Sembilan Makronutrien: Fungsi & Kesan Kekurangan (Jadual 3.1)","acronym":"C•H•O•N•P•K","hook":"Klik unsur N, P, K, Mg, Fe dan B pada Klinik Diagnostik Daun di bawah untuk melihat simptom kekurangannya!","mediaKey":"bio53_klorosis_daun","summary":"9 Makronutrien (C, H, O, N, K, Ca, Mg, P, S) diperlukan dalam kuantiti banyak untuk pertumbuhan optimum, klorofil, ATP, dinding sel dan sintesis protein.","bullets":["C, H, O & N, Mg, S: C, H dan O diperoleh daripada udara dan air untuk sintesis gula. N dan Mg membentuk molekul klorofil (kekurangan N menyebabkan klorosis daun matang dan daun bawah gugur; kekurangan Mg menyebabkan kuning antara urat daun matang serta bintik merah). S membentuk asid amino dan vitamin B (keseluruhan daun/tumbuhan menguning jika kurang).","K, Ca & P: Kalium (K) ialah kofaktor enzim, sintesis protein dan kesegahan (kurang -> sisi daun kuning, mati pramatang). Kalsium (Ca) membina lamela tengah, dinding sel dan gentian gelendong mitosis (kurang -> daun terherot dan bercuping). Fosforus (P) membina asid nukleik, ATP dan fosfolipid membran (kurang -> akar tidak sihat, daun hijau tua pudar dan bintik merah atau ungu pada daun tua)."],"labId":"bio53_nutrien_diagnostik_lab","labTitle":"Klinik Diagnostik Kekurangan Nutrien Daun","labProps":{"nut":"N"},"examTip":"Skema S.P.M.: Nyatakan 3 nutrien utama yang kekurangannya mencetuskan klorosis (penguningan daun) = Nitrogen (N), Magnesium (Mg) dan Ferum (Fe) [atau Sulfur (S) / Molibdenum (Mo)]."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Makronutrien vs Mikronutrien","voiceCaption":"Kelaskan enam unsur tak organik berikut antara kumpulan Makronutrien dengan kumpulan Mikronutrien mengikut Rajah tiga perpuluhan dua.","voiceScript":"[confident] Uji ingatan kamu tentang Rajah tiga perpuluhan dua! Asingkan keenam-enam unsur mineral ini kepada Makronutrien atau Mikronutrien.","prompt":"Isihkan unsur tak organik berikut kepada kategori Makronutrien atau Mikronutrien:","buckets":[{"id":"makro","label":"Makronutrien (Kuantiti Banyak)"},{"id":"mikro","label":"Mikronutrien (Kuantiti Sedikit)"}],"items":[{"text":"Nitrogen (N), Fosforus (P) dan Kalium (K)","bucketId":"makro","note":"Tepat! Unsur teras dalam baja NPK."},{"text":"Kalsium (Ca), Magnesium (Mg) dan Sulfur (S)","bucketId":"makro","note":"Betul! Diperlukan dalam kuantiti besar oleh tumbuhan."},{"text":"Klorin (Cl), Ferum (Fe) dan Mangan (Mn)","bucketId":"mikro","note":"Tepat! Diperlukan dalam kuantiti surih."},{"text":"Boron (B), Zink (Zn) dan Kuprum (Cu)","bucketId":"mikro","note":"Betul! Mikronutrien penting untuk auksin, debunga dan enzim."},{"text":"Nikel (Ni) dan Molibdenum (Mo)","bucketId":"mikro","note":"Tepat! Penting dalam metabolisme urea dan pengikatan nitrogen."},{"text":"Karbon (C), Hidrogen (H) dan Oksigen (O)","bucketId":"makro","note":"Betul! Membentuk sebahagian besar jisim kering tumbuhan."}],"explanation":"9 Makronutrien: C, H, O, N, K, Ca, Mg, P, S. 8 Mikronutrien: Cl, Fe, Mn, B, Zn, Cu, Ni, Mo."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"8 Mikronutrien & Simptom Khusus","voiceCaption":"Lapan mikronutrien iaitu klorin, ferum, mangan, boron, zink, kuprum, nikel dan molibdenum memainkan peranan khusus walaupun dalam kuantiti kecil.","voiceScript":"[warm] Sekarang kenali lapan mikronutrien dalam Jadual tiga perpuluhan dua! Klorin menjaga keseimbangan tekanan osmosis sel; kekurangannya membuat tumbuhan layu. Ferum menjadi kofaktor sintesis klorofil agar daun muda tidak menguning. Mangan mengaktifkan enzim fotosintesis dan metabolisme nitrogen. Boron membantu pengambilan kalsium, translokasi sukrosa dan percambahan debunga; tanpa boron, tunas terminal mati serta daun menjadi tebal dan rapuh! Zink mensintesis hormon auksin; kuprum membantu pembentukan bunga dan pembiakan; nikel menguraikan urea kepada ammonia supaya hujung daun tidak terbakar akibat pengumpulan urea; dan molibdenum terlibat dalam pengikatan nitrogen serta penurunan nitrat!","title":"Jadual 3.2: Fungsi & Kesan Kekurangan 8 Mikronutrien","acronym":"C•F•M•B•Z•C•N•M","hook":"Perhatikan perbezaan simptom unik antara kekurangan Boron, Nikel, Ferum dan Fosforus!","summary":"8 Mikronutrien (Cl, Fe, Mn, B, Zn, Cu, Ni, Mo) bertindak sebagai kofaktor enzim, sintesis auksin (Zn), penguraian urea (Ni), pengikatan N2 (Mo) dan percambahan debunga (B).","bullets":["Cl, Fe, Mn & B: Klorin (Cl) untuk keseimbangan tekanan osmosis dan fotosintesis (kurang -> layu). Ferum (Fe) ialah kofaktor sintesis klorofil (kurang -> daun muda kuning). Mangan (Mn) mengaktifkan enzim fotosintesis & metabolisme N. Boron (B) membantu pengambilan Ca, translokasi sukrosa dan percambahan debunga (kurang -> tunas terminal mati; daun tebal, bergulung & rapuh).","Zn, Cu, Ni & Mo: Zink (Zn) mensintesis auksin (kurang -> daun berbintik berklorosis). Kuprum (Cu) penting untuk pembentukan bunga (kurang -> apeks pucuk muda mati). Nikel (Ni) menguraikan urea kepada ammonia (kurang -> hujung daun terbakar akibat pengumpulan urea). Molibdenum (Mo) terlibat dalam pengikatan nitrogen dan penurunan nitrat."],"labId":"bio53_nutrien_diagnostik_lab","labTitle":"Banding Simptom Kekurangan Fe, B dan P","labProps":{"nut":"B"},"examTip":"Petua soalan objektif: Boron -> kematian tunas terminal + percambahan debunga; Zink -> mensintesis auksin; Nikel -> menguraikan urea (hujung daun terbakar jika kurang); Molibdenum -> pengikatan nitrogen."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Mineral & Simptom Kekurangan","voiceCaption":"Padankan lima unsur makro dan mikro berikut dengan kesan kekurangan spesifiknya pada tumbuhan.","voiceScript":"[confident] Uji ketepatan kamu memadankan unsur mineral dengan simptom kekurangannya dalam Jadual tiga perpuluhan satu dan tiga perpuluhan dua!","prompt":"Padankan unsur mineral berikut dengan kesan kekurangannya yang paling tepat:","pairs":[{"id":"b53u1m1","left":"Fosforus (P)","right":"Pertumbuhan akar tidak sihat serta bintik merah atau ungu pada daun tua"},{"id":"b53u1m2","left":"Kalium (K)","right":"Sisi daun berwarna kuning, sintesis protein terjejas dan kematian pramatang"},{"id":"b53u1m3","left":"Boron (B)","right":"Kematian tunas terminal serta daun menjadi tebal, bergulung dan rapuh"},{"id":"b53u1m4","left":"Nikel (Ni)","right":"Kesan terbakar pada hujung daun akibat pengumpulan urea"},{"id":"b53u1m5","left":"Zink (Zn)","right":"Sintesis hormon pertumbuhan auksin terjejas dan permukaan daun berbintik"}],"explanation":"Setiap unsur mempunyai tanda diagnostik tersendiri: P (bintik merah/ungu), K (sisi daun kuning), B (tunas terminal mati), Ni (hujung daun terbakar oleh urea) dan Zn (sintesis auksin)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Kesan Baja NPK Tidak Seimbang","voiceCaption":"Ramalkan punca mengapa pokok cili menunjukkan daun berwarna hijau gelap pudar dan batang lemah serta akar terbantut.","voiceScript":"[curious] Soalan Praktis Sumatif tiga! Seorang petani mendapati daun pokok cilinya bertukar hijau gelap pudar dan batangnya lemah selepas pembajaan tidak seimbang. Unsur makronutrien apakah yang kemungkinan besar kurang atau berlebihan?","hook":"Periksa simptom kekurangan Fosforus (P) dan peranan Nitrogen dalam Klinik Diagnostik Daun!","scenario":"Pokok cili di kebun seorang petani menunjukkan daun hijau tua yang pudar, bintik keunguan pada daun tua dan pertumbuhan akar yang lemah.","prompt":"Kekurangan unsur makronutrien manakah yang menyebabkan simptom tersebut?","options":["Fosforus (P) kerana ia diperlukan untuk pertumbuhan akar yang sihat, sintesis ATP, asid nukleik dan fosfolipid","Klorin (Cl) kerana ia menghasilkan warna ungu pada bunga","Karbon (C) kerana udara di kebun tidak mengandungi karbon dioksida","Nikel (Ni) kerana baja NPK tiada kalsium"],"correctIndex":0,"proofLabId":"bio53_nutrien_diagnostik_lab","proofState":{"nut":"P"},"explanation":"Mengikut Jadual 3.1, kekurangan Fosforus (P) menyebabkan pertumbuhan akar tidak sihat, pembentukan daun hijau tua yang pudar serta kemunculan bintik merah atau ungu pada daun tua."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Peranan Baja NPK","voiceCaption":"Susun blok fakta menerangkan bagaimana gabungan unsur nitrogen, fosforus dan kalium merangsang pertumbuhan sihat pokok jagung.","voiceScript":"[confident] Susun blok jawapan berikut bagi menjelaskan fungsi gabungan nitrogen, fosforus dan kalium dalam baja N P K!","prompt":"Susun peranan gabungan unsur baja NPK terhadap pertumbuhan sihat pokok jagung:","hint":"Nyatakan fungsi N (klorofil/protein), P (ATP/akar) dan K (kesegahan/enzim)...","answerTokens":["Nitrogen membentuk klorofil dan protein untuk daun hijau serta pertumbuhan","Fosforus mensintesis asid nukleik dan ATP bagi pertumbuhan akar yang sihat","manakala Kalium bertindak sebagai kofaktor enzim dan mengekalkan kesegahan tumbuhan","supaya pokok jagung membesar subur dengan hasil berkualiti"],"distractors":["manakala Kalsium menguraikan urea kepada ammonia pada hujung daun","dan Boron menggantikan klorofil dalam tindak balas cahaya"],"explanation":"N (klorofil, protein, asid nukleik), P (ATP, asid nukleik, fosfolipid, akar sihat) dan K (sintesis protein, metabolisme karbohidrat, kofaktor enzim, kesegahan)."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Unit 1: Subtopik 3.1","voiceCaption":"Pilih pernyataan yang tepat mengenai peranan kalsium dan magnesium dalam sel tumbuhan.","voiceScript":"[excited] Soalan penutup Unit satu! Pilih padanan fungsi tepat bagi unsur kalsium dan magnesium.","prompt":"Antara berikut, manakah padanan fungsi yang BETUL bagi Kalsium (Ca) dan Magnesium (Mg)?","options":["Kalsium: komponen utama lamela tengah, dinding sel dan gentian gelendong | Magnesium: komponen utama molekul klorofil","Kalsium: menguraikan urea kepada ammonia | Magnesium: membentuk hormon auksin","Kalsium: komponen fosfolipid membran plasma | Magnesium: membina dinding sel berlignin","Kalsium: hanya diperlukan dalam kuantiti surih | Magnesium: menghalang percambahan debunga"],"correctIndex":0,"explanation":"Kalsium (Ca) membentuk lamela tengah, dinding sel dan gentian gelendong semasa pembahagian sel; Magnesium (Mg) merupakan komponen teras struktur molekul klorofil dan pengaktif enzim."}]},{"id":"bio53-u2","title":"Unit 2: Larutan Kultur Knop & Eksperimen N:P:K","subtitle":"Subtopik 3.1 — Komposisi Larutan Kultur Lengkap Knop (1859), Penggantian Garam Mineral (Botol A–E) & Langkah Berjaga-jaga","iconType":"formula","iconUrl":"../assets/icons/bio53-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Larutan Kultur Lengkap Knop","voiceCaption":"Larutan kultur lengkap Knop mengandungi kalsium nitrat, kalium nitrat, kalium dihidrogen fosfat, magnesium sulfat, ferum tiga fosfat surih dan air suling.","voiceScript":"[warm] Selamat datang ke Unit dua! Untuk mengkaji kepentingan nutrien tumbuhan, Wilhelm Knop pada tahun seribu lapan ratus lima puluh sembilan merumuskan larutan kultur lengkap Knop dalam seribu sentimeter padu air suling! Lima garam mineral utamanya ialah sifar perpuluhan lapan gram kalsium nitrat, sifar perpuluhan dua gram kalium nitrat, sifar perpuluhan dua gram kalium dihidrogen fosfat, sifar perpuluhan dua gram magnesium sulfat dan sedikit ferum tiga fosfat sebagai unsur surih. Dalam Eksperimen tiga perpuluhan satu mengkaji nisbah N, P dan K terhadap anak benih jagung, terdapat lima botol iaitu Botol A larutan lengkap, Botol B kawalan air suling, Botol C tanpa nitrogen, Botol D tanpa fosforus dan Botol E tanpa kalium!","title":"Larutan Kultur Knop (1859) & Reka Bentuk Botol A–E","acronym":"C•K•K•M•F","hook":"Klik setiap botol A hingga E pada Simulator Kultur Knop di bawah untuk melihat penggantian garam mineral dan tumbesaran jagung!","summary":"Larutan kultur Knop membekalkan semua makronutrien dan unsur surih; ujian kekurangan unsur tertentu dibuat dengan menggantikan sebatian menggunakan garam gantian bebas unsur sasaran.","bullets":["Komposisi Larutan Knop (per 1000 cm3 air suling): Kalsium nitrat Ca(NO3)2 (0.8 g), Kalium nitrat KNO3 (0.2 g), Kalium dihidrogen fosfat KH2PO4 (0.2 g), Magnesium sulfat MgSO4 (0.2 g) dan Ferum(III) fosfat FePO4 (surih).","Penggantian Garam Mineral (Jadual 3.4): Botol C (tanpa N) menggantikan Ca(NO3)2 & KNO3 dengan CaCl2 & KCl. Botol D (tanpa P) menggantikan KH2PO4 & FePO4 dengan KCl & Fe2O3. Botol E (tanpa K) menggantikan KNO3 & KH2PO4 dengan NaNO3 & Ca3(PO4)2."],"labId":"bio53_knop_eksperimen_sim","labTitle":"Simulator Eksperimen Larutan Kultur Knop (Botol A–E)","labProps":{"bottle":"A"},"examTip":"Mengapakah dalam Botol C (tanpa N), Ca(NO3)2 dan KNO3 diganti dengan CaCl2 dan KCl? Kerana untuk memastikan ion Ca2+ dan K+ masih dibekalkan supaya hanya unsur Nitrogen (N) yang tiada!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kesan Tanpa Pam Udara & Kertas Hitam","voiceCaption":"Ramalkan apa yang akan berlaku jika botol kultur tidak dibalut dengan kertas hitam dan tidak disambungkan kepada pam udara.","voiceScript":"[curious] Dalam Eksperimen tiga perpuluhan satu, kesemua botol kultur mesti dibalut kertas hitam dan disambungkan ke pam udara! Ramalkan kesannya jika kedua-dua langkah berjaga-jaga ini diabaikan!","hook":"Periksa langkah berjaga-jaga Eksperimen 3.1 pada Simulator Kultur Knop selepas menjawab!","scenario":"Seorang murid menjalankan eksperimen larutan kultur Knop menggunakan botol kaca lut sinar tanpa membalut kertas hitam dan tanpa memasang pam udara.","prompt":"Apakah dua masalah utama yang akan mengganggu keputusan eksperimen tersebut?","options":["Cahaya menggalakkan pertumbuhan alga hijau yang bersaing menyerap nutrien, manakala ketiadaan pam udara menyebabkan akar kekurangan oksigen untuk respirasi sel","Kertas hitam membekalkan nitrogen kepada daun, manakala pam udara menambah klorofil","Botol lut sinar menyejatkan ferum(III) fosfat menjadi gas oksigen","Alga hijau akan membunuh semua unsur surih sebelum minggu pertama"],"correctIndex":0,"proofLabId":"bio53_knop_eksperimen_sim","proofState":{"bottle":"C"},"explanation":"Kertas hitam menghalang cahaya menembusi larutan supaya alga hijau tidak membiak dan bersaing merebut nutrien; pam udara membekalkan oksigen kepada akar untuk respirasi sel bagi pengangkutan aktif mineral."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Penggantian Garam Jadual 3.4","voiceCaption":"Padankan lima botol kultur dan garam gantian daripada Jadual tiga perpuluhan empat dengan tujuan atau pemerhatiannya.","voiceScript":"[confident] Uji ketelitian kimia biologi kamu tentang Jadual tiga perpuluhan empat! Padankan kelima-lima item larutan kultur Knop berikut.","prompt":"Padankan botol kultur dan prosedur Knop berikut dengan huraian tepatnya:","pairs":[{"id":"b53u2m1","left":"Botol A (Larutan kultur lengkap Knop)","right":"Anak benih jagung membesar sihat, tinggi, berdaun hijau dan berakar panjang"},{"id":"b53u2m2","left":"Botol C (CaCl2 + KCl menggantikan nitrat)","right":"Tanpa nitrogen -> daun mengalami klorosis dan pertumbuhan terbantut"},{"id":"b53u2m3","left":"Botol D (KCl + Fe2O3 menggantikan fosfat)","right":"Tanpa fosforus -> akar lemah dan bintik merah/ungu pada daun tua"},{"id":"b53u2m4","left":"Botol E (NaNO3 + Ca3(PO4)2)","right":"Tanpa kalium -> sisi daun kuning dan kematian pramatang"},{"id":"b53u2m5","left":"Ganti larutan kultur setiap minggu","right":"Mengekalkan kepekatan nutrien yang mencukupi dan mengelakkan pencemaran"}],"explanation":"Penggantian garam yang tepat memastikan hanya satu unsur (N, P atau K) disingkirkan sementara ion lain seperti Ca2+, K+ atau Fe3+ kekal hadir."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Komponen Asal vs Gantian Knop","voiceCaption":"Kelaskan enam garam mineral berikut antara Komponen Asal Larutan Kultur Lengkap Knop dengan Garam Gantian Ujian Kekurangan.","voiceScript":"[confident] Asingkan keenam-enam bahan kimia ini kepada Komponen Asal Larutan Knop atau Garam Gantian Ujian Kekurangan!","prompt":"Isihkan bahan kimia berikut mengikut peranannya dalam Eksperimen 3.1:","buckets":[{"id":"asal","label":"Komponen Asal Larutan Knop"},{"id":"ganti","label":"Garam Gantian (Ujian Kekurangan)"}],"items":[{"text":"Kalsium nitrat Ca(NO3)2 dan Kalium nitrat KNO3","bucketId":"asal","note":"Tepat! Membekalkan kalsium, kalium dan nitrogen dalam larutan lengkap."},{"text":"Kalium dihidrogen fosfat KH2PO4 dan Magnesium sulfat MgSO4","bucketId":"asal","note":"Betul! Membekalkan fosforus, kalium, magnesium dan sulfur."},{"text":"Kalsium klorida (CaCl2) dan Kalium klorida (KCl)","bucketId":"ganti","note":"Tepat! Digunakan apabila menyingkirkan nitrogen atau fosforus."},{"text":"Ferum(II)/(III) oksida menggantikan Ferum(III) fosfat","bucketId":"ganti","note":"Betul! Digunakan dalam Botol D (tanpa fosforus)."},{"text":"Natrium nitrat (NaNO3) dan Kalsium fosfat Ca3(PO4)2","bucketId":"ganti","note":"Tepat! Digunakan dalam Botol E (tanpa kalium)."},{"text":"Ferum(III) fosfat FePO4 (kuantiti surih)","bucketId":"asal","note":"Betul! Membekalkan unsur surih ferum dan fosfat."}],"explanation":"5 garam asal Knop: Ca(NO3)2, KNO3, KH2PO4, MgSO4 dan FePO4. Garam gantian pula ialah CaCl2, KCl, oksida ferum, NaNO3 dan Ca3(PO4)2."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Susun Tujuan Kertas Hitam & Pam Udara","voiceCaption":"Susun blok fakta menerangkan dua langkah berjaga-jaga utama semasa menyediakan radas larutan kultur Knop.","voiceScript":"[confident] Susun blok jawapan berikut bagi menerangkan dua langkah berjaga-jaga wajib dalam Eksperimen tiga perpuluhan satu!","prompt":"Susun penerangan langkah berjaga-jaga membalut botol dengan kertas hitam dan memasang pam udara:","hint":"Kertas hitam -> alga hijau; pam udara -> oksigen -> respirasi akar...","answerTokens":["Botol kultur dibalut dengan kertas hitam bagi menghalang cahaya","untuk mengelakkan pertumbuhan alga hijau yang bersaing menyerap nutrien","manakala pam udara membekalkan gas oksigen berterusan kepada akar","bagi respirasi sel untuk pengangkutan aktif garam mineral"],"distractors":["supaya cahaya matahari menukar kalium nitrat menjadi kalsium klorida","untuk memastikan stoma pada daun kekal tertutup sepanjang empat minggu"],"explanation":"Kertas hitam menghalang pertumbuhan alga (elak persaingan nutrien) dan pam udara membekalkan O2 kepada sel akar untuk menjana ATP bagi pengangkutan aktif ion mineral."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s6","voiceToneLabel":"Cabaran Unit 2: Penggantian Knop","voiceCaption":"Pilih pasangan garam gantian yang tepat untuk menyediakan larutan kultur tanpa kalium bagi menguji kesan kekurangan kalium.","voiceScript":"[excited] Soalan penutup Unit dua! Jika seorang murid mahu menguji kesan kekurangan kalium dalam larutan Knop, sebatian manakah yang mesti digunakan sebagai gantian?","prompt":"Untuk menyediakan larutan kultur tanpa Kalium (Botol E), KNO3 dan KH2PO4 dalam larutan Knop perlu digantikan dengan:","options":["Natrium nitrat (NaNO3) dan Kalsium fosfat (Ca3(PO4)2)","Kalium klorida (KCl) dan Kalsium klorida (CaCl2)","Magnesium sulfat (MgSO4) dan Air suling sahaja","Kalsium nitrat (Ca(NO3)2) dan Ferum(III) fosfat (FePO4)"],"correctIndex":0,"explanation":"Dengan menggantikan KNO3 dengan NaNO3 dan KH2PO4 dengan Ca3(PO4)2, ion nitrat dan fosfat masih dibekalkan manakala ion kalium (K+) disingkirkan sepenuhnya."}]},{"id":"bio53-u3","title":"Unit 3: Organ Pengambilan Air & Mineral — Struktur Akar","subtitle":"Subtopik 3.2 — Struktur Luar (Pangkal, Rambut & Jidal Akar) serta Struktur Dalaman (Epidermis, Korteks, Endodermis + Jalur Casparian & Silinder Vaskular)","iconType":"map","iconUrl":"../assets/icons/bio53-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Struktur Luar & Dalaman Akar","voiceCaption":"Akar berfungsi menyokong tumbuhan serta menyerap air dan mineral melalui rambut akar, epidermis tanpa kutikel, korteks, endodermis berjalur Casparian dan silinder vaskular.","voiceScript":"[warm] Selamat datang ke Unit tiga: Organ Pengambilan Air dan Garam Mineral! Akar menjalankan dua fungsi utama iaitu mengukuhkan kedudukan tumbuhan di tanah serta menyerap air dan garam mineral untuk diangkut ke batang dan daun. Dari luar, akar mempunyai pangkal akar, rambut akar daripada sel epidermis untuk menambah jumlah luas permukaan penyerapan, serta jidal akar pelindung di hujung akar. Di bahagian dalam pula, sel epidermis dan rambut akar tidak dilapisi kutikel dan mempunyai vakuol besar agar penyerapan air pantas! Di bawahnya ialah korteks sel parenkima longgar untuk pertukaran gas; diikuti endodermis satu lapis dengan penebalan suberin atau lignin yang membentuk jalur Casparian bagi membenarkan air dan mineral masuk ke silinder vaskular sambil menghalang gelembung udara! Terasnya iaitu silinder vaskular mengandungi perisikel serta xilem dan floem berbentuk bintang pada akar eudikot!","title":"3.2 Struktur Luar & Dalaman Akar serta Jalur Casparian","acronym":"E•K•E•S","hook":"Klik setiap lapisan pada keratan rentas akar di bawah untuk melihat peranan epidermis tanpa kutikel hingga jalur Casparian!","mediaKey":"bio53_rambut_akar","videoClip":{"src":"../assets/biologi-t5-bab03/video/bio53_video_nutrisi_akar_narasi.mp4","hasNarration":true,"posterKey":"bio53_rambut_akar","caption":"Kepentingan makronutrien NPK serta laluan pengambilan air dan ion mineral oleh sel rambut akar."},"summary":"Akar mempunyai rambut akar tanpa kutikel & bervakuol besar, korteks longgar, endodermis berjalur Casparian (suberin/lignin) dan silinder vaskular (perisikel, xilem, floem).","bullets":["Struktur Luar Akar (Jadual 3.5): Pangkal akar (sambung dengan pangkal batang), Rambut akar (adaptasi sel epidermis menambah luas permukaan penyerapan air & mineral), dan Jidal akar (melindungi hujung akar semasa menembusi tanah).","Epidermis & Korteks (Jadual 3.6): Epidermis rapat berdinding nipis dengan membran telap air; sel rambut akar TIADA kutikel dan mempunyai vakuol besar menyimpan air serta garam mineral agar penyerapan berlaku pantas. Korteks terdiri daripada sel parenkima berdinding nipis yang tersusun longgar untuk pertukaran gas.","Endodermis & Silinder Vaskular: Endodermis memisahkan korteks dan silinder vaskular dengan penebalan suberin atau lignin membentuk jalur Casparian (hanya benarkan air dan garam mineral masuk, bukan gelembung udara). Silinder vaskular terdiri daripada xilem & floem (corak bintang dalam eudikot) dikelilingi sel perisikel (pertumbuhan sekunder & cabang akar)."],"labId":"bio53_struktur_akar_lab","labTitle":"Peta Lapisan Keratan Rentas Akar (Jadual 3.6)","labProps":{"part":"endodermis"},"examTip":"Skema Kertas 2: Berikan 3 adaptasi sel rambut akar: (1) Tiada lapisan kutikel, (2) Dinding sel nipis & pemanjangan sisi menambah luas permukaan, (3) Vakuol besar dengan sap sel berkepekatan mineral tinggi."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Ciri 4 Lapisan Dalaman Akar","voiceCaption":"Kelaskan enam ciri struktur dalaman akar berikut antara Epidermis/Korteks dengan Endodermis/Silinder Vaskular.","voiceScript":"[confident] Uji penguasaan anatomi akar kamu! Asingkan keenam-enam ciri lapisan akar ini dengan tepat.","prompt":"Isihkan ciri struktur akar berikut mengikut kumpulannya yang betul:","buckets":[{"id":"luar","label":"Epidermis & Korteks"},{"id":"teras","label":"Endodermis & Silinder Vaskular"}],"items":[{"text":"Sel rambut akar tidak dilapisi kutikel dan mempunyai vakuol yang besar","bucketId":"luar","note":"Tepat! Membenarkan resapan air yang pantas ke dalam akar."},{"text":"Sel parenkima berdinding nipis yang tersusun longgar untuk pertukaran gas","bucketId":"luar","note":"Betul! Ciri lapisan korteks di bawah epidermis."},{"text":"Penebalan suberin atau lignin membentuk jalur Casparian","bucketId":"teras","note":"Tepat! Menghalang gelembung udara masuk ke silinder vaskular."},{"text":"Lapisan perisikel setebal satu sel yang membentuk cabang akar","bucketId":"teras","note":"Betul! Mengelilingi tisu xilem dan floem."},{"text":"Susunan tisu xilem dan floem berbentuk bintang pada akar eudikot","bucketId":"teras","note":"Tepat! Terletak di pusat silinder vaskular."},{"text":"Pemanjangan ke arah lateral dinding luar sel membentuk rambut akar","bucketId":"luar","note":"Betul! Menambahkan jumlah luas permukaan penyerapan."}],"explanation":"Lapisan luar akar merangkumi epidermis (rambut akar tanpa kutikel) dan korteks parenkima, manakala bahagian teras merangkumi endodermis berjalur Casparian serta silinder vaskular (perisikel, xilem, floem)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Kesan Ketiadaan Jalur Casparian","voiceCaption":"Ramalkan apa yang mungkin berlaku terhadap pengangkutan air dalam xilem sekiranya lapisan endodermis tidak mempunyai jalur Casparian.","voiceScript":"[curious] Cuba ramalkan fungsi penting jalur Casparian pada lapisan endodermis akar! Apakah bahaya yang mengancam turus air di dalam xilem sekiranya jalur Casparian tidak wujud?","hook":"Periksa peranan jalur Casparian pada Makmal Struktur Akar selepas menjawab!","scenario":"Endodermis akar mengandungi penebalan suberin dan lignin yang membentuk jalur Casparian di antara korteks dengan silinder vaskular.","prompt":"Apakah peranan utama jalur Casparian yang melindungi pengangkutan air dalam silinder vaskular?","options":["Mengawal pergerakan air dan garam mineral masuk ke silinder vaskular serta menghalang gelembung udara memasuki xilem dan memutuskan turus air","Menghasilkan klorofil untuk menjalankan fotosintesis di bawah tanah","Melapisi rambut akar dengan lilin kutikel kalis air","Menukar semua sel korteks menjadi sel sklerenkima mati"],"correctIndex":0,"proofLabId":"bio53_struktur_akar_lab","proofState":{"part":"endodermis"},"explanation":"Penebalan suberin/lignin (jalur Casparian) memaksa air dan ion mineral melintasi membran plasma sel endodermis yang separa telap, sekali gus menapis serta menghalang gelembung udara daripada memasuki salur xilem."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Bahagian Akar & Adaptasi","voiceCaption":"Padankan lima bahagian luar dan dalam akar berikut dengan fungsinya yang tepat.","voiceScript":"[confident] Padankan kelima-lima struktur akar ini dengan peranan spesifiknya mengikut Jadual tiga perpuluhan lima dan tiga perpuluhan enam!","prompt":"Padankan setiap bahagian akar berikut dengan fungsinya:","pairs":[{"id":"b53u3m1","left":"Jidal akar","right":"Melindungi sel hujung akar daripada kerosakan mekanikal ketika menembusi tanah"},{"id":"b53u3m2","left":"Sel rambut akar","right":"Tiada kutikel dan bervakuol besar untuk menyerap air serta mineral dengan cepat"},{"id":"b53u3m3","left":"Korteks akar","right":"Sel parenkima berdinding nipis dan longgar untuk pertukaran gas dan laluan air"},{"id":"b53u3m4","left":"Endodermis","right":"Memisahkan korteks dengan silinder vaskular melalui jalur Casparian"},{"id":"b53u3m5","left":"Perisikel","right":"Lapisan setebal satu sel di silinder vaskular yang membentuk cabang akar"}],"explanation":"Jidal akar melindungi hujung akar, rambut akar menyerap air/mineral tanpa kutikel, korteks memudahkan pertukaran gas, endodermis mengawal laluan ke xilem dan perisikel membentuk cabang akar."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Susun Adaptasi Epidermis Akar","voiceCaption":"Susun huraian lengkap bagaimana sel epidermis dan rambut akar disesuaikan untuk penyerapan air dan garam mineral.","voiceScript":"[confident] Soalan Praktis Formatif tiga perpuluhan dua! Susun blok pernyataan berikut untuk menerangkan adaptasi epidermis akar.","prompt":"Susun huraian lengkap adaptasi sel epidermis dan rambut akar untuk penyerapan optimum:","hint":"Gabungkan ciri ketiadaan kutikel, dinding nipis, pemanjangan sisi dan vakuol besar...","answerTokens":["Sel epidermis akar mempunyai dinding sel nipis dan membran telap air","serta membentuk rambut akar ke arah lateral untuk menambah luas permukaan penyerapan","di mana rambut akar tidak dilapisi kutikel agar air mudah masuk","dan memiliki vakuol besar untuk menyimpan air serta garam mineral"],"distractors":["dan diselaputi lapisan suberin tebal supaya air tidak boleh meresap","serta mempunyai banyak kloroplas bagi membentuk glukosa"],"explanation":"Berbeza dengan epidermis daun yang berkutikel kalis air, epidermis rambut akar tiada kutikel, berdinding nipis, memanjang ke sisi (luas permukaan tinggi) dan bervakuol besar."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s6","voiceToneLabel":"Cabaran Unit 3: Eudikot vs Monokot","voiceCaption":"Pilih perbezaan susunan tisu vaskular antara keratan rentas akar pokok limau (eudikot) dengan pokok jagung (monokot).","voiceScript":"[excited] Soalan penutup Unit tiga daripada Aktiviti tiga perpuluhan satu! Bagaimanakah susunan xilem dan floem membezakan akar eudikot daripada akar monokot?","prompt":"Apakah perbezaan utama susunan tisu vaskular antara akar eudikot (contoh: pokok limau) dengan akar monokot (contoh: Zea mays / jagung)?","options":["Dalam akar eudikot, xilem tersusun berbentuk bintang di pusat dengan floem di celahnya; dalam akar monokot, xilem dan floem tersusun secara berselang-seli membentuk gelang mengelilingi empulur","Akar monokot tidak mempunyai endodermis dan jalur Casparian langsung","Akar eudikot tidak mempunyai korteks manakala akar monokot mempunyai tiga lapisan epidermis","Xilem dalam akar eudikot berada di luar korteks bersebelahan rambut akar"],"correctIndex":0,"explanation":"Kedua-dua akar eudikot dan monokot mempunyai epidermis, korteks, endodermis dan jalur Casparian, tetapi di dalam silinder vaskular, xilem eudikot berbentuk bintang di tengah manakala xilem dan floem monokot membentuk gelang mengelilingi empulur."}]},{"id":"bio53-u4","title":"Unit 4: Kepelbagaian Nutrisi — Parasit, Epifit & Karnivor","subtitle":"Subtopik 3.3 — Rafflesia & Cuscuta (Parasit), Paku Pakis Langsuir & Orkid (Epifit), Periuk Kera & Venus Flytrap (Karnivor) serta Riftia","iconType":"crown","iconUrl":"../assets/icons/bio53-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Parasit vs Epifit vs Karnivor","voiceCaption":"Tumbuhan mempunyai penyesuaian nutrisi berbeza termasuk parasit yang menyerap nutrien perumah, epifit yang menumpang untuk cahaya dan karnivor yang memerangkap serangga untuk nitrogen.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik tiga perpuluhan tiga: Kepelbagaian dalam Nutrisi Tumbuhan! Bukan semua tumbuhan memperoleh makanan dengan cara yang sama. Pertama, tumbuhan parasit seperti Rafflesia iaitu bunga pakma, tali puteri Cuscuta dan pokok dedalu: akarnya menembusi batang perumah sehingga ke berkas vaskular untuk menyerap bahan organik, mineral dan air sehingga perumah lemah lalu mati! Kedua, tumbuhan epifit seperti paku pakis langsuir Asplenium nidus dan orkid Bulbophyllum yang merupakan tumbuhan hijau autotrof; ia hanya menumpang di dahan pokok tinggi untuk mendapat lebih cahaya matahari dan menyerap nutrien di celah kulit kayu tanpa memudaratkan perumah! Ketiga, tumbuhan karnivor seperti periuk kera Nepenthes, perangkap lalat Venus Dionaea muscipula dan Utricularia yang berfotosintesis tetapi mencerna serangga untuk bekalan nitrogen di tanah miskin nitrogen!","title":"3.3 Penyesuaian Nutrisi: Parasit, Epifit & Karnivor","acronym":"P•E•K","hook":"Bandingkan contoh spesies dan kesan terhadap perumah dalam Makmal Kepelbagaian Nutrisi di bawah!","mediaKey":"bio53_rafflesia_parasit","summary":"Parasit (Rafflesia, Cuscuta) merosakkan perumah dengan menembusi berkas vaskular; Epifit (paku pakis langsuir, orkid) autotrof tanpa memudaratkan perumah; Karnivor (periuk kera, perangkap lalat Venus) mencerna serangga untuk nitrogen.","bullets":["Tumbuhan Parasit (Rafflesia sp., Cuscuta sp. / tali puteri, pokok dedalu): Hidup menumpang dan akarnya menembusi batang hingga berkas vaskular perumah untuk menyerap bahan organik, mineral dan air. Parasit subur manakala perumah kurang nutrien, kering lalu mati.","Tumbuhan Epifit (Asplenium nidus / paku pakis langsuir, Bulbophyllum sp. / orkid): Tumbuhan hijau autotrof yang menumpang pada pokok tinggi untuk cahaya matahari optimum tanpa mengancam perumah. Akarnya menyerap nutrien terkumpul di celah batang; kebanyakan mempunyai batang bengkak penyimpan air.","Tumbuhan Karnivor (Nepenthes sp. / periuk kera, Dionaea muscipula / perangkap lalat Venus, Utricularia sp.): Berfotosintesis menghasilkan makanan sendiri, tetapi hidup di tanah miskin nitrogen lalu merembes nektar, memerangkap dan mencerna serangga dengan jus pencernaan untuk membekalkan nitrogen. (Eksplorasi Bio: cacing tabung raksasa Riftia di lubang hidroterma laut dalam bergantung pada bakteria pengoksida hidrogen sulfida)."],"labId":"bio53_nutrisi_khusus_lab","labTitle":"Pembanding Nutrisi Parasit, Epifit & Karnivor","labProps":{"modeType":"karnivor"},"examTip":"Soalan KBAT popular: Mengapakah pokok dedalu (parasit) mati apabila ditanam bersendirian di dalam pasu berisi tanah? Jawapan: Akarnya tidak berupaya menyerap air/mineral terus daripada tanah dan memerlukan berkas vaskular perumah hidup."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Spesies & Tabiat Nutrisi","voiceCaption":"Padankan lima spesies organisma daripada Subtopik tiga perpuluhan tiga dan Praktis Formatif dengan tabiat nutrisinya.","voiceScript":"[confident] Uji penguasaan nama saintifik dan tabiat nutrisi kamu! Padankan kelima-lima spesies KSSM berikut.","prompt":"Padankan setiap spesies berikut dengan kategori atau ciri nutrisinya yang tepat:","pairs":[{"id":"b53u4m1","left":"Rafflesia sp. & Cuscuta sp. (tali puteri)","right":"Tumbuhan parasit yang menyerap air, mineral & bahan organik daripada berkas vaskular perumah"},{"id":"b53u4m2","left":"Asplenium nidus & Bulbophyllum sp. (orkid)","right":"Tumbuhan epifit autotrof berbatang bengkak yang tidak memudaratkan perumah"},{"id":"b53u4m3","left":"Nepenthes sp. & Dionaea muscipula","right":"Tumbuhan karnivor yang mencerna serangga untuk memperoleh nitrogen"},{"id":"b53u4m4","left":"Utricularia sp. (rumpai ekor kucing)","right":"Tumbuhan karnivor akuatik yang memerangkap organisma kecil untuk nitrogen"},{"id":"b53u4m5","left":"Riftia (cacing tabung raksasa)","right":"Bergantung pada bakteria di lubang hidroterma yang mengoksidakan hidrogen sulfida"}],"explanation":"Rafflesia dan Cuscuta ialah parasit; Asplenium nidus dan Bulbophyllum ialah epifit; Nepenthes, Dionaea muscipula dan Utricularia ialah karnivor."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Parasit vs Epifit vs Karnivor","voiceCaption":"Kelaskan enam pernyataan berikut antara Tumbuhan Parasit, Tumbuhan Epifit dengan Tumbuhan Karnivor.","voiceScript":"[confident] Asingkan keenam-enam ciri ekologi ini ke dalam kategori Parasit, Epifit atau Karnivor!","prompt":"Isihkan pernyataan berikut mengikut jenis penyesuaian nutrisi tumbuhan:","buckets":[{"id":"parasit","label":"Tumbuhan Parasit"},{"id":"epifit","label":"Tumbuhan Epifit"},{"id":"karnivor","label":"Tumbuhan Karnivor"}],"items":[{"text":"Menembusi batang perumah sehingga ke berkas vaskular dan membunuh perumah secara beransur","bucketId":"parasit","note":"Tepat! Merampas bahan organik, air dan mineral perumah."},{"text":"Menumpang pada pokok tinggi untuk cahaya maksimum dan menyerap nutrien di celah kulit kayu","bucketId":"epifit","note":"Betul! Komensalisme — epifit untung, perumah tidak terjejas."},{"text":"Merembes nektar dan menggunakan jus pencernaan untuk menguraikan serangga","bucketId":"karnivor","note":"Tepat! Mengatasi kekurangan nitrogen di kawasan paya atau tanah miskin N."},{"text":"Kebanyakannya mempunyai batang bengkak untuk menyimpan air di atas kanopi","bucketId":"epifit","note":"Betul! Adaptasi orkid dan paku pakis epifit."},{"text":"Mati dalam masa seminggu hingga sebulan jika ditanam bersendirian tanpa perumah di dalam pasu","bucketId":"parasit","note":"Tepat! Contohnya pokok dedalu atau tali puteri dalam Aktiviti 3.2."},{"text":"Menjalankan fotosintesis sendiri tetapi masih menangkap serangga","bucketId":"karnivor","note":"Betul! Fotosintesis membekalkan glukosa, serangga membekalkan nitrogen."}],"explanation":"Parasit bergantung sepenuhnya pada perumah hingga merosakkannya; epifit hanya menumpang tempat untuk cahaya tanpa merosakkan perumah; karnivor berfotosintesis dan menangkap serangga untuk nitrogen."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Aktiviti 3.2 Pemindahan Habitat","voiceCaption":"Ramalkan nasib pokok periuk kera, pokok dedalu dan paku pakis langsuir apabila dipindahkan ke pasu berisi tanah.","voiceScript":"[curious] Soalan Aktiviti tiga perpuluhan dua dan Praktis Sumatif tiga! Puan Rodiah menanam pokok orkid epifit menggunakan sabut kelapa dan arang, bukannya tanah biasa. Dan dalam Aktiviti tiga perpuluhan dua, pokok periuk kera, dedalu dan paku pakis langsuir ditanam dalam pasu tanah. Apakah nasib pokok dedalu?","hook":"Bandingkan keperluan perumah hidup bagi pokok dedalu (parasit) berbanding epifit dan karnivor!","scenario":"Pokok periuk kera (karnivor), pokok dedalu (parasit) dan paku pakis langsuir (epifit) ditanam di dalam pasu berisi tanah dengan cahaya, air dan baja mencukupi selama sebulan.","prompt":"Apakah yang akan berlaku kepada pokok dedalu dan mengapakah Puan Rodiah menggunakan sabut kelapa serta arang (bukan tanah) untuk orkid epifit?","options":["Pokok dedalu akan layu dan mati kerana tiada berkas vaskular perumah untuk diserap nutriennya, manakala sabut kelapa/arang memberi pengudaraan baik serta mengekalkan kelembapan akar epifit supaya tidak reput","Pokok dedalu tumbuh paling cepat daripada tanah kerana ia autotrof","Paku pakis langsuir akan bertukar menjadi tumbuhan parasit di dalam pasu tanah","Orkid epifit memerlukan tanah liat bertakung air supaya akarnya boleh memakan serangga"],"correctIndex":0,"proofLabId":"bio53_nutrisi_khusus_lab","proofState":{"modeType":"parasit"},"explanation":"Pokok dedalu ialah parasit yang mati tanpa perumah hidup. Orkid epifit ditanam dengan sabut kelapa, arang dan pecahan batu bata kerana akarnya memerlukan pengudaraan baik serta cepat reput jika terbenam dalam tanah padat yang menakung air."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Susun Tujuan Karnivor Tangkap Serangga","voiceCaption":"Susun jawapan lengkap menerangkan mengapa tumbuhan karnivor seperti periuk kera menangkap serangga walaupun mempunyai daun hijau berklorofil.","voiceScript":"[confident] Susun blok jawapan berikut bagi menjelaskan keunikan nutrisi tumbuhan karnivor seperti Nepenthes sp.!","prompt":"Susun penerangan lengkap tentang keperluan serangga bagi tumbuhan karnivor:","hint":"Tumbuhan karnivor berfotosintesis untuk gula, tetapi tanah habitatnya kekurangan unsur...","answerTokens":["Walaupun tumbuhan karnivor menghasilkan makanan sendiri melalui fotosintesis","ia hidup di kawasan tanah yang kekurangan sumber nitrogen","lalu merembes nektar dan memerangkap serangga di dalam kelongsongnya","untuk dicernakan oleh jus pencernaan bagi membekalkan nitrogen untuk pertumbuhan"],"distractors":["kerana tumbuhan karnivor tidak mempunyai pigmen klorofil di dalam daunnya","supaya dapat menembusi berkas vaskular pokok perumah"],"explanation":"Tumbuhan karnivor tetap autotrof (berfotosintesis menghasilkan karbohidrat), tetapi memerangkap dan mencerna serangga untuk mendapatkan nitrogen yang kurang dalam tanah habitatnya."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Unit 4: Subtopik 3.3","voiceCaption":"Pilih kesan sekiranya paku pakis langsuir iaitu tumbuhan epifit teduhan didedahkan kepada cahaya matahari terik secara terus.","voiceScript":"[excited] Soalan Praktis Formatif tiga perpuluhan tiga! Ramalkan kesan jika paku pakis langsuir diletakkan di bawah cahaya matahari terik secara terus.","prompt":"Ramalkan kesan terhadap pertumbuhan paku pakis langsuir (Asplenium nidus) sekiranya didedahkan kepada cahaya matahari secara terus dan berpanjangan:","options":["Daunnya akan melecur dan menguning akibat kadar transpirasi melampau dan kehilangan air yang berlebihan","Ia akan tumbuh lebih cepat daripada pokok mangga dalam masa dua hari","Akarnya akan berubah menjadi kelongsong periuk kera untuk menangkap lalat","Ia akan menghasilkan bunga pakma untuk memparasit tanah"],"correctIndex":0,"explanation":"Sebagai epifit yang lazimnya hidup di bawah teduhan kanopi hutan, pendedahan terus kepada cahaya matahari terik menyebabkan penyejatan air melampau, tekanan haba dan kelecuran daun."}]},{"id":"bio53-u5","title":"Unit 5: Cabaran Boss SPM — Nutrisi dalam Tumbuhan","subtitle":"Sintesis Kertas 1 & Kertas 2 — Makro/Mikronutrien, Kultur Knop, Adaptasi Akar & Jalur Casparian serta Parasit/Epifit/Karnivor","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Padanan Mineral & Struktur","voiceCaption":"Padankan lima konsep teras daripada Subtopik tiga perpuluhan satu hingga tiga perpuluhan tiga dengan jawapan tepatnya.","voiceScript":"[excited] Selamat datang ke Cabaran Boss SPM Bab tiga! Padankan kelima-lima konsep nutrisi tumbuhan ini dengan tepat!","prompt":"Padankan unsur, radas atau spesies Bab 3 dengan penerangan tepatnya:","pairs":[{"id":"b53boss1","left":"Magnesium (Mg) & Nitrogen (N)","right":"Makronutrien penting untuk pembentukan molekul klorofil"},{"id":"b53boss2","left":"Nikel (Ni) & Molibdenum (Mo)","right":"Mikronutrien bagi penguraian urea dan pengikatan nitrogen"},{"id":"b53boss3","left":"Jalur Casparian (suberin/lignin)","right":"Pada endodermis akar untuk menyekat gelembung udara masuk ke silinder vaskular"},{"id":"b53boss4","left":"Kalsium klorida & Kalium klorida","right":"Garam gantian dalam Botol C kultur Knop untuk mengkaji kekurangan nitrogen"},{"id":"b53boss5","left":"Cuscuta sp. (tali puteri)","right":"Tumbuhan parasit tanpa klorofil yang bergantung pada perumah"}],"explanation":"Penguasaan padanan merentas mineral, eksperimen Knop, anatomi akar dan nutrisi khusus menjamin ketepatan tinggi dalam peperiksaan SPM."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Kaedah Sumbu Hidroponik","voiceCaption":"Wajarkan penggunaan sumbu kain dalam sistem tanaman herba hidroponik Pak Ali untuk membekalkan nutrien ke akar.","voiceScript":"[curious] Soalan Praktis Sumatif tiga! Pak Ali menanam herba menggunakan sumbu yang terendam di dalam larutan nutrien. Mengapakah kaedah sumbu ini berkesan membekalkan air dan garam mineral kepada pokok?","hook":"Kaitkan tindakan kapilari sumbu dengan penyerapan oleh sel rambut akar tanpa kutikel!","scenario":"Bekas tanaman herba menggunakan tali sumbu kapas yang menghubungkan takungan larutan nutrien di bawah ke media tanaman di atas.","prompt":"Apakah fungsi utama sumbu dan ciri akar yang membantu kejayaan sistem tersebut?","options":["Sumbu menyerap dan mengalirkan larutan nutrien melalui tindakan kapilari secara berterusan ke zon akar, manakala rambut akar tanpa kutikel berluas permukaan tinggi menyerap air secara osmosis dan mineral secara pengangkutan aktif","Sumbu menghasilkan cahaya LED untuk fotosintesis akar di dalam gelap","Sumbu menghalang air daripada menyentuh sel rambut akar supaya tidak reput","Akar menggunakan jidal akar untuk menukar sumbu menjadi baja organik kompos"],"correctIndex":0,"proofLabId":"bio53_struktur_akar_lab","proofState":{"part":"epidermis"},"explanation":"Sumbu menyalurkan larutan nutrien melalui tindakan kapilari kepada akar; rambut akar yang tidak berkutikel dan bervakuol besar menyerap air dan garam mineral secara cekap, manakala ruang udara di bahagian atas memastikan bekalan O2 untuk respirasi akar."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Fungsi Unsur vs Simptom","voiceCaption":"Asingkan enam pernyataan berikut antara Ciri Makronutrien dengan Ciri Mikronutrien.","voiceScript":"[confident] Pusingan ketiga Boss! Asingkan keenam-enam fakta fungsi dan kekurangan unsur ini antara Makronutrien dengan Mikronutrien!","prompt":"Isihkan fakta berikut mengikut kategori unsur yang terlibat:","buckets":[{"id":"makro","label":"Fakta Makronutrien (N, P, K, Ca, Mg, S)"},{"id":"mikro","label":"Fakta Mikronutrien (Cl, Fe, Mn, B, Zn, Cu, Ni, Mo)"}],"items":[{"text":"Fosforus membina asid nukleik, ATP dan fosfolipid membran plasma","bucketId":"makro","note":"Tepat! P ialah makronutrien teras tenaga sel."},{"text":"Boron membantu pengambilan kalsium, translokasi sukrosa dan percambahan debunga","bucketId":"mikro","note":"Betul! Kekurangannya mematikan tunas terminal."},{"text":"Kalsium membentuk lamela tengah, dinding sel dan gentian gelendong","bucketId":"makro","note":"Tepat! Kekurangan menyebabkan daun terherot dan bercuping."},{"text":"Zink mensintesis hormon pertumbuhan auksin dan kofaktor karbohidrat","bucketId":"mikro","note":"Betul! Zink ialah mikronutrien."},{"text":"Ferum bertindak sebagai kofaktor sintesis klorofil agar daun muda tidak kuning","bucketId":"mikro","note":"Tepat! Ferum hanya diperlukan dalam kuantiti surih."},{"text":"Kalium mengekalkan kesegahan sel dan sisi daun menguning jika berkurangan","bucketId":"makro","note":"Betul! Unsur ketiga dalam baja NPK."}],"explanation":"Mengingati pengelasan 9 Makronutrien vs 8 Mikronutrien beserta simptom kekurangannya mengelakkan kesilapan dalam soalan Kertas 1 dan struktur."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Kesamaan Akar & Vilus Usus","voiceCaption":"Kenal pasti persamaan penyesuaian struktur antara rambut akar tumbuhan dengan dinding usus kecil manusia dalam penyerapan nutrien.","voiceScript":"[excited] Soalan sintesis Biologi Tingkatan empat dan lima! Apakah persamaan penyesuaian antara rambut akar tumbuhan dengan vilus usus kecil manusia?","prompt":"Apakah persamaan penyesuaian struktur antara sel rambut akar tumbuhan dengan epitelium vilus usus kecil manusia?","options":["Kedua-duanya mempunyai dinding setebal satu sel/nipis tanpa lapisan penghalang kalis air dan menambahkan jumlah luas permukaan untuk mempercepatkan penyerapan nutrien","Kedua-duanya dilapisi lapisan kutikel berlilin dan suberin yang tebal","Kedua-duanya mempunyai kloroplas untuk mensintesis glukosa daripada cahaya","Kedua-duanya hanya menggunakan pengangkutan pasif tanpa memerlukan ATP daripada mitokondria"],"correctIndex":0,"explanation":"Sel rambut akar (tiada kutikel, dinding nipis, unjuran panjang) dan vilus/mikrovilus usus kecil (epitelium setebal satu sel, unjuran jari) sama-sama memaksimumkan luas permukaan dan memendekkan jarak resapan bagi penyerapan pantas."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Huraian Epifit vs Parasit","voiceCaption":"Susun perbandingan lengkap antara tumbuhan epifit dengan tumbuhan parasit dalam ekosistem hutan hujan tropika.","voiceScript":"[confident] Susun jawapan esei perbandingan antara tumbuhan epifit dengan tumbuhan parasit dalam Praktis Formatif dan Sumatif tiga!","prompt":"Susun perbandingan tepat antara penyesuaian nutrisi tumbuhan epifit dengan tumbuhan parasit:","hint":"Bandingkan keupayaan fotosintesis, cara akar mendapat nutrien dan kesan terhadap perumah...","answerTokens":["Tumbuhan epifit mempunyai klorofil untuk berfotosintesis sendiri","dan hanya menumpang pada pokok tinggi untuk cahaya matahari tanpa memudaratkan perumah","manakala tumbuhan parasit menembusi berkas vaskular perumah dengan akarnya","untuk menyerap air, mineral dan bahan organik sehingga perumah lemah serta mati"],"distractors":["manakala tumbuhan epifit mencerna serangga untuk membekalkan fosforus kepada perumah","dan kedua-duanya membunuh pokok perumah dalam masa satu minggu"],"explanation":"Epifit ialah autotrof komensal (tidak membahayakan perumah), sedangkan parasit merosakkan dan boleh membunuh perumah akibat merampas air, mineral serta bahan organik daripada xilem dan floem perumah."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Sintesis Penuh Bab 3","voiceCaption":"Pilih pernyataan yang kesemuanya betul merangkumi nutrien tak organik, kultur Knop, akar dan kepelbagaian nutrisi.","voiceScript":"[excited] Soalan penutup Cabaran Boss Bab tiga! Pilih gabungan fakta yang seratus peratus tepat!","prompt":"Antara gabungan fakta Bab 3 berikut, manakah yang BETUL kesemuanya?","options":["9 Makronutrien & 8 Mikronutrien | Botol Knop dibalut kertas hitam elak alga | Jalur Casparian ada suberin/lignin | Nepenthes tangkap serangga untuk nitrogen","Ferum ialah makronutrien | Pam udara membekal gas CO2 ke akar | Rambut akar dilapisi kutikel tebal | Rafflesia ialah tumbuhan epifit","Boron mensintesis auksin | Botol C ganti nitrat dengan NaNO3 | Endodermis di luar epidermis akar | Orkid membunuh pokok perumah","Fosforus komponen utama klorofil | Knop guna air paip | Jidal akar menyerap mineral | Dionaea muscipula tidak berfotosintesis"],"correctIndex":0,"explanation":"Tahniah! Semua fakta dalam pilihan pertama adalah tepat sepenuhnya menurut buku teks KSSM Biologi Tingkatan 5 Bab 3."}]}]};</script>

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        });

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        if (badge) {

          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

/* 05-feedback-and-celebration.js — Drawer Feedback, Heart Recovery, Confetti & Boot */
function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function hideFeedbackDrawer() {

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);

    }
  }
  saveNotaState();

  });

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

function showCelebration() {

  var acc = notaState.unitTotal > 0 ? Math.round((notaState.unitCorrect / notaState.unitTotal) * 100) : 100;
  var stars = acc >= 85 ? 3 : (acc >= 60 ? 2 : 1);

  var prev = notaState.completedUnits[unit.id];
  var bestStars = prev ? Math.max(Number(prev.stars) || 0, stars) : stars;
  notaState.completedUnits[unit.id] = { stars: bestStars, accuracy: acc, xp: notaState.unitXpEarned };
  saveNotaState();
  NotaAudio.playFanfare();
  launchConfetti();

  var starsRow = document.getElementById("celStarsRow");
  if (starsRow) {

      return '<svg class="cel-star-slot ' + (n <= stars ? "earned" : "") + '" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' + NOTA_ICONS.star + "</svg>";

  if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayCelebration) {

  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { unitId: unit.id, unitStars: stars, accuracyPct: acc });

        '<circle cx="19.5" cy="22" r="2.2" fill="#0f172a"/>' +
