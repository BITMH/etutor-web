  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab05","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":5,"title":"Gerak Balas dalam Tumbuhan","subtitle":"Subtopik 5.1–5.3 KSSM — 5 Tropisme vs 5 Nasti, 5 Fitohormon (Auksin, Giberelin, Sitokinin, Asid Absisik, Etilena), Peranan Auksin dalam Fototropisme & Geotropisme (Koleoptil), Partenokarpi, Kultur Tisu & Eksperimen Etilena.","estimatedMinutes":32,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab05-labs.js","coverIcon":"../assets/icons/bio55-u1.jpg","editionBadge":"Edisi Simulasi Interaktif & Makmal KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan gerak balas tropisme, nasti dan fitohormon kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat hebat! [excited] Fototropisme, geotropisme auksin, partenokarpi dan gas etilena berjaya kamu kuasai!","encourage":"[softly] Hampir kena... jangan mengalah! [warm] Semak semula perbezaan kesan kepekatan auksin di pucuk vs di akar atau lima jenis gerak balas nasti di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab lima berjaya kamu takluki sepenuhnya!"},"units":[{"id":"bio55-u1","title":"Unit 1: Gerak Balas Tropisme vs Gerak Balas Nasti","subtitle":"Subtopik 5.1 — 5 Jenis Tropisme (Tigmo-, Geo-, Hidro-, Foto-, Kemotropisme) vs 5 Jenis Nasti (Foto-, Seismo-, Nikti-, Termo-, Tigmonasti)","iconType":"book","iconUrl":"../assets/icons/bio55-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Tropisme vs Nasti (5+5 Jenis)","voiceCaption":"Gerak balas tropisme ialah gerak balas pertumbuhan yang perlahan dan kekal bergantung pada arah rangsangan, manakala gerak balas nasti lebih cepat, jelas dan tidak bergantung arah rangsangan.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab lima: Gerak Balas dalam Tumbuhan! Pada subtopik lima perpuluhan satu, terdapat dua jenis gerak balas tumbuhan: tropisme dan nasti! Gerak balas tropisme bersifat perlahan, kekal, dikawal fitohormon dan arah pertumbuhannya bergantung pada arah rangsangan — positif jika ke arah rangsangan, negatif jika menjauhinya. Lima jenisnya ialah tigmotropisme pada sulur paut terhadap sentuhan, geotropisme terhadap graviti, hidrotropisme terhadap air, fototropisme terhadap cahaya dan kemotropisme terhadap bahan kimia! Sebaliknya, gerak balas nasti lebih cepat dan jelas, tidak semuanya pertumbuhan, tidak bergantung pada arah rangsangan dan sebahagiannya untuk menyelamatkan diri: fotonasti pada ros Jepun, seismonasti pada pokok semalu, niktinasti ritma sirkadian pada petai belalang, termonasti pada bunga tulip dan tigmonasti pada perangkap lalat Venus!","title":"5.1 Ciri & 5 Jenis Tropisme vs 5 Jenis Nasti","acronym":"T•G•H•F•K","hook":"Tukar tab Tropisme dan Nasti pada Makmal Gerak Balas di bawah untuk membezakan kelima-lima contoh spesies KSSM!","mediaKey":"bio55_semalu_seismonasti","summary":"Tropisme (perlahan, kekal, berarah: tigmo, geo, hidro, foto, kemo) vs Nasti (cepat, jelas, tidak berarah: fotonasti, seismonasti, niktinasti, termonasti, tigmonasti).","bullets":["5 Gerak Balas Tropisme (Perlahan, Kekal, Dipengaruhi Hormon, Bergantung Arah Rangsangan): Tigmotropisme (sulur paut melilit objek sokongan — positif); Geotropisme (akar positif ke bawah, pucuk negatif ke atas); Hidrotropisme (akar positif ke arah air); Fototropisme (pucuk positif ke arah cahaya); Kemotropisme (akar positif ke arah garam mineral, negatif menjauhi racun).","5 Gerak Balas Nasti (Lebih Cepat & Jelas, Tidak Semua Pertumbuhan, Tidak Bergantung Arah Rangsangan, Sebahagian Penyelamatan Diri): Fotonasti (kelopak bunga ros Jepun kembang siang, kuncup malam); Seismonasti (daun pokok semalu menguncup akibat sentuhan, angin atau hujan); Niktinasti (ritma sirkadian daun kekacang/petai belalang kuncup malam); Termonasti (bunga tulip kembang apabila suhu naik); Tigmonasti (perangkap lalat Venus mengatup akibat getaran mangsa)."],"labId":"bio55_tropisme_nasti_lab","labTitle":"Pembanding 5 Tropisme vs 5 Nasti","labProps":{"cat":"tropisme"},"examTip":"Bezakan dua istilah serupa: TIGMOTROPISME = sulur paut melilit objek sokongan (pertumbuhan perlahan); TIGMONASTI = perangkap lalat Venus tertutup pantas akibat getaran; SEISMONASTI = daun semalu menguncup akibat sentuhan/kejutan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Gerak Balas Tropisme vs Nasti","voiceCaption":"Kelaskan enam contoh dan ciri gerak balas tumbuhan berikut antara Gerak Balas Tropisme dengan Gerak Balas Nasti.","voiceScript":"[confident] Uji ketepatan kamu membezakan gerak balas tropisme daripada gerak balas nasti! Isihkan keenam-enam item berikut.","prompt":"Isihkan contoh dan ciri berikut kepada Gerak Balas Tropisme atau Gerak Balas Nasti:","buckets":[{"id":"tropisme","label":"Gerak Balas Tropisme"},{"id":"nasti","label":"Gerak Balas Nasti"}],"items":[{"text":"Sulur paut berpaut melilit kayu sokongan (tigmotropisme positif)","bucketId":"tropisme","note":"Tepat! Gerak balas pertumbuhan kekal ke arah sentuhan."},{"text":"Daun pokok semalu menguncup pantas apabila disentuh atau ditiup angin (seismonasti)","bucketId":"nasti","note":"Betul! Cepat, jelas dan bertujuan menyelamatkan diri."},{"text":"Bunga tulip berkembang apabila suhu naik dan menguncup apabila suhu turun (termonasti)","bucketId":"nasti","note":"Tepat! Tidak bergantung pada arah datangnya haba."},{"text":"Akar tumbuh menjauhi racun kimia di dalam tanah (kemotropisme negatif)","bucketId":"tropisme","note":"Betul! Arah pertumbuhan menjauhi rangsangan kimia berbahaya."},{"text":"Daun petai belalang menguncup pada malam mengikut ritma sirkadian (niktinasti)","bucketId":"nasti","note":"Tepat! Gerak balas berkala terhadap kegelapan."},{"text":"Pucuk tumbuh ke arah cahaya dan menjauhi tarikan graviti","bucketId":"tropisme","note":"Betul! Fototropisme positif dan geotropisme negatif."}],"explanation":"Tropisme bersifat perlahan, kekal dan berarah (sulur paut, akar ke air/graviti/mineral, pucuk ke cahaya), manakala nasti lebih pantas, boleh berbalik dan tidak bergantung pada arah rangsangan (ros Jepun, semalu, petai belalang, tulip, perangkap lalat Venus)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Niktinasti, Termonasti & Seismonasti","voiceCaption":"Gerak balas nasti termasuk fotonasti ros Jepun, seismonasti semalu, niktinasti kekacang, termonasti bunga tulip dan tigmonasti perangkap lalat Venus.","voiceScript":"[warm] Mari teliti perbezaan kelima-lima gerak balas nasti supaya tidak tertukar dalam soalan objektif! Fotonasti dikawal oleh cahaya, contohnya bunga ros Jepun berkembang apabila cahaya matahari maksimum dan menguncup pada malam. Niktinasti pula dikawal oleh ritma sirkadian terhadap keadaan gelap, contohnya daun pokok kekacang seperti petai belalang menguncup pada malam dan terbuka pada siang! Termonasti bergerak balas terhadap perubahan suhu, seperti bunga tulip yang kembang apabila suhu naik. Seismonasti tercetus oleh rangsangan mekanikal seperti sentuhan, kejutan, tiupan angin dan titisan hujan pada semalu — malah dalam Praktis Formatif lima perpuluhan satu, daun semalu turut menguncup apabila didekatkan nyalaan pemetik api sebagai gerak balas keselamatan! Manakala tigmonasti bertindak balas terhadap getaran pada perangkap lalat Venus!","title":"Perincian 5 Gerak Balas Nasti & Kepentingan Kemandirian","acronym":"F•S•N•T•T","hook":"Perhatikan mengapa Praktis Formatif 5.1 menanya kes daun semalu menguncup apabila didekatkan nyalaan pemetik api!","summary":"Setiap gerak balas nasti memastikan kemandirian spesies: perlindungan pemangsa (semalu), menangkap mangsa (Venus flytrap), atau membuka bunga pada suhu/cahaya sesuai pendebungaan (tulip, ros Jepun).","bullets":["Fotonasti vs Niktinasti: Fotonasti (bunga ros Jepun mengembang dengan cahaya maksimum & menguncup pada malam). Niktinasti (ritma sirkadian terhadap gelap pada daun kekacang seperti petai belalang).","Seismonasti vs Tigmonasti vs Termonasti: Seismonasti (rangsangan mekanikal sentuhan/kejutan/angin/hujan seperti pokok semalu — juga tindak balas keselamatan terhadap haba pemetik api). Tigmonasti (getaran mangsa pada perangkap lalat Venus). Termonasti (perubahan suhu pada bunga tulip)."],"labId":"bio55_tropisme_nasti_lab","labTitle":"Semak 5 Contoh Nasti & Spesies KSSM","labProps":{"cat":"nasti"},"examTip":"Wajaran fototropisme positif pucuk (Praktis Formatif 5.1): Membolehkan daun menerima cahaya matahari yang maksimum untuk menjalankan fotosintesis secara optimum!"},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Jenis Nasti & Tropisme","voiceCaption":"Padankan lima contoh tumbuhan berikut dengan jenis gerak balas tropisme atau nasti yang tepat.","voiceScript":"[confident] Padankan kelima-lima spesies tumbuhan berikut dengan jenis gerak balasnya yang betul!","prompt":"Padankan tumbuhan berikut dengan jenis gerak balas yang ditunjukkannya:","pairs":[{"id":"b55u1m1","left":"Sulur paut pokok timun / kacang","right":"Tigmotropisme positif (gerak balas pertumbuhan terhadap sentuhan)"},{"id":"b55u1m2","left":"Bunga ros Jepun","right":"Fotonasti (kembang pada cahaya maksimum, kuncup pada malam)"},{"id":"b55u1m3","left":"Daun pokok petai belalang","right":"Niktinasti (menguncup pada malam mengikut ritma sirkadian)"},{"id":"b55u1m4","left":"Bunga tulip","right":"Termonasti (mekar bila suhu naik dan menguncup bila suhu turun)"},{"id":"b55u1m5","left":"Perangkap lalat Venus","right":"Tigmonasti (tertutup apabila menerima rangsangan getaran serangga)"}],"explanation":"Menguasai contoh spesies rasmi KSSM (sulur paut, ros Jepun, petai belalang, tulip, perangkap lalat Venus, semalu) memastikan jawapan tepat."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Kemotropisme Akar","voiceCaption":"Ramalkan arah pertumbuhan akar tumbuhan di dalam tanah yang sebelah kirinya mengandungi baja garam mineral manakala sebelah kanannya tercemar racun kimia.","voiceScript":"[curious] Ramalkan arah pertumbuhan akar anak pokok berdasarkan konsep kemotropisme positif dan kemotropisme negatif!","hook":"Ingat: Kemotropisme positif = ke arah nutrien berguna; kemotropisme negatif = menjauhi bahan toksik!","scenario":"Akar anak benih tumbuh di antara zon tanah yang kaya garam mineral di sebelah kiri dengan zon tanah yang tercemar racun kimia di sebelah kanan.","prompt":"Bagaimanakah arah gerak balas akar dan apakah jenis gerak balas yang ditunjukkan?","options":["Akar tumbuh melengkung ke kiri menuju garam mineral (kemotropisme positif) dan menjauhi racun kimia di kanan (kemotropisme negatif)","Akar tumbuh ke kanan ke arah racun kimia melalui termonasti","Akar menguncup dengan pantas dalam masa satu saat melalui seismonasti","Akar tumbuh tegak ke atas keluar daripada tanah melalui fototropisme positif"],"correctIndex":0,"proofLabId":"bio55_tropisme_nasti_lab","proofState":{"cat":"tropisme"},"explanation":"Akar menunjukkan kemotropisme positif terhadap garam mineral yang diperlukan untuk nutrisi, dan kemotropisme negatif dengan tumbuh menjauhi bahan kimia beracun."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Perbandingan Tropisme & Nasti","voiceCaption":"Susun perbandingan ciri utama antara gerak balas tropisme dengan gerak balas nasti.","voiceScript":"[confident] Susun blok fakta berikut untuk membandingkan ciri gerak balas tropisme dan gerak balas nasti!","prompt":"Susun perbezaan ciri utama antara gerak balas tropisme dengan gerak balas nasti:","hint":"Bandingkan kelajuan, kekekalan/pertumbuhan dan kebergantungan pada arah rangsangan...","answerTokens":["Gerak balas tropisme ialah gerak balas pertumbuhan yang perlahan dan kekal","di mana arah pertumbuhannya bergantung kepada arah rangsangan serta dikawal fitohormon","manakala gerak balas nasti lebih cepat dan jelas tanpa bergantung kepada arah rangsangan","dan tidak semua gerakan nasti merupakan gerak balas pertumbuhan"],"distractors":["dan kedua-duanya hanya berlaku apabila tumbuhan terkena racun serangga","manakala gerak balas nasti mengambil masa beberapa bulan untuk dilihat"],"explanation":"Tropisme (perlahan, kekal, dipengaruhi fitohormon, bergantung arah rangsangan) vs Nasti (lebih cepat dan jelas, tidak bergantung arah rangsangan, sebahagian untuk menyelamatkan diri)."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Unit 1: Kes Pemetik Api & Semalu","voiceCaption":"Pilih penjelasan tepat mengapa daun pokok semalu menguncup apabila nyalaan pemetik api didekatkan kepadanya.","voiceScript":"[excited] Soalan Praktis Formatif lima perpuluhan satu! Danish mendapati daun pokok semalu menguncup apabila nyalaan pemetik api didekatkan. Apakah gerak balas yang berlaku?","prompt":"Danish mendapati daun pokok semalu menguncup apabila nyalaan pemetik api didekatkan dengan daunnya. Apakah kesimpulan saintifik yang paling tepat?","options":["Daun pokok semalu menunjukkan gerak balas nasti yang bertujuan menyelamatkan diri daripada rangsangan haba berbahaya secara pantas tanpa bergantung pada arah nyalaan","Pokok semalu menunjukkan fototropisme positif terhadap cahaya api","Auksin di daun semalu mengalami pemanjangan sel dalam masa satu saat","Bunga semalu menjalankan niktinasti kerana menganggap waktu sudah malam"],"correctIndex":0,"explanation":"Gerak balas nasti pada semalu bertindak pantas terhadap rangsangan luar (sentuhan atau haba berbahaya daripada nyalaan pemetik api) sebagai mekanisme pertahanan dan menyelamatkan diri."}]},{"id":"bio55-u2","title":"Unit 2: Fitohormon & Fungsi Lima Jenis Hormon Utama","subtitle":"Subtopik 5.2 — Definisi Fitohormon, Pengangkutan dalam Floem & Jadual 5.1 Fungsi Auksin, Giberelin, Sitokinin, Asid Absisik & Etilena","iconType":"atom","iconUrl":"../assets/icons/bio55-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Fitohormon Utama (Jadual 5.1)","voiceCaption":"Fitohormon ialah bahan kimia tumbuhan pada kepekatan sangat rendah yang diangkut melalui floem, merangkumi auksin, giberelin, sitokinin, asid absisik dan etilena.","voiceScript":"[warm] Selamat datang ke Unit dua, subtopik lima perpuluhan dua: Fitohormon! Berbeza dengan haiwan yang ada sistem saraf dan hormon, tumbuhan menyelaras gerak balas secara kimia menggunakan fitohormon pada kepekatan sangat rendah yang disintesis di organ tertentu lalu diangkut ke organ sasaran melalui floem! Jadual lima perpuluhan satu menyenaraikan lima fitohormon utama: Auksin mengawal fototropisme, geotropisme, kedominan apeks, merangsang akar adventitius pada keratan batang serta merencat tunas sisi dan keguguran buah muda! Giberelin memanjangkan batang tumbuhan kerdil, merangsang percambahan biji benih dan bunga, tetapi merencat perkembangan akar! Sitokinin bekerjasama dengan auksin membahagi sel, merencat kedominan apeks, merangsang tunas sisi dan melambatkan penuaan daun! Asid absisik merencat pertumbuhan, menggalakkan kedormanan biji benih dan menutup stoma waktu kemarau! Dan Etilena ialah gas yang merangsang pemasakan buah, penuaan serta keguguran daun dan buah!","title":"5.2 Definisi Fitohormon & Jadual 5.1 (5 Hormon Tumbuhan)","acronym":"A•G•S•A•E","hook":"Klik setiap satu daripada 5 fitohormon pada Dek Fitohormon di bawah untuk menyemak fungsi penuh Jadual 5.1!","summary":"5 Fitohormon utama diangkut melalui floem: Auksin (tropisme, kedominan apeks), Giberelin (batang kerdil, cambah biji), Sitokinin (tunas sisi, lambat penuaan), Asid Absisik (dorman biji, tutup stoma kemarau) & Etilena (masak buah).","bullets":["Auksin & Sitokinin (Hubungan Berlawanan pada Tunas): Auksin menggalakkan kedominan apeks, merangsang akar adventitius keratan batang, merangsang pembahagian sel kambium serta merencat tunas sisi dan keguguran buah muda. Sitokinin pula merencat kedominan apeks, merangsang pertumbuhan tunas sisi, merangsang pembahagian sel bersama auksin dan melambatkan penuaan daun.","Giberelin: Merangsang pembahagian/pemanjangan sel batang, menyebabkan batang tumbuhan kerdil tumbuh normal, merangsang percambahan biji benih serta perkembangan daun/bunga/buah, dan merencat perkembangan akar.","Asid Absisik (ABA) & Etilena: Asid absisik merencat pertumbuhan dan percambahan, menggalakkan kedormanan biji benih, merangsang pengguguran daun/buah matang dan menutup liang stoma pada musim kemarau. Etilena pula ialah gas merangsang pemasakan buah, penuaan dan pengguguran daun serta buah."],"labId":"bio55_fitohormon_deck_lab","labTitle":"Dek Interaktif 5 Fitohormon (Jadual 5.1)","labProps":{"hormon":"auksin"},"examTip":"Pasangan bertentangan wajib tahu: Auksin MENGGALAKKAN kedominan apeks & MERENCAT tunas sisi; Sitokinin MERENCAT kedominan apeks & MERANGSANG tunas sisi!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 5 Fitohormon & Fungsinya","voiceCaption":"Padankan kelima-lima fitohormon daripada Jadual lima perpuluhan satu dengan fungsi utamanya.","voiceScript":"[confident] Uji ketepatan ingatan kamu terhadap Jadual lima perpuluhan satu! Padankan kelima-lima fitohormon berikut.","prompt":"Padankan setiap fitohormon berikut dengan fungsi utamanya yang tepat:","pairs":[{"id":"b55u2m1","left":"Auksin","right":"Menggalakkan kedominan apeks, akar adventitius dan merencat tunas sisi"},{"id":"b55u2m2","left":"Giberelin","right":"Merangsang pemanjangan batang tumbuhan kerdil dan percambahan biji benih"},{"id":"b55u2m3","left":"Sitokinin","right":"Melambatkan penuaan daun dan merangsang pertumbuhan tunas sisi"},{"id":"b55u2m4","left":"Asid absisik","right":"Menggalakkan kedormanan biji benih dan menutup stoma pada musim kemarau"},{"id":"b55u2m5","left":"Etilena","right":"Gas hormon yang merangsang pemasakan buah dan penuaan tumbuhan"}],"explanation":"Kelima-lima fitohormon menyelaras keseluruhan kitar hidup tumbuhan daripada percambahan biji benih, kedominan apeks, rintangan kemarau hingga pemasakan buah."},{"type":"sort","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Isih Hormon Perangsang vs Perencat","voiceCaption":"Kelaskan enam peranan fisiologi berikut antara Peranan Penggalakan Pertumbuhan/Pemasakan dengan Peranan Perencatan/Penyelarasan Tekanan.","voiceScript":"[confident] Asingkan keenam-enam fungsi fitohormon ini mengikut kesan penggalakannya atau kesan perencatannya!","prompt":"Isihkan fungsi fitohormon berikut mengikut jenis kesannya:","buckets":[{"id":"galak","label":"Auksin, Giberelin & Sitokinin"},{"id":"rencat","label":"Asid Absisik & Etilena"}],"items":[{"text":"Merangsang pembahagian sel di kambium vaskular semasa pertumbuhan sekunder","bucketId":"galak","note":"Tepat! Fungsi hormon auksin."},{"text":"Menggalakkan penutupan liang stoma pada musim kemarau","bucketId":"rencat","note":"Betul! Fungsi asid absisik (ABA) menyelamatkan tumbuhan daripada kekeringan."},{"text":"Merangsang pemasakan buah dan keguguran buah atau daun","bucketId":"rencat","note":"Tepat! Fungsi gas etilena."},{"text":"Merangsang pertumbuhan tunas sisi dan melambatkan penuaan daun","bucketId":"galak","note":"Betul! Fungsi sitokinin."},{"text":"Menggalakkan kedormanan biji benih dan merencat percambahan","bucketId":"rencat","note":"Tepat! Fungsi asid absisik."},{"text":"Menyebabkan pertumbuhan batang berbunga pada tumbuhan kerdil","bucketId":"galak","note":"Betul! Fungsi giberelin."}],"explanation":"Auksin, giberelin dan sitokinin kebanyakannya merangsang pembahagian sel, pemanjangan dan percambahan, manakala asid absisik dan etilena mengawal kedormanan, penutupan stoma kemarau, penuaan dan pemasakan buah."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Pengasingan Buah Epal Terlebih Masak","voiceCaption":"Ramalkan sebab peniaga buah epal sentiasa mengasingkan buah epal yang sudah terlebih masak daripada buah epal lain di dalam bakul.","voiceScript":"[curious] Soalan Praktis Formatif lima perpuluhan dua dan lima perpuluhan tiga! Mengapakah Encik Farid segera mengasingkan buah epal yang sudah terlebih masak daripada buah epal yang lain?","hook":"Periksa peranan gas etilena dan asid absisik dalam Dek Fitohormon!","scenario":"Seorang peniaga buah epal sentiasa mengeluarkan sebiji buah yang terlebih masak dari kotak penyimpanan buah yang sedang masak.","prompt":"Apakah justifikasi saintifik bagi tindakan Encik Farid tersebut?","options":["Buah yang terlebih masak membebaskan banyak gas etilena ke udara yang merangsang buah-buahan lain di sebelahnya masak terlalu cepat dan membusuk","Buah terlebih masak menyerap semua asid absisik dari udara melalui stoma","Buah terlebih masak menghasilkan sitokinin yang menumbuhkan tunas sisi pada epal lain","Buah terlebih masak merembeskan auksin cecair ke dalam xilem epal lain"],"correctIndex":0,"proofLabId":"bio55_fitohormon_deck_lab","proofState":{"hormon":"etilena"},"explanation":"Etilena ialah fitohormon berbentuk gas yang mudah meruap. Buah yang terlalu masak membebaskan etilena secara banyak, mempercepatkan pemasakan serta penuaan (kerosakan) buah bersebelahan."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Susun Peranan Asid Absisik Waktu Kemarau","voiceCaption":"Susun huraian bagaimana hormon asid absisik membantu tumbuhan mengekalkan kandungan airnya apabila suhu persekitaran meningkat.","voiceScript":"[confident] Soalan Praktis Formatif lima perpuluhan tiga! Susun blok jawapan ini untuk menerangkan peranan hormon X iaitu asid absisik ketika musim kemarau!","prompt":"Susun penerangan bagaimana asid absisik membantu tumbuhan mengekalkan air ketika suhu meningkat:","hint":"Hormon X ialah asid absisik yang bertindak ke atas liang stoma...","answerTokens":["Hormon X ialah asid absisik yang dirembeskan apabila suhu meningkat atau kemarau","dan merangsang penutupan liang stoma pada permukaan daun","untuk mengurangkan kehilangan wap air melalui proses transpirasi","supaya kandungan air tumbuhan kekal terpelihara"],"distractors":["untuk merangsang pembukaan stoma bagi mempercepatkan fotorespirasi","dan meningkatkan pengeluaran gas etilena di dalam akar"],"explanation":"Asid absisik (ABA) bertindak semasa tekanan kekeringan dengan merangsang penutupan liang stoma untuk menyekat kehilangan air melampau melalui transpirasi."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s6","voiceToneLabel":"Cabaran Unit 2: Pengangkutan Fitohormon","voiceCaption":"Pilih tisu vaskular yang mengangkut fitohormon dan dua hormon yang saling mengawal percambahan biji benih.","voiceScript":"[excited] Soalan penutup Unit dua! Pilih pernyataan paling tepat tentang laluan pengangkutan fitohormon serta kesan berlawanan giberelin dan asid absisik.","prompt":"Melalui tisu manakah fitohormon diangkut ke organ sasaran, dan pasangan hormon manakah mempunyai kesan bertentangan terhadap percambahan biji benih?","options":["Diangkut melalui floem; Giberelin merangsang percambahan biji benih manakala Asid absisik menggalakkan kedormanan dan merencat percambahan","Diangkut melalui xilem sahaja; Auksin membunuh biji benih manakala Etilena menukar biji menjadi akar","Diangkut melalui kutikel; Sitokinin menyebabkan kedormanan manakala Asid absisik merangsang bunga","Diangkut melalui trakeid; Etilena melambatkan penuaan daun"],"correctIndex":0,"explanation":"Fitohormon diangkut melalui floem bersama bahan organik. Giberelin dan sitokinin merangsang percambahan biji benih, manakala asid absisik mengekalkan kedormanan dan merencat percambahan."}]},{"id":"bio55-u3","title":"Unit 3: Peranan Auksin dalam Fototropisme & Geotropisme","subtitle":"Subtopik 5.2 — Eksperimen Koleoptil (Blok Agar vs Mika), Kepekatan Auksin Berbeza pada Pucuk vs Akar serta Mekanisme Pembengkokan","iconType":"scale","iconUrl":"../assets/icons/bio55-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Eksperimen Koleoptil & Kesan Berbeza Auksin","voiceCaption":"Auksin disintesis di hujung koleoptil; kepekatan auksin yang tinggi merangsang pemanjangan sel di pucuk tetapi merencatkan pemanjangan sel di akar.","voiceScript":"[warm] Selamat datang ke Unit tiga! Inilah konsep peperiksaan paling kritikal dalam Bab lima: peranan auksin dalam fototropisme dan geotropisme! Dalam eksperimen koleoptil Rajah lima perpuluhan empat, hujung koleoptil yang dipotong tidak tumbuh, tetapi jika diletakkan di atas blok agar kemudian diletakkan semula di atas koleoptil, ia tumbuh kerana auksin dapat meresap melalui blok agar! Sebaliknya, kepingan mika yang tidak telap menghalang resapan auksin. Dan ingat hukum keemasan Rajah lima perpuluhan lima: kepekatan auksin yang TINGGI merangsang pemanjangan sel di PUCUK, tetapi MERENCATKAN pemanjangan sel di AKAR!","title":"Eksperimen Koleoptil & Graf Kesan Auksin pada Pucuk vs Akar","acronym":"A•P+•A-","hook":"Tukar tab Fototropisme, Geotropisme dan Mika pada Simulator Koleoptil Auksin di bawah!","mediaKey":"bio55_fototropisme_pucuk","videoClip":{"src":"../assets/biologi-t5-bab05/video/bio55_video_auksin_fototropisme_narasi.mp4","hasNarration":true,"posterKey":"bio55_fototropisme_pucuk","caption":"Peranan fitohormon auksin dalam fototropisme positif pucuk dan etilena dalam pemasakan buah."},"summary":"Auksin disintesis di hujung pucuk/koleoptil dan meresap ke zon pemanjangan. Kepekatan auksin tinggi merangsang pemanjangan sel pucuk, tetapi merencat pemanjangan sel akar!","bullets":["Eksperimen Koleoptil (Rajah 5.4): Hujung koleoptil menghasilkan auksin. Blok agar telap membenarkan auksin meresap ke bahagian bawah untuk merangsang pemanjangan; kepingan mika yang tidak telap menghalang pengaliran auksin. Taburan auksin tidak sekata membengkokkan koleoptil ke sisi kurang auksin.","Kesan Bertentangan Kepekatan Tinggi (Rajah 5.5): Kepekatan auksin yang tinggi MERANGSANG pemanjangan sel di pucuk tetapi MERENCATKAN pemanjangan sel di akar!"],"labId":"bio55_auksin_koleoptil_sim","labTitle":"Simulator Koleoptil, Fototropisme & Geotropisme Auksin","labProps":{"exp":"foto"},"examTip":"Jangan tertukar arah kesan! Kepekatan auksin tinggi: Pucuk -> RANGSANG pemanjangan; Akar -> RENCAT pemanjangan."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Mekanisme Geotropisme Akar & Pucuk","voiceCaption":"Ramalkan mengapa pucuk anak benih yang tumbuh mendatar membengkok ke atas manakala radikelnya membengkok ke bawah.","voiceScript":"[curious] Cuba ramalkan apa yang berlaku apabila biji benih bercambah secara mendatar di dalam tanah! Graviti menarik auksin berkumpul di bahagian bawah kedua-dua pucuk dan akar. Mengapakah pucuk naik ke atas manakala akar turun ke bawah?","hook":"Semak tab Geotropisme dalam Simulator Koleoptil selepas memilih jawapan!","scenario":"Biji benih bercambah secara mendatar di dalam tanah gelap. Tarikan graviti menyebabkan auksin berkumpul di bahagian bawah hujung pucuk dan hujung akar.","prompt":"Bagaimanakah taburan auksin yang sama di bahagian bawah itu menghasilkan gerak balas bertentangan antara pucuk dan akar?","options":["Di pucuk, kepekatan auksin tinggi di bahagian bawah merangsang sel bawah memanjang lebih cepat lalu pucuk membengkok ke atas; di akar, kepekatan auksin tinggi di bawah merencat sel bawah sehingga sel atas memanjang lebih cepat dan akar membengkok ke bawah","Di akar, auksin naik ke bahagian atas melawan graviti","Di pucuk, auksin memusnahkan sel bahagian bawah supaya mengecut ke atas","Akar membengkok ke bawah akibat tindak balas etilena tanpa auksin"],"correctIndex":0,"proofLabId":"bio55_auksin_koleoptil_sim","proofState":{"exp":"geo"},"explanation":"Ini soalan klasik SPM! Graviti mengumpulkan auksin di bahagian bawah kedua-duanya: sel bawah pucuk dirangsang memanjang lebih cepat (bengkok ke atas = geotropisme negatif), manakala sel bawah akar direncat supaya sel atas memanjang lebih cepat (bengkok ke bawah = geotropisme positif)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Mekanisme Fototropisme & Tigmotropisme","voiceCaption":"Apabila pucuk menerima cahaya dari satu arah, auksin bergerak ke bahagian teduh dan memanjangkan sel teduh lebih cepat sehingga pucuk membengkok ke arah cahaya.","voiceScript":"[warm] Sekarang bandingkan mekanisme fototropisme dan tigmotropisme pula! Apabila pucuk didedahkan kepada cahaya dari semua arah, taburan auksin sekata dan pucuk tumbuh tegak ke atas. Apabila cahaya datang dari satu arah sahaja, auksin bergerak menjauhi cahaya ke bahagian teduh! Akibatnya, kepekatan auksin di bahagian teduh lebih tinggi lalu sel bahagian teduh memanjang lebih cepat daripada sel bercahaya, membengkokkan pucuk ke arah cahaya sebagai fototropisme positif! Manakala bagi sulur paut dalam tigmotropisme, sentuhan dengan kayu sokongan menyebabkan taburan auksin tidak sekata di sisi bertentangan sehingga sulur paut memanjang lebih cepat di sisi luar dan melilit objek sokongan! Perhatikan juga Praktis Formatif lima perpuluhan dua: bagaimana auksin mengawal fototropisme dalam keadaan gelap? Dalam gelap tanpa cahaya dari mana-mana arah, taburan auksin di hujung pucuk kekal sekata sehingga pucuk tumbuh tegak ke atas!","title":"Mekanisme Fototropisme Pucuk, Keadaan Gelap & Tigmotropisme","acronym":"T•P•C•M","hook":"Perhatikan mengapa pucuk tumbuh tegak ke atas dalam keadaan gelap atau cahaya seragam!","mediaKey":"bio55_sulur_tigmotropisme","summary":"Cahaya satu arah menolak auksin ke sisi teduh -> pemanjangan sel teduh lebih cepat -> pucuk membengkok ke cahaya. Dalam gelap atau cahaya seragam, taburan auksin sekata -> pucuk tumbuh tegak.","bullets":["Fototropisme Pucuk (Rajah 5.6): Cahaya dari satu arah menyebabkan auksin bergerak menjauhi cahaya ke sisi teduh. Sel di sisi teduh menerima lebih banyak auksin dan memanjang lebih cepat -> pucuk membengkok ke arah cahaya (fototropisme positif).","Dalam Keadaan Gelap / Cahaya Sekata: Tiada rangsangan cahaya satu arah -> taburan auksin kekal sekata di seluruh hujung pucuk -> pucuk tumbuh tegak lurus ke atas.","Tigmotropisme Sulur Paut: Taburan auksin tidak sekata akibat sentuhan objek menyebabkan sisi yang tidak bersentuhan memanjang lebih cepat lalu melilit kayu sokongan."],"labId":"bio55_auksin_koleoptil_sim","labTitle":"Uji Fototropisme vs Mika pada Koleoptil","labProps":{"exp":"mika"},"examTip":"Skema Kertas 2: Pastikan guna perkataan 'memanjang dengan lebih cepat', BUKAN 'membahagi dengan lebih cepat' apabila menerangkan kesan auksin di zon pemanjangan!"},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Susunan Koleoptil & Keputusan","voiceCaption":"Padankan lima susunan eksperimen koleoptil dan arah cahaya dengan hasil pertumbuhannya yang tepat.","voiceScript":"[confident] Uji ramalan eksperimen koleoptil Rajah lima perpuluhan empat! Padankan kelima-lima perlakuan koleoptil ini dengan keputusannya.","prompt":"Padankan perlakuan pada hujung koleoptil dengan hasil pertumbuhannya:","pairs":[{"id":"b55u3m1","left":"Hujung koleoptil dipotong dan dibuang","right":"Tiada sintesis auksin -> koleoptil tidak memanjang dan tidak membengkok"},{"id":"b55u3m2","left":"Blok agar berisi auksin diletak di sebelah kiri koleoptil terpotong","right":"Sebelah kiri memanjang lebih cepat -> koleoptil membengkok ke kanan"},{"id":"b55u3m3","left":"Kepingan mika disisipkan penuh di bawah hujung koleoptil","right":"Pengaliran auksin ke zon pemanjangan tersekat -> pertumbuhan terhenti"},{"id":"b55u3m4","left":"Hujung koleoptil ditutup tudung legap dan disinari cahaya dari kanan","right":"Cahaya tidak dikesan oleh hujung -> auksin sekata dan tumbuh tegak ke atas"},{"id":"b55u3m5","left":"Koleoptil utuh disinari cahaya dari kanan","right":"Auksin berkumpul di sisi kiri (teduh) -> membengkok ke kanan arah cahaya"}],"explanation":"Hujung koleoptil mengesan cahaya dan mensintesis auksin; blok agar membenarkan resapan auksin manakala mika menyekatnya."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Susun Mekanisme Fototropisme Pucuk","voiceCaption":"Susun urutan lengkap bagaimana auksin menyebabkan hujung pucuk membengkok ke arah cahaya matahari satu arah.","voiceScript":"[confident] Susun blok jawapan esei berikut bagi menerangkan mekanisme fototropisme positif pada hujung pucuk!","prompt":"Susun urutan peristiwa yang menyebabkan pucuk membengkok ke arah cahaya satu arah:","hint":"Cahaya satu arah -> pergerakan auksin ke sisi teduh -> pemanjangan sel -> pembengkokan...","answerTokens":["Apabila pucuk terdedah kepada cahaya dari satu arah","auksin bergerak menjauhi cahaya dan berkumpul di bahagian teduh","menyebabkan sel di bahagian teduh memanjang lebih cepat daripada bahagian bercahaya","lalu pucuk membengkok ke arah cahaya melalui fototropisme positif"],"distractors":["menyebabkan kepekatan auksin tinggi merencat pemanjangan sel di sisi teduh","lalu etilena menukarkan sel pucuk menjadi sel pengawal"],"explanation":"Cahaya satu arah -> auksin berpindah ke bahagian teduh -> kepekatan auksin tinggi merangsang pemanjangan sel teduh lebih cepat -> pucuk membengkok ke arah cahaya."},{"type":"sort","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Isih Kesan Auksin Pucuk vs Akar","voiceCaption":"Kelaskan enam pernyataan berikut antara tindak balas Auksin di Pucuk dengan tindak balas Auksin di Akar.","voiceScript":"[confident] Asingkan keenam-enam pernyataan ini antara tindakan auksin di Pucuk dengan di Akar!","prompt":"Isihkan pernyataan berikut antara Pucuk dengan Akar:","buckets":[{"id":"pucuk","label":"Pucuk (Fototropisme + / Geotropisme -)"},{"id":"akar","label":"Akar (Geotropisme +)"}],"items":[{"text":"Kepekatan auksin tinggi di bahagian bawah merangsang pemanjangan sel lebih cepat","bucketId":"pucuk","note":"Tepat! Menolak hujung pucuk membengkok ke atas melawan graviti."},{"text":"Kepekatan auksin tinggi di bahagian bawah merencatkan pemanjangan sel","bucketId":"akar","note":"Betul! Bahagian atas akar pula memanjang lebih cepat lalu akar membengkok ke bawah."},{"text":"Tumbuh ke arah cahaya kerana auksin di sisi teduh merangsang pemanjangan","bucketId":"pucuk","note":"Tepat! Fototropisme positif pada pucuk."},{"text":"Menunjukkan gerak balas geotropisme positif mengikut arah tarikan graviti","bucketId":"akar","note":"Betul! Memastikan akar masuk ke dalam tanah untuk air dan sokongan."},{"text":"Menunjukkan gerak balas geotropisme negatif ke atas untuk mendapat cahaya","bucketId":"pucuk","note":"Tepat! Memastikan daun terdedah kepada cahaya matahari."},{"text":"Sel pada bahagian atas memanjang lebih cepat apabila diletakkan secara mendatar","bucketId":"akar","note":"Betul! Kerana bahagian atas mempunyai kepekatan auksin yang lebih rendah (tidak merencat)."}],"explanation":"Pada pucuk, kepekatan auksin tinggi merangsang pemanjangan; pada akar, kepekatan auksin tinggi merencatkan pemanjangan."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Cabaran Unit 3: Kesan Mika vs Agar","voiceCaption":"Pilih susunan radas yang masih membenarkan pucuk membengkok ke arah cahaya matahari selepas rawatan pada hujung koleoptil.","voiceScript":"[excited] Soalan penutup Unit tiga! Antara susunan koleoptil berikut, manakah yang masih mampu membengkok ke arah cahaya matahari satu arah?","prompt":"Antara perlakuan ke atas koleoptil yang disinari cahaya dari satu arah berikut, manakah yang masih dapat membengkok ke arah cahaya?","options":["Hujung koleoptil dipotong lalu diletakkan blok agar telap di antara hujung dan pangkal koleoptil","Kepingan mika tidak telap disisipkan penuh di bawah hujung koleoptil","Hujung koleoptil dipotong dan dibuang tanpa sebarang blok agar","Hujung koleoptil disarung dengan tudung legap hitam sepenuhnya"],"correctIndex":0,"explanation":"Blok agar membenarkan auksin yang diagihkan secara tidak sekata oleh hujung koleoptil meresap ke zon pemanjangan di bawah, menyebabkan koleoptil membengkok ke arah cahaya."}]},{"id":"bio55-u4","title":"Unit 4: Aplikasi Fitohormon dalam Pertanian & Etilena","subtitle":"Subtopik 5.3 — Partenokarpi (Buah Tanpa Biji), Pengakaran Keratan Batang, Kultur Tisu Sitokinin, Giberelin Anggur & Eksperimen Etilena","iconType":"crown","iconUrl":"../assets/icons/bio55-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Aplikasi Pertanian & Eksperimen Etilena","voiceCaption":"Fitohormon diaplikasikan secara komersial termasuk auksin untuk partenokarpi dan racun rumpai, giberelin untuk anggur besar, sitokinin untuk kultur tisu dan etilena untuk pemasakan buah.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik lima perpuluhan tiga: Aplikasi Fitohormon dalam Pertanian! Fitohormon sintetik dan ekstrak digunakan secara meluas oleh petani moden mengikut Rajah lima perpuluhan lapan! Auksin digunakan untuk menghasilkan buah tanpa biji melalui kaedah partenokarpi tanpa pendebungaan seperti tembikai dan anggur, merangsang akar adventitius keratan batang, menjadi racun rumpai, melambatkan pertunasan kentang serta membentuk pokok rendah yang rimbun! Giberelin merawat tumbuhan kerdil mutasi kepada tinggi normal, memanjangkan tangkai bunga, membesarkan buah anggur dan menggalakkan percambahan biji salad, oat serta tembakau! Sitokinin digabung bersama auksin dalam teknik kultur tisu bagi membentuk akar dan batang serta melambatkan penuaan daun bunga keratan! Manakala gas etilena merangsang pemasakan buah secara cepat dan sekata serta pembungaan serentak!","title":"5.3 Aplikasi Komersial 5 Fitohormon & Eksperimen Etilena","acronym":"P•K•G•E","hook":"Bandingkan Beg A dan Beg B pada Simulator Pemasakan Etilena di bawah untuk melihat kesan pisang masak terhadap tomato muda!","mediaKey":"bio55_pemasakan_etilena","summary":"Auksin (partenokarpi tanpa biji, keratan batang, racun rumpai, cegah tunas kentang), Giberelin (anggur besar, rawat kerdil), Sitokinin (kultur tisu, bunga segar) & Etilena (masak buah sekata, bunga serentak).","bullets":["Auksin dalam Pertanian: Menggalakkan akar adventitius pada keratan batang berkayu (pembiakan aseks); menghasilkan buah tanpa biji (partenokarpi); racun rumpai; melambatkan pertunasan ubi kentang semasa penyimpanan; membentuk pokok rendah dan rimbun.","Giberelin & Sitokinin: Giberelin merawat pokok kerdil akibat mutasi, memanjangkan tangkai bunga, menghasilkan buah anggur lebih besar dan menggalakkan percambahan biji salad/oat/tembakau. Sitokinin digunakan bersama auksin dalam kultur tisu (pembahagian/pembezaan sel membentuk akar dan batang) serta melambatkan penuaan daun bunga yang baru dipotong.","Etilena & Eksperimen 5.2 (Tomato + Pisang): Gas etilena merangsang pemasakan buah cepat dan sekata (cth. pisang dibalut guni kalis air) serta pembungaan serentak. Dalam beg kertas tertutup B (tomato muda + pisang masak), gas etilena daripada pisang masak menyebabkan tomato cepat bertukar merah dan lembut berbanding beg A."],"labId":"bio55_pertanian_etilena_lab","labTitle":"Simulator Eksperimen Pemasakan Buah Gas Etilena","labProps":{"bag":"B"},"examTip":"Soalan Praktis Sumatif 5: Mengapakah buah yang dieksport disimpan pada suhu rendah (peti sejuk/bekas dingin)? Jawapan: Suhu rendah memperlahankan kadar respirasi buah dan merencatkan penghasilan serta tindakan gas etilena supaya buah lambat masak."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Aplikasi Pertanian Fitohormon","voiceCaption":"Padankan lima aplikasi pertanian moden berikut dengan fitohormon yang digunakan mengikut Rajah lima perpuluhan lapan.","voiceScript":"[confident] Uji ketepatan kamu memadankan aplikasi pertanian moden dalam Rajah lima perpuluhan lapan dengan fitohormonnya!","prompt":"Padankan aplikasi pertanian berikut dengan fitohormon yang terlibat:","pairs":[{"id":"b55u4m1","left":"Partenokarpi (buah tanpa biji seperti tembikai/anggur) & keratan batang","right":"Auksin"},{"id":"b55u4m2","left":"Menghasilkan buah anggur lebih besar & merawat tumbuhan kerdil mutasi","right":"Giberelin"},{"id":"b55u4m3","left":"Teknik kultur tisu bersama auksin & melambatkan penuaan bunga keratan","right":"Sitokinin"},{"id":"b55u4m4","left":"Pemasakan buah cepat serta sekata & pembungaan serentak di ladang","right":"Etilena"},{"id":"b55u4m5","left":"Merencatkan proses percambahan semasa penyimpanan biji benih","right":"Asid absisik"}],"explanation":"Auksin (partenokarpi, pengakaran, racun rumpai, lambat pertunasan kentang); Giberelin (anggur besar, pokok kerdil); Sitokinin (kultur tisu, bunga segar); Etilena (masak buah, bunga serentak); Asid absisik (rencat percambahan)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Kesan Peti Sejuk Terhadap Etilena","voiceCaption":"Ramalkan keadaan buah limau nipis muda yang disimpan bersama pisang masak jika bekas tertutup itu dimasukkan ke dalam peti sejuk.","voiceScript":"[curious] Soalan Praktis Sumatif lima! Puan Faridah meletakkan buah limau nipis muda bersama pisang masak di dalam bekas tertutup. Apakah perbezaan jika bekas itu diletakkan pada suhu bilik berbanding di dalam peti sejuk?","hook":"Kaitkan suhu rendah peti sejuk dengan aktiviti enzim yang mensintesis gas etilena!","scenario":"Bekas tertutup berisi limau nipis muda dan pisang masak diletakkan di dalam peti sejuk bersuhu 4°C.","prompt":"Apakah yang berlaku kepada buah limau nipis tersebut di dalam peti sejuk berbanding pada suhu bilik?","options":["Buah limau lambat masak dan kekal hijau lebih lama kerana suhu rendah memperlahankan aktiviti enzim, mengurangkan pembebasan gas etilena daripada pisang masak","Buah limau masak dua kali lebih cepat kerana peti sejuk menghasilkan etilena tambahan","Gas etilena bertukar menjadi auksin yang menghasilkan buah tanpa biji","Kulit buah limau menjadi tebal melalui pertumbuhan sekunder"],"correctIndex":0,"proofLabId":"bio55_pertanian_etilena_lab","proofState":{"bag":"A"},"explanation":"Suhu rendah di dalam peti sejuk mengurangkan tenaga kinetik dan memperlahankan tindak balas enzim untuk sintesis gas etilena serta kadar respirasi buah, melambatkan pemasakan buah."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Kegunaan Auksin/Giberelin vs Sitokinin/Etilena","voiceCaption":"Kelaskan enam aplikasi pertanian daripada Rajah lima perpuluhan lapan antara Auksin/Giberelin dengan Sitokinin/Etilena.","voiceScript":"[confident] Asingkan keenam-enam kegunaan pertanian ini mengikut pasangan fitohormonnya!","prompt":"Isihkan aplikasi pertanian berikut kepada kumpulan fitohormon yang betul:","buckets":[{"id":"ag","label":"Aplikasi Auksin & Giberelin"},{"id":"se","label":"Aplikasi Sitokinin & Etilena"}],"items":[{"text":"Melambatkan pertunasan ubi kentang semasa penyimpanan dan pemasaran","bucketId":"ag","note":"Tepat! Aplikasi hormon auksin."},{"text":"Membungkus buah pisang dengan guni kalis air untuk memerangkap gas pemasakan","bucketId":"se","note":"Betul! Memerangkap gas etilena meruap."},{"text":"Digunakan sebagai racun rumpai terpilih dan pembentukan pokok rendah rimbun","bucketId":"ag","note":"Tepat! Kepekatan tinggi auksin sintetik bertindak sebagai racun rumpai."},{"text":"Merangsang pembahagian dan pembezaan sel membentuk akar serta batang dalam kultur tisu","bucketId":"se","note":"Betul! Sitokinin digunakan bersama auksin dalam kultur tisu."},{"text":"Menggalakkan percambahan biji salad, oat dan tembakau pada suhu rendah atau kurang cahaya","bucketId":"ag","note":"Tepat! Aplikasi hormon giberelin."},{"text":"Merangsang pembungaan serentak pada tanaman ladang secara komersial","bucketId":"se","note":"Betul! Aplikasi gas etilena."}],"explanation":"Mengingati setiap aplikasi khusus dalam Rajah 5.8 (seperti kentang/racun rumpai -> auksin; anggur/kerdil -> giberelin; kultur tisu/bunga potong -> sitokinin; masak sekata/bunga serentak -> etilena) amat membantu soalan Kertas 1 dan 2."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Susun Prinsip Partenokarpi","voiceCaption":"Susun huraian bagaimana teknik partenokarpi menggunakan auksin menghasilkan buah tanpa biji tanpa melibatkan pendebungaan.","voiceScript":"[confident] Susun jawapan Praktis Sumatif lima bagi menerangkan kaedah partenokarpi dan manfaatnya kepada pengguna!","prompt":"Susun penerangan teknik partenokarpi menggunakan fitohormon auksin:","hint":"Semburan auksin pada stigma/ovari bunga tanpa pendebungaan dan persenyawaan...","answerTokens":["Partenokarpi ialah teknik menyembur fitohormon auksin ke atas stigma atau ovari bunga","tanpa berlakunya proses pendebungaan dan persenyawaan ovul","yang merangsang ovari berkembang menjadi buah tanpa biji","seperti tembikai dan anggur yang lebih mudah dimakan oleh pengguna"],"distractors":["di mana ovul disenyawakan oleh gas etilena dari pisang masak","lalu menghasilkan biji benih besar melalui kultur tisu"],"explanation":"Semburan auksin merangsang dinding ovari membesar menjadi buah walaupun tiada persenyawaan ovul, menghasilkan buah tanpa biji (partenokarpi)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Unit 4: Eksport Buah-buahan","voiceCaption":"Pilih kaedah pembungkusan dan pengangkutan terbaik bagi memperlahankan pemasakan buah semasa eksport jarak jauh.","voiceScript":"[excited] Soalan penutup Unit empat! Bagaimanakah pengeluar buah-buahan eksport memperlahankan pemasakan buah sepanjang perjalanan di atas kapal?","prompt":"Apakah kaedah terbaik untuk memperlahankan pemasakan buah-buahan yang dieksport ke luar negara sepanjang tempoh penghantaran?","options":["Menyimpan buah di dalam bekas dingin bersuhu rendah dengan pengudaraan baik serta menyingkirkan atau menyerap gas etilena","Membungkus buah bersama pisang masak di dalam beg kertas tertutup pada suhu 35°C","Menyembur buah dengan larutan gas etilena pekat sebelum dimasukkan ke dalam kontena","Mendedahkan buah kepada kepekatan asid absisik tinggi pada suhu 45°C"],"correctIndex":0,"explanation":"Suhu rendah memperlahankan respirasi dan sintesis etilena, manakala pengudaraan yang baik atau penyerap etilena menghalang pengumpulan gas etilena di sekitar buah."}]},{"id":"bio55-u5","title":"Unit 5: Cabaran Boss SPM — Gerak Balas & Fitohormon","subtitle":"Sintesis Kertas 1 & Kertas 2 — Tropisme/Nasti, 5 Fitohormon, Mekanisme Auksin Pucuk/Akar & Aplikasi Pertanian","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Matriks Gerak Balas & Hormon","voiceCaption":"Padankan lima konsep utama Bab lima daripada gerak balas tropisme dan nasti hingga aplikasi fitohormon.","voiceScript":"[excited] Selamat tiba di Cabaran Boss SPM Bab lima! Padankan kelima-lima konsep gerak balas tumbuhan ini dengan tepat!","prompt":"Padankan konsep Bab 5 berikut dengan huraian tepatnya:","pairs":[{"id":"b55boss1","left":"Geotropisme positif akar","right":"Auksin terkumpul di bawah akar merencat sel bawah sehingga akar membengkok ke bawah"},{"id":"b55boss2","left":"Niktinasti vs Fotonasti","right":"Niktinasti (ritma sirkadian gelap petai belalang) vs Fotonasti (cahaya ros Jepun)"},{"id":"b55boss3","left":"Sitokinin dalam kultur tisu","right":"Digabung bersama auksin untuk merangsang pembentukan akar dan batang daripada kalus"},{"id":"b55boss4","left":"Asid absisik (ABA)","right":"Menutup liang stoma pada musim kemarau dan mengekalkan kedormanan biji"},{"id":"b55boss5","left":"Partenokarpi","right":"Penghasilan buah tanpa biji menggunakan auksin tanpa pendebungaan"}],"explanation":"Menggabungkan pemahaman gerak balas fizikal dan kawalan hormon melengkapkan persediaan untuk soalan KBAT Bab 5."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Eksperimen Cahaya pada Anak Benih","voiceCaption":"Ramalkan pemerhatian pada hujung pucuk dan hujung akar anak benih apabila didedahkan kepada cahaya matahari dari sebelah kanan di dalam kotak lut sinar.","voiceScript":"[curious] Soalan Praktis Sumatif lima! Anak benih ditanam di dalam medium lut sinar dan disinari cahaya matahari dari sebelah kanan. Apakah gerak balas hujung pucuk function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

          '<span id="labInteractedBadge" class="lab-interacted-pill" hidden>' + tUi("+5 XP Eksplorasi!", "+5 XP Explored!") + "</span>" +
        "</div>" +
        '<div id="conceptLabMount"></div>' +

  var heroVideoHtml = buildHeroVideoHtml(step);
  var heroMediaHtml = buildHeroMediaHtml(step);
  var biteSummaryHtml = isBite && step.summary
    ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>"
    : "";
  var biteTipHtml = isBite && step.examTip
    ? '<div class="bite-tip-strip"><strong>' + tUi("Tip SPM:", "SPM Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>"
    : "";

  var mindMapHostHtml = (!isBite && nodes.length > 0) ? '<div id="conceptMindMapHost"></div>' : "";

  var fullNotesItems = bullets.map(function (b, idx) {
    return '<li><span class="story-num-badge tabular-nums">' + (idx + 1) + "</span><span>" + escapeHtml(b) + "</span></li>";
  }).join("");
  var deepDrawerHtml = !isBite
    ? '<details class="nota-deep-drawer">' +
        "<summary>" + tUi("Nota Lengkap Buku Teks &amp; Tip SPM", "Full Textbook Notes &amp; SPM Tip") + "</summary>" +
        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"
    : "";

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
    isBite: isBite,
    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

            markInteracted: function () {}
          });

      }

      handleStepOutcome(isCorrect, step.explanation || "", Number(step.xp) || 20, btn);
    });
  });
}
