  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab06","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":6,"title":"Pembiakan Seks dalam Tumbuhan Berbunga","subtitle":"Subtopik 6.1–6.5 KSSM — Struktur Bunga (Stamen vs Karpel), Pembentukan Debunga (Tetrad) & Pundi Embrio (8 Nukleus), Pendebungaan & Persenyawaan Ganda Dua (Zigot 2n + Endosperma 3n, Video Penerangan), Perkembangan Buah/Biji Benih serta Kemandirian Biji Benih.","estimatedMinutes":35,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab06-labs.js","coverIcon":"../assets/icons/bio56-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan pembiakan seks tumbuhan berbunga kamu amat hebat!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Debunga, pundi embrio dan persenyawaan ganda dua berjaya kamu selesaikan!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak semula peranan nukleus penjana, nukleus kutub atau zigot diploid pada nota di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab enam berjaya kamu takluki sepenuhnya!"},"units":[{"id":"bio56-u1","title":"Unit 1: Struktur Bunga & Perbandingan Jantan vs Betina","subtitle":"Subtopik 6.1 — Pedunkel, Sepal, Petal, Stamen (Filamen & Anter) vs Karpel (Stigma, Stil, Ovari, Ovul) & Bunga Biseks (Video Penerangan)","iconType":"book","iconUrl":"../assets/icons/bio56-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Struktur Bunga & Video Penerangan","voiceCaption":"Tonton video penerangan bersuara mengenai struktur bunga biseks yang mempunyai stamen sebagai organ pembiakan jantan dan karpel sebagai organ pembiakan betina.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab enam: Pembiakan Seks dalam Tumbuhan Berbunga! Tonton dahulu video penerangan bersuara di bawah untuk melihat bagaimana bahagian jantan dan betina bunga bekerjasama menghasilkan biji benih! Sekuntum bunga lengkap terdiri daripada pedunkel, sepal pelindung kudup, petal berwarna cerah, serta dua organ pembiakan: stamen dan karpel! Stamen ialah organ pembiakan jantan yang mengunjur keluar dari dasar ovari dan terdiri daripada filamen serta anter yang menghasilkan debunga. Karpel ialah organ pembiakan betina di tengah bunga yang terdiri daripada stigma, stil serta ovari berisi ovul untuk menghasilkan pundi embrio! Bunga seperti lili dan bunga raya yang mempunyai kedua-dua stamen serta karpel pada bunga yang sama dipanggil bunga biseks atau hermafrodit!","title":"6.1 Struktur Bunga: Stamen vs Karpel (Jadual 6.2)","acronym":"S•K•P•O","hook":"Tonton video penerangan bersuara pembiakan bunga di bawah, kemudian klik setiap bahagian pada Pemeriksa Struktur Bunga!","mediaKey":"bio56_struktur_bunga","videoClip":{"src":"../assets/biologi-t5-bab06/video/bio56_video_pembiakan_bunga_narasi.mp4","hasNarration":true,"posterKey":"bio56_struktur_bunga","caption":"Struktur stamen dan karpel bunga serta proses pendebungaan hingga persenyawaan ganda dua."},"summary":"Bunga biseks mengandungi stamen (jantan: filamen + anter -> debunga) dan karpel (betina: stigma + stil + ovari -> pundi embrio), bersama petal, sepal serta pedunkel.","bullets":["Bahagian Jantan (Stamen) vs Betina (Karpel) (Jadual 6.2): Persamaan: kedua-duanya menghasilkan gamet dan terletak pada bunga. Perbezaan: Stamen terdiri daripada filamen dan anter, menghasilkan debunga serta mengunjur keluar dari dasar ovari; Karpel terdiri daripada stigma, stil dan ovari, menghasilkan pundi embrio serta terletak di tengah bunga.","Fungsi Sepal, Petal & Pedunkel: Pedunkel ialah tangkai bunga; sepal melindungi kudup bunga; petal berwarna cerah dan harum menarik haiwan atau serangga pendebunga (walaupun tidak menghasilkan gamet)."],"labId":"bio56_struktur_bunga_lab","labTitle":"Pemeriksa Struktur Bunga & Ovul","labProps":{"part":"stamen"},"examTip":"Soalan Praktis Sumatif 6: Mengapakah petal masih penting walaupun bukan struktur pembiakan? Kerana warna cerah dan nektar petal menarik serangga dan haiwan sebagai agen pendebungaan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Struktur Jantan vs Betina Bunga","voiceCaption":"Kelaskan enam ciri daripada Jadual enam perpuluhan dua antara Organ Jantan (Stamen) dengan Organ Betina (Karpel).","voiceScript":"[confident] Uji Jadual enam perpuluhan dua! Asingkan keenam-enam ciri bahagian pembiakan bunga ini kepada Stamen atau Karpel.","prompt":"Isihkan ciri berikut kepada Stamen (Jantan) atau Karpel (Betina):","buckets":[{"id":"jantan","label":"Stamen (Bahagian Jantan)"},{"id":"betina","label":"Karpel (Bahagian Betina)"}],"items":[{"text":"Mengandungi struktur filamen dan anter yang mengunjur keluar dari dasar ovari","bucketId":"jantan","note":"Tepat! Kedudukan ini memudahkan debunga disebarkan oleh angin atau serangga."},{"text":"Mengandungi struktur stigma, stil dan ovari di bahagian tengah bunga","bucketId":"betina","note":"Betul! Stigma berada di puncak untuk menerima debunga."},{"text":"Menghasilkan butir debunga dalam pundi debunga","bucketId":"jantan","note":"Tepat! Anter ialah tapak pembentukan debunga."},{"text":"Menghasilkan pundi embrio di dalam ovul","bucketId":"betina","note":"Betul! Ovul terletak di dalam ovari."},{"text":"Membebaskan butir debunga apabila dinding anter matang merekah","bucketId":"jantan","note":"Tepat! Proses penyebaran debunga."},{"text":"Ovarinya berkembang menjadi buah manakala ovul menjadi biji benih selepas persenyawaan","bucketId":"betina","note":"Betul! Struktur utama perkembangan buah."}],"explanation":"Jadual 6.2 membezakan Stamen (filamen & anter, hasilkan debunga, di luar dasar ovari) dengan Karpel (stigma, stil & ovari, hasilkan pundi embrio, di tengah bunga)."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Bahagian Bunga & Ovul","voiceCaption":"Padankan lima bahagian bunga atau ovul berikut dengan fungsinya yang tepat.","voiceScript":"[confident] Padankan kelima-lima struktur bunga dan ovul ini dengan fungsi biologi masing-masing!","prompt":"Padankan struktur bunga dan ovul berikut dengan peranannya:","pairs":[{"id":"b56u1m1","left":"Anter","right":"Menghasilkan debunga di dalam empat pundi debunga"},{"id":"b56u1m2","left":"Stigma","right":"Permukaan melekit yang menerima dan merembes larutan bergula untuk percambahan debunga"},{"id":"b56u1m3","left":"Petal","right":"Menarik perhatian serangga dan haiwan agen pendebungaan melalui warna cerah"},{"id":"b56u1m4","left":"Funikel & Plasenta","right":"Tangkai dan tapak pelekatan yang membekalkan nutrien kepada ovul"},{"id":"b56u1m5","left":"Mikropil","right":"Liang kecil pada hujung integumen untuk laluan tiub debunga serta air dan udara"}],"explanation":"Anter (hasil debunga), stigma (terima debunga), petal (tarik agen), funikel/plasenta (salur nutrien ke ovul) dan mikropil (laluan tiub debunga dan air semasa percambahan)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Kedudukan Stamen & Stigma","voiceCaption":"Ramalkan mengapa anter dan stigma bunga yang didebungakan oleh angin terdedah keluar berbanding bunga yang didebungakan oleh serangga.","voiceScript":"[curious] Bandingkan bunga pokok lalang yang didebungakan oleh angin dengan bunga X yang didebungakan oleh serangga! Mengapakah lalang masih mudah membiak walaupun bunganya pudar tanpa nektar?","hook":"Bezakan ciri debunga angin (kecil, licin, ringan, banyak) dengan debunga serangga (kasar, melekit)!","scenario":"Pokok lalang mempunyai kelopak kecil pudar tanpa nektar, namun filamen panjangnya terjuntai keluar dengan stigma berbulu.","prompt":"Bagaimanakah ciri struktur bunga lalang membolehkannya membiak dengan sangat mudah?","options":["Didebungakan oleh angin: anter terjuntai menghasilkan debunga kecil, licin, ringan dan sangat banyak, manakala stigma berbulu terdedah luas memerangkap debunga yang dibawa angin","Debunga lalang sangat besar, berat dan melekit untuk menarik burung kelicap","Lalang membiak tanpa sebarang debunga melalui parthenogenesis daun","Sepal lalang menghasilkan bau busuk untuk menarik kumbang"],"correctIndex":0,"proofLabId":"bio56_struktur_bunga_lab","proofState":{"part":"karpel"},"explanation":"Bunga didebungakan angin (lalang, jagung, padi) tidak memerlukan kelopak cerah atau nektar, sebaliknya mempunyai anter terjuntai dengan debunga ringan, kecil dan licin dalam kuantiti amat banyak serta stigma berbulu."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Susun Peranan Stamen Bunga Raya","voiceCaption":"Susun huraian kepentingan kedudukan stamen yang mengunjur dan mengelilingi karpel pada bunga raya.","voiceScript":"[confident] Soalan Aktiviti enam perpuluhan satu! Susun blok fakta ini untuk menjelaskan kedudukan stamen pada bunga raya.","prompt":"Susun penerangan kepentingan kedudukan stamen yang terdedah pada bunga raya:","hint":"Kaitkan kedudukan anter terdedah dengan agen pendebungaan dan stigma...","answerTokens":["Stamen mengunjur keluar dari dasar ovari dan mengelilingi stil","supaya anter mudah disentuh oleh serangga atau burung yang menghisap nektar","lalu debunga melekit dipindahkan ke stigma bunga lain oleh agen pendebungaan","bagi meningkatkan peluang pendebungaan silang dan persenyawaan"],"distractors":["supaya funikel boleh keluar menembusi petal ke luar bunga","dan menghalang debunga daripada jatuh ke dalam pundi debunga"],"explanation":"Kedudukan stamen yang menonjol memudahkan pemindahan debunga ke badan agen pendebungaan seperti serangga atau burung."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s6","voiceToneLabel":"Cabaran Unit 1: Subtopik 6.1","voiceCaption":"Pilih pernyataan tepat tentang struktur biseks hermafrodit dan fungsi integumen pada ovul.","voiceScript":"[excited] Soalan penutup Unit satu! Pilih padanan istilah yang tepat bagi bunga biseks dan struktur ovul.","prompt":"Apakah maksud tumbuhan bunga biseks (hermafrodit) dan apakah fungsi tisu nuselus serta integumen pada ovul?","options":["Bunga mempunyai kedua-dua stamen (jantan) dan karpel (betina) pada kuntum yang sama; nuselus membekalkan tisu sel induk megaspora dan integumen melindungi ovul dengan bukaan mikropil","Bunga hanya mempunyai sepal dan petal tanpa stamen; integumen menghasilkan debunga","Bunga hidup di bawah air tanpa memerlukan debunga","Stamen terletak di dalam ovari manakala karpel terletak di atas pedunkel"],"correctIndex":0,"explanation":"Bunga biseks/hermafrodit (cth. lili, bunga raya) memiliki kedua-dua stamen dan karpel pada bunga yang sama; ovul mempunyai nuselus (tisu parenkima), dua lapisan integumen dan liang mikropil."}]},{"id":"bio56-u2","title":"Unit 2: Pembentukan Debunga & Pundi Embrio","subtitle":"Subtopik 6.2 — Meiosis Sel Induk Mikrospora (Tetrad -> Nukleus Penjana & Tiub) vs Sel Induk Megaspora (3x Mitosis -> 8 Nukleus)","iconType":"atom","iconUrl":"../assets/icons/bio56-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Pembentukan Debunga & Pundi Embrio","voiceCaption":"Sel induk mikrospora diploid mengalami meiosis membentuk tetrad lalu nukleusnya bermitosis menjadi nukleus penjana dan nukleus tiub, manakala sel induk megaspora membentuk pundi embrio berlapan nukleus.","voiceScript":"[warm] Selamat datang ke Unit dua, subtopik enam perpuluhan dua: Pembentukan Debunga dan Pundi Embrio! Di dalam empat pundi debunga dalam anter, beratus-ratus sel induk mikrospora diploid dua n membahagi secara meiosis menghasilkan empat sel mikrospora haploid n yang disebut tetrad! Setiap sel dalam tetrad berkembang menjadi butir debunga, lalu nukleusnya bermitosis satu kali membentuk dua nukleus iaitu nukleus penjana dan nukleus tiub! Sementara itu, di dalam ovul, satu sel induk megaspora diploid dua n membahagi secara meiosis menghasilkan empat sel megaspora haploid n; tiga daripadanya merosot dan hanya satu berkembang! Nukleus megaspora itu kemudian bermitosis TIGA KALI menghasilkan pundi embrio dengan LAPAN nukleus: tiga sel antipodal di satu hujung, dua nukleus kutub di tengah, serta dua sel sinergid dan satu sel telur di hujung mikropil!","title":"6.2 Pembentukan Debunga (Tetrad) & Pundi Embrio (8 Nukleus)","acronym":"M•T•3M•8","hook":"Tukar tab Debunga dan Pundi Embrio pada Simulator Gametogenesis di bawah untuk mengira setiap pembahagian meiosis dan mitosis!","mediaKey":"bio56_debunga_anter","summary":"Anter: Sel induk mikrospora (2n) -meiosis-> 4 mikrospora (n, tetrad) -1x mitosis-> debunga dengan nukleus penjana + nukleus tiub. Ovul: Sel induk megaspora (2n) -meiosis-> 4 (3 merosot, 1 hidup) -3x mitosis-> 8 nukleus.","bullets":["Pembentukan Debunga (Rajah 6.3): Sel induk mikrospora (2n) bermiosis -> 4 sel mikrospora haploid (n) dipanggil tetrad -> setiap sel menjadi debunga -> nukleus bermitosis 1 kali menghasilkan 1 nukleus penjana (n) + 1 nukleus tiub (n). (Gimnosperma seperti pain dan fir menghasilkan debunga pada kon debunga).","Pembentukan Pundi Embrio (Rajah 6.6): Sel induk megaspora (2n) bermiosis -> 4 sel megaspora (n), 3 merosot dan 1 berkembang -> nukleus bermitosis 3 kali berturut-turut menghasilkan 8 nukleus haploid: 3 sel antipodal, 2 nukleus kutub (tengah), 2 sel sinergid dan 1 sel telur."],"labId":"bio56_gametogenesis_tumbuhan_sim","labTitle":"Simulator Meiosis & Mitosis Debunga vs Pundi Embrio","labProps":{"tab":"debunga"},"examTip":"Soalan lazim Kertas 1 & 2: Berapa kalikah mitosis berlaku untuk membentuk 8 nukleus dalam pundi embrio daripada 1 megaspora haploid? Jawapan: 3 kali mitosis (1 -> 2 -> 4 -> 8 nukleus)!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Proses di Anter vs di Ovul","voiceCaption":"Kelaskan enam peringkat dan struktur berikut antara Pembentukan Debunga di Anter dengan Pembentukan Pundi Embrio di Ovul.","voiceScript":"[confident] Uji ketepatan kamu membezakan gametogenesis jantan di anter dengan gametogenesis betina di ovul!","prompt":"Isihkan proses dan struktur berikut mengikut tapak pembentukannya:","buckets":[{"id":"anter","label":"Pembentukan Debunga (Anter)"},{"id":"ovul","label":"Pembentukan Pundi Embrio (Ovul)"}],"items":[{"text":"Sel induk mikrospora (2n) bermiosis membentuk empat sel haploid disebut tetrad","bucketId":"anter","note":"Tepat! Keempat-empat sel dalam tetrad berkembang menjadi debunga."},{"text":"Tiga daripada empat sel haploid hasil meiosis merosot dan hanya satu berkembang","bucketId":"ovul","note":"Betul! Satu sel megaspora berkembang menjadi pundi embrio."},{"text":"Mitosis satu kali menghasilkan satu nukleus penjana dan satu nukleus tiub","bucketId":"anter","note":"Tepat! Kedua-dua nukleus haploid ini berada di dalam debunga matang."},{"text":"Mitosis tiga kali berturutan menghasilkan lapan nukleus dalam satu pundi","bucketId":"ovul","note":"Betul! Membentuk 3 antipodal, 2 nukleus kutub, 2 sinergid dan 1 sel telur."},{"text":"Dinding kantung debunga tebal dan kalis air pecah apabila matang","bucketId":"anter","note":"Tepat! Membebaskan debunga ke udara atau ke badan serangga."},{"text":"Dilindungi oleh tisu nuselus dan dua lapisan integumen berliang mikropil","bucketId":"ovul","note":"Betul! Struktur ovul di dalam ovari."}],"explanation":"Anter (mikrospora 2n -> tetrad n -> 1x mitosis -> 2 nukleus) vs Ovul (megaspora 2n -> 4 megaspora, 3 merosot -> 3x mitosis -> 8 nukleus)."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan 8 Nukleus Pundi Embrio & Tetrad","voiceCaption":"Padankan lima komponen pundi embrio dan debunga berikut dengan bilangan atau peranannya yang tepat.","voiceScript":"[confident] Padankan kelima-lima sel dan nukleus dalam debunga serta pundi embrio ini dengan peranannya!","prompt":"Padankan komponen pundi embrio dan debunga berikut dengan identiti tepatnya:","pairs":[{"id":"b56u2m1","left":"Tiga sel antipodal","right":"Tiga nukleus yang bergerak ke hujung pundi embrio bertentangan mikropil"},{"id":"b56u2m2","left":"Dua nukleus kutub","right":"Dua nukleus di tengah pundi embrio yang akan bercantum dengan gamet jantan kedua"},{"id":"b56u2m3","left":"Dua sel sinergid & satu sel telur","right":"Tiga sel di hujung mikropil pundi embrio untuk menerima gamet jantan pertama"},{"id":"b56u2m4","left":"Nukleus penjana","right":"Akan membahagi secara mitosis di dalam tiub debunga menjadi dua gamet jantan"},{"id":"b56u2m5","left":"Nukleus tiub","right":"Mengawal pertumbuhan tiub debunga ke arah mikropil sebelum merosot"}],"explanation":"Susunan 8 nukleus pundi embrio: 3 antipodal + 2 nukleus kutub + 2 sinergid + 1 sel telur; dalam debunga pula ada nukleus penjana dan nukleus tiub."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Kepentingan Meiosis Gamet","voiceCaption":"Ramalkan akibat terhadap bilangan kromosom zigot sekiranya sel induk mikrospora dan megaspora gagal menjalankan meiosis.","voiceScript":"[curious] Soalan Praktis Formatif enam perpuluhan dua! Mengapakah proses meiosis wajib berlaku semasa pembentukan tetrad debunga dan megaspora pundi embrio?","hook":"Periksa tab Pundi Embrio dalam Simulator Gametogenesis untuk melihat bilangan kromosom haploid (n)!","scenario":"Sel induk mikrospora dan sel induk megaspora kedua-duanya bersifat diploid (2n).","prompt":"Apakah kepentingan utama pembahagian meiosis dalam pembentukan debunga dan pundi embrio?","options":["Menghasilkan sel mikrospora dan megaspora yang haploid (n) dengan separuh bilangan kromosom supaya keadaan diploid (2n) dipulihkan semasa persenyawaan serta menghasilkan variasi genetik","Menggandakan bilangan kromosom menjadi tetraploid (4n) di dalam tetrad","Menukarkan pundi embrio menjadi buah tanpa memerlukan pendebungaan","Membolehkan debunga bergerak menggunakan silia di dalam udara"],"correctIndex":0,"proofLabId":"bio56_gametogenesis_tumbuhan_sim","proofState":{"tab":"pundi"},"explanation":"Meiosis mengurangkan bilangan kromosom daripada diploid (2n) kepada haploid (n) supaya bilangan kromosom spesies kekal malar apabila gamet jantan dan sel telur bersenyawa, selain mencetuskan variasi."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Susun Pembentukan Pundi Embrio","voiceCaption":"Susun urutan langkah pembentukan lapan nukleus di dalam pundi embrio daripada satu sel induk megaspora.","voiceScript":"[confident] Susun blok jawapan berikut mengikut urutan pembentukan pundi embrio daripada sel induk megaspora hingga lapan nukleus!","prompt":"Susun urutan tepat pembentukan pundi embrio di dalam ovul:","hint":"Meiosis sel induk megaspora (2n) -> 3 merosot -> 3 kali mitosis...","answerTokens":["Sel induk megaspora diploid membahagi secara meiosis menghasilkan empat sel megaspora haploid","di mana tiga sel megaspora merosot dan hanya satu sel berkembang","lalu nukleusnya membahagi secara mitosis tiga kali berturutan menghasilkan lapan nukleus","iaitu tiga sel antipodal, dua nukleus kutub, dua sel sinergid dan satu sel telur"],"distractors":["lalu kesemua empat sel megaspora membentuk tetrad debunga","yang kesemuanya merosot selepas persenyawaan ganda dua"],"explanation":"1 sel induk megaspora (2n) -meiosis-> 4 megaspora (n) -> 3 merosot, 1 hidup -> 3 kali mitosis -> 8 nukleus (3 antipodal + 2 nukleus kutub + 2 sinergid + 1 sel telur)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s6","voiceToneLabel":"Cabaran Unit 2: Slaid Debunga & Sukrosa","voiceCaption":"Pilih tujuan penggunaan larutan sukrosa dan slaid kaca berlekuk semasa memerhatikan debunga di bawah mikroskop.","voiceScript":"[excited] Soalan penutup Unit dua daripada Aktiviti enam perpuluhan dua dan enam perpuluhan empat! Mengapakah larutan sukrosa dan slaid berlekuk digunakan semasa memerhati debunga?","prompt":"Dalam eksperimen memerhatikan percambahan debunga di bawah mikroskop cahaya, mengapakah larutan sukrosa (3% atau 10%) dan slaid kaca berlekuk digunakan berbanding air suling pada slaid rata?","options":["Larutan sukrosa membekalkan nutrien dan meniru rembesan bergula pada stigma untuk merangsang percambahan tiub debunga tanpa memecahkan sel, manakala lekukan mengelakkan debunga terpenyek","Larutan sukrosa mematikan nukleus penjana supaya tetrad boleh dikira","Air suling melarutkan kromosom dalam nukleus tiub menjadi etanol","Slaid berlekuk digunakan untuk menapis debunga angin daripada serangga"],"correctIndex":0,"explanation":"Larutan sukrosa membekalkan sumber tenaga/nutrien seperti nektar pada stigma untuk percambahan tiub debunga (air suling pula hipotonik dan boleh menyebabkan debunga pecah atau gagal bercambah), manakala lekukan slaid memberi ruang tiga dimensi kepada debunga."}]},{"id":"bio56-u3","title":"Unit 3: Pendebungaan & Persenyawaan Ganda Dua","subtitle":"Subtopik 6.3 — Percambahan Tiub Debunga, Enzim Pencerna Stil, 2 Gamet Jantan, Zigot Diploid (2n) + Endosperma Triploid (3n) & Kepentingan","iconType":"scale","iconUrl":"../assets/icons/bio56-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Tiub Debunga & Persenyawaan Ganda Dua","voiceCaption":"Apabila debunga bercambah di stigma, nukleus penjana membahagi secara mitosis membentuk dua gamet jantan yang melakukan persenyawaan ganda dua menghasilkan zigot diploid dan endosperma triploid.","voiceScript":"[warm] Selamat datang ke Unit tiga, subtopik enam perpuluhan tiga: Pendebungaan dan Persenyawaan Ganda Dua! Sebaik sahaja debunga dipindahkan ke stigma, ia bercambah membentuk tiub debunga yang memanjang ke arah ovul melalui stil dengan merembeskan enzim untuk mencernakan tisu stil! Semasa bergerak menuruni tiub debunga, nukleus penjana membahagi secara mitosis menghasilkan DUA gamet jantan haploid n! Apabila tiba di ovul dan menembusi liang mikropil, nukleus tiub merosot dan kedua-dua gamet jantan masuk ke pundi embrio untuk persenyawaan ganda dua: gamet jantan pertama mensenyawakan sel telur membentuk zigot diploid dua n; gamet jantan kedua bercantum dengan dua nukleus kutub membentuk nukleus endosperma triploid tiga n! Tisu endosperma inilah yang membekalkan nutrien kepada embrio, misalnya pada beras, gandum, barli dan jagung!","title":"6.3 Tiub Debunga & Persenyawaan Ganda Dua (2n & 3n)","acronym":"2G•2n•3n","hook":"Klik Peringkat 1 hingga 3 pada Simulator Persenyawaan Ganda Dua di bawah untuk menjejaki nukleus penjana dan kedua-dua gamet jantan!","mediaKey":"bio56_pendebungaan_serangga","summary":"Nukleus penjana bermitosis membentuk 2 gamet jantan (n): Gamet jantan 1 + Sel telur -> Zigot diploid (2n); Gamet jantan 2 + 2 Nukleus kutub -> Nukleus endosperma triploid (3n).","bullets":["Pembentukan Tiub Debunga & 2 Gamet Jantan (Rajah 6.7): Debunga di stigma bercambah membentuk tiub debunga -> hujung tiub merembes enzim mencerna tisu stil -> nukleus penjana bermitosis membentuk 2 gamet jantan (n) -> tiub menembusi mikropil dan nukleus tiub merosot.","Persenyawaan Ganda Dua (Rajah 6.9): Gamet jantan 1 (n) + Sel telur (n) -> Zigot diploid (2n). Gamet jantan 2 (n) + 2 Nukleus kutub (n + n) -> Nukleus endosperma triploid (3n).","Kepentingan Kemandirian: Zigot (2n) menurunkan maklumat genetik dan memulihkan keadaan diploid; Tisu endosperma (3n) membekalkan nutrien untuk perkembangan embrio (digunakan sepenuhnya sebelum biji matang dalam eudikot seperti kekacang & mangga; kekal tersimpan sebahagian dalam monokot seperti jagung, gandum, barli & kelapa)."],"labId":"bio56_persenyawaan_ganda_dua_sim","labTitle":"Simulator Persenyawaan Ganda Dua (Zigot 2n & Endosperma 3n)","labProps":{"stepNo":3},"examTip":"Skema Kertas 2: Sentiasa nyatakan PLOIDI dengan jelas: Zigot adalah DIPLOID (2n), manakala nukleus endosperma adalah TRIPLOID (3n) kerana terhasil daripada percantuman 1 gamet jantan (n) + 2 nukleus kutub (2n)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Kesan Stigma Rosak Akibat Kulat","voiceCaption":"Ramalkan sama ada buah dan biji benih dapat terhasil sekiranya kulat merosakkan stigma dan menghalang pembahagian nukleus penjana di dalam stil.","voiceScript":"[curious] Soalan Praktis Sumatif enam! Seekor kulat merosakkan stigma bunga sehingga menghalang percambahan debunga dan pembahagian nukleus penjana di dalam stil. Dapatkah pokok ini menghasilkan buah dan biji benih?","hook":"Jejaki kaitan nukleus penjana -> dua gamet jantan -> persenyawaan ganda dua dalam simulator!","scenario":"Serangan kulat memusnahkan tisu stigma bunga dan mengganggu pembahagian mitosis nukleus penjana di dalam tiub debunga.","prompt":"Adakah buah dan biji benih dapat terhasil, dan mengapakah sedemikian?","options":["Tidak dapat terhasil kerana debunga gagal bercambah membentuk tiub debunga dan nukleus penjana gagal bermitosis menghasilkan dua gamet jantan, menyebabkan persenyawaan ganda dua tidak berlaku","Buah dan biji benih masih terhasil kerana nukleus tiub menggantikan kedua-dua gamet jantan","Endosperma triploid tetap terhasil daripada sel antipodal tanpa gamet jantan","Stil akan berubah menjadi biji benih tanpa persenyawaan"],"correctIndex":0,"proofLabId":"bio56_persenyawaan_ganda_dua_sim","proofState":{"stepNo":2},"explanation":"Tanpa stigma yang sihat dan pembahagian mitosis nukleus penjana menjadi dua gamet jantan, tiub debunga dan persenyawaan ganda dua tidak berlaku sehingga ovul dan ovari gagal berkembang menjadi biji benih serta buah."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Hasil Persenyawaan Ganda Dua","voiceCaption":"Padankan lima struktur dan proses persenyawaan ganda dua berikut dengan ploidi atau peranannya.","voiceScript":"[confident] Padankan kelima-lima item persenyawaan ganda dua ini dengan ploidi dan peranannya yang tepat!","prompt":"Padankan proses dan struktur persenyawaan berikut dengan huraian tepatnya:","pairs":[{"id":"b56u3m1","left":"Gamet jantan 1 (n) + Sel telur (n)","right":"Membentuk zigot diploid (2n) yang berkembang menjadi embrio"},{"id":"b56u3m2","left":"Gamet jantan 2 (n) + 2 Nukleus kutub","right":"Membentuk nukleus endosperma triploid (3n) pembekal nutrien embrio"},{"id":"b56u3m3","left":"Enzim di hujung tiub debunga","right":"Mencernakan tisu stil bagi memudahkan tiub debunga memanjang ke ovul"},{"id":"b56u3m4","left":"Nukleus tiub selepas tiba di mikropil","right":"Merosot supaya kedua-dua gamet jantan boleh masuk ke pundi embrio"},{"id":"b56u3m5","left":"Endosperma dalam eudikot vs monokot","right":"Habis digunakan sebelum biji matang (eudikot) vs kekal tersimpan (monokot)"}],"explanation":"Dua persenyawaan serentak menghasilkan zigot (2n) dan nukleus endosperma (3n) — ciri unik tumbuhan berbunga (Angiosperma)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Zigot Diploid vs Endosperma Triploid","voiceCaption":"Kelaskan enam ciri dan peranan berikut antara laluan Pembentukan Zigot Diploid dengan Pembentukan Endosperma Triploid.","voiceScript":"[confident] Asingkan keenam-enam fakta ini kepada laluan Pembentukan Zigot Diploid atau laluan Pembentukan Endosperma Triploid!","prompt":"Isihkan fakta persenyawaan ganda dua berikut mengikut hasil yang terbentuk:","buckets":[{"id":"zigot","label":"Zigot Diploid (2n)"},{"id":"endo","label":"Endosperma Triploid (3n)"}],"items":[{"text":"Percantuman satu gamet jantan haploid (n) dengan satu sel telur haploid (n)","bucketId":"zigot","note":"Tepat! Memulihkan keadaan diploid tumbuhan."},{"text":"Percantuman satu gamet jantan (n) dengan dua nukleus kutub (2n)","bucketId":"endo","note":"Betul! Menghasilkan nukleus bernombor kromosom 3n."},{"text":"Menurunkan maklumat genetik daripada induk ke generasi berikutnya","bucketId":"zigot","note":"Tepat! Membentuk embrio anak benih baharu."},{"text":"Menyimpan kanji dan nutrien untuk perkembangan embrio seperti dalam gandum dan jagung","bucketId":"endo","note":"Betul! Sumber makanan semasa perkembangan embrio dan percambahan."},{"text":"Membahagi membentuk sel besar (penggantung) dan sel kecil (embrio)","bucketId":"zigot","note":"Tepat! Peringkat awal perkembangan biji benih."},{"text":"Membolehkan embrio bertahan lama dalam biji benih monokot apabila keadaan tidak sesuai","bucketId":"endo","note":"Betul! Simpanan nutrien jangka panjang."}],"explanation":"Persenyawaan ganda dua menjana dua struktur berbeza: zigot 2n (membentuk embrio) dan tisu endosperma 3n (membekalkan makanan kepada embrio)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Susun Laluan Tiub Debunga ke Mikropil","voiceCaption":"Susun urutan tepat proses selepas pendebungaan sehingga berlakunya persenyawaan ganda dua.","voiceScript":"[confident] Susun blok pernyataan ini mengikut urutan betul daripada debunga mendarat di stigma hingga persenyawaan ganda dua!","prompt":"Susun urutan peristiwa dari percambahan debunga hingga persenyawaan ganda dua:","hint":"Tiub debunga -> mitosis nukleus penjana -> mikropil -> persenyawaan...","answerTokens":["Debunga di stigma bercambah membentuk tiub debunga menuruni stil","sambil nukleus penjana membahagi secara mitosis membentuk dua gamet jantan","lalu tiub debunga menembusi mikropil dan nukleus tiub merosot","supaya satu gamet mensenyawakan sel telur (2n) dan satu lagi bersama nukleus kutub (3n)"],"distractors":["sambil nukleus tiub membahagi tiga kali membentuk lapan sel sinergid","dan semua tiga sel antipodal berkembang menjadi kulit biji testa"],"explanation":"Percambahan debunga -> pembentukan 2 gamet jantan secara mitosis daripada nukleus penjana -> penembusan mikropil -> persenyawaan ganda dua (2n & 3n)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s6","voiceToneLabel":"Cabaran Unit 3: Eksperimen Sukrosa vs Air","voiceCaption":"Ramalkan keputusan apabila sekumpulan murid menggunakan air suling menggantikan larutan sukrosa sepuluh peratus dalam slaid percambahan debunga.","voiceScript":"[excited] Soalan penutup Unit tiga daripada Aktiviti enam perpuluhan empat! Apakah yang berlaku jika murid menitiskan air suling dan bukannya larutan sukrosa sepuluh peratus ke atas debunga?","prompt":"Dalam Aktiviti 6.4, jika murid menggunakan air suling sebagai ganti kepada larutan sukrosa 10%, apakah keputusan yang akan diperhatikan selepas 20 minit?","options":["Debunga tidak bercambah membentuk tiub debunga (atau membengkak dan pecah akibat osmosis air berlebihan) kerana ketiadaan bekalan nutrien gula","Tiub debunga tumbuh dua kali lebih panjang dan menghasilkan tiga gamet jantan","Pewarna aseto-karmin menukarkan air suling menjadi endosperma triploid","Nukleus penjana mengalami meiosis membentuk lapan nukleus"],"correctIndex":0,"explanation":"Debunga memerlukan larutan gula (seperti rembesan stigma atau larutan sukrosa 10%) sebagai sumber nutrien dan medium osmosis sesuai untuk bercambah membentuk tiub debunga."}]},{"id":"bio56-u4","title":"Unit 4: Perkembangan Biji Benih, Buah & Kemandirian","subtitle":"Subtopik 6.4–6.5 — Penggantung, Plumul/Radikel/Kotiledon, Perikarpa (Ekso/Meso/Endokarpa), 4 Jenis Buah & Ciri Kemandirian Biji Benih","iconType":"crown","iconUrl":"../assets/icons/bio56-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Ovul -> Biji Benih & Ovari -> Buah","voiceCaption":"Selepas persenyawaan ganda dua, zigot membentuk penggantung dan embrio, ovul menjadi biji benih berlapik testa daripada integumen, manakala ovari menjadi buah berperikarpa.","voiceScript":"[warm] Selamat datang ke Unit empat, merangkumi subtopik enam perpuluhan empat dan enam perpuluhan lima! Selepas persenyawaan ganda dua, zigot bermitosis membentuk dua sel: sel besar menjadi penggantung yang menambat embrio pada dinding pundi embrio, dan sel kecil menjadi embrio terdiri daripada plumul, radikel serta kotiledon! Sementara itu, ovul berkembang menjadi biji benih dengan dua lapisan integumen bertukar menjadi kulit biji iaitu testa yang keras dan kalis air! Ovari pula berkembang menjadi buah, dinding ovari menjadi perikarpa yang terdiri daripada tiga lapisan iaitu eksokarpa di luar, mesokarpa yang berjus di tengah dan endokarpa di dalam, manakala stigma dan stil merosot meninggalkan parut! Kenali juga empat jenis buah KSSM: buah ringkas seperti kacang pis, buah agregat seperti raspberi, buah berganda seperti nanas dan buah aksesori seperti epal!","title":"6.4–6.5 Perkembangan Embrio, Buah, 4 Jenis Buah & Kemandirian Biji","acronym":"E•M•E•T","hook":"Klik 4 jenis buah pada Makmal Buah & Biji Benih di bawah untuk membezakan kacang pis, raspberi, nanas dan epal!","mediaKey":"bio56_buah_biji_benih","summary":"Zigot -> penggantung + embrio (plumul, radikel, kotiledon); Ovul -> biji benih (integumen -> testa); Ovari -> buah (dinding ovari -> perikarpa: eksokarpa, mesokarpa, endokarpa).","bullets":["Perkembangan Embrio & Biji Benih (Rajah 6.10 & 6.11): Nukleus endosperma (3n) membahagi membentuk tisu endosperma. Zigot membentuk sel besar (penggantung penambat embrio) dan sel kecil (embrio: plumul menjadi pucuk, radikel menjadi akar, kotiledon menyimpan/memindah nutrien). Integumen menjadi dua lapisan kulit biji (testa).","Perkembangan Buah & 4 Jenis Buah: Ovari -> buah; dinding ovari -> perikarpa (eksokarpa pelindung luar, mesokarpa berisi, endokarpa dalam). Jenis buah: Ringkas (kacang pis), Agregat (raspberi), Berganda (nanas) & Aksesori (epal).","5 Kepentingan Biji Benih (Rajah 6.12): Mengandungi embrio, ada endosperma/kotiledon untuk tenaga percambahan, testa keras kalis air elak kerosakan, boleh menjadi dorman (simpan lama) dan ringan/berspan mudah disebar untuk mengelakkan persaingan."],"labId":"bio56_biji_buah_lab","labTitle":"Makmal Transformasi Bunga ke Buah & 4 Jenis Buah","labProps":{"fruit":"ringkas"},"examTip":"Skema Kertas 2: Padanan tepat selepas persenyawaan — Ovari -> Buah; Dinding ovari -> Perikarpa; Ovul -> Biji benih; Integumen -> Testa (kulit biji); Zigot -> Embrio."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Struktur Bunga dengan Buah","voiceCaption":"Padankan lima bahagian bunga selepas persenyawaan dengan struktur biji benih atau buah yang terbentuk daripadanya.","voiceScript":"[confident] Uji ketepatan kamu memadankan bahagian asal bunga dengan struktur biji benih dan buah yang terhasil!","prompt":"Padankan struktur asal bunga selepas persenyawaan dengan hasil perkembangannya:","pairs":[{"id":"b56u4m1","left":"Ovul","right":"Berkembang menjadi biji benih di dalam buah"},{"id":"b56u4m2","left":"Integumen","right":"Menjadi dua lapisan kulit biji (testa) pelindung embrio"},{"id":"b56u4m3","left":"Ovari & Dinding ovari","right":"Berkembang menjadi buah serta perikarpa (eksokarpa, mesokarpa, endokarpa)"},{"id":"b56u4m4","left":"Sel besar hasil mitosis zigot","right":"Penggantung yang menambat embrio pada dinding pundi embrio"},{"id":"b56u4m5","left":"Plumul & Radikel pada embrio","right":"Plumul berkembang menjadi pucuk manakala radikel menjadi akar"}],"explanation":"Ovul -> biji benih; integumen -> testa; ovari -> buah; dinding ovari -> perikarpa; zigot -> penggantung + embrio (plumul, radikel, kotiledon)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih 4 Jenis Buah & Ciri Biji Benih","voiceCaption":"Kelaskan enam fakta perkembangan buah dan ciri kemandirian biji benih berikut antara Struktur Buah dengan Kepentingan Biji Benih.","voiceScript":"[confident] Asingkan keenam-enam fakta ini kepada Perkembangan Buah atau Ciri Kemandirian Biji Benih!","prompt":"Isihkan pernyataan berikut mengikut kategorinya yang betul:","buckets":[{"id":"buah","label":"Perkembangan & Jenis Buah"},{"id":"biji","label":"Ciri Kemandirian Biji Benih"}],"items":[{"text":"Kacang pis (ringkas), raspberi (agregat), nanas (berganda) dan epal (aksesori)","bucketId":"buah","note":"Tepat! Empat kategori buah mengikut asal karpel/ovari bunga."},{"text":"Testa yang kuat, keras dan kalis air melindungi embrio daripada rosak","bucketId":"biji","note":"Betul! Melindungi daripada serangan patogen dan kerosakan fizikal."},{"text":"Dinding ovari menjadi perikarpa terdiri daripada eksokarpa, mesokarpa dan endokarpa","bucketId":"buah","note":"Tepat! Eksokarpa luar melindungi buah daripada kecederaan."},{"text":"Keadaan dorman membolehkan biji benih disimpan dalam jangka masa yang lama","bucketId":"biji","note":"Betul! Menunggu keadaan suhu, air dan udara yang sesuai."},{"text":"Stigma dan stil merosot meninggalkan satu parut pada dinding ovari","bucketId":"buah","note":"Tepat! Kesan bahagian bunga layu selepas persenyawaan."},{"text":"Ringan serta bertisu berspan supaya mudah disebarkan bagi mengelakkan persaingan","bucketId":"biji","note":"Betul! Membantu penyebaran melalui angin atau air."}],"explanation":"Buah (perikarpa: eksokarpa, mesokarpa, endokarpa + 4 jenis buah) melindungi dan menyebar biji benih, manakala biji benih (testa, endosperma/kotiledon, struktur dorman) menjamin kemandirian spesies."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Penyimpanan Biji Benih Kacang Panjang","voiceCaption":"Ramalkan cara penyimpanan terbaik oleh pekebun supaya biji benih kacang panjang yang matang kekal dorman dan tahan lama.","voiceScript":"[curious] Soalan Praktis Sumatif enam! Encik Suresh mengeringkan biji benih kacang panjang untuk ditanam pada musim hadapan. Apakah keadaan penyimpanan terbaik agar biji benih kekal dorman dan tidak berkulat?","hook":"Fikirkan faktor yang merangsang percambahan (air, oksigen, suhu sesuai) dan faktor yang mengekalkan kedormanan!","scenario":"Seorang pekebun sayur mengeringkan biji benih kacang panjang yang matang dan mahu menyimpannya selama lapan bulan sebelum disemai.","prompt":"Bagaimanakah kaedah penyimpanan terbaik supaya biji benih tersebut kekal hidup dan tahan lama?","options":["Simpan di dalam bekas kedap udara yang kering, sejuk dan gelap untuk mengekalkan keadaan dorman serta menghalang pertumbuhan kulat dan percambahan awal","Rendam di dalam air paip suam di bawah cahaya matahari terik","Simpan di dalam tanah lembap bersama baja NPK","Kupas semua lapisan testa sebelum disimpan di dalam balang basah"],"correctIndex":0,"proofLabId":"bio56_biji_buah_lab","proofState":{"fruit":"ringkas"},"explanation":"Pengeringan menurunkan kandungan air supaya enzim dalam biji benih tidak aktif (kekal dorman), manakala bekas kedap udara di tempat sejuk serta kering mencegah serangan kulat/bakteria."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Susun Keunggulan Biji Benih vs Aseks","voiceCaption":"Susun alasan mengapa pembiakan seks menggunakan biji benih menghasilkan variasi genetik lebih baik berbanding pembiakan aseks.","voiceScript":"[confident] Soalan Praktis Formatif enam perpuluhan lima! Susun jawapan berikut untuk menjelaskan kelebihan pembiakan seks berbanding pembiakan aseks.","prompt":"Susun huraian kelebihan pembiakan seks melalui biji benih berbanding pembiakan aseks:","hint":"Gabungkan konsep meiosis, persenyawaan rawak dan variasi genetik...","answerTokens":["Pembiakan seks melibatkan meiosis dan persenyawaan antara gamet dua induk","yang menghasilkan variasi genetik dalam kalangan anak benih","supaya spesies lebih berupaya menyesuaikan diri dengan perubahan persekitaran atau penyakit","berbanding pembiakan aseks yang menghasilkan klon serupa secara genetik"],"distractors":["kerana pembiakan aseks tidak menggunakan pembahagian sel mitosis langsung","dan semua biji benih sentiasa tidak mempunyai testa serta endosperma"],"explanation":"Pembiakan seks menggabungkan bahan genetik daripada induk melalui meiosis dan persenyawaan, mewujudkan variasi genetik yang meningkatkan daya tahan terhadap penyakit dan perubahan iklim."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Unit 4: Kesan Eksokarpa & Rumah Kaca","voiceCaption":"Pilih cadangan terbaik bagi mengatasi masalah buah strawberi sedikit di dalam rumah kaca tertutup yang kekurangan serangga pendebunga.","voiceScript":"[excited] Soalan Minda Abad ke-21 Praktis Sumatif enam! Pokok strawberi di rumah kaca Encik Samad kurang berbuah kerana ketiadaan serangga pendebunga. Apakah cadangan biologi terbaik?","prompt":"Encik Samad menanam strawberi di dalam rumah kaca tertutup bersuhu 18°C tetapi buah yang terhasil amat sedikit kerana kekurangan serangga pendebunga. Apakah cadangan paling berkesan?","options":["Memperkenalkan koloni serangga pendebunga seperti lebah kelulut atau lebah madu ke dalam rumah kaca (atau melakukan pendebungaan berbantu menggunakan berus lembut)","Memotong kesemua petal dan stamen supaya ovari menjadi lebih besar","Meningkatkan suhu rumah kaca kepada 45°C supaya embrio menjadi dorman","Menyembur racun serangga setiap hari ke atas bunga strawberi"],"correctIndex":0,"explanation":"Melepaskan lebah pendebunga (seperti lebah madu/kelulut) ke dalam rumah kaca atau menjalankan pendebungaan manual membolehkan debunga dipindahkan ke stigma supaya persenyawaan ganda dua berlaku dan buah terbentuk."}]},{"id":"bio56-u5","title":"Unit 5: Cabaran Boss SPM — Pembiakan Seks Tumbuhan Berbunga","subtitle":"Sintesis Kertas 1 & Kertas 2 — Stamen/Karpel, Pembentukan Debunga & Pundi Embrio, Persenyawaan Ganda Dua serta Buah & Biji Benih","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Padanan Teras Pembiakan Bunga","voiceCaption":"Padankan lima konsep kritikal daripada keseluruhan Bab enam dengan jawapan tepatnya.","voiceScript":"[excited] Selamat tiba di Cabaran Boss SPM Bab enam! Padankan kelima-lima konsep pembiakan seks tumbuhan berbunga ini dengan tepat!","prompt":"Padankan istilah Bab 6 dengan huraian tepatnya:","pairs":[{"id":"b56boss1","left":"Tetrad","right":"Empat sel mikrospora haploid hasil meiosis sel induk mikrospora dalam anter"},{"id":"b56boss2","left":"3 kali mitosis megaspora","right":"Menghasilkan pundi embrio dengan 8 nukleus (3 antipodal, 2 kutub, 2 sinergid, 1 telur)"},{"id":"b56boss3","left":"Persenyawaan ganda dua","right":"Menghasilkan zigot diploid (2n) dan nukleus endosperma triploid (3n)"},{"id":"b56boss4","left":"Penggantung","right":"Terhasil daripada sel besar zigot untuk menambat embrio pada pundi embrio"},{"id":"b56boss5","left":"Nanas, Raspberi & Epal","right":"Contoh buah berganda, buah agregat dan buah aksesori"}],"explanation":"Penguasaan istilah tetrad, 8 nukleus pundi embrio, ploidi 2n/3n dan jenis buah menjadi teras pemarkahan Bab 6."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Analisis Keadaan Biji Benih","voiceCaption":"Ramalkan perbezaan antara biji benih eudikot seperti mangga dengan biji benih monokot seperti jagung dari segi penggunaan tisu endosperma.","voiceScript":"[curious] Soalan sintesis Kertas dua! Apakah perbezaan nasib tisu endosperma triploid antara biji benih tumbuhan eudikot dengan tumbuhan monokot?","hook":"Bandingkan kacang/mangga (eudikot) dengan jagung/gandum/kelapa (monokot)!","scenario":"Selepas persenyawaan ganda dua, nukleus endosperma triploid (3n) berkembang menjadi tisu endosperma yang membekalkan nutrien kepada embrio.","prompt":"Bagaimanakah penggunaan tisu endosperma berbeza antara biji benih eudikot dengan kebanyakan biji benih monokot?","options":["Dalam eudikot (kekacang, mangga, sawi), tisu endosperma digunakan sepenuhnya oleh embrio sebelum biji matang; dalam monokot (jagung, gandum, barli, kelapa), sebahagian besar endosperma kekal tersimpan untuk digunakan semasa percambahan","Tumbuhan monokot tidak mengalami persenyawaan ganda dua dan tiada tisu endosperma","Tumbuhan eudikot mempunyai endosperma tetraploid (4n) manakala monokot adalah haploid (n)","Dalam monokot, endosperma berubah menjadi eksokarpa buah sebelum persenyawaan"],"correctIndex":0,"proofLabId":"bio56_persenyawaan_ganda_dua_sim","proofState":{"stepNo":3},"explanation":"Dalam biji benih eudikot, nutrien endosperma diserap ke dalam kotiledon sebelum biji matang; dalam monokot, sebahagian besar endosperma kekal tersimpan bagi membekalkan tenaga semasa percambahan."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Isih Sebelum vs Selepas Persenyawaan","voiceCaption":"Asingkan enam struktur dan proses berikut antara peringkat Sebelum Persenyawaan dengan peringkat Selepas Persenyawaan.","voiceScript":"[confident] Pusingan ketiga Boss! Asingkan keenam-enam struktur dan peristiwa ini mengikut fasanya sebelum atau selepas persenyawaan ganda dua!","prompt":"Isihkan struktur dan peristiwa berikut mengikut fasa pembiakan:","buckets":[{"id":"sblm","label":"Sebelum Persenyawaan"},{"id":"slps","label":"Selepas Persenyawaan"}],"items":[{"text":"Pembentukan tetrad mikrospora dan pundi embrio berlapan nukleus","bucketId":"sblm","note":"Tepat! Penyediaan gamet jantan dan pundi embrio."},{"text":"Integumen bertukar menjadi testa dan dinding ovari menjadi perikarpa buah","bucketId":"slps","note":"Betul! Perkembangan biji benih dan buah selepas persenyawaan."},{"text":"Nukleus penjana bermitosis menjadi dua gamet jantan dalam tiub debunga","bucketId":"sblm","note":"Tepat! Berlaku semasa tiub debunga memanjang ke mikropil."},{"text":"Zigot bermitosis membentuk penggantung dan embrio (plumul, radikel, kotiledon)","bucketId":"slps","note":"Betul! Selepas gamet jantan 1 mensenyawakan sel telur."},{"text":"Stigma merembes larutan bergula dan tiub debunga mencerna tisu stil","bucketId":"sblm","note":"Tepat! Langkah persediaan sebelum penembusan ovul."},{"text":"Nukleus endosperma triploid membahagi membentuk tisu simpanan makanan","bucketId":"slps","note":"Betul! Melitupi dan membekalkan nutrien kepada embrio."}],"explanation":"Membezakan peristiwa pra-persenyawaan (gametogenesis & tiub debunga) daripada pasca-persenyawaan (zigot -> embrio, ovul -> biji benih, ovari -> buah) ialah kemahiran wajib Kertas 2."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Kiraan Bilangan Kromosom","voiceCaption":"Tentukan bilangan kromosom di dalam sel daun, butir debunga dan tisu endosperma sekiranya sel induk megaspora mempunyai dua puluh empat kromosom.","voiceScript":"[excited] Soalan pengiraan ploidi kegemaran peperiksaan SPM! Jika sel induk megaspora diploid mempunyai dua puluh empat kromosom, berapakah kromosom dalam debunga dan endosperma?","prompt":"Sel induk megaspora tumbuhan jagung mengandungi 24 kromosom (2n = 24). Berapakah bilangan kromosom di dalam nukleus penjana debunga (n), zigot (2n) dan sel tisu endosperma (3n)?","options":["Nukleus penjana = 12, Zigot = 24, Sel endosperma = 36","Nukleus penjana = 24, Zigot = 48, Sel endosperma = 72","Nukleus penjana = 12, Zigot = 12, Sel endosperma = 24","Nukleus penjana = 6, Zigot = 24, Sel endosperma = 48"],"correctIndex":0,"explanation":"Jika 2n = 24, maka n = 12 (nukleus penjana/gamet jantan), zigot 2n = 24 dan tisu endosperma 3n = 3 x 12 = 36."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Huraian Kepentingan Biji Benih","voiceCaption":"Susun rumusan lengkap lima ciri yang menjadikan biji benih sangat penting untuk kemandirian tumbuhan berbunga.","voiceScript":"[confident] Susun blok jawapan esei ini bagi merumuskan kepentingan biji benih untuk kemandirian spesies tumbuhan berbunga!","prompt":"Susun huraian lengkap ciri-ciri biji benih yang menjamin kemandirian tumbuhan:","hint":"Gabungkan embrio, endosperma/kotiledon, testa, dorman dan penyebaran...","answerTokens":["Biji benih mengandungi embrio yang dilindungi oleh testa keras dan kalis air","serta mempunyai endosperma atau kotiledon yang membekalkan tenaga semasa percambahan","selain keupayaan menjadi struktur dorman untuk disimpan lama","dan ciri ringan atau berspan bagi memudahkan penyebaran untuk mengelakkan persaingan"],"distractors":["dan mempunyai kon debunga bersisik untuk menjalankan fotosintesis","serta mengekalkan nukleus tiub bagi menghasilkan buah tanpa biji"],"explanation":"Lima tonggak Rajah 6.12: Embrio -> sumber nutrien (endosperma/kotiledon) -> testa kalis air -> struktur dorman -> ciri penyebaran mengelakkan persaingan."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Sintesis Penuh Bab 6","voiceCaption":"Pilih gabungan fakta yang sepenuhnya tepat merangkumi struktur bunga, gametogenesis, persenyawaan ganda dua dan perkembangan buah.","voiceScript":"[excited] Soalan terakhir Cabaran Boss Bab enam! Pilih jawapan yang seratus peratus tepat!","prompt":"Antara kombinasi fakta Bab 6 berikut, manakah yang BETUL kesemuanya?","options":["Stamen = filamen + anter | 3x mitosis megaspora = 8 nukleus | Zigot (2n) + Endosperma (3n) | Dinding ovari -> perikarpa","Karpel = filamen + stigma | 1x mitosis megaspora = tetrad | Endosperma adalah diploid (2n) | Integumen -> perikarpa","Nukleus tiub hasilkan 2 gamet jantan | 3 antipodal di mikropil | Ovul menjadi buah | Epal ialah buah berganda","Debunga angin berat dan melekit | Kon pain ialah bunga biseks | Penggantung ialah tisu triploid | Testa berasal dari stil"],"correctIndex":0,"explanation":"Tahniah! Semua fakta dalam pilihan pertama tepat sepenuhnya mengikut KSSM Biologi Tingkatan 5 Bab 6."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

        });

        });

        });

        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),

        });

        });

          html: titleMiniHtml + parts.labHtml
        });

    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({

      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {

        });

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
    isBite: isBite,
    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
