  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab07","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":7,"title":"Penyesuaian Tumbuhan pada Habitat Berlainan","subtitle":"Subtopik 7.1 KSSM — Terarium, Pengelasan 4 Habitat (Mesofit, Hidrofit, Halofit & Xerofit), Halofit Pokok Bakau (Hidatod, Pneumatofor & Sap Akar Hipertonik), Hidrofit Terapung (Teratai Aerenkima) vs Tenggelam (Elodea) serta Xerofit (Kaktus & Lidah Buaya).","estimatedMinutes":28,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab07-labs.js","coverIcon":"../assets/icons/bio57-u1.jpg","editionBadge":"Edisi Simulasi Interaktif & Makmal KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan kamu tentang penyesuaian tumbuhan pada empat habitat berbeza amat mantap!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Mesofit, halofit bakau, hidrofit teratai dan xerofit gurun berjaya kamu takluki!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula peranan hidatod, pneumatofor, tisu aerenkima atau stoma terbenam di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab tujuh berjaya kamu tamatkan sepenuhnya!"},"units":[{"id":"bio57-u1","title":"Unit 1: Pengelasan Empat Habitat & Model Terarium","subtitle":"Subtopik 7.1 — Adaptasi Struktur Daun/Batang/Akar, Terarium serta Pengelasan Mesofit, Hidrofit, Halofit & Xerofit","iconType":"map","iconUrl":"../assets/icons/bio57-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"4 Kelas Habitat & Terarium","voiceCaption":"Tumbuhan dikelaskan mengikut habitat kepada mesofit, hidrofit, halofit dan xerofit dengan penyesuaian unik pada daun, batang serta akar.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab tujuh: Penyesuaian Tumbuhan pada Habitat Berlainan! Adaptasi ialah penyesuaian organisma terhadap persekitaran demi kemandirian spesies yang dapat diperhatikan pada bentuk daun, akar dan batang. Mengikut Rajah tujuh perpuluhan satu, tumbuhan dikelaskan kepada empat kumpulan: pertama, Mesofit yang hidup di kawasan tidak terlalu kering dan tidak terlalu berair dengan bekalan air mencukupi, seperti pokok mangga, bunga raya dan getah; kedua, Hidrofit yang hidup di habitat berair secara terapung atau tenggelam seperti teratai dan Elodea; ketiga, Halofit di paya muara kaya garam seperti pokok bakau; dan keempat, Xerofit di gurun panas dan kering seperti kaktus dan kurma! Terarium kaca pula memelihara tumbuhan kecil seperti sukulen dan lumut dengan kitaran air semula jadi tertutup!","title":"7.1 Pengelasan Tumbuhan Mengikut Habitat & Terarium","acronym":"M•H•H•X","hook":"Klik setiap satu daripada 4 habitat pada Makmal Empat Habitat di bawah untuk membandingkan contoh dan ciri penyesuaiannya!","mediaKey":"bio57_terarium_habitat","videoClip":{"src":"../assets/biologi-t5-bab07/video/bio57_video_penyesuaian_tumbuhan_narasi.mp4","hasNarration":true,"posterKey":"bio57_terarium_habitat","caption":"Video Penerangan Bersuara (BM): Penyesuaian struktur hidrofit (aerenkima), halofit (pneumatofor) dan xerofit (daun berduri & kutikel tebal)"},"summary":"4 kelas tumbuhan mengikut habitat: Mesofit (sederhana), Hidrofit (berair), Halofit (paya masin kurang oksigen) dan Xerofit (gurun panas & kering).","bullets":["4 Pengelasan Habitat (Rajah 7.1): Mesofit (air mencukupi: mangga, bunga raya, pokok getah); Hidrofit (berair terapung/tenggelam: teratai, Elodea sp.); Halofit (paya muara kaya garam & kurang oksigen: pokok bakau); Xerofit (gurun panas & air minimum: kaktus, pokok kurma).","Terarium: Gabungan 'tera' (tumbuhan) dan 'rium' (bekas kaca) menggunakan batu kecil, arang, tanah, sukulen, kaktus dan lumut secara tertutup supaya kitaran air semula jadi kekal tanpa kerap disiram."],"labId":"bio57_empat_habitat_lab","labTitle":"Pembanding 4 Kelas Habitat Tumbuhan (Rajah 7.1)","labProps":{"hType":"mesofit"},"examTip":"Skema S.P.M.: Kenal pasti keempat-empat kelas dengan tepat apabila diberi gambar atau lokasi habitat (muara masin -> halofit; kolam/tasik -> hidrofit; gurun -> xerofit; kebun/hutan biasa -> mesofit)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 4 Kelas Habitat Tumbuhan","voiceCaption":"Kelaskan enam spesies dan deskripsi habitat berikut antara Mesofit/Hidrofit dengan Halofit/Xerofit.","voiceScript":"[confident] Uji kebolehan kamu mengelas tumbuhan mengikut habitatnya! Asingkan keenam-enam item berikut.","prompt":"Isihkan spesies dan habitat berikut ke dalam kumpulan yang tepat:","buckets":[{"id":"mh","label":"Mesofit & Hidrofit"},{"id":"hx","label":"Halofit & Xerofit"}],"items":[{"text":"Pokok mangga, bunga raya dan pokok getah di tanah bekalan air mencukupi","bucketId":"mh","note":"Tepat! Tumbuhan daratan sederhana dikenali sebagai mesofit."},{"text":"Pokok teratai dan Elodea sp. yang hidup di dalam atau di permukaan air","bucketId":"mh","note":"Betul! Tumbuhan akuatik dikenali sebagai hidrofit."},{"text":"Pokok bakau di muara sungai yang kaya kandungan garam dan lumpur kurang oksigen","bucketId":"hx","note":"Tepat! Tumbuhan paya masin ialah halofit."},{"text":"Pokok kaktus, pokok kurma dan lidah buaya di kawasan gurun panas dan kering","bucketId":"hx","note":"Betul! Tumbuhan habitat kering ekstrem ialah xerofit."},{"text":"Tumbuhan yang mengandungi tisu aerenkima beruang udara atau daun tenggelam halus","bucketId":"mh","note":"Tepat! Adaptasi khas hidrofit."},{"text":"Tumbuhan yang mempunyai hidatod penyingkir garam atau daun berduri pengumpul embun","bucketId":"hx","note":"Betul! Masing-masing ciri halofit dan xerofit."}],"explanation":"Mesofit (habitat sederhana), Hidrofit (berair), Halofit (paya masin) dan Xerofit (gurun kering)."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan 4 Habitat & Cabaran Utama","voiceCaption":"Padankan empat kelas tumbuhan dan terarium berikut dengan cabaran atau ciri persekitarannya.","voiceScript":"[confident] Padankan kelima-lima konsep habitat tumbuhan ini dengan penerangannya yang tepat!","prompt":"Padankan kelas tumbuhan dan istilah berikut dengan huraiannya:","pairs":[{"id":"b57u1m1","left":"Mesofit","right":"Habitat daratan sederhana yang tidak terlalu kering dan tidak terlalu berair"},{"id":"b57u1m2","left":"Hidrofit","right":"Habitat berair sama ada terapung di permukaan atau tenggelam sepenuhnya"},{"id":"b57u1m3","left":"Halofit","right":"Muara sungai kaya garam, tanah lembut berlumpur dan rendah oksigen"},{"id":"b57u1m4","left":"Xerofit","right":"Kawasan gurun bersuhu sangat panas dengan taburan hujan sangat minimum"},{"id":"b57u1m5","left":"Terarium","right":"Bekas kaca tertutup dengan kitaran air semula jadi untuk sukulen dan lumut"}],"explanation":"Setiap habitat memaksa tumbuhan mengembangkan ciri daun, batang dan akar khusus untuk pertukaran gas, sokongan, air dan fotosintesis."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Fungsi Penutup Kaca Terarium","voiceCaption":"Ramalkan mengapa bekas kaca terarium ditutup rapat dengan arang dan batu kecil di bahagian bawahnya.","voiceScript":"[curious] Cuba fikirkan prinsip sains di sebalik terarium! Mengapakah bekas kaca terarium ditutup rapat sedangkan tumbuhan memerlukan bekalan air secara berterusan?","hook":"Ingat konsep kondensasi wap air di dinding kaca dalam ekosistem tertutup!","scenario":"Sebuah terarium mengandungi lumut dan tumbuhan sukulen di atas lapisan batu kecil, arang dan tanah lalu ditutup rapat.","prompt":"Apakah fungsi utama menutup bekas kaca terarium secara rapat?","options":["Mencegah kehilangan lembapan ke luar supaya wap air daripada transpirasi terkondensasi pada kaca dan menitis kembali ke tanah melalui kitaran air semula jadi","Menghalang cahaya matahari daripada memasuki bekas kaca","Menukarkan batu kecil menjadi garam mineral untuk pokok bakau","Memastikan kepekatan oksigen menurun menjadi sifar"],"correctIndex":0,"proofLabId":"bio57_empat_habitat_lab","proofState":{"hType":"mesofit"},"explanation":"Penutupan bekas kaca memerangkap wap air hasil transpirasi dan penyejatan, membolehkan ia terkondensasi lalu kembali menyiram medium tanah dalam kitaran air tertutup."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Susun Konsep Adaptasi Tumbuhan","voiceCaption":"Susun huraian maksud adaptasi dan organ tumbuhan utama yang mengalami pengubahsuaian mengikut habitat.","voiceScript":"[confident] Susun blok fakta berikut untuk mendefinisikan adaptasi tumbuhan terhadap habitat berbeza!","prompt":"Susun definisi adaptasi dan organ tumbuhan yang mengalami penyesuaian:","hint":"Adaptasi ialah penyesuaian organisma demi kemandirian...","answerTokens":["Adaptasi ialah penyesuaian organisma terhadap persekitaran","yang memastikan kemandirian spesiesnya dalam habitat berbeza","dan dapat diperhatikan melalui pengubahsuaian bentuk daun, batang dan akar","untuk mengatasi cabaran air, pertukaran gas, sokongan dan cahaya"],"distractors":["supaya semua tumbuhan di bumi boleh hidup di dalam air laut masin","tanpa memerlukan sebarang proses fotosintesis atau respirasi"],"explanation":"Pengubahsuaian struktur daun, batang dan akar membolehkan mesofit, hidrofit, halofit dan xerofit mengurus pengambilan air/mineral, pertukaran gas, sokongan dan fotosintesis."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s6","voiceToneLabel":"Cabaran Unit 1: Kenal Pasti Habitat","voiceCaption":"Kenal pasti kelas habitat bagi sejenis pokok berdaun teduh di atas, berduri pada daun dan batang serta berakar jauh ke dalam tanah.","voiceScript":"[excited] Soalan Praktis Formatif tujuh perpuluhan satu! Sekumpulan murid menemui pokok yang mempunyai duri pada daun serta batang dan akar yang menembusi jauh ke dalam tanah. Apakah kelas tumbuhan ini?","prompt":"Sebatang pokok mempunyai duri pada daun dan batangnya, serta sistem akar yang tumbuh berhampiran permukaan dan juga jauh ke dalam tanah. Apakah kelas tumbuhan ini?","options":["Xerofit (tumbuhan gurun atau habitat panas dan kering)","Hidrofit tenggelam (seperti Elodea sp.)","Halofit (seperti pokok bakau di muara berlumpur)","Hidrofit terapung (seperti pokok teratai)"],"correctIndex":0,"explanation":"Duri mengurangkan kehilangan air dan menghalang dimakan haiwan, manakala akar meluas di permukaan dan jauh ke dalam tanah menyerap embun serta air bawah tanah — ciri khas xerofit."}]},{"id":"bio57-u2","title":"Unit 2: Penyesuaian Tumbuhan Halofit (Paya Bakau)","subtitle":"Subtopik 7.1 — Hidatod Penyingkir Garam, Daun Sukulen/Kutikel Tebal, Akar Pneumatofor + Lentisel, Akar Bercabang & Sap Sel Hipertonik","iconType":"scale","iconUrl":"../assets/icons/bio57-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Penyesuaian Halofit Pokok Bakau","voiceCaption":"Pokok bakau beradaptasi pada paya bergaram dan rendah oksigen melalui daun sukulen berhidatod, akar pneumatofor berlentisel dan sap sel akar berkepekatan garam tinggi.","voiceScript":"[warm] Selamat datang ke Unit dua! Bagaimana pokok bakau sebagai tumbuhan halofit hidup subur di muara yang masin, berlumpur lembut, kurang oksigen dan terik cahaya? Perhatikan Rajah tujuh perpuluhan dua! Pada daunnya, kutikel tebal dan stoma terbenam mengurangkan transpirasi; daun sukulen menyimpan air; liang khas bernama hidatod menyingkirkan garam berlebihan manakala daun tua menyimpan lebihan garam sebelum gugur! Pada akarnya, sistem akar bercabang luas menyokong pokok daripada tumbang ditiup angin di lumpur lembut; manakala ratusan akar pernafasan tegak iaitu pneumatofor mempunyai banyak liang lentisel untuk pertukaran gas! Dan yang paling bijak: sap sel akar pokok bakau mempunyai kandungan garam LEBIH TINGGI daripada air laut supaya air laut meresap masuk secara osmosis dan pokok tidak layu!","title":"7.1 Penyesuaian Halofit: Daun, Pneumatofor & Osmosis Air Laut","acronym":"H•P•L•S","hook":"Klik Daun, Akar Pneumatofor dan Sap Sel Hipertonik pada Makmal Halofit di bawah!","mediaKey":"bio57_bakau_halofit","summary":"Halofit (pokok bakau): kutikel tebal + stoma terbenam + daun sukulen + hidatod (buang garam); akar bercabang + pneumatofor berlentisel (gas); sap sel akar lebih pekat garam daripada air laut.","bullets":["Adaptasi Daun Bakau: (1) Kutikel tebal dan stoma terbenam mengurangkan kadar transpirasi di bawah cahaya terik; (2) Daun sukulen menyimpan air; (3) Struktur khas HIDATOD menyingkirkan garam berlebihan; (4) Daun tua menimbun garam lalu gugur.","Adaptasi Akar & Pertukaran Gas: Sistem akar bercabang luas pelbagai saiz mengukuhkan pokok di tanah lembut berlumpur daripada angin kencang. Ratusan akar pernafasan tegak (PNEUMATOFOR) memiliki liang LENTISEL untuk pertukaran gas dengan atmosfera.","Osmosis Hipertonik di Akar: Sap sel akar pokok bakau mempunyai kepekatan garam lebih tinggi daripada air laut, maka air tidak keluar secara osmosis sebaliknya masuk ke akar bersama mineral."],"labId":"bio57_halofit_bakau_lab","labTitle":"Pemeriksa Adaptasi Halofit Pokok Bakau (Rajah 7.2)","labProps":{"feat":"akar"},"examTip":"Skema Kertas 2: Jelaskan bagaimana pokok bakau mengelakkan sel akarnya mengalami plasmolisis di dalam air laut! Jawapan: Sap sel akar mempunyai kepekatan garam lebih tinggi (keupayaan air lebih rendah) daripada air laut, maka air masuk secara osmosis."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Struktur Halofit & Fungsi","voiceCaption":"Padankan lima struktur penyesuaian pokok bakau berikut dengan fungsinya yang tepat.","voiceScript":"[confident] Uji ketepatan kamu memadankan struktur unik pokok bakau dengan fungsinya dalam Rajah tujuh perpuluhan dua!","prompt":"Padankan struktur penyesuaian halofit berikut dengan fungsinya:","pairs":[{"id":"b57u2m1","left":"Hidatod pada daun","right":"Struktur khas yang menyingkirkan garam berlebihan daripada daun"},{"id":"b57u2m2","left":"Akar pneumatofor & lentisel","right":"Akar pernafasan tegak berliang untuk pertukaran gas di lumpur kurang oksigen"},{"id":"b57u2m3","left":"Daun tua gugur & daun sukulen","right":"Menyingkirkan garam terkumpul melalui keguguran serta menyimpan air"},{"id":"b57u2m4","left":"Sap sel akar berkepekatan garam tinggi","right":"Memastikan air laut masuk secara osmosis tanpa kehilangan air dari akar"},{"id":"b57u2m5","left":"Daun berkutikel tebal & stoma terbenam","right":"Mengurangkan kadar transpirasi di bawah keamatan cahaya tinggi"}],"explanation":"Setiap masalah paya bakau (kemasinan tinggi, kurang oksigen, tanah lembut berlumpur, cahaya terik) ditangani oleh struktur khusus pada daun dan akar bakau."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kesan Tumpahan Minyak di Paya Bakau","voiceCaption":"Ramalkan kesan terhadap pertumbuhan dan kemandirian pokok bakau sekiranya berlaku tumpahan minyak yang melitupi akar pneumatofor dan air paya.","voiceScript":"[curious] Soalan Praktis Sumatif tujuh! Tumpahan minyak daripada kapal melitupi lumpur dan akar pneumatofor pokok bakau. Ramalkan apa yang berlaku kepada pokok bakau tersebut!","hook":"Kaitkan minyak yang melitupi liang lentisel pneumatofor dengan respirasi sel akar!","scenario":"Tumpahan minyak tebal menyelaputi permukaan lumpur dan ratusan akar pneumatofor pokok bakau di muara sungai.","prompt":"Apakah kesan utama tumpahan minyak terhadap pertumbuhan pokok bakau tersebut?","options":["Minyak menyumbat liang lentisel pada akar pneumatofor sehingga menghalang pertukaran gas oksigen; respirasi sel akar terhenti, pengangkutan aktif mineral gagal dan pokok bakau akhirnya mati","Minyak menyuburkan daun sukulen supaya hidatod menghasilkan lebih banyak glukosa","Sap sel akar bertukar menjadi minyak biodiesel yang menaikkan tekanan akar","Pokok bakau berubah menjadi tumbuhan mesofit dalam masa seminggu"],"correctIndex":0,"proofLabId":"bio57_halofit_bakau_lab","proofState":{"feat":"akar"},"explanation":"Lapisan minyak menutup liang lentisel pada pneumatofor, menyekat resapan oksigen ke tisu akar yang tenggelam dalam lumpur anaerob, menyebabkan sel akar mati akibat tiada respirasi aerob."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Masalah Halofit vs Penyelesaian Adaptif","voiceCaption":"Kelaskan enam ciri pokok bakau berikut antara Adaptasi Kawalan Garam & Air dengan Adaptasi Sokongan & Pertukaran Gas.","voiceScript":"[confident] Asingkan keenam-enam ciri adaptasi halofit ini antara Kawalan Garam/Air dengan Sokongan/Pertukaran Gas!","prompt":"Isihkan ciri penyesuaian pokok bakau berikut mengikut fungsinya:","buckets":[{"id":"garam","label":"Kawalan Garam & Air"},{"id":"sokong","label":"Sokongan & Pertukaran Gas"}],"items":[{"text":"Rembesan garam berlebihan melalui struktur khas hidatod pada daun","bucketId":"garam","note":"Tepat! Mengawal kepekatan garam dalam tisu daun."},{"text":"Sistem akar bercabang luas mencengkam tanah lembut dan berlumpur","bucketId":"sokong","note":"Betul! Mengelakkan pokok tumbang akibat angin dan ombak."},{"text":"Sap sel akar berkepekatan garam lebih tinggi daripada air laut","bucketId":"garam","note":"Tepat! Mengelakkan kehilangan air secara osmosis."},{"text":"Akar pneumatofor tumbuh tegak di atas lumpur dengan liang lentisel","bucketId":"sokong","note":"Betul! Menjalankan pertukaran gas oksigen dan karbon dioksida."},{"text":"Daun sukulen simpan air, kutikel tebal, stoma terbenam dan daun tua gugur","bucketId":"garam","note":"Tepat! Mengurangkan transpirasi dan membuang garam terkumpul."},{"text":"Kepelbagaian bentuk dan saiz akar seperti akar jangkang dan banir","bucketId":"sokong","note":"Betul! Mengukuhkan dirian pokok bakau."}],"explanation":"Kawalan garam/air (hidatod, daun sukulen/tua, kutikel tebal, sap sel hipertonik) vs sokongan/pertukaran gas (akar bercabang luas, pneumatofor berlentisel)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Susun Prinsip Osmosis Akar Bakau","voiceCaption":"Susun huraian bagaimana pokok bakau mengatasi air laut masin tanpa kehilangan air daripada akarnya.","voiceScript":"[confident] Susun blok jawapan berikut bagi menjelaskan keupayaan akar pokok bakau menyerap air walaupun tumbuh di dalam air laut yang masin!","prompt":"Susun penerangan mekanisme osmosis pada sel akar pokok bakau:","hint":"Bandingkan kandungan garam sap sel akar dengan air laut...","answerTokens":["Sap sel akar pokok bakau mempunyai kandungan garam yang lebih tinggi daripada air laut","menyebabkan keupayaan air di dalam sel akar lebih rendah daripada air laut","maka sel akar tidak kehilangan air melalui osmosis","sebaliknya memperoleh air dan garam mineral daripada air laut yang masuk ke akar"],"distractors":["menyebabkan air keluar dari akar untuk mencairkan air laut","dan semua garam disimpan di dalam pneumatofor tanpa masuk ke daun"],"explanation":"Kepekatan garam tinggi dalam sap sel akar mewujudkan keadaan hipertonik berbanding air laut, membolehkan air masuk ke akar secara osmosis."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s6","voiceToneLabel":"Cabaran Unit 2: Pokok Bakau di Air Tawar","voiceCaption":"Nilaikan sama ada pokok bakau dapat hidup di habitat air tawar berdasarkan ciri penyesuaiannya.","voiceScript":"[excited] Soalan Praktis Sumatif tujuh! Pada pendapat anda, bolehkah pokok bakau hidup di habitat air tawar? Pilih jawapan dan alasan yang paling tepat!","prompt":"Bolehkah pokok bakau hidup di habitat air tawar jika ditanam di kawasan berpaya air tawar?","options":["Boleh hidup, kerana pokok bakau tidak semestinya memerlukan kepekatan garam tinggi untuk hidup, malah lebih sedikit tenaga diperlukan untuk menyingkirkan garam berlebihan (namun mungkin bersaing dengan tumbuhan mesofit/air tawar yang cepat tumbuh)","Tidak boleh hidup langsung kerana hidatod akan mengepam semua air tawar keluar sehingga kering dalam sejam","Tidak boleh hidup kerana pneumatofor memerlukan garam untuk bernafas","Akar bakau akan meletup serta-merta apabila menyentuh air tawar"],"correctIndex":0,"explanation":"Pokok bakau bersifat halofit fakultatif — ia boleh bertahan dalam air masin, dan turut mampu hidup di air tawar (sebab dinding sel tumbuhan menghalang sel daripada pecah walaupun air masuk secara osmosis), cuma di alam semula jadi ia lebih dominan di zon masin di mana pesaing air tawar tidak dapat hidup."}]},{"id":"bio57-u3","title":"Unit 3: Penyesuaian Tumbuhan Hidrofit (Terapung vs Tenggelam)","subtitle":"Subtopik 7.1 — Akar Serabut Halus Perangkap Udara, Teratai (Daun Lebar, Stoma Atas, Kutikel Atas, Aerenkima) vs Elodea sp. (Daun Kecil Nipis, Tiada Stoma/Kutikel)","iconType":"pendulum","iconUrl":"../assets/icons/bio57-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Hidrofit Terapung vs Tenggelam","voiceCaption":"Hidrofit terapung seperti teratai mempunyai daun lebar berstoma di epidermis atas dan tisu aerenkima beruang udara, manakala hidrofit tenggelam seperti Elodea mempunyai daun halus tanpa stoma dan kutikel.","voiceScript":"[warm] Selamat datang ke Unit tiga! Tumbuhan hidrofit hidup di dalam habitat berair dan terbahagi kepada dua gaya hidup berbeza! Pertama, hidrofit terapung seperti pokok teratai dengan akar serabut halus yang memerangkap gelembung udara supaya ringan dan stabil. Daun teratai lebar, nipis dan rata untuk menyerap cahaya maksimum, stoma bertaburan kebanyakannya di epidermis ATAS bersama kutikel berlilin kalis air agar stoma tidak tersumbat oleh air dan kekal terbuka! Batangnya pula dibina daripada tisu ringan beruang udara banyak iaitu tisu aerenkima! Kedua, hidrofit tenggelam sepenuhnya seperti Elodea sp. yang mempunyai daun kecil dan nipis bagi meningkatkan nisbah jumlah luas permukaan per isi padu untuk resapan terus air, mineral dan gas terlarut melalui epidermis — ia TIDAK mempunyai stoma dan TIDAK mempunyai kutikel berlilin!","title":"7.1 Hidrofit Terapung (Teratai) vs Hidrofit Tenggelam (Elodea)","acronym":"A•S•K•E","hook":"Tukar butang Teratai vs Elodea sp. pada Pembanding Hidrofit di bawah untuk membezakan ciri daun, stoma, kutikel dan tisu aerenkima!","mediaKey":"bio57_teratai_hidrofit","summary":"Teratai (terapung): daun lebar, stoma & kutikel di epidermis atas, tisu aerenkima beruang udara. Elodea (tenggelam): daun nipis kecil (JLP/I tinggi), tiada stoma/kutikel, batang kecil kurang rintangan arus.","bullets":["Ciri Umum & Hidrofit Terapung (Teratai): Akar serabut halus menyediakan luas permukaan besar dan memerangkap gelembung udara supaya stabil serta ringan. Daun lebar, nipis dan rata serap cahaya maksimum; stoma & kutikel berlilin di epidermis ATAS supaya stoma sentiasa terbuka. Batang mengandungi TISU AERENKIMA (banyak ruang udara antara sel untuk daya apungan).","Hidrofit Tenggelam (Elodea sp.): Daun nipis dan kecil meningkatkan jumlah luas permukaan per isi padu (JLP/I) untuk resapan terus air, garam mineral dan gas terlarut melalui epidermis. TIADA stoma dan TIADA kutikel berlilin pada daun; batang kecil mengurangkan rintangan aliran air."],"labId":"bio57_hidrofit_lab","labTitle":"Pembanding Teratai (Terapung) vs Elodea sp. (Tenggelam)","labProps":{"hydro":"teratai"},"examTip":"Perangkap objektif SPM: Di manakah stoma pokok teratai paling banyak ditemui? Jawapan: Epidermis ATAS daun (berbeza daripada tumbuhan daratan yang padat di epidermis bawah), supaya sentiasa terdedah kepada udara dan bukan air!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Teratai Terapung vs Elodea Tenggelam","voiceCaption":"Kelaskan enam ciri penyesuaian hidrofit berikut antara Hidrofit Terapung (Teratai) dengan Hidrofit Tenggelam (Elodea sp.).","voiceScript":"[confident] Uji ketelitian kamu membezakan teratai dengan Elodea! Asingkan keenam-enam ciri berikut.","prompt":"Isihkan ciri berikut kepada Hidrofit Terapung (Teratai) atau Hidrofit Tenggelam (Elodea sp.):","buckets":[{"id":"terapung","label":"Hidrofit Terapung (Teratai)"},{"id":"tenggelam","label":"Hidrofit Tenggelam (Elodea sp.)"}],"items":[{"text":"Daun lebar, nipis dan rata dengan stoma serta kutikel di epidermis atas","bucketId":"terapung","note":"Tepat! Memastikan stoma terbuka ke udara dan menghalang air masuk ke daun."},{"text":"Batang mengandungi tisu aerenkima yang ringan dengan banyak ruang udara","bucketId":"terapung","note":"Betul! Membantu tumbuhan terapung di permukaan air."},{"text":"Tidak mempunyai stoma dan tidak mempunyai kutikel berlilin pada daun","bucketId":"tenggelam","note":"Tepat! Gas terlarut dan air meresap terus merentasi epidermis."},{"text":"Daun nipis dan kecil untuk meningkatkan nisbah jumlah luas permukaan per isi padu","bucketId":"tenggelam","note":"Betul! Mempercepatkan penyerapan mineral dan karbon dioksida terlarut."},{"text":"Batang kecil yang fleksibel membantu mengurangkan rintangan aliran arus air","bucketId":"tenggelam","note":"Tepat! Menghalang batang patah dibawa arus."},{"text":"Akar tidak mencecah dasar kolam manakala permukaan atas menerima cahaya terus","bucketId":"terapung","note":"Betul! Terapung di permukaan kolam."}],"explanation":"Teratai terapung di permukaan (daun lebar, stoma & kutikel di atas, tisu aerenkima), manakala Elodea tenggelam penuh (daun kecil nipis, tiada stoma/kutikel, batang kecil)."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Struktur Hidrofit & Sebab","voiceCaption":"Padankan lima struktur penyesuaian tumbuhan hidrofit berikut dengan sebab adaptifnya yang tepat.","voiceScript":"[confident] Padankan kelima-lima struktur hidrofit ini dengan sebab kejadiannya mengikut buku teks KSSM!","prompt":"Padankan ciri struktur hidrofit berikut dengan fungsinya:","pairs":[{"id":"b57u3m1","left":"Tisu aerenkima pada batang","right":"Tisu ringan dengan ruang udara besar untuk membantu keapungan"},{"id":"b57u3m2","left":"Akar serabut halus","right":"Menyediakan luas permukaan besar dan memerangkap gelembung udara agar stabil"},{"id":"b57u3m3","left":"Kutikel berlilin di epidermis atas teratai","right":"Kalis air bagi memastikan liang stoma sentiasa terbuka dan tidak tersumbat air"},{"id":"b57u3m4","left":"Daun kecil & nipis tanpa kutikel (Elodea)","right":"Meningkatkan resapan terus air, garam mineral dan gas terlarut ke dalam sel"},{"id":"b57u3m5","left":"Batang kecil pada tumbuhan tenggelam","right":"Membantu tegak terapung dalam air sambil mengurangkan rintangan aliran air"}],"explanation":"Tisu aerenkima (keapungan), akar serabut halus (perangkap udara), kutikel atas teratai (stoma terbuka), daun Elodea tanpa kutikel (resapan terus)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Elodea sp. Dikeluarkan ke Darat","voiceCaption":"Ramalkan apa yang berlaku kepada Elodea sp. sekiranya diletakkan di atas tanah kering di bawah sinaran matahari terik.","voiceScript":"[curious] Cuba ramalkan nasib tumbuhan Elodea jika dialihkan dari akuarium ke dalam pasu tanah di bawah cahaya matahari panas! Mengapakah ia tidak dapat bertahan seperti pokok bunga raya?","hook":"Ingat bahawa Elodea tidak mempunyai lapisan kutikel berlilin dan tiada tisu berkayu!","scenario":"Tumbuhan Elodea sp. dikeluarkan daripada kolam air dan diletakkan di atas tanah kering di tempat panas.","prompt":"Apakah yang berlaku kepada Elodea sp. dan apakah puncanya?","options":["Elodea akan kehilangan air dengan sangat cepat melalui sejatan dan layu hingga mati kerana daunnya nipis serta tiada lapisan kutikel berlilin kalis air, selain batangnya lembut tanpa sokongan udara","Elodea akan segera menumbuhkan duri dan batang sukulen dalam masa sejam","Elodea membuka liang stoma di epidermis bawah untuk menyerap wap air","Tisu aerenkima akan berubah menjadi akar pneumatofor"],"correctIndex":0,"proofLabId":"bio57_hidrofit_lab","proofState":{"hydro":"elodea"},"explanation":"Ketiadaan kutikel berlilin dan dinding epidermis yang sangat nipis memudahkan Elodea menyerap gas terlarut di dalam air, tetapi menyebabkan dehidrasi pantas apabila terdedah kepada udara kering."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Susun Adaptasi Teratai Terapung","voiceCaption":"Susun huraian lengkap bagaimana daun dan batang pokok teratai disesuaikan untuk hidup terapung di permukaan kolam.","voiceScript":"[confident] Susun blok fakta berikut untuk menerangkan penyesuaian daun dan batang pokok teratai!","prompt":"Susun huraian penyesuaian daun dan batang pokok teratai sebagai hidrofit terapung:","hint":"Gabungkan bentuk daun lebar, kedudukan stoma/kutikel di atas dan tisu aerenkima...","answerTokens":["Pokok teratai mempunyai daun lebar, nipis dan rata untuk menyerap cahaya maksimum","dengan stoma bertaburan pada epidermis atas yang bersalut kutikel berlilin kalis air","supaya liang stoma sentiasa terbuka untuk pertukaran gas","manakala batangnya mengandungi tisu aerenkima beruang udara ringan untuk apungan"],"distractors":["dengan akar pneumatofor yang mempunyai hidatod untuk membuang garam laut","dan daun berbentuk duri untuk mengurangkan jumlah luas permukaan"],"explanation":"Daun lebar (cahaya maksimum) + stoma & kutikel atas (pertukaran gas lancar) + tisu aerenkima (apungan ringan)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s6","voiceToneLabel":"Cabaran Unit 3: Fungsi Aerenkima","voiceCaption":"Pilih pernyataan yang tepat mengenai tisu aerenkima dan ciri epidermis tumbuhan tenggelam.","voiceScript":"[excited] Soalan penutup Unit tiga! Kenal pasti pernyataan paling tepat mengenai struktur tisu aerenkima dalam tumbuhan hidrofit.","prompt":"Apakah kepentingan utama tisu aerenkima dan akar serabut halus kepada tumbuhan hidrofit terapung?","options":["Tisu aerenkima mempunyai banyak ruang udara antara sel untuk meringankan batang bagi apungan dan pertukaran gas, manakala akar serabut halus memerangkap gelembung udara untuk kestabilan","Tisu aerenkima menyimpan garam berlebihan sehingga daun tua gugur","Akar serabut halus menembusi batu karang sehingga sepuluh meter ke dalam tanah","Tisu aerenkima menggantikan keperluan pigmen klorofil untuk fotosintesis"],"correctIndex":0,"explanation":"Tisu aerenkima membekalkan ruang udara bagi keapungan dan laluan gas dalam batang, manakala akar serabut halus memerangkap gelembung udara supaya tumbuhan stabil dan ringan."}]},{"id":"bio57-u4","title":"Unit 4: Penyesuaian Tumbuhan Xerofit & Aplikasi Landskap","subtitle":"Subtopik 7.1 — Daun Kecil/Duri Kumpul Embun, Batang Sukulen Berfotosintesis, Kutikel Tebal, Stoma Terbenam, Akar Meluas & Lidah Buaya","iconType":"crown","iconUrl":"../assets/icons/bio57-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Penyesuaian Xerofit di Gurun","voiceCaption":"Tumbuhan xerofit di gurun mempunyai akar meluas dan dalam, batang sukulen penyimpan air yang berfotosintesis, daun berduri pengumpul embun serta kutikel tebal dan stoma terbenam.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari selami bagaimana tumbuhan xerofit seperti kaktus, pokok kurma dan lidah buaya bertahan di gurun yang hampir tiada hujan dan bersuhu melampau! Pertama, akarnya tumbuh meluas di permukaan untuk mengutip embun atau hujan singkat DAN menembusi jauh ke dalam tanah untuk mencapai sumber air bawah tanah! Kedua, air disimpan di dalam akar, daun atau batang sukulen, dan batang hijau kaktus mengambil alih tugas fotosintesis! Ketiga, daunnya kecil atau terubah suai menjadi duri untuk mengecilkan luas permukaan sejatan, menghalang dimakan haiwan dan mengumpul titisan embun pagi supaya menitis ke tanah untuk diserap akar! Keempat, batang dan daun disaluti kutikel tebal berlilin beserta liang stoma terbenam untuk meminimumkan kehilangan air!","title":"7.1 Penyesuaian Xerofit (Kaktus, Kurma & Lidah Buaya)","acronym":"D•B•S•A","hook":"Klik Duri, Batang Sukulen dan Akar pada Makmal Xerofit Gurun di bawah!","mediaKey":"bio57_kaktus_xerofit","summary":"Xerofit: akar meluas & dalam; air disimpan dalam batang/daun sukulen; batang jalankan fotosintesis; daun kecil/duri (kurangkan transpirasi, kumpul embun, lindung haiwan); kutikel tebal & stoma terbenam.","bullets":["Akar & Penyimpanan Air: Akar tumbuh meluas dan menembusi jauh ke dalam tanah untuk menyerap air dan garam mineral; air disimpan di dalam akar, batang atau daun sukulen (cth. lidah buaya & kaktus).","Daun Berduri & Batang Hijau: Daun kecil atau terubah suai menjadi duri mengurangkan jumlah luas permukaan terdedah matahari (kurang transpirasi), mengumpulkan embun supaya menitis ke tanah untuk diserap akar, dan menghalang tumbuhan dimakan haiwan. Batang hijau kaktus menjalankan fotosintesis.","Kutikel Tebal & Stoma Terbenam: Kutikel berlilin tebal pada batang dan daun serta stoma terbenam memerangkap lapisan udara lembap dan mengurangkan penyejatan air."],"labId":"bio57_xerofit_gurun_lab","labTitle":"Makmal Adaptasi Xerofit Gurun","labProps":{"xPart":"duri"},"examTip":"Skema Kertas 2: Nyatakan 3 fungsi duri pada pokok kaktus: (1) Mengurangkan luas permukaan terdedah matahari untuk menurunkan transpirasi, (2) Mengumpulkan titisan embun yang menitis ke akar, (3) Melindungi pokok daripada dimakan haiwan."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Lidah Buaya di Iklim Sejuk","voiceCaption":"Ramalkan tindakan penjagaan terbaik jika pokok lidah buaya iaitu tumbuhan xerofit ditanam di negara beriklim sejuk.","voiceScript":"[curious] Soalan Praktis Sumatif tujuh! Pokok lidah buaya mempunyai daun tebal sukulen dan berkutikel tebal sebagai xerofit. Jika anda tinggal di negara beriklim sejuk bersalji, bagaimana anda memastikan lidah buaya terus hidup?","hook":"Fikirkan risiko pembekuan air di dalam daun sukulen jika terdedah kepada suhu beku luar rumah!","scenario":"Pokok lidah buaya (Aloe vera) yang ditanam di dalam pasu diletakkan di sebuah negara empat musim menjelang musim sejuk.","prompt":"Apakah tindakan yang paling sesuai dilakukan untuk memastikan pokok lidah buaya terus hidup pada musim sejuk?","options":["Memindahkan pasu ke dalam rumah atau rumah kaca bersuhu terkawal dengan pencahayaan cukup serta mengurangkan kekerapan siraman supaya air dalam daun sukulen tidak membeku dan akar tidak reput","Merendam keseluruhan pokok lidah buaya di dalam kolam air berais seperti Elodea sp.","Memotong semua daun sukulennya dan menyiram dengan air garam laut setiap hari","Meletakkan pasu di luar di bawah timbunan salji sepanjang musim sejuk"],"correctIndex":0,"proofLabId":"bio57_xerofit_gurun_lab","proofState":{"xPart":"batang"},"explanation":"Sebagai xerofit berdaun sukulen yang menyimpan banyak air, suhu sejuk beku di luar boleh membekukan air di dalam sel dan memecahkan tisu; meletakkannya di tempat terlindung yang suam dan mengurangkan siraman mengelakkan reput akar serta kerosakan beku."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Struktur Xerofit & Manfaat","voiceCaption":"Padankan lima struktur penyesuaian kaktus atau lidah buaya berikut dengan manfaat kemandiriannya.","voiceScript":"[confident] Padankan kelima-lima struktur xerofit ini dengan fungsi kemandiriannya di gurun!","prompt":"Padankan ciri xerofit berikut dengan fungsinya yang tepat:","pairs":[{"id":"b57u4m1","left":"Daun terubah suai menjadi duri","right":"Kurangkan sejatan, kumpul embun dan elak dimakan haiwan gurun"},{"id":"b57u4m2","left":"Batang hijau sukulen","right":"Menyimpan bekalan air dan menjalankan proses fotosintesis"},{"id":"b57u4m3","left":"Stoma terbenam","right":"Mengurangkan pendedahan terus kepada angin kering bagi menurunkan transpirasi"},{"id":"b57u4m4","left":"Kutikel tebal berlilin","right":"Lapisan kalis air tebal pada batang dan daun untuk menghalang penyejatan"},{"id":"b57u4m5","left":"Akar meluas & menembusi dalam","right":"Menyerap air hujan singkat di permukaan serta air bawah tanah yang dalam"}],"explanation":"Kesemua ciri xerofit memaksimumkan pengumpulan dan penyimpanan air sambil meminimumkan kehilangan air dalam iklim gurun."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Ciri Xerofit vs Hidrofit vs Halofit","voiceCaption":"Kelaskan enam ciri khusus berikut mengikut kelas tumbuhan yang memilikinya: Xerofit, Hidrofit atau Halofit.","voiceScript":"[confident] Uji perbandingan tiga kelas habitat! Asingkan keenam-enam struktur ini kepada Xerofit, Hidrofit atau Halofit.","prompt":"Isihkan struktur penyesuaian berikut kepada kelas tumbuhan yang betul:","buckets":[{"id":"xero","label":"Xerofit"},{"id":"hidro","label":"Hidrofit"},{"id":"halo","label":"Halofit"}],"items":[{"text":"Daun terubah suai menjadi duri pengumpul embun dan batang berfotosintesis","bucketId":"xero","note":"Tepat! Ciri khas pokok kaktus."},{"text":"Tisu aerenkima beruang udara serta stoma di epidermis atas daun","bucketId":"hidro","note":"Betul! Ciri khas hidrofit terapung seperti teratai."},{"text":"Akar pneumatofor berlentisel dan liang hidatod penyingkir garam","bucketId":"halo","note":"Tepat! Ciri khas pokok bakau."},{"text":"Daun nipis tanpa kutikel dan tanpa stoma bagi resapan terus air dan gas","bucketId":"hidro","note":"Betul! Ciri khas hidrofit tenggelam seperti Elodea."},{"text":"Sap sel akar lebih tinggi kepekatan garam daripada air laut","bucketId":"halo","note":"Tepat! Memastikan kemasukan air secara osmosis."},{"text":"Akar tumbuh meluas dan dalam untuk mencapai air bawah tanah di gurun","bucketId":"xero","note":"Betul! Strategi mencari air di kawasan gersang."}],"explanation":"Xerofit (duri, batang fotosintesis, akar dalam), Hidrofit (aerenkima, stoma atas / tanpa stoma), Halofit (pneumatofor, hidatod, sap hipertonik)."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Susun Wajaran Landskap Hotel Pantai","voiceCaption":"Susun cadangan arkitek landskap mengenai tumbuhan sesuai ditanam berhampiran pantai berpasir dan berangin masin.","voiceScript":"[confident] Soalan Praktis Sumatif tujuh! Susun jawapan KBAT arkitek landskap untuk memilih tumbuhan yang paling tahan ditanam di kawasan hotel tepi pantai!","prompt":"Susun huraian pemilihan tumbuhan sesuai untuk landskap berhampiran pantai:","hint":"Gabungkan pilihan halofit/xerofit seperti pokok kelapa, rhu, kaktus atau lidah buaya dengan angin dan tanah berpasir/masin...","answerTokens":["Kawasan pantai mengalami tiupan angin kuat, cahaya terik, tanah berpasir dan percikan garam","maka tumbuhan berciri halofit dan xerofit seperti pokok kelapa, rhu dan lidah buaya sesuai dipilih","kerana mempunyai daun berkutikel tebal, daun halus atau sukulen penyimpan air","serta akar meluas yang kuat untuk mengurangkan transpirasi dan menahan angin kencang"],"distractors":["maka hidrofit tenggelam seperti Elodea sp. ditanam di atas pasir kering","kerana tumbuhan tanpa kutikel menyerap angin masin lebih cepat"],"explanation":"Kawasan pantai menuntut tumbuhan yang tahan kemasinan, angin kuat dan kekeringan pasir (kutikel tebal, daun sukulen/halus, akar mencengkam kuat)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Unit 4: Peranan Duri Kaktus","voiceCaption":"Pilih pernyataan yang merangkumi ketiga-tiga peranan duri pada pokok kaktus di kawasan gurun.","voiceScript":"[excited] Soalan penutup Unit empat! Apakah tiga peranan utama duri pada pokok kaktus dalam membantu kemandiriannya di gurun?","prompt":"Antara berikut, manakah gabungan peranan yang BETUL bagi daun berbentuk duri pada pokok kaktus (xerofit)?","options":["Mengurangkan jumlah luas permukaan untuk menurunkan kadar transpirasi, mengumpulkan titisan embun ke tanah untuk diserap akar, dan menghalang pokok dimakan oleh haiwan","Menjalankan fotosintesis maksimum, menyingkirkan garam berlebihan dan menyerap oksigen melalui lentisel","Memerangkap gelembung udara untuk apungan dan mengurangkan rintangan arus","Menarik serangga pendebunga dengan merembes nektar manis"],"correctIndex":0,"explanation":"Duri pada kaktus mengecilkan luas permukaan sejatan, memerangkap embun pada waktu pagi untuk menitis ke akar dan menjadi pertahanan fizikal terhadap herbivor gurun."}]},{"id":"bio57-u5","title":"Unit 5: Cabaran Boss SPM — Penyesuaian Tumbuhan Habitat","subtitle":"Sintesis Kertas 1 & Kertas 2 — Perbandingan Menyeluruh Mesofit, Hidrofit, Halofit & Xerofit dalam Air, Gas, Sokongan & Fotosintesis","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Padanan Teras 4 Habitat","voiceCaption":"Padankan lima istilah utama penyesuaian tumbuhan daripada Bab tujuh dengan definisi atau spesiesnya.","voiceScript":"[excited] Selamat datang ke Cabaran Boss SPM Bab tujuh! Padankan kelima-lima istilah adaptasi tumbuhan ini dengan tepat!","prompt":"Padankan istilah Bab 7 dengan maksud atau spesies tepatnya:","pairs":[{"id":"b57boss1","left":"Tisu aerenkima","right":"Tisu beruang udara ringan pada batang hidrofit terapung seperti teratai"},{"id":"b57boss2","left":"Akar pneumatofor","right":"Akar pernafasan tegak berlentisel pada pokok bakau di lumpur kurang oksigen"},{"id":"b57boss3","left":"Hidatod","right":"Struktur khas pada daun halofit untuk menyingkirkan garam berlebihan"},{"id":"b57boss4","left":"Elodea sp.","right":"Hidrofit tenggelam tanpa stoma dan tanpa kutikel berlilin"},{"id":"b57boss5","left":"Kaktus & Pokok kurma","right":"Xerofit berakar meluas dan berstoma terbenam di gurun"}],"explanation":"Setiap istilah khusus Bab 7 (aerenkima, pneumatofor, hidatod, stoma atas vs tanpa stoma, stoma terbenam) adalah kata kunci skema jawapan SPM."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Analisis Daun Teratai Terbalik","voiceCaption":"Ramalkan kesan terhadap pertukaran gas pokok teratai sekiranya permukaan atas daunnya disapu dengan lapisan minyak atau jeli petroleum.","voiceScript":"[curious] Soalan KBAT! Jika permukaan ATAS daun pokok teratai disapu jeli petroleum, apakah kesannya terhadap fotosintesis dan pertukaran gas berbanding jika disapu pada permukaan bawah?","hook":"Ingat kedudukan stoma teratai adalah di epidermis atas, bukan di epidermis bawah!","scenario":"Permukaan atas daun teratai yang terapung disapu rata dengan lapisan jeli petroleum lut sinar.","prompt":"Apakah kesan utama terhadap pokok teratai tersebut?","options":["Pertukaran gas karbon dioksida dan oksigen terhenti serta kadar fotosintesis jatuh mendadak kerana hampir kesemua liang stoma teratai terletak di epidermis atas dan telah tersumbat","Tiada kesan langsung kerana stoma teratai terletak di epidermis bawah yang menyentuh air","Tisu aerenkima akan menghasilkan stoma baharu di dalam akar serabut","Daun teratai akan bertukar menjadi daun jarum seperti kaktus"],"correctIndex":0,"proofLabId":"bio57_hidrofit_lab","proofState":{"hydro":"teratai"},"explanation":"Berbeza daripada mesofit darat, stoma hidrofit terapung seperti teratai berada pada epidermis atas. Menyapu jeli petroleum di permukaan atas menyumbat stoma dan menghalang resapan CO2 masuk untuk fotosintesis."},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Isih Aspek Sokongan & Air","voiceCaption":"Asingkan enam adaptasi berikut antara Penyesuaian untuk Mengurangkan Kehilangan Air dengan Penyesuaian untuk Pertukaran Gas & Sokongan.","voiceScript":"[confident] Pusingan ketiga Boss! Asingkan keenam-enam ciri adaptasi tumbuhan ini antara Kawalan Kehilangan Air dengan Pertukaran Gas & Sokongan!","prompt":"Isihkan ciri penyesuaian berikut mengikut tujuan fisiologi utamanya:","buckets":[{"id":"air","label":"Kurangkan Kehilangan Air & Simpan Air"},{"id":"gas","label":"Pertukaran Gas & Sokongan Fizikal"}],"items":[{"text":"Daun kaktus berbentuk duri kecil serta stoma terbenam","bucketId":"air","note":"Tepat! Meminimumkan transpirasi di gurun."},{"text":"Akar pneumatofor berlentisel pada pokok bakau di paya anaerob","bucketId":"gas","note":"Betul! Membenarkan pertukaran gas oksigen dengan atmosfera."},{"text":"Tisu aerenkima beruang udara dan daya apungan air pada hidrofit","bucketId":"gas","note":"Tepat! Menyokong tumbuhan terapung serta laluan gas dalam batang."},{"text":"Kutikel tebal berlilin serta daun dan batang sukulen pada halofit dan xerofit","bucketId":"air","note":"Betul! Menghalang penyejatan dan menyimpan bekalan air."},{"text":"Sistem akar bercabang luas menyokong pokok bakau di lumpur lembut","bucketId":"gas","note":"Tepat! Sokongan mekanikal melawan angin dan ombak."},{"text":"Daun Elodea sp. yang nipis tanpa kutikel untuk resapan terus gas terlarut","bucketId":"gas","note":"Betul! Pertukaran gas terlarut di dalam air."}],"explanation":"Mengaitkan struktur anatomi dengan 4 aspek DSKP (pengambilan air/mineral, pertukaran gas, sokongan, fotosintesis) memastikan jawapan esei padat."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Fotosintesis Halofit","voiceCaption":"Terangkan dua ciri penyesuaian halofit yang membantu meningkatkan kadar fotosintesis walaupun hidup di paya bergaram dan panas.","voiceScript":"[excited] Soalan Praktis Formatif tujuh perpuluhan satu! Bagaimanakah tumbuhan halofit beradaptasi untuk memastikan proses fotosintesisnya kekal cekap di kawasan paya bakau yang panas terik?","prompt":"Antara berikut, ciri penyesuaian manakah yang membantu pokok bakau (halofit) mengekalkan kadar fotosintesis yang cekap di habitat paya yang terik cahaya?","options":["Daun mempunyai kutikel tebal dan sukulen untuk mengekalkan bekalan air sel bagi tindak balas fotosintesis, manakala hidatod menyingkirkan garam berlebihan agar tidak merosakkan sel kloroplas","Pokok bakau tidak mempunyai klorofil dan memperoleh glukosa secara parasit daripada teratai","Stoma terbenam dibuka pada waktu tengah malam sahaja ketika tiada cahaya","Pneumatofor menjalankan fotosintesis di bawah tanah berlumpur"],"correctIndex":0,"explanation":"Daun sukulen serta kutikel tebal menyimpan dan mengekalkan air sebagai bahan mentah fotosintesis, manakala hidatod dan keguguran daun tua menyingkirkan toksik garam supaya aktiviti enzim kloroplas kekal normal."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Banding Hidrofit vs Xerofit","voiceCaption":"Susun perbandingan lengkap penyesuaian daun dan stoma antara tumbuhan hidrofit tenggelam dengan tumbuhan xerofit.","voiceScript":"[confident] Susun jawapan perbandingan esei antara hidrofit tenggelam dengan xerofit dari segi kutikel, daun dan stoma!","prompt":"Susun perbandingan tepat antara hidrofit tenggelam dengan xerofit:","hint":"Bandingkan ketebalan kutikel, saiz/bentuk daun dan kehadiran/kedudukan stoma...","answerTokens":["Hidrofit tenggelam mempunyai daun nipis tanpa kutikel berlilin dan tanpa stoma","untuk membolehkan resapan terus air, mineral dan gas terlarut melalui epidermis","manakala xerofit mempunyai kutikel tebal berlilin, stoma terbenam dan daun berduri","untuk mengurangkan kehilangan air melalui transpirasi di habitat gurun kering"],"distractors":["manakala kedua-duanya mempunyai akar pneumatofor dan hidatod","untuk menyimpan garam laut di dalam tisu aerenkima"],"explanation":"Dua ekstrem air bertentangan: hidrofit tenggelam membuang kutikel/stoma demi resapan terus air dan gas; xerofit menebalkan kutikel, membenamkan stoma dan mengecilkan daun menjadi duri demi menjimatkan air."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Sintesis Penuh Bab 7","voiceCaption":"Pilih gabungan fakta yang betul kesemuanya merangkumi mesofit, hidrofit, halofit dan xerofit.","voiceScript":"[excited] Soalan terakhir Cabaran Boss Bab tujuh! Pilih pilihan yang seratus peratus tepat untuk melengkapkan trofi Bab tujuh!","prompt":"Antara kombinasi fakta Bab 7 berikut, manakah yang BETUL kesemuanya?","options":["Mesofit = mangga/bunga raya | Teratai ada stoma epidermis atas & aerenkima | Bakau ada pneumatofor, lentisel & hidatod | Kaktus berbatang sukulen fotosintetik","Elodea ada kutikel sangat tebal | Bakau ada sap sel akar kurang pekat daripada air laut | Kaktus tiada akar dalam | Teratai tiada tisu aerenkima","Hidatod terdapat pada duri kaktus | Pneumatofor untuk apungan air | Mesofit hidup di Laut Mati | Terarium perlu disiram setiap jam","Stoma terbenam meningkatkan kadar transpirasi | Akar serabut halus hanya wujud pada kaktus | Daun tua bakau menyerap oksigen | Bunga raya ialah xerofit"],"correctIndex":0,"explanation":"Tahniah! Semua fakta dalam pilihan pertama tepat sepenuhnya mengikut KSSM Biologi Tingkatan 5 Bab 7."}]}]};</script>

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function renderSortStep(step, card) {
  var items = shuffleList(Array.isArray(step.items) ? step.items : []);
  var buckets = Array.isArray(step.buckets) ? step.buckets : [];
  var curIdx = 0;
  var misses = 0;

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("graph", "icon-sm") + " <span>" + tUi("Isih Kategori Pantas", "Quick Category Sort") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Pilih kategori yang betul bagi setiap kad:", "Pick the matching category for each card:")) + "</h2>" +
    '<div class="sort-progress-bar"><span>' + tUi("Kad Fakta", "Card") + '</span><span id="sortCounter" class="tabular-nums">1 / ' + items.length + "</span></div>" +
    '<div id="sortActiveCard" class="sort-active-card"></div>' +
    '<div id="sortMiniMsg" class="sort-mini-feedback" hidden></div>' +
    '<div class="sort-buckets-grid">' +
      buckets.map(function (bk) {
        return '<button type="button" class="sort-bucket-btn js-sort-bucket" data-bucket="' + escapeHtml(bk.id) + '">' + escapeHtml(bk.label) + "</button>";
      }).join("") +
    "</div>";

  function showCard() {
    var cEl = document.getElementById("sortActiveCard");
    var cntEl = document.getElementById("sortCounter");
    if (cntEl) cntEl.textContent = Math.min(items.length, curIdx + 1) + " / " + items.length;
    if (cEl && items[curIdx]) cEl.textContent = items[curIdx].text;
  }

  showCard();
  card.querySelectorAll(".js-sort-bucket").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent || curIdx >= items.length) return;
      var item = items[curIdx];
      var bid = btn.getAttribute("data-bucket");
      var msgEl = document.getElementById("sortMiniMsg");

      if (bid === item.bucketId) {
        NotaAudio.playMatch();
        btn.classList.add("is-correct");
        setTimeout(function () { btn.classList.remove("is-correct"); }, 260);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback ok";
          msgEl.textContent = item.note || tUi("Tepat!", "Spot on!");
        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";

function renderMcqStep(step, card) {

    heroMediaHtml +
    (step.stimulusHtml ? '<div class="stimulus-box">' + step.stimulusHtml + "</div>" : "") +
    '<div class="choice-grid">' +
      opts.map(function (opt, idx) {
        return '<button type="button" class="tactile-choice js-mcq-opt" data-idx="' + idx + '"><span class="choice-key">' + (letters[idx] || (idx + 1)) + "</span><span>" + escapeHtml(opt) + "</span></button>";
      }).join("") +
    "</div>" +
    '<div class="step-actions-footer"><button type="button" id="mcqCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button></div>";

  if (typeof bindHeroMediaClicks === "function") bindHeroMediaClicks(card, step);

  var checkBtn = document.getElementById("mcqCheckBtn");
  card.querySelectorAll(".js-mcq-opt").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      NotaAudio.playTap();
      selectedIdx = Number(btn.getAttribute("data-idx"));
      card.querySelectorAll(".js-mcq-opt").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      if (checkBtn) checkBtn.disabled = false;
    });
  });

  if (checkBtn) {
    checkBtn.addEventListener("click", function () {
      if (notaState.answeredCurrent || selectedIdx < 0) return;
      var ok = selectedIdx === Number(step.correctIndex);
      card.querySelectorAll(".js-mcq-opt").forEach(function (b, idx) {
        b.disabled = true;
        if (idx === Number(step.correctIndex)) b.classList.add("is-correct");
        else if (idx === selectedIdx && !ok) b.classList.add("is-wrong");
      });
      checkBtn.disabled = true;
      handleStepOutcome(ok, step.explanation || "", Number(step.xp) || 20, checkBtn);
    });
  }
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
