  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab08","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":8,"title":"Biodiversiti","subtitle":"Subtopik 8.1–8.3 KSSM — Sistem 6 Alam (Woese 1990), Hierarki Linnaeus, Tatanama Binomial & Kekunci Dikotomi, 3 Jenis Biodiversiti, Pokok Filogeni & Struktur Homolog, Pemuliharaan In Situ/Ex Situ, Ciri Mikroorganisma & Virus, Kitar Nitrogen serta Patogen, Vektor & Wolbachia.","estimatedMinutes":36,"themeAccent":"#059669","isFreePreview":false,"labScript":"biologi-t5-bab08-labs.js","coverIcon":"../assets/icons/bio58-u1.jpg","editionBadge":"Edisi Simulasi Interaktif & Makmal KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan taksonomi, biodiversiti dan mikrobiologi kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Enam alam, kitar nitrogen dan ciri patogen berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula perbezaan dinding sel, bakteria nitrifikasi atau peraturan tatanama binomial di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Biologi Tingkatan lima Bab lapan berjaya kamu takluki sepenuhnya!"},"units":[{"id":"bio58-u1","title":"Unit 1: Sistem Pengelasan Enam Alam (8.1)","subtitle":"Subtopik 8.1 — Taksonomi, Whittaker (5 Alam) vs Woese (6 Alam), Archaebacteria (Metanogen/Halofil/Termofil), Eubacteria, Protista, Fungi, Plantae & Animalia","iconType":"atom","iconUrl":"../assets/icons/bio58-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Sistem Enam Alam Carl Woese","voiceCaption":"Organisma dikelaskan kepada enam alam iaitu Archaebacteria, Eubacteria, Protista, Fungi, Plantae dan Animalia berdasarkan jenis sel, bilangan sel serta jenis nutrisi.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab lapan: Biodiversiti! Pada subtopik lapan perpuluhan satu, bidang biologi yang mengelaskan, mengecam dan menamakan organisma secara teratur disebut taksonomi! Pada tahun seribu sembilan ratus enam puluh sembilan, Robert Whittaker memperkenalkan sistem lima alam, namun pada tahun seribu sembilan ratus sembilan puluh, Carl Woese mengusulkan sistem enam alam setelah menemui perbezaan R N A antara bakteria sebenar dengan archaebacteria! Enam alam tersebut ialah Archaebacteria dan Eubacteria yang kedua-duanya prokariot unisel, diikuti empat alam eukariot iaitu Protista, Fungi, Plantae dan Animalia! Perhatikan perbezaan dinding sel: Archaebacteria tiada peptidoglikan dan hidup di habitat ekstrem seperti metanogen, halofil serta termofil; Eubacteria berdinding peptidoglikan atau murein beserta plasmid; manakala Fungi mempunyai dinding sel kitin dan bebenang hifa membentuk miselium!","title":"8.1 Taksonomi & Sistem Enam Alam (Woese, 1990)","acronym":"A•E•P•F•P•A","hook":"Klik setiap satu daripada 6 Alam pada Makmal Enam Alam di bawah untuk membandingkan jenis sel, dinding sel dan contoh spesies!","summary":"6 Alam (Woese 1990): Archaebacteria (prokariot tanpa peptidoglikan), Eubacteria (prokariot peptidoglikan), Protista (eukariot ringkas), Fungi (dinding kitin, hifa/miselium), Plantae (fotoautotrof multisel) & Animalia (heterotrof multisel).","bullets":["Prokariot vs Eukariot: Prokariot (Archaebacteria & Eubacteria) tiada membran nukleus dan tiada organel bermembran; Eukariot (Protista, Fungi, Plantae & Animalia) mempunyai membran nukleus serta organel bermembran.","Archaebacteria vs Eubacteria: Archaebacteria ialah bakteria primitif tanpa peptidoglikan di habitat ekstrem: Metanogen (anaerob obligat di paya & usus ruminan/manusia), Halofil (Laut Mati) dan Termofil (60–80°C mata air panas Yellowstone; cth. Sulfolobus sp.). Eubacteria ialah bakteria sebenar berdinding peptidoglikan (murein) dengan ribosom dan plasmid (cth. Streptococcus pneumoniae, Vibrio cholerae, Cyanobacteria).","Protista, Fungi, Plantae & Animalia: Protista meliputi protozoa (Amoeba, Paramecium, Euglena), alga (Chlamydomonas, Spirogyra) dan kulapuk lendir (Physarum). Fungi ialah heterotrof saprofit/parasit berdinding KITIN dengan hifa membentuk miselium (yis Saccharomyces cerevisiae, cendawan Agaricus sp.). Plantae ialah fotoautotrof multisel; Animalia ialah heterotrof multisel."],"labId":"bio58_enam_alam_lab","labTitle":"Pemeriksa Sistem Enam Alam (Woese 1990)","labProps":{"kingdom":"Archaebacteria"},"examTip":"Soalan Praktis Sumatif 8: Mengapakah kulat (Fungi) tidak lagi dimasukkan dalam Plantae? Jawapan: Kulat tiada klorofil (bukan autotrof, sebaliknya heterotrof saprofit/parasit), tiada akar/batang/daun sebenar, dan dinding selnya terbina daripada KITIN (bukan selulosa)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Prokariot vs Eukariot Enam Alam","voiceCaption":"Kelaskan enam organisma dan ciri berikut antara kumpulan Alam Prokariot dengan kumpulan Alam Eukariot.","voiceScript":"[confident] Uji pengelasan Enam Alam! Asingkan keenam-enam ciri dan spesies ini kepada Alam Prokariot atau Alam Eukariot.","prompt":"Isihkan ciri dan organisma berikut kepada Prokariot atau Eukariot:","buckets":[{"id":"prok","label":"Prokariot (Archaebacteria & Eubacteria)"},{"id":"euk","label":"Eukariot (Protista, Fungi, Plantae, Animalia)"}],"items":[{"text":"Tiada membran nukleus dan tiada organel bermembran seperti mitokondria","bucketId":"prok","note":"Tepat! Bahan genetik berada di kawasan nukleoid atau plasmid."},{"text":"Fungi dengan dinding sel kitin serta rangkaian hifa membentuk miselium","bucketId":"euk","note":"Betul! Contohnya yis dan cendawan Agaricus sp."},{"text":"Metanogen, Halofil di Laut Mati dan Termofil (Sulfolobus sp.) pada suhu 60–80°C","bucketId":"prok","note":"Tepat! Tergolong dalam Archaebacteria tanpa peptidoglikan."},{"text":"Protozoa, alga seperti Spirogyra sp. dan kulapuk lendir dalam Protista","bucketId":"euk","note":"Betul! Mempunyai nukleus bermembran."},{"text":"Dinding sel diperbuat daripada peptidoglikan (murein) dan mengandungi plasmid","bucketId":"prok","note":"Tepat! Ciri khas Eubacteria."},{"text":"Semua organisma multisel dalam Plantae (fotoautotrof) dan Animalia (heterotrof)","bucketId":"euk","note":"Betul! Organisasi sel eukariot yang kompleks."}],"explanation":"Hanya Archaebacteria dan Eubacteria tergolong sebagai prokariot (unisel tanpa membran nukleus); Protista, Fungi, Plantae dan Animalia ialah eukariot."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan 6 Alam & Spesies KSSM","voiceCaption":"Padankan lima alam atau kumpulan bakteria ekstrem berikut dengan ciri atau contohnya yang tepat.","voiceScript":"[confident] Padankan kelima-lima kumpulan organisma dalam Sistem Enam Alam berikut dengan maklumat tepatnya!","prompt":"Padankan setiap alam atau kumpulan berikut dengan ciri atau contohnya:","pairs":[{"id":"b58u1m1","left":"Archaebacteria (Metanogen)","right":"Anaerob obligat di paya serta usus ruminan yang menghasilkan gas metana"},{"id":"b58u1m2","left":"Eubacteria","right":"Bakteria sebenar berdinding peptidoglikan/murein seperti Vibrio cholerae"},{"id":"b58u1m3","left":"Protista","right":"Eukariot ringkas tanpa tisu khusus merangkumi protozoa, alga dan kulapuk lendir"},{"id":"b58u1m4","left":"Fungi","right":"Eukariot berdinding kitin dan bermiselium seperti Saccharomyces cerevisiae"},{"id":"b58u1m5","left":"Carl Woese (1990)","right":"Mengusulkan sistem enam alam berdasarkan perbezaan RNA bakteria dan archaebacteria"}],"explanation":"Carl Woese (1990) memecahkan alam Monera (sistem 5 alam Robert Whittaker 1969) kepada Archaebacteria dan Eubacteria."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Habitat Termofil & Halofil","voiceCaption":"Ramalkan alam bagi mikroorganisma prokariot tanpa peptidoglikan yang ditemui hidup subur di mata air panas berasid bersuhu tujuh puluh lima darjah Celsius.","voiceScript":"[curious] Para penyelidik menemui sel prokariot unisel di mata air panas bersuhu tujuh puluh lima darjah Celsius yang dinding selnya tidak mengandungi peptidoglikan. Apakah pengelasan alam dan kumpulannya?","hook":"Periksa ciri Archaebacteria pada Makmal Enam Alam!","scenario":"Sampel air dari mata air panas berasid bersuhu 75°C di Taman Negara Yellowstone mengandungi sel unisel tanpa nukleus bermembran dan tanpa dinding peptidoglikan.","prompt":"Apakah alam dan kumpulan khusus organisma tersebut?","options":["Alam Archaebacteria (kumpulan Termofil, contohnya Sulfolobus sp.)","Alam Eubacteria (kerana semua bakteria mempunyai peptidoglikan)","Alam Fungi (kerana tahan suhu tinggi dengan dinding kitin)","Alam Protista (kumpulan kulapuk lendir)"],"correctIndex":0,"proofLabId":"bio58_enam_alam_lab","proofState":{"kingdom":"Archaebacteria"},"explanation":"Organisma prokariot tanpa peptidoglikan yang hidup pada suhu tinggi 60–80°C ialah termofil daripada alam Archaebacteria."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Susun Wajaran Fungi Alam Berasingan","voiceCaption":"Susun penjelasan mengapa kulat dikelaskan ke dalam alam Fungi tersendiri dan bukan dalam Plantae atau Animalia.","voiceScript":"[confident] Soalan Praktis Sumatif lapan! Susun blok jawapan berikut bagi menjelaskan mengapa kulat dikelaskan dalam alam Fungi tersendiri.","prompt":"Susun huraian mengapa kulat tidak dikelaskan dalam Plantae atau Animalia:","hint":"Nyatakan ketiadaan klorofil, dinding sel kitin dan badan bermiselium...","answerTokens":["Kulat tidak mempunyai klorofil dan bukan fotoautotrof seperti Plantae","sebaliknya bersifat heterotrof saprofit atau parasit","serta mempunyai dinding sel daripada kitin (bukan tanpa dinding sel seperti Animalia)","dengan badan yang terbina daripada rangkaian bebenang hifa iaitu miselium"],"distractors":["kerana kulat ialah prokariot unisel yang mempunyai plasmid dan peptidoglikan","dan mempunyai akar, batang serta daun sebenar untuk fotosintesis"],"explanation":"Kulat berbeza daripada Plantae (tiada klorofil, berdinding kitin bukan selulosa) dan berbeza daripada Animalia (mempunyai dinding sel kitin serta menyerap nutrien saprofit/parasit)."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s6","voiceToneLabel":"Cabaran Unit 1: Ciri Enam Alam","voiceCaption":"Pilih padanan betul antara nama saintifik organisma, alamnya dan jenis dinding selnya.","voiceScript":"[excited] Soalan penutup Unit satu! Pilih padanan alam, spesies dan bahan dinding sel yang seratus peratus tepat.","prompt":"Antara padanan organisma, alam dan ciri dinding sel berikut, manakah yang BETUL?","options":["Agaricus sp. -> Fungi -> Dinding sel kitin","Halobacterium salinarum -> Eubacteria -> Dinding sel peptidoglikan","Chlamydomonas sp. -> Plantae -> Dinding sel murein","Streptococcus pneumoniae -> Archaebacteria -> Tiada dinding sel"],"correctIndex":0,"explanation":"Agaricus sp. (cendawan) ialah kulat (Fungi) berdinding sel kitin. Halobacterium ialah Archaebacteria; Chlamydomonas ialah Protista; Streptococcus ialah Eubacteria berdinding peptidoglikan."}]},{"id":"bio58-u2","title":"Unit 2: Hierarki Linnaeus, Binomial & Kekunci Dikotomi","subtitle":"Subtopik 8.1 — 8 Aras Hierarki Taksonomi, Tatanama Binomial Linnaeus, Dr. Saw Leng Guan (FRIM) & Kekunci Dikotomi Kuplet/Labah-labah","iconType":"scale","iconUrl":"../assets/icons/bio58-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Hierarki Linnaeus & Tatanama Binomial","voiceCaption":"Sistem hierarki Linnaeus menyusun organisma dari Domain hingga Spesies, manakala sistem tatanama binomial menggunakan dua perkataan iaitu nama genus berhuruf besar dan nama spesies berhuruf kecil.","voiceScript":"[warm] Selamat datang ke Unit dua! Bagaimana saintis di seluruh dunia mengelaskan dan menamakan jutaan spesies tanpa kekeliruan? Mengikut sistem hierarki Linnaeus, terdapat lapan aras dari paling umum ke paling khusus: Domain, Alam, Filum, Kelas, Order, Famili, Genus dan Spesies! Organisma dalam spesies yang sama boleh saling membiak dan menghasilkan anak yang subur! Dalam sistem tatanama binomial Linnaeus pula, setiap nama saintifik terdiri daripada dua perkataan: perkataan pertama ialah nama Genus bermula huruf BESAR, dan perkataan kedua ialah nama spesies bermula huruf KECIL. Apabila dicetak, kedua-duanya diitalikkan seperti Alcedo atthis atau Panthera tigris jacksoni; apabila ditulis tangan, kedua-duanya mesti digariskan SECARA BERASINGAN! Malaysia juga bangga dengan ahli taksonomi terkemuka FRIM, Dr. Saw Leng Guan penerima Pingat Royal Botanic Garden Edinburgh dua ribu enam belas, serta penghasilan hibrid orkid MARDI seperti Dendrobium Datin Seri Jeanne!","title":"Hierarki Taksonomi Linnaeus, Binomial & Kekunci Dikotomi","acronym":"D•A•F•K•O•F•G•S","hook":"Uji laluan Kekunci Dikotomi Rajah 8.4 dan semak peraturan tulisan tatanama binomial pada Makmal Taksonomi di bawah!","mediaKey":"bio58_harimau_malaya","summary":"8 Aras Linnaeus: Domain -> Alam -> Filum -> Kelas -> Order -> Famili -> Genus -> Spesies. Tatanama Binomial: Genus (Huruf Besar) + spesies (huruf kecil), italik cetak / garis berasingan tulis.","bullets":["Hierarki Taksonomi Linnaeus: Domain (tertinggi/umum) -> Alam -> Filum -> Kelas -> Order -> Famili -> Genus -> Spesies (terkecil/khusus: boleh saling membiak dan menghasilkan keturunan subur).","3 Peraturan Tatanama Binomial Linnaeus: (1) Dua perkataan: Genus diikuti spesies; (2) Nama genus bermula huruf besar, nama spesies huruf kecil; (3) Dicetak dalam huruf italik (cth. Alcedo atthis, Pisum sativum L., Panthera tigris jacksoni) atau digaris secara BERASINGAN jika ditulis tangan.","Kekunci Dikotomi: Alat pengecaman berdasarkan persamaan dan perbezaan melalui siri kuplet (dua pernyataan berciri jelas dan tidak bertindih setiap langkah) atau bentuk kekunci labah-labah."],"labId":"bio58_taksonomi_dikotomi_lab","labTitle":"Simulator Kekunci Dikotomi & Tatanama Binomial","labProps":{"pick":"semut"},"examTip":"Kesalahan paling kerap pelajar dalam Kertas 2: menulis nama saintifik dengan satu garis panjang bersambung! Peraturan wajib: garis nama genus dan nama spesies SECARA BERASINGAN (cth. Panthera tigris digaris berasingan)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Urutan 8 Aras Hierarki Linnaeus","voiceCaption":"Susun lapan peringkat hierarki taksonomi Linnaeus bermula daripada aras paling umum (tertinggi) hingga aras paling khusus (terkecil).","voiceScript":"[confident] Susun kesemua lapan aras hierarki taksonomi Linnaeus bermula daripada Domain hingga ke Spesies!","prompt":"Susun urutan hierarki taksonomi Linnaeus dari paling umum hingga paling khusus:","hint":"Domain -> Alam -> Filum -> ...","answerTokens":["Domain","Alam","Filum","Kelas","Order","Famili","Genus","Spesies"],"distractors":["Subspesies","Varieti"],"explanation":"Urutan tepat 8 takson Linnaeus: Domain -> Alam -> Filum -> Kelas -> Order -> Famili -> Genus -> Spesies."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Ujian Spesies Sama atau Berlainan","voiceCaption":"Ramalkan cara seorang ahli biologi menentukan sama ada dua ekor amfibia yang hampir serupa rupa di hutan merupakan spesies yang sama atau spesies berlainan.","voiceScript":"[curious] Soalan Praktis Sumatif lapan! Nadine menemui dua ekor katak hutan yang morfologinya hampir serupa. Bagaimana Nadine boleh mengesahkan sama ada kedua-duanya spesies yang sama atau spesies berlainan?","hook":"Ingat kembali definisi biologi bagi takson 'Spesies'!","scenario":"Dua populasi amfibia di sebuah hutan hujan mempunyai rupa bentuk luaran yang hampir sama.","prompt":"Apakah kriteria biologi yang menentukan sama ada kedua-dua amfibia itu tergolong dalam spesies yang sama?","options":["Menguji sama ada kedua-duanya boleh saling membiak secara semula jadi dan menghasilkan keturunan (anak) yang subur","Memeriksa sama ada kedua-duanya makan serangga yang sama pada waktu malam","Menimbang jisim kering kedua-dua amfibia di dalam ketuhar 100°C","Melihat sama ada kedua-duanya berada di bawah kelas Amphibia yang sama"],"correctIndex":0,"proofLabId":"bio58_taksonomi_dikotomi_lab","proofState":{"pick":"semut"},"explanation":"Mengikut takrifan taksonomi biologi, individu dalam spesies yang sama berupaya saling membiak dan menghasilkan anak yang subur (keturunan mandul bermakna spesies berlainan)."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Kekunci Dikotomi & Binomial","voiceCaption":"Padankan lima konsep penamaan saintifik dan kekunci dikotomi berikut dengan maklumat tepatnya.","voiceScript":"[confident] Padankan kelima-lima item mengenai sistem penamaan dan pengecaman organisma ini!","prompt":"Padankan istilah dan tokoh taksonomi berikut dengan huraian tepatnya:","pairs":[{"id":"b58u2m1","left":"Felis catus (dalam Jadual 1)","right":"Nama saintifik kucing domestik: Genus Felis (huruf besar) + spesies catus (huruf kecil)"},{"id":"b58u2m2","left":"Huruf 'L.' dalam Pisum sativum L.","right":"Merujuk kepada Carolus Linnaeus, orang pertama yang menamakannya"},{"id":"b58u2m3","left":"Siri kuplet dalam kekunci dikotomi","right":"Sepasang pernyataan ciri yang saling bertentangan dan tidak bertindih"},{"id":"b58u2m4","left":"Dr. Saw Leng Guan (FRIM)","right":"Ahli taksonomi Malaysia penerima Pingat RBGE 2016 atas penyelidikan biodiversiti"},{"id":"b58u2m5","left":"Penulisan tangan nama saintifik","right":"Kedua-dua perkataan genus dan spesies mesti digaris secara berasingan"}],"explanation":"Felis catus (italik bila cetak / garis berasingan bila tulis), 'L.' merujuk Linnaeus, siri kuplet memilih ciri tidak bertindih dan Dr. Saw Leng Guan ialah ahli taksonomi terkemuka FRIM."},{"type":"sort","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Isih Penulisan Binomial Sah vs Salah","voiceCaption":"Kelaskan enam contoh penamaan saintifik dan kekunci dikotomi berikut antara Mematuhi Piawaian Taksonomi dengan Melanggar Piawaian.","voiceScript":"[confident] Uji ketelitian kamu mengesan kesilapan format nama saintifik! Asingkan keenam-enam contoh ini kepada Sah atau Salah.","prompt":"Isihkan format penulisan binomial dan peraturan kekunci dikotomi berikut:","buckets":[{"id":"sah","label":"Mematuhi Piawaian Taksonomi"},{"id":"salah","label":"Melanggar Piawaian"}],"items":[{"text":"Panthera tigris (dicetak italik, P besar, t kecil)","bucketId":"sah","note":"Tepat! Genus berhuruf besar, spesies berhuruf kecil dan dicetak italik."},{"text":"alcedo Atthis (genus huruf kecil, spesies huruf besar)","bucketId":"salah","note":"Betul! Terbalik — sepatutnya Alcedo atthis."},{"text":"Penulisan tangan dengan dua garis berasingan di bawah genus dan spesies","bucketId":"sah","note":"Tepat! Peraturan wajib tulisan tangan."},{"text":"Penulisan tangan dengan satu garisan panjang bersambung di bawah kedua-dua kata","bucketId":"salah","note":"Betul! Tidak boleh bersambung; wajib digaris berasingan."},{"text":"Ciri kuplet dikotomi menggunakan ciri morfologi jelas dan tidak bertindih","bucketId":"sah","note":"Tepat! Memudahkan pengecaman tanpa kekeliruan."},{"text":"Memilih ciri seperti 'saiz besar' vs 'berwarna cantik' dalam kekunci dikotomi","bucketId":"salah","note":"Betul! Ciri subjektif dan bertindih mesti dielakkan."}],"explanation":"Nama binomial mesti bermula huruf besar pada genus, huruf kecil pada spesies, dicetak italik atau digaris secara berasingan bila ditulis."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s6","voiceToneLabel":"Cabaran Unit 2: Kekunci Dikotomi Rajah 8.4","voiceCaption":"Gunakan kekunci dikotomi Rajah lapan perpuluhan empat untuk mengenal pasti laluan kuplet bagi organisma labah-labah.","voiceScript":"[excited] Soalan penutup Unit dua! Menggunakan kekunci dikotomi Rajah lapan perpuluhan empat, laluan manakah yang mengecam labah-labah dengan tepat?","prompt":"Berdasarkan kekunci dikotomi Rajah 8.4 (1a Haiwan -> 2; 2a Berkaki -> 3; 3a Tiga pasang kaki -> 4; 3b Lebih tiga pasang kaki -> Labah-labah), laluan manakah yang mengecam seekor labah-labah?","options":["1a -> 2a -> 3b","1a -> 2a -> 3a -> 4b","1a -> 2b -> 5b","1b -> 6b -> 7a"],"correctIndex":0,"explanation":"Labah-labah ialah haiwan (1a -> 2), mempunyai kaki (2a -> 3) dan mempunyai lebih daripada tiga pasang kaki iaitu empat pasang kaki (3b -> Labah-labah)."}]},{"id":"bio58-u3","title":"Unit 3: Biodiversiti, Pokok Filogeni & Pemuliharaan","subtitle":"Subtopik 8.2 — Diversiti Genetik, Spesies & Ekosistem, Pokok Filogeni & Struktur Homolog, Evolusi Tumbuhan Darat serta In Situ vs Ex Situ","iconType":"graph","iconUrl":"../assets/icons/bio58-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"3 Diversiti & Pokok Filogeni","voiceCaption":"Biodiversiti merangkumi diversiti genetik, spesies dan ekosistem, manakala pokok filogeni menggambarkan sejarah evolusi berdasarkan struktur homolog.","voiceScript":"[warm] Selamat datang ke Unit tiga, subtopik lapan perpuluhan dua: Biodiversiti! Mengikut Jadual lapan perpuluhan tiga, biodiversiti terbahagi kepada tiga aras: diversiti genetik iaitu variasi gen dalam populasi dan antara populasi spesies sama seperti kepelbagaian varieti padi; diversiti spesies merangkumi kekayaan spesies dan kesamarataan spesies; serta diversiti ekosistem meliputi pelbagai habitat komuniti biosis seperti ekosistem laut, padang pasir dan paya bakau! Bagaimana pula saintis membina pokok filogeni yang melakar sejarah evolusi organisma? Mereka mengkaji struktur homolog iaitu struktur anatomi serupa daripada leluhur yang sama walaupun fungsinya berbeza — contohnya susunan tulang anggota hadapan manusia, kucing, ikan paus dan kelawar! Manakala tumbuhan darat berevolusi daripada alga hijau ke lumut tanpa vaskular, paku pakis vaskular tanpa biji, gimnosperma konifer, hingga angiosperma berbunga dan berbuah!","title":"8.2 Tiga Jenis Biodiversiti, Struktur Homolog & Pokok Filogeni","acronym":"G•S•E•H","hook":"Bandingkan Pokok Filogeni & Struktur Homolog dengan Pemuliharaan In Situ vs Ex Situ pada Makmal Biodiversiti di bawah!","summary":"3 Jenis Biodiversiti (Genetik, Spesies, Ekosistem). Pokok filogeni berdasarkan struktur homolog (leluhur sama, fungsi berbeza). Pemuliharaan In Situ (habitat asal) vs Ex Situ (luar habitat).","bullets":["3 Jenis Biodiversiti (Jadual 8.3): (1) Diversiti Genetik (variasi gen individu dalam populasi & antara populasi akibat pemencilan/penyesuaian, cth. variasi padi); (2) Diversiti Spesies (kekayaan bilangan spesies & kesamarataan taburan spesies dalam komuniti, cth. hutan hujan tropika); (3) Diversiti Ekosistem (pelbagai habitat & proses ekologi daratan dan akuatik).","Pokok Filogeni & Struktur Homolog (Rajah 8.6 & 8.7): Filogeni = sejarah evolusi. Struktur homolog = jenis tulang/anatomi serupa daripada leluhur sama tetapi fungsi berbeza (anggota hadapan manusia, kucing, ikan paus & kelawar). Pokok filogeni tumbuhan darat: Alga hijau -> Lumut (bukan vaskular) -> Paku pakis (vaskular tanpa biji) -> Gimnosperma (berbiji konifer) -> Angiosperma (berbunga & biji dilindungi buah).","Pemuliharaan In Situ vs Ex Situ: In situ mengekalkan spesies di habitat asal (Taman Negara, hutan simpan kekal, Pusat Pemulihan Orang Utan Sepilok). Ex situ memelihara spesies di luar habitat asal (zoo, taman botani, bank biji benih)."],"labId":"bio58_filogeni_biodiversiti_lab","labTitle":"Makmal Pokok Filogeni, Homolog & Pemuliharaan","labProps":{"topic":"filogeni"},"examTip":"Skema Kertas 2: Mengapakah angiosperma menjadi kumpulan tumbuhan darat paling berjaya di bumi? Jawapan: Mempunyai bunga untuk pendebungaan berkesan serta biji benih yang dilindungi di dalam buah untuk mengekalkan kemandirian."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Pemuliharaan In Situ vs Ex Situ","voiceCaption":"Kelaskan enam lokasi dan tindakan pemuliharaan biodiversiti berikut antara Pemuliharaan In Situ dengan Pemuliharaan Ex Situ.","voiceScript":"[confident] Uji perbezaan in situ dengan ex situ! Asingkan keenam-enam contoh langkah pemuliharaan ini.","prompt":"Isihkan langkah pemuliharaan biodiversiti berikut kepada In Situ atau Ex Situ:","buckets":[{"id":"insitu","label":"Pemuliharaan In Situ (Habitat Asal)"},{"id":"exsitu","label":"Pemuliharaan Ex Situ (Luar Habitat Asal)"}],"items":[{"text":"Mengekalkan Harimau Malaya di Taman Negara dan hutan simpan kekal","bucketId":"insitu","note":"Tepat! Melindungi spesies terus di ekosistem semula jadinya."},{"text":"Memelihara spesies haiwan terancam di dalam zoo dan taman hidupan liar","bucketId":"exsitu","note":"Betul! Pemeliharaan terkawal di luar habitat asal."},{"text":"Pusat Pemulihan Orang Utan di Sepilok, Sabah","bucketId":"insitu","note":"Tepat! Contoh rasmi pemuliharaan in situ dalam buku teks."},{"text":"Menanam spesies tumbuhan nadir di taman botani dan menyimpan di bank biji benih","bucketId":"exsitu","note":"Betul! Melindungi plasma nutfah di luar hutan asal."},{"text":"Rondaan 24 jam PERHILITAN di habitat asal hutan untuk menghapuskan jerat pemburu","bucketId":"insitu","note":"Tepat! Melindungi spesies liar di dalam habitat semula jadinya."},{"text":"Pembiakan kurungan spesies terancam di pusat penyelidikan veterinar berasingan","bucketId":"exsitu","note":"Betul! Dilakukan di luar kawasan liar."}],"explanation":"In situ = di dalam habitat asal (Taman Negara, hutan simpan kekal, Sepilok); Ex situ = di luar habitat asal (zoo, taman botani, akuarium)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Pokok Filogeni Tumbuhan Darat","voiceCaption":"Susun urutan evolusi tumbuhan darat dalam pokok filogeni Rajah lapan perpuluhan tujuh daripada alga hijau hingga angiosperma.","voiceScript":"[confident] Susun blok evolusi berikut mengikut urutan pokok filogeni tumbuhan darat daripada leluhur alga hijau hingga tumbuhan berbunga!","prompt":"Susun urutan evolusi tumbuhan darat daripada alga hijau hingga angiosperma:","hint":"Bermula dari alga hijau -> bukan vaskular -> vaskular tanpa biji...","answerTokens":["Tumbuhan darat berevolusi daripada alga hijau menjadi tumbuhan bukan vaskular seperti lumut","kemudian berkembang kepada tumbuhan vaskular tanpa biji benih seperti paku pakis","diikuti tumbuhan vaskular berbiji benih tanpa buah iaitu gimnosperma (konifer)","dan akhirnya angiosperma berbunga dengan biji benih yang dilindungi di dalam buah"],"distractors":["yang seterusnya kehilangan sistem vaskular untuk hidup di gurun","bermula daripada kulat miselium yang memperoleh klorofil daripada bakteria"],"explanation":"Urutan Rajah 8.7: Alga hijau -> Lumut (tiada vaskular) -> Paku pakis (vaskular tanpa biji) -> Gimnosperma (biji tanpa buah) -> Angiosperma (berbunga & biji dalam buah)."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Aras Biodiversiti & Homolog","voiceCaption":"Padankan lima konsep daripada Subtopik lapan perpuluhan dua berikut dengan maksud tepatnya.","voiceScript":"[confident] Padankan kelima-lima konsep biodiversiti dan evolusi filogeni ini dengan jawapan tepatnya!","prompt":"Padankan konsep berikut dengan huraian tepatnya:","pairs":[{"id":"b58u3m1","left":"Diversiti genetik","right":"Variasi gen individu dalam populasi dan antara populasi spesies sama (cth. varieti padi)"},{"id":"b58u3m2","left":"Diversiti spesies","right":"Kekayaan spesies (bilangan) dan kesamarataan spesies dalam komuniti"},{"id":"b58u3m3","left":"Diversiti ekosistem","right":"Kepelbagaian habitat seperti ekosistem laut, padang pasir dan paya bakau"},{"id":"b58u3m4","left":"Struktur homolog","right":"Tulang serupa daripada leluhur sama tetapi fungsi berbeza (manusia, kucing, paus, kelawar)"},{"id":"b58u3m5","left":"Pokok filogeni","right":"Rajah bercabang mewakili hipotesis sejarah dan hubungan evolusi organisma"}],"explanation":"Tiga aras biodiversiti merangkumi gen, spesies dan ekosistem, manakala pokok filogeni membina hubungan evolusi melalui bukti struktur homolog."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Implikasi Kepupusan Spesies","voiceCaption":"Ramalkan kesan terhadap siratan makanan dan manusia sekiranya penebangan hutan tidak terkawal menyebabkan kepupusan satu spesies utama.","voiceScript":"[curious] Soalan Praktis Sumatif lapan! Apabila satu spesies pupus akibat penebangan hutan atau pemburuan haram, mengapakah banyak spesies lain serta kehidupan manusia turut terjejas?","hook":"Kaitkan kepupusan spesies dengan siratan makanan, ubat-ubatan dan keseimbangan ekosistem!","scenario":"Penebangan hutan secara meluas memusnahkan habitat di hutan hujan tropika sehingga beberapa spesies serangga pendebunga dan tumbuhan ubatan pupus.","prompt":"Apakah kesan rantaian terhadap alam sekitar dan manusia akibat kehilangan biodiversiti tersebut?","options":["Siratan makanan terganggu menyebabkan populasi spesies bergantung turut pupus atau tidak terkawal, kehilangan sumber makanan dan ubat-ubatan semula jadi, serta ketidakseimbangan kitar karbon dan air","Diversiti genetik meningkat secara mendadak apabila semua hutan ditebang","Tumbuhan angiosperma berevolusi kembali menjadi alga hijau dalam setahun","Tiada kesan kepada manusia selagi zoo masih menyimpan seekor haiwan"],"correctIndex":0,"proofLabId":"bio58_filogeni_biodiversiti_lab","proofState":{"topic":"pulihara"},"explanation":"Semua organisma saling bersandaran dalam siratan makanan dan kitar nutrien; kepupusan satu spesies mengganggu kestabilan ekosistem serta merugikan sumber makanan, ubat-ubatan dan penyelidikan manusia."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s6","voiceToneLabel":"Cabaran Unit 3: Contoh Struktur Homolog","voiceCaption":"Pilih pernyataan yang betul mengapa sirip ikan paus dan sayap kelawar dianggap sebagai struktur homolog.","voiceScript":"[excited] Soalan penutup Unit tiga! Mengapakah anggota hadapan ikan paus, kelawar, kucing dan manusia digolongkan sebagai struktur homolog?","prompt":"Mengapakah anggota hadapan manusia, kucing, ikan paus dan kelawar merupakan bukti struktur homolog dalam pengelasan filogeni?","options":["Keempat-empatnya terdiri daripada susunan jenis tulang yang sama yang diwarisi daripada satu leluhur yang sama, walaupun saiz tulang berubah untuk fungsi berbeza (memegang, berjalan, berenang, terbang)","Keempat-empatnya mempunyai fungsi yang seratus peratus sama untuk terbang di udara","Keempat-empatnya terhasil daripada mutasi virus mozek tembakau","Keempat-empat haiwan hidup di dalam ekosistem marin yang sama"],"correctIndex":0,"explanation":"Struktur homolog mempunyai pelan anatomi/tulang asas yang serupa (bukti leluhur sepunya dalam pokok filogeni) walaupun disesuaikan untuk fungsi berlainan."}]},{"id":"bio58-u4","title":"Unit 4: Mikroorganisma, Virus & Kitar Nitrogen","subtitle":"Subtopik 8.3 — Ciri Bakteria, Protozoa, Alga, Kulat & Virus (20–400 nm), Kitar Nitrogen (Rhizobium, Azotobacter, Nitrosomonas, Nitrobacter) & Peranan Ekologi","iconType":"atom","iconUrl":"../assets/icons/bio58-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"5 Kumpulan Mikroorganisma & Virus","voiceCaption":"Mikroorganisma terdiri daripada bakteria, protozoa, alga dan kulat, manakala virus bukan organisma bersel kerana hanya aktif membiak di dalam sel perumah.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik lapan perpuluhan tiga: Mikroorganisma dan Virus! Kenali lima kumpulan mikroskopik ini: pertama, Bakteria bersaiz satu hingga sepuluh mikrometer tanpa membran nukleus, memiliki D N A nukleoid serta plasmid, dan berbentuk kokus sfera, vibrio koma, basilus rod atau spirilum pilin! Kedua, Protozoa unisel berair seperti Amoeba bergerak dengan pseudopodium, Paramecium dengan silia dan Euglena autotrof berkloroplas dengan flagelum! Ketiga, Alga autotrof berkloroplas tanpa akar batang daun sebenar seperti Chlamydomonas dan Fucus! Keempat, Kulat berdinding kitin dengan hifa dan miselium seperti yis dan Mucor! Kelima, Virus bersaiz sangat seni dua puluh hingga empat ratus nanometer — hanya nampak di bawah mikroskop elektron, terdiri daripada asid nukleik D N A atau R N A dan kapsid protein, bukan sel dan tidak dimasukkan ke dalam enam alam kerana tidak menjalankan proses hidup di luar sel perumah!","title":"8.3 Ciri Bakteria, Protozoa, Alga, Kulat & Virus","acronym":"B•P•A•K•V","hook":"Periksa sebab virus dikecualikan daripada Sistem Enam Alam dan lihat 4 peringkat Kitar Nitrogen di bawah!","mediaKey":"bio58_protozoa_paramecium","summary":"Bakteria (1–10 µm, nukleoid/plasmid, 4 bentuk), Protozoa (pseudopodium/silia/flagelum), Alga (autotrof tanpa organ sebenar), Kulat (kitin, hifa/miselium) & Virus (20–400 nm, asid nukleik + kapsid, bukan sel).","bullets":["Bakteria & Virus: Bakteria (1–10 µm) ada DNA di nukleoid + plasmid; bentuk kokus (sfera), vibrio (koma), basilus (rod) dan spirilum (pilin). Virus (20–400 nm, mikroskop elektron) terbina daripada asid nukleik (DNA atau RNA) dan kapsid protein; bukan sel dan tiada proses hidup di luar sel perumah (cth. HIV, bakteriofaj T4, virus mozek tembakau).","Protozoa, Alga & Kulat: Protozoa bergerak dengan pseudopodium (Amoeba), silia (Paramecium) atau flagelum (Euglena — boleh berfotosintesis). Alga ada kloroplas tanpa akar/batang/daun sebenar (Chlamydomonas, Fucus). Kulat heterotrof berdinding kitin dan bermiselium (yis, Mucor).","4 Peranan Ekologi: Pengeluar akuatik (fitoplankton: alga hijau, sianobakteria, dinoflagelat, diatom), Pengurai (kulat & bakteria saprofit kembalikan C, N, S ke tanah), Parasit (Plasmodium dalam nyamuk Anopheles betina) dan Simbion (Ektosimbion: ektomikoriza luar sel akar; Endosimbion: protozoa Trichonympha dalam salur alimentari anai-anai)."],"labId":"bio58_mikrob_kitar_n_sim","labTitle":"Simulator Kitar Nitrogen & Galeri Mikroorganisma","labProps":{"stage":"pengikat"},"examTip":"Skema Kertas 2: Mengapakah virus TIDAK dikelaskan dalam sistem enam alam? Kerana virus bukan organisma bersel (tiada sitoplasma/membran sel/organel) dan tidak menjalankan proses hidup seperti respirasi atau pertumbuhan di luar sel perumah."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Bakteria Kitar Nitrogen & Simbion","voiceCaption":"Padankan lima mikroorganisma kitar nitrogen dan simbion berikut dengan fungsi tepat masing-masing.","voiceScript":"[confident] Uji ingatan kamu tentang peranan bakteria dalam Kitar Nitrogen dan jenis simbion!","prompt":"Padankan setiap mikroorganisma berikut dengan peranannya:","pairs":[{"id":"b58u4m1","left":"Rhizobium sp. & Azotobacter sp.","right":"Bakteria pengikat nitrogen menukarkan gas N2 kepada ion ammonium (NH4+)"},{"id":"b58u4m2","left":"Nitrosomonas sp.","right":"Bakteria nitrifikasi menukarkan ion ammonium (NH4+) kepada ion nitrit (NO2-)"},{"id":"b58u4m3","left":"Nitrobacter sp.","right":"Bakteria nitrifikasi menukarkan ion nitrit (NO2-) kepada ion nitrat (NO3-)"},{"id":"b58u4m4","left":"Bakteria pendenitritan","right":"Menukarkan ion nitrat (NO3-) di dalam tanah kembali menjadi gas nitrogen (N2)"},{"id":"b58u4m5","left":"Trichonympha sp. vs Ektomikoriza","right":"Endosimbion dalam salur alimentari anai-anai vs Ektosimbion di luar akar"}],"explanation":"Empat bakteria utama kitar nitrogen: pengikat (Rhizobium/Azotobacter), nitrifikasi 1 (Nitrosomonas), nitrifikasi 2 (Nitrobacter) dan pendenitritan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Kitar Nitrogen: 4 Kumpulan Bakteria","voiceCaption":"Kitar nitrogen menukarkan gas nitrogen atmosfera kepada nitrat melalui bakteria pengikat nitrogen, pengurai ammonifikasi, bakteria nitrifikasi Nitrosomonas dan Nitrobacter, serta bakteria pendenitritan.","voiceScript":"[warm] Sekarang kuasai Rajah lapan perpuluhan empat belas: Kitar Nitrogen yang sangat kerap keluar dalam peperiksaan SPM! Tumbuhan hanya dapat menyerap nitrogen dalam bentuk ion ammonium atau ion nitrat larut. Mula-mula, bakteria pengikat nitrogen iaitu Rhizobium di dalam nodul akar tumbuhan legum dan Azotobacter yang hidup bebas di dalam tanah mengikat gas nitrogen menjadi ion ammonium! Kilat pula mengoksidakan nitrogen kepada nitrogen dioksida lalu larut dalam hujan menjadi garam nitrat! Seterusnya, apabila tumbuhan dan haiwan mati, bakteria serta kulat saprofit pengurai menguraikan protein kepada ion ammonium melalui ammonifikasi! Kemudian berlaku dua langkah nitrifikasi: Nitrosomonas menukarkan ammonium kepada nitrit, dan Nitrobacter menukarkan nitrit kepada nitrat untuk diserap akar tumbuhan! Akhir sekali, bakteria pendenitritan menukarkan nitrat kembali kepada gas nitrogen ke atmosfera!","title":"Rajah 8.14: Kitar Nitrogen Lengkap & Bakteria Terlibat","acronym":"R•A•N•N•P","hook":"Klik setiap langkah Kitar Nitrogen pada Simulator di bawah untuk membezakan tugas Rhizobium, Nitrosomonas, Nitrobacter dan pendenitritan!","mediaKey":"bio58_nodul_legum","videoClip":{"src":"../assets/biologi-t5-bab08/video/bio58_video_taksonomi_nitrogen_narasi.mp4","hasNarration":true,"posterKey":"bio58_nodul_legum","caption":"Pengelasan 6 Alam organisma dan peranan bakteria pengikat nitrogen serta penitritan dalam kitar nitrogen."},"summary":"Pengikatan N2 (Rhizobium, Azotobacter) -> NH4+; Ammonifikasi (Pengurai) -> NH4+; Nitrifikasi (Nitrosomonas -> NO2-, Nitrobacter -> NO3-); Pendenitritan (NO3- -> N2).","bullets":["Pengikatan Nitrogen & Kilat: Rhizobium sp. (nodul akar legum) & Azotobacter sp. (bebas dalam tanah) menukar N2 -> NH4+. Kilat mengoksidakan N2 -> NO2 -> larut air hujan membentuk asid nitrus & nitrik -> garam nitrat tanah.","Ammonifikasi & Nitrifikasi: Pengurai (bakteria/kulat saprofit) menukar protein organisma mati -> ion ammonium (NH4+). Nitrosomonas sp. menukar NH4+ -> ion nitrit (NO2-), lalu Nitrobacter sp. menukar NO2- -> ion nitrat (NO3-) yang diserap tumbuhan untuk sintesis protein.","Pendenitritan: Bakteria pendenitritan menukar nitrat (NO3-) di dalam tanah kembali menjadi gas nitrogen (N2) ke atmosfera."],"labId":"bio58_mikrob_kitar_n_sim","labTitle":"Teroka 4 Peringkat Kitar Nitrogen (Rajah 8.14)","labProps":{"stage":"nitrifikasi"},"examTip":"Petua hafal nitrifikasi: 'S' datang sebelum 'B' dalam abjad atau 'Nitrosomonas -> nitrit (NO2-)' dan 'Nitrobacter -> nitrat (NO3-)' ('B' untuk Banyak oksigen = NO3-)!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Peranan Ekologi & Ciri Mikrob","voiceCaption":"Kelaskan enam contoh mikroorganisma dan virus berikut antara Peranan Kitaran/Pengeluar/Simbion dengan Ciri Virus & Parasit.","voiceScript":"[confident] Asingkan keenam-enam fakta mikroorganisma dan virus ini mengikut kumpulannya!","prompt":"Isihkan pernyataan berikut mengikut kategori yang betul:","buckets":[{"id":"baik","label":"Pengeluar, Pengurai & Simbion"},{"id":"vp","label":"Ciri Virus & Parasit"}],"items":[{"text":"Fitoplankton (alga hijau, sianobakteria, diatom) sebagai pengeluar rantai makanan akuatik","bucketId":"baik","note":"Tepat! Menjalankan fotosintesis di permukaan air."},{"text":"Kulat dan bakteria saprofit merembes enzim pencernaan ke bahan mereput (ammonifikasi)","bucketId":"baik","note":"Betul! Mengembalikan unsur karbon, nitrogen dan sulfur ke tanah."},{"text":"Terdiri daripada asid nukleik (DNA atau RNA) dan kapsid protein bersaiz 20–400 nm","bucketId":"vp","note":"Tepat! Ciri struktur virus yang hanya dilihat melalui mikroskop elektron."},{"text":"Plasmodium sp. dalam nyamuk Anopheles betina yang mencetuskan malaria","bucketId":"vp","note":"Betul! Contoh protozoa parasit."},{"text":"Ektomikoriza (luar sel akar) dan Trichonympha sp. (dalam sel/salur anai-anai)","bucketId":"baik","note":"Tepat! Contoh ektosimbion dan endosimbion."},{"text":"Menyuntik bahan genetik ke dalam sel hidup kerana tiada proses hidup di luar perumah","bucketId":"vp","note":"Betul! Virus ialah parasit intrasel obligat."}],"explanation":"Mikroorganisma berperanan sebagai pengeluar (fitoplankton), pengurai (saprofit), simbion (ektomikoriza/Trichonympha) dan parasit (Plasmodium), manakala virus ialah entiti bukan sel."},{"type":"predict","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Ramal Plot Tanaman Legum & Kesuburan Tanah","voiceCaption":"Ramalkan bagaimana penanaman pokok kekacang (legum) secara bergilir dapat memulihkan kesuburan plot tanah tanpa baja kimia berlebihan.","voiceScript":"[curious] Soalan Minda Abad ke-21 Praktis Sumatif lapan! Seorang murid diberi plot tanah yang kurang subur lalu disarankan menanam pokok kekacang atau legum. Bagaimana pokok legum memulihkan kesuburan tanah?","hook":"Ingat kembali simbiosis bakteria Rhizobium sp. di dalam nodul akar tumbuhan legum!","scenario":"Seorang petani menanam tumbuhan legum seperti kacang panjang dan kacang soya secara bergilir di atas plot tanah pertanian.","prompt":"Bagaimanakah penanaman tumbuhan legum mengekalkan dan meningkatkan kesuburan plot tanah tersebut?","options":["Nodul akar tumbuhan legum mengandungi bakteria Rhizobium sp. yang mengikat gas nitrogen atmosfera kepada ion ammonium, lalu ditukarkan oleh bakteria nitrifikasi kepada nitrat untuk menyuburkan tanah","Akar pokok legum menjalankan pendenitritan untuk membebaskan nitrat keluar dari tanah","Pokok legum membunuh semua kulat saprofit pengurai di dalam tanah","Bakteria Rhizobium menukarkan virus mozek tembakau menjadi fosfat"],"correctIndex":0,"proofLabId":"bio58_mikrob_kitar_n_sim","proofState":{"stage":"pengikat"},"explanation":"Tumbuhan legum bersimbiosis dengan bakteria pengikat nitrogen (Rhizobium sp.) dalam nodul akarnya; apabila tumbuhan reput atau melalui pengikatan aktif, kandungan ammonium dan nitrat tanah bertambah secara semula jadi."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Unit 4: Parasit vs Perumah","voiceCaption":"Pilih sebab mengapa kebanyakan organisma parasit tidak membunuh perumahnya dengan serta-merta.","voiceScript":"[excited] Soalan Praktis Formatif lapan perpuluhan tiga! Mengapakah kebanyakan parasit tidak membunuh perumah yang ditumpanginya?","prompt":"Mengapakah organisma parasit lazimnya tidak membunuh perumahnya dengan serta-merta?","options":["Kerana parasit bergantung hidup dan terus mendapat nutrien serta perlindungan daripada perumah selagi perumah itu masih hidup; kematian perumah turut menamatkan sumber hidup parasit","Kerana parasit menjalankan fotosintesis sendiri apabila perumah mati","Kerana parasit akan bertukar menjadi pengeluar fitoplankton","Kerana parasit membantu perumah mengikat gas nitrogen"],"correctIndex":0,"explanation":"Parasit memperoleh faedah (nutrien dan habitat) secara berterusan hanya selagi interaksi dengan perumah hidup berkekalan."}]},{"id":"bio58-u5","title":"Unit 5: Patogen, Vektor & Penyakit Berjangkit","subtitle":"Subtopik 8.3 — Definisi Patogen & Vektor, Nyamuk Wolbachia (Inovasi Malaysia), Lalat/Lipas/Aedes/Anopheles & Jadual 8.4 Simptom Penyakit","iconType":"crown","iconUrl":"../assets/icons/bio58-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Patogen, Vektor & Inovasi Wolbachia","voiceCaption":"Patogen ialah organisma penyebab penyakit seperti virus, bakteria, protozoa dan kulat, manakala vektor ialah organisma pembawa patogen seperti nyamuk Aedes, nyamuk Anopheles, lalat dan lipas.","voiceScript":"[warm] Selamat datang ke Unit lima! Mari bezakan patogen dengan vektor dengan jelas: Patogen ialah organisma penyebab penyakit (virus, bakteria, protozoa dan kulat) yang merosakkan sel badan atau merembeskan toksin, manakala Vektor ialah organisma yang membawa dan memindahkan patogen seperti nyamuk Aedes aegypti (virus denggi), nyamuk tiruk betina Anopheles (protozoa Plasmodium penyebab malaria), lalat (bakteria Vibrio cholerae penyebab kolera) serta lipas Periplaneta americana (bakteria Salmonella typhi penyebab tifoid)! Malaysia juga memperkenalkan inovasi nyamuk disuntik bakteria Wolbachia ke dalam telur Aedes aegypti untuk merencatkan pertumbuhan virus denggi dan menyekat wabak denggi! Kenali juga simptom empat penyakit dalam Jadual lapan perpuluhan empat: Hepatitis B oleh virus (sirosis hati, abdomen bengkak, sklera mata kuning), Tuberkulosis oleh bakteria (hilang berat, batuk berdarah, sesak nafas), Disentri oleh protozoa (sakit perut, cirit-birit, muntah) dan Panau oleh kulat (tompok putih/merah jambu pada kulit)!","title":"Patogen, Vektor, Inovasi Wolbachia & Jadual 8.4","acronym":"P•V•W•J","hook":"Klik setiap kumpulan patogen pada Makmal Patogen & Vektor di bawah untuk memadankan vektor dan simptom Jadual 8.4!","mediaKey":"bio58_aedes_vektor","summary":"Patogen (virus, bakteria, protozoa, kulat) vs Vektor (Aedes, Anopheles, lalat, lipas). Inovasi Wolbachia merencat virus denggi dalam nyamuk Aedes. Jadual 8.4: Hepatitis B, Tibi, Disentri & Panau.","bullets":["Patogen & Vektor (Rajah 8.15): Lalat -> Vibrio cholerae (kolera); Nyamuk Aedes aegypti -> Virus denggi; Nyamuk Anopheles betina -> Plasmodium sp. (malaria); Lipas (Periplaneta americana) -> Salmonella typhi (demam kepialu/tifoid).","Inovasi Malaysia (Wolbachia): Bakteria Wolbachia disuntik ke dalam telur nyamuk Aedes aegypti untuk merencatkan pertumbuhan virus denggi di dalam nyamuk dan menghalang penyebarannya.","Jadual 8.4 Simptom Penyakit: Hepatitis B [Virus] (radang/sirosis hati, abdomen bengkak, kulit & sklera mata kuning); Tuberkulosis/Tibi [Bakteria] (hilang berat badan, batuk berdarah, sesak nafas); Disentri [Protozoa] (sakit perut, cirit-birit, muntah); Panau [Kulat] (tompok putih atau merah jambu pada kulit)."],"labId":"bio58_patogen_vektor_lab","labTitle":"Makmal Patogen, Vektor & Simptom Jadual 8.4","labProps":{"pat":"virus"},"examTip":"Skema Kertas 1 & 2: Jangan keliru antara Plasmodium sp. (PATOGEN protozoa penyebab malaria) dengan nyamuk Anopheles betina (VEKTOR pembawa Plasmodium)."},{"type":"match","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Padan Patogen, Vektor & Simptom","voiceCaption":"Padankan lima penyakit atau patogen daripada Jadual lapan perpuluhan empat dan Rajah lapan perpuluhan lima belas dengan vektor atau simptomnya.","voiceScript":"[confident] Uji ketepatan kamu memadankan patogen, vektor dan simptom penyakit berjangkit!","prompt":"Padankan patogen atau penyakit berikut dengan vektor atau simptom tepatnya:","pairs":[{"id":"b58u5m1","left":"Hepatitis B (Virus)","right":"Radang/sirosis hati, abdomen bengkak, kulit dan sklera mata kuning"},{"id":"b58u5m2","left":"Tuberkulosis / Tibi (Bakteria)","right":"Hilang berat badan, batuk berdarah dan sesak nafas"},{"id":"b58u5m3","left":"Disentri (Protozoa) & Panau (Kulat)","right":"Sakit perut/cirit-birit/muntah vs Tompok putih atau merah jambu pada kulit"},{"id":"b58u5m4","left":"Vibrio cholerae & Salmonella typhi","right":"Bakteria disebarkan melalui vektor lalat dan lipas pada makanan tercemar"},{"id":"b58u5m5","left":"Bakteria Wolbachia","right":"Disuntik ke dalam telur Aedes aegypti bagi merencat pertumbuhan virus denggi"}],"explanation":"Menguasai padanan tepat antara jenis patogen (virus/bakteria/protozoa/kulat), vektornya dan simptom Jadual 8.4 adalah kunci skor penuh."},{"type":"sort","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Isih Patogen vs Vektor Pembawa","voiceCaption":"Kelaskan enam organisma berikut sama ada tergolong sebagai Patogen (penyebab penyakit) atau Vektor (pembawa patogen).","voiceScript":"[confident] Asingkan keenam-enam organisma ini antara Patogen penyebab penyakit dengan Vektor pembawa patogen!","prompt":"Isihkan organisma berikut kepada kategori Patogen atau Vektor:","buckets":[{"id":"patogen","label":"Patogen (Penyebab Penyakit)"},{"id":"vektor","label":"Vektor (Pembawa Patogen)"}],"items":[{"text":"Vibrio cholerae (bakteria kolera) dan Salmonella typhi","bucketId":"patogen","note":"Tepat! Bakteria yang membiak dalam tubuh pesakit dan merembes toksin."},{"text":"Nyamuk Aedes aegypti dan nyamuk Anopheles betina","bucketId":"vektor","note":"Betul! Serangga yang memindahkan virus denggi atau Plasmodium."},{"text":"Protozoa Plasmodium sp. dan virus Hepatitis B","bucketId":"patogen","note":"Tepat! Masing-masing menyebabkan malaria dan radang hati."},{"text":"Lalat rumah dan lipas (Periplaneta americana)","bucketId":"vektor","note":"Betul! Memindahkan bakteria daripada najis atau sampah ke makanan."},{"text":"Kulat Tinea sp. (panau) dan Human papillomavirus","bucketId":"patogen","note":"Tepat! Contoh kulat dan virus penyebab penyakit dalam Aktiviti 8.5."},{"text":"Tikus yang membawa bakteria penyakit di bangunan terbiar (Aktiviti 8.6)","bucketId":"vektor","note":"Betul! Haiwan pembawa patogen yang perlu diperangkap secara mesra alam."}],"explanation":"Patogen ialah mikrob/virus yang menyebabkan penyakit; Vektor ialah haiwan/serangga seperti nyamuk, lalat, lipas dan tikus yang memindahkan patogen."},{"type":"predict","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Ramal Kawalan Perosak Terpilih Anai-anai","voiceCaption":"Ramalkan cara saintis mencipta kaedah penghapusan anai-anai secara terpilih tanpa membunuh serangga berfaedah seperti lebah.","voiceScript":"[curious] Soalan Praktis Sumatif lapan! Bagaimana ahli biologi boleh menghasilkan kaedah kawalan yang hanya membunuh anai-anai tetapi selamat kepada lebah dan serangga berfaedah lain?","hook":"Ingat hubungan endosimbion protozoa Trichonympha sp. di dalam salur alimentari anai-anai!","scenario":"Anai-anai merosakkan struktur kayu rumah, namun semburan racun kimia berspektrum luas membunuh lebah pendebunga di taman.","prompt":"Apakah sasaran biologi paling tepat untuk menghapuskan anai-anai tanpa menjejaskan serangga berfaedah lain?","options":["Menggunakan bahan yang memusnahkan protozoa endosimbion Trichonympha sp. di dalam usus anai-anai supaya anai-anai tidak dapat mencerna selulosa kayu lalu mati kebuluran, sementara serangga lain tidak terjejas","Menyembur racun serangga kimia di semua bunga taman","Melepaskan nyamuk Aedes ber-Wolbachia ke dalam sarang anai-anai","Menghapuskan semua pokok kayu balak di hutan"],"correctIndex":0,"proofLabId":"bio58_patogen_vektor_lab","proofState":{"pat":"protozoa"},"explanation":"Anai-anai bergantung kepada endosimbion protozoa Trichonympha sp. di dalam salur alimentarinya untuk merembeskan enzim selulase mencerna kayu; menyasarkan Trichonympha sp. menghapuskan anai-anai secara spesifik tanpa membunuh lebah."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Susun Mekanisme Nyamuk Wolbachia","voiceCaption":"Susun huraian inovasi Malaysia menggunakan bakteria Wolbachia untuk mengurangkan kes demam denggi.","voiceScript":"[confident] Susun blok fakta berikut bagi menerangkan inovasi Malaysia menyuntik bakteria Wolbachia ke dalam nyamuk Aedes aegypti!","prompt":"Susun penerangan inovasi bakteria Wolbachia dalam mengawal penyebaran denggi:","hint":"Bakteria Wolbachia disuntik ke dalam telur nyamuk -> virus denggi...","answerTokens":["Bakteria Wolbachia disuntik ke dalam telur nyamuk Aedes aegypti","dan membiak di dalam badan nyamuk dewasa tanpa membunuh nyamuk tersebut","untuk merencatkan pertumbuhan serta pembiakan virus denggi di dalam nyamuk","sekali gus menghalang penyebaran virus denggi kepada manusia apabila digigit"],"distractors":["untuk menukarkan nyamuk Aedes menjadi vektor Plasmodium malaria","supaya nyamuk membunuh semua lipas dan lalat di kawasan bandar"],"explanation":"Kehadiran bakteria Wolbachia dalam nyamuk Aedes aegypti merencatkan replikasi virus denggi, sekali gus menyekat penularan denggi kepada manusia."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s6","voiceToneLabel":"Cabaran Unit 5: Cara Patogen Menyebabkan Sakit","voiceCaption":"Pilih dua mekanisme utama bagaimana patogen menyebabkan kerosakan dan kesakitan pada tubuh manusia.","voiceScript":"[excited] Soalan penutup Unit lima! Bagaimanakah patogen seperti bakteria dan virus menyebabkan manusia jatuh sakit apabila menjangkiti badan?","prompt":"Bagaimanakah patogen seperti virus dan bakteria menyebabkan simptom penyakit pada tubuh manusia?","options":["Membunuh atau memusnahkan sel badan, merencatkan fungsi sel badan serta merembeskan toksin yang merosakkan metabolisme atau menyebabka engikatan nitrogen oleh Rhizobium sp. di nodul legum dan Azotobacter sp.","bucketId":"tambah","note":"Tepat! Menukarkan gas N2 udara kepada ammonium."},{"text":"Tindakan bakteria pendenitritan menukarkan nitrat (NO3-) kepada gas nitrogen (N2)","bucketId":"kurang","note":"Betul! Membebaskan gas N2 kembali ke atmosfera."},{"text":"Kilat semasa ribut petir membentuk oksida nitrogen yang larut dalam hujan","bucketId":"tambah","note":"Tepat! Menghasilkan garam nitrat dalam tanah."},{"text":"Ammonifikasi oleh kulat dan bakteria saprofit ke atas bangkai dan najis","bucketId":"tambah","note":"Betul! Membebaskan ion ammonium ke dalam tanah."},{"text":"Penyerapan ion nitrat oleh rambut akar untuk sintesis protein tumbuhan","bucketId":"kurang","note":"Tepat! Memindahkan nitrat dari tanah ke dalam tisu tumbuhan."},{"text":"Nitrifikasi berturut oleh Nitrosomonas sp. dan Nitrobacter sp.","bucketId":"tambah","note":"Betul! Menghasilkan ion nitrat tersedia dalam tanah."}],"explanation":"Pengikatan N2, kilat, ammonifikasi, baja dan nitrifikasi menambah ion ammonium/nitrat dalam tanah; pendenitritan dan penyerapan tumbuhan mengurangkan nitrat tanah."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Kesan Eutrofikasi & Pengurusan Tasik","voiceCaption":"Pilih pernyataan yang betul tentang langkah pemeliharaan serta pemuliharaan biodiversiti di Malaysia.","voiceScript":"[excited] Soalan KBAT Praktis Sumatif lapan! Antara strategi berikut, manakah gabungan tepat pemeliharaan dan pemuliharaan biodiversiti di Malaysia?","prompt":"Manakah antara strategi berikut menggabungkan pemuliharaan IN SITU dan EX SITU dengan TEPAT untuk melindungi spesies terancam di Malaysia?","options":["Menguatkuasakan Akta Pemuliharaan Hidupan Liar 2010 dan rondaan 24 jam PERHILITAN di Taman Negara (In situ) serta membiakkan spesies terancam di zoo dan taman botani (Ex situ)","Memindahkan semua pokok hutan hujan ke dalam akuarium rumah kaca (In situ)","Menghapuskan semua bakteria pengurai dan serangga pendebunga di hutan simpan","Menukar Taman Negara menjadi ladang monokultur tunggal sepenuhnya"],"correctIndex":0,"explanation":"Gabungan penguatkuasaan undang-undang & perlindungan habitat asal (In situ) bersama pembiakan serta penyimpanan di zoo/taman botani (Ex situ) memastikan kelangsungan biodiversiti."},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss 5: Huraian Kitar Nitrogen Lengkap","voiceCaption":"Susun perjalanan atom nitrogen dari atmosfera ke tisu tumbuhan, ke tisu haiwan dan kembali ke atmosfera.","voiceScript":"[confident] Susun esei lengkap Praktis Sumatif lapan mengenai kitaran penuh nitrogen daripada atmosfera kepada haiwan lalu kembali ke atmosfera!","prompt":"Susun kitaran penuh nitrogen daripada atmosfera hingga kembali ke atmosfera:","hint":"Pengikatan N2 -> Nitrifikasi -> Penyerapan & Pemakanan -> Ammonifikasi & Pendenitritan...","answerTokens":["Gas nitrogen diikat oleh Rhizobium sp. atau Azotobacter sp. menjadi ammonium lalu dioksidakan oleh Nitrosomonas dan Nitrobacter kepada nitrat","kemudian nitrat diserap oleh akar tumbuhan untuk mensintesis protein sebelum dimakan oleh haiwan","dan apabila tumbuhan serta haiwan mati, pengurai menjalankan ammonifikasi membentuk ammonium semula","manakala bakteria pendenitritan menukarkan nitrat tanah kembali menjadi gas nitrogen ke atmosfera"],"distractors":["di mana virus bakteriofaj menukarkan nitrogen menjadi lignin dalam salur xilem","lalu protozoa Trichonympha menyerap nitrat terus daripada udara"],"explanation":"Kitaran lengkap: N2 -> NH4+ (Rhizobium/Azotobacter) -> NO2- (Nitrosomonas) -> NO3- (Nitrobacter) -> protein tumbuhan & haiwan -> NH4+ (pengurai) -> N2 (pendenitritan)."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Sintesis Penuh Bab 8","voiceCaption":"Pilih gabungan fakta yang betul kesemuanya merangkumi enam alam, binomial, filogeni, kitar nitrogen dan patogen.","voiceScript":"[excited] Soalan terakhir Cabaran Boss Bab lapan! Pilih jawapan yang seratus peratus tepat untuk melengkapkan koleksi trofi Bab lapan!","prompt":"Antara kombinasi fakta Bab 8 berikut, manakah yang BETUL kesemuanya?","options":["Fungi berdinding kitin | Alcedo atthis italik | Struktur homolog leluhur sama | Nitrosomonas: NH4+ -> NO2- | Vektor kolera: lalat","Archaebacteria berdinding peptidoglikan | Nama spesies berhuruf besar | Ektomikoriza dalam sel anai-anai | Nitrobacter: NO3- -> N2","Virus dikelaskan dalam Protista | Sepilok ialah contoh ex situ | Euglena bergerak dengan pseudopodium | Panau disebabkan protozoa","Whittaker usulkan 6 alam | Angiosperma wujud sebelum lumut | Rhizobium menukar nitrat menjadi N2 | Lipas membawa Plasmodium"],"correctIndex":0,"explanation":"Tahniah! Semua fakta dalam pilihan pertama tepat sepenuhnya mengikut KSSM Biologi Tingkatan 5 Bab 8."}]}]};</script>

  var d = NOTA_ICONS[name] || NOTA_ICONS.book;

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");

    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;

    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

function buildConceptSlides(step, parts) {
  var slides = [];
  var isBite = parts.isBite;
  var bullets = parts.bullets || [];
  var titleMiniHtml = '<h3 class="flash-slide-title">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h3>";

  if (isBite) {
    if (parts.heroMediaHtml) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + parts.heroMediaHtml
      });
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        if (bullets.length > 0 || parts.formulaHtml || parts.biteTipHtml) {
          slides.push({
            label: tUi("Fakta & Tip", "Key Facts"),
            html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
          });
        }
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      } else if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      } else if (bullets.length >= 2) {
        slides.push({
          label: tUi("Fakta 1", "Fact 1"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta 2 & Tip", "Fact 2 & Tip"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
    } else {
      if (bullets.length >= 2) {
        slides.push({
          label: tUi("Konsep 1", "Concept 1"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
    }
    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {
      var headLead = !primaryVisual ? (parts.hookHtml + parts.titleHtml + summaryLeadHtml) : titleMiniHtml;
      slides.push({
        label: tUi("Peta Konsep", "Concept Map"),
        hasMindMap: Boolean(parts.mindMapHostHtml),
        html: headLead + parts.mindMapHostHtml + parts.formulaHtml + parts.deepDrawerHtml
      });
    }
    if (parts.labHtml) {
      slides.push({
        label: tUi("Makmal", "Lab"),
        hasLab: true,
        html: titleMiniHtml + parts.labHtml
      });
    }
  }

  return slides;
}

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
