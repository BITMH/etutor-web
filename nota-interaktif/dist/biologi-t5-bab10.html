/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

}

#lessonView:not([hidden]) {

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab10","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":10,"title":"Kelestarian Alam Sekitar","subtitle":"Ancaman Ekosistem & BOD, Pemeliharaan & Pemuliharaan, Amalan 5R & Sekuriti Makanan serta Dasar Teknologi Hijau","estimatedMinutes":55,"themeAccent":"#059669","isFreePreview":false,"labScript":"../data/biologi-t5-bab10-labs.js","coverIcon":"../assets/icons/bio510-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat sekali! Pemahaman kelestarian alam sekitar kamu sangat mantap.","combo":"[excited] Hebat! Jawapan berturut-turut menunjukkan penguasaan penuh konsep ekologi.","encourage":"[gentle] Cuba semak semula hubungan gas rumah hijau, nilai BOD dan kaedah pemuliharaan.","celebrate":"[celebratory] Tahniah! Kamu telah menamatkan semua unit Bab sepuluh Kelestarian Alam Sekitar!"},"units":[{"id":"bio510-u1","title":"Unit 1: Ancaman Alam Sekitar, Eutrofikasi & BOD","subtitle":"Subtopik 10.1 — Kesan Rumah Hijau, El Nino vs La Nina, Hujan Asid (pH < 5), Penyahhutanan, Eutrofikasi & Eksperimen Metilena Biru","iconType":"leaf","iconUrl":"../assets/icons/bio510-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Kesan Rumah Hijau, Eutrofikasi & Nilai BOD","voiceCaption":"Kelestarian alam sekitar terancam oleh pemanasan global daripada gas rumah hijau, penyahhutanan, hujan asid dan eutrofikasi yang meningkatkan nilai BOD air.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab sepuluh: Kelestarian Alam Sekitar! Pada subtopik sepuluh perpuluhan satu, kelestarian bermaksud keadaan persekitaran yang kekal seimbang bagi menyokong kehidupan kini dan masa hadapan. Menurut Jadual sepuluh perpuluhan satu, pembakaran bahan api fosil dan penyahhutanan meningkatkan karbon dioksida serta nitrogen oksida, penternakan membebaskan metana, baja melepaskan nitrus oksida, manakala penyejuk membebaskan klorofluorokarbon! Gas-gas ini memerangkap sinaran inframerah lalu mencetuskan pemanasan global serta fenomena El Nino iaitu kemarau berpanjangan dan La Nina iaitu banjir luar biasa! Selain itu, hujan asid ber pH kurang daripada lima memusnahkan hutan dan tisu tumbuhan. Penyahhutanan pula memupuskan hidupan liar termasuk badak Sumatera terakhir Malaysia bernama Iman yang mati di Hutan Simpan Hidupan Liar Tabin pada November dua ribu sembilan belas! Seterusnya, larian baja nitrat dan fosfat ke tasik menyebabkan eutrofikasi: ledakan alga menghalang cahaya matahari, tumbuhan akuatik mati lalu diurai oleh bakteria aerob sehingga oksigen terlarut menjunam dan nilai keperluan oksigen biokimia atau B.O.D. melambung tinggi!","title":"10.1 Ancaman Alam Sekitar, Eutrofikasi & Eksperimen BOD","acronym":"G•E•B•A","hook":"Tonton video animasi kesan rumah hijau & eutrofikasi serta uji Simulator BOD di bawah!","mediaKey":"bio510_eutrofikasi_kelestarian","videoClip":{"src":"../assets/biologi-t5-bab10/video/bio510_video_eutrofikasi_kelestarian_narasi.mp4","hasNarration":true,"posterKey":"bio510_eutrofikasi_kelestarian","caption":"Mekanisme kesan rumah hijau serta proses eutrofikasi yang meningkatkan nilai BOD air."},"summary":"Gas rumah hijau (CO2, CH4, N2O, CFC) memacu El Nino/La Nina; hujan asid pH < 5; penyahhutanan (Iman 2019); eutrofikasi menaikkan BOD (Eksperimen metilena biru 0.1%: Kadar = 1 / masa pelunturan).","bullets":["Jadual 10.1 Gas Rumah Hijau & Iklim: Pembakaran fosil (CO2, NOx), penyahhutanan (CO2), penternakan (CH4), baja (N2O), penyejuk (CFC). Pemanasan global mencetuskan El Nino (kemarau) dan La Nina (banjir).","Eutrofikasi & Keperluan Oksigen Biokimia (BOD): Lebihan nitrat dan fosfat memacu pertumbuhan alga yang menghalang cahaya ke dasar air. Penguraian tumbuhan mati oleh bakteria aerob menggunakan oksigen terlarut secara mendadak lalu menaikkan BOD.","Eksperimen 10.1 (Metilena Biru 0.1%): Hujung picagari dimasukkan ke dasar botol reagen bagi mengelak larutan bercampur oksigen udara. Kadar pencemaran air = 1 / masa pelunturan warna biru."],"labId":"bio510_rumah_hijau_bod_sim","labTitle":"Simulator Kesan Rumah Hijau, Eutrofikasi & Eksperimen BOD","labProps":{"mode":"eutrofikasi"},"examTip":"Soalan Eksperimen Kertas 2: Mengapakah hujung picagari mesti sampai ke dasar air sampel sebelum menitis larutan metilena biru 0.1%? Jawapan: Untuk mengelakkan larutan terdedah kepada oksigen atmosfera semasa dititiskan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Gas Rumah Hijau & Pencemaran","voiceCaption":"Kelaskan enam aktiviti dan fenomena alam sekitar berikut antara Punca Pemanasan Global dengan Kesan Pencemaran Air & Tanah.","voiceScript":"[confident] Asingkan keenam-enam faktor pencemaran ini kepada dua kumpulan yang betul!","prompt":"Isihkan pernyataan pencemaran alam sekitar berikut mengikut kategorinya:","buckets":[{"id":"iklim","label":"Punca Gas Rumah Hijau & Iklim"},{"id":"air","label":"Eutrofikasi, Hujan Asid & BOD"}],"items":[{"text":"Penternakan lembu dan kambing membebaskan gas metana (CH4)","bucketId":"iklim","note":"Tepat! CH4 memerangkap haba inframerah dalam atmosfera."},{"text":"Baja nitrogen berlebihan membebaskan nitrus oksida (N2O)","bucketId":"iklim","note":"Betul! Salah satu gas rumah hijau utama daripada pertanian."},{"text":"Larian nitrat dan fosfat mencetuskan ledakan alga di tasik","bucketId":"air","note":"Tepat! Punca utama fenomena eutrofikasi."},{"text":"Masa pelunturan larutan metilena biru 0.1% sangat singkat","bucketId":"air","note":"Betul! Menunjukkan kandungan oksigen terlarut rendah dan BOD tinggi."},{"text":"Gas sulfur dioksida larut dalam air hujan menghasilkan pH < 5","bucketId":"air","note":"Tepat! Ciri hujan asid yang melarutlesap mineral tanah."},{"text":"Penggunaan bahan penyejuk menyumbang pelepasan gas CFC","bucketId":"iklim","note":"Betul! Turut menipiskan lapisan ozon dan memerangkap haba."}],"explanation":"Aktiviti pembakaran fosil, penternakan, baja dan penyejuk membebaskan gas rumah hijau, manakala nitrat/fosfat serta SO2 menyebabkan eutrofikasi dan hujan asid."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Sampel Air Paling Tercemar","voiceCaption":"Ramalkan sampel air yang mempunyai nilai BOD paling tinggi berdasarkan masa pelunturan warna larutan metilena biru.","voiceScript":"[curious] Empat sampel air sungai diuji menggunakan satu mililiter metilena biru sifar perpuluhan satu peratus. Sampel manakah yang paling tercemar dan mempunyai nilai B.O.D. tertinggi?","hook":"Rujuk tab Eksperimen BOD dalam Simulator di atas untuk menyemak formula kadar pencemaran!","scenario":"Masa pelunturan warna biru metilena biru: Air paip > 4 jam; Air sungai hulu = 3 jam; Air longkang = 1 jam; Air kolam kumbahan = 25 minit.","prompt":"Sampel manakah menunjukkan nilai BOD tertinggi dan tahap oksigen terlarut paling rendah?","options":["Air kolam kumbahan (25 minit) kerana populasi bakteria aerob sangat tinggi dan cepat menghabiskan oksigen terlarut","Air paip (> 4 jam) kerana bahan kimia klorin menaikkan BOD dengan pantas","Air sungai hulu (3 jam) kerana alga banyak menghasilkan oksigen","Air longkang dan air paip mempunyai nilai BOD yang sama"],"correctIndex":0,"proofLabId":"bio510_rumah_hijau_bod_sim","proofState":{"mode":"metilena_biru"},"explanation":"Kadar pencemaran air = 1 / masa pelunturan. Masa pelunturan paling singkat (25 minit) bermaksud oksigen terlarut sangat sedikit dan bakteria aerob amat banyak, jadi nilai BOD adalah tertinggi."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Jenis Pencemaran & Impak","voiceCaption":"Padankan lima bentuk ancaman alam sekitar berikut dengan penerangan saintifik yang tepat.","voiceScript":"[confident] Padankan setiap konsep ancaman alam sekitar dalam subtopik sepuluh perpuluhan satu dengan penerangannya!","prompt":"Padankan ancaman alam sekitar berikut dengan kesannya:","pairs":[{"id":"b510u1m1","left":"Pencemaran terma","right":"Air panas kilang mengurangkan kebolehlarutan oksigen di sungai"},{"id":"b510u1m2","left":"Pencemaran bunyi","right":"Kebisingan melebihi 80 dB mengganggu tidur, pendengaran dan tekanan darah"},{"id":"b510u1m3","left":"El Nino vs La Nina","right":"Kemarau panjang vs hujan lebat serta banjir luar biasa"},{"id":"b510u1m4","left":"Penyahhutanan & kepupusan","right":"Kematian badak Sumatera terakhir Malaysia 'Iman' di Tabin (2019)"},{"id":"b510u1m5","left":"Ledakan populasi manusia","right":"Menuntut penerokaan hutan, makanan dan pengurusan sisa lebih besar"}],"explanation":"Kesemua faktor termasuk pencemaran terma, bunyi dan ledakan populasi menyumbang kepada ketidakseimbangan ekosistem."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s5","voiceToneLabel":"Cabaran Unit 1: Eutrofikasi","voiceCaption":"Pilih turutan peristiwa yang betul semasa eutrofikasi berlaku di sebuah kolam tercemar.","voiceScript":"[excited] Uji ketepatan urutan peristiwa eutrofikasi untuk soalan struktur S.P.M.!","prompt":"Manakah turutan yang betul bagi menjelaskan bagaimana baja nitrat menyebabkan kematian ikan di tasik?","options":["Ledakan alga di permukaan -> cahaya matahari terhalang -> tumbuhan akuatik mati -> penguraian oleh bakteria aerob menggunakan oksigen -> BOD meningkat -> ikan mati kekurangan oksigen","Baja meracuni ikan secara terus -> alga memakan ikan -> oksigen meningkat","Ikan memakan alga secara berlebihan -> tumbuhan dasar membiak terlalu cepat -> BOD menurun kepada sifar","Cahaya matahari meningkat di dasar -> bakteria anaerob membebaskan gas oksigen tulen"],"correctIndex":0,"explanation":"Baja nitrat/fosfat menyebabkan ledakan alga yang menghalang cahaya ke tumbuhan dasar; kematiannya diurai oleh bakteria aerob yang menghabiskan O2 terlarut sehingga nilai BOD meningkat."}]},{"id":"bio510-u2","title":"Unit 2: Pemeliharaan, Pemuliharaan & Pemulihan Ekosistem","subtitle":"Subtopik 10.2 — Hutan Simpan Belum, Pemuliharaan In Situ vs Ex Situ, serta Langkah Pemulihan Kawasan Terosot","iconType":"map","iconUrl":"../assets/icons/bio510-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"3P: Pemeliharaan, Pemuliharaan & Pemulihan","voiceCaption":"Pemeliharaan mengekalkan ekosistem asal seperti Hutan Simpan Belum, pemuliharaan membaik pulih secara in situ atau ex situ, manakala pemulihan memulihkan tanah terosot.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam peperiksaan S.P.M., murid sering tertukar definisi Pemeliharaan, Pemuliharaan dan Pemulihan! Pertama, Pemeliharaan ekosistem ialah usaha melindungi komponen ekosistem supaya kekal dalam keadaan semula jadi asal; contoh terbaik di Malaysia ialah Hutan Simpan Belum di Perak yang lebih sembilan puluh peratus kawasannya tidak pernah diterokai! Kedua, Pemuliharaan ekosistem ialah usaha membaik pulih sumber alam yang telah digunakan agar tidak pupus, dibahagi kepada pemuliharaan in situ di habitat semula jadi seperti Taman Negara, Taman Laut dan hutan simpan, serta pemuliharaan ex situ di luar habitat asal seperti zoo, taman botani dan bank biji benih! Ketiga, Pemulihan ekosistem ialah usaha memperbaharui dan memulihkan ekosistem yang rosak akibat aktiviti manusia, contohnya melalui penanaman semula pokok serta penanaman tanaman tutup bumi untuk mengawal hakisan!","title":"10.2 Pemeliharaan, Pemuliharaan (In/Ex Situ) & Pemulihan","acronym":"P•P•P","hook":"Buka tab 3P Ekosistem pada makmal interaktif di bawah untuk membezakan contoh Hutan Simpan Belum, in situ dan ex situ!","mediaKey":"bio510_hutan_belum","summary":"Pemeliharaan = lindungi ekosistem asal (Hutan Simpan Belum 90% belum diteroka); Pemuliharaan = in situ (Taman Negara/Taman Laut) & ex situ (zoo/taman botani/bank benih); Pemulihan = tanam semula pokok & tutup bumi.","bullets":["Pemeliharaan Ekosistem: an/In Situ dengan Ex Situ/Pemulihan.","voiceScript":"[confident] Kelaskan enam contoh strategi ekosistem berikut ke dalam kategori yang tepat!","prompt":"Isihkan strategi berikut mengikut kategorinya:","buckets":[{"id":"insitu","label":"Pemeliharaan & Pemuliharaan In Situ"},{"id":"exsitu","label":"Ex Situ & Pemulihan"}],"items":[{"text":"Hutan Simpan Royal Belum yang mengekalkan ekosistem asal belum diterokai","bucketId":"insitu","note":"Tepat! Contoh klasik pemeliharaan ekosistem di Malaysia."},{"text":"Mewartakan Pulau Redang atau Taman Negara Endau-Rompin sebagai kawasan perlindungan","bucketId":"insitu","note":"Betul! Spesies dilindungi di dalam habitat semula jadi asalnya."},{"text":"Menyimpan koleksi benih padi dan tumbuhan nadir di bank biji benih","bucketId":"exsitu","note":"Tepat! Pemuliharaan ex situ di luar habitat asal."},{"text":"Program pembiakan tapir dan orangutan terancam di zoo serta pusat pemuliharaan","bucketId":"exsitu","note":"Betul! Contoh pemuliharaan ex situ."},{"text":"Menanam tanaman tutup bumi di cerun lombong terbiar bagi mengelak hakisan","bucketId":"exsitu","note":"Tepat! Langkah pemulihan kawasan yang telah terosot."},{"text":"Penubuhan Taman Laut untuk memelihara terumbu karang di laut asal","bucketId":"insitu","note":"Betul! Pemuliharaan in situ marin."}],"explanation":"Pemeliharaan & in situ melindungi habitat asal; ex situ memelihara di luar habitat asal manakala pemulihan membaik pulih kawasan rosak."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Tindakan Pemulihan Bekas Lombong","voiceCaption":"Ramalkan langkah paling sesuai untuk memulihkan kawasan cerun bukit yang gondol selepas aktiviti pembalakan.","voiceScript":"[curious] Satu kawasan cerun hutan terosot teruk selepas pembalakan haram. Apakah langkah pemulihan ekosistem yang paling berkesan untuk menstabilkan tanah dan mengembalikan tumbuhan?","hook":"Semak semula peranan tanaman tutup bumi dalam makmal 3P di atas!","scenario":"Kawasan cerun bukit s1","voiceToneLabel":"Amalan 5R, Kawalan Biologi & Sekuriti Makanan","voiceCaption":"Amalan kelestarian melibatkan konsep 5R, upcycle, tenaga boleh diperbaharui, kawalan biologi mesra alam serta empat komponen utama sekuriti makanan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bagaimana setiap individu dan komuniti memelihara kelestarian? Pertama, menggunakan pengangkutan mesra alam seperti kenderaan elektrik atau pengangkutan awam serta tenaga boleh diperbaharui seperti suria, hidroelektrik dan angin bagi menggantikan bahan api fosil! Kedua, amalan lima R iaitu Rethink fikir semula, Repair baik pulih, Reuse guna semula, Reduce kurangkan dan Recycle kitar semula, ditambah pula upcycle iaitu mencipta barangan bernilai lebih tinggi daripada bahan terbuang! Ketiga, mengawal perosak tanaman dengan kawalan biologi tanpa racun serangga kimia — contohnya penyengat Diadegma semiclausum dan Cotesia vestalis mengawal ulat rama-rama kubis, lalat Coenosia exigua mengawal perosak sayuran, dan burung hantu mengawal tikus di ladang kelapa sawit! Pengurusan sisa terancang juga disokong oleh S.P.P.C.A. di bawah SPAN dan Agenda Tempatan dua puluh satu selaras Matlamat Pembangunan Mampan S.D.G.! Akhir sekali, Sekuriti Makanan bermaksud jaminan bekalan makanan mencukupi dan selamat berdasarkan empat komponen: Ketersediaan, Akses, Penggunaan iaitu kualiti Halal, G.M.P. dan H.A.C.C.P., serta Kestabilan seperti Dasar Jaminan Bekalan Makanan dua ribu lapan!","title":"10.3 Amalan 5R, Kawalan Biologi & 4 Komponen Sekuriti Makanan","acronym":"K•A•P•K","hook":"Klik tab 5R & Kawalan Biologi serta tab Sekuriti Makanan pada makmal di bawah!","mediaKey":"bio510_panel_suria","summary":"5R (Rethink, Repair, Reuse, Reduce, Recycle) + upcycle; kawalan biologi (Diadegma, Cotesia, Coenosia, burung hantu); SPPCA SPAN & LA21; 4 komponen sekuriti makanan (Ketersediaan, Akses, Penggunaan [Halal/GMP/HACCP], Kestabilan).","bullets":["5R, Upcycle & Tenaga Hijau: Rethink, Repair, Reuse, Reduce, Recycle serta upcycle (ubah sisa kepada produk bernilai tinggi). Pengurangan pelepasan karbon melalui tenaga suria, hidroelektrik dan kenderaan mesra alam.","Kawalan Biologi Pertanian: Menggunakan pemangsa/parasitoid semula jadi seperti penyengat Diadegma semiclausum & Cotesia vestalis (ulat kubis), Coenosia exigua dan burung hantu (tikus ladang sawit) — mengurangkan pencemaran racun kimia.","4 Komponen Sekuriti Makanan: (1) Ketersediaan makanan mencukupi, (2) Akses mudah & mampu milik, (3) Penggunaan makanan berkualiti & selamat (Halal, GMP, HACCP), (4) Kestabilan bekalan tanpa gangguan ketika krisis (Dasar Jaminan Bekalan Makanan 2008)."],"labId":"bio510_pemeliharaan_sekuriti_lab","labTitle":"Makmal 5R, Kawalan Biologi & Sekuriti Makanan","labProps":{"tab":"sekuriti"},"examTip":"Hafal 4 komponen sekuriti makanan menggunakan akronim K•A•P•K: Ketersediaan, Akses, Penggunaan (Halal/GMP/HACCP), Kestabilan!"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan 4 Komponen Sekuriti Makanan & Kawalan","voiceCaption":"Padankan lima konsep kelestarian dan komponen sekuriti makanan berikut dengan definisi tepat.","voiceScript":"[confident] Padankan setiap istilah sekuriti makanan dan amalan kelestarian berikut dengan maksudnya!","prompt":"Padankan istilah kelestarian dan sekuriti makanan berikut:","pairs":[{"id":"b510u3m1","left":"Ketersediaan makanan","right":"Bekalan makanan bermutu dan mencukupi sentiasa ada di pasaran"},{"id":"b510u3m2","left":"Akses kepada makanan","right":"Makanan mudah diperoleh dan mampu dibeli oleh setiap lapisan masyarakat"},{"id":"b510u3m3","left":"Penggunaan makanan","right":"Kualiti nutrien, kebersihan, air bersih serta pensijilan Halal, GMP dan HACCP"},{"id":"b510u3m4","left":"Kestabilan makanan","right":"Akses bekalan yang berterusan walaupun ketika bencana atau krisis ekonomi"},{"id":"b510u3m5","left":"Diadegma semiclausum & Coenosia exigua","right":"Agen kawalan biologi bagi perosak kubis dan sayuran tanpa racun kimia"}],"explanation":"Keempat-empat komponen sekuriti makanan mesti dipenuhi serentak, manakala kawalan biologi menjaga keselamatan hasil tanaman daripada sisa racun."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Kesan Kawalan Biologi Ladang","voiceCaption":"Ramalkan kelebihan utama penggunaan burung hantu berbanding racun tikus sintetik di ladang kelapa sawit.","voiceScript":"[curious] Seorang pengusaha ladang menggantikan racun tikus kimia dengan pemasangan rumah burung hantu. Ramalkan kesan jangka panjang langkah ini!","hook":"Fikirkan kesan rantai makanan dan keselamatan air bawah tanah apabila racun kimia dihentikan!","scenario":"Ladang sawit menggantikan racun tikus kimia dengan kawalan biologi menggunakan burung hantu (Tyto alba).","prompt":"Mengapakah kaedah kawalan biologi ini menyokong kelestarian alam sekitar?","options":["Mengurangkan pencemaran air dan tanah akibat racun kimia, tidak menjejaskan rantai makanan bukan sasaran serta menjimatkan kos jangka panjang","Membunuh semua spesies burung dan serangga pendebunga di ladang","Menghasilkan buah sawit yang mengandungi sisa racun perosak lebih tinggi","Menyebabkan populasi tikus membiak dua kali ganda lebih pantas"],"correctIndex":0,"proofLabId":"bio510_pemeliharaan_sekuriti_lab","proofState":{"tab":"5r_kawalan"},"explanation":"Kawalan biologi bersifat spesifik terhadap mangsa sasaran (tikus) dan tidak mencemarkan tanah atau sumber air seperti racun kimia."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Prinsip 5R & Agensi Pengurusan","voiceCaption":"Kelaskan enam amalan berikut antara Prinsip 5R / Upcycle dengan Sekuriti Makanan / Pengurusan Sisa.","voiceScript":"[confident] Kelaskan keenam-enam amalan kelestarian ini ke dalam kategori yang sesuai!","prompt":"Isihkan amalan kelestarian berikut mengikut kategorinya:","buckets":[{"id":"limaR","label":"Amalan 5R & Upcycle"},{"id":"sistem","label":"Sekuriti Makanan & Pengurusan Sisa"}],"items":[{"text":"Menukarkan tayar terpakai menjadi pasu hiasan taman bernilai tinggi (Upcycle)","bucketId":"limaR","note":"Tepat! Upcycle menambah nilai produk daripada bahan buangan."},{"text":"Membawa bekas sendiri dan menolak beg plastik sekali guna (Reduce & Rethink)","bucketId":"limaR","note":"Betul! Mengurangkan penjanaan sisa dari punca."},{"text":"Membaiki peralatan elektrik rosak sebelum membeli unit baharu (Repair)","bucketId":"limaR","note":"Tepat! Memanjangkan jangka hayat barangan."},{"text":"Pelaksanaan sistem pensijilan Halal, GMP dan HACCP di kilang makanan","bucketId":"sistem","note":"Betul! Menjamin komponen Penggunaan dalam sekuriti makanan."},{"text":"Penyelenggaraan sisa kumbahan berpusat melalui SPPCA oleh SPAN","bucketId":"sistem","note":"Tepat! Mengelak pencemaran air sungai daripada kumbahan."},{"text":"Dasar Jaminan Bekalan Makanan 2008 memastikan stok beras mencukupi","bucketId":"sistem","note":"Betul! Menyokong ketersediaan dan kestabilan makanan negara."}],"explanation":"Konsep 5R dan upcycle menumpukan pengurusan sisa isi rumah, manakala pensijilan keselamatan makanan dan SPPCA mengukuhkan infrastruktur kelestarian."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s5","voiceToneLabel":"Cabaran Unit 3: Upcycle vs Recycle","voiceCaption":"Pilih pernyataan yang paling tepat membezakan amalan upcycle daripada kitar semula biasa.","voiceScript":"[excited] Soalan terakhir Unit tiga: apakah keistimewaan amalan upcycle dalam konsep lima R?","prompt":"Manakah antara berikut menggambarkan konsep 'upcycle' dengan tepat?","options":["Menggunakan semula bahan buangan untuk menghasilkan produk baharu yang mempunyai fungsi dan nilai pasaran lebih tinggi daripada bahan asal","Meleburkan botol plastik menjadi bahan mentah gred rendah sebelum dibuang","Membakar semua sisa kertas di kawasan terbuka untuk dijadikan abu","Menanam bahan sisa elektronik terus di dalam tanah pertanian"],"correctIndex":0,"explanation":"Upcycle mengubah sisa terbuang menjadi produk baharu yang lebih bernilai dan berguna berbanding keadaan asalnya."}]},{"id":"bio510-u4","title":"Unit 4: Teknologi Hijau, 4 Tonggak DTHN & Ekoenzim","subtitle":"Subtopik 10.4 — 5 Kriteria Teknologi Hijau MOSTI, Dasar Teknologi Hijau Negara (2009), Bangunan Hijau & Resipi Ekoenzim","iconType":"atom","iconUrl":"../assets/icons/bio510-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Dasar Teknologi Hijau Negara & Ekoenzim","voiceCaption":"Teknologi hijau memenuhi lima kriteria MOSTI dan Dasar Teknologi Hijau Negara dengan empat tonggak, serta diaplikasikan melalui bangunan hijau dan penghasilan ekoenzim.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik sepuluh perpuluhan empat: Teknologi Hijau! Teknologi hijau ialah pembangunan dan aplikasi produk, peralatan serta sistem untuk memelihara alam sekitar dan meminimumkan kesan negatif manusia. Mengikut Rajah sepuluh perpuluhan sebelas daripada MOSTI, produk teknologi hijau mesti memenuhi lima kriteria: meminimumkan degradasi alam sekitar, membebaskan gas rumah hijau yang rendah atau sifar, selamat digunakan serta menyediakan persekitaran sihat, menjimatkan tenaga dan sumber asli, serta menggalakkan penggunaan tenaga boleh diperbaharui! Dasar Teknologi Hijau Negara yang dilancarkan pada Julai dua ribu sembilan pula berteraskan empat tonggak utama iaitu Tenaga, Alam Sekitar, Ekonomi dan Sosial! Di Malaysia, contoh bangunan hijau termasuk Bangunan Perdana Putra Putrajaya dan Pusat Kitar Semula Komuniti Cyberjaya! Malah kamu sendiri boleh menghasilkan ekoenzim mesra alam daripada seratus gram gula perang, tiga gram yis, satu liter air suam dan tiga ratus gram kulit oren atau lemon dicincang pada suhu tiga puluh lima darjah Celsius! Ingat langkah keselamatan makmal: penutup botol mesti dilonggarkan tiga kali sehari sepanjang dua minggu penapaian untuk melepaskan gas karbon dioksida agar botol tidak pecah! Amalan lain termasuk biogas, bioplastik daripada tepung kulit pisang, baja foliar serta Pendidikan Alam Sekitar sejak Rancangan Malaysia Ketiga!","title":"10.4 Teknologi Hijau, 4 Tonggak DTHN & Penghasilan Ekoenzim","acronym":"T•A•E•S","hook":"Semak 4 tonggak DTHN dan resipi eksperimen ekoenzim dalam makmal interaktif di bawah!","mediaKey":"bio510_bangunan_hijau","summary":"Teknologi Hijau MOSTI (5 kriteria); DTHN Julai 2009 (4 tonggak: Tenaga, Alam Sekitar, Ekonomi, Sosial); Bangunan Hijau (Perdana Putra, Cyberjaya); Ekoenzim (100g gula perang + 3g yis + 1L air suam + 300g kulit sitrus, 35C, longgar tutup 3x/hari 2 minggu).","bullets":["Dasar Teknologi Hijau Negara (Julai 2009): 4 Tonggak utama — Tenaga (kecekapan & boleh baharu), Alam Sekitar, Ekonomi dan Sosial. 5 Kriteria MOSTI meminimumkan degradasi & gas rumah hijau.","Bangunan Hijau & Pendidikan: Bangunan Perdana Putra (Putrajaya), Pusat Kitar Semula Komuniti Cyberjaya, serta pengenalan Pendidikan Alam Sekitar sejak RMK-3 bagi memupuk kesedaran sains sosial.","Penghasilan Ekoenzim, Biogas & Bioplastik: Campurkan 100 g gula perang + 3 g yis + 1 L air suam + 300 g kulit oren/lemon pada 35 darjah Celsius; longgarkan penutup 3 kali sehari selama 2 minggu untuk membebaskan CO2. Contoh lain: bioplastik tepung kulit pisang & baja foliar."],"labId":"bio510_teknologi_hijau_lab","labTitle":"Makmal DTHN & Eksperimen Ekoenzim","labProps":{"section":"ekoenzim"},"examTip":"Soalan Eksperimen Ekoenzim: Mengapakah penutup botol plastik mesti dilonggarkan 3 kali sehari semasa penapaian? Untuk melepaskan gas karbon dioksida yang terhasil supaya tekanan tidak meletupkan botol!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Tonggak & Aplikasi Teknologi Hijau","voiceCaption":"Susun frasa untuk melengkapkan empat tonggak Dasar Teknologi Hijau Negara serta bahan utama ekoenzim.","voiceScript":"[confident] Susun frasa berikut supaya membentuk huraian lengkap Dasar Teknologi Hijau Negara!","prompt":"Susun frasa bagi menghuraikan Dasar Teknologi Hijau Negara dan amalan hijau:","hint":"Dasar Teknologi   if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
    }
    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {
      var headLead = !primaryVisual ? (parts.hookHtml + parts.titleHtml + summaryLeadHtml) : titleMiniHtml;
      slides.push({
        label: tUi("Peta Konsep", "Concept Map"),
        hasMindMap: Boolean(parts.mindMapHostHtml),
        html: headLead + parts.mindMapHostHtml + parts.formulaHtml + parts.deepDrawerHtml
      });
    }
    if (parts.labHtml) {
      slides.push({
        label: tUi("Makmal", "Lab"),
        hasLab: true,
        html: titleMiniHtml + parts.labHtml
      });
    }
  }

  return slides;
}

function renderConceptStep(step, card) {

    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,

  });

      (acronymPill || "") +
    "</div>";

    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
