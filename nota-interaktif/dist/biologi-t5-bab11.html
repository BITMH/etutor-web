/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab11","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":11,"title":"Pewarisan","subtitle":"Monohibrid & Hukum Mendel I, Dihibrid & Hukum Mendel II, Gen/Alel/Lokus serta Pewarisan Manusia & Terangkai Seks","estimatedMinutes":60,"themeAccent":"#7c3aed","isFreePreview":false,"labScript":"../data/biologi-t5-bab11-labs.js","coverIcon":"../assets/icons/bio511-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Rajah skema pewarisan dan nisbah Mendel kamu betul-betul tepat.","combo":"[excited] Hebat! Pengiraan genetik dan analisis pedigri kamu sangat tajam.","encourage":"[gentle] Cuba lukis semula Segi Empat Punnett gamet induk dan semak alel dominan atau resesifnya.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan kesemua unit Bab sebelas Pewarisan!"},"units":[{"id":"bio511-u1","title":"Unit 1: Pewarisan Monohibrid & Hukum Mendel I","subtitle":"Subtopik 11.1 — Kacukan Pisum sativum, Genotip vs Fenotip, Nisbah F2 1:2:1 & 3:1, Segi Empat Punnett & Padi Hibrid MARDI MR12H","iconType":"dna","iconUrl":"../assets/icons/bio511-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Monohibrid Mendel & Hukum Segregasi","voiceCaption":"Pewarisan monohibrid mengkaji satu ciri tunggal dengan generasi F2 menghasilkan nisbah genotip 1:2:1 dan nisbah fenotip 3:1 mengikut Hukum Mendel Pertama.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab sebelas: Pewarisan! Tahukah kamu mengapa ada orang mempunyai lesung pipit? Itu berlaku kerana otot zigomatikus major yang pendek, iaitu trait dominan! Dalam subtopik sebelas perpuluhan satu, Gregor Mendel memilih pokok kacang pis Pisum sativum kerana mudah ditanam, cepat berbuah dan mempunyai tujuh ciri berbeza yang jelas! Kacukan monohibrid mengkaji satu ciri sahaja seperti ketinggian pokok: apabila pokok tinggi tulen T besar T besar dikacukkan dengan pokok kerdil tulen t kecil t kecil, semua generasi filial pertama F satu berfenotip tinggi dengan genotip heterozigot T besar t kecil! Apabila F satu didebunga sendiri, generasi F dua menghasilkan empat kombinasi dalam Segi Empat Punnett: satu T besar T besar, dua T besar t kecil, dan satu t kecil t kecil — iaitu nisbah genotip satu kepada dua kepada satu dan nisbah fenotip tiga tinggi kepada satu kerdil! Inilah asas Hukum Mendel Pertama atau Hukum Segregasi: ciri dikawal sepasang faktor yang berpisah semasa meiosis supaya setiap gamet menerima satu alel sahaja! Di Malaysia, prinsip kacukan terkawal ini digunakan oleh MARDI untuk menghasilkan padi hibrid MR dua belas H yang berdaya hasil tinggi!","title":"11.1 Kacukan Monohibrid, Segi Empat Punnett & Hukum Mendel I","acronym":"3:1•1:2:1","hook":"Periksa Segi Empat Punnett monohibrid 3:1 di bawah serta tonton video animasi DNA pewarisan!","mediaKey":"bio511_kacang_pis_mendel","summary":"Monohibrid mengkaji 1 ciri (Pisum sativum). P: TT x tt -> F1: Tt -> F2: Genotip 1 TT : 2 Tt : 1 tt (1:2:1), Fenotip 3 Tinggi : 1 Kerdil (3:1). Hukum Mendel I = Hukum Segregasi.","bullets":["Istilah Teras Monohibrid: Genotip (komposisi gen: TT homozigot dominan, Tt heterozigot, tt homozigot resesif) vs Fenotip (ciri fizikal yang dizahirkan seperti tinggi atau kerdil). Lesung pipit (otot zigomatikus major pendek) ialah contoh trait dominan.","Hukum Mendel Pertama (Hukum Segregasi): Ciri organisma dikawal oleh sepasang faktor (alel) yang berpisah semasa meiosis supaya setiap gamet hanya membawa satu faktor daripada pasangan itu.","Segi Empat Punnett & Aplikasi: F1 (Tt x Tt) -> F2 menghasilkan nisbah genotip 1:2:1 dan nisbah fenotip 3:1 (turut dimodelkan dengan aktiviti manik merah dan putih). MARDI menghasilkan padi hibrid MR12H melalui prinsip kacukan."],"labId":"bio511_punnett_monohibrid_sim","labTitle":"Simulator Segi Empat Punnett Monohibrid","labProps":{"mode":"mono"},"examTip":"Skema Wajib Kertas 2: Apabila melukis gambar rajah skema kacukan monohibrid, tulis 5 label baris lengkap: Fenotip induk -> Genotip induk -> Meiosis / Gamet (bulat) -> Persenyawaan -> Genotip F1/F2 & Nisbah Fenotip."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Genotip Homozigot vs Heterozigot & Fenotip","voiceCaption":"Kelaskan enam pernyataan genetik berikut antara Genotip Homozigot dengan Genotip Heterozigot atau Fenotip.","voiceScript":"[confident] Uji ketepatan istilah genetik asas kamu! Asingkan keenam-enam item berikut.","prompt":"Isihkan contoh dan istilah genetik berikut mengikut kategorinya:","buckets":[{"id":"homo","label":"Homozigot (Alel Sama)"},{"id":"hetfen","label":"Heterozigot & Fenotip"}],"items":[{"text":"TT (kedua-dua alel pada kromosom homolog adalah dominan)","bucketId":"homo","note":"Tepat! Homozigot dominan."},{"text":"tt (kedua-dua alel pada kromosom homolog adalah resesif)","bucketId":"homo","note":"Betul! Homozigot resesif menzahirkan sifat kerdil."},{"text":"Tt (mempunyai satu alel dominan dan satu alel resesif)","bucketId":"hetfen","note":"Tepat! Genotip heterozigot."},{"text":"Sifat ketinggian pokok atau warna bunga ungu yang kelihatan pada F1","bucketId":"hetfen","note":"Betul! Ini merujuk kepada fenotip organisma."},{"text":"BBKK (biji benih bulat kuning baka tulen)","bucketId":"homo","note":"Tepat! Homozigot bagi kedua-dua ciri."},{"text":"Lesung pipit yang kelihatan di pipi akibat otot zigomatikus major pendek","bucketId":"hetfen","note":"Betul! Ciri fizikal yang diperhatikan adalah fenotip."}],"explanation":"Homozigot bermaksud pasangan alel yang seiras (TT atau tt), heterozigot mempunyai pasangan berbeza (Tt), dan fenotip ialah ciri fizikal yang dizahirkan."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kacukan Uji (Tt x tt)","voiceCaption":"Ramalkan peratusan anak pokok kacang pis yang rendah (kerdil) daripada kacukan Tt dengan tt.","voiceScript":"[curious] Jika pokok tinggi heterozigot T besar t kecil dikacukkan dengan pokok kerdil t kecil t kecil, berapakah peratusan anak yang akan berfenotip kerdil?","hook":"Bina gamet T, t daripada induk pertama dan gamet t daripada induk kedua!","scenario":"Induk Tinggi heterozigot (Tt) dikacukkan dengan induk Kerdil (tt) menghasilkan 200 anak pokok.","prompt":"Berapakah jangkaan bilangan dan peratusan anak pokok yang kerdil (tt)?","options":["100 anak pokok (50%) kerana gamet T dan t bergabung dengan gamet t menghasilkan 50% Tt (tinggi) dan 50% tt (kerdil)","50 anak pokok (25%) seperti nisbah generasi F2","0 anak pokok (0%) kerana alel T sentiasa menindas alel t sepenuhnya","150 anak pokok (75%) berfenotip kerdil"],"correctIndex":0,"proofLabId":"bio511_punnett_monohibrid_sim","proofState":{"mode":"mono"},"explanation":"Tt menghasilkan gamet T dan t (1:1), manakala tt menghasilkan gamet t sahaja. Kacukan memberi 1 Tt (Tinggi) : 1 tt (Kerdil) = 50%."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Konsep Pewarisan Monohibrid","voiceCaption":"Padankan lima istilah pewarisan monohibrid berikut dengan penerangannya.","voiceScript":"[confident] Padankan kesemua istilah teras monohibrid Mendel berikut!","prompt":"Padankan istilah pewarisan berikut dengan maksudnya:","pairs":[{"id":"b511u1m1","left":"Hukum Mendel I (Hukum Segregasi)","right":"Sepasang alel berpisah semasa meiosis supaya setiap gamet ada satu alel sahaja"},{"id":"b511u1m2","left":"Nisbah genotip F2 (Tt x Tt)","right":"1 TT : 2 Tt : 1 tt"},{"id":"b511u1m3","left":"Nisbah fenotip F2 (Tt x Tt)","right":"3 Dominan : 1 Resesif"},{"id":"b511u1m4","left":"Alel dominan vs resesif","right":"Alel yang menzahirkan ciri dalam heterozigot vs alel yang ditindas oleh dominan"},{"id":"b511u1m5","left":"Padi hibrid MARDI MR12H","right":"Aplikasi kacukan genetik terkawal menghasilkan tanaman hasil tinggi"}],"explanation":"Nisbah 1:2:1 dan 3:1 merupakan penanda klasik kacukan sesama heterozigot F1 dalam pewarisan monohibrid dominan penuh."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s5","voiceToneLabel":"Cabaran Unit 1: Sebab Pilihan Pisum sativum","voiceCaption":"Kenal pasti sebab utama Gregor Mendel menggunakan pokok kacang pis dalam eksperimennya.","voiceScript":"[excited] Uji sebab kejayaan eksperimen Gregor Mendel dengan pokok kacang pis!","prompt":"Mengapakah pokok kacang pis (Pisum sativum) sangat sesuai dijadikan organisma kajian pewarisan Mendel?","options":["Kerana ia mudah ditanam, cepat menghasilkan generasi baharu, mampu pendebungaan sendiri serta mempunyai tujuh ciri berbeza yang jelas","Kerana pokok kacang pis hanya membiak secara aseks tanpa menghasilkan bunga","Kerana ia mempunyai tempoh hayat 50 tahun sebelum berbunga buat kali pertama","Kerana setiap biji benihnya mempunyai 100 kromosom seks yang sama"],"correctIndex":0,"explanation":"Kitaran hidup pendek, kebolehan pendebungaan sendiri atau silang terkawal, serta ciri bertentangan yang jelas (cth. tinggi vs kerdil) menjadikan kacang pis model genetik unggul."}]},{"id":"bio511-u2","title":"Unit 2: Pewarisan Dihibrid & Hukum Mendel II","subtitle":"Subtopik 11.2 — Kacukan Dua Ciri Serentak (BBKK x bbkk), Pembentukan 4 Gamet F1 (BK, Bk, bK, bk) & Nisbah Fenotip F2 9:3:3:1","iconType":"scale","iconUrl":"../assets/icons/bio511-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kacukan Dihibrid 9:3:3:1 & Hukum Mendel II","voiceCaption":"Pewarisan dihibrid melibatkan dua ciri serentak yang menghasilkan nisbah fenotip F2 9:3:3:1 mengikut Hukum Pengaturan Bebas Mendel.","voiceScript":"[warm] Sekarang masuk ke Unit dua, subtopik sebelas perpuluhan dua: Pewarisan Dihibrid! Jika monohibrid mengkaji satu ciri, pewarisan dihibrid mengkaji pewarisan DUA ciri serentak, contohnya bentuk biji benih bulat atau kedut bersama warna biji benih kuning atau hijau! Apabila induk baka tulen bulat kuning B besar B besar K besar K besar dikacukkan dengan kedut hijau b kecil b kecil k kecil k kecil, semua anak F satu mempunyai genotip B besar b kecil K besar k kecil dengan fenotip bulat kuning! Semasa F satu mengalami meiosis, setiap ahli pasangan alel B dan b boleh bergabung secara bebas dengan K atau k lalu membentuk empat jenis gamet berbeza iaitu B besar K besar, B besar k kecil, b kecil K besar, dan b kecil k kecil! Apabila Segi Empat Punnett empat kali empat dibina untuk pendebungaan sendiri F satu, lahirlah enam belas kotak dengan nisbah fenotip F dua sembilan bulat kuning kepada tiga bulat hijau kepada tiga kedut kuning kepada satu kedut hijau! Inilah Hukum Mendel Kedua atau Hukum Pengaturan Bebas!","title":"11.2 Pewarisan Dihibrid (9:3:3:1) & Hukum Pengaturan Bebas","acronym":"9:3:3:1","hook":"Tukar tab ke 'Dihibrid (9:3:3:1)' dalam Simulator Segi Empat Punnett di bawah untuk meninjau kesemua 16 petak!","mediaKey":"bio511_jagung_dihibrid","summary":"Dihibrid: P (BBKK x bbkk) -> F1 (BbKk) hasilkan 4 gamet (BK, Bk, bK, bk). Kacukan F1 x F1 menghasilkan F2 dengan nisbah fenotip 9 : 3 : 3 : 1 menurut Hukum Mendel II (Hukum Pengaturan Bebas).","bullets":["Hukum Mendel Kedua (Hukum Pengaturan Bebas): Semasa pembentukan gamet, setiap ahli daripada satu pasangan alel boleh bergabung secara rawak dengan mana-mana ahli daripada pasangan alel yang lain.","4 Jenis Gamet F1 (BbKk): Pembentukan gamet semasa Metafasa I meiosis menghasilkan BK, Bk, bK dan bk dalam nisbah sama 1:1:1:1.","Nisbah Fenotip F2 (16 Kotak Punnett): 9 Bulat Kuning (B_K_) : 3 Bulat Hijau (B_kk) : 3 Kedut Kuning (bbK_) : 1 Kedut Hijau (bbkk)."],"labId":"bio511_punnett_monohibrid_sim","labTitle":"Simulator Punnett 4x4 Kacukan Dihibrid","labProps":{"mode":"dihibrid"},"examTip":"Petua elak hilang markah gamet F1 (BbKk): Jangan sekali-kali tulis gamet sebagai 'Bb' atau 'Kk'! Setiap gamet mesti ada SATU alel daripada setiap ciri: BK, Bk, bK, bk."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Bina Pernyataan Hukum Mendel Kedua","voiceCaption":"Susun frasa untuk membina definisi tepat Hukum Pengaturan Bebas Mendel.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan definisi Hukum Mendel Kedua!","prompt":"Susun frasa untuk menyatakan Hukum Mendel Kedua (Hukum Pengaturan Bebas):","hint":"Semasa pembentukan gamet, setiap ahli daripada satu pasangan alel...","answerTokens":["Semasa pembentukan gamet, setiap ahli daripada satu pasangan alel","boleh bergabung secara rawak dengan mana-mana ahli daripada pasangan alel yang lain","bagi menghasilkan kombinasi gamet BK, Bk, bK dan bk dalam nisbah F2 9:3:3:1."],"distractors":["mesti melekat kekal bersama pasangan yang sama tanpa pernah berpisah","hanya menghasilkan dua gamet dominan BB dan KK di dalam ovul"],"explanation":"Penyusunan bebas kromosom homolog semasa Metafasa I membolehkan alel B/b bergandingan secara bebas dengan alel K/k dalam gamet."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Bilangan Biji Kacukan Dihibrid","voiceCaption":"Ramalkan bilangan biji benih bulat hijau daripada jumlah 1600 biji benih F2 hasil kacukan dihibrid F1 BbKk.","voiceScript":"[curious] Daripada seribu enam ratus biji benih F dua hasil kacukan BbKk sesama sendiri, kira anggaran bilangan biji benih bulat hijau!","hook":"Gunakan pecahan nisbah 3 daripada 16 dalam nisbah 9:3:3:1!","scenario":"Kacukan sesama sendiri F1 (BbKk x BbKk) menghasilkan sejumlah 1,600 biji benih generasi F2.","prompt":"Berapakah anggaran bilangan biji benih bulat hijau (B_kk)?","options":["300 biji benih (3/16 x 1,600)","900 biji benih (9/16 x 1,600)","100 biji benih (1/16 x 1,600)","400 biji benih (4/16 x 1,600)"],"correctIndex":0,"proofLabId":"bio511_punnett_monohibrid_sim","proofState":{"mode":"dihibrid"},"explanation":"Dalam nisbah 9 Bulat Kuning : 3 Bulat Hijau : 3 Kedut Kuning : 1 Kedut Hijau, pecahan bulat hijau ialah 3/16 x 1,600 = 300 biji."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Genotip & Fenotip Dihibrid","voiceCaption":"Padankan lima genotip kacukan dihibrid berikut dengan gamet atau fenotipnya yang tepat.","voiceScript":"[confident] Padankan genotip kacukan dihibrid ini dengan ciri atau gamet yang dihasilkan!","prompt":"Padankan genotip dihibrid berikut dengan padanannya:","pairs":[{"id":"b511u2m1","left":"Induk P: BBKK","right":"Menghasilkan hanya satu jenis gamet iaitu BK (Bulat Kuning)"},{"id":"b511u2m2","left":"Induk P: bbkk","right":"Menghasilkan hanya satu jenis gamet iaitu bk (Kedut Hijau)"},{"id":"b511u2m3","left":"F1: BbKk","right":"Menghasilkan 4 jenis gamet sama banyak: BK, Bk, bK, bk"},{"id":"b511u2m4","left":"Genotip F2: Bbkk","right":"Menghasilkan fenotip Bulat Hijau"},{"id":"b511u2m5","left":"Genotip F2: bbKk","right":"Menghasilkan fenotip Kedut Kuning"}],"explanation":"Kehadiran sekurang-kurangnya satu alel B menzahirkan bentuk bulat dan satu alel K menzahirkan warna kuning."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s5","voiceToneLabel":"Cabaran Unit 2: Ralat Gamet","voiceCaption":"Kenal pasti pilihan yang menyenaraikan kesemua gamet sah bagi tumbuhan bergenotip BBKk.","voiceScript":"[excited] Uji ketelitian kamu menulis gamet bagi induk separuh homozigot B besar B besar K besar k kecil!","prompt":"Apakah jenis gamet yang dihasilkan oleh organisma bergenotip BBKk?","options":["BK dan Bk sahaja","BB dan Kk sahaja","BK, Bk, bK dan bk","BK dan bk sahaja"],"correctIndex":0,"explanation":"Kerana pasangan pertama ialah BB (hanya membekalkan alel B) dan pasangan kedua ialah Kk (membekalkan K atau k), maka hanya 2 jenis gamet terbentuk: BK dan Bk."}]},{"id":"bio511-u3","title":"Unit 3: Gen, Alel, Lokus & Kariotip Kromosom","subtitle":"Subtopik 11.3 & Awal 11.4 — 25,000 Gen Haploid, Analogi Lokus, 44 Autosom + 2 Kromosom Seks serta Tak Disjungsi","iconType":"atom","iconUrl":"../assets/icons/bio511-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Gen, Alel, Lokus & Kariotip Manusia","voiceCaption":"Setiap gen menempati lokus spesifik pada kromosom homolog dengan alel berbeza; sel soma manusia mempunyai 44 autosom dan 2 kromosom seks.","voiceScript":"[warm] Selamat datang ke Unit tiga! Pada subtopik sebelas perpuluhan tiga, mari kita fahami hubungan antara Gen, Alel dan Lokus! Gen ialah unit asas pewarisan iaitu satu segmen D.N.A. pada kromosom yang mengawal ciri tertentu — set kromosom haploid manusia mempunyai kira-kira dua puluh lima ribu gen! Lokus ialah kedudukan khusus sesuatu gen pada kromosom, ibarat tempat letak kereta khusus untuk kereta tertentu! Alel pula ialah bentuk alternatif gen yang sama pada lokus yang sama pada kromosom homolog, contohnya alel T dominan dan alel t resesif! Seterusnya dalam subtopik sebelas perpuluhan empat, kariotip sel soma manusia normal berjumlah empat puluh enam kromosom iaitu empat puluh empat autosom daripada pasangan satu hingga dua puluh dua, serta dua kromosom seks pada pasangan kedua puluh tiga iaitu X Y bagi lelaki dan X X bagi perempuan! Jika berlaku kegagalan pemisahan kromosom iaitu tak disjungsi semasa Anafasa satu atau Anafasa dua meiosis, terbentuklah anomali bilangan kromosom seperti Sindrom Down dengan empat puluh tujuh kromosom iaitu trisomi dua puluh satu, Sindrom Turner empat puluh lima kromosom iaitu empat puluh empat tambah X O pada perempuan, dan Sindrom Klinefelter empat puluh tujuh kromosom iaitu empat puluh empat tambah X X Y pada lelaki! Tonton juga video animasi DNA pewarisan di sini!","title":"11.3 Gen, Alel, Lokus & 11.4 Kariotip Manusia (44+XX / 44+XY)","acronym":"G•A•L•46","hook":"Tonton video animasi pewarisan DNA dan terokai tab Kariotip & Tak Disjungsi di bawah!","mediaKey":"bio511_kromosom_lokus","videoClip":{"src":"../assets/biologi-t5-bab11/video/bio511_video_pewarisan_dna.mp4","hasNarration":false,"posterKey":"bio511_kromosom_lokus","caption":"Video Animasi: Struktur kromosom, gen, lokus dan pewarisan maklumat genetik DNA"},"summary":"Gen (~25,000 haploid), Lokus (kedudukan khusus gen), Alel (versi alternatif gen pada kromosom homolog). Kariotip normal: 44 autosom + XX/XY (46). Tak disjungsi: Down (47, trisomi 21), Turner (45, 44+XO), Klinefelter (47, 44+XXY).","bullets":["Gen, Lokus & Alel (11.3): Gen (~25,000 dalam set haploid manusia) mengawal sintesis polipeptida. Lokus ialah lokasi tetap gen pada kromosom (analogi ruang letak kereta). Alel ialah bentuk berlainan gen pada lokus sama pada pasangan kromosom homolog.","Autosom vs Kromosom Seks (11.4): Pasangan 1–22 (44 kromosom) ialah autosom menentukan ciri somatik; pasangan ke-23 (2 kromosom) ialah kromosom seks menentukan jantina (XY lelaki, XX perempuan).","Kesan Tak Disjungsi Meiosis (Anafasa I/II): Menghasilkan gamet tidak normal (n+1 atau n-1) yang mencetuskan Sindrom Down (47, +21), Sindrom Turner (45, 44+XO) dan Sindrom Klinefelter (47, 44+XXY)."],"labId":"bio511_kromosom_kariotip_lab","labTitle":"Makmal Gen, Lokus & Kariotip Tak Disjungsi","labProps":{"tab":"kariotip"},"examTip":"Semak soalan kariotip Kertas 1: Hitung jumlah kromosom dahulu (45, 46, atau 47) kemudian periksa pasangan ke-21 (jika 3 salinan = Down) atau pasangan ke-23 (XO = Turner; XXY = Klinefelter)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Gen/Lokus/Alel vs Kelainan Kariotip","voiceCaption":"Kelaskan enam fakta berikut antara Struktur Gen & Kromosom Normal dengan Kesan Tak Disjungsi Meiosis.","voiceScript":"[confident] Kelaskan enam fakta kromosom dan kariotip ini ke dalam dua kumpulan!","prompt":"Isihkan pernyataan berikut mengikut kategorinya:","buckets":[{"id":"norm","label":"Struktur Gen, Lokus & Kariotip Normal"},{"id":"takdis","label":"Anomali Tak Disjungsi Meiosis"}],"items":[{"text":"Kariotip perempuan normal mengandungi 44 + XX (46 kromosom)","bucketId":"norm","note":"Tepat! 22 pasang autosom dan sepasang kromosom X."},{"text":"Lokus ialah kedudukan khusus sesuatu gen di sepanjang kromosom","bucketId":"norm","note":"Betul! Pasangan alel menduduki lokus yang sama pada kromosom homolog."},{"text":"Trisomi 21 menghasilkan individu Sindrom Down dengan 47 kromosom","bucketId":"takdis","note":"Tepat! Tiga salinan kromosom autosom ke-21."},{"text":"Kariotip 44 + XO (45 kromosom) menghasilkan perempuan Sindrom Turner","bucketId":"takdis","note":"Betul! Kekurangan satu kromosom seks X."},{"text":"Kariotip 44 + XXY (47 kromosom) menghasilkan lelaki Sindrom Klinefelter","bucketId":"takdis","note":"Tepat! Kehadiran satu kromosom X tambahan pada lelaki."},{"text":"Set haploid manusia (sperma atau ovum normal) membawa 23 kromosom dan ~25,000 gen","bucketId":"norm","note":"Betul! Gabungan sperma (n=23) dan ovum (n=23) memulihkan diploid 2n=46."}],"explanation":"Kariotip normal adalah diploid 2n=46 (44+XX atau 44+XY), manakala tak disjungsi mengubah bilangan autosom atau kromosom seks."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Formula Kariotip & Sindrom","voiceCaption":"Padankan lima formula kromosom dan istilah berikut dengan nama tepat masing-masing.","voiceScript":"[confident] Padankan setiap formula kariotip dan istilah kromosom ini dengan namanya!","prompt":"Padankan setiap formula kariotip atau istilah dengan deskripsinya:","pairs":[{"id":"b511u3m1","left":"45 + XY (Trisomi 21)","right":"Lelaki menghidap Sindrom Down (47 kromosom)"},{"id":"b511u3m2","left":"44 + XO (45 kromosom)","right":"Perempuan menghidap Sindrom Turner"},{"id":"b511u3m3","left":"44 + XXY (47 kromosom)","right":"Lelaki menghidap Sindrom Klinefelter"},{"id":"b511u3m4","left":"22 + X dan 22 + Y","right":"Dua jenis sperma normal lelaki dalam nisbah 50:50"},{"id":"b511u3m5","left":"Alel vs Lokus","right":"Bentuk alternatif gen vs kedudukan khusus gen pada kromosom"}],"explanation":"Bapa menentukan jantina anak kerana sperma membawa sama ada 22+X atau 22+Y, manakala ovum sentiasa membawa 22+X."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Hasil Persenyawaan Gamet (n+1)","voiceCaption":"Ramalkan bilangan kromosom zigot apabila ovum (24 kromosom dengan dua kromosom 21) disenyawakan sperma normal (23 kromosom).","voiceScript":"[curious] Satu ovum mengalami tak disjungsi pada pasangan ke-21 sehingga mengandungi dua puluh empat kromosom, lalu disenyawakan sperma normal dua puluh tiga kromosom. Apakah keadaan zigot tersebut?","hook":"Jumlahkan 24 + 23 dan semak pasangan kromosom ke-21!","scenario":"Ovum (22 + 1 salinan tambahan ke-21 + X = 24) disenyawakan oleh sperma normal (22 + Y = 23).","prompt":"Apakah jumlah kromosom dan sindrom yang dialami oleh anak tersebut?","options":["47 kromosom (45 + XY), iaitu anak lelaki menghidap Sindrom Down (Trisomi 21)","45 kromosom (44 + XO), iaitu anak perempuan Sindrom Turner","46 kromosom (44 + XY), iaitu anak lelaki normal","47 kromosom (44 + XXY), iaitu anak lelaki Sindrom Klinefelter"],"correctIndex":0,"proofLabId":"bio511_kromosom_kariotip_lab","proofState":{"tab":"kariotip"},"explanation":"24 + 23 = 47 kromosom dengan 3 salinan kromosom 21 dan pasangan seks XY -> Lelaki Sindrom Down."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s5","voiceToneLabel":"Cabaran Unit 3: Penentu Jantina Anak","voiceCaption":"Kenal pasti sebab peratusan mendapat anak lelaki atau perempuan dalam setiap kehamilan kekal 50:50.","voiceScript":"[excited] Uji sebab penentuan jantina manusia sentiasa memberi kebarangkalian lima puluh peratus lelaki dan lima puluh peratus perempuan!","prompt":"Sebuah keluarga sudah mempunyai 4 anak perempuan. Apakah kebarangkalian anak ke-5 mereka ialah anak lelaki?","options":["50% kerana persenyawaan sperma 22+X atau 22+Y dengan ovum 22+X berlaku secara rawak bagi setiap kehamilan baharu","100% kerana giliran anak lelaki pasti tiba selepas 4 anak perempuan","0% kerana bapa tersebut hanya menghasilkan sperma 22+X","25% mengikut nisbah resesif monohibrid"],"correctIndex":0,"explanation":"Setiap kehamilan ialah peristiwa bebas; bapa sentiasa menghasilkan 50% sperma 22+X dan 50% sperma 22+Y."}]},{"id":"bio511-u4","title":"Unit 4: Pewarisan ABO, Rhesus, Talasemia & Terangkai Seks X","subtitle":"Subtopik 11.4 — Alel Berbilang (ABO), Kodominan AB, Faktor Rh, Talasemia (Kromosom 11/16), Buta Warna (Ishihara) & Hemofilia","iconType":"scale","iconUrl":"../assets/icons/bio511-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Darah ABO, Rhesus, Talasemia & Terangkai Seks","voiceCaption":"Kumpulan darah ABO dikawal oleh tiga alel berbilang dengan IA dan IB bersifat kodominan, manakala buta warna serta hemofilia ialah trait resesif terangkai kromosom X.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari kita kuasai lima pola pewarisan manusia dalam subtopik sebelas perpuluhan empat! Pertama, Kumpulan Darah A.B.O. dikawal oleh tiga alel berbilang: I kuasa A, I kuasa B dan I kuasa O! Alel I kuasa A dan I kuasa B bersifat KODOMINAN membentuk darah A.B., manakala kedua-duanya dominan ke atas I kuasa O! Jadi ibu A heterozigot dan bapa B heterozigot boleh melahirkan anak berkumpulan A, B, A.B., mahupun O! Kedua, Faktor Rhesus dikawal oleh alel dominan R h positif dan resesif R h negatif! Ketiga, Talasemia berlaku akibat kecacatan gen sintesis rantai hemoglobin pada kromosom sebelas atau enam belas, membahagi kepada pembawa talasemia minor dan penghidap talasemia major! Keempat, Buta Warna yang diuji dengan plat Ishihara tahun seribu sembilan ratus tujuh belas serta Hemofilia iaitu kegagalan pembekuan darah kedua-duanya dikawal oleh alel resesif terangkai pada kromosom seks X iaitu X kuasa b kecil dan X kuasa h kecil! Lelaki hanya ada satu kromosom X, jadi lelaki X kuasa b Y terus buta warna, manakala perempuan X kuasa B besar X kuasa b kecil hanyalah pembawa normal! Kelima, kebolehan menggulung lidah, cuping telinga tidak melekap dan lesung pipit adalah ciri dominan yang boleh dijejak melalui carta pedigri keluarga!","title":"11.4 Pewarisan ABO, Faktor Rh, Talasemia & Terangkai Seks X","acronym":"ABO•Rh•T•X","hook":"Terokai kedua-dua tab Makmal Darah ABO, Rhesus & Terangkai Seks X di bawah!","mediaKey":"bio511_ishihara_buta_warna","summary":"ABO: 3 alel (IA, IB kodominan; IO resesif); Rh+ dominan / Rh- resesif; Talasemia (kromosom 11/16, minor vs major); Terangkai X resesif: Buta warna (Ishihara 1917, Xb) & Hemofilia (Xh); Menggulung lidah & telinga tak melekap (dominan); Pedigri.","bullets":["Darah ABO & Faktor Rhesus: 3 alel pada satu lokus (IA, IB, IO); IA & IB kodominan (genotip IAIB = darah AB). Faktor Rhesus Rh+ dominan (Rh+Rh+ atau Rh+Rh-) manakala Rh- resesif homozigot (Rh-Rh-).","Talasemia & Trait Dominan: Talasemia melibatkan gen hemoglobin pada kromosom 11 atau 16 (heterozigot = talasemia minor/pembawa; homozigot resesif = talasemia major memerlukan transfusi darah). Menggulung lidah dan cuping telinga tak melekap adalah trait dominan.","Pewarisan Terangkai Seks X & Pedigri: Buta warna (Ujian Ishihara 1917, Xb) dan Hemofilia (Xh) dibawa pada kromosom X. Lelaki hanya perlu satu alel resesif (XbY / XhY) untuk menghidapnya, manakala perempuan (XBXb / XHXh) ialah pembawa. Carta pedigri menjejak sejarah pewarisan keluarga."],"labId":"bio511_darah_rhesus_terangkai_sim","labTitle":"Makmal Darah ABO, Rhesus, Talasemia & Terangkai Seks X","labProps":{"topic":"seks"},"examTip":"Jangan tulis alel buta warna pada kromosom Y! Kromosom Y lebih pendek dan tiada lokus bagi buta warna atau hemofilia — sentiasa tulis Y kosong tanpa huruf atas (contoh: XbY)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Kumpulan Darah Anak (IAIO x IBIO)","voiceCaption":"Ramalkan kesemua kumpulan darah yang mungkin diwarisi oleh anak pasangan ibu darah A heterozigot dan bapa darah B heterozigot.","voiceScript":"[curious] Seorang ibu berdarah A heterozigot I kuasa A I kuasa O berkahwin dengan bapa berdarah B heterozigot I kuasa B I kuasa O. Kumpulan darah apakah yang boleh dimiliki anak mereka?","hook":"Gabungkan gamet ibu (IA, IO) dengan gamet bapa (IB, IO)!","scenario":"Ibu: Kumpulan darah A (IA IO) berkahwin dengan Bapa: Kumpulan darah B (IB IO).","prompt":"Apakah fenotip kumpulan darah yang mungkin wujud dalam kalangan anak-anak mereka?","options":["Keempat-empat kumpulan darah AB, A, B dan O berkebarangkalian 25% setiap satu (IAIB, IAIO, IBIO, IOIO)","Hanya kumpulan darah A dan B sahaja","Semua anak pasti berkumpulan darah AB sahaja","Kumpulan darah O tidak mungkin lahir daripada pasangan berdarah A dan B"],"correctIndex":0,"proofLabId":"bio511_darah_rhesus_terangkai_sim","proofState":{"topic":"abo"},"explanation":"Kacukan IAIO x IBIO menghasilkan 1 IAIB (AB) : 1 IAIO (A) : 1 IBIO (B) : 1 IOIO (O), iaitu keempat-empat kumpulan darah ABO boleh wujud!"},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Genotip Penyakit & Trait Manusia","voiceCaption":"Padankan lima genotip pewarisan manusia berikut dengan fenotip tepat masing-masing.","voiceScript":"[confident] Padankan setiap genotip darah, talasemia dan terangkai seks berikut dengan statusnya!","prompt":"Padankan genotip manusia berikut dengan status fenotipnya:","pairs":[{"id":"b511u4m1","left":"Genotip IA IB","right":"Darah kumpulan AB akibat sifat kodominan antara alel IA dan IB"},{"id":"b511u4m2","left":"Genotip XH Xh","right":"Perempuan normal tetapi pembawa penyakit hemofilia"},{"id":"b511u4m3","left":"Genotip Xb Y","right":"Lelaki yang menghidap buta warna merah-hijau"},{"id":"b511u4m4","left":"Talasemia minor vs major","right":"Pembawa heterozigot tanpa gejala berat vs homozigot resesif perlu transfusi"},{"id":"b511u4m5","left":"Plat Ujian Ishihara (1917)","right":"Ujian saringan klinikal bagi mengesan buta warna"}],"explanation":"Lelaki tidak mempunyai alel sepadan pada kromosom Y; perempuan heterozigot bertindak sebagai pembawa sihat bagi penyakit terangkai X."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Pewarisan Autosom vs Terangkai Seks X","voiceCaption":"Kelaskan enam trait manusia berikut antara Pewarisan pada A  warna (XbY).","prompt":"Apakah genotip ibu dan dari siapakah anak lelaki itu mewarisi alel Xb?","options":["Ibu bergenotip heterozigot pembawa (XBXb), dan anak lelaki menerima kromosom Xb daripada ibunya manakala kromosom Y daripada bapanya","Bapa menyumbangkan kromosom Xb secara senyap bersama Y","Ibu adalah homozigot resesif XbXb dan mempunyai penglihatan normal","Penyakit itu berlaku akibat kumpulan darah IO bapanya"],"correctIndex":0,"proofLabId":"bio511_darah_rhesus_terangkai_sim","proofState":{"topic":"seks"},"explanation":"Lelaki (XbY) sentiasa mewarisi Y daripada bapa dan X daripada ibu. Kerana ibu kelihatan normal, ibu mestilah pembawa heterozigot XBXb!"},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Pusingan 4: Rumusan Kariotip & Rhesus","voiceCaption":"Susun frasa untuk merumuskan perbezaan autosom, kromosom seks dan alel berbilang dalam pewarisan manusia.","voiceScript":"[confident] Pusingan keempat! Susun frasa bagi membina rumusan lengkap pewarisan manusia.","prompt":"Susun frasa berikut menjadi rumusan tepat pewarisan manusia:","hint":"Sel soma manusia mengandungi 44 autosom dan 2 kromosom seks...","answerTokens":["Sel soma manusia mengandungi 44 autosom dan 2 kromosom seks,","kegagalan pemisahan semasa anafasa menyebabkan tak disjungsi seperti Sindrom Down (47),","manakala ciri seperti kumpulan darah ABO dikawal oleh tiga alel berbilang IA, IB dan IO."],"distractors":["dan semua lelaki mewarisi kromosom X buta warna terus daripada bapa mereka","kerana autosom manusia tidak mempunyai sebarang lokus atau gen"],"explanation":"Rumusan ini menggabungkan genetik sitologi (autosom & tak disjungsi) dengan genetik molekul/Mendel (alel berbilang ABO)."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Cabaran Akhir Boss Bab 11: Gabungan Dihibrid & Galeri","voiceCaption":"Pilih pernyataan yang paling tepat bagi menamatkan Bab 11 Pewarisan.","voiceScript":"[celebratory] Soalan penutup Boss Bab sebelas! Pilih jawapan terbaik (function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") window.NotaAudio.playSnap();
    else if (kind === "match" && typeof window.NotaAudio.playMatch === "function") window.NotaAudio.playMatch();
    else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") window.NotaAudio.playPaperRustle();
    else if (typeof window.NotaAudio.playTap === "function") window.NotaAudio.playTap();

  function ensureCss() {

    ].join("");
    document.head.appendChild(s);
  }

  function renderGallery(keys, title) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) { return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null; }).filter(Boolean);

    return (
      '<div class="archival-section-head"><span>' + esc(title) + "</span></div>" +

        return (

            "</div>" +
          "</button>"
        );
      }).join("") +
      "</div>"
    );
  }

  function bindGallery(shell, ctx) {

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var backBtn = document.getElementById("notaBackBtn");

    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx

  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {

  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
