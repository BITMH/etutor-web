/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab12","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":12,"title":"Variasi","subtitle":"Variasi Selanjar vs Tak Selanjar, Pemilihan Semula Jadi, Punca Genetik & Persekitaran serta Mutasi Gen & Kromosom","estimatedMinutes":55,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"../data/biologi-t5-bab12-labs.js","coverIcon":"../assets/icons/bio512-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat sekali! Penguasaan konsep variasi dan mutasi kamu amat cemerlang.","combo":"[excited] Hebat! Jawapan pantas dan tepat dalam membezakan faktor genetik dan persekitaran.","encourage":"[gentle] Cuba semak semula perbezaan variasi selanjar dengan tak selanjar serta jenis mutasi kromosom.","celebrate":"[celebratory] Tahniah! Kamu telah menamatkan semua unit Bab dua belas Variasi!"},"units":[{"id":"bio512-u1","title":"Unit 1: Variasi Selanjar vs Tak Selanjar & Pemilihan Semula Jadi","subtitle":"Subtopik 12.1 — Kemandirian Spesies (Mutasi CCR5 & Biston betularia Charles Darwin), Graf Taburan Normal vs Carta Bar Diskrit","iconType":"scale","iconUrl":"../assets/icons/bio512-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Variasi Selanjar, Tak Selanjar & Seleksi Alam","voiceCaption":"Variasi selanjar adalah kuantitatif dengan taburan normal dan dipengaruhi persekitaran, manakala variasi tak selanjar adalah kualitatif diskrit yang dikawal gen tunggal.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab dua belas: Variasi! Tahukah kamu individu yang mengalami mutasi gen C C R lima mempunyai rintangan terhadap jangkitan H.I.V. kerana virus gagal melekat pada reseptor C D empat sel T pembantu? Itulah kepentingan variasi bagi kemandirian spesies! Di Britain semasa Revolusi Perindustrian, kupu-kupu Biston betularia berwarna gelap terselamat di batang pokok berjelaga manakala varian cerah mudah dimakan pemangsa, membuktikan teori pemilihan semula jadi Charles Darwin! Dalam subtopik dua belas perpuluhan satu, variasi terbahagi kepada dua: pertama, Variasi Selanjar yang bersifat KUANTITATIF dan boleh diukur seperti ketinggian, berat badan, warna kulit serta kepintaran — ia menunjukkan julat pertengahan dalam graf lengkung taburan normal berbentuk loceng, dikawal oleh banyak gen dan DIPENGARUHI faktor persekitaran! Kedua, Variasi Tak Selanjar yang bersifat KUALITATIF dan diskrit tanpa ciri pertengahan seperti kumpulan darah A.B.O., kebolehan menggulung lidah, pola cap jari dan lesung pipit — ia diplot sebagai carta bar, dikawal oleh satu gen tunggal dan TIDAK dipengaruhi persekitaran!","title":"12.1 Variasi Selanjar vs Tak Selanjar & Biston betularia","acronym":"S•K•L•B","hook":"Tonton video animasi variasi serta bandingkan carta taburan normal dan diskrit dalam makmal di bawah!","mediaKey":"bio512_variasi_mutasi","videoClip":{"src":"../assets/biologi-t5-bab12/video/bio512_video_variasi_mutasi_narasi.mp4","hasNarration":true,"posterKey":"bio512_variasi_mutasi","caption":"Perbandingan variasi selanjar (lengkung normal) dengan variasi tak selanjar serta kesan mutasi gen dan kromosom."},"summary":"Variasi memacu kemandirian & pemilihan semula jadi (Charles Darwin, Biston betularia; mutasi CCR5 rintangan HIV). Selanjar = kuantitatif, lengkung normal, banyak gen + persekitaran. Tak selanjar = kualitatif, carta bar diskrit, satu gen, bebas persekitaran.","bullets":["Kepentingan Kemandirian & Pemilihan Semula Jadi: Mutasi gen CCR5 menghalang pengikatan HIV pada reseptor CD4 sel T pembantu. Seleksi alam Charles Darwin pada Biston betularia menunjukkan varian gelap lebih mandiri pada batang pokok berjelaga selepas Revolusi Perindustrian UK.","Variasi Selanjar: Bersifat kuantitatif (boleh diukur), tiada perbezaan ketara (ada julat pertengahan), diplot sebagai graf lengkung normal berbentuk loceng, dikawal oleh BANYAK GEN dan DIPENGARUHI persekitaran (tinggi, berat badan, warna kulit, kepintaran).","Variasi Tak Selanjar: Bersifat kualitatif (tidak boleh diukur), perbezaan sangat ketara/diskrit, diplot sebagai carta bar, dikawal oleh SATU GEN TUNGGAL dan TIDAK dipengaruhi persekitaran (darah ABO, gulung lidah, cap jari, lesung pipit, kidal)."],"labId":"bio512_selanjar_tak_selanjar_lab","labTitle":"Pembanding Variasi Selanjar vs Tak Selanjar","labProps":{"mode":"banding"},"examTip":"Kata kunci wajib Kertas 2: Variasi selanjar -> kuantitatif, lengkung normal, dikawal banyak gen & dipengaruhi persekitaran; Variasi tak selanjar -> kualitatif, carta bar, dikawal satu gen & tidak dipengaruhi persekitaran."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Variasi Selanjar vs Tak Selanjar","voiceCaption":"Kelaskan enam ciri dan sifat variasi manusia berikut antara Variasi Selanjar dengan Variasi Tak Selanjar.","voiceScript":"[confident] Kelaskan keenam-enam ciri variasi manusia ini kepada variasi selanjar atau tak selanjar!","prompt":"Isihkan ciri dan sifat variasi berikut mengikut kumpulannya:","buckets":[{"id":"selanjar","label":"Variasi Selanjar"},{"id":"takselanjar","label":"Variasi Tak Selanjar"}],"items":[{"text":"Ketinggian pelajar Tingkatan 5 membentuk graf lengkung normal berbentuk loceng","bucketId":"selanjar","note":"Tepat! Bersifat kuantitatif dan mempunyai sifat pertengahan."},{"text":"Berat badan dan warna kulit yang turut dipengaruhi pemakanan serta cahaya matahari","bucketId":"selanjar","note":"Betul! Dikawal banyak gen dan dipengaruhi persekitaran."},{"text":"Kumpulan darah ABO (A, B, AB, O) yang diplot sebagai carta bar diskrit","bucketId":"takselanjar","note":"Tepat! Tiada kumpulan pertengahan antara A dan B."},{"text":"Kebolehan menggulung lidah serta cuping telinga melekap atau tidak melekap","bucketId":"takselanjar","note":"Betul! Dikawal satu gen tunggal tanpa pengaruh persekitaran."},{"text":"Pola cap jari (lengkung, gelung dan pusar) serta tangan kidal atau kanan","bucketId":"takselanjar","note":"Tepat! Sifat kualitatif kekal sepanjang hayat."},{"text":"Tahap kepintaran yang dikawal oleh gabungan poligen dan rangsangan persekitaran","bucketId":"selanjar","note":"Betul! Contoh variasi selanjar."}],"explanation":"Ciri yang boleh diukur berjulat selanjar menghasilkan lengkung loceng; ciri kategori diskrit menghasilkan carta bar."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kemandirian Biston betularia","voiceCaption":"Ramalkan perubahan nisbah populasi Biston betularia apabila pencemaran jelaga kilang dibersihkan semula.","voiceScript":"[curious] Selepas akta udara bersih dilaksanakan, liken cerah kembali tumbuh pada kulit pokok birch. Ramalkan apa yang berlaku kepada populasi Biston betularia gelap dan cerah!","hook":"Bandingkan dua era pada Simulator Biston betularia di bawah!","scenario":"Kawasan perindustrian di United Kingdom mengurangkan asap jelaga sehingga kulit pokok birch kembali berwarna cerah berliken.","prompt":"Bagaimanakah pemilihan semula jadi mempengaruhi populasi Biston betularia selepas perubahan itu?","options":["Varian cerah tersamar dengan lebih baik dan terselamat daripada pemangsa, lalu populasinya kembali meningkat manakala varian gelap menurun","Varian gelap bermutasi serta-merta menjadi cerah dalam satu malam tanpa pembiakan","Semua burung pemangsa kehilangan deria penglihatan warna","Kedua-dua varian pupus serentak kerana liken beracun"],"correctIndex":0,"proofLabId":"bio512_biston_seleksi_sim","proofState":{"era":"bersih"},"explanation":"Apabila persekitaran berubah menjadi cerah semula, penyamaran menyebelahi varian cerah lalu kadar kemandirian dan pembiakannya mengatasi varian gelap."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Konsep Evolusi & Perbezaan Variasi","voiceCaption":"Padankan lima konsep variasi dan pemilihan semula jadi berikut dengan huraian tepat.","voiceScript":"[confident] Padankan kesemua istilah asas Bab dua belas ini dengan penerangannya!","prompt":"Padankan setiap istilah atau contoh dengan huraiannya:","pairs":[{"id":"b512u1m1","left":"Pemilihan semula jadi (Charles Darwin)","right":"Organisma dengan variasi lebih adaptif mandiri dan mewariskan alel kepada zuriat"},{"id":"b512u1m2","left":"Mutasi gen CCR5","right":"Memberikan rintangan semula jadi terhadap jangkitan virus HIV pada sel T"},{"id":"b512u1m3","left":"Graf lengkung normal (loceng)","right":"Bentuk plot data variasi selanjar seperti ketinggian dan jisim badan"},{"id":"b512u1m4","left":"Graf carta bar diskrit","right":"Bentuk plot data variasi tak selanjar seperti kumpulan darah dan cap jari"},{"id":"b512u1m5","left":"Kawal atur gen tunggal vs poligen","right":"Variasi tak selanjar vs variasi selanjar"}],"explanation":"Pemilihan semula jadi bertindak ke atas variasi yang diwarisi untuk meningkatkan kesesuaian sesuatu populasi terhadap habitatnya."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s5","voiceToneLabel":"Cabaran Unit 1: Pengaruh Persekitaran","voiceCaption":"Kenal pasti ciri yang langsung tidak berubah walaupun individu berpindah ke persekitaran berbeza.","voiceScript":"[excited] Uji perbezaan mutlak antara variasi selanjar dan tak selanjar apabila persekitaran berubah!","prompt":"Seorang atlet berpindah ke negara beriklim sejuk selama 5 tahun dan menukar diet pemakanannya. Ciri manakah pada dirinya yang PASTI kekal tidak berubah?","options":["Kumpulan darah ABO dan pola cap jarinya","Jisim badan dan peratusan lemak badannya","Kecerahan warna kulit akibat pendedahan cahaya matahari","Kekuatan otot dan tahap kecergasan fizikalnya"],"correctIndex":0,"explanation":"Kumpulan darah dan cap jari ialah variasi tak selanjar yang ditentukan sepenuhnya oleh faktor genetik dan tidak dipengaruhi persekitaran."}]},{"id":"bio512-u2","title":"Unit 2: Punca Variasi Genetik vs Faktor Persekitaran","subtitle":"Subtopik 12.1 — Pindah Silang (Profasa I), Penyusunan Bebas (Metafasa I), Persenyawaan Rawak, Hydrangea (pH), Kucing Siam & Kembar Seiras","iconType":"leaf","iconUrl":"../assets/icons/bio512-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Punca Genetik & 3 Faktor Persekitaran","voiceCaption":"Variasi genetik berpunca daripada pindah silang Profasa I, penyusunan bebas Metafasa I, persenyawaan rawak serta mutasi gamet, manakala suhu, cahaya dan pH tanah mengubah fenotip persekitaran.","voiceScript":"[warm] Sekarang masuk ke Unit dua: dari manakah datangnya semua variasi di sekeliling kita? Pertama, daripada empat punca VARIASI GENETIK: satu, pindah silang iaitu pertukaran segmen D.N.A. antara kromatid bukan seiras semasa Profasa satu meiosis; dua, penyusunan bebas pasangan kromosom homolog di satah khatulistiwa semasa Metafasa satu meiosis; tiga, persenyawaan rawak antara berjuta-juta sperma dengan ovum berbeza; dan empat, mutasi pada sel germa atau gamet yang boleh diwarisi! Kedua, variasi juga dibentuk oleh FAKTOR PERSEKITARAN seperti suhu, cahaya dan pH tanah! Lihat contoh menarik buku teks: bunga Hydrangea bertukar menjadi biru dalam tanah berasid berpH kurang daripada lima perpuluhan lima, tetapi menjadi merah jambu dalam tanah beralkali! Kucing Siam pula mempunyai enzim pigmen gelap yang hanya aktif di bahagian badan bersuhu rendah seperti telinga, muka dan hujung kaki! Manakala cahaya U.V. matahari merangsang penghasilan melanin kulit! Kajian kembar seiras J dan K membuktikan walaupun seratus peratus gen mereka sama, diet dan persekitaran yang berbeza menghasilkan berat dan warna kulit yang berlainan!","title":"Punca Variasi Genetik (Meiosis) & Faktor Persekitaran","acronym":"P•P•P•M","hook":"Tukar tab 'Genetik vs Persekitaran' pada makmal di bawah untuk membandingkan Hydrangea, kucing siam dan kembar seiras!","mediaKey":"bio512_hydrangea_ph","summary":"4 Punca Genetik: Pindah silang (Profasa I), Penyusunan bebas (Metafasa I), Persenyawaan rawak, Mutasi gamet. 3 Faktor Persekitaran: pH tanah (Hydrangea pH < 5.5 biru vs alkali merah jambu), Suhu (kucing siam), Cahaya (melanin); kajian kembar seiras J & K.","bullets":["4 Punca Variasi Genetik: (1) Pindah silang antara kromatid bukan seiras (Profasa I); (2) Penyusunan bebas kromosom homolog (Metafasa I); (3) Persenyawaan rawak gamet; (4) Mutasi sel pembiakan (gamet).","Faktor Persekitaran (Suhu, Cahaya, pH Tanah): Bunga Hydrangea sp. menjadi biru pada tanah berasid (pH < 5.5) dan merah jambu pada tanah beralkali. Suhu sejuk mengaktifkan enzim pigmen gelap pada hujung kaki, telinga dan muncung kucing Siam. Cahaya matahari meningkatkan melanin kulit.","Kajian Kembar Seiras (J & K): Berkongsi gen seiras 100% daripada satu zigot, namun dibesarkan berasingan dengan pemakanan dan cahaya matahari berbeza menyebabkan perbezaan berat badan serta tona kulit."],"labId":"bio512_selanjar_tak_selanjar_lab","labTitle":"Makmal Punca Genetik vs Faktor Persekitaran","labProps":{"mode":"punca"},"examTip":"Hafal fasa meiosis dengan tepat untuk Kertas 2: Pindah silang = PROFASA I; Penyusunan bebas = METAFASA I. Jika tertukar fasa, markah hilang!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Bina Huraian 3 Proses Pembiakan Seks","voiceCaption":"Susun frasa untuk melengkapkan tiga punca variasi genetik daripada meiosis dan persenyawaan.","voiceScript":"[confident] Susun frasa berikut bagi menghuraikan punca variasi genetik semasa pembiakan seks!","prompt":"Susun frasa berikut menjadi huraian lengkap punca variasi genetik:","hint":"Variasi genetik dijana oleh pindah silang semasa Profasa I...","answerTokens":["Variasi genetik dijana oleh pindah silang semasa Profasa I,","penyusunan bebas kromosom homolog semasa Metafasa I","serta persenyawaan rawak antara gamet jantan dengan gamet betina."],"distractors":["dan hanya berlaku semasa pembahagian mitosis sel kulit","tanpa melibatkan sebarang penggabungan gen daripada dua induk"],"explanation":"Meiosis (pindah silang + penyusunan bebas) dan persenyawaan rawak mencipta kombinasi alel baharu yang unik pada setiap zigot."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Faktor Persekitaran & Fenotip","voiceCaption":"Padankan lima contoh organisma berikut dengan faktor persekitaran atau punca variasi genetik masing-masing.","voiceScript":"[confident] Padankan setiap contoh tumbuhan dan haiwan ini dengan faktor persekitaran atau genetiknya!","prompt":"Padankan contoh organisma berikut dengan faktor penentunya:","pairs":[{"id":"b512u2m1","left":"Bunga Hydrangea sp. berwarna biru vs merah jambu","right":"pH tanah berasid (< 5.5) vs tanah beralkali"},{"id":"b512u2m2","left":"Bulu gelap di telinga dan hujung kaki kucing Siam","right":"Faktor suhu persekitaran yang lebih rendah mengaktifkan enzim pigmen"},{"id":"b512u2m3","left":"Perbezaan berat badan kembar seiras J dan K","right":"Faktor pemakanan dan gaya hidup persekitaran (genetik sama 100%)"},{"id":"b512u2m4","left":"Pertukaran segmen kromatid bukan seiras","right":"Pindah silang semasa Profasa I meiosis"},{"id":"b512u2m5","left":"Kulit menjadi lebih gelap selepas berjemur di pantai","right":"Cahaya matahari (UV) merangsang penghasilan pigmen melanin"}],"explanation":"Fenotip ialah hasil interaksi antara genotip dengan faktor persekitaran seperti suhu, pH tanah, diet dan cahaya."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Warna Bunga Hydrangea di Tanah Kapur","voiceCaption":"Ramalkan perubahan warna bunga Hydrangea apabila serbuk kapur (kalsium karbonat beralkali) ditaburkan pada tanah asalnya.","voiceScript":"[curious] Seorang pekebun menaburkan serbuk kapur beralkali pada tanah pokok Hydrangea yang asalnya berbunga biru terang. Apakah perubahan warna bunga seterusnya?","hook":"Ingat kaitan pH tanah berasid vs beralkali dalam tab Genetik vs Persekitaran!","scenario":"Pokok Hydrangea sp. berbunga biru dalam tanah berpH 5.0 dirawat dengan baja kapur sehingga pH tanah meningkat menjadi 7.8.","prompt":"Apakah warna kelopak bunga baharu yang akan tumbuh?","options":["Berubah menjadi merah jambu kerana pH tanah telah bertukar kepada beralkali","Kekal biru selama-lamanya kerana warna bunga merupakan variasi tak selanjar","Bertukar menjadi hitam akibat pembakaran sel kelopak oleh kapur","Menghasilkan bunga putih lut sinar tanpa klorofil"],"correctIndex":0,"proofLabId":"bio512_selanjar_tak_selanjar_lab","proofState":{"mode":"punca"},"explanation":"Hydrangea sp. berbunga biru dalam tanah berasid (pH < 5.5) dan berbunga merah jambu apabila ditanam dalam tanah neutral atau beralkali."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s5","voiceToneLabel":"Cabaran Unit 2: Kesimpulan Kembar Seiras","voiceCaption":"Pilih kesimpulan paling tepat daripada kajian kembar seiras J dan K yang dibesarkan berasingan.","voiceScript":"[excited] Uji analisis eksperimen kembar seiras dalam buku teks! Apakah bukti yang ditunjukkan oleh perbezaan antara kembar J dan K?","prompt":"Kembar seiras J membesar di bandar dengan diet tinggi kalori lalu mencapai berat 72 kg, manakala kembar K membesar di kampung sebagai pelari maraton dengan berat 56 kg. Apakah kesimpulan terbaik?","options":["Variasi selanjar seperti berat badan dipengaruhi oleh faktor persekitaran walaupun kedua-duanya mempunyai komposisi genotip yang 100% seiras","Kembar seiras sebenarnya terhasil daripada persenyawaan dua ovum dan dua sperma berbeza","Semua variasi genetik akan terpadam apabila individu membesar","Berat badan ialah variasi tak selanjar yang dikawal satu gen tunggal"],"correctIndex":0,"explanation":"Kerana kembar seiras berkongsi DNA 100% sama, sebarang perbezaan berat badan atau warna kulit antara mereka membuktikan pengaruh faktor persekitaran."}]},{"id":"bio512-u3","title":"Unit 3: Variasi dalam Manusia, Cap Jari & Ujian PTC","subtitle":"Subtopik 12.2 — Jadual 12.1 Trait Dominan vs Resesif Manusia, Pola Cap Jari (Lengkung, Gelung, Pusar) & Kesan Alel PTC","iconType":"map","iconUrl":"../assets/icons/bio512-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Trait Manusia, Pola Cap Jari & Ujian PTC","voiceCaption":"Variasi dalam manusia merangkumi trait dominan dan resesif dalam Jadual 12.1, tiga pola utama cap jari serta kepekaan rasa kertas PTC.","voiceScript":"[warm] Selamat datang ke Unit tiga, subtopik dua belas perpuluhan dua: Variasi dalam Manusia! Mari semak Jadual dua belas perpuluhan satu dalam buku teks yang menyenaraikan trait dominan dan resesif manusia: kebolehan menggulung lidah, lesung pipit, rambut keriting, cuping telinga tidak melekap, dan kepekaan terhadap rasa pahit kertas P.T.C. feniltiokarbamida semuanya dikawal oleh alel DOMINAN! Sebaliknya tidak boleh menggulung lidah, tiada lesung pipit, rambut lurus, cuping telinga melekap dan tidak merasa pahit P.T.C. dikawal oleh alel RESESIF! Bagaimana pula dengan cap jari manusia yang tidak pernah sama walaupun pada kembar seiras? Terdapat tiga pola utama cap jari: lengkung iaitu garis melengkung tanpa gelung, gelung iaitu garis masuk dan berpatah balik keluar di sisi sama, serta pusar iaitu bulatan sepusat di tengah! Semua sifat ini merupakan variasi tak selanjar yang membantu pengenalpastian identiti forensik dan kajian genetik populasi!","title":"12.2 Jadual 12.1 Trait Manusia, Pola Cap Jari & Kertas PTC","acronym":"L•G•P•PTC","hook":"Perhatikan pola lengkung, gelung dan pusar pada visual cap jari di atas!","mediaKey":"bio512_cap_jari","summary":"Jadual 12.1 Trait Dominan: gulung lidah, lesung pipit, rambut keriting, cuping tak melekap, rasa pahit PTC. Pola Cap Jari (tak selanjar): Lengkung (arch), Gelung (loop), Pusar (whorl). Unik walaupun bagi kembar seiras!","bullets":["Jadual 12.1 Trait Manusia: Dominan (boleh gulung lidah, ada lesung pipit, cuping telinga bebas/tak melekap, rambut keriting, merasa pahit kertas PTC); Resesif (tidak boleh gulung lidah, tiada lesung pipit, cuping melekap, rambut lurus, tawar pada PTC).","3 Pola Utama Cap Jari: Lengkung (rabung masuk satu sisi dan keluar sisi bertentangan), Gelung (rabung masuk dan berpusing keluar di sisi sama) dan Pusar (bulatan atau lingkaran sepusat).","Keunikan Forensik: Walaupun kembar seiras berkongsi profil DNA yang sama, pola rabung cap jari mereka tetap berbeza kerana pembentukan rabung mikro semasa perkembangan fetus."],"labId":"bio512_selanjar_tak_selanjar_lab","labTitle":"Rujukan Variasi Tak Selanjar Manusia","labProps":{"mode":"banding"},"examTip":"Soalan perangkap popular: Adakah kembar seiras mempunyai cap jari yang sama? TIDAK! DNA kembar seiras sama, tetapi pola cap jari mereka tetap unik dan berbeza!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Trait Dominan vs Resesif (Jadual 12.1)","voiceCaption":"Kelaskan enam trait manusia daripada Jadual 12.1 berikut antara Trait Dominan dengan Trait Resesif.","voiceScript":"[confident] Kelaskan enam sifat variasi manusia dalam Jadual dua belas perpuluhan satu mengikut dominan atau resesif!","prompt":"Isihkan trait manusia berikut kepada kumpulan Dominan atau Resesif:","buckets":[{"id":"dom","label":"Trait Dominan"},{"id":"res","label":"Trait Resesif"}],"items":[{"text":"Kebolehan menggulung lidah dan kehadiran lesung pipit","bucketId":"dom","note":"Tepat! Kedua-duanya ialah trait dominan."},{"text":"Cuping telinga bebas (tidak melekap) dan rambut keriting","bucketId":"dom","note":"Betul! Dikawal alel dominan."},{"text":"Merasai rasa sangat pahit apabila mengecap jalur kertas PTC","bucketId":"dom","note":"Tepat! Kepekaan PTC adalah trait dominan."},{"text":"Cuping telinga melekap rapat pada sisi kepala","bucketId":"res","note":"Betul! Trait resesif homozigot."},{"text":"Rambut lurus semula jadi dan tiada lesung pipit","bucketId":"res","note":"Tepat! Kedua-duanya trait resesif."},{"text":"Tidak dapat merasai kepahitan kertas PTC (rasa seperti kertas biasa)","bucketId":"res","note":"Betul! Homozigot resesif bagi reseptor rasa pahit."}],"explanation":"Mengikut Jadual 12.1 KSSM: gulung lidah, lesung pipit, rambut keriting, cuping tak melekap dan perasa PTC adalah dominan."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Pola Cap Jari & Ujian Manusia","voiceCaption":"Padankan lima ciri variasi manusia berikut dengan penerangan tepat masing-masing.","voiceScript":"[confident] Padankan pola cap jari dan trait manusia berikut dengan ciri-cirinya!","prompt":"Padankan istilah variasi manusia berikut:","pairs":[{"id":"b512u3m1","left":"Pola cap jari Lengkung","right":"Rabung kulit masuk dari satu sisi melengkung naik dan keluar di sisi bertentangan"},{"id":"b512u3m2","left":"Pola cap jari Gelung","right":"Rabung kulit masuk dari satu sisi, melengkung dan berpatah balik di sisi sama"},{"id":"b512u3m3","left":"Pola cap jari Pusar","right":"Rabung kulit membentuk lingkaran atau bulatan sepusat di bahagian tengah"},{"id":"b512u3m4","left":"Kertas PTC (Feniltiokarbamida)","right":"Menguji variasi tak selanjar kepekaan rasa pahit yang dikawal alel dominan"},{"id":"b512u3m5","left":"Cap jari kembar seiras","right":"Berbeza antara satu sama lain walaupun profil DNA adalah 100% sepadan"}],"explanation":"Tiga pola utama cap jari ialah lengkung, gelung dan pusar; kesemuanya variasi tak selanjar yang unik bagi setiap jari manusia."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Pewarisan Gulung Lidah Ibu Bapa","voiceCaption":"Ramalkan sama ada sepasang ibu bapa yang kedua-duanya tidak boleh menggulung lidah boleh melahirkan anak yang boleh menggulung lidah.","voiceScript":"[curious] Kedua-dua ibu dan bapa tidak boleh menggulung lidah. Mungkinkah mereka melahirkan anak yang boleh menggulung lidah mengikut hukum genetik Mendel?","hook":"Ingat bahawa 'tidak boleh menggulung lidah' ialah trait resesif homozigot!","scenario":"Bapa dan ibu kedua-duanya mempunyai fenotip tidak boleh menggulung lidah (homozigot resesif).","prompt":"Apakah fenotip kesemua anak mereka bagi ciri menggulung lidah?","options":["100% anak juga tidak boleh menggulung lidah kerana kedua-dua induk hanya membekalkan alel resesif","75% anak boleh menggulung lidah mengikut nisbah 3:1","50% anak pasti boleh menggulung lidah secara dominan","Semua anak lelaki boleh menggulung lidah manakala anak perempuan tidak boleh"],"correctIndex":0,"proofLabId":"bio512_selanjar_tak_selanjar_lab","proofState":{"mode":"banding"},"explanation":"Kerana tidak boleh menggulung lidah ialah trait resesif, kedua-dua ibu bapa bergenotip homozigot resesif dan hanya menghasilkan gamet membawa alel resesif."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s5","voiceToneLabel":"Cabaran Unit 3: Pengecaman Kembar Seiras","voiceCaption":"Pilih kaedah biometrik terbaik untuk membezakan antara dua orang kembar seiras dalam siasatan forensik.","voiceScript":"[excited] Soalan aplikasi forensik: bagaimana polis membezakan suspek kembar seiras di tempat kejadian jenayah?","prompt":"Dalam kes jenayah melibatkan dua orang kembar seiras, ujian manakah yang PALING berkesan untuk membezakan individu A daripada kembarnya individu B?","options":["Pemeriksaan pola cap jari kerana susunan rabung cap jari setiap individu adalah unik walaupun pada kembar seiras","Pemprofilan DNA darah kerana jalur DNA kembar seiras berbeza jauh","Ujian kumpulan darah ABO kerana kembar seiras berlainan jenis darah","Pengukuran ketinggian sahaja tanpa bukti biometrik"],"correctIndex":0,"explanation":"Kembar seiras mempunyai DNA dan kumpulan darah ABO yang sama, tetapi cap jari terbentuk secara unik oleh perkembangan mikro dalam rahim."}]},{"id":"bio512-u4","title":"Unit 4: Mutasi Mutagen, Mutasi Gen & Mutasi Kromosom","subtitle":"Subtopik 12.3 — Mutagen Fizikal/Kimia/Biologi, Anemia Sel Sabit (HbS & Malaria), Cri du chat, Klinefelter, Jacob (XYY) & Turner","iconType":"atom","iconUrl":"../assets/icons/bio512-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Mutagen, Mutasi Gen & Mutasi Kromosom","voiceCaption":"Mutasi ialah perubahan spontan dan rawak pada bahan genetik yang tercetus oleh mutagen, dibahagi kepada mutasi gen dan mutasi kromosom serta sel soma berbanding sel gamet.","voiceScript":"[warm] Selamat datang ke Unit empat, subtopik dua belas perpuluhan tiga: Mutasi! Mutasi ialah perubahan spontan dan rawak yang berlaku pada kandungan genetik iaitu D.N.A. atau kromosom sesuatu sel! Bahan yang meningkatkan kadar mutasi disebut MUTAGEN: mutagen fizikal seperti sinar U.V., sinar X, sinar alfa dan beta; mutagen kimia seperti asap rokok, pengawet, formaldehid dan benzena; serta mutagen biologi seperti virus dan bakteria tertentu! Mutasi terbahagi kepada dua kelas utama! Pertama, MUTASI GEN atau mutasi titik melibatkan penggantian, pelenyapan atau sisipan satu atau beberapa pasangan bes D.N.A. — contoh terbaik ialah Anemia Sel Sabit di mana asid glutamik digantikan oleh valina dalam hemoglobin H b S menjadikan sel darah merah berbentuk sabit; menariknya, pembawa trait sel sabit lebih rintang terhadap parasit malaria di Afrika! Contoh lain ialah talasemia, sistik fibrosis, albinisme dan hemofilia! Kedua, MUTASI KROMOSOM terbahagi kepada perubahan struktur iaitu pelenyapan seperti Sindrom Cri du chat akibat kehilangan lengan pendek kromosom ke lima di mana bayi menangis seperti kucing, penggandaan, penyongsangan seratus lapan puluh darjah, serta translokasi ke kromosom bukan homolog; dan perubahan bilangan akibat tak disjungsi seperti Sindrom Down trisomi dua puluh satu, Klinefelter X X Y, Sindrom Jacob empat puluh empat tambah X Y Y iaitu lelaki tinggi berjerawat dan lemah otot hypotonia, serta Turner X O berleher bertaut! Akhir sekali, mutasi sel soma seperti kanser darah tidak diwarisi anak, manakala mutasi sel gamet akan diwarisi generasi seterusnya!","title":"12.3 Mutagen, Mutasi Gen (Anemia Sel Sabit) & Mutasi Kromosom","acronym":"G•K•S•J","hook":"Klik tab Mutasi Gen & Mutagen serta Mutasi Kromosom dalam makmal di bawah!","mediaKey":"bio512_sel_sabit","summary":"Mutagen (fizikal: UV/X-ray/alfa/beta; kimia: rokok/formaldehid/benzena; biologi: virus/bakteria). Mutasi Gen (penggantian/pelenyapan/sisipan -> HbS glutamik->valina [rintang malaria], talasemia, albinisme). Mutasi Kromosom (struktur: pelenyapan [Cri du chat chr 5], penggandaan, penyongsangan, translokasi; bilangan: Down, XXY, Jacob XYY [tinggi/jerawat/hypotonia], Turner XO). Soma vs Gamet.","bullets":["3 Jenis Mutagen: Fizikal (sinar UV, sinar-X, alfa, beta), Kimia (asap rokok, bahan pengawet, formaldehid, benzena) dan Biologi (virus, bakteria).","Mutasi Gen (Penggantian, Pelenyapan, Sisipan Bes): Mengubah urutan bes DNA dan kodon asid amino — cth. Anemia Sel Sabit (HbS: asid glutamik -> valina; memberi rintangan terhadap malaria), talasemia (pelenyapan), albinisme dan hemofilia.","Mutasi Kromosom (Struktur & Bilangan) serta Soma vs Gamet: Struktur: Pelenyapan (Cri du chat kromosom 5 — tangisan seperti kucing), Penggandaan, Penyongsangan (180 darjah), Translokasi (bukan homolog). Bilangan (Tak Disjungsi): Down (47, +21), Klinefelter (44+XXY), Jacob (44+XYY: tinggi, jerawat, hypotonia), Turner (44+XO: leher bertaut). Mutasi sel soma (kanser darah) TIDAK diwarisi; mutasi gamet DIWARISI."],"labId":"bio512_mutasi_gen_kromosom_lab","labTitle":"Makmal Mutasi Gen & Mutasi Kromosom","labProps":{"tab":"kromosom"},"examTip":"Beza wajib dalam jawapan Kertas 2: Sindrom Down (47, +21) dan Jacob (44+XYY) ialah mutasi BILANGAN kromosom (tak disjungsi), manakala Cri du chat (lengan pendek kromosom 5 hilang) ialah mutasi STRUKTUR kromosom (pelenyapan)!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Bina Mekanisme Anemia Sel Sabit & Sel Gamet","voiceCaption":"Susun frasa untuk menghuraikan punca molekul anemia sel sabit dan pewarisan mutasi gamet.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan huraian tepat Anemia Sel Sabit dan jenis mutasi!","prompt":"Susun frasa berikut untuk menghuraikan mutasi gen Anemia Sel Sabit:","hint":"Anemia sel sabit disebabkan oleh mutasi penggantian bes...","answerTokens":["Anemia sel sabit disebabkan oleh mutasi penggantian bes yang menukarkan asid glutamik kepada valina,","menjadikan eritrosit berbentuk sabit yang kurang cekap mengangkut oksigen","tetapi memberi ketahanan lebih tinggi terhadap jangkitan malaria."],"distractors":["akibat kegagalan pasangan kromosom seks X berpisah semasa Anafasa I","kerana virus memusnahkan keseluruhan kromosom kelima dalam sel saraf"],"explanation":"Penggantian satu bes menukarkan asid amino glutamik kepada valina dalam hemoglobin HbS — contoh mutasi gen yang diwarisi."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Jenis Mutasi Kromosom & Sindrom","voiceCaption":"Padankan lima jenis mutasi gen atau kromosom berikut dengan contoh sindrom atau mekanismenya.","voiceScript":"[confident] Padankan kelima-lima jenis mutasi struktur dan bilangan kromosom berikut!","prompt":"Padankan jenis mutasi berikut dengan contoh atau cirinya:","pairs":[{"id":"b512u4m1","left":"Pelenyapan struktur kromosom ke-5","right":"Sindrom Cri du chat (bayi menangis bernada tinggi seperti kucing)"},{"id":"b512u4m2","left":"Sindrom Jacob (44 + XYY)","right":"Lelaki berkromosom Y tambahan: tinggi, masalah jerawat dan lemah otot (hypotonia)"},{"id":"b512u4m3","left":"Translokasi kromosom","right":"Sebahagian segmen kromosom patah dan bercantum pada kromosom bukan homolog"},{"id":"b512u4m4","left":"Penyongsangan kromosom","right":"Segmen kromosom terputus, berpusing 180 darjah dan bercantum semula"},{"id":"b512u4m5","left":"Mutasi sel soma vs sel gamet","right":"Kanser darah (tidak diwarisi) vs mutasi dalam sperma atau ovum (diwarisi)"}],"explanation":"Empat perubahan struktur kromosom ialah pelenyapan, penggandaan, penyongsangan dan translokasi; hanya mutasi sel gamet diwarisi."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Mutasi Gen vs Mutasi Kromosom","vo   if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}
