/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"biologi-t5-bab13","subject":"Biologi","subjectGroup":"sains","form":5,"chapterNumber":13,"title":"Teknologi Genetik","subtitle":"Kejuruteraan Genetik & GMO/GMF, DNA Rekombinan Insulin, 10 Warna Bioteknologi, Terapi Gen, Pemprofilan DNA & Bioremediasi","estimatedMinutes":55,"themeAccent":"#047857","isFreePreview":false,"labScript":"../data/biologi-t5-bab13-labs.js","coverIcon":"../assets/icons/bio513-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Kefahaman teknologi DNA rekombinan dan bioteknologi kamu sangat mantap.","combo":"[excited] Hebat! Jawapan berturut-turut menunjukkan penguasaan penuh konsep kejuruteraan genetik.","encourage":"[gentle] Cuba semak semula peranan enzim pembatasan, DNA ligase serta langkah pemprofilan DNA.","celebrate":"[celebratory] Tahniah! Kamu telah menamatkan Bab tiga belas Teknologi Genetik, bab penutup Biologi Tingkatan lima!"},"units":[{"id":"bio513-u1","title":"Unit 1: Kejuruteraan Genetik, GMO & Penghasilan Insulin","subtitle":"Subtopik 13.1 — Genom, DNA Rekombinan, GMO (Lembu Bebas Alergi & Kambing Hemofilia) serta Rajah 13.2 Penghasilan Insulin Manusia","iconType":"dna","iconUrl":"../assets/icons/bio513-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Kejuruteraan Genetik & Insulin DNA Rekombinan","voiceCaption":"Kejuruteraan genetik menggabungkan DNA spesies berbeza menggunakan enzim pembatasan dan DNA ligase untuk menghasilkan plasmid rekombinan bagi mensintesis insulin manusia.","voiceScript":"[warm] Selamat datang ke Biologi Tingkatan lima, Bab tiga belas: Teknologi Genetik! Pada subtopik tiga belas perpuluhan satu, kejuruteraan genetik ialah teknik manipulasi gen untuk mengubah suai genetik sesuatu organisma bagi menghasilkan kombinasi gen baharu! Set lengkap D.N.A. bagi sesuatu organisma disebut genom! Apabila D.N.A. daripada dua spesies berbeza digabungkan, terhasillah D.N.A. rekombinan, dan organisma yang menerimanya disebut organisma terubah suai secara genetik atau G.M.O. transgenik — contohnya lembu tanpa protein alergi beta laktoglobulin serta kambing yang menghasilkan faktor pembekuan darah bagi merawat hemofilia! Aplikasi perubatan terpenting dalam Rajah tiga belas perpuluhan dua ialah penghasilan hormon insulin manusia! Pertama, gen insulin manusia dan plasmid bakteria masing-masing dipotong menggunakan ENZIM PEMBATASAN yang sama! Kedua, gen insulin disambungkan ke dalam plasmid oleh enzim D.N.A. LIGASE untuk membentuk plasmid rekombinan! Ketiga, plasmid rekombinan dimasukkan semula ke dalam sel bakteria yang kemudian membiak dan mengklonkan insulin untuk diekstrak dan ditulenkan! Teknik sama turut menghasilkan vaksin hepatitis B, faktor pembekuan darah dan hormon pertumbuhan! Tonton video animasi D.N.A. rekombinan di sini!","title":"13.1 Kejuruteraan Genetik, GMO & Rajah 13.2 Penghasilan Insulin","acronym":"EP•DL•PR","hook":"Tonton video animasi DNA rekombinan dan klik setiap langkah pada Simulator Penghasilan Insulin di bawah!","mediaKey":"bio513_plasmid_insulin","videoClip":{"src":"../assets/biologi-t5-bab13/video/bio513_video_dna_rekombinan_narasi.mp4","hasNarration":true,"posterKey":"bio513_plasmid_insulin","caption":"Video Penerangan Bersuara (BM): Penghasilan insulin manusia melalui teknologi DNA rekombinan dan prinsip pemprofilan DNA"},"summary":"Kejuruteraan genetik = manipulasi gen membentuk DNA rekombinan / GMO (lembu bebas beta-laktoglobulin, kambing faktor pembekuan). Rajah 13.2 Insulin: Gen insulin + plasmid dipotong enzim pembatasan -> disambung DNA ligase -> masuk bakteria -> klon & tulen insulin.","bullets":["Genom, DNA Rekombinan & GMO: Genom ialah set lengkap DNA organisma. DNA rekombinan terhasil apabila DNA dua spesies berbeza digabungkan. GMO (transgenik) merangkumi lembu bebas alergi beta-laktoglobulin dan kambing penghasil faktor pembekuan darah.","Rajah 13.2 Penghasilan Insulin Rekombinan: (1) Gen insulin manusia dan plasmid bakteria dipotong enzim pembatasan yang sama; (2) Disambung enzim DNA ligase membentuk plasmid rekombinan; (3) Dimasukkan ke dalam bakteria; (4) Klon bakteria membiak, lalu insulin diekstrak dan ditulenkan.","Produk Perubatan Lain: Selain insulin bagi diabetes melitus, DNA rekombinan menghasilkan vaksin hepatitis B, faktor pembekuan darah dan hormon pertumbuhan."],"labId":"bio513_insulin_rekombinan_sim","labTitle":"Simulator DNA Rekombinan Penghasilan Insulin (Rajah 13.2)","labProps":{"step":"potong"},"examTip":"Dua enzim wajib hafal dan jangan sekali-kali tertukar fungsinya: ENZIM PEMBATASAN = memotong gen & plasmid; ENZIM DNA LIGASE = menyambung gen dengan plasmid!"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Susun Langkah Penghasilan Insulin (Rajah 13.2)","voiceCaption":"Susun urutan tepat langkah penghasilan insulin manusia menggunakan plasmid bakteria dan DNA rekombinan.","voiceScript":"[confident] Susun frasa berikut mengikut urutan tepat penghasilan insulin dalam Rajah tiga belas perpuluhan dua!","prompt":"Susun urutan langkah penghasilan hormon insulin manusia melalui DNA rekombinan:","hint":"Gen insulin manusia dan plasmid bakteria dipotong oleh enzim pembatasan...","answerTokens":["Gen insulin manusia dan plasmid bakteria dipotong menggunakan enzim pembatasan,","lalu disambungkan oleh enzim DNA ligase untuk membentuk plasmid rekombinan","sebelum dimasukkan ke dalam bakteria yang diklonkan untuk mengekstrak dan menulenkan insulin."],"distractors":["kemudian dipisahkan terus melalui filem sinar-X menggunakan prob radioaktif","supaya bakteria menjalankan eutrofikasi dan menurunkan nilai BOD"],"explanation":"Urutan wajib: Enzim pembatasan (potong) -> DNA ligase (sambung jadi plasmid rekombinan) -> masuk bakteria -> pengklonan -> ekstrak & tulen insulin."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Komponen DNA Rekombinan & GMO","voiceCaption":"Padankan lima komponen utama kejuruteraan genetik berikut dengan fungsi tepat masing-masing.","voiceScript":"[confident] Padankan setiap alat dan konsep kejuruteraan genetik ini dengan peranannya!","prompt":"Padankan istilah kejuruteraan genetik berikut dengan fungsinya:","pairs":[{"id":"b513u1m1","left":"Enzim pembatasan","right":"Memotong gen insulin manusia dan plasmid bakteria pada tapak khusus"},{"id":"b513u1m2","left":"Enzim DNA ligase","right":"Menyambungkan gen sasaran ke dalam plasmid membentuk DNA rekombinan"},{"id":"b513u1m3","left":"Plasmid bakteria","right":"DNA bulat kecil dalam bakteria yang bertindak sebagai vektor pengklonan gen"},{"id":"b513u1m4","left":"Lembu transgenik khas","right":"Menghasilkan susu bebas protein alergi beta-laktoglobulin"},{"id":"b513u1m5","left":"Kambing transgenik perubatan","right":"Menghasilkan faktor pembekuan darah bagi pesakit hemofilia"}],"explanation":"Plasmid ialah vektor pengklonan klasik dalam bakteria; enzim pembatasan memotong manakala DNA ligase menyambung."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Kegagalan Tanpa Enzim DNA Ligase","voiceCaption":"Ramalkan kesan terhadap proses penghasilan plasmid rekombinan sekiranya enzim DNA ligase tertinggal semasa eksperimen.","voiceScript":"[curious] Jika gen insulin manusia dan plasmid bakteria telah dipotong oleh enzim pembatasan, tetapi tiada enzim D.N.A. ligase ditambah ke dalam tabung uji, apakah yang terjadi?","hook":"Semak peranan langkah kedua dalam Simulator DNA Rekombinan di atas!","scenario":"Tabung uji mengandungi gen insulin manusia yang telah dipotong dan plasmid bakteria terpotong tanpa penambahan enzim DNA ligase.","prompt":"Apakah kesan utama ketiadaan enzim DNA ligase dalam prosedur ini?","options":["Gen insulin manusia gagal bercantum secara kekal dengan plasmid bakteria lalu plasmid rekombinan tidak dapat terbentuk","Plasmid akan memotong semula gen insulin menjadi nukleotida bebas","Bakteria akan menghasilkan insulin dua kali lebih cepat tanpa plasmid","Protein beta-laktoglobulin terbentuk secara spontan dalam tabung uji"],"correctIndex":0,"proofLabId":"bio513_insulin_rekombinan_sim","proofState":{"step":"ligase"},"explanation":"Tanpa enzim DNA ligase, ikatan fosfodiester tidak terbentuk untuk menyambungkan gen insulin ke dalam vektor plasmid."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s5","voiceToneLabel":"Cabaran Unit 1: Vaksin & Hormon Rekombinan","voiceCaption":"Pilih senarai produk perubatan yang turut dihasilkan melalui kejuruteraan genetik selain insulin manusia.","voiceScript":"[excited] Uji senarai produk perubatan hasil teknologi D.N.A. rekombinan!","prompt":"Selain insulin manusia, manakah produk perubatan yang turut dihasilkan menggunakan teknologi DNA rekombinan?","options":["Vaksin hepatitis B, faktor pembekuan darah dan hormon pertumbuhan","Asid sulfurik pekat dan baja urea sintetik","Gel agarose dan filem sinar-X","Ekoenzim kulit oren dan bioplastik kulit pisang"],"correctIndex":0,"explanation":"Kejuruteraan genetik menghasilkan protein terapeutik manusia seperti insulin, hormon pertumbuhan, faktor pembekuan darah dan vaksin hepatitis B."}]},{"id":"bio513-u2","title":"Unit 2: Makanan Ubah Suai Genetik (GMF) & Penilaian Etika","subtitle":"Subtopik 13.1 — Jagung/Kapas/Terung Bt, 'Super Salmon' Chinook-Atlantik FDA, Kentang Tahan Fros Arabidopsis serta Jadual 13.1","iconType":"leaf","iconUrl":"../assets/icons/bio513-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Makanan Ubah Suai Genetik (GMF) & Jadual 13.1","voiceCaption":"Makanan terubah suai genetik seperti jagung Bt dan Super salmon meningkatkan hasil serta rintangan perosak atau fros, namun turut membawa kebimbangan alahan dan ekologi.","voiceScript":"[warm] Selamat datang ke Unit dua! Mari kita terokai Makanan Terubah Suai Secara Genetik atau G.M.F. daripada kejuruteraan genetik! Contoh G.M.F. utama dalam buku teks ialah: pertama, Jagung B.t., Kapas B.t. dan Terung B.t. yang menerima gen daripada bakteria Bacillus thuringiensis untuk menghasilkan toksin membunuh serangga perosak secara semula jadi tanpa semburan racun kimia tinggi! Kedua, Super Salmon yang menggabungkan gen hormon pertumbuhan salmon Chinook ke dalam salmon Atlantik dan diluluskan F.D.A. agar membesar jauh lebih pantas! Ketiga, kentang tahan fros yang menerima gen daripada tumbuhan Arabidopsis untuk hidup dalam suhu sejuk melampau! Berdasarkan Jadual tiga belas perpuluhan satu, kebaikan G.M.F. merangkumi hasil tuaian meningkat, nilai nutrisi lebih tinggi, rintangan terhadap penyakit atau kemarau serta pengurangan racun perosak! Sebaliknya, keburukan G.M.F. melibatkan risiko pencetusan alahan baharu pada manusia, kemungkinan gen rintang berpindah kepada rumpai liar serta isu etika, budaya dan keagamaan!","title":"Makanan Ubah Suai Genetik (GMF): Contoh & Jadual 13.1","acronym":"Bt•SS•Ar","hook":"Klik tab GMO & GMF (Jadual 13.1) pada makmal di bawah untuk meneliti kebaikan dan keburukan GMF!","mediaKey":"bio513_jagung_gmf","summary":"GMF: Jagung/Kapas/Terung Bt (gen Bacillus thuringiensis rintang perosak), Super salmon (Chinook -> Atlantik, FDA), Kentang gen Arabidopsis tahan fros. Jadual 13.1: Kebaikan (hasil tinggi, nutrisi, kurang racun) vs Keburukan (alahan, ganggu spesies asli, isu etika/agama).","bullets":["Contoh Tanaman & Haiwan GMF: Jagung Bt, kapas Bt & terung Bt (gen bakteria Bacillus thuringiensis rintang serangga); 'Super salmon' (gen hormon pertumbuhan salmon Chinook ke salmon Atlantik, lulus FDA); Kentang dengan gen Arabidopsis sp. tahan suhu fros.","Kebaikan GMF (Jadual 13.1): Mengatasi kebuluran melalui hasil tinggi dan ketahanan kemarau/fros/serangga, meningkatkan nilai pemakanan makanan serta mengurangkan penggunaan racun perosak kimia.","Keburukan GMF (Jadual 13.1): Berpotensi mencetuskan alahan atau toksin baharu, mengurangkan kepelbagaian genetik spesies semula jadi, pemindahan gen kepada rumpai menjadi 'rumpai super' serta persoalan etika dan status halal/keagamaan."],"labId":"bio513_gmf_bioteknologi_lab","labTitle":"Makmal GMO, GMF & Impak (Jadual 13.1)","labProps":{"tab":"gmf"},"examTip":"Soalan esei menilai wajaran GMF: Sentiasa sertakan DUA sisi (kebaikan hasil & kurangkan racun + keburukan risiko alahan & kesan ekologi/etika) untuk markah penuh!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Kebaikan vs Keburukan GMF (Jadual 13.1)","voiceCaption":"Kelaskan enam fakta Makanan Terubah Suai Genetik berikut antara Kebaikan dengan Keburukan atau Risiko.","voiceScript":"[confident] Kelaskan keenam-enam hujah mengenai G.M.F. dalam Jadual tiga belas perpuluhan satu ini!","prompt":"Isihkan pernyataan GMF berikut antara Kebaikan dengan Keburukan:","buckets":[{"id":"baik","label":"Kebaikan GMF"},{"id":"buruk","label":"Keburukan & Risiko GMF"}],"items":[{"text":"Jagung Bt mengurangkan kebergantungan petani kepada semburan racun serangga kimia","bucketId":"baik","note":"Tepat! Melindungi kesihatan petani dan mengurangkan pencemaran air."},{"text":"Super salmon membesar lebih cepat bagi menampung bekalan protein dunia","bucketId":"baik","note":"Betul! Meningkatkan produktiviti dan sekuriti makanan."},{"text":"Protein baharu daripada gen sisipan berisiko mencetuskan tindak balas alahan pengguna","bucketId":"buruk","note":"Tepat! Risiko kesihatan yang perlu disaring ketat."},{"text":"Debunga tanaman GMF mungkin memindahkan gen rintang herbisid kepada rumpai liar","bucketId":"buruk","note":"Betul! Berpotensi menjejaskan keseimbangan spesies semula jadi."},{"text":"Kentang transgenik Arabidopsis mampu bertahan pada musim sejuk dan fros","bucketId":"baik","note":"Tepat! Mengelakkan kerugian hasil akibat cuaca ekstrem."},{"text":"Kebimbangan etika dan hukum agama apabila gen haiwan dimasukkan ke tanaman","bucketId":"buruk","note":"Betul! Perlu pelabelan jelas dan pematuhan undang-undang."}],"explanation":"Pengurusan GMF memerlukan keseimbangan antara produktiviti sekuriti makanan dengan keselamatan biologi serta pelabelan telus."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Spesies GMF & Sumber Gen","voiceCaption":"Padankan lima contoh GMO dan GMF berikut dengan gen atau sifat baharu yang diperolehnya.","voiceScript":"[confident] Padankan setiap contoh G.M.F. berikut dengan gen penderma dan cirinya!","prompt":"Padankan contoh GMF berikut dengan sifat atau gen penderma:","pairs":[{"id":"b513u2m1","left":"Jagung Bt, Kapas Bt & Terung Bt","right":"Gen Bacillus thuringiensis memberikan rintangan terhadap serangga perosak"},{"id":"b513u2m2","left":"'Super salmon' (lulus FDA)","right":"Gen hormon pertumbuhan salmon Chinook dimasukkan ke salmon Atlantik"},{"id":"b513u2m3","left":"Kentang tahan fros","right":"Menerima gen daripada tumbuhan Arabidopsis sp. untuk tahan suhu beku"},{"id":"b513u2m4","left":"Susu lembu bebas beta-laktoglobulin","right":"Mengurangkan risiko alahan susu lembu kepada pengguna sensitif"},{"id":"b513u2m5","left":"Racun kimia vs Tanaman Bt","right":"Mencemarkan air sungai vs hanya membunuh ulat perosak yang memakan tanaman"}],"explanation":"Pemindahan gen merentas spesies membolehkan ciri berguna seperti ketahanan fros atau rintangan perosak diperolehi tanpa pembiakan silang tradisional."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Kesan Penanaman Jagung Bt","voiceCaption":"Ramalkan impak ekologi dan hasil pertanian apabila ladang beralih daripada jagung biasa kepada jagung Bt.","voiceScript":"[curious] Sebuah ladang mengalami serangan ulat pengorek batang yang teruk. Selepas petani menanam jagung B.t., ramalkan dua perubahan ketara pada ladang tersebut!","hook":"Fikirkan mekanisme toksin Bacillus thuringiensis terhadap serangga perosak sahaja!","scenario":"Petani menanam jagung Bt menggantikan jagung konvensional yang sebelum ini disembur racun serangga kimia setiap minggu.","prompt":"Apakah kesan jangka panjang yang dijangkakan di ladang tersebut?","options":["Hasil jagung meningkat kerana kerosakan ulat berkurang, dan jumlah semburan racun kimia yang mencemari air serta serangga pendebunga dapat dikurangkan","Jagung Bt tumbuh tanpa memerlukan cahaya matahari atau air","Semua ulat bertukar menjadi bakteria Bacillus thuringiensis dalam tanah","Kandungan nitrogen di atmosfera meningkat daripada 78% kepada 99%"],"correctIndex":0,"proofLabId":"bio513_gmf_bioteknologi_lab","proofState":{"tab":"gmf"},"explanation":"Gen Bt menghasilkan protein khusus terhadap larva pengorek batang, meningkatkan hasil tuaian sambil mengurangkan pencemaran racun kimia."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s5","voiceToneLabel":"Cabaran Unit 2: 'Super Salmon'","voiceCaption":"Kenal pasti fakta tepat mengenai ikan transgenik 'Super salmon' yang diluluskan FDA.","voiceScript":"[excited] Uji ketepatan fakta contoh G.M.F. haiwan dalam buku teks!","prompt":"Bagaimana ikan 'Super salmon' dihasilkan dan mengapa ia diluluskan oleh FDA?","options":["Gen hormon pertumbuhan daripada salmon Chinook dimasukkan ke dalam salmon Atlantik supaya membesar lebih pantas sepanjang tahun","Gen serangga Bt dimasukkan ke dalam ikan salmon supaya hidup di gurun pasir","Ikan salmon dikacukkan dengan bakteria E. coli untuk menghasilkan susu","Kromosom salmon dibuang kesemuanya agar ikan tidak mempunyai DNA"],"correctIndex":0,"explanation":"Super salmon ialah salmon Atlantik transgenik yang menerima gen hormon pertumbuhan salmon Chinook (serta promoter tahan sejuk) membolehkan pertumbuhan pesat sepanjang tahun."}]},{"id":"bio513-u3","title":"Unit 3: Bioteknologi 10 Warna, Terapi Gen & Pemprofilan DNA","subtitle":"Subtopik 13.2 — Bioteknologi Hijau/Putih/Kuning/Biru, Terapi Gen (CRISPR), Sir Alec Jeffreys (1985) & 6 Langkah Rajah 13.6","iconType":"scale","iconUrl":"../assets/icons/bio513-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Bioteknologi Warna, Terapi Gen & Pemprofilan DNA","voiceCaption":"Bioteknologi dibahagikan kepada sepuluh warna dengan empat warna utama, manakala terapi gen dan pemprofilan DNA Sir Alec Jeffreys merevolusikan perubatan serta forensik.","voiceScript":"[warm] Selamat datang ke Unit tiga, subtopik tiga belas perpuluhan dua: Bioteknologi! Bioteknologi bermaksud bidang yang menggunakan organisma hidup atau komponennya untuk menghasilkan produk dan perkhidmatan bermanfaat! Terdapat sepuluh bidang bioteknologi mengikut kod warna, dengan empat warna utama: Hijau untuk pertanian dan alam sekitar, Putih untuk proses industri, Kuning untuk pemprosesan makanan dan pemakanan, serta Biru untuk sumber marin dan akuatik! Dalam bidang perubatan moden, Terapi Gen menyisip gen normal yang sihat ke dalam sel pesakit bagi menggantikan gen rosak atau bermutasi — antaranya merawat sistik fibrosis, distrofi otot serta kanser menggunakan teknologi suntingan gen seperti C.R.I.S.P.R.! Seterusnya dalam sains forensik, teknik Pemprofilan D.N.A. dicipta oleh Sir Alec Jeffreys pada tahun seribu sembilan ratus lapan puluh lima yang memenangi Pingat Copley! Ikuti enam langkah Rajah tiga belas perpuluhan enam: satu, ekstrak D.N.A. daripada sampel darah atau akar rambut; dua, potong kepada fragmen menggunakan enzim pembatasan; tiga, pisahkan fragmen mengikut saiz melalui elektroforesis gel; empat, pindahkan ke membran nilon; lima, tambah prob radioaktif; dan enam, kesan jalur D.N.A. pada filem sinar X! Teknik ini penting untuk menyelesaikan kes jenayah, mengesahkan paterniti, menyemak keserasian pendermaan organ, mengesan penyakit genetik serta membanteras penyeludupan gading gajah! Ingat satu fakta penting: kembar seiras TIDAK boleh dibezakan melalui pemprofilan D.N.A.!","title":"13.2 Bioteknologi (4 Warna Utama), Terapi Gen & Pemprofilan DNA","acronym":"H•P•K•B","hook":"Klik Suspek A, B dan C dalam Simulator Elektroforesis Gel Pemprofilan DNA di bawah untuk mencari padanan bukti jenayah!","mediaKey":"bio513_elektroforesis_dna","summary":"Bioteknologi 4 warna utama: Hijau (pertanian), Putih (industri), Kuning (makanan), Biru (marin). Terapi gen (CRISPR): sistik fibrosis, distrofi otot, kanser. Pemprofilan DNA (Sir Alec Jeffreys 1985): 6 langkah Rajah 13.6; tak bezakan kembar seiras.","bullets":["4 Warna Utama Bioteknologi (daripada 10 warna): Hijau (pertanian & alam sekitar), Putih (proses industri), Kuning (makanan & pemakanan), Biru (bioteknologi marin).","Terapi Gen & CRISPR: Memasukkan gen normal ke dalam sel pesakit bagi menggantikan gen bermutasi — merawat penyakit genetik seperti sistik fibrosis, distrofi otot dan sesetengah kanser.","Pemprofilan DNA (Sir Alec Jeffreys, 1985 — Pingat Copley): Rajah 13.6: (1) Ekstrak DNA -> (2) Enzim pembatasan -> (3) Elektroforesis gel -> (4) Pindah ke membran nilon -> (5) Prob radioaktif -> (6) Filem sinar-X. Kegunaan: jenayah, paterniti, keserasian organ, penyakit genetik, banteras penyeludupan gading gajah. Kembar seiras tidak dapat dibezakan!"],"labId":"bio513_pemprofilan_dna_sim","labTitle":"Simulator Elektroforesis Gel Pemprofilan DNA (Rajah 13.6)","labProps":{"selected":"B"},"examTip":"Kegunaan Pemprofilan DNA dalam Kertas 2 bukan sekadar tangkap penjenayah! Sertakan juga: ujian paterniti ibu bapa-anak, keserasian tisu/organ derma serta mengesan asal gading gajah seludup."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun 6 Langkah Pemprofilan DNA (Rajah 13.6)","voiceCaption":"Susun urutan enam langkah teknik pemprofilan DNA ciptaan Sir Alec Jeffreys dari pengekstrakan hingga filem sinar-X.","voiceScript":"[confident] Susun enam langkah prosedur pemprofilan D.N.A. mengikut urutan tepat Rajah tiga belas perpuluhan enam!","prompt":"Susun langkah teknik pemprofilan DNA berikut mengikut urutan yang betul:","hint":"Ekstrak DNA daripada sampel -> enzim pembatasan -> elektroforesis gel...","answerTokens":["Ekstrak DNA daripada sampel lalu potong kepada fragmen dengan enzim pembatasan,","asingkan fragmen melalui elektroforesis gel dan pindahkan ke membran nilon,","kemudian tambah prob radioaktif untuk mengesan jalur DNA pada filem sinar-X."],"distractors":["sambungkan fragmen ke plasmid menggunakan DNA ligase untuk membuat insulin","tambahkan larutan metilena biru untuk mengukur kadar BOD"],"explanation":"6 langkah teratur: Ekstraksi -> Enzim pembatasan -> Elektroforesis gel -> Membran nilon -> Prob radioaktif -> Filem sinar-X."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Ujian Paterniti Jalur DNA Anak","voiceCaption":"Ramalkan bagaimana seorang anak sepatutnya berkongsi jalur profil DNA dengan ibu dan bapa kandungnya.","voiceScript":"[curious] Dalam ujian paterniti melalui pemprofilan D.N.A., jalur D.N.A. seorang anak dibandingkan dengan ibunya serta dua calon bapa. Bagaimanakah kita mengenal pasti bapa kandung yang sebenar?","hook":"Ingat setiap anak menerima separuh kromosom daripada ibu dan separuh daripada bapa!","scenario":"Setiap jalur DNA pada gel elektroforesis anak berasal sama ada daripada ibu atau daripada bapa kandungnya.","prompt":"Bagaimanakah jalur DNA pada profil anak mengesahkan identiti bapa kandungnya?","options":["Setiap jalur DNA anak yang tidak hadir pada jalur ibu MESTI sepadan tepat dengan jalur bapa kandungnya","Semua jalur DNA anak mesti 100% berbeza daripada kedua-dua ibu dan bapanya","Bapa kandung hanya perlu mempunyai satu jalur yang sama walaupun lima jalur anak yang lain tiada pada ibu atau bapa itu","Anak lelaki mewarisi 100% jalur DNA bapa tanpa sebarang jalur ibu"],"correctIndex":0,"proofLabId":"bio513_pemprofilan_dna_sim","proofState":{"selected":"B"},"explanation":"Separuh DNA anak diwarisi daripada ovum ibu dan separuh lagi daripada sperma bapa; maka jalur yang tiada pada ibu wajib hadir pada bapa kandung."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan 4 Warna Bioteknologi & Terapi Gen","voiceCaption":"Padankan lima konsep bioteknologi termasuk empat kod warna utama dan terapi gen dengan fokus bidangnya.","voiceScript":"[confident] Padankan empat warna utama bioteknologi dan terapi gen berikut dengan bidang aplikasinya!","prompt":"Padankan istilah bioteknologi berikut dengan bidangnya:","pairs":[{"id":"b513u3m1","left":"Bioteknologi Hijau","right":"Pertanian dan alam sekitar seperti tanaman rintang perosak Bt"},{"id":"b513u3m2","left":"Bioteknologi Putih","right":"Proses industri seperti penghasilan enzim dan bioplastik"},{"id":"b513u3m3","left":"Bioteknologi Kuning","right":"Pemprosesan makanan dan peningkatan mutu pemakanan"},{"id":"b513u3m4","left":"Bioteknologi Biru","right":"Aplikasi dan pemuliharaan sumber organisma marin serta akuatik"},{"id":"b513u3m5","left":"Terapi Gen (teknologi CRISPR)","right":"Menggantikan gen rosak dengan gen normal bagi sistik fibrosis, distrofi otot & kanser"}],"explanation":"Sistem kod warna bioteknologi mengkategorikan 10 cabang aplikasi daripada kesihatan (merah), pertanian (hijau), industri (putih), makanan (kuning) hingga marin (biru)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s5","voiceToneLabel":"Cabaran Unit 3: Sir Alec Jeffreys & Penyeludupan","voiceCaption":"Pilih pernyataan yang tepat mengenai aplikasi unik pemprofilan DNA dalam pemuliharaan hidupan liar.","voiceScript":"[excited] Uji pengetahuan aplikasi bukan jenayah bagi pemprofilan D.N.A.!","prompt":"Selain penyiasatan kes jenayah dan paterniti, bagaimanakah pemprofilan DNA membantu usaha pemuliharaan hidupan liar global?","options":["Mengenal pasti asal geografi gading gajah rampasan bagi membanteras sindiket penyeludupan haram hidupan liar","Menghidupkan semula dinosaur daripada darah nyamuk fosil tanpa genom lengkap","Mengukur kelajuan aliran air sungai di kawasan pembalakan","Membezakan dua orang kembar seiras melalui cap jari mereka"],"correctIndex":0,"explanation":"Pemprofilan DNA membandingkan sampel gading rampasan dengan pangkalan data populasi gajah Afrika untuk mengesan lokasi pemburuan haram."}]},{"id":"bio513-u4","title":"Unit 4: Bioremediasi, Pengklonan Dolly & Sumbangan Bioteknologi","subtitle":"Subtopik 13.2 — Jadual 13.3 Sumbangan Pertanian, Perubatan, Forensik & Alam Sekitar, Bakteria Alcanivorax borkumensis & Klon Dolly","iconType":"atom","iconUrl":"../assets/icons/bio513-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Bioremediasi, Klon Dolly & Jadual 13.3","voiceCaption":"Bioteknologi menyumbang kepada pertanian, perubatan, forensik dan alam sekitar termasuk bioremediasi tumpahan minyak oleh bakteria Alcanivorax borkumensis serta pengklonan biri-biri Dolly.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari lengkapkan subtopik tiga belas perpuluhan dua dengan meneliti Jadual tiga belas perpuluhan tiga iaitu Kepentingan dan Sumbangan Bioteknologi dalam kehidupan harian! Dalam bidang alam sekitar, masalah pencemaran minyak mentah di lautan dapat dibersihkan secara mesra alam melalui BIOREMEDIASI — teknik menggunakan mikroorganisma hidup seperti bakteria marin Alcanivorax borkumensis yang berkeupayaan semula jadi menguraikan hidrokarbon tumpahan minyak kepada karbon dioksida dan air yang tidak berbahaya! Dalam bidang pertanian pula, tanaman Bt seperti kapas B.t., jagung B.t. dan terung B.t. meningkatkan hasil dan mengurangkan penggunaan racun serangga! Manakala dalam bidang sains haiwan, pengklonan nukleus sel soma berjaya melahirkan mamalia klon pertama iaitu biri-biri Dolly yang membuktikan keupayaan sel soma dewasa diprogramkan semula menjadi organisma lengkap! Akhir sekali, pastikan kamu dapat menilai kebaikan bioteknologi daripada segi rawatan perubatan dan kelestarian berbanding kebimbangan etika, keselamatan makanan serta hak cipta genetik!","title":"Bioremediasi Alcanivorax borkumensis, Klon Dolly & Jadual 13.3","acronym":"P•P•F•A","hook":"Buka tab Bioteknologi & Terapi Gen pada makmal di bawah serta terokai galeri arkib teknologi genetik!","mediaKey":"bio513_dolly_klon","summary":"Bioremediasi tumpahan minyak menggunakan bakteria Alcanivorax borkumensis. Jadual 13.3 Sumbangan: Pertanian (kapas/jagung/terung Bt), Perubatan (insulin, terapi gen), Forensik (pemprofilan DNA), Alam Sekitar (bioremediasi), dan pengklonan biri-biri Dolly.","bullets":["Bioremediasi Alam Sekitar: Kaedah membersihkan pencemar seperti tumpahan minyak mentah menggunakan bakteria semula jadi atau terubah suai seperti Alcanivorax borkumensis yang memecahkan hidrokarbon kepada bahan tidak toksik.","Jadual 13.3 Empat Bidang Sumbangan: (1) Pertanian — kapas Bt, jagung Bt, terung Bt kurangkan racun; (2) Perubatan — insulin, vaksin hepatitis B, terapi gen; (3) Forensik — pemprofilan DNA jenayah & paterniti; (4) Alam Sekitar — bioremediasi & bahan api bio.","Pengklonan Biri-biri Dolly: Mamalia klon pertama yang terhasil melalui pemindahan nukleus sel kelenjar susu (sel soma) ke dalam ovum tanpa nukleus, menghasilkan anak seiras genetik dengan penderma nukleus."],"labId":"bio513_gmf_bioteknologi_lab","labTitle":"Makmal Sumbangan Bioteknologi (Jadual 13.3)","labProps":{"tab":"warna"},"examTip":"Ejaan spesies bakteria bioremediasi dalam Kertas 2: Alcanivorax borkumensis — sentiasa gariskan nama binomial jika menulis tangan!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Sumbangan 4 Bidang Bioteknologi (Jadual 13.3)","voiceCaption":"Kelaskan enam aplikasi bioteknologi berikut antara Pertanian & Alam Sekitar dengan Perubatan & Forensik.","voiceScript":"[confident] Kelaskan keenam-enam sumbangan bioteknologi dalam Jadual tiga belas perpuluhan tiga mengikut bidangnya!","prompt":"Isihkan sumbangan bioteknologi berikut ke dalam bidang yang tepat:","buckets":[{"id":"tani","label":"Pertanian & Alam Sekitar"},{"id":"ubat","label":"Perubatan & Forensik"}],"items":[{"text":"Bakteria Alcanivorax borkumensis merawat tumpahan minyak mentah secara bioremediasi","bucketId":"tani","note":"Tepat! Pemulihan alam sekitar laut yang mesra ekosistem."},{"text":"Penanaman terung Bt, kapas Bt dan jagung Bt rintang serangga perosak","bucketId":"tani","note":"Betul! Mengurangkan kebergantungan kepada pestisid kimia."},{"text":"Penghasilan insulin manusia rekombinan dan vaksin hepatitis B oleh bakteria","bucketId":"ubat","note":"Tepat! Rawatan penyakit kronik dan pencegahan jangkitan."},{"text":"Terapi gen menggunakan CRISPR untuk merawat sistik fibrosis dan distrofi otot","bucketId":"ubat","note":"Betul! Memperbaiki gen rosak secara langsung."},{"text":"Elektroforesis gel & prob radioaktif dalam pemprofilan DNA bagi kes paterniti","bucketId":"ubat","note":"Tepat! Aplikasi bioteknologi forensik."},{"text":"Penghasilan kentang tahan suhu beku menggunakan gen Arabidopsis sp.","bucketId":"tani","note":"Betul! Menjamin bekalan makanan pertanian di iklim sejuk."}],"explanation":"Bioteknologi moden merentasi sektor makanan, pemulihan minyak, farmaseutikal serta sains penyiasatan."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Hasil Pengklonan Biri-biri Dolly","voiceCaption":"Ramalkan individu manakah yang berkongsi ciri genetik seiras dengan anak biri-biri klon apabila nukleus sel soma biri-biri X dimasukkan ke ovum tanpa nukleus biri-biri Y dan dikandung biri-biri Z.","voiceScript":"[curious] Soalan klasik pengklonan Dolly! Nukleus sel kelenjar susu biri-biri X dimasukkan ke dalam ovum biri-biri Y yang dibuang nukleusnya, lalu embrio ditanam dalam rahim ibu tumpang biri-biri Z. Anak klon menyerupai biri-biri yang mana?","hook":"Kenal pasti biri-biri mana yang membekalkan maklumat DNA nukleus!","scenario":"Penderma nukleus sel soma = Biri-biri X (muka putih); Penderma ovum tanpa nukleus = Biri-biri Y (muka hitam); Ibu tumpang rahim = Biri-biri Z.","prompt":"Apakah ciri genetik anak biri-biri klon yang dilahirkan?","options":["100% seiras secara genetik dengan Biri-biri X (muka putih) kerana seluruh DNA nukleus berasal daripada sel soma Biri-biri X","50% menyerupai X dan 50% menyerupai Y","100% seiras dengan ibu tumpang Biri-biri Z kerana dikandung selama 5 bulan","100% seiras dengan Biri-biri Y kerana menerima sitoplasma ovum"],"correctIndex":0,"proofLabId":"bio513_gmf_bioteknologi_lab","proofState":{"tab":"warna"},"explanation":"Nukleus mengandungi genom utama yang menentukan ciri pewarisan; Biri-biri Y hanya membekalkan sitoplasma kosong dan Biri-biri Z hanya menyediakan rahim."},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Konsep Penutup Bioteknologi","voiceCaption":"Padankan lima konsep bioteknologi penting berikut dengan penerangan tepat.","voiceScript":"[confident] Padankan kesemua istilah bioteknologi moden dalam Unit empat ini!","prompt":"Padankan konsep berikut dengan penerangannya:","pairs":[{"id":"b513u4m1","left":"Alcanivorax borkumensis","right":"Bakteria marin dalam bioremediasi menguraikan tumpahan minyak mentah"},{"id":"b513u4m2","left":"Biri-biri Dolly","right":"Mamalia klon pertama daripada pemindahan nukleus sel soma dewasa"},{"id":"b513u4m3","left":"CRISPR dalam terapi gen","right":"Menyunting atau menggantikan gen rosak dengan gen berfungsi normal"},{"id":"b513u4m4","left":"Sir Alec Jeffreys (1985)","right":"Pencipta teknik pemprofilan DNA dan penerima Pingat Copley"},{"id":"b513u4m5","left":"Kapas Bt & Terung Bt","right":"Tanaman pertanian transgenik mengurangkan kerosakan perosak"}],"explanation":"Kesemua aplikasi ini memacu kemajuan perubatan, pertanian mampan serta pemulihan alam sekitar."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s5","voiceToneLabel":"Cabaran Unit 4: Bioremediasi vs Bahan Kimia","voiceCaption":"Pilih kelebihan utama teknik bioremediasi berbanding penggunaan bahan pelarut kimia untuk tumpahan minyak.","voiceScript":"[excited] Uji pemahaman kelebihan bioteknologi alam sekitar sebelum memasuki Unit Boss penutup!","prompt":"Mengapakah penggunaan bakteria Alcanivorax borkumensis (bioremediasi) lebih digalakkan berbanding detergen kimia kuat untuk membersihkan tumpahan minyak di laut?","options":         skipBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
