/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  border-radius: 20px;
  padding: 22px;

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}

<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"fizik-t4-bab01","subject":"Fizik","form":4,"chapterNumber":1,"title":"Pengukuran","subtitle":"Metrik vs Imperial, 7 Kuantiti Asas & 10 Terbitan S.I., Skalar & Vektor, 6 Bentuk Graf, Luas Bawah Graf serta Eksperimen 1.1 Bandul Ringkas — Lengkap Foto Arkib & Audio ElevenLabs v4","estimatedMinutes":22,"themeAccent":"#2563eb","isFreePreview":false,"enableMultimediaEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep pengukuran dan graf Fizik awak memang padu!","combo":"[laughs warmly] Kombo yang mantap! [excited] Pemikiran saintifik juara S P M memang jelas kelihatan!","encourage":"[softly] Hampir kena... jangan mengalah! [warm] Semak unit S I atau bentuk graf pada nota di bawah supaya tak terkeliru lagi.","celebrate":"[excited] Tahniah! Satu lagi unit Fizik Bab Satu berjaya dikuasai sepenuhnya!"},"units":[{"id":"fiz-u1","title":"Metrik vs Imperial, Metrologi & 7 Asas S.I.","subtitle":"Subtopik 1.1 — Sistem S.I., Peranan SIRIM & Imbuhan Piawai","iconType":"atom","boss":false,"steps":[{"type":"concept","title":"Kepentingan Pengukuran, Unit Metrik vs Imperial & 7 Kuantiti Asas S.I.","summary":"Setiap kuantiti fizik terdiri daripada magnitud (nilai berangka) dan unit. Malaysia menggunakan Sistem Unit Antarabangsa (S.I. — metrik) yang diselaraskan oleh Institut Metrologi Kebangsaan Malaysia (SIRIM), walaupun beberapa unit Imperial seperti p.s.i., kaki dan inci masih kelihatan dalam kehidupan harian.","labId":"fiz_vector_prefix_lab","labTitle":"Jadual 1.1 (7 Kuantiti Asas S.I.), Jadual Imbuhan & Galeri Metrologi","labCaption":"Klik mana-mana baris dalam Jadual 1.1 atau tukar ke Jadual Imbuhan S.I. serta foto arkib SIRIM/Kilogram (+5 XP Eksplorasi).","bullets":["Sistem Metrik (S.I.) berasaskan gandaan 10 (kPa, m, kg, s) memudahkan pertukaran antarabangsa berbanding sistem Imperial (psi, kaki, inci, batu, paun).","Metrologi ialah kajian pengukuran jitu; SIRIM menentukur alat ukur piawai negara supaya ukuran kilang, hospital dan makmal kekal tepat.","7 Kuantiti Asas S.I. (Jadual 1.1): Panjang l (m), Jisim m (kg), Masa t (s), Suhu termodinamik T (K), Arus elektrik I (A), Keamatan berluminositi Iv (cd) dan Kuantiti bahan n (mol).","Imbuhan S.I. (G, M, k, h, da, d, c, m, μ, n, p) menukar nilai terlalu besar atau terlalu kecil kepada bentuk piawai A × 10ⁿ."],"examTip":"Perangkap lazim SPM: Unit S.I. rasmi bagi Jisim ialah kilogram (kg — BUKAN gram!), dan unit S.I. bagi Suhu ialah Kelvin (K — BUKAN darjah Celsius).","xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Teroka Metrologi & Piawaian SI","voiceCaption":"Selamat datang ke Fizik Tingkatan 4 Bab 1! Tahukah anda mengapa tolok tayar menunjukkan psi dan kPa serentak? Teroka sistem Metrik vs Imperial, 7 kuantiti asas S.I., imbuhan serta foto arkib prototaip kilogram di bawah.","voiceScript":"[warm] Selamat datang ke Fizik Tingkatan Empat Bab Satu! [excited] Tahukah awak mengapa tayar kereta memaparkan unit p s i dan kilopascal serentak? Mari teroka perbezaan sistem Metrik dengan Imperial, tujuh kuantiti asas S I, imbuhan serta foto arkib prototaip kilogram di bawah!","mediaKeys":["kilogram_si","vernier_caliper"],"hook":"Satu kesilapan penukaran unit metrik-imperial pada tahun 1999 menyebabkan kapal angkasa NASA bernilai USD 125 juta terhempas di Marikh!"},{"type":"sort","prompt":"Isihkan kuantiti fizik berikut kepada Kuantiti Asas S.I. atau Kuantiti Terbitan:","buckets":[{"id":"asas","label":"Kuantiti Asas"},{"id":"terbitan","label":"Kuantiti Terbitan"}],"items":[{"text":"Suhu Termodinamik (Kelvin, K)","bucketId":"asas","note":"Tepat! Suhu dalam Kelvin ialah satu daripada 7 kuantiti asas S.I."},{"text":"Halaju (m s⁻¹)","bucketId":"terbitan","note":"Betul! Halaju diterbitkan daripada sesaran ÷ masa."},{"text":"Arus Elektrik (Ampere, A)","bucketId":"asas","note":"Tepat! Arus elektrik ialah kuantiti asas S.I."},{"text":"Keamatan Berluminositi (Candela, cd)","bucketId":"asas","note":"Tepat! Candela ialah satu daripada 7 kuantiti asas Jadual 1.1."},{"text":"Ketumpatan (kg m⁻³)","bucketId":"terbitan","note":"Betul! Ketumpatan ialah hasil bahagi jisim dengan isi padu."},{"text":"Daya (N = kg m s⁻²)","bucketId":"terbitan","note":"Tepat! Daya (F = ma) menggabungkan jisim, panjang dan masa."}],"explanation":"Hafal semua 7 kuantiti asas S.I. (m, kg, s, K, A, cd, mol) — selain daripada 7 kuantiti ini ialah kuantiti terbitan.","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Asingkan Kuantiti Asas vs Terbitan","voiceCaption":"Sekarang cuba bezakan antara kuantiti asas yang berdiri sendiri dengan kuantiti terbitan hasil gabungan darab atau bahagi!","voiceScript":"[curious] Sekarang cuba bezakan antara kuantiti asas yang berdiri sendiri dengan kuantiti terbitan hasil gabungan darab atau bahagi!"},{"type":"match","prompt":"Padankan imbuhan atau kuantiti asas S.I. dengan faktor dan unit rasminya:","pairs":[{"id":"u1","left":"Mikro (μ)","right":"10⁻⁶"},{"id":"u2","left":"Nano (n)","right":"10⁻⁹"},{"id":"u3","left":"Unit S.I. bagi Jisim","right":"Kilogram (kg)"},{"id":"u4","left":"Unit S.I. bagi Kuantiti Bahan","right":"Mol (mol)"},{"id":"u5","left":"Unit S.I. bagi Suhu","right":"Kelvin (K)"}],"explanation":"Penukaran imbuhan (contohnya μ = 10⁻⁶, n = 10⁻⁹) dan penggunaan kg serta K sangat kritikal sebelum memulakan pengiraan Fizik.","xp":15,"voiceIdKey":"u1-s3","voiceToneLabel":"Padanan Imbuhan & Unit SI","voiceCaption":"Ingat semula jadual imbuhan S I! Padankan simbol mikro, nano dan unit rasmi jisim serta suhu dengan tepat.","voiceScript":"[warm] Ingat semula jadual imbuhan S I! Padankan simbol mikro, nano dan unit rasmi jisim serta suhu dengan tepat."},{"type":"mcq","prompt":"Seorang mekanik mengukur tekanan tayar sebagai 220 kPa (atau 32 p.s.i.). Mengapakah badan seperti SIRIM menggunakan unit Metrik (S.I.) berbanding unit Imperial untuk kalibrasi saintifik?","options":["Unit S.I. menggunakan nisbah asas 10 yang seragam di peringkat antarabangsa dan dikawal selia metrologinya oleh SIRIM","Unit Imperial hanya boleh digunakan untuk objek logam manakala unit Metrik hanya untuk cecair","Nilai berangka unit Imperial sentiasa lebih kecil daripada nilai sebenar jisim objek","SIRIM mewajibkan unit gram menggantikan kilogram sebagai unit asas jisim dunia"],"correctIndex":0,"explanation":"Sistem Metrik (S.I.) seragam dengan gandaan asas 10 di seluruh dunia dan dipantau di Malaysia oleh Institut Metrologi Kebangsaan (SIRIM). Ingat juga unit asas jisim S.I. ialah kilogram (kg), bukan gram.","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Semakan Konsep Metrologi","voiceCaption":"Soalan pantas! Apakah perbezaan antara ukuran tolok p s i dan kilopascal, serta badan yang menjaga piawaian metrologi Malaysia?","voiceScript":"[curious] Soalan pantas! Apakah perbezaan antara ukuran tolok p s i dan kilopascal, serta badan yang menjaga piawaian metrologi Malaysia?"},{"type":"wordbank","prompt":"Susun ayat yang mentakrifkan peranan metrologi dan kuantiti asas S.I.:","hint":"Mulakan dengan 'Setiap kuantiti fizik mempunyai magnitud'.","answerTokens":["Setiap kuantiti fizik","mempunyai magnitud dan unit,","manakala 7 kuantiti asas","tidak boleh diterbitkan."],"distractors":["hanya ada arah","sentiasa dalam gram"],"explanation":"Kuantiti fizik sentiasa diwakili oleh magnitud serta unit, dan hanya 7 kuantiti asas menjadi blok binaan kepada semua kuantiti terbitan.","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Susun Definisi Kuantiti Fizik","voiceCaption":"Lengkapkan pernyataan asas pengukuran fizik dengan menyusun kepingan perkataan ini!","voiceScript":"[confident] Lengkapkan pernyataan asas pengukuran fizik dengan menyusun kepingan perkataan ini!"}],"iconUrl":"../assets/icons/fiz-u1.jpg"},{"id":"fiz-u2","title":"10 Kuantiti Terbitan & Skalar vs Vektor","subtitle":"Subtopik 1.1 — Jadual 1.3 (N, Pa, J, C) & Sifat Arah (Jadual 1.4)","iconType":"compass","boss":false,"steps":[{"type":"concept","title":"10 Kuantiti Terbitan Jadual 1.3 & Pengelasan Skalar vs Vektor (Rajah 1.5)","summary":"Kuantiti terbitan dibentuk melalui hasil darab atau hasil bahagi kuantiti asas sehingga menghasilkan unit asas S.I. khusus (seperti N, Pa, J, C). Dari segi sifat arah pula, kuantiti Skalar hanya mempunyai magnitud manakala kuantiti Vektor mempunyai kedua-dua magnitud dan arah.","labId":"fiz_terbitan_vektor_lab","labTitle":"Jadual 1.3 (10 Kuantiti Terbitan), Jadual 1.4 & Rajah 1.5 Skalar vs Vektor","labCaption":"Klik mana-mana baris Jadual 1.3 untuk melihat langkah pembatalan unit asas, atau tukar ke Jadual 1.4 & simulasi Rajah 1.5 (+5 XP Eksplorasi).","bullets":["Jadual 1.3 Asas Geometri & Kinematik: Luas (m²), Isi padu (m³), Ketumpatan ρ = m/V (kg m⁻³), Halaju v = s/t (m s⁻¹), Pecutan a = (v-u)/t (m s⁻²).","Jadual 1.3 Mekanik & Elektrik: Daya F = ma (kg m s⁻² = N), Momentum p = mv (kg m s⁻¹), Tekanan P = F/A (kg m⁻¹ s⁻² = Pa), Tenaga/Kerja W = Fs (kg m² s⁻² = J), Cas Q = It (A s = C).","Rajah 1.5 Buku Teks: Jarak 50 m hanyalah magnitud (Skalar), tetapi Sesaran '50 m ke arah pokok' menyatakan magnitud dan arah (Vektor).","Jadual 1.4: Skalar = jarak, masa, laju, jisim, ketumpatan, suhu, kerja, tenaga; Vektor = sesaran, halaju, pecutan, daya, berat, momentum."],"formula":"F = ma [kg m s⁻² = N]  |  P = F/A [kg m⁻¹ s⁻² = Pa]  |  W = Fs [kg m² s⁻² = J]  |  Q = It [A s = C]","examTip":"Beza emas Kertas 1: Jisim (kg) ialah kuantiti SKALAR kerana sama di Bumi dan Bulan, manakala Berat (W = mg, unit N) ialah daya tarikan graviti bertindak ke bawah maka ia ialah VEKTOR.","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Kupas Jadual 1.3 & Sifat Arah","voiceCaption":"Jadual 1.3 menunjukkan terbitan unit asas S.I. bagi daya (N), tekanan (Pa), tenaga/kerja (J) & cas (C), manakala Rajah 1.5 membezakan skalar (50 m) dengan vektor (50 m ke arah pokok).","voiceScript":"[warm] Sekarang kita selami Jadual satu perpuluhan tiga dan satu perpuluhan empat! [confident] Perhatikan bagaimana daya, tekanan, tenaga dan cas elektrik diterbitkan daripada gabungan tujuh unit asas, dan bezakan jarak lima puluh meter dengan sesaran lima puluh meter ke arah pokok!","mediaKey":"pressure_gauge","hook":"Laju dan halaju mungkin kedengaran serupa, tetapi halaju mempunyai ARAH — satu perubahan arah terus mengubah vektor!"},{"type":"sort","prompt":"Kelaskan kuantiti berikut mengikut kategori Skalar (Magnitud sahaja) atau Vektor (Magnitud + Arah):","buckets":[{"id":"skalar","label":"Kuantiti Skalar"},{"id":"vektor","label":"Kuantiti Vektor"}],"items":[{"text":"Sesaran (50 m ke arah pokok)","bucketId":"vektor","note":"Betul! Arah ke pokok menjadikan sesaran kuantiti vektor."},{"text":"Laju (12 m s⁻¹)","bucketId":"skalar","note":"Tepat! Laju hanya menyatakan kelajuan tanpa arah."},{"text":"Berat (600 N ke pusat Bumi)","bucketId":"vektor","note":"Tepat! Berat ialah daya graviti berarah ke bawah."},{"text":"Jisim (60 kg)","bucketId":"skalar","note":"Betul! Jisim tidak bergantung pada arah dan nilai kekal malar."},{"text":"Tenaga Kinetik (40 J)","bucketId":"skalar","note":"Tepat! Semua bentuk tenaga dan kerja ialah kuantiti skalar."},{"text":"Momentum (kg m s⁻¹)","bucketId":"vektor","note":"Betul! Momentum (p = mv) mewarisi sifat vektor daripada halaju."}],"explanation":"Petua cepat: Jarak, laju, jisim, suhu, masa, kerja dan tenaga ialah skalar; sesaran, halaju, pecutan, daya, berat dan momentum ialah vektor.","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Kelaskan Skalar vs Vektor","voiceCaption":"Mari uji kecekapan awak mengelaskan semua enam kuantiti daripada Jadual satu perpuluhan empat kepada Skalar atau Vektor!","voiceScript":"[curious] Mari uji kecekapan awak mengelaskan semua enam kuantiti daripada Jadual satu perpuluhan empat kepada Skalar atau Vektor!"},{"type":"match","prompt":"Padankan kuantiti terbitan dengan ungkapannya dalam unit asas S.I.:","pairs":[{"id":"d1","left":"Daya, F = m × a (Newton, N)","right":"kg m s⁻²"},{"id":"d2","left":"Tekanan, P = F / A (Pascal, Pa)","right":"kg m⁻¹ s⁻²"},{"id":"d3","left":"Tenaga / Kerja, W = F × s (Joule, J)","right":"kg m² s⁻²"},{"id":"d4","left":"Cas elektrik, Q = I × t (Coulomb, C)","right":"A s"},{"id":"d5","left":"Ketumpatan, ρ = m / V","right":"kg m⁻³"}],"explanation":"Semak terbitan secara algebra: P = F/A = (kg m s⁻²)/(m²) = kg m⁻¹ s⁻², manakala W = F × s = (kg m s⁻²)(m) = kg m² s⁻².","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padanan Unit Asas SI Terbitan","voiceCaption":"Padankan nama kuantiti terbitan Jadual satu perpuluhan tiga dengan gabungan unit asas S I masing-masing! Teliti kuasa positif dan negatifnya.","voiceScript":"[warm] Padankan nama kuantiti terbitan Jadual satu perpuluhan tiga dengan gabungan unit asas S I masing-masing! Teliti kuasa positif dan negatifnya."},{"type":"predict","prompt":"Ramal & Uji: Dalam hukum kegravitian Newton F = (G × M × m) / r², jadikan G sebagai perkara rumus. Apakah unit bagi G dalam unit asas S.I.?","scenario":"G = (F × r²) / (M × m). Gantikan unit Daya F = kg m s⁻², jejari r² = m², dan jisim M × m = kg².","options":["m³ kg⁻¹ s⁻²","kg m² s⁻²","kg m⁻³ s⁻¹","m² kg s⁻³"],"correctIndex":0,"proofLabId":"fiz_terbitan_vektor_lab","proofState":"kbat_g","explanation":"Tepat sekali! G = (kg m s⁻² × m²) / kg² = m³ kg⁻¹ s⁻². Lihat pecahan terbitan Jadual 1.3 (baris Kuasa / Graviti G) di atas!","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal & Uji Terbitan Asas","voiceCaption":"Cabaran K B A T Penilaian Prestasi! Jika pemalar kegravitian Newton ditulis sebagai F sama dengan G M m bahagi r kuasa dua, apakah unit asas S I bagi G? Uji ramalan awak menggunakan tab Terbitan Unit Asas!","voiceScript":"[curious] Cabaran K B A T Penilaian Prestasi! Jika pemalar kegravitian Newton ditulis sebagai F sama dengan G M m bahagi r kuasa dua, apakah unit asas S I bagi G? Uji ramalan awak menggunakan tab Terbitan Unit Asas!"}],"iconUrl":"../assets/icons/fiz-u2.jpg"},{"id":"fiz-u3","title":"6 Bentuk Graf Hubungan (Rajah 1.8)","subtitle":"Subtopik 1.2 — Berkadar Terus, Linear, Lengkung & Hiperbola 1/x","iconType":"graph","boss":false,"steps":[{"type":"concept","title":"Membezakan Semua 6 Bentuk Graf Pemboleh Ubah (Rajah 1.8)","summary":"Dalam Fizik SPM (Kertas 1, 2 & Amali Kertas 3), pernyataan hubungan antara y dengan x MESTI mengikut bentuk graf tepat daripada 6 pola standard Rajah 1.8.","labId":"fiz_graph_explorer","labTitle":"Penjelajah 6 Bentuk Graf Fizik KSSM (Rajah 1.8)","labCaption":"Pilih kesemua 6 bentuk graf di atas dan seret slider Titik Ujian x untuk melihat perbezaan linear, lengkung dan hiperbola 1/x (+5 XP).","bullets":["(1) Garis lurus melalui asalan (0,0) = 'y berkadar terus dengan x' (y ∝ x); pintasan c = 0.","(2) Garis lurus dengan pintasan c > 0 = 'y bertambah secara linear dengan x' (BUKAN berkadar terus!).","(3) Garis lurus bercerun negatif (c > 0) = 'y berkurang secara linear dengan x'.","(4 & 5) Lengkung menaik dari (0,0) atau lengkung menurun dari c > 0 = 'y bertambah / berkurang dengan x' (bukan linear!).","(6) Hiperbola y vs x tanpa menyentuh paksi = 'y berkadar songsang dengan x' (y ∝ 1/x); apabila diplot y melawan 1/x ia bertukar menjadi garis lurus melalui asalan."],"examTip":"Pantang larang pemeriksa SPM: Jika garis lurus TIDAK melalui asalan (ada pintasan c ≠ 0), tulisan 'berkadar terus' automatik 0 markah — wajib tulis 'bertambah/berkurang secara linear'.","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Jelajah 6 Bentuk Graf SPM","voiceCaption":"Rajah 1.8 KSSM mempunyai 6 bentuk graf wajib: garis melalui (0,0) (y ∝ x), linear +, linear -, lengkung +, lengkung -, dan hiperbola y vs x yang diluruskan melalui plot y vs 1/x.","voiceScript":"[warm] Dalam Subtopik satu perpuluhan dua, Rajah satu perpuluhan lapan menyenaraikan enam bentuk graf wajib S P M! [excited] Jangan sesekali tertukar antara graf berkadar terus yang melalui asalan dengan graf bertambah secara linear yang ada pintasan y!","mediaKey":"galileo_portrait","hook":"Enam bentuk graf Fizik Kertas 1 & 2 sering menjebak pelajar — perhatikan perbezaan halus antara 'y berkadar terus' dan 'linear tidak melalui asalan'!"},{"type":"match","prompt":"Padankan bentuk graf Rajah 1.8 dengan pernyataan hubungan rasmi SPM yang tepat:","pairs":[{"id":"g1","left":"Garis lurus melalui asalan (0,0)","right":"y berkadar terus dengan x (y ∝ x)"},{"id":"g2","left":"Garis lurus dengan pintasan c > 0","right":"y bertambah secara linear dengan x"},{"id":"g3","left":"Garis lurus kecerunan negatif","right":"y berkurang secara linear dengan x"},{"id":"g4","left":"Lengkung menaik melalui asalan (0,0)","right":"y bertambah dengan x (kecerunan bertambah)"},{"id":"g5","left":"Hiperbola y vs x (atau y vs 1/x lurus)","right":"y berkadar songsang dengan x"}],"explanation":"Bezakan dengan teliti antara 'berkadar terus' (lurus melalui asalan), 'secara linear' (lurus ada pintasan), 'bertambah dengan x' (lengkung) dan 'berkadar songsang' (hiperbola).","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padankan 6 Bentuk Graf Rajah 1.8","voiceCaption":"Sekarang padankan ciri visual graf dengan pernyataan rasmi buku teks supaya tak hilang markah mudah!","voiceScript":"[curious] Sekarang padankan ciri visual graf dengan pernyataan rasmi buku teks supaya tak hilang markah mudah!"},{"type":"predict","prompt":"Ramal & Uji: Satu graf y melawan x berbentuk garis lurus melalui asalan (0,0) serta melalui titik (2, 10). Berapakah nilai y apabila graf diekstrapolasi ke x = 5?","scenario":"Garis lurus melalui asalan mempunyai kecerunan malar m = y / x pada setiap titik sepanjang garis.","options":["y = 15","y = 20","y = 25","y = 50"],"correctIndex":2,"proofLabId":"fiz_graph_explorer","proofState":"extrapolate","explanation":"Tepat! Daripada titik (2, 10), kecerunan m = 10 / 2 = 5. Maka pada x = 5, y = 5 × 5 = 25 seperti titik hijau (5.0, 25.0) dalam simulator!","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal & Uji Ekstrapolasi Graf","voiceCaption":"Cuba ramal! Jika garis lurus melalui asalan melalui titik dua, sepuluh, berapakah nilai y apabila garis dipanjangkan atau diekstrapolasi ke x sama dengan lima?","voiceScript":"[curious] Cuba ramal! Jika garis lurus melalui asalan melalui titik dua, sepuluh, berapakah nilai y apabila garis dipanjangkan atau diekstrapolasi ke x sama dengan lima?"},{"type":"mcq","prompt":"Dalam satu penyiasatan gas, graf Isi Padu V melawan Suhu θ (°C) ialah garis lurus yang bertambah secara linear. Bagaimanakah nilai suhu ketika V = 0 cm³ (−273 °C) dapat ditentukan daripada graf tersebut?","options":["Dengan mengekstrapolasi (memanjangkan) garis lurus penyuaian terbaik ke belakang sehingga memotong paksi suhu pada V = 0","Dengan menghitung luas kawasan segi empat tepat di bawah titik data terakhir sahaja","Dengan menukar paksi mengufuk daripada θ kepada 1/θ supaya membentuk hiperbola","Dengan membahagikan nilai suhu maksimum terus dengan nombor 20"],"correctIndex":0,"explanation":"Ekstrapolasi bermaksud memanjangkan garis lurus penyuaian terbaik di luar julat data yang diukur untuk membaca pintasan paksi (contohnya menentukan suhu sifar mutlak −273 °C ketika V = 0).","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Uji Graf Songsang & Ekstrapolasi Suhu","voiceCaption":"Soalan K B A T Latihan Formatif! Bagaimana saintis menggunakan ekstrapolasi graf isi padu gas melawan suhu untuk meramal suhu sifar mutlak apabila isi padu gas menghampiri sifar?","voiceScript":"[confident] Soalan K B A T Latihan Formatif! Bagaimana saintis menggunakan ekstrapolasi graf isi padu gas melawan suhu untuk meramal suhu sifar mutlak apabila isi padu gas menghampiri sifar?"}],"iconUrl":"../assets/icons/fiz-u3.jpg"},{"id":"fiz-u4","title":"5 Analisis Graf (Rajah 1.9) & Luas Kerja","subtitle":"Subtopik 1.2 — Segi Tiga Kecerunan Besar, Luas Bawah Graf Spring F-x & Interpolasi","iconType":"formula","boss":false,"steps":[{"type":"concept","title":"Lima Perkara Analisis Graf (Rajah 1.9): Kecerunan, Luas, Interpolasi & Ekstrapolasi","summary":"Selain menyimpulkan hubungan, graf eksperimen Fizik membenarkan pelajar menghitung kecerunan m, luas di bawah graf (contohnya kerja pada spring F melawan x), pintasan-y serta membaca nilai baharu melalui interpolasi dan ekstrapolasi.","labId":"fiz_gradient_area_lab","labTitle":"Makmal Analisis Graf Spring F–x (Kecerunan, Luas Kerja & Ekstrapolasi)","labCaption":"Tukar 3 mod analisis (Kecerunan k, Luas Kerja W = ½Fx, Interpolasi/Ekstrapolasi) dan seret slider pemanjangan x (+5 XP).","bullets":["(1 & 2) Hubungan & Kecerunan: Bina segi tiga kecerunan besar >= 50% panjang garis lurus penyuaian terbaik dengan koordinat (x₁,y₁) dan (x₂,y₂) yang diambil tepat di atas garis.","(3) Luas Di Bawah Graf: Dalam graf Daya F melawan Pemanjangan spring x (F = kx), luas segi tiga di bawah graf bersamaan Kerja yang dilakukan, W = ½ F x.","(4) Interpolasi: Membaca nilai tersembunyi DI DALAM julat data eksperimen menggunakan garis lurus penyuaian terbaik.","(5) Ekstrapolasi & Pintasan-y: Memanjangkan garis di luar julat ukuran (seperti pintasan x = 0 untuk mendapat halaju awal u dalam graf v-t)."],"formula":"Kecerunan, m = (y₂ - y₁) / (x₂ - x₁)   |   Luas Bawah Graf F–x = Kerja, W = ½ F x","examTip":"JANGAN gunakan titik data jadual yang terkeluar daripada garis lurus ketika mengira kecerunan! Tandakan dua titik baru yang kemas di atas garis penyuaian terbaik dengan segi tiga >= 50%.","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Makmal Kecerunan & Luas Bawah Graf","voiceCaption":"Rajah 1.9 merangkumi 5 teknik analisis graf: menyatakan hubungan, menghitung kecerunan (segi tiga >= 50%), mengira luas di bawah graf (Kerja W = ½Fx bagi graf spring F-x), interpolasi dan ekstrapolasi.","voiceScript":"[warm] Hebat, sekarang kita masuk ke Rajah satu perpuluhan sembilan iaitu lima perkara analisis graf! [excited] Selain mencari kecerunan dengan segi tiga besar, tahukah awak luas segi tiga di bawah graf daya melawan pemanjangan spring mewakili kerja dilakukan? Teroka makmal interaktif baru di bawah!","mediaKey":"foucault_pendulum","hook":"Kecerunan graf = y2-y1 / x2-x1 manakala luas bawah graf boleh mewakili jarak atau kerja! Dua kemahiran emas Kertas 3."},{"type":"wordbank","prompt":"Susun rumus kecerunan graf garis lurus yang betul:","hint":"Susun ungkapan bermula daripada 'm =' diikuti perubahan paksi-y bahagi perubahan paksi-x.","answerTokens":["m =","(y₂ - y₁)","/","(x₂ - x₁)"],"distractors":["(x₂ - x₁)","×"],"explanation":"Kecerunan m ditakrifkan sebagai nisbah perubahan paksi mencancang (Δy = y₂ − y₁) kepada perubahan paksi mengufuk (Δx = x₂ − x₁).","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Rumus Kecerunan Graf","voiceCaption":"Bina semula ungkapan matematik kecerunan garis lurus supaya urutannya kekal tepat!","voiceScript":"[confident] Bina semula ungkapan matematik kecerunan garis lurus supaya urutannya kekal tepat!"},{"type":"predict","prompt":"Ramal & Uji: Satu spring ditarik secara linear dari (0, 0) sehingga daya F = 8.0 N pada pemanjangan x = 0.40 m. Hitung kerja yang dilakukan (luas di bawah graf F melawan x).","scenario":"Luas di bawah graf Daya (F) melawan Pemanjangan (x) berbentuk segi tiga bersudut tegak: Luas = ½ × tapak × tinggi.","options":["0.80 J","1.60 J","3.20 J","20.0 J"],"correctIndex":1,"proofLabId":"fiz_gradient_area_lab","proofState":"area_work","explanation":"Cemerlang! Kerja W = Luas di bawah graf F–x = ½ × 8.0 N × 0.40 m = 1.60 J. Klik mod 'Luas Kerja W = ½Fx' pada graf di atas untuk melihat kawasan berloreknya!","xp":25,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal & Uji Kerja Bawah Graf F-x","voiceCaption":"Gunakan simulator graf spring di atas! Apabila daya spring mencapai lapan Newton pada pemanjangan sifar perpuluhan empat meter, berapakah kerja dilakukan daripada luas segi tiga di bawah graf?","voiceScript":"[curious] Gunakan simulator graf spring di atas! Apabila daya spring mencapai lapan Newton pada pemanjangan sifar perpuluhan empat meter, berapakah kerja dilakukan daripada luas segi tiga di bawah graf?"},{"type":"match","prompt":"Padankan teknik analisis graf dengan maksud atau hasil kuantiti fiziknya:","pairs":[{"id":"an1","left":"Kecerunan graf halaju v melawan masa t","right":"Memberikan pecutan objek (a = Δv / Δt)"},{"id":"an2","left":"Luas di bawah graf daya F melawan pemanjangan x","right":"Mewakili kerja dilakukan ke atas spring (W = ½Fx)"},{"id":"an3","left":"Pintasan-y pada graf halaju v melawan masa t","right":"Memberikan nilai halaju awal objek (u)"},{"id":"an4","left":"Interpolasi garis penyuaian terbaik","right":"Menentukan nilai antara titik dalam julat data"},{"id":"an5","left":"Ekstrapolasi garis penyuaian terbaik","right":"Meramal nilai di luar julat titik eksperimen"}],"explanation":"Kelima-lima teknik ini melengkapkan analisis graf Kertas 3 SPM: hubungan, kecerunan, luas di bawah graf, interpolasi dan ekstrapolasi.","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padankan 5 Analisis Graf Rajah 1.9","voiceCaption":"Padankan setiap teknik analisis graf Rajah satu perpuluhan sembilan dengan kuantiti atau kegunaan fiziknya!","voiceScript":"[warm] Padankan setiap teknik analisis graf Rajah satu perpuluhan sembilan dengan kuantiti atau kegunaan fiziknya!"},{"type":"mcq","prompt":"Satu graf halaju v (m s⁻¹) melawan masa t (s) mempunyai kecerunan garis lurus bernilai 4.0 dan pintasan-y pada 6.0. Apakah kuantiti fizik yang diwakili oleh kedua-dua nilai tersebut?","options":["Kecerunan = Pecutan (4.0 m s⁻²); Pintasan-y = Halaju awal (6.0 m s⁻¹)","Kecerunan = Sesaran (4.0 m); Pintasan-y = Pecutan awal (6.0 m s⁻²)","Kecerunan = Halaju awal (4.0 m s⁻¹); Pintasan-y = Masa berhenti (6.0 s)","Kecerunan = Jisim objek (4.0 kg); Pintasan-y = Daya graviti (6.0 N)"],"correctIndex":0,"explanation":"Kecerunan graf v–t ialah Δv / Δt = pecutan (unit m s⁻²), manakala bacaan halaju ketika t = 0 s (pintasan-y) ialah halaju awal u.","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Tafsir Kecerunan & Pintasan v-t","voiceCaption":"Satu soalan pengiraan graf v lawan t! Jika kecerunan bernilai empat perpuluhan sifar dan pintasan y pada enam perpuluhan sifar, apakah kedua-dua nilai itu?","voiceScript":"[curious] Satu soalan pengiraan graf v lawan t! Jika kecerunan bernilai empat perpuluhan sifar dan pintasan y pada enam perpuluhan sifar, apakah kedua-dua nilai itu?"}],"iconUrl":"../assets/icons/fiz-u4.jpg"},{"id":"fiz-u5","title":"Eksperimen 1.1 Bandul Ringkas (Amali Wajib)","subtitle":"Subtopik 1.2 — Susunan Radas, 20 Ayunan Lengkap, Ralat & Plot T² vs l","iconType":"pendulum","boss":false,"steps":[{"type":"concept","title":"Eksperimen 1.1: Menyiasat Hubungan Panjang Bandul (l) dengan Tempoh Ayunan (T)","summary":"Satu ayunan lengkap ialah pergerakan ladung pergi dan balik ke titik permulaan yang sama (A → B → C → B → A). Dalam Eksperimen 1.1 buku teks, benang diapit dengan dua keping papan lapis kecil serta pengapit-G, diayunkan pada sudut kecil (< 10°), dan masa bagi 20 ayunan lengkap diulang dua kali (t₁, t₂) untuk mencari t_purata serta T = t_purata / 20.","labId":"fiz_pendulum_lab","labTitle":"Makmal 60fps Simulator Bandul Ringkas & Radas Eksperimen 1.1","labCaption":"Ubah Panjang (l) dan Jisim (m), tekan Jeda bila perlu, klik 'Rekod Titik' untuk memplot T² melawan l, serta buka galeri radas & potret Galileo (+5 XP).","bullets":["Pemboleh ubah: PM = Panjang benang l (20 hingga 70 cm); PB = Tempoh T dan T²; PMa = Jisim ladung, sudut ayunan kecil (< 10°), pecutan graviti g.","Fungsi 2 keping papan lapis kecil + pengapit-G: Memegang benang dengan teguh pada titik tetap tanpa tergelincir semasa berayun.","Langkah jitu: Ambil masa bagi 20 ayunan lengkap dua kali (t₁ dan t₂), kira t_purata = (t₁ + t₂)/2, lalu T = t_purata / 20.","Ralat paralaks: Kedudukan mata hendaklah berserenjang dengan skala pembaris meter ketika melaraskan panjang l."],"formula":"T = 2π √(l / g)   ⇒   T² = (4π² / g) · l   ⇒   T_purata = t_purata / 20","examTip":"Mengapa ambil masa 20 ayunan lengkap dan ulang bacaan t₁, t₂? Untuk mengurangkan ralat rawak akibat masa tindak balas manusia ketika memulakan dan memberhentikan jam randik!","xp":15,"voiceIdKey":"u5-s1","voiceToneLabel":"Simulasi 60fps Eksperimen Bandul","voiceCaption":"Eksperimen 1.1 Bandul Ringkas menggunakan kaki retort, pengapit-G, 2 keping papan lapis kecil, sudut ayunan < 10°, serta pengukuran masa 20 ayunan lengkap berulang (T = t_purata / 20).","voiceScript":"[warm] Selamat datang ke makmal paling terkenal dalam Bab Satu iaitu Eksperimen satu perpuluhan satu Bandul Ringkas! [excited] Di bawah ini ada simulasi enam puluh bingkai sesaat beserta foto radas dua keping papan lapis dan potret Galileo Galilei!","mediaKeys":["foucault_pendulum","pendulum_retort_scene"],"videoClip":{"src":"../assets/fizik-t4-bab01/video/fiz41_video_graf_bandul_narasi.mp4","hasNarration":true,"caption":"Eksperimen 1.1 Bandul Ringkas — hubungan panjang tali l dengan tempoh ayunan T serta graf T² melawan l."},"hook":"Eksperimen 1.1: Mengapa jam bandul lama kekal tepat walau berat bandul ditukar? Kerana tempoh ayunan bergantung kepada PANJANG tali, bukan jisim!"},{"type":"predict","prompt":"Ramal & Uji (Miskonsepsi Klasik SPM): Jika jisim ladung bandul digandakan daripada 50 g kepada 200 g (panjang benang kekal 60 cm), apakah yang berlaku kepada tempoh ayunan T?","scenario":"Uji jangkaan anda menggunakan rumus T = 2π √(l / g) sebelum mengesahkannya pada simulator 60fps.","options":["Tempoh T bertambah menjadi dua kali ganda lebih lambat","Tempoh T berkurang separuh kerana ladung lebih berat","Tempoh T kekal sama / tidak berubah (jisim tidak mempengaruhi T)","Bandul berhenti berayun serta-merta"],"correctIndex":2,"proofLabId":"fiz_pendulum_lab","proofState":"mass_test","explanation":"Tepat sekali! Dalam rumus T = 2π √(l / g), tiada pemboleh ubah jisim (m). Cuba seret slider Jisim Ladung pada simulator di atas — tempoh T kekal 1.55 s!","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Miskonsepsi Jisim Ladung Bandul","voiceCaption":"Ini perangkap kegemaran peperiksaan S P M! Jika jisim ladung digandakan dari lima puluh gram ke dua ratus gram sambil mengekalkan pan   function isReducedMotion() {
    return Boolean(typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function makePauseBtnHtml(paused, labelRun, labelPause) {
    var icon = paused
      ? '<polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>'
      : '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>';
    return '<button type="button" class="lab-pause-btn" data-pause-toggle="1"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">' + icon + '</svg><span>' + (paused ? (labelRun || "Mainkan Simulasi") : (labelPause || "Jeda Simulasi")) + "</span></button>";
  }

  function buildArchivalPlateHtml(slug, captionText, priorityFirst) {
    var m = FIZ01_MEDIA[slug];
    if (!m) return "";
    var prioAttr = priorityFirst ? ' fetchpriority="high"' : ' loading="lazy"';
    return (
      '<button type="button" class="archival-plate-btn" data-arch-slug="' + slug + '" data-arch-cap="' + captionText.replace(/"/g, "&quot;") + '">' +
        '<img class="archival-plate-img" src="' + m.dataUri + '" alt="' + m.label.replace(/"/g, "&quot;") + '" width="' + m.width + '" height="' + m.height + '"' + prioAttr + ">" +
        '<span class="archival-plate-title">' + m.label + "</span>" +
        '<span class="archival-plate-era">' + m.era + "</span>" +
      "</button>"
    );
  }

  function wireArchivalLightbox(mountEl, ctx) {
    mountEl.addEventListener("click", function (ev) {
      var card = ev.target.closest("[data-arch-slug]");
      if (!card) return;
      var slug = card.getAttribute("data-arch-slug");
      var cap = card.getAttribute("data-arch-cap") || "";
      var m = FIZ01_MEDIA[slug];
      if (!m) return;
      if (typeof NotaFeel !== "undefined" && NotaFeel.openArchivalLightbox) {
        NotaFeel.openArchivalLightbox({
          era: m.era,
          title: m.label,
          caption: cap,
          credit: m.credit + (m.sourceUrl ? " • commons.wikimedia.org" : ""),
          src: m.dataUri,
          alt: m.label
        });
      }
      if (ctx && ctx.markInteracted) ctx.markInteracted();
    });
  }

  window.ETUTOR_NOTA_LABS.fiz_graph_explorer = function (mountEl, ctx) {
    var graphs = {
      direct: { label: "1. Berkadar Terus (y ∝ x)", rel: "y berkadar terus dengan x", eq: "y = 5x (c = 0)", note: "Garis lurus tepat melalui asalan (0,0). Apabila x digandakan dua kali, y turut berganda dua kali. Kecerunan m = y/x malar.", fn: function (x) { return 5 * x; }, maxX: 6, maxY: 30 },
      linUp: { label: "2. Linear (+) c > 0", rel: "y bertambah secara linear dengan x", eq: "y = 3x + 8 (c = 8)", note: "JANGAN tulis 'berkadar terus'! Garis lurus tidak melalui asalan (0,0) kerana ada pintasan-y (c = 8).", fn: function (x) { return 3 * x + 8; }, maxX: 6, maxY: 30 },
      linDown: { label: "3. Linear (-) Kecerunan -", rel: "y berkurang secara linear dengan x", eq: "y = 26 - 3.5x", note: "Kecerunan bernilai negatif dan garis lurus memotong paksi-y pada nilai positif (halaju menyahpecut atau paras bateri susut).", fn: function (x) { return Math.max(0, 26 - 3.5 * x); }, maxX: 6, maxY: 30 },
      curveUp: { label: "4. Lengkung Naik (+)", rel: "y bertambah dengan x (bukan linear)", eq: "y = 0.8x² (melalui 0,0)", note: "Rajah 1.8 (4): Garis melengkung melalui asalan dengan kecerunan semakin bertambah; nilai y bertambah dengan x tetapi tidak secara linear.", fn: function (x) { return 0.8 * x * x; }, maxX: 6, maxY: 30 },
      curveDown: { label: "5. Lengkung Turun (-)", rel: "y berkurang dengan x (pintasan +)", eq: "y = 26 - 0.65x²", note: "Rajah 1.8 (5): Lengkung menurun bermula daripada pintasan-y positif (bukan garis lurus).", fn: function (x) { return Math.max(0, 26 - 0.65 * x * x); }, maxX: 6, maxY: 30 },
      inverse: { label: "6. Songsang (Hiperbola)", rel: "y berkadar songsang dengan x (y ∝ 1/x)", eq: "y = 24 / x  ⇒  Plot y vs 1/x = Garis Lurus", note: "Lengkung hiperbola tidak menyentuh paksi. Trik Kertas 3 SPM: Plotkan graf y melawan 1/x supaya bertukar menjadi garis lurus melalui asalan!", fn: function (x) { return x < 0.8 ? 30 : 24 / x; }, maxX: 6, maxY: 30 }
    };
    var gKey = "direct";
    var testX = ctx.proofState === "extrapolate" ? 5 : 2.5;
    var showLinearized = false;

    function toSvgX(x, maxX) { return 58 + (x / maxX) * 320; }
    function toSvgY(y, maxY) { return 212 - (y / maxY) * 172; }

    function render(fromUser) {
      var g = graphs[gKey];
      var isInvLin = gKey === "inverse" && showLinearized;
      var pts = [];
      for (var ix = 0; ix <= 40; ix++) {
        var xv = isInvLin ? (ix / 40) * 1.0 : 0.1 + (ix / 40) * (g.maxX - 0.1);
        if (gKey === "direct" && ix === 0) xv = 0;
        if ((gKey === "linUp" || gKey === "linDown" || gKey === "curveUp" || gKey === "curveDown") && ix === 0) xv = 0;
        var yv = isInvLin ? Math.min(30, 24 * xv) : Math.min(g.maxY, g.fn(xv));
        pts.push(toSvgX(xv, isInvLin ? 1.0 : g.maxX).toFixed(1) + "," + toSvgY(yv, g.maxY).toFixed(1));
      }
      var tx = isInvLin ? Math.min(1.0, 1 / Math.max(1.0, testX)) : testX;
      var px = toSvgX(tx, isInvLin ? 1.0 : g.maxX);

  // 3. Makmal Analisis Graf Spring F-x (Rajah 1.9: Kecerunan Besar >=50%, Luas Kerja W=1/2Fx, Interpolasi & Ekstrapolasi)
  window.ETUTOR_NOTA_LABS.fiz_gradient_area_lab = function (mountEl, ctx) {

          '<circle cx="' + sX1.toFixed(1) + '" cy="' + sY1.toFixed(1) + '" r="4.5" fill="#1e3a8a"/><circle cx="' + sX2.toFixed(1) + '" cy="' + sY2.toFixed(1) + '" r="4.5" fill="#1e3a8a"/>' +
          '<text x="' + ((sX1 + sX2) / 2).toFixed(1) + '" y="' + (sY1 + 14).toFixed(1) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#1e3a8a">Δx = ' + (gx2 - gx1).toFixed(2) + " m</text>" +
          '<text x="' + (sX2 + 6).toFixed(1) + '" y="' + ((sY1 + sY2) / 2 + 4).toFixed(1) + '" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#1e3a8a">ΔF = ' + (gf2 - gf1).toFixed(1) + " N</text>";

        calloutText = "<strong>Syarat Segi Tiga Kecerunan Besar:</strong> Pilih dua titik di atas garis penyuaian terbaik yang jaraknya >= 50% panjang garis graf supaya ralat bacaan minimum.";
      } else if (mode === "area") {
        overlaySvg =

          '<text x="' + (xZero + (px - xZero) * 0.56).toFixed(1) + '" y="' + (yZero - (yZero - py) * 0.30).toFixed(1) + '" text-anchor="middle" font-family="Lexend,sans-serif" font-size="10.5" font-weight="800" fill="#047857">Kerja W = ' + workW.toFixed(2) + " J</text>";
        readouts =
          '<div class="lab-meter"><span class="lab-meter-label">Daya Pada x = ' + probeX.toFixed(2) + ' m</span><strong class="lab-meter-val">F = ' + fVal.toFixed(1) + " N</strong></div>" +
          '<div class="lab-meter"><span class="lab-meter-label">Luas Bawah Graf (Kerja)</span><strong class="lab-meter-val" style="color:#059669">W = ½ F x = ' + workW.toFixed(2) + " J</strong></div>";
        calloutText = "<strong>Luas Di Bawah Graf (Rajah 1.9):</strong> Bagi graf Daya (F) melawan Pemanjangan spring (x), luas kawasan segi tiga berlorek bersamaan <strong>Kerja dilakukan = ½ × F × x</strong>.";

      }

      var rawDots = [0.10, 0.20, 0.30].map(function (rx) {
        return '<circle cx="' + sx(rx).toFixed(1) + '" cy="' + sy(springK * rx).toFixed(1) + '" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>';

      mountEl.innerHTML =

          '<line x1="' + xZero.toFixed(1) + '" y1="' + yZero.toFixed(1) + '" x2="' + sx(Math.max(0.40, endLineX)).toFixed(1) + '" y2="' + sy(springK * Math.max(0.40, endLineX)).toFixed(1) + '" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>' +
          overlaySvg +

      var sl = mountEl.querySelector("#gaProbe");
