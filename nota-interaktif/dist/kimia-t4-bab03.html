  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"kimia-t4-bab03","subject":"Kimia","subjectGroup":"sains","form":4,"chapterNumber":3,"title":"Konsep Mol, Formula dan Persamaan Kimia","subtitle":"Subtopik 3.1–3.4 KSSM (44 Langkah Bit-by-Bit) — Skala Piawai C-12, JAR, JMR & JFR, Konsep Mol & Pemalar Avogadro, Jisim & Isi Padu Molar Gas, Formula Empirik (MgO vs CuO) & Molekul, Silang Caj Sebatian Ion, Penamaan IUPAC serta Pengimbangan & Stoikiometri Persamaan Kimia.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"kimia-t4-bab03-labs.js","coverIcon":"../assets/icons/kim43-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep mol, formula dan stoikiometri Kimia kamu memang padu!","combo":"[laughs warmly] Kombo yang hebat! [excited] Ketepatan pengiraan kimia juara S P M memang terserlah!","encourage":"[softly] Hampir tepat... jangan mengalah! [warm] Semak semula nisbah mol, cas ion atau pekali persamaan pada panduan di bawah.","celebrate":"[excited] Tahniah! Satu lagi unit Kimia Tingkatan empat Bab tiga berjaya dikuasai sepenuhnya!"},"units":[{"id":"kim43-u1","title":"Unit 1: Jisim Atom, Molekul & Formula Relatif (Skala C-12)","subtitle":"Subtopik 3.1 — Analogi Neraca, Atom Piawai Karbon-12, JAR, JMR & JFR","iconType":"scale","iconUrl":"../assets/icons/kim43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Skala Piawai Karbon-12 & JAR","voiceCaption":"Jisim sebenar atom terlalu kecil untuk ditimbang langsung, maka ahli kimia membandingkannya dengan satu per dua belas kali jisim satu atom karbon-12 sebagai piawai.","voiceScript":"[warm] Selamat datang ke Kimia Tingkatan empat Bab tiga, Konsep Mol, Formula dan Persamaan Kimia! Pernahkah kamu terfikir bagaimana ahli kimia menimbang atom sedangkan sebutir beras pun sukar dikira dalam seguni? Mereka menggunakan perbandingan berbanding atom piawai karbon dua belas yang ditetapkan oleh I U P A C pada tahun seribu sembilan ratus enam puluh satu! Jom teroka mengapa faktor satu per dua belas digunakan pada neraca piawai di bawah.","title":"Piawai Karbon-12 & Takrif Jisim Atom Relatif (JAR)","acronym":"C12•JAR","hook":"Sate dibakar atas bara arang kayu C(p) + O2(g) -> CO2(g): simbol huruf dan nombor kecil itulah bahasa kuantitatif ahli kimia!","mediaKey":"kim43_c12_graphite","summary":"Oleh sebab atom terlalu kecil untuk disukat jisimnya secara terus, ahli kimia menggunakan nilai perbandingan yang dipanggil jisim atom relatif (JAR) berpandukan isotop karbon-12.","bullets":["Sejarah & Faktor 1/12 (Aktiviti 3.1): Pada mulanya atom hidrogen dipilih sebagai piawai (1 unit) kerana paling ringan, namun pada tahun 1961 ahli kimia memilih atom karbon-12 (jisim tepat 12.0 unit) kerana karbon-12 ialah pepejal mudah dikendali pada suhu bilik, mudah bergabung dengan unsur lain serta merupakan isotop utama (~99%). Nilai 1/12 x jisim satu atom karbon-12 bersamaan tepat 1 unit (setara 1 atom hidrogen).","Takrif & Contoh JAR: Jisim atom relatif (JAR) sesuatu unsur ialah jisim purata satu atom unsur tersebut berbanding 1/12 kali jisim satu atom karbon-12. JAR tidak mempunyai unit kerana ia merupakan nisbah perbandingan (cth. JAR helium ialah 4 bermakna 1 atom He adalah 4 kali lebih berat daripada 1/12 atom C-12)."],"formula":"JAR unsur = Jisim purata satu atom unsur / (1/12 x Jisim satu atom C-12)   [Tiada Unit]","labId":"kim43_rel_mass_scale_lab","labTitle":"Neraca Piawai Karbon-12, Pengira JMR/JFR & Galeri Bab 3","labProps":{"tab":"neraca","atom":"He"},"examTip":"Jawapan wajib Aktiviti 3.1 & Soalan SPM: Karbon-12 dipilih sebagai piawai kerana pepejal pada suhu bilik (mudah dikendali), mudah berpadu membentuk banyak sebatian, dan isotop utamanya berjisim tepat 12.0."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Fakta Skala C-12 vs Miskonsepsi","voiceCaption":"Asingkan enam pernyataan berikut kepada fakta sahih mengenai skala karbon-12 dan JAR berbanding pernyataan yang tidak tepat.","voiceScript":"[confident] Jom uji pemahaman awal tentang skala karbon dua belas! Asingkan enam pernyataan berikut antara Fakta Sahih Skala Karbon Dua Belas dengan Pernyataan Tidak Tepat.","prompt":"Kelaskan pernyataan berikut kepada Fakta Sahih Skala C-12 / JAR atau Pernyataan Tidak Tepat:","buckets":[{"id":"sahih","label":"Fakta Sahih Skala C-12 & JAR"},{"id":"salah","label":"Miskonsepsi / Tidak Tepat"}],"items":[{"text":"Jisim atom relatif (JAR) tidak mempunyai sebarang unit kerana merupakan nisbah perbandingan","bucketId":"sahih","note":"Tepat! Unit asal terhapus apabila dua jisim dibandingkan."},{"text":"JAR diukur dalam unit gram per mol (g mol^-1) pada skala makmal","bucketId":"salah","note":"Itu ialah unit bagi Jisim Molar, bukannya JAR!"},{"text":"1/12 kali jisim satu atom karbon-12 menyamai tepat 1 unit piawai","bucketId":"sahih","note":"Betul! Satu atom C-12 diberi nilai tepat 12 unit."},{"text":"Karbon-12 wujud sebagai gas paling ringan pada suhu bilik menyebabkannya dipilih","bucketId":"salah","note":"Penerangan itu merujuk hidrogen yang lama; karbon-12 ialah pepejal pada suhu bilik."},{"text":"Satu atom magnesium (JAR = 24) adalah dua kali lebih berat daripada satu atom karbon-12","bucketId":"sahih","note":"Tepat! 2 x 12 = 24."},{"text":"Kelimpahan isotop karbon-12 sekitar 99% menjamin nilai piawai 12.0 yang stabil","bucketId":"sahih","note":"Betul! Isotop utama karbon ialah karbon-12."}],"explanation":"Sentiasa ingat: JAR ialah nilai perbandingan tanpa unit yang merujuk 1/12 jisim satu atom C-12, dan C-12 dipilih kerana sifat pepejalnya, kestabilan berpadu serta kelimpahan 99%."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Jisim Molekul & Formula Relatif","voiceCaption":"JMR digunakan untuk bahan molekul dengan menjumlahkan JAR semua atom, manakala JFR digunakan untuk bahan ion seperti zink klorida dan aluminium sulfat.","voiceScript":"[warm] Sekarang mari fahami perbezaan antara Jisim Molekul Relatif atau J M R dengan Jisim Formula Relatif atau J F R! J M R dikira bagi molekul kovalen seperti air dan glukosa dengan menjumlahkan semua J A R atom di dalamnya. Bagi sebatian ion seperti zink klorida dan aluminium sulfat pula, kita gunakan istilah J F R kerana sebatian ion terdiri daripada ion yang jisimnya hampir sama dengan atom asalnya!","title":"Jisim Molekul Relatif (JMR), Jisim Formula Relatif (JFR) & Aktiviti 3.2","acronym":"JMR•JFR","hook":"Jisim elektron terlalu kecil sehingga tidak mengubah jumlah jisim ion berbanding atom — sebab itulah JFR dikira sama seperti JMR!","mediaKey":"kim43_two_pan_balance","summary":"JMR dan JFR kedua-duanya dihitung dengan menjumlahkan jisim atom relatif semua atom yang terkandung dalam formula kimia bahan tersebut.","bullets":["Aktiviti 3.2 & Jisim Molekul Relatif (JMR): Dalam analogi neraca dua piring, 1 model atom C-12 diwakili 12 sesendal (1 sesendal = 1/12 jisim C-12). JMR sesuatu molekul = jumlah JAR semua atom di dalamnya: contoh O2 = 2(16) = 32, H2O = 2(1) + 16 = 18, dan glukosa C6H12O6 = 6(12) + 12(1) + 6(16) = 180.","Jisim Formula Relatif (JFR) Bahan Ion: Digunakan khusus untuk sebatian ion kerana wujud dalam bentuk unit ion (cth. Contoh 2: ZnCl2 = 65 + 2(35.5) = 136; Al2(SO4)3 = 2(27) + 3[32 + 4(16)] = 54 + 288 = 342). Berhati-hati apabila mengembang nombor di luar kurungan!"],"formula":"JMR / JFR = Jumlah (bilangan atom setiap unsur x JAR unsur tersebut)   [Tiada Unit]","labId":"kim43_rel_mass_scale_lab","labTitle":"Kalkulator Pecahan JMR/JFR & Analogi Neraca Sesendal","labProps":{"tab":"kalkulator","formula":"Al2(SO4)3"},"examTip":"Perangkap istilah SPM: Jangan tulis JMR untuk NaCl atau Mg(NO3)2 — bahan ion wajib menggunakan istilah Jisim Formula Relatif (JFR), manakala bahan molekul menggunakan JMR."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Bahan & Nilai JMR/JFR","voiceCaption":"Padankan lima bahan kimia daripada Contoh dan Aktiviti tiga perpuluhan tiga dengan nilai JMR atau JFR yang betul.","voiceScript":"[confident] Uji ketepatan pengiraan J M R dan J F R kamu! Padankan lima bahan daripada buku teks ini dengan nilai jisim relatif tepatnya.","prompt":"Padankan formula bahan kimia berikut dengan nilai JMR atau JFR tepatnya [JAR: H=1, C=12, N=14, O=16, Mg=24, Al=27, S=32, Cl=35.5, Zn=65]:","pairs":[{"id":"u1m1","left":"Glukosa, C6H12O6 (Contoh 1)","right":"JMR = 180"},{"id":"u1m2","left":"Zink klorida, ZnCl2 (Contoh 2)","right":"JFR = 136"},{"id":"u1m3","left":"Aluminium sulfat, Al2(SO4)3 (Contoh 2)","right":"JFR = 342"},{"id":"u1m4","left":"Magnesium nitrat, Mg(NO3)2 (Uji Kendiri 3.1)","right":"JFR = 148"},{"id":"u1m5","left":"Asid formik, HCOOH (Uji Kendiri 3.1)","right":"JMR = 46"}],"explanation":"Semak kurungan dengan teliti: Mg(NO3)2 = 24 + 2[14 + 48] = 148; HCOOH = 1 + 12 + 32 + 1 = 46; Al2(SO4)3 = 54 + 3(96) = 342."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Perbandingan Atom pada Neraca","voiceCaption":"Berdasarkan Uji Kendiri tiga perpuluhan satu nombor dua b, ramalkan bilangan atom helium yang diperlukan untuk menyamai jisim satu atom argentum.","voiceScript":"[curious] Cuba ramalkan soalan Uji Kendiri tiga perpuluhan satu! Jika satu atom helium berjisim atom relatif empat manakala satu atom argentum berjisim atom relatif seratus lapan, berapakah bilangan atom helium yang diperlukan untuk menyeimbangkan satu atom argentum di atas neraca dua piring?","hook":"Saksikan keseimbangan neraca dua piring karbon dua belas sebaik sahaja kamu memilih jawapan!","scenario":"Satu atom argentum (JAR Ag = 108) diletakkan pada piring kiri neraca dua piring, manakala atom-atom helium (JAR He = 4) diletakkan satu demi satu di piring kanan.","prompt":"Berapakah bilangan atom helium (JAR = 4) yang diperlukan untuk menyamai jisim satu atom argentum (JAR = 108)?","options":["12 atom helium","27 atom helium","36 atom helium","104 atom helium"],"correctIndex":1,"proofLabId":"kim43_rel_mass_scale_lab","proofState":{"tab":"neraca","atom":"Ag"},"explanation":"Bilangan atom helium = JAR Ag / JAR He = 108 / 4 = 27 atom helium. Konsep perbandingan JAR membolehkan atom dibandingkan terus antara satu sama lain."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Takrif Rasmi JAR","voiceCaption":"Susun blok perkataan bagi membina takrif rasmi jisim atom relatif sesuatu unsur berdasarkan skala karbon dua belas.","voiceScript":"[confident] Susun semula blok definisi berikut untuk menghasilkan takrifan tepat jisim atom relatif mengikut piawai peperiksaan S P M!","prompt":"Susun blok perkataan untuk menakrifkan Jisim Atom Relatif (JAR) berdasarkan skala karbon-12:","hint":"Mulakan dengan jisim purata satu atom unsur tersebut...","answerTokens":["Jisim purata satu atom unsur tersebut","berbanding dengan","satu per dua belas kali","jisim satu atom karbon-12"],"distractors":["dibahagikan dengan jisim dua atom hidrogen","dalam unit gram per mol"],"explanation":"Takrif tepat KSSM (1 markah wajib): Jisim purata satu atom suatu unsur berbanding dengan 1/12 kali jisim satu atom karbon-12."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Kira JFR Kompaun Kompleks","voiceCaption":"Selesaikan soalan Aktiviti tiga perpuluhan tiga mengira JFR bagi kalium dikromat enam dan ferum tiga nitrat.","voiceScript":"[excited] Cabaran penutup Unit satu daripada Aktiviti tiga perpuluhan tiga! Hitungkan jisim formula relatif bagi kalium dikromat enam dan ferum tiga nitrat dengan teliti!","stimulusHtml":"<div class='stimulus-note'><strong>Data JAR:</strong> N = 14, O = 16, K = 39, Cr = 52, Fe = 56. Hitung JFR bagi <strong>K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub></strong> dan <strong>Fe(NO<sub>3</sub>)<sub>3</sub></strong>.</div>","prompt":"Apakah nilai JFR yang TEPAT bagi kalium dikromat(VI), K2Cr2O7 dan ferum(III) nitrat, Fe(NO3)3?","options":["K2Cr2O7 = 294  |  Fe(NO3)3 = 242","K2Cr2O7 = 216  |  Fe(NO3)3 = 180","K2Cr2O7 = 294  |  Fe(NO3)3 = 146","K2Cr2O7 = 310  |  Fe(NO3)3 = 242"],"correctIndex":0,"explanation":"K2Cr2O7 = 2(39) + 2(52) + 7(16) = 78 + 104 + 112 = 294. Fe(NO3)3 = 56 + 3[14 + 3(16)] = 56 + 3(62) = 56 + 186 = 242."}]},{"id":"kim43-u2","title":"Unit 2: Konsep Mol, Pemalar Avogadro, Jisim Molar & Isi Padu Molar","subtitle":"Subtopik 3.2 — Mol (6.02 x 10^23), Jisim Molar, Isi Padu Gas STP/Bilik & Segi Tiga Mol","iconType":"atom","iconUrl":"../assets/icons/kim43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Konsep Mol & Pemalar Avogadro","voiceCaption":"Satu mol bahan mengandungi enam perpuluhan sifar dua darab sepuluh kuasa dua puluh tiga entiti asas yang disebut Pemalar Avogadro.","voiceScript":"[warm] Selamat datang ke Unit dua, Konsep Mol! Jika peniaga menggunakan unit pasang dan dozen, ahli kimia pula menggunakan unit S I iaitu mol untuk mengira bilangan zarah yang amat banyak! Tonton video penerangan bersuara tiga dimensi ini untuk melihat bagaimana satu mol sentiasa mewakili enam perpuluhan sifar dua darab sepuluh kuasa dua puluh tiga zarah, sama ada atom kuprum, molekul air mahupun unit formula natrium klorida!","title":"Takrif Mol, Pemalar Avogadro (NA) & Jenis Zarah Bahan","acronym":"NA•6.02","hook":"Tonton video bersuara bagaimana 1 mol mengikat dunia mikroskopik zarah kepada jisim dan isi padu gas di makmal!","mediaKey":"kim43_konsep_mol","videoClip":{"src":"../assets/kimia-t4-bab03/video/kim43_video_konsep_mol_narasi.mp4","hasNarration":true,"posterKey":"kim43_konsep_mol","caption":"Video Penerangan Bersuara (BM): Konsep Mol, Pemalar Avogadro 6.02 x 10^23 serta hubung kait zarah, jisim molar dan isi padu molar gas"},"summary":"Mol (simbol: mol) ialah unit SI kuantiti bahan; 1 mol sebarang bahan sentiasa mengandungi 6.02 x 10^23 zarah (Pemalar Avogadro, NA).","bullets":["Takrif IUPAC & Pemalar Avogadro (NA): Satu mol mengandungi 6.02214076 x 10^23 entiti asas (dipermudah kepada 6.02 x 10^23 mol^-1 untuk pengiraan SPM), dinamakan sempena Amedeo Avogadro. Hubungan asas: Bilangan mol, n = Bilangan zarah / NA.","Jenis Zarah Mengikut Bahan (Rajah 3.6): 1 mol bahan atom (cth. Cu) = 6.02 x 10^23 atom Cu; 1 mol bahan molekul (cth. H2O) = 6.02 x 10^23 molekul H2O; 1 mol bahan ion (cth. NaCl) = 6.02 x 10^23 unit formula NaCl."],"formula":"Bilangan zarah = n x NA   |   Bilangan mol, n = Bilangan zarah / NA   (NA = 6.02 x 10^23 mol^-1)","labId":"kim43_mol_triangle_lab","labTitle":"Penukar Mol 4-Penjuru (Zarah, Mol, Jisim & Gas) + Simulasi Zarah","labProps":{"substance":"O2","mol":2,"cond":"bilik"},"examTip":"Perangkap klasik Contoh 5 & Aktiviti 3.5: Dalam 1 molekul O2 ada 2 atom O! Jadi jika soalan tanya bilangan ATOM dalam 2 mol O2, darabkan bilangan molekul dengan 2 -> 2 x (2 x 6.02 x 10^23) = 2.408 x 10^24 atom O."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Bilangan Molekul vs Atom","voiceCaption":"Ramalkan bilangan atom oksigen dan jumlah ion yang terkandung dalam sampel oksigen dan kuprum dua oksida.","voiceScript":"[curious] Mari uji ketelitian kamu antara perkataan molekul dengan atom! Dalam sebuah balang berisi dua mol gas oksigen O dua, berapakah bilangan molekul oksigen berbanding bilangan atom oksigen di dalamnya?","hook":"Sahkan perbezaan bilangan molekul dengan bilangan atom pada Penukar Mol 4-Penjuru selepas memilih!","scenario":"Sebuah balang gas mengandungi tepat 2.0 mol gas oksigen (O2). [Pemalar Avogadro, NA = 6.02 x 10^23 mol^-1]","prompt":"Apakah pasangan bilangan MOLEKUL oksigen (O2) dan bilangan ATOM oksigen (O) yang tepat dalam balang tersebut?","options":["1.204 x 10^24 molekul O2  dan  1.204 x 10^24 atom O","1.204 x 10^24 molekul O2  dan  2.408 x 10^24 atom O","6.02 x 10^23 molekul O2  dan  1.204 x 10^24 atom O","2.408 x 10^24 molekul O2  dan  4.816 x 10^24 atom O"],"correctIndex":1,"proofLabId":"kim43_mol_triangle_lab","proofState":{"substance":"O2","mol":2,"cond":"bilik"},"explanation":"Bilangan molekul O2 = 2 x 6.02 x 10^23 = 1.204 x 10^24 molekul. Oleh sebab setiap molekul O2 terbina daripada 2 atom O, bilangan atom O = 1.204 x 10^24 x 2 = 2.408 x 10^24 atom O."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Jisim Molar & Isi Padu Molar Gas","voiceCaption":"Jisim molar menyamai nilai JAR, JMR atau JFR dalam unit gram per mol, manakala isi padu molar gas ialah dua puluh dua perpuluhan empat desimeter padu pada S T P dan dua puluh empat desimeter padu pada keadaan bilik.","voiceScript":"[warm] Bagaimana pula kita menukar mol kepada jisim di atas penimbang dan isi padu gas di dalam picagari? Mudah sahaja! Jisim molar ialah jisim satu mol bahan dalam unit gram per mol, dan nilainya menyamai J A R, J M R atau J F R bahan itu! Bagi gas pula, satu mol sebarang gas menempati isi padu yang sama iaitu dua puluh dua perpuluhan empat desimeter padu pada S T P dan dua puluh empat desimeter padu pada keadaan bilik!","title":"Jisim Molar (g mol^-1) & Isi Padu Molar Gas (STP vs Keadaan Bilik)","acronym":"M•22.4•24","hook":"1 mol gas ringan Ne mahupun 1 mol gas berat NO2 menempati isi padu yang SAMA TEPAT pada suhu dan tekanan yang sama!","mediaKey":"kim43_molar_volume_gas","summary":"Bilangan mol bertindak sebagai perantaraan utama menghubungkan jisim bahan (melalui jisim molar) dan isi padu gas (melalui isi padu molar pada STP atau keadaan bilik).","bullets":["Jisim Molar (g mol^-1): Jisim bagi 1 mol bahan; nilainya menyamai JAR (atom, cth. Cu = 64 g mol^-1), JMR (molekul, cth. SO2 = 64 g mol^-1) atau JFR (ion, cth. K2O = 94 g mol^-1). Rumus: n = Jisim (g) / Jisim molar (g mol^-1).","Isi Padu Molar Gas: Isi padu yang ditempati oleh 1 mol sebarang gas — 22.4 dm^3 mol^-1 pada STP (0 °C, 1 atm) atau 24 dm^3 mol^-1 pada keadaan bilik (25 °C, 1 atm). Awas: 1 dm^3 = 1000 cm^3 (contoh 600 cm^3 O2 pada bilik = 0.6 / 24 = 0.025 mol)."],"formula":"n = Jisim (g) / Jisim molar   |   n = Isi padu gas (dm^3) / Isi padu molar (22.4 atau 24)","labId":"kim43_mol_triangle_lab","labTitle":"Hab Penukaran 4-Penjuru (Rajah 3.9) & Simulasi Zarah Gas","labProps":{"substance":"CO2","mol":0.6,"cond":"bilik"},"examTip":"Soalan kerapkali memberi isi padu dalam sentimeter padu (cm^3) seperti 672 cm^3 atau 48 cm^3 — sentiasa bahagi 1000 dahulu untuk menukar kepada dm^3 sebelum membahagi dengan 22.4 atau 24!"},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Rumus & Faktor Penukaran Mol","voiceCaption":"Padankan lima konsep dan pengiraan mol berikut dengan nilai atau faktor penukarannya yang tepat.","voiceScript":"[confident] Uji penguasaan kad memori segi tiga mol kamu! Padankan lima situasi berikut dengan faktor atau hasil pengiraan tepatnya.","prompt":"Padankan pengiraan atau syarat berikut dengan nilai tepatnya [JAR: C=12, O=16, Al=27, S=32, K=39]:","pairs":[{"id":"u2m1","left":"Jisim 1.5 mol aluminium, Al (Contoh 6)","right":"40.5 g (1.5 x 27)"},{"id":"u2m2","left":"Bilangan mol dalam 32 g gas SO2 (Contoh 7)","right":"0.5 mol (32 / 64)"},{"id":"u2m3","left":"Bilangan mol dalam 4.7 g kalium oksida, K2O (Contoh 8)","right":"0.05 mol (4.7 / 94)"},{"id":"u2m4","left":"Isi padu 2.2 mol gas H2 pada STP (Contoh 9)","right":"49.28 dm^3 (2.2 x 22.4)"},{"id":"u2m5","left":"Isi padu 0.01 mol gas NH3 pada keadaan bilik (Contoh 10)","right":"240 cm^3 (0.24 dm^3)"}],"explanation":"Sentiasa tukarkan unit cm^3 <-> dm^3 dengan faktor 1000 dan pastikan jisim molar dikira tepat daripada formula bahan."},{"type":"predict","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Ramal Bilangan Molekul dari Isi Padu Gas","voiceCaption":"Berdasarkan Contoh tiga belas, ramalkan bilangan molekul gas hidrogen dalam enam ratus tujuh puluh dua sentimeter padu pada S T P.","voiceScript":"[curious] Cuba selesaikan penukaran dua langkah Contoh tiga belas! Berapakah bilangan molekul gas hidrogen yang terdapat di dalam enam ratus tujuh puluh dua sentimeter padu gas hidrogen pada keadaan S T P?","hook":"Gunakan Penukar Mol 4-Penjuru untuk mengesahkan nilai mol perantaraan bagi 672 cm^3 gas H2 pada STP!","scenario":"Satu picagari mengandungi 672 cm^3 gas hidrogen, H2 pada suhu dan tekanan piawai (STP = 22.4 dm^3 mol^-1; NA = 6.02 x 10^23 mol^-1).","prompt":"Berapakah bilangan molekul H2 yang terkandung di dalam sampel 672 cm^3 tersebut pada STP?","options":["1.806 x 10^22 molekul","1.806 x 10^23 molekul","3.01 x 10^22 molekul","1.68 x 10^22 molekul"],"correctIndex":0,"proofLabId":"kim43_mol_triangle_lab","proofState":{"substance":"H2","mol":0.03,"cond":"stp"},"explanation":"Langkah 1: 672 cm^3 = 0.672 dm^3, maka n = 0.672 / 22.4 = 0.03 mol. Langkah 2: Bilangan molekul = 0.03 x 6.02 x 10^23 = 1.806 x 10^22 molekul."},{"type":"sort","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Isih Syarat STP vs Keadaan Bilik & Entiti","voiceCaption":"Kelaskan enam pernyataan mengenai gas dan entiti bahan berikut kepada kategori STP atau Keadaan Bilik.","voiceScript":"[confident] Pastikan kamu tidak tertukar antara syarat S T P dengan Keadaan Bilik! Isihkan keenam-enam fakta berikut ke kategori yang betul.","prompt":"Isihkan pernyataan berikut kepada kategori STP (0 °C) atau Keadaan Bilik (25 °C):","buckets":[{"id":"stp","label":"STP (Suhu & Tekanan Piawai)"},{"id":"bilik","label":"Keadaan Bilik"}],"items":[{"text":"Suhu 0 °C dan tekanan 1 atm","bucketId":"stp","note":"Takrif piawai STP (Lensa Kimia)"},{"text":"Isi padu molar gas = 24 dm^3 mol^-1 (24 000 cm^3 mol^-1)","bucketId":"bilik","note":"Suhu lebih tinggi menjadikan isi padu gas lebih besar sedikit"},{"text":"Isi padu molar gas = 22.4 dm^3 mol^-1","bucketId":"stp","note":"Nilai piawai tepat pada 0 °C, 1 atm"},{"text":"Suhu 25 °C dan tekanan 1 atm","bucketId":"bilik","note":"Keadaan makmal suhu bilik piawai KSSM"},{"text":"39.2 dm^3 gas CO2 bersamaan tepat 1.75 mol gas (Aktiviti 3.7)","bucketId":"stp","note":"39.2 / 22.4 = 1.75 mol"},{"text":"0.2 mol CH4 + 0.3 mol C2H6 menempati jumlah isi padu 12 dm^3 (Aktiviti 3.7)","bucketId":"bilik","note":"(0.2 + 0.3) x 24 = 0.5 x 24 = 12 dm^3"}],"explanation":"STP (0 °C, 1 atm -> 22.4 dm^3 mol^-1) manakala Keadaan Bilik (25 °C, 1 atm -> 24 dm^3 mol^-1). Kedua-dua keadaan tidak mempengaruhi bilangan zarah dalam 1 mol."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Susun Jalan Kerja Contoh 12","voiceCaption":"Susun langkah penyelesaian Contoh dua belas untuk menghitung isi padu dua puluh enam perpuluhan empat gram karbon dioksida pada keadaan bilik.","voiceScript":"[confident] Susun semula urutan langkah penyelesaian Contoh dua belas daripada jisim karbon dioksida kepada isi padu gas pada keadaan bilik!","prompt":"Susun langkah pengiraan isi padu 26.4 g gas CO2 (JMR = 44) pada keadaan bilik (24 dm^3 mol^-1):","hint":"Mula dengan menentukan jisim molar dan bilangan mol dahulu...","answerTokens":["Hitung jisim molar CO2 iaitu 44 g mol^-1","kemudian bahagikan 26.4 g dengan 44 mendapat 0.6 mol","lalu darabkan 0.6 mol dengan 24 dm^3 mol^-1","untuk memperoleh 14.4 dm^3 gas CO2"],"distractors":["bahagikan 26.4 g terus dengan 22.4 dm^3","darabkan 44 dengan Pemalar Avogadro dahulu"],"explanation":"Semua penukaran berbilang langkah wajib melalui jambatan Bilangan Mol (n): Jisim -> (÷ Jisim Molar) -> Mol -> (x Isi Padu Molar) -> Isi Padu Gas."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Bandingkan Bilangan Molekul & Jisim Molar Gas","voiceCaption":"Selesaikan Uji Kendiri tiga perpuluhan dua membandingkan bilangan molekul empat gram gas hidrogen dengan empat belas gram gas nitrogen.","voiceScript":"[excited] Soalan penutup Unit dua terus daripada Uji Kendiri tiga perpuluhan dua! Mengapakah empat gram gas hidrogen mempunyai bilangan molekul yang lebih banyak daripada empat belas gram gas nitrogen, dan berapakah jisim molar suatu gas yang empat desimeter padunya berjisim dua belas gram pada keadaan bilik?","stimulusHtml":"<div class='stimulus-note'><strong>Uji Kendiri 3.2 (No. 6 &amp; 7):</strong> JAR H = 1, N = 14; Isi padu molar keadaan bilik = 24 dm<sup>3</sup> mol<sup>-1</sup>. Bandingkan <strong>4 g H<sub>2</sub></strong> vs <strong>14 g N<sub>2</sub></strong>, dan cari jisim molar gas apabila 4 dm<sup>3</sup> berjisim 12 g pada keadaan bilik.</div>","prompt":"Manakah kesimpulan dan pengiraan yang TEPAT bagi kedua-dua soalan Uji Kendiri 3.2 tersebut?","options":["Setuju: 4 g H2 (2 mol) ada lebih banyak molekul daripada 14 g N2 (0.5 mol)  |  Jisim molar gas = 72 g mol^-1","Tidak setuju: 14 g N2 lebih berat maka mempunyai lebih banyak molekul  |  Jisim molar gas = 48 g mol^-1","Setuju: 4 g H2 = 4 mol dan 14 g N2 = 1 mol  |  Jisim molar gas = 36 g mol^-1","Tidak setuju: kedua-duanya mempunyai 1 mol  |  Jisim molar gas = 72 g mol^-1"],"correctIndex":0,"explanation":"4 g H2 (JMR 2) = 4/2 = 2 mol; 14 g N2 (JMR 28) = 14/28 = 0.5 mol (jadi H2 ada 4x ganda lebih banyak molekul!). Bagi gas 4 dm^3 pada bilik: n = 4/24 = 1/6 mol -> Jisim molar = 12 / (1/6) = 72 g mol^-1."}]},{"id":"kim43-u3","title":"Unit 3: Formula Kimia, Formula Empirik & Eksperimen MgO vs CuO","subtitle":"Subtopik 3.3 (Bhg. A) — Formula Empirik vs Molekul, Aktiviti 3.12 (MgO) & Aktiviti 3.13 (CuO)","iconType":"formula","iconUrl":"../assets/icons/kim43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Formula Empirik vs Formula Molekul","voiceCaption":"Formula empirik menunjukkan nisbah paling ringkas bilangan atom setiap unsur, manakala formula molekul menunjukkan bilangan sebenar atom dalam satu molekul.","voiceScript":"[warm] Selamat datang ke Unit tiga, Formula Kimia dan Eksperimen Formula Empirik! Formula kimia menggunakan simbol huruf dan nombor subskrip tanpa menulis subskrip satu. Bezakan formula empirik yang hanya menunjukkan nisbah paling ringkas bilangan atom seperti C H dua O bagi glukosa, berbanding formula molekul yang menunjukkan bilangan sebenar atom seperti C enam H dua belas O enam!","title":"Maksud Formula Kimia, Formula Empirik vs Formula Molekul","acronym":"FE•FM","hook":"Air (H2O) berkongsi formula empirik dan molekul yang sama, tetapi glukosa (C6H12O6) dan asid etanoik (C2H4O2) berkongsi formula empirik CH2O yang serupa!","mediaKey":"kim43_mgo_crucible","summary":"Formula kimia mewakili bahan dengan simbol unsur dan subskrip; formula molekul merupakan gandaan integer n bagi formula empirik.","bullets":["Formula Kimia & Subskrip: Menunjukkan jenis unsur (huruf simbol) dan nisbah/bilangan atom (nombor subskrip; nombor 1 tidak ditulis). Unsur logam/gas adi ialah bahan atom (Mg), gas dwiatom ialah molekul (O2), dan sebatian seperti Al2O3 menunjukkan 2 atom Al bergabung dengan 3 atom O.","Formula Empirik vs Formula Molekul: Formula empirik = nisbah paling ringkas bilangan atom setiap jenis unsur (cth. CH bagi benzena C6H6). Formula molekul = bilangan sebenar atom dalam 1 molekul sebatian, dengan hubungan: Formula molekul = (Formula empirik)n."],"formula":"Formula molekul = (Formula empirik)n   |   n = JMR sebatian / Jisim formula empirik","labId":"kim43_empirical_exp_lab","labTitle":"Kalkulator Formula Empirik, Jadual 4-Baris & Eksperimen MgO/CuO","labProps":{"tab":"jadual","caseKey":"Benzena"},"examTip":"Uji Kendiri 3.3 No.2 & Cabaran Minda: Untuk mencari formula empirik daripada formula molekul seperti kafeina C8H10N4O2 atau heksana C6H14, bahagikan semua subskrip dengan faktor sepunya terbesar -> C4H5N2O dan C3H7!"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Formula Molekul & Empirik","voiceCaption":"Padankan lima sebatian daripada Jadual tiga perpuluhan tiga dan Uji Kendiri dengan formula empirik serta nilai n tepatnya.","voiceScript":"[confident] Uji kepantasan kamu meringkaskan nisbah atom! Padankan lima bahan berikut dengan formula empirik dan nilai gandaan n yang tepat.","prompt":"Padankan setiap bahan dan formula molekulnya dengan formula empirik yang tepat:","pairs":[{"id":"u3m1","left":"Glukosa, C6H12O6","right":"CH2O (n = 6)"},{"id":"u3m2","left":"Hidrazin, N2H4","right":"NH2 (n = 2)"},{"id":"u3m3","left":"Propena, C3H6","right":"CH2 (n = 3)"},{"id":"u3m4","left":"Benzena, C6H6","right":"CH (n = 6)"},{"id":"u3m5","left":"Kafeina, C8H10N4O2 (Uji Kendiri 3.3)","right":"C4H5N2O (n = 2)"}],"explanation":"Bahagikan subskrip dengan faktor sepunya terbesar: C8H10N4O2 ÷ 2 = C4H5N2O; C6H6 ÷ 6 = CH; N2H4 ÷ 2 = NH2."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Eksperimen Formula Empirik MgO vs CuO","voiceCaption":"Logam reaktif seperti magnesium dibakar dalam mangkuk pijar, manakala oksida logam kurang reaktif seperti kuprum dua oksida diturunkan menggunakan aliran gas hidrogen.","voiceScript":"[warm] Sekarang masuk ke jantung eksperimen kertas dua dan amali S P M: penentuan formula empirik magnesium oksida dan kuprum dua oksida! Tonton video penerangan bersuara ini untuk membandingkan kedua-dua radas: magnesium yang reaktif dibakar dalam mangkuk pijar sambil membuka penutup sekali-sekala, manakala kuprum yang kurang reaktif memerlukan aliran gas hidrogen berterusan termasuk semasa penyejukan!","title":"Eksperimen Makmal: Magnesium Oksida (Akt. 3.12) vs Kuprum(II) Oksida (Akt. 3.13)","acronym":"MgO•CuO","hook":"Mengapa kuprum(II) oksida TIDAK boleh dibakar terus di udara seperti pita magnesium? Jawapannya pada kedudukan kereaktifan logam!","mediaKey":"kim43_cuo_reduction","videoClip":{"src":"../assets/kimia-t4-bab03/video/kim43_video_formula_empirik_stoikiometri_narasi.mp4","hasNarration":true,"posterKey":"kim43_cuo_reduction","caption":"Video Penerangan Bersuara (BM): Eksperimen Formula Empirik MgO (Mangkuk Pijar) vs CuO (Aliran Gas Hidrogen) serta pengiraan stoikiometri"},"summary":"Dua kaedah berbeza digunakan bergantung kepada kereaktifan logam: pembakaran langsung dalam oksigen (logam reaktif: Mg, Al, Zn) atau penurunan oksida oleh gas hidrogen (logam kurang reaktif daripada H2: Cu, Pb, Sn).","bullets":["Aktiviti 3.12 — Magnesium Oksida (MgO): (1) Gosok pita Mg dengan kertas pasir untuk buang lapisan oksida. (2) Panaskan dalam mangkuk pijar, tutup apabila mula menyala bagi elak wasap putih MgO terbebas keluar. (3) Buka penutup sedikit sekali-sekala & tutup pantas untuk benarkan O2 masuk. (4) Ulang pemanasan, penyejukan & penimbangan hingga jisim tetap.","Aktiviti 3.13 — Kuprum(II) Oksida (CuO): (1) Gas H2 daripada tindak balas ketulan Zn + HCl 1.0 mol dm^-3 dialirkan 10 saat dahulu untuk menyingkirkan udara (elak letupan!). (2) Panaskan CuO hitam hingga bertukar perang (Cu), lap titisan air di hujung salur dengan putik kapas. (3) Teruskan aliran gas H2 semasa menyejuk ke suhu bilik supaya Cu panas tidak teroksida semula!"],"labId":"kim43_empirical_exp_lab","labTitle":"Simulator Makmal Aktiviti 3.12 (MgO) & Aktiviti 3.13 (CuO)","labProps":{"tab":"mgo"},"examTip":"Skema Kertas 2 SPM: Untuk menentukan sama ada logam sesuai guna kaedah mangkuk pijar atau gas H2, semak kereaktifan — Mg, Al, Zn guna mangkuk pijar; Cu, Pb, Sn (kurang reaktif daripada H2) guna penurunan aliran H2."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Logam & Prosedur MgO vs CuO","voiceCaption":"Kelaskan enam bahan atau langkah amali berikut kepada Kaedah Pembakaran Mangkuk Pijar atau Kaedah Penurunan Gas Hidrogen.","voiceScript":"[confident] Uji penguasaan prosedur eksperimen kamu! Asingkan keenam-enam logam dan langkah kerja berikut kepada kaedah yang tepat.","prompt":"Isihkan logam dan langkah prosedur berikut antara Kaedah Mangkuk Pijar (seperti MgO) dengan Kaedah Aliran Gas H2 (seperti CuO):","buckets":[{"id":"mgo","label":"Kaedah Mangkuk Pijar (Logam Reaktif)"},{"id":"cuo","label":"Kaedah Aliran Gas H2 (Logam Kurang Reaktif)"}],"items":[{"text":"Menentukan formula empirik zink oksida dan aluminium oksida","bucketId":"mgo","note":"Zn dan Al ialah logam reaktif terhadap oksigen"},{"text":"Menentukan formula empirik plumbum(II) oksida dan stanum(IV) oksida","bucketId":"cuo","note":"Pb dan Sn kurang reaktif daripada hidrogen"},{"text":"Membuka penutup sedikit secara sekali-sekala dan menutup pantas dengan penyepit","bucketId":"mgo","note":"Memasukkan oksigen sambil mengekang wasap putih MgO"},{"text":"Menggunakan ketulan zink dan asid hidroklorik 1.0 mol dm^-3","bucketId":"cuo","note":"Menjana gas hidrogen berterusan ke dalam salur kaca"},{"text":"Menggosok pita logam dengan kertas pasir sehingga berkilat","bucketId":"mgo","note":"Menyingkirkan lapisan oksida di permukaan pita"},{"text":"Membiarkan gas hidrogen mengalir 10 saat sebelum memanaskan salur kaca","bucketId":"cuo","note":"Menyahkan udara supaya tiada campuran H2 + O2 yang meletup"}],"explanation":"Logam reaktif (Mg, Al, Zn) ditimbang dan dibakar dalam mangkuk pijar, manakala oksida logam kurang reaktif (Cu, Pb, Sn) diturunkan dalam aliran gas H2."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Kesan Hentikan H2 Semasa Sejuk","voiceCaption":"Ramalkan pemerhatian dan kesan ke atas data jika murid menghentikan aliran gas hidrogen sejurus selepas memadamkan lampu spirit dalam Aktiviti Kuprum Dua Oksida.","voiceScript":"[curious] Cuba ramalkan! Dalam Aktiviti penentuan formula empirik kuprum dua oksida, seorang murid memadamkan lampu spirit apabila semua serbuk hitam menjadi perang, lalu dia terus menutup salur gas hidrogen ketika salur kaca masih panas. Apakah yang berlaku?","hook":"Lihat kesan pengoksidaan semula di Simulator Aktiviti 3.13 selepas menjawab!","scenario":"Serbuk kuprum(II) oksida hitam baru sahaja bertukar sepenuhnya kepada serbuk kuprum perang. Lampu spirit dipadamkan dan aliran gas H2 turut dihentikan serta-merta.","prompt":"Apakah kesan tindakan tersebut terhadap serbuk kuprum dan keputusan formula empirik eksperimen?","options":["Kuprum panas bertindak balas semula dengan oksigen di udara membentuk serbuk hitam kuprum(II) oksida, menyebabkan jisim oksigen yang dihitung menjadi terlalu kecil","Kuprum bertukar menjadi wasap putih yang terbebas keluar dari salur kaca","Kuprum perang bertindak balas dengan air suling membentuk magnesium oksida","Jisim kuprum berkurang secara mendadak kerana hidrogen meresap keluar"],"correctIndex":0,"proofLabId":"kim43_empirical_exp_lab","proofState":{"tab":"cuo","purge10s":true,"coolFlowH2":false},"explanation":"Aliran gas H2 wajib diteruskan sehingga salur kaca menyejuk ke suhu bilik! Jika dihentikan awal, udara masuk dan mengoksidakan semula kuprum panas menjadi CuO hitam, mengurangkan jisim O yang dikira."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Tujuan Ulang Hingga Jisim Tetap","voiceCaption":"Susun jawapan tepat Kertas dua mengapa pemanasan, penyejukan dan penimbangan perlu diulang sehingga jisim tetap diperoleh.","voiceScript":"[confident] Soalan ini paling kerap keluar dalam Kertas dua untuk kedua-dua eksperimen magnesium oksida dan kuprum dua oksida! Susun blok ayat bagi menerangkan tujuan mengulang pemanasan, penyejukan dan penimbangan sehingga jisim tetap diperoleh.","prompt":"Susun penjelasan tujuan mengulang proses pemanasan, penyejukan dan penimbangan sehingga jisim tetap diperoleh:","hint":"Mulakan dengan memastikan bahan bertindak balas dengan...","answerTokens":["Untuk memastikan","semua magnesium atau kuprum(II) oksida","telah bertindak balas","dengan lengkap"],"distractors":["supaya wasap putih terbebas keluar","untuk mempercepatkan penyejukan penimbang"],"explanation":"Frasa markah penuh Kertas 2 SPM: 'Untuk memastikan semua logam / oksida logam telah bertindak balas dengan lengkap'."},{"type":"predict","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Ramal Formula Empirik Aluminium Oksida","voiceCaption":"Berdasarkan Contoh empat belas, ramalkan formula empirik apabila satu perpuluhan tiga lima gram aluminium berpadu dengan satu perpuluhan dua gram oksigen.","voiceScript":"[curious] Mari selesaikan Contoh empat belas! Satu perpuluhan tiga lima gram aluminium berpadu dengan satu perpuluhan dua gram oksigen. Apabila bilangan mol dibahagi nilai terkecil, nisbahnya ialah satu kepada satu perpuluhan lima. Apakah langkah seterusnya dan formula empiriknya?","hook":"Semak jadual 4-baris pengiraan Contoh 14 di Simulator Jadual selepas memilih!","scenario":"1.35 g aluminium (JAR Al = 27) berpadu lengkap dengan 1.20 g oksigen (JAR O = 16). Bilangan mol Al = 0.05 mol; Bilangan mol O = 0.075 mol.","prompt":"Apakah nisbah integer paling ringkas dan formula empirik bagi aluminium oksida tersebut?","options":["Biarkan nisbah 1 : 1.5 lalu bundarkan kepada AlO","Darab kedua-dua nisbah dengan 2 menjadi 2 : 3, maka formula empirik ialah Al2O3","Darab kedua-dua nisbah dengan 3 menjadi 3 : 4.5, maka Al3O4","Bahagi kedua-dua nilai dengan 0.075 lalu bundarkan menjadi AlO2"],"correctIndex":1,"proofLabId":"kim43_empirical_exp_lab","proofState":{"tab":"jadual","caseKey":"Al2O3"},"explanation":"Nisbah 1 : 1.5 TIDAK boleh dibundarkan kepada 1 : 2 atau 1 : 1! Darabkan kedua-dua nilai dengan 2 untuk mendapat integer paling ringkas 2 : 3 -> Al2O3."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s8","voiceToneLabel":"Cari JAR Unsur & Formula Molekul","voiceCaption":"Selesaikan Contoh enam belas mencari jisim atom relatif unsur Y serta Aktiviti tiga perpuluhan empat belas mencari formula molekul asid etanoik.","voiceScript":"[excited] Cabaran penutup Unit tiga menggabungkan Contoh enam belas dengan Aktiviti tiga perpuluhan empat belas! Hitungkan jisim atom relatif unsur Y dalam sebatian Y B R dua serta formula molekul asid etanoik berjisim molar enam puluh gram per mol!","stimulusHtml":"<div class='stimulus-note'><strong>Kes A (Contoh 16):</strong> 1.2 g unsur Y bertindak balas dengan bromin (JAR Br = 80) menghasilkan 6.0 g sebatian <strong>YBr<sub>2</sub></strong>.<br><strong>Kes B (Aktiviti 3.14 No.1):</strong> Asid etanoik mempunyai formula empirik <strong>CH<sub>2</sub>O</strong> dan jisim molar 60 g mol<sup>-1</sup> [C=12, H=1, O=16].</div>","prompt":"Apakah JAR bagi unsur Y dan formula molekul bagi asid etanoik tersebut?","options":["JAR Y = 40  |  Formula molekul asid etanoik = C2H4O2","JAR Y = 20  |  Formula molekul asid etanoik = C2H4O2","JAR Y = 40  |  Formula molekul asid etanoik = C3H6O3","JAR Y = 80  |  Formula molekul asid etanoik = CH2O"],"correctIndex":0,"explanation":"Kes A: Jisim Br = 6.0 - 1.2 = 4.8 g -> Mol Br = 4.8/80 = 0.06 mol. Oleh sebab YBr2 (nisbah 1:2), mol Y = 0.03 mol -> JAR Y = 1.2 / 0.03 = 40. Kes B: JMR CH2O = 30 -> n = 60/30 = 2 -> (CH2O)2 = C2H4O2."}]},{"id":"kim43-u4","title":"Unit 4: Formula Sebatian Ion (Silang Caj) & Penamaan IUPAC","subtitle":"Subtopik 3.3 (Bhg. B) — Jadual Ion 3.7, Kaedah Silang Caj, Angka Roman & Awalan Yunani","iconType":"atom","iconUrl":"../assets/icons/kim43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kaedah Silang Caj Sebatian Ion","voiceCaption":"Formula sebatian ion dibina dengan menyilangkan magnitud cas kation dan anion supaya jumlah cas positif dan negatif ialah sifar.","voiceScript":"[warm] Selamat datang ke Unit empat! Setiap sebatian ion bersifat neutral secara elektrik kerana jumlah cas positif kation dan cas negatif anion sentiasa sifar. Menggunakan kaedah silang caj, tukarkan sahaja nilai caj kation dan anion secara bersilang menjadi subskrip! Jom uji sendiri Pembina Silang Caj di bawah dan perhatikan bila kurungan wajib diletakkan pada ion poliatom!","title":"Kation, Anion & Kaedah Silang Caj Sebatian Ion (Jadual 3.7)","acronym":"CAT•ANI•0","hook":"Ion poliatom seperti NO3-, SO4^2-, CO3^2- dan NH4+ bertindak sebagai satu pakej utuh — jika bilangannya melebihi 1, wajib dipagari kurungan!","mediaKey":"kim43_ionic_crystals","summary":"Sebatian ion terdiri daripada kation (+) dan anion (-); formulanya ditulis menggunakan kaedah silang caj serta diringkaskan kepada nisbah integer paling rendah.","bullets":["Senarai Kation & Anion Jadual 3.7: Kation lazim meliputi +1 (Na+, K+, Ag+, NH4+), +2 (Mg2+, Ca2+, Zn2+, Cu2+, Fe2+, Pb2+) dan +3 (Al3+, Fe3+). Anion lazim meliputi -1 (Cl-, Br-, I-, OH-, NO3-, MnO4-), -2 (O2-, CO3^2-, SO4^2-, S2O3^2-, Cr2O7^2-) dan -3 (PO4^3-).","3 Peraturan Emas Silang Caj (Rajah 3.16): (1) Saling tukar magnitud cas kation dan anion sebagai subskrip (cth. Zn2+ & Cl- -> ZnCl2). (2) Letak kurungan pada ion poliatom apabila bilangan > 1 (cth. Al2(SO4)3, Mg(NO3)2, tetapi NH4Cl tiada kurungan). (3) Ringkaskan nisbah jika boleh dibahagi (cth. Ca2+ & CO3^2- -> CaCO3)."],"formula":"Sebatian Ion Neutral:  (Bilangan kation x Caj +) + (Bilangan anion x Caj -) = 0","labId":"kim43_ion_flip_builder_lab","labTitle":"Pembina Formula Silang Caj Interaktif (Jadual 3.7)","labProps":{"tab":"silang","cation":"Al3+","anion":"SO4^2-"},"examTip":"Kesilapan paling kerap dalam SPM: Menulis MgNO32 tanpa kurungan (salah!) atau Ca2(CO3)2 tanpa meringkaskan nisbah 2:2 kepada 1:1 (CaCO3)."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Nama & Formula Sebatian Ion","voiceCaption":"Padankan lima nama sebatian ion daripada Aktiviti tiga perpuluhan lima belas dengan formula kimia tepatnya.","voiceScript":"[confident] Uji kemahiran silang caj kamu! Padankan lima nama sebatian ion berikut dengan formula kimianya yang tepat.","prompt":"Padankan nama sebatian ion berikut dengan formula kimia tepatnya:","pairs":[{"id":"u4m1","left":"Kalium oksida (K+ & O^2-)","right":"K2O"},{"id":"u4m2","left":"Magnesium nitrat (Mg^2+ & NO3^-)","right":"Mg(NO3)2"},{"id":"u4m3","left":"Aluminium oksida (Al^3+ & O^2-)","right":"Al2O3"},{"id":"u4m4","left":"Zink sulfat (Zn^2+ & SO4^2-)","right":"ZnSO4"},{"id":"u4m5","left":"Ammonium karbonat (NH4^+ & CO3^2-)","right":"(NH4)2CO3"}],"explanation":"Mg^2+ + NO3^- memerlukan kurungan -> Mg(NO3)2; Zn^2+ + SO4^2- mempunyai caj sama (+2 dan -2) lalu diringkaskan menjadi ZnSO4; NH4^+ + CO3^2- -> (NH4)2CO3."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Penamaan IUPAC & Awalan Yunani","voiceCaption":"Logam berbilang cas menggunakan angka Roman dalam penamaan sebatian ion, manakala sebatian molekul ringkas menggunakan awalan Yunani dan akhiran ida.","voiceScript":"[warm] Sekarang lengkapkan kemahiran menamakan sebatian kimia mengikut piawai I U P A C! Bagi logam peralihan yang membentuk lebih daripada satu jenis ion seperti ferum dua dan ferum tiga, angka Roman wajib ditulis untuk membezakan nombor pengoksidaannya! Bagi sebatian molekul ringkas seperti karbon dioksida pula, gunakan awalan Yunani seperti mono, di, tri, tetra hingga hepta bersama akhiran ida! Selak semua kad tiga dimensi di bawah untuk menghafalnya dengan pantas!","title":"Penamaan Sebatian Ion (Angka Roman) & Sebatian Molekul (Awalan Yunani)","acronym":"ROMAN•YUN","hook":"Ferum(II) oksida (FeO) dan Ferum(III) oksida (Fe2O3) dua-duanya sebatian besi dengan oksigen — tanpa angka Roman, ahli kimia akan tersalah guna bahan!","summary":"Sistem penamaan kimia membezakan sebatian ion (kation diikuti anion, dengan angka Roman bagi logam berbilang cas) daripada sebatian molekul ringkas (awalan Yunani + akhiran '-ida').","bullets":["Penamaan Sebatian Ion & Angka Roman (Jadual 3.8): Nama kation ditulis dahulu diikuti nama anion (cth. natrium klorida, magnesium nitrat). Bagi logam yang mempunyai lebih daripada satu jenis ion, angka Roman wajib dinyatakan: Fe^2+ -> Ferum(II) oksida (FeO); Fe^3+ -> Ferum(III) oksida (Fe2O3); begitu juga Kuprum(II) dan Plumbum(II).","Penamaan Sebatian Molekul Ringkas: Unsur lebih elektropositif dinamakan dahulu (kekal nama asal), diikuti unsur lebih elektronegatif dengan akhiran '-ida' serta awalan Yunani menunjukkan bilangan atom: mono- (1), di- (2), tri- (3), tetra- (4), pent- (5), heks- (6), hept- (7), cth. CO (karbon monoksida), CCl4 (karbon tetraklorida), N2O3 (dinitrogen trioksida)."],"labId":"kim43_ion_flip_builder_lab","labTitle":"Dek Kad 3D Ion Poliatom, Angka Roman & Awalan Yunani","labProps":{"tab":"deck"},"examTip":"Awas perbezaan mutlak: Jangan sesekali menggunakan awalan Yunani ('diklorida', 'trioksida') untuk SEBATIAN ION seperti MgCl2 atau Al2O3 — awalan Yunani HANYA untuk sebatian molekul ringkas!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Sebatian Ion vs Sebatian Molekul","voiceCaption":"Kelaskan enam bahan kimia berikut kepada kumpulan Sebatian Ion atau Sebatian Molekul Ringkas.","voiceScript":"[confident] Bezakan aturan penamaan antara kedua-dua jenis sebatian! Asingkan enam bahan kimia berikut kepada Sebatian Ion atau Sebatian Molekul Ringkas.","prompt":"Isihkan enam bahan berikut mengikut jenis sebatian dan sistem penamaannya:","buckets":[{"id":"ion","label":"Sebatian Ion (Kation + Anion / Roman)"},{"id":"molekul","label":"Sebatian Molekul Ringkas (Awalan Yunani)"}],"items":[{"text":"Kuprum(II) sulfat, CuSO4","bucketId":"ion","note":"Gabungan kation Cu2+ (angka Roman II) dan anion SO4^2-"},{"text":"Karbon tetraklorida, CCl4","bucketId":"molekul","note":"Sebatian molekul bukan logam menggunakan awalan tetra- (4)"},{"text":"Sulfur trioksida, SO3","bucketId":"molekul","note":"Sebatian molekul dengan awalan tri- (3) dan akhiran -ida"},{"text":"Ammonium klorida, NH4Cl","bucketId":"ion","note":"Terbina daripada kation poliatom NH4+ dan anion Cl-"},{"text":"Boron trifluorida, BF3","bucketId":"molekul","note":"Sebatian molekul ringkas daripada Aktiviti 3.16"},{"text":"Ferum(III) oksida, Fe2O3","bucketId":"ion","note":"Menggunakan angka Roman III bagi ion Fe3+"}],"explanation":"Sebatian ion (logam/NH4+ + bukan logam/anion poliatom) tidak menggunakan awalan mono/di/tri, manakala sebatian molekul ringkas antara unsur bukan logam menggunakan awalan Yunani."},{"type":"predict","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Ramal Pembinaan Formula Ferum(III) Hidroksida","voiceCaption":"Ramalkan formula tepat bagi sebatian ferum tiga hidroksida menggunakan kaedah silang caj.","voiceScript":"[curious] Cuba ramalkan formula kimia bagi ferum tiga hidroksida! Gabungkan kation ferum tiga dengan anion hidroksida dan pastikan penulisan kurungan kamu tepat!","hook":"Sahkan silangan cas Fe3+ dan OH- pada Pembina Silang Caj selepas memilih jawapan!","scenario":"Satu larutan akueus mengandungi ion ferum(III), Fe^3+ ditindakbalaskan dengan larutan natrium hidroksida yang mengandungi ion hidroksida, OH^- menghasilkan mendakan perang ferum(III) hidroksida.","prompt":"Apakah formula kimia yang TEPAT bagi mendakan ferum(III) hidroksida tersebut?","options":["FeOH3","Fe(OH)3","Fe3(OH)","Fe2(OH)3"],"correctIndex":1,"proofLabId":"kim43_ion_flip_builder_lab","proofState":{"tab":"silang","cation":"Fe3+","anion":"OH-"},"explanation":"Caj Fe^3+ (+3) dan OH^- (-1) disilangkan memberi 1 ion Fe^3+ dan 3 ion OH^-. Oleh sebab OH^- ialah ion poliatom berbilangan 3, kurungan wajib diletakkan: Fe(OH)3!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Aturan Penamaan Sebatian Molekul","voiceCaption":"Susun blok fakta menerangkan cara menamakan sebatian molekul ringkas mengikut sistem I U P A C.","voiceScript":"[confident] Susun semula blok peraturan berikut untuk menghuraikan cara menamakan sebatian molekul ringkas dengan tepat!","prompt":"Susun peraturan penamaan sebatian molekul ringkas (seperti CO, SO3, CCl4):","hint":"Bermula dengan unsur yang lebih elektropositif...","answerTokens":["Unsur lebih elektropositif dinamakan dahulu","diikuti unsur lebih elektronegatif","dengan akhiran ida","serta awalan Yunani bagi bilangan atom"],"distractors":["menggunakan angka Roman bagi semua unsur","dan subskrip 1 sentiasa ditulis pada formula"],"explanation":"Penamaan sebatian molekul ringkas: Unsur lebih elektropositif (kekal nama) -> awalan Yunani + unsur lebih elektronegatif berakhiran '-ida' (cth. CS2 = karbon disulfida)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s7","voiceToneLabel":"Aktiviti 3.16: Penamaan Lengkap Sebatian","voiceCaption":"Selesaikan soalan Aktiviti tiga perpuluhan enam belas mengenai penamaan sebatian molekul dinitrogen trioksida dan sebatian ion kuprum serta kalium.","voiceScript":"[excited] Soalan penutup Unit empat terus daripada Aktiviti tiga perpuluhan enam belas dan Uji Kendiri tiga perpuluhan tiga! Kenal pasti himpunan nama I U P A C dan formula bahan ubat gigi yang paling tepat!","stimulusHtml":"<div class='stimulus-note'><strong>Aktiviti 3.16 &amp; Uji Kendiri 3.3 No.3:</strong> (1) Molekul terdiri daripada 2 atom nitrogen dan 3 atom oksigen. (2) Sebatian molekul <strong>CS<sub>2</sub></strong>. (3) Dua bahan aktif ubat gigi: <strong>Kalsium karbonat</strong> dan <strong>Natrium fluorida</strong>.</div>","prompt":"Manakah himpunan jawapan yang TEPAT bagi ketiga-tiga item di atas?","options":["Dinitrogen trioksida (N2O3)  |  Karbon disulfida  |  CaCO3 dan NaF","Nitrogen oksida (NO)  |  Karbon sulfida  |  Ca2CO3 dan Na2F","Dinitrogen trioksida (N2O3)  |  Dikarbon sulfida  |  Ca(CO3)2 dan NaF","Nitrogen(II) oksida (N2O3)  |  Karbon disulfida  |  CaCO3 dan NaF2"],"correctIndex":0,"explanation":"2 atom N + 3 atom O = N2O3 (Dinitrogen trioksida); CS2 = Karbon disulfida; Kalsium karbonat (Ca^2+ & CO3^2-) = CaCO3; Natrium fluorida (Na+ & F-) = NaF."}]},{"id":"kim43-u5","title":"Unit 5: Persamaan Kimia Seimbang & Pengiraan Stoikiometri","subtitle":"Subtopik 3.4 — Hukum Keabadian Jisim, Mengimbangi Persamaan, Aktiviti 3.18 & 3-Langkah Stoikiometri","iconType":"graph","iconUrl":"../assets/icons/kim43-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Menulis & Mengimbangi Persamaan Kimia","voiceCaption":"Persamaan kimia mesti seimbang mengikut hukum keabadian jisim dengan melaraskan pekali di hadapan formula tanpa mengubah subskrip.","voiceScript":"[warm] Selamat datang ke Unit lima, Persamaan Kimia dan Stoikiometri! Ingat Hukum Keabadian Jisim: jirim tidak boleh dicipta atau dimusnahkan, maka bilangan atom setiap unsur di sebelah kiri anak panah mesti sama dengan di sebelah kanan! Jangan sesekali ubah nombor subskrip formula semasa mengimbangi persamaan — sebaliknya laraskan hanya nombor pekali di hadapan formula, dan sertakan simbol keadaan fizik p, c e, g atau a k!","title":"5 Langkah Menulis & Mengimbangi Persamaan Kimia (Rajah 3.17)","acronym":"P•F•S•I•K","hook":"Mengubah subskrip H2O menjadi H2O2 bukan lagi air minuman — itu hidrogen peroksida! Sentiasa laraskan PEKALI di hadapan formula sahaja!","mediaKey":"kim43_pbi2_precipitate","summary":"Persamaan kimia mewakili tindak balas kimia menggunakan formula kimia bahan tindak balas (kiri) menghasilkan hasil tindak balas (kanan) dalam bilangan atom yang seimbang.","bullets":["5 Langkah Rajah 3.17: (1) Tulis persamaan perkataan (cth. Hidrogen + Oksigen -> Air). (2) Tukar kepada formula kimia betul (H2 + O2 -> H2O). (3) Semak keseimbangan atom kiri vs kanan. (4) Imbangkan dengan melaraskan pekali di hadapan formula (2H2 + O2 -> 2H2O). (5) Tulis keadaan fizik: (p) pepejal, (ce) cecair, (g) gas, (ak) akueus; huruf delta (Δ) di bawah anak panah menandakan pemanasan diperlukan.","Hukum Keabadian Jisim & Pekali: Bilangan setiap jenis atom sebelum dan selepas tindak balas mesti sama. Contoh Aktiviti 3.17: N2(g) + 3H2(g) -> 2NH3(g); 2Na(p) + 2H2O(ce) -> 2NaOH(ak) + H2(g); C3H8(g) + 5O2(g) -> 3CO2(g) + 4H2O(ce); 2AgNO3(p) -> 2Ag(p) + 2NO2(g) + O2(g)."],"formula":"2H2(g) + O2(g) -> 2H2O(ce)   |   2KClO3(p) -[Δ]-> 2KCl(p) + 3O2(g)","labId":"kim43_stoichiometry_balancer_lab","labTitle":"Makmal Pengimbang Persamaan Kimia & Pengira Stoikiometri","labProps":{"tab":"imbagi","eq":"PbI2"},"examTip":"Kesilapan lazim mengimbangi persamaan: Apabila diminta persamaan tindak balas Pb(NO3)2(ak) + KI(ak) -> PbI2(p) + KNO3(ak), pastikan kedua-dua KI dan KNO3 mempunyai pekali 2!"},{"type":"sort","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Isih Tafsiran Kualitatif vs Kuantitatif","voiceCaption":"Kelaskan enam pernyataan mengenai persamaan kimia natrium dan klorin kepada Aspek Kualitatif atau Aspek Kuantitatif.","voiceScript":"[confident] Setiap persamaan kimia membawa dua jenis maklumat utama kepada ahli kimia. Isihkan keenam-enam tafsiran persamaan berikut antara Aspek Kualitatif dengan Aspek Kuantitatif!","prompt":"Berdasarkan persamaan 2Na(p) + Cl2(g) -> 2NaCl(p), kelaskan pernyataan berikut kepada Tafsiran Kualitatif atau Kuantitatif:","buckets":[{"id":"kual","label":"Aspek Kualitatif (Identiti & Keadaan)"},{"id":"kuan","label":"Aspek Kuantitatif (Stoikiometri)"}],"items":[{"text":"Bahan tindak balas ialah logam natrium dan gas klorin","bucketId":"kual","note":"Mengenal pasti jenis bahan yang bertindak balas"},{"text":"2 mol natrium bertindak balas dengan 1 mol gas klorin menghasilkan 2 mol NaCl","bucketId":"kuan","note":"Nisbah bilangan mol daripada pekali persamaan"},{"text":"Hasil tindak balas ialah pepejal natrium klorida","bucketId":"kual","note":"Mengenal pasti hasil dan keadaan fiziknya (p)"},{"text":"2 atom natrium bergabung dengan 1 molekul klorin membentuk 2 unit formula NaCl","bucketId":"kuan","note":"Nisbah entiti asas zarah secara kuantitatif"},{"text":"Jika 1 mol Na bertindak balas, hanya 0.5 mol gas Cl2 diperlukan secara perkadaran","bucketId":"kuan","note":"Pengiraan perkadaran nisbah stoikiometri"},{"text":"Natrium berada dalam keadaan pepejal (p) manakala klorin berada dalam keadaan gas (g)","bucketId":"kual","note":"Maklumat keadaan fizik bahan tindak balas"}],"explanation":"Aspek kualitatif memberitahu APA bahan/hasil dan keadaan fiziknya; aspek kuantitatif (stoikiometri) memberitahu BERAPA nisbah zarah dan nisbah bilangan mol yang terlibat."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Aktiviti 3.18 & 3-Langkah Stoikiometri","voiceCaption":"Aktiviti tiga perpuluhan lapan belas mengkaji penguraian kuprum dua karbonat, pembentukan wasap putih ammonium klorida dan pemendakan plumbum dua iodida, diikuti kaedah tiga langkah stoikiometri.","voiceScript":"[warm] Jom teliti tiga tindak balas makmal ikonik Aktiviti tiga perpuluhan lapan belas beserta teknik menyelesaikan sebarang soalan kiraan stoikiometri! Pertama, penguraian terma serbuk hijau kuprum dua karbonat menghasilkan serbuk hitam kuprum dua oksida dan gas karbon dioksida yang mengeruhkan air kapur. Kedua, gas H C L dan ammonia membentuk wasap putih ammonium klorida. Ketiga, pemendakan mendakan kuning emas plumbum dua iodida!","title":"3 Tindak Balas Aktiviti 3.18 & Kaedah 3 Langkah Pengiraan Stoikiometri","acronym":"M1•NM•H3","hook":"Apa jua soalan stoikiometri SPM, kuncinya sentiasa sama: (1) Tukar ke Mol -> (2) Nisbah Pekali -> (3) Tukar ke Jawapan!","summary":"Pekali dalam persamaan kimia seimbang memberikan nisbah mol tepat bagi menghitung jisim, isi padu gas atau bilangan zarah bahan dan hasil tindak balas.","bullets":["3 Eksperimen Aktiviti 3.18: (A) Pemanasan kuprum(II) karbonat hijau: CuCO3(p) -> CuO(p) + CO2(g) (serbuk hijau -> serbuk hitam; gas mengeruhkan air kapur). (B) Pembentukan wasap putih: HCl(g) + NH3(g) -> NH4Cl(p). (C) Pemendakan kuning emas: Pb(NO3)2(ak) + 2KI(ak) -> PbI2(p) + 2KNO3(ak).","3 Langkah Stoikiometri (Contoh 17): Langkah 1: Tukar kuantiti bahan diberi kepada bilangan mol (n1 = Jisim/JM atau Isi padu/Vm). Langkah 2: Cari bilangan mol bahan sasaran (n2) menggunakan nisbah pekali persamaan seimbang. Langkah 3: Tukar n2 kepada jisim, isi padu gas atau bilangan zarah yang diminta!"],"formula":"Langkah 1: Kuantiti Diberi -> Mol (n1)  |  Langkah 2: Nisbah Pekali -> Mol (n2)  |  Langkah 3: Mol (n2) -> Kuantiti Sasaran","labId":"kim43_stoichiometry_balancer_lab","labTitle":"Pengira Stoikiometri 3-Langkah (Contoh 17 & Aktiviti 3.20)","labProps":{"tab":"stoik","sto":"Al_O2"},"examTip":"Dalam peperiksaan, jangan lupa menulis persamaan kimia seimbang dahulu jika tidak diberi, kerana nisbah pekali pada Langkah 2 bergantung sepenuhnya kepada pekali seimbang!"},{"type":"match","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Padan Persamaan Seimbang & Pemerhatian","voiceCaption":"Padankan lima tindak balas daripada Aktiviti tiga perpuluhan tujuh belas dan lapan belas dengan persamaan seimbang serta pemerhatian tepatnya.","voiceScript":"[confident] Uji kemahiran menulis dan mengimbangi persamaan kimia kamu! Padankan kelima-lima tindak balas makmal berikut dengan persamaan seimbangnya.","prompt":"Padankan tindak balas kimia berikut dengan persamaan kimia seimbang yang tepat:","pairs":[{"id":"u5m1","left":"Pemanasan serbuk hijau kuprum(II) karbonat (Akt. 3.18A)","right":"CuCO3(p) -> CuO(p) + CO2(g)"},{"id":"u5m2","left":"Wap asid hidroklorik pekat + gas ammonia (Akt. 3.18B)","right":"HCl(g) + NH3(g) -> NH4Cl(p) [wasap putih]"},{"id":"u5m3","left":"Pemendakan kuning emas plumbum(II) iodida (Akt. 3.18C)","right":"Pb(NO3)2(ak) + 2KI(ak) -> PbI2(p) + 2KNO3(ak)"},{"id":"u5m4","left":"Pembakaran lengkap propana dalam oksigen (Akt. 3.17)","right":"C3H8(g) + 5O2(g) -> 3CO2(g) + 4H2O(ce)"},{"id":"u5m5","left":"Kuprum + larutan argentum nitrat (Uji Kendiri 3.4)","right":"Cu(p) + 2AgNO3(ak) -> Cu(NO3)2(ak) + 2Ag(p)"}],"explanation":"Periksa keseimbangan setiap unsur dan keadaan fizik: 2AgNO3 mengimbangi 2 kumpulan NO3^- dalam Cu(NO3)2, manakala 5O2 menghasilkan 3CO2 + 4H2O (6 + 4 = 10 atom O)."},{"type":"predict","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Ramal Jisim Al2O3 Contoh 17","voiceCaption":"Berdasarkan Contoh tujuh belas, ramalkan jisim aluminium oksida yang terhasil apabila lima perpuluhan empat gram aluminium dibakar lengkap.","voiceScript":"[curious] Cuba selesaikan Contoh tujuh belas! Mengikut persamaan empat aluminium bertindak balas dengan tiga oksigen menghasilkan dua aluminium oksida, berapakah jisim aluminium oksida yang terhasil jika lima perpuluhan empat gram aluminium dibakar lengkap?","hook":"Saksikan aliran 3-Langkah Contoh 17 secara langsung pada Pengira Stoikiometri selepas memilih!","scenario":"Persamaan: 4Al(p) + 3O2(g) -> 2Al2O3(p). Jisim Al dibakar = 5.4 g. [JAR: O = 16, Al = 27]","prompt":"Berapakah jisim aluminium oksida, Al2O3 yang terhasil daripada pembakaran lengkap 5.4 g aluminium?","options":["5.1 g","10.2 g","20.4 g","15.6 g"],"correctIndex":1,"proofLabId":"kim43_stoichiometry_balancer_lab","proofState":{"tab":"stoik","sto":"Al_O2","val":5.4},"explanation":"Langkah 1: n(Al) = 5.4 / 27 = 0.2 mol. Langkah 2: 4 mol Al menghasilkan 2 mol Al2O3, maka 0.2 mol Al -> 0.1 mol Al2O3. Langkah 3: Jisim Al2O3 = 0.1 x [2(27) + 3(16)] = 0.1 x 102 = 10.2 g."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Susun Langkah Penyelesaian Stoikiometri","voiceCaption":"Susun urutan sistematik tiga langkah utama bagi menyelesaikan sebarang masalah numerikal stoikiometri.","voiceScript":"[confident] Susun semula blok langkah kerja berikut mengikut urutan rasmi tiga langkah pengiraan stoikiometri S P M!","prompt":"Susun urutan tepat menyelesaikan masalah pengiraan stoikiometri daripada persamaan kimia:","hint":"Mulakan dengan menulis persamaan dan mencari bilangan mol bahan diberi...","answerTokens":["Hitung bilangan mol bahan yang diberi","tentukan nisbah bilangan mol bahan sasaran","daripada pekali persamaan kimia seimbang","lalu tukarkan kepada jisim, isi padu atau zarah"],"distractors":["darabkan terus jisim diberi dengan JMR bahan sasaran","tukarkan formula molekul kepada formula empirik dahulu"],"explanation":"Urutan wajib 3 markah: (1) Kira mol bahan diberi -> (2) Guna nisbah mol daripada persamaan seimbang -> (3) Kira kuantiti akhir bahan sasaran."},{"type":"predict","xp":20,"voiceIdKey":"u5-s7","voiceToneLabel":"Ramal Isi Padu O2 Penguraian H2O2","voiceCaption":"Berdasarkan Uji Kendiri tiga perpuluhan empat nombor dua, ramalkan isi padu gas oksigen pada S T P daripada penguraian tiga puluh perpuluhan enam gram hidrogen peroksida.","voiceScript":"[curious] Mari uji satu lagi kiraan stoikiometri terus daripada Uji Kendiri tiga perpuluhan empat! Tiga puluh perpuluhan enam gram hidrogen peroksida terurai menjadi air dan gas oksigen. Berapakah isi padu gas oksigen pada S T P?","hook":"Sahkan pengiraan 3-Langkah penguraian H2O2 pada Pengira Stoikiometri selepas menjawab!","scenario":"Persamaan: 2H2O2(ce) -> 2H2O(ce) + O2(g). Jisim H2O2 = 30.6 g. [JAR: H=1, O=16; Isi padu molar STP = 22.4 dm^3 mol^-1]","prompt":"Berapakah isi padu gas oksigen yang terhasil pada STP daripada penguraian lengkap 30.6 g H2O2?","options":["10.08 dm^3","20.16 dm^3","10.80 dm^3","40.32 dm^3"],"correctIndex":0,"proofLabId":"kim43_stoichiometry_balancer_lab","proofState":{"tab":"stoik","sto":"H2O2","val":30.6},"explanation":"JMR H2O2 = 2(1) + 2(16) = 34. Langkah 1: n(H2O2) = 30.6 / 34 = 0.9 mol. Langkah 2: 2 mol H2O2 -> 1 mol O2, maka n(O2) = 0.45 mol. Langkah 3: Isi padu O2 = 0.45 x 22.4 = 10.08 dm^3."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s8","voiceToneLabel":"Stoikiometri Gas ke Bilangan Molekul","voiceCaption":"Selesaikan soalan Aktiviti tiga perpuluhan dua puluh nombor empat mengira bilangan molekul ammonia daripada tindak balas gas nitrogen pada S T P.","voiceScript":"[excited] Soalan penutup Unit lima terus daripada Aktiviti tiga perpuluhan dua puluh nombor empat! Jika enam perpuluhan tujuh dua desimeter padu gas nitrogen pada S T P bertindak balas lengkap dengan hidrogen, berapakah bilangan molekul ammonia yang terhasil?","stimulusHtml":"<div class='stimulus-note'><strong>Aktiviti 3.20 No. 4:</strong> N<sub>2</sub>(g) + 3H<sub>2</sub>(g) -> 2NH<sub>3</sub>(g). Isi padu gas nitrogen pada STP = <strong>6.72 dm<sup>3</sup></strong>. [N<sub>A</sub> = 6.02 x 10<sup>23</sup> mol<sup>-1</sup>; Isi padu molar STP = 22.4 dm<sup>3</sup> mol<sup>-1</sup>]</div>","prompt":"Berapakah bilangan molekul ammonia, NH3 yang terhasil apabila 6.72 dm^3 gas N2 bertindak balas lengkap pada STP?","options":["1.806 x 10^23 molekul","3.612 x 10^23 molekul","6.02 x 10^23 molekul","9.03 x 10^22 molekul"],"correctIndex":1,"explanation":"Langkah 1: n(N2) = 6.72 / 22.4 = 0.3 mol. Langkah 2: 1 mol N2 -> 2 mol NH3, maka n(NH3) = 0.6 mol. Langkah 3: Bilangan molekul NH3 = 0.6 x 6.02 x 10^23 = 3.612 x 10^23 molekul."}]},{"id":"kim43-u6","title":"Unit 6: Cabaran Boss SPM — Misi Penguasaan Penuh Bab 3","subtitle":"Sintesis Kertas 1 & Kertas 2 — Penilaian Akhir Bab (No. 1–10) & Sudut Pengayaan KBAT","iconType":"trophy","iconUrl":"../assets/icons/kim43-u6.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss Kes 1: Tertib Jisim P, Q & R","voiceCaption":"Selesaikan soalan Penilaian Akhir Bab nombor sembilan menyusun sampel kalsium klorida, nitrogen monoksida dan karbon dioksida mengikut tertib jisim menaik.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab tiga! Cabaran pertama diambil daripada Penilaian Akhir Bab nombor sembilan! Tukarkan ketiga-tiga sampel P, Q dan R kepada jisim dalam gram masing-masing terlebih dahulu, kemudian susun mengikut tertib jisim yang menaik!","stimulusHtml":"<div class='stimulus-note'><strong>Penilaian Bab 3 (No. 9):</strong><br><strong>P</strong> = 0.2 mol kalsium klorida, CaCl<sub>2</sub><br><strong>Q</strong> = 12 dm<sup>3</sup> gas nitrogen monoksida, NO pada keadaan bilik (24 dm<sup>3</sup> mol<sup>-1</sup>)<br><strong>R</strong> = 2.408 x 10<sup>23</sup> molekul karbon dioksida, CO<sub>2</sub><br>[JAR: C=12, N=14, O=16, Cl=35.5, Ca=40; N<sub>A</sub> = 6.02 x 10<sup>23</sup> mol<sup>-1</sup>]</div>","prompt":"Manakah susunan sampel P, Q dan R mengikut TERTIB JISIM MENAIK yang paling tepat?","options":["Q (15.0 g)  <  R (17.6 g)  <  P (22.2 g)","R (17.6 g)  <  Q (15.0 g)  <  P (22.2 g)","P (22.2 g)  <  Q (15.0 g)  <  R (17.6 g)","Q (14.4 g)  <  P (22.2 g)  <  R (24.0 g)"],"correctIndex":0,"explanation":"Jisim P = 0.2 x [40 + 2(35.5)] = 0.2 x 111 = 22.2 g. Jisim Q = (12/24) x (14+16) = 0.5 x 30 = 15.0 g. Jisim R = (2.408e23 / 6.02e23) x 44 = 0.4 x 44 = 17.6 g. Jadi tertib menaik ialah Q < R < P."},{"type":"predict","xp":30,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss Kes 2: KBAT Pilihan Baja Nitrogen","voiceCaption":"Berdasarkan Aktiviti tiga perpuluhan empat belas nombor empat, ramalkan baja manakah yang membekalkan peratus kandungan nitrogen tertinggi kepada peladang.","voiceScript":"[curious] Cabaran Boss kedua menguji kemahiran K B A T peladang daripada Aktiviti tiga perpuluhan empat belas! Antara baja ammonium nitrat, urea dan kalsium nitrat, baja manakah mempunyai peratus jisim nitrogen paling tinggi?","hook":"Ingat rumus peratus komposisi unsur = (Jisim atom N dalam formula / JMR atau JFR baja) x 100%!","scenario":"Seorang peladang membandingkan tiga baja bernitrogen: Ammonium nitrat NH4NO3 (JFR=80), Urea CO(NH2)2 (JMR=60) dan Kalsium nitrat Ca(NO3)2 (JFR=164). [JAR: N = 14]","prompt":"Baja manakah patut dipilih oleh peladang untuk memperoleh peratus kandungan nitrogen tertinggi?","options":["Ammonium nitrat, NH4NO3 kerana mengandungi ion ammonium dan ion nitrat (35.0% N)","Urea, CO(NH2)2 kerana mempunyai peratus jisim nitrogen paling tinggi iaitu 46.7% N","Kalsium nitrat, Ca(NO3)2 kerana mempunyai jisim formula relatif terbesar (17.1% N)","Ketiga-tiga baja memberi peratus nitrogen yang sama kerana semuanya ada 2 atom N"],"correctIndex":1,"proofLabId":"kim43_rel_mass_scale_lab","proofState":{"tab":"kalkulator","formula":"FeSO4.7H2O"},"explanation":"Semua baja itu mengandungi 2 atom N (jisim 28), namun Urea mempunyai jisim molar paling kecil (60 g mol^-1)! %N Urea = (28/60)x100% = 46.67%, berbanding NH4NO3 (28/80 = 35.0%) dan Ca(NO3)2 (28/164 = 17.07%)."},{"type":"match","xp":30,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss: Sintesis Penilaian Akhir Bab","voiceCaption":"Padankan lima soalan sintesis daripada Penilaian Akhir Bab tiga dengan jawapan saintifik dan pengiraan tepatnya.","voiceScript":"[confident] Cabaran Boss ketiga menyatukan soalan Penilaian Akhir Bab nombor empat hingga tujuh! Padankan kelima-lima masalah berikut dengan jawapan tepatnya.","prompt":"Padankan soalan Penilaian Bab 3 berikut dengan jawapan yang tepat [JAR: H=1, C=12, O=16, S=32, Fe=56]:","pairs":[{"id":"b3m1","left":"Vitamin C, C6H8O6 (Penilaian No. 4)","right":"Formula empirik = C3H4O3  |  JMR = 176"},{"id":"b3m2","left":"Dua bahan aktif ubat antasid gastrik (Penilaian No. 5)","right":"Mg(OH)2 dan Al(OH)3 (atau CaCO3 / NaHCO3)"},{"id":"b3m3","left":"Persamaan seimbang respirasi aerobik glukosa (Penilaian No. 6)","right":"C6H12O6 + 6O2 -> 6CO2 + 6H2O"},{"id":"b3m4","left":"Jisim molar & %Fe dalam FeSO4.7H2O (Penilaian No. 7)","right":"278 g mol^-1  |  %Fe = 20.14%"},{"id":"b3m5","left":"Oksida fosforus 5.04 g mengandungi 2.48 g P (Uji Kendiri 3.3, JMR = 126)","right":"Empirik PO2  |  Molekul P2O4 (Difosforus tetraoksida)"}],"explanation":"Uji Kendiri 3.3 No.4: 2.48/31 = 0.08 mol P dan (5.04-2.48)/16 = 0.16 mol O -> nisbah 1:2 (formula empirik PO2, jisim unit 63); dengan JMR = 126, n = 126/63 = 2 -> P2O4 (Difosforus tetraoksida). Bagi FeSO4.7H2O: JFR = 56+32+64+7(18) = 278; %Fe = 56/278 x 100 = 20.14%."},{"type":"sort","xp":30,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss: Audit Prosedur & Hukum Kimia","voiceCaption":"Kelaskan enam amalan dan kenyataan makmal berikut antara Amalan Betul yang Menepati Prinsip Kimia dengan Kesilapan Prosedur.","voiceScript":"[confident] Cabaran Boss keempat menguji ketajaman audit makmal kamu! Asingkan keenam-enam amalan berikut kepada Amalan Sahih atau Kesilapan Eksperimen dan Penulisan!","prompt":"Kelaskan amalan makmal dan penulisan kimia berikut kepada Amalan Sahih atau Kesilapan:","buckets":[{"id":"betul","label":"Amalan Sahih & Tepat"},{"id":"silap","label":"Kesilapan Prosedur / Penulisan"}],"items":[{"text":"Mengeringkan titisan air pada hujung salur kaca dengan putik kapas sebelum menimbang Cu","bucketId":"betul","note":"Mengelakkan jisim air yang terhasil menambah bacaan palsu jisim Cu"},{"text":"Mengubah H2O menjadi H2O2 supaya bilangan atom oksigen di sebelah kanan seimbang","bucketId":"silap","note":"Menukar subskrip merosakkan identiti bahan; wajib laras pekali sahaja!"},{"text":"Menuliskan formula kalsium nitrat sebagai Ca(NO3)2 dan bukan CaNO32","bucketId":"betul","note":"Ion poliatom berbilangan > 1 wajib diletak kurungan"},{"text":"Menganggap 1 mol pepejal Mg menempati isi padu 24 dm^3 pada keadaan bilik","bucketId":"silap","note":"Isi padu molar 22.4 / 24 dm^3 hanya sah untuk GAS, bukan pepejal atau cecair!"},{"text":"Membuka sedikit penutup mangkuk pijar sekali-sekala dan menutupnya cepat semasa membakar pita Mg","bucketId":"betul","note":"Membenarkan O2 masuk tanpa melepaskan wasap putih MgO"},{"text":"Menggunakan formula empirik AlO1.5 tanpa mendarab dua kepada nisbah integer Al2O3","bucketId":"silap","note":"Formula empirik mesti mempunyai subskrip nombor bulat paling ringkas"}],"explanation":"Mengelakkan empat kesilapan klasik ini (ubah subskrip, lupa kurungan poliatom, guna 24 dm^3 pada pepejal, dan lupa darab nisbah .5) menjamin markah tinggi dalam Kertas 1 dan Kertas 2!"},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss: Jawapan Sumatif No. 10","voiceCaption":"Susun jawapan Kertas dua bagi Penilaian Akhir Bab nombor sepuluh menerangkan mengapa persamaan kimia menggunakan formula molekul bukan formula empirik.","voiceScript":"[warm] Cabaran Boss kelima daripada Penilaian Akhir Bab nombor sepuluh! Pada pendapat kamu, mengapakah formula molekul lebih sesuai digunakan untuk menulis persamaan kimia berbanding formula empirik? Susun huraian lengkap berikut!","prompt":"Susun jawapan KBAT Penilaian Bab 3 No. 10 mengapa persamaan kimia menggunakan formula molekul berbanding formula empirik:","hint":"Bezakan fungsi formula molekul yang menunjukkan bilangan sebenar atom...","answerTokens":["Formula molekul menunjukkan bilangan sebenar","setiap jenis atom dalam satu molekul","manakala formula empirik hanya menunjukkan nisbah paling ringkas","supaya nisbah stoikiometri tindak balas sebenar tepat"],"distractors":["kerana formula empirik tidak mempunyai unsur oksigen","untuk mengelakkan hukum keabadian jisim dipatuhi"],"explanation":"Sebagai contoh, pembakaran etena ialah C2H4 + 3O2 -> 2CO2 + 2H2O (bukan CH2 + 1.5 O2 -> CO2 + H2O) kerana formula molekul mewakili molekul sebenar yang bertindak balas secara kuantitatif."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Pengayaan Kapal Angkasa LiOH","voiceCaption":"Selesaikan cabaran puncak Sudut Pengayaan nombor dua menghitung bilangan tabung penyerap litium hidroksida yang mesti dibawa dalam misi angkasa lepas lapan belas hari.","voiceScript":"[excited] Inilah cabaran kemuncak Unit Boss daripada Sudut Pengayaan nombor dua! Lima orang angkasawan menjalankan misi selama lapan belas hari. Setiap angkasawan menghembus empat puluh dua gram karbon dioksida sejam, dan setiap tabung penyerap mengandungi tujuh ratus lima puluh gram litium hidroksida. Berapakah bilangan minimum tabung penyerap yang mesti dibawa ke angkasa lepas?","stimulusHtml":"<div class='stimulus-note'><strong>Sudut Pengayaan Bab 3 (No. 2):</strong><br>2LiOH(p) + CO<sub>2</sub>(g) -> Li<sub>2</sub>CO<sub>3</sub>(p) + H<sub>2</sub>O(ce)<br>Tempoh misi = 18 hari (x 24 jam) | 5 petugas | Kadar CO<sub>2</sub> = 42 g sejam setiap petugas | 1 tabung = 750 g LiOH.<br>[JAR: H = 1, Li = 7, C = 12, O = 16]</div>","prompt":"Hitungkan bilangan minimum tabung penyerap LiOH (750 g setiap tabung) yang mesti dibawa untuk misi 18 hari tersebut:","options":["66 tabung penyerap LiOH","120 tabung penyerap LiOH","132 tabung penyerap LiOH","144 tabung penyerap LiOH"],"correctIndex":2,"explanation":"Langkah 1: Jumlah jisim CO2 = 5 x (18 x 24) x 42 = 90 720 g -> n(CO2) = 90 720 / 44 = 2061.82 mol. Langkah 2: Nisbah 2LiOH : 1CO2 -> n(LiOH) = 2 x 2061.82 = 4123.64 mol. Langkah 3: Jisim LiOH (JFR=24) = 4123.64 x 24 = 98 967.3 g -> Bilangan tabung = 98 967.3 / 750 = 131.96 => minimum 132 tabung! Tahniah, Kimia Tingkatan 4 Bab 3 dikuasai 100%!"}]}]};</script>

  window.ETUTOR_NOTA_LABS.kim43_mol_triangle_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var subKey = ps.substance || "CO2";
    var mol = typeof ps.mol === "number" ? ps.mol : 0.6;

    var paused = reducedMotion();
    var rafId = 0;
    var lastTs = 0;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;

    var substances = {
      Cu: { label: "Kuprum (Cu)", mm: 64, type: "atom", entity: "atom Cu", subMult: 1, subLabel: "atom Cu", isGas: false },
      Mg: { label: "Magnesium (Mg)", mm: 24, type: "atom", entity: "atom Mg", subMult: 1, subLabel: "atom Mg", isGas: false },
      H2: { label: "Gas Hidrogen (H2)", mm: 2, type: "molekul", entity: "molekul H2", subMult: 2, subLabel: "atom H", isGas: true },
      O2: { label: "Gas Oksigen (O2)", mm: 32, type: "molekul", entity: "molekul O2", subMult: 2, subLabel: "atom O", isGas: true },
      CO2: { label: "Gas Karbon Dioksida (CO2)", mm: 44, type: "molekul", entity: "molekul CO2", subMult: 3, subLabel: "atom (C+O)", isGas: true },
      NH3: { label: "Gas Ammonia (NH3)", mm: 17, type: "molekul", entity: "molekul NH3", subMult: 4, subLabel: "atom (N+3H)", isGas: true },
      H2O: { label: "Air Cecair (H2O)", mm: 18, type: "molekul", entity: "molekul H2O", subMult: 3, subLabel: "atom (2H+O)", isGas: false },
      ZnCl2: { label: "Zink Klorida (ZnCl2)", mm: 136, type: "ion", entity: "unit ZnCl2", subMult: 3, subLabel: "ion (Zn2+, 2Cl-)", isGas: false }
    };
    if (!substances[subKey]) subKey = "CO2";

    // Gas particle animation seeds
    var particles = [];
    for (var pi = 0; pi < 22; pi++) {
      particles.push({
        x: 30 + ((pi * 37) % 190),
        y: 26 + ((pi * 53) % 78),
        vx: ((pi % 2 === 0 ? 1 : -1) * (1.2 + (pi % 4) * 0.45)),
        vy: ((pi % 3 === 0 ? 1 : -1) * (1.0 + (pi % 3) * 0.4))
      });
    }

    function drawPistonCanvas() {
      var canvas = shell.querySelector("#kim43MolCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var w = canvas.width;
      var h = canvas.height;
      var cur = substances[subKey];
      var vm = cond === "stp" ? 22.4 : 24.0;

      c2d.fillStyle = "#020617";
      c2d.fillRect(0, 0, w, h);

      c2d.font = "800 10.5px Plus Jakarta Sans, sans-serif";
      c2d.fillStyle = "#93c5fd";
      c2d.textAlign = "left";
      c2d.fillText(
        cur.isGas
          ? ("SIMULASI ZARAH GAS: 1 MOL GAS = " + vm + " dm3 (" + (cond === "stp" ? "STP 0 C, 1 atm" : "KEADAAN BILIK 25 C, 1 atm") + ")")
          : ("SIMULASI ZARAH PEPEJAL/CECAIR (" + cur.label.toUpperCase() + "): RUMUS ISI PADU GAS TIDAK DIGUNAKAN"),
        14, 20
      );

      var boxW = cur.isGas ? Math.max(85, Math.min(480, Math.round((mol / 2.5) * 420))) : 150;
      var activeCount = Math.max(3, Math.min(22, Math.round(mol * 8)));

      c2d.strokeStyle = cur.isGas ? "#38bdf8" : "#f59e0b";
      c2d.lineWidth = 2.5;
      c2d.strokeRect(18, 32, 496, 86);

      c2d.fillStyle = cur.isGas ? "rgba(56,189,248,0.12)" : "rgba(245,158,11,0.18)";
      c2d.fillRect(20, 34, boxW, 82);

      // Piston stopper
      c2d.fillStyle = "#64748b";
      c2d.fillRect(20 + boxW, 33, 12, 84);
      c2d.fillRect(32 + boxW, 70, Math.max(10, 480 - boxW), 10);

      for (var i = 0; i < activeCount; i++) {
        var p = particles[i];
        var px = 28 + (p.x % Math.max(20, boxW - 16));
        var py = 42 + (p.y % 64);
        c2d.fillStyle = cur.isGas ? "#34d399" : "#fbbf24";
        c2d.beginPath();
        c2d.arc(px, py, cur.isGas ? 4.2 : 5.2, 0, Math.PI * 2);
        c2d.fill();
      }
    }

    function stepParticles(dt) {
      var cur = substances[subKey];
      var speed = cur.isGas ? (cond === "stp" ? 36 : 48) : 6;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx * speed * dt;
        p.y += p.vy * speed * dt;
        if (p.x < 10) { p.x = 10; p.vx = Math.abs(p.vx); }
        if (p.x > 400) { p.x = 400; p.vx = -Math.abs(p.vx); }
        if (p.y < 10) { p.y = 10; p.vy = Math.abs(p.vy); }
        if (p.y > 70) { p.y = 70; p.vy = -Math.abs(p.vy); }
      }
    }

    function loop(ts) {
      if (paused || isDocHidden) {
        rafId = 0;
        return;
      }
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      stepParticles(dt);
      drawPistonCanvas();
      rafId = window.requestAnimationFrame(loop);
    }

    function syncLoop() {
      if (paused || isDocHidden) {
        if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
      } else if (!rafId && typeof window !== "undefined" && window.requestAnimationFrame) {

        rafId = window.requestAnimationFrame(loop);

      var mass = mol * cur.mm;

      var nSubParticles = nParticles * cur.subMult;
      var volDm3 = cur.isGas ? mol * vm : 0;
      var volCm3 = volDm3 * 1000;

      var subBtns = Object.keys(substances).map(function (sk) {
        return '<button type="button" class="lab-seg-btn" data-m43-sub="' + sk + '" aria-pressed="' + (sk === subKey) + '">' + esc(sk) + "</button>";
      }).join("");

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}
