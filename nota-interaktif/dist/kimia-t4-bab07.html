  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"kimia-t4-bab07","subject":"Kimia","subjectGroup":"sains","form":4,"chapterNumber":7,"title":"Kadar Tindak Balas","subtitle":"Subtopik 7.1-7.4 KSSM (37 Langkah Bit-by-Bit) — Penentuan Kadar Purata & Tangen Seketika, Eksperimen 7.1-7.4 Faktor Kadar & Tekanan Gas, Aplikasi Harian serta Proses Haber, Ostwald & Sentuh, dan Teori Perlanggaran, Profil Tenaga Ea & Skema 4-Langkah Kertas 2 SPM.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/kim47-u1.jpg","labScript":"kimia-t4-bab07-labs.js","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep kadar tindak balas dan teori perlanggaran kamu memang mantap!","combo":"[laughs warmly] Kombo yang luar biasa! [excited] Rentak pemikiran saintifik juara S P M semakin jelas terserlah!","encourage":"[softly] Hampir kena... jangan risau! [warm] Semak semula persamaan kimia, graf tangen atau empat langkah teori perlanggaran pada nota panduan di bawah.","celebrate":"[excited] Tahniah! Satu lagi unit Kimia Tingkatan empat Bab tujuh berjaya kamu kuasai sepenuhnya!"},"units":[{"id":"kim47-u1","title":"Unit 1: Penentuan Kadar Tindak Balas & Kecerunan Tangen","subtitle":"Subtopik 7.1 — Tindak Balas Cepat vs Perlahan, 6 Perubahan Boleh Diukur (Aktiviti 7.1), Kadar Purata & Kadar Masa Tertentu","iconType":"graph","iconUrl":"../assets/icons/kim47-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Cepat vs Perlahan & Takrif","voiceCaption":"Kadar tindak balas ialah perubahan kuantiti bahan atau hasil tindak balas per unit masa; tindak balas cepat selesai singkat manakala tindak balas perlahan memakan masa panjang.","voiceScript":"[warm] Selamat datang ke Kimia Tingkatan empat Bab tujuh, Kadar Tindak Balas! Pernahkah kamu perhatikan tukang masak menggunakan penunu bagas gas butana untuk membakar permukaan daging dalam beberapa saat sahaja? Nyalaan gas butana berkepekatan dan bersuhu tinggi itu ialah contoh tindak balas cepat! Sebaliknya, pengaratan pagar besi, pereputan buah dan fotosintesis berlaku perlahan. Ingat takrif wajib: kadar tindak balas ialah perubahan kuantiti bahan tindak balas atau hasil tindak balas per unit masa!","title":"Tindak Balas Cepat vs Perlahan & Maksud Kadar Tindak Balas","acronym":"C•P•Q•T","hook":"Penunu bagas gas butana memasak makanan dalam beberapa saat berbanding pemanggang biasa — bukti kelajuan tindak balas kimia boleh dikawal!","mediaKey":"kim47_butane_rust","summary":"Sesuatu tindak balas kimia berlaku sama ada dengan pantas (masa singkat, kadar tinggi) atau perlahan (masa panjang, kadar rendah), bergantung kepada perubahan kuantiti bahan atau hasil per unit masa.","bullets":["Tindak Balas Cepat vs Perlahan (Rajah 7.1): Tindak balas cepat termasuk tindak balas sel elektrik, nyalaan mancis, pembakaran bunga api, pembakaran gas serta pemendakan segera (AgCl atau PbI2). Tindak balas perlahan pula merangkumi pereputan buah, pengaratan logam, fotosintesis, kakisan batu oleh hujan asid dan penapaian.","Takrif & Unit Piawai Kadar Tindak Balas: Kadar = Perubahan kuantiti bahan (berkurang) atau hasil (bertambah) dibahagi masa diambil. Unit mengikut kuantiti yang disukat: g s^-1 atau g minit^-1 (jisim), cm^3 s^-1 atau cm^3 minit^-1 (isi padu gas), dan mol dm^-3 s^-1 atau mol dm^-3 minit^-1 (kepekatan zat terlarut)."],"formula":"Kadar tindak balas = Perubahan kuantiti bahan atau hasil / Masa diambil","labId":"kim47_graf_tangen_lab","labTitle":"Makmal Graf Kadar & 6 Perubahan Boleh Diukur","labProps":{"tab":"changes","rxn":"mendakan_x"},"examTip":"Pilih unit masa berdasarkan kelajuan eksperimen: saat (s) untuk tindak balas cepat dan minit (min) untuk tindak balas perlahan. Unit kadar mesti sepadan dengan kuantiti diukur!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Cepat vs Perlahan","voiceCaption":"Kelaskan enam contoh tindak balas kimia berikut kepada kategori Tindak Balas Cepat atau Tindak Balas Perlahan.","voiceScript":"[confident] Jom uji kepekaan pemerhatian kamu mengikut Rajah tujuh perpuluhan satu! Asingkan keenam-enam tindak balas kimia berikut kepada Tindak Balas Cepat ataupun Tindak Balas Perlahan.","prompt":"Isihkan enam tindak balas kimia berikut mengikut kelajuan kadarnya:","buckets":[{"id":"cepat","label":"Tindak Balas Cepat (Kadar Tinggi)"},{"id":"perlahan","label":"Tindak Balas Perlahan (Kadar Rendah)"}],"items":[{"text":"Pembakaran gas petrol di dalam enjin kereta dan nyalaan bunga api","bucketId":"cepat","note":"Berlaku serta-merta dalam tempoh pecahan saat"},{"text":"Pengaratan pagar besi yang terdedah kepada udara dan air hujan","bucketId":"perlahan","note":"Mengambil masa beberapa hari hingga bulan untuk membentuk karat"},{"text":"Pemendakan putih AgCl apabila larutan AgNO3 ditambah larutan NaCl","bucketId":"cepat","note":"Pertukaran ion membentuk mendakan garam tak terlarutkan serta-merta"},{"text":"Proses fotosintesis pada daun hijau dan pereputan buah","bucketId":"perlahan","note":"Berlaku beransur-ansur pada kadar yang rendah"},{"text":"Tindak balas sel elektrik dan nyalaan kepala mancis","bucketId":"cepat","note":"Contoh rasmi tindak balas cepat dalam Rajah 7.1 KSSM"},{"text":"Kakisan batu kapur oleh hujan asid dan penapaian yis","bucketId":"perlahan","note":"Memerlukan masa lama untuk perubahan kuantiti ketara"}],"explanation":"Tindak balas cepat (sel elektrik, nyalaan mancis, bunga api, pembakaran petrol, pemendakan ion) selesai dalam masa sangat singkat, manakala tindak balas perlahan (pereputan buah, pengaratan, fotosintesis, kakisan batu, penapaian) memakan masa panjang."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"6 Perubahan Boleh Diukur","voiceCaption":"Kadar tindak balas ditentukan berdasarkan enam perubahan yang boleh diperhatikan dan diukur seperti pembentukan mendakan, pengurangan jisim, isi padu gas, tekanan, kekonduksian elektrik dan nilai pH.","voiceScript":"[warm] Bagaimanakah ahli kimia mengukur kadar tindak balas di dalam makmal? Kita mesti memilih perubahan fizikal yang boleh diperhatikan dan disukat dengan alat yang sesuai! Dalam Aktiviti tujuh perpuluhan satu dan Lensa Kimia, ada enam perubahan utama: pertama, pembentukan mendakan yang mengaburkan tanda pangkah X seperti argentum klorida atau plumbum dua iodida kuning; kedua, pengurangan jisim kalsium karbonat apabila gas karbon dioksida keluar melalui kapas longgar; ketiga, penambahan isi padu gas hidrogen menggunakan buret terbalik atau picagari gas; serta perubahan tekanan gas, kekonduksian elektrik dan nilai p H!","title":"6 Perubahan Boleh Diperhatikan & Diukur (Aktiviti 7.1)","acronym":"M•J•G•T•K•P","hook":"Tip Aktiviti 7.1B: Mulut kelalang disumbat kapas longgar (BUKAN penyumbat getah!) supaya gas CO2 boleh terlepas sambil menghalang percikan asid nitrik!","mediaKey":"kim47_gas_burette_exp","summary":"Penentuan kadar tindak balas memerlukan pemerhatian dan sukatan kuantiti bahan atau hasil yang berubah mengikut masa menggunakan radas makmal yang tepat.","bullets":["3 Kaedah Aktiviti 7.1 (Mendakan, Jisim, Isi Padu Gas): (1) Pembentukan mendakan putih AgCl (AgNO3 + NaCl) atau mendakan kuning PbI2 (2KI + Pb(NO3)2, Aktiviti 7.1C) atau sulfur (H2SO4 + Na2S2O3) menyukat masa tanda 'X' hilang atau jisim mendakan; (2) Pengurangan jisim CaCO3 + 2HNO3 diukur penimbang elektronik dengan kapas longgar di mulut kelalang (Aktiviti 7.1B); (3) Penambahan isi padu gas H2 (Zn + H2SO4 dengan buret terbalik aras awal 50.00 cm^3 atau Mg + 2HCl dengan picagari gas, Aktiviti 7.1A).","3 Perubahan Lensa Kimia (Tekanan, Kekonduksian, pH): (4) Perubahan tekanan tindak balas bergas (cth. 2SO2(g) + O2(g) -> 2SO3(g)) disukat dengan tolok tekanan; (5) Kekonduksian elektrik elektrolit bagi tindak balas ion bergerak bebas diukur dengan ammeter; (6) Perubahan nilai pH larutan asid atau alkali (H+ + OH- -> H2O) dikesan dengan meter pH."],"labId":"kim47_graf_tangen_lab","labTitle":"Inspektor 6 Perubahan Boleh Diukur & Radas","labProps":{"tab":"changes","rxn":"jisim_kurang"},"examTip":"Jawapan Kertas 2 Uji Kendiri 7.1 No. 3: Nyatakan alat + perubahan spesifik, contohnya 'Isi padu gas CO2 terkumpul dalam buret bertambah' atau 'Nilai pH larutan bertambah'."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Tindak Balas & Alat Ukur","voiceCaption":"Padankan lima persamaan kimia daripada Uji Kendiri tujuh perpuluhan satu dan Aktiviti tujuh perpuluhan satu dengan perubahan kuantiti yang sesuai diukur.","voiceScript":"[confident] Uji kemahiran memilih parameter eksperimen daripada Uji Kendiri tujuh perpuluhan satu! Padankan kelima-lima persamaan kimia berikut dengan perubahan kuantiti dan radas pengukur yang paling tepat.","prompt":"Padankan tindak balas kimia berikut dengan perubahan yang boleh diperhatikan dan diukur:","pairs":[{"id":"k1m1","left":"2HCl(ak) + CaCO3(p) -> CaCl2(ak) + H2O(ce) + CO2(g)","right":"Pertambahan isi padu gas CO2 dalam buret atau pengurangan jisim kelalang"},{"id":"k1m2","left":"H2SO4(ak) + Na2S2O3(ak) -> Na2SO4(ak) + H2O(ce) + SO2(g) + S(p)","right":"Masa yang diambil bagi mendakan kuning sulfur mengaburkan tanda 'X'"},{"id":"k1m3","left":"2SO2(g) + O2(g) -> 2SO3(g)","right":"Perubahan tekanan gas diukur menggunakan tolok tekanan sistem tertutup"},{"id":"k1m4","left":"H+(ak) + OH-(ak) -> H2O(ce)","right":"Perubahan nilai pH larutan akueus diukur menggunakan meter pH"},{"id":"k1m5","left":"2KI(p) + Pb(NO3)2(p) -> PbI2(p) + 2KNO3(ak)","right":"Pembentukan mendakan kuning plumbum(II) iodida dalam piring Petri"}],"explanation":"Setiap tindak balas mempunyai petunjuk perubahan yang unik: gas CO2 (isi padu gas / jisim berkurang), mendakan sulfur S (tanda 'X'), bahan/hasil semua gas (tolok tekanan), peneutralan ion H+/OH- (meter pH) dan mendakan kuning PbI2."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"Kadar Purata vs Tangen Seketika","voiceCaption":"Kadar tindak balas purata mengukur perubahan dalam satu sela masa manakala kadar pada masa tertentu ditentukan melalui kecerunan garis tangen pada lengkung graf.","voiceScript":"[warm] Tonton video tiga dimensi ini dan fahami perbezaan antara kadar tindak balas purata dengan kadar pada masa tertentu! Bayangkan sebuah kereta menempuh empat ratus kilometer dalam empat jam dengan kelajuan purata seratus kilometer sejam — itulah kadar purata! Tetapi apabila kamera had laju merakam kelajuan tepat seratus empat puluh kilometer sejam pada satu detik tertentu, itulah kadar pada masa tertentu! Untuk mencarinya daripada graf, lukis tangen pada masa t, bina segi tiga bersudut tegak yang besar dan hitung delta V bahagi delta t!","title":"Kadar Purata (Keseluruhan & Sela) vs Kecerunan Tangen Seketika","acronym":"V•T•ΔV•Δt","hook":"Perangkap Contoh 1 (Jadual 7.2): Data direkodkan hingga 10.0 minit, tetapi gas CO2 berhenti pada 7.0 minit (70.0 cm^3) — sentiasa bahagi dengan 7.0 minit!","mediaKey":"kim47_kadar_video_poster","videoClip":{"src":"../assets/kimia-t4-bab07/video/kim47_video_kadar_tindak_balas_narasi.mp4","hasNarration":true,"posterKey":"kim47_kadar_video_poster","caption":"Kadar tindak balas dan peningkatan frekuensi perlanggaran berkesan zarah terhadap permukaan pepejal."},"summary":"Kadar purata mengukur purata kadar dalam sesuatu selang masa atau keseluruhan tindak balas, manakala kadar pada masa tertentu diukur melalui kecerunan tangen lengkung pada detik t tersebut.","bullets":["3 Pengiraan Kadar Purata (Rajah 7.6-7.8 & Contoh 1): (1) Kadar purata keseluruhan = Jumlah gas maksimum / Masa tepat tindak balas berhenti (Contoh 1: 70.0 cm^3 / 7.0 min = 10.00 cm^3 min^-1); (2) Dalam t1 pertama = V1 / t1; (3) Dari t1 hingga t2 (cth. dalam minit ke-5 = 4 hingga 5 min) = (63.0 - 58.0) / (5.0 - 4.0) = 5.00 cm^3 min^-1.","3 Langkah Kadar pada Masa t (Rajah 7.9 & 7.10): (1) Lukis tangen menyentuh lengkung tepat pada masa t; (2) Bina segi tiga bersudut tegak bersaiz besar untuk bacaan lebih tepat; (3) Hitung kecerunan ΔV / Δt (Contoh 1 pada min ke-2: (64 - 20) / (4 - 0.2) = 11.58 cm^3 min^-1). Nota Aktiviti 7.2: KI + Pb(NO3)2 tidak dapat diukur kadar pada t = 30 s kerana berlaku terlalu pantas serta-merta!"],"formula":"Kadar (t1->t2) = (V2 - V1) / (t2 - t1)  |  Kadar pada masa t = Kecerunan tangen = ΔV / Δt","labId":"kim47_graf_tangen_lab","labTitle":"Simulator Graf Isi Padu Gas/Jisim & Pengira Tangen","labProps":{"tab":"graph","preset":"contoh1","t":2},"examTip":"Sentiasa lukis segi tiga tangen yang BESAR dan pastikan masa keseluruhan diambil pada titik PERTAMA lengkung mula mendatar (7.0 minit dalam Contoh 1; 6.5 minit dalam Jadual 7.3)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Ramal Perangkap Contoh 1","voiceCaption":"Ramalkan pengiraan kadar tindak balas purata keseluruhan dan dalam minit kelima bagi Jadual tujuh perpuluhan dua.","voiceScript":"[curious] Cuba elakkan perangkap peperiksaan yang paling kerap memerangkap calon S P M! Dalam Jadual tujuh perpuluhan dua, murid merekodkan isi padu gas karbon dioksida setiap satu minit sehingga sepuluh minit, tetapi bacaan menjadi tetap tujuh puluh sentimeter padu sejak minit ketujuh. Apakah nilai kadar tindak balas purata keseluruhan?","hook":"Periksa lengkung mendatar pada t = 7.0 minit di Simulator Graf & Tangen selepas menjawab!","scenario":"Jadual 7.2 (MgCO3 + H2SO4): t = 4.0 min (58.0 cm^3), t = 5.0 min (63.0 cm^3), t = 6.0 min (68.0 cm^3), t = 7.0 min (70.0 cm^3), t = 8.0 hingga 10.0 min kekal 70.0 cm^3.","prompt":"Manakah jawapan TEPAT bagi kadar purata keseluruhan tindak balas dan kadar purata dalam minit kelima?","options":["Keseluruhan = 70.0 / 7.0 = 10.00 cm^3 minit^-1 (tindak balas berhenti pada 7 minit); Minit kelima = (63.0 - 58.0) / 1 = 5.00 cm^3 minit^-1","Keseluruhan = 70.0 / 10.0 = 7.00 cm^3 minit^-1; Minit kelima = 63.0 / 5 = 12.60 cm^3 minit^-1","Keseluruhan = 70.0 / 7.0 = 10.00 cm^3 minit^-1; Minit kelima = (70.0 - 63.0) / 2 = 3.50 cm^3 minit^-1","Keseluruhan = 63.0 / 5.0 = 12.60 cm^3 minit^-1; Minit kelima = 58.0 / 4 = 14.50 cm^3 minit^-1"],"correctIndex":0,"proofLabId":"kim47_graf_tangen_lab","proofState":{"tab":"graph","preset":"contoh1","t":2},"explanation":"Tindak balas berhenti tepat pada minit ke-7 apabila isi padu tidak lagi bertambah (kekal 70.0 cm^3). Maka kadar keseluruhan = 70.0 / 7.0 = 10.00 cm^3 min^-1. 'Dalam minit kelima' bermaksud dari 4.0 hingga 5.0 minit, iaitu (63.0 - 58.0) / (5 - 4) = 5.00 cm^3 min^-1."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Susun Langkah Kecerunan Tangen","voiceCaption":"Susun tiga langkah rasmi Rajah tujuh perpuluhan sembilan untuk menentukan kadar tindak balas pada masa tertentu.","voiceScript":"[confident] Susun blok fakta berikut bagi menerangkan langkah demi langkah cara memperoleh kadar tindak balas pada masa tertentu daripada graf lengkung!","prompt":"Susun urutan tepat penentuan kadar tindak balas pada masa t daripada graf (Rajah 7.9):","hint":"Mulakan dengan melukis garis sentuhan pada masa t...","answerTokens":["Lukiskan garis tangen menyentuh lengkung pada masa t","kemudian lengkapkan satu segi tiga bersudut tegak yang besar","dan hitungkan kecerunan tangen iaitu ΔV dibahagi Δt","untuk memperoleh kadar tindak balas pada masa tertentu"],"distractors":["dengan membahagikan isi padu akhir kepada masa ujian tamat","tanpa menyentuh lengkung graf pada paksi masa"],"explanation":"Mengikut Rajah 7.9: (1) Lukis tangen tepat pada masa t, (2) Bina segi tiga bersudut tegak bersaiz besar untuk meminimumkan ralat bacaan, dan (3) Hitung kecerunan ΔV / Δt."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Kendiri 7.1: Logam P, Q & R","voiceCaption":"Bandingkan kadar tindak balas purata tiga logam P, Q dan R serta susun tertib kereaktifan menurunnya berdasarkan Uji Kendiri tujuh perpuluhan satu.","voiceScript":"[excited] Soalan penutup Unit satu daripada Uji Kendiri tujuh perpuluhan satu nombor empat! Tiga logam P, Q dan R bertindak balas dengan asid menghasilkan lima puluh sentimeter padu gas hidrogen. Logam P mengambil dua puluh lima saat, Q lima puluh saat dan R seratus saat. Manakah susunan tertib kereaktifan menurun serta nilai kadar puratanya?","stimulusHtml":"<div class='stimulus-note'><strong>Jadual 7.4 (Uji Kendiri 7.1 No. 4):</strong> Masa mengumpul 50 cm<sup>3</sup> gas H<sub>2</sub>: Logam P = 25 s | Logam Q = 50 s | Logam R = 100 s.</div>","prompt":"Hitung kadar purata setiap logam dan susun mengikut TERTIB KEREAKTIFAN MENURUN:","options":["Kadar P = 2.0 cm^3 s^-1, Q = 1.0 cm^3 s^-1, R = 0.5 cm^3 s^-1 | Tertib menurun: P > Q > R","Kadar P = 0.5 cm^3 s^-1, Q = 1.0 cm^3 s^-1, R = 2.0 cm^3 s^-1 | Tertib menurun: R > Q > P","Kadar P = 2.0 cm^3 s^-1, Q = 1.0 cm^3 s^-1, R = 0.5 cm^3 s^-1 | Tertib menurun: R > Q > P","Kadar P = 1250 cm^3 s^-1, Q = 2500 cm^3 s^-1, R = 5000 cm^3 s^-1 | Tertib menurun: R > Q > P"],"correctIndex":0,"explanation":"Kadar = 50 / masa: P = 50/25 = 2.0 cm^3 s^-1; Q = 50/50 = 1.0 cm^3 s^-1; R = 50/100 = 0.5 cm^3 s^-1. Semakin tinggi kadar tindak balas, semakin reaktif logam itu, maka tertib kereaktifan menurun ialah P, Q, R."}]},{"id":"kim47-u2","title":"Unit 2: Faktor yang Mempengaruhi Kadar Tindak Balas","subtitle":"Subtopik 7.2 — Saiz Pepejal (Eksperimen 7.1), Kepekatan & Suhu Pangkah 'X' (Eksperimen 7.2-7.3), Mangkin (Eksperimen 7.4) & Tekanan Gas","iconType":"atom","iconUrl":"../assets/icons/kim47-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Saiz Pepejal & Tekanan Gas","voiceCaption":"Memecahkan pepejal kepada saiz lebih kecil membesarkan jumlah luas permukaan terdedah, manakala tekanan tinggi memampatkan zarah gas kepada isi padu lebih kecil untuk meningkatkan kadar tindak balas.","voiceScript":"[warm] Selamat datang ke Unit dua! Ingat akronim K S S M dalam buku teks: Kepekatan, Saiz bahan tindak balas, Suhu, dan kehadiran Mangkin, ditambah satu lagi faktor khas untuk gas iaitu Tekanan! Dalam Eksperimen tujuh perpuluhan satu, lima gram ketulan kecil marmar bertindak balas jauh lebih cepat dengan asid hidroklorik daripada ketulan besar kerana jumlah luas permukaannya lebih besar! Ingat juga: perubahan tekanan hanya mempengaruhi bahan gas, tidak memberi kesan kepada pepejal dan cecair!","title":"Faktor Saiz Bahan (Eksperimen 7.1) & Faktor Tekanan Gas","acronym":"K•S•S•M•P","hook":"Memotong ketulan marmar kepada serbuk tidak menambah jisim atau gas maksimum yang terhasil, tetapi memendekkan masa tindak balas dengan mendadak!","mediaKey":"kim47_gas_burette_exp","summary":"Untuk jisim pepejal yang sama, saiz ketulan lebih kecil memberikan jumlah luas permukaan terdedah lebih besar, manakala peningkatan tekanan memampatkan gas untuk meninggikan kepekatan gas.","bullets":["Saiz Bahan Pepejal (Eksperimen 7.1): 5.0 g ketulan kecil vs ketulan besar marmar (CaCO3) + 80.0 cm^3 HCl 0.1 mol dm^-3 (kelalang digoncang perlahan-lahan; gas CO2 disukat setiap 30 s). Kecerunan tangen pada t = 0 (kadar awal) ketulan kecil lebih tinggi dan tamat lebih awal, tetapi jumlah isi padu maksimum CO2 SAMA selagi jisim marmar dan asid sama!","Tekanan Gas (Lensa Kimia m.s. 19): Apabila gas dimampatkan pada suhu tetap, zarah gas ditolak ke dalam ruang isi padu yang lebih kecil lalu kepekatan gas bertambah. Perubahan tekanan TIDAK mempengaruhi tindak balas pepejal dan cecair kerana isi padu kedua-duanya hampir tidak termampat."],"labId":"kim47_faktor_eksperimen_lab","labTitle":"Simulator 60fps Eksperimen 7.1 Saiz & Tekanan Gas","labProps":{"factor":"size","chipSize":"small"},"examTip":"Semasa menjawab Eksperimen 7.1, JANGAN tulis 'luas permukaan berkurang'; tulis tepat 'jumlah luas permukaan yang terdedah kepada tindak balas bertambah' apabila saiz bahan mengecil."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Lengkung Eksperimen 7.1","voiceCaption":"Ramalkan bentuk lengkung graf isi padu gas karbon dioksida bagi ketulan kecil marmar berbanding ketulan besar marmar dengan jisim dan asid yang sama.","voiceScript":"[curious] Cuba ramalkan! Jika satu gram serbuk marmar dan satu gram ketulan besar marmar masing-masing ditambahkan ke dalam lima puluh sentimeter padu asid hidroklorik sifar perpuluhan lima molar yang sama, bagaimanakah perbezaan antara dua lengkung graf gas melawan masa?","hook":"Uji Ketulan Kecil vs Besar dalam buret pada simulator selepas menjawab!","scenario":"Aktiviti 7.4 No. 1 (Rajah 7.16): Set I menggunakan 1.0 g ketulan besar CaCO3 + 50 cm^3 HCl 0.5 mol dm^-3; Set II menggunakan 1.0 g serbuk halus CaCO3 + 50 cm^3 HCl 0.5 mol dm^-3.","prompt":"Manakah perbandingan graf gas CO2 melawan masa yang PALING tepat antara Set II (serbuk) dengan Set I (ketulan besar)?","options":["Lengkung Set II lebih curam pada t = 0 dan mendatar lebih awal, tetapi kedua-dua Set I dan Set II mencapai paras isi padu maksimum gas CO2 yang SAMA","Lengkung Set II mencapai paras isi padu maksimum dua kali ganda lebih tinggi daripada Set I","Lengkung Set I lebih curam daripada Set II kerana ketulan besar mengandungi lebih banyak karbonat","Lengkung Set II terus menaik tanpa henti kerana serbuk tidak boleh habis bertindak balas"],"correctIndex":0,"proofLabId":"kim47_faktor_eksperimen_lab","proofState":{"factor":"size","chipSize":"small"},"explanation":"Kerana jisim CaCO3 (1.0 g) dan kuantiti asid HCl adalah sama bagi kedua-dua set, bilangan mol bahan penghad adalah sama, jadi isi padu maksimum CO2 kekal sama. Namun serbuk CaCO3 mempunyai jumlah luas permukaan lebih besar, maka kadar awalnya (kecerunan t=0) lebih tinggi dan lengkap lebih cepat."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Eksperimen Tanda X: Kepekatan & Suhu","voiceCaption":"Dalam Eksperimen tujuh perpuluhan dua dan tujuh perpuluhan tiga, mendakan kuning sulfur daripada natrium tiosulfat dan asid sulfurik mengaburkan tanda pangkah X sehingga kadar tindak balas diwakili sebagai satu per masa.","voiceScript":"[warm] Sekarang teroka eksperimen paling masyhur dalam Kimia Tingkatan empat iaitu ujian tanda pangkah X menggunakan larutan natrium tiosulfat dan asid sulfurik! Apabila kedua-dua larutan bercampur, mendakan halus sulfur berwarna kuning terbentuk dan mengeruhkan larutan hingga tanda X di bawah kelalang tidak kelihatan dari atas. Dalam Eksperimen tujuh perpuluhan dua bagi kepekatan, air suling ditambah supaya jumlah isi padu campuran kekal lima puluh sentimeter padu dan kepekatan dicari menggunakan rumus M satu V satu sama dengan M dua V dua! Dalam Eksperimen tujuh perpuluhan tiga bagi suhu pula, setiap kenaikan sepuluh darjah Celsius pada suhu bilik hampir menggandakan kadar satu per masa!","title":"Eksperimen 7.2 & 7.3: Kepekatan & Suhu (Na2S2O3 + H2SO4 Tanda 'X')","acronym":"M1V1•1/t","hook":"Mengapa jumlah isi padu campuran ditetapkan 50.0 cm^3 menggunakan air suling dalam Eksperimen 7.2? Supaya kedalaman larutan dan tahap kekeruhan sulfur untuk menutupi 'X' kekal seragam!","mediaKey":"kim47_precipitate_cross","summary":"Kadar tindak balas pembentukan sulfur (S2O3^2- + 2H+ -> H2O + SO2 + S) berkadar terus dengan 1/masa apabila kepekatan dan suhu larutan Na2S2O3 ditingkatkan.","bullets":["Kepekatan & Formula M1V1 = M2V2 (Eksperimen 7.2, Jadual 7.5): Na2S2O3 0.2 mol dm^-3 (45, 40, 30, 20, 10 cm^3) dicairkan dengan air suling (0, 5, 15, 25, 35 cm^3) dan ditambah 5.0 cm^3 H2SO4 1.0 mol dm^-3 (jumlah isi padu = 50.0 cm^3; saiz kelalang kon dimalarkan). Oleh sebab kuantiti sulfur untuk mengaburkan 'X' tetap sama, kadar = 1 / masa (s^-1). Graf 1/masa melawan kepekatan M2 ialah garis lurus menaik!","Suhu & Persamaan Ion (Eksperimen 7.3): Suhu larutan Na2S2O3 0.2 M ditingkatkan (suhu bilik, 40, 45, 50, 55 °C) dan dicampurkan 5.0 cm^3 H2SO4 1.0 M; graf 1/masa melawan suhu menaik curam (~2x setiap +10 °C pada suhu bilik). Persamaan ion: S2O3^2-(ak) + 2H+(ak) -> H2O(ce) + SO2(g) + S(p). Asid sulfurik boleh diganti dengan asid hidroklorik HCl kerana kedua-duanya membekalkan ion hidrogen H+."],"formula":"M1V1 = M2V2   |   Kadar tindak balas = 1 / masa (s^-1)","labId":"kim47_faktor_eksperimen_lab","labTitle":"Simulator Eksperimen Tanda 'X': Kepekatan (M1V1=M2V2) & Suhu","labProps":{"factor":"conc","naVolIdx":0},"examTip":"Soalan Perbincangan 7.2 wajib hafal: Bahan yang menyebabkan larutan menjadi keruh ialah MENDAKAN SULFUR (S), bukan gas SO2! Pastikan juga anda melihat tanda 'X' secara menegak dari atas mulut kelalang kon yang sama saiz."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Eksperimen 7.1 hingga 7.4","voiceCaption":"Padankan empat eksperimen utama Subtopik tujuh perpuluhan dua dengan bahan tindak balas dan pemerhatian atau pemboleh ubahnya.","voiceScript":"[confident] Jom uji penguasaan prosedur kesemua empat eksperimen wajib Subtopik tujuh perpuluhan dua! Padankan setiap eksperimen dengan bahan kimia serta kaedah pengukurannya.","prompt":"Padankan Eksperimen 7.1 hingga 7.4 dengan bahan kimia dan teknik pemerhatiannya:","pairs":[{"id":"k2m1","left":"Eksperimen 7.1 (Saiz Pepejal)","right":"5.0 g ketulan besar vs kecil CaCO3 + HCl; ukur isi padu gas CO2 dalam buret"},{"id":"k2m2","left":"Eksperimen 7.2 (Kepekatan)","right":"Pencairan Na2S2O3 (45->10 cm^3) + air suling + H2SO4; sukat masa tanda 'X' hilang"},{"id":"k2m3","left":"Eksperimen 7.3 (Suhu)","right":"Na2S2O3 dipanaskan pada 40°C-55°C + H2SO4; plot graf 1/masa melawan suhu"},{"id":"k2m4","left":"Eksperimen 7.4 (Mangkin)","right":"5.0 cm^3 H2O2 + 0.5 g serbuk MnO2; uji gas O2 dengan kayu uji berbara"}],"explanation":"Eksperimen 7.1 menyukat gas CO2 daripada CaCO3 + HCl; Eksperimen 7.2 dan 7.3 menyukat masa kekeruhan mendakan sulfur Na2S2O3 + H2SO4 mengaburkan 'X'; Eksperimen 7.4 menguji penguraian H2O2 oleh MnO2 menggunakan kayu uji berbara."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Kehadiran Mangkin & Kawalan Ujian","voiceCaption":"Mangkin mengubah kadar tindak balas tanpa mengalami perubahan kimia atau perubahan jisim pada akhir tindak balas, dan tidak menambah kuantiti hasil akhir.","voiceScript":"[warm] Apakah keistimewaan mangkin dalam tindak balas kimia? Mangkin ialah bahan kimia yang mengubah kadar tindak balas tanpa mengalami sebarang perubahan kimia pada akhir tindak balas! Walaupun jisim dan sifat kimianya kekal sama, sifat fiziknya seperti ketulan pepejal boleh berubah menjadi serbuk. Dalam Eksperimen tujuh perpuluhan empat, penambahan sifar perpuluhan lima gram serbuk mangan empat oksida memecutkan penguraian hidrogen peroksida supaya kayu uji berbara menyala lebih pantas, manakala dalam Aktiviti tujuh perpuluhan empat, mangan empat oksida terbukti lebih cekap daripada ferum dan kuprum dua oksida!","title":"Faktor Mangkin (Eksperimen 7.4 & Aktiviti 7.4) serta Pemboleh Ubah","acronym":"M•K•F•H","hook":"Perangkap Contoh 3 (Jadual 7.7): Menggandakan isi padu HCl berlebihan daripada 50 cm^3 kepada 100 cm^3 pada kepekatan & suhu sama TIDAK mengubah kadar tindak balas!","mediaKey":"kim47_catalyst_mno2","summary":"Mangkin mempercepat tindak balas dengan jisim serta sifat kimianya kekal terpelihara dan tanpa mengubah jumlah hasil maksimum yang terbentuk.","bullets":["Sifat Mangkin & Eksperimen 7.4 (2H2O2 -> 2H2O + O2): Jisim dan komposisi kimia mangkin (0.5 g MnO2) kekal tidak berubah selepas dituras, dicuci dan dikeringkan (sifat fizik sahaja boleh berubah, cth. ketulan -> serbuk). Dalam Jadual 7.8 (Aktiviti 7.4), MnO2 paling berkesan (100 cm^3 O2 pada 40 s), diikuti Fe (60 cm^3 pada 60 s) dan CuO (31 cm^3 pada 60 s). Kuprum(II) sulfat juga bertindak sebagai mangkin untuk tindak balas Zn + H2SO4.","Kawalan Pemboleh Ubah (Contoh 2 & 3): Penambahan isi padu asid berlebihan daripada 50 cm^3 kepada 100 cm^3 (kepekatan 2.0 M & suhu 30 °C kekal) tidak memendekkan masa tindak balas (tetap 60 s dalam Jadual 7.7) kerana kepekatan ion H+ tidak berubah."],"labId":"kim47_faktor_eksperimen_lab","labTitle":"Simulator Mangkin (MnO2, Fe, CuO & Tanpa Mangkin)","labProps":{"factor":"catalyst","cat":"mno2"},"examTip":"Tiga fakta wajib tentang mangkin dalam Kertas 2: (1) Mengubah kadar tindak balas; (2) Tidak berubah secara kimia & jisim kekal sama selepas tindak balas; (3) Tidak menambah kuantiti hasil tindak balas."},{"type":"sort","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Isih Sifat Mangkin: Berubah vs Kekal","voiceCaption":"Kelaskan enam pernyataan mengenai penambahan mangkin mangan empat oksida ke dalam hidrogen peroksida antara perkara yang berubah dengan perkara yang kekal sama.","voiceScript":"[confident] Jom uji kefahaman mendalam tentang kesan mangkin! Asingkan keenam-enam perkara berikut apabila mangkin mangan empat oksida ditambah ke dalam larutan hidrogen peroksida.","prompt":"Kelaskan kesan penambahan mangkin MnO2 kepada larutan H2O2 berikut:","buckets":[{"id":"berubah","label":"Berubah / Meningkat"},{"id":"kekal","label":"Kekal Tidak Berubah"}],"items":[{"text":"Kadar pembebasan gas oksigen per unit masa (kecerunan graf)","bucketId":"berubah","note":"Mangkin mempercepat penguraian H2O2"},{"text":"Jisim mangkin MnO2 sebelum dan selepas tindak balas selesai","bucketId":"kekal","note":"Mangkin tidak habis digunakan semasa tindak balas"},{"text":"Jumlah isi padu maksimum gas oksigen yang terhasil akhirnya","bucketId":"kekal","note":"Ditentukan oleh kuantiti H2O2 sahaja, bukan mangkin"},{"text":"Masa yang diambil untuk penguraian lengkap 50 cm^3 H2O2","bucketId":"berubah","note":"Masa tindak balas menjadi jauh lebih singkat"},{"text":"Komposisi dan sifat kimia mangkin pada akhir tindak balas","bucketId":"kekal","note":"Sifat fizik mungkin berubah, tetapi sifat kimia kekal"},{"text":"Keadaan nyalaan kayu uji berbara pada mulut tabung uji II","bucketId":"berubah","note":"Menyala semula dengan lebih pantas dan terang"}],"explanation":"Mangkin mempercepat kadar (kecerunan graf lebih curam, masa lengkap lebih singkat), tetapi TIDAK mengubah jisimnya sendiri, komposisi kimianya, mahupun jumlah isi padu maksimum hasil."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Susun Kawalan Tahap Kekeruhan 'X'","voiceCaption":"Susun jawapan struktur bagi menerangkan langkah kawalan kekeruhan sama dalam Eksperimen tanda pangkah X.","voiceScript":"[confident] Susun semula blok jawapan bagi soalan Perbincangan Eksperimen tujuh perpuluhan dua nombor tiga: apakah langkah yang memastikan tahap kekeruhan yang sama dicapai dalam kelima-lima ujian?","prompt":"Susun jawapan lengkap mengenai langkah memastikan tahap kekeruhan sama dalam Eksperimen 7.2:","hint":"Libatkan jumlah isi padu campuran, saiz kelalang kon dan tanda 'X'...","answerTokens":["Mengekalkan jumlah isi padu campuran pada 50.0 cm^3","menggunakan kelalang kon bersaiz yang sama","dan meletakkannya di atas tanda 'X' yang sama","supaya kuantiti sulfur yang menutupi tanda 'X' adalah malar"],"distractors":["dengan memanaskan larutan ke suhu berbeza-beza","serta menambah isi padu asid sulfurik setiap kali"],"explanation":"Menetapkan jumlah isi padu campuran (50.0 cm^3 dengan air suling), saiz kelalang kon dan kertas bertanda 'X' yang sama memastikan kedalaman larutan dan kuantiti mendakan sulfur untuk menyembunyikan 'X' adalah seragam bagi membolehkan kadar = 1/masa."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Analisis Jadual 7.7 Tablet Antasid","voiceCaption":"Analisis data Jadual tujuh perpuluhan tujuh bagi tindak balas tablet antasid dengan asid hidroklorik berlebihan.","voiceScript":"[excited] Soalan penutup Unit dua terus daripada Contoh tiga Jadual tujuh perpuluhan tujuh! Seorang pelajar membandingkan empat eksperimen tablet antasid dengan asid hidroklorik berlebihan. Antara kesimpulan berikut, manakah paling tepat menjelaskan kesan isi padu asid, kepekatan, suhu dan cara mempercepat Eksperimen satu?","stimulusHtml":"<div class='stimulus-note'><strong>Jadual 7.7 (Contoh 3):</strong><br>I: 50 cm<sup>3</sup>, 1.0 M, 30&deg;C -> 120 s &nbsp;|&nbsp; II: 50 cm<sup>3</sup>, 2.0 M, 30&deg;C -> 60 s<br>III: 100 cm<sup>3</sup>, 2.0 M, 30&deg;C -> 60 s &nbsp;|&nbsp; IV: 50 cm<sup>3</sup>, 2.0 M, 40&deg;C -> 30 s</div>","prompt":"Manakah analisis yang BETUL sepenuhnya tentang Eksperimen I, II, III dan IV dalam Jadual 7.7?","options":["Pasangan II & III membuktikan isi padu HCl berlebihan tidak mengubah kadar (tetap 60 s); IV lebih pantas daripada II kerana suhu tinggi (40°C); I boleh dipercepat dengan menghancurkan tablet antasid","Pasangan I & III mempunyai kadar yang sama kerana suhu kedua-duanya 30°C","Eksperimen III sepatutnya mengambil masa 30 s kerana isi padu HCl digandakan kepada 100 cm^3","Eksperimen IV lebih cepat daripada II kerana kepekatan HCl meningkat kepada 4.0 mol dm^-3"],"correctIndex":0,"explanation":"Dalam Jadual 7.7: II dan III berbeza pada isi padu asid berlebihan (50 vs 100 cm^3) tetapi masa kekal 60 s; IV (40°C) dua kali lebih cepat daripada II (30°C); selain menaikkan suhu dan kepekatan, Eksperimen I boleh dipercepat dengan menghancurkan tablet antasid."}]},{"id":"kim47-u3","title":"Unit 3: Aplikasi Faktor dalam Kehidupan & Industri","subtitle":"Subtopik 7.3 — Aplikasi Harian 4 Faktor (Antasid, Peti Sejuk, Periuk Tekanan, Penukar Bermangkin) & Proses Haber, Ostwald serta Sentuh","iconType":"scale","iconUrl":"../assets/icons/kim47-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Aplikasi Harian 4 Faktor","voiceCaption":"Pengetahuan tentang faktor saiz, kepekatan, suhu dan mangkin diaplikasikan setiap hari daripada mengunyah tablet antasid dan menyimpan makanan di peti sejuk hingga penukar bermangkin ekzos kereta.","voiceScript":"[warm] Selamat datang ke Unit tiga! Mengapakah doktor menasihati pesakit gastrik supaya mengunyah tablet antasid dan tidak menelannya bulat-bulat? Kerana tablet kecil mempunyai jumlah luas permukaan yang besar untuk meneutralkan asid perut lebih pantas! Dalam unit ini, kita merangkumkan kesemua aplikasi harian mengikut empat faktor: hiris kentang dan serpihan arang untuk saiz, hujan asid dan mampatan wap petrol dalam kebuk enjin untuk kepekatan, peti sejuk serta periuk tekanan untuk suhu dan tekanan, dan akhir sekali penukar bermangkin ekzos serta enzim yis tiga puluh tujuh darjah Celsius untuk mangkin!","title":"Aplikasi Faktor Kadar dalam Kehidupan Harian & Alam Sekitar","acronym":"A•P•E•Y","hook":"Tahukah anda? Minyak masak mampu mencecah 180 °C tanpa mendidih berbanding air mendidih 100 °C — sebab itu menggoreng memasak lebih cepat daripada merebus!","mediaKey":"kim47_catalytic_converter","summary":"Pengawalan saiz, kepekatan, suhu dan mangkin membolehkan kita mempercepat tindak balas bermanfaat (memasak, mencuci, ekzos bersih) dan melambatkan tindak balas merosakkan (kerosakan makanan).","bullets":["Aplikasi Saiz & Kepekatan: (1) Mengunyah tablet antasid, menghiris kentang/daging tipis serta memecahkan batu arang kepada serpihan kecil membesarkan jumlah luas permukaan terdedah; (2) Kepekatan tinggi gas SO2 di zon perindustrian menghasilkan hujan asid lebih pekat yang cepat mengakis struktur besi; (3) Mampatan wap petrol dan udara dalam kebuk pembakaran enjin kereta meningkatkan kepekatan wap petrol untuk pembakaran pantas dan letupan bertenaga.","Aplikasi Suhu & Mangkin (Aktiviti 7.5-7.6): (4) Peti sejuk bersuhu rendah melambatkan pembiakan bakteria perosak susu dan makanan; (5) Mencuci dengan serbuk detergen berair panas serta menggoreng dalam minyak 180 °C (vs air 100 °C) mempercepat tindak balas; (6) Periuk tekanan memerangkap wap untuk menaikkan tekanan dan takat didih air melebihi 100 °C; (7) Penukar bermangkin menukar gas pencemar ekzos (CO, hidrokarbon, oksida nitrogen) menjadi CO2, H2O dan N2; enzim yis pada 37 °C memangkinkan penapaian glukosa menghasilkan etanol dan tapai."],"labId":"kim47_industri_aplikasi_lab","labTitle":"Penjelajah 8 Aplikasi Faktor Harian KSSM","labProps":{"tab":"harian","daily":"antasid"},"examTip":"Untuk Aktiviti 7.5(c): menghilangkan kesan darah pada pakaian menggunakan detergen berenzim protease dalam air SUAM (~37-40°C) — jangan guna air mendidih kerana suhu terlalu tinggi menyahaktifkan enzim!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih 6 Aplikasi Harian","voiceCaption":"Kelaskan enam aplikasi kehidupan harian berikut mengikut faktor kadar tindak balas utama yang dimanfaatkan.","voiceScript":"[confident] Jom uji kecekapan menghubungkaitkan sains makmal dengan kehidupan harian! Kelaskan keenam-enam situasi harian ini kepada faktor Saiz atau Kepekatan berbanding faktor Suhu atau Mangkin.","prompt":"Isihkan enam aplikasi harian berikut kepada pasangan faktor kadar tindak balas yang paling tepat:","buckets":[{"id":"saiz_pek","label":"Faktor Saiz / Kepekatan"},{"id":"suhu_mang","label":"Faktor Suhu / Mangkin"}],"items":[{"text":"Mengunyah tablet antasid serta memotong daging kepada ketulan kecil sebelum dimasak","bucketId":"saiz_pek","note":"Membesarkan jumlah luas permukaan terdedah"},{"text":"Menyimpan ikan dan susu di dalam peti sejuk bersuhu rendah","bucketId":"suhu_mang","note":"Suhu rendah memperlahankan pertumbuhan bakteria"},{"text":"Mampatan wap petrol dan udara di dalam kebuk pembakaran enjin kereta","bucketId":"saiz_pek","note":"Meningkatkan kepekatan molekul wap petrol untuk pembakaran pantas"},{"text":"Penggunaan penukar bermangkin ekzos kereta menukar CO dan NO kepada gas selamat","bucketId":"suhu_mang","note":"Logam mangkin Pt/Pd/Rh mempercepat penukaran gas pencemar"},{"text":"Kakisan cepat pagar besi berdekatan kilang akibat kepekatan tinggi SO2 dalam hujan asid","bucketId":"saiz_pek","note":"Kepekatan bahan pencemar berasid tinggi mempercepat kakisan"},{"text":"Penapaian glukosa oleh enzim yis pada suhu 37 °C untuk menghasilkan tapai dan etanol","bucketId":"suhu_mang","note":"Enzim bertindak sebagai mangkin biologi pada suhu optimum 37°C"}],"explanation":"Mengunyah antasid/hirisan kecil (saiz), mampatan wap petrol & hujan asid SO2 (kepekatan); manakala peti sejuk (suhu rendah), penukar bermangkin & enzim yis 37°C (suhu/mangkin)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Proses Haber, Ostwald & Sentuh","voiceCaption":"Industri kimia memanfaatkan suhu, tekanan dan mangkin optimum dalam Proses Haber menghasilkan ammonia, Proses Ostwald menghasilkan asid nitrik dan Proses Sentuh menghasilkan asid sulfurik.","voiceScript":"[warm] Bagaimana pula kilang kimia menghasilkan bahan asas dunia seperti baja ammonia, asid nitrik dan asid sulfurik dalam skala jutaan tan? Setiap proses menggabungkan kawalan suhu, tekanan dan mangkin yang sangat jitu! Dalam Proses Haber untuk ammonia, gas nitrogen dan hidrogen bertindak balas pada suhu empat ratus lima puluh hingga lima ratus lima puluh darjah Celsius, tekanan dua ratus atmosfera dan mangkin serbuk ferum! Dalam Proses Ostwald untuk asid nitrik, mangkin platinum digunakan pada lapan ratus lima puluh darjah Celsius dan lima atmosfera! Dalam Proses Sentuh untuk asid sulfurik pula, mangkin vanadium lima oksida bertindak pada empat ratus lima puluh darjah Celsius dan tekanan satu atmosfera!","title":"3 Proses Industri Utama: Proses Haber, Proses Ostwald & Proses Sentuh","acronym":"Fe•Pt•V2O5","hook":"Mengapa Proses Haber memilih 450 °C (bukan 350 °C atau 550 °C)? Kerana ia titik kompromi terbaik antara kelajuan tindak balas dengan peratus hasil ammonia!","mediaKey":"kim47_haber_industrial","summary":"Tiga proses perindustrian utama kimia — Haber (NH3), Ostwald (HNO3) dan Sentuh (H2SO4) — menggunakan syarat suhu, tekanan dan mangkin khusus untuk mengoptimumkan kadar dan hasil ekonomi.","bullets":["Proses Haber (Ammonia, NH3 -> Baja Bernitrogen): N2(g) + 3H2(g) <-> 2NH3(g) (nisbah 1:3) pada suhu 450 °C-550 °C, tekanan 200 atm dan mangkin serbuk Ferum (Fe). Kompromi Uji Kendiri 7.3 No. 2: Pada 350 °C peratusan NH3 tinggi tetapi kadar lambat; pada 550 °C kadar cepat tetapi peratusan hasil rendah -> diatasi dengan menggunakan mangkin Fe pada 450 °C dan tekanan 200 atm.","Proses Ostwald (Asid Nitrik, HNO3) & Proses Sentuh (Asid Sulfurik, H2SO4): Proses Ostwald mengoksidakan NH3 menggunakan mangkin Platinum (Pt) pada 850 °C dan tekanan 5 atm (4NH3 + 5O2 -> 4NO + 6H2O -> HNO3). Proses Sentuh menukar 2SO2(g) + O2(g) <-> 2SO3(g) menggunakan mangkin Vanadium(V) oksida (V2O5) pada 450 °C dan tekanan 1 atm (lalu menghasilkan oleum H2S2O7 dan asid sulfurik H2SO4)."],"labId":"kim47_industri_aplikasi_lab","labTitle":"Simulator Reaktor Industri (Haber, Ostwald & Sentuh)","labProps":{"tab":"industri","proc":"haber","temp":450,"press":200,"cat":"Fe"},"examTip":"Hafal jadual pantas 3 Proses Industri: Haber = Fe / 450-550°C / 200 atm (NH3); Ostwald = Pt / 850°C / 5 atm (HNO3); Sentuh = V2O5 / 450°C / 1 atm (H2SO4)."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Proses Industri & Mangkin","voiceCaption":"Padankan ketiga-tiga proses industri utama serta penukar bermangkin dan penapaian yis dengan mangkin serta syarat optimumnya.","voiceScript":"[confident] Uji ketepatan hafalan syarat industri kamu! Padankan setiap proses kimia dan aplikasi harian ini dengan mangkin, suhu serta tekanannya yang tepat.","prompt":"Padankan proses berikut dengan mangkin dan syarat operasi yang tepat:","pairs":[{"id":"k3m1","left":"Proses Haber (Penghasilan Ammonia, NH3)","right":"Mangkin serbuk Ferum (Fe), suhu 450°C-550°C dan tekanan 200 atm"},{"id":"k3m2","left":"Proses Ostwald (Penghasilan Asid Nitrik, HNO3)","right":"Mangkin Platinum (Pt), suhu 850°C dan tekanan 5 atm"},{"id":"k3m3","left":"Proses Sentuh (Penghasilan Asid Sulfurik, H2SO4)","right":"Mangkin Vanadium(V) oksida (V2O5), suhu 450°C dan tekanan 1 atm"},{"id":"k3m4","left":"Penapaian Glukosa menjadi Etanol / Tapai","right":"Enzim dalam yis sebagai mangkin pada suhu optimum 37°C"},{"id":"k3m5","left":"Penukar Bermangkin Ekzos Kenderaan","right":"Menukar CO, hidrokarbon tak terbakar dan NOx kepada CO2, H2O dan N2"}],"explanation":"Menguasai pasangan mangkin-suhu-tekanan bagi Haber (Fe), Ostwald (Pt), Sentuh (V2O5), penapaian yis (37°C) dan penukar bermangkin kerap diuji dalam Kertas 1 dan Kertas 2."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Kompromi Proses Haber","voiceCaption":"Ramalkan kelebihan dan kelemahan operasi Proses Haber pada suhu 350 darjah Celsius berbanding 550 darjah Celsius serta cara mengatasinya mengikut Uji Kendiri tujuh perpuluhan tiga.","voiceScript":"[curious] Cuba selesaikan masalah jurutera kimia daripada Uji Kendiri tujuh perpuluhan tiga nombor dua! Dalam penghasilan ammonia, peratus hasilan ammonia lebih tinggi pada suhu tiga ratus lima puluh darjah Celsius berbanding lima ratus lima puluh darjah Celsius. Apakah kelemahan pada suhu tiga ratus lima puluh darjah Celsius dan bagaimanakah kelemahan ini diatasi?","hook":"Laraskan pelaras suhu pada Simulator Reaktor Proses Haber selepas memilih jawapan!","scenario":"Uji Kendiri 7.3 No. 2 (Rajah 7.19): Peratusan hasil NH3 menurun apabila suhu dinaikkan daripada 350 °C ke 550 °C, tetapi meningkat apabila tekanan dinaikkan.","prompt":"Apakah kelemahan suhu 350 °C dan 550 °C dalam Proses Haber serta cara terbaik mengatasinya?","options":["Pada 350°C kadar tindak balas terlalu lambat manakala pada 550°C peratus hasil NH3 rendah; diatasi dengan menggunakan mangkin serbuk ferum (Fe) pada suhu kompromi 450°C dan tekanan 200 atm","Pada 350°C gas nitrogen membeku menjadi pepejal manakala pada 550°C mangkin platinum terbakar","Pada 350°C hasil NH3 paling rendah tetapi kadar paling cepat; diatasi dengan menurunkan tekanan ke 1 atm","Menggantikan serbuk ferum dengan vanadium(V) oksida pada suhu bilik 25°C"],"correctIndex":0,"proofLabId":"kim47_industri_aplikasi_lab","proofState":{"tab":"industri","proc":"haber","temp":450,"press":200,"cat":"Fe"},"explanation":"Suhu 350°C memberi peratus hasil tinggi tetapi terlalu lambat secara ekonomi; suhu 550°C memberi kadar pantas tetapi peratus hasil ammonia rendah. Penggunaan mangkin serbuk Fe mempercepat tindak balas pada suhu sederhana 450°C serta tekanan tinggi 200 atm."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Kes Gas Ekzos Enjin","voiceCaption":"Susun penjelasan Uji Kendiri tujuh perpuluhan tiga nombor tiga mengapa nitrogen dan oksigen boleh bertindak balas dalam enjin kereta.","voiceScript":"[confident] Susun semula blok jawapan bagi soalan Uji Kendiri tujuh perpuluhan tiga nombor tiga B: pada suhu bilik, gas nitrogen tidak bertindak balas dengan oksigen, namun boleh membentuk nitrogen monoksida di dalam enjin kereta. Mengapa?","prompt":"Susun penjelasan pembentukan gas pencemar NO daripada N2 dan O2 di dalam enjin kereta:","hint":"Fokus kepada keadaan suhu dan tekanan tinggi dalam enjin kereta...","answerTokens":["Di dalam kebuk pembakaran enjin kereta","suhu dan tekanan yang sangat tinggi","meningkatkan kadar tindak balas antara gas nitrogen dan oksigen","untuk membentuk gas pencemar nitrogen monoksida"],"distractors":["kerana air penyejuk menurunkan suhu ke empat darjah Celsius","disebabkan penambahan serbuk vanadium lima oksida ke dalam tangki"],"explanation":"Walaupun tindak balas N2 + O2 -> 2NO amat perlahan pada suhu dan tekanan bilik, suhu serta tekanan yang amat tinggi di dalam enjin kereta mempercepat tindak balas tersebut sehingga gas pencemar NO terbentuk dalam ekzos."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Uji Kendiri 7.3: Aplikasi & Periuk Tekanan","voiceCaption":"Lengkapkan soalan sintesis Subtopik tujuh perpuluhan tiga mengenai peti sejuk, periuk tekanan, batu arang dan penukar bermangkin.","voiceScript":"[excited] Soalan penutup Unit tiga daripada Uji Kendiri tujuh perpuluhan tiga! Antara pernyataan tentang aplikasi kadar tindak balas dalam kehidupan harian berikut, manakah yang tepat seratus peratus?","prompt":"Pilih kesimpulan paling tepat bagi aplikasi kadar tindak balas dalam kehidupan harian (Uji Kendiri 7.3):","options":["Daging kecil & serpihan batu arang mempunyai jumlah luas permukaan besar; peti sejuk menurunkan suhu untuk melambatkan pembiakan bakteria; periuk tekanan menaikkan tekanan agar air mendidih melebihi 100°C","Periuk tekanan menurunkan takat didih air kepada 60°C untuk menjimatkan tenaga haba","Peti sejuk membunuh semua bakteria secara serta-merta dengan menaikkan kepekatan makanan","Penukar bermangkin ekzos kereta membebaskan lebih banyak karbon monoksida dan nitrogen oksida"],"correctIndex":0,"explanation":"Daging bersaiz kecil dan serpihan arang mempunyai jumlah luas permukaan terdedah lebih besar; peti sejuk merendahkan suhu untuk melambatkan pembiakan bakteria; periuk tekanan memerangkap stim bagi menaikkan tekanan dan takat didih air agar makanan lebih cepat masak."}]},{"id":"kim47-u4","title":"Unit 4: Teori Perlanggaran, Profil Tenaga Ea & Skema 4-Langkah","subtitle":"Subtopik 7.4 — Perlanggaran Berkesan & Orientasi, Tenaga Pengaktifan Ea & ΔH, Gambar Rajah Profil Tenaga serta Jawapan 4-Langkah SPM","iconType":"pendulum","iconUrl":"../assets/icons/kim47-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Teori Perlanggaran & 2 Syarat","voiceCaption":"Menurut Teori Perlanggaran, hanya perlanggaran berkesan menghasilkan tindak balas; zarah mesti mencapai tenaga pengaktifan Ea dan berlanggar pada orientasi betul.","voiceScript":"[warm] Selamat datang ke Unit empat, jantung peperiksaan Kertas dua bagi Bab tujuh iaitu Teori Perlanggaran! Tonton video tiga dimensi ini dan fahami dua prinsip emasnya: menurut teori kinetik jirim, zarah sentiasa bergerak rawak dan memindahkan tenaga kinetik antara satu sama lain apabila berlanggar, jadi zarah tidak mempunyai tenaga kinetik yang sama pada suhu tetap! Bukan semua perlanggaran menghasilkan tindak balas — hanya perlanggaran berkesan yang berjaya! Syaratnya ada dua: pertama, zarah mesti mempunyai tenaga sama atau melebihi tenaga pengaktifan E a untuk memecahkan ikatan lama dan membina ikatan baharu; kedua, zarah mesti berlanggar pada orientasi yang betul!","title":"Teori Perlanggaran: 2 Syarat Perlanggaran Berkesan & Orientasi","acronym":"E a • O•F","hook":"Tenaga pengaktifan Ea ibarat palang halangan lompatan kuda (Gambar foto 7.8): jika tenaga zarah kurang daripada Ea atau orientasi salah, zarah sekadar terpantul!","mediaKey":"kim47_collision_video_poster","videoClip":{"src":"../assets/kimia-t4-bab07/video/kim47_video_teori_perlanggaran_mangkin_narasi.mp4","hasNarration":true,"posterKey":"kim47_collision_video_poster","caption":"Teori perlanggaran, syarat tenaga pengaktifan Ea, orientasi betul dan tindakan mangkin."},"summary":"Teori perlanggaran menerangkan kadar tindak balas berdasarkan frekuensi perlanggaran berkesan, yang memerlukan tenaga minimum Ea dan orientasi perlanggaran yang betul.","bullets":["Teori Kinetik & Pemindahan Tenaga: Zarah sentiasa bergerak dan berlanggar secara rawak (bergetar di kedudukan tetap dalam pepejal; bebas dalam cecair/gas). Apabila berlanggar, zarah laju memindahkan tenaga kepada zarah perlahan — oleh itu pada suhu tetap, zarah TIDAK bergerak dengan halaju yang sama (Uji Kendiri 7.4 No. 1).","2 Syarat Wajib Perlanggaran Berkesan: (1) Zarah mempunyai tenaga sama atau melebihi tenaga pengaktifan Ea bagi memecahkan ikatan bahan tindak balas dan membentuk ikatan baharu; (2) Zarah berlanggar pada orientasi betul (Rajah 7.21) — jika orientasi tidak betul (Rajah 7.22), zarah terpantul tanpa tindak balas. Lebih tinggi frekuensi perlanggaran berkesan, lebih tinggi kadar tindak balas."],"labId":"kim47_teori_perlanggaran_canvas","labTitle":"Simulator 60fps Perlanggaran Molekul & Profil Tenaga","labProps":{"rxnType":"ekso","catalyst":true,"orient":true,"temp":45},"examTip":"Skema Uji Kendiri 7.4 No. 2: Nyatakan tepat kedua-dua syarat perlanggaran berkesan — (1) mencapai atau melebihi tenaga pengaktifan Ea, dan (2) berlanggar pada orientasi yang betul."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Orientasi Perlanggaran","voiceCaption":"Ramalkan apa yang berlaku apabila dua molekul gas berlanggar dengan tenaga melebihi tenaga pengaktifan tetapi pada orientasi yang tidak betul.","voiceScript":"[curious] Cuba uji pemahaman syarat kedua Teori Perlanggaran! Andaikan sepasang molekul dinitrogen monoksida dan nitrogen monoksida sudah mempunyai tenaga kinetik melebihi tenaga pengaktifan E a, tetapi atom oksigen kedua-duanya berlanggar sesama sendiri pada orientasi salah. Apakah yang akan berlaku?","hook":"Tukar butang Orientasi Betul vs Salah pada simulator 60fps untuk melihat molekul terpantul!","scenario":"Dua zarah bahan tindak balas N2O dan NO bergerak laju dengan tenaga >= Ea lalu berlanggar pada orientasi tidak betul (Rajah 7.22).","prompt":"Apakah hasil daripada perlanggaran tersebut menurut Teori Perlanggaran?","options":["Kedua-dua zarah terpantul tanpa sebarang tindak balas kerana orientasi perlanggaran tidak betul tidak menghasilkan perlanggaran berkesan","Ikatan lama masih pecah dan membentuk hasil baharu kerana tenaga melebihi Ea sudah memadai","Tenaga pengaktifan Ea bertukar menjadi haba tindak balas ΔH negatif secara automatik","Molekul bertukar menjadi mangkin pepejal yang mempercepat zarah lain"],"correctIndex":0,"proofLabId":"kim47_teori_perlanggaran_canvas","proofState":{"rxnType":"ekso","catalyst":false,"orient":false,"temp":55},"explanation":"Kedua-dua syarat MESTI dipenuhi serentak: tenaga >= Ea DAN orientasi betul. Jika orientasi tidak betul, ikatan yang diperlukan tidak dapat putus dan terbentuk, maka zarah sekadar terpantul dan tiada tindak balas berlaku."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Profil Tenaga Ea & ΔH","voiceCaption":"Gambar rajah profil tenaga menunjukkan tenaga pengaktifan Ea dari paras bahan ke puncak lengkung serta haba tindak balas delta H bagi tindak balas eksotermik dan endotermik; mangkin hanya merendahkan Ea.","voiceScript":"[warm] Sekarang fokus kepada lukisan wajib Kertas dua iaitu Gambar Rajah Profil Tenaga! Pertama, ketahui beza tindak balas eksotermik dengan endotermik: tindak balas eksotermik membebaskan haba ke persekitaran kerana paras tenaga bahan melebihi paras tenaga hasil, jadi delta H bernilai negatif! Tindak balas endotermik pula menyerap haba dari persekitaran kerana tenaga hasil lebih tinggi daripada bahan! Kedua, anak panah tenaga pengaktifan E a MESTI bermula dari paras bahan tindak balas hingga ke puncak lengkung! Apabila mangkin hadir, mangkin membuka lintasan alternatif dengan tenaga pengaktifan E a prima yang lebih rendah tanpa mengubah nilai delta H!","title":"Gambar Rajah Profil Tenaga: Eksotermik, Endotermik, Ea & Kesan Mangkin","acronym":"Ea•Ea'•ΔH","hook":"Peraturan lukisan graf SPM: Anak panah Ea MESTI dari paras BAHAN hingga PUNCAK (bukan dari paksi-X dan bukan dari paras hasil!), manakala ΔH kekal sama walaupun bermangkin!","mediaKey":"kim47_catalyst_mno2","summary":"Setiap tindak balas eksotermik (membebas haba, ΔH < 0) dan endotermik (menyerap haba, ΔH > 0) mempunyai halangan Ea dari paras bahan ke puncak; mangkin menyediakan lintasan alternatif dengan Ea' lebih rendah.","bullets":["Eksotermik vs Endotermik (Rajah 7.20 & 7.27): Dalam tindak balas eksotermik, jumlah tenaga bahan > hasil tindak balas (membebaskan haba ke persekitaran, ΔH negatif). Dalam endotermik, jumlah tenaga hasil > bahan tindak balas (menyerap haba daripada persekitaran, ΔH positif). Perubahan kandungan tenaga antara bahan dengan hasil dipanggil haba tindak balas (ΔH).","Kesan Mangkin pada Profil Tenaga (Rajah 7.26): Mangkin menyediakan lintasan tindak balas alternatif yang memerlukan tenaga pengaktifan lebih rendah (Ea' < Ea). Paras tenaga bahan, paras tenaga hasil dan magnitud ΔH TIDAK berubah."],"labId":"kim47_teori_perlanggaran_canvas","labTitle":"Simulator Profil Tenaga Eksotermik vs Endotermik & Ea'","labProps":{"rxnType":"endo","catalyst":true,"orient":true,"temp":50},"examTip":"Semasa melukis gambar rajah profil tenaga untuk soalan bermangkin: lukis lengkung asal berlabel Ea (garisan padu) dan lengkung kedua yang lebih rendah berlabel Ea' (garisan putus-putus/berbeza) bermula dan berakhir pada paras bahan dan hasil yang SAMA."},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Profil Tenaga & Kinetik","voiceCaption":"Padankan lima istilah utama Teori Perlanggaran dan Gambar Rajah Profil Tenaga dengan takrif atau ciri tepatnya.","voiceScript":"[confident] Jom kukuhkan ketepatan istilah Subtopik tujuh perpuluhan empat! Padankan kelima-lima istilah gambar rajah profil tenaga dan teori perlanggaran ini dengan huraian tepatnya.","prompt":"Padankan istilah Teori Perlanggaran berikut dengan huraian saintifik tepatnya:","pairs":[{"id":"k4m1","left":"Tenaga Pengaktifan (Ea)","right":"Tenaga minimum dari paras bahan hingga puncak lengkung untuk memecahkan ikatan"},{"id":"k4m2","left":"Haba Tindak Balas (ΔH)","right":"Perubahan kandungan tenaga antara bahan tindak balas dengan hasil tindak balas"},{"id":"k4m3","left":"Tindak Balas Eksotermik","right":"Membebaskan haba ke persekitaran; tenaga bahan melebihi tenaga hasil"},{"id":"k4m4","left":"Tindak Balas Endotermik","right":"Menyerap haba daripada persekitaran; tenaga hasil melebihi tenaga bahan"},{"id":"k4m5","left":"Lintasan Alternatif Mangkin (Ea')","right":"Merendahkan tenaga pengaktifan tanpa mengubah aras bahan, hasil atau ΔH"}],"explanation":"Menguasai takrif tepat Ea (bahan -> puncak), ΔH (bahan -> hasil), ciri eksotermik/endotermik serta fungsi lintasan alternatif mangkin menjamin markah penuh lukisan profil tenaga SPM."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Skema 4-Langkah Kertas 2 SPM","voiceCaption":"Setiap soalan penerangan kadar tindak balas Kertas dua dijawab mengikut empat langkah teratur bermula daripada perubahan zarah sehingga peningkatan frekuensi perlanggaran berkesan.","voiceScript":"[warm] Inilah rahsia skor penuh empat markah dalam soalan penerangan Teori Perlanggaran Kertas dua S P M! Teroka kesemua enam kad tiga dimensi di bawah untuk menghafal susunan empat langkah bagi setiap faktor! Untuk kepekatan atau tekanan gas, bilangan zarah per unit isi padu bertambah! Untuk saiz pepejal, hanya zarah di permukaan luar bertindak balas, jadi cebisan kecil menambah jumlah luas permukaan terdedah! Untuk suhu, tenaga kinetik zarah bertambah supaya lebih banyak zarah mengatasi tenaga pengaktifan! Dan untuk mangkin, ia merendahkan tenaga pengaktifan melalui lintasan alternatif! Kesemuanya wajib ditutup dengan kata kunci emas: frekuensi perlanggaran berkesan bertambah, maka kadar tindak balas bertambah!","title":"Skema Jawapan 4-Langkah Kertas 2 SPM bagi Kesemua 5 Faktor","acronym":"4•LANGKAH","hook":"Pantang larang Kertas 2: JANGAN berhenti pada 'frekuensi perlanggaran bertambah' — wajib tambah perkataan BERKESAN menjadi 'frekuensi perlanggaran berkesan bertambah'!","mediaKey":"kim47_precipitate_cross","summary":"Teori perlanggaran menyediakan templat penerangan 4-langkah yang seragam dan mantap untuk menerangkan kesan kepekatan, tekanan, saiz, suhu dan mangkin dalam Kertas 2 SPM.","bullets":["Skema 4-Langkah Kepekatan, Tekanan Gas & Saiz: Langkah 1 (Faktor fizikal): Kepekatan/Tekanan tinggi -> bilangan zarah per unit isi padu bertambah; Saiz kecil -> jumlah luas permukaan terdedah kepada perlanggaran bertambah (hanya zarah luar pepejal berlanggar, Rajah 7.24). Langkah 2: Frekuensi perlanggaran antara zarah bertambah. Langkah 3: Frekuensi perlanggaran berkesan bertambah. Langkah 4: Kadar tindak balas bertambah.","Skema 4-Langkah Suhu & Mangkin: Suhu tinggi -> tenaga kinetik zarah bertambah & lebih banyak zarah mencapai >= Ea -> frekuensi perlanggaran & frekuensi perlanggaran berkesan bertambah -> kadar bertambah. Mangkin hadir -> menyediakan lintasan alternatif dengan merendahkan tenaga pengaktifan (Ea' < Ea) -> lebih banyak zarah bahan mencapai tenaga pengaktifan itu -> frekuensi perlanggaran berkesan bertambah -> kadar bertambah."],"labId":"kim47_skema_4langkah_deck","labTitle":"Dek Kad 3D Skema 4-Langkah Kertas 2 (5 Faktor + Profil)","labProps":{"filter":"all"},"examTip":"Semak 4 poin markah esei Kertas 2: Poin 1 (Sebab khusus faktor: zarah/unit isi padu, luas permukaan, tenaga kinetik, atau lintasan alternatif Ea'); Poin 2 (Perlanggaran/zarah capai Ea); Poin 3 (Frekuensi perlanggaran BERKESAN meningkat); Poin 4 (Kadar tindak balas meningkat)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Isih Kata Kunci 4-Langkah","voiceCaption":"Kelaskan enam pernyataan teori perlanggaran berikut kepada faktor Suhu atau Mangkin berbanding faktor Kepekatan atau Saiz Pepejal.","voiceScript":"[confident] Jangan tertukar kata kunci antara faktor dalam Kertas dua! Asingkan keenam-enam huraian langkah pertama teori perlanggaran ini mengikut kumpulan faktor yang betul.","prompt":"Isihkan huraian Teori Perlanggaran berikut mengikut kumpulan faktor yang tepat:","buckets":[{"id":"pek_saiz","label":"Kepekatan / Tekanan / Saiz Pepejal"},{"id":"suhu_mangkin","label":"Suhu / Kehadiran Mangkin"}],"items":[{"text":"Bilangan zarah bahan tindak balas per unit isi padu bertambah","bucketId":"pek_saiz","note":"Langkah 1 bagi kepekatan larutan dan tekanan gas"},{"text":"Menyediakan lintasan alternatif dengan tenaga pengaktifan Ea' lebih rendah","bucketId":"suhu_mangkin","note":"Langkah 1 khusus bagi kehadiran mangkin"},{"text":"Jumlah luas permukaan pepejal terdedah kepada perlanggaran bertambah","bucketId":"pek_saiz","note":"Langkah 1 bagi pengecilan saiz ketulan pepejal"},{"text":"Tenaga kinetik purata zarah meningkat dan lebih banyak zarah mengatasi Ea","bucketId":"suhu_mangkin","note":"Langkah 1 & 2 khusus bagi peningkatan suhu"},{"text":"Lebih banyak zarah bahan tindak balas berupaya mencapai tenaga pengaktifan","bucketId":"suhu_mangkin","note":"Berlaku apabila suhu meningkat atau mangkin merendahkan Ea'"},{"text":"Lebih banyak zarah permukaan luar pepejal berlanggar tanpa mengubah isi padu pepejal","bucketId":"pek_saiz","note":"Konsep Rajah 7.24 apabila ketulan dipecahkan menjadi cebisan kecil"}],"explanation":"Kepekatan, tekanan dan saiz TIDAK mengubah tenaga kinetik zarah atau Ea — ia hanya menambah bilangan zarah per unit isi padu atau luas permukaan terdedah. Suhu menambah tenaga kinetik zarah; mangkin merendahkan Ea melalui lintasan alternatif."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Bina Skema 4-Langkah Mangkin","voiceCaption":"Susun jawapan lengkap empat langkah Teori Perlanggaran bagi menerangkan bagaimana mangkin mempercepat tindak balas.","voiceScript":"[confident] Susun semula blok jawapan struktur untuk soalan Uji Kendiri tujuh perpuluhan empat nombor tiga: bagaimanakah mangkin dapat mempercepat sesuatu tindak balas kimia?","prompt":"Susun jawapan 4-langkah lengkap menerangkan bagaimana mangkin mempercepat tindak balas:","hint":"Mulakan dengan lintasan alternatif, diikuti tenaga pengaktifan, bilangan zarah dan frekuensi...","answerTokens":["Mangkin menyediakan lintasan tindak balas alternatif","dengan tenaga pengaktifan lebih rendah","supaya lebih banyak zarah mencapai tenaga pengaktifan itu","lalu meningkatkan frekuensi perlanggaran berkesan dan kadar tindak balas"],"distractors":["dengan menambah tenaga kinetik zarah dan menaikkan nilai ΔH","kerana jisim mangkin bertambah di dalam larutan"],"explanation":"Skema rasmi 4 markah: (1) Mangkin menyediakan lintasan alternatif (2) dengan tenaga pengaktifan lebih rendah, (3) lebih banyak zarah mencapai tenaga pengaktifan tersebut, (4) frekuensi perlanggaran berkesan bertambah -> kadar bertambah."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Uji Kendiri 7.4: Teori Kinetik & Ea","voiceCaption":"Selesaikan soalan Uji Kendiri tujuh perpuluhan empat mengenai kebenaran teori kinetik jirim dan kesan peningkatan suhu terhadap tenaga pengaktifan.","voiceScript":"[excited] Soalan penutup Unit empat daripada Uji Kendiri tujuh perpuluhan empat! Antara pernyataan tentang teori kinetik jirim dan kesan peningkatan suhu berikut, manakah yang benar seratus peratus?","prompt":"Pilih pernyataan yang TEPAT mengenai zarah dalam Teori Perlanggaran (Uji Kendiri 7.4):","options":["Perlanggaran antara zarah adalah rawak; tidak semua zarah bergerak dengan halaju sama pada suhu tetap; peningkatan suhu meningkatkan tenaga kinetik zarah untuk mengatasi Ea tanpa merendahkan nilai Ea","Pada suhu tetap, semua zarah sentiasa bergerak dengan halaju yang tepat sama","Zarah dalam pepejal bergerak bebas manakala kenaikan suhu merendahkan tenaga pengaktifan Ea","Peningkatan kepekatan meningkatkan tenaga kinetik zarah serta menukar nilai ΔH tindak balas"],"correctIndex":0,"explanation":"Mengikut Uji Kendiri 7.4 No. 1: (a) SALAH — zarah tidak mempunyai halaju sama pada suhu tetap; (b) SALAH — zarah pepejal hanya bergetar di kedudukan tetap; (c) BETUL — perlanggaran rawak; (d) BETUL — tenaga kinetik bertambah dengan suhu (Ea hanya direndahkan oleh mangkin!)."}]},{"id":"kim47-u5","title":"Unit 5: Cabaran Boss SPM — Penguasaan Kadar Tindak Balas","subtitle":"Sintesis Kertas 1 & Kertas 2 — Praktis Sumatif Bab 7 (No. 1-4), Sudut Pengayaan, Profil Tenaga & Skema Teori Perlanggaran","iconType":"trophy","iconUrl":"../assets/icons/kim47-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Kes 1: Sumatif No. 1 & 2","voiceCaption":"Selesaikan soalan Praktis Sumatif nombor satu dan dua mengenai pasangan unit kadar tindak balas serta susunan kelajuan lima tindak balas harian.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M Bab tujuh! Cabaran pertama menguji Praktis Sumatif nombor satu dan nombor dua! Padankan tiga unit ukuran kuantiti dengan unit kadar yang sepadan, serta susun lima tindak balas harian mengikut kelajuan kadar menurun: pembakaran gas dapur, merebus telur, membakar kek, pereputan pisang dan pengaratan paku besi!","stimulusHtml":"<div class='stimulus-note'><strong>Praktis Sumatif Bab 7 (No. 1 &amp; 2):</strong> Tindak balas harian: (a) Pereputan pisang, (b) Membakar kek, (c) Merebus telur, (d) Pembakaran gas dapur, (e) Pengaratan paku besi.</div>","prompt":"Manakah jawapan TEPAT bagi tertib kelajuan menurun (No. 2) dan unit kadar sepadan (No. 1)?","options":["Tertib menurun: Pembakaran gas dapur > Merebus telur > Membakar kek > Pereputan pisang > Pengaratan paku besi | Unit kadar: g s^-1, cm^3 s^-1, mol dm^-3 s^-1","Tertib menurun: Membakar kek > Pembakaran gas dapur > Merebus telur > Pengaratan paku besi > Pereputan pisang | Unit kadar: g s, cm^3 s, mol s","Tertib menurun: Pengaratan paku besi > Pereputan pisang > Merebus telur > Membakar kek > Pembakaran gas dapur | Unit kadar: g s^-1, cm^3 s^-1","Tertib menurun: Pembakaran gas dapur > Membakar kek > Merebus telur > Pengaratan paku besi > Pereputan pisang | Unit kadar: mol dm^-3"],"correctIndex":0,"explanation":"Pembakaran gas dapur berlaku dalam beberapa saat (paling cepat), diikuti merebus telur (~10 min), membakar kek (~40-60 min), pereputan pisang (beberapa hari) dan pengaratan besi (minggu/bulan). Unit kadar mesti dibahagi masa: g s^-1, cm^3 s^-1, dan mol dm^-3 s^-1."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Kes 2: Sumatif No. 3 Enzim Susu","voiceCaption":"Ramalkan corak graf satu per masa melawan suhu apabila enzim penghadam protein membersihkan susu sehingga tanda pangkah X kelihatan pada suhu lima belas hingga enam puluh lima darjah Celsius.","voiceScript":"[curious] Cabaran Boss kedua terus daripada Praktis Sumatif nombor tiga! Satu enzim penghadam protein menyingkirkan kekeruhan susu hingga tanda X kelihatan. Pada lima belas darjah Celsius ia mengambil masa dua belas minit, dua puluh lima darjah Celsius tujuh minit, tiga puluh lima darjah Celsius dua perpuluhan lima minit, lalu naik semula menjadi empat minit pada empat puluh lima darjah Celsius dan sembilan belas minit pada enam puluh lima darjah Celsius! Mengapakah kadar satu per masa menjunam selepas tiga puluh lima darjah Celsius?","hook":"Sahkan lengkung loceng graf 1/masa ujian enzim susu pada Simulator Faktor selepas menjawab!","scenario":"Jadual 1 Sumatif No. 3: Suhu (°C) = 15, 25, 35, 45, 55, 65 -> Masa 'X' kelihatan (min) = 12.0, 7.0, 2.5, 4.0, 7.0, 19.0.","prompt":"Hitung 1/masa pada 35 °C dan terangkan kesimpulan graf 1/masa melawan suhu tersebut:","options":["Pada 35°C, kadar = 1/2.5 = 0.400 minit^-1 (optimum); kadar meningkat hingga 35°C akibat pertambahan tenaga kinetik, kemudian menurun dari 45°C ke 65°C kerana enzim ternyahasli pada suhu terlalu tinggi","Pada 35°C, kadar = 2.500 minit^-1; kadar menurun selepas 35°C kerana susu membeku menjadi pepejal","Pada 65°C, kadar mencapai maksimum 19.0 minit^-1 kerana tenaga pengaktifan meningkat","Graf 1/masa ialah garis lurus menaik dari 15°C ke 65°C tanpa sebarang penurunan"],"correctIndex":0,"proofLabId":"kim47_faktor_eksperimen_lab","proofState":{"factor":"enzim","enzimTemp":35},"explanation":"Kadar tindak balas berkadar songsang dengan masa (1/masa). Nilai tertinggi pada 35°C ialah 1/2.5 = 0.400 min^-1 (suhu optimum enzim). Dari 15°C ke 35°C kadar meningkat dengan suhu; melebihi 35°C enzim mula ternyahasli menyebabkan kadar menjunam (0.250 -> 0.143 -> 0.053 min^-1)."},{"type":"match","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Kes 3: Sintesis Industri & Mangkin","voiceCaption":"Padankan lima sistem tindak balas dan proses industri utama Bab tujuh dengan mangkin serta syarat tepatnya.","voiceScript":"[confident] Cabaran Boss ketiga menguji ketepatan kesemua mangkin dan proses industri Bab tujuh! Padankan kesemua lima pasangan berikut tanpa sebarang kesilapan.","prompt":"Padankan proses kimia dan tindak balas berikut dengan mangkin atau syarat tepatnya:","pairs":[{"id":"b7m1","left":"Proses Haber (N2 + 3H2 <-> 2NH3)","right":"Serbuk Ferum (Fe), 450°C-550°C, 200 atm"},{"id":"b7m2","left":"Proses Ostwald (NH3 -> NO -> HNO3)","right":"Platinum (Pt), 850°C, 5 atm"},{"id":"b7m3","left":"Proses Sentuh (2SO2 + O2 <-> 2SO3 -> H2SO4)","right":"Vanadium(V) oksida (V2O5), 450°C, 1 atm"},{"id":"b7m4","left":"Penguraian H2O2 (Aktiviti 7.4)","right":"MnO2 lebih berkesan daripada Fe dan CuO (100 cm^3 O2 dalam 40 s)"},{"id":"b7m5","left":"Tindak balas Zn + H2SO4 bermangkin","right":"Larutan kuprum(II) sulfat (CuSO4) mempercepat pembebasan gas H2"}],"explanation":"Penguasaan padanan kesemua mangkin makmal (MnO2, CuSO4) dan mangkin industri (Fe, Pt, V2O5) memastikan markah mantap dalam Bahagian A dan Bahagian B Kertas 2."},{"type":"sort","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Kes 4: Audit Perangkap SPM","voiceCaption":"Isihkan enam kuantiti atau tindakan berikut antara perkara yang berubah untuk mempercepat kadar dengan perkara yang kekal tidak berubah atau melambatkan kadar.","voiceScript":"[confident] Pecutan Boss keempat menguji kesemua perangkap popular S P M! Asingkan antara perkara yang mempercepat kadar atau meningkatkan nilai kecerunan berbanding perkara yang kekal tidak berubah atau merendahkan kadar!","prompt":"Isihkan enam item audit SPM Bab 7 berikut kepada kesan yang betul:","buckets":[{"id":"cepat_naik","label":"Meningkatkan Kadar / Kecerunan Awal"},{"id":"kekal_lambat","label":"Kekal Sama / Tidak Mempercepat Kadar"}],"items":[{"text":"Menghancurkan ketulan timah atau marmar kepada serbuk halus sebelum ditambah asid","bucketId":"cepat_naik","note":"Membesarkan jumlah luas permukaan dan frekuensi perlanggaran berkesan"},{"text":"Haba tindak balas ΔH serta jumlah isi padu gas maksimum apabila mangkin ditambah","bucketId":"kekal_lambat","note":"Mangkin tidak mengubah ΔH mahupun jumlah hasil akhir"},{"text":"Menaikkan suhu air daripada 30 °C kepada 40 °C atau kepekatan asid daripada 0.5 M ke 1.0 M","bucketId":"cepat_naik","note":"Menambah tenaga kinetik atau bilangan zarah per unit isi padu"},{"text":"Menambah isi padu HCl berlebihan daripada 50 cm^3 ke 100 cm^3 pada kepekatan tetap 2.0 M","bucketId":"kekal_lambat","note":"Kepekatan ion H+ tidak berubah, jadi kadar awal kekal sama"},{"text":"Mengenakan tekanan tinggi kepada campuran tindak balas melibatkan bahan berkeadaan pepejal sahaja","bucketId":"kekal_lambat","note":"Tekanan hanya mempengaruhi tindak balas melibatkan bahan gas"},{"text":"Membuka lintasan alternatif berhalangan Ea' lebih rendah dengan mangkin","bucketId":"cepat_naik","note":"Lebih banyak zarah mencapai Ea' dan frekuensi perlanggaran berkesan meningkat"}],"explanation":"Mengenal pasti invarian SPM — ΔH tidak diubah mangkin, jumlah hasil ditetapkan oleh bahan penghad, isi padu asid berlebihan pada kepekatan sama tidak ubah kadar, dan tekanan tidak ubah kadar pepejal/cecair — membezakan calon gred A+!"},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Kes 5: Sudut Pengayaan No. 1","voiceCaption":"Susun jawapan lengkap Teori Perlanggaran bagi soalan Sudut Pengayaan nombor satu membandingkan asid hidroklorik satu molar dengan sifar perpuluhan lima molar.","voiceScript":"[warm] Cabaran Boss kelima diambil daripada Sudut Pengayaan nombor satu! Satu gram serbuk marmar ditambah ke dalam asid hidroklorik satu molar berbanding sifar perpuluhan lima molar. Susun ayat jawapan empat langkah Kertas dua yang lengkap bagi menjelaskan tindak balas mana lebih cepat!","prompt":"Susun jawapan 4-langkah Sudut Pengayaan No. 1 (1.0 g CaCO3 + HCl 1.0 M vs 0.5 M):","hint":"Nyatakan kepekatan lebih tinggi dahulu, diikuti ion H+ per unit isi padu...","answerTokens":["HCl 1.0 mol dm^-3 bertindak balas lebih cepat kerana kepekatannya lebih tinggi","maka bilangan ion hidrogen per unit isi padu bertambah","menyebabkan frekuensi perlanggaran antara ion hidrogen dan CaCO3 bertambah","lalu meningkatkan frekuensi perlanggaran berkesan dan kadar tindak balas"],"distractors":["kerana isi padu asid 50 cm^3 menaikkan tenaga pengaktifan Ea","menyebabkan jisim CaCO3 menghasilkan dua kali lebih banyak gas CO2"],"explanation":"Dalam Sudut Pengayaan No. 1: HCl 1.0 mol dm^-3 mempunyai bilangan ion H+ per unit isi padu lebih tinggi daripada HCl 0.5 mol dm^-3 -> frekuensi perlanggaran antara ion H+ dengan zarah CaCO3 bertambah -> frekuensi perlanggaran berkesan bertambah -> kadar lebih tinggi."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Sumatif No. 4 N2O & NO","voiceCaption":"Selesaikan cabaran akhir Praktis Sumatif nombor empat merangkumi pengimbangan persamaan ammonium nitrat, profil tenaga eksotermik dan orientasi perlanggaran dinitrogen monoksida dengan nitrogen monoksida.","voiceScript":"[excited] Cabaran Boss terakhir terus daripada Praktis Sumatif nombor empat! Dinitrogen monoksida terhasil daripada penguraian ammonium nitrat berserta air dan haba, kemudian bertindak balas dengan nitrogen monoksida menghasilkan nitrogen dan nitrogen dioksida. Manakah imbangan persamaan, ciri gambar rajah profil tenaga dan orientasi perlanggaran berkesan yang tepat sepenuhnya?","stimulusHtml":"<div class='stimulus-note'><strong>Praktis Sumatif 7 No. 4(b)-(c):</strong><br>(i) NH<sub>4</sub>NO<sub>3</sub>(ak) &rarr; N<sub>2</sub>O(g) + ___ H<sub>2</sub>O(ce) + Haba<br>(ii) N<sub>2</sub>O(g) + NO(g) &rarr; N<sub>2</sub>(g) + NO<sub>2</sub>(g)</div>","prompt":"Manakah kombinasi jawapan yang BETUL 100% bagi persamaan terimbang, profil tenaga dan orientasi perlanggaran?","options":["Pekali air = 2 H2O; profil eksotermik (tenaga NH4NO3 > N2O + 2H2O, Ea dari aras bahan ke puncak lengkung); orientasi betul ialah hujung O pada N2O (N=N=O) berlanggar dengan atom N pada NO (N=O) untuk membentuk N2 dan NO2","Pekali air = 4 H2O; profil endotermik (tenaga hasil > bahan); orientasi betul ialah atom N pada N2O berlanggar dengan atom O pada NO","Pekali air = 2 H2O; Ea diukur dari paksi-X ke aras hasil tindak balas; mangkin menurunkan nilai ΔH","Pekali air = 1 H2O; profil eksotermik mempunyai paras bahan lebih rendah daripada paras hasil tindak balas"],"correctIndex":0,"explanation":"Tahniah! Persamaan terimbang ialah NH4NO3(ak) -> N2O(g) + 2H2O(ce) + Haba. Kerana haba dibebaskan, ia tindak balas eksotermik (paras bahan > hasil; Ea diukur dari aras bahan ke puncak). Untuk N2O + NO -> N2 + NO2, atom oksigen hujung N-N-O mesti berlanggar dengan atom N pada N-O supaya ikatan N-O pada N2O putus dan ikatan O baharu terbentuk menjadi O-N-O (NO2) serta N2. Bab 7 Kadar Tindak Balas selesai dikuasai sepenuhnya!"}]}]};</script>

    function computePchipSlopes(pts) {
      var n = pts.length;
      var d = [];
      for (var i = 0; i < n - 1; i++) {
        d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]));
      }
      var m = new Array(n);
      m[0] = d[0];
      m[n - 1] = d[n - 2];
      for (var k = 1; k < n - 1; k++) {
        if (d[k - 1] * d[k] <= 0) {
          m[k] = 0;
        } else {
          var w1 = 2 * (pts[k + 1][0] - pts[k][0]) + (pts[k][0] - pts[k - 1][0]);
          var w2 = (pts[k + 1][0] - pts[k][0]) + 2 * (pts[k][0] - pts[k - 1][0]);
          m[k] = (w1 + w2) / (w1 / d[k - 1] + w2 / d[k]);
        }
      }
      return m;
    }

    function evalPchip(pts, slopes, tVal) {
      if (tVal <= pts[0][0]) return { y: pts[0][1], dy: slopes[0] };
      var last = pts.length - 1;
      if (tVal >= pts[last][0]) return { y: pts[last][1], dy: 0 };
      for (var i = 0; i < last; i++) {
        var t0 = pts[i][0];
        var t1 = pts[i + 1][0];
        if (tVal <= t1) {
          var h = t1 - t0;
          var s = (tVal - t0) / h;
          var h00 = (1 + 2 * s) * (1 - s) * (1 - s);
          var h10 = s * (1 - s) * (1 - s);
          var h01 = s * s * (3 - 2 * s);
          var h11 = s * s * (s - 1);
          var y = h00 * pts[i][1] + h10 * h * slopes[i] + h01 * pts[i + 1][1] + h11 * h * slopes[i + 1];
          var dh00 = 6 * s * (s - 1) / h;
          var dh10 = (3 * s * s - 4 * s + 1);
          var dh01 = 6 * s * (1 - s) / h;
          var dh11 = (3 * s * s - 2 * s);
          var dy = dh00 * pts[i][1] + dh10 * slopes[i] + dh01 * pts[i + 1][1] + dh11 * slopes[i + 1];
          return { y: y, dy: dy };
        }
      }
      return { y: pts[last][1], dy: 0 };
    }

        var pBtns = Object.keys(presets).map(function (pk) {

        bodyHtml = [

          '  <input id="rngKim47Time" class="lab-range" type="range" min="' + pr.tStep + '" max="' + pr.tMax + '" step="' + pr.tStep + '" value="' + tSlider + '"></label>',
          "</div>",
          '<div class="lab-stage">' + svgGraph + "</div>",
          '<div class="lab-readout-grid">',
          '  <div class="lab-meter"><span class="lab-meter-label">Kadar pada Masa t (Tangen)</span><strong class="lab-meter-val tabular-nums">' + rateMag.toFixed(2) + " " + esc(pr.rateUnit) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">Kadar Purata Keseluruhan</span><strong class="lab-meter-val tabular-nums">' + esc(pr.avgLabel) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">Kadar Sela Masa / Tertib</span><strong class="lab-meter-val tabular-nums">' + esc(pr.intervalLabel) + "</strong></div>",
          "</div>",
          '<div class="lab-callout"><strong>Analisis Graf KSSM:</strong> ' + esc(pr.note) + (rateMag <= 0.01 ? " <strong>Tangen mendatar (0.00)</strong> menandakan tindak balas telah tamat!" : " Segi tiga tangen semasa: &Delta;y = " + dyTri.toFixed(1) + " bahagi &Delta;t = " + dtTri.toFixed(1) + ".") + "</div>"
        ].join("");
      }

      shell.innerHTML = tabsHtml + bodyHtml;

      shell.querySelectorAll("[data-k71-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          tab = btn.getAttribute("data-k71-tab");
          playSfx("tap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();

      });

      shell.querySelectorAll("[data-k71-rxn]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          rxnKey = btn.getAttribute("data-k71-rxn");
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });

      shell.querySelectorAll("[data-k71-pr]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          presetKey = btn.getAttribute("data-k71-pr");
          tSlider = presetKey === "contoh1" ? 2.0 : (presetKey === "jadual73" ? 1.5 : (presetKey === "rajah710" ? 1.0 : 15));
          playSfx("paper");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });

      var rng = shell.querySelector("#rngKim47Time");
      if (rng) {
        rng.addEventListener("input", function () {
          tSlider = Number(rng.value) || 0;
          if (ctx && ctx.markInteracted) ctx.markInteracted();

    render();
