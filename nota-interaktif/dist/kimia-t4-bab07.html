  /* =========================================================================
     MAKMAL 2: kim47_faktor_eksperimen_lab
     Subtopik 7.2: Simulator 60fps 4+1 Faktor Kadar & Eksperimen Pangkah 'X'
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.kim47_faktor_eksperimen_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var factor = ps.factor || "conc";
    var chipSize = ps.chipSize === "large" ? "large" : "small";
    var naVolIdx = typeof ps.naVolIdx === "number" ? ps.naVolIdx : 0; // 0..4 => Jadual 7.5: 45, 40, 30, 20, 10 cm3
    var tempC = typeof ps.temp === "number" ? ps.temp : 45;
    var enzimTempC = typeof ps.enzimTemp === "number" ? ps.enzimTemp : 35;
    var catChoice = ps.cat || "mno2"; // "none" | "cuo" | "fe" | "mno2"
    var pressureAtm = typeof ps.pressure === "number" ? ps.pressure : 100;

    var paused = reducedMotion();
    var rafId = 0;
    var lastTs = 0;
    var simElapsed = ctx && ctx.mode === "proof" ? 28 : 0;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;

    var exp72Rows = [
      { code: "I", vNa: 45, vWater: 0, m2: 0.18, time: 18.0 },
      { code: "II", vNa: 40, vWater: 5, m2: 0.16, time: 20.5 },
      { code: "III", vNa: 30, vWater: 15, m2: 0.12, time: 27.0 },
      { code: "IV", vNa: 20, vWater: 25, m2: 0.08, time: 40.5 },
      { code: "V", vNa: 10, vWater: 35, m2: 0.04, time: 81.0 }
    ];

    var particles = [];
    for (var i = 0; i < 42; i++) {
      particles.push({
        nx: (i * 0.193 + 0.09) % 1,
        ny: (i * 0.317 + 0.17) % 1,
        vx: Math.cos(i * 1.43) * 0.72,
        vy: Math.sin(i * 2.09) * 0.72,
        kind: i % 2
      });
    }

    function getMetrics() {
      var rateFactor = 1;
      var targetTimeSec = 25;
      var isCross = factor === "conc" || factor === "temp" || factor === "enzim";
      var label = "";
      var note = "";
      var rightTitle = "";
      var rateStr = "";

      if (factor === "size") {
        rateFactor = chipSize === "small" ? 2.2 : 0.85;
        targetTimeSec = chipSize === "small" ? 24.0 : 58.0;
        label = "Eksperimen 7.1: Saiz Ketulan CaCO3 + HCl 0.1 M";
        rightTitle = "BURET TERBALIK (CO2)";
        rateStr = (50 / targetTimeSec).toFixed(2) + " cm3 s^-1";
        note = "Jumlah isi padu gas CO2 akhir kekal sama kerana jisim marmar (5.0 g) dan asid (80.0 cm3) tidak berubah, tetapi ketulan kecil mempunyai jumlah luas permukaan terdedah lebih besar untuk perlanggaran.";
      } else if (factor === "conc") {
        var row = exp72Rows[Math.max(0, Math.min(4, naVolIdx))];
        rateFactor = row.m2 / 0.10;
        targetTimeSec = row.time;
        label = "Eksperimen 7.2: Kepekatan Na2S2O3 (Eksperimen " + row.code + ")";
        rightTitle = "TANDA 'X' + GRAF 1/t";
        rateStr = (1 / targetTimeSec).toFixed(4) + " s^-1";
        note = "Mengikut M1V1 = M2V2 (jumlah isi padu campuran ditetapkan 50.0 cm3 dengan air suling), kepekatan lebih tinggi memperbanyak zarah tiosulfat per unit isi padu untuk menghasilkan mendakan kuning sulfur (S2O3^2- + 2H+ -> H2O + SO2 + S).";
      } else if (factor === "temp") {
        rateFactor = Math.pow(1.072, tempC - 28); // ~doubles every 10C
        targetTimeSec = Math.max(10.0, Math.round((62.0 / rateFactor) * 10) / 10);
        label = "Eksperimen 7.3: Suhu Na2S2O3 (" + tempC + " °C)";
        rightTitle = "TANDA 'X' + GRAF 1/t";
        rateStr = (1 / targetTimeSec).toFixed(4) + " s^-1";
        note = "Bagi tindak balas pada suhu bilik, setiap kenaikan 10 °C menggandakan kadar tindak balas hampir 2 kali ganda kerana tenaga kinetik purata zarah meningkat dengan ketara.";
      } else if (factor === "enzim") {
        // Sumatif No. 3: 15C(12min), 25C(7min), 35C(2.5min), 45C(4min), 55C(7min), 65C(19min)
        var enzMap = { 15: 12.0, 25: 7.0, 35: 2.5, 45: 4.0, 55: 7.0, 65: 19.0 };
        var tMin = enzMap[enzimTempC] || 2.5;
        targetTimeSec = tMin * 4; // visual scale seconds
        rateFactor = 3.0 / tMin;
        label = "Sumatif Bab 7 No. 3: Enzim Penghadam Susu (" + enzimTempC + " °C)";
        rightTitle = "SUSU JERNIH ('X' KELIHATAN)";
        rateStr = (1 / tMin).toFixed(3) + " min^-1";
        note = enzimTempC <= 35
          ? "Kadar pencernaan protein susu oleh enzim (1/masa) meningkat sehingga suhu optimum 35 °C apabila tenaga kinetik bertambah."
          : "Melebihi 35 °C (45 °C hingga 65 °C), kadar menurun mendadak kerana struktur enzim mula ternyahasli akibat suhu tinggi!";
      } else if (factor === "catalyst") {
        var catSpec = {
          none: { rf: 0.45, sec: 95.0, v60: 8, txt: "Tanpa Mangkin" },
          cuo: { rf: 0.95, sec: 60.0, v60: 31, txt: "Kuprum(II) oksida, CuO" },
          fe: { rf: 1.55, sec: 45.0, v60: 60, txt: "Ferum, Fe" },
          mno2: { rf: 2.5, sec: 26.0, v60: 100, txt: "Mangan(IV) oksida, MnO2" }
        }[catChoice] || { rf: 2.5, sec: 26.0, v60: 100, txt: "MnO2" };
        rateFactor = catSpec.rf;
        targetTimeSec = catSpec.sec;
        label = "Eksperimen 7.4 & Aktiviti 7.4: Penguraian H2O2 (" + catSpec.txt + ")";
        rightTitle = "GAS O2 & KAYU UJI BERBARA";
        rateStr = (100 / targetTimeSec).toFixed(2) + " cm3 s^-1";
        note = "Mangkin MnO2 paling berkesan berbanding Fe dan CuO (Jadual 7.8: 100 cm3 O2 dalam 40 s). Jisim dan sifat kimia mangkin kekal tidak berubah pada akhir tindak balas!";
      } else {
        rateFactor = 0.7 + (pressureAtm / 100) * 1.25;
        targetTimeSec = Math.max(11.0, Math.round((52.0 / rateFactor) * 10) / 10);
        label = "Lensa Kimia: Tekanan Gas (" + pressureAtm + " atm)";
        rightTitle = "KADAR TINDAK BALAS GAS";
        rateStr = (50 / targetTimeSec).toFixed(2) + " cm3 s^-1";
        note = "Tekanan hanya mempengaruhi bahan berkeadaan gas (pepejal dan cecair tidak termampat). Peningkatan tekanan memampatkan zarah gas ke isi padu lebih kecil lalu meningkatkan kepekatan gas.";
      }

      var progress = Math.min(1, simElapsed / targetTimeSec);
      return {
        rateFactor: rateFactor,
        targetTimeSec: targetTimeSec,
        progress: progress,
        isCross: isCross,
        label: label,
        note: note,
        rightTitle: rightTitle,
        rateStr: rateStr
      };
    }

    function drawCanvas() {
      var canvas = shell.querySelector("#kim47FaktorCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var w = canvas.width;
      var h = canvas.height;
      var m = getMetrics();

      c2d.fillStyle = "#020617";
      c2d.fillRect(0, 0, w, h);

      // Left chamber
      var cx = 14;
      var cy = 14;
      var cw = 304;
      var ch = h - 28;
      c2d.fillStyle = "#0f172a";
      c2d.fillRect(cx, cy, cw, ch);
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 2;
      c2d.strokeRect(cx, cy, cw, ch);

      c2d.fillStyle = "#bae6fd";
      c2d.font = "800 10.5px Lexend, sans-serif";
      c2d.textAlign = "center";
      c2d.fillText("KAMAR ZARAH BAHAN TINDAK BALAS", cx + cw / 2, cy + 19);

      var topWall = cy + 30;
      if (factor === "pressure") {
        var compRatio = Math.min(0.56, ((pressureAtm - 1) / 200) * 0.56);
        topWall = cy + 30 + compRatio * (ch - 52);
        c2d.fillStyle = "#334155";
        c2d.fillRect(cx + 6, cy + 28, cw - 12, topWall - (cy + 28));
        c2d.fillStyle = "#e2e8f0";
        c2d.fillRect(cx + 4, topWall - 8, cw - 8, 8);
        c2d.fillStyle = "#fef08a";
        c2d.font = "800 9px JetBrains Mono, monospace";
        c2d.fillText("OMBOH TEKANAN: " + pressureAtm + " atm", cx + cw / 2, topWall - 14);
      }

      var boxH = cy + ch - 12 - topWall;
      if (factor === "size") {
        c2d.fillStyle = "#e2e8f0";
        if (chipSize === "large") {
          c2d.fillRect(cx + 52, cy + ch - 46, 84, 32);
          c2d.fillRect(cx + 168, cy + ch - 46, 84, 32);
        } else {
          for (var sIdx = 0; sIdx < 11; sIdx++) {
            c2d.fillRect(cx + 18 + sIdx * 25, cy + ch - 26 - (sIdx % 2) * 14, 15, 11);
          }
        }
      }

      if (factor === "catalyst" && catChoice !== "none") {
        c2d.strokeStyle = "#fbbf24";
        c2d.lineWidth = 2;
        c2d.setLineDash([4, 4]);
        c2d.strokeRect(cx + 24, topWall + 18, cw - 48, boxH - 34);
        c2d.setLineDash([]);
        c2d.fillStyle = "#fde047";
        c2d.font = "800 9px JetBrains Mono, monospace";
        c2d.fillText("MANGKIN: " + catChoice.toUpperCase() + " (JISIM KEKAL 0.50 g)", cx + cw / 2, topWall + 14);
      }

      var pCount = factor === "conc"
        ? Math.max(8, Math.round((exp72Rows[naVolIdx].m2 / 0.18) * 38))
        : (factor === "pressure" ? 30 : 24);
      for (var p = 0; p < pCount; p++) {
        var pt = particles[p];
        var px = cx + 14 + pt.nx * (cw - 28);
        var py = topWall + 14 + pt.ny * Math.max(24, boxH - 28);
        c2d.fillStyle = pt.kind === 0 ? "#ef4444" : "#38bdf8";
        c2d.beginPath();
        c2d.arc(px, py, 5, 0, Math.PI * 2);
        c2d.fill();
        if (m.rateFactor > 1.35 && p % 6 === 0) {
          c2d.strokeStyle = "rgba(253, 224, 71, 0.72)";
          c2d.lineWidth = 1.5;
          c2d.beginPath();
          c2d.arc(px, py, 9, 0, Math.PI * 2);
          c2d.stroke();
        }
      }

      // Right view: Cross 'X' + 1/t graph OR Gas Burette
      var rx = 334;
      var ry = 14;
      var rw = w - rx - 14;
      var rh = h - 28;
      c2d.fillStyle = "#0f172a";
      c2d.fillRect(rx, ry, rw, rh);
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 2;
      c2d.strokeRect(rx, ry, rw, rh);

      c2d.fillStyle = "#fef08a";
      c2d.font = "800 10px Lexend, sans-serif";
      c2d.textAlign = "center";
      c2d.fillText(m.rightTitle, rx + rw / 2, ry + 19);

      if (m.isCross) {
        var discX = rx + 68;
        var discY = ry + 104;
        var discR = 46;
        c2d.fillStyle = "#ffffff";
        c2d.beginPath();
        c2d.arc(discX, discY, discR, 0, Math.PI * 2);
        c2d.fill();

        c2d.strokeStyle = "#0f172a";
        c2d.lineWidth = 7;
        c2d.lineCap = "round";
        c2d.beginPath();
        c2d.moveTo(discX - 18, discY - 18);
        c2d.lineTo(discX + 18, discY + 18);
        c2d.moveTo(discX + 18, discY - 18);
        c2d.lineTo(discX - 18, discY + 18);
        c2d.stroke();

        // For enzim mode, milk starts opaque white and turns clear so 'X' becomes visible!
        var overlayAlpha = factor === "enzim" ? Math.max(0.05, 0.96 - m.progress * 0.91) : Math.min(0.98, m.progress * 0.98);
        c2d.fillStyle = factor === "enzim"
          ? "rgba(248, 250, 252, " + overlayAlpha.toFixed(2) + ")"
          : "rgba(250, 204, 21, " + overlayAlpha.toFixed(2) + ")";
        c2d.beginPath();
        c2d.arc(discX, discY, discR - 2, 0, Math.PI * 2);
        c2d.fill();
        c2d.strokeStyle = "#94a3b8";
        c2d.lineWidth = 2.5;
        c2d.stroke();

        // Mini 1/t graph beside the cross!
        var gx = rx + 128;
        var gy = ry + 42;
        var gw = rw - 140;
        var gh = 122;
        c2d.strokeStyle = "#94a3b8";
        c2d.lineWidth = 1.5;
        c2d.beginPath();
        c2d.moveTo(gx, gy);
        c2d.lineTo(gx, gy + gh);
        c2d.lineTo(gx + gw, gy + gh);
        c2d.stroke();

        c2d.fillStyle = "#cbd5e1";
        c2d.font = "700 8px JetBrains Mono, monospace";
        c2d.textAlign = "left";
        c2d.fillText("1/masa", gx + 3, gy + 9);
        c2d.textAlign = "right";
        c2d.fillText(factor === "conc" ? "Kepekatan" : "Suhu (°C)", gx + gw, gy + gh + 11);

        c2d.strokeStyle = "#34d399";
        c2d.lineWidth = 2.5;
        c2d.beginPath();
        if (factor === "conc") {
          c2d.moveTo(gx, gy + gh);
          c2d.lineTo(gx + gw - 6, gy + 12);
          var curRow = exp72Rows[naVolIdx];
          var pxG = gx + (curRow.m2 / 0.18) * (gw - 10);
          var pyG = gy + gh - (curRow.m2 / 0.18) * (gh - 12);
          c2d.stroke();
          c2d.fillStyle = "#ef4444";
          c2d.beginPath();
          c2d.arc(pxG, pyG, 4.5, 0, Math.PI * 2);
          c2d.fill();
        } else if (factor === "temp") {
          for (var ti = 0; ti <= 10; ti++) {
            var frac = ti / 10;
            var txG = gx + frac * (gw - 6);
            var tyG = gy + gh - Math.pow(frac, 1.45) * (gh - 16) - 6;
            if (ti === 0) c2d.moveTo(txG, tyG);
            else c2d.lineTo(txG, tyG);
          }
          c2d.stroke();
          var tFrac = (tempC - 28) / 27;
          c2d.fillStyle = "#ef4444";
          c2d.beginPath();
          c2d.arc(gx + tFrac * (gw - 6), gy + gh - Math.pow(tFrac, 1.45) * (gh - 16) - 6, 4.5, 0, Math.PI * 2);
          c2d.fill();
        } else {
          // Enzyme bell curve peaking at 35C
          var ePts = [[15, 0.08], [25, 0.14], [35, 0.40], [45, 0.25], [55, 0.14], [65, 0.05]];
          for (var ei = 0; ei < ePts.length; ei++) {
            var exG = gx + ((ePts[ei][0] - 15) / 50) * (gw - 8);
            var eyG = gy + gh - (ePts[ei][1] / 0.42) * (gh - 16);
            if (ei === 0) c2d.moveTo(exG, eyG);
            else c2d.lineTo(exG, eyG);
          }
          c2d.stroke();
          var curEPt = ePts.find(function (z) { return z[0] === enzimTempC; }) || ePts[2];
          c2d.fillStyle = "#ef4444";
          c2d.beginPath();
          c2d.arc(gx + ((curEPt[0] - 15) / 50) * (gw - 8), gy + gh - (curEPt[1] / 0.42) * (gh - 16), 4.5, 0, Math.PI * 2);
          c2d.fill();
        }

        c2d.fillStyle = m.progress >= 0.99 ? "#fde047" : "#e2e8f0";
        c2d.textAlign = "center";
        c2d.font = "800 9.5px JetBrains Mono, monospace";
        c2d.fillText(
          factor === "enzim"
            ? ("Suhu: " + enzimTempC + " °C (" + (m.progress >= 0.99 ? "JERNIH" : "PROSES") + ")")
            : (m.progress >= 0.99 ? "TANDA 'X' HILANG (" + m.targetTimeSec.toFixed(1) + "s)" : "MASA: " + Math.min(simElapsed, m.targetTimeSec).toFixed(1) + "s / " + m.targetTimeSec.toFixed(1) + "s"),
          rx + rw / 2,
          ry + rh - 10
        );
      } else {
        var bx = rx + rw / 2 - 32;
        var by = ry + 34;
        var bw = 64;
        var bh = 142;
        var gasH = Math.round(m.progress * (bh - 16));
        c2d.fillStyle = "#0284c7";
        c2d.fillRect(bx, by + gasH, bw, bh - gasH);
        c2d.fillStyle = "rgba(241,245,249,0.16)";
        c2d.fillRect(bx, by, bw, gasH);
        c2d.strokeStyle = "#bae6fd";
        c2d.lineWidth = 2.5;
        c2d.strokeRect(bx, by, bw, bh);
        var volC = (m.progress * (factor === "catalyst" ? 100 : 50)).toFixed(1);
        c2d.fillStyle = "#fde047";
        c2d.font = "800 9.5px JetBrains Mono, monospace";
        c2d.fillText("GAS: " + volC + " cm3 (" + Math.min(simElapsed, m.targetTimeSec).toFixed(1) + "s)", rx + rw / 2, ry + rh - 10);
      }
    }

    function syncReadouts() {
      var m = getMetrics();
      var elT = shell.querySelector("#kim47FacTime");
      var elR = shell.querySelector("#kim47FacRate");
      if (elT) elT.textContent = m.targetTimeSec.toFixed(1) + " s";
      if (elR) elR.textContent = m.rateStr;
    }

    function stepLoop(ts) {
      rafId = 0;
      if (paused || isDocHidden) return;
      var dt = lastTs ? Math.min(0.05, Math.max(0.004, (ts - lastTs) / 1000)) : 0.016;
      lastTs = ts;
      var m = getMetrics();
      var spd = Math.max(0.45, m.rateFactor);
      for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        pt.nx += pt.vx * dt * 0.4 * spd;
        pt.ny += pt.vy * dt * 0.52 * spd;
        if (pt.nx < 0.02 || pt.nx > 0.98) { pt.vx *= -1; pt.nx = Math.max(0.02, Math.min(0.98, pt.nx)); }
        if (pt.ny < 0.02 || pt.ny > 0.98) { pt.vy *= -1; pt.ny = Math.max(0.02, Math.min(0.98, pt.ny)); }
      }
      simElapsed += dt * 5.8;
      if (simElapsed > m.targetTimeSec + 4) simElapsed = 0;
      drawCanvas();

  /* =========================================================================
     MAKMAL 4: kim47_teori_perlanggaran_canvas
     Subtopik 7.4: Simulator 60fps Teori Perlanggaran & Gambar Rajah Profil Tenaga Ea
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.kim47_teori_perlanggaran_canvas = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var rxnType = ps.rxnType === "endo" ? "endo" : "ekso";
    var hasCatalyst = typeof ps.catalyst === "boolean" ? ps.catalyst : true;
    var orientOk = typeof ps.orient === "boolean" ? ps.orient : true;
    var tempC = typeof ps.temp === "number" ? ps.temp : 45;

    var paused = reducedMotion();
    var rafId = 0;
    var lastTs = 0;
    var simClock = ctx && ctx.mode === "proof" ? 1.5 : 0;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;

    function getCollisionStats() {
      var tempFrac = (tempC - 25) / 40; // 0..1
      var eaNorm = hasCatalyst ? 0.36 : 0.68;
      var energyPass = tempFrac + (hasCatalyst ? 0.42 : 0.08) >= 0.58;
      var isEffective = orientOk && energyPass;
      var effPct = !orientOk ? 0 : Math.min(92, Math.max(8, Math.round((tempFrac * 48 + (hasCatalyst ? 44 : 12)))));
      return {
        tempFrac: tempFrac,
        eaNorm: eaNorm,
        energyPass: energyPass,
        isEffective: isEffective,
        effPct: effPct
      };
    }

    function drawCanvas() {
      var canvas = shell.querySelector("#kim47CollisionCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var w = canvas.width;
      var h = canvas.height;
      var st = getCollisionStats();

      c2d.fillStyle = "#020617";
      c2d.fillRect(0, 0, w, h);

      // Left Panel: Molecular Collision (N2O + NO -> N2 + NO2)
      var lx = 12;
      var ly = 12;
      var lw = 282;
      var lh = h - 24;
      c2d.fillStyle = "#0f172a";
      c2d.fillRect(lx, ly, lw, lh);
      c2d.strokeStyle = st.isEffective ? "#10b981" : "#ef4444";
      c2d.lineWidth = 2;
      c2d.strokeRect(lx, ly, lw, lh);

      c2d.fillStyle = "#bae6fd";
      c2d.font = "800 10px Lexend, sans-serif";
      c2d.textAlign = "center";
      c2d.fillText("PERLANGGARAN: N2O + NO -> N2 + NO2", lx + lw / 2, ly + 19);

      var cycle = paused ? 0.52 : (simClock % 2.4) / 2.4; // 0..1
      var midX = lx + lw / 2;
      var midY = ly + 116;
      var sep = cycle < 0.5 ? (1 - cycle * 2) * 84 : (cycle - 0.5) * 2 * 84;
      var collided = cycle >= 0.45 && cycle <= 0.62;
      var postPhase = cycle > 0.52;

      // Draw N2O (Left) and NO (Right)
      if (postPhase && st.isEffective) {
        // Products formed: N2 (blue-blue) + NO2 (O-N-O)
        var xN2 = midX - 28 - sep * 0.72;
        var xNO2 = midX + 28 + sep * 0.72;
        // N2
        c2d.fillStyle = "#38bdf8";
        c2d.beginPath(); c2d.arc(xN2 - 12, midY, 13, 0, Math.PI * 2); c2d.fill();
        c2d.beginPath(); c2d.arc(xN2 + 12, midY, 13, 0, Math.PI * 2); c2d.fill();
        // NO2
        c2d.fillStyle = "#ef4444";
        c2d.beginPath(); c2d.arc(xNO2 - 18, midY, 12, 0, Math.PI * 2); c2d.fill();
        c2d.beginPath(); c2d.arc(xNO2 + 18, midY, 12, 0, Math.PI * 2); c2d.fill();
        c2d.fillStyle = "#38bdf8";
        c2d.beginPath(); c2d.arc(xNO2, midY, 13, 0, Math.PI * 2); c2d.fill();
      } else {
        // Reactants: N2O = N(blue)-N(blue)-O(red); NO = N(blue)-O(red)
        var xA = midX - 34 - sep * 0.72;
        var xB = midX + 34 + sep * 0.72;
        var bounceY = postPhase && !st.isEffective ? (cycle - 0.5) * 44 : 0;

        // N2O
        c2d.fillStyle = "#38bdf8";
        c2d.beginPath(); c2d.arc(xA - 22, midY - bounceY, 12, 0, Math.PI * 2); c2d.fill();
        c2d.beginPath(); c2d.arc(xA, midY - bounceY, 12, 0, Math.PI * 2); c2d.fill();
        c2d.fillStyle = "#ef4444";
        c2d.beginPath(); c2d.arc(xA + 22, midY - bounceY, 12, 0, Math.PI * 2); c2d.fill();

        // NO (depends on orientation!)
        if (orientOk) {
          c2d.fillStyle = "#38bdf8";
          c2d.beginPath(); c2d.arc(xB - 11, midY + bounceY, 12, 0, Math.PI * 2); c2d.fill();
          c2d.fillStyle = "#ef4444";
          c2d.beginPath(); c2d.arc(xB + 11, midY + bounceY, 12, 0, Math.PI * 2); c2d.fill();
        } else {
          // Wrong orientation: O collides with O!
          c2d.fillStyle = "#ef4444";
          c2d.beginPath(); c2d.arc(xB - 11, midY + bounceY, 12, 0, Math.PI * 2); c2d.fill();
          c2d.fillStyle = "#38bdf8";
          c2d.beginPath(); c2d.arc(xB + 11, midY + bounceY, 12, 0, Math.PI * 2); c2d.fill();
        }
      }

      if (collided) {
        c2d.strokeStyle = st.isEffective ? "#fde047" : "#f87171";
        c2d.lineWidth = 3;
        c2d.beginPath();
        c2d.arc(midX, midY, 22, 0, Math.PI * 2);
        c2d.stroke();
      }

      c2d.fillStyle = "#cbd5e1";
      c2d.font = "700 8.8px JetBrains Mono, monospace";
      c2d.fillText("Biru: Atom N   |   Merah: Atom O", lx + lw / 2, ly + 42);

      c2d.fillStyle = st.isEffective ? "#6ee7b7" : "#fca5a5";
      c2d.font = "800 9.5px JetBrains Mono, monospace";
      var msg = st.isEffective
        ? "BERKESAN! (E >= Ea & Orientasi Betul)"
        : (!orientOk ? "TERPANTUL! (Orientasi Salah: O langgar O)" : "TERPANTUL! (Tenaga Zarah < Ea)");
      c2d.fillText(msg, lx + lw / 2, ly + lh - 12);

      // Right Panel: Gambar Rajah Profil Tenaga
      var gx = 308;
      var gy = 12;
      var gw = w - gx - 12;
      var gh = h - 24;
      c2d.fillStyle = "#0f172a";
      c2d.fillRect(gx, gy, gw, gh);
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 2;
      c2d.strokeRect(gx, gy, gw, gh);

      c2d.fillStyle = "#fef08a";
      c2d.font = "800 10px Lexend, sans-serif";
      c2d.textAlign = "center";
      c2d.fillText("GAMBAR RAJAH PROFIL TENAGA (" + (rxnType === "ekso" ? "EKSOTERMIK" : "ENDOTERMIK") + ")", gx + gw / 2, gy + 19);

      // Axes
      var axL = gx + 34;
      var axR = gx + gw - 16;
      var axT = gy + 36;
      var axB = gy + gh - 24;
      c2d.strokeStyle = "#94a3b8";
      c2d.lineWidth = 1.8;
      c2d.beginPath();
      c2d.moveTo(axL, axT);
      c2d.lineTo(axL, axB);
      c2d.lineTo(axR, axB);
      c2d.stroke();

      c2d.fillStyle = "#cbd5e1";
      c2d.font = "700 8.5px Plus Jakarta Sans, sans-serif";
      c2d.textAlign = "center";
      c2d.fillText("Lintasan tindak balas", (axL + axR) / 2, axB + 14);
      c2d.save();
      c2d.translate(gx + 14, (axT + axB) / 2);
      c2d.rotate(-Math.PI / 2);
      c2d.fillText("Tenaga", 0, 0);
      c2d.restore();

      var yBahan = rxnType === "ekso" ? axT + 66 : axT + 114;
      var yHasil = rxnType === "ekso" ? axT + 124 : axT + 74;
      var yPeakNoCat = axT + 14;
      var yPeakCat = axT + 44;

      // Reactant & Product Energy Levels
      c2d.strokeStyle = "#38bdf8";
      c2d.lineWidth = 3;
      c2d.beginPath();
      c2d.moveTo(axL + 10, yBahan);
      c2d.lineTo(axL + 72, yBahan);
      c2d.stroke();

      c2d.strokeStyle = "#34d399";
      c2d.beginPath();
      c2d.moveTo(axR - 72, yHasil);
      c2d.lineTo(axR - 10, yHasil);
      c2d.stroke();

      c2d.fillStyle = "#bae6fd";
      c2d.font = "800 8.5px JetBrains Mono, monospace";
      c2d.textAlign = "center";
      c2d.fillText("Bahan", axL + 41, yBahan - 6);
      c2d.fillStyle = "#6ee7b7";
      c2d.fillText("Hasil", axR - 41, yHasil - 6);

      // Uncatalyzed curve (Ea)
      var midCurveX = (axL + axR) / 2;
      c2d.strokeStyle = "#f59e0b";
      c2d.lineWidth = 2.6;
      c2d.beginPath();
      c2d.moveTo(axL + 72, yBahan);
      c2d.bezierCurveTo(axL + 105, yBahan, midCurveX - 35, yPeakNoCat, midCurveX, yPeakNoCat);
      c2d.bezierCurveTo(midCurveX + 35, yPeakNoCat, axR - 105, yHasil, axR - 72, yHasil);
      c2d.stroke();

      // Catalyzed curve (Ea')
      if (hasCatalyst) {
        c2d.strokeStyle = "#34d399";
        c2d.lineWidth = 2.6;
        c2d.setLineDash([5, 3]);
        c2d.beginPath();
        c2d.moveTo(axL + 72, yBahan);
        c2d.bezierCurveTo(axL + 100, yBahan, midCurveX - 30, yPeakCat, midCurveX, yPeakCat);
        c2d.bezierCurveTo(midCurveX + 30, yPeakCat, axR - 100, yHasil, axR - 72, yHasil);
        c2d.stroke();
        c2d.setLineDash([]);
      }

      // Ea arrow from reactant level to peak
      c2d.strokeStyle = "#fde047";
      c2d.lineWidth = 1.6;
      c2d.beginPath();
      c2d.moveTo(midCurveX - 18, yBahan);
      c2d.lineTo(midCurveX - 18, yPeakNoCat);
      c2d.stroke();
      c2d.fillStyle = "#fde047";
      c2d.font = "800 9px JetBrains Mono, monospace";
      c2d.textAlign = "right";
      c2d.fillText("Ea", midCurveX - 22, (yBahan + yPeakNoCat) / 2);

      if (hasCatalyst) {
        c2d.strokeStyle = "#6ee7b7";
        c2d.beginPath();
        c2d.moveTo(midCurveX + 18, yBahan);
        c2d.lineTo(midCurveX + 18, yPeakCat);
        c2d.stroke();
        c2d.fillStyle = "#6ee7b7";
        c2d.textAlign = "left";
        c2d.fillText("Ea'", midCurveX + 22, (yBahan + yPeakCat) / 2 + 4);
      }

      // Delta H arrow between reactant and product levels
      c2d.strokeStyle = "#f472b6";
      c2d.lineWidth = 1.6;
      c2d.beginPath();
      c2d.moveTo(axR - 78, yBahan);
      c2d.lineTo(axR - 78, yHasil);
      c2d.stroke();
      c2d.fillStyle = "#f9a8d4";
      c2d.textAlign = "right";
      c2d.fillText("ΔH", axR - 82, (yBahan + yHasil) / 2 + 3);
    }

    function stepLoop(ts) {
      rafId = 0;
      if (paused || isDocHidden) return;
      var dt = lastTs ? Math.min(0.05, Math.max(0.004, (ts - lastTs) / 1000)) : 0.016;
      lastTs = ts;
      simClock += dt * (0.7 + (tempC - 25) / 35);
      drawCanvas();
      rafId = window.requestAnimationFrame(stepLoop);
    }

    function syncLoop() {
      if (!paused && !isDocHidden) {
        if (!rafId) {
          lastTs = 0;
          rafId = window.requestAnimationFrame(stepLoop);
        }
      } else if (rafId) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    function render() {
      var st = getCollisionStats();
      shell.innerHTML = [
        '<div class="lab-arcade-bar">',
        '  <span class="lab-title-pill">Simulator 60fps Teori Perlanggaran &amp; Profil Tenaga Ea</span>',
        '  <button type="button" class="lab-pause-btn" id="kim47ColPauseBtn" aria-pressed="' + (paused ? "true" : "false") + '">' + (paused ? "Main Simulasi" : "Jeda Simulasi") + "</button>",
        "</div>",
        '<div class="lab-controls">',
        '  <button type="button" class="lab-seg-btn" data-k74-rxn="ekso" aria-pressed="' + (rxnType === "ekso") + '">Eksotermik (ΔH Negatif)</button>',
        '  <button type="button" class="lab-seg-btn" data-k74-rxn="endo" aria-pressed="' + (rxnType === "endo") + '">Endotermik (ΔH Positif)</button>',
        '  <button type="button" class="kim47-action-btn is-emerald" data-k74-ori="1" aria-pressed="' + orientOk + '">Orientasi Betul</button>',
        '  <button type="button" class="kim47-action-btn is-rose" data-k74-ori="0" aria-pressed="' + (!orientOk) + '">Orientasi Salah</button>',
        '  <button type="button" class="kim47-action-btn is-amber" data-k74-cat="1" aria-pressed="' + hasCatalyst + '">Mangkin Hadir (Ea\')</button>',
        '  <button type="button" class="kim47-action-btn" data-k74-cat="0" aria-pressed="' + (!hasCatalyst) + '">Tanpa Mangkin (Ea)</button>',
        "</div>",
        '<div class="lab-controls">',
        '  <label class="lab-slider-group"><span class="lab-slider-label"><span>Tenaga Kinetik Purata Zarah (Suhu °C)</span><span class="tabular-nums" id="kim47ColTempLbl">' + tempC + ' °C</span></span><input id="rngKim47ColT" class="lab-range" type="range" min="25" max="65" step="5" value="' + tempC + '"></label>',
        "</div>",
        '<div class="kim47-canvas-stage"><canvas id="kim47CollisionCanvas" width="600" height="244" aria-label="Simulator 60fps teori perlanggaran dan profil tenaga"></canvas></div>',
        '<div class="lab-readout-grid">',
        '  <div class="lab-meter"><span class="lab-meter-label">Halangan Tenaga Semasa</span><strong class="lab-meter-val">' + (hasCatalyst ? "Rendah (Ea' dengan Mangkin)" : "Tinggi (Ea Asal)") + "</strong></div>",
        '  <div class="lab-meter"><span class="lab-meter-label">Kadar Perlanggaran Berkesan</span><strong class="lab-meter-val tabular-nums">' + st.effPct + "%</strong></div>",
        '  <div class="lab-meter"><span class="lab-meter-label">Haba Tindak Balas (ΔH)</span><strong class="lab-meter-val">' + (rxnType === "ekso" ? "Negatif (Bebas Haba) - Kekal" : "Positif (Serap Haba) - Kekal") + "</strong></div>",
        "</div>",
        '<div class="lab-callout"><strong>Rumusan Penting SPM:</strong> Mangkin hanya merendahkan tenaga pengaktifan melalui lintasan alternatif (<strong>Ea\' &lt; Ea</strong>). Mangkin <strong>TIDAK mengubah ΔH</strong>, aras tenaga bahan atau aras tenaga hasil!</div>'
      ].join("");

      shell.querySelectorAll("[data-k74-rxn]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          rxnType = btn.getAttribute("data-k74-rxn");
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
          drawCanvas();
        });
      });

      shell.querySelectorAll("[data-k74-ori]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          orientOk = btn.getAttribute("data-k74-ori") === "1";
          playSfx(orientOk ? "match" : "boom");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
          drawCanvas();
        });
      });

      shell.querySelectorAll("[data-k74-cat]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          hasCatalyst = btn.getAttribute("data-k74-cat") === "1";
          playSfx("match");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
          drawCanvas();
        });
      });

      var rngT = shell.querySelector("#rngKim47ColT");
      if (rngT) {
        rngT.addEventListener("input", function () {
          tempC = Number(rngT.value) || 45;
          var lb = shell.querySelector("#kim47ColTempLbl");
          if (lb) lb.textContent = tempC + " °C";
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          drawCanvas();
        });
      }

      var pBtn = shell.querySelector("#kim47ColPauseBtn");
      if (pBtn) {
        pBtn.addEventListener("click", function () {
          paused = !paused;
          pBtn.setAttribute("aria-pressed", paused ? "true" : "false");
          pBtn.textContent = paused ? "Main Simulasi" : "Jeda Simulasi";
          playSfx("tap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          syncLoop();
          if (paused) drawCanvas();
        });
      }
    }

    function onVis() {
      isDocHidden = Boolean(document.hidden);
      syncLoop();
    }
    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", onVis);
    }

    render();
    drawCanvas();
    syncLoop();

    function cleanup() {
      if (rafId) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      }
      if (typeof document !== "undefined") {
        document.removeEventListener("visibilitychange", onVis);
      }
    }
    cleanup.cleanup = cleanup;
    return cleanup;
  };

        skipBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {

    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderPredictStep(step, card) {

            proofState: step.proofState || null,
            markInteracted: function () {}
          });
        }
      }

      handleStepOutcome(isCorrect, step.explanation || "", Number(step.xp) || 20, btn);
    });
  });
}

/* 04-step-minigames.js — Tap-to-Match, Word-Bank Assembly, Card Sort & Tactile MCQ */
function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });

function renderSortStep(step, card) {
  var items = shuffleList(Array.isArray(step.items) ? step.items : []);
  var buckets = Array.isArray(step.buckets) ? step.buckets : [];
  var curIdx = 0;
  var misses = 0;

    if (cEl && items[curIdx]) cEl.textContent = items[curIdx].text;
  }

  showCard();
  card.querySelectorAll(".js-sort-bucket").forEach(function (btn) {

          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback ok";
          msgEl.textContent = item.note || tUi("Tepat!", "Spot on!");
        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";
          msgEl.textContent = tUi("Kurang tepat — fikirkan semula fungsi atau sifat istilah ini.", "Not quite — check the grammar rule and clues.");
        }
      }
    });
  });
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
