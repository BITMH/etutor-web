  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"kimia-t5-bab03","subject":"Kimia","subjectGroup":"sains","form":5,"chapterNumber":3,"title":"Termokimia","subtitle":"Subtopik 3.1–3.3 KSSM (37 Langkah Bit-by-Bit) — Eksotermik vs Endotermik, Gambar Rajah Aras Tenaga & Tenaga Ikatan, Kalorimetri Q = mcθ bagi Pemendakan, Penyesaran, Peneutralan (Kuat vs Lemah & Diprotik) & Pembakaran 4 Alkohol serta Pek Panas/Sejuk dan Nilai Bahan Api (kJ g⁻¹).","estimatedMinutes":35,"themeAccent":"#dc2626","isFreePreview":false,"labScript":"kimia-t5-bab03-labs.js","coverIcon":"../assets/icons/kim53-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pengiraan haba tindak balas dan tafsiran termokimia kamu memang mantap!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Rumus Q sama dengan m c theta dan gambar rajah aras tenaga semuanya dikuasai!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak tanda positif atau negatif delta H serta bilangan mol yang bertindak balas pada panduan di bawah.","celebrate":"[excited] Tahniah! Satu lagi unit Kimia Tingkatan lima Bab tiga berjaya kamu takluki sepenuhnya!"},"units":[{"id":"kim53-u1","title":"Unit 1: Perubahan Haba, Aras Tenaga & Tenaga Ikatan","subtitle":"Subtopik 3.1 — Eksotermik vs Endotermik, Aktiviti 3A, Gambar Rajah Aras Tenaga serta Pemutusan & Pembentukan Ikatan","iconType":"atom","iconUrl":"../assets/icons/kim53-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Eksotermik vs Endotermik","voiceCaption":"Tindak balas eksotermik membebaskan haba menyebabkan suhu naik, manakala tindak balas endotermik menyerap haba menyebabkan suhu turun.","voiceScript":"[warm] Selamat datang ke Kimia Tingkatan lima, Bab tiga, Termokimia! Bayangkan minuman sup di dalam tin pemanas kendiri Hot Can yang menjadi panas serta-merta tanpa dapur, ciptaan Datuk Kenneth Warren Kolb. Mari tonton video penerangan lima belas saat dahulu! [excited] Setiap tindak balas kimia melibatkan pemindahan tenaga haba. Tindak balas eksotermik membebaskan tenaga haba ke persekitaran lalu menaikkan suhu bekas, seperti pembakaran bahan api, respirasi dan melarutkan natrium hidroksida atau kalsium klorida kontang dalam Aktiviti tiga A. Sebaliknya, tindak balas endotermik menyerap haba daripada persekitaran lalu menurunkan suhu, seperti fotosintesis, pengewapan alkohol pada kulit, menggoreng telur serta melarutkan ammonium nitrat atau natrium tiosulfat!","title":"3.1 Tindak Balas Eksotermik, Endotermik & Aktiviti Makmal 3A","acronym":"E•N•D•O","hook":"Tonton video penerangan BM (15s) dan ketahui mengapa tangan terasa sejuk bila disapu pensanitasi alkohol tetapi panas apabila menyentuh detergen basah!","mediaKey":"kim53_eksotermik_api","mediaKeys":["kim53_eksotermik_api","kim53_endotermik_ais"],"videoClip":{"src":"../assets/kimia-t5-bab03/video/kim53_video_eksotermik_endotermik_haba_narasi.mp4","hasNarration":true,"posterKey":"kim53_eksotermik_api","caption":"Tindak Balas Eksotermik vs Endotermik, Pemutusan & Pembentukan Ikatan serta Aras Tenaga."},"summary":"Tindak balas kimia dikelaskan kepada eksotermik (membebaskan haba, suhu persekitaran meningkat) dan endotermik (menyerap haba, suhu persekitaran menurun).","bullets":["Tindak Balas Eksotermik (ΔH < 0, bekas menjadi panas): Membebaskan tenaga haba ke persekitaran. Contoh: respirasi, pengoksidaan logam, peneutralan asid-alkali, pembakaran bahan api, penghasilan ammonia, Hot Can (CaO + air, Al + silika, CuSO₄ + Zn), serbuk detergen + air, serta melarutkan pepejal NaOH atau CaCl₂ kontang dalam Aktiviti 3A.","Tindak Balas Endotermik (ΔH > 0, bekas menjadi sejuk): Menyerap tenaga haba daripada persekitaran. Contoh: fotosintesis, penguraian terma karbonat logam dan nitrat logam apabila dipanaskan, pengewapan pensanitasi tangan beralkohol, menggoreng telur (menyerap haba kuali), serta melarutkan garam NH₄NO₃ atau Na₂S₂O₃ dalam Aktiviti 3A."],"labId":"kim53_energy_bond_lab","labTitle":"Simulator Cawan Polistirena & Gambar Rajah Aras Tenaga","labProps":{"tab":"aras","rxn":"naoh_act3a"},"examTip":"Tip Aktiviti 3A SPM: Garam yang menurunkan suhu dalam air ialah garam ammonium (NH₄NO₃) dan natrium tiosulfat (Na₂S₂O₃), manakala NaOH dan CaCl₂ kontang menaikkan bacaan termometer."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Eksotermik vs Endotermik","voiceCaption":"Kelaskan enam proses kimia dan aktiviti makmal berikut kepada tindak balas Eksotermik atau Endotermik.","voiceScript":"[confident] Jom uji kepekaan termometer kamu! Asingkan keenam-enam tindak balas dan pemerhatian harian ini antara kategori Eksotermik yang membebaskan haba dengan Endotermik yang menyerap haba.","prompt":"Isihkan proses kimia berikut mengikut arah pemindahan habanya:","buckets":[{"id":"ekso","label":"Eksotermik (Haba Bebas, Suhu Naik)"},{"id":"endo","label":"Endotermik (Haba Serap, Suhu Turun)"}],"items":[{"text":"Melarutkan pepejal natrium hidroksida (NaOH) dan CaCl₂ kontang dalam air","bucketId":"ekso","note":"Aktiviti 3A: bacaan termometer meningkat dan cawan terasa panas"},{"text":"Melarutkan pepejal ammonium nitrat (NH₄NO₃) dan Na₂S₂O₃ dalam air","bucketId":"endo","note":"Aktiviti 3A: haba diserap daripada air sehingga suhu jatuh"},{"text":"Penguraian terma garam karbonat logam dan garam nitrat logam","bucketId":"endo","note":"Memerlukan bekalan tenaga haba berterusan untuk mengurai ikatan"},{"text":"Peneutralan asid dengan alkali, respirasi sel dan pengoksidaan logam","bucketId":"ekso","note":"Membebaskan tenaga haba ke persekitaran secara spontan"},{"text":"Pensanitasi tangan beralkohol meruap menyejukkan kulit serta fotosintesis","bucketId":"endo","note":"Menyerap haba dari kulit atau tenaga cahaya persekitaran"},{"text":"Serbuk detergen di tapak tangan dicelup ke dalam air menjadi hangat","bucketId":"ekso","note":"Membebaskan haba pelarutan yang memanaskan tangan"}],"explanation":"Setiap kali bahan kimia membebaskan haba, tenaga berpindah keluar ke larutan/termometer lalu suhu naik (eksotermik). Apabila bahan menyerap haba daripada air di dalam cawan, suhu larutan jatuh (endotermik)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Gambar Rajah Aras Tenaga","voiceCaption":"Gambar rajah aras tenaga membandingkan kandungan tenaga hasil dengan bahan tindak balas menerusi rumus delta H sama dengan H hasil tolak H bahan.","voiceScript":"[warm] Sekarang mari pelajari cara melukis dan mentafsir Gambar Rajah Aras Tenaga mengikut enam langkah peta titi buku teks! Haba tindak balas atau delta H ialah perubahan haba apabila satu mol bahan bertindak balas atau satu mol hasil terbentuk, dengan unit kilojul per mol. Rumus emasnya ialah delta H sama dengan jumlah tenaga hasil tolak jumlah tenaga bahan. Jika hasil berada di aras lebih rendah seperti tindak balas magnesium dengan asid sulfurik, delta H ialah negatif empat ratus enam puluh tujuh kilojul per mol! Jika hasil berada di aras lebih tinggi seperti nitrogen bertindak balas dengan oksigen, delta H ialah positif seratus lapan puluh kilojul per mol!","title":"Mentafsir & Melukis Gambar Rajah Aras Tenaga (ΔH)","acronym":"H•B•ΔH","hook":"Ikut 6 langkah peta titi KSSM supaya kamu tidak pernah terhilang 2 hingga 3 markah melukis gambar rajah aras tenaga dalam Kertas 2!","mediaKey":"kim53_endotermik_ais","formula":"ΔH = H(hasil tindak balas) − H(bahan tindak balas)   |   Unit: kJ mol⁻¹","summary":"Gambar rajah aras tenaga memvisualisasikan perbezaan kandungan tenaga haba antara bahan tindak balas dan hasil tindak balas.","bullets":["6 Langkah Peta Titi Lukisan: (1) Lukis paksi anak panah menghala ke atas, (2) Label paksi itu 'Tenaga', (3) Lukis dua aras tenaga mendatar berasingan, (4) Tulis formula bahan tindak balas (dengan keadaan fizik) dan hasil tindak balas pada aras betul, (5) Lukis anak panah menegak daripada aras bahan ke aras hasil, (6) Tulis ΔH berserta tanda (+/-), nilai dan unit kJ mol⁻¹.","Eksotermik vs Endotermik pada Rajah: Bagi Mg(p) + H₂SO₄(ak) -> MgSO₄(ak) + H₂(g) (ΔH = -467 kJ mol⁻¹), aras tenaga hasil lebih rendah daripada bahan (suhu campuran meningkat). Bagi N₂(g) + O₂(g) -> 2NO(g) (ΔH = +180 kJ mol⁻¹), aras tenaga hasil lebih tinggi daripada bahan (suhu campuran menurun)."],"labId":"kim53_energy_bond_lab","labTitle":"Penjana Gambar Rajah Aras Tenaga Interaktif","labProps":{"tab":"aras","rxn":"n2_o2"},"examTip":"Semakan wajib Kertas 2: Pastikan paksi menegak dilabel 'Tenaga' (bukan 'Suhu' atau 'Haba'), anak panah aras ΔH menunjuk dari BAHAN ke HASIL, dan nilai ΔH ada tanda positif (+) atau negatif (-)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Aras Tenaga CaCO3","voiceCaption":"Ramalkan susunan aras tenaga dan tafsiran bagi persamaan termokimia penguraian kalsium karbonat dengan delta H positif lima ratus empat puluh kilojul per mol.","voiceScript":"[curious] Cuba ramalkan berdasarkan Uji Kendiri tiga perpuluhan satu nombor satu! Diberi penguraian kalsium karbonat mempunyai delta H bernilai positif lima ratus empat puluh kilojul per mol. Di manakah kedudukan aras tenaga hasil kalsium oksida dan karbon dioksida berbanding bahan kalsium karbonat?","hook":"Buka Simulator Gambar Rajah Aras Tenaga pada reaksi CaCO₃ selepas memilih jawapan untuk membuktikan ketinggian aras hasil!","scenario":"Persamaan termokimia: CaCO₃(p) -> CaO(p) + CO₂(g), ΔH = +540 kJ mol⁻¹.","prompt":"Berdasarkan nilai ΔH = +540 kJ mol⁻¹, pernyataan manakah PALING tepat menghuraikan gambar rajah aras tenaga tindak balas ini?","options":["Aras tenaga hasil (CaO dan CO₂) terletak lebih tinggi daripada aras tenaga bahan (CaCO₃); sebanyak 540 kJ tenaga haba diserap daripada persekitaran apabila 1 mol CaCO₃ terurai","Aras tenaga hasil (CaO dan CO₂) terletak lebih rendah daripada bahan (CaCO₃) kerana haba dibebaskan ke persekitaran","Tiada perbezaan aras tenaga antara CaCO₃ dengan CaO dan CO₂ kerana jumlah jisim kekal sama","Suhu bekas meningkat mendadak semasa 1 mol CaCO₃ terurai secara endotermik"],"correctIndex":0,"proofLabId":"kim53_energy_bond_lab","proofState":{"tab":"aras","rxn":"caco3","reacted":true},"explanation":"Tanda positif (+540 kJ mol⁻¹) bermaksud tindak balas endotermik: H(hasil) > H(bahan). Oleh itu, aras tenaga CaO(p) + CO₂(g) berada di atas aras CaCO₃(p) dan 540 kJ haba diserap bagi penguraian 1 mol CaCO₃."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"Pemutusan & Pembentukan Ikatan","voiceCaption":"Pemutusan ikatan kimia menyerap tenaga haba manakala pembentukan ikatan baharu membebaskan tenaga haba.","voiceScript":"[warm] Mengapakah sesuatu tindak balas membebaskan atau menyerap haba di peringkat molekul? Jawapannya terletak pada perubahan ikatan kimia! Untuk memulakan tindak balas seperti hidrogen bertindak balas dengan klorin menghasilkan hidrogen klorida, ikatan dalam molekul bahan mesti diputuskan dahulu dengan MENYERAP tenaga haba. Kemudian, apabila atom bebas bergabung membentuk ikatan baharu dalam molekul hasil, tenaga haba DIBEBASKAN! Oleh itu, delta H ialah tenaga pemutusan ikatan tolak tenaga pembentukan ikatan!","title":"Perubahan Tenaga Semasa Pemutusan & Pembentukan Ikatan","acronym":"S•B•ΔH","hook":"Guna gelangsar tenaga ikatan dalam makmal untuk melihat bila sesuatu tindak balas bertukar daripada eksotermik kepada endotermik!","formula":"ΔH = Tenaga Diserap (Pemutusan Ikatan) − Tenaga Dibebaskan (Pembentukan Ikatan)","summary":"Setiap tindak balas kimia melibatkan pemutusan ikatan sedia ada dalam bahan tindak balas (menyerap haba) diikuti pembentukan ikatan baharu dalam hasil tindak balas (membebaskan haba).","bullets":["Tindak Balas Eksotermik (H_pembentukan > H_pemutusan): Tenaga haba yang dibebaskan semasa pembentukan ikatan baharu dalam hasil tindak balas adalah LEBIH BESAR berbanding tenaga haba yang diserap untuk memutuskan ikatan dalam bahan tindak balas (contoh: H₂(g) + Cl₂(g) -> 2HCl(g), ΔH = -184 kJ mol⁻¹).","Tindak Balas Endotermik (H_pemutusan > H_pembentukan): Tenaga haba yang diserap untuk memutuskan ikatan dalam bahan tindak balas adalah LEBIH BESAR berbanding tenaga haba yang dibebaskan semasa pembentukan ikatan dalam hasil tindak balas (contoh: N₂(g) + O₂(g) -> 2NO(g), ΔH = +180 kJ mol⁻¹)."],"labId":"kim53_energy_bond_lab","labTitle":"Simulator Tenaga Pemutusan & Pembentukan Ikatan","labProps":{"tab":"ikatan","hBreak":679,"hForm":863},"examTip":"Elak kesilapan terbalik yang kerap dilakukan pelajar: Pemutusan ikatan SENTIASA menyerap tenaga (seperti mematahkan kayu memerlukan daya/tenaga); pembentukan ikatan SENTIASA membebaskan tenaga."},{"type":"match","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Padan Konsep Termokimia 3.1","voiceCaption":"Padankan lima konsep asas Subtopik tiga perpuluhan satu dengan ciri atau persamaannya yang tepat.","voiceScript":"[confident] Uji ketepatan ingatan Subtopik tiga perpuluhan satu! Padankan kelima-lima konsep ini dengan takrifan atau pemerhatian yang betul.","prompt":"Padankan istilah dan tindak balas Subtopik 3.1 dengan huraiannya:","pairs":[{"id":"u1m1","left":"Pemutusan ikatan kimia (bahan)","right":"Proses endotermik yang menyerap tenaga haba dari persekitaran"},{"id":"u1m2","left":"Pembentukan ikatan baharu (hasil)","right":"Proses eksotermik yang membebaskan tenaga haba ke persekitaran"},{"id":"u1m3","left":"Melarutkan pepejal NH₄NO₃ dalam air","right":"Tindak balas endotermik dengan suhu air menurun (ΔH > 0)"},{"id":"u1m4","left":"Melarutkan pepejal NaOH dalam air","right":"Tindak balas eksotermik dengan suhu air meningkat (ΔH < 0)"},{"id":"u1m5","left":"Haba tindak balas (ΔH)","right":"Perubahan haba bagi 1 mol bahan bertindak balas atau 1 mol hasil terbentuk"}],"explanation":"Mengaitkan arah pemindahan haba (menyerap vs membebas), tanda ΔH (+ vs -) serta proses ikatan (pemutusan vs pembentukan) melengkapkan asas keseluruhan Bab 3."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Susun Penerangan Ikatan PbSO4","voiceCaption":"Susun jawapan lengkap Kertas dua bagi menerangkan nilai negatif lima puluh kilojul per mol pada pembentukan plumbum dua sulfat dari segi pemutusan dan pembentukan ikatan.","voiceScript":"[confident] Selesaikan soalan Uji Kendiri tiga perpuluhan satu nombor dua! Susun penerangan Kertas dua mengapa pembentukan plumbum dua sulfat dengan delta H negatif lima puluh kilojul per mol bersifat eksotermik dari segi ikatan.","prompt":"Susun huraian lengkap Kertas 2 bagi Pb(NO₃)₂(ak) + Na₂SO₄(ak) -> PbSO₄(p) + 2NaNO₃(ak), ΔH = -50 kJ mol⁻¹:","hint":"Bandingkan tenaga yang dibebaskan semasa pembentukan ikatan dengan tenaga yang diserap semasa pemutusan ikatan...","answerTokens":["Tenaga haba yang dibebaskan semasa pembentukan ikatan dalam hasil","adalah lebih besar berbanding","tenaga haba yang diserap untuk memutuskan ikatan dalam bahan","menyebabkan tindak balas bersifat eksotermik"],"distractors":["menyebabkan suhu persekitaran menurun dengan drastik","kerana tiada ikatan kimia yang diputuskan"],"explanation":"Skema Uji Kendiri 3.1 No. 2(c): Apabila ΔH = -50 kJ mol⁻¹ (eksotermik), tenaga haba yang dibebaskan semasa pembentukan ikatan baharu dalam PbSO₄ dan NaNO₃ melebihi tenaga haba yang diserap untuk memutuskan ikatan dalam Pb(NO₃)₂ dan Na₂SO₄."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Kendiri 3.1: Rumusan Aras Tenaga","voiceCaption":"Selesaikan soalan akhir Unit satu tentang tafsiran persamaan termokimia magnesium dengan asid sulfurik.","voiceScript":"[excited] Soalan penutup Unit satu! Diberi persamaan magnesium bertindak balas dengan asid sulfurik menghasilkan magnesium sulfat dan gas hidrogen dengan delta H negatif empat ratus enam puluh tujuh kilojul per mol. Manakah himpunan pernyataan tafsiran yang benar sepenuhnya?","stimulusHtml":"<div class='stimulus-note'><strong>Persamaan Termokimia:</strong> Mg(p) + H₂SO₄(ak) &rarr; MgSO₄(ak) + H₂(g), &Delta;H = &minus;467 kJ mol<sup>&minus;1</sup></div>","prompt":"Pernyataan manakah yang BENAR tentang gambar rajah aras tenaga bagi tindak balas ini?","options":["1 mol Mg bertindak balas dengan 1 mol H₂SO₄ membebaskan 467 kJ haba; jumlah kandungan tenaga hasil (MgSO₄ + H₂) lebih rendah daripada bahan (Mg + H₂SO₄)","Sebanyak 467 kJ haba diserap daripada larutan untuk memutuskan ikatan Mg sehingga suhu bekas menjadi sejuk","Aras tenaga hasil MgSO₄ dan H₂ dilukis lebih tinggi di atas aras tenaga bahan Mg dan H₂SO₄","Tenaga pemutusan ikatan dalam Mg dan H₂SO₄ lebih besar daripada tenaga pembentukan ikatan hasil"],"correctIndex":0,"explanation":"ΔH = -467 kJ mol⁻¹ menunjukkan tindak balas eksotermik: 467 kJ tenaga haba dibebaskan apabila 1 mol Mg bertindak balas lengkap dengan 1 mol H₂SO₄ membentuk 1 mol MgSO₄ dan 1 mol H₂, dengan kandungan tenaga hasil lebih rendah daripada bahan."}]},{"id":"kim53-u2","title":"Unit 2: Kalorimetri Q = mcθ, Pemendakan & Penyesaran","subtitle":"Subtopik 3.2 (Bhg. A) — Langkah Pengiraan Q = mcθ, 4 Anggapan Akueus, Haba Pemendakan (BaSO₄, PbSO₄, AgCl) & Penyesaran (Mg, Zn, Fe + CuSO₄)","iconType":"formula","iconUrl":"../assets/icons/kim53-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kalorimetri & 4 Haba Tindak Balas","voiceCaption":"Haba tindak balas dihitung melalui empat langkah menggunakan rumus Q sama dengan m c theta, diikuti pengiraan untuk satu mol bahan atau hasil.","voiceScript":"[warm] Selamat datang ke Unit dua! Mari tonton video penerangan lima belas saat mengenai teras pengiraan termokimia dan aplikasi nilai bahan api! [excited] Dalam makmal sekolah, kita menggunakan kalorimeter cawan polistirena berpenutup kerana polistirena ialah penebat haba yang baik. Terdapat empat jenis haba tindak balas yang dinamakan mengikut tindak balasnya: Haba Pemendakan, Haba Penyesaran, Haba Peneutralan dan Haba Pembakaran. Sentiasa ikut empat langkah pengiraan piawai: pertama, cari bilangan mol n; kedua, hitung perubahan haba Q sama dengan m c theta; ketiga, bahagikan Q dengan seribu darab n untuk satu mol dalam kilojul; dan keempat, tulis delta H dengan tanda positif atau negatif serta unit kilojul per mol!","title":"Kalorimetri Cawan Polistirena, Rumus Q = mcθ & 4 Anggapan Akueus","acronym":"n•Q•1mol•ΔH","hook":"Tonton video penerangan BM (15s) dan kuasai peta alir 4 langkah (Rajah 3.5) yang menjamin markah penuh soalan pengiraan Termokimia SPM!","mediaKey":"kim53_kalorimeter_cawan","videoClip":{"src":"../assets/kimia-t5-bab03/video/kim53_video_termokimia_narasi.mp4","hasNarration":true,"posterKey":"kim53_kalorimeter_cawan","caption":"Kalorimetri Q = mcθ, 4 Jenis Haba Tindak Balas & Nilai Bahan Api."},"formula":"n = MV / 1000   |   Q = mcθ (J)   |   ΔH = ± Q / (1000 × n) kJ mol⁻¹","summary":"Pengiraan haba tindak balas akueus bergantung kepada perubahan suhu θ yang disukat di dalam cawan polistirena berasaskan empat anggapan piawai.","bullets":["4 Langkah Pengiraan (Rajah 3.5): (1) Hitung bilangan mol n = MV/1000 atau jisim/Mr, (2) Hitung tenaga haba Q = mcθ dengan m = jumlah isi padu larutan (cm³) × 1 g cm⁻³, (3) Kadarkan perubahan haba untuk 1 mol bahan/hasil (Q ÷ 1000n kJ), (4) Nyatakan ΔH berserta tanda negatif (-) jika suhu naik atau positif (+) jika suhu turun dan unit kJ mol⁻¹.","4 Anggapan Wajib Akueus: (i) Ketumpatan sebarang larutan akueus dianggap sama dengan air = 1 g cm⁻³, (ii) Muatan haba tentu larutan dianggap sama dengan air, c = 4.2 J g⁻¹ °C⁻¹, (iii) Tiada kehilangan haba ke persekitaran, (iv) Tiada haba diserap oleh radas eksperimen (cawan polistirena & termometer)."],"labId":"kim53_calorimeter_4in1_lab","labTitle":"Kalorimeter Cawan Polistirena 4-Dalam-1 (Q = mcθ)","labProps":{"tab":"pemendakan","subKey":"pbso4"},"examTip":"Perangkap lazim Kertas 2: Apabila mencampurkan 100 cm³ larutan A dan 100 cm³ larutan B, jisim larutan m ialah (100 + 100) = 200 g, BUKAN 100 g!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 4 Jenis Haba & 1 Mol n","voiceCaption":"Padankan keempat-empat jenis haba tindak balas dengan maksud satu mol n yang tepat bagi setiap satunya.","voiceScript":"[confident] Sebelum mengira, pastikan kamu tahu apakah bahan atau hasil yang mewakili satu mol n! Padankan keempat-empat jenis haba tindak balas ini dengan takrifan satu mol yang tepat.","prompt":"Padankan 4 jenis haba tindak balas dengan makna '1 mol' (n) masing-masing:","pairs":[{"id":"h4m1","left":"Haba Pemendakan","right":"1 mol mendakan tak terlarutkan terbentuk daripada ion-ionnya"},{"id":"h4m2","left":"Haba Penyesaran","right":"1 mol logam disesarkan daripada larutan garam oleh logam lebih elektropositif"},{"id":"h4m3","left":"Haba Peneutralan","right":"1 mol air (H₂O) terbentuk daripada tindak balas antara asid dengan alkali"},{"id":"h4m4","left":"Haba Pembakaran","right":"1 mol bahan api dibakar lengkap dalam oksigen (O₂) berlebihan"}],"explanation":"Setiap definisi dalam Kertas 2 SPM mesti menyebut 'perubahan haba apabila 1 mol [mendakan terbentuk / logam disesarkan / air terbentuk / bahan dibakar lengkap dalam O₂ berlebihan]'."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Haba Pemendakan & Aktiviti 3B","voiceCaption":"Haba pemendakan ialah perubahan haba apabila satu mol mendakan terbentuk melalui tindak balas penguraian ganda dua, seperti barium sulfat, plumbum dua sulfat dan argentum klorida.","voiceScript":"[warm] Haba tindak balas pertama ialah Haba Pemendakan! Tahukah kamu pesakit perlu meminum larutan mendakan barium sulfat sebagai media kontras supaya perut dan usus kelihatan jelas pada sinar X? Tindak balas penguraian ganda dua mencampurkan dua larutan garam terlarutkan untuk membentuk garam tak terlarutkan atau mendakan. Contohnya, seratus sentimeter padu plumbum dua nitrat satu molar dicampurkan dengan seratus sentimeter padu natrium sulfat satu molar menaikkan suhu sebanyak tiga darjah Celsius: jumlah jisim ialah dua ratus gram, mol ialah kosong perpuluhan satu mol, Q ialah dua ribu lima ratus dua puluh jul atau dua perpuluhan lima dua kilojul, menghasilkan delta H negatif dua puluh lima perpuluhan dua kilojul per mol! Dalam Aktiviti tiga B pula, kita menguji mendakan argentum klorida dan magnesium karbonat!","title":"Haba Pemendakan (BaSO₄, PbSO₄, AgCl, MgCO₃) & Aktiviti 3B","acronym":"M•G•ΔH","hook":"Nilai teori pemendakan AgCl ialah -65.5 kJ mol⁻¹, tetapi mengapa eksperimen Aktiviti 3B di makmal sentiasa menghasilkan nilai yang lebih rendah?","formula":"Pb²⁺(ak) + SO₄²⁻(ak) -> PbSO₄(p)  |  Ag⁺(ak) + Cl⁻(ak) -> AgCl(p)  ΔH = -65.5 kJ mol⁻¹","summary":"Haba pemendakan ialah perubahan haba apabila 1 mol mendakan terbentuk daripada ion-ionnya di dalam larutan akueus melalui penguraian ganda dua.","bullets":["Contoh Kiraan PbSO₄ & AgCl: Mencampurkan 100 cm³ Pb(NO₃)₂ 1.0 M + 100 cm³ Na₂SO₄ 1.0 M memberi n = 0.1 mol, m = 200 g, θ = 3.0 °C, Q = 2520 J = 2.52 kJ -> ΔH = -25.2 kJ mol⁻¹. Untuk 20 cm³ AgNO₃ 0.5 M + 20 cm³ KCl 0.5 M (ΔH = -65.5 kJ mol⁻¹): n = 0.01 mol -> Q = 655 J -> θ = 655 / (40 × 4.2) = 3.9 °C.","Aktiviti 3B (AgCl & MgCO₃) & Jurang Nilai Teori: Definisi secara operasi AgCl = apabila NaCl ditambah ke AgNO₃ membentuk 1 mol mendakan putih AgCl, bacaan termometer meningkat. Nilai eksperimen lebih rendah daripada -65.5 kJ mol⁻¹ kerana sebahagian haba hilang ke persekitaran dan diserap oleh cawan polistirena serta termometer."],"labId":"kim53_calorimeter_4in1_lab","labTitle":"Kalorimeter Pemendakan: PbSO₄, AgCl & CaCO₃","labProps":{"tab":"pemendakan","subKey":"agcl"},"examTip":"Jika bilangan mol dua larutan tidak sama (cth. 0.02 mol AgNO₃ + 0.05 mol NaCl), sentiasa gunakan bilangan mol bahan pengehad (0.02 mol) sebagai n mendakan!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Pemendakan CaCO3 Endotermik","voiceCaption":"Ramalkan haba pemendakan kalsium karbonat apabila suhu campuran turun daripada dua puluh tujuh darjah Celsius kepada dua puluh tiga darjah Celsius.","voiceScript":"[curious] Awas dengan soalan perangkap Selesaikan Masalah nombor satu di buku teks! Lima puluh sentimeter padu kalsium klorida dua molar dicampurkan dengan lima puluh sentimeter padu natrium karbonat dua molar, dan suhu campuran MENURUN daripada dua puluh tujuh darjah Celsius kepada dua puluh tiga darjah Celsius! Berapakah nilai dan tanda delta H pemendakan kalsium karbonat?","hook":"Sahkan bacaan jisim m = 100 g, mol n = 0.1 mol dan suhu turun dalam Kalorimeter selepas menjawab!","scenario":"50 cm³ CaCl₂ 2.0 mol dm⁻³ + 50 cm³ Na₂CO₃ 2.0 mol dm⁻³ dicampurkan. Suhu menurun daripada 27.0 °C kepada 23.0 °C (c = 4.2 J g⁻¹ °C⁻¹, ketumpatan = 1 g cm⁻³).","prompt":"Berapakah haba pemendakan (ΔH) bagi kalsium karbonat, CaCO₃ dalam eksperimen ini?","options":["+16.8 kJ mol⁻¹ (tindak balas endotermik kerana suhu campuran menurun 4.0 °C)","-16.8 kJ mol⁻¹ (tindak balas eksotermik)","+8.4 kJ mol⁻¹ (kerana hanya 50 g larutan dikira)","-33.6 kJ mol⁻¹ (kerana kemolaran 2.0 mol dm⁻³)"],"correctIndex":0,"proofLabId":"kim53_calorimeter_4in1_lab","proofState":{"tab":"pemendakan","subKey":"caco3","concM":2},"explanation":"Langkah 1: n = (2.0 × 50)/1000 = 0.1 mol CaCO₃. Langkah 2: m = 50 + 50 = 100 g; θ = 27.0 - 23.0 = 4.0 °C; Q = 100 × 4.2 × 4.0 = 1680 J = 1.68 kJ. Langkah 3: 1.68 / 0.1 = 16.8 kJ mol⁻¹. Kerana suhu MENURUN, tindak balas ini menyerap haba (endotermik), maka ΔH = +16.8 kJ mol⁻¹!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Haba Penyesaran & Keelektropositifan","voiceCaption":"Haba penyesaran bergantung kepada perbezaan kedudukan logam dalam Siri Elektrokimia; lebih besar perbezaan keelektropositifan, lebih tinggi haba penyesaran.","voiceScript":"[warm] Sekarang kita teroka jenis haba kedua iaitu Haba Penyesaran! Haba penyesaran ialah perubahan haba apabila satu mol logam disesarkan daripada larutan garamnya oleh logam yang lebih elektropositif. Contohnya, apabila paku besi dimasukkan ke dalam larutan biru kuprum dua sulfat, enapan perang kuprum terbentuk, larutan biru bertukar hijau pucat dan suhu meningkat dengan delta H negatif dua ratus lima puluh kilojul per mol! Dalam Aktiviti tiga C, kita membandingkan zink dengan magnesium dalam kuprum dua sulfat. Mengapakah nilai delta H magnesium lebih besar daripada zink? Kerana perbezaan keelektropositifan antara magnesium dan kuprum lebih jauh dalam Siri Elektrokimia!","title":"Haba Penyesaran (Fe, Zn, Mg + CuSO₄) & Aktiviti Makmal 3C","acronym":"E•K•I•P","hook":"Mengapakah serbuk magnesium mesti ditambah secara BERLEBIHAN dan mengapa menukar CuSO₄ kepada Cu(NO₃)₂ tidak mengubah nilai ΔH?","mediaKey":"kim53_penyesaran_cu","formula":"Fe(p) + Cu²⁺(ak) -> Fe²⁺(ak) + Cu(p)  |  Mg(p) + FeSO₄(ak) -> Fe(p) + MgSO₄(ak)  ΔH = -67.2 kJ mol⁻¹","summary":"Logam yang lebih elektropositif menyesarkan logam yang kurang elektropositif daripada larutan garamnya sambil membebaskan haba sepadan dengan jurang Siri Elektrokimia.","bullets":["Aktiviti 3C (Mg vs Zn + CuSO₄): Jarak antara Mg dengan Cu dalam Siri Elektrokimia lebih jauh (perbezaan keelektropositifan lebih besar) berbanding Zn dengan Cu, maka haba penyesaran Cu oleh Mg lebih tinggi (lebih negatif). Pemerhatian lain: pepejal perang Cu termendak, warna biru larutan memudar menjadi tidak berwarna, serbuk logam melarut.","Kawalan Pemboleh Ubah Kertas 2: Serbuk logam ditambah secara BERLEBIHAN untuk memastikan kesemua ion Cu²⁺ disesarkan sepenuhnya. Jika larutan CuSO₄ digantikan dengan Cu(NO₃)₂ (kepekatan dan isi padu sama), nilai ΔH tetap SAMA kerana tindak balas ionik hanya melibatkan penyesaran ion Cu²⁺ manakala SO₄²⁻ dan NO₃⁻ ialah ion pemerhati."],"labId":"kim53_calorimeter_4in1_lab","labTitle":"Simulator Penyesaran Mg vs Zn vs Fe dalam CuSO₄","labProps":{"tab":"penyesaran","subKey":"mg_cu"},"examTip":"Untuk soalan pengiraan penyesaran (cth. serbuk Mg berlebihan + 50 cm³ FeSO₄ 0.25 M), JANGAN tambah jisim serbuk pepejal Mg ke dalam m! Jisim m hanya mengambil kira isi padu larutan (50 g) kerana serbuk logam tidak menyumbang isi padu larutan."},{"type":"sort","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Isih Pemendakan vs Penyesaran","voiceCaption":"Kelaskan enam ciri dan fakta eksperimen berikut antara Haba Pemendakan dengan Haba Penyesaran.","voiceScript":"[confident] Jom bezakan kedua-dua eksperimen cawan polistirena ini! Isihkan keenam-enam fakta berikut antara Haba Pemendakan dengan Haba Penyesaran.","prompt":"Kelaskan pernyataan berikut kepada Haba Pemendakan atau Haba Penyesaran:","buckets":[{"id":"mendak","label":"Haba Pemendakan"},{"id":"sesar","label":"Haba Penyesaran"}],"items":[{"text":"Melibatkan tindak balas penguraian ganda dua mencampurkan dua larutan akueus","bucketId":"mendak","note":"Jisim larutan m = jumlah isi padu kedua-dua larutan (V₁ + V₂)"},{"text":"Menambah serbuk logam lebih elektropositif secara berlebihan ke dalam satu larutan garam","bucketId":"sesar","note":"Logam berlebihan memastikan semua ion logam kurang elektropositif disesarkan"},{"text":"Magnitud ΔH dipengaruhi oleh perbezaan keelektropositifan dalam Siri Elektrokimia","bucketId":"sesar","note":"Contohnya pasangan Mg-Cu membebaskan haba lebih tinggi daripada Zn-Cu"},{"text":"Contoh penting ialah pembentukan BaSO₄ untuk imbasan sinar-X dan AgCl dalam Aktiviti 3B","bucketId":"mendak","note":"Kedua-duanya menghasilkan 1 mol mendakan garam tak terlarutkan"},{"text":"Warna biru larutan kuprum(II) sulfat memudar serta menghasilkan enapan perang","bucketId":"sesar","note":"Ion Cu²⁺ biru berkurang dan berubah menjadi atom logam kuprum perang"},{"text":"Bilangan mol n mewakili mol mendakan tak terlarutkan yang terbentuk","bucketId":"mendak","note":"Ditentukan melalui stoikiometri persamaan ion antara kation dan anion"}],"explanation":"Walaupun kedua-duanya menggunakan cawan polistirena dan rumus Q = mcθ, pemendakan menggabungkan dua larutan (m = V₁ + V₂) sedangkan penyesaran memasukkan serbuk pepejal berlebihan ke dalam satu larutan garam (m = V larutan)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Susun Sebab Mg vs Zn Penyesaran","voiceCaption":"Susun jawapan Kertas dua bagi menerangkan mengapa haba penyesaran kuprum oleh magnesium lebih tinggi daripada zink.","voiceScript":"[confident] Soalan perbincangan Aktiviti tiga C ini sangat kerap keluar Kertas dua! Susun jawapan tepat menerangkan mengapa magnesium membebaskan lebih banyak haba apabila menyesarkan kuprum berbanding zink.","prompt":"Susun huraian Perbincangan Aktiviti 3C mengapa |ΔH| penyesaran Cu oleh Mg lebih tinggi daripada oleh Zn:","hint":"Rujuk kedudukan magnesium, zink dan kuprum dari segi keelektropositifan...","answerTokens":["Magnesium lebih elektropositif daripada zink","maka perbezaan keelektropositifan antara magnesium dengan kuprum","adalah lebih besar berbanding antara zink dengan kuprum","menyebabkan lebih banyak haba dibebaskan"],"distractors":["kerana magnesium mempunyai takat lebur lebih rendah daripada zink","supaya ion sulfat bertindak balas menjadi asid sulfurik"],"explanation":"Skema markah penuh Kertas 2: Magnesium berada lebih tinggi daripada zink dalam Siri Elektrokimia; perbezaan keelektropositifan antara Mg dengan Cu lebih besar berbanding Zn dengan Cu, maka lebih banyak tenaga haba terbebas bagi setiap mol Cu yang disesarkan."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Aktiviti 3A: Cu + AgNO3 (0.5M vs 1.0M)","voiceCaption":"Selesaikan soalan Aktiviti tiga A membandingkan perubahan suhu apabila kepekatan larutan argentum nitrat digandakan daripada kosong perpuluhan lima ke satu molar.","voiceScript":"[excited] Cabaran penutup Unit dua daripada Aktiviti tiga A! Serbuk kuprum berlebihan ditambah kepada seratus sentimeter padu argentum nitrat kosong perpuluhan lima molar dengan delta H negatif seratus lima kilojul per mol. Jika eksperimen diulang menggunakan kepekatan satu perpuluhan sifar molar pada isi padu yang sama, apakah yang berlaku kepada kenaikan suhu dan nilai delta H?","stimulusHtml":"<div class='stimulus-note'><strong>Aktiviti 3A (PAK21):</strong> Cu(p) + 2Ag⁺(ak) &rarr; Cu²⁺(ak) + 2Ag(p), &Delta;H = &minus;105 kJ mol<sup>&minus;1</sup>.<br>Ujian 1: 100 cm³ AgNO₃ <strong>0.5 mol dm⁻³</strong> &nbsp;|&nbsp; Ujian 2: 100 cm³ AgNO₃ <strong>1.0 mol dm⁻³</strong></div>","prompt":"Apakah kenaikan suhu dalam Ujian 1 (0.5 M) vs Ujian 2 (1.0 M), serta kesan terhadap nilai ΔH penyesaran argentum?","options":["Ujian 1: θ = 12.5 °C (n(Ag) = 0.05 mol, Q = 5.25 kJ); Ujian 2: θ berganda menjadi 25.0 °C (n(Ag) = 0.10 mol, Q = 10.50 kJ), tetapi ΔH kekal −105 kJ mol⁻¹","Ujian 1: θ = 25.0 °C; Ujian 2: θ kekal 25.0 °C manakala ΔH berganda menjadi −210 kJ mol⁻¹","Ujian 1: θ = 6.25 °C; Ujian 2: θ berkurang separuh kerana serbuk kuprum berlebihan","Ujian 1: θ = 12.5 °C; Ujian 2: ΔH menjadi −52.5 kJ mol⁻¹ kerana isi padu kekal 100 cm³"],"correctIndex":0,"explanation":"Mengikut definisi haba penyesaran (1 mol logam Ag disesarkan): Ujian 1 mempunyai n(Ag⁺) = (0.5 × 100)/1000 = 0.05 mol -> Q = 0.05 × 105 = 5.25 kJ (5,250 J) -> θ = 5,250 / (100 × 4.2) = 12.5 °C. Dalam Ujian 2 (1.0 M), n(Ag⁺) berganda ke 0.10 mol dan haba Q berganda ke 10.50 kJ sementara jisim larutan kekal 100 g, menyebabkan kenaikan suhu θ berganda kepada 25.0 °C tetapi ΔH per 1 mol Ag tetap malar (−105 kJ mol⁻¹)."}]},{"id":"kim53-u3","title":"Unit 3: Haba Peneutralan & Haba Pembakaran Alkohol","subtitle":"Subtopik 3.2 (Bhg. B) — Eksperimen 3A (Asid/Alkali Kuat vs Lemah & Diprotik H₂SO₄) serta Eksperimen 3B (4 Alkohol & Tin Kuprum)","iconType":"graph","iconUrl":"../assets/icons/kim53-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Haba Peneutralan & Eksperimen 3A","voiceCaption":"Haba peneutralan antara asid kuat dan alkali kuat ialah negatif lima puluh tujuh kilojul per mol, manakala penggunaan asid lemah atau alkali lemah merendahkan nilainya kerana haba diserap untuk pengionan lengkap.","voiceScript":"[warm] Selamat datang ke Unit tiga! Mari dalami Haba Peneutralan, iaitu perubahan haba apabila satu mol air terbentuk daripada tindak balas antara asid dan alkali. Untuk asid kuat dan alkali kuat seperti asid hidroklorik dengan natrium hidroksida, kedua-duanya mengion lengkap seratus peratus, maka semua tenaga terbebas menghasilkan nilai teori negatif lima puluh tujuh perpuluhan tiga atau negatif lima puluh tujuh kilojul per mol! Namun dalam Eksperimen tiga A, apabila kita menggantikan asid hidroklorik dengan asid lemah seperti asid etanoik, nilai jatuh ke negatif lima puluh lima kilojul per mol! Mengapa? Kerana asid lemah hanya mengion separa dan memerlukan sebahagian haba peneutralan untuk mengionkan molekul asid lemah dengan lengkap!","title":"Haba Peneutralan & Eksperimen 3A (Kuat vs Lemah, Jadual 3.3)","acronym":"57•55•52•50","hook":"Hafal siri ajaib Eksperimen 3A: Kuat+Kuat (-57.3) > Lemah+Kuat (-55) > Kuat+Lemah (-52) > Lemah+Lemah (-50 kJ mol⁻¹)!","mediaKey":"kim53_peneutralan_titrat","formula":"H⁺(ak) + OH⁻(ak) -> H₂O(ce)   ΔH = −57.3 kJ mol⁻¹ (atau −57 kJ mol⁻¹)","summary":"Kekuatan asid dan alkali menentukan magnitud haba peneutralan kerana asid atau alkali lemah hanya mengion separa di dalam air.","bullets":["Jadual 3.3 Eksperimen 3A (HCl, CH₃COOH, NaOH, NH₃): Asid kuat + Alkali kuat (HCl + NaOH) = -57.3 kJ mol⁻¹ (mengion lengkap); Asid lemah + Alkali kuat (CH₃COOH + NaOH) = -55 kJ mol⁻¹; Asid kuat + Alkali lemah (HCl + NH₃) = -52 kJ mol⁻¹; Asid lemah + Alkali lemah (CH₃COOH + NH₃) = -50 kJ mol⁻¹.","Sebab Perbezaan & Kiraan Contoh (CH₃COOH + NaOH): Molekul asid lemah/alkali lemah hanya mengion separa, maka sebahagian haba yang dibebaskan semasa pembentukan air diserap semula untuk mengionkan molekul asid lemah atau alkali lemah dengan lengkap. Contoh 60 cm³ NaOH 2.0 M + 60 cm³ CH₃COOH 2.0 M (28.0 °C -> 40.5 °C): n = 0.12 mol, m = 120 g, Q = 6300 J = 6.3 kJ -> ΔH = -52.5 kJ mol⁻¹."],"labId":"kim53_calorimeter_4in1_lab","labTitle":"Kalorimeter Peneutralan: 4 Gabungan Asid-Alkali & Diprotik","labProps":{"tab":"peneutralan","subKey":"lk"},"examTip":"Dalam soalan struktur Kertas 2, JANGAN tulis 'asid lemah kurang ion hidrogen' sahaja! Ayat kunci skema: 'Asid lemah mengion separa dalam air; sebahagian haba peneutralan diserap untuk mengionkan molekul asid lemah dengan lengkap'."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Asid Diprotik H2SO4","voiceCaption":"Ramalkan jumlah haba dibebaskan dan haba peneutralan bagi satu mol asid sulfurik diprotik dengan dua mol natrium hidroksida berbanding asid hidroklorik monoprotik.","voiceScript":"[curious] Awas perangkap kebesan asid yang paling terkenal dalam S P M! Asid hidroklorik ialah asid monoprotik, manakala asid sulfurik ialah asid diprotik! Apabila satu mol asid sulfurik bertindak balas lengkap dengan dua mol natrium hidroksida, berapakah jumlah haba yang dibebaskan dan berapakah pula nilai haba peneutralannya?","hook":"Aktifkan butang H₂SO₄ (Diprotik) dalam Kalorimeter selepas menjawab untuk melihat kedua-dua angka!","scenario":"Tindak balas A: HCl(ak) + NaOH(ak) -> NaCl(ak) + H₂O(ce) | Tindak balas B: H₂SO₄(ak) + 2NaOH(ak) -> Na₂SO₄(ak) + 2H₂O(ce).","prompt":"Manakah perbandingan paling tepat antara jumlah haba dibebaskan dengan haba peneutralan (ΔH) bagi tindak balas asid diprotik H₂SO₄ + NaOH?","options":["Jumlah haba terbebas bagi 1 mol H₂SO₄ ialah 2 kali ganda (114 kJ kerana membentuk 2 mol H₂O), TETAPI haba peneutralannya kekal −57 kJ mol⁻¹ (atau −57.3 kJ mol⁻¹) kerana definisi merujuk pembentukan 1 mol air","Haba peneutralan H₂SO₄ menjadi −114 kJ mol⁻¹ kerana mengandungi 2 mol ion sulfat","Jumlah haba terbebas berkurang separuh kepada −28.5 kJ kerana asid sulfurik mengion separa","Tiada perbezaan langsung dari segi jumlah haba terbebas walaupun 2 mol air terbentuk"],"correctIndex":0,"proofLabId":"kim53_calorimeter_4in1_lab","proofState":{"tab":"peneutralan","subKey":"kk","diprotic":true},"explanation":"1 mol H₂SO₄ mengion lengkap menghasilkan 2 mol ion H⁺ lalu membentuk 2 mol H₂O (membebaskan 2 × 57 = 114 kJ haba). Namun, mengikut definisi, haba peneutralan sentiasa dinyatakan bagi pembentukan 1 mol air, iaitu kekal −57 kJ mol⁻¹ (atau −57.3 kJ mol⁻¹)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Isih Magnitud Haba Peneutralan","voiceCaption":"Kelaskan enam pasangan tindak balas peneutralan berikut mengikut sama ada nilai haba peneutralannya sekitar negatif lima puluh tujuh kilojul per mol atau lebih rendah daripada lima puluh tujuh kilojul per mol.","voiceScript":"[confident] Jom uji kemahiran mengecam kekuatan asid dan alkali! Asingkan enam pasangan bahan ini antara nilai haba peneutralan penuh sekitar negatif lima puluh tujuh kilojul per mol dengan yang lebih rendah kerana pengionan separa.","prompt":"Isihkan pasangan peneutralan berikut mengikut magnitud ΔH masing-masing:","buckets":[{"id":"penuh","label":"ΔH ≈ −57 kJ mol⁻¹ (Kuat + Kuat)"},{"id":"rendah","label":"|ΔH| < 57 kJ mol⁻¹ (Ada Asid/Alkali Lemah)"}],"items":[{"text":"Asid nitrik (HNO₃) + Larutan kalium hidroksida (KOH)","bucketId":"penuh","note":"Asid kuat monoprotik + alkali kuat mengion 100%"},{"text":"Asid etanoik (CH₃COOH) + Larutan natrium hidroksida (NaOH)","bucketId":"rendah","note":"Asid lemah mengion separa -> haba diserap (ΔH ≈ −55 kJ mol⁻¹)"},{"text":"Asid hidroklorik (HCl) + Larutan ammonia (NH₃)","bucketId":"rendah","note":"Alkali lemah mengion separa -> haba diserap (ΔH ≈ −52 kJ mol⁻¹)"},{"text":"Asid sulfurik (H₂SO₄) + Larutan natrium hidroksida (NaOH)","bucketId":"penuh","note":"Asid kuat diprotik + alkali kuat; haba per 1 mol air tetap −57 kJ mol⁻¹"},{"text":"Asid etanoik (CH₃COOH) + Larutan ammonia (NH₃)","bucketId":"rendah","note":"Kedua-duanya lemah -> paling banyak haba diserap (ΔH ≈ −50 kJ mol⁻¹)"},{"text":"Asid hidroklorik (HCl) + Larutan kalium hidroksida (KOH)","bucketId":"penuh","note":"Tindak balas tulen H⁺ + OH⁻ -> H₂O membebaskan haba maksimum"}],"explanation":"Hanya pasangan asid kuat (HCl, HNO₃, H₂SO₄) bersama alkali kuat (NaOH, KOH) memberi haba peneutralan penuh ≈ −57 kJ mol⁻¹ (−57.3 kJ mol⁻¹); kehadiran asid lemah (CH₃COOH) atau alkali lemah (NH₃) sentiasa merendahkan nilai haba yang dibebaskan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s4","voiceToneLabel":"Haba Pembakaran 4 Alkohol","voiceCaption":"Pertambahan bilangan atom karbon per molekul alkohol daripada metanol ke butanol meningkatkan haba pembakaran secara seragam dan menggunakan tin kuprum tanpa kasa dawai.","voiceScript":"[warm] Sekarang mari jalankan Eksperimen tiga B: Haba Pembakaran empat ahli alkohol berturutan iaitu metanol, etanol, propanol dan butanol! Haba pembakaran ialah haba yang dibebaskan apabila satu mol bahan dibakar lengkap dalam oksigen berlebihan. Semakin bertambah bilangan atom karbon per molekul alkohol, semakin tinggi haba pembakarannya secara seragam kerana setiap ahli berbeza dengan satu kumpulan C H dua lalu membentuk lebih banyak molekul karbon dioksida dan air! Untuk keputusan tepat, gunakan tin kuprum konduktor haba baik, penghadang angin, bongkah kayu tanpa kasa dawai, kacau air sentiasa dan timbang pelita berpenutup serta-merta!","title":"Haba Pembakaran Alkohol (Eksperimen 3B) & Langkah Berjaga-jaga","acronym":"M•E•P•B","hook":"Mengapakah Eksperimen 3B menggunakan tin kuprum di atas segi tiga tanah liat TANPA kasa dawai, dan mengapakah dasar tin menjadi hitam berjelaga?","mediaKey":"kim53_pelita_alkohol","formula":"C₂H₅OH(ce) + 3O₂(g) -> 2CO₂(g) + 3H₂O(ce)   ΔH = −1376 kJ mol⁻¹","summary":"Haba pembakaran meningkat secara linear daripada metanol (1C) kepada butanol (4C) sejajar pertambahan kumpulan -CH₂- yang menghasilkan lebih banyak ikatan CO₂ dan H₂O.","bullets":["Trend Alkohol (Metanol -> Etanol -> Propanol -> Butanol) & Kiraan Etanol: Semakin bertambah bilangan atom C (1 -> 4), semakin banyak molekul CO₂ dan H₂O terbentuk, maka lebih banyak haba dibebaskan (peningkatan hampir sekata kerana beza 1 kumpulan -CH₂-). Kiraan Contoh: menaikkan suhu 200 cm³ air sebanyak 50.0 °C -> Q = 200 × 4.2 × 50 = 42 kJ -> n = 42/1376 = 0.0305 mol ≈ 0.03 mol -> jisim etanol = 0.03 × 46 = 1.38 g.","Radas & Sebab Nilai Eksperimen < Teori: Tin kuprum dipilih kerana konduktor haba baik; penghadang angin mengurangkan kehilangan haba; tiada kasa dawai supaya kasa tidak menyerap haba; bongkah kayu meninggikan pelita supaya nyalaan menyentuh dasar tin; pelita berpenutup ditimbang serta-merta kerana alkohol mudah meruap. Enapan hitam (jelaga karbon) di bawah tin membuktikan pembakaran tidak lengkap."],"labId":"kim53_pembakaran_alkohol_lab","labTitle":"Makmal Maya Eksperimen 3B: 4 Alkohol & Audit Radas","labProps":{"alcohol":"etanol"},"examTip":"Empat sebab wajib Kertas 2 mengapa nilai eksperimen haba pembakaran lebih rendah daripada teori: (1) Haba hilang ke persekitaran, (2) Haba diserap oleh tin kuprum/radas, (3) Pembakaran tidak lengkap menghasilkan jelaga karbon, (4) Sebahagian alkohol meruap."},{"type":"match","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Padan Radas Eksperimen 3B","voiceCaption":"Padankan lima komponen radas dan teknik pengendalian dalam Eksperimen tiga B dengan tujuan saintifiknya yang tepat.","voiceScript":"[confident] Pastikan kamu boleh menjawab setiap soalan Perbincangan Eksperimen tiga B! Padankan lima komponen radas dan langkah berjaga-jaga ini dengan fungsinya yang betul.","prompt":"Padankan radas dan prosedur Eksperimen 3B dengan tujuan saintifiknya:","pairs":[{"id":"e3b1","left":"Menggunakan bekas / tin kuprum","right":"Kuprum ialah konduktor haba yang baik untuk memindahkan haba ke air"},{"id":"e3b2","left":"Menggunakan penghadang angin","right":"Mengurangkan kehilangan haba ke persekitaran akibat tiupan angin"},{"id":"e3b3","left":"Menggunakan segi tiga tanah liat tanpa kasa dawai","right":"Mengelakkan kasa dawai menyerap sebahagian haba daripada nyalaan"},{"id":"e3b4","left":"Menimbang pelita berpenutup serta-merta selepas padam","right":"Mengelakkan ralat jisim akibat penyejatan alkohol yang mudah meruap"},{"id":"e3b5","left":"Jelaga hitam terbentuk di bahagian bawah tin kuprum","right":"Terhasil daripada pembakaran tidak lengkap menghasilkan karbon"}],"explanation":"Kelima-lima langkah berjaga-jaga ini sering disoal dalam soalan Kertas 2 dan Amali Berstruktur SPM untuk menjelaskan cara mengurangkan ralat kehilangan haba dan penyejatan bahan api."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Punca Nilai Eksperimen Rendah","voiceCaption":"Susun jawapan lengkap mengenai punca nilai haba pembakaran etanol yang diperoleh dalam eksperimen lebih rendah daripada nilai teori.","voiceScript":"[confident] Susun semula empat punca utama mengapa nilai haba pembakaran alkohol secara eksperimen jauh lebih rendah daripada nilai teori negatif seribu tiga ratus tujuh puluh enam kilojul per mol!","prompt":"Susun huraian lengkap mengapa nilai eksperimen haba pembakaran etanol lebih rendah daripada -1376 kJ mol⁻¹:","hint":"Gabungkan kehilangan haba, serapan radas, jelaga dan sifat meruap alkohol...","answerTokens":["Sebahagian haba hilang ke persekitaran","dan diserap oleh bekas kuprum serta radas","manakala pembakaran tidak lengkap menghasilkan jelaga","serta sebahagian etanol meruap semasa penimbangan"],"distractors":["kerana etanol merupakan asid lemah yang mengion separa","kerana muatan haba tentu air ialah 1.0 J g⁻¹ °C⁻¹"],"explanation":"Keempat-empat faktor ini mengurangkan haba yang benar-benar diterima air (atau meningkatkan bacaan jisim alkohol hilang), menjadikan magnitud |ΔH| eksperimen lebih kecil daripada teori."},{"type":"predict","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Ramal Graf Alkohol C1 ke C4","voiceCaption":"Ramalkan bentuk graf haba pembakaran alkohol melawan bilangan atom karbon dan sebab peningkatan nilainya antara ahli berturutan hampir sekata.","voiceScript":"[curious] Cuba ramalkan bentuk graf Rajah tiga perpuluhan empat belas apabila haba pembakaran diplot melawan bilangan atom karbon satu hingga empat! Mengapakah kenaikan nilai antara metanol, etanol, propanol dan butanol adalah hampir sama?","hook":"Periksa graf linear Teori vs Eksperimen bagi keempat-empat alkohol di dalam Makmal Pembakaran Alkohol!","scenario":"Empat ahli siri homolog alkohol (CH₃OH, C₂H₅OH, C₃H₇OH, C₄H₉OH) diuji dalam Eksperimen 3B untuk membandingkan haba pembakaran masing-masing.","prompt":"Apakah bentuk graf haba pembakaran melawan bilangan atom karbon serta sebab kimianya?","options":["Meningkat secara garis lurus dengan sela hampir sama (~650 kJ mol⁻¹) kerana setiap ahli berturutan bertambah satu kumpulan -CH₂-, menghasilkan lebih banyak molekul CO₂ dan H₂O","Menurun secara mendadak dari metanol ke butanol kerana molekul besar tidak boleh terbakar dalam oksigen","Kekal mendatar pada -1376 kJ mol⁻¹ kerana semua alkohol mengandungi satu kumpulan berfungsi -OH sahaja","Membentuk lengkung parabolik ke bawah selepas etanol kerana butanol beracun"],"correctIndex":0,"proofLabId":"kim53_pembakaran_alkohol_lab","proofState":{"alcohol":"butanol","windShield":true,"noWireGauze":true},"explanation":"Setiap pertambahan satu ahli alkohol menambah satu kumpulan -CH₂- (1 atom C dan 2 atom H). Pembakaran lengkapnya membentuk 1 mol CO₂ dan 1 mol H₂O tambahan, maka pertambahan haba pembakaran antara ahli berturutan hampir seragam (~650 kJ mol⁻¹)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s8","voiceToneLabel":"Aktiviti 3B: HCl + NaOH vs HNO3","voiceCaption":"Selesaikan soalan pengiraan Aktiviti tiga B antara seratus sentimeter padu asid hidroklorik dua molar dengan natrium hidroksida dua molar.","voiceScript":"[excited] Soalan penutup Unit tiga daripada Aktiviti tiga B! Seratus sentimeter padu asid hidroklorik dua molar dicampur ke seratus sentimeter padu natrium hidroksida dua molar, menaikkan suhu daripada tiga puluh ke empat puluh tiga perpuluhan lima darjah Celsius. Hitung haba peneutralan dan ramal suhu jika asid nitrik digunakan!","stimulusHtml":"<div class='stimulus-note'><strong>Aktiviti 3B:</strong> 100 cm³ HCl 2.0 M + 100 cm³ NaOH 2.0 M &rarr; suhu naik dari <strong>30.0 °C ke 43.5 °C</strong>.<br>[c = 4.2 J g⁻¹ °C⁻¹, ketumpatan = 1 g cm⁻³]</div>","prompt":"Berapakah haba peneutralan yang diperoleh, dan apakah ramalan jika HCl digantikan dengan asid nitrik (HNO₃) sama isi padu dan kepekatan?","options":["ΔH = −56.7 kJ mol⁻¹ (n = 0.2 mol, m = 200 g, Q = 11.34 kJ); perubahan suhu apabila guna HNO₃ adalah SAMA (13.5 °C) kerana kedua-duanya asid kuat monoprotik yang mengion lengkap","ΔH = −113.4 kJ mol⁻¹; perubahan suhu menjadi separuh apabila guna HNO₃ kerana jisim molar nitrat lebih tinggi","ΔH = −28.35 kJ mol⁻¹; perubahan suhu meningkat 2 kali ganda dengan HNO₃","ΔH = +56.7 kJ mol⁻¹; tiada kenaikan suhu berlaku apabila HCl diganti dengan HNO₃"],"correctIndex":0,"explanation":"n(H₂O) = (2.0 × 100)/1000 = 0.2 mol. m = 100 + 100 = 200 g. θ = 43.5 - 30.0 = 13.5 °C. Q = 200 × 4.2 × 13.5 = 11,340 J = 11.34 kJ. ΔH = -11.34 / 0.2 = -56.7 kJ mol⁻¹. Menggantikan HCl dengan HNO₃ memberi kenaikan suhu yang SAMA kerana kedua-duanya ialah asid kuat monoprotik."}]},{"id":"kim53-u4","title":"Unit 4: Aplikasi Harian & Nilai Bahan Api (kJ g⁻¹)","subtitle":"Subtopik 3.3 — Pek Panas CaCl₂/Fe, Pek Sejuk NH₄NO₃, Hot Can, Termit, Perpeluhan serta Pengiraan Nilai Bahan Api & Pemilihan Bahan Api","iconType":"book","iconUrl":"../assets/icons/kim53-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Pek Panas, Pek Sejuk & Aplikasi","voiceCaption":"Aplikasi harian tindak balas eksotermik merangkumi pek panas kalsium klorida, Hot Can dan tindak balas termit, manakala endotermik merangkumi pek sejuk ammonium nitrat, pad gel dan perpeluhan.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari lihat bagaimana ahli kimia memindahkan konsep termokimia dari makmal ke kehidupan harian kita! Aplikasi eksotermik membebaskan haba berguna seperti pek panas yang mengandungi pepejal kalsium klorida kontang atau serbuk besi, tin pemanas kendiri Hot Can, tindak balas termit mengimpal landasan kereta api, beg udara, menyalakan mancis, bunga api dan pengerasan simen! Sebaliknya, aplikasi endotermik menyerap haba untuk memberi kesan sejuk seperti pek sejuk segera berisi pepejal ammonium nitrat untuk kecederaan sukan, pad gel demam, tin minuman sejuk kendiri, serbat di lidah dan juga perpeluhan badan!","title":"3.3 Aplikasi Tindak Balas Eksotermik & Endotermik dalam Kehidupan","acronym":"P•H•T•S","hook":"Ketuk kesemua 6 kad flip 3D di bawah untuk membuka rahsia bahan kimia di dalam Pek Panas, Pek Sejuk, Hot Can dan sebab perpeluhan menyejukkan badan!","mediaKey":"kim53_pek_panas_sejuk","summary":"Pemilihan bahan kimia yang tepat membolehkan tindak balas eksotermik menjana haba segera manakala tindak balas endotermik menghasilkan penyejukan segera tanpa kuasa elektrik.","bullets":["Aplikasi Eksotermik: Pek panas (kalsium klorida kontang CaCl₂ + air, atau serbuk besi teroksida melegakan kekejangan otot), Hot Can (CaO + air / Al + silika / CuSO₄ + Zn), tindak balas termit (kimpalan landasan kereta api), pembakaran bahan api (memasak), beg udara kereta, mancis, bunga api dan pengerasan simen.","Aplikasi Endotermik: Pek sejuk (ammonium nitrat NH₄NO₃ + air dalam kantung berasingan untuk meredakan bengkak sukan), pad gel (menyerap haba meredakan demam), tin minuman sejuk kendiri, serbat (rasa sejuk di lidah), dan perpeluhan (peluh menyerap haba badan untuk menyejat lalu menyejukkan kulit)."],"labId":"kim53_aplikasi_fuel_deck_lab","labTitle":"Dek Kad 3D Aplikasi Termokimia Harian (6 Kad)","labProps":{"tab":"deck"},"examTip":"Soalan Aktiviti Projek Alex Berkhemah (hlm. 145): Pek sejuk terbaik untuk menyejukkan jus oren ialah kantung plastik berisi pepejal ammonium nitrat (NH₄NO₃) dan beg air nipis di dalam; apabila dipicit, NH₄NO₃ melarut secara endotermik dan menyerap haba daripada tin jus."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Aplikasi Harian 3.3","voiceCaption":"Kelaskan enam aplikasi kehidupan harian berikut kepada kategori Tindak Balas Eksotermik atau Tindak Balas Endotermik.","voiceScript":"[confident] Jom uji penguasaan Jadual aplikasi harian Subtopik tiga perpuluhan tiga! Isihkan enam situasi ini kepada Eksotermik yang membebaskan haba atau Endotermik yang menyerap haba.","prompt":"Kelaskan aplikasi harian berikut kepada Eksotermik atau Endotermik:","buckets":[{"id":"app_ekso","label":"Aplikasi Eksotermik"},{"id":"app_endo","label":"Aplikasi Endotermik"}],"items":[{"text":"Tindak balas termit untuk kimpalan landasan kereta api & pengerasan simen","bucketId":"app_ekso","note":"Membebaskan haba tinggi bagi meleburkan besi atau mengeras"},{"text":"Pek sejuk segera berisi pepejal ammonium nitrat (NH₄NO₃) untuk kecederaan sukan","bucketId":"app_endo","note":"Pelarutan NH₄NO₃ menyerap haba daripada bahagian bengkak"},{"text":"Hot Can (kalsium oksida + air) & pek panas kalsium klorida (CaCl₂)","bucketId":"app_ekso","note":"Membebaskan haba memanaskan minuman atau melegakan kekejangan"},{"text":"Pad gel meredakan demam dan tin minuman sejuk kendiri","bucketId":"app_endo","note":"Menyerap haba dari dahi pesakit atau daripada air minuman"},{"text":"Perpeluhan pada permukaan kulit serta rasa sejuk apabila memakan serbat","bucketId":"app_endo","note":"Menyerap haba daripada badan atau lidah untuk penyejatan/pelarutan"},{"text":"Beg udara kereta, menyalakan mancis dan pembakaran bunga api","bucketId":"app_ekso","note":"Proses penguraian atau pembakaran pantas yang membebaskan haba"}],"explanation":"Semua aplikasi pemanasan/pembakaran/termal (Hot Can, pek panas CaCl₂, termit, beg udara, simen, mancis) ialah eksotermik; semua aplikasi penyejukan (pek sejuk NH₄NO₃, pad gel, tin sejuk kendiri, serbat, perpeluhan) ialah endotermik."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Nilai Bahan Api & Pemilihan","voiceCaption":"Nilai bahan api ialah kuantiti tenaga terbebas apabila satu gram bahan api dibakar lengkap, dikira dengan membahagi haba pembakaran dengan jisim molar.","voiceScript":"[warm] Mengapakah memasak menggunakan kayu api jauh lebih perlahan berbanding dapur gas, dan bahan api manakah paling sesuai menggantikan petrol? Jawapannya ialah Nilai Bahan Api! Nilai bahan api ialah kuantiti tenaga haba yang terbebas apabila satu GRAM bahan api dibakar lengkap dalam oksigen berlebihan, dengan unit kilojul per gram! Rumusnya ialah haba pembakaran dibahagi jisim molar. Contohnya, oktana mempunyai haba pembakaran lima ribu lima ratus kilojul per mol dan jisim molar seratus empat belas gram per mol, memberi empat puluh lapan perpuluhan dua kilojul per gram! Mengikut Jadual tiga perpuluhan lima, hidrogen mencatat nilai bahan api tertinggi iaitu seratus empat puluh tiga kilojul per gram!","title":"Nilai Bahan Api (kJ g⁻¹), Jadual 3.5 & 4 Faktor Pemilihan","acronym":"N•K•A•S","hook":"Bandingkan Kayu (20) vs Etanol (30) vs Oktana (48.2) vs Gas Asli (50) vs Hidrogen (143 kJ g⁻¹) dalam Kalkulator Nilai Bahan Api!","mediaKey":"kim53_trem_hidrogen","formula":"Nilai Bahan Api (kJ g⁻¹) = Haba Pembakaran (kJ mol⁻¹) ÷ Jisim Molar (g mol⁻¹)","summary":"Nilai bahan api mengukur kecekapan tenaga per gram jisim bahan api; pemilihan bahan api optimum turut menimbang kos, alam sekitar dan keselamatan.","bullets":["Pengiraan & Jadual 3.5 (kJ g⁻¹): Oktana C₈H₁₈ (Mr = 8×12 + 18×1 = 114 g mol⁻¹, |ΔH| = 5500 kJ mol⁻¹) -> 5500 ÷ 114 = 48.2 kJ g⁻¹. Jadual 3.5: Kayu (20), Metana (27), Arang (30), Etanol (30), Petrol (34), Kerosin (37), Gas Asli (50), Hidrogen (143 kJ g⁻¹). Info RON 95/97: RON (Research Octane Number) lebih tinggi bermakna petrol lebih susah terbakar (tahan ketukan).","4 Faktor Pemilihan Bahan Api (Rajah 3.15): (1) Nilai bahan api (kJ g⁻¹), (2) Kos bahan api dan kebolehdapatan (mudah diperoleh), (3) Kesan terhadap alam sekitar (oktana membebas lebih banyak jelaga dan gas rumah hijau CO₂ berbanding metana atau hidrogen yang hanya menghasilkan air), (4) Keselamatan dan kemudahan penyimpanan serta pengangkutan."],"labId":"kim53_aplikasi_fuel_deck_lab","labTitle":"Kalkulator Nilai Bahan Api (kJ g⁻¹) & Carta Jadual 3.5","labProps":{"tab":"fuel","fuel":"oktana"},"examTip":"Perhatikan perbezaan unit dalam SPM: Haba pembakaran (ΔH) sentiasa dalam kJ mol⁻¹ (untuk 1 MOL) dan bertanda negatif, manakala Nilai Bahan Api dalam kJ g⁻¹ (untuk 1 GRAM) dan dinyatakan sebagai nilai positif tenaga terbebas."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Bahan Api Hidrogen vs Oktana","voiceCaption":"Ramalkan kelebihan utama hidrogen berbanding petrol atau oktana sebagai bahan api kenderaan pengangkutan awam bandar.","voiceScript":"[curious] Jika lima puluh gram hidrogen dibakar berbanding lima puluh gram oktana, ramalkan perbandingan tenaga yang dibebaskan serta kesan pembakarannya terhadap kualiti udara bandar!","hook":"Laraskan gelangsar jisim ke 50 g dalam Kalkulator Nilai Bahan Api selepas menjawab untuk menyemak jumlah kilojul hidrogen!","scenario":"Dua bas transit bandar diuji: Bas A menggunakan petrol/oktana (48.2 kJ g⁻¹) manakala Bas B menggunakan sel bahan api hidrogen (143 kJ g⁻¹).","prompt":"Apakah kelebihan gandaan hidrogen berbanding oktana apabila 50 g bahan api dibakar dengan lengkap?","options":["Hidrogen membebaskan 7,150 kJ tenaga (~3 kali ganda oktana 2,410 kJ) dan pembakarannya hanya menghasilkan air (H₂O) tanpa jelaga atau gas rumah hijau CO₂","Oktana membebaskan tenaga lebih tinggi setiap gram dan menghasilkan sifar karbon dioksida berbanding hidrogen","Hidrogen membebaskan jelaga hitam pekat yang melindungi enjin daripada hakisan haba","Hidrogen lebih murah disimpan pada suhu bilik kerana berbentuk cecair pekat seperti petrol"],"correctIndex":0,"proofLabId":"kim53_aplikasi_fuel_deck_lab","proofState":{"tab":"fuel","fuel":"hidrogen","massG":50},"explanation":"Hidrogen mempunyai nilai bahan api 143 kJ g⁻¹ (50 g × 143 = 7,150 kJ atau 7,050 kJ pada ΔH = 282 kJ mol⁻¹), hampir 3 kali lebih tinggi daripada oktana (50 g × 48.2 = 2,410 kJ), dan hasil pembakarannya (2H₂ + O₂ -> 2H₂O) bersih sepenuhnya tanpa jelaga atau CO₂."},{"type":"match","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Padan Bahan Api & Aplikasi 3.3","voiceCaption":"Padankan lima bahan atau istilah dalam Subtopik tiga perpuluhan tiga dengan ciri atau nilainya yang tepat.","voiceScript":"[confident] Uji ketepatan ingatan fakta dan nombor Subtopik tiga perpuluhan tiga! Padankan lima item berikut dengan keterangan tepatnya.","prompt":"Padankan istilah, bahan kimia dan bahan api berikut dengan huraiannya:","pairs":[{"id":"u4m1","left":"Hidrogen (143 kJ g⁻¹)","right":"Nilai bahan api tertinggi dan membakar menghasilkan wap air sahaja"},{"id":"u4m2","left":"Oktana, C₈H₁₈ (48.2 kJ g⁻¹)","right":"5500 kJ mol⁻¹ dibahagi jisim molar 114 g mol⁻¹, menghasilkan banyak jelaga"},{"id":"u4m3","left":"Pek sejuk (NH₄NO₃ + air)","right":"Pelarutan endotermik menyerap haba untuk meredakan kecederaan sukan"},{"id":"u4m4","left":"Pek panas (CaCl₂ kontang / serbuk Fe)","right":"Membebaskan haba eksotermik untuk memanaskan anggota atau makanan"},{"id":"u4m5","left":"RON 95 vs RON 97 (Research Octane Number)","right":"Semakin tinggi nombor RON, semakin susah bahan api itu terbakar"}],"explanation":"Kelima-lima padanan merangkumi aplikasi pek haba, takrifan RON serta dua pengiraan nilai bahan api paling kerap disoal dalam SPM."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Kewajaran Pemilihan Bahan Api","voiceCaption":"Susun hujah lengkap Kertas dua bagi mewajarkan pemilihan gas asli atau metana berbanding oktana untuk memasak di rumah.","voiceScript":"[confident] Susun jawapan KBAT bagi Aktiviti tiga D: mengapakah gas asli atau metana lebih wajar dipilih untuk menggoreng telur di dapur berbanding oktana atau kayu api?","prompt":"Susun kewajaran memilih bahan api memasak yang lebih bersih dan cekap:","hint":"Bandingkan nilai bahan api, penghasilan jelaga dan kebersihan peralatan dapur...","answerTokens":["Gas asli mempunyai nilai bahan api tinggi","iaitu 50 kJ g⁻¹ berbanding kayu 20 kJ g⁻¹","dan membakar lebih bersih dengan kurang jelaga","berbanding oktana yang menghitamkan periuk"],"distractors":["kerana gas asli menyerap haba secara endotermik","supaya dapat menyejukkan makanan seperti pad gel"],"explanation":"Memilih bahan api bukan semata-mata bergantung kepada nilai kJ g⁻¹ yang tinggi, tetapi turut mengutamakan pembakaran bersih yang kurang menghasilkan jelaga hitam dan pencemaran udara dalaman."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s7","voiceToneLabel":"Uji Kendiri 3.3: Kira Nilai Bahan Api Etanol","voiceCaption":"Selesaikan soalan pengiraan nilai bahan api etanol dan perbandingan impak alam sekitar menggantikan petrol.","voiceScript":"[excited] Soalan penutup Unit empat menggabungkan Nilai Bahan Api etanol dan Uji Kendiri tiga perpuluhan tiga! Diberi haba pembakaran etanol ialah negatif seribu tiga ratus tujuh puluh enam kilojul per mol dan jisim molarnya empat puluh enam gram per mol. Berapakah nilai bahan api etanol dan mengapakah bahan api bersih seperti hidrogen lebih baik daripada petrol untuk alam sekitar?","stimulusHtml":"<div class='stimulus-note'><strong>Data Etanol (C₂H₅OH):</strong> Haba pembakaran = &minus;1376 kJ mol<sup>&minus;1</sup> &nbsp;|&nbsp; Jisim molar = 46 g mol<sup>&minus;1</sup></div>","prompt":"Apakah nilai bahan api etanol (kJ g⁻¹), dan apakah kelebihan alam sekitar bahan api hidrogen berbanding petrol (Uji Kendiri 3.3)?","options":["Nilai bahan api etanol = 29.9 kJ g⁻¹ (~30 kJ g⁻¹); hidrogen menggantikan petrol tidak membebaskan gas rumah hijau CO₂ atau jelaga kerana hanya menghasilkan air (H₂O)","Nilai bahan api etanol = 63.3 kJ g⁻¹; hidrogen membebaskan lebih banyak karbon dioksida daripada petrol","Nilai bahan api etanol = 13.8 kJ g⁻¹; petrol menghasilkan wap air tulen sahaja tanpa pencemaran","Nilai bahan api etanol = 29.9 kJ g⁻¹; hidrogen dilarang untuk kenderaan kerana nilai bahan apinya paling rendah"],"correctIndex":0,"explanation":"Nilai bahan api etanol = 1376 kJ mol⁻¹ ÷ 46 g mol⁻¹ = 29.9 kJ g⁻¹ (dibundarkan ke 30 kJ g⁻¹ dalam Jadual 3.5). Dari segi alam sekitar, petrol menghasilkan gas rumah hijau CO₂, karbon monoksida dan jelaga yang menyebabkan pemanasan global, sedangkan hidrogen hanya menghasilkan air."}]},{"id":"kim53-u5","title":"Unit 5: Cabaran Boss SPM — Penguasaan Termokimia","subtitle":"Sintesis Kertas 1 & Kertas 2 — Ujian Pencapaian (No. 1–3), Selesaikan Masalah (No. 1–2) & Audit Eksperimen Termokimia","iconType":"trophy","iconUrl":"../assets/icons/kim53-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Kes 1: Ujian Pencapaian 1","voiceCaption":"Selesaikan soalan Ujian Pencapaian nombor satu mengira tenaga haba yang dibebaskan apabila seratus sentimeter padu HCl dan seratus sentimeter padu NaOH menaikkan suhu tujuh darjah Celsius.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama terus daripada Ujian Pencapaian nombor satu! Seratus sentimeter padu asid hidroklorik cair dicampurkan kepada seratus sentimeter padu natrium hidroksida berkepekatan sama di dalam cawan polistirena sehingga suhu campuran meningkat tujuh perpuluhan sifar darjah Celsius. Hitung jumlah haba yang dibebaskan dan bilangan mol air jika delta H eksperimen ialah negatif lima puluh lapan perpuluhan lapan kilojul per mol!","stimulusHtml":"<div class='stimulus-note'><strong>Ujian Pencapaian (No. 1):</strong> 100 cm³ HCl(ak) + 100 cm³ NaOH(ak) berkepekatan sama dalam cawan polistirena; kenaikan suhu &theta; = <strong>7.0 °C</strong>. [c = 4.2 J g⁻¹ °C⁻¹, ketumpatan = 1 g cm⁻³]</div>","prompt":"Berapakah nilai haba yang dibebaskan (Q) dalam eksperimen ini, dan berapakah bilangan mol H₂O terbentuk jika ΔH eksperimen = −58.8 kJ mol⁻¹?","options":["Q = 5,880 J (5.88 kJ) [m = 200 g × 4.2 × 7.0]; jika ΔH = −58.8 kJ mol⁻¹, maka n = 5.88 ÷ 58.8 = 0.10 mol","Q = 2,940 J (2.94 kJ) kerana hanya 100 g asid dikira; maka n = 0.05 mol","Q = 11,760 J (11.76 kJ); maka n = 0.20 mol","Q = 5,880 J (5.88 kJ); tindak balas bersifat endotermik maka ΔH = +58.8 kJ mol⁻¹"],"correctIndex":0,"explanation":"Jisim larutan campuran, m = (100 + 100) × 1 = 200 g. Haba dibebaskan, Q = mcθ = 200 × 4.2 × 7.0 = 5,880 J = 5.88 kJ. Jika ΔH = -58.8 kJ mol⁻¹, bilangan mol air terbentuk = 5.88 kJ ÷ 58.8 kJ mol⁻¹ = 0.10 mol (kepekatan 1.0 mol dm⁻³)."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Kes 2: Suhu Tertinggi Mg+FeSO4","voiceCaption":"Ramalkan suhu tertinggi campuran apabila serbuk magnesium berlebihan bertindak balas dengan lima puluh sentimeter padu ferum dua sulfat pada suhu awal dua puluh sembilan darjah Celsius.","voiceScript":"[curious] Cabaran Boss kedua menguji soalan kiraan terbalik Selesaikan Masalah nombor dua! Serbuk magnesium berlebihan ditambah kepada lima puluh sentimeter padu ferum dua sulfat kosong perpuluhan dua lima molar pada suhu awal dua puluh sembilan darjah Celsius dengan delta H negatif lapan puluh perpuluhan enam kilojul per mol. Berapakah suhu tertinggi yang tercapai?","hook":"Buka Simulator Penyesaran dalam Kalorimeter selepas memilih jawapan untuk menyemak langkah pengiraan Q = mcθ!","scenario":"Mg(p) + Fe²⁺(ak) -> Mg²⁺(ak) + Fe(p), ΔH = −80.6 kJ mol⁻¹. Diberi 50 cm³ FeSO₄ 0.25 mol dm⁻³, suhu awal = 29.0 °C, c = 4.2 J g⁻¹ °C⁻¹.","prompt":"Berapakah suhu tertinggi yang tercapai dalam eksperimen penyesaran ini?","options":["33.8 °C (n = 0.0125 mol -> Q = 1,007.5 J -> kenaikan θ = 4.8 °C -> T_max = 29.0 + 4.8 °C)","24.2 °C (suhu menurun 4.8 °C kerana magnesium menyerap haba)","38.6 °C (kerana jisim larutan m diambil sebagai 25 g sahaja)","31.4 °C (kerana n dibahagi dua dalam persamaan ion)"],"correctIndex":0,"proofLabId":"kim53_calorimeter_4in1_lab","proofState":{"tab":"penyesaran","subKey":"mg_cu","concM":0.25},"explanation":"Langkah 1: n(Fe²⁺) = (0.25 × 50)/1000 = 0.0125 mol. Langkah 2: Q = 0.0125 mol × 80.6 kJ mol⁻¹ = 1.0075 kJ = 1,007.5 J. Langkah 3: θ = 1007.5 / (50 × 4.2) = 4.798 ≈ 4.8 °C. Maka suhu tertinggi = 29.0 °C + 4.8 °C = 33.8 °C!"},{"type":"match","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Kes 3: Sintesis 5 Tonggak Bab 3","voiceCaption":"Padankan lima kes utama merentas Subtopik tiga perpuluhan satu hingga tiga perpuluhan tiga dengan jawapan konsep peperiksaannya.","voiceScript":"[confident] Cabaran Boss ketiga menggabungkan kesemua konsep teras Bab tiga! Padankan kelima-lima fenomena termokimia ini dengan jawapan peperiksaannya yang paling tepat.","prompt":"Padankan lima konsep tunjang Bab 3 Termokimia dengan huraian tepatnya:","pairs":[{"id":"b3m1","left":"Penguraian CaCO₃ (ΔH = +540 kJ mol⁻¹)","right":"Tenaga pemutusan ikatan > tenaga pembentukan ikatan (Aras hasil lebih tinggi)"},{"id":"b3m2","left":"Penyesaran Cu oleh Mg vs oleh Zn","right":"Perbezaan keelektropositifan Mg–Cu lebih besar menjadikan |ΔH| lebih tinggi"},{"id":"b3m3","left":"Peneutralan CH₃COOH + NaOH (−55 kJ mol⁻¹)","right":"Sebahagian haba diserap untuk mengionkan molekul asid lemah dengan lengkap"},{"id":"b3m4","left":"Pembakaran alkohol C₁ hingga C₄","right":"Tin kuprum tanpa kasa dawai + penghadang angin + jelaga karbon tidak lengkap"},{"id":"b3m5","left":"Oktana (48.2 kJ g⁻¹) vs Hidrogen (143 kJ g⁻¹)","right":"Haba pembakaran ÷ Jisim molar; hidrogen sifar CO₂ & nilai tertinggi"}],"explanation":"Menguasai kelima-lima hubungan teras ini melengkapkan persediaan penuh soalan struktur dan esei Kertas 2 SPM Termokimia."},{"type":"sort","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Kes 4: Audit Ralat & Prosedur","voiceCaption":"Kelaskan enam amalan makmal termokimia berikut antara Langkah Tepat Meningkatkan Ketepatan dengan Kesilapan Yang Merendahkan Nilai Eksperimen.","voiceScript":"[confident] Pecutan Boss keempat menguji penguasaan prosedur amali dan sumber ralat! Asingkan keenam-enam amalan makmal ini kepada Langkah Tepat Meningkatkan Ketepatan atau Punca Ralat Yang Merendahkan Nilai Eksperimen.","prompt":"Audit amalan makmal Termokimia berikut:","buckets":[{"id":"tepat","label":"Langkah Meningkatkan Ketepatan"},{"id":"ralat","label":"Punca Ralat / Menurunkan |ΔH| Eksperimen"}],"items":[{"text":"Menggunakan cawan polistirena berpenutup atau tin kuprum dengan penghadang angin","bucketId":"tepat","note":"Mengurangkan kehilangan haba ke persekitaran secara ketara"},{"text":"Menggunakan kasa dawai di bawah tin kuprum semasa Eksperimen 3B","bucketId":"ralat","note":"Kasa dawai menyerap sebahagian haba daripada nyalaan pelita"},{"text":"Menuang larutan reaktan dengan cepat sambil mengacau perlahan menggunakan termometer","bucketId":"tepat","note":"Memastikan tindak balas seragam dan mengurangkan haba terbebas"},{"text":"Pembakaran tidak lengkap alkohol menghasilkan enapan jelaga hitam di bawah tin","bucketId":"ralat","note":"Tidak semua bahan api bertukar lengkap menjadi CO₂ dan H₂O"},{"text":"Biarkan pelita alkohol terbuka lama sebelum ditimbang semula selepas padam","bucketId":"ralat","note":"Alkohol mudah meruap menyebabkan ralat jisim terbakar terlalu tinggi"},{"text":"Menambah serbuk Mg atau Zn secara berlebihan dalam larutan garam kuprum(II) sulfat","bucketId":"tepat","note":"Memastikan kesemua ion Cu²⁺ disesarkan dengan lengkap"}],"explanation":"Mengenal pasti amalan yang mengurangkan kehilangan haba, mengelakkan penyejatan alkohol dan menjamin tindak balas lengkap membolehkan kamu menjawab soalan Perancangan & Penilaian Eksperimen Kertas 2 dengan cemerlang."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Kes 5: KBAT Pek Panas Natrium","voiceCaption":"Susun jawapan KBAT Ujian Pencapaian nombor tiga menerangkan mengapa logam natrium tidak boleh digunakan di dalam pek panas walaupun tindak balasnya dengan air bersifat eksotermik.","voiceScript":"[warm] Cabaran Boss kelima terus daripada soalan K B A T Ujian Pencapaian akhir bab! Tindak balas logam natrium dengan air juga sangat eksotermik. Pada pendapat kamu, mengapakah logam natrium tidak sesuai digunakan menggantikan kalsium klorida dalam pek panas?","prompt":"Susun jawapan KBAT mengapa logam natrium (Na) TIDAK dapat digunakan dalam penyediaan pek panas:","hint":"Fikirkan tahap kecergasan tindak balas logam Kumpulan 1 dengan air dan sifat hasil tindak balasnya...","answerTokens":["Logam natrium tidak boleh digunakan","kerana bertindak balas terlalu cergas dan meletup","apabila bersentuhan dengan air","serta menghasilkan natrium hidroksida yang mengakis"],"distractors":["kerana natrium bersifat endotermik dan menyejukkan pek","kerana menghasilkan mendakan barium sulfat beracun"],"explanation":"Walaupun tindak balas 2Na(p) + 2H₂O(ce) -> 2NaOH(ak) + H₂(g) membebaskan haba eksotermik, ia terlalu ganas/meletup (gas H₂ mudah menyala) dan membentuk larutan alkali kuat NaOH yang mengakis jika pek bocor — membahayakan pengguna!"},{"type":"mcq","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Trem Berkuasa Hidrogen","voiceCaption":"Selesaikan cabaran akhir Ujian Pencapaian nombor dua mengenai trem berkuasa hidrogen, persamaan termokimia, tenaga daripada lima puluh gram hidrogen serta kewajarannya menggantikan bahan api fosil.","voiceScript":"[excited] Soalan penutup Unit Boss daripada Ujian Pencapaian nombor dua! Di China, trem berkuasa hidrogen SIFANG beroperasi dengan sel bahan api hidrogen membawa tiga ratus lapan puluh penumpang. Apabila satu mol hidrogen dibakar, dua ratus lapan puluh dua kilojul haba dibebaskan. Jika lima puluh gram cecair hidrogen dibakar dalam oksigen berlebihan, berapakah bilangan mol hidrogen, jumlah tenaga terbebas serta persamaan termokimianya?","stimulusHtml":"<div class='stimulus-note'><strong>Ujian Pencapaian (No. 2 — Trem Berkuasa Hidrogen):</strong> Pembakaran 1 mol H₂ membebaskan <strong>282 kJ</strong> haba.<br>Diberi <strong>50 g</strong> cecair hidrogen dibakar lengkap dalam O₂ berlebihan. [Jisim atom relatif: H = 1; Jisim molar H₂ = 2 g mol⁻¹]</div>","prompt":"Manakah himpunan jawapan skema PALING lengkap bagi persamaan termokimia, bilangan mol, tenaga daripada 50 g H₂ dan kewajaran bahan api fosil?","options":["H₂(g) + ½O₂(g) -> H₂O(ce) ΔH = −282 kJ mol⁻¹; n = 50 ÷ 2 = 25 mol; Q = 25 × 282 = 7,050 kJ; hidrogen mesra alam (hanya hasilkan air, sifar gas rumah hijau) namun kos pengeluaran dan storan tekanan tinggi kekal mahal","2H₂(g) + O₂(g) -> 2H₂O(ce) ΔH = +282 kJ mol⁻¹; n = 50 mol; Q = 14,100 kJ; membebaskan gas CO₂ yang tinggi","H₂(g) + ½O₂(g) -> H₂O(ce) ΔH = −282 kJ mol⁻¹; n = 50 ÷ 1 = 50 mol; Q = 14,100 kJ; tidak sesuai kerana nilai bahan api hidrogen paling rendah","H₂(g) + O₂(g) -> H₂O₂(ce) ΔH = −282 kJ mol⁻¹; n = 25 mol; Q = 2,820 kJ; menyebabkan pembebasan jelaga hitam"],"correctIndex":0,"explanation":"Tahniah — skor cemerlang! (a) Eksotermik (membebas 282 kJ); H₂(g) + ½O₂(g) -> H₂O(ce) ΔH = -282 kJ mol⁻¹ (atau 2H₂ + O₂ -> 2H₂O ΔH = -564 kJ). (b) Jisim molar H₂ = 2 g mol⁻¹, maka n = 50/2 = 25 mol dan jumlah tenaga = 25 × 282 = 7,050 kJ. (c) Wajar menggantikan bahan api fosil kerana sifar CO₂/jelaga dan nilai bahan api tertinggi (143 kJ g⁻¹), walaupun cabaran kos & penyimpanan gas mudah terbakar perlu diatasi. Kamu kini menguasai 100% Kimia Tingkatan 5 Bab 3 Termokimia!"}]}]};</script>

    function getCurrentCase() {
      var group = CASES[tab] || CASES.pemendakan;
      if (!subKey || !group[subKey]) {
        subKey = Object.keys(group)[0];
      }
      return group[subKey];
    }

    function computeCalc() {
      var cur = getCurrentCase();
      var vTotal = cur.volA + cur.volB;
      var m = vTotal; // ketumpatan = 1 g cm^-3
      var factor = (tab === "peneutralan" && diproticMode && subKey === "kk") ? 2 : 1;
      var n = ((concM * cur.volA) / 1000) * factor;
      var qKj = Math.abs(cur.dhTheory) * n;
      var qJ = qKj * 1000;
      var theta = qJ / (m * 4.2);
      return {
        cur: cur,
        vTotal: vTotal,
        m: m,
        n: n,
        qKj: qKj,
        qJ: qJ,
        theta: theta,
        tStart: 28.0,
        tEnd: cur.isEndo ? (28.0 - theta) : (28.0 + theta),
        dh: cur.dhTheory
      };
    }

    function drawCanvas() {
      var canvas = shell.querySelector("#kim53CalCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var calc = computeCalc();
      var cur = calc.cur;
      var w = canvas.width;
      var h = canvas.height;

      c2d.fillStyle = "#020617";
      c2d.fillRect(0, 0, w, h);

      var accent = cur.isEndo ? "#38bdf8" : "#f97316";
      c2d.strokeStyle = accent;
      c2d.lineWidth = 2;
      c2d.strokeRect(8, 8, w - 16, h - 16);

      c2d.font = "800 11px Plus Jakarta Sans, sans-serif";
      c2d.textAlign = "center";
      c2d.fillStyle = "#f8fafc";
      c2d.fillText("KALORIMETER CAWAN POLISTIRENA • " + cur.title.toUpperCase(), w / 2, 27, w - 28);

      // Left: Polystyrene cup cutaway
      var cx = 135;
      c2d.fillStyle = "#e2e8f0";
      c2d.beginPath();
      c2d.moveTo(cx - 58, 76);
      c2d.lineTo(cx + 58, 76);
      c2d.lineTo(cx + 42, 188);
      c2d.lineTo(cx - 42, 188);
      c2d.closePath();
      c2d.fill();

      // Solution
      c2d.fillStyle = cur.solColor;
      c2d.beginPath();
      c2d.moveTo(cx - 47, 108);
      c2d.lineTo(cx + 47, 108);
      c2d.lineTo(cx + 38, 180);
      c2d.lineTo(cx - 38, 180);
      c2d.closePath();
      c2d.fill();

      // Lid
      c2d.fillStyle = "#94a3b8";
      c2d.fillRect(cx - 64, 68, 128, 10);

      // Animated stirring thermometer
      var stirX = paused ? 0 : Math.sin(simClock * 3.1) * 5;
      c2d.fillStyle = "#ffffff";
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 1.6;
      c2d.fillRect(cx - 5 + stirX, 38, 10, 118);
      c2d.strokeRect(cx - 5 + stirX, 38, 10, 118);

      var fillNorm = Math.max(0.2, Math.min(0.95, (calc.tEnd - 15) / 35));
      var barH = 22 + fillNorm * 82;
      c2d.fillStyle = cur.isEndo ? "#0284c7" : "#ef4444";
      c2d.fillRect(cx - 2.5 + stirX, 152 - barH, 5, barH);
      c2d.beginPath();
      c2d.arc(cx + stirX, 155, 7, 0, Math.PI * 2);
      c2d.fill();

      // Animated precipitate/particles at bottom
      if (tab !== "peneutralan") {
        c2d.fillStyle = cur.pptColor;
        for (var i = 0; i < 8; i++) {
          var px = cx - 26 + i * 7.5 + Math.sin(simClock * 2 + i) * 1.5;
          var py = 172 + (i % 2) * 4;
          c2d.beginPath();
          c2d.arc(px, py, 3.2, 0, Math.PI * 2);
          c2d.fill();
        }
      }

      // Right: Live telemetry bars
      var rx = 248;
      var rw = 286;
      c2d.fillStyle = "#0f172a";
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 1.5;
      c2d.fillRect(rx, 44, rw, 150);
      c2d.strokeRect(rx, 44, rw, 150);

      c2d.textAlign = "left";
      c2d.font = "700 10px JetBrains Mono, monospace";
      c2d.fillStyle = "#93c5fd";
      c2d.fillText("1. n = " + calc.n.toFixed(4) + " mol", rx + 14, 68);
      c2d.fillStyle = "#cbd5e1";
      c2d.fillText("2. m = " + calc.m + " g | theta = " + calc.theta.toFixed(2) + " C", rx + 14, 92);
      c2d.fillStyle = "#fde68a";
      c2d.fillText("3. Q = " + Math.round(calc.qJ) + " J (" + calc.qKj.toFixed(3) + " kJ)", rx + 14, 116);
      c2d.fillStyle = cur.isEndo ? "#38bdf8" : "#6ee7b7";

      c2d.fillStyle = cur.isEndo ? "#7dd3fc" : "#fdba74";

    }

    function loop(ts) {
      if (!document.body.contains(shell)) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        return;
      }
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      if (!paused && !isDocHidden) {
        simClock += dt;
        drawCanvas();
      }
      rafId = requestAnimationFrame(loop);
    }

      var tabsHtml =

        "</div>";

      var subBtns = Object.keys(group).map(function (k) {
        return '<button type="button" class="lab-seg-btn" data-cal-sub="' + k + '" aria-pressed="' + (k === subKey) + '">' + esc(group[k].title) + "</button>";
