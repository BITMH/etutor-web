/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;

  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}

  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab01","subject":"Matematik","form":4,"chapterNumber":1,"title":"Fungsi & Persamaan Kuadratik dalam Satu Pemboleh Ubah","subtitle":"Bentuk am ax^2 + bx + c, kesan pekali parabola, paksi simetri, pemfaktoran, punca graf dan penyelesaian masalah KBAT SPM.","estimatedMinutes":22,"themeAccent":"#2563eb","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Multimedia & Suara AI","enableMultimediaEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/mat-u2.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep kuadratik kamu memang mantap!","combo":"[laughs warmly] Kombo yang hebat! Otak matematik kamu sedang menyala!","encourage":"[softly] Hampir tepat... cuba semak semula nilai pekali a, b dan c dengan teliti ya.","celebrate":"[excited] Tahniah! Satu lagi unit Matematik berjaya ditawan sepenuhnya!"},"units":[{"id":"mat-u1","title":"Unit 1: Bentuk Am & Ungkapan Kuadratik","subtitle":"Subtopik 1.1 — Kuasa Tertinggi 2, Nilai a, b, c & Hubungan Banyak kepada Satu","iconType":"formula","iconUrl":"../assets/icons/mat-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c1","voiceToneLabel":"2 Syarat Wajib Ungkapan Kuadratik","voiceCaption":"Ungkapan kuadratik mesti mempunyai hanya satu pemboleh ubah dan kuasa tertinggi tepat dua.","voiceScript":"[warm] Selamat datang ke Matematik Bab Satu! Sebelum melakar graf, uji dahulu bentuk am a x kuasa dua tambah b x tambah c dengan mesin pengimbas: mesti satu pemboleh ubah sahaja dan kuasa tertingginya tepat dua!","title":"1.1 Dua Syarat Wajib Ungkapan Kuadratik","acronym":"1PU • K=2","mediaKey":"al_khawarizmi","summary":"Al-Khawarizmi merintis kaedah algebra tersusun yang hari ini dikenali melalui bentuk am kuadratik ax² + bx + c.","bullets":["2 Syarat Mutlak: (1) Hanya SATU jenis pemboleh ubah (cth. x sahaja atau m sahaja), dan (2) Kuasa tertinggi tepat 2 (bukan x³, x^(1/2) atau 3/x² = 3x⁻²).","Pekali a, b, c: a = pekali x² (a ≠ 0), b = pekali x, dan c = pemalar. Bagi ungkapan (1/2)m², nilai b = 0 dan c = 0."],"labId":"mat_quad_identifier","labTitle":"Mesin Pengimbas Kuadratik & Radar a, b, c","formula":"Bentuk Am: ax² + bx + c   (a, b, c pemalar; a ≠ 0)","examTip":"Pecahan x di penyebut seperti 3/x² bermaksud kuasa negatif (-2), jadi ia BUKAN ungkapan kuadratik.","hook":"Dua syarat maut SPM: kuasa tertinggi pemboleh ubah MESTI 2 tepat (bukan punca kuasa, bukan penyebut x), dan a != 0!"},{"type":"sort","voiceIdKey":"u1-s2","voiceToneLabel":"Isih Ungkapan Kuadratik","voiceCaption":"Asingkan mana satu ungkapan kuadratik sah dan mana satu yang gagal syarat kuadratik.","voiceScript":"[curious] Sekarang, mari uji mata tajam kamu! Asingkan setiap ungkapan berikut sama ada ia ungkapan kuadratik dalam satu pemboleh ubah yang sah, ataupun bukan kuadratik kerana melanggar syarat kuasa atau bilangan huruf.","prompt":"Isih setiap ungkapan ke dalam kategori yang tepat mengikut syarat kuadratik dalam satu pemboleh ubah.","buckets":[{"id":"sah","label":"Kuadratik Satu Pemboleh Ubah (Sah)"},{"id":"bukan","label":"Bukan Kuadratik / Lebih Pemboleh Ubah"}],"items":[{"text":"(1/2)m²","bucketId":"sah","note":"Sah! Satu pemboleh ubah m, kuasa tertinggi 2, a = 1/2."},{"text":"n(n - 2)","bucketId":"sah","note":"Sah! Apabila dikembangkan menjadi n² - 2n (a = 1, b = -2, c = 0)."},{"text":"2x² - 3/x²","bucketId":"bukan","note":"Bukan! 3/x² = 3x⁻², mempunyai kuasa negatif (-2) bukan nombor bulat."},{"text":"3x² + 2y + 1","bucketId":"bukan","note":"Bukan! Mempunyai dua pemboleh ubah berbeza iaitu x dan y."},{"text":"4x² - x^(1/2)","bucketId":"bukan","note":"Bukan! Terdapat kuasa pecahan (1/2) yang bukan nombor bulat."},{"text":"1 - x - 2x²","bucketId":"sah","note":"Sah! Dalam bentuk am ialah -2x² - x + 1."}],"explanation":"Ungkapan kuadratik mesti hanya ada satu pemboleh ubah, kuasa tertinggi 2, dan semua kuasa pemboleh ubah adalah nombor bulat (0, 1, atau 2 sahaja).","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c2","voiceToneLabel":"Fungsi vs Ungkapan & Parabola Sebenar","voiceCaption":"Fungsi kuadratik mempunyai tanda sama dengan f(x), dan lengkung parabolanya dilihat pada jambatan serta balingan sukan.","voiceScript":"[curious] Apakah beza ungkapan dengan fungsi kuadratik? Fungsi mempunyai f x sama dengan a x kuasa dua tambah b x tambah c! Bentuk graf parabolanya boleh dilihat nyata pada jambatan Pulau Warisan di Kuala Terengganu!","title":"Fungsi f(x) vs Ungkapan & Aplikasi Nyata Parabola","acronym":"f(x) = U","mediaKey":"pulau_warisan_bridge","summary":"Persamaan fungsi kuadratik menghasilkan lengkung simetri berbentuk U atau U terbalik dalam dunia sebenar.","bullets":["Ungkapan vs Fungsi: Ungkapan kuadratik (ax² + bx + c) tiada tanda '='; Fungsi kuadratik ditulis sebagai f(x) = ax² + bx + c.","Aplikasi Nyata: Gerbang Jambatan Pulau Warisan (Kuala Terengganu) dan trajektori sukan lontar peluru, lempar cakera serta rejam lembing."],"formula":"f(x) = ax² + bx + c   |   ax² + bx + c = 0 (Persamaan)","examTip":"Beza 3 istilah SPM: Ungkapan (tiada '='), Fungsi (f(x) = ...), Persamaan (... = 0).","hook":"Dari jambatan lengkung Terengganu ke tembakan roket — setiap lintasan graviti mengikut persamaan kuadratik ax^2 + bx + c!"},{"type":"match","voiceIdKey":"u1-s4","voiceToneLabel":"Padan Pekali a, b dan c","voiceCaption":"Padankan fungsi kuadratik dengan nilai pekali (a, b, c) yang betul.","voiceScript":"[curious] Cuba padankan setiap ungkapan kuadratik berikut dengan nilai a, b dan c yang betul. Awas dengan tanda negatif dan sebutan yang hilang ya!","prompt":"Padankan ungkapan kuadratik di sebelah kiri dengan pasangan nilai (a, b, c) yang tepat.","pairs":[{"id":"p1","left":"2x² - 3x + 1","right":"a = 2, b = -3, c = 1"},{"id":"p2","left":"-x² + x","right":"a = -1, b = 1, c = 0"},{"id":"p3","left":"2r(r - 3)","right":"a = 2, b = -6, c = 0"},{"id":"p4","left":"-(1/2)p² + 4p - 5","right":"a = -1/2, b = 4, c = -5"}],"explanation":"Sentiasa kembangkan ungkapan seperti 2r(r - 3) = 2r² - 6r dahulu sebelum membaca nilai a, b, dan c.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c3","voiceToneLabel":"Ujian Garis Mengufuk: Banyak kepada Satu","voiceCaption":"Ujian garis mengufuk memotong parabola pada dua titik berlainan yang berkongsi nilai y sama, membuktikan hubungan banyak kepada satu.","voiceScript":"[confident] Mengapakah semua fungsi kuadratik dikelaskan sebagai hubungan banyak kepada satu? Jalankan Ujian Garis Mengufuk pada makmal laser di bawah dan lihat dua nilai x menghasilkan satu nilai y yang sama!","title":"Ujian Garis Mengufuk: Hubungan Banyak kepada Satu","acronym":"2x -> 1y","summary":"Dua objek x berbeza di kiri dan kanan paksi simetri memetakan diri kepada satu imej y yang sama.","bullets":["Ujian Garis Mengufuk: Garis mendatar y = k memotong parabola pada 2 titik berbeza, cth: (4, 4) dan (-1, 4) bagi f(x) = x² - 3x.","Kesimpulan Jenis Hubungan: Kerana dua nilai x menghasilkan satu nilai y sama, setiap fungsi kuadratik ialah hubungan BANYAK KEPADA SATU."],"labId":"mat_al_khawarizmi_gallery","labTitle":"Ujian Laser Garis Mengufuk & Al-Khawarizmi","examTip":"Fungsi linear ialah satu kepada satu; fungsi kuadratik ialah banyak kepada satu.","mediaKey":"gateway_arch_parabola","hook":"Lukis satu garis mendatar melintasi graf: jika memotong 2 titik, itulah hubungan Banyak kepada Satu!"},{"type":"predict","voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Hubungan Banyak ke Satu","voiceCaption":"Ramalkan sifat titik persilangan apabila garis y = 4 memotong graf f(x) = x² - 3x.","voiceScript":"[curious] Jika kamu melukis satu garis lurus yang selari dengan paksi x merentasi graf kuadratik f x sama dengan x kuasa dua tolak tiga x pada aras y sama dengan empat, apakah hubungan antara titik persilangan itu?","prompt":"Sebuah garis lurus selari dengan paksi-x (y = 4) melintasi graf f(x) = x² - 3x pada dua titik: A(-1, 4) dan B(4, 4). Apakah kesimpulan tepat daripada Rangsangan Minda 3 ini?","scenario":"Pemerhatian Graf Kuadratik: Dua input x yang berlainan memetakan kepada nilai f(x) yang sama.","options":["Fungsi kuadratik mempunyai hubungan satu kepada satu kerana setiap x unik.","Fungsi kuadratik mempunyai hubungan banyak kepada satu kerana dua objek (-1 dan 4) berkongsi imej y = 4.","Fungsi kuadratik mempunyai hubungan satu kepada banyak kerana garis memotong dua kali.","Fungsi kuadratik bukan suatu fungsi kerana melanggar ujian garis mengufuk."],"correctIndex":1,"explanation":"Bagi setiap objek x ada satu imej y, tetapi dua objek x (-1 dan 4) berkongsi imej yang sama (4). Ini membuktikan jenis hubungan fungsi kuadratik ialah hubungan banyak kepada satu.","xp":20}]},{"id":"mat-u2","title":"Unit 2: Kesan Pekali a, b, c & Paksi Simetri","subtitle":"Subtopik 1.1 — Lengkok Parabola, Titik Maksimum/Minimum & Paksi Simetri","iconType":"graph","iconUrl":"../assets/icons/mat-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c1","voiceToneLabel":"Kesan a > 0 Senyum vs a < 0 Masam","voiceCaption":"Tanda nilai a menentukan graf melengkung senyum atau masam, manakala saiz magnitud a mengawal kelebaran lengkok.","voiceScript":"[warm] Lihat jambatan gantung dan laluan bola keranjang! Jika nilai a positif, lengkungnya senyum mempunyai titik minimum. Jika nilai a negatif, lengkungnya masam mempunyai titik maksimum. Lagi kecil nilai a, lagi lebar graf!","title":"Kesan Pekali a: Bentuk Senyum/Masam & Kelebaran |a|","acronym":"+U  -∩  |a|","mediaKeys":["mat_suspension_cable","mat_basketball_arc"],"summary":"Pekali a ialah pengemudi utama bentuk dan bukaan lengkung sesuatu graf kuadratik.","bullets":["Bentuk Lengkung: a > 0 berbentuk U (senyum, titik minimum); a < 0 berbentuk ∩ (masam, titik maksimum).","Kelebaran Lengkok: Semakin kecil magnitud |a|, semakin LEBAR lengkok graf (cth: y = 0.5x² lebih lebar berbanding y = 3x²)."],"formula":"a > 0 -> Titik Minimum (U)   |   a < 0 -> Titik Maksimum (∩)","examTip":"Kecilkan nilai |a| untuk melebarkan graf; bezakan magnitud |p| < 3 bagi Contoh 3 buku teks!","hook":"Nilai 'a' ialah emoji graf kuadratik: a > 0 senyum terbuka ke atas (titik minimum), a < 0 masam terbuka ke bawah (titik maksimum)!"},{"type":"predict","voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kedudukan Paksi Simetri","voiceCaption":"Ramalkan di sebelah mana paksi simetri berada apabila a negatif dan b positif.","voiceScript":"[curious] Cuba ramalkan dahulu sebelum menguji pada graf: jika graf mempunyai nilai a negatif dan nilai b positif, misalnya negatif x kuasa dua tambah dua x tambah tiga, di sebelah manakah paksi simetrinya berada relatif kepada paksi y?","prompt":"Diberi fungsi kuadratik f(x) = -x² + 2x + 3 (iaitu a = -1 < 0 dan b = +2 > 0). Di manakah kedudukan paksi simetrinya berbanding paksi-y?","scenario":"Rangsangan Minda 8: Menguji kesan tanda a dan b terhadap kedudukan x = -b/(2a).","options":["Di sebelah kiri paksi-y (kerana b positif).","Di sebelah kanan paksi-y (kerana x = -2 / (2 × -1) = +1).","Tepat di atas paksi-y (x = 0).","Selari dengan paksi-x pada y = 3."],"correctIndex":1,"proofLabId":"mat_parabola_lab","proofState":{"a":-1,"b":2,"c":3},"explanation":"Apabila a < 0 dan b > 0, rumus paksi simetri memberi x = -(+2)/(2(-1)) = +1 > 0, maka paksi simetri berada di sebelah KANAN paksi-y!","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c2","voiceToneLabel":"Paksi Simetri x = -b / 2a","voiceCaption":"Rumus paksi simetri membahagi graf kepada dua bahagian seiras, dan tandanya bergantung kepada gabungan a serta b.","voiceScript":"[curious] Paksi simetri membahagi graf kuadratik tepat di tengah titik pegun! Gunakan rumus x sama dengan negatif b per dua a, dan mainkan penukar parabola di bawah untuk melihat kedudukan paksi simetri!","title":"Paksi Simetri x = -b / (2a) & Kedudukan Kiri/Kanan","acronym":"x = -b/2a","summary":"Gabungan tanda a dan b menentukan sama ada puncak graf terletak di kiri, kanan, atau tepat pada paksi-y.","bullets":["Kes a > 0 (Senyum): b > 0 -> simetri di KIRI paksi-y | b < 0 -> di KANAN paksi-y | b = 0 -> tepat pada paksi-y.","Kes a < 0 (Masam): Terbalik! b > 0 -> simetri di KANAN paksi-y | b < 0 -> di KIRI paksi-y | b = 0 -> pada paksi-y."],"labId":"mat_parabola_lab","labTitle":"Simulator Lengkung a, b, c & Misi Bola","labProps":{"a":1,"b":-4,"c":3},"formula":"Paksi Simetri: x = -b / (2a)","examTip":"Tidak perlu hafal jadual kiri/kanan: masukkan sahaja nombor terus ke dalam rumus x = -b/(2a)!","mediaKey":"gateway_arch_parabola","hook":"Garisan cermin x = -b/(2a) membelah parabola tepat dua bahagian seiras! Semak tanda a dan b untuk teka sisi kiri/kanan!"},{"type":"wordbank","voiceIdKey":"u2-s4","voiceToneLabel":"Susun Langkah Kira Titik Pegun","voiceCaption":"Susun urutan tepat menentukan koordinat titik minimum bagi f(x) = x² - 6x + 5.","voiceScript":"[confident] Susun blok langkah demi langkah berikut untuk mencari koordinat titik minimum fungsi f x sama dengan x kuasa dua tolak enam x tambah lima.","prompt":"Susun urutan langkah yang betul untuk mencari koordinat titik minimum fungsi f(x) = x² - 6x + 5:","hint":"Gunakan rumus paksi simetri x = -b/(2a) dahulu sebelum menggantikannya untuk nilai y.","answerTokens":["Kenal pasti a = 1, b = -6","Kira paksi simetri x = -(-6)/(2 × 1) = 3","Ganti x = 3: f(3) = 3² - 6(3) + 5 = -4","Titik minimum ialah (3, -4)"],"distractors":["Titik maksimum ialah (3, 4)","Paksi simetri x = -3"],"explanation":"Paksi simetri x = -(-6)/2 = 3; masukkan x = 3 ke dalam f(x): 9 - 18 + 5 = -4. Kerana a = 1 > 0, (3, -4) ialah titik minimum.","xp":20,"mediaKey":"mat_basketball_arc"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c3","voiceToneLabel":"Pintasan-y (0, c) & Mencari Pemalar","voiceCaption":"Nilai c menentukan ketinggian pintasan-y, dan menggantikan mana-mana koordinat titik membolehkan pemalar dicari.","voiceScript":"[confident] Pemalar c menentukan kedudukan graf memotong paksi y pada koordinat kosong c! Jika soalan memberi satu titik contoh seperti A negatif satu tiga, gantikan sahaja ke dalam fungsi untuk mencari nilai c!","title":"Peranan c: Pintasan-y (0, c) & Mengganti Koordinat Titik","acronym":"Y-INT = c","mediaKey":"parabola_fountain","summary":"Mengubah pemalar c menaikkan atau menurunkan keseluruhan graf secara menegak tanpa mengubah bentuk lengkung.","bullets":["Pintasan-y (0, c): Nilai c ialah tempat graf memotong paksi-y apabila x = 0.","Mencari Pemalar (Contoh 2b): Diberi A(-1, 3) pada f(x) = x² - 3x + c -> gantikan 3 = (-1)² - 3(-1) + c -> 3 = 4 + c -> c = -1."],"labId":"mat_abc_effects_lab","labTitle":"Pertarungan Dual-Lengkung & Misi Lif c","formula":"Ganti titik (x, y) ke y = ax² + bx + c -> Cari pemalar c","examTip":"Sentiasa periksa kurungan bila mengganti nombor negatif: (-1)² = +1, bukan -1!","hook":"Pemalar 'c' menaik-turunkan graf seperti lif menegak tanpa mengubah bentuk kelebaran lengkung langsung!"},{"type":"mcq","voiceIdKey":"u2-s5","voiceToneLabel":"Semak Contoh 3 Kelebaran Graf","voiceCaption":"Tentukan julat nilai p apabila graf px² lebih lebar daripada graf 3x².","voiceScript":"[curious] Soalan Kertas Satu kegemaran peperiksaan! Kedua-dua graf terbuka ke atas berbentuk U, tetapi graf p x kuasa dua mempunyai bukaan lebih lebar daripada tiga x kuasa dua. Apakah julat tepat bagi nilai p?","prompt":"Dua graf fungsi kuadratik f(x) = 3x² + 1 dan g(x) = px² + 1 dilukis pada paksi yang sama. Kedua-duanya berbentuk U (terbuka ke atas), tetapi bukaan g(x) lebih LEBAR daripada f(x). Apakah julat nilai p?","options":["p > 3","0 < p < 3","-3 < p < 0","p < 0"],"correctIndex":1,"explanation":"Graf berbentuk U bermakna p > 0. Bukaan lebih lebar bermakna nilai magnitud p lebih kecil daripada 3, maka 0 < p < 3.","xp":20}]},{"id":"mat-u3","title":"Unit 3: Membentuk Persamaan, Pemfaktoran & Punca","subtitle":"Subtopik 1.1 — Bentuk Am ax² + bx + c = 0, Kaedah Pemfaktoran & Punca Graf","iconType":"scale","iconUrl":"../assets/icons/mat-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c1","voiceToneLabel":"Membentuk Persamaan & Pemfaktoran Silang","voiceCaption":"Susun dahulu ungkapan kepada bentuk am ax² + bx + c = 0 sebelum memecahkan faktor menggunakan model luas segi empat.","voiceScript":"[warm] Lihat model luas halaman segi empat! Untuk mencari nilai x, kembangkan dahulu persamaan kepada bentuk am sama dengan kosong sebelum melakukan pemfaktoran silang!","title":"Membentuk Persamaan Am & Pemfaktoran Silang","acronym":"K•B•F","mediaKey":"mat_garden_area_grid","summary":"Model jubin geometri menunjukkan bagaimana dua kurungan linear (px + q)(rx + s) membentuk jumlah luas kuadratik.","bullets":["Contoh 4 (Luas Kad): L = x² + x(2x + 1) = 114 -> kembangkan menjadi bentuk am 3x² + x - 114 = 0 sebelum memfaktor.","Kaedah Pemfaktoran: Cari pasangan faktor pendaraban silang untuk ax² dan c yang menghasilkan sebutan tengah bx."],"labId":"mat_roots_factor_lab","labTitle":"Jigsaw Luas & Neraca Keseimbangan Punca","labProps":{"caseKey":"c7a"},"formula":"Bentuk Am Wajib: ax² + bx + c = 0","examTip":"Pastikan ruas kanan sentiasa disamakan dengan SIFAR (0) sebelum memfaktor!","hook":"Menukar bentuk persamaan kepada am ax^2 + bx + c = 0 sebelum memfaktor memastikan tanda positif/negatif tidak tersasar."},{"type":"match","voiceIdKey":"u3-s3","voiceToneLabel":"Padan Persamaan dan Puncanya","voiceCaption":"Padankan persamaan kuadratik daripada Contoh 5 & Praktis Kendiri 1.1f dengan pasangan puncanya.","voiceScript":"[warm] Cuba padankan setiap persamaan kuadratik sebelah kiri dengan nilai punca yang memuaskan persamaan tersebut di sebelah kanan.","prompt":"Padankan setiap persamaan kuadratik berikut dengan punca-puncanya yang tepat.","pairs":[{"id":"r1","left":"x² - 5x + 6 = 0","right":"x = 2 dan x = 3"},{"id":"r2","left":"2x² + 5x - 12 = 0","right":"x = -4 dan x = 1.5"},{"id":"r3","left":"-x² + 3x + 4 = 0","right":"x = -1 dan x = 4"},{"id":"r4","left":"4x² - 1 = 0","right":"x = -1/2 dan x = 1/2"}],"explanation":"Perhatikan 4x² - 1 = (2x - 1)(2x + 1) = 0 menghasilkan x = 1/2 dan x = -1/2. Bagi -x² + 3x + 4 = 0, faktorkan -(x - 4)(x + 1) = 0.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c2","voiceToneLabel":"Darab Silang Pecahan & Semakan Punca","voiceCaption":"Persamaan pecahan diselesaikan dengan darab silang menjadi bentuk am, dan setiap nilai punca boleh disemak semula dengan penggantian.","voiceScript":"[curious] Terjumpa pecahan algebra dalam persamaan kuadratik? Mudah sahaja! Darab silang pembilang dan penyebut hingga menjadi bentuk am kuadratik, kemudian faktorkan untuk memperoleh dua punca!","title":"Pecahan Algebra (Darab Silang) & Menguji Nilai Punca","acronym":"DS -> =0","summary":"Menguji punca bermaksud menggantikan nilai x ke ruas kiri untuk mengesahkan sama ada hasilnya menepati ruas kanan.","bullets":["Contoh 7 (Pecahan): x/2 = (5x - 24)/(x - 4) -> darab silang -> x(x - 4) = 2(5x - 24) -> x² - 14x + 48 = 0 -> (x - 8)(x - 6) = 0 -> x = 8, 6.","Menguji Punca (Contoh 6): Gantikan x = k ke ruas kiri ax² + bx + c; jika nilainya = 0, maka k ialah punca persamaan!"],"formula":"Jika x = k ialah punca, maka ak² + bk + c = 0","examTip":"Jangan lupa darabkan SEMUA sebutan dengan penyebut (cth. darab 2 untuk x² + (7/2)x = 2 -> 2x² + 7x - 4 = 0).","mediaKey":"mat_cross_multiply","hook":"Jangan takut pecahan algebra — darab silang penyebut terus menukarkannya kepada persamaan kuadratik kemas!"},{"type":"wordbank","voiceIdKey":"u3-s4","voiceToneLabel":"Bina Langkah Pecahan ke Bentuk Am","voiceCaption":"Susun langkah menyelesaikan persamaan pecahan (x/2) = (5x - 24)/(x - 4).","voiceScript":"[confident] Susun urutan penyelesaian bagi Contoh Tujuh c, bermula daripada darab silang sehinggalah mendapat nilai x sama dengan lapan atau enam.","prompt":"Susun langkah yang betul untuk menyelesaikan persamaan x/2 = (5x - 24)/(x - 4):","hint":"Darab silang -> kembang -> himpun semua ke kiri (= 0) -> faktor.","answerTokens":["x(x - 4) = 2(5x - 24)","x² - 4x = 10x - 48","x² - 14x + 48 = 0","(x - 8)(x - 6) = 0; x = 8 atau 6"],"distractors":["x² + 14x - 48 = 0","(x + 8)(x + 6) = 0; x = -8 atau -6"],"explanation":"Darab silang memberi x² - 4x = 10x - 48. Bawa ke sebelah kiri: x² - 14x + 48 = 0, lalu difaktorkan sebagai (x - 8)(x - 6) = 0.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c3","voiceToneLabel":"Punca Persamaan = Pintasan-x Graf","voiceCaption":"Punca-punca bagi persamaan kuadratik adalah sama tepat dengan titik persilangan graf fungsi dengan paksi-x.","voiceScript":"[confident] Tahukah kamu apa maksud punca secara visual? Punca persamaan ax kuasa dua tambah b x tambah c sama dengan kosong ialah koordinat pintasan x apabila graf memotong paksi mengufuk!","title":"Kaitan Punca Persamaan dengan Pintasan-x Graf","acronym":"Punca = x-int","summary":"Pada setiap pintasan-x, nilai y = f(x) bernilai sifar, menghubungkan pengiraan algebra terus kepada lakaran graf.","bullets":["Rangsangan Minda 11 & 12: Punca bagi ax² + bx + c = 0 ialah titik persilangan graf y = ax² + bx + c dengan paksi-x (apabila y = 0).","Bilangan Punca: Graf memotong paksi-x pada 2 tempat -> 2 punca berbeza; menyentuh 1 titik -> 1 punca sama; tidak menyentuh -> tiada punca nyata."],"labId":"mat_roots_factor_lab","labTitle":"Neraca Punca & Pecahan Contoh 7b","labProps":{"caseKey":"c7b"},"formula":"Pada Pintasan-x: y = 0  =>  ax² + bx + c = 0","examTip":"Jika soalan meminta pintasan-x daripada graf, terus baca koordinat di paksi mengufuk!","mediaKey":"sydney_harbour_arch","hook":"Tempat gerbang parabola menyentuh garis tanah y = 0 itulah punca persamaan kuadratik!"},{"type":"predict","voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Punca Daripada Pemfaktoran","voiceCaption":"Ubah persamaan pecahan kuadratik ke bentuk am dan ramalkan puncanya.","voiceScript":"[curious] Dalam Contoh Tujuh b, kita ada persamaan x kuasa dua tambah tujuh per dua x sama dengan dua. Sebelum memfaktor, darabkan semua sebutan dengan dua supaya tiada pecahan. Apakah dua punca yang terhasil?","prompt":"Persamaan kuadratik x² + (7/2)x = 2 (Contoh 7b) hendak diselesaikan dengan pemfaktoran. Apakah sepasang faktor dan puncanya yang betul?","scenario":"Langkah awal: Darab kedua-dua belah dengan 2 untuk menghapuskan pecahan -> 2x² + 7x - 4 = 0.","options":["(2x + 1)(x - 4) = 0 -> x = -1/2 atau x = 4","(2x - 1)(x + 4) = 0 -> x = 1/2 atau x = -4","(2x - 4)(x + 1) = 0 -> x = 2 atau x = -1","(x + 7)(x - 2) = 0 -> x = -7 atau x = 2"],"correctIndex":1,"proofLabId":"mat_roots_factor_lab","proofState":{"caseKey":"c7b"},"explanation":"Kembangkan (2x - 1)(x + 4) = 2x² + 8x - x - 4 = 2x² + 7x - 4 = 0. Maka 2x - 1 = 0 memberi x = 1/2 dan x + 4 = 0 memberi x = -4.","xp":20},{"type":"mcq","voiceIdKey":"u3-s5","voiceToneLabel":"Uji Punca Persamaan Bukan Sifar","voiceCaption":"Semak sama ada nilai x yang diberi ialah punca persamaan 3x² - 7x + 5 = 3.","voiceScript":"[curious] Hati-hati! Dalam Contoh Enam b, ruas kanan persamaan ialah tiga, bukan sifar. Antara berikut, nilai x manakah merupakan punca bagi tiga x kuasa dua tolak tujuh x tambah lima sama dengan tiga?","prompt":"Antara berikut, nilai x yang manakah merupakan punca bagi persamaan 3x² - 7x + 5 = 3 (Contoh 6b)?","options":["x = 1 sahaja kerana memberi nilai 1","x = 1/3 kerana 3(1/3)² - 7(1/3) + 5 = 3","Kedua-dua x = 1 dan x = 1/3","Tiada satu pun kerana mesti sama dengan 0"],"correctIndex":1,"explanation":"Apabila x = 1/3: 3(1/9) - 7/3 + 5 = 1/3 - 7/3 + 5 = -2 + 5 = 3 (sama dengan ruas kanan). Apabila x = 1, nilainya ialah 1 ≠ 3.","xp":20}]},{"id":"mat-u4","title":"Unit 4: Melakar Graf & Penyelesaian Masalah KBAT","subtitle":"Subtopik 1.1 — Kes 1 vs Kes 2 Melakar Graf & Masalah Harian (Contoh 8–10)","iconType":"book","iconUrl":"../assets/icons/mat-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c1","voiceToneLabel":"3 Ciri Wajib Lakaran Graf & Kes 1","voiceCaption":"Setiap lakaran graf memerlukan bentuk U atau terbalik, pintasan-y, serta pintasan-x jika graf memotong atau menyentuh paksi mengufuk.","voiceScript":"[warm] Untuk melakar graf kuadratik dengan tepat, pastikan tiga ciri wajib ada: bentuk senyum atau masam daripada nilai a, pintasan y sama dengan c, dan pintasan x bagi Kes Satu!","title":"3 Ciri Wajib Lakaran Graf & Kes 1 (Bersilang Paksi-x)","acronym":"B•Y•X","summary":"Kes 1 merangkumi graf yang memotong paksi-x pada dua titik ataupun menyentuh tepat pada satu titik puncak.","bullets":["3 Ciri Wajib Lakaran: (1) Bentuk U (a > 0) atau terbalik (a < 0), (2) Pintasan-y = c, dan (3) Pintasan-x daripada pemfaktoran (Kes 1).","Sentuh Satu Titik (Contoh 8b): f(x) = x² - 6x + 9 = (x - 3)² menyentuh paksi-x di x = 3 sahaja (titik minimum berada tepat di paksi-x)."],"labId":"mat_sketch_problem_lab","labTitle":"Jejak Lakaran Graf Kes 1","labProps":{"mode":"kes1"},"formula":"Kes 1: Ada punca nyata -> Tandakan pintasan-x & pintasan-y","examTip":"Jangan lukis bucu tajam seperti V! Pastikan lengkung di puncak adalah bulat dan licin.","mediaKeys":["parabola_fountain","sydney_harbour_arch"],"hook":"Tiga benda wajib dalam lakaran graf Kertas 2: bentuk Senyum/Masam tepat, pintasan-y (0, c), dan punca pintasan-x!"},{"type":"sort","voiceIdKey":"u4-s2","voiceToneLabel":"Isih Kes Bersilang vs Tidak Bersilang","voiceCaption":"Kelaskan fungsi kuadratik berikut mengikut sama ada ia memotong paksi-x atau tidak.","voiceScript":"[curious] Bolehkah kamu bezakan graf Kes Satu yang menyentuh atau memotong paksi x daripada graf Kes Dua yang terapung sepenuhnya di atas atau di bawah paksi x?","prompt":"Kelaskan setiap fungsi kuadratik berikut sama ada grafnya bersilang/menyentuh paksi-x (Kes 1) atau tidak bersilang langsung dengan paksi-x (Kes 2).","buckets":[{"id":"kes1","label":"Kes 1: Ada Pintasan-x (1 atau 2 punca)"},{"id":"kes2","label":"Kes 2: Tiada Pintasan-x"}],"items":[{"text":"f(x) = x² - 4x + 3","bucketId":"kes1","note":"Bersilang pada x = 1 dan x = 3."},{"text":"f(x) = x² - 6x + 9","bucketId":"kes1","note":"Menyentuh paksi-x pada satu titik (3, 0)."},{"text":"f(x) = x² + 1","bucketId":"kes2","note":"Titik minimum (0, 1) di atas paksi-x dan terbuka ke atas (a > 0)."},{"text":"f(x) = -x² - 3","bucketId":"kes2","note":"Titik maksimum (0, -3) di bawah paksi-x dan terbuka ke bawah (a < 0)."},{"text":"f(x) = -2x² + 18","bucketId":"kes1","note":"Bersilang pada x = -3 dan x = 3."},{"text":"f(x) = 2x² + 5","bucketId":"kes2","note":"Titik minimum (0, 5) dan membuka ke atas, tidak turun ke paksi-x."}],"explanation":"Graf Kes 2 berlaku apabila titik minimum berada di atas paksi-x (a > 0, y_min > 0) atau titik maksimum berada di bawah paksi-x (a < 0, y_max < 0).","xp":20,"mediaKey":"mat_floating_parabola"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c2","voiceToneLabel":"Kes 2: Graf Tidak Bersilang Paksi-x","voiceCaption":"Apabila graf tiada punca nyata seperti x² + 1, ganti satu nilai x contoh untuk mendapatkan titik panduan simetri.","voiceScript":"[curious] Bagaimana jika graf seperti f x sama dengan x kuasa dua tambah satu tidak memotong paksi x? Dalam Kes Dua, tentukan titik puncak dahulu, kemudian ganti satu titik contoh seperti x sama dengan dua!","title":"Kes 2: Graf Terapung (Tidak Memotong Paksi-x)","acronym":"T•P + Titik","summary":"Graf Kes 2 berada seluruhnya di atas atau di bawah paksi-x, jadi sekurang-kurangnya satu titik rujukan tambahan diperlukan.","bullets":["Ciri Kes 2 (Contoh 9): f(x) = x² + 1 sentiasa positif (> 0), jadi graf berada seluruhnya di atas paksi-x dengan titik minimum (0, 1).","Titik Panduan Tambahan: Gantikan nilai mudah seperti x = 2 -> f(2) = 5 -> plot (2, 5) dan pasangan simetrinya (-2, 5) sebelum melakar lengkung."],"formula":"Kes 2: Tiada pintasan-x -> Plot (0, c) + 1 titik contoh","examTip":"Apabila b = 0 (contoh x² + 1), paksi-y ialah paksi simetri jadi titik minimum terus (0, c)!","mediaKey":"mat_floating_parabola","hook":"Jika nilai b^2 - 4ac negatif, parabola terapung bebas di udara atau tenggelam terus tanpa pernah menyentuh paksi-x!"},{"type":"match","voiceIdKey":"u4-s4","voiceToneLabel":"Padan Graf kepada Titik Pegun","voiceCaption":"Padankan empat fungsi lakaran graf dengan ciri titik atau pintasannya.","voiceScript":"[warm] Padankan setiap fungsi kuadratik berikut dengan ciri graf utamanya seperti yang ditunjukkan dalam Contoh Lapan dan Sembilan.","prompt":"Padankan setiap fungsi kuadratik di sebelah kiri dengan ciri lakaran grafnya yang tepat.","pairs":[{"id":"g1","left":"f(x) = x² + 1","right":"Titik minimum (0, 1), tiada pintasan-x"},{"id":"g2","left":"f(x) = -x² - 3","right":"Titik maksimum (0, -3), tiada pintasan-x"},{"text":"","id":"g3","left":"f(x) = x² - 6x + 9","right":"Menyentuh paksi-x pada satu titik (3, 0)"},{"id":"g4","left":"f(x) = -2x² + 18","right":"Paksi simetri pada paksi-y, pintasan-x di -3 dan 3"}],"explanation":"Graf berbentuk (x - h)² menyentuh paksi-x pada satu titik. Apabila b = 0, paksi simetri sentiasa ialah paksi-y.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c3","voiceToneLabel":"Penyelesaian Masalah Harian Kuboid & Ukuran","voiceCaption":"Dalam masalah ukuran sebenar seperti luas kuboid atau tanah, tolak punca negatif yang mustahil secara fizikal.","voiceScript":"[confident] Apabila menyelesaikan masalah harian seperti ukuran kuboid dalam Contoh Sepuluh, kita sering mendapat satu punca positif dan satu punca negatif. Sentiasa tolak punca negatif kerana ukuran panjang tidak boleh negatif!","title":"Penyelesaian Masalah KBAT: Kuboid & Penolakan Punca Negatif","acronym":"L -> +x","summary":"Ubah situasi geometri kepada persamaan am kuadratik, faktorkan, dan semak kesesuaian punca mengikut konteks.","bullets":["Contoh 10 (Kuboid Rod Besi): Jumlah luas = 2x² + 4x(x + 30) = 4 800 -> 6x² + 120x - 4 800 = 0 -> x = 20 cm (tolak x = -40 cm).","Semakan Bajet Akhir: Jumlah panjang rod = 8(20) + 4(50) = 360 cm = 3.6 m -> Kos = 3.6 × RM5 = RM18 (Melebihi bajet RM15!)."],"labId":"mat_sketch_problem_lab","labTitle":"Kuboid 3D Isometrik Contoh 10","labProps":{"mode":"box","xVal":20},"formula":"Kuboid tapak x×x, tinggi (x+30): Luas = 6x² + 120x","examTip":"Sentiasa tulis alasan ringkas 'x > 0 kerana panjang mesti positif' untuk mendapat markah penuh Kertas 2!","hook":"Dalam masalah luas atau isi padu KBAT, nilai x negatif MESTI ditolak kerana ukuran panjang fizik sentiasa positif!","mediaKey":"mat_garden_area_grid"},{"type":"predict","voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Keputusan Bajet Kuboid","voiceCaption":"Ramalkan panjang x tapak kuboid Contoh 10 dan adakah bajet RM15 mencukupi.","voiceScript":"[curious] Berdasarkan Contoh Sepuluh, Joseph mahu membina rangka kotak kuboid berjumlah luas permukaan empat ribu lapan ratus sentimeter persegi dengan kos rod lima ringgit semeter. Selepas mendapat x sama dengan dua puluh sentimeter, cukupkah bajet lima belas ringgitnya?","prompt":"Dalam Contoh 10, ukuran kuboid ialah x × x × (x + 30) cm dengan jumlah luas permukaan 4 800 cm², memberi x = 20 cm. Jika rangka memerlukan 8 sisi tapak (20 cm) dan 4 sisi tegak (50 cm) dengan kos rod RM5/meter, apakah kesimpulan bagi bajet RM15?","scenario":"Jumlah panjang rod kayu = (8 × 20 cm) + (4 × 50 cm) = 360 cm = 3.6 m.","options":["Bajet mencukupi kerana kos rod hanya RM12.00.","Bajet mencukupi dengan baki RM1.00 kerana panjang hanya 2.8 m.","Bajet TIDAK mencukupi kerana kos sebenar ialah 3.6 × RM5 = RM18.00.","Bajet tepat RM15.00 kerana hanya 3.0 m rod diperlukan."],"correctIndex":2,"proofLabId":"mat_sketch_problem_lab","proofState":{"mode":"box","xVal":20},"explanation":"Kotak bersaiz 20 × 20 × 50 cm mempunyai 8 tepi sepanjang 20 cm (160 cm) dan 4 tepi tegak 50 cm (200 cm). Jumlah = 360 cm = 3.6 m. Kos = RM5 × 3.6 = RM18 > RM15, jadi tidak cukup.","xp":20},{"type":"mcq","voiceIdKey":"u4-s5","voiceToneLabel":"Selesaikan Masalah Padang Segi Empat","voiceCaption":"Tentukan nilai x bagi tanah segi empat tepat (x + 20) m kali (x + 5) m seluas 250 m² (Praktis Kendiri 1.1d).","voiceScript":"[curious] Cuba selesaikan soalan Praktis Kendiri satu perpuluhan satu d nombor satu! Sebidang tanah segi empat tepat berukuran panjang x tambah dua puluh meter dan lebar x tambah lima meter mempunyai luas dua ratus lima puluh meter persegi. Hitung nilai x dan ukuran sebenar tanah itu!","prompt":"Sebidang tanah berbentuk segi empat tepat mempunyai panjang (x + 20) m dan lebar (x + 5) m dengan luas 250 m² (Praktis Kendiri 1.1d Q1). Hitung nilai x yang sah dan ukuran tanah tersebut.","options":["x = 4 m; panjang 24 m dan lebar 9 m","x = 5 m; panjang 25 m dan lebar 10 m","x = 6 m; panjang 26 m dan lebar 11 m","x = 10 m; panjang 30 m dan lebar 15 m"],"correctIndex":1,"explanation":"Luas L = (x + 20)(x + 5) = 250 -> x² + 25x + 100 = 250 -> x² + 25x - 150 = 0 -> (x - 5)(x + 30) = 0. Tolak nilai negatif x = -30, maka x = 5 m (panjang = 25 m, lebar = 10 m; semakan: 25 × 10 = 250 m²).","xp":20}]},{"id":"mat-u5","title":"Unit 5: Cabaran Boss SPM — Fungsi & Persamaan Kuadratik","subtitle":"5 Pusingan Sintesis Kertas 1 & Kertas 2 Berformat Peperiksaan Sebenar","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Hitung Nilai k & h","voiceCaption":"Gunakan maklumat titik maksimum A(3, 14) pada f(x) = kx² + 6x + h untuk mencari k dan h.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M Matematik Bab Satu! Untuk pusingan pertama daripada Soalan Tiga Praktis Kendiri satu perpuluhan satu c: diberi titik A tiga, empat belas ialah titik maksimum graf k x kuasa dua tambah enam x tambah h, dengan k ialah integer antara negatif dua hingga dua. Cari nilai k dan h!","prompt":"Graf f(x) = kx² + 6x + h mempunyai titik maksimum pada A(3, 14) dengan keadaan k ialah integer (-2 < k < 2). Hitung nilai k dan nilai h.","options":["k = 1 dan h = -13","k = -1 dan h = 5","k = -1 dan h = 14","k = 0 dan h = -4"],"correctIndex":1,"explanation":"Kerana graf mempunyai titik MAKSIMUM, k mesti < 0. Integer dalam -2 < k < 2 yang kurang daripada 0 ialah k = -1. Gantikan (3, 14) ke f(x) = -x² + 6x + h: 14 = -(3)² + 6(3) + h = -9 + 18 + h -> h = 5!","xp":25},{"type":"predict","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Pusingan 2: Bentuk Terfaktor Graf","voiceCaption":"Tentukan nilai a dan titik minimum P bagi f(x) = a(x - h)(x - k) apabila pintasan-x ialah -2 dan 4.","voiceScript":"[curious] Pusingan kedua! Suatu parabola f x sama dengan a darab x tolak h darab x tolak k memotong paksi x pada negatif dua dan empat, serta memotong paksi y pada negatif enam belas. Apakah persamaan paksi simetrinya?","prompt":"Suatu graf kuadratik f(x) = a(x - h)(x - k) dengan h < k mempunyai pintasan-x di (-2, 0) dan (4, 0), serta melalui titik (0, -16). Apakah persamaan paksi simetri dan koordinat titik minimum P?","scenario":"Pintasan-x simetri pada kiri dan kanan paksi simetri: titik tengah antara -2 dengan 4.","options":["Paksi simetri x = 1; P(1, -18)","Paksi simetri x = 2; P(2, -16)","Paksi simetri x = -1; P(-1, -18)","Paksi simetri x = 1; P(1, -16)"],"correctIndex":0,"proofLabId":"mat_parabola_lab","proofState":{"a":2,"b":-4,"c":-16},"explanation":"Paksi simetri = (-2 + 4)/2 = 1. Daripada (0, -16): -16 = a(0+2)(0-4) = -8a -> a = 2. Jadi f(1) = 2(1+2)(1-4) = 2(3)(-3) = -18. Titik minimum P(1, -18)!","xp":25},{"type":"mcq","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Pusingan 3: Punca & Paksi Simetri","voiceCaption":"Kira nilai p jika x = 2 ialah salah satu punca bagi x² + px - 18 = 0.","voiceScript":"[confident] Pusingan ketiga! Diberi salah satu punca bagi persamaan x kuasa dua tambah p x tolak lapan belas sama dengan sifar ialah dua. Hitung nilai p dan punca yang satu lagi!","prompt":"Diberi salah satu punca bagi persamaan kuadratik x² + px - 18 = 0 ialah 2 (Praktis Sumatif Q4). Hitung nilai p dan punca kedua persamaan tersebut.","options":["p = 7; punca kedua x = -9","p = -7; punca kedua x = 9","p = 9; punca kedua x = -2","p = -9; punca kedua x = 2"],"correctIndex":0,"explanation":"Gantikan x = 2: 2² + p(2) - 18 = 0 -> 2p = 14 -> p = 7. Persamaan penuh ialah x² + 7x - 18 = (x - 2)(x + 9) = 0, jadi punca kedua ialah x = -9.","xp":25},{"type":"wordbank","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Pusingan 4: Susun Penyelesaian Pecahan","voiceCaption":"Susun penyelesaian persamaan (h - 1)/3 = 1/(h + 1) dari Praktis Sumatif.","voiceScript":"[curious] Pusingan keempat! Susun blok langkah algebra bagi menyelesaikan pecahan h tolak satu per tiga sama dengan satu per h tambah satu.","prompt":"Susun urutan penyelesaian persamaan (h - 1)/3 = 1/(h + 1) (Praktis Sumatif 3j):","hint":"Gunakan identiti (h - 1)(h + 1) = h² - 1 selepas darab silang.","answerTokens":["(h - 1)(h + 1) = 3","h² - 1 = 3","h² - 4 = 0","(h - 2)(h + 2) = 0; h = 2 atau -2"],"distractors":["h² + 1 = 3","h = 1 atau h = -1"],"explanation":"(h - 1)(h + 1) = 3 menghasilkan h² - 1 = 3, iaitu h² - 4 = 0 -> (h - 2)(h + 2) = 0 -> h = 2 atau h = -2.","xp":25},{"type":"mcq","voiceIdKey":"u5-s5","voiceToneLabel":"Boss Akhir: Semak Had Laju Lebuh Raya","voiceCaption":"Gunakan persamaan jarak = laju × masa daripada soalan KBAT Encik Kamarul di m/s 28.","voiceScript":"[excited] Pusingan terakhir cabaran Boss! Encik Kamarul memandu dengan laju purata dua puluh t tolak dua puluh kilometer sejam selama t tolak tiga jam sejauh dua ratus dua puluh lima kilometer. Hitung laju puratanya dan tentukan adakah beliau mematuhi had laju seratus sepuluh!","prompt":"Encik Kamarul memandu dengan laju purata (20t - 20) km/j selama (t - 3) jam sejauh 225 km (Latihan m/s 28). Jika had laju lebuh raya ialah 110 km/j, tentukan nilai t dan adakah beliau mematuhi peraturan?","options":["t = 5 jam; laju = 80 km/j (Patuh)","t = 5.5 jam; laju = 90 km/j (Patuh)","t = 6 jam; laju = 100 km/j (Patuh)","t = 7.5 jam; laju = 130 km/j (Melanggar had laju)"],"correctIndex":1,"explanation":"(20t - 20)(t - 3) = 225 -> 20t² - 80t + 60 = 225 -> 4t² - 16t - 33 = 0 -> (2t - 11)(2t + 3) = 0 -> t = 5.5 jam (tolak -1.5). Laju = 20(5.5) - 20 = 90 km/j <= 110 km/j -> Patuh!","xp":30}]}]};</script>

  function makeGalleryPlate(key, m, isHigh) {
    if (!m || !m.dataUri) return "";
    var prio = isHigh ? ' fetchpriority="high"' : ' loading="lazy"';
    return '<button type="button" class="archival-plate-btn" data-media-key="' + key + '">' +
      '<img class="archival-plate-img" src="' + m.dataUri + '" width="' + m.width + '" height="' + m.height + '" alt="' + m.label + '"' + prio + '>' +
      '<div class="archival-plate-meta">' +
        '<span class="archival-era-badge">' + m.era + '</span>' +
        '<strong>' + m.label + '</strong>' +
      '</div></button>';
  }

      { expr: "x³ - 6", ok: false, a: "-", b: "-", c: "-", tiles: [{ t: "x³", r: "KUASA 3!", cl: "#dc2626" }, { t: "-6", r: "Pemalar", cl: "#64748b" }], trapIdx: 0, why: "PERANGKAP: Kuasa tertinggi ialah 3 (kubik), melanggar had kuasa tertinggi tepat 2." },
      { expr: "3x² + 2y + 1", ok: false, a: "-", b: "-", c: "-", tiles: [{ t: "3x²", r: "Huruf x", cl: "#2563eb" }, { t: "+2y", r: "HURUF KE-2 (y)!", cl: "#dc2626" }, { t: "+1", r: "Pemalar", cl: "#64748b" }], trapIdx: 1, why: "PERANGKAP: Mempunyai DUA pemboleh ubah berbeza (x dan y) — hanya SATU huruf dibenarkan!" },
      { expr: "2x² - 3/x²", ok: false, a: "-", b: "-", c: "-", tiles: [{ t: "2x²", r: "Kuasa 2", cl: "#2563eb" }, { t: "-3/x² = -3x⁻²", r: "KUASA NEGATIF!", cl: "#dc2626" }], trapIdx: 1, why: "PERANGKAP: Pemboleh ubah di penyebut (-3/x²) bermaksud kuasa negatif -2, bukan nombor bulat." },
      { expr: "4x² - x^(1/2)", ok: false, a: "-", b: "-", c: "-", tiles: [{ t: "4x²", r: "Kuasa 2", cl: "#2563eb" }, { t: "-x^(1/2)", r: "KUASA PECAHAN!", cl: "#dc2626" }], trapIdx: 1, why: "PERANGKAP: Terdapat kuasa pecahan 1/2 yang bukan nombor bulat (0, 1 atau 2)." }
    ];
    var radarQueue = [
      { expr: "n(n - 2)", ok: true, hint: "Kembang -> n² - 2n (1 huruf n, kuasa tertinggi 2)." },
      { expr: "4x² - x^(1/2)", ok: false, hint: "Ada kuasa pecahan (1/2)!" },
      { expr: "1 - x - 2x²", ok: true, hint: "Susun am -> -2x² - x + 1 (a=-2, b=-1, c=1)." },
