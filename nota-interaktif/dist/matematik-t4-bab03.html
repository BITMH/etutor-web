  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab03","subject":"Matematik","subjectGroup":"teras","form":4,"chapterNumber":3,"title":"Bab 3: Penaakulan Logik","subtitle":"Subtopik 3.1–3.2 KSSM (42 Langkah Bit-by-Bit) — Pernyataan Benar/Palsu, Pengkuantiti, Penafian (~p), Pernyataan Majmuk (dan/atau), Implikasi, Akas, Songsangan, Kontrapositif, Contoh Penyangkal, Hujah Deduktif (Bentuk I–III, Sah & Munasabah) serta Hujah Induktif & Masalah KBAT.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-t4-bab03-labs.js","coverIcon":"../assets/icons/mat43-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Hujah matematik dan penaakulan logik kamu memang tajam!","combo":"[laughs warmly] Kombo yang hebat! Langkah demi langkah kamu membuktikan kebenaran dengan penuh ketepatan!","encourage":"[encouraging] Hampir tepat... mari semak semula syarat pernyataan, jadual kebenaran dan bentuk hujah di bawah.","celebrate":"[excited] Tahniah! Kamu telah berjaya menakluki unit Penaakulan Logik Matematik Tingkatan empat ini!"},"units":[{"id":"mat43-u1","title":"Unit 1: Pernyataan, Pengkuantiti & Penafian (~p)","subtitle":"Subtopik 3.1 (Bhg. A) — Takrif Pernyataan, Ayat Bukan Pernyataan, Semua/Sebilangan & Penafian","iconType":"book","iconUrl":"../assets/icons/mat43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Takrif Pernyataan & Bukan Pernyataan","voiceCaption":"Pernyataan ialah ayat yang boleh ditentukan nilai kebenarannya, sama ada benar atau palsu, tetapi bukan kedua-duanya.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan empat, Bab tiga, Penaakulan Logik! Seperti perbahasan rasional di Parlimen dan reka bentuk litar elektronik, logik bermula dengan pernyataan. Ingat takrif penting: sesuatu ayat hanya diiktiraf sebagai pernyataan jika nilai kebenarannya dapat ditentukan sama ada benar atau palsu, tetapi bukan kedua-duanya. Ayat tanya, ayat seruan, ayat perintah dan persamaan terbuka berpemboleh ubah bukanlah pernyataan!","title":"3.1 Maksud Pernyataan & Penentuan Nilai Kebenaran","acronym":"B•P•T•S","hook":"Bukan semua ayat matematik ialah pernyataan! Persamaan terbuka seperti x + 3 = 5 belum pasti benar atau palsu selagi nilai x belum ditetapkan.","mediaKey":"mat43_parlimen_logik","videoClip":{"src":"../assets/matematik-t4-bab03/video/mat43_video_logik_narasi.mp4","posterKey":"mat43_parlimen_logik","hasNarration":true,"caption":"Penaakulan logik dalam perbahasan, pengkomputeran serta asas pernyataan benar dan palsu."},"summary":"Pernyataan ialah suatu ayat yang dapat disahkan sama ada bernilai benar atau bernilai palsu, namun tidak mungkin kedua-duanya sekali gus.","bullets":["Pernyataan vs Bukan Pernyataan: Ayat tanya (Adakah 3 + 2 = 8?), ayat seruan (Amboi, cantiknya bunga ini!), ayat perintah (Tolong hantar buku kerja.) dan persamaan terbuka (x + 3 = 5) TIDAK dapat dipastikan kebenarannya, maka semuanya BUKAN pernyataan.","Perangkap Algebra SPM: Persamaan atau ketaksamaan tanpa syarat seperti x + 3 = 5 bukan pernyataan, TETAPI identiti algebra seperti (x - y)² = x² - 2xy + y² atau ketaksamaan berdomain seperti (x + 5)² < 0 bagi x ∈ ℝ ADALAH pernyataan kerana nilainya sentiasa dapat dibuktikan benar atau palsu!"],"labId":"mat43_pernyataan_penafian_lab","labTitle":"Pengimbas Pernyataan & Penukar Penafian (~p)","labProps":{"tab":"scan","scanIdx":0},"examTip":"Untuk menguji sama ada sesuatu ayat matematik ialah pernyataan atau bukan, tanya diri anda: adakah semua penggantian nilai menghasilkan jawapan benar atau palsu yang konsisten?"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Pernyataan vs Bukan","voiceCaption":"Asingkan enam ayat dan ungkapan matematik berikut kepada kategori Pernyataan atau Bukan Pernyataan.","voiceScript":"[curious] Mari uji pengimbas logik kamu! Kelaskan keenam-enam ayat dan ungkapan berikut sama ada ia merupakan pernyataan yang boleh dinilai kebenarannya ataupun bukan pernyataan.","prompt":"Isihkan enam ayat berikut ke dalam kategori Pernyataan atau Bukan Pernyataan:","buckets":[{"id":"pernyataan","label":"Pernyataan (Ada Nilai Benar / Palsu)"},{"id":"bukan","label":"Bukan Pernyataan"}],"items":[{"text":"Tolong susun buku rujukan di atas rak.","bucketId":"bukan","note":"Ayat perintah tidak mempunyai nilai benar atau palsu."},{"text":"Adakah 5 merupakan faktor bagi 400?","bucketId":"bukan","note":"Ayat tanya bukan pernyataan."},{"text":"3x + 5 = 17","bucketId":"bukan","note":"Persamaan terbuka bergantung pada nilai x yang tidak diberi."},{"text":"-6 < -8","bucketId":"pernyataan","note":"Pernyataan bernilai palsu kerana -6 lebih besar daripada -8."},{"text":"(a + b)(a - b) = a² - b²","bucketId":"pernyataan","note":"Identiti algebra ini sentiasa benar bagi semua nilai nyata a dan b."},{"text":"Alangkah indahnya pemandangan gunung itu!","bucketId":"bukan","note":"Ayat seruan tidak dapat ditentukan nilai kebenarannya."}],"explanation":"Hanya ayat yang bernilai tetap sama ada benar atau palsu (seperti -6 < -8 dan identiti algebra) tergolong sebagai pernyataan; ayat tanya, perintah, seruan dan persamaan terbuka bukan pernyataan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Pengkuantiti & Penafian ~p","voiceCaption":"Pengkuantiti 'semua' menuntut setiap ahli memenuhi syarat, manakala penafian (~p) menyongsangkan nilai kebenaran melalui perkataan 'tidak' atau 'bukan'.","voiceScript":"[warm] Tokoh Yunani purba Aristotle menyusun logik sebagai instrumen pembuktian ahli sains dan falsafah. Dalam matematik, perhatikan dua alat penting: pertama, pengkuantiti 'semua' dan 'sebilangan'. Kedua, penafian tidak p, yang dibina dengan menambah perkataan 'tidak', 'bukan', atau 'bukan semua' sehingga nilai kebenarannya sentiasa bertukar arah!","title":"Pengkuantiti (Semua vs Sebilangan) & Penafian (~p)","acronym":"S•S•~p","hook":"Berhati-hati dengan perangkap 'Sebilangan nombor kuasa dua sempurna ialah nombor bulat' — ayat itu PALSU kerana SEMUA daripadanya ialah nombor bulat!","mediaKey":"mat43_aristotle_tokoh","summary":"Pengkuantiti menentukan keluasan sesuatu ciri objek, manakala penafian (~p) menukar sesuatu pernyataan benar menjadi palsu dan sebaliknya.","bullets":["Hukum Pengkuantiti (Semua vs Sebilangan): Pernyataan berpengkuantiti 'Semua' hanya benar apabila tiada satu pun pengecualian wujud. Sebaliknya, pernyataan berpengkuantiti 'Sebilangan' menjadi palsu apabila sifat tersebut sebenarnya dipenuhi oleh KESELURUHAN ahli kumpulan (cth. semua nombor kuasa dua sempurna ialah nombor bulat).","Penafian Pernyataan (~p): Tambah perkataan 'tidak' atau 'bukan' (atau tukar 'Semua' kepada 'Bukan semua', serta simbol '=' kepada '≠' dan '∈' kepada '∉'). Hasil daripada Rangsangan Minda 2 menunjukkan nilai kebenaran sentiasa terbalik antara p dengan ~p."],"labId":"mat43_pernyataan_penafian_lab","labTitle":"Penukar Penafian (~p) & Pengkuantiti","labProps":{"tab":"negate","negIdx":1},"formula":"p (Benar)  <-->  ~p (Palsu)   |   p (Palsu)  <-->  ~p (Benar)","examTip":"Apabila diminta menafikan ayat yang bermula dengan 'Semua X...', sentiasa tulis 'Bukan semua X...' atau 'Terdapat X yang bukan...'; jangan tulis 'Semua X tidak...' kerana maknanya berubah terus!"},{"type":"match","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Pernyataan & Penafian ~p","voiceCaption":"Padankan lima pernyataan asal berikut dengan bentuk penafian ~p serta nilai kebenaran baharunya yang tepat.","voiceScript":"[confident] Uji ketelitian kamu membentuk penafian tidak p! Padankan setiap pernyataan asal ini dengan penafian serta nilai kebenarannya selepas dinafikan.","prompt":"Padankan setiap pernyataan (p) dengan bentuk penafian (~p) dan nilai kebenarannya yang tepat:","pairs":[{"id":"u1m1","left":"p: 819 ialah gandaan 9 (Benar)","right":"~p: 819 bukan gandaan 9 (Palsu)"},{"id":"u1m2","left":"p: Semua gandaan 5 ialah gandaan 10 (Palsu)","right":"~p: Bukan semua gandaan 5 ialah gandaan 10 (Benar)"},{"id":"u1m3","left":"p: Kon mempunyai satu permukaan melengkung (Benar)","right":"~p: Kon tidak mempunyai satu permukaan melengkung (Palsu)"},{"id":"u1m4","left":"p: 6 ∈ {faktor bagi 18} (Benar)","right":"~p: 6 ∉ {faktor bagi 18} (Palsu)"},{"id":"u1m5","left":"p: 50% daripada 600 ialah 30 (Palsu)","right":"~p: 50% daripada 600 bukan 30 (Benar)"}],"explanation":"Penafian menukarkan 'ialah' kepada 'bukan', 'Semua' kepada 'Bukan semua', dan '∈' kepada '∉', sambil membalikkan nilai kebenaran daripada benar kepada palsu atau sebaliknya."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Nilai Penafian Algebra","voiceCaption":"Ramalkan nilai kebenaran bagi pernyataan (x + 4)² < 0 untuk x nombor nyata, sebelum dan selepas penafian ~p.","voiceScript":"[curious] Cuba ramalkan nilai kebenaran sebelum dan selepas penafian! Diberi pernyataan p: x tambah empat kuasa dua lebih kecil daripada sifar, dengan x unsur nombor nyata. Apakah nilai kebenaran p dan tidak p?","hook":"Kuasa dua sebarang nombor nyata tidak pernah bernilai negatif!","scenario":"Diberi pernyataan p: (x + 4)² < 0 bagi semua x ∈ ℝ.","prompt":"Apakah nilai kebenaran bagi pernyataan p dan penafiannya (~p)?","options":["p bernilai Palsu (kerana kuasa dua nombor nyata sentiasa >= 0), maka ~p bernilai Benar.","p bernilai Benar apabila x = -5, maka ~p bernilai Palsu.","Kedua-dua p dan ~p ialah bukan pernyataan kerana mengandungi huruf x.","Kedua-dua p dan ~p bernilai Palsu kerana tidak boleh diselesaikan."],"correctIndex":0,"proofLabId":"mat43_pernyataan_penafian_lab","proofState":{"tab":"scan","scanIdx":4},"explanation":"Kerana bagi sebarang nombor nyata x, nilai (x + 4)² sentiasa >= 0 (contohnya jika x = 1, 25 > 0), maka p bernilai Palsu. Apabila dinafikan, ~p bertukar menjadi Benar.","mediaKey":"mat43_aristotle_tokoh"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Penafian Pengkuantiti","voiceCaption":"Susun blok ayat bagi membentuk penafian (~p) yang tepat untuk pernyataan berpengkuantiti 'Semua persamaan kuadratik mempunyai dua punca yang sama'.","voiceScript":"[serious] Sekarang giliran kamu membina ayat penafian! Susun blok perkataan yang tepat untuk menafikan pernyataan: Semua persamaan kuadratik mempunyai dua punca yang sama.","prompt":"Bentuk penafian (~p) bagi pernyataan: 'Semua persamaan kuadratik mempunyai dua punca yang sama.'","hint":"Gunakan frasa pengkuantiti yang betul bagi menafikan kata 'Semua'...","answerTokens":["Bukan semua","persamaan kuadratik","mempunyai dua punca","yang sama"],"distractors":["Tiada langsung","yang berbeza"],"explanation":"Penafian bagi 'Semua A mempunyai sifat B' dalam logik KSSM ditulis sebagai 'Bukan semua A mempunyai sifat B' — jangan sekali-kali mengubah sifat di hujung ayat menjadi 'berbeza'."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Kebenaran Pengkuantiti","voiceCaption":"Pilih pernyataan tunggal yang bernilai benar dalam kalangan empat pilihan pengkuantiti geometri dan algebra.","voiceScript":"[confident] Soalan penutup Unit satu! Antara empat pernyataan geometri dan nombor berikut, hanya satu sahaja yang benar. Teliti penggunaan perkataan 'semua' dan 'sebilangan' dengan cermat!","prompt":"Antara pernyataan berikut, yang manakah bernilai BENAR?","options":["Sebilangan garis lurus memintas paksi-y.","Semua segi empat mempunyai empat sudut tepat.","Semua poligon mempunyai pepenjuru.","Sebilangan nombor kuasa dua sempurna ialah nombor bulat."],"correctIndex":0,"explanation":"Garis condong atau mengufuk memintas paksi-y manakala garis mencancang x = k (k ≠ 0) tidak memintas paksi-y, jadi 'Sebilangan garis lurus memintas paksi-y' ialah Benar. Tiga pilihan lain Palsu: trapesium/rombus tiada 4 sudut tepat, segi tiga tiada pepenjuru, dan SEMUA kuasa dua sempurna ialah nombor bulat."}]},{"id":"mat43-u2","title":"Unit 2: Pernyataan Majmuk & Jadual Kebenaran","subtitle":"Subtopik 3.1 (Bhg. B) — Gabungan 'dan' vs 'atau', Pecahan p & q serta Jadual Kebenaran 4 Baris","iconType":"scale","iconUrl":"../assets/icons/mat43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Pernyataan Majmuk: Dan vs Atau","voiceCaption":"Pernyataan majmuk menggabungkan dua pernyataan menggunakan 'dan' (kedua-dua) atau 'atau' (salah satu atau kedua-dua).","voiceScript":"[warm] Selamat datang ke Unit dua! Bagaimanakah dua pernyataan p dan q digabungkan dalam litar komputer dan perbahasan? Kita guna kata hubung 'dan' serta 'atau'. Perkataan 'dan' bermaksud kedua-dua syarat mesti dipenuhi serentak, manakala perkataan 'atau' bermaksud salah satu atau kedua-duanya sudah mencukupi!","title":"Pernyataan Majmuk: Kata Hubung 'dan' serta 'atau'","acronym":"D•A•K•S","hook":"Awas ayat tersembunyi! Dalam '9 dan 91 ialah nombor perdana', ayat itu menggabungkan dua pernyataan berasingan iaitu '9 ialah nombor perdana' DAN '91 ialah nombor perdana'!","mediaKey":"mat43_jadual_kebenaran","summary":"Pernyataan majmuk dibina dengan menyambungkan dua atau lebih pernyataan tunggal menggunakan kata hubung logik 'dan' atau 'atau'.","bullets":["Takrif 'dan' vs 'atau': Dalam matematik, kata 'dan' membawa maksud KEDUA-DUA komponen mesti berlaku, manakala 'atau' membawa maksud SALAH SATU atau KEDUA-DUA komponen berlaku.","Memecah Ayat Ringkas kepada p & q: Pernyataan padat seperti '-4 dan 2 ialah integer' atau 'Hasil tambah sudut pedalaman segi tiga atau segi empat ialah 360°' mesti diasingkan menjadi dua pernyataan penuh p dan q sebelum nilai kebenaran dinilai."],"labId":"mat43_jadual_kebenaran_lab","labTitle":"Simulator Get Logik & Jadual Kebenaran","labProps":{"pVal":true,"qVal":true,"opMode":"dan","presetIdx":1},"formula":"p dan q = kedua-dua mesti Benar   |   p atau q = sekurang-kurangnya satu Benar","examTip":"Jangan terkeliru dengan ayat matematik bercantum: semak kebenaran p secara berasingan dan kebenaran q secara berasingan terlebih dahulu sebelum membuat keputusan!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kebenaran: 9 dan 91","voiceCaption":"Uji nilai kebenaran pernyataan majmuk '9 dan 91 ialah nombor perdana' dengan menyemak faktor bagi 9 serta 91.","voiceScript":"[curious] Cuba uji ketajaman nombor perdana kamu! Apakah nilai kebenaran bagi pernyataan majmuk: sembilan dan sembilan puluh satu ialah nombor perdana? Hati-hati, periksa pemfaktoran sembilan puluh satu dahulu!","hook":"91 kelihatan seperti nombor perdana, tetapi cuba bahagikan 91 dengan 7!","scenario":"Pecahkan ayat kepada p: 9 ialah nombor perdana, dan q: 91 ialah nombor perdana, yang digabungkan oleh kata hubung 'dan'.","prompt":"Apakah nilai kebenaran bagi pernyataan majmuk: '9 dan 91 ialah nombor perdana'?","options":["Palsu, kerana kedua-dua 9 (= 3 × 3) dan 91 (= 7 × 13) bukan nombor perdana.","Benar, kerana 91 ialah nombor perdana yang mempunyai dua faktor sahaja.","Benar, kerana kedua-dua 9 dan 91 ialah nombor ganjil.","Palsu hanya kerana 9 bukan nombor perdana, tetapi 91 adalah nombor perdana."],"correctIndex":0,"proofLabId":"mat43_jadual_kebenaran_lab","proofState":{"pVal":false,"qVal":false,"opMode":"dan","presetIdx":0},"explanation":"9 boleh dibahagi tepat dengan 3 (9 = 3 × 3) dan 91 boleh dibahagi tepat dengan 7 serta 13 (91 = 7 × 13). Oleh itu p Palsu dan q Palsu, menjadikan 'p dan q' bernilai Palsu."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Jadual Kebenaran 4 Baris","voiceCaption":"Jadual kebenaran menunjukkan bahawa 'p dan q' hanya benar jika kedua-duanya benar, manakala 'p atau q' hanya palsu jika kedua-duanya palsu.","voiceScript":"[confident] Sekarang lihat Jadual Kebenaran empat baris pada simulator! Untuk 'p dan q', lampu hanya menyala apabila kedua-dua p dan q bernilai benar. Sebaliknya, bagi 'p atau q', satu sahaja benar sudah menyalakan lampu — ia hanya palsu apabila kedua-dua p dan q serentak palsu!","title":"Jadual Kebenaran Penuh bagi (p dan q) dan (p atau q)","acronym":"1B • 1P","hook":"Hukum emas jadual kebenaran: 'DAN' ialah syarat ketat (1 baris Benar sahaja); 'ATAU' ialah syarat longgar (1 baris Palsu sahaja)!","summary":"Jadual kebenaran merangkum keempat-empat kemungkinan kombinasi kebenaran bagi p dan q untuk menilai operasi majmuk dengan pantas.","bullets":["Lajur (p dan q): Menghasilkan nilai Benar HANYA pada baris pertama (p = Benar, q = Benar). Jika salah satu atau kedua-dua komponen bernilai Palsu, hasilnya terus Palsu.","Lajur (p atau q): Menghasilkan nilai Palsu HANYA pada baris keempat (p = Palsu, q = Palsu). Bagi ketiga-tiga baris yang mengandungi sekurang-kurangnya satu nilai Benar, hasilnya sentiasa Benar."],"labId":"mat43_jadual_kebenaran_lab","labTitle":"Penguji Interaktif Jadual Kebenaran 4 Baris","labProps":{"pVal":false,"qVal":true,"opMode":"atau","presetIdx":2},"formula":"(B dan B) = B   |   (P atau P) = P   |   Selainnya ikut sifat kata hubung","examTip":"Dalam jadual kebenaran kertas soalan SPM, lukis dan semak lajur p dahulu, kemudian lajur q sebelum menulis keputusan gabungan."},{"type":"match","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Ayat Majmuk & Kebenaran","voiceCaption":"Padankan lima pernyataan majmuk algebra, geometri dan set berikut dengan nilai kebenaran serta alasannya yang tepat.","voiceScript":"[warm] Uji kelajuan kamu menilai pernyataan majmuk Kertas satu! Padankan setiap pernyataan berikut dengan nilai kebenaran serta sebab matematiknya yang tepat.","prompt":"Padankan setiap pernyataan majmuk dengan nilai kebenaran dan justifikasinya:","pairs":[{"id":"u2m1","left":"49 ialah gandaan 7 dan kuasa dua sempurna.","right":"Benar — kedua-dua 49 = 7×7 dan 49 = 7² adalah benar."},{"id":"u2m2","left":"Hasil tambah sudut pedalaman segi tiga atau segi empat ialah 360°.","right":"Benar — segi empat memang berjumlah 360° bagi kata 'atau'."},{"id":"u2m3","left":"Pekali bagi 9x ialah 9 dan 9⁰ = 0.","right":"Palsu — kerana 9⁰ = 1 (bukan 0) walaupun p benar."},{"id":"u2m4","left":"6 atau 8 ialah nombor ganjil.","right":"Palsu — kedua-dua 6 dan 8 ialah nombor genap."},{"id":"u2m5","left":"{2, 5} ⊂ ({2, 3, 6} ∪ {5, 7}) atau n(∅) = 0.","right":"Benar — kedua-dua pernyataan subkomponen adalah benar."}],"explanation":"Kata hubung 'dan' memerlukan kedua-dua p dan q benar (9⁰ = 1 menyebabkan u2m3 palsu), manakala 'atau' bernilai benar asalkan sekurang-kurangnya satu bahagian benar."},{"type":"sort","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Isih Majmuk Benar vs Palsu","voiceCaption":"Kelaskan enam pernyataan majmuk algebra, indeks dan geometri berikut sama ada bernilai Benar atau Palsu.","voiceScript":"[confident] Tiba masa latihan pantas! Isihkan enam pernyataan majmuk daripada buku teks ini mengikut nilai kebenarannya sama ada Benar ataupun Palsu.","prompt":"Isihkan pernyataan majmuk berikut mengikut nilai kebenarannya (Benar atau Palsu):","buckets":[{"id":"benar","label":"Pernyataan Majmuk Benar"},{"id":"palsu","label":"Pernyataan Majmuk Palsu"}],"items":[{"text":"2⁴ = 16 dan 16 ialah nombor kuasa dua sempurna.","bucketId":"benar","note":"Kedua-dua komponen benar (2⁴ = 16 dan 4² = 16)."},{"text":"3 jam = 120 minit dan 4 minit = 240 saat.","bucketId":"palsu","note":"3 jam = 180 minit (p Palsu), maka gabungan 'dan' adalah Palsu."},{"text":"2/9 boleh ditulis sebagai perpuluhan berulang atau kurang daripada 1.","bucketId":"benar","note":"2/9 = 0.222... dan < 1, jadi kedua-dua komponen benar."},{"text":"4/5 atau 5/4 ialah pecahan wajar.","bucketId":"benar","note":"4/5 ialah pecahan wajar, memadai bagi kata hubung 'atau'."},{"text":"90 × 80% = 70 atau 8³ = 324.","bucketId":"palsu","note":"90 × 0.8 = 72 (≠ 70) dan 8³ = 512 (≠ 324); kedua-dua palsu."},{"text":"y = 3x selari dengan y - 3x = 5 dan pintasan-y bagi y - 3x = 5 ialah 3.","bucketId":"palsu","note":"Kecerunannya sama (m = 3), tetapi pintasan-y bagi y = 3x + 5 ialah 5, bukan 3!"}],"explanation":"Semak setiap pengiraan dengan teliti: 3 jam = 180 minit, pintasan-y bagi y - 3x = 5 ialah 5, dan 8³ = 512."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Hukum Jadual Kebenaran","voiceCaption":"Susun peraturan jadual kebenaran yang membezakan kata hubung 'dan' dengan 'atau'.","voiceScript":"[warm] Kukuhkan ingatan kamu dengan menyusun peraturan rasmi jadual kebenaran bagi pernyataan majmuk menggunakan kata 'dan' serta 'atau'.","prompt":"Susun blok ayat bagi merumuskan hukum nilai kebenaran pernyataan majmuk:","hint":"Mulakan dengan syarat ketat bagi 'p dan q' diikuti syarat tunggal 'p atau q'...","answerTokens":["Pernyataan majmuk p dan q","bernilai benar hanya apabila","kedua-dua pernyataan benar,","manakala p atau q palsu hanya jika kedua-duanya palsu"],"distractors":["apabila salah satu palsu","apabila kedua-duanya benar"],"explanation":"Ringkasan mutlak Jadual Kebenaran: 'p dan q' = Benar hanya bila kedua-dua Benar; 'p atau q' = Palsu hanya bila kedua-dua Palsu."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Cabaran Indeks & Set Majmuk","voiceCaption":"Pilih pernyataan majmuk gabungan indeks, faktor dan tatatanda set yang bernilai benar.","voiceScript":"[curious] Soalan akhir Unit dua menguji gabungan hukum indeks, faktor dan set! Antara empat pernyataan majmuk berikut, yang manakah bernilai benar?","prompt":"Manakah antara pernyataan majmuk berikut bernilai BENAR?","options":["9⁻¹ = 1/9 dan 9 ialah faktor bagi 72.","2⁶ = 64 dan 2 × 6 = 26.","3 ∈ {1, 2, 5} dan {8, 9} ⊂ {6, 7, 8}.","6 atau 8 ialah faktor bagi 20."],"correctIndex":0,"explanation":"9⁻¹ = 1/9 adalah Benar dan 72 ÷ 9 = 8 (9 faktor bagi 72) juga Benar, maka gabungan 'dan' bernilai Benar. Pilihan lain: 2 × 6 = 12 (≠ 26), 3 ∉ {1, 2, 5}, dan 20 tidak boleh dibahagi tepat dengan 6 mahupun 8."}]},{"id":"mat43-u3","title":"Unit 3: Implikasi, Akas, Songsangan, Kontrapositif & Penyangkal","subtitle":"Subtopik 3.1 (Bhg. C) — Antejadian/Akibat, Dwisyarat, 4 Bentuk Transformasi & Contoh Penyangkal","iconType":"compass","iconUrl":"../assets/icons/mat43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Implikasi & Dwisyarat","voiceCaption":"Implikasi 'jika p, maka q' mempunyai antejadian p dan akibat q, manakala 'p jika dan hanya jika q' menggabungkan dua implikasi berlawanan arah.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam pernyataan bersyarat 'jika p, maka q', bahagian p selepas perkataan jika ialah antejadian, manakala bahagian q selepas perkataan maka ialah akibat. Apabila dua implikasi berjalan dua hala, iaitu jika p maka q dan jika q maka p, kedua-duanya digabungkan menjadi pernyataan dwisyarat: p jika dan hanya jika q!","title":"Implikasi 'Jika p, maka q' & 'p jika dan hanya jika q'","acronym":"A•A•J","hook":"Ingat turutan huruf abjad: Antejadian (syarat 'jika') mendahului Akibat (kesan 'maka'), manakala 'jika dan hanya jika' ialah gabungan 2 implikasi serentak!","mediaKey":"mat43_transformasi_implikasi","summary":"Pernyataan implikasi menghubungkan syarat dengan kesannya, dan boleh digabungkan dua hala menggunakan frasa 'jika dan hanya jika'.","bullets":["Implikasi 'Jika p, maka q': p dikenali sebagai antejadian (diletakkan selepas 'Jika') dan q dikenali sebagai akibat (diletakkan selepas 'maka').","Implikasi Dwisyarat 'p jika dan hanya jika q': Terdiri daripada tepat dua implikasi iaitu Implikasi 1 (Jika p, maka q) dan Implikasi 2 (Jika q, maka p). Contoh: √r = 15 jika dan hanya jika r = 225."],"formula":"p jika dan hanya jika q   <==>   (Jika p, maka q) + (Jika q, maka p)","examTip":"Apabila diminta menulis 'p jika dan hanya jika q', JANGAN ulang perkataan 'jika' atau 'maka' di awal atau tengah ayat!"},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Antejadian & Dwisyarat","voiceCaption":"Padankan lima struktur implikasi satu hala dan dua hala dengan komponen antejadian, akibat atau pecahannya yang betul.","voiceScript":"[confident] Uji penguasaan kamu mengenal pasti antejadian, akibat dan memecahkan pernyataan dwisyarat 'jika dan hanya jika'!","prompt":"Padankan implikasi berikut dengan antejadian, akibat atau implikasi gabungannya:","pairs":[{"id":"u3m1","left":"Jika x - y > 0, maka x > y.","right":"Antejadian: x - y > 0 | Akibat: x > y"},{"id":"u3m2","left":"Antejadian: K ⊂ L | Akibat: n(K) <= n(L)","right":"Jika set K subset kepada set L, maka n(K) <= n(L)."},{"id":"u3m3","left":"√r = 15 jika dan hanya jika r = 225.","right":"Implikasi 1: Jika √r = 15 maka r = 225 | Implikasi 2: Jika r = 225 maka √r = 15."},{"id":"u3m4","left":"Jika k nombor perdana -> ada 2 faktor; dan sebaliknya.","right":"k ialah nombor perdana jika dan hanya jika k mempunyai dua faktor sahaja."},{"id":"u3m5","left":"f(x) = ax² + bx + c ada titik maksimum jika dan hanya jika a < 0.","right":"Implikasi 2: Jika a < 0, maka f(x) = ax² + bx + c mempunyai titik maksimum."}],"explanation":"Antejadian sentiasa berada antara 'Jika' dan 'maka', manakala 'p jika dan hanya jika q' boleh dibelah kepada arah p -> q dan q -> p."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Akas, Songsangan & Kontrapositif","voiceCaption":"Daripada implikasi 'jika p, maka q', terbitkan Akas (jika q maka p), Songsangan (jika tidak p maka tidak q), dan Kontrapositif (jika tidak q maka tidak p).","voiceScript":"[warm] Sekarang mari kuasai empat transformasi utama implikasi! Daripada pernyataan asal 'jika p, maka q': tukar tempat menjadi Akas, 'jika q, maka p'. Nafikan kedua-duanya menjadi Songsangan, 'jika tidak p, maka tidak q'. Tukar tempat dan nafikan serentak menjadi Kontrapositif, 'jika tidak q, maka tidak p'! Awas tanda ketaksamaan: lebih besar daripada dinafikan menjadi lebih kecil atau sama dengan!","title":"Membina Akas, Songsangan & Kontrapositif","acronym":"I•A•S•K","hook":"Jangan tertipu dengan tanda ketaksamaan semasa menafikan! Penafian '>' ialah '≤' (bukan '<'), manakala penafian '<' ialah '≥'!","summary":"Setiap implikasi menghasilkan tiga varian logik yang berbeza susunan dan penafiannya iaitu Akas, Songsangan dan Kontrapositif.","bullets":["4 Struktur Transformasi: Implikasi (Jika p, maka q) -> Akas (Jika q, maka p) -> Songsangan (Jika ~p, maka ~q) -> Kontrapositif (Jika ~q, maka ~p).","Hukum Penafian Ketaksamaan Algebra: Penafian bagi p² - q² > 0 ialah p² - q² <= 0 (tanda sama dengan '=' wajib disertakan!), penafian x < 5 ialah x >= 5, dan penafian x = 5 ialah x ≠ 5."],"labId":"mat43_akas_songsangan_kontra_lab","labTitle":"Mesin Transformasi Akas, Songsangan & Kontrapositif","labProps":{"caseIdx":0,"activeForm":"akas"},"formula":"Akas: q -> p   |   Songsangan: ~p -> ~q   |   Kontrapositif: ~q -> ~p","examTip":"Untuk mengelakkan kesilapan menulis Kontrapositif: bina Akas dahulu (q -> p), kemudian nafikan kedua-dua bahagian (~q -> ~p)!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Susun Kontrapositif Ketaksamaan","voiceCaption":"Bina bentuk kontrapositif yang tepat bagi implikasi ketaksamaan 'Jika w < 7, maka w < 5' daripada Praktis Kendiri 3.1f.","voiceScript":"[serious] Uji teknik menafikan ketaksamaan! Susun blok jawapan untuk membentuk kontrapositif bagi implikasi: Jika w lebih kecil daripada tujuh, maka w lebih kecil daripada lima.","prompt":"Bina kontrapositif bagi implikasi: 'Jika w < 7, maka w < 5.' (Praktis Kendiri 3.1f Q2e)","hint":"Kontrapositif ialah 'Jika ~q, maka ~p'. Ingat penafian bagi '<' ialah '>='!","answerTokens":["Jika","w >= 5,","maka","w >= 7"],"distractors":["w > 5,","w < 7"],"explanation":"Bagi 'Jika p (w < 7), maka q (w < 5)', kontrapositifnya ialah 'Jika ~q, maka ~p'. Penafian bagi w < 5 ialah w >= 5 dan penafian w < 7 ialah w >= 7, menghasilkan: Jika w >= 5, maka w >= 7."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Kebenaran Contoh 13","voiceCaption":"Ramalkan nilai kebenaran bagi Implikasi, Akas, Songsangan dan Kontrapositif bagi 'Jika 2 × 3 = 6, maka 8 - 2 × 3 = 18'.","voiceScript":"[curious] Ini soalan wajib SPM daripada Contoh tiga belas! Implikasinya berbunyi: Jika dua darab tiga sama dengan enam, maka lapan tolak dua darab tiga sama dengan lapan belas. Perhatikan antejadiannya benar tetapi akibatnya palsu! Apakah nilai kebenaran keempat-empat bentuknya?","hook":"Satu syarat maut implikasi: 'Jika p, maka q' HANYA Palsu apabila p Benar dan q Palsu serentak!","scenario":"Diberi p: 2 × 3 = 6 (Benar) dan q: 8 - 2 × 3 = 18 (kerana 8 - 6 = 2, maka q Palsu).","prompt":"Apakah susunan nilai kebenaran bagi (Implikasi, Akas, Songsangan, Kontrapositif) untuk Contoh 13?","options":["Implikasi: Palsu | Akas: Benar | Songsangan: Benar | Kontrapositif: Palsu","Implikasi: Palsu | Akas: Palsu | Songsangan: Benar | Kontrapositif: Benar","Implikasi: Benar | Akas: Palsu | Songsangan: Palsu | Kontrapositif: Benar","Keempat-empat bentuk bernilai Palsu kerana 8 - 6 bukan 18."],"correctIndex":0,"proofLabId":"mat43_akas_songsangan_kontra_lab","proofState":{"caseIdx":1,"activeForm":"imp"},"explanation":"Implikasi (B -> P) bernilai Palsu, dan Kontrapositifnya sentiasa sepadan (B -> P = Palsu). Akas (P -> B) dan Songsangan (P -> B) bermula dengan antejadian Palsu, maka kedua-duanya bernilai Benar!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s6","voiceToneLabel":"Kesetaraan & Contoh Penyangkal","voiceCaption":"Implikasi setara dengan kontrapositifnya, akas setara dengan songsangannya, dan setiap pernyataan palsu dibuktikan oleh satu contoh penyangkal.","voiceScript":"[confident] Lihat hasil Rangsangan Minda tiga pada peta transformasi: nilai kebenaran Implikasi sentiasa sama dengan Kontrapositif, manakala nilai kebenaran Akas sentiasa sama dengan Songsangan! Dan apabila sesuatu pernyataan atau transformasinya bernilai palsu, kita hanya perlu mengemukakan satu sahaja contoh penyangkal yang memuaskan antejadian tetapi melanggar akibat!","title":"Jadual Kesetaraan Kebenaran & Contoh Penyangkal","acronym":"I≡K • A≡S","hook":"Jika antejadian p bernilai Palsu, implikasi 'jika p, maka q' OTOMATIK Benar tanpa perlu menyemak sama ada akibat q benar atau palsu!","summary":"Kesetaraan bersilang mempercepatkan penyemakan kebenaran empat bentuk implikasi, sementara contoh penyangkal menjadi bukti mutlak menafikan pernyataan palsu.","bullets":["2 Pasangan Kesetaraan Mutlak: (1) Implikasi ≡ Kontrapositif (kedua-duanya bernilai Palsu hanya apabila p Benar dan q Palsu serentak); (2) Akas ≡ Songsangan (kerana keduanya ialah kontrapositif antara satu sama lain).","Kuasa Satu Contoh Penyangkal: Untuk menyangkal pernyataan palsu seperti 'Jika k <= 0, maka k² <= 0' (Contoh 15e), berikan satu kes yang memenuhi antejadian tetapi gagal akibatnya, iaitu k = -2 <= 0 tetapi (-2)² = 4 > 0!"],"labId":"mat43_akas_songsangan_kontra_lab","labTitle":"Penguji Kesetaraan & Contoh Penyangkal","labProps":{"caseIdx":2,"activeForm":"kontra"},"formula":"p = B, q = P  ==>  (p -> q) = PALSU   |   Jika p = P  ==>  (p -> q) sentiasa BENAR","examTip":"Contoh penyangkal MESTI memenuhi syarat 'jika' (antejadian) terlebih dahulu sebelum menunjukkan bahagian 'maka' (akibat) gagal dipatuhi!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Isih Contoh Penyangkal Sah","voiceCaption":"Asingkan enam kenyataan berikut kepada Contoh Penyangkal yang sah menyangkal pernyataan palsu atau Contoh yang tidak menyangkal.","voiceScript":"[curious] Berhati-hati memilih contoh penyangkal! Asingkan antara contoh yang benar-benar menyangkal pernyataan palsu dengan contoh yang gagal bertindak sebagai penyangkal.","prompt":"Isihkan contoh berikut sama ada menjadi Contoh Penyangkal yang sah ataupun Tidak Menyangkal:","buckets":[{"id":"sah","label":"Contoh Penyangkal Sah"},{"id":"tidak","label":"Tidak Menyangkal Pernyataan"}],"items":[{"text":"Pernyataan: Semua integer bernilai positif -> Contoh: -7 ialah integer negatif.","bucketId":"sah","note":"Wujud integer negatif (-7), menyangkal 'semua integer positif'."},{"text":"Pernyataan: Jika w < 7 maka w < 5 -> Contoh: w = 6 memenuhi w < 7 tetapi 6 > 5.","bucketId":"sah","note":"w = 6 memenuhi antejadian w < 7 tetapi melanggar akibat w < 5."},{"text":"Pernyataan: Jika x > 3 maka x > 5 -> Contoh: x = 4 memenuhi x > 3 tetapi 4 < 5.","bucketId":"sah","note":"x = 4 membuktikan akas 'Jika x > 3 maka x > 5' adalah palsu."},{"text":"Pernyataan: Jika k² > 0 maka k > 0 -> Contoh: k = 3 memberi 3² = 9 > 0.","bucketId":"tidak","note":"k = 3 memenuhi kedua-dua bahagian; penyangkal sebenar ialah k = -2!"},{"text":"Pernyataan: Semua poligon bersudut tepat -> Contoh: Segi empat sama mempunyai sudut 90°.","bucketId":"tidak","note":"Ini contoh menyokong, bukan menyangkal (patut beri segi tiga atau heksagon sekata)."},{"text":"Pernyataan: Nombor pecahan < 1 -> Contoh: 7/4 ialah pecahan tidak wajar bernilai 1.75 > 1.","bucketId":"sah","note":"Pecahan tidak wajar 7/4 melebihi 1, menyangkal pernyataan tersebut."}],"explanation":"Contoh penyangkal yang sah mesti menepati syarat depan (atau jenis objek) sambil menghasilkan kesudahan yang bercanggah dengan kesimpulan pernyataan tersebut."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s8","voiceToneLabel":"Uji Kontrapositif & Penyangkal","voiceCaption":"Pilih bentuk kontrapositif yang betul serta nilai kebenaran dan contoh penyangkal bagi 'Jika w > 20, maka w > 30'.","voiceScript":"[excited] Soalan penutup Unit tiga daripada Praktis Sumatif! Tulis kontrapositif bagi implikasi: Jika w lebih besar daripada dua puluh, maka w lebih besar daripada tiga puluh, berserta nilai kebenaran dan contoh penyangkalnya jika palsu.","prompt":"Tulis kontrapositif bagi implikasi 'Jika w > 20, maka w > 30' dan tentukan nilai kebenarannya (berserta justifikasi jika palsu):","options":["Jika w <= 30, maka w <= 20. Palsu kerana w = 25 memenuhi w <= 30 tetapi w > 20.","Jika w <= 20, maka w <= 30. Benar bagi semua nilai nombor nyata w.","Jika w > 30, maka w > 20. Benar kerana setiap nombor melebihi 30 melebihi 20.","Jika w < 30, maka w < 20. Palsu kerana w = 30 memenuhi syarat tersebut."],"correctIndex":0,"explanation":"Kontrapositif bagi 'Jika p (w > 20), maka q (w > 30)' ialah 'Jika ~q (w <= 30), maka ~p (w <= 20)'. Nilainya Palsu (sama seperti implikasi asal) dengan contoh penyangkal w = 25."}]},{"id":"mat43-u4","title":"Unit 4: Hujah Deduktif vs Induktif & Bentuk I–III","subtitle":"Subtopik 3.2 (Bhg. A) — Khusus vs Umum, 3 Bentuk Hujah Sah, Kesahan vs Kemunasabahan","iconType":"formula","iconUrl":"../assets/icons/mat43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Khusus vs Umum: Deduktif vs Induktif","voiceCaption":"Hujah deduktif membina kesimpulan khusus daripada premis umum, manakala hujah induktif membina kesimpulan umum daripada premis khusus.","voiceScript":"[warm] Kini kita memasuki Subtopik tiga perpuluhan dua, Hujah! Penghujahan terdiri daripada premis iaitu maklumat awal dan satu kesimpulan. Perhatikan arah pergerakannya: Hujah Deduktif bergerak daripada premis umum kepada kesimpulan khusus, manakala Hujah Induktif bergerak daripada premis-premis khusus kepada satu kesimpulan umum!","title":"3.2 Maksud Hujah & Perbezaan Deduktif vs Induktif","acronym":"U->K • K->U","hook":"Hafal kod arah dua jenis hujah: DEDUKTIF = Umum ke Khusus (macam corong mengecil); INDUKTIF = Khusus ke Umum (mengembang jadi rumus)!","mediaKey":"mat43_hujah_deduktif","summary":"Suatu hujah ringkas mengandungi sekurang-kurangnya dua premis dan satu kesimpulan, yang dikelaskan kepada deduktif atau induktif mengikut arah pernyataan umum dan khusus.","bullets":["Pernyataan Khusus vs Umum (Rangsangan Minda 4): Pernyataan khusus merujuk kes tunggal tertentu (cth. Luas segi tiga ABC ialah 8 cm², 9³ = 729), manakala pernyataan umum menerangkan konsep menyeluruh atau rumus ('Semua prisma mempunyai keratan rentas seragam', 'Isi padu kubus = x³').","Hujah Deduktif vs Induktif (Rangsangan Minda 5): Hujah Deduktif membina kesimpulan khusus daripada premis umum (Contoh: 'Semua sudut tirus < 90°; ∠PQR sudut tirus -> ∠PQR < 90°'). Hujah Induktif pula membina kesimpulan umum daripada beberapa kes khusus (Contoh: '1⁰=1, 2⁰=1, 3⁰=1 -> n⁰=1 bagi n=1,2,3...')."],"labId":"mat43_bentuk_hujah_deduktif_lab","labTitle":"Inspektor Deduktif (Bentuk I–III) & Induktif","labProps":{"tab":"deduktif","dedIdx":0},"formula":"Deduktif: Premis Umum -> Kesimpulan Khusus   |   Induktif: Premis Khusus -> Kesimpulan Umum","examTip":"Lihat pada Premis 1 dan Kesimpulan: jika Premis 1 ada kata 'Semua' atau rumus am dan kesimpulan merujuk satu objek/nombor khusus, ia pasti Hujah Deduktif!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Hujah Deduktif vs Induktif","voiceCaption":"Kelaskan enam hujah daripada Contoh 16 dan Praktis Kendiri 3.2a kepada Hujah Deduktif atau Hujah Induktif.","voiceScript":"[confident] Uji mata analitis kamu! Isihkan enam hujah matematik berikut sama ada ia terbina secara deduktif dari umum ke khusus, ataupun secara induktif dari khusus ke umum.","prompt":"Kelaskan setiap hujah berikut sebagai Hujah Deduktif atau Hujah Induktif:","buckets":[{"id":"deduktif","label":"Hujah Deduktif (Umum -> Khusus)"},{"id":"induktif","label":"Hujah Induktif (Khusus -> Umum)"}],"items":[{"text":"Semua sudut tirus kurang daripada 90°. Sudut PQR ialah sudut tirus. Maka, sudut PQR kurang daripada 90°.","bucketId":"deduktif","note":"Premis 1 umum ('Semua sudut tirus...') menghasilkan kesimpulan khusus untuk sudut PQR."},{"text":"Semua poligon sekata mempunyai sisi yang sama panjang. ABCDEFG ialah poligon sekata. Maka, ABCDEFG mempunyai sisi yang sama panjang.","bucketId":"deduktif","note":"Bermula dengan sifat umum poligon sekata kepada poligon khusus ABCDEFG."},{"text":"Semua nombor nisbah boleh ditulis dalam bentuk pecahan. 1.5 ialah nombor nisbah. Maka, 1.5 boleh ditulis dalam bentuk pecahan.","bucketId":"deduktif","note":"Dari peraturan umum nombor nisbah ke kes khusus 1.5."},{"text":"Hasil tambah sudut peluaran segi tiga, segi empat dan pentagon ialah 360°. Maka, hasil tambah sudut peluaran setiap poligon ialah 360°.","bucketId":"induktif","note":"Contoh khusus poligon tertentu dirumuskan kepada setiap poligon."},{"text":"5² × 5³ = 5⁵, 5³ × 5⁴ = 5⁷, 5⁴ × 5⁵ = 5⁹. Maka, 5^m × 5^n = 5^(m+n).","bucketId":"induktif","note":"Tiga contoh pengiraan khusus membentuk hukum indeks umum."},{"text":"2(1) = 2, 2(2) = 4, 2(3) = 6. Maka, pola nombor 2, 4, 6, ... boleh ditulis sebagai 2n; n = 1, 2, 3, ...","bucketId":"induktif","note":"Pemerhatian kes khusus dirumus menjadi ungkapan umum 2n."}],"explanation":"Hujah deduktif sentiasa bermula dengan prinsip/himpunan umum lalu menurunkannya kepada satu kes khusus; hujah induktif mengumpulkan contoh khusus untuk membina generalisasi umum."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"3 Bentuk Hujah Sah & Munasabah","voiceCaption":"Hujah deduktif hanya sah jika menepati Bentuk I, II atau III, dan hanya munasabah apabila sah serta kesemua premis dan kesimpulannya benar.","voiceScript":"[warm] Ini konsep terpenting dalam Bab tiga: kesahan suatu hujah deduktif ditentukan oleh bentuk strukturnya sahaja, bukan kebenaran ayat! Ada tiga bentuk yang sah: Bentuk satu, Semua A ialah B, C ialah A, maka C ialah B. Bentuk dua, Jika p maka q, p benar, maka q benar. Bentuk tiga, Jika p maka q, bukan q benar, maka bukan p benar. Ketik keenam-enam kad tiga dimensi untuk menguasai perangkap tidak sah dan syarat kemunasabahan!","title":"Kesahan Bentuk I, II, III vs Kemunasabahan Hujah Deduktif","acronym":"I•II•III","hook":"Kesahan = patuhi Bentuk I, II atau III (struktur sahaja)! Kemunasabahan = semua premis & kesimpulan benar! Dua bentuk palsu ialah menafikan p atau mengesahkan q!","summary":"Hanya hujah yang menepati jadual Bentuk I, Bentuk II atau Bentuk III diiktiraf sebagai sah secara deduktif, manakala kebenaran ayat menentukan kemunasabahannya.","bullets":["3 Bentuk Sah: Bentuk I (Semua A ialah B; C ialah A -> C ialah B) | Bentuk II (Jika p, maka q; p benar -> q benar) | Bentuk III (Jika p, maka q; ~q benar -> ~p benar). Sebarang hujah dengan Premis 2 berbentuk 'q benar' atau '~p benar' adalah TIDAK SAH.","Sah vs Munasabah (Rangsangan Minda 6 & Contoh 17): Hujah yang mematuhi Bentuk I/II/III tetap SAH walaupun Premis 1 palsu (tetapi Tidak Munasabah). Sebaliknya, hujah berstruktur salah tetap TIDAK SAH walaupun semua premisnya benar!"],"labId":"mat43_hujah_flip","labTitle":"Dek Kad 3D: Bentuk I, II, III & Perangkap Tidak Sah","formula":"Bentuk I: C∈A->C∈B   |   Bentuk II: p->q, p => q   |   Bentuk III: p->q, ~q => ~p","examTip":"Dalam soalan struktur Kertas 2, apabila hujah tidak sah, tulis alasan tepat: 'Tidak sah kerana tidak mematuhi mana-mana bentuk hujah deduktif yang sah.'"},{"type":"match","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Struktur Hujah Bentuk I–III","voiceCaption":"Padankan lima contoh hujah deduktif dengan klasifikasi Bentuk I, Bentuk II, Bentuk III atau Tidak Sah.","voiceScript":"[confident] Uji ketepatan kamu memadankan hujah dengan struktur silogismenya! Tentukan sama ada setiap hujah memenuhi Bentuk satu, Bentuk dua, Bentuk tiga, atau terperangkap dalam struktur tidak sah.","prompt":"Padankan setiap hujah berikut dengan pengelasan bentuknya yang tepat:","pairs":[{"id":"u4m1","left":"Semua kubus ialah kuboid; Objek P ialah kubus -> Objek P ialah kuboid.","right":"Sah — Bentuk I (Semua A ialah B; C ialah A -> C ialah B)"},{"id":"u4m2","left":"Jika 3m = 2n, maka m : n = 2 : 3; 3m = 2n -> m : n = 2 : 3.","right":"Sah — Bentuk II (Mengesahkan Antejadian: p benar -> q benar)"},{"id":"u4m3","left":"Jika garis l1 selari l2, maka kecerunan m1 = m2; m1 ≠ m2 -> l1 tidak selari l2.","right":"Sah — Bentuk III (Menafikan Akibat: ~q benar -> ~p benar)"},{"id":"u4m4","left":"Semua rombus berpepenjuru serenjang; PQRS berpepenjuru serenjang -> PQRS ialah rombus.","right":"Tidak Sah — Premis 2 menyebut ciri B (bukan A)"},{"id":"u4m5","left":"Jika k > 5, maka k² > 25; k <= 5 -> k² <= 25.","right":"Tidak Sah — Premis 2 menafikan antejadian (~p), bukan akibat (~q)"}],"explanation":"Hanya 3 pola struktur sah diterima. Mengesahkan B/q (contoh rombus) atau menafikan antejadian ~p (contoh k <= 5, padahal k = -6 memberi (-6)² = 36 > 25!) adalah tidak sah."},{"type":"predict","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Ramal Status Kesahan & Munasabah","voiceCaption":"Ramalkan sama ada hujah 'Semua pelakon pandai menari; Jasmine ialah pelakon -> Jasmine pandai menari' adalah sah atau munasabah.","voiceScript":"[curious] Cuba jawab perangkap klasik buku teks di muka surat tujuh puluh enam! Premis satu berbunyi semua pelakon pandai menari, Premis dua Jasmine ialah pelakon, dan Kesimpulannya Jasmine pandai menari. Adakah hujah ini sah dan adakah ia munasabah?","hook":"Ingat: kebenaran dunia nyata tidak membatalkan kesahan struktur, tetapi ia menentukan kemunasabahan!","scenario":"Premis 1: Semua pelakon pandai menari. | Premis 2: Jasmine ialah seorang pelakon. | Kesimpulan: Jasmine pandai menari.","prompt":"Apakah status kesahan dan kemunasabahan hujah deduktif di atas?","options":["SAH kerana mematuhi Bentuk I, tetapi TIDAK MUNASABAH kerana Premis 1 adalah palsu.","TIDAK SAH dan TIDAK MUNASABAH kerana bukan semua pelakon pandai menari.","TIDAK SAH tetapi MUNASABAH kerana Jasmine mungkin seorang penari.","SAH dan MUNASABAH kerana Premis 2 serta struktur Bentuk I adalah tepat."],"correctIndex":0,"proofLabId":"mat43_bentuk_hujah_deduktif_lab","proofState":{"tab":"deduktif","dedIdx":1},"explanation":"Hujah ini SAH kerana strukturnya sepadan dengan Bentuk I (Semua A ialah B; C ialah A -> C ialah B). Namun ia TIDAK MUNASABAH kerana Premis 1 ('Semua pelakon pandai menari') adalah palsu."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Lengkapkan Premis Bentuk III","voiceCaption":"Bina Premis 2 yang tepat mengikut Bentuk III bagi melengkapkan hujah deduktif daripada Contoh 20(c).","voiceScript":"[serious] Lengkapkan Premis dua untuk membentuk hujah deduktif sah Bentuk tiga! Premis satu: Jika x sama dengan k, maka k ialah punca bagi persamaan tiga x kuasa dua tolak lima sama dengan dua belas. Kesimpulan: x tidak sama dengan sembilan.","prompt":"Susun Premis 2 yang tepat bagi hujah Bentuk III (Contoh 20c):\nPremis 1: Jika x = k, maka k ialah punca bagi persamaan 3x² - 5 = 12.\nPremis 2: [________]\nKesimpulan: x ≠ 9.","hint":"Kesimpulan ialah ~p (x ≠ 9), maka Premis 2 mestilah ~q bagi nilai k = 9...","answerTokens":["9 bukan punca","bagi persamaan","3x² - 5 = 12"],"distractors":["9 ialah punca","x = 9"],"explanation":"Mengikut Bentuk III (Jika p, maka q; bukan q benar -> bukan p benar), apabila kesimpulan ialah ~p (x ≠ 9, iaitu k = 9), maka Premis 2 mestilah ~q: '9 bukan punca bagi persamaan 3x² - 5 = 12'."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Lengkapkan Kesimpulan Kuadratik","voiceCaption":"Gunakan Bentuk II untuk membina kesimpulan deduktif bagi persamaan kuadratik mempunyai punca nyata.","voiceScript":"[confident] Soalan penutup Unit empat daripada Contoh sembilan belas b! Diberi Premis satu: Jika a x kuasa dua tambah b x tambah c sama dengan sifar mempunyai punca nyata, maka b kuasa dua tolak empat a c lebih besar atau sama dengan sifar. Premis dua: dua x kuasa dua tambah p x tolak dua sama dengan sifar mempunyai punca nyata. Apakah kesimpulannya?","prompt":"Lengkapkan kesimpulan hujah deduktif yang sah dan munasabah berikut (Contoh 19b):\nPremis 1: Jika ax² + bx + c = 0 mempunyai punca nyata, maka b² - 4ac >= 0.\nPremis 2: 2x² + px - 2 = 0 mempunyai punca nyata.","options":["Kesimpulan: p² - 4(2)(-2) >= 0","Kesimpulan: p² - 4(2)(2) >= 0","Kesimpulan: 2x² + px - 2 = 0 tidak mempunyai punca nyata","Kesimpulan: p² - 4(2)(-2) < 0"],"correctIndex":0,"explanation":"Mengikut Bentuk II (p -> q; p benar -> q benar), gantikan pekali a = 2, b = p dan c = -2 daripada 2x² + px - 2 = 0 ke dalam b² - 4ac >= 0, menghasilkan p² - 4(2)(-2) >= 0."}]},{"id":"mat43-u5","title":"Unit 5: Kekuatan Induktif, Pola & Masalah KBAT","subtitle":"Subtopik 3.2 (Bhg. B) — Kuat/Meyakinkan, Pembinaan Rumus Pola Nombor & Masalah Harian","iconType":"graph","iconUrl":"../assets/icons/mat43-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Kekuatan & Keyakinan Induktif","voiceCaption":"Kekuatan hujah induktif bergantung kepada kebenaran kesimpulannya, manakala hujah kuat hanya meyakinkan apabila kesemua premisnya benar.","voiceScript":"[warm] Selamat datang ke Unit lima! Berbeza dengan hujah deduktif yang menilai kesahan, hujah induktif menilai kekuatan dan keyakinan. Ingat dua rahsia utama Contoh dua puluh satu: bilangan premis yang banyak TIDAK menjamin hujah kuat kerana kekuatan bergantung pada kebenaran kesimpulan! Dan jika hujah itu kuat tetapi ada satu premisnya palsu seperti mendakwa satu ialah nombor perdana, hujah itu tetap TIDAK meyakinkan!","title":"Kekuatan (Kuat vs Lemah) & Keyakinan Hujah Induktif","acronym":"K•M•P","hook":"Hujah LEMAH sentiasa tidak meyakinkan! Hujah KUAT pula hanya MEYAKINKAN apabila 100% premisnya bernilai benar!","mediaKey":"mat43_pola_induktif","summary":"Kekuatan hujah induktif diukur berdasarkan tahap kemungkinan kesimpulan itu benar, manakala sifat meyakinkan bergantung pada kebenaran semua premis serta kesimpulannya.","bullets":["Kuat vs Lemah (Contoh 21): Bilangan premis yang banyak tidak menjamin hujah kuat. Empat premis 'kerusi di 4 bilik berwarna merah -> semua kerusi di rumah merah' tetap LEMAH kerana kesimpulan mungkin palsu (kerusi dapur boleh berwarna lain).","Meyakinkan vs Tidak Meyakinkan: Hujah lemah sentiasa tidak meyakinkan. Hujah kuat seperti '1, 2, 3, 5 ialah nombor perdana -> nombor perdana boleh dibahagi 1 & diri sendiri' adalah KUAT tetapi TIDAK MEYAKINKAN kerana Premis 1 (1 ialah nombor perdana) adalah palsu!"],"labId":"mat43_bentuk_hujah_deduktif_lab","labTitle":"Penguji Kekuatan & Keyakinan Induktif","labProps":{"tab":"induktif","indIdx":2},"formula":"Lemah => Tidak Meyakinkan   |   Kuat + Premis Palsu => Tidak Meyakinkan   |   Kuat + Semua Premis Benar => Meyakinkan","examTip":"Semak nombor perangkap dalam premis soalan induktif: misalnya '1 ialah nombor perdana' atau '40 ialah gandaan 6' yang sengaja diletak untuk menjadikan hujah Kuat tetapi Tidak Meyakinkan!"},{"type":"sort","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Isih Kekuatan & Keyakinan Induktif","voiceCaption":"Kelaskan enam hujah induktif berikut kepada Kuat & Meyakinkan, Kuat tetapi Tidak Meyakinkan, atau Lemah & Tidak Meyakinkan.","voiceScript":"[curious] Mari latih ketajaman mengaudit hujah induktif! Asingkan keenam-enam hujah daripada Contoh dua puluh satu dan Praktis Kendiri tiga perpuluhan dua d ke dalam tiga kategori yang tepat.","prompt":"Kelaskan setiap hujah induktif berikut mengikut status kekuatan dan keyakinannya:","buckets":[{"id":"kuat_yakin","label":"Kuat & Meyakinkan"},{"id":"kuat_tak","label":"Kuat tetapi Tidak Meyakinkan"},{"id":"lemah","label":"Lemah & Tidak Meyakinkan"}],"items":[{"text":"27 ialah gandaan 3; 81 ialah gandaan 3. Maka semua gandaan 9 ialah gandaan 3.","bucketId":"kuat_yakin","note":"Kedua-dua premis dan kesimpulan adalah benar."},{"text":"11 × 5 = 55; 12 × 5 = 60. Maka semua gandaan 5 berakhir dengan digit 0 atau 5.","bucketId":"kuat_yakin","note":"Kesemua premis benar dan kesimpulan matematiknya benar."},{"text":"24 ialah gandaan 6; 36 ialah gandaan 6; 40 ialah gandaan 6. Maka semua gandaan 6 ialah nombor genap.","bucketId":"kuat_tak","note":"Kesimpulan benar (kuat), tetapi Premis 3 palsu kerana 40 bukan gandaan 6!"},{"text":"1 ialah nombor perdana; 2, 3, 5 ialah nombor perdana. Maka nombor perdana boleh dibahagi tepat dengan 1 dan dirinya sendiri.","bucketId":"kuat_tak","note":"Kesimpulan benar (kuat), tetapi Premis 1 palsu kerana 1 bukan nombor perdana."},{"text":"Ikan kembung bernafas dengan insang; ikan yu bernafas dengan insang. Maka semua ikan bernafas dengan insang.","bucketId":"lemah","note":"Kesimpulan palsu (terdapat ikan bernafas selain insang seperti ikan peparu), maka lemah & tidak meyakinkan."},{"text":"Tikus, kucing dan kuda mempunyai 4 kaki. Maka semua haiwan mempunyai 4 kaki.","bucketId":"lemah","note":"Kesimpulan jelas palsu (burung berkaki 2, ular tiada kaki), maka lemah."}],"explanation":"Sentiasa periksa dua perkara berasingan: kebenaran kesimpulan (menentukan Kuat vs Lemah), diikuti kebenaran setiap premis (menentukan Meyakinkan vs Tidak Meyakinkan)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Pembinaan Rumus Pola & KBAT","voiceCaption":"Ikut tiga langkah penaakulan induktif untuk membina rumus umum pola nombor, kemudian buat ramalan secara deduktif bagi masalah harian.","voiceScript":"[warm] Bagaimana pula hendak membina hujah induktif yang kuat bagi pola nombor dan menyelesaikan masalah harian K B A T? Ikut tiga langkah mudah: pertama, teliti kes khusus seperti dua ratus tujuh puluh, lima ratus dua puluh, tujuh ratus tujuh puluh; kedua, kesan ciri sepunya; ketiga, tuliskan rumus umum bersama julat nilai n, misalnya dua ratus lima puluh n tambah dua puluh bagi n sama dengan satu, dua, tiga, empat dan seterusnya!","title":"Membina Rumus Umum Pola Nombor & Masalah Logik KBAT","acronym":"T•C•R","hook":"Jangan lupa menulis julat n (contohnya ; n = 1, 2, 3, 4, ... atau ; n = 0, 1, 2, ...) di sebelah rumus induktif untuk elak hilang markah Kertas 2!","summary":"Penaakulan induktif menukar jadual pemerhatian kepada rumus algebra am, yang kemudiannya diguna secara deduktif untuk meramal kuantiti atau menyelesaikan masalah.","bullets":["3 Langkah Membina Rumus Induktif (Contoh 22): (1) Teliti contoh khusus (cth. 0, 9, 24, 45); (2) Kenal pasti pola operasi tetap (3(1)² - 3, 3(2)² - 3, ...); (3) Nyatakan rumus umum bersama domain n -> 3n² - 3 ; n = 1, 2, 3, 4, ...","Gabungan Induktif + Deduktif KBAT (Contoh 23): Dalam masalah pertumbuhan sel P(t) = 2^t atau pengeluaran kilang, bina/gunakan rumus am secara deduktif untuk mengira nilai sasaran pada hari atau jam tertentu serta mencadangkan langkah penyelesaian."],"labId":"mat43_bentuk_hujah_deduktif_lab","labTitle":"Pembina Rumus Pola Nombor Induktif","labProps":{"tab":"induktif","indIdx":0,"nMax":4},"formula":"Rumus Induktif Wajib Ada Julat:  ung_n ; n = 1, 2, 3, ...  (atau mula n = 0)","examTip":"Jika pola bermula dengan 2(0) + 1 = 1 atau 20 - 4⁰ = 19, pastikan julat n ditulis bermula daripada n = 0, bukan n = 1!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Ramal Pengeluaran Kilang TOY","voiceCaption":"Gunakan rumus induktif 250n + 20 untuk meramal pengeluaran harian 15 jam dan menyemak sama ada pesanan 25 000 unit dapat disiapkan dalam 5 hari.","voiceScript":"[curious] Cuba selesaikan kes Kilang Mainan dari Contoh dua puluh tiga b! Pengeluaran dari pukul lapan hingga sebelas pagi memberi rumus umum dua ratus lima puluh n tambah dua puluh. Jika kilang beroperasi lima belas jam sehari selama lima hari seminggu, mampukah ia menyiapkan pesanan dua puluh lima ribu kereta mainan?","hook":"Kirakan hasil 15 jam dahulu: 250(15) + 20 = 3 770 unit sehari, lalu darabkan dengan 5 hari!","scenario":"Kilang TOY menghasilkan 270, 520, 770, 1 020 kereta mainan bagi 4 jam pertama (rumus 250n + 20) dan beroperasi 15 jam sehari (7 pagi – 10 malam) selama 5 hari seminggu.","prompt":"Adakah Kilang TOY mampu menyiapkan pesanan 25 000 unit dalam seminggu, dan apakah cadangan penyelesaiannya?","options":["Tidak mampu (5 × 3 770 = 18 850 < 25 000). Cadangan: panjangkan operasi kepada 20 jam sehari untuk hasilkan 250(20)+20 = 5 020 sehari (25 100 seminggu).","Mampu kerana 250(15) + 20 = 5 000 sehari, menghasilkan tepat 25 000 unit dalam 5 hari.","Tidak mampu kerana hanya menghasilkan 15 000 unit; perlu tambah waktu operasi kepada 16 jam sehari sahaja.","Mampu kerana waktu operasi 7 pagi hingga 10 malam bersamaan 17 jam sehari, melebihi 25 000 unit."],"correctIndex":0,"proofLabId":"mat43_bentuk_hujah_deduktif_lab","proofState":{"tab":"induktif","indIdx":0,"nMax":5},"explanation":"Dari 7 pagi ke 10 malam = 15 jam: 250(15) + 20 = 3 770 unit sehari. Dalam 5 hari: 3 770 × 5 = 18 850 unit (< 25 000). Dengan memanjangkan operasi kepada 20 jam sehari: 5 × [250(20)+20] = 5 × 5 020 = 25 100 > 25 000."},{"type":"match","xp":15,"voiceIdKey":"u5-s5","voiceToneLabel":"Padan Pola Nombor & Rumus","voiceCaption":"Padankan lima jujukan pola nombor daripada Contoh 22 dan Praktis Sumatif dengan rumus kesimpulan induktifnya yang tepat.","voiceScript":"[confident] Uji kemahiran kamu menyimpulkan rumus am daripada pola nombor! Padankan setiap jujukan berikut dengan rumus umum serta julat n yang betul.","prompt":"Padankan setiap pola nombor di kiri dengan kesimpulan induktifnya di kanan:","pairs":[{"id":"u5m1","left":"1/1, 1/2, 1/3, 1/4, ...","right":"n⁻¹ ; n = 1, 2, 3, 4, ..."},{"id":"u5m2","left":"0.5, 0.25, 0.125, 0.0625, ...","right":"(0.5)ⁿ ; n = 1, 2, 3, 4, ..."},{"id":"u5m3","left":"0, 9, 24, 45, ...","right":"3n² - 3 ; n = 1, 2, 3, 4, ..."},{"id":"u5m4","left":"-4, -1, 4, 11, ...","right":"n² - 5 ; n = 1, 2, 3, 4, ..."},{"id":"u5m5","left":"4, 5, 7, 11, ...","right":"2ⁿ + 3 ; n = 0, 1, 2, 3, ..."}],"explanation":"Sentiasa uji sebutan pertama dan kedua ke dalam rumus: untuk 4, 5, 7, 11 apabila n = 0 -> 2⁰ + 3 = 1 + 3 = 4, dan n = 1 -> 2¹ + 3 = 5."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Susun Induksi Sinus & Kosinus","voiceCaption":"Susun kesimpulan induktif menghubungkan nisbah trigonometri sin theta dengan kos (90 darjah tolak theta) daripada Latihan m/s 89.","voiceScript":"[warm] Susun kesimpulan induktif daripada aktiviti segi tiga bersudut tegak! Perhatikan bahawa sin enam puluh darjah sama dengan kos tiga puluh darjah, sin empat puluh darjah sama dengan kos lima puluh darjah, dan sin dua puluh darjah sama dengan kos tujuh puluh darjah.","prompt":"Susun kesimpulan induktif bagi hubungan fungsi sinus dan kosinus (Praktis 3.2f Q4b):","hint":"Sudut-sudut pelengkap berjumlah 90° menghasilkan nilai sinus dan kosinus yang sama...","answerTokens":["Berdasarkan pola sin 60° = kos 30°,","sin 40° = kos 50° dan sin 20° = kos 70°,","disimpulkan secara induktif bahawa","sin θ = kos (90° - θ)"],"distractors":["sin θ = kos (180° - θ)","tan θ = sin (90° - θ)"],"explanation":"Setiap pasangan sudut berjumlah 90° (60°+30°, 40°+50°, 20°+70°) memberi nilai sin dan kos yang sama, membolehkan kita meramal kos 10° = sin 80° = 0.9848 secara induktif."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s7","voiceToneLabel":"Deduktif Eksponen Sel Biologi","voiceCaption":"Hitung bilangan sel pada hari ke-8 dan hari apabila bilangan sel mencapai 2 048 mengikut rumus P(t) = 2 kuasa t.","voiceScript":"[excited] Soalan penutup Unit lima daripada Contoh dua puluh tiga! Pertumbuhan sejenis sel mematuhi fungsi P t sama dengan dua kuasa t dengan t ialah bilangan hari. Hitung secara deduktif bilangan sel pada hari kelapan serta hari keberapakah sel baharu berjumlah dua ribu empat puluh lapan!","prompt":"Bilangan sel baharu selepas t hari diberi secara umum sebagai P(t) = 2^t. Hitung secara deduktif bilangan sel pada hari ke-8 serta nilai t apabila P(t) = 2 048:","options":["Hari ke-8: 256 sel ; 2 048 sel terhasil pada hari ke-11","Hari ke-8: 128 sel ; 2 048 sel terhasil pada hari ke-10","Hari ke-8: 512 sel ; 2 048 sel terhasil pada hari ke-12","Hari ke-8: 256 sel ; 2 048 sel terhasil pada hari ke-9"],"correctIndex":0,"explanation":"Pada t = 8: P(8) = 2⁸ = 256 sel. Untuk 2^t = 2 048, tukar kepada asas 2 iaitu 2^t = 2¹¹, maka t = 11 (hari ke-11)."}]},{"id":"mat43-u6","title":"Unit 6: Cabaran Boss SPM — Penaakulan Logik","subtitle":"6 Pusingan Sintesis Praktis Sumatif Kertas 1 & Kertas 2 Berformat SPM Sebenar","iconType":"trophy","iconUrl":"../assets/icons/mat43-u6.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Pernyataan, Majmuk & Pengkuantiti","voiceCaption":"Kenal pasti ayat yang merupakan pernyataan bernilai benar daripada himpunan soalan Praktis Sumatif nombor satu hingga tiga.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M Bab tiga! Untuk pusingan pertama daripada Praktis Sumatif: antara empat ayat dan gabungan matematik berikut, kenal pasti satu-satunya pernyataan yang sah serta bernilai benar!","stimulusHtml":"<div class='stimulus-box'><strong>Cabaran Boss Pusingan 1:</strong> Tapis antara bukan pernyataan, pernyataan palsu dan pernyataan benar.</div>","prompt":"Antara berikut, yang manakah merupakan suatu PERNYATAAN yang bernilai BENAR?","options":["{2, 5} ⊂ ({2, 3, 6} ∪ {5, 7}) atau n(∅) = 0","Selesaikan persamaan x³ = 3x² + 3x - 1.","3x + 5 = 6","Semua pepenjuru adalah pembahagi dua sama serenjang."],"correctIndex":0,"explanation":"{2, 3, 6} ∪ {5, 7} = {2, 3, 5, 6, 7}, maka {2, 5} memang subset baginya (Benar), dan n(∅) = 0 juga Benar! 'Selesaikan...' ialah ayat perintah (bukan pernyataan), 3x + 5 = 6 ialah persamaan terbuka (bukan pernyataan), dan pepenjuru segi empat tepat tidak berserenjang (Palsu)."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Kontrapositif & Penyangkal","voiceCaption":"Ramalkan bentuk kontrapositif bagi 'Jika k² > 0, maka k > 0', nilai kebenarannya serta contoh penyangkal daripada Contoh 15(e).","voiceScript":"[curious] Pusingan kedua Boss! Diberi implikasi: Jika k kuasa dua lebih besar daripada sifar, maka k lebih besar daripada sifar. Apakah kontrapositifnya, apakah nilai kebenarannya, dan apakah contoh penyangkal terbaiknya?","hook":"Awas nombor negatif! Kuasa dua nombor negatif masih positif!","scenario":"Diberi implikasi p -> q iaitu: 'Jika k² > 0, maka k > 0' (Contoh 15e).","prompt":"Manakah pernyataan KONTAPOSITIF yang tepat berserta nilai kebenaran dan contoh penyangkalnya?","options":["Jika k <= 0, maka k² <= 0; Palsu kerana k = -2 <= 0 tetapi (-2)² = 4 > 0.","Jika k > 0, maka k² > 0; Benar bagi semua nilai positif k.","Jika k² <= 0, maka k <= 0; Benar kerana hanya k = 0 memenuhi syarat ini.","Jika k < 0, maka k² < 0; Palsu kerana k = 2 > 0 memberi 2² = 4 > 0."],"correctIndex":0,"proofLabId":"mat43_akas_songsangan_kontra_lab","proofState":{"caseIdx":2,"activeForm":"kontra"},"explanation":"Kontrapositif (~q -> ~p) ialah 'Jika k <= 0, maka k² <= 0'. Ia bernilai Palsu (seperti implikasi asal) dengan contoh penyangkal k = -2, di mana -2 <= 0 tetapi (-2)² = 4 > 0."},{"type":"match","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Lengkapkan Premis & Rumus","voiceCaption":"Padankan lima soalan melengkapkan hujah deduktif dan kesimpulan induktif daripada Praktis Sumatif nombor tujuh dan sembilan.","voiceScript":"[confident] Pusingan ketiga Boss! Padankan setiap premis yang tidak lengkap serta pola nombor daripada Praktis Sumatif ini dengan pelengkapnya yang tepat!","prompt":"Padankan soalan hujah deduktif & induktif berikut dengan pelengkapnya yang sah:","pairs":[{"id":"b3m1","left":"P1: Semua faktor 4 ialah faktor 8 | P2: 2 ialah faktor 4","right":"Kesimpulan Bentuk I: 2 ialah faktor bagi 8"},{"id":"b3m2","left":"P1: Jika x = 5, maka 2x + 8 = 18 | K: 2x + 8 = 18","right":"Premis 2 Bentuk II: x = 5"},{"id":"b3m3","left":"P1: Jika α = β, maka sin² α + kos² β = 1 | P2: sin² α + kos² β ≠ 1","right":"Kesimpulan Bentuk III: α ≠ β"},{"id":"b3m4","left":"P1: Jika -4m < 0, maka m > 0 | K: -4m >= 0","right":"Premis 2 Bentuk III: m <= 0"},{"id":"b3m5","left":"5 = 4(1) + 1, 12 = 4(2) + 4, 21 = 4(3) + 9, 32 = 4(4) + 16","right":"Induktif: 4n + n² ; n = 1, 2, 3, 4, ..."}],"explanation":"Setiap hujah deduktif memadankan pola tepat Bentuk I, II atau III (perhatikan penafian m > 0 menjadi m <= 0), manakala 1, 4, 9, 16 ialah jujukan n² dalam 4n + n²."},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Deduksi Luas Lima Kon","voiceCaption":"Susun kesimpulan deduktif bagi menghitung jumlah luas permukaan lima buah kon yang sama daripada Praktis Sumatif nombor lapan.","voiceScript":"[serious] Pusingan keempat Boss! Diberi rumus am luas permukaan sebuah kon ialah pi j dalam kurungan j tambah s. Susun langkah kesimpulan deduktif bagi mencari jumlah luas permukaan lima kon seragam dengan jejari tujuh sentimeter dan panjang sendeng tiga belas sentimeter!","prompt":"Bina kesimpulan deduktif bagi jumlah luas permukaan 5 kon yang sama (j = 7 cm, s = 13 cm, π = 22/7; Praktis Sumatif Q8a):","hint":"Luas 1 kon = (22/7)(7)(7 + 13) = 440 cm², darabkan dengan 5 buah kon...","answerTokens":["Jumlah luas permukaan","lima kon ialah","5 × (22/7)(7)(7 + 13)","= 2 200 cm²"],"distractors":["= 440 cm²","5 × (22/7)(13)(7 + 13)"],"explanation":"Luas permukaan 1 kon = (22/7) × 7 × 20 = 440 cm². Secara deduktif bagi 5 buah kon yang sama, jumlah luasnya ialah 5 × 440 = 2 200 cm²."},{"type":"sort","xp":25,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss 5: Audit Kesahan & Munasabah","voiceCaption":"Audit enam hujah deduktif berikut kepada kumpulan Sah serta Munasabah atau kumpulan Tidak Sah ataupun Tidak Munasabah.","voiceScript":"[confident] Pusingan kelima Boss! Lakukan audit penuh terhadap keenam-enam hujah deduktif ini. Bezakan mana satu yang benar-benar sah dan munasabah berbanding yang melanggar bentuk atau mempunyai premis palsu!","prompt":"Audit setiap hujah berikut mengikut kriteria kesahan dan kemunasabahannya:","buckets":[{"id":"sah_munasabah","label":"Sah & Munasabah"},{"id":"gagal","label":"Tidak Sah atau Tidak Munasabah"}],"items":[{"text":"Semua gandaan 6 ialah gandaan 3. 18 ialah gandaan 6. Maka 18 ialah gandaan 3.","bucketId":"sah_munasabah","note":"Mematuhi Bentuk I dan semua premis serta kesimpulan benar."},{"text":"Jika x nombor genap, maka 3x nombor genap. 3x bukan nombor genap. Maka x bukan nombor genap.","bucketId":"sah_munasabah","note":"Mematuhi Bentuk III (~q -> ~p) dengan premis dan kesimpulan yang benar."},{"text":"Semua segi empat sama bersudut tepat. PQRS ialah segi empat sama. Maka PQRS bersudut tepat.","bucketId":"sah_munasabah","note":"Mematuhi Bentuk I dengan semua pernyataan benar."},{"text":"Semua gandaan 5 ialah gandaan 10. 35 ialah gandaan 5. Maka 35 ialah gandaan 10.","bucketId":"gagal","note":"Sah mengikut Bentuk I, tetapi TIDAK MUNASABAH kerana Premis 1 dan kesimpulan palsu."},{"text":"Jika k boleh dibahagi dengan 8, maka boleh dibahagi dengan 4. 12 tidak boleh dibahagi dengan 8. Maka 12 tidak boleh dibahagi dengan 4.","bucketId":"gagal","note":"TIDAK SAH (menafikan antejadian ~p) dan kesimpulannya palsu (12 ÷ 4 = 3)."},{"text":"Semua rombus berpepenjuru serenjang. KLMN berpepenjuru serenjang. Maka KLMN ialah rombus.","bucketId":"gagal","note":"TIDAK SAH kerana Premis 2 mengesahkan ciri B, bukan kategori A (lelayang juga berpepenjuru serenjang)."}],"explanation":"Sesuatu hujah hanya dikira Sah & Munasabah apabila mematuhi salah satu Bentuk I, II atau III DAN kesemua premis serta kesimpulannya bernilai benar."},{"type":"mcq","xp":30,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Pola Semi Bulatan","voiceCaption":"Gunakan rumus pola perimeter semi bulatan 2 kuasa (6 tolak n) darab (pi tambah 2) daripada Praktis Sumatif nombor dua belas untuk menghitung perimeter semi bulatan kelapan.","voiceScript":"[excited] Soalan penutup Unit Boss daripada Praktis Sumatif nombor dua belas! Empat semi bulatan disusun mengikut pola pengecilan dengan jejari terbesar tiga puluh dua sentimeter dan rumus perimeter dua kuasa enam tolak n darab pi tambah dua. Hitung secara deduktif perimeter semi bulatan yang kelapan dalam sebutan pi!","stimulusHtml":"<div class='stimulus-box'><strong>Praktis Sumatif Q12:</strong> Perimeter semi bulatan ke-<em>n</em> mematuhi pola umum <strong>2^(6 - n) × (π + 2) cm</strong> bagi <em>n</em> = 1, 2, 3, 4, ...</div>","prompt":"Berdasarkan rumus pola umum 2^(6 - n) × (π + 2) cm, berapakah perimeter bagi semi bulatan yang ke-8 (n = 8) dalam sebutan π?","options":["0.25(π + 2) cm  [iaitu (π + 2)/4 cm]","0.5(π + 2) cm  [iaitu (π + 2)/2 cm]","4(π + 2) cm","0.125(π + 2) cm  [iaitu (π + 2)/8 cm]"],"correctIndex":0,"explanation":"Gantikan n = 8 ke dalam rumus deduktif: 2^(6 - 8) × (π + 2) = 2⁻²(π + 2) = (1/4)(π + 2) = 0.25(π + 2) cm. Tahniah — anda telah menguasai keseluruhan Bab 3 Penaakulan Logik KSSM!"}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {

  }

}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var fullNotesItems = bullets.map(function (b, idx) {

  var deepDrawerHtml = !isBite
    ? '<details class="nota-deep-drawer">' +
        "<summary>" + tUi("Nota Lengkap Buku Teks &amp; Tip SPM", "Full Textbook Notes &amp; SPM Tip") + "</summary>" +
        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
