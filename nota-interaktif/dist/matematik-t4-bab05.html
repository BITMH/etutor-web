  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab05","subject":"Matematik","subjectGroup":"teras","form":4,"chapterNumber":5,"title":"Bab 5: Rangkaian dalam Teori Graf","subtitle":"Subtopik 5.1 KSSM (35 Langkah Bit-by-Bit) — Bucu V, Tepi E, Darjah d(v), Teorem ∑d = 2E, Graf Mudah vs Berbilang Tepi & Gelung, Graf Terarah vs Tak Terarah, Graf Berpemberat, Subgraf, Pokok Minimum & Masalah Rangkaian Pengangkutan.","estimatedMinutes":30,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t4-bab05-labs.js","coverIcon":"../assets/icons/mat45-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep teori graf kamu memang mantap!","combo":"[laughs warmly] Kombo yang hebat! Bucu dan tepi dalam minda kamu bersambung dengan cukup kemas!","encourage":"[warm] Hampir tepat! Cuba semak semula bilangan bucu, tepi dan arah anak panah dengan tenang.","celebrate":"[excited] Tahniah! Satu lagi unit Matematik Tingkatan empat Bab lima berjaya ditakluki!"},"units":[{"id":"mat45-u1","title":"Unit 1: Asas Rangkaian, Bucu V, Tepi E & Darjah d(v)","subtitle":"Subtopik 5.1 (Bhg. A) — Pengenalan Rangkaian, Leonhard Euler (1735), Tatatanda G = (V, E), Graf Mudah vs Berbilang Tepi & Gelung","iconType":"atom","iconUrl":"../assets/icons/mat45-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pengenalan Rangkaian & Video 3D","voiceCaption":"Graf mewakilkan objek diskret sebagai bucu (V) dan hubungannya sebagai tepi (E) dalam struktur banyak kepada banyak.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan empat, Bab lima, Rangkaian dalam Teori Graf! Pernahkah kamu terfikir bagaimana sistem rel seperti L R T dan M R T, rangkaian sosial, mahupun Sistem Rangkaian Sejuk pengangkutan vaksin dimodelkan? Tonton klip video tiga dimensi ini dan teroka bagaimana bintik bucu V dihubungkan oleh garis tepi E membentuk rangkaian banyak kepada banyak!","title":"Konsep Graf & Rangkaian Dunia Sebenar (Pengangkutan, Sosial & Sejuk)","acronym":"V • E • BKB","hook":"Setiap rangkaian pengangkutan, internet mahupun Sistem Rangkaian Sejuk perubatan dibina daripada hubungan banyak kepada banyak antara Bucu (V) dan Tepi (E)!","mediaKey":"mat45_graf_rangkaian_hero","videoClip":{"src":"../assets/matematik-t4-bab05/video/mat45_video_graf_rangkaian.mp4","posterKey":"mat45_graf_rangkaian_hero","caption":"Bucu dan tepi saling berhubung membentuk rangkaian graf mudah, berbilang tepi serta gelung."},"summary":"Teori graf memodelkan objek diskret sebagai siri bintik (bucu, V) yang dihubungkan melalui garis atau lengkung (tepi, E) bagi menggambarkan perkaitan banyak kepada banyak.","bullets":["Rangkaian Pengangkutan & Perubatan: Dalam rangkaian pengangkutan darat (LRT, MRT, monorel, jalan raya), kawasan/stesen/bandar ialah BUCU dan jalan raya/landasan rel ialah TEPI. Dalam bidang perubatan, Sistem Rangkaian Sejuk mengangkut dan menyimpan vaksin serta darah pada julat suhu tetap.","Rangkaian Sosial & Tatatanda G = (V, E): Dalam rangkaian sosial, individu/kumpulan/organisasi ialah BUCU dan jenis hubungan (kawan, rakan sekerja, keluarga) ialah TEPI. Struktur data rangkaian melibatkan hubungan banyak kepada banyak."],"labId":"mat45_konsep_graf_flip","labTitle":"Dek Kad 3D Jaringan Kata & Simulator Jambatan Euler","labProps":{"tab":"deck"},"examTip":"Bezakan peranan dalam soalan struktur: Bucu (V = vertex) mewakili entiti atau lokasi, manakala Tepi (E = edge) mewakili laluan atau ikatan hubungan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Bucu V vs Tepi E","voiceCaption":"Kelaskan enam unsur rangkaian pengangkutan dan sosial berikut kepada Bucu (V) atau Tepi (E).","voiceScript":"[curious] Jom uji kefahaman awal kamu! Asingkan keenam-enam unsur dunia nyata ini sama ada ia bertindak sebagai Bucu V ataupun Tepi E dalam model graf.","prompt":"Isihkan setiap unsur rangkaian pengangkutan dan sosial berikut sebagai Bucu (V) atau Tepi (E):","buckets":[{"id":"bucu","label":"Bucu (V — Bintik / Objek Diskret)"},{"id":"tepi","label":"Tepi (E — Garis Kaitan / Laluan)"}],"items":[{"text":"Bandar, pekan atau bangunan dalam rangkaian pengangkutan darat","bucketId":"bucu","note":"Lokasi diskret sentiasa diwakili sebagai bucu V."},{"text":"Lebuh raya dan landasan kereta api yang menyambungkan bandar","bucketId":"tepi","note":"Penghubung antara dua lokasi ialah tepi E."},{"text":"Individu, kumpulan atau organisasi dalam rangkaian sosial","bucketId":"bucu","note":"Entiti manusia atau organisasi dimodelkan sebagai bucu V."},{"text":"Ikatan persahabatan, rakan sekerja dan keluarga antara individu","bucketId":"tepi","note":"Jenis hubungan antara individu ialah tepi E."},{"text":"Stesen transit rel seperti KL Sentral dalam peta rangkaian rel","bucketId":"bucu","note":"Nama stesen bertindak sebagai bucu."},{"text":"Laluan jenis perkhidmatan tren (LRT, MRT, Komuter) antara stesen","bucketId":"tepi","note":"Garis laluan kereta api antara stesen ialah tepi."}],"explanation":"Bucu (V) mewakili objek, tempat atau individu; Tepi (E) pula ialah garis yang menyambungkan dua bucu tersebut seperti jalan, rel atau hubungan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Leonhard Euler, Graf Mudah & ∑d = 2E","voiceCaption":"Leonhard Euler merintis teori graf pada 1735; bagi graf mudah tanpa gelung atau berbilang tepi, jumlah darjah sentiasa dua kali ganda bilangan tepi.","voiceScript":"[confident] Tahukah kamu teori graf lahir pada tahun seribu tujuh ratus tiga puluh lima apabila Leonhard Euler menyelesaikan Masalah Tujuh Jambatan Konigsberg? Setiap graf ditulis dalam set pasangan tertib G sama dengan kurungan V koma E. Untuk graf mudah yang tiada gelung dan tiada berbilang tepi, jumlah darjah kesemua bucu ialah dua kali bilangan tepi iaitu sigma d v sama dengan dua E!","title":"Leonhard Euler (1735), Graf Mudah & Teorem ∑d(v) = 2E","acronym":"∑d = 2E","hook":"Setiap tepi menyentuh tepat 2 hujung bucu — itulah sebabnya jumlah darjah graf sentiasa bersamaan dua kali bilangan tepi!","mediaKey":"mat45_leonhard_euler","summary":"Suatu graf ditulis sebagai G = (V, E) dengan V sebagai set bucu dan E sebagai set pasangan bucu; graf mudah tidak mengandungi gelung atau berbilang tepi.","bullets":["Leonhard Euler & Tatatanda G = (V, E): Pada tahun 1735, Leonhard Euler (1707–1783) memodelkan 4 daratan sebagai bucu dan 7 jambatan sebagai tepi. Tatatanda graf ialah V = {v₁, v₂, ...} dan E = {(a₁, b₁), ...}.","Graf Mudah & Darjah d(v): Darjah bucu d(v) ialah bilangan hujung tepi yang bersambung pada bucu itu. Graf mudah tiada gelung dan tiada berbilang tepi. Contoh 1: n(V) = 6 dan n(E) = 7 memberikan ∑d(v) = 2(7) = 14."],"labId":"mat45_konsep_graf_flip","labTitle":"Peta Sungai Konigsberg & Graf Abstrak Euler 1735","labProps":{"tab":"euler","eulerView":"graf"},"formula":"G = (V, E)   |   ∑d(v) = 2E  (v ∈ V)","examTip":"Jika bilangan tepi n(E) = 9, maka jumlah darjah serta-merta ialah 2 × 9 = 18 tanpa perlu mengira darjah bucu satu demi satu."},{"type":"match","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Tatatanda & Nilai Graf Mudah","voiceCaption":"Padankan maklumat graf mudah berikut dengan nilai n(V), n(E) atau jumlah darjahnya yang tepat.","voiceScript":"[curious] Mari uji kepantasan pengiraan kamu menggunakan rumus sigma d sama dengan dua E! Padankan setiap pernyataan graf mudah di sebelah kiri dengan nilainya di sebelah kanan.","prompt":"Padankan setiap pernyataan atau set graf mudah di kiri dengan nilai tatatanda atau darjah yang betul:","pairs":[{"id":"u1m1","left":"V = {1, 2, 3, 4, 5, 6}, n(E) = 7","right":"Bilangan bucu 6; jumlah darjah = 14"},{"id":"u1m2","left":"Graf mudah dengan 7 bucu dan 9 tepi","right":"Jumlah darjah = 2 × 9 = 18"},{"id":"u1m3","left":"Bucu 6 hanya bersambung dengan bucu 5","right":"Darjah bucu tersebut ialah d(6) = 1"},{"id":"u1m4","left":"Tepi e = (P, U) dalam graf tak terarah mudah","right":"Menghubungkan pasangan bucu P dan U"},{"id":"u1m5","left":"Ciri mutlak graf mudah","right":"Bebas daripada gelung dan berbilang tepi"}],"explanation":"Dalam graf mudah, n(V) mengira bilangan bucu, n(E) mengira bilangan tepi, dan ∑d(v) sentiasa 2 × n(E)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"Berbilang Tepi, Gelung & Syarat Genap","voiceCaption":"Berbilang tepi mengaitkan dua bucu melalui lebih daripada satu tepi, manakala setiap gelung berpatah balik ke satu bucu dengan darjah sama dengan dua.","voiceScript":"[warm] Bagaimanakah jika dua bucu mempunyai lebih daripada satu jalan, atau satu jalan berpusing balik ke bucu yang sama? Itulah berbilang tepi dan gelung! Ingat fakta emas S P M: setiap gelung menyumbang darjah bernilai dua! Dan kerana jumlah darjah mesti dua kali bilangan tepi, sebarang jujukan darjah yang berjumlah ganjil seperti sebelas tidak boleh dilukis sebagai graf!","title":"Berbilang Tepi, Gelung (d = 2) & Syarat Jumlah Darjah Genap","acronym":"G=2 • GENAP","hook":"Satu gelung pada bucu S bermaksud kedua-dua hujung tepi melekat pada S — jadi darjah gelung ialah +2, bukan +1!","mediaKey":"mat45_jambatan_sungai","summary":"Berbilang tepi melibatkan dua bucu dengan lebih daripada satu tepi; gelung ialah tepi lengkung pada satu bucu bernilai 2 darjah; graf hanya boleh dilukis jika jumlah darjahnya genap.","bullets":["Berbilang Tepi vs Gelung (Contoh 3): Dalam E = {(P,U), (P,U), (S,S), ...}, pasangan (P,U) diulang dua kali sebagai berbilang tepi (2 darjah setiap tepi). Gelung (S,S) kembali kepada S dan menyumbang darjah = 2 kepada bucu S.","Syarat Graf Boleh Dilukis (Contoh 6): Jujukan 3, 2, 2, 1, 3 berjumlah 11 (GANJIL) -> TIDAK boleh dilukis. Jujukan 2, 1, 1, 3, 3, 2 berjumlah 12 (GENAP) -> BOLEH dilukis dengan E = 6 tepi."],"labId":"mat45_bucu_tepi_darjah_lab","labTitle":"Makmal Interaktif Bucu, Berbilang Tepi, Gelung & ∑d = 2|E|","labProps":{"preset":"bina","multiAB":true,"loopD":true,"edgeAC":true,"edgeBD":false},"formula":"Darjah 1 Gelung = 2   |   Graf Sah ⇔ ∑d(v) = Genap","examTip":"Kesilapan paling kerap murid SPM ialah mengira gelung sebagai +1 darjah. Sentiasa tambah +2 pada bucu yang mempunyai gelung!"},{"type":"predict","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Ramal Kesan Gelung & Berbilang Tepi","voiceCaption":"Ramalkan nilai n(E), darjah bucu D dan jumlah darjah keseluruhan apabila gelung serta berbilang tepi ditambah.","voiceScript":"[curious] Cuba ramalkan dahulu sebelum menguji pada makmal! Katakan sebuah segiempat mudah A B C D mempunyai empat tepi sisi dan satu pepenjuru A C. Sekarang kita tambah satu berbilang tepi kedua antara A dan B, serta satu gelung pada bucu D. Berapakah darjah bucu D dan jumlah darjah kesemua bucu?","prompt":"Sebuah graf bermula dengan 5 tepi mudah: (A,B), (B,C), (C,D), (A,D) dan (A,C). Kemudian, ditambah SATU berbilang tepi kedua antara A dengan B dan SATU gelung (D,D) pada bucu D. Apakah nilai d(D) dan ∑d(v) terbaharu?","scenario":"Sebelum ditambah: d(D) = 2 (daripada tepi CD dan AD), dan n(E) = 5.","options":["d(D) = 3 dan ∑d(v) = 13","d(D) = 4 dan ∑d(v) = 14","d(D) = 4 dan ∑d(v) = 12","d(D) = 3 dan ∑d(v) = 14"],"correctIndex":1,"proofLabId":"mat45_bucu_tepi_darjah_lab","proofState":{"preset":"bina","edgeAC":true,"edgeBD":false,"multiAB":true,"loopD":true,"selectedVertex":"D"},"explanation":"Penambahan gelung (D,D) menambah +2 kepada d(D), menjadikan d(D) = 2 + 2 = 4. Bilangan tepi menjadi 5 + 2 = 7 tepi, maka ∑d(v) = 2(7) = 14!","hook":"Uji jawapan kamu serta-merta dengan menyemak meter bucu D pada makmal bukti di bawah!"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Susun Bukti Jujukan Darjah","voiceCaption":"Susun langkah hujah untuk menguji sama ada jujukan darjah 3, 2, 2, 1, 3 boleh dilukis sebagai graf.","voiceScript":"[confident] Susun blok penerangan Kertas Dua berikut dengan tepat bagi membuktikan sama ada jujukan darjah tiga, dua, dua, satu, tiga boleh menghasilkan sebuah graf atau tidak.","prompt":"Susun hujah lengkap untuk menentukan sama ada jujukan darjah 3, 2, 2, 1, 3 boleh membentuk suatu graf:","hint":"Mulakan dengan mengira jumlah darjah, kemudian bandingkan dengan sifat nombor genap 2E.","answerTokens":["Jumlah darjah = 3 + 2 + 2 + 1 + 3","= 11,","iaitu nombor ganjil,","maka graf tidak boleh dilukis","kerana ∑d(v) mesti = 2E (genap)."],"distractors":["= 12,","maka graf mudah boleh dilukis"],"explanation":"Mengikut Contoh 6(a), 3 + 2 + 2 + 1 + 3 = 11. Kerana jumlah darjah adalah ganjil sedangkan ∑d(v) = 2E mesti genap, graf tidak boleh dilukis.","acceptedSequences":[["Jumlah darjah = 3 + 2 + 2 + 1 + 3","= 11,","iaitu nombor ganjil,","maka graf tidak boleh dilukis","kerana ∑d(v) mesti = 2E (genap)."]]},{"type":"mcq","xp":20,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Kiraan Contoh 3 KSSM","voiceCaption":"Hitung n(E), d(S) dan d(U) daripada set pasangan tertib graf berbilang tepi serta gelung.","voiceScript":"[curious] Soalan akhir Unit Satu! Diberi set tepi E mengandungi pasangan P Q, dua kali P U, Q R, Q U, R S, R T, gelung S S, S T dan T U. Hitung bilangan tepi n E, darjah bucu S dan jumlah darjah graf!","prompt":"Diberi suatu graf dengan V = {P, Q, R, S, T, U} dan set tepi E = {(P,Q), (P,U), (P,U), (Q,R), (Q,U), (R,S), (R,T), (S,S), (S,T), (T,U)}. Tentukan nilai d(S) dan ∑d(v).","options":["d(S) = 3 dan ∑d(v) = 19","d(S) = 4 dan ∑d(v) = 20","d(S) = 5 dan ∑d(v) = 20","d(S) = 4 dan ∑d(v) = 18"],"correctIndex":1,"explanation":"Terdapat n(E) = 10 tepi, maka ∑d(v) = 2 × 10 = 20. Bagi bucu S: ia terlibat dalam (R,S) [1], (S,T) [1], dan gelung (S,S) [2], maka d(S) = 1 + 1 + 2 = 4."}]},{"id":"mat45-u2","title":"Unit 2: Graf Terarah, Tak Terarah & Graf Berpemberat","subtitle":"Subtopik 5.1 (Bhg. B) — Arah Tepi (d_in & d_out), Gelung Terarah serta Pemberat Jarak, Masa & Kos","iconType":"graph","iconUrl":"../assets/icons/mat45-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Graf Terarah vs Tak Terarah","voiceCaption":"Graf terarah menandakan anak panah dari bucu awal ke bucu akhir dengan susunan pasangan tertib yang tetap.","voiceScript":"[warm] Selamat tiba di Unit Dua! Dalam dunia sebenar, banyak rangkaian bergerak sehala seperti sistem peredaran darah manusia, jalan raya sehala, aliran litar elektrik dan peta penerbangan. Inilah graf terarah, di mana susunan bucu dalam kurungan A koma B sangat berbeza daripada B koma A!","title":"Graf Terarah (Bucu Awal -> Bucu Akhir) vs Graf Tak Terarah","acronym":"AWAL → AKHIR","hook":"Dalam graf tak terarah, (A, B) sama dengan (B, A); tetapi dalam graf terarah, (B, A) bermaksud arah dari B ke A!","mediaKey":"mat45_lrt_rangkaian","summary":"Graf terarah mempunyai anak panah pada setiap tepi bagi menunjukkan arah dari bucu awal ke bucu akhir, sedangkan graf tak terarah tiada penandaan arah.","bullets":["Graf Terarah & Aplikasi Nyata: Tepi bertanda anak panah menentukan bucu awal dan bucu akhir — misalnya bagi e = (B, A), B ialah bucu awal dan A ialah bucu akhir. Digunakan bagi aliran proses, jalan sehala, penerbangan, litar elektrik, carta organisasi dan peredaran darah badan manusia.","Graf Tak Terarah: Tepi dilukis tanpa anak panah sama ada untuk graf mudah ataupun graf bergelung dan berbilang tepi. Kedudukan pasangan bucu bebas: (A, B) dan (B, A) mewakili tepi yang sama."],"labId":"mat45_graf_terarah_pemberat_lab","labTitle":"Simulator Graf Terarah vs Tak Terarah & Pengira d_in / d_out","labProps":{"mode":"arah","sub":"terarahMudah","activeNode":"A"},"formula":"Terarah: (B, A) ≠ (A, B)   |   Tak Terarah: (A, B) = (B, A)","examTip":"Semasa menulis set E bagi graf terarah dalam SPM, pastikan bucu PERTAMA ialah pangkal anak panah (bucu awal) dan bucu KEDUA ialah hujung anak panah (bucu akhir)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Graf Terarah vs Tak Terarah","voiceCaption":"Kelaskan ciri dan contoh rangkaian berikut kepada Graf Terarah atau Graf Tak Terarah.","voiceScript":"[curious] Asingkan keenam-enam ciri serta contoh berikut kepada kategori Graf Terarah atau Graf Tak Terarah dengan cermat.","prompt":"Isihkan pernyataan berikut mengikut kategori Graf Terarah atau Graf Tak Terarah:","buckets":[{"id":"terarah","label":"Graf Terarah (Ada Anak Panah)"},{"id":"takterarah","label":"Graf Tak Terarah (Tiada Anak Panah)"}],"items":[{"text":"Sistem peredaran darah dalam badan manusia (aliran satu arah)","bucketId":"terarah","note":"Darah mengalir berarah dari jantung ke organ dan kembali ke jantung."},{"text":"Pasangan bucu (A, B) dan (B, A) mewakili tepi yang berlainan","bucketId":"terarah","note":"Susunan pasangan tertib terikat dengan arah anak panah."},{"text":"Rangkaian sosial hubungan rakan sebaya dua hala tanpa anak panah","bucketId":"takterarah","note":"Hubungan timbal balik tanpa arah sehala."},{"text":"Penulisan pasangan bucu dalam set E adalah bebas antara (A, B) atau (B, A)","bucketId":"takterarah","note":"Ciri khas graf tak terarah."},{"text":"Aliran suatu proses kerja dan peta jalan raya sehala","bucketId":"terarah","note":"Memerlukan arah dari peringkat awal ke akhir."},{"text":"Rangkaian transit kereta api yang berulang-alik tanpa tanda arah anak panah","bucketId":"takterarah","note":"Seperti contoh graf tak terarah KL Sentral dalam buku teks."}],"explanation":"Graf terarah menekankan urutan bucu awal ke bucu akhir menerusi anak panah; graf tak terarah tidak meletakkan arah dan bebas menulis pasangan bucu."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Darjah Masuk d_in, Keluar d_out & Gelung","voiceCaption":"Dalam graf terarah, jumlah darjah bucu ialah hasil tambah darjah masuk d_in dan darjah keluar d_out; gelung terarah menyumbang satu kepada kedua-duanya.","voiceScript":"[confident] Bagaimana pula mengira darjah pada graf terarah? Kita pecahkan kepada dua bahagian: d in untuk tepi yang MASUK ke bucu, dan d out untuk tepi yang KELUAR dari bucu! Awas dengan gelung terarah seperti T koma T: bucu T ialah bucu awal DAN bucu akhir serentak, jadi gelung itu memberi tambah satu kepada d in T dan tambah satu kepada d out T!","title":"Darjah Masuk (d_in), Darjah Keluar (d_out) & Gelung Terarah","acronym":"d_in + d_out","hook":"Setiap gelung terarah (Q, Q) menambah +1 pada d_in(Q) DAN +1 pada d_out(Q) — jumlahnya tetap +2!","summary":"Setiap bucu dalam graf terarah mempunyai bilangan darjah masuk d_in(v) dan darjah keluar d_out(v), dengan jumlah darjah d(v) = d_in(v) + d_out(v).","bullets":["Takrif d_in(v) & d_out(v): d_in(v) ialah bilangan tepi yang anak panahnya menuju MASUK ke bucu v; d_out(v) ialah bilangan tepi yang anak panahnya KELUAR dari bucu v. Jumlah ∑[d_in(v) + d_out(v)] tetap bersamaan 2E.","Gelung Terarah (Contoh 7 & Jadual ms 137): Bagi gelung (T, T), T ialah bucu awal dan juga bucu akhir. Jika T turut menghantar keluar (T, P) serta (T, S), maka d_in(T) = 1 (gelung) dan d_out(T) = 1 (gelung) + 2 = 3!"],"labId":"mat45_graf_terarah_pemberat_lab","labTitle":"Inspektor d_in, d_out & Gelung Terarah pada Setiap Bucu","labProps":{"mode":"arah","sub":"terarahLoop","activeNode":"T"},"formula":"d(v) = d_in(v) + d_out(v)   |   ∑d_in(v) = ∑d_out(v) = n(E)","examTip":"Untuk menyemak jawapan graf terarah anda dalam SPM, pastikan hasil tambah semua d_in sama dengan hasil tambah semua d_out dan sama dengan bilangan tepi E!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Nilai d_in dan d_out dengan Gelung","voiceCaption":"Ramalkan nilai d_in(Q) dan d_out(Q) apabila bucu Q mempunyai satu gelung terarah dan beberapa tepi masuk atau keluar.","voiceScript":"[curious] Uji pengiraan darjah terarah daripada Contoh Tujuh buku teks! Jika Q mempunyai satu gelung pada dirinya, satu tepi masuk dari P, satu tepi masuk dari R, satu tepi masuk dari S, dan satu tepi keluar ke R, apakah nilai d in Q dan d out Q?","prompt":"Dalam suatu graf terarah, set E bagi bucu Q melibatkan tepi: (P, Q), (Q, R), (R, Q), (S, Q) dan gelung (Q, Q). Ramalkan nilai tepat d_in(Q) dan d_out(Q).","scenario":"Ingat: bucu awal berada di kiri dan bucu akhir di kanan dalam pasangan (awal, akhir).","options":["d_in(Q) = 3 dan d_out(Q) = 1","d_in(Q) = 4 dan d_out(Q) = 2","d_in(Q) = 3 dan d_out(Q) = 2","d_in(Q) = 4 dan d_out(Q) = 1"],"correctIndex":1,"proofLabId":"mat45_graf_terarah_pemberat_lab","proofState":{"mode":"arah","sub":"terarahLoop","activeNode":"Q"},"explanation":"Tepi masuk ke Q (Q di sebelah kanan): (P,Q), (R,Q), (S,Q) dan gelung (Q,Q) = 4 tepi -> d_in(Q) = 4. Tepi keluar dari Q (Q di sebelah kiri): (Q,R) dan gelung (Q,Q) = 2 tepi -> d_out(Q) = 2!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Graf Berpemberat vs Tak Berpemberat","voiceCaption":"Graf berpemberat meletakkan nilai jarak, masa, arus atau kos pada setiap tepi; graf tak berpemberat hanya menggambarkan kaitan struktur.","voiceScript":"[warm] Sekarang mari bezakan graf berpemberat dengan graf tak berpemberat! Kedua-duanya boleh berbentuk graf terarah ataupun tak terarah. Bezanya: tepi graf berpemberat membawa nilai angka seperti jarak kilometer, masa minit, kos ringgit atau arus elektrik, manakala graf tak berpemberat seperti carta organisasi dan peta alir tiada nilai pemberat!","title":"Graf Berpemberat vs Tak Berpemberat & Analisis Laluan Contoh 8","acronym":"NILAI TEPI","hook":"Kedua-dua graf berpemberat dan tak berpemberat BOLEH bersifat terarah atau tak terarah — nilai pada tepi yang membezakannya!","summary":"Graf berpemberat meletakkan nilai numerik (jarak, masa, kos, arus) pada setiap tepi, manakala graf tak berpemberat hanya mengaitkan hierarki atau struktur maklumat.","bullets":["Graf Berpemberat vs Tak Berpemberat: Tepi graf berpemberat mewakili jarak antara bandar, masa gerakan, nilai arus litar elektrik atau kos. Tepi graf tak berpemberat mewakili hierarki carta organisasi, peta alir, peta pokok dan peta buih.","Contoh 8 (Laluan Larian Sehala Izarul v₁ -> v₅): Laluan terpendek ialah v₁ -> v₂ -> v₅ = 600 + 500 = 1 100 m (1.1 km), laluan terpanjang ialah v₁ -> v₂ -> v₃ -> v₄ -> v₅ = 2 500 m (2.5 km), dan laluan antara 1.4 km hingga 2.1 km ialah v₁, v₃, v₄, v₅ serta v₁, v₂, v₄, v₅."],"labId":"mat45_graf_terarah_pemberat_lab","labTitle":"Simulator Laluan Sehala Berpemberat v₁ -> v₅ (Contoh 8)","labProps":{"mode":"pemberat","routeId":"r1"},"formula":"Laluan Terpendek = ∑Pemberat Minimum sepanjang arah sah","examTip":"Apabila mencari laluan terpendek atau terpanjang dalam graf terarah berpemberat, sentiasa ikut arah anak panah dan jangan berpatah balik melawan arah!"},{"type":"match","xp":15,"voiceIdKey":"u2-s6","voiceToneLabel":"Padan Jenis Graf & Aplikasi","voiceCaption":"Padankan lima situasi berikut dengan jenis graf yang paling tepat mewakilinya.","voiceScript":"[confident] Cuba padankan lima situasi harian ini dengan kategori graf berpemberat atau tak berpemberat yang betul.","prompt":"Padankan setiap situasi berikut dengan perwakilan graf yang tepat:","pairs":[{"id":"u2m1","left":"Carta organisasi kelab sekolah (Pengetua -> Guru -> Pengerusi)","right":"Graf terarah dan tak berpemberat"},{"id":"u2m2","left":"Peta jarak lebuh raya dua hala antara bandar di Negeri Sembilan","right":"Graf tak terarah dan berpemberat"},{"id":"u2m3","left":"Laluan larian sehala Izarul dengan jarak setiap segmen dalam meter","right":"Graf terarah dan berpemberat"},{"id":"u2m4","left":"Peta buih pemikiran dan peta pokok tanpa nombor ukuran","right":"Graf tak berpemberat (hierarki / kaitan maklumat)"},{"id":"u2m5","left":"Rangkaian kabel litar elektrik berserta bacaan arus dalam Ampere","right":"Graf berpemberat (pemberat nilai arus)"}],"explanation":"Setiap graf yang mencatat nilai (km, minit, RM, Ampere) ialah graf berpemberat; carta organisasi dan peta pemikiran tanpa nilai ialah graf tak berpemberat."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Hitung Beza Jarak Kuala Pilah ke Rompin","voiceCaption":"Selesaikan masalah graf tak terarah berpemberat Praktis Kendiri 5.1b melibatkan laluan Encik Benny dan Encik Muruges.","voiceScript":"[curious] Selesaikan soalan empat daripada Praktis Kendiri lima perpuluhan satu b! Diberi jarak Kuala Pilah ke Rompin terus ialah empat puluh kilometer, Kuala Pilah ke Juasseh sembilan perpuluhan tiga kilometer, Juasseh ke Bahau sebelas perpuluhan enam kilometer, dan Bahau ke Rompin dua puluh perpuluhan tujuh kilometer. Berapakah beza jarak perjalanan Encik Benny yang ikut jarak terpendek berbanding Encik Muruges melalui Juasseh dan Bahau?","prompt":"Diberi rangkaian bandar (tak terarah, berpemberat): (KP, R) = 40 km, (KP, J) = 9.3 km, (J, B) = 11.6 km, (B, R) = 20.7 km, (J, BK) = 6.6 km dan (BK, B) = 11.4 km. Encik Benny memandu mengikut jarak terpendek dari Kuala Pilah (KP) ke Rompin (R), manakala Encik Muruges melalui Juasseh (J) dan Bahau (B). Hitung beza jarak perjalanan mereka.","options":["1.6 km","2.4 km","6.4 km","8.0 km"],"correctIndex":0,"explanation":"Laluan Encik Benny (terpendek terus KP -> R) = 40.0 km. Laluan Encik Muruges (KP -> J -> B -> R) = 9.3 + 11.6 + 20.7 = 41.6 km. Beza jarak = 41.6 - 40.0 = 1.6 km!"}]},{"id":"mat45-u3","title":"Unit 3: Subgraf, Pokok & Pokok Berpemberat Minimum","subtitle":"Subtopik 5.1 (Bhg. C) — Syarat Subgraf H ⊆ G, Ciri Pokok (E = n - 1) & Pembinaan Pokok Berpemberat Minimum","iconType":"scale","iconUrl":"../assets/icons/mat45-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Definisi & 3 Syarat Subgraf","voiceCaption":"Suatu graf H ialah subgraf kepada G jika bucu dan tepi H ialah subset kepada G serta kedudukan pasangan bucunya kekal sama.","voiceScript":"[warm] Selamat datang ke Unit Tiga! Pernahkah kamu mengambil sebahagian peta laluan daripada peta besar tanpa mengalihkan mana-mana jalan atau label stesen? Dalam teori graf, bahagian yang dilukis semula itu dipanggil subgraf! Ingat tiga syarat wajibnya: bucu H subset bucu G, tepi H subset tepi G, dan pasangan bucu setiap tepi atau gelung mesti kekal sama!","title":"Subgraf H bagi G: Tiga Syarat Mutlak & Kes Khas","acronym":"V⊆ • E⊆ • SAMA","hook":"Satu bucu tunggal, satu tepi bersama dua bucunya, malah graf G itu sendiri kesemuanya adalah subgraf sah bagi graf G!","mediaKey":"mat45_pokok_rangkaian","summary":"Subgraf ialah sebahagian atau keseluruhan suatu graf yang dilukis semula tanpa mengubah kedudukan asal pasangan bucu dan tepinya.","bullets":["3 Syarat Subgraf H kepada G: (1) V(H) subset V(G), (2) E(H) subset E(G), dan (3) pasangan bucu bagi setiap tepi (termasuk kedudukan gelung) dalam H adalah sama tepat seperti dalam graf induk G.","3 Fakta Khas Subgraf: Suatu bucu tunggal dalam G ialah subgraf; suatu tepi bersama dua bucu hujungnya ialah subgraf; dan setiap graf G ialah subgraf kepada dirinya sendiri."],"labId":"mat45_subgraf_pokok_lab","labTitle":"Penguji Syarat Subgraf (Contoh 9 KSSM)","labProps":{"tab":"subgraf","cand":"h1"},"formula":"H subgraf G  ⇔  V(H) ⊆ V(G),  E(H) ⊆ E(G),  pasangan bucu kekal sama","examTip":"Jika calon subgraf mengalihkan gelung e₂ daripada bucu Q ke bucu S, atau menukar label tepi e₃ dari Q-S ke P-S, ia BUKAN subgraf!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Kesalahan Subgraf (Contoh 9)","voiceCaption":"Kenal pasti mengapa graf calon gagal memenuhi syarat subgraf walaupun menggunakan huruf bucu yang sama.","voiceScript":"[curious] Perhatikan graf induk G dalam Contoh Sembilan di mana gelung e dua berada di bucu Q dan tepi e lima menyambungkan P dengan S. Jika sebuah graf rajah dua melukis gelung e dua pada bucu S pula, adakah ia subgraf kepada G?","prompt":"Graf induk G mengandungi tepi e₁=(P,Q), gelung e₂=(Q,Q), e₃=(Q,S), e₄=(R,S) dan e₅=(P,S). Antara calon H berikut, yang manakah SAH sebagai subgraf bagi G?","scenario":"Semak sama ada label tepi dan gelung terpasang pada pasangan bucu yang asal.","options":["H dengan bucu {S, R}, tepi e₄=(R,S) dan gelung e₂=(S,S)","H dengan bucu {P, S} dan tepi e₃=(P,S)","H dengan bucu {P, S} dan tepi e₅=(P,S)","H dengan bucu {Q, R}, gelung e₃=(Q,Q) dan tepi e₁=(Q,R)"],"correctIndex":2,"proofLabId":"mat45_subgraf_pokok_lab","proofState":{"tab":"subgraf","cand":"h1"},"explanation":"Hanya H = ({P, S}, {e₅}) yang sah! Dalam graf G, e₅ sememangnya mengaitkan P dan S. Pilihan lain memindahkan gelung e₂ ke S atau melabel semula tepi pada pasangan bucu yang salah."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Pokok: Graf Mudah Berkait E = n - 1","voiceCaption":"Pokok ialah subgraf mudah dengan semua bucu berkait oleh satu laluan unik sahaja dan memenuhi rumus E = n - 1.","voiceScript":"[confident] Seterusnya, kenali jenis subgraf yang sangat istimewa iaitu Pokok! Untuk layak digelar pokok, graf itu mesti memenuhi tiga syarat serentak: pertama, ia graf mudah tanpa gelung atau berbilang tepi; kedua, semua bucu mesti berkait dan hanya ada satu laluan antara mana-mana dua bucu tanpa kitaran; ketiga, bilangan tepi mesti tepat n tolak satu!","title":"Ciri-Ciri Pokok: Graf Mudah Berkait Tanpa Kitaran (E = n - 1)","acronym":"E = n - 1","hook":"Jika sebuah pokok mempunyai 8 bucu, ia WAJIB mempunyai tepat 8 - 1 = 7 tepi, tiada gelung, tiada kitaran dan tiada bucu terpencil!","summary":"Pokok ialah subgraf mudah yang menyambungkan semua n bucu dengan tepat (n - 1) tepi supaya setiap pasangan bucu dikaitkan oleh satu laluan unik sahaja.","bullets":["3 Syarat Pokok: (a) Graf mudah (tiada gelung dan tiada berbilang tepi); (b) Semua bucu berkait dan setiap pasangan bucu hanya mempunyai satu laluan unik (tiada litar tertutup); (c) Bilangan tepi = n - 1 apabila bilangan bucu = n.","Contoh 10 & 11: Pokok ber-6 bucu ada 5 tepi; pokok ber-8 bucu ada 7 tepi; pokok ber-9 tepi ada 10 bucu. Jika wujud 2 cara laluan dari B ke E, atau ada bucu terpencil seperti R dan T, ia BUKAN pokok."],"labId":"mat45_subgraf_pokok_lab","labTitle":"Pengesan Pokok vs Bukan Pokok (4 Kes KSSM)","labProps":{"tab":"pokok","treeCase":"pokokA"},"formula":"Bilangan Bucu = n   ⇒   Bilangan Tepi Pokok = n - 1","examTip":"Hati-hati perangkap SPM: graf dengan E = n - 1 TETAPI ada satu bucu terpencil dan satu kitaran segitiga BUKAN pokok kerana tidak semua bucu berkait!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Pokok Sah vs Bukan Pokok","voiceCaption":"Kelaskan enam struktur graf berikut sebagai Pokok Sah atau Bukan Pokok.","voiceScript":"[curious] Mari uji mata tajam kamu! Asingkan keenam-enam graf berikut sama ada ia memenuhi syarat Pokok ataupun Bukan Pokok.","prompt":"Isihkan setiap ciri atau spesifikasi graf berikut sebagai Pokok Sah atau Bukan Pokok:","buckets":[{"id":"pokok","label":"Pokok Sah (E = n - 1 & Berkait)"},{"id":"bukan","label":"Bukan Pokok (Kitaran / Putus / Gelung)"}],"items":[{"text":"Graf mudah berkait dengan 6 bucu dan 5 tepi tanpa kitaran","bucketId":"pokok","note":"Memenuhi kesemua 3 syarat pokok (E = 6 - 1 = 5)."},{"text":"Graf dengan 5 bucu dan 5 tepi di mana B ke E boleh dilalui melalui 2 laluan","bucketId":"bukan","note":"Wujud kitaran tertutup serta E ≠ n - 1."},{"text":"Graf dengan 6 bucu dan 4 tepi di mana bucu R dan T tidak berkait dengan bucu lain","bucketId":"bukan","note":"Terdapat komponen terputus / tidak semua bucu berkait."},{"text":"Subgraf mudah semua bucu berkait dengan 9 tepi dan 10 bucu","bucketId":"pokok","note":"Tepat 10 - 1 = 9 tepi tanpa kitaran."},{"text":"Graf dengan 4 bucu dan 3 tepi tetapi mengandungi satu gelung pada P","bucketId":"bukan","note":"Pokok wajib graf mudah; gelung tidak dibenarkan sama sekali."},{"text":"Rangkaian kabel elektrik berbentuk cabang tanpa litar tertutup bagi 7 stesen (6 kabel)","bucketId":"pokok","note":"Setiap pasangan stesen berkait melalui tepat satu laluan unik."}],"explanation":"Pokok mesti bebas gelung/berbilang tepi, semua bucu bersambung, tiada kitaran, dan tepi = bucu - 1."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s5","voiceToneLabel":"Bina Pokok Berpemberat Minimum","voiceCaption":"Untuk membina pokok berpemberat minimum daripada graf tak terarah, keluarkan tepi berpemberat paling tinggi tanpa memutuskan bucu atau mengekalkan kitaran.","voiceScript":"[warm] Bagaimana pula jika syarikat telekomunikasi mahu menyambungkan lima bandar dengan kos kabel paling murah? Kita perlu membina Pokok Berpemberat Minimum seperti Contoh Tiga Belas! Daripada tujuh tepi, kita mesti buang tiga tepi dengan pemberat paling tinggi, sambil memastikan tiada bucu yang terputus!","title":"Pokok Berpemberat Minimum (Contoh 12 & Contoh 13 KSSM)","acronym":"BUANG MAKS","hook":"Buang m - (n - 1) tepi yang bernilai paling tinggi, tetapi JANGAN sesekali memutuskan mana-mana bucu daripada rangkaian!","summary":"Pokok berpemberat minimum mengekalkan tepat (n - 1) tepi supaya semua bucu kekal berkait dengan jumlah nilai pemberat terkecil.","bullets":["Langkah 1 (Contoh 13: 5 Bucu, 7 Tepi): Bilangan tepi pokok yang diperlukan ialah 5 - 1 = 4, maka 7 - 4 = 3 tepi perlu dibuang. Mulakan dengan menyingkirkan tepi bernilai paling tinggi (QR = 25, PT = 22) sambil memastikan semua bucu bersambung.","Langkah 2 (Elak Kitaran): Antara baki pemberat 19 (PQ) dengan 25 (QR), kekalkan 19 supaya bucu Q tetap bersambung; antara 12 (PS), 14 (PR) dengan 17 (RS) dalam kitaran PRS, buang 17. Jumlah pemberat minimum = 10 + 12 + 14 + 19 = 55."],"labId":"mat45_subgraf_pokok_lab","labTitle":"Pembina Interaktif Pokok Berpemberat Minimum (Sasaran = 55)","labProps":{"tab":"mst"},"formula":"Bilangan Tepi Dibuang = n(E_asal) - (n(V) - 1)","examTip":"Jangan hanya membuang 3 nombor paling besar secara membuta tuli! Semak Contoh 13 Langkah 1: membuang PQ, QR dan PT sekaligus memutuskan bucu P dan meninggalkan kitaran RST!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun SOP Pokok Minimum","voiceCaption":"Susun urutan strategi yang betul untuk melukis pokok berpemberat minimum daripada graf tak terarah.","voiceScript":"[confident] Susun langkah-langkah tepat bagi menghasilkan pokok berpemberat minimum daripada sebuah graf tak terarah dan berpemberat.","prompt":"Susun urutan strategi yang betul untuk membina pokok berpemberat minimum bagi graf dengan n bucu dan m tepi:","hint":"Tentukan sasaran tepi dahulu, singkirkan pemberat tertinggi tanpa memutuskan bucu, lalu jumlahkan baki pemberat.","answerTokens":["Kira bilangan tepi pokok = n - 1,","tentukan tepi perlu dibuang = m - (n - 1),","keluarkan tepi berpemberat tertinggi","sambil pastikan semua bucu kekal berkait tanpa kitaran,","kemudian jumlahkan nilai pemberat baki tepi."],"distractors":["keluarkan tepi berpemberat terendah","biarkan satu bucu terpencil"],"explanation":"Sentiasa kira (n - 1) tepi sasaran, singkir tepi bernilai paling tinggi tanpa memutuskan sambungan atau meninggalkan kitaran, kemudian jumlahkan pemberat yang tinggal.","acceptedSequences":[["Kira bilangan tepi pokok = n - 1,","tentukan tepi perlu dibuang = m - (n - 1),","keluarkan tepi berpemberat tertinggi","sambil pastikan semua bucu kekal berkait tanpa kitaran,","kemudian jumlahkan nilai pemberat baki tepi."]]},{"type":"mcq","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Uji Pokok Minimum 5 Bucu 7 Tepi","voiceCaption":"Selesaikan soalan pokok berpemberat minimum untuk graf 6 bucu dan 8 tepi (Contoh 12b) serta pengiraan Contoh 13.","voiceScript":"[curious] Jika sebuah graf tak terarah mempunyai enam bucu dan lapan tepi, berapakah tepi yang mesti dibuang untuk menghasilkan pokok? Dan dalam Contoh Tiga Belas dengan pemberat sepuluh, dua belas, empat belas, tujuh belas, sembilan belas, dua puluh dua dan dua puluh lima, berapakah jumlah pemberat minimumnya?","prompt":"Sebuah graf G₁ mempunyai 6 bucu dan 8 tepi (Contoh 12b). Graf G₂ pula mempunyai 5 bucu dan 7 tepi dengan pemberat {10, 12, 14, 17, 19, 22, 25} seperti dalam Contoh 13. Tentukan bilangan tepi yang perlu dibuang pada G₁ dan jumlah pemberat minimum pokok G₂.","options":["Buang 2 tepi pada G₁; jumlah minimum G₂ = 55","Buang 3 tepi pada G₁; jumlah minimum G₂ = 55","Buang 3 tepi pada G₁; jumlah minimum G₂ = 53","Buang 2 tepi pada G₁; jumlah minimum G₂ = 58"],"correctIndex":1,"explanation":"Bagi G₁ (n=6): tepi pokok ialah 6 - 1 = 5, maka 8 - 5 = 3 tepi perlu dibuang. Bagi G₂: tepi QR(25), PT(22) dan RS(17) dibuang sambil mengekalkan kesemua 5 bucu berkait (ST=10, PS=12, PR=14, PQ=19), memberi jumlah 10 + 12 + 14 + 19 = 55."}]},{"id":"mat45-u4","title":"Unit 4: Perwakilan Rangkaian & Penyelesaian Masalah","subtitle":"Subtopik 5.1 (Bhg. D) — GPS & Kesesakan, Rangkaian Sosial Berbilang Tepi, Pengangkutan Awam & Penerbangan Domestik","iconType":"map","iconUrl":"../assets/icons/mat45-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Rangkaian Pengangkutan, GPS & Kesesakan","voiceCaption":"Sistem navigasi GPS memodelkan jarak, masa serta kos sebagai graf berpemberat; laluan terpendek tidak semestinya terpantas jika sesak.","voiceScript":"[warm] Selamat datang ke Unit Empat! Di sinilah teori graf digunakan untuk menyelesaikan masalah hidup seharian kita! Dalam rangkaian pengangkutan seperti G P S dan laluan kereta api di K L Sentral, stesen menjadi bucu dan jenis kereta api atau jalan menjadi tepi. Namun ingat Contoh Empat Belas dari Tangkak ke Melaka: laluan jarak terpendek tidak semestinya paling cepat!","title":"Rangkaian Pengangkutan, GPS & Faktor Kesesakan (Contoh 14)","acronym":"JARAK ≠ MASA","hook":"Dalam Contoh 14 (Tangkak -> A Famosa Melaka), laluan 46.3 km lebih perlahan daripada 50.2 km kerana melalui bandar sesak!","mediaKey":"mat45_penerbangan_malaysia","summary":"Rangkaian boleh dilukis dalam gabungan terarah/tak terarah dan berpemberat/tak berpemberat; sistem GPS menggunakan pemberat jarak, masa atau kos perjalanan.","bullets":["KL Sentral & GPS: Rangkaian transit rel KL Sentral ialah graf tak terarah dengan nama stesen sebagai bucu dan jenis kereta api sebagai tepi. GPS pula menggunakan graf berpemberat bagi membandingkan jarak, tempoh serta kos.","Contoh 14 (Tangkak -> A Famosa, Melaka): Walaupun laluan P paling pendek (46.3 km berbanding Q = 50.2 km dan R = 53.3 km), laluan P mengambil masa paling panjang kerana merentasi kawasan bandar yang sesak dan mempunyai bilangan pengguna jalan raya lebih ramai."],"labId":"mat45_rangkaian_malaysia_lab","labTitle":"Peta Penerbangan Malaysia CC0 & Rangkaian Sosial/Pengangkutan","labProps":{"tab":"penerbangan","scenario":"kl_kk","route":"terus"},"examTip":"Apabila soalan KBAT bertanya mengapa jarak terpendek mengambil masa lebih lama, jawab dua kata kunci buku teks: melalui kawasan bandar yang sesak dan bilangan pengguna jalan raya lebih banyak."},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Bucu & Tepi Rangkaian Nyata","voiceCaption":"Padankan sistem rangkaian berikut dengan pemilihan bucu dan tepi yang paling sesuai.","voiceScript":"[confident] Padankan kelima-lima contoh rangkaian dunia nyata ini dengan perwakilan bucu dan tepi yang paling tepat.","prompt":"Padankan setiap situasi rangkaian dengan penentuan bucu (V) dan tepi (E) yang tepat:","pairs":[{"id":"u4m1","left":"Rangkaian transit KL Sentral","right":"Bucu = nama stesen; Tepi = jenis kereta api"},{"id":"u4m2","left":"Jadual 6 murid dan 2 permainan diminati (Contoh 15)","right":"Bucu = jenis permainan; Tepi = nama murid"},{"id":"u4m3","left":"Peta navigasi GPS antara bandar","right":"Bucu = bandar; Tepi = jalan raya berpemberat jarak/masa"},{"id":"u4m4","left":"Rangkaian penerbangan domestik Malaysia","right":"Bucu = lapangan terbang; Tepi = laluan pesawat & tambang"},{"id":"u4m5","left":"Rangkaian tenaga elektrik nasional","right":"Bucu = stesen jana kuasa/pencawang; Tepi = kabel aliran arus"}],"explanation":"Sentiasa pilih objek atau kategori kongsi sebagai bucu dan penghubung atau entiti yang tidak bersilang sebagai tepi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Rangkaian Sosial & Pengangkutan Awam","voiceCaption":"Apabila menukar jadual kepada graf, pilih maklumat yang tidak bersilang sebagai tepi; dalam masalah pengangkutan, nilai faktor kos, masa dan keselamatan.","voiceScript":"[curious] Bagaimana cara melukis graf yang kemas daripada jadual murid dan permainan kegemaran dalam Contoh Lima Belas? Tip buku teks sangat mudah: pilih maklumat yang tidak bersilang sebagai tepi, iaitu nama murid! Kemudian dalam Contoh Enam Belas, kita menilai jadual bas, kereta api dan kereta dari Johor Bahru ke Kota Bharu mengikut bajet dan keselamatan!","title":"Rangkaian Sosial (Contoh 15) & Pilihan Pengangkutan (Contoh 16)","acronym":"TAK SILANG = E","hook":"Tip melukis graf daripada jadual: pilih data yang TIDAK bersilang sebagai Tepi (E), dan kategori yang dikongsi sebagai Bucu (V)!","summary":"Rangkaian sosial memudahkan analisis hubungan (berhemah menggunakannya), manakala pemilihan pengangkutan menggabungkan faktor tambang, masa, keselamatan dan bilangan penumpang.","bullets":["Contoh 15 & Tip Jadual: Enam murid masing-masing memilih 2 permainan (cth. Edmund: Badminton & Catur). Jadikan jenis permainan sebagai Bucu dan nama murid sebagai Tepi kerana nama murid hanya menghubungkan tepat dua bucu tanpa bersilang.","Contoh 16 (JB -> Kota Bharu): (a) 1 dewasa santai -> Kereta api tempat tidur (RM49–55, beza ~RM5 berbanding tanpa tempat tidur, lebih murah daripada kereta RM120); (b) 1 dewasa kesuntukan masa -> Bas (9 jam, RM64–75, boleh rehat & lebih selamat berbanding memandu jauh seorang diri); (c) 2 dewasa + 2 kanak-kanak -> Kereta (RM120 sekereta paling jimat!)."],"labId":"mat45_rangkaian_malaysia_lab","labTitle":"Kalkulator Profil Pengangkutan JB–Kota Bharu & Tip Rangkaian Sosial","labProps":{"tab":"sosial","profile":"keluarga"},"examTip":"Bagi soalan Contoh 16(b), menyebut aspek KESELAMATAN (tidak sesuai memandu jarak jauh seorang diri) dan dapat BEREHAT di dalam bas memberi justifikasi penuh markah Kertas 2!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Pengangkutan Terbaik JB–Kota Bharu","voiceCaption":"Ramalkan pengangkutan terbaik untuk dua situasi berbeza antara JB dan Kota Bharu.","voiceScript":"[curious] Berdasarkan jadual Contoh Enam Belas dari Johor Bahru ke Kota Bharu: bas mengambil sembilan jam berharga enam puluh empat hingga tujuh puluh lima ringgit, kereta api tujuh belas jam berharga empat puluh sembilan hingga lima puluh lima ringgit tempat tidur, dan kereta sembilan jam berharga seratus dua puluh ringgit sebuah kereta. Pilihan manakah terbaik untuk seorang dewasa yang mempunyai kekangan masa?","prompt":"Bagi perjalanan dari Johor Bahru ke Kota Bharu (Contoh 16): Bas (9 jam, RM64–RM75), Kereta api tempat tidur (17 jam, RM49–RM55 dewasa / RM32–RM38 kanak-kanak) dan Kereta (9 jam, RM120 sekereta). Apakah pilihan terbaik bagi SEORANG dewasa yang mempunyai kekangan masa?","scenario":"Penumpang mesti tiba dalam tempoh singkat (~9 jam) dengan kos berpatutan dan selamat.","options":["Kereta api tanpa tempat tidur kerana tambang paling murah (RM43)","Memandu kereta sendiri kerana mengambil masa 9 jam dan bebas berhenti","Bas ekspres kerana mengambil masa 9 jam, lebih jimat kos serta lebih selamat untuk berehat","Kereta api tempat tidur kerana dapat tidur lena selama 17 jam"],"correctIndex":2,"proofLabId":"mat45_rangkaian_malaysia_lab","proofState":{"tab":"sosial","profile":"adaMasa"},"explanation":"Bas mengambil masa 9 jam (memenuhi kekangan masa berbanding kereta api 17 jam), tambangnya (RM64–75) jauh lebih murah daripada kos kereta (RM120), serta penumpang boleh berehat tanpa risiko memandu jauh seorang diri."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Penerbangan Domestik Malaysia","voiceCaption":"Penerbangan terus menjimatkan masa dan kos berbanding transit, namun jadual waktu berlepas menentukan kesahan setiap sambungan transit.","voiceScript":"[warm] Sekarang mari lihat Peta Penerbangan Domestik Malaysia merentasi Laut China Selatan! Antara Kuala Lumpur ke Kota Kinabalu, penerbangan terus menjimatkan masa dan kos berbanding transit di Labuan. Dalam kes Encik Maswi di Praktis lima perpuluhan satu e pula, kamu wajib menyemak jam berlepas dan mendarat supaya tidak tersalah pilih sambungan transit yang terlepas pesawat!","title":"Penerbangan Domestik Malaysia: Terus vs Transit (Contoh 17 & 5.1e)","acronym":"TERUS vs TRANSIT","hook":"Awas jadual transit! Jangan hanya tambah dua harga tiket paling murah — semak dahulu sama ada pesawat kedua berlepas SELEPAS pesawat pertama mendarat!","summary":"Pemilihan laluan penerbangan domestik membandingkan laluan terus dengan laluan transit berdasarkan jumlah tambang, kesesuaian jam penerbangan serta keperluan masa di destinasi.","bullets":["Contoh 17 (KL -> Kota Kinabalu): Dua pilihan ialah penerbangan terus KL -> KK (lebih jimat masa dan kos) atau transit KL -> Labuan -> KK (masa perjalanan lebih panjang dan kos biasanya lebih tinggi).","Praktis 5.1e (Encik Maswi: Kulai/JB -> Miri, tamat kerja Jumaat 12:30 tgh): Laluan terus Sabtu 17:05–19:00 berharga RM239.30 ialah yang PALING MURAH; gabungan Sabtu 12:05–13:30 + 11:45–12:50 (RM218.30) TIDAK SAH kerana pesawat Kuching->Miri berlepas sebelum pesawat dari JB mendarat!"],"labId":"mat45_rangkaian_malaysia_lab","labTitle":"Peta Natural Earth Penerbangan Malaysia (KL–KK & JB–Miri)","labProps":{"tab":"penerbangan","scenario":"jb_miri","route":"sabtu_murah"},"examTip":"Jika soalan meminta pilihan terbaik apabila perlu pulang hari Ahad, pertimbangkan bukan sahaja harga tiket tetapi tempoh masa berkualiti bersama keluarga di destinasi (Jumaat malam atau Sabtu pagi)."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Prinsip Masalah Rangkaian","voiceCaption":"Susun langkah menyelesaikan masalah jadual perjalanan dan rangkaian pengangkutan secara sistematik.","voiceScript":"[confident] Susun blok prinsip penting berikut bagi memastikan kamu tidak kehilangan markah dalam soalan penyelesaian masalah rangkaian pengangkutan Kertas Dua.","prompt":"Susun prinsip terbaik dalam menganalisis jadual rangkaian pengangkutan dan sosial:","hint":"Gabungkan pemilihan bucu/tepi jadual serta penyemakan syarat masa dan kos laluan.","answerTokens":["Pilih maklumat tidak bersilang sebagai tepi,","semak kesesuaian waktu ketibaan sebelum transit,","bandingkan jumlah kos, masa serta keselamatan","bagi menentukan laluan paling optimum."],"distractors":["sentiasa pilih jarak terpendek tanpa mengira kesesakan","pilih gabungan tambang termurah walaupun terlepas transit"],"explanation":"Prinsip emas rangkaian: tepi mewakili maklumat tidak bersilang, semak kesesuaian waktu transit, dan nilai kos + tempoh + faktor keselamatan atau kesesakan bersama.","acceptedSequences":[["Pilih maklumat tidak bersilang sebagai tepi,","semak kesesuaian waktu ketibaan sebelum transit,","bandingkan jumlah kos, masa serta keselamatan","bagi menentukan laluan paling optimum."]]},{"type":"mcq","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Selesaikan Kes Penerbangan Encik Maswi","voiceCaption":"Tentukan penerbangan paling murah yang sah dari Johor Bahru ke Miri berdasarkan jadual Praktis 5.1e.","voiceScript":"[curious] Selesaikan soalan lima perpuluhan satu e bahagian a! Encik Maswi ingin terbang dari Johor Bahru ke Miri. Perhatikan jadual Jumaat dan Sabtu: penerbangan terus Sabtu pukul lima petang berharga dua ratus tiga puluh sembilan ringgit tiga puluh sen, manakala transit pagi Sabtu berharga dua ratus lima puluh lapan ringgit tiga puluh sen, dan transit tengah hari Sabtu terlepas pesawat kedua. Manakah pilihan paling murah yang sah?","prompt":"Jadual penerbangan JB -> Miri (Praktis 5.1e): Terus Sabtu 17:05–19:00 (RM239.30); Transit Jumaat 20:00–21:25 & 21:55–23:00 (RM124.30 + RM149.00); Transit Sabtu Pagi 06:05–07:30 & 08:35–09:40 (RM174.30 + RM84.00); Transit Tengah Hari 12:05–13:30 & 11:45–12:50 (RM154.30 + RM64.00). Tentukan pilihan paling murah yang SAH.","options":["Transit Sabtu Tengah Hari 12:05 + 11:45 (RM218.30)","Penerbangan Terus Sabtu 17:05–19:00 (RM239.30)","Transit Sabtu Pagi 06:05 + 08:35 (RM258.30)","Transit Jumaat Malam 20:00 + 21:55 (RM273.30)"],"correctIndex":1,"explanation":"Pilihan RM218.30 (12:05–13:30 + 11:45–12:50) tidak sah kerana penerbangan Kuching–Miri berlepas pada 11:45 sebelum ketibaan dari JB pada 13:30! Maka penerbangan paling murah yang sah ialah penerbangan terus Sabtu (RM239.30)."}]},{"id":"mat45-u5","title":"Unit 5: Cabaran Boss SPM — Rangkaian dalam Teori Graf","subtitle":"6 Pusingan Sintesis Kertas 1 & Kertas 2 Berformat Peperiksaan SPM Sebenar","iconType":"trophy","iconUrl":"../assets/icons/mat45-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Jujukan Darjah & Gelung","voiceCaption":"Uji pemahaman teorem ∑d = 2E serta syarat melukis graf mudah berbanding graf bergelung dan berbilang tepi.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M Bab lima! Pusingan pertama: antara empat jujukan darjah berikut, yang manakah BOLEH dilukis sebagai graf dan WAJIB mempunyai sama ada gelung ataupun berbilang tepi jika melibatkan tepat tiga bucu?","prompt":"Diberi sebuah graf mempunyai tepat 3 bucu. Antara jujukan darjah berikut, yang manakah BOLEH dilukis dan MESTI mengandungi gelung atau berbilang tepi?","options":["2, 2, 2","1, 2, 2","3, 3, 4","2, 3, 4"],"correctIndex":2,"explanation":"Jujukan (1,2,2) berjumlah 5 dan (2,3,4) berjumlah 9 (ganjil -> tidak boleh dilukis). Jujukan (2,2,2) boleh dilukis sebagai segi tiga mudah. Jujukan (3,3,4) berjumlah 10 (genap, E=5), tetapi darjah maksimum graf mudah 3 bucu hanyalah 2, maka ia WAJIB mempunyai gelung atau berbilang tepi!"},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Pusingan 2: Pokok Minimum Jalan Pahang","voiceCaption":"Tentukan sama ada rangkaian bandar Pahang dalam Praktis Sumatif Q3 merupakan pokok serta kesan menambah satu pintasan.","voiceScript":"[curious] Pusingan kedua daripada Praktis Sumatif nombor tiga! Jalan persekutuan menghubungkan tujuh bandar iaitu Temerloh, Mentakab, Bandar Bera, Teriang, Lanchang, Karak dan Kuala Krau menggunakan enam tepi sahaja tanpa kitaran. Jika satu jalan terus baharu dibina antara Temerloh dan Lanchang, adakah ia masih kekal sebagai pokok?","prompt":"Rangkaian bandar Pahang (Praktis Sumatif Q3) menghubungkan 7 bandar (Temerloh, Mentakab, Bandar Bera, Teriang, Lanchang, Karak, Kuala Krau) melalui 6 jalan tanpa kitaran. Jika 1 jalan terus baharu menghubungkan Temerloh dengan Lanchang, apakah status graf baharu tersebut?","scenario":"Asalnya terdapat 7 bucu dan 6 tepi berkait (E = n - 1). Satu tepi baharu menjadikan E = 7.","options":["Masih pokok kerana semua 7 bandar masih bersambung.","Bukan pokok kerana bilangan tepi menjadi 7 (≠ 6) dan terbentuk kitaran Temerloh–Mentakab–Lanchang.","Menjadi subgraf mudah tanpa sebarang bucu terpencil.","Bukan pokok kerana terdapat gelung pada bucu Temerloh."],"correctIndex":1,"proofLabId":"mat45_subgraf_pokok_lab","proofState":{"tab":"pokok","treeCase":"kitaranB"},"explanation":"Graf asal ialah pokok (n=7, E=6). Penambahan tepi Temerloh–Lanchang membentuk litar tertutup Temerloh–Mentakab–Lanchang (dua laluan berbeza antara Temerloh dan Lanchang) serta E = 7 ≠ n - 1, maka ia BUKAN pokok lagi!"},{"type":"match","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Pusingan 3: Sintesis Istilah Bab 5","voiceCaption":"Padankan lima konsep teras Teori Graf dengan definisi atau rumus matematiknya yang paling tepat.","voiceScript":"[confident] Pusingan ketiga! Padankan kelima-lima konsep tunjang Bab lima berikut dengan syarat matematiknya tanpa sebarang kesilapan.","prompt":"Padankan setiap konsep teras Teori Graf berikut dengan syarat matematik atau cirinya yang tepat:","pairs":[{"id":"u5m1","left":"Pokok bagi graf n bucu","right":"Graf mudah berkait tanpa kitaran dengan E = n - 1"},{"id":"u5m2","left":"Gelung terarah (Q, Q)","right":"Menyumbang +1 kepada d_in(Q) dan +1 kepada d_out(Q)"},{"id":"u5m3","left":"Subgraf H bagi G","right":"V(H) ⊆ V(G), E(H) ⊆ E(G) dan pasangan bucu sepadan"},{"id":"u5m4","left":"Teorem Jumlah Darjah","right":"∑d(v) = 2 × n(E) dan nilainya sentiasa nombor genap"},{"id":"u5m5","left":"Pokok Berpemberat Minimum","right":"Buang m - (n - 1) tepi termahal tanpa memutuskan bucu"}],"explanation":"Kelima-lima formula dan syarat ini merangkumi keseluruhan pengiraan teras SPM bagi Kertas 1 dan Kertas 2 Bab 5."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Pusingan 4: Laluan Terpendek Tanpa Ulang","voiceCaption":"Susun langkah menyelesaikan masalah mencari jarak terpendek melawat semua rumah sekali sahaja (Praktis Sumatif Q7).","voiceScript":"[curious] Pusingan keempat daripada Praktis Sumatif nombor tujuh! Seorang jurujual bermula di rumah A dan perlu melawat kesemua enam buah rumah sehingga berakhir di rumah F tanpa mengulang mana-mana laluan. Susun langkah penyelesaiannya!","prompt":"Susun urutan penyelesaian masalah melawat semua bucu dari A ke F dengan jarak terpendek dan setiap tepi dilalui sekali sahaja:","hint":"Tentukan laluan terarah yang melawat kesemua 6 bucu (bermula di A, tamat di F), semak tiada tepi berulang, lalu hitung jumlah pemberat.","answerTokens":["Senaraikan laluan terarah dari A ke F","yang merangkumi semua bucu tepat sekali,","elakkan laluan berpemberat tinggi,","kemudian jumlahkan pemberat terkecil sebagai jarak terpendek."],"distractors":["ulang tepi terpendek dua kali","abaikan bucu yang jauh dari A"],"explanation":"Untuk melawat kesemua n bucu dari A ke F tanpa mengulang tepi, bentukkan laluan sambungan linear (5 tepi bagi 6 rumah) dan pilih jujukan dengan jumlah pemberat paling minimum.","acceptedSequences":[["Senaraikan laluan terarah dari A ke F","yang merangkumi semua bucu tepat sekali,","elakkan laluan berpemberat tinggi,","kemudian jumlahkan pemberat terkecil sebagai jarak terpendek."]]},{"type":"predict","xp":25,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Pusingan 5: Transit 45 Minit (Sumatif Q5)","voiceCaption":"Analisis graf penerbangan transit berserta masa menunggu 45 minit di lapangan terbang transit (Praktis Sumatif Q5).","voiceScript":"[serious] Pusingan kelima daripada Praktis Sumatif nombor lima! Penerbangan dari P ke S boleh melalui laluan terus P ke S berharga tiga ratus lima puluh ringgit mengambil masa tiga jam, atau transit di Q dengan dua segmen P Q bernilai seratus ringgit satu jam lima belas minit dan Q S bernilai seratus lima puluh ringgit satu jam tiga puluh minit, ditambah masa transit empat puluh lima minit. Laluan manakah paling murah dan berapa jumlah masa perjalanannya?","prompt":"Dari lapangan terbang P ke S (adaptasi Praktis Sumatif Q5): Terus P -> S berharga RM350 (3 jam). Transit P -> Q -> S pula: P -> Q berharga RM100 (1 jam 15 min) dan Q -> S berharga RM150 (1 jam 30 min), manakala masa transit wajib di Q ialah 45 minit. Ramalkan laluan paling murah beserta jumlah masa penuhnya.","scenario":"Tambahkan kos kedua-dua segmen penerbangan serta jangkamasa transit 45 minit untuk laluan melalui Q.","options":["Terus P -> S (RM350, 3 jam 00 min)","Transit P -> Q -> S (RM250, 2 jam 45 min)","Transit P -> Q -> S (RM250, 3 jam 30 min)","Transit P -> Q -> S (RM300, 3 jam 30 min)"],"correctIndex":2,"proofLabId":"mat45_rangkaian_malaysia_lab","proofState":{"tab":"penerbangan","scenario":"jb_miri","route":"sabtu_murah"},"explanation":"Kos transit P -> Q -> S = RM100 + RM150 = RM250 (lebih murah RM100 berbanding terus RM350). Jumlah masa penuh = 1j 15m + 45m (transit) + 1j 30m = 3 jam 30 minit!"},{"type":"mcq","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Pokok Ejen Insurans (Sumatif Q9)","voiceCaption":"Hitung bilangan ejen pada setiap peringkat rajah pokok dan jumlah polisi komisen Encik Ganesan (Praktis Sumatif Q9).","voiceScript":"[excited] Pusingan terakhir Boss S P M! Dalam soalan sembilan Praktis Sumatif, pengurus Encik Ganesan di bucu P melantik dua orang ejen peringkat pertama. Setiap ejen seterusnya memperkenalkan dua ejen baharu di peringkat berikutnya sehingga terkumpul tiga puluh orang ejen pada bulan Januari. Jika setiap ejen menjual minimum lapan belas polisi bernilai seratus ringgit dengan komisen pengurus dua peratus, berapakah jumlah komisen asas Encik Ganesan?","prompt":"Berdasarkan rajah pokok struktur agensi insurans (Praktis Sumatif Q9): Pengurus P mempunyai 2 ejen di peringkat E₁, dan setiap ejen merekrut 2 ejen baharu ke peringkat seterusnya hingga jumlah ejen = 30 orang (2 + 4 + 8 + 16). Jika setiap polisi bernilai RM100, minimum polisi dijual seorang ejen ialah 18 polisi, dan komisen asas pengurus P bagi setiap polisi ialah 2%, hitung jumlah komisen asas minimum diterima Encik Ganesan.","options":["RM540","RM1 080","RM1 200","RM2 160"],"correctIndex":1,"explanation":"Jumlah ejen = 30 orang (peringkat E₁ hingga E₄: 2 + 4 + 8 + 16 = 30). Jumlah polisi minimum terjual = 30 × 18 = 540 polisi. Nilai jualan = 540 × RM100 = RM54 000. Komisen asas 2% Encik Ganesan = 0.02 × RM54 000 = RM1 080!"}]}]};</script>

      // Interactive builder ('bina')
      var edges = [
        { u: "A", v: "B", kind: st.multiAB ? "curveL" : "simple" },

      var sumD = 0;
      Object.keys(degMap).forEach(function (k) { sumD += degMap[k]; });
      return {

        nV: spec.vertices.length,
        nE: spec.edges.length,
        sumD: sumD,
        hasLoop: spec.edges.some(function (e) { return e.u === e.v; }),

        if (e.u === e.v) {

          var dirY = a.y > 130 ? 1 : -1;
          var c1x = a.x + dirX * 56;
          var c1y = a.y - dirY * 18;
          var c2x = a.x + dirX * 16;

          var lblY = a.y + dirY * 32;
          return '<path d="M ' + a.x + ' ' + a.y + ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + a.x + ' ' + a.y + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"/>' +

        }
        if (e.kind === "curveL" || e.kind === "curveR") {
          var mx = (a.x + b.x) / 2;
          var my = (a.y + b.y) / 2;
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var len = Math.hypot(dx, dy) || 1;
          var nx = -dy / len;
          var ny = dx / len;
          var offset = e.kind === "curveL" ? 26 : -26;
          var cx = mx + nx * offset;
          var cy = my + ny * offset;
          return '<path d="M ' + a.x + ' ' + a.y + ' Q ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b.x + ' ' + b.y + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"/>';
        }

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
