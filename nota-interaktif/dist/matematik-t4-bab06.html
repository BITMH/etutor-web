  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab06","subject":"Matematik","subjectGroup":"teras","form":4,"chapterNumber":6,"title":"Bab 6: Ketaksamaan Linear dalam Dua Pemboleh Ubah","subtitle":"Subtopik 6.1–6.2 KSSM (37 Langkah Bit-by-Bit) — Pemodelan Situasi & Penukaran Unit, Tentusah Titik (Atas/Pada/Bawah), Garis Padu vs Sempang, Hukum Pekali Negatif, Pantulan Paksi, Sistem & Rantau Sepunya serta Pengoptimuman Bajet SPM.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t4-bab06-labs.js","coverIcon":"../assets/icons/mat46-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan ketaksamaan linear kamu memang kemas dan jitu!","combo":"[laughs warmly] Kombo yang mantap! Mata kamu tajam membaca garis sempadan dan rantau!","encourage":"[warm] Hampir tepat! Cuba semak semula tanda ketaksamaan, jenis garis atau nilai pengiraan di bawah.","celebrate":"[excited] Tahniah! Satu lagi unit Matematik Tingkatan empat Bab enam berjaya ditakluki!"},"units":[{"id":"mat46-u1","title":"Unit 1: Pengenalan Ketaksamaan Linear & Pemodelan Situasi","subtitle":"Subtopik 6.1 (Bhg. A) — Simbol (<, >, ≤, ≥), Dua Pemboleh Ubah dalam Unit Sama & Pemudahan Pecahan / Perpuluhan","iconType":"formula","iconUrl":"../assets/icons/mat46-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Konsep Ketaksamaan & Video","voiceCaption":"Ketaksamaan linear menerangkan hubungan dua kuantiti tidak sama; apabila dua kuantiti berbeza dibandingkan dalam unit seragam, dua pemboleh ubah x dan y digunakan.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan empat, Bab enam, Ketaksamaan Linear dalam Dua Pemboleh Ubah! Tonton dahulu video penerangan bersuara ini untuk melihat bagaimana tanda amaran had terowong dan berat muatan lori dimodelkan dalam matematik. Ingat, jika dua kuantiti dalam unit yang sama berbeza keadaan seperti berat dengan muatan dan tanpa muatan, kita gunakan dua pemboleh ubah x dan y!","title":"6.1 Daripada Satu Pemboleh Ubah ke Dua Pemboleh Ubah","acronym":"1PU vs 2PU","hook":"Papan tanda terowong hanya menyekat satu kuantiti (h < 4.75 m), tetapi had muatan lori mengaitkan dua berat berbeza (y <= x + 4090)!","mediaKey":"mat46_terowong_lori_hero","videoClip":{"src":"../assets/matematik-t4-bab06/video/mat46_video_ketaksamaan_narasi.mp4","hasNarration":true,"posterKey":"mat46_terowong_lori_hero","caption":"Garis Sempadan Padu vs Sempang, Tentusah Titik & Rantau Sepunya Sistem Ketaksamaan."},"summary":"Ketaksamaan digunakan untuk menyatakan kekangan atau hubungan antara kuantiti yang tidak semestinya sama, menggunakan empat simbol asas: <, >, ≤ dan ≥.","bullets":["Satu vs Dua Pemboleh Ubah: Had ketinggian kenderaan di terowong jalan raya melibatkan satu kuantiti sahaja iaitu ketinggian dalam meter (h < 4.75 m). Sebaliknya, hubungan antara berat tanpa muatan x dan berat dengan muatan y bagi sebuah lori 3 tan (muatan maksimum 7500 - 3410 = 4090 kg) melibatkan dua kuantiti berkeadaan berbeza dalam unit kg yang sama: y ≤ x + 4090.","Empat Simbol Teras: Gunakan < (kurang daripada) atau > (lebih besar daripada) apabila had tidak termasuk, dan gunakan ≤ (tidak lebih / selebih-lebihnya / maksimum) atau ≥ (sekurang-kurangnya / tidak kurang / minimum) apabila nilai sempadan diterima."],"labId":"mat46_situasi_bajet_flip","labTitle":"Dek Kad 3D Hukum Bab 6 & Kalkulator Situasi","labProps":{"tab":"deck"},"formula":"ax + by ≤ c   |   ax + by ≥ c   |   ax + by < c   |   ax + by > c","examTip":"Bezakan situasi satu kuantiti (contohnya had laju atau tinggi terowong) dengan situasi dua pemboleh ubah yang mempunyai dua keadaan atau dua jenis barang."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 1 vs 2 Pemboleh Ubah","voiceCaption":"Asingkan enam situasi harian berikut kepada ketaksamaan satu pemboleh ubah atau dua pemboleh ubah.","voiceScript":"[curious] Jom uji kefahaman awal! Asingkan enam situasi harian berikut sama ada ia hanya memerlukan satu pemboleh ubah ataupun memerlukan dua pemboleh ubah x dan y.","prompt":"Isihkan setiap situasi berikut sama ada melibatkan SATU pemboleh ubah atau DUA pemboleh ubah:","buckets":[{"id":"satu","label":"Satu Pemboleh Ubah (1 Kuantiti)"},{"id":"dua","label":"Dua Pemboleh Ubah (x dan y)"}],"items":[{"text":"Ketinggian kenderaan h mesti kurang daripada 4.75 m untuk melepasi terowong","bucketId":"satu","note":"Hanya satu kuantiti terlibat iaitu tinggi h (h < 4.75)."},{"text":"Pembelian x buku rujukan (RM14) dan y buku latihan (RM9) tidak melebihi RM100","bucketId":"dua","note":"Dua jenis buku berbeza (14x + 9y <= 100)."},{"text":"Berat lori dengan muatan y dan tanpa muatan x berbeza selebih-lebihnya 4090 kg","bucketId":"dua","note":"Dua keadaan berat dalam unit kg yang sama (y <= x + 4090)."},{"text":"Had laju maksimum kenderaan di kawasan sekolah ialah 30 km/j","bucketId":"satu","note":"Hanya satu kuantiti laju v terlibat (v <= 30)."},{"text":"Jualan x bungkus nasi lemak telur dan y bungkus nasi lemak ayam melebihi RM120","bucketId":"dua","note":"Dua item jualan berasingan membentuk 1.5x + 3.5y > 120."},{"text":"Umur minimum p untuk memohon lesen memandu kereta ialah 17 tahun","bucketId":"satu","note":"Hanya umur p terlibat (p >= 17)."}],"explanation":"Situasi dengan hanya satu ukuran atau syarat tunggal menggunakan satu pemboleh ubah; situasi yang menggabungkan dua objek, item jualan atau keadaan berbeza memerlukan dua pemboleh ubah."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Terjemahan Bajet & Unit","voiceCaption":"Apabila menulis ketaksamaan bajet harian, seragamkan unit dahulu dan hapuskan pecahan atau perpuluhan dengan mendarab pemalar positif.","voiceScript":"[confident] Bagaimana menukarkan ayat bajet kepada ketaksamaan linear yang kemas? Pertama, seragamkan unit jika harga diberi dalam sen dan bajet dalam ringgit! Kedua, jika terdapat pecahan atau perpuluhan seperti dua belas ringgit lima puluh sen dan lapan belas ringgit lima puluh sen, tukarkan kepada pecahan berpenyebut dua lalu darab kedua-dua belah dengan dua supaya menjadi integer mudah!","title":"Menerbitkan Ketaksamaan Bajet, Penyeragaman Unit & Bentuk Setara","acronym":"UNIT • DARAB","hook":"Peraturan wajib: jangan campurkan 40 sen dengan RM60 dalam satu ketaksamaan sebelum menyamakan unit kepada sen atau ringgit!","mediaKey":"mat46_bajet_pembelian","summary":"Setiap situasi pembelian atau peruntukan bajet boleh dimodelkan sebagai ketaksamaan linear dan dipermudahkan dengan mendarab atau membahagi kedua-dua belah dengan nombor positif yang sama.","bullets":["Penghapusan Perpuluhan & Pecahan: Jika poster kecil RM12.50 (k) dan poster besar RM18.50 (b) diperuntukkan sehingga RM150.00, tulis 12.50k + 18.50b ≤ 150, iaitu (25/2)k + (37/2)b ≤ 150. Darab kedua-dua belah dengan 2 untuk mendapat bentuk integer 25k + 37b ≤ 300.","Bentuk Setara & Penukaran Unit: Ketaksamaan 14x + 9y ≤ 100 juga setara dengan 14x ≤ 100 - 9y atau 9y ≤ 100 - 14x. Bagi item dalam sen (misalnya 30 sen dan 40 sen terhadap RM50 = 5000 sen), seragamkan menjadi 30x + 40y ≤ 5000 lalu ringkaskan menjadi 3x + 4y ≤ 500."],"labId":"mat46_situasi_bajet_flip","labTitle":"Kalkulator Bajet, Nisbah & Penukaran Unit Interaktif","labProps":{"tab":"translator","caseIdx":0},"examTip":"Sentiasa nyatakan dengan jelas maksud pemboleh ubah yang dipilih (contoh: x = bilangan buku rujukan, y = bilangan buku latihan) jika soalan meminta anda memilih pemboleh ubah sendiri."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Frasa & Simbol","voiceCaption":"Padankan lima frasa situasi bajet dan kuantiti berikut dengan simbol atau ungkapan ketaksamaan yang tepat.","voiceScript":"[warm] Uji ketajaman pemahaman simbol kamu! Padankan lima frasa harian ini dengan perwakilan ketaksamaan yang paling tepat.","prompt":"Padankan setiap pernyataan situasi berikut dengan ketaksamaan yang betul:","pairs":[{"id":"u1m1","left":"Amaun perbelanjaan selebih-lebihnya RM100","right":"Jumlah kos ≤ 100"},{"id":"u1m2","left":"Hasil jualan harian perlu melebihi RM120","right":"Jumlah jualan > 120"},{"id":"u1m3","left":"Peruntukan sekurang-kurangnya RM250","right":"Jumlah dana ≥ 250"},{"id":"u1m4","left":"Bentuk lain bagi 14x + 9y ≤ 100","right":"9y ≤ 100 - 14x"},{"id":"u1m5","left":"Berat keseluruhan kurang daripada 4.75 tan","right":"Jumlah berat < 4.75"}],"explanation":"Perkataan 'selebih-lebihnya' menggunakan tanda ≤, 'sekurang-kurangnya' menggunakan ≥, manakala 'melebihi' dan 'kurang daripada' bersifat ketat (> dan <)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Penukaran Unit Sen & RM","voiceCaption":"Ramalkan bentuk ringkas ketaksamaan apabila harga kuih dalam sen dan bajet maksimum dalam ringgit.","voiceScript":"[curious] Cuba ramalkan tanpa membuat silap unit! Kelab Matematik membeli x biji karipap berharga empat puluh sen sebiji dan y potong kuih lapis berharga enam puluh sen sepotong dengan peruntukan maksimum enam puluh ringgit. Manakah ketaksamaan ringkas yang betul?","hook":"Ingat: RM60 bersamaan 6000 sen, bukan 60 sen! Bahagikan semua sebutan dengan faktor sepunya terbesar.","scenario":"Harga karipap (x) = 40 sen | Harga kuih lapis (y) = 60 sen | Peruntukan maksimum = RM60.","prompt":"Manakah ketaksamaan linear dalam bentuk integer terkecil yang mewakili situasi pembelian kuih tersebut?","options":["40x + 60y ≤ 60","2x + 3y ≤ 300","2x + 3y < 300","4x + 6y ≥ 600"],"correctIndex":1,"proofLabId":"mat46_situasi_bajet_flip","proofState":{"tab":"translator","caseIdx":2},"explanation":"Tukar RM60 menjadi 6000 sen: 40x + 60y ≤ 6000. Bahagikan kedua-dua belah dengan +20 untuk mendapat 2x + 3y ≤ 300. Perkataan 'maksimum' menggunakan tanda ≤."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Langkah Terjemahan Bajet","voiceCaption":"Susun langkah sistematik menerbitkan ketaksamaan linear daripada masalah pembelian harian.","voiceScript":"[confident] Susun blok prinsip berikut bagi membentuk aliran kerja paling selamat ketika menterjemahkan masalah bajet ke dalam ketaksamaan linear!","prompt":"Susun urutan langkah menerbitkan ketaksamaan linear bagi situasi pembelian dua barang:","hint":"Mulakan dengan mentakrif pemboleh ubah, menyamakan unit, menulis simbol, dan mempermudah pecahan...","answerTokens":["Takrifkan x dan y bagi dua item,","seragamkan unit nilai seperti sen atau RM,","pilih simbol ketaksamaan mengikut had maksimum atau minimum,","lalu darab pemalar positif untuk hapuskan pecahan."],"distractors":["tukar tanda walaupun didarab dengan nombor positif","campurkan harga sen dan RM secara terus"],"explanation":"Aliran 4 langkah ini mengelakkan kecuaian biasa SPM iaitu tersilap unit (sen vs RM) dan tertinggal tanda sama dengan pada kata kunci maksimum atau minimum.","acceptedSequences":[["Takrifkan x dan y bagi dua item,","seragamkan unit nilai seperti sen atau RM,","pilih simbol ketaksamaan mengikut had maksimum atau minimum,","lalu darab pemalar positif untuk hapuskan pecahan."]]},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Uji Faham Pemudahan Pecahan","voiceCaption":"Selesaikan masalah jualan nasi lemak dengan harga perpuluhan dan syarat keuntungan minimum melebihi seratus dua puluh ringgit.","voiceScript":"[serious] Soalan penamat Unit Satu! Seorang peniaga menjual x bungkus nasi lemak telur berharga satu ringgit lima puluh sen dan y bungkus nasi lemak ayam berharga tiga ringgit lima puluh sen. Jumlah jualan harian perlu melebihi seratus dua puluh ringgit. Pilih ketaksamaan ringkas yang tepat!","prompt":"Harga jualan sebungkus nasi lemak telur ialah RM1.50 (x) dan nasi lemak ayam ialah RM3.50 (y). Jumlah jualan harian mesti melebihi RM120 untuk mencapai keuntungan minimum. Wakilkan situasi ini dalam bentuk integer termudah.","options":["3x + 7y ≥ 240","3x + 7y > 240","15x + 35y ≤ 1200","3x + 7y > 120"],"correctIndex":1,"explanation":"Daripada 1.5x + 3.5y > 120 ('melebihi' ialah tanda ketat '>'), darabkan semua sebutan dengan +2 supaya tiada perpuluhan: 3x + 7y > 240!"}]},{"id":"mat46-u2","title":"Unit 2: Tentusah Titik, Garis Padu vs Sempang & Lorekan","subtitle":"Subtopik 6.1 (Bhg. B) — Satah Cartes, Garis y = h & x = k, Ujian Titik (Atas/Pada/Bawah), Hukum Pekali Negatif & Pantulan","iconType":"graph","iconUrl":"../assets/icons/mat46-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Satah Cartes & Konjektur Titik","voiceCaption":"Garis lurus y = mx + c membahagikan satah Cartes kepada titik pada garis, rantau atas (y > mx + c) dan rantau bawah (y < mx + c).","voiceScript":"[warm] Selamat datang ke Unit Dua! Tokoh matematik Perancis Rene Descartes memperkenalkan sistem koordinat satah Cartes yang membolehkan kita menentusahkan kedudukan titik secara visual mahupun pengiraan terus. Setiap garis lurus y sama dengan m x tambah c membahagikan satah kepada tiga bahagian: titik pada garis, rantau atas dengan y lebih besar daripada m x tambah c, dan rantau bawah dengan y lebih kecil daripada m x tambah c!","title":"Tentusah Titik pada Satah Cartes (Atas, Pada, Bawah & Garis Khas)","acronym":"A•P•B • y=h • x=k","hook":"Tanpa melukis graf sekalipun, bandingkan sahaja nilai koordinat-y titik dengan nilai (mx + c) untuk tahu sama ada titik itu di atas, pada atau di bawah garis!","mediaKey":"mat46_cartes_descartes","summary":"Garis lurus y = mx + c memisahkan satah Cartes kepada tiga kategori titik, manakala garis mendatar y = h dan garis mencancang x = k mempunyai sifat kecerunan khas.","bullets":["Garis Condong y = mx + c: Titik pada garis memenuhi y = mx + c; titik di rantau ATAS memenuhi y > mx + c; titik di rantau BAWAH memenuhi y < mx + c. Contoh garis y = -2x + 6: titik (1, 4) terletak pada garis, (2, 6) di rantau atas, dan (0, 1) di rantau bawah.","Garis Khas y = h & x = k: Garis mengufuk y = h mempunyai kecerunan sifar (m = 0), dengan rantau atas y > h dan rantau bawah y < h. Garis mencancang x = k mempunyai kecerunan tidak tertakrif, dengan rantau KANAN memenuhi x > k dan rantau KIRI memenuhi x < k."],"labId":"mat46_garis_sempadan_padu_putus_lab","labTitle":"Makmal Satah Cartes: Penentusah Titik & Penguji Garis","labProps":{"tab":"tentusah","eqIdx":0},"formula":"Pada Garis: y = mx + c   |   Rantau Atas: y > mx + c   |   Rantau Bawah: y < mx + c","examTip":"Untuk soalan tanpa melukis graf (Contoh 4), gantikan nilai x titik ke dalam sebelah kanan (mx + c), kemudian bandingkan nilai sebelah kiri (y) dengannya menggunakan simbol =, > atau <."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kedudukan Titik Uji","voiceCaption":"Ramalkan kedudukan empat titik uji terhadap garis lurus y = -3x + 6 tanpa melukis graf.","voiceScript":"[curious] Gunakan kaedah penggantian terus tanpa melukis graf! Diberi garis lurus y sama dengan negatif tiga x tambah enam. Di manakah terletaknya titik dua koma lima dan titik negatif satu koma sembilan berbanding garis lurus tersebut?","hook":"Bandingkan koordinat-y titik dengan nilai ungkapan -3x + 6 sebelum memilih jawapan!","scenario":"Persamaan sempadan: y = -3x + 6. Uji dua titik: P(2, 5) dan Q(-1, 9).","prompt":"Antara pernyataan berikut, yang manakah menerangkan kedudukan titik P(2, 5) dan Q(-1, 9) dengan tepat?","options":["P(2, 5) di rantau bawah kerana 5 < 6; Q(-1, 9) di rantau atas","P(2, 5) di rantau atas (y > -3x + 6) kerana 5 > 0; Q(-1, 9) berada tepat PADA garis (y = -3x + 6) kerana 9 = 9","Kedua-dua P dan Q berada di rantau bawah garis lurus","P(2, 5) tepat pada garis manakala Q(-1, 9) di rantau bawah"],"correctIndex":1,"proofLabId":"mat46_garis_sempadan_padu_putus_lab","proofState":{"tab":"tentusah","eqIdx":1,"testPt":[2,5]},"explanation":"Bagi P(2, 5): -3(2) + 6 = 0, dan koordinat y = 5 > 0, maka P memenuhi y > -3x + 6 (rantau atas). Bagi Q(-1, 9): -3(-1) + 6 = 9, dan y = 9 = 9, maka Q terletak tepat PADA garis!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Garis Padu, Sempang & Pekali Negatif","voiceCaption":"Garis padu digunakan untuk tanda ≤ dan ≥, garis sempang untuk < dan >, manakala pekali negatif y memerlukan pembalikan simbol ketaksamaan.","voiceScript":"[confident] Inilah peraturan paling penting ketika melorek rantau! Tanda kurang daripada atau lebih besar daripada dilukis sebagai garis sempang kerana titik di atas garis itu ditolak. Tanda inklusif dengan garis bawah dilukis sebagai garis padu kerana titik pada garis itu sah. Awas dengan perangkap pekali negatif seperti x tolak y lebih besar daripada empat: apabila dibahagi dengan negatif satu, tanda lebih besar daripada bertukar menjadi kurang daripada!","title":"Garis Padu (≤, ≥) vs Garis Sempang (<, >) & Perangkap Pekali Negatif","acronym":"PADU • SEMPANG • -y","hook":"Perangkap maut Kertas 1 & 2: dalam x - y > 4, tanda asal ialah '>', tetapi selepas y dijadikan perkara rumus ia menjadi y < x - 4 — lorek rantau BAWAH!","mediaKey":"mat46_padu_vs_sempang","summary":"Jenis garis sempadan menentukan keahlian titik pada garis itu sendiri, manakala penyusunan semula y sebagai perkara rumus memastikan arah lorekan tidak tersalah.","bullets":["Garis Sempang vs Garis Padu: Ketaksamaan y > mx + c dan y < mx + c (atau x > k, x < k) menggunakan GARIS SEMPANG kerana titik pada garis sempadan tidak termasuk dalam rantau penyelesaian. Ketaksamaan y ≥ mx + c dan y ≤ mx + c menggunakan GARIS PADU kerana titik pada garis termasuk.","Hukum Songsang Pekali Negatif: Sentiasa susun y di sebelah kiri dengan pekali positif sebelum melorek. Bagi x - y > 4: tolak x menjadi -y > -x + 4, kemudian bahagi semua dengan -1 -> tanda '>' TERBALIK menjadi y < x - 4 (garis sempang, lorek rantau bawah!)."],"labId":"mat46_garis_sempadan_padu_putus_lab","labTitle":"Simulator Garis Padu/Sempang & Penguji Titik Grid Interaktif","labProps":{"tab":"lorek","lineKind":"condong","op":">=","m":1,"c":-1},"examTip":"Jika masih ragu sama ada hendak melorek atas atau bawah bagi ax + by > c, gantikan titik uji mudah (0, 0) jika garis tidak melalui asalan. Jika benar, lorek bahagian yang mengandungi (0, 0)!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Jenis Garis & Rantau","voiceCaption":"Kelaskan enam ketaksamaan berikut sama ada menggunakan garis padu ataupun garis sempang.","voiceScript":"[curious] Asingkan keenam-enam ketaksamaan linear berikut mengikut jenis garis sempadannya sama ada garis padu ataupun garis sempang. Berhati-hati membaca tanda ketaksamaan!","prompt":"Isihkan setiap ketaksamaan berikut mengikut jenis garis sempadan yang betul apabila dilukis pada satah Cartes:","buckets":[{"id":"padu","label":"Garis Padu (Titik Garis Termasuk)"},{"id":"sempang","label":"Garis Sempang (Titik Garis Tidak Termasuk)"}],"items":[{"text":"y ≤ 2x + 3","bucketId":"padu","note":"Simbol ≤ menyertakan semua titik pada garis y = 2x + 3."},{"text":"x - y > 4","bucketId":"sempang","note":"Menjadi y < x - 4; tanda ketat '<' menggunakan garis sempang."},{"text":"y ≥ 0  (paksi-x)","bucketId":"padu","note":"Simbol ≥ menggunakan garis padu tepat pada paksi-x."},{"text":"2y < x + 4","bucketId":"sempang","note":"Menjadi y < (1/2)x + 2; tanda '<' menggunakan garis sempang."},{"text":"x + y ≥ -3","bucketId":"padu","note":"Menjadi y ≥ -x - 3; tanda ≥ menggunakan garis padu."},{"text":"x > -3","bucketId":"sempang","note":"Garis mencancang pada x = -3 dilukis putus-putus (sempang)."}],"explanation":"Semua ketaksamaan dengan tanda inklusif (≤, ≥) dilukis dengan garis padu, manakala tanda ketat (<, >) dilukis dengan garis sempang."},{"type":"match","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Padan Ketaksamaan & Arah Lorekan","voiceCaption":"Padankan lima ketaksamaan linear berikut dengan arah lorekan dan sifat garis sempadannya yang betul.","voiceScript":"[confident] Uji ketepatan membaca lorekan graf! Padankan lima ketaksamaan berikut dengan ciri garis dan arah rantau yang betul.","prompt":"Padankan setiap ketaksamaan linear berikut dengan huraian garis sempadan dan arah lorekannya:","pairs":[{"id":"u2m1","left":"y < (1/3)x + 3","right":"Garis sempang; lorek di rantau BAWAH garis"},{"id":"u2m2","left":"y ≥ -(1/2)x - 2","right":"Garis padu; lorek di rantau ATAS garis"},{"id":"u2m3","left":"x ≤ 0","right":"Garis padu pada paksi-y; lorek di sebelah KIRI"},{"id":"u2m4","left":"x - y < -3","right":"Susun jadi y > x + 3; garis sempang & lorek ATAS"},{"id":"u2m5","left":"y > -2","right":"Garis mengufuk sempang pada y = -2; lorek ATAS"}],"explanation":"Pastikan y di sebelah kiri berpekali positif (+1) sebelum membaca tanda '>' (atas) atau '<' (bawah); bagi x saja, '>' ialah kanan dan '<' ialah kiri."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Prosedur Pekali Negatif","voiceCaption":"Susun langkah menyelesaikan dan melorek ketaksamaan yang mempunyai pekali negatif pada pemboleh ubah y.","voiceScript":"[warm] Susun urutan langkah yang betul untuk melorek ketaksamaan seperti dua x tolak y lebih besar daripada empat tanpa terperangkap oleh tanda negatif!","prompt":"Susun langkah yang betul sebelum melorek ketaksamaan berbentuk ax - by ≥ c:","hint":"Asingkan sebutan y, bahagi dengan nombor negatif, terbalikkan simbol, lalu pilih garis padu atau sempang...","answerTokens":["Pindahkan sebutan ax ke sebelah kanan,","bahagi kedua-dua belah dengan -b,","songsangkan arah tanda ketaksamaan,","kemudian lorek mengikut simbol baharu dan jenis garis."],"distractors":["kekalkan arah tanda asal walaupun membahagi negatif","tukar semua garis menjadi sempang"],"explanation":"Membahagi dengan pekali negatif (-b) wajib menyongsangkan arah tanda ketaksamaan sebelum menentukan rantau atas atau bawah.","acceptedSequences":[["Pindahkan sebutan ax ke sebelah kanan,","bahagi kedua-dua belah dengan -b,","songsangkan arah tanda ketaksamaan,","kemudian lorek mengikut simbol baharu dan jenis garis."]]},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s7","voiceToneLabel":"Pantulan Rantau Paksi-x & Paksi-y","voiceCaption":"Pantulan pada paksi-x menggantikan y dengan negatif y, manakala pantulan pada paksi-y menggantikan x dengan negatif x.","voiceScript":"[curious] Pernahkah kamu lihat soalan Praktis Masteri tentang pantulan rantau berlorek pada paksi-x atau paksi-y? Sangat mudah jika kamu ingat rumus koordinat pantulan! Apabila suatu rantau dipantulkan pada paksi-x, setiap titik x koma y menjadi x koma negatif y, jadi gantikan sahaja y dengan negatif y dalam ketaksamaan. Apabila dipantulkan pada paksi-y, gantikan x dengan negatif x!","title":"Pantulan Rantau Berlorek pada Paksi-x & Paksi-y (KBAT Masteri)","acronym":"(x,-y) • (-x,y)","hook":"Cara kilat menentukan ketaksamaan imej pantulan: ganti y -> -y bagi pantulan paksi-x, dan ganti x -> -x bagi pantulan paksi-y!","summary":"Transformasi pantulan pada paksi koordinat menukarkan tanda pemboleh ubah yang serenjang dengan paksi pantulan tersebut, sekaligus mengubah persamaan sempadan dan arah ketaksamaan.","bullets":["Pantulan pada Paksi-x [(x, y) -> (x, -y)]: Gantikan setiap y dalam ketaksamaan asal dengan (-y), kemudian darab -1 (jangan lupa terbalikkan tanda!). Contohnya, y ≤ x + 2 dan y ≥ 0 menjadi -y ≤ x + 2 (iaitu y ≥ -x - 2) dan y ≤ 0.","Pantulan pada Paksi-y [(x, y) -> (-x, y)]: Gantikan setiap x dengan (-x), manakala y kekal sama. Contohnya, y ≤ x + 2 dan x ≥ 0 menjadi y ≤ -x + 2 dan -x ≥ 0 (iaitu x ≤ 0)."],"labId":"mat46_garis_sempadan_padu_putus_lab","labTitle":"Simulator Pantulan Rantau pada Paksi-x dan Paksi-y","labProps":{"tab":"pantulan"},"examTip":"Semak semula imej pantulan menggunakan satu titik uji! Jika titik (1, 1) dalam rantau asal, imej pantulan paksi-x ialah (1, -1) dan mesti memuaskan ketaksamaan baharu."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Uji Faham Pekali Negatif & Pantulan","voiceCaption":"Tentukan gabungan huraian garis sempadan dan kedudukan rantau bagi ketaksamaan 2x - 3y > 6 serta titik ujinya.","voiceScript":"[serious] Soalan penamat Unit Dua! Diberi ketaksamaan dua x tolak tiga y lebih besar daripada enam. Antara kenyataan berikut, manakah yang tepat tentang jenis garis, arah lorekan serta kedudukan titik tiga koma negatif dua?","prompt":"Bagi ketaksamaan linear 2x - 3y > 6, manakah huraian yang PALING TEPAT?","options":["y > (2/3)x - 2; garis sempang, lorek rantau atas, titik (3, -2) tidak termasuk","y < (2/3)x - 2; garis sempang, lorek rantau bawah, titik (3, -2) berada di dalam rantau","y ≤ (2/3)x - 2; garis padu, lorek rantau bawah, titik (3, 0) berada di dalam rantau","y < -(2/3)x + 2; garis sempang, lorek rantau bawah, titik (3, -2) di luar rantau"],"correctIndex":1,"explanation":"Susun 2x - 3y > 6 -> -3y > -2x + 6 -> bahagi dengan -3 dan terbalikkan tanda menjadi y < (2/3)x - 2 (garis sempang, rantau bawah). Uji (3, -2): 2(3) - 3(-2) = 12 > 6 (Benar, dalam rantau!)."}]},{"id":"mat46-u3","title":"Unit 3: Sistem Ketaksamaan Linear & 11 Frasa Harian","subtitle":"Subtopik 6.2 (Bhg. A) — Gabungan Pelbagai Kekangan, Jadual 11 Frasa KSSM, Sukuan Pertama (x ≥ 0, y ≥ 0) & Nisbah Songsang","iconType":"scale","iconUrl":"../assets/icons/mat46-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Sistem & Jadual 11 Frasa","voiceCaption":"Gabungan dua atau lebih ketaksamaan linear membentuk satu sistem ketaksamaan linear bagi memodelkan pelbagai kekangan serentak seperti logistik bas dan van.","voiceScript":"[warm] Selamat datang ke Unit Tiga! Dalam kehidupan sebenar, keputusan perniagaan bukan ada satu kekangan sahaja. Sebuah agensi pelancongan perlu mengangkut seratus lima puluh orang penumpang dan dua ribu kilogram bagasi dengan bas dan van, tetapi bas maksimum hanya empat buah! Gabungan dua atau lebih ketaksamaan linear inilah yang dipanggil sistem ketaksamaan linear!","title":"6.2 Sistem Ketaksamaan Linear & Matriks 11 Frasa KSSM","acronym":"SISTEM • 11 FRASA","hook":"Gabungan >= 2 ketaksamaan linear dikenali sebagai Sistem Ketaksamaan Linear — asas pengoptimuman perniagaan dan logistik moden!","mediaKey":"mat46_bas_van_logistik","summary":"Sistem ketaksamaan linear menggabungkan beberapa kekangan serentak, yang diterjemahkan secara tepat menggunakan kata kunci hubungan antara pemboleh ubah x, y dan pemalar k.","bullets":["Contoh Pengenalan Bas & Van: Katakan b = bas (muatan 32 org, 350 kg) dan v = van (8 org, 100 kg). Kekangan serentak ialah penumpang 32b + 8v ≥ 150, bagasi 350b + 100v ≥ 2000, bilangan bas maksimum b ≤ 4, serta b ≥ 0 dan v ≥ 0.","11 Frasa Utama KSSM: 'tidak kurang daripada' (≥), 'tidak lebih daripada' (≤), 'sekurang-kurangnya k kali x' (y ≥ kx), 'selebih-lebihnya k kali x' (y ≤ kx), 'maksimum y ialah k' (y ≤ k), 'minimum y ialah k' (y ≥ k), 'beza y dan x kurang daripada k' (y - x < k), 'y melebihi x sekurang-kurangnya k' (y - x ≥ k)."],"labId":"mat46_situasi_bajet_flip","labTitle":"Matriks Interaktif 11 Frasa KSSM & Simulator Bas/Van","labProps":{"tab":"frasa11"},"examTip":"Hafal perbezaan halus antara 'lebih besar daripada' (>) dengan 'tidak kurang daripada' (≥), serta antara 'kurang daripada' (<) dengan 'tidak lebih daripada' (≤)."},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan 5 Frasa Kompleks 6.2","voiceCaption":"Padankan lima pernyataan daripada jadual 11 frasa KSSM dengan ketaksamaan linear tepatnya.","voiceScript":"[curious] Mari uji kelancaran kamu menterjemah frasa kompleks! Padankan lima pernyataan ini dengan ungkapan ketaksamaan linear yang betul.","prompt":"Padankan setiap pernyataan situasi daripada jadual 6.2 dengan ketaksamaan linear yang betul:","pairs":[{"id":"u3m1","left":"y sekurang-kurangnya k kali x","right":"y ≥ kx"},{"id":"u3m2","left":"y selebih-lebihnya k kali x","right":"y ≤ kx"},{"id":"u3m3","left":"y melebihi x sekurang-kurangnya k","right":"y - x ≥ k"},{"id":"u3m4","left":"Beza y dan x kurang daripada k","right":"y - x < k"},{"id":"u3m5","left":"y tidak kurang daripada x","right":"y ≥ x"}],"explanation":"Perkataan 'sekurang-kurangnya' membawa makna ≥, 'selebih-lebihnya' ialah ≤, manakala 'melebihi x sekurang-kurangnya k' ditulis sebagai perbezaan y - x ≥ k."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Sistem Pelbagai Syarat & Sukuan I","voiceCaption":"Situasi harian mengehadkan graf ke sukuan pertama (x ≥ 0, y ≥ 0), dan apabila x berada di sebelah kiri nisbah, jadikan y perkara rumus sebelum melorek.","voiceScript":"[confident] Apabila soalan memberi tiga atau empat syarat pembelian atau pemilihan peserta, tulis setiap syarat secara berasingan dengan cermat. Contohnya dalam tempahan dakwat jenama x dan y, jumlah tidak melebihi dua puluh lima bermaksud x tambah y kurang daripada atau sama dengan dua puluh lima, manakala y sekurang-kurangnya dua kali x bermaksud y lebih besar atau sama dengan dua x!","title":"Membina Sistem Pelbagai Syarat, Sukuan Pertama & Susunan y","acronym":"x≥0 • y≥0","hook":"Jika syarat berbunyi 'bilangan peserta perempuan (x) sekurang-kurangnya dua kali peserta lelaki (y)', tulis x >= 2y, lalu susun kepada y <= (1/2)x sebelum melorek!","summary":"Sistem ketaksamaan daripada masalah harian sentiasa disertakan kekangan fizikal bukan negatif x ≥ 0 dan y ≥ 0 apabila pemboleh ubah mewakili bilangan atau ukuran.","bullets":["Contoh Pemodelan Berbilang Syarat (Kem & Tempahan): Bagi Kem Kepimpinan (x = T5, y = T4): jumlah selebih-lebihnya 40 (x + y ≤ 40), T5 tidak kurang daripada T4 (x ≥ y), dan sekurang-kurangnya 15 peserta T4 (y ≥ 15). Bagi Kedai Komputer: jumlah <= 25 (x + y ≤ 25), jenama y sekurang-kurangnya 2 kali x (y ≥ 2x), y tidak melebihi 8 (y ≤ 8), dan pembelian ≤ RM400 (14x + 18y ≤ 400).","Sukuan Pertama & Perkara Rumus y: Nilai bilangan atau jarak sentiasa positif atau sifar (x ≥ 0, y ≥ 0), maka graf hanya dilukis pada Sukuan I. Apabila ketaksamaan berbentuk x ≥ 2y, tukar kepada y ≤ (1/2)x supaya mudah menentukan lorekan di bawah garis."],"labId":"mat46_situasi_bajet_flip","labTitle":"Uji Pelbagai Kekangan Serentak pada Kalkulator Situasi","labProps":{"tab":"translator","caseIdx":1},"examTip":"Baca dengan teliti frasa soalan Kertas 2: 'tulis tiga ketaksamaan linear SELAIN x >= 0 dan y >= 0'. Jangan senaraikan x >= 0 sebagai salah satu daripada tiga jawapan jika dikecualikan!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Perangkap Nisbah Terbalik","voiceCaption":"Ramalkan ketaksamaan yang betul apabila pemboleh ubah x adalah sekurang-kurangnya tiga kali ganda pemboleh ubah y.","voiceScript":"[curious] Awas dengan perangkap paling kerap memerangkap calon S P M! Jika bilangan pelajar aliran sains x adalah sekurang-kurangnya tiga kali bilangan pelajar aliran seni y, ketaksamaan manakah yang benar?","hook":"Siapakah yang lebih ramai — pelajar sains (x) atau pelajar seni (y)? Letakkan pemboleh ubah yang lebih ramai pada sebelah yang lebih besar!","scenario":"Kelab Rekacipta memilih x orang pelajar sains dan y orang pelajar seni. Syarat: bilangan pelajar sains sekurang-kurangnya 3 kali bilangan pelajar seni, jumlah tidak melebihi 40, dan minimum pelajar seni ialah 4 orang.","prompt":"Manakah sistem ketaksamaan linear (selain x ≥ 0 dan y ≥ 0) yang betul bagi syarat pemilihan kelab ini?","options":["x + y ≤ 40,  y ≥ 3x,  y ≥ 4","x + y ≤ 40,  x ≥ 3y,  y ≥ 4","x + y < 40,  x ≤ 3y,  x ≥ 4","x + y ≤ 40,  3x ≥ y,  y ≤ 4"],"correctIndex":1,"proofLabId":"mat46_situasi_bajet_flip","proofState":{"tab":"translator","caseIdx":1},"explanation":"Pelajar sains (x) lebih ramai daripada pelajar seni (y) sekurang-kurangnya 3 kali ganda, maka x ≥ 3y (setara dengan y ≤ x/3). Jumlah tidak melebihi 40 ialah x + y ≤ 40 dan minimum seni ialah y ≥ 4."},{"type":"sort","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Isih Had Minimum vs Maksimum","voiceCaption":"Asingkan enam petunjuk bahasa berikut kepada kategori had minimum (≥) atau had maksimum (≤).","voiceScript":"[warm] Asingkan keenam-enam kata kunci bahasa Melayu berikut kepada dua bakul sama ada ia mewakili had minimum atau had maksimum!","prompt":"Isihkan setiap ungkapan kekangan berikut ke dalam kategori simbol ≥ atau ≤:","buckets":[{"id":"min","label":"Had Minimum / Tidak Kurang (≥)"},{"id":"maks","label":"Had Maksimum / Tidak Lebih (≤)"}],"items":[{"text":"Bilangan pokok cili hijau sekurang-kurangnya 100 pokok","bucketId":"min","note":"Minimum 100 bermaksud ≥ 100."},{"text":"Pengeluaran maksimum kasut ialah 500 pasang","bucketId":"maks","note":"Tidak boleh melebihi 500 -> ≤ 500."},{"text":"Bilangan kemeja yang dibeli tidak melebihi 50 helai","bucketId":"maks","note":"'Tidak melebihi' ialah ≤ 50."},{"text":"Peserta dewasa tidak kurang daripada peserta kanak-kanak","bucketId":"min","note":"'Tidak kurang daripada' bermaksud ≥."},{"text":"Kasut kanak-kanak selebih-lebihnya 3 kali kasut dewasa","bucketId":"maks","note":"'Selebih-lebihnya' bermaksud ≤."},{"text":"Muatan penumpang bas dan van mestilah menampung 150 orang atau lebih","bucketId":"min","note":"Perlu menampung sekurang-kurangnya 150 -> ≥ 150."}],"explanation":"Kunci pantas: 'sekurang-kurangnya / tidak kurang / minimum' ialah ≥, manakala 'selebih-lebihnya / tidak melebihi / maksimum' ialah ≤."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Prinsip Sistem 6.2a","voiceCaption":"Susun urutan strategi membina sistem ketaksamaan daripada ayat masalah perniagaan.","voiceScript":"[confident] Susun strategi membina sistem ketaksamaan linear daripada jadual syarat supaya setiap kekangan ditulis dengan tepat dan sedia dilorek!","prompt":"Susun urutan langkah menerbitkan sistem ketaksamaan daripada sesuatu situasi masalah:","hint":"Kenal pasti x dan y, tukar setiap frasa had, dan susun supaya y mudah dilorek...","answerTokens":["Padankan pemboleh ubah x dan y dengan objek tepat,","terjemahkan setiap syarat ayat kepada ketaksamaan berasingan,","sertakan kekangan sukuan pertama x ≥ 0 dan y ≥ 0,","lalu jadikan y perkara rumus sebelum melukis graf."],"distractors":["gabungkan semua syarat menjadi satu persamaan tunggal","abaikan urutan nisbah antara x dengan y"],"explanation":"Menjadikan y perkara rumus dan mengenal pasti dengan tepat pemboleh ubah mana mewakili objek x dan y mengelakkan kesilapan songsang.","acceptedSequences":[["Padankan pemboleh ubah x dan y dengan objek tepat,","terjemahkan setiap syarat ayat kepada ketaksamaan berasingan,","sertakan kekangan sukuan pertama x ≥ 0 dan y ≥ 0,","lalu jadikan y perkara rumus sebelum melukis graf."]]},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Uji Faham Sistem 4 Syarat","voiceCaption":"Tentukan sistem ketaksamaan lengkap bagi kedai komputer yang menempah dua jenama dakwat pencetak.","voiceScript":"[serious] Soalan penamat Unit Tiga berdasarkan Contoh Lapan! Sebuah kedai membeli x unit dakwat jenama P berharga empat belas ringgit dan y unit dakwat jenama Q berharga lapan belas ringgit. Jumlah unit tidak melebihi dua puluh lima, jenama Q sekurang-kurangnya dua kali jenama P, jenama Q selebih-lebihnya lapan unit, dan kos tidak melebihi empat ratus ringgit. Pilih sistem yang tepat!","prompt":"Sebuah kedai memesan x unit dakwat jenama P (RM14/unit) dan y unit dakwat jenama Q (RM18/unit). Syarat pesanan: (1) jumlah unit tidak melebihi 25, (2) bilangan y sekurang-kurangnya 2 kali x, (3) bilangan y maksimum 8 unit, dan (4) jumlah pembelian tidak melebihi RM400. Manakah sistem ketaksamaan yang tepat?","options":["x + y ≤ 25,  y ≥ 2x,  y ≤ 8,  14x + 18y ≤ 400","x + y ≤ 25,  x ≥ 2y,  y ≤ 8,  14x + 18y ≤ 400","x + y < 25,  y ≥ 2x,  y ≥ 8,  14x + 18y ≤ 400","x + y ≤ 25,  y ≤ 2x,  x ≤ 8,  18x + 14y ≤ 400"],"correctIndex":0,"explanation":"Semak satu per satu: jumlah tidak melebihi 25 -> x + y ≤ 25; y sekurang-kurangnya 2 kali x -> y ≥ 2x; maksimum y ialah 8 -> y ≤ 8; kos tidak melebihi RM400 -> 14x + 18y ≤ 400."}]},{"id":"mat46-u4","title":"Unit 4: Rantau Sepunya, Songsangan Graf & Pengoptimuman","subtitle":"Subtopik 6.2 (Bhg. B) — Jadual Titik Uji (A, B, C, D), 3 Langkah Melorek, Menulis 3 Ketaksamaan & Masalah Nilai Min/Maks","iconType":"map","iconUrl":"../assets/icons/mat46-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Titik Uji Rantau Sepunya","voiceCaption":"Rantau sepunya bagi suatu sistem ketaksamaan ialah kawasan tunggal di mana kesemua ketaksamaan dalam sistem bernilai benar secara serentak.","voiceScript":"[warm] Selamat datang ke Unit Empat! Apabila beberapa garis lurus bersilang pada satah Cartes, satah terbahagi kepada beberapa rantau seperti A, B, C dan D. Bagaimana memilih rantau sepunya dengan tepat? Ambil satu titik sampel daripada setiap rantau, gantikan ke dalam semua ketaksamaan, dan hanya rantau yang menghasilkan keputusan BENAR untuk kesemua ketaksamaan ialah rantau sepunya!","title":"Menentusahkan Rantau Sepunya Menggunakan Jadual Titik Uji","acronym":"BENAR + BENAR","hook":"Jika terdapat tiga ketaksamaan dalam sistem, rantau sepunya mesti menghasilkan BENAR + BENAR + BENAR — gagal satu sahaja bermakna rantau itu ditolak!","mediaKey":"mat46_rantau_sepunya_graf","summary":"Konjektur titik dalam suatu sistem ketaksamaan disahkan dengan menguji sekurang-kurangnya satu titik daripada setiap kawasan terbahagi ke dalam semua ketaksamaan terlibat.","bullets":["Jadual Benar/Palsu: Sebagai contoh bagi sistem x + y ≤ 8 dan y ≥ 3, ujian pada titik (2, 1) dari rantau A memberi Benar dan Palsu, titik (2, 7) dari C memberi Palsu dan Benar, manakala titik (2, 5) dan (3, 4) dari rantau B memberi Benar untuk kedua-duanya -> Rantau B ialah rantau sepunya.","Contoh 9 KSSM: Bagi y ≤ (3/4)x + 2 dan x + y ≥ 7, hanya rantau D (diuji dengan titik (8, 6): 6 ≤ 8 Benar dan 14 ≥ 7 Benar) memenuhi kedua-duanya serentak."],"labId":"mat46_sistem_rantau_sepunya_lab","labTitle":"Inspektor Jadual Titik Uji Rantau (A, B, C, D)","labProps":{"tab":"uji","preset":"cth9"},"examTip":"Sentiasa pilih titik sampel yang jelas berada di tengah-tengah rantau (elakkan titik yang terlalu hampir atau di atas garis sempadan) supaya kiraan Benar/Palsu cepat dan mudah!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Rantau 3 Kekangan","voiceCaption":"Uji koordinat daripada rantau A, B, C dan D untuk menentukan rantau sepunya bagi tiga ketaksamaan Praktis 6.2b.","voiceScript":"[curious] Cuba selesaikan soalan Praktis enam perpuluhan dua b ini secara mental! Tiga garis membahagi graf kepada empat rantau: Rantau A mempunyai titik lapan koma empat, Rantau B mempunyai tiga koma lima, Rantau C mempunyai tiga koma satu, dan Rantau D mempunyai lapan koma tujuh perpuluhan lima. Rantau manakah yang memuaskan y kurang atau sama dengan enam, y kurang atau sama dengan x, dan x tambah y lebih besar atau sama dengan enam serentak?","hook":"Uji setiap titik pada ketiga-tiga syarat: (1) y <= 6, (2) y <= x, dan (3) x + y >= 6!","scenario":"Titik uji setiap rantau: Rantau A (8, 4) | Rantau B (3, 5) | Rantau C (3, 1) | Rantau D (8, 7.5).","prompt":"Rantau manakah yang memenuhi kesemua tiga ketaksamaan y ≤ 6, y ≤ x dan x + y ≥ 6?","options":["Rantau A dengan titik uji (8, 4)","Rantau B dengan titik uji (3, 5)","Rantau C dengan titik uji (3, 1)","Rantau D dengan titik uji (8, 7.5)"],"correctIndex":0,"proofLabId":"mat46_sistem_rantau_sepunya_lab","proofState":{"tab":"uji","preset":"p62b","region":"A"},"explanation":"Titik (8, 4) di Rantau A: y = 4 ≤ 6 (Benar), y = 4 ≤ 8 = x (Benar), dan 8 + 4 = 12 ≥ 6 (Benar). Rantau B gagal y ≤ x (5 > 3), Rantau C gagal x + y ≥ 6 (4 < 6), dan Rantau D gagal y ≤ 6 (7.5 > 6)!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"3 Langkah Lorek & Songsang Graf","voiceCaption":"Melorek rantau sepunya dilakukan dalam tiga langkah berhuruf, manakala menulis tiga ketaksamaan daripada graf memerlukan pencarian kecerunan m dan pintasan-y c.","voiceScript":"[confident] Sekarang kuasai dua kemahiran wajib Kertas Dua! Pertama, melukis dan melorek rantau sepunya: tukar ketaksamaan ke persamaan untuk lukis garis padu atau sempang, tanda setiap kawasan dengan huruf berbeza, lalu lorek hanya kawasan yang mengandungi kesemua huruf. Kedua, kemahiran songsang iaitu diberi graf berlorek dan diminta menulis tiga ketaksamaan: cari kecerunan m dan pintasan c setiap sempadan, dan semak garis padu atau sempang!","title":"3 Langkah Melorek Rantau Sepunya & Dekoder Songsang Graf","acronym":"LUKIS • TANDA • LOREK","hook":"Markah penuh Kertas 2: jangan sesekali biarkan garis lorekan terkeluar daripada sempadan rantau sepunya, dan semak sama ada setiap tepi poligon itu garis padu atau sempang!","summary":"Menentukan rantau sepunya secara melukis dan membina semula ketaksamaan daripada gambar rajah berlorek merupakan kemahiran dua hala paling penting dalam Subtopik 6.2.","bullets":["3 Langkah Melorek Rantau Sepunya: (1) Tukar setiap ketaksamaan kepada persamaan linear, plot jadual titik, dan lukis garis lurus (padu untuk ≤ / ≥; sempang untuk < / >). (2) Tandakan kawasan setiap syarat dengan huruf berlainan seperti A, B, C. (3) Kenal pasti kawasan pertindihan semua huruf dan lorek penuh tanpa terkeluar sempadan.","Kemahiran Songsang (Contoh 12 & 13): Bagi setiap sisi rantau berlorek, hitung kecerunan m = (y₂ - y₁)/(x₂ - x₁) dan baca pintasan-y (c) untuk menulis y = mx + c (atau y = h bagi mendatar, x = k bagi mencancang, y = 0 bagi paksi-x, x = 0 bagi paksi-y), kemudian pilih simbol mengikut arah lorekan serta padu/sempang."],"labId":"mat46_sistem_rantau_sepunya_lab","labTitle":"Pembina 3 Kekangan Interaktif & Dekoder Songsang Graf","labProps":{"tab":"songsang","songPreset":"c12a"},"formula":"m = (y₂ - y₁) / (x₂ - x₁)   |   Paksi-x: y = 0   |   Paksi-y: x = 0","examTip":"Apabila diminta menyatakan 3 ketaksamaan daripada rajah, paksi-x (y ≥ 0 atau y ≤ 0) dan paksi-y (x ≥ 0 atau x ≤ 0) sering menjadi salah satu daripada tiga ketaksamaan jika ia membentuk sisi poligon berlorek!"},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Sempadan Graf Songsang","voiceCaption":"Padankan lima sisi sempadan graf rantau berlorek dengan ketaksamaan yang tepat.","voiceScript":"[warm] Uji kemahiran songsang graf kamu! Padankan kelima-lima huraian sisi poligon berlorek ini dengan ketaksamaan yang betul.","prompt":"Padankan setiap ciri sempadan rantau berlorek dengan ketaksamaan linear yang betul:","pairs":[{"id":"u4m1","left":"Di bawah garis sempang melalui (0, 8) dan (8, 0)","right":"x + y < 8"},{"id":"u4m2","left":"Di sebelah kanan paksi-y bersempadan padu","right":"x ≥ 0"},{"id":"u4m3","left":"Di bawah garis padu melalui (0, 2) dan (4, 0)","right":"y ≤ -(1/2)x + 2"},{"id":"u4m4","left":"Di atas garis padu melalui (0, -4) dan (4, 0)","right":"y ≥ x - 4"},{"id":"u4m5","left":"Di bawah garis sempang selari paksi-x pada y = -2","right":"y < -2"}],"explanation":"Sentiasa sahkan dua perkara bagi setiap sisi rantau berlorek: persamaan garis lurus (m dan c) serta arah tanda (< / > sempang atau ≤ / ≥ padu)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Pengoptimuman & Justifikasi Nilai","voiceCaption":"Rantau sepunya pada sukuan pertama digunakan untuk menentukan julat nilai minimum dan maksimum, mengira pendapatan maksimum atau kos minimum, serta menjustifikasi nilai di luar rantau.","voiceScript":"[excited] Tahukah kamu sistem ketaksamaan linear merupakan asas pengaturcaraan linear dalam perniagaan untuk memaksimumkan keuntungan dengan kos minimum? Daripada rantau sepunya pada sukuan pertama, kita dapat membaca julat nilai minimum dan maksimum dengan melukis garis lurus nilai tetap x atau y, menghitung pendapatan maksimum seperti lima puluh x tambah tujuh puluh lima y, dan memberi justifikasi mengapa sesuatu titik ditolak jika berada di luar rantau berlorek!","title":"6.2 Penyelesaian Masalah Pengoptimuman, Julat & Justifikasi Grafik","acronym":"MIN • MAKS • R","hook":"Untuk mencari julat y apabila x ditetapkan (contohnya x = 15), lukis garis tegak x = 15 dan baca titik masuk serta keluar pada rantau sepunya R!","summary":"Semua titik (x, y) di dalam atau di atas sempadan padu rantau sepunya R memenuhi syarat masalah, membolehkan penentuan nilai optimum pendapatan, kos atau bilangan maksimum peserta.","bullets":["Membaca Julat & Nilai Maksimum (Contoh 14 & 15): Bagi sistem Kem Koir (x + y ≤ 20, x ≥ 2y), apabila peserta lelaki y = 5, rantau sepunya memberi 10 ≤ x ≤ 15 (minimum 10, maksimum 15 perempuan). Sebaliknya, y = 8 tidak mematuhi syarat kerana garis y = 8 berada di luar rantau berlorek. Bagi Taman Tema (x + y ≤ 30, y ≥ x), titik persilangan bucu (15, 15) mengehadkan bilangan maksimum kanak-kanak kepada 15 orang.","Pengoptimuman Pendapatan (Praktis Masteri Q7): Puan Jasmin menjahit x baju kurung pesak (RM50) dan y baju kurung moden (RM75) dengan syarat x + y ≤ 40, x ≤ 25, y ≥ 10. Apabila x = 15, nilai maksimum y dalam rantau sepunya ialah 40 - 15 = 25 helai moden -> Pendapatan maksimum = 50(15) + 75(25) = RM2 625!"],"labId":"mat46_sistem_rantau_sepunya_lab","labTitle":"Simulator Pengoptimuman Bucu Poligon (Koir, Jahitan & Taman Tema)","labProps":{"tab":"bina3","sysIdx":2,"probeX":15},"formula":"Pendapatan P = ax + by   |   Titik Sah ⇔ (x, y) ∈ Rantau Sepunya R","examTip":"Apabila soalan bertanya 'Adakah pembelian 60 meter kain abstrak dan 80 meter kain bunga memuaskan sistem?', gantikan (80, 60) ke dalam ketaksamaan atau tunjukkan ia berada di luar rantau berlorek — nyatakan dengan jelas syarat mana yang dilanggar!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Isih Titik Sah vs Ditolak","voiceCaption":"Uji enam titik (x, y) berikut untuk menentukan sama ada ia berada di dalam rantau sepunya x + y <= 20, x >= 2y, x >= 0, y >= 0 ataupun di luarnya.","voiceScript":"[curious] Jadilah juruaudit rantau sepunya! Untuk sistem Kem Koir x tambah y kurang atau sama dengan dua puluh dan x sekurang-kurangnya dua kali y pada sukuan pertama, asingkan enam titik berikut sama ada ia berada di dalam ataupun di luar rantau sepunya!","prompt":"Bagi sistem x + y ≤ 20, x ≥ 2y, x ≥ 0 dan y ≥ 0, isihkan titik (x, y) berikut:","buckets":[{"id":"sah","label":"Dalam Rantau Sepunya (Sah)"},{"id":"tolak","label":"Di Luar Rantau Sepunya (Ditolak)"}],"items":[{"text":"(12, 5)","bucketId":"sah","note":"12 + 5 = 17 ≤ 20 dan 12 ≥ 2(5) = 10. Kedua-dua syarat dipenuhi!"},{"text":"(10, 8)","bucketId":"tolak","note":"10 + 8 = 18 ≤ 20, tetapi 10 < 2(8) = 16! Gagal syarat x ≥ 2y."},{"text":"(15, 5)","bucketId":"sah","note":"15 + 5 = 20 ≤ 20 (sempadan padu) dan 15 ≥ 10. Sah!"},{"text":"(16, 6)","bucketId":"tolak","note":"16 ≥ 12, tetapi 16 + 6 = 22 > 20! Melebihi had jumlah peserta 20."},{"text":"(14, 6)","bucketId":"sah","note":"14 + 6 = 20 ≤ 20 dan 14 ≥ 12. Sah berada pada sempadan padu!"},{"text":"(16, 8)","bucketId":"tolak","note":"16 + 8 = 24 > 20! Nilai y = 8 sentiasa di luar rantau sepunya."}],"explanation":"Titik dalam rantau sepunya wajib memenuhi KESEMUA ketaksamaan secara serentak; memenuhi satu syarat sahaja tidak mencukupi."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Susun Strategi Pengoptimuman","voiceCaption":"Susun langkah menyelesaikan masalah harian yang meminta nilai maksimum pendapatan daripada graf sistem ketaksamaan.","voiceScript":"[confident] Susun empat langkah utama strategi penyelesaian masalah untuk mencari nilai maksimum atau pendapatan maksimum daripada graf sistem ketaksamaan linear!","prompt":"Susun urutan strategi menyelesaikan masalah pengoptimuman sistem ketaksamaan linear:","hint":"Bina model, lorek rantau di sukuan pertama, baca julat/bucu, lalu hitung nilai objektif...","answerTokens":["Terbitkan semua ketaksamaan daripada syarat masalah,","lukis dan lorek rantau sepunya pada sukuan pertama,","baca nilai maksimum pemboleh ubah dari sempadan rantau,","kemudian gantikan ke dalam rumus pendapatan atau kos."],"distractors":["pilih koordinat terbesar tanpa menyemak rantau berlorek","abaikan syarat garis padu atau sempang"],"explanation":"Setiap nilai maksimum atau minimum mesti dibaca daripada titik di dalam atau pada sempadan padu rantau sepunya sebelum dimasukkan ke fungsi objektif.","acceptedSequences":[["Terbitkan semua ketaksamaan daripada syarat masalah,","lukis dan lorek rantau sepunya pada sukuan pertama,","baca nilai maksimum pemboleh ubah dari sempadan rantau,","kemudian gantikan ke dalam rumus pendapatan atau kos."]]},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Uji Pengoptimuman Jahitan","voiceCaption":"Hitung pendapatan maksimum Puan Jasmin apabila beliau menjahit lima belas helai baju kurung pesak mengikut syarat rantau sepunya.","voiceScript":"[serious] Soalan penamat Unit Empat berdasarkan Praktis Masteri soalan tujuh! Puan Jasmin menjahit x helai baju kurung pesak berharga lima puluh ringgit dan y helai baju kurung moden berharga tujuh puluh lima ringgit, dengan syarat x tambah y kurang atau sama dengan empat puluh, x maksimum dua puluh lima, dan y minimum sepuluh. Jika beliau menjahit lima belas helai baju kurung pesak, berapakah pendapatan maksimumnya?","prompt":"Seorang tukang jahit menjahit x helai baju kurung pesak (upah RM50/helai) dan y helai baju kurung moden (upah RM75/helai). Sistem kekangannya ialah x + y ≤ 40, x ≤ 25 dan y ≥ 10. Berdasarkan rantau sepunya, hitung pendapatan maksimum jika beliau berjaya menjahit 15 helai baju kurung pesak.","options":["RM1 500","RM2 250","RM2 625","RM3 000"],"correctIndex":2,"explanation":"Apabila x = 15, syarat x + y ≤ 40 mengehadkan y maksimum = 40 - 15 = 25 helai baju kurung moden (yang juga memenuhi y ≥ 10 dan x ≤ 25). Maka pendapatan maksimum = 50(15) + 75(25) = RM750 + RM1 875 = RM2 625!"}]},{"id":"mat46-u5","title":"Unit 5: Cabaran Boss SPM — Ketaksamaan Linear dalam Dua Pemboleh Ubah","subtitle":"7 Pusingan Sintesis Kertas 1 & Kertas 2 Berformat Peperiksaan SPM Sebenar","iconType":"trophy","iconUrl":"../assets/icons/mat46-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Kertas 1 Bentuk Setara & Unit","voiceCaption":"Uji kemahiran menukar unit dan menghapuskan pecahan dalam pemodelan ketaksamaan bajet.","voiceScript":"[excited] Selamat datang ke Arena Boss S P M Bab enam! Pusingan pertama: seorang penternak membeli a ekor anak ayam berharga dua ringgit seekor dan i ekor anak itik berharga satu ringgit lima puluh sen seekor dengan modal maksimum lima ratus ringgit. Ketaksamaan integer manakah yang paling tepat?","prompt":"Berdasarkan Praktis 6.1a: Seekor anak ayam berharga RM2.00 (a) dan seekor anak itik berharga RM1.50 (i). Modal maksimum untuk pembelian anak ayam dan anak itik ialah RM500. Manakah ketaksamaan linear yang paling tepat dalam bentuk integer ringkas?","options":["2a + 3i ≤ 500","4a + 3i ≤ 1000","4a + 3i < 1000","3a + 4i ≤ 1000"],"correctIndex":1,"explanation":"Modal maksimum RM500 bermaksud ≤ 500: 2a + 1.5i ≤ 500. Darab kedua-dua belah dengan +2 untuk menghapuskan perpuluhan 1.5 -> 4a + 3i ≤ 1000."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Ramal Rantau & Titik Sempadan","voiceCaption":"Ramalkan rantau sepunya dan status titik bucu pada sistem yang menggabungkan garis padu dan garis sempang.","voiceScript":"[curious] Pusingan kedua Boss! Diberi sistem tiga ketaksamaan daripada Contoh Sebelas: dua y lebih besar atau sama dengan x, x tambah y kurang daripada empat, dan x lebih besar atau sama dengan sifar. Antara tiga titik berikut, manakah yang SAH berada dalam rantau sepunya dan tidak berada di atas garis sempang?","hook":"Semak setiap titik satu per satu terhadap 2y >= x (padu), x + y < 4 (sempang ketat!), dan x >= 0 (padu)!","scenario":"Sistem ketaksamaan: (1) 2y ≥ x [garis padu], (2) x + y < 4 [garis sempang], (3) x ≥ 0 [garis padu].","prompt":"Titik koordinat manakah yang MEMUASKAN kesemua tiga ketaksamaan dalam sistem tersebut serentak?","options":["(0, 4)","(2, 2)","(1, 2)","(3, 1)"],"correctIndex":2,"proofLabId":"mat46_sistem_rantau_sepunya_lab","proofState":{"tab":"bina3","sysIdx":0},"explanation":"Uji (1, 2): 2(2) = 4 ≥ 1 (Benar), 1 + 2 = 3 < 4 (Benar), 1 ≥ 0 (Benar)! Titik (0, 4) dan (2, 2) gagal syarat ketat x + y < 4 kerana 0+4=4 dan 2+2=4 terletak di atas garis sempang; titik (3, 1) gagal 2(1) ≥ 3."},{"type":"match","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Sintesis Hukum & Jenis Garis","voiceCaption":"Padankan lima persamaan atau ketaksamaan berikut dengan sifat kecerunan, jenis garis atau pantulannya yang tepat.","voiceScript":"[confident] Pusingan ketiga! Padankan kelima-lima konsep kunci Bab enam ini dengan ciri matematiknya yang paling tepat tanpa sebarang kekeliruan.","prompt":"Padankan setiap ungkapan atau transformasi berikut dengan sifat matematiknya yang betul:","pairs":[{"id":"b6m1","left":"Garis lurus x = k","right":"Garis mencancang; kecerunan tidak tertakrif"},{"id":"b6m2","left":"Garis lurus y = h","right":"Garis mengufuk; kecerunan bersamaan sifar"},{"id":"b6m3","left":"Imej y ≤ x + 2 dipantul pada paksi-x","right":"y ≥ -x - 2  (ganti y dengan -y)"},{"id":"b6m4","left":"Susun semula 3x - 2y ≥ 8","right":"y ≤ (3/2)x - 4  (tanda disongsangkan)"},{"id":"b6m5","left":"Sempadan x + y < 8","right":"Garis sempang; titik pada garis tidak termasuk"}],"explanation":"Gabungan pengetahuan kecerunan garis khas, pantulan paksi, songsangan tanda bila membahagi negatif, dan jenis garis sempadan menguasai kesemua soalan struktur Kertas 1 dan 2."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Susun Songsangan 3 Sempadan","voiceCaption":"Susun langkah Kertas 2 untuk menerbitkan tiga ketaksamaan daripada gambar rajah rantau berlorek.","voiceScript":"[confident] Pusingan keempat Boss! Susun urutan kerja yang paling teratur untuk menulis tiga ketaksamaan linear daripada satu gambar rajah rantau berlorek dalam soalan Kertas Dua S P M.","prompt":"Susun langkah menyelesaikan soalan Kertas 2 'Nyatakan tiga ketaksamaan linear yang mentakrifkan rantau berlorek':","hint":"Kenal pasti ketiga-tiga garis sempadan, hitung m dan c, kemudian semak arah lorekan serta jenis garis...","answerTokens":["Kenal pasti tiga garis lurus yang menyempadani rantau,","tentukan kecerunan m dan pintasan-y c setiap garis condong,","pilih tanda atas/bawah atau kiri/kanan berbanding rantau,","lalu guna ≤/≥ bagi garis padu dan </> bagi garis sempang."],"distractors":["anggap semua sisi poligon sebagai garis padu","guna kecerunan negatif untuk semua paksi"],"explanation":"Mengesahkan persamaan ketiga-tiga sempadan (termasuk paksi-x atau paksi-y jika terlibat) serta membezakan garis padu dan sempang menjamin 3 markah penuh Kertas 2.","acceptedSequences":[["Kenal pasti tiga garis lurus yang menyempadani rantau,","tentukan kecerunan m dan pintasan-y c setiap garis condong,","pilih tanda atas/bawah atau kiri/kanan berbanding rantau,","lalu guna ≤/≥ bagi garis padu dan </> bagi garis sempang."]]},{"type":"sort","xp":25,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Audit Mitos & Fakta Bab 6","voiceCaption":"Jadilah pemeriksa SPM dan asingkan enam pernyataan berikut antara Fakta Sah atau Mitos Salah.","voiceScript":"[curious] Pusingan kelima Boss! Audit keenam-enam kenyataan matematik ini dan asingkan fakta tepat daripada perangkap kesilapan calon S P M.","prompt":"Isihkan pernyataan Bab 6 berikut kepada kategori Fakta Sah atau Mitos / Kesilapan Biasa:","buckets":[{"id":"fakta","label":"Fakta Matematik Sah"},{"id":"mitos","label":"Mitos / Kesilapan Biasa SPM"}],"items":[{"text":"Kecerunan bagi garis lurus y = 5 ialah sifar, manakala kecerunan garis x = 5 tidak tertakrif","bucketId":"fakta","note":"Tepat! Garis mengufuk m = 0 dan garis mencancang m tidak tertakrif."},{"text":"Kerana x - y > 4 menggunakan simbol '>', rantau berloreknya mesti berada di atas garis sempang","bucketId":"mitos","note":"Salah! Pekali y negatif: x - y > 4 menjadi y < x - 4, jadi rantau berada di BAWAH garis!"},{"text":"Jika graf mewakili bilangan objek harian, rantau anation":"Titik bucu paling kanan berlaku pada persilangan x + y = 120 dan y = (1/3)x -> x + (1/3)x = 120 -> (4/3)x = 120 -> x maksimum = 90 m (dan y = 30 m). Pembelian (80, 60) menghasilkan 80 + 60 = 140 > 120, maka ia berada di luar rantau sepunya dan TIDAK memuaskan sistem ketaksamaan!"}]}]};</script>

  /* =========================================================================
     PEMBANTU GEOMETRI: Sutherland-Hodgman Half-Plane Clipping
     Setiap kekangan dalam bentuk a*x + b*y <= c (dalam koordinat matematik)
     ========================================================================= */
  function clipPolyHalfPlane(poly, a, b, c) {
    if (!poly || poly.length === 0) return [];
    var eps = 1e-9;
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var cur = poly[i];
      var nxt = poly[(i + 1) % poly.length];
      var dCur = a * cur.x + b * cur.y - c;
      var dNxt = a * nxt.x + b * nxt.y - c;
      var inCur = dCur <= eps;
      var inNxt = dNxt <= eps;
      if (inCur && inNxt) {
        out.push(nxt);
      } else if (inCur && !inNxt) {
        var t1 = dCur / (dCur - dNxt);
        out.push({ x: cur.x + t1 * (nxt.x - cur.x), y: cur.y + t1 * (nxt.y - cur.y) });
      } else if (!inCur && inNxt) {
        var t2 = dCur / (dCur - dNxt);
        out.push({ x: cur.x + t2 * (nxt.x - cur.x), y: cur.y + t2 * (nxt.y - cur.y) });
        out.push(nxt);
      }
    }
    return out;
  }

  function clipSegmentToRect(a, b, c, xMin, xMax, yMin, yMax) {
    // Line a*x + b*y = c clipped inside [xMin, xMax] x [yMin, yMax]
    var pts = [];
    var eps = 1e-9;
    if (Math.abs(b) > eps) {
      var yL = (c - a * xMin) / b;
      if (yL >= yMin - eps && yL <= yMax + eps) pts.push({ x: xMin, y: yL });
      var yR = (c - a * xMax) / b;
      if (yR >= yMin - eps && yR <= yMax + eps) pts.push({ x: xMax, y: yR });
    }
    if (Math.abs(a) > eps) {
      var xB = (c - b * yMin) / a;
      if (xB >= xMin - eps && xB <= xMax + eps) pts.push({ x: xB, y: yMin });
      var xT = (c - b * yMax) / a;
      if (xT >= xMin - eps && xT <= xMax + eps) pts.push({ x: xT, y: yMax });
    }
    // Deduplicate near-identical points
    var uniq = [];
    for (var i = 0; i < pts.length; i++) {
      var dup = false;
      for (var j = 0; j < uniq.length; j++) {
        if (Math.hypot(pts[i].x - uniq[j].x, pts[i].y - uniq[j].y) < 1e-4) {
          dup = true;
          break;
        }
      }
      if (!dup) uniq.push(pts[i]);
    }
    return uniq.length >= 2 ? [uniq[0], uniq[1]] : null;
  }

    function makeSysSvg(opts) {
      var uid = "s46_" + (++LAB_UID);
      var W = 560, H = 312;
      var padL = 50, padR = 34, padT = 36, padB = 34;
      var pW = W - padL - padR, pH = H - padT - padB;
      var xMin = opts.xMin, xMax = opts.xMax, yMin = opts.yMin, yMax = opts.yMax;
      var step = opts.tickStep || 1;
      var toPx = function (x) { return padL + ((x - xMin) / (xMax - xMin)) * pW; };
      var toPy = function (y) { return padT + pH - ((y - yMin) / (yMax - yMin)) * pH; };

      var grid = "";
      for (var gx = Math.ceil(xMin / step) * step; gx <= xMax + 1e-6; gx += step) {
        var sx = toPx(gx);
        grid += '<line x1="' + sx.toFixed(1) + '" y1="' + padT + '" x2="' + sx.toFixed(1) + '" y2="' + (padT + pH) + '" stroke="' + (Math.abs(gx) < 1e-6 ? "#cbd5e1" : "rgba(148,163,184,0.2)") + '" stroke-width="' + (Math.abs(gx) < 1e-6 ? "2" : "1") + '"/>';
        grid += '<text x="' + sx.toFixed(1) + '" y="' + (padT + pH + 15) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#94a3b8">' + Math.round(gx) + "</text>";
      }
      for (var gy = Math.ceil(yMin / step) * step; gy <= yMax + 1e-6; gy += step) {
        var sy = toPy(gy);
        grid += '<line x1="' + padL + '" y1="' + sy.toFixed(1) + '" x2="' + (padL + pW) + '" y2="' + sy.toFixed(1) + '" stroke="' + (Math.abs(gy) < 1e-6 ? "#cbd5e1" : "rgba(148,163,184,0.2)") + '" stroke-width="' + (Math.abs(gy) < 1e-6 ? "2" : "1") + '"/>';
        grid += '<text x="' + (padL - 7) + '" y="' + (sy + 3.5).toFixed(1) + '" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#94a3b8">' + Math.round(gy) + "</text>";
      }

      var content = (opts.build && opts.build(toPx, toPy)) || "";
      var axY = Math.max(padT + 10, Math.min(padT + pH - 10, toPy(0)));
      var axX = Math.max(padL + 10, Math.min(padL + pW - 10, toPx(0)));
      return [
        '<svg viewBox="0 0 ' + W + " " + H + '" aria-label="' + esc(opts.title) + '">',
        '  <defs><clipPath id="' + uid + '_c"><rect x="' + padL + '" y="' + padT + '" width="' + pW + '" height="' + pH + '" rx="6"/></clipPath></defs>',
        '  <rect x="6" y="6" width="' + (W - 12) + '" height="' + (H - 12) + '" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>',
        '  <text x="' + (W / 2) + '" y="22" text-anchor="middle" font-family="Lexend,sans-serif" font-size="10.6" font-weight="800" fill="#a7f3d0">' + esc(opts.title) + "</text>",
        '  <rect x="' + padL + '" y="' + padT + '" width="' + pW + '" height="' + pH + '" rx="6" fill="#020617" stroke="#475569"/>',
        grid,
        '  <g clip-path="url(#' + uid + '_c)">' + content + "</g>",
        '  <text x="' + (padL + pW + 10) + '" y="' + (axY + 4).toFixed(1) + '" text-anchor="start" font-family="Lexend,sans-serif" font-size="11" font-weight="800" fill="#e2e8f0">x</text>',
        '  <text x="' + (axX + 8).toFixed(1) + '" y="' + (padT + 14) + '" text-anchor="start" font-family="Lexend,sans-serif" font-size="11" font-weight="800" fill="#e2e8f0" paint-order="stroke" stroke="#020617" stroke-width="3">y</text>',
        "</svg>"
      ].join("");
    }

    function render() {
      var tabsHtml =
        '<div class="wf-jucas-pills">' +
          '<button type="button" class="wf-jpill jp-mint" data-m46s-tab="bina3" aria-pressed="' + (tab === "bina3") + '">1. Persilangan 3 Kekangan &amp; Pengoptimuman</button>' +
          '<button type="button" class="wf-jpill jp-amber" data-m46s-tab="uji" aria-pressed="' + (tab === "uji") + '">2. Jadual Titik Uji Rantau (A, B, C, D)</button>' +
          '<button type="button" class="wf-jpill jp-violet" data-m46s-tab="songsang" aria-pressed="' + (tab === "songsang") + '">3. Dekoder Songsang Graf</button>' +
        "</div>";

      var bodyHtml = "";
      if (tab === "bina3") {
        var sys = sysList[sysIdx] || sysList[0];
        var sysBtns = sysList.map(function (s, idx) {
          return '<button type="button" class="mat46-toggle-btn is-cyan" data-m46s-sys="' + idx + '" aria-pressed="' + (idx === sysIdx) + '">' + esc(s.name) + "</button>";
        }).join("");

        var layerBtns = sys.constraints.map(function (c, idx) {
          return '<button type="button" class="mat46-toggle-btn" data-m46s-lay="' + idx + '" aria-pressed="' + Boolean(activeLayers[idx]) + '">' + esc(c.label) + "</button>";
        }).join("") +
        '<button type="button" class="mat46-toggle-btn is-green" id="m46ToggleCommon" aria-pressed="' + showCommon + '">Lorek Rantau Sepunya R</button>';

        var svgHtml = makeSysSvg({
          title: sys.title,
          xMin: sys.xMin, xMax: sys.xMax, yMin: sys.yMin, yMax: sys.yMax, tickStep: sys.tickStep,
          build: function (toPx, toPy) {
            var baseRect = [
              { x: sys.xMin, y: sys.yMin },
              { x: sys.xMax, y: sys.yMin },
              { x: sys.xMax, y: sys.yMax },
              { x: sys.xMin, y: sys.yMax }
            ];
            var out = "";
            // Individual soft overlays
            sys.constraints.forEach(function (c, idx) {
              if (!activeLayers[idx]) return;
              var hp = clipPolyHalfPlane(baseRect, c.a, c.b, c.c);
              if (hp.length >= 3) {
                var pStr = hp.map(function (p) { return toPx(p.x).toFixed(1) + "," + toPy(p.y).toFixed(1); }).join(" ");
                out += '<polygon points="' + pStr + '" fill="' + c.col + '" fill-opacity="0.14"/>';
              }
            });
            // Feasible common intersection polygon
            if (showCommon) {
              var inter = baseRect.slice();
              var anyActive = false;
              sys.constraints.forEach(function (c, idx) {
                if (activeLayers[idx]) {
                  anyActive = true;
                  inter = clipPolyHalfPlane(inter, c.a, c.b, c.c);
                }
              });
              if (sys.extraClip && activeLayers[0] && activeLayers[1] && activeLayers[2]) {
                inter = clipPolyHalfPlane(inter, sys.extraClip.a, sys.extraClip.b, sys.extraClip.c);
              }
              if (anyActive && inter.length >= 3) {
                var iStr = inter.map(function (p) { return toPx(p.x).toFixed(1) + "," + toPy(p.y).toFixed(1); }).join(" ");
                out += '<polygon points="' + iStr + '" fill="rgba(16,185,129,0.52)" stroke="#fde047" stroke-width="2.5"/>';
                // Centroid label R
                var cx = 0, cy = 0;
                inter.forEach(function (p) { cx += p.x; cy += p.y; });
                cx /= inter.length; cy /= inter.length;
                out += '<text x="' + toPx(cx).toFixed(1) + '" y="' + (toPy(cy) + 4).toFixed(1) + '" text-anchor="middle" font-family="Lexend,sans-serif" font-size="14" font-weight="900" fill="#ffffff">R</text>';
              }
            }
            // Boundary lines
            sys.constraints.forEach(function (c, idx) {
              if (!activeLayers[idx]) return;
              var seg = clipSegmentToRect(c.a, c.b, c.c, sys.xMin, sys.xMax, sys.yMin, sys.yMax);
              if (seg) {
                out += '<line x1="' + toPx(seg[0].x).toFixed(1) + '" y1="' + toPy(seg[0].y).toFixed(1) + '" x2="' + toPx(seg[1].x).toFixed(1) + '" y2="' + toPy(seg[1].y).toFixed(1) + '" stroke="' + c.col + '" stroke-width="2.8"' + (c.solid ? "" : ' stroke-dasharray="8 6"') + "/>";
              }
            });
            // Vertices when all 3 active
            if (showCommon && activeLayers[0] && activeLayers[1] && activeLayers[2]) {
              sys.vertices.forEach(function (v) {
                var vx = toPx(v.x), vy = toPy(v.y);
                var anc = v.x > (sys.xMax + sys.xMin) * 0.65 ? "end" : "start";
                var dx = anc === "end" ? -8 : 8;
                var dy = v.y >= sys.yMax - 2 ? 12 : -7;
                out += '<circle cx="' + vx.toFixed(1) + '" cy="' + vy.toFixed(1) + '" r="5" fill="#fde047" stroke="#0f172a" stroke-width="1.8"/>';
                out += '<text x="' + (vx + dx).toFixed(1) + '" y="' + (vy + dy).toFixed(1) + '" text-anchor="' + anc + '" font-family="JetBrains Mono,monospace" font-size="9" font-weight="800" fill="#fef08a" paint-order="stroke" stroke="#020617" stroke-width="3">' + esc(v.lbl) + "</text>";
              });
            }
            // Interactive probe for Koir or Jahit
            if (sys.probeMode === "koir") {
              var pyK = toPy(probeY);
              var isValidK = probeY >= 0 && probeY <= (20 / 3);
              out += '<line x1="' + toPx(0) + '" y1="' + pyK.toFixed(1) + '" x2="' + toPx(22) + '" y2="' + pyK.toFixed(1) + '" stroke="' + (isValidK ? "#ffffff" : "#ef4444") + '" stroke-width="2" stroke-dasharray="5 3"/>';
              if (isValidK) {
                var xMinK = 2 * probeY, xMaxK = 20 - probeY;
                out += '<line x1="' + toPx(xMinK).toFixed(1) + '" y1="' + pyK.toFixed(1) + '" x2="' + toPx(xMaxK).toFixed(1) + '" y2="' + pyK.toFixed(1) + '" stroke="#fde047" stroke-width="4.5"/>';
                out += '<circle cx="' + toPx(xMinK).toFixed(1) + '" cy="' + pyK.toFixed(1) + '" r="5" fill="#ffffff"/>';
                out += '<circle cx="' + toPx(xMaxK).toFixed(1) + '" cy="' + pyK.toFixed(1) + '" r="5" fill="#ffffff"/>';
              }
            } else if (sys.probeMode === "jahit") {
              var pxJ = toPx(probeX);
              var isValidJ = probeX >= 0 && probeX <= 25;
              out += '<line x1="' + pxJ.toFixed(1) + '" y1="' + toPy(0) + '" x2="' + pxJ.toFixed(1) + '" y2="' + toPy(42) + '" stroke="' + (isValidJ ? "#ffffff" : "#ef4444") + '" stroke-width="2" stroke-dasharray="5 3"/>';
              if (isValidJ) {
                var yMaxJ = 40 - probeX;
                out += '<line x1="' + pxJ.toFixed(1) + '" y1="' + toPy(10).toFixed(1) + '" x2="' + pxJ.toFixed(1) + '" y2="' + toPy(yMaxJ).toFixed(1) + '" stroke="#fde047" stroke-width="4.5"/>';
                out += '<circle cx="' + pxJ.toFixed(1) + '" cy="' + toPy(yMaxJ).toFixed(1) + '" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>';
              }
            }
            return out;
          }
        });

        var probeControlHtml = "";
        if (sys.probeMode === "koir") {
          var validK = probeY <= (20 / 3);
          probeControlHtml =
            '<div class="lab-controls">' +
              '<label class="lab-slider-group"><span class="lab-slider-label"><span>Uji Peserta Lelaki (y) pada Kem Koir</span><span class="tabular-nums">y = ' + probeY + ' org</span></span>' +
              '<input id="m46ProbeY" class="lab-range" type="range" min="0" max="10" step="1" value="' + probeY + '"></label>' +
            "</div>" +
            '<div class="lab-readout-grid">' +
              '<div class="lab-meter"><span class="lab-meter-label">Lelaki (y)</span><strong class="lab-meter-val tabular-nums">' + probeY + " org</strong></div>" +
              '<div class="lab-meter"><span class="lab-meter-label">Julat Perempuan (x)</span><strong class="lab-meter-val tabular-nums">' + (validK ? (2 * probeY + " <= x <= " + (20 - probeY)) : "TIADA (Luar Rantau)") + "</strong></div>" +
            "</div>";
        } else if (sys.probeMode === "jahit") {
          var validJ = probeX <= 25;
          var yMaxJ = validJ ? (40 - probeX) : 0;
          var maxInc = validJ ? (50 * probeX + 75 * yMaxJ) : 0;
          probeControlHtml =
            '<div class="lab-controls">' +
              '<label class="lab-slider-group"><span class="lab-slider-label"><span>Tetapkan Baju Kurung Pesak (x)</span><span class="tabular-nums">x = ' + probeX + ' helai</span></span>' +
              '<input id="m46ProbeX" class="lab-range" type="range" min="0" max="30" step="5" value="' + probeX + '"></label>' +
            "</div>" +
            '<div class="lab-readout-grid">' +
              '<div class="lab-meter"><span class="lab-meter-label">Baju Pesak (x)</span><strong class="lab-meter-val tabular-nums">' + probeX + " helai</strong></div>" +
              '<div class="lab-meter"><span class="lab-meter-label">Moden Maksimum (y)</span><strong class="lab-meter-val tabular-nums">' + (validJ ? (yMaxJ + " helai") : "Luar Had (x > 25)") + "</strong></div>" +
              '<div class="lab-meter"><span class="lab-meter-label">Pendapatan Maksimum</span><strong class="lab-meter-val tabular-nums" style="color:#047857;">' + (validJ ? ("RM " + maxInc) : "Tidak Sah") + "</strong></div>" +
            "</div>";
        }

        bodyHtml =
          '<div class="mat46-btn-row">' + sysBtns + "</div>" +
          '<div class="mat46-btn-row">' + layerBtns + "</div>" +
          '<div class="lab-stage">' + svgHtml + "</div>" +
          probeControlHtml +
          '<div class="lab-callout"><strong>Analisis Rantau Sepunya:</strong> ' + esc(sys.summary) + "</div>";
      } else if (tab === "uji") {
        var uCase = ujiCases[ujiPreset] || ujiCases.cth9;
        if (!uCase.regions[selectedRegion]) selectedRegion = uCase.answer;
        var uPresetsHtml = [
          { id: "cth9", lbl: "Contoh 9 (2 Garis)" },
          { id: "p62b", lbl: "Praktis 6.2b (3 Garis)" },
          { id: "u4s1", lbl: "Aktiviti 6.2 (x+y <= 8, y >= 3)" }
        ].map(function (up) {
          return '<button type="button" class="mat46-toggle-btn is-amber" data-m46s-up="' + up.id + '" aria-pressed="' + (ujiPreset === up.id) + '">' + esc(up.lbl) + "</button>";
        }).join("");

        var regBtns = ["A", "B", "C", "D"].map(function (rk) {
          var isAns = rk === uCase.answer;
          return '<button type="button" class="mat46-toggle-btn ' + (isAns ? "is-green" : "") + '" data-m46s-reg="' + rk + '" aria-pressed="' + (selectedRegion === rk) + '">Uji Rantau ' + rk + "</button>";
        }).join("");

        var svgUji = makeSysSvg({
          title: uCase.title,
          xMin: uCase.xMin, xMax: uCase.xMax, yMin: uCase.yMin, yMax: uCase.yMax, tickStep: uCase.tickStep,
          build: function (toPx, toPy) {

            uCase.lines.forEach(function (ln) {

              }
            });
            ["A", "B", "C", "D"].forEach(function (rk) {

              var isWin = rk === uCase.answer;

              if (isSel) {
                out += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="5.5" fill="#fde047" stroke="#020617" stroke-width="2"/>';

              "<td>" + (rg.c1 ? "Benar" : "Palsu") + "</td>" +
              "<td>" + (rg.c2 ? "Benar" : "Palsu") + "</td>" +
              (uCase.ineqLabels.length >= 3 ? ("<td>" + (rg.c3 ? "Benar" : "Palsu") + "</td>") : "") +
              "<td><strong>" + (allTrue ? "SEPUNYA" : "Bukan") + "</strong></td>" +
            "</tr>"

        }).join("");

        var curRg = uCase.regions[selectedRegion];
        bodyHtml =
          '<div class="mat46-btn-row">' + uPresetsHtml + "</div>" +
          '<div class="mat46-btn-row">' + regBtns + "</div>" +
          '<div class="lab-stage">' + svgUji + "</div>" +
          '<table class="mat46-table"><thead><tr><th>Rantau</th><th>Titik Uji</th>' +

            "<th>Status</th></tr></thead><tbody>" + tableRows + "</tbody></table>" +
          '<div class="lab-callout"><strong>Semakan Rantau ' + selectedRegion + ":</strong> " + esc(curRg.why) + "</div>";
      } else {
        // Tab songsang: reverse-engineer 3 inequalities from shaded polygon
        var sc = songCases[songPreset] || songCases.c12a;
        var ed = sc.edges[activeEdgeIdx] || sc.edges[0];
        var sPresetsHtml = Object.keys(songCases).map(function (k) {
          return '<button type="button" class="mat46-toggle-btn is-cyan" data-m46s-sp="' + k + '" aria-pressed="' + (songPreset === k) + '">' + esc(songCases[k].label) + "</button>";
        }).join("");
        var edgeBtnsHtml = sc.edges.map(function (e, idx) {
          return '<button type="button" class="mat46-toggle-btn is-green" data-m46s-ed="' + idx + '" aria-pressed="' + (idx === activeEdgeIdx) + '">' + (idx + 1) + ". " + esc(e.ineq) + "</button>";
        }).join("");

        var svgSong = makeSysSvg({
          title: sc.title,

        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";

        skipBtn.addEventListener("click", function () {

          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function buildMindMapHtml(step, nodes, unlockedMap, activeIdx, isBonusDone) {
  var coords = [

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
