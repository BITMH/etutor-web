  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab07","subject":"Matematik","subjectGroup":"teras","form":4,"chapterNumber":7,"title":"Graf Gerakan","subtitle":"Subtopik 7.1–7.2 KSSM (35 Langkah Bit-by-Bit) — Melukis & Mentafsir Graf Jarak-Masa (Kecerunan = Laju, Pegun, Patah Balik, Laju Purata), Graf Laju-Masa (Luas Segi Tiga/Segi Empat/Trapezium = Jarak, Pecutan, Nyahpecutan), Zon Informasi (Skalar vs Vektor) & Masalah Gabungan SPM.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t4-bab07-labs.js","coverIcon":"../assets/icons/mat47-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep graf gerakan kamu memang mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Kecerunan dan luas di bawah graf kamu kira dengan cukup tajam!","encourage":"[warm] Hampir tepat... semak semula label paksi, unit masa serta kecerunan segmen graf di bawah ya.","celebrate":"[excited] Tahniah! Satu lagi unit Matematik Tingkatan empat Bab tujuh berjaya ditakluki!"},"units":[{"id":"mat47-u1","title":"Unit 1: Asas Graf Jarak-Masa & Plot Persamaan","subtitle":"Subtopik 7.1 (Bhg. A) — Paksi Jarak-Masa, Kecerunan = Laju, Melukis daripada Jadual & Persamaan Linear (s = mt + c)","iconType":"graph","iconUrl":"../assets/icons/mat47-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Asas Graf Jarak-Masa & Video","voiceCaption":"Pada graf jarak-masa, paksi mencancang ialah jarak, paksi mengufuk ialah masa, dan kecerunan graf mewakili laju gerakan.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan empat, Bab tujuh, Graf Gerakan! Pernahkah kamu perhatikan jadual waktu penerbangan seperti K L I A dua ke Miri atau catatan atlet pecut negara di balapan? Semua gerakan itu boleh dirakam dengan jelas pada graf jarak-masa! Tonton video penerangan bersuara ini dahulu, kemudian kawal kenderaan maya dalam simulator untuk melihat bagaimana kecerunan garisan menentukan kelajuan!","title":"7.1 Mengenali Paksi Graf Jarak-Masa & Makna Kecerunan","acronym":"s•t•m=v","hook":"Graf jarak-masa menukar perjalanan kereta, bas dan pelari di jalan raya kepada garis lurus yang kecerunannya terus memberitahu kelajuan!","mediaKey":"mat47_graf_gerakan_hero","videoClip":{"src":"../assets/matematik-t4-bab07/video/mat47_video_graf_gerakan_narasi.mp4","hasNarration":true,"posterKey":"mat47_graf_gerakan_hero","caption":"Video Penerangan Bersuara (BM): Konsep Graf Jarak-Masa, Graf Laju-Masa, Kecerunan dan Luas Di Bawah Graf"},"summary":"Graf jarak-masa memaparkan hubungan antara jarak yang dilalui dengan tempoh masa yang diambil agar kelajuan serta corak perjalanan mudah ditafsirkan.","bullets":["Takrif Kedua-dua Paksi: Paksi mencancang (paksi-y) sentiasa mewakili jarak yang dilalui, manakala paksi mengufuk (paksi-x) mewakili tempoh masa yang diambil. Pengetahuan gerakan ini penting dalam automobil, sains sukan, fizik, kejuruteraan dan astronomi.","Kecerunan = Laju: Kecerunan garis lurus pada graf jarak-masa ialah nisbah perubahan jarak mencancang kepada perubahan masa mengufuk. Nilai kecerunan tersebut mewakili kadar perubahan jarak terhadap masa, iaitu laju objek."],"labId":"mat47_graf_jarak_masa_lab","labTitle":"Simulator Kenderaan 60fps & Kecerunan Graf Jarak-Masa","labProps":{"tab":"sim","preset":"perjalanan_rehat"},"formula":"Kecerunan graf jarak-masa = (Perubahan jarak, Δs) / (Perubahan masa, Δt) = Laju","examTip":"Sentiasa periksa label serta unit pada kedua-dua paksi sebelum mengira kecerunan supaya nilai laju anda sepadan dengan kehendak soalan seperti meter per saat atau kilometer per jam."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Unsur Graf Jarak-Masa","voiceCaption":"Asingkan pernyataan yang benar mengenai ciri asas graf jarak-masa berbanding pernyataan yang mengelirukan.","voiceScript":"[curious] Mari uji kefahaman awal kamu! Asingkan enam pernyataan berikut antara sifat sebenar graf jarak-masa dengan pernyataan yang salah atau merujuk konsep lain.","prompt":"Isihkan setiap pernyataan berikut kepada kategori Ciri Tepat Graf Jarak-Masa atau Bukan Sifat Graf Jarak-Masa:","buckets":[{"id":"tepat","label":"Ciri Tepat Graf Jarak-Masa"},{"id":"bukan","label":"Pernyataan Salah / Konsep Lain"}],"items":[{"text":"Paksi mencancang mewakili jarak yang dilalui oleh objek","bucketId":"tepat","note":"Betul! Jarak (s) sentiasa diplot pada paksi mencancang."},{"text":"Kecerunan garis lurus mewakili laju atau kadar perubahan jarak terhadap masa","bucketId":"tepat","note":"Tepat! Δs bahagi Δt bersamaan dengan laju gerakan."},{"text":"Luas di bawah graf jarak-masa mewakili jumlah jarak perjalanan","bucketId":"bukan","note":"Salah! Luas di bawah graf hanya memberi jarak pada graf LAJU-MASA, bukan graf jarak-masa."},{"text":"Paksi mengufuk mewakili tempoh masa yang diambil dalam saat, minit atau jam","bucketId":"tepat","note":"Betul! Masa (t) diplot pada paksi mengufuk."},{"text":"Kecerunan graf jarak-masa sentiasa mewakili pecutan kenderaan","bucketId":"bukan","note":"Salah! Pecutan ialah kecerunan graf laju-masa, manakala kecerunan graf jarak-masa ialah laju."},{"text":"Garis yang lebih curam pada graf jarak-masa menandakan kelajuan lebih rendah","bucketId":"bukan","note":"Terbalik! Semakin curam kecerunan, semakin besar perubahan jarak per unit masa, maka semakin laju!"}],"explanation":"Pada graf jarak-masa, paksi mencancang ialah jarak, paksi mengufuk ialah masa, dan kecerunan ialah laju. Luas di bawah graf jarak-masa tidak digunakan untuk mencari jarak dan kecerunannya bukan pecutan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Melukis daripada Jadual & Persamaan","voiceCaption":"Graf jarak-masa dilukis dengan memilih skala sesuai, memplot titik koordinat jadual atau persamaan linear lalu menyambungkannya dengan pembaris.","voiceScript":"[warm] Bagaimana pula cara melukis graf jarak-masa? Ada dua set maklumat utama: sama ada daripada jadual jarak-masa, ataupun daripada persamaan linear seperti s sama dengan tujuh puluh t dan s sama dengan dua belas tolak satu per empat t! Kerana persamaannya linear, dua titik hujung yang memenuhi julat masa sudah memadai untuk melukis garis lurus dengan pembaris!","title":"Melukis Graf Jarak-Masa: Jadual & Persamaan Linear","acronym":"S•P•G","hook":"Bagi persamaan garis lurus seperti s = 12 - (1/4)t, dua titik hujung sahaja sudah cukup untuk melukis keseluruhan graf dengan tepat!","mediaKey":"mat47_larian_trek_pecutan","summary":"Langkah melukis graf jarak-masa bermula dengan penentuan skala paksi yang sekata, diikuti pemplotan pasangan koordinat (t, s) dan penyambungan titik menggunakan pembaris.","bullets":["Daripada Jadual & Persamaan s = mt: Pilih skala mudah baca (cth. 2 cm mewakili 20 km), plot setiap pasangan (masa, jarak) pada kertas grid dan sambung menggunakan pembaris. Untuk persamaan s = 70t bagi 3 jam, gantikan t = 0 -> s = 0 dan t = 3 -> s = 210 km.","Persamaan Menuju Penamat & Pintasan Awal (s = mt + c): Jika jarak berbaki dari garisan penamat diberi oleh s = 12 - (1/4)t untuk 0 <= t <= 48 minit, nilai awal s = 12 (pintasan-y) menurun secara linear sehingga s = 0 pada t = 48. Bagi zarah dengan s = 6t + 4, garis bermula pada jarak awal 4 cm ketika t = 0."],"labId":"mat47_graf_jarak_masa_lab","labTitle":"Pembina Graf daripada Jadual & Persamaan Linear","labProps":{"tab":"jadual","eqMode":"penamat"},"formula":"s = mt + c   (m = kecerunan/laju,  c = jarak awal pada t = 0)","examTip":"Sentiasa semak julat masa yang diberi seperti 0 <= t <= 48; jangan panjangkan garis melebihi had masa yang diminta dalam soalan."},{"type":"match","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Persamaan & Ciri Graf","voiceCaption":"Padankan lima persamaan atau jadual gerakan berikut dengan ciri graf jarak-masa yang tepat.","voiceScript":"[confident] Uji kemahiran membaca persamaan gerakan! Padankan setiap persamaan jarak dan masa berikut dengan bentuk garis lurus serta nilai titik permulaannya.","prompt":"Padankan persamaan jarak-masa (s, t) berikut dengan ciri grafnya yang tepat:","pairs":[{"id":"u1m1","left":"s = 85t bagi 0 <= t <= 3 jam","right":"Garis menaik bermula dari asalan (0, 0) hingga (3, 255)"},{"id":"u1m2","left":"s = 12 - (1/4)t bagi 0 <= t <= 48 min","right":"Garis menurun dari (0, 12) hingga garisan penamat (48, 0)"},{"id":"u1m3","left":"s = 6t + 4 bagi 0 <= t <= 5 saat","right":"Garis menaik bermula dari jarak awal (0, 4) hingga (5, 34)"},{"id":"u1m4","left":"s = 1.6 - 0.2t bagi 0 <= t <= 8 min","right":"Laju menghampiri destinasi ialah 0.2 km min⁻¹ hingga tiba pada t = 8"},{"id":"u1m5","left":"Kecerunan graf jarak-masa","right":"Nisbah jarak mencancang (Δs) kepada jarak mengufuk (Δt)"}],"explanation":"Pekali t menentukan kecerunan menaik (+) atau menurun (-), manakala pemalar c menentukan titik permulaan pada paksi jarak ketika t = 0."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Plot Persamaan Menurun","voiceCaption":"Ramalkan dua titik hujung bagi graf larian jarak berbaki s = 12 - (1/4)t untuk tempoh 0 hingga 48 minit.","voiceScript":"[curious] Cuba ramalkan! Dalam acara merentas desa sejauh dua belas kilometer, jarak baki ke garisan penamat diberi oleh s sama dengan dua belas tolak satu per empat t bagi t dari sifar hingga empat puluh lapan minit. Titik hujung manakah yang mesti diplot?","hook":"Gantikan nilai minimum t = 0 dan maksimum t = 48 ke dalam persamaan linear tersebut!","scenario":"Seorang pelari merentas desa mempunyai hubungan baki jarak dari penamat s = 12 - 0.25t (km) dalam tempoh 0 <= t <= 48 minit.","prompt":"Pasangan titik hujung manakah yang tepat untuk melukis graf jarak-masa pelari itu?","options":["(0, 12) dan (48, 0) dengan garis condong menurun ke bawah","(0, 0) dan (48, 12) dengan garis condong menaik ke atas","(0, 12) dan (12, 48) dengan garis mendatar","(0, 48) dan (12, 0) dengan garis condong menurun"],"correctIndex":0,"proofLabId":"mat47_graf_jarak_masa_lab","proofState":{"tab":"jadual","eqMode":"penamat"},"explanation":"Apabila t = 0, s = 12 - 0.25(0) = 12 km. Apabila t = 48, s = 12 - 0.25(48) = 12 - 12 = 0 km. Menyambungkan (0, 12) ke (48, 0) menghasilkan garis menurun menuju penamat."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Langkah Lukis Graf","voiceCaption":"Susun blok tindakan bagi melukis graf jarak-masa secara tertib daripada jadual nilai.","voiceScript":"[confident] Susun semula empat langkah kerja berikut untuk melukis graf jarak-masa yang kemas dan tepat di dalam kertas peperiksaan!","prompt":"Susun turutan langkah yang betul untuk melukis graf jarak-masa daripada jadual atau persamaan:","hint":"Mulakan dengan pemilihan skala pada paksi, kemudian pengiraan/pemplotan...","answerTokens":["Pilih skala sesuai pada kedua-dua paksi","Plot pasangan titik jarak dan masa","Sambungkan semua titik dengan pembaris","Hitung kecerunan untuk menentukan laju"],"distractors":["Lorekkan kawasan di bawah lengkung","Lukis garis lengkung secara bebas tangan"],"explanation":"Graf jarak-masa bagi gerakan seragam dilukis dengan memilih skala sesuai, memplot titik koordinat (t, s), menyambung titik dengan pembaris lurus, dan menyemak kecerunan bagi laju."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Jadual ke Persamaan","voiceCaption":"Tentukan persamaan dan kelajuan pergerakan berdasarkan jadual jarak-masa sebuah kereta mainan.","voiceScript":"[serious] Soalan penutup Unit satu! Teliti jadual jarak dan masa berikut. Pada t sifar saat jaraknya empat sentimeter, dan setiap saat jaraknya bertambah enam sentimeter. Persamaan manakah yang benar?","stimulusHtml":"<div class=\"nota-table-wrapper\"><table class=\"nota-data-table\"><thead><tr><th scope=\"col\">Masa, t (s)</th><th scope=\"col\">0</th><th scope=\"col\">1</th><th scope=\"col\">2</th><th scope=\"col\">3</th><th scope=\"col\">4</th></tr></thead><tbody><tr><th scope=\"row\">Jarak, s (cm)</th><td class=\"tbl-mono\">4</td><td class=\"tbl-mono\">10</td><td class=\"tbl-mono\">16</td><td class=\"tbl-mono\">22</td><td class=\"tbl-mono\">28</td></tr></tbody></table></div>","prompt":"Apakah persamaan jarak-masa serta kelajuan kereta mainan tersebut?","options":["s = 6t + 4 dengan laju 6 cm s⁻¹","s = 4t + 6 dengan laju 4 cm s⁻¹","s = 7t dengan laju 7 cm s⁻¹","s = 28t - 4 dengan laju 24 cm s⁻¹"],"correctIndex":0,"explanation":"Pintasan-y pada t = 0 ialah c = 4 cm. Kecerunan m = (28 - 4) / (4 - 0) = 24 / 4 = 6 cm s⁻¹. Oleh itu persamaannya ialah s = 6t + 4."}]},{"id":"mat47-u2","title":"Unit 2: Mentafsir Graf Jarak-Masa & Laju Purata","subtitle":"Subtopik 7.1 (Bhg. B) — Kecerunan Positif, Sifar (Pegun) & Negatif (Patah Balik), Pergi-Balik (2S), Pertemuan Kenderaan & Laju Purata","iconType":"map","iconUrl":"../assets/icons/mat47-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Tiga Jenis Kecerunan Graf s-t","voiceCaption":"Kecerunan positif bermaksud bergerak maju, kecerunan sifar ialah keadaan pegun, dan kecerunan negatif menandakan objek berpatah balik ke arah bertentangan.","voiceScript":"[warm] Dalam Unit dua ini, kita belajar membaca cerita di sebalik setiap segmen graf jarak-masa! Garis condong ke atas bermakna kecerunan positif iaitu bergerak dengan laju seragam ke destinasi. Garis mengufuk bermakna kecerunan sifar iaitu objek berada dalam keadaan pegun tanpa perubahan jarak. Garis menurun pula bermakna kecerunan negatif — objek berpatah balik ke tempat asal atau bergerak pada arah bertentangan!","title":"Mentafsir Kecerunan Positif, Sifar (Pegun) & Negatif","acronym":"+m•0•-m","hook":"Tanda positif dan negatif pada kecerunan graf jarak-masa bukan sekadar nombor algebra — ia mendedahkan arah gerakan objek!","mediaKey":"mat47_graf_gerakan_hero","summary":"Setiap segmen garis lurus pada graf jarak-masa mempunyai nilai kecerunan tetap yang menggambarkan kelajuan seragam, tempoh berhenti, atau arah pulang objek.","bullets":["Kecerunan Positif (+m) vs Kecerunan Sifar (m = 0): Garis condong naik menandakan objek bergerak menjauhi titik asal dengan laju seragam (nilai kecerunan pada mana-mana dua titik di atas satu garis lurus adalah sama!). Garis mengufuk pula bererti tiada pertambahan jarak — objek pegun untuk tempoh masa (t₂ - t₁).","Kecerunan Negatif (-m) = Arah Bertentangan: Apabila garis turun semula menuju paksi masa, nilai kecerunan negatif menunjukkan objek bergerak balik ke tempat asal atau pada arah bertentangan. Apabila ditanya nilai 'laju' (kuantiti skalar), nyatakan nilainya sebagai positif."],"labId":"mat47_graf_jarak_masa_lab","labTitle":"Simulator Pergi, Pegun & Patah Balik (s-t)","labProps":{"tab":"sim","preset":"pergi_balik"},"formula":"Laju segmen = | (s₂ - s₁) / (t₂ - t₁) |   |   Tempoh pegun = t₂ - t₁","examTip":"Jika graf bagi jam pertama tidak mempunyai tanda nilai jarak, gunakan dua titik pada hujung garis lurus yang sama kerana kecerunan satu garis lurus sentiasa sekata."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Segmen Graf Jarak-Masa","voiceCaption":"Kelaskan enam huraian dan nilai kecerunan berikut ke dalam kategori Maju, Pegun atau Patah Balik.","voiceScript":"[curious] Uji kecekapan kamu membaca arah dan keadaan kenderaan! Isihkan enam situasi pada graf jarak-masa ini mengikut jenis kecerunan yang betul.","prompt":"Isihkan pernyataan berikut mengikut tafsiran segmen graf jarak-masa:","buckets":[{"id":"maju","label":"Menuju Destinasi (+m)"},{"id":"pegun","label":"Keadaan Pegun (m = 0)"},{"id":"balik","label":"Arah Bertentangan (-m)"}],"items":[{"text":"Garisan mengufuk selari dengan paksi masa selama 20 minit","bucketId":"pegun","note":"Jarak kekal malar bermakna kenderaan berhenti atau berehat."},{"text":"Kecerunan segmen dikira sebagai +75 km j⁻¹","bucketId":"maju","note":"Nilai positif menunjukkan jarak dari titik asal bertambah secara seragam."},{"text":"Kadar perubahan jarak dikira sebagai -12 km j⁻¹ menuju ke asal","bucketId":"balik","note":"Tanda negatif pada graf s-t melambangkan perjalanan pulang / arah bertentangan."},{"text":"Bas persiaran bergerak dari Bandar B balik ke Bandar A (jarak 180 km turun ke 0)","bucketId":"balik","note":"Jarak daripada titik A menyusut ke sifar."},{"text":"Beza jarak mencancang ialah sifar antara jam ke-2 hingga jam ke-3","bucketId":"pegun","note":"Δs = 0 memberi kecerunan 0, iaitu keadaan pegun."},{"text":"Pelumba memecut keluar dari garisan permulaan dengan garis condong ke atas","bucketId":"maju","note":"Jarak dari garis mula bertambah dengan masa."}],"explanation":"Pada graf jarak-masa: garis naik (+m) = bergerak maju; garis mengufuk (m = 0) = pegun; garis turun (-m) = berpatah balik atau bergerak pada arah bertentangan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Pergi-Balik & Laju Purata","voiceCaption":"Jumlah jarak pergi dan balik ialah dua kali jarak sehala, manakala laju purata diperoleh dengan membahagikan jumlah jarak dengan jumlah masa termasuk tempoh pegun.","voiceScript":"[warm] Awas dua perangkap nombor satu S P M bagi graf jarak-masa! Pertama, jika sesuatu objek pergi sejauh S dan berpatah balik ke tempat asal, jumlah jaraknya ialah dua S, bukan sifar! Kedua, laju purata mesti dihitung dengan membahagikan jumlah jarak keseluruhan dengan jumlah masa keseluruhan termasuk masa rehat pegun. Jangan lupa juga tukar minit atau sistem dua puluh empat jam kepada unit jam dengan tepat!","title":"Perjalanan Pergi-Balik, Pertemuan Kenderaan & Laju Purata","acronym":"2S • LP","hook":"Perangkap klasik peperiksaan: apabila seseorang pergi dan balik ke rumah, jarak di graf kembali ke 0 tetapi JUMLAH JARAK menjadi 2 kali ganda!","mediaKey":"mat47_larian_trek_pecutan","summary":"Apabila kelajuan berubah-ubah sepanjang perjalanan atau melibatkan hentian rehat, prestasi keseluruhan perjalanan diukur menggunakan laju purata.","bullets":["Jumlah Jarak Pergi-Balik & Pertembungan: Perjalanan pergi S km dan pulang S km menghasilkan jumlah jarak 2S km. Apabila dua kenderaan bertembung pada graf s-t yang sama, titik persilangan menandakan masa dan lokasi mereka berselisih, manakala beza laju ialah |laju₁ - laju₂|.","Rumus Laju Purata & Unit Masa: Laju Purata = Jumlah Jarak / Jumlah Masa (termasuk tempoh pegun!). Jika masa diberi dalam sistem 24 jam seperti 0950 hingga 1020, tempohnya ialah 30 minit = 0.5 jam; jika dalam minit, bahagi dengan 60 sebelum mengira km j⁻¹."],"labId":"mat47_graf_jarak_masa_lab","labTitle":"Simulator Pertemuan Dua Kenderaan & Laju Purata","labProps":{"tab":"sim","preset":"dua_kenderaan"},"formula":"Laju Purata = (Jumlah Jarak yang Dilalui) / (Jumlah Masa Termasuk Pegun)","examTip":"Jangan sekali-kali mencari laju purata dengan mengira purata aritmetik (v₁ + v₂) / 2 apabila tempoh masanya berbeza; sentiasa gunakan Jumlah Jarak / Jumlah Masa!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Laju Purata Pergi-Balik","voiceCaption":"Ramalkan jumlah jarak dan laju purata seorang penunggang basikal yang pergi 9 km, rehat 15 minit, lalu pulang 9 km dalam 45 minit.","voiceScript":"[curious] Cuba ramalkan keputusan perjalanan pergi dan balik ini! Seorang penunggang basikal berkayuh sejauh sembilan kilometer dalam masa tiga puluh minit, berehat lima belas minit di gerai, lalu pulang semula sembilan kilometer ke rumah dalam masa empat puluh lima minit. Berapakah jumlah jarak dan laju puratanya?","hook":"Ingat: tempoh rehat 15 minit mesti dicampur ke dalam jumlah masa, dan perjalanan pulang tetap menambah jarak!","scenario":"Graf jarak-masa menunjukkan perjalanan dari rumah ke taman (9 km dalam 0.5 jam), rehat 0.25 jam (15 minit), lalu pulang ke rumah (kembali ke 0 km dalam 0.75 jam).","prompt":"Berapakah jumlah jarak dilalui dan laju purata keseluruhan dalam km j⁻¹?","options":["Jumlah jarak = 18 km; Laju purata = 12 km j⁻¹ (kerana jumlah masa ialah 1.5 jam)","Jumlah jarak = 0 km; Laju purata = 0 km j⁻¹ (kerana kembali ke tempat asal)","Jumlah jarak = 18 km; Laju purata = 14.4 km j⁻¹ (kerana masa rehat 0.25 jam diabaikan)","Jumlah jarak = 9 km; Laju purata = 6 km j⁻¹"],"correctIndex":0,"proofLabId":"mat47_graf_jarak_masa_lab","proofState":{"tab":"sim","preset":"pergi_balik"},"explanation":"Jumlah jarak = 9 km + 9 km = 18 km. Jumlah masa keseluruhan = 0.5 + 0.25 + 0.75 = 1.5 jam. Oleh itu, Laju Purata = 18 / 1.5 = 12 km j⁻¹."},{"type":"match","xp":15,"voiceIdKey":"u2-s5","voiceToneLabel":"Padan Pengiraan Graf s-t","voiceCaption":"Padankan lima maklumat bacaan graf jarak-masa dan sistem 24 jam berikut dengan hasil pengiraan yang betul.","voiceScript":"[confident] Teruskan momentum kamu! Padankan kelima-lima pengiraan graf jarak-masa serta tempoh masa sistem dua puluh empat jam berikut dengan jawapan yang tepat.","prompt":"Padankan setiap situasi graf jarak-masa berikut dengan nilai kiraan yang tepat:","pairs":[{"id":"u2m1","left":"Bertolak 0950 dan tiba 1020 (jarak 12 km)","right":"Tempoh 30 minit (0.5 jam) -> Laju = 24 km j⁻¹"},{"id":"u2m2","left":"Titik (0, 0) ke (2, 120 km) pada graf s-t","right":"Laju seragam ialah +60 km j⁻¹"},{"id":"u2m3","left":"Garis mengufuk dari t = 2.0 j ke t = 3.5 j","right":"Kenderaan pegun selama 1.5 jam (90 minit)"},{"id":"u2m4","left":"Titik (3, 180 km) turun ke (5, 0 km)","right":"Kecerunan -90 km j⁻¹ (pulang pada laju 90 km j⁻¹)"},{"id":"u2m5","left":"Pergi 15 km (0.5 j) dan balik 15 km (1.0 j)","right":"Laju purata = 30 / 1.5 = 20 km j⁻¹"}],"explanation":"Sentiasa tukar perbezaan masa kepada unit jam sebelum membahagikan beza jarak bagi mendapatkan unit km j⁻¹ yang tepat."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Bina Aturan Laju Purata","voiceCaption":"Susun blok ayat untuk menerangkan cara betul menghitung laju purata apabila terdapat hentian rehat pada graf jarak-masa.","voiceScript":"[confident] Susun semula blok fakta berikut untuk merumuskan prinsip pengiraan laju purata keseluruhan yang sentiasa ditanya dalam kertas peperiksaan!","prompt":"Susun blok berikut untuk menerangkan peraturan tepat mengira laju purata:","hint":"Mulakan dengan nisbah jumlah jarak keseluruhan terhadap jumlah masa...","answerTokens":["Laju purata ialah jumlah jarak","dibahagikan dengan jumlah masa","termasuk tempoh kereta berhenti pegun","dan jarak pergi dicampur jarak balik"],"distractors":["dengan menolak tempoh rehat","dengan mengambil separuh jumlah laju"],"explanation":"Laju purata keseluruhan wajib mengambil kira jumlah jarak yang ditempuh (pergi + balik) dibahagikan dengan jumlah masa dari mula hingga tamat termasuk selang masa pegun."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Kira Beza Laju Dua Kenderaan","voiceCaption":"Hitung beza laju antara sebuah kereta dari Puchong ke Melaka dengan sebuah bas persiaran dari arah bertentangan.","voiceScript":"[serious] Soalan penutup Unit dua! Sebuah kereta bergerak seratus lapan puluh kilometer dari titik O dalam masa dua jam. Pada masa yang sama, sebuah bas persiaran bergerak balik seratus lapan puluh kilometer menuju titik O dalam masa tiga jam. Berapakah beza laju antara kedua-duanya?","prompt":"Graf jarak-masa menunjukkan Kereta (dari P ke Q) menempuh 180 km dalam 2 jam, manakala Bas (dari Q ke P) menempuh 180 km dalam 3 jam. Hitung beza laju, dalam km j⁻¹, antara dua kenderaan itu.","options":["30 km j⁻¹","150 km j⁻¹","75 km j⁻¹","20 km j⁻¹"],"correctIndex":0,"explanation":"Laju kereta = (180 - 0) / (2 - 0) = 90 km j⁻¹. Kecerunan bas = (0 - 180) / (3 - 0) = -60 km j⁻¹ (laju bas = 60 km j⁻¹ pada arah bertentangan). Maka beza laju = 90 - 60 = 30 km j⁻¹ (jangan tambah 90 + 60!)."}]},{"id":"mat47-u3","title":"Unit 3: Graf Laju-Masa & Luas Di Bawah Graf","subtitle":"Subtopik 7.2 (Bhg. A) — Tokoh Nicole Oresme, Speedometer, Plot Persamaan v-t, Luas Segi Tiga/Segi Empat/Trapezium & Unit Minit -> Jam","iconType":"formula","iconUrl":"../assets/icons/mat47-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Nicole Oresme & Asas Graf v-t","voiceCaption":"Nicole Oresme merintis graf laju-masa pada abad ke-14; graf laju-masa memplot kelajuan pada paksi mencancang melawan masa pada paksi mengufuk.","voiceScript":"[warm] Selamat melangkah ke Subtopik tujuh perpuluhan dua, Graf Laju-Masa! Tahukah kamu bahawa ahli matematik Perancis abad ke-empat belas bernama Nicole Oresme ialah orang pertama yang menggunakan sistem koordinat segi empat tepat untuk melukis graf laju-masa? Bayangkan jarum meter laju kereta: jarum pada angka sifar bermakna pegun, jarum naik bermaksud laju bertambah, dan jarum turun bermaksud laju berkurang!","title":"7.2 Sejarah Nicole Oresme, Meter Laju & Melukis Graf Laju-Masa","acronym":"v•t•m=a","hook":"Perubahan bacaan jarum speedometer setiap saat diterjemahkan terus menjadi paksi mencancang (Laju) dalam graf laju-masa!","mediaKey":"mat47_nicholas_oresme","summary":"Graf laju-masa merakam perubahan kelajuan sesuatu gerakan mengikut masa dan boleh dilukis daripada jadual laju-masa atau persamaan linear v = u + at.","bullets":["Tokoh Matematik Nicole Oresme (1323–1382) & Meter Laju: Ilmuwan Perancis abad ke-14 ini memperkenalkan koordinat segi empat tepat bagi mewakilkan graf laju-masa. Pada speedometer, 0 bererti pegun, peningkatan bacaan menandakan pecutan, dan penyusutan bacaan bererti nyahpecutan.","Melukis daripada Jadual & Persamaan: Paksi mencancang mewakili laju (v), paksi mengufuk mewakili masa (t). Untuk pendaratan pesawat dengan v = 720 - 1440t (0 <= t <= 0.5 jam), gantikan t = 0 -> v = 720 km j⁻¹ dan t = 0.5 -> v = 0 km j⁻¹ lalu sambung kedua-dua titik."],"labId":"mat47_perbandingan_graf_flip","labTitle":"Dek Kad 3D Perbandingan Graf s-t vs v-t & Tokoh","labProps":{"tab":"deck"},"formula":"Paksi-y: Laju (v)   |   Paksi-x: Masa (t)   |   Kecerunan = Δv / Δt = Pecutan","examTip":"Semak permulaan laju u pada t = 0! Graf laju-masa tidak semestinya bermula dari (0, 0) — contohnya v = 4 + 3t bermula pada (0, 4)."},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Konsep Asas Graf v-t","voiceCaption":"Padankan lima konsep dan persamaan graf laju-masa berikut dengan huraian atau koordinat yang tepat.","voiceScript":"[confident] Uji ketajaman mata kamu pada asas graf laju-masa! Padankan kelima-lima maklumat termasuk sejarah Nicole Oresme dan persamaan pendaratan berikut dengan jawapannya.","prompt":"Padankan konsep dan persamaan graf laju-masa berikut dengan maklumat yang betul:","pairs":[{"id":"u3m1","left":"Nicole Oresme (1323–1382)","right":"Ilmuwan Perancis abad ke-14 yang merintis graf laju-masa"},{"id":"u3m2","left":"Jarum meter laju kekal menunjuk angka 0","right":"Kenderaan berada dalam keadaan pegun"},{"id":"u3m3","left":"Persamaan pendaratan v = 720 - 1440t (0 <= t <= 0.5)","right":"Garis lurus menurun dari titik (0, 720) ke (0.5, 0)"},{"id":"u3m4","left":"Persamaan laju v = 4 + 3t (0 <= t <= 5 s)","right":"Laju awal ialah 4 m s⁻¹ dan mencapai 19 m s⁻¹ pada t = 5 s"},{"id":"u3m5","left":"Kecerunan graf laju-masa","right":"Mewakili kadar perubahan laju terhadap masa, iaitu pecutan"}],"explanation":"Setiap persamaan linear laju-masa v = u + at diplot menggunakan dua titik hujung julat masa yang diberi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Luas Bawah Graf = Jarak","voiceCaption":"Nilai luas di bawah graf laju-masa adalah sama dengan jumlah jarak yang dilalui, dihitung menggunakan rumus segi tiga, segi empat tepat atau trapezium.","voiceScript":"[warm] Inilah rahsia terbesar Subtopik tujuh perpuluhan dua! Dalam Rangsangan Minda satu, apabila seseorang memandu pada laju malar lima puluh kilometer per jam selama empat jam, jaraknya ialah dua ratus kilometer — dan luas segi empat tepat di bawah graf juga lima puluh darab empat iaitu dua ratus! Maka, luas di bawah mana-mana graf laju-masa adalah sama dengan jarak yang dilalui!","title":"Perkaitan Luas Di Bawah Graf Laju-Masa & Penukaran Unit","acronym":"L=J•T•60","hook":"Segi tiga, segi empat tepat dan trapezium ialah tiga kunci geometri untuk membaca jarak daripada mana-mana graf laju-masa!","mediaKey":"mat47_speedometer_kelajuan","summary":"Jarak yang dilalui oleh sesuatu gerakan dalam tempoh masa tertentu boleh ditentukan secara langsung dengan mengira luas rantau yang terkurung di antara garis graf laju-masa dengan paksi masa.","bullets":["3 Rumus Geometri Luas Bawah Graf: Pecahkan rantau di bawah graf kepada tiga bentuk mudah: (1) Segi Tiga = 1/2 x tapak x tinggi; (2) Segi Empat Tepat = tapak x tinggi; (3) Trapezium = 1/2 x (jumlah dua sisi selari mencancang) x lebar mengufuk.","Indikator Penukaran Unit Masa (Wajib): Pastikan unit masa pada paksi laju sepadan dengan paksi masa! Jika laju diberi dalam km j⁻¹ tetapi paksi masa dalam minit, tukarkan setiap selang minit kepada jam (bahagi 60) sebelum mendarab untuk mencari luas dalam km!"],"labId":"mat47_graf_laju_masa_luas_lab","labTitle":"Simulator Lorekan Luas Segi Tiga, Segi Empat & Trapezium","labProps":{"tab":"luas","unitMode":"kmj_min","areaStep":"semua"},"formula":"Jarak = Luas Di Bawah Graf (v-t)   |   Luas Trapezium = ½ × (v₁ + v₂) × Δt","examTip":"Untuk bentuk trapezium tegak pada graf v-t, dua sisi selarinya ialah nilai laju mencancang (v₁ dan v₂), manakala tingginya ialah selang masa mengufuk (Δt)."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Kesan Unit Minit ke Jam","voiceCaption":"Ramalkan jarak dilalui apabila kelajuan kereta meningkat dari 40 km j⁻¹ kepada 80 km j⁻¹ dalam tempoh 12 minit.","voiceScript":"[curious] Awas perangkap unit masa! Sebuah kereta memecut secara seragam dari empat puluh kepada lapan puluh kilometer per jam dalam tempoh dua belas minit sahaja. Berapakah jarak yang dilalui dalam kilometer?","hook":"Semak Indikator Unit KSSM: laju dalam km j⁻¹, manakala masa dalam minit!","scenario":"Graf laju-masa menunjukkan segmen condong menaik dari (0 minit, 40 km j⁻¹) ke (12 minit, 80 km j⁻¹).","prompt":"Berapakah jarak, dalam km, yang dilalui oleh kereta itu dalam tempoh 12 minit tersebut?","options":["12 km, kerana 1/2 x (40 + 80) x (12 / 60) = 12 km","720 km, kerana 1/2 x (40 + 80) x 12 = 720 km","8 km, kerana 1/2 x (80 - 40) x (12 / 60) = 4 km dan 4 x 2 = 8 km","24 km, kerana (40 + 80) x (12 / 60) = 24 km"],"correctIndex":0,"proofLabId":"mat47_graf_laju_masa_luas_lab","proofState":{"tab":"luas","unitMode":"kmj_min","areaStep":"t2"},"explanation":"Kerana laju menggunakan unit jam (km j⁻¹), tukarkan 12 minit kepada 12/60 = 0.2 jam. Luas trapezium = 1/2 x (40 + 80) x 0.2 = 60 x 0.2 = 12 km!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Isih Rumus Luas & Unit Sah","voiceCaption":"Kelaskan enam amalan pengiraan luas di bawah graf laju-masa kepada Kaedah Sah atau Kesilapan Lazim SPM.","voiceScript":"[confident] Uji ketelitian pengiraan kamu! Asingkan enam langkah berikut antara amalan kiraan luas graf laju-masa yang sah dengan kesilapan lazim yang sering memerangkap calon.","prompt":"Isihkan pernyataan berikut kepada kategori Kaedah Sah atau Kesilapan Lazim:","buckets":[{"id":"sah","label":"Kaedah Sah (Tepat)"},{"id":"silap","label":"Kesilapan Lazim SPM"}],"items":[{"text":"Membahagikan tempoh minit dengan 60 apabila unit laju ialah km j⁻¹","bucketId":"sah","note":"Wajib! Unit masa pada kedua-dua kuantiti mesti selaras."},{"text":"Menggunakan 1/2 x (v₁ + v₂) x Δt bagi segmen condong yang tidak bermula dari laju 0","bucketId":"sah","note":"Betul! Segmen itu membentuk trapezium, bukan segi tiga."},{"text":"Mengira luas di bawah graf dengan mengabaikan segi empat tepat di bawah garisan laju awal","bucketId":"silap","note":"Salah! Jika hanya guna 1/2 x Δv x Δt, anda tertinggal luas segi empat di bahagian bawah trapezium."},{"text":"Mendarab terus laju dalam km j⁻¹ dengan saat tanpa sebarang penukaran unit","bucketId":"silap","note":"Salah! Saat mesti dibahagi 3600 (atau laju ditukar kepada m s⁻¹ dahulu)."},{"text":"Membahagikan jumlah luas di bawah graf dengan jumlah masa untuk memperoleh laju purata","bucketId":"sah","note":"Tepat! Jumlah luas = jumlah jarak, lalu dibahagi jumlah masa."},{"text":"Mencari luas di bawah graf JARAK-MASA untuk mendapatkan jarak dilalui","bucketId":"silap","note":"Salah! Hanya luas di bawah graf LAJU-MASA mewakili jarak."}],"explanation":"Sentiasa pastikan unit masa seragam dan pilih bentuk penuh hingga ke paksi-t (segi tiga jika mula/tamat pada v = 0, trapezium jika kedua-dua hujung v > 0)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Aturan Luas Trapezium","voiceCaption":"Susun blok penjelasan bagi mengira jarak daripada segmen trapezium graf laju-masa berunit km per jam dan minit.","voiceScript":"[confident] Susun blok perkataan berikut untuk merangka prosedur pengiraan jarak apabila graf laju-masa menggabungkan laju kilometer per jam dengan masa dalam minit!","prompt":"Susun langkah pengiraan jarak bagi graf laju-masa yang memaparkan unit km j⁻¹ dan minit:","hint":"Tukarkan unit masa terlebih dahulu sebelum mengaplikasikan rumus trapezium...","answerTokens":["Tukarkan selang minit kepada jam","dengan membahagikan nilai masa kepada 60","kemudian kira luas trapezium di bawah graf","iaitu setengah kali hasil tambah laju kali masa"],"distractors":["dengan mendarab minit dengan 60","lalu ambil nilai kecerunan sahaja"],"explanation":"Menukar minit kepada jam (t / 60) menyelaraskan unit dengan km j⁻¹, membolehkan rumus trapezium ½(v₁ + v₂)Δt menghasilkan jarak tepat dalam km."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Kira Jarak & Laju Purata 36 Minit","voiceCaption":"Hitung jumlah jarak dan laju purata daripada graf laju-masa 36 minit yang merangkumi satu segi tiga, satu trapezium dan satu segi tiga akhir.","voiceScript":"[serious] Soalan kemuncak Unit tiga! Perhatikan perjalanan tiga puluh enam minit ini: dua belas minit pertama laju naik dari sifar ke enam puluh, dua belas minit kedua naik dari enam puluh ke sembilan puluh, dan dua belas minit terakhir turun dari sembilan puluh ke sifar. Berapakah jumlah jarak dan laju puratanya?","stimulusHtml":"<div class=\"nota-table-wrapper\"><table class=\"nota-data-table\"><thead><tr><th scope=\"col\">Fasa Masa (minit)</th><th scope=\"col\">0 -&gt; 12</th><th scope=\"col\">12 -&gt; 24</th><th scope=\"col\">24 -&gt; 36</th></tr></thead><tbody><tr><th scope=\"row\">Laju (km j⁻¹)</th><td class=\"tbl-mono\">0 -&gt; 60</td><td class=\"tbl-mono\">60 -&gt; 90</td><td class=\"tbl-mono\">90 -&gt; 0</td></tr></tbody></table></div>","prompt":"Hitung jumlah jarak, dalam km, dan laju purata, dalam km j⁻¹, bagi keseluruhan perjalanan 36 minit tersebut.","options":["Jumlah jarak = 30 km; Laju purata = 50 km j⁻¹","Jumlah jarak = 1800 km; Laju purata = 50 km j⁻¹","Jumlah jarak = 30 km; Laju purata = 30 km j⁻¹","Jumlah jarak = 21 km; Laju purata = 35 km j⁻¹"],"correctIndex":0,"explanation":"Selang masa setiap fasa = 12/60 = 0.2 jam. Luas 1 (Segi Tiga) = 0.5 x 0.2 x 60 = 6 km. Luas 2 (Trapezium) = 0.5 x (60 + 90) x 0.2 = 15 km. Luas 3 (Segi Tiga) = 0.5 x 0.2 x 90 = 9 km. Jumlah jarak = 6 + 15 + 9 = 30 km. Jumlah masa = 36/60 = 0.6 jam. Laju purata = 30 / 0.6 = 50 km j⁻¹."}]},{"id":"mat47-u4","title":"Unit 4: Pecutan, Nyahpecutan & Masalah Gabungan","subtitle":"Subtopik 7.2 (Bhg. B) — Kecerunan = Pecutan/Nyahpecutan, Laju Seragam, Zon Informasi (Jarak vs Sesaran, Laju vs Halaju) & Strategi Persamaan SPM","iconType":"pendulum","iconUrl":"../assets/icons/mat47-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Pecutan, Seragam, Nyahpecutan & Zon Info","voiceCaption":"Kecerunan graf laju-masa positif bermaksud pecutan, sifar bermaksud laju seragam, dan negatif bermaksud nyahpecutan dengan arah gerakan kekal sama.","voiceScript":"[warm] Sekarang kita kuasai tafsiran penuh graf laju-masa! Kecerunan positif ialah pecutan iaitu kelajuan bertambah; kecerunan sifar bukan pegun, sebaliknya objek bergerak dengan laju seragam! Manakala kecerunan negatif ialah nyahpecutan — berhati-hati, arah gerakan objek tetap kekal ke hadapan, ia cuma semakin perlahan!","title":"Tafsiran Graf Laju-Masa & Zon Informasi (Skalar vs Vektor)","acronym":"P•S•N•A","hook":"Indikator mutlak KSSM: semasa pecutan mahupun nyahpecutan pada graf laju-masa, arah gerakan objek KEKAL pada arah yang sama!","mediaKey":"mat47_speedometer_kelajuan","summary":"Kecerunan pada graf laju-masa menentukan kadar perubahan laju terhadap masa manakala Zon Informasi membezakan kuantiti skalar (jarak, laju) daripada kuantiti vektor (sesaran, halaju).","bullets":["Tiga Segmen Graf v-t: (1) Kecerunan positif (+a) = Pecutan (kelajuan bertambah); (2) Kecerunan sifar (a = 0, pada v > 0) = Laju seragam (bergerak tetap, BUKAN pegun); (3) Kecerunan negatif (-a) = Nyahpecutan (kelajuan berkurang, arah gerakan kekal sama!).","Zon Informasi & Huraian Nyahpecutan: Jarak ialah ukuran jauh antara dua titik dan Laju = Jarak/Masa; Sesaran ialah jarak vektor pada arah tertentu dan Halaju = Sesaran/Masa. Jika kadar perubahan laju = -2.5 m s⁻², tulis 'nyahpecutan 2.5 m s⁻²' tanpa tanda negatif berganda."],"labId":"mat47_graf_laju_masa_luas_lab","labTitle":"Simulator Pecutan, Laju Seragam & Nyahpecutan","labProps":{"tab":"pecutan","gradPhase":"nyahpecutan"},"formula":"Pecutan / Kadar Perubahan Laju = (v - u) / (t₂ - t₁)   [Unit: m s⁻² atau km j⁻²]","examTip":"Dalam soalan Kertas 2, periksa sama ada soalan meminta 'kadar perubahan laju' (tulis tanda negatif seperti -5/3 m s⁻²) atau 'nyahpecutan' (tulis magnitud positif 5/3 m s⁻²)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Graf s-t vs Graf v-t","voiceCaption":"Bezakan tafsiran setiap sifat geometri antara Graf Jarak-Masa (s-t) dengan Graf Laju-Masa (v-t).","voiceScript":"[curious] Jangan sesekali tertukar dua graf kembar ini! Isihkan keenam-enam tafsiran berikut sama ada ia merujuk Graf Jarak-Masa ataupun Graf Laju-Masa.","prompt":"Isihkan ciri-ciri berikut kepada jenis graf yang betul:","buckets":[{"id":"st","label":"Graf Jarak-Masa (s-t)"},{"id":"vt","label":"Graf Laju-Masa (v-t)"}],"items":[{"text":"Garis mengufuk (kecerunan = 0) bermakna objek PEGUN","bucketId":"st","note":"Pada graf s-t, jarak tidak berubah apabila masa berlalu."},{"text":"Garis mengufuk pada nilai bukan sifar bermakna objek bergerak dengan LAJU SERAGAM","bucketId":"vt","note":"Pada graf v-t, garis mendatar pada v = 25 m s⁻¹ bermakna laju kekal 25 m s⁻¹."},{"text":"Garis condong menurun (kecerunan negatif) bermakna berpatah balik ke asal","bucketId":"st","note":"Pada graf s-t, kecerunan negatif menandakan arah bertentangan."},{"text":"Garis condong menurun bermakna NYAHPECUTAN dan arah kekal sama","bucketId":"vt","note":"Pada graf v-t, kelajuan menyusut ke sifar tanpa berpatah balik."},{"text":"Luas di bawah garis graf bersamaan dengan jumlah jarak yang dilalui","bucketId":"vt","note":"Hanya luas di bawah graf v-t memberikan jarak dilalui."},{"text":"Kecerunan garis lurus terus memberikan nilai kelajuan objek","bucketId":"st","note":"Δs / Δt ialah definisi laju."}],"explanation":"Walaupun graf s-t dan v-t boleh berbentuk trapezium serupa, garis mengufuk dan menurunnya mempunyai makna yang sangat berbeza!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Banding Visual & Huraian Kertas 2","voiceCaption":"Gunakan makmal perbandingan visual untuk menguasai format ayat huraian gerakan penuh bagi Kertas 2 SPM.","voiceScript":"[warm] Ramai calon kehilangan markah mudah dalam Kertas dua ketika disuruh 'huraikan gerakan bagi tempoh tertentu'! Pastikan ayat huraian kamu lengkap dengan tiga unsur: jenis gerakan atau laju, jarak yang dilalui atau kadar pecutan, dan tempoh masanya yang tepat!","title":"Perbandingan Visual s-t vs v-t & Teknik Huraian Kertas 2","acronym":"J•T•P","hook":"Ayat huraian gerakan Kertas 2 mesti menyebut kuantiti nilai (jarak / laju / pecutan) berserta tempoh masa — jangan sekadar tulis 'kereta semakin laju'!","mediaKey":"mat47_graf_gerakan_hero","summary":"Perbandingan visual sebelah-menyebelah membuktikan mengapa paksi mencancang wajib disemak terlebih dahulu sebelum menafsirkan kecerunan atau menghuraikan gerakan.","bullets":["Templat Huraian Graf Jarak-Masa: Nyatakan jumlah jarak dilalui, tempoh masa dan lajunya — contohnya: 'Kereta bergerak sejauh 120 km dalam tempoh 90 minit terakhir dengan kelajuan 80 km j⁻¹.' (Atau bagi pegun: 'Objek berada dalam keadaan pegun selama 1 jam').","Templat Huraian Graf Laju-Masa: Bagi laju seragam, tulis: 'Kereta bergerak dengan laju seragam 25 m s⁻¹ selama 10 saat (sejauh 250 m)'. Bagi nyahpecutan: 'Kereta bergerak sejauh 187.5 m dalam tempoh 15 saat dengan nyahpecutan 5/3 m s⁻²'."],"labId":"mat47_perbandingan_graf_flip","labTitle":"Comparator Visual Graf s-t vs Graf v-t","labProps":{"tab":"uji"},"examTip":"Jika soalan meminta 'kadar perubahan laju bagi 5 saat terakhir' tetapi segmen garis lurus itu bermula 15 saat sebelum tamat, anda boleh guna dua titik hujung garis lurus yang sama!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Huraian Nyahpecutan","voiceCaption":"Ramalkan kadar perubahan laju, jarak dan arah gerakan kereta yang memecut 25 m s⁻¹ kemudian menurun ke 0 dalam 15 saat.","voiceScript":"[curious] Cuba ramalkan! Sebuah kereta bergerak dengan laju seragam dua puluh lima meter per saat dari saat kesepuluh hingga saat kedua puluh, lalu garis graf laju-masanya turun lurus sehingga menyentuh sifar pada saat ketiga puluh lima. Apakah huraian gerakan yang tepat bagi lima belas saat terakhir itu?","hook":"Hitung kecerunan turun dan luas segi tiga terakhir, serta ingat peraturan arah gerakan KSSM!","scenario":"Pada graf v-t, segmen akhir menurun lurus dari (20 s, 25 m s⁻¹) ke (35 s, 0 m s⁻¹).","prompt":"Huraian gerakan manakah yang paling tepat bagi tempoh 15 saat terakhir (t = 20 s hingga 35 s)?","options":["Kereta mengalami nyahpecutan 5/3 m s⁻² sejauh 187.5 m sambil mengekalkan arah gerakan yang sama.","Kereta berpatah balik ke tempat asal dengan halaju -5/3 m s⁻¹ sejauh 187.5 m.","Kereta berada dalam keadaan pegun selama 15 saat sebelum meneruskan perjalanan.","Kereta mengalami nyahpecutan -5/3 m s⁻² sejauh 375 m."],"correctIndex":0,"proofLabId":"mat47_graf_laju_masa_luas_lab","proofState":{"tab":"pecutan","gradPhase":"nyahpecutan"},"explanation":"Kadar perubahan laju = (0 - 25)/(35 - 20) = -5/3 m s⁻², bermaksud nyahpecutan 5/3 m s⁻². Jarak = luas segi tiga = 1/2 x 15 x 25 = 187.5 m. Pada graf v-t, arah gerakan kekal sama."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Strategi Penyelesaian Masalah SPM","voiceCaption":"Kuasai empat pola persamaan masalah SPM: nisbah luas, kesamaan magnitud kecerunan, beza jarak dua kenderaan serta gabungan graf s-t dan v-t.","voiceScript":"[warm] Bahagian kemuncak Bab tujuh ialah menyelesaikan masalah Kertas dua yang mengandungi pemboleh ubah t atau v! Teroka empat kes utama dalam makmal penyelesai masalah: pertama, menyamakan nisbah luas untuk mencari t; kedua, menyamakan magnitud pecutan dan nyahpecutan; ketiga, beza jarak antara dua kenderaan; dan keempat, memindahkan laju purata daripada graf jarak-masa kepada graf laju-masa!","title":"4 Pola Penyelesaian Masalah Algebra & Graf Gabungan SPM","acronym":"N•M•B•G","hook":"Setiap soalan KBAT graf gerakan hanya menterjemah ayat Bahasa Melayu kepada satu persamaan mudah menggunakan Luas atau Kecerunan!","summary":"Masalah berpandukan langkah Polya memerlukan pelajar menterjemahkan syarat perbandingan jarak atau pecutan kepada persamaan linear atau kuadratik.","bullets":["Pola 1 & 2 (Nisbah Luas & Magnitud Kecerunan): Jika jarak fasa 1 ialah separuh jarak laju seragam, tulis Luas₁ = 1/2 × Luas₂ untuk menyelesaikan nilai t. Jika 'magnitud kadar perubahan laju fasa awal sama dengan fasa akhir', samakan nilai positif |m₁| = |m₂| tanpa tanda negatif.","Pola 3 & 4 (Beza Jarak & Gabungan s-t / v-t): Apabila kereta mendahului teksi sebanyak Δs meter pada tempoh masa sama, tulis Luas_kereta - Luas_teksi = Δs. Jika graf s-t digandingkan dengan graf v-t, cari laju purata dan jumlah masa t dari graf s-t dahulu sebelum dimasukkan ke dalam luas trapezium graf v-t."],"labId":"mat47_penyelesai_masalah_lab","labTitle":"Makmal Penyelesai Masalah 4 Pola SPM","labProps":{"caseKey":"luas_t","stepIdx":3},"examTip":"Sentiasa tulis ungkapan luas penuh sebelum menyelesaikannya dan semak jawapan akhir dengan memasukkan semula nilai v atau t ke dalam persamaan asal!"},{"type":"match","xp":15,"voiceIdKey":"u4-s6","voiceToneLabel":"Padan Strategi Persamaan SPM","voiceCaption":"Padankan empat pernyataan syarat soalan Kertas 2 SPM berikut dengan persamaan matematik yang betul.","voiceScript":"[confident] Uji kebolehan kamu menukar ayat masalah kepada persamaan algebra! Padankan setiap petunjuk ayat berikut dengan strategi pengiraannya.","prompt":"Padankan syarat soalan penyelesaian masalah graf gerakan berikut dengan persamaannya:","pairs":[{"id":"u4m1","left":"Jarak 4 s pertama ialah separuh jarak ketika laju seragam","right":"Luas fasa 1 = 0.5 x (t - 4) x v_seragam"},{"id":"u4m2","left":"Magnitud pecutan 3 s pertama sama dengan magnitud nyahpecutan selepas 10 s","right":"(v - u) / 3 = v / (t - 10)"},{"id":"u4m3","left":"Beza jarak antara kereta OAB dengan teksi CD dalam 24 s ialah 160 m","right":"Luas trapezium OAB - Luas segi tiga CD = 160"},{"id":"u4m4","left":"Laju seragam kereta B (v-t) sama dengan laju purata kereta A (s-t)","right":"v_B = Jumlah jarak A / Jumlah masa A"}],"explanation":"Mengenal pasti terjemahan terus daripada frasa soalan kepada persamaan Luas atau Kecerunan ialah kunci utama skor penuh Kertas 2."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Susun Persamaan Nisbah Luas","voiceCaption":"Susun urutan penyelesaian bagi mencari nilai t apabila jarak fasa trapezium 36 m bersamaan separuh jarak fasa laju seragam 12 m s⁻¹.","voiceScript":"[confident] Susun langkah penyelesaian algebra berikut bagi mencari nilai masa t daripada hubungan separuh luas di bawah graf laju-masa!","prompt":"Susun turutan pengiraan untuk mencari nilai t jika jarak 4 s pertama (36 m) ialah separuh jarak laju seragam 12 m s⁻¹ dari t = 4 ke t:","hint":"Tulis ungkapan luas segi empat tepat dahulu, kemudian masukkan ke dalam persamaan...","answerTokens":["Luas laju seragam ialah (t - 4) kali 12","Maka 36 = 0.5 kali 12(t - 4)","Selesaikan 36 = 6t - 24","Supaya 6t = 60 dan t = 10 s"],"distractors":["Maka 36 = 12(t + 4)","Supaya t = 3 saat"],"explanation":"Luas segi empat tepat dari saat ke-4 ke saat ke-t ialah 12(t - 4). Oleh sebab 36 = ½ × 12(t - 4) = 6t - 24, maka 6t = 60 dan t = 10 saat."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s8","voiceToneLabel":"Hitung t daripada Magnitud Kecerunan","voiceCaption":"Hitung jumlah masa t bagi sebuah van yang memecut dari 12 m s⁻¹ ke 30 m s⁻¹ dalam 3 s apabila magnitud nyahpecutan selepas 10 s sama dengan pecutan awal.","voiceScript":"[serious] Soalan penutup Unit empat! Sebuah van bermula dengan laju dua belas meter per saat, memecut kepada tiga puluh dalam tiga saat, kekal pada tiga puluh hingga saat kesepuluh, lalu berhenti pada saat ke t. Jika magnitud nyahpecutannya sama dengan pecutan tiga saat pertama, berapakah nilai t?","prompt":"Sebuah van memecut dari 12 m s⁻¹ ke 30 m s⁻¹ dalam 3 s pertama, bergerak seragam sehingga t = 10 s, lalu menyahpecut hingga berhenti pada t saat. Jika magnitud kadar perubahan laju selepas 10 s sama dengan 3 s pertama, cari nilai t.","options":["15 s","13 s","16 s","20 s"],"correctIndex":0,"explanation":"Pecutan 3 s pertama = (30 - 12) / 3 = 6 m s⁻². Magnitud nyahpecutan selepas 10 s = 30 / (t - 10). Samakan 30 / (t - 10) = 6 -> t - 10 = 5 -> t = 15 s!"}]},{"id":"mat47-u5","title":"Unit 5: Cabaran Boss SPM — Graf Gerakan","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Keseluruhan Subtopik 7.1 & 7.2, Perbandingan Kenderaan, Masalah Gabungan & Persamaan Kuadratik","iconType":"trophy","iconUrl":"../assets/icons/mat47-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Masalah Jarak-Masa Dua Kereta","voiceCaption":"Hitung nilai t dan beza masa ketibaan dua buah kereta di antara Bandar P dan Bandar Q dalam minit.","voiceScript":"[excited] Selamat tiba di Arena Cabaran Boss S P M! Soalan pertama menguji graf jarak-masa dua keluarga! Kereta Raven bergerak enam puluh lima kilometer dalam lima puluh dua minit, berehat dua puluh lima minit, kemudian menyambung hingga seratus tiga puluh lima kilometer pada kadar perubahan jarak yang sama. Kereta Manaf pula mencatat laju purata tujuh puluh dua kilometer per jam tanpa henti. Berapakah nilai t dan beza masa mereka?","prompt":"Kereta A bergerak 65 km dalam 52 minit, rehat 25 minit hingga minit ke-77, lalu bergerak ke 135 km pada minit ke-t dengan laju sama seperti fasa awal. Kereta B menempuh 135 km dengan laju purata 72 km j⁻¹. Hitung nilai t dan beza masa perjalanan kedua-duanya (dalam minit).","options":["t = 133 minit; Beza masa = 20.5 minit","t = 108 minit; Beza masa = 4.5 minit","t = 133 minit; Beza masa = 33.0 minit","t = 129 minit; Beza masa = 16.5 minit"],"correctIndex":0,"explanation":"Samakan kecerunan: 65 / 52 = (135 - 65) / (t - 77) -> 5/4 = 70 / (t - 77) -> t - 77 = 56 -> t = 133 minit. Masa Kereta B = (135 / 72) jam = 1.875 x 60 = 112.5 minit. Beza masa = 133 - 112.5 = 20.5 minit."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Beza Jarak Dua Kenderaan v-t","voiceCaption":"Ramalkan nilai laju v apabila beza jarak antara kereta OAB (trapezium) dengan teksi CD (segi tiga) dalam 24 saat ialah 160 meter.","voiceScript":"[curious] Cabaran Boss kedua melibatkan graf laju-masa bertindih! Kereta O A B mempunyai luas trapezium dengan sisi selari dua puluh empat dan enam belas saat serta tinggi laju v tolak sepuluh. Teksi C D pula membentuk segi tiga dari lapan hingga dua puluh empat saat dengan puncak laju v. Jika beza jarak ialah seratus enam puluh meter, ramalkan nilai v!","hook":"Bina ungkapan Luas OAB - Luas CD = 160 dan selesaikan persamaan linear bagi v!","scenario":"Graf v-t memaparkan Kereta OAB (trapezium tapak 24 s, atas 16 s, tinggi v - 10) dan Teksi CD (segi tiga dari t = 8 s ke 24 s, tinggi v). Beza jarak = 160 m.","prompt":"Berapakah nilai v (dalam m s⁻¹) dan jarak masing-masing yang dilalui oleh kereta serta teksi?","options":["v = 30 m s⁻¹ (Jarak kereta = 400 m, Jarak teksi = 240 m)","v = 25 m s⁻¹ (Jarak kereta = 300 m, Jarak teksi = 140 m)","v = 35 m s⁻¹ (Jarak kereta = 500 m, Jarak teksi = 340 m)","v = 20 m s⁻¹ (Jarak kereta = 200 m, Jarak teksi = 40 m)"],"correctIndex":0,"proofLabId":"mat47_penyelesai_masalah_lab","proofState":{"caseKey":"beza_jarak","stepIdx":3},"explanation":"Luas OAB = 0.5(24 + 16)(v - 10) = 20v - 200. Luas CD = 0.5(16)(v) = 8v. Beza: (20v - 200) - 8v = 160 -> 12v = 360 -> v = 30 m s⁻¹. Semakan: Kereta = 20(20) = 400 m; Teksi = 8(30) = 240 m; Beza = 160 m!"},{"type":"sort","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Audit Perangkap Graf SPM","voiceCaption":"Audit enam kenyataan graf gerakan berikut untuk memisahkan fakta benar daripada mitos perangkap SPM.","voiceScript":"[confident] Jangan jatuh ke dalam perangkap klasik pemeriksa S P M! Isihkan keenam-enam pernyataan di bawah kepada Fakta Tepat S P M atau Mitos Perangkap!","prompt":"Audit setiap pernyataan graf gerakan berikut:","buckets":[{"id":"fakta","label":"Fakta Tepat SPM"},{"id":"mitos","label":"Mitos / Perangkap Lazim"}],"items":[{"text":"Semasa nyahpecutan pada graf laju-masa, arah gerakan objek tetap kekal sama","bucketId":"fakta","note":"Benar! Nyahpecutan hanya bermaksud kelajuan berkurang, bukan mengundur."},{"text":"Garis mengufuk pada graf jarak-masa bermaksud objek sedang bergerak laju seragam","bucketId":"mitos","note":"Perangkap! Pada graf s-t garis mengufuk bererti PEGUN; pada graf v-t barulah laju seragam."},{"text":"Jika graf s-t kembali menyentuh paksi masa, jumlah jarak ialah 2 kali jarak sehala","bucketId":"fakta","note":"Tepat! Jarak skalar menjumlahkan keseluruhan laluan pergi dan pulang."},{"text":"Laju purata dikira dengan membuang selang masa ketika kenderaan berehat pegun","bucketId":"mitos","note":"Salah! Tempoh masa rehat wajib dimasukkan dalam jumlah masa keseluruhan."},{"text":"Kecerunan graf s-t ialah laju, manakala kecerunan graf v-t ialah pecutan","bucketId":"fakta","note":"Betul! Sentiasa semak label paksi mencancang terlebih dahulu."},{"text":"Unit minit pada paksi masa boleh terus didarab dengan laju km j⁻¹ tanpa dibahagi 60","bucketId":"mitos","note":"Salah! Indikator unit menuntut minit ditukar kepada jam (bahagi 60) terlebih dahulu."}],"explanation":"Menguasai enam pembezaan utama ini mengelakkan 90 peratus kesilapan cuai calon dalam peperiksaan SPM."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Kiraan Pantas Kertas 1","voiceCaption":"Padankan lima pengiraan pantas Kertas 1 SPM bagi kecerunan, luas, nyahpecutan dan laju purata.","voiceScript":"[confident] Ujian kelajuan Kertas satu! Padankan setiap masalah ringkas di sebelah kiri dengan jawapan pengiraan pantasnya di sebelah kanan.","prompt":"Padankan setiap pengiraan graf gerakan berikut dengan nilai yang betul:","pairs":[{"id":"u5m1","left":"Graf s-t: Titik (1 j, 45 km) ke (3 j, 195 km)","right":"Laju = 75 km j⁻¹"},{"id":"u5m2","left":"Graf v-t: Titik (0 s, 20 m s⁻¹) ke (5 s, 40 m s⁻¹)","right":"Pecutan = 4 m s⁻²"},{"id":"u5m3","left":"Graf v-t: Laju turun dari 36 m s⁻¹ ke 0 dalam 9 s","right":"Nyahpecutan = 4 m s⁻² (kadar = -4 m s⁻²)"},{"id":"u5m4","left":"Graf v-t: Laju seragam 72 km j⁻¹ selama 10 minit","right":"Jarak dilalui = 12 km"},{"id":"u5m5","left":"Graf v-t: Trapezium antara 10 m s⁻¹ dan 30 m s⁻¹ selama 6 s","right":"Jarak dilalui = 120 m"}],"explanation":"Kiraan pantas: (195-45)/2 = 75; (40-20)/5 = 4; 36/9 = 4; 72 × (10/60) = 12 km; 0.5 × (10+30) × 6 = 120 m."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Gabungan Graf s-t & v-t","voiceCaption":"Susun langkah penyelesaian gabungan graf s-t Kereta A (360 m, laju purata 18 m s⁻¹) dengan graf v-t Kereta B (trapezium puncak 24 m s⁻¹).","voiceScript":"[serious] Cabaran Boss kelima menggabungkan kedua-dua graf sekaligus! Susun blok penyelesaian untuk mencari tempoh laju seragam Kereta B apabila Kereta A menempuh tiga ratus enam puluh meter dengan laju purata lapan belas meter per saat.","prompt":"Kereta A (graf s-t) menempuh 360 m dengan laju purata 18 m s⁻¹. Kereta B (graf v-t) menempuh jarak dan masa t sama dengan laju seragam puncak 24 m s⁻¹. Susun langkah mencari tempoh laju seragam (T) Kereta B:","hint":"Dapatkan jumlah masa t daripada Kereta A dahulu, kemudian gunakan luas trapezium Kereta B...","answerTokens":["Masa t Kereta A = 360 bahagi 18 = 20 saat","Gunakan Luas Trapezium Kereta B = 360 m","iaitu 0.5 kali (20 + T) kali 24 = 360","Maka 20 + T = 30 dan tempoh seragam T = 10 s"],"distractors":["iaitu 20 kali T = 360","dan tempoh seragam T = 18 s"],"explanation":"Daripada graf s-t Kereta A, t = 360 / 18 = 20 s. Seterusnya bagi trapezium Kereta B: 0.5 × (20 + T) × 24 = 360 -> 12(20 + T) = 360 -> T = 10 saat."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: KBAT Persamaan & Waktu 24 Jam","voiceCaption":"Selesaikan soalan KBAT SPM melibatkan dua pemandu sejauh 120 km dengan beza masa 30 minit untuk mencari laju v serta waktu ketibaan sistem 24 jam.","voiceScript":"[excited] Inilah pertempuran terakhir Bab tujuh! Dua kenderaan memandu sejauh seratus dua puluh kilometer; Encik Lim memandu pada laju purata v manakala Encik Amir pada v tolak dua puluh dan tiba tiga puluh minit lebih lewat. Jika Encik Lim bertolak pada pukul lapan tiga puluh pagi dalam sistem dua puluh empat jam, tentukan laju v serta waktu beliau sampai!","prompt":"Pada graf jarak-masa sejauh 120 km, Kereta P dipandu dengan laju purata v km j⁻¹ manakala Kereta Q dengan laju purata (v - 20) km j⁻¹. Jika Kereta P tiba 30 minit lebih awal daripada Kereta Q dan ia bertolak pada pukul 0830, hitung nilai v serta waktu Kereta P tiba dalam sistem 24 jam.","options":["v = 80 km j⁻¹; waktu tiba ialah 1000","v = 60 km j⁻¹; waktu tiba ialah 1030","v = 100 km j⁻¹; waktu tiba ialah 0942","v = 80 km j⁻¹; waktu tiba ialah 0930"],"correctIndex":0,"explanation":"Persamaan beza masa: 120/(v - 20) - 120/v = 0.5. Darab silang: 120(20) = 0.5 v(v - 20) -> v² - 20v - 4800 = 0 -> (v - 80)(v + 60) = 0 -> v = 80 km j⁻¹. Masa Kereta P = 120/80 = 1.5 jam (1 jam 30 minit). Waktu tiba = 0830 + 0130 = 1000!"}]}]};</script>

     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat47_graf_jarak_masa_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "jadual" ? "jadual" : "sim";
    var preset = ps.preset || "perjalanan_rehat";
    var eqMode = ps.eqMode || "menuju";
    var eqSlope = typeof ps.eqSlope === "number" ? ps.eqSlope : 75;
    var paused = reducedMotion();
    var rafId = 0;
    var lastTs = 0;
    var simFrac = ps.mode === "proof" ? 0.65 : 0.42;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;

    var presets = {
      perjalanan_rehat: {
        label: "1. Pergi, Pegun & Sambung",
        tUnit: "jam",
        sUnit: "km",
        tMax: 4.5,
        sMax: 240,
        pts: [
          { t: 0, s: 0 },
          { t: 2.0, s: 120 },
          { t: 3.0, s: 120 },
          { t: 4.5, s: 240 }
        ],
        totalDist: 240,
        segNotes: [
          "Fasa 1 (0 -> 2.0 j): Kecerunan = (120 - 0) / (2.0 - 0) = +60 km j^-1 (laju seragam).",
          "Fasa 2 (2.0 -> 3.0 j): Kecerunan = (120 - 120) / (3.0 - 2.0) = 0 (pegun selama 1 jam).",
          "Fasa 3 (3.0 -> 4.5 j): Kecerunan = (240 - 120) / (4.5 - 3.0) = +80 km j^-1 (lebih curam = lebih laju)."
        ],
        formulaLine: "Jumlah Jarak = 240 km | Jumlah Masa = 4.5 j | Laju Purata = 240 / 4.5 = 53.33 km j^-1"
      },
      pergi_balik: {
        label: "2. Pergi & Patah Balik",
        tUnit: "jam",
        sUnit: "km",
        tMax: 1.5,

        pts: [
          { t: 0, s: 0 },
          { t: 0.5, s: 9 },
          { t: 0.75, s: 9 },
          { t: 1.5, s: 0 }
        ],
        totalDist: 18,
        segNotes: [
          "Fasa 1 (0 -> 0.5 j): Menuju destinasi sejauh 9 km dengan laju = 9 / 0.5 = 18 km j^-1.",
          "Fasa 2 (0.5 -> 0.75 j): Garisan mengufuk (kecerunan = 0), pegun selama 15 minit (0.25 jam).",
          "Fasa 3 (0.75 -> 1.5 j): Kecerunan = (0 - 9) / 0.75 = -12 km j^-1 (berpatah balik ke asal pada laju 12 km j^-1)."
        ],
        formulaLine: "Jumlah Jarak = 9 + 9 = 18 km (BUKAN 0!) | Laju Purata = 18 / 1.5 = 12.0 km j^-1"
      },
      dua_kenderaan: {
        label: "3. Dua Kenderaan Bertemu",
        tUnit: "jam",
        sUnit: "km",
        tMax: 3.0,
        sMax: 180,
        pts: [
          { t: 0, s: 0 },
          { t: 2.0, s: 180 },
          { t: 2.0, s: 180 },
          { t: 2.0, s: 180 }
        ],
        ptsB: [
          { t: 0, s: 180 },
          { t: 3.0, s: 0 }
        ],
        totalDist: 180,
        segNotes: [
          "Kereta Biru (P -> Q): Kecerunan = (180 - 0) / (2 - 0) = +90 km j^-1.",
          "Bas Kuning (Q -> P): Kecerunan = (0 - 180) / (3 - 0) = -60 km j^-1 (laju = 60 km j^-1 arah bertentangan).",
          "Beza laju = 90 - 60 = 30 km j^-1 | Titik persilangan (t = 1.2 j, s = 108 km) ialah tempat mereka berselisih!"
        ],
        formulaLine: "Kereta = 90 km j^-1 | Bas = 60 km j^-1 | Beza Laju = 30 km j^-1 | Berselisih pada t = 1.2 jam"
      },
      merentas_desa: {
        label: "4. Persamaan Garis Penamat",
        tUnit: "min",
        sUnit: "km",
        tMax: 40,
        sMax: 10,
        pts: [
          { t: 0, s: 10 },
          { t: 16, s: 6 },
          { t: 20, s: 6 },
          { t: 40, s: 1 }
        ],
        totalDist: 9,
        segNotes: [
          "Pada t = 0 minit: Pelari berada 10 km dari garisan penamat (pintasan-y = 10).",
          "Fasa 1 (0 -> 16 min): Baki jarak berkurang kepada 6 km (laju = 4 km / (16/60 j) = 15 km j^-1).",
          "Fasa 2 (16 -> 20 min): Berhenti di stesen air (pegun 4 minit) sebelum meneruskan larian hingga 1 km."
        ],
        formulaLine: "Kadar perubahan jarak = (1 - 6) km / (20/60 j) = -15 km j^-1 | Baki ke penamat semakin mengecil"
      }
    };

    if (!presets[preset]) preset = "perjalanan_rehat";

    function sampleCurve(pts, tVal) {
      if (tVal <= pts[0].t) return { s: pts[0].s, grad: 0, segIdx: 0 };
      for (var i = 0; i < pts.length - 1; i++) {
        var a = pts[i];
        var b = pts[i + 1];
        if (b.t <= a.t) continue;
        if (tVal <= b.t || i === pts.length - 2) {
          var clampedT = Math.min(b.t, Math.max(a.t, tVal));
          var ratio = (clampedT - a.t) / (b.t - a.t);
          var sVal = a.s + ratio * (b.s - a.s);
          var grad = (b.s - a.s) / (b.t - a.t);
          return { s: sVal, grad: grad, segIdx: i };
        }
      }
      var last = pts[pts.length - 1];
      return { s: last.s, grad: 0, segIdx: pts.length - 2 };
    }

    function drawCanvas() {
      var canvas = shell.querySelector("#mat47StCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var W = canvas.width;
      var H = canvas.height;
      var pr = presets[preset];
      var curT = simFrac * pr.tMax;
      var stA = sampleCurve(pr.pts, curT);
      var stB = pr.ptsB ? sampleCurve(pr.ptsB, curT) : null;

      c2d.fillStyle = "#0f172a";
      c2d.fillRect(0, 0, W, H);

      // Top Road Track Strip (y: 12 -> 76)
      c2d.fillStyle = "#1e293b";
      c2d.strokeStyle = "#334155";
      c2d.lineWidth = 1.5;
      c2d.fillRect(18, 12, W - 36, 66);
      c2d.strokeRect(18, 12, W - 36, 66);

      var roadX0 = 54;
      var roadX1 = W - 54;
      var roadY = 48;
      c2d.strokeStyle = "#64748b";
      c2d.lineWidth = 4;
      c2d.beginPath();
      c2d.moveTo(roadX0, roadY);
      c2d.lineTo(roadX1, roadY);
      c2d.stroke();

      c2d.strokeStyle = "#94a3b8";
      c2d.lineWidth = 1.5;
      c2d.setLineDash([8, 6]);
      c2d.beginPath();
      c2d.moveTo(roadX0, roadY);
      c2d.lineTo(roadX1, roadY);
      c2d.stroke();
      c2d.setLineDash([]);

      // Origin and Dest flags
      c2d.fillStyle = "#e2e8f0";
      c2d.font = "800 9.5px JetBrains Mono, monospace";
      c2d.textAlign = "center";
      c2d.fillText("O (0 " + pr.sUnit + ")", roadX0, 70);
      c2d.fillText(pr.sMax + " " + pr.sUnit, roadX1, 70);

      // Vehicle A position along 1D road
      var vxA = roadX0 + (stA.s / pr.sMax) * (roadX1 - roadX0);
      var statusText = Math.abs(stA.grad) < 0.01 ? "PEGUN (m = 0)" : (stA.grad > 0 ? "MAJU (+m)" : "PATAH BALIK (-m)");
      var statusCol = Math.abs(stA.grad) < 0.01 ? "#fbbf24" : (stA.grad > 0 ? "#38bdf8" : "#f87171");

      c2d.fillStyle = statusCol;
      c2d.strokeStyle = "#ffffff";
      c2d.lineWidth = 2;
      c2d.beginPath();
      if (typeof c2d.roundRect === "function") {
        c2d.roundRect(vxA - 16, roadY - 16, 32, 16, 5);
      } else {
        c2d.rect(vxA - 16, roadY - 16, 32, 16);
      }
      c2d.fill();
      c2d.stroke();

      // Wheels
      c2d.fillStyle = "#0f172a";
      c2d.beginPath();
      c2d.arc(vxA - 9, roadY, 4, 0, Math.PI * 2);
      c2d.arc(vxA + 9, roadY, 4, 0, Math.PI * 2);
      c2d.fill();

      // Optional Vehicle B on road
      if (stB) {
        var vxB = roadX0 + (stB.s / pr.sMax) * (roadX1 - roadX0);
        c2d.fillStyle = "#f59e0b";
        c2d.strokeStyle = "#fef08a";
        c2d.lineWidth = 2;
        c2d.fillRect(vxB - 18, roadY - 32, 36, 13);
        c2d.strokeRect(vxB - 18, roadY - 32, 36, 13);
      }

      c2d.fillStyle = statusCol;
      c2d.font = "800 10px Plus Jakarta Sans, sans-serif";
      c2d.textAlign = "left";
      c2d.fillText("LALUAN JALAN: " + statusText, 28, 27);
      c2d.textAlign = "right";
      c2d.fillStyle = "#f8fafc";
      c2d.font = "800 10px JetBrains Mono, monospace";
      c2d.fillText("t = " + curT.toFixed(2) + " " + pr.tUnit + "  |  s = " + stA.s.toFixed(1) + " " + pr.sUnit, W - 28, 27);

      // Distance-Time Graph below (y: 94 -> 244)
      var gx0 = 70;
      var gx1 = W - 36;
      var gyTop = 104;
      var gyBot = 244;

      function mx(t) { return gx0 + (t / pr.tMax) * (gx1 - gx0); }
      function my(s) { return gyBot - (s / pr.sMax) * (gyBot - gyTop); }

      // Grid lines
      c2d.strokeStyle = "rgba(148,163,184,0.16)";
      c2d.lineWidth = 1;
      for (var g = 1; g <= 4; g++) {
        var yy = gyBot - (g / 4) * (gyBot - gyTop);
        c2d.beginPath(); c2d.moveTo(gx0, yy); c2d.lineTo(gx1, yy); c2d.stroke();
      }

      // Axes
      c2d.strokeStyle = "#94a3b8";
      c2d.lineWidth = 2;
      c2d.beginPath();
      c2d.moveTo(gx0, gyTop);
      c2d.lineTo(gx0, gyBot);
      c2d.lineTo(gx1, gyBot);
      c2d.stroke();

      // Axis labels
      c2d.fillStyle = "#cbd5e1";
      c2d.font = "700 9.5px JetBrains Mono, monospace";
      c2d.textAlign = "right";
      c2d.fillText("0", gx0 - 8, gyBot + 3);
      c2d.fillText(String(Math.round(pr.sMax / 2)), gx0 - 8, (gyTop + gyBot) / 2 + 3);
      c2d.fillText(String(pr.sMax), gx0 - 8, gyTop + 5);

      c2d.textAlign = "center";
      c2d.fillText("0", gx0, gyBot + 15);
      c2d.fillText((pr.tMax / 2).toFixed(1) + " " + pr.tUnit, (gx0 + gx1) / 2, gyBot + 15);
      c2d.fillText(pr.tMax + " " + pr.tUnit, gx1 - 6, gyBot + 15);

      c2d.fillStyle = "#e2e8f0";
      c2d.font = "800 10px Plus Jakarta Sans, sans-serif";
      c2d.fillText("Masa, t (" + pr.tUnit + ")", (gx0 + gx1) / 2, H - 7);
      c2d.save();
      c2d.translate(18, (gyTop + gyBot) / 2);
      c2d.rotate(-Math.PI / 2);
      c2d.fillText("Jarak, s (" + pr.sUnit + ")", 0, 0);
      c2d.restore();

      // Draw active gradient triangle for current segment
      var segA = pr.pts[stA.segIdx];
      var segB = pr.pts[stA.segIdx + 1];
      if (segA && segB && segB.t > segA.t && Math.abs(segB.s - segA.s) > 0.01) {
        c2d.fillStyle = segB.s > segA.s ? "rgba(56,189,248,0.18)" : "rgba(248,113,113,0.18)";
        c2d.strokeStyle = segB.s > segA.s ? "#38bdf8" : "#f87171";
        c2d.lineWidth = 1.5;
        c2d.setLineDash([4, 3]);
        c2d.beginPath();
        c2d.moveTo(mx(segA.t), my(segA.s));
        c2d.lineTo(mx(segB.t), my(segA.s));
        c2d.lineTo(mx(segB.t), my(segB.s));
        c2d.closePath();
        c2d.fill();
        c2d.stroke();
        c2d.setLineDash([]);
      }

      // Draw Vehicle B curve if present
      if (pr.ptsB) {
        c2d.strokeStyle = "#f59e0b";
        c2d.lineWidth = 3.2;
        c2d.beginPath();
        pr.ptsB.forEach(function (pt, idx) {
          if (idx === 0) c2d.moveTo(mx(pt.t), my(pt.s));
          else c2d.lineTo(mx(pt.t), my(pt.s));
        });
        c2d.stroke();
      }

      // Draw main curve A
      c2d.strokeStyle = "#34d399";
      c2d.lineWidth = 3.8;
      c2d.lineJoin = "round";
      c2d.beginPath();
      pr.pts.forEach(function (pt, idx) {
        if (idx === 0) c2d.moveTo(mx(pt.t), my(pt.s));
        else c2d.lineTo(mx(pt.t), my(pt.s));
      });
      c2d.stroke();

      // Vertex dots
      pr.pts.forEach(function (pt) {
        c2d.fillStyle = "#1e293b";
        c2d.strokeStyle = "#e2e8f0";
        c2d.lineWidth = 2;
        c2d.beginPath();
        c2d.arc(mx(pt.t), my(pt.s), 4.5, 0, Math.PI * 2);
        c2d.fill();
        c2d.stroke();
      });

      // Live marker on graph
      var px = mx(curT);
      var py = my(stA.s);
      c2d.strokeStyle = statusCol;
      c2d.lineWidth = 1.5;
      c2d.setLineDash([3, 3]);
      c2d.beginPath();
      c2d.moveTo(px, gyBot);
      c2d.lineTo(px, py);
      c2d.lineTo(gx0, py);
      c2d.stroke();
      c2d.setLineDash([]);

      c2d.fillStyle = statusCol;
      c2d.strokeStyle = "#ffffff";
      c2d.lineWidth = 2.5;
      c2d.beginPath();
      c2d.arc(px, py, 6.5, 0, Math.PI * 2);
      c2d.fill();
      c2d.stroke();

      if (stB) {
        c2d.fillStyle = "#f59e0b";
        c2d.beginPath();
        c2d.arc(mx(curT), my(stB.s), 6, 0, Math.PI * 2);
        c2d.fill();
        c2d.stroke();
      }
    }

    function updateReadoutDom() {
      var pr = presets[preset];
      var curT = simFrac * pr.tMax;
      var stA = sampleCurve(pr.pts, curT);
      var elT = shell.querySelector("#mat47StTime");
      var elS = shell.querySelector("#mat47StDist");
      var elG = shell.querySelector("#mat47StGrad");
      var elK = shell.querySelector("#mat47StState");
      if (elT) elT.textContent = curT.toFixed(2) + " " + pr.tUnit;
      if (elS) elS.textContent = stA.s.toFixed(1) + " " + pr.sUnit;
      if (elG) {
        var gradUnit = pr.tUnit === "min" ? "km min^-1" : "km j^-1";
        elG.textContent = (stA.grad > 0 ? "+" : "") + stA.grad.toFixed(1) + " " + gradUnit;
      }
      if (elK) {
        elK.textContent = Math.abs(stA.grad) < 0.01
          ? "Pegun (Tidak Bergerak)"
          : (stA.grad > 0 ? "Laju Seragam (Menuju)" : "Berpatah Balik (Arah Bertentangan)");
      }
    }

    function stepLoop(ts) {
      rafId = 0;
      if (paused || isDocHidden || tab !== "sim") return;
      var dt = lastTs ? Math.min(0.05, Math.max(0.004, (ts - lastTs) / 1000)) : 0.016;
      lastTs = ts;
      simFrac += dt * 0.16;
      if (simFrac > 1.0) simFrac = 0;
      drawCanvas();
      updateReadoutDom();
      var slider = shell.querySelector("#mat47StScrub");
      if (slider) slider.value = String(Math.round(simFrac * 100));
      rafId = window.requestAnimationFrame(stepLoop);
    }

    function syncLoop() {
      if (!paused && !isDocHidden && tab === "sim") {
        if (!rafId) {
          lastTs = 0;
          rafId = window.requestAnimationFrame(stepLoop);
        }
      } else if (rafId) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    function buildEqTabHtml() {
      var rows = [];
      var eqTitle = "";
      var sAt0 = 0;
      var sEnd = 0;
      var tEnd = 4;
      if (eqMode === "menuju") {
        eqTitle = "s = " + eqSlope + "t   (0 <= t <= 4 jam)";
        tEnd = 4;
        for (var t = 0; t <= 4; t++) rows.push({ t: t, s: eqSlope * t });
        sAt0 = 0;
        sEnd = eqSlope * 4;
      } else if (eqMode === "penamat") {
        eqTitle = "s = 12 - 0.25t   (0 <= t <= 48 minit)";
        tEnd = 48;
        [0, 12, 24, 36, 48].forEach(function (tv) {
          rows.push({ t: tv, s: Number((12 - 0.25 * tv).toFixed(1)) });
        });
        sAt0 = 12;
        sEnd = 0;
      } else {
        eqTitle = "s = 6t + 4   (0 <= t <= 5 saat)";
        tEnd = 5;
        for (var tv2 = 0; tv2 <= 5; tv2++) rows.push({ t: tv2, s: 6 * tv2 + 4 });
        sAt0 = 4;
        sEnd = 34;
      }

      var maxS = Math.max(12, sAt0, sEnd);
      var W = 560, H = 220, x0 = 68, x1 = 510, yTop = 36, yBot = 176;
      function mx(tv) { return x0 + (tv / tEnd) * (x1 - x0); }
      function my(sv) { return yBot - (sv / maxS) * (yBot - yTop); }

      var dotsSvg = rows.map(function (r) {
        return '<circle cx="' + mx(r.t).toFixed(1) + '" cy="' + my(r.s).toFixed(1) + '" r="4.5" fill="#fde047" stroke="#0f172a" stroke-width="1.5"/>';
      }).join("");

      var tblRows = rows.map(function (r) {
        return '<tr><th scope="row" class="tbl-mono">' + r.t + '</th><td class="tbl-mono">' + r.s + "</td></tr>";
      }).join("");

      var tLbl = eqMode === "menuju" ? "Masa, t (jam)" : (eqMode === "penamat" ? "Masa, t (minit)" : "Masa, t (saat)");
      var sLbl = eqMode === "awal" ? "Jarak, s (cm)" : "Jarak, s (km)";

      return [
        '<div class="lab-controls">',
        '  <button type="button" class="lab-seg-btn" data-eq-m="menuju" aria-pressed="' + (eqMode === "menuju") + '">1. s = mt (Asalan)</button>',
        '  <button type="button" class="lab-seg-btn" data-eq-m="penamat" aria-pressed="' + (eqMode === "penamat") + '">2. s = 12 - 0.25t (Penamat)</button>',
        '  <button type="button" class="lab-seg-btn" data-eq-m="awal" aria-pressed="' + (eqMode === "awal") + '">3. s = 6t + 4 (Pintasan ≠ 0)</button>',
        "</div>",
        eqMode === "menuju"
          ? '<div class="lab-controls"><label class="lab-slider-group"><span class="lab-slider-label"><span>Laju Pemanduan (m)</span><span class="tabular-nums">' + eqSlope + ' km j^-1</span></span><input id="mat47EqSlope" class="lab-range" type="range" min="40" max="100" step="10" value="' + eqSlope + '"></label></div>'
          : "",
        '<div class="mat47-svg-stage">',
        '  <svg viewBox="0 0 ' + W + ' ' + H + '" aria-label="Plot graf jarak masa daripada persamaan">',
        '    <rect x="4" y="4" width="' + (W - 8) + '" height="' + (H - 8) + '" rx="12" fill="#0f172a"/>',
        '    <text x="285" y="22" text-anchor="middle" font-family="Lexend,sans-serif" font-size="11" font-weight="800" fill="#7dd3fc">' + esc(eqTitle) + "</text>",
        '    <line x1="' + x0 + '" y1="' + yTop + '" x2="' + x0 + '" y2="' + yBot + '" stroke="#94a3b8" stroke-width="2.5"/>',
        '    <line x1="' + x0 + '" y1="' + yBot + '" x2="' + x1 + '" y2="' + yBot + '" stroke="#94a3b8" stroke-width="2.5"/>',
        '    <line x1="' + mx(0).toFixed(1) + '" y1="' + my(sAt0).toFixed(1) + '" x2="' + mx(tEnd).toFixed(1) + '" y2="' + my(sEnd).toFixed(1) + '" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>',
             dotsSvg,
        '    <text x="' + (x0 - 8) + '" y="' + (yBot + 4) + '" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10" fill="#cbd5e1">0</text>',
        '    <text x="' + (x0 - 8) + '" y="' + (my(maxS) + 4).toFixed(1) + '" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10" fill="#cbd5e1">' + maxS + "</text>",
        '    <text x="' + x0 + '" y="' + (yBot + 16) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#cbd5e1">0</text>',
        '    <text x="' + x1 + '" y="' + (yBot + 16) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#fde68a">' + tEnd + "</text>",
        '    <text x="290" y="208" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">' + esc(tLbl) + "</text>",
        '    <text x="20" y="108" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" transform="rotate(-90 20 108)">' + esc(sLbl) + "</text>",
        "  </svg>",
        "</div>",
        '<div class="nota-table-wrapper" tabindex="0"><table class="nota-data-table"><caption>Jadual Nilai Koordinat (2 titik hujung mencukupi untuk garis lurus)</caption><thead><tr><th scope="col">' + esc(tLbl) + '</th><th scope="col">' + esc(sLbl) + '</th></tr></thead><tbody>' + tblRows + "</tbody></table></div>"
      ].join("");
    }

    function render() {
      var tabsHtml =
        '<div class="wf-jucas-pills">' +
          '<button type="button" class="wf-jpill jp-mint" data-st-tab="sim" aria-pressed="' + (tab === "sim") + '">Simulator Kenderaan &amp; Graf s-t</button>' +
          '<button type="button" class="wf-jpill jp-amber" data-st-tab="jadual" aria-pressed="' + (tab === "jadual") + '">Plot Jadual &amp; Persamaan Linear</button>' +
        "</div>";

      if (tab === "jadual") {
        shell.innerHTML = tabsHtml + buildEqTabHtml();
      } else {

  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}
