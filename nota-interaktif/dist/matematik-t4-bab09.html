  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t4-bab09","subject":"Matematik","subjectGroup":"teras","form":4,"chapterNumber":9,"title":"Kebarangkalian Peristiwa Bergabung","subtitle":"Subtopik 9.1–9.4 KSSM (35 Langkah Bit-by-Bit) — Ruang Sampel S & Pasangan Bertertib, Peristiwa Bersandar vs Tak Bersandar, Gambar Rajah Pokok, Saling Eksklusif vs Bertindih (Venn), Hukum Pendaraban & Penambahan serta Aplikasi KBAT SPM.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t4-bab09-labs.js","coverIcon":"../assets/icons/mat49-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Analisis kebarangkalian kamu amat tajam dan sistematik!","combo":"[laughs warmly] Kombo yang luar biasa! Pengiraan pecahan dan logik set kamu terus membara!","encourage":"[encouraging] Hampir tepat! Cuba semak semula sama ada cabutan dibuat dengan pemulangan atau tanpa pemulangan ya.","celebrate":"[excited] Tahniah! Kamu telah berjaya menguasai unit Kebarangkalian Peristiwa Bergabung dengan cemerlang!"},"units":[{"id":"mat49-u1","title":"Unit 1: Peristiwa Bergabung & Ruang Sampel S","subtitle":"Subtopik 9.1 — Pascal & Fermat, Maslahat Bab, Pasangan Bertertib & Prinsip n(S) = n(A) × n(B)","iconType":"formula","iconUrl":"../assets/icons/mat49-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Asas Kebarangkalian Bergabung","voiceCaption":"Teori kebarangkalian dirintis oleh Blaise Pascal dan Pierre de Fermat bagi menilai ketidakpastian dan risiko melalui peristiwa bergabung.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan empat Bab sembilan, Kebarangkalian Peristiwa Bergabung! Tahukah kamu ilmu ini mula dirintis oleh Blaise Pascal dan Pierre de Fermat pada abad ketujuh belas? Peristiwa bergabung bermaksud gabungan dua atau lebih peristiwa dalam satu kesudahan yang diwakili oleh pasangan bertertib, contohnya dalam pengurusan risiko sukan, penentuan premium insurans dan perniagaan!","title":"Teori Kebarangkalian, Maslahat Bab & Peristiwa Bergabung","acronym":"P•F•S","hook":"Setiap keputusan yang melibatkan risiko — daripada memilih pemain bola sepak hingga menetapkan premium insurans — menggunakan ilmu kebarangkalian!","mediaKey":"mat49_pascal","videoClip":{"src":"../assets/matematik-t4-bab09/video/mat49_video_kebarangkalian.mp4","posterKey":"mat49_video_poster","caption":"Simulasi 3D: Percabangan kebarangkalian peristiwa bergabung melalui lambungan dadu, syiling dan cabutan guli berwarna"},"summary":"Peristiwa bergabung ialah gabungan dua atau lebih peristiwa dalam satu kesudahan yang terhasil daripada satu atau beberapa eksperimen rawak.","bullets":["Imbasan Silam & Maslahat Bab: Ahli matematik Perancis Blaise Pascal (1623–1662) dan Pierre de Fermat mengasaskan teori kebarangkalian; hari ini ilmu ini membantu jurulatih sukan (cth. taktikal pasukan bola sepak kebangsaan Malaysia dari Olimpik Munich 1972 hingga juara Piala Suzuki 2010), syarikat insurans menilai premium, serta bidang pengeluaran dan pengurusan risiko.","Definisi & Pasangan Bertertib: Kesudahan suatu peristiwa bergabung diwakilkan menggunakan pasangan bertertib (x, y) — misalnya dua pemain dalam permainan Gunting-Batu-Kertas menghasilkan 9 pasangan bertertib daripada {(Gunting, Batu), (Gunting, Kertas), ..., (Kertas, Kertas)}."],"examTip":"Sentiasa tulis ruang sampel S dalam tatatanda set berkerinting S = { (x, y), ... } supaya tiada pasangan bertertib tertinggal."},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Istilah Teras 9.1","voiceCaption":"Padankan lima istilah dan tokoh penting dalam Subtopik 9.1 dengan huraiannya yang tepat.","voiceScript":"[confident] Sebelum mengira pecahan kebarangkalian, pastikan asas istilah kamu kukuh! Padankan kelima-lima istilah serta tokoh perintis berikut dengan maksudnya.","prompt":"Padankan setiap istilah asas peristiwa bergabung dengan huraian yang tepat:","pairs":[{"id":"u1m1","left":"Peristiwa Bergabung","right":"Gabungan dua atau lebih peristiwa dalam satu kesudahan"},{"id":"u1m2","left":"Pasangan Bertertib (x, y)","right":"Cara menulis setiap kesudahan bagi dua eksperimen berurutan atau serentak"},{"id":"u1m3","left":"Ruang Sampel S","right":"Set lengkap semua kesudahan yang mungkin bagi sesuatu eksperimen"},{"id":"u1m4","left":"n(S) = n(A) x n(B)","right":"Rumus mengira jumlah bilangan kesudahan peristiwa bergabung"},{"id":"u1m5","left":"Blaise Pascal & Pierre de Fermat","right":"Dua tokoh matematik Perancis perintis teori kebarangkalian"}],"explanation":"Menguasai istilah ruang sampel S, pasangan bertertib (x, y) dan rumus n(S) = n(A) x n(B) menjadi asas kepada keseluruhan Bab 9."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Menyenaraikan Ruang Sampel","voiceCaption":"Gunakan jadual dua hala dan rumus n(S) = n(A) × n(B) untuk menyenaraikan ruang sampel dengan pemulangan mahupun tanpa pemulangan.","voiceScript":"[warm] Bagaimanakah kita menyenaraikan kesudahan peristiwa bergabung tanpa tertinggal satu pun? Gunakan pasangan bertertib atau jadual dua hala, serta semak saiznya dengan rumus n S sama dengan n A darab n B! Contohnya, syiling adil dan dadu adil dilambung serentak menghasilkan dua darab enam sama dengan dua belas kesudahan. Cuba teroka simulator Ruang Sampel di dalam kad makmal!","title":"Menyenaraikan Ruang Sampel S & Prinsip n(S) = n(A) × n(B)","acronym":"n(S)=A×B","hook":"Jika 4 kad huruf {M, A, J, U} dicabut dua kali tanpa pemulangan, kad kedua hanya tinggal 3 pilihan, jadi n(S) = 4 x 3 = 12!","mediaKey":"mat49_dadu_syiling","summary":"Bilangan kesudahan suatu peristiwa bergabung ditentukan melalui prinsip pendaraban n(S) = n(A) × n(B) dan boleh disusun menggunakan jadual atau gambar rajah pokok.","bullets":["Eksperimen Serentak atau Dengan Pemulangan: Lambungan dua syiling adil {A, G} memberi n(S) = 2 × 2 = 4 iaitu {(A, A), (A, G), (G, A), (G, G)}; lambungan syiling bersama dadu adil pula memberi 2 × 6 = 12 kesudahan, dan dua dadu menghasilkan 6 × 6 = 36 kesudahan.","Pemilihan Tanpa Pemulangan & Syarat Tamat: Jika dua kad dipilih satu demi satu tanpa pemulangan daripada 4 kad berbeza, pilihan kedua berkurang menjadi 3, maka n(S) = 4 × 3 = 12. Bagi perlawanan bersyarat (cth. badminton 5 set, menang 3 set terus tamat), senaraikan setiap turutan hingga pemenang mengumpul 3 kemenangan."],"formula":"n(S) = n(A) × n(B)   |   Tanpa pemulangan N kad berbeza: n(S) = N × (N - 1)","labId":"mat49_gambar_rajah_pokok_lab","labTitle":"Simulator Ruang Sampel & Gambar Rajah Pokok","labProps":{"scenario":"syiling_dadu","replacement":true},"examTip":"Bezakan pasangan bertertib bagi soalan 'tanpa pemulangan': pasangan bertindih seperti (M, M) atau (A, A) mesti digugurkan apabila hanya ada sekeping kad bagi setiap huruf."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Saiz Ruang Sampel","voiceCaption":"Ramalkan jumlah kesudahan apabila lima kad huruf berbeza dicabut satu demi satu tanpa pemulangan.","voiceScript":"[curious] Mari uji kecekapan kamu! Terdapat lima keping kad berlabel K, E, L, A, S di dalam sebuah kotak. Dua keping kad dikeluarkan secara rawak satu demi satu tanpa pemulangan. Berapakah jumlah kesudahan dalam ruang sampel eksperimen ini?","hook":"Awas perangkap paling kerap dalam soalan ruang sampel: adakah kad pertama dipulangkan atau tidak?","scenario":"Kotak mengandungi 5 kad huruf berlabel 'K, E, L, A, S'. Dua keping kad diambil satu demi satu tanpa pemulangan dan susunan huruf dicatat sebagai pasangan bertertib.","prompt":"Ramalkan jumlah bilangan kesudahan yang mungkin n(S) bagi eksperimen ini:","options":["20 kesudahan kerana kad pertama ada 5 pilihan dan kad kedua tinggal 4 pilihan tanpa ulangan huruf sama","25 kesudahan kerana setiap cabutan sentiasa mempunyai 5 pilihan huruf termasuk (K, K) dan (E, E)","10 kesudahan kerana 5 ditambah dengan 5 menghasilkan jumlah ruang sampel","9 kesudahan kerana lima kad ditambah empat baki kad bersamaan sembilan"],"correctIndex":0,"proofLabId":"mat49_gambar_rajah_pokok_lab","proofState":{"scenario":"guli_bag","replacement":false},"explanation":"Tanpa pemulangan bermaksud kad pertama tidak dikembalikan ke dalam kotak. Oleh itu n(A) = 5 pilihan bagi cabutan pertama dan n(B) = 4 pilihan bagi cabutan kedua, menghasilkan n(S) = 5 × 4 = 20 kesudahan bertertib.","examTip":"Jika guli atau buku mempunyai warna atau subjek berulang (misalnya 2 buku Sejarah yang serupa dalam Praktis Kendiri), labelkan S1 dan S2 atau semak sama ada warna sama boleh muncul dua kali."},{"type":"sort","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Isih Saiz Ruang Sampel","voiceCaption":"Kelaskan enam eksperimen peristiwa bergabung berikut mengikut saiz ruang sampel n(S).","voiceScript":"[confident] Sekarang asah kepantasan mengira n S! Isihkan enam eksperimen di bawah sama ada bilangan kesudahannya kecil iaitu dua belas atau kurang, ataupun besar iaitu dua puluh ke atas.","prompt":"Isihkan setiap eksperimen peristiwa bergabung mengikut nilai n(S):","buckets":[{"id":"kecil","label":"n(S) <= 12 Kesudahan"},{"id":"besar","label":"n(S) >= 20 Kesudahan"}],"items":[{"text":"Lambungan dua keping syiling adil secara serentak (A, G)","bucketId":"kecil","note":"n(S) = 2 × 2 = 4 kesudahan"},{"text":"Lambungan sekeping syiling adil bersama sebiji dadu adil","bucketId":"kecil","note":"n(S) = 2 × 6 = 12 kesudahan"},{"text":"Memilih dua keping syiling daripada {10 sen, 20 sen, 50 sen} tanpa pemulangan","bucketId":"kecil","note":"n(S) = 3 × 2 = 6 kesudahan"},{"text":"Mencabut dua kad huruf daripada {R, A, J, I, N} satu demi satu tanpa pemulangan","bucketId":"besar","note":"n(S) = 5 × 4 = 20 kesudahan"},{"text":"Lambungan dua biji dadu adil bermuka enam secara serentak","bucketId":"besar","note":"n(S) = 6 × 6 = 36 kesudahan"},{"text":"Memilih dua buah buku satu demi satu tanpa pemulangan daripada 6 buah buku berlabel unik","bucketId":"besar","note":"n(S) = 6 × 5 = 30 kesudahan"}],"explanation":"Dengan menggunakan n(S) = n(A) × n(B), kita boleh menyemak dengan pantas bahawa semua eksperimen serentak atau tanpa pemulangan tergolong dalam saiz <= 12 atau >= 20."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Bina Rumus Ruang Sampel","voiceCaption":"Susun blok matematik berikut untuk membentuk rumus am bilangan kesudahan ruang sampel.","voiceScript":"[warm] Mari kukuhkan ingatan kamu terhadap rumus teras Subtopik sembilan perpuluhan satu. Susun blok di bawah bagi membentuk persamaan bilangan kesudahan ruang sampel S!","prompt":"Susun blok simbol menjadi rumus am bilangan kesudahan ruang sampel peristiwa bergabung:","hint":"Gunakan prinsip pendaraban antara bilangan kesudahan peristiwa A dengan peristiwa B.","answerTokens":["n(S)","=","n(A)","×","n(B)"],"acceptedSequences":[["n(S)","=","n(A)","×","n(B)"],["n(S)","=","n(B)","×","n(A)"]],"distractors":["+","P(S)","÷"],"explanation":"Bilangan kesudahan ruang sampel peristiwa bergabung A dan B ialah n(S) = n(A) × n(B), bukannya hasil tambah."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran Perlawanan 5 Set","voiceCaption":"Selesaikan soalan kesudahan bersyarat bagi perlawanan pingpong maksimum lima set.","voiceScript":"[serious] Ini soalan ujian kefahaman sembilan perpuluhan satu gaya K B A T! Hana dan Zaki bertanding pingpong maksimum lima set, di mana pemain pertama memenangi tiga set diisytihar juara. Berapakah bilangan kesudahan yang berakhir tepat pada set keempat?","prompt":"Hana (H) dan Zaki (Z) bermain perlawanan pingpong maksimum 5 set; pemain pertama memenangi 3 set menjadi juara. Berapakah bilangan kesudahan yang tamat tepat pada set ke-4?","stimulusHtml":"<strong>Syarat Pertandingan:</strong> Perlawanan terus tamat sebaik seorang pemain mengumpul 3 kemenangan set (skor akhir 3–1 bagi kemenangan pada set ke-4).","options":["6 kesudahan","8 kesudahan","12 kesudahan","16 kesudahan"],"correctIndex":0,"explanation":"Untuk tamat tepat pada set ke-4, pemenang mesti menang set ke-4 dan menang tepat 2 daripada 3 set awal: bagi Hana ada 3 turutan iaitu (Z,H,H,H), (H,Z,H,H), (H,H,Z,H), manakala bagi Zaki juga 3 turutan iaitu (H,Z,Z,Z), (Z,H,Z,Z), (Z,Z,H,Z). Jumlah = 3 + 3 = 6 kesudahan."}]},{"id":"mat49-u2","title":"Unit 2: Peristiwa Bersandar, Tak Bersandar & Gambar Rajah Pokok","subtitle":"Subtopik 9.2 — Pemulangan vs Tanpa Pemulangan, Hukum Pendaraban P(A ∩ B) = P(A) × P(B) & Cabang Pokok","iconType":"graph","iconUrl":"../assets/icons/mat49-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Bersandar vs Tak Bersandar","voiceCaption":"Peristiwa A dan B tak bersandar jika kejadian A tidak mempengaruhi kejadian B, dan bersandar jika A mengubah kebarangkalian B.","voiceScript":"[warm] Sekarang kita masuk ke Subtopik sembilan perpuluhan dua! Bagaimanakah membezakan peristiwa bersandar dengan peristiwa tak bersandar? Kuncinya mudah: tanya sama ada kejadian pertama mengubah peluang kejadian kedua! Jika kad dikembalikan semula atau eksperimen berasingan seperti syiling dengan dadu, ia tak bersandar. Jika kad atau pen diambil tanpa pemulangan, atau kad dipindahkan dari kotak P ke kotak Q, ia peristiwa bersandar!","title":"Membezakan Peristiwa Tak Bersandar vs Peristiwa Bersandar","acronym":"PULANG?","hook":"Sekeping kad yang tidak dipulangkan ke dalam kotak atau dipindahkan ke kotak lain serta-merta mengubah penyebut cabutan seterusnya!","mediaKey":"mat49_guli_warna","summary":"Dua peristiwa A dan B ialah tak bersandar apabila kejadian A tidak mempengaruhi kebarangkalian B; sebaliknya ia ialah peristiwa bersandar apabila kejadian A mengubah kebarangkalian B.","bullets":["Peristiwa Tak Bersandar (Independent): Melibatkan dua objek/ujian berbeza (syiling adil & dadu adil, putaran roda bertuah dua kali, menjawab soalan aneka pilihan secara rawak, dua murid menduduki ujian) atau cabutan satu demi satu DENGAN pemulangan supaya komposisi kotak kekal sama.","Peristiwa Bersandar (Dependent): Melibatkan pemilihan satu demi satu TANPA pemulangan (mengurangkan baki objek dalam bekas), ataupun pemindahan objek daripada satu bekas ke bekas lain (contohnya memilih kad dari kotak P lalu memasukkannya ke dalam kotak Q sebelum mencabut kad di Q)."],"labId":"mat49_bersandar_vs_tak_lab","labTitle":"Comparator Peristiwa Bersandar vs Tak Bersandar","labProps":{"mode":"compare"},"examTip":"Hati-hati dengan soalan pemindahan antara dua kotak: walaupun cabutan dibuat dari Kotak P kemudian Kotak Q, peristiwa itu BERSANDAR jika kad dari P dimasukkan ke dalam Q!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Bersandar vs Tak Bersandar","voiceCaption":"Kelaskan enam situasi berikut kepada Peristiwa Tak Bersandar atau Peristiwa Bersandar.","voiceScript":"[confident] Uji kepekaan logik kamu sekarang! Asingkan keenam-enam situasi berikut sama ada ia peristiwa tak bersandar ataupun peristiwa bersandar.","prompt":"Isihkan setiap peristiwa bergabung kepada kategori yang tepat:","buckets":[{"id":"tak_bersandar","label":"Peristiwa Tak Bersandar"},{"id":"bersandar","label":"Peristiwa Bersandar"}],"items":[{"text":"Mendapat angka dalam lambungan syiling adil dan nombor 4 pada lambungan dadu adil","bucketId":"tak_bersandar","note":"Tak bersandar: dua alat eksperimen berasingan tidak saling mempengaruhi."},{"text":"Jarum roda bertuah berhenti pada sektor warna yang sama dua kali berturut-turut","bucketId":"tak_bersandar","note":"Tak bersandar: sektor roda tetap sama pada setiap putaran."},{"text":"Dua kad dipilih satu demi satu daripada {B, A, I, K} dengan pemulangan","bucketId":"tak_bersandar","note":"Tak bersandar: kad pertama dikembalikan, jumlah kad kekal 4."},{"text":"Mengeluarkan dua batang pen berwarna sama satu demi satu tanpa pemulangan","bucketId":"bersandar","note":"Bersandar: pen pertama tidak dipulangkan, baki pen berkurang 1."},{"text":"Memilih dua orang murid lelaki secara rawak daripada kelas yang ada 10 perempuan dan 14 lelaki","bucketId":"bersandar","note":"Bersandar: murid pertama tidak boleh dipilih semula pada pilihan kedua."},{"text":"Mengambil kad dari Kotak P lalu memasukkannya ke Kotak Q sebelum mencabut kad dari Kotak Q","bucketId":"bersandar","note":"Bersandar: kad dari P mengubah komposisi dan jumlah kad dalam Kotak Q!"}],"explanation":"Peristiwa tak bersandar mengekalkan ruang sampel dan kebarangkalian yang sama pada percubaan seterusnya, manakala peristiwa bersandar mengubahnya."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Cabang Tanpa Pemulangan","voiceCaption":"Ramalkan kebarangkalian mendapat guli kedua merah selepas guli pertama biru dikeluarkan tanpa pemulangan.","voiceScript":"[curious] Sebuah beg mengandungi empat biji guli biru dan dua biji guli merah. Dua biji guli dikeluarkan secara rawak satu demi satu tanpa pemulangan. Jika guli pertama ialah biru, ramalkan kebarangkalian guli kedua berwarna merah serta kebarangkalian laluan biru diikuti merah!","hook":"Perhatikan penyebut turun daripada 6 kepada 5 sebaik guli pertama dikeluarkan tanpa pemulangan!","scenario":"Beg mengandungi 4 guli Biru (B) dan 2 guli Merah (M). Dua guli dicabut satu demi satu TANPA pemulangan.","prompt":"Ramalkan P(guli kedua merah | pertama biru) dan nilai kebarangkalian gabungan P(B, M):","options":["P(kedua merah) = 2/5, maka P(B, M) = 4/6 × 2/5 = 4/15","P(kedua merah) = 2/6, maka P(B, M) = 4/6 × 2/6 = 2/9","P(kedua merah) = 1/5, maka P(B, M) = 4/6 × 1/5 = 2/15","P(kedua merah) = 3/5, maka P(B, M) = 4/6 × 3/5 = 2/5"],"correctIndex":0,"proofLabId":"mat49_gambar_rajah_pokok_lab","proofState":{"scenario":"guli_bag","replacement":false,"selectedBranch":"BM"},"explanation":"Selepas 1 guli biru keluar tanpa pemulangan, beg kini tinggal 3 biru dan 2 merah (jumlah 5 guli). Oleh itu P(M selepas B) = 2/5, dan P(B, M) = 4/6 × 2/5 = 8/30 = 4/15."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Kiraan Hukum Pendaraban","voiceCaption":"Padankan lima situasi kebarangkalian bersandar dan tak bersandar berikut dengan hasil darab pecahannya.","voiceScript":"[confident] Jom latih ketangkasan darab pecahan! Padankan setiap eksperimen di lajur kiri dengan nilai kebarangkalian tepatnya di lajur kanan.","prompt":"Padankan setiap situasi dengan kebarangkalian peristiwa bergabungnya:","pairs":[{"id":"u2m1","left":"Lambung dadu adil dua kali; kedua-dua muka nombor 6","right":"1/36  (1/6 x 1/6)"},{"id":"u2m2","left":"P(hujan) = 0.40 setiap hari; dua hari hujan berturut-turut","right":"0.16  (0.40 x 0.40)"},{"id":"u2m3","left":"Beg ada 8 hijau & 1 merah tanpa pemulangan; kedua-dua hijau","right":"7/9  (8/9 x 7/8)"},{"id":"u2m4","left":"Syiling adil & dadu serentak; Angka dan nombor > 4","right":"1/6  (1/2 x 2/6)"},{"id":"u2m5","left":"Kad {T, A, H, A, N} dengan pemulangan; dua-dua huruf vokal","right":"4/25  (2/5 x 2/5)"}],"explanation":"Setiap pasangan menggunakan hukum pendaraban P(A dan B) = P(A) × P(B selepas A); pastikan penyebut dikurangkan bagi kes tanpa pemulangan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Hukum Pendaraban & Rajah Pokok","voiceCaption":"Hukum Pendaraban menyatakan P(A ∩ B) = P(A) × P(B), manakala gambar rajah pokok memaparkan semua cabang kesudahan lengkap dengan nilai kebarangkalian.","voiceScript":"[warm] Mengapakah kita boleh mendarab terus P A dengan P B? Apabila kita menyenaraikan semua kesudahan dalam jadual dua hala, nisbah petak persilangan n A persilangan B bahagi n S sentiasa sama dengan hasil darab P A dan P B! Bagi situasi bersandar atau berperingkat, lakarkan gambar rajah pokok: darab pecahan sepanjang cabang, dan jumlahkan cabang jika lebih daripada satu kesudahan memenuhi syarat!","title":"Hukum Pendaraban P(A ∩ B) = P(A) × P(B) & Gambar Rajah Pokok","acronym":"P(A)×P(B)","hook":"Jumlah semua kebarangkalian cabang yang keluar daripada mana-mana satu nod gambar rajah pokok sentiasa mesti sama dengan 1!","mediaKey":"mat49_pokok_diagram","summary":"Hukum Pendaraban Kebarangkalian menghubungkan persilangan dua peristiwa melalui hasil darab, dan gambar rajah pokok memvisualisasikan setiap laluan cabang bagi kedua-dua kes tak bersandar dan bersandar.","bullets":["Hukum Pendaraban & Penentusahan: Bagi dua peristiwa tak bersandar A dan B, P(A ∩ B) = P(A) × P(B); nilai ini sentiasa menyamai pengiraan terus n(A ∩ B) / n(S) daripada ruang sampel.","3 Peraturan Gambar Rajah Pokok (Memori Saya): (1) Setiap cabang mewakili satu kesudahan dengan pecahan kebarangkaliannya, (2) Jumlah pecahan dari satu nod sama dengan 1 (cth. P(H) + P(M) = 1), dan (3) Darabkan nilai sepanjang laluan cabang untuk P(cabang); tambah laluan yang berbeza jika soalan menerima lebih daripada satu laluan."],"formula":"P(A ∩ B) = P(A) × P(B)   |   Cabang Bersandar: P(A ∩ B) = P(A) × P(B | A)","labId":"mat49_gambar_rajah_pokok_lab","labTitle":"Makmal Gambar Rajah Pokok & Simulasi Cabutan","labProps":{"scenario":"guli_bag","replacement":false},"examTip":"Jika soalan meminta jawapan betul kepada empat angka bererti (seperti jadual ahli persatuan sesi pagi dan petang), kekalkan pecahan tepat sehingga langkah akhir sebelum membundarkan jawapan perpuluhan!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Bina Hukum Pendaraban","voiceCaption":"Susun blok matematik menjadi Hukum Pendaraban Kebarangkalian bagi dua peristiwa tak bersandar.","voiceScript":"[warm] Sekarang susun blok simbol di bawah bagi membentuk Hukum Pendaraban Kebarangkalian yang sah untuk dua peristiwa tak bersandar A dan B!","prompt":"Susun blok simbol menjadi Hukum Pendaraban Kebarangkalian bagi dua peristiwa tak bersandar:","hint":"Persilangan A dan B bersamaan hasil darab kebarangkalian masing-masing.","answerTokens":["P(A ∩ B)","=","P(A)","×","P(B)"],"acceptedSequences":[["P(A ∩ B)","=","P(A)","×","P(B)"],["P(A ∩ B)","=","P(B)","×","P(A)"]],"distractors":["+","P(A ∪ B)","-"],"explanation":"Hukum Pendaraban Kebarangkalian ialah P(A ∩ B) = P(A) × P(B) bagi peristiwa tak bersandar (gunakan simbol persilangan ∩ atau kata hubung 'dan')."},{"type":"predict","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Ramal Bukti Jadual Pendaraban","voiceCaption":"Ramalkan kebarangkalian mendapat kad vokal dari Kotak X dan nombor perdana dari Kotak Y.","voiceScript":"[curious] Mari tentu sahkan hukum pendaraban! Kotak X ada lima kad huruf S, U, K, A, N manakala Kotak Y ada empat kad nombor dua, tiga, lima, lapan. Sekeping kad dipilih rawak dari setiap kotak. Ramalkan kebarangkalian mendapat huruf vokal dan nombor perdana!","hook":"Pastikan kamu tahu 2, 3, 5 ialah nombor perdana manakala 1 bukan nombor perdana dan 8 ialah nombor gubahan!","scenario":"Kotak X = {S, U, K, A, N} dan Kotak Y = {2, 3, 5, 8}. Sekeping kad dipilih dari X dan sekeping dari Y.","prompt":"Ramalkan kebarangkalian mendapat huruf vokal dari X dan nombor perdana dari Y:","options":["3/10 kerana P(vokal) = 2/5 dan P(perdana) = 3/4, lalu 2/5 × 3/4 = 6/20 = 3/10","1/5 kerana hanya huruf A dan nombor 2 diambil sebagai kesudahan, iaitu 4/20","2/5 kerana terdapat dua huruf vokal dalam perkataan SUKAN dan nombor 2 sahaja perdana","23/20 kerana 2/5 ditambah dengan 3/4 menghasilkan kesatuan kedua-dua kotak"],"correctIndex":0,"proofLabId":"mat49_bersandar_vs_tak_lab","proofState":{"mode":"multiply_verify"},"explanation":"Huruf vokal dalam {S, U, K, A, N} ialah {U, A} (2/5), manakala nombor perdana dalam {2, 3, 5, 8} ialah {2, 3, 5} (3/4). Daripada jadual 20 pasangan, tepat 6 pasangan memenuhi kedua-dua syarat: {(U,2),(U,3),(U,5),(A,2),(A,3),(A,5)}, iaitu 6/20 = 3/10."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Cabaran Kotak Mentol Terbakar","voiceCaption":"Hitung kebarangkalian memilih dua biji mentol terbakar satu demi satu tanpa pemulangan daripada sepuluh biji mentol.","voiceScript":"[serious] Soalan gaya peperiksaan! Sebuah kotak mengandungi sepuluh biji mentol dan dua daripadanya telah terbakar. Jika dua biji mentol diambil secara rawak satu demi satu tanpa pemulangan, apakah kebarangkalian kedua-dua mentol itu terbakar?","prompt":"Sebuah kotak mengandungi 10 biji mentol dengan 2 daripadanya terbakar. Dua biji mentol dipilih secara rawak tanpa pemulangan. Hitung kebarangkalian kedua-dua mentol itu terbakar.","options":["1/45","1/25","2/45","1/5"],"correctIndex":0,"explanation":"Cabutan pertama mendapat mentol terbakar ialah 2/10. Tanpa pemulangan, tinggal 1 mentol terbakar daripada 9 mentol. Maka P(kedua-dua terbakar) = 2/10 × 1/9 = 2/90 = 1/45."}]},{"id":"mat49-u3","title":"Unit 3: Peristiwa Saling Eksklusif & Tidak Saling Eksklusif","subtitle":"Subtopik 9.3 — Set Kosong A ∩ B = ∅ vs Bertindih, Gambar Rajah Venn & Rumus Penambahan P(A ∪ B)","iconType":"scale","iconUrl":"../assets/icons/mat49-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Saling Eksklusif vs Bertindih","voiceCaption":"Peristiwa saling eksklusif tidak boleh berlaku serentak kerana tiada unsur sepunya (A ∩ B = ∅), manakala peristiwa tidak saling eksklusif bertindih.","voiceScript":"[warm] Selamat tiba ke Unit tiga! Dalam Subtopik sembilan perpuluhan tiga, kita mengenali peristiwa saling eksklusif dan tidak saling eksklusif. Bayangkan dua bulatan gambar rajah Venn: jika kedua-dua peristiwa mustahil berlaku pada masa sama — contohnya nombor genap dengan faktor bagi sembilan dalam bola bernombor satu hingga sembilan — tiada persilangan langsung dan ia dipanggil saling eksklusif! Jika ada sekurang-kurangnya satu unsur sepunya seperti nombor empat, ia tidak saling eksklusif!","title":"Membezakan Peristiwa Saling Eksklusif vs Tidak Saling Eksklusif","acronym":"A∩B=∅?","hook":"Dalam bola bernombor 1–9, nombor genap dan faktor bagi 9 terpisah sama sekali, tetapi nombor genap dan kuasa dua sempurna berkongsi nombor 4!","mediaKey":"mat49_venn_set","summary":"Dua peristiwa A dan B ialah saling eksklusif jika kedua-duanya tidak boleh berlaku pada masa yang sama (A ∩ B = ∅), dan tidak saling eksklusif jika wujud kesudahan sepunya (A ∩ B ≠ ∅).","bullets":["Peristiwa Saling Eksklusif (A ∩ B = ∅, P(A ∩ B) = 0): Tidak boleh berlaku serentak dan bulatan Venn terasing — misalnya memilih bola genap {2,4,6,8} vs faktor bagi 9 {1,3,9}; pekerja bergaji kurang RM2 500 vs wajib bayar cukai pendapatan; atau telur gred A vs gred C.","Peristiwa Tidak Saling Eksklusif (A ∩ B ≠ ∅, P(A ∩ B) ≠ 0): Boleh berlaku bersama dan bulatan Venn bertindih — misalnya bola genap {2,4,6,8} vs kuasa dua sempurna {1,4,9} yang bertindih di {4}; pekerja bergaji < RM2 500 vs pergi kerja menaiki kereta; atau pelancong negara ASEAN vs Komanwel (Malaysia & Singapura ahli kedua-duanya!)."],"labId":"mat49_eksklusif_venn_lab","labTitle":"Makmal Gambar Rajah Venn Interaktif (Saling Eksklusif vs Bertindih)","labProps":{"preset":"nombor1_9","pair":"T_V"},"examTip":"Untuk soalan konteks seperti kelas atau pelancong, semak sama ada individu boleh memiliki kedua-dua sifat serentak (cth. pelancong Malaysia berasal dari ASEAN dan juga Komanwel, jadi tidak saling eksklusif!)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Pasangan Eksklusif Venn","voiceCaption":"Kelaskan enam pasangan peristiwa berikut kepada Saling Eksklusif atau Tidak Saling Eksklusif.","voiceScript":"[confident] Uji kebolehan kamu mengesan unsur bertindih! Asingkan enam pasangan peristiwa ini sama ada saling eksklusif ataupun tidak saling eksklusif.","prompt":"Isihkan setiap pasangan peristiwa berikut ke dalam kategori yang betul:","buckets":[{"id":"eksklusif","label":"Saling Eksklusif (A ∩ B = {})"},{"id":"tidak_eksklusif","label":"Tidak Saling Eksklusif (Bertindih)"}],"items":[{"text":"Dadu adil dilambung: mendapat nombor lebih besar daripada 4 vs mendapat nombor kuasa dua sempurna","bucketId":"eksklusif","note":"{5, 6} dan {1, 4} tiada persilangan."},{"text":"Sebiji telur dipilih: telur gred A vs telur gred C","bucketId":"eksklusif","note":"Sebiji telur tidak mungkin bergred A dan gred C serentak."},{"text":"Seorang pelancong di KLIA: berasal dari negara Eropah vs berasal dari negara ASEAN","bucketId":"eksklusif","note":"Tiada negara di benua Eropah menjadi anggota ASEAN."},{"text":"Dadu adil dilambung: mendapat nombor lebih besar daripada 4 vs mendapat nombor genap","bucketId":"tidak_eksklusif","note":"Bertindih pada nombor {6} kerana 6 > 4 dan genap."},{"text":"Sebiji telur dipilih: telur yang retak vs telur gred C","bucketId":"tidak_eksklusif","note":"Telur gred C boleh jadi retak pada masa yang sama."},{"text":"Seorang pelancong di KLIA: berasal dari negara ASEAN vs berasal dari negara Komanwel","bucketId":"tidak_eksklusif","note":"Malaysia, Singapura dan Brunei menganggotai ASEAN dan Komanwel serentak."}],"explanation":"Sama ada dua peristiwa saling eksklusif bergantung sepenuhnya pada wujud atau tidaknya sekurang-kurangnya satu kesudahan sepunya dalam persilangan A ∩ B."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tolakan Kawasan Bertindih","voiceCaption":"Ramalkan kebarangkalian P(T ∪ U) dan sebab P(T) + P(U) perlu ditolak P(T ∩ U).","voiceScript":"[curious] Sembilan biji bola bernombor satu hingga sembilan dimasukkan ke dalam bakul. Peristiwa T ialah nombor genap, manakala peristiwa U ialah kuasa dua sempurna. Ramalkan kebarangkalian mendapat nombor genap atau kuasa dua sempurna, serta sebab mengapa kita tidak boleh sekadar menjumlahkan empat per sembilan dengan tiga per sembilan!","hook":"Angka 4 berada dalam dua bulatan Venn serentak — jika tidak ditolak, ia dikira dua kali!","scenario":"S = {1, 2, 3, 4, 5, 6, 7, 8, 9}. T = {2, 4, 6, 8} dan U = {1, 4, 9}.","prompt":"Ramalkan nilai tepat P(T ∪ U) dan punca mengapa 4/9 + 3/9 tidak tepat:","options":["P(T ∪ U) = 2/3 kerana bola nombor 4 berada dalam T dan U serentak, jadi 4/9 + 3/9 - 1/9 = 6/9 = 2/3","P(T ∪ U) = 7/9 kerana T mempunyai 4 bola dan U mempunyai 3 bola maka kesatuannya ialah 7 bola","P(T ∪ U) = 1/9 kerana hanya bola nombor 4 yang memenuhi gabungan kedua-dua syarat tersebut","P(T ∪ U) = 4/27 kerana dua peristiwa tersebut perlu didarabkan bersama dahulu sebelum ditambah"],"correctIndex":0,"proofLabId":"mat49_eksklusif_venn_lab","proofState":{"preset":"nombor1_9","pair":"T_U","region":"union"},"explanation":"Set T = {2, 4, 6, 8} dan U = {1, 4, 9} bertindih pada {4}. Kesatuan T ∪ U = {1, 2, 4, 6, 8, 9} hanya mempunyai 6 unsur, jadi P(T ∪ U) = 6/9 = 2/3. Menolak P(T ∩ U) = 1/9 mengelakkan nombor 4 dikira dua kali."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s4","voiceToneLabel":"Rumus Penambahan & Pelengkap","voiceCaption":"Gunakan Rumus Penambahan P(A ∪ B) = P(A) + P(B) - P(A ∩ B), atau P(A) + P(B) jika saling eksklusif, serta kaedah pelengkap P(A') = 1 - P(A).","voiceScript":"[warm] Rumus Penambahan Kebarangkalian amat mudah diingat jika kamu faham kata hubung 'atau'! Apabila melihat 'A atau B' dan kedua-duanya boleh berlaku bersama, guna P A tambah P B tolak P A persilangan B. Jika saling eksklusif, persilangannya sifar jadi tambah terus P A dan P B! Dan jika A dan B ialah peristiwa tak bersandar dalam gambar rajah Venn, cari dahulu persilangannya melalui P A darab P B!","title":"Rumus Penambahan P(A ∪ B), Pelengkap & Gabungan Venn–Pokok","acronym":"ATAU=+","hook":"Perkataan 'ATAU' merujuk kepada kesatuan (∪), manakala perkataan 'DAN' merujuk kepada persilangan (∩)!","mediaKey":"mat49_rumus_penambahan","summary":"Rumus Penambahan Kebarangkalian mengira P(A atau B) bagi peristiwa saling eksklusif dan tidak saling eksklusif, serta boleh digabungkan dengan Hukum Pendaraban dan kaedah pelengkap.","bullets":["Dua Bentuk Rumus Penambahan: Bagi peristiwa tidak saling eksklusif, P(A ∪ B) = P(A) + P(B) - P(A ∩ B). Bagi peristiwa saling eksklusif (P(A ∩ B) = 0), ia diringkaskan kepada P(A ∪ B) = P(A) + P(B).","Gabungan Venn Tak Bersandar & Pelengkap 'Sekurang-kurangnya Satu': Jika dua peristiwa tak bersandar A dan B dipaparkan pada Venn, hitung P(A ∩ B) = P(A) × P(B) terlebih dahulu sebelum menolak daripada P(A) dan P(B) untuk mencari bahagian eksklusif; manakala untuk 'tidak A atau B' = 1 - P(A ∪ B) dan 'sekurang-kurangnya satu' = 1 - P(tiada satu pun)."],"formula":"P(A ∪ B) = P(A) + P(B) - P(A ∩ B)   |   Jika A ∩ B = ∅: P(A ∪ B) = P(A) + P(B)","labId":"mat49_rumus_kebarangkalian_flip","labTitle":"Dek Kad 3D: Rumus Penambahan, Pendaraban & Perangkap SPM","examTip":"Bagi soalan 'hanya seorang daripada A atau B menyertai', jumlahkan kedua-dua bahagian luar persilangan dalam Venn iaitu [P(A) - P(A ∩ B)] + [P(B) - P(A ∩ B)], ataupun P(A ∩ B') + P(A' ∩ B) melalui rajah pokok!"},{"type":"match","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Padan Rumus Penambahan Tepat","voiceCaption":"Padankan lima situasi pernyataan kebarangkalian dengan ungkapan atau rumusnya yang sepadan.","voiceScript":"[confident] Pastikan kamu tidak tertukar simbol atau rumus ketika membaca soalan peperiksaan! Padankan kelima-lima huraian situasi di bawah dengan ungkapan matematiknya.","prompt":"Padankan pernyataan peristiwa dengan rumus kebarangkalian yang tepat:","pairs":[{"id":"u3m1","left":"A dan B saling eksklusif: P(A atau B)","right":"P(A) + P(B)"},{"id":"u3m2","left":"A dan B bertindih: P(A atau B)","right":"P(A) + P(B) - P(A ∩ B)"},{"id":"u3m3","left":"Tidak berlaku A mahupun B (bahagian luar Venn)","right":"1 - P(A ∪ B)"},{"id":"u3m4","left":"Hanya A berlaku tanpa B","right":"P(A) - P(A ∩ B)"},{"id":"u3m5","left":"Sekurang-kurangnya sebuah peranti rosak daripada 2 buah","right":"1 - P(kedua-dua elok)"}],"explanation":"Terjemahan tepat kata hubung seperti 'atau', 'tidak kedua-duanya', 'hanya A' dan 'sekurang-kurangnya satu' kepada tatatanda set menjimatkan masa pengiraan dalam Kertas 2."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Bina Rumus Penambahan Penuh","voiceCaption":"Susun blok simbol untuk membina Rumus Penambahan Kebarangkalian bagi peristiwa tidak saling eksklusif.","voiceScript":"[warm] Sekarang bina sendiri Rumus Penambahan Kebarangkalian penuh bagi dua peristiwa yang tidak saling eksklusif!","prompt":"Susun blok simbol menjadi Rumus Penambahan Kebarangkalian bagi peristiwa tidak saling eksklusif:","hint":"Tambahkan kebarangkalian kedua-dua set, kemudian tolak kawasan pertindihan.","answerTokens":["P(A ∪ B)","=","P(A)","+","P(B)","-","P(A ∩ B)"],"acceptedSequences":[["P(A ∪ B)","=","P(A)","+","P(B)","-","P(A ∩ B)"],["P(A ∪ B)","=","P(B)","+","P(A)","-","P(A ∩ B)"]],"distractors":["×","1 -","P(A')"],"explanation":"Rumus penambahan penuh ialah P(A ∪ B) = P(A) + P(B) - P(A ∩ B). Apabila A dan B saling eksklusif, P(A ∩ B) = 0."},{"type":"predict","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Ramal Venn Kantin Tak Bersandar","voiceCaption":"Ramalkan kebarangkalian Amir atau Bella makan laksa serta kebarangkalian kedua-duanya tidak makan laksa.","voiceScript":"[curious] Di kantin sekolah, kebarangkalian Amir makan laksa ialah tiga per lima dan kebarangkalian Bella makan laksa ialah dua per tiga secara tak bersandar. Ramalkan kebarangkalian Amir atau Bella makan laksa, serta kebarangkalian tiada seorang pun daripada mereka makan laksa!","hook":"Cari dahulu P(kedua-dua makan laksa) menggunakan Hukum Pendaraban sebelum masuk ke Rumus Penambahan!","scenario":"P(Amir makan laksa) = 3/5, P(Bella makan laksa) = 2/3 (tak bersandar).","prompt":"Ramalkan nilai tepat P(Amir atau Bella makan laksa) dan P(kedua-duanya tidak makan laksa):","options":["P(A ∪ B) = 13/15 dan P(tiada seorang pun) = 2/15","P(A ∪ B) = 19/15 dan P(tiada seorang pun) = 1/15","P(A ∪ B) = 2/5 dan P(tiada seorang pun) = 3/5","P(A ∪ B) = 11/15 dan P(tiada seorang pun) = 4/15"],"correctIndex":0,"proofLabId":"mat49_eksklusif_venn_lab","proofState":{"preset":"kantin","region":"union"},"explanation":"Mula-mula cari P(A ∩ B) = 3/5 × 2/3 = 2/5 = 6/15. Seterusnya P(A ∪ B) = 3/5 + 2/3 - 2/5 = 9/15 + 10/15 - 6/15 = 13/15. Akhirnya, P(tidak kedua-duanya) = 1 - 13/15 = 2/15 (sama dengan 2/5 × 1/3)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s8","voiceToneLabel":"Cabaran Nilai Maksimum P(B)","voiceCaption":"Tentukan nilai maksimum P(B) dan nilai P(B) apabila A dan B saling eksklusif dengan P(A) = 2/5.","voiceScript":"[serious] Soalan ini kerap memerangkap calon Kertas satu dan dua! Diberi A dan B ialah dua peristiwa yang saling eksklusif dengan P A sama dengan dua per lima. Apakah nilai maksimum P B, dan apakah nilai P B jika P A kesatuan B sama dengan tiga per empat?","prompt":"Peristiwa A dan B ialah dua peristiwa saling eksklusif dan P(A) = 2/5. Nyatakan nilai maksimum P(B), serta nilai P(B) jika P(A ∪ B) = 3/4.","options":["Maksimum P(B) = 3/5; dan jika P(A ∪ B) = 3/4, maka P(B) = 7/20","Maksimum P(B) = 2/5; dan jika P(A ∪ B) = 3/4, maka P(B) = 7/20","Maksimum P(B) = 3/5; dan jika P(A ∪ B) = 3/4, maka P(B) = 13/20","Maksimum P(B) = 1; dan jika P(A ∪ B) = 3/4, maka P(B) = 3/10"],"correctIndex":0,"explanation":"Kerana A dan B saling eksklusif, P(A ∪ B) = P(A) + P(B) <= 1. Jadi P(B) maksimum = 1 - 2/5 = 3/5. Apabila P(A ∪ B) = 3/4, maka P(B) = 3/4 - 2/5 = 15/20 - 8/20 = 7/20."}]},{"id":"mat49-u4","title":"Unit 4: Aplikasi Kebarangkalian Peristiwa Bergabung","subtitle":"Subtopik 9.4 — Strategi Polya 4 Langkah, Jangkaan Kekerapan n = P × N, Pemulangan Bersyarat & Baucar Risiko","iconType":"pendulum","iconUrl":"../assets/icons/mat49-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Polya & Pemulangan Bersyarat","voiceCaption":"Selesaikan masalah aplikasi menggunakan strategi 4 langkah Polya, jangkaan kekerapan P × N, kaedah pelengkap dan cabang pemulangan bersyarat.","voiceScript":"[warm] Selamat datang ke Unit empat, Aplikasi Kebarangkalian Peristiwa Bergabung! Dalam Subtopik sembilan perpuluhan empat, kita menggabungkan keempat-empat langkah Polya: memahami masalah, merancang strategi dengan rajah pokok, melaksanakan pengiraan serta menyemak menggunakan kaedah pelengkap! Di samping itu, kenali rumus jangkaan kekerapan n sama dengan kebarangkalian darab bilangan percubaan, serta masalah pemulangan bersyarat di mana hanya warna tertentu dipulangkan!","title":"Strategi Polya, Jangkaan Kekerapan & Pemulangan Bersyarat","acronym":"n=P×N","hook":"Jika hanya guli biru dipulangkan ke dalam kotak manakala guli merah dan kuning tidak dipulangkan, penyebut cabang kedua tidak seragam!","mediaKey":"mat49_aplikasi_risiko","summary":"Aplikasi kebarangkalian menggunakan model Polya untuk meramal kekerapan eksperimen, mengurus risiko perniagaan, serta menangani syarat pemulangan yang berbeza mengikut warna atau kesudahan pertama.","bullets":["Jangkaan Kekerapan & Semakan Pelengkap: Bilangan kali sesuatu peristiwa dijangka berlaku dalam N percubaan ialah n = P(peristiwa) × N (contohnya jika dadu dilambung dua kali sebanyak 540 kali, P(sekurang-kurangnya satu kuasa dua sempurna) = 1 - (2/3 × 2/3) = 5/9, maka jangkaan = 5/9 × 540 = 300 kali).","Pemulangan Bersyarat (Cabang Hibrid): Baca syarat soalan baris demi baris! Jika kotak mempunyai 6M, 4K dan 2B serta syarat menyebut 'guli biru dipulangkan tetapi bukan biru tidak dipulangkan', maka cabang selepas M atau K berpenyebut 11 (tanpa pemulangan), manakala cabang selepas B kekal berpenyebut 12 (dengan pemulangan)!"],"formula":"Jangkaan Kekerapan: n = P(A) × N   |   Pelengkap Warna Berlainan: 1 - [P(M,M) + P(K,K) + P(B,B)]","labId":"mat49_gambar_rajah_pokok_lab","labTitle":"Simulator Cabang Pemulangan Bersyarat (6M, 4K, 2B)","labProps":{"scenario":"bersyarat"},"examTip":"Untuk soalan 'dua guli berlainan warna' dengan 3 jenis warna (6 kesudahan berbeza), kaedah pelengkap 1 - [P(M,M) + P(K,K) + P(B,B)] hanya perlukan 3 cabang dan mengelak kecuaian menambah 6 pecahan!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Cabutan Bersyarat 12 Guli","voiceCaption":"Ramalkan kebarangkalian mendapat dua guli berlainan warna apabila hanya guli biru dipulangkan ke dalam kotak.","voiceScript":"[curious] Mari uji strategi pelengkap pada kes pemulangan bersyarat! Kotak mengandungi enam guli merah, empat guli kuning dan dua guli biru. Jika guli pertama biru, ia dipulangkan semula; jika bukan biru, ia tidak dipulangkan. Ramalkan kebarangkalian mendapat kedua-dua guli berlainan warna!","hook":"Hitung tiga pasangan warna sama dahulu: P(M,M), P(K,K) dan P(B,B) — ingat penyebut bagi B kekal 12!","scenario":"Kotak mengandungi 6 Merah (M), 4 Kuning (K) dan 2 Biru (B) = 12 guli. Peraturan: jika guli 1 ialah B, ia dipulangkan; jika M atau K, ia tidak dipulangkan.","prompt":"Ramalkan kebarangkalian mendapat kedua-dua guli yang berlainan warna:","options":["259/396 kerana P(warna sama) = (6/12 × 5/11) + (4/12 × 3/11) + (2/12 × 2/12) = 137/396, lalu 1 - 137/396 = 259/396","34/44 kerana ketiga-tiga warna menggunakan penyebut 11 untuk cabutan kedua selepas satu guli dikeluarkan","29/36 kerana semua guli dianggap dipulangkan semula apabila warna biru dan merah dicampur","137/396 kerana jumlah ketiga-tiga cabang warna sama terus menjadi jawapan akhir"],"correctIndex":0,"proofLabId":"mat49_gambar_rajah_pokok_lab","proofState":{"scenario":"bersyarat","selectedBranch":"diff"},"explanation":"Menggunakan kaedah pelengkap: P(M,M) = 6/12 × 5/11 = 5/22, P(K,K) = 4/12 × 3/11 = 1/11, dan P(B,B) = 2/12 × 2/12 = 1/36 (penyebut kekal 12!). Penyebut sepunya 396 memberi (90 + 36 + 11)/396 = 137/396. Maka P(berlainan warna) = 1 - 137/396 = 259/396."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Masalah & Strategi Polya","voiceCaption":"Padankan lima masalah aplikasi kehidupan harian dengan strategi matematik yang paling berkesan.","voiceScript":"[confident] Setiap masalah aplikasi mempunyai kunci penyelesai pantas! Padankan kelima-lima situasi di bawah dengan teknik pengiraan yang tepat.","prompt":"Padankan masalah aplikasi berikut dengan teknik penyelesaian yang sesuai:","pairs":[{"id":"u4m1","left":"Anggarkan bilangan keluarga ada >= 1 anak lelaki daripada 16 000 keluarga (2 anak)","right":"Darabkan P(>=1 lelaki) = 3/4 dengan 16 000 -> 12 000 keluarga"},{"id":"u4m2","left":"Mengira P(sekurang-kurangnya sebuah gajet rosak) dalam ujian 2 unit","right":"Kaedah pelengkap: 1 - P(kedua-dua gajet berfungsi elok)"},{"id":"u4m3","left":"Roda bertuah mengarah pelanggan ke Kotak A atau Kotak B untuk cabut baucar","right":"Jumlahkan laluan pokok: P(A) x P(baucar|A) + P(B) x P(baucar|B)"},{"id":"u4m4","left":"Menganggar bajet hadiah RM5 apabila 36 murid bermain permainan","right":"Kira P(menang) x 36 murid x RM5"},{"id":"u4m5","left":"Memilih destinasi percutian dengan peluang dua petang cerah tertinggi","right":"Bandingkan P(cerah hari 1 & cerah hari 2) antara dua lokasi"}],"explanation":"Mengaitkan konteks masalah terus kepada model kebarangkalian (jangkaan P × N, cabang pokok bersyarat, atau pelengkap) mempercepat penyelesaian soalan Kertas 2."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Susun Kaedah Pelengkap Cepat","voiceCaption":"Susun blok simbol untuk membina kaedah pelengkap bagi peristiwa sekurang-kurangnya satu.","voiceScript":"[warm] Susun blok berikut bagi membentuk formula semakan pantas kaedah pelengkap untuk memperoleh sekurang-kurangnya satu kejadian!","prompt":"Susun blok menjadi formula Kaedah Pelengkap bagi 'sekurang-kurangnya satu berlaku':","hint":"Tolakkan kebarangkalian tiada satu pun berlaku daripada 1.","answerTokens":["P(sekurang-kurangnya 1)","=","1","-","P(tiada satu pun)"],"distractors":["+","P(semua)","× N"],"explanation":"Peristiwa 'sekurang-kurangnya satu' dan 'tiada satu pun' ialah peristiwa pelengkap: jumlah kebarangkaliannya sentiasa 1, maka P(>= 1) = 1 - P(tiada satu pun)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Isih Operasi Kata Kunci SPM","voiceCaption":"Kelaskan enam kata kunci soalan SPM kepada operasi Hukum Pendaraban, Hukum Penambahan atau Pelengkap.","voiceScript":"[confident] Kesilapan terbesar pelajar dalam soalan berayat ialah tersalah pilih operasi tambah atau darab! Isihkan enam petunjuk ayat ini kepada operasi yang tepat.","prompt":"Isihkan petunjuk soalan berikut mengikut operasi matematik utama yang diperlukan:","buckets":[{"id":"darab","label":"Pendaraban P(A) x P(B)"},{"id":"tambah","label":"Penambahan P(A) + P(B) [- P(A ∩ B)]"},{"id":"pelengkap","label":"Pelengkap 1 - P(...)"}],"items":[{"text":"Mendapat nombor ganjil pada dadu pertama DAN nombor genap pada dadu kedua","bucketId":"darab","note":"Kata hubung DAN menandakan kedua-dua peristiwa berlaku bersama."},{"text":"Hujan turun pada hari Isnin DAN Selasa berturut-turut","bucketId":"darab","note":"Kejadian berurutan yang perlu kedua-duanya berlaku."},{"text":"Kad yang dipilih berlabel huruf vokal ATAU huruf 'K'","bucketId":"tambah","note":"Kata hubung ATAU menggunakan rumus penambahan."},{"text":"Nombor yang dipilih ialah gandaan 3 ATAU nombor kuasa dua sempurna","bucketId":"tambah","note":"Gunakan P(A) + P(B) - P(A ∩ B) untuk kesatuan."},{"text":"SEKURANG-KURANGNYA seorang murid berjaya menjawab soalan kuiz","bucketId":"pelengkap","note":"Lebih pantas dihitung sebagai 1 - P(semua gagal)."},{"text":"TIDAK menjadi ahli Kelab Sains mahupun Kelab Matematik","bucketId":"pelengkap","note":"Pelengkap bagi kesatuan: 1 - P(A ∪ B)."}],"explanation":"Mengesan kata kunci 'DAN' (darab), 'ATAU' (tambah tolak persilangan), serta 'SEKURANG-KURANGNYA SATU / TIDAK' (pelengkap 1 - P) memastikan strategi pengiraan tepat sejak langkah pertama."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s6","voiceToneLabel":"Cabaran Roda Bertuah & Baucar","voiceCaption":"Anggarkan bilangan baucar sepuluh ringgit yang perlu disediakan untuk enam ratus pelanggan melalui roda bertuah dan dua kotak baucar.","voiceScript":"[serious] Ini soalan aplikasi perniagaan berformat K B A T S P M! Sebanyak enam ratus pelanggan memutar roda bertuah lima sektor sama. Dua sektor emas menghala ke Kotak A, manakala tiga sektor perak menghala ke Kotak B, dan baucar diganti semula selepas setiap cabutan. Anggarkan bilangan baucar sepuluh ringgit yang perlu disediakan!","prompt":"Sebuah pasar raya menganjurkan promosi untuk 600 pelanggan. Roda bertuah mempunyai 5 sektor sama: 2 sektor emas ke Kotak A (15 baucar RM50, 5 baucar RM10) dan 3 sektor perak ke Kotak B (10 baucar RM50, 15 baucar RM10), dengan baucar sentiasa diganti. Anggarkan bilangan baucar RM10 yang diperlukan.","stimulusHtml":"<strong>Jadual Baucar:</strong> Kotak A = 15 RM50, 5 RM10 (Jumlah 20) &bull; Kotak B = 10 RM50, 15 RM10 (Jumlah 25).","options":["276 baucar RM10","240 baucar RM10","300 baucar RM10","180 baucar RM10"],"correctIndex":0,"explanation":"P(RM10) = P(Emas & RM10 di A) + P(Perak & RM10 di B) = (2/5 × 5/20) + (3/5 × 15/25) = 1/10 + 9/25 = 5/50 + 18/50 = 23/50. Maka bilangan baucar RM10 bagi 600 pelanggan = 23/50 × 600 = 276 keping."}]},{"id":"mat49-u5","title":"Unit 5: Cabaran Boss KBAT SPM — Kebarangkalian Peristiwa Bergabung","subtitle":"Sintesis Menyeluruh 9.1–9.4 — Keputusan Risiko, 3 Peristiwa Berasingan & Perangkap Kertas 1 & 2 SPM","iconType":"trophy","iconUrl":"../assets/icons/mat49-u5.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":15,"voiceIdKey":"u5-s1","voiceToneLabel":"Taklimat Boss Arena S P M","voiceCaption":"Semak empat perangkap maut Kertas 1 dan 2 SPM sebelum menempuh Cabaran Boss Bab 9.","voiceScript":"[excited] Selamat datang ke Peringkat Boss Matematik Tingkatan empat Bab sembilan! Sebelum bertarung dengan lima soalan K B A T S P M, semak semula kesemua enam kad rumus di dalam Dek tiga dimensi supaya kamu kebal daripada empat perangkap klasik pemeriksa: lupa tolak penyebut tanpa pemulangan, lupa tolak persilangan A dan B, tertukar tak bersandar dengan saling eksklusif, dan tersalah kira cabang tiga peristiwa!","title":"Dek Rumus Kilat & 4 Perangkap Maut SPM Bab 9","acronym":"4•KBAT","hook":"Perangkap #1 Kertas 2 SPM: peristiwa tak bersandar BUKAN saling eksklusif — malah P(A ∩ B) = P(A) × P(B) ≠ 0 bagi peristiwa tak bersandar!","mediaKey":"mat49_bos_trofi","summary":"Ringkasan akhir menyatukan keempat-empat subtopik 9.1 hingga 9.4 berserta kesilapan lazim yang perlu dielakkan semasa menjawab Kertas 1 dan Kertas 2 SPM.","bullets":["4 Semakan Pantas Pemeriksa SPM: (1) Tanpa pemulangan wajib menurunkan penyebut (N -> N - 1) dan pengangka jika kesudahan sama dipilih lagi; (2) Sentiasa periksa A ∩ B sebelum memakai rumus penambahan agar kawasan bertindih tidak dikira dua kali.","Strategi Skor Penuh Kertas 2: (3) Bagi masalah 3 peristiwa (cth. A, B, C), senaraikan semua turutan cabang yang memenuhi syarat seperti (L,L,G) + (L,G,L) + (G,L,L) untuk 'tepat dua'; (4) Gunakan kaedah pelengkap 1 - P(semua gagal) sebagai semakan wajib bagi 'sekurang-kurangnya satu'."],"labId":"mat49_rumus_kebarangkalian_flip","labTitle":"Dek Kad 3D Penyelamat Markah SPM Bab 9","examTip":"Dalam soalan keputusan KBAT ('tempat mana patut dipilih' atau 'adakah wajar'), wajib nyatakan nilai kebarangkalian kedua-dua pilihan terlebih dahulu sebelum menulis justifikasi perbandingan!"},{"type":"mcq","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss KBAT 1: Pilihan Cuaca","voiceCaption":"Bandingkan dua taman rekreasi dengan keadaan cuaca tak bersandar dan bersandar bagi dua pagi berturut-turut.","voiceScript":"[serious] Cabaran Boss pertama! Zharif ingin memilih laluan larian bagi dua pagi berturut-turut sedangkan hari sebelum bertolak ialah cerah. Di Taman Saujana kebarangkalian hujan setiap pagi kekal tiga per lima. Di Taman Harmoni, jika semalam tidak hujan peluang hujan ialah empat per tujuh, tetapi jika semalam hujan peluang hujan ialah satu per tiga. Taman manakah lebih tinggi peluang cerah kedua-dua pagi?","prompt":"Zharif ingin berjoging pada dua pagi berturut-turut (hari sebelum bertolak adalah cerah). Kebarangkalian hujan di Taman Saujana ialah 3/5 setiap pagi. Di Taman Harmoni, jika semalam cerah, peluang hujan ialah 4/7; jika semalam hujan, peluang hujan ialah 1/3. Laluan manakah patut dipilih Zharif untuk memaksimumkan peluang cerah kedua-dua pagi?","options":["Taman Harmoni kerana peluang cerah kedua-dua pagi ialah 9/49 (0.184), lebih tinggi daripada Taman Saujana iaitu 4/25 (0.160)","Taman Saujana kerana peluang tidak hujan pada setiap pagi ialah 3/5 × 3/5 = 9/25 (0.360)","Taman Harmoni kerana peluang cerah kedua-dua pagi ialah 3/7 × 2/3 = 2/7 (0.286)","Kedua-duanya sama sesuai kerana kedua-dua lokasi lebih cenderung hujan berbanding cerah"],"correctIndex":0,"explanation":"Di Taman Saujana: P(cerah) = 1 - 3/5 = 2/5, jadi dua pagi cerah = 2/5 × 2/5 = 4/25 = 0.160. Di Taman Harmoni: kerana hari sebelum bertolak cerah, pagi 1 P(cerah) = 1 - 4/7 = 3/7; jika pagi 1 cerah, pagi 2 juga 3/7, jadi dua pagi cerah = 3/7 × 3/7 = 9/49 ≈ 0.184 > 0.160. Maka Taman Harmoni lebih baik!"},{"type":"predict","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss KBAT 2: 3 Murid Kuiz","voiceCaption":"Ramalkan kebarangkalian tepat dua daripada tiga murid lulus kuiz apabila P(A)=3/4, P(B)=2/5 dan P(C)=1/3.","voiceScript":"[curious] Cabaran Boss kedua menguji tiga peristiwa tak bersandar! Kebarangkalian Faris, Mei Ling dan Kavita lulus kuiz masing-masing ialah tiga per empat, dua per lima dan satu per tiga. Ramalkan kebarangkalian tepat dua orang daripada mereka lulus kuiz ini!","hook":"Ingat: 'tepat dua lulus' bermaksud seorang MESTI gagal! Ada tiga kemungkinan turutan yang perlu dijumlahkan.","scenario":"P(Faris lulus) = 3/4, P(Mei Ling lulus) = 2/5, P(Kavita lulus) = 1/3 (peristiwa tak bersandar).","prompt":"Ramalkan kebarangkalian bahawa TEPAT DUA orang murid lulus dalam kuiz tersebut:","options":["23/60 kerana (3/4 × 2/5 × 2/3) + (3/4 × 3/5 × 1/3) + (1/4 × 2/5 × 1/3) = (12 + 9 + 2)/60 = 23/60","1/10 kerana ketiga-tiga kebarangkalian didarabkan bersama: 3/4 × 2/5 × 1/3 = 6/60 = 1/10","9/10 kerana menggunakan 1 ditolak kebarangkalian kesemua murid gagal iaitu 1 - 6/60","13/30 kerana seorang murid gagal diabaikan dalam pendaraban cabang"],"correctIndex":0,"proofLabId":"mat49_bersandar_vs_tak_lab","proofState":{"mode":"three_events","threeFilter":"exact2"},"explanation":"Tiga turutan tepat dua lulus: (L,L,G) = 3/4 × 2/5 × 2/3 = 12/60; (L,G,L) = 3/4 × 3/5 × 1/3 = 9/60; (G,L,L) = 1/4 × 2/5 × 1/3 = 2/60. Jumlah = (12 + 9 + 2)/60 = 23/60."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss KBAT 3: Padan Perangkap","voiceCaption":"Padankan lima perangkap frasa peperiksaan SPM dengan tindakan pengiraan yang tepat.","voiceScript":"[confident] Cabaran Boss ketiga! Padankan kelima-lima frasa licik dalam soalan S P M di bawah dengan langkah pengiraan yang menyelamatkan markah penuh kamu.","prompt":"Padankan frasa soalan peperiksaan dengan tindakan pengiraan yang betul:","pairs":[{"id":"u5m1","left":"'Satu demi satu tanpa pemulangan'","right":"Kurangkan penyebut kepada (N - 1) pada cabang kedua"},{"id":"u5m2","left":"'Peristiwa A atau B' (unsur bertindih)","right":"Hitung P(A) + P(B) - P(A ∩ B) agar tidak kira dua kali"},{"id":"u5m3","left":"'Sekurang-kurangnya satu berjaya'","right":"Guna kaedah pelengkap: 1 - P(semua sekali gagal)"},{"id":"u5m4","left":"'Saling eksklusif (A ∩ B = ∅)'","right":"P(A ∪ B) = P(A) + P(B) dan nilai maksimum P(B) = 1 - P(A)"},{"id":"u5m5","left":"'Hanya seorang daripada A atau B'","right":"Jumlahkan [P(A) x P(B')] + [P(A') x P(B)]"}],"explanation":"Setiap kata kunci KSSM mempunyai padanan formula tepat — elak terburu-buru sebelum membezakan 'tanpa pemulangan', 'atau' dan 'hanya seorang'."},{"type":"sort","xp":25,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss KBAT 4: Diagnosis Campuran","voiceCaption":"Isihkan enam kenyataan peperiksaan kepada kategori Bersandar atau Bertindih berbanding Tak Bersandar atau Saling Eksklusif.","voiceScript":"[confident] Cabaran Boss keempat! Diagnosis enam pernyataan campuran berikut sama ada ia memerlukan pelarasan cabang atau tolakan persilangan, ataupun boleh didarab dan ditambah terus!","prompt":"Isihkan pernyataan berikut mengikut keperluan pelarasan pengiraan:","buckets":[{"id":"pelarasan","label":"Bersandar / Bertindih (Perlu Ubah Penyebut atau Tolak P(A ∩ B))"},{"id":"terus","label":"Tak Bersandar / Saling Eksklusif (Darab atau Tambah Terus)"}],"items":[{"text":"Memilih 2 orang pengawas daripada 3 pengawas T4 dan 2 pengawas T5 tanpa pemulangan","bucketId":"pelarasan","note":"Bersandar: penyebut turun daripada 5 kepada 4."},{"text":"Mencari P(nombor genap atau nombor perdana) daripada set integer 1 hingga 10","bucketId":"pelarasan","note":"Bertindih pada nombor {2}, wajib tolak P(A ∩ B) = 1/10."},{"text":"Guli biru dipulangkan ke dalam kotak, manakala guli merah tidak dipulangkan","bucketId":"pelarasan","note":"Pemulangan bersyarat: cabang merah mengubah penyebut kepada N - 1."},{"text":"Kebarangkalian pelumba kekal selamat melepasi 3 pusingan berturutan jika setiap pusingan 0.6","bucketId":"terus","note":"Tak bersandar dengan syarat lulus setiap pusingan: 0.6 × 0.6 × 0.6."},{"text":"Memilih kad berhuruf vokal atau huruf 'K' daripada kad {S, U, K, A, N}","bucketId":"terus","note":"Saling eksklusif kerana huruf K bukan huruf vokal: 2/5 + 1/5 = 3/5."},{"text":"Lulus Fizik (0.58) dan lulus Kimia (0.42) oleh murid yang sama secara tak bersandar","bucketId":"terus","note":"Tak bersandar: P(lulus kedua-duanya) = 0.58 × 0.42 terus."}],"explanation":"Mengesan sama ada terdapat perubahan bilangan sampel atau pertindihan set membantu memilih jalan pengiraan yang bebas ralat."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Finale: 3 Tawaran Kerja","voiceCaption":"Selesaikan soalan finale tentang kebarangkalian Damia mendapat tawaran daripada sekurang-kurangnya satu daripada tiga syarikat.","voiceScript":"[excited] Cabaran Boss Finale! Damia menghantar permohonan kerja ke tiga buah syarikat iaitu P, Q dan R dengan kebarangkalian ditawarkan kerja masing-masing satu per dua, dua per tiga dan tiga per lima. Hitung kebarangkalian Damia memperoleh tawaran daripada sekurang-kurangnya satu syarikat!","prompt":"Damia menghantar permohonan kerja ke tiga buah syarikat. Kebarangkalian dia ditawarkan kerja oleh Syarikat P, Q dan R masing-masing ialah 1/2, 2/3 dan 3/5 (tak bersandar). Hitung kebarangkalian Damia menerima tawaran daripada sekurang-kurangnya sebuah syarikat.","stimulusHtml":"<strong>Petunjuk Pantas Boss:</strong> Guna kaedah pelengkap: <em>P(sekurang-kurangnya satu tawaran) = 1 - P(ditolak oleh ketiga-tiga syarikat)</em>.","options":["14/15","1/5","4/15","11/15"],"correctIndex":0,"explanation":"P(ditolak ketiga-tiga syarikat) = (1 - 1/2) × (1 - 2/3) × (1 - 3/5) = 1/2 × 1/3 × 2/5 = 1/15. Maka P(sekurang-kurangnya satu tawaran) = 1 - 1/15 = 14/15!"}]}]};</script>

          n2: replacement ? b1 : (b1 - 1),
          d2: tot2
        },
        {
          id: "BM",
          l1: "B",
          l2: "M",
          c1: "#2563eb",
          c2: "#dc2626",
          n1: b1,
          d1: tot1,
          n2: m1,
          d2: tot2
        },
        {
          id: "MB",
          l1: "M",
          l2: "B",
          c1: "#dc2626",

        }
      ];
      return { b1: b1, m1: m1, tot1: tot1, tot2: tot2, branches: branches };

    function computeCondData() {
      // 6 Merah (M), 4 Kuning (K), 2 Biru (B) = 12 guli
      // Peraturan bersyarat: jika guli pertama Biru (B), ia DIPULANGKAN (penyebut kekal 12).
      // Jika guli pertama bukan Biru (M atau K), ia TIDAK dipulangkan (penyebut turun ke 11).
      var branches = [
        { id: "MM", l1: "M", l2: "M", c1: "#dc2626", c2: "#dc2626", n1: 6, d1: 12, n2: 5, d2: 11, same: true },
        { id: "MK", l1: "M", l2: "K", c1: "#dc2626", c2: "#d97706", n1: 6, d1: 12, n2: 4, d2: 11, same: false },
        { id: "MB", l1: "M", l2: "B", c1: "#dc2626", c2: "#2563eb", n1: 6, d1: 12, n2: 2, d2: 11, same: false },
        { id: "KM", l1: "K", l2: "M", c1: "#d97706", c2: "#dc2626", n1: 4, d1: 12, n2: 6, d2: 11, same: false },
        { id: "KK", l1: "K", l2: "K", c1: "#d97706", c2: "#d97706", n1: 4, d1: 12, n2: 3, d2: 11, same: true },
        { id: "KB", l1: "K", l2: "B", c1: "#d97706", c2: "#2563eb", n1: 4, d1: 12, n2: 2, d2: 11, same: false },
        { id: "BM", l1: "B", l2: "M", c1: "#2563eb", c2: "#dc2626", n1: 2, d1: 12, n2: 6, d2: 12, same: false },
        { id: "BK", l1: "B", l2: "K", c1: "#2563eb", c2: "#d97706", n1: 2, d1: 12, n2: 4, d2: 12, same: false },
        { id: "BB", l1: "B", l2: "B", c1: "#2563eb", c2: "#2563eb", n1: 2, d1: 12, n2: 2, d2: 12, same: true }
      ];
      return { branches: branches };
    }

    function runSingleDraw() {
      if (scenario === "guli_bag") {
        var pool1 = ["B", "B", "B", "B", "M", "M"];
        var idx1 = Math.floor(Math.random() * pool1.length);
        var g1 = pool1[idx1];
        var pool2 = pool1.slice();
        if (!replacement) pool2.splice(idx1, 1);
        var g2 = pool2[Math.floor(Math.random() * pool2.length)];
        var pair = g1 + g2;
        simRuns++;
        var isTarget = selectedBranch === "same" ? (g1 === g2) : (pair === selectedBranch);
        if (isTarget) simHits++;
        lastDrawLabel = "(" + g1 + ", " + g2 + ")";
      } else if (scenario === "syiling_dadu") {
        var c = Math.random() < 0.5 ? "A" : "G";
        var d = 1 + Math.floor(Math.random() * 6);
        simRuns++;
        var hit = true;
        if (coinSide === "even_a") hit = (d % 2 === 0) && c === "A";
        else if (coinSide === "prime_g") hit = (d === 2 || d === 3 || d === 5) && c === "G";
        if (hit) simHits++;
        lastDrawLabel = "(" + c + ", " + d + ")";
      } else {
        // bersyarat: 6M, 4K, 2B
        var cPool = ["M", "M", "M", "M", "M", "M", "K", "K", "K", "K", "B", "B"];
        var i1 = Math.floor(Math.random() * cPool.length);
        var first = cPool[i1];
        var nextPool = cPool.slice();
        if (first !== "B") nextPool.splice(i1, 1);
        var second = nextPool[Math.floor(Math.random() * nextPool.length)];
        simRuns++;
        var diffHit = first !== second;
        if ((selectedBranch === "diff" && diffHit) || (selectedBranch === "same" && !diffHit)) {
          simHits++;
        }
        lastDrawLabel = "(" + first + ", " + second + ")";
      }
    }

            '<div class="lab-meter"><span class="lab-meter-label">Cabutan Terakhir</span><strong class="lab-meter-val tabular-nums">' + esc(lastDrawLabel) + "</strong></div>" +

          '<div class="lab-callout"><strong>Kaedah Pelengkap Polya:</strong> Daripada menjumlahkan 6 cabang berlainan warna, hitung 3 cabang warna sama dahulu: P(M,M) = 6/12 x 5/11, P(K,K) = 4/12 x 3/11, dan P(B,B) = 2/12 x 2/12 (penyebut kekal 12 bagi B!), kemudian tolak daripada 1.</div>';
      }

      var simBtns =
        '<div class="lab-controls">' +
          '<button type="button" class="mat49-action-btn is-emerald" data-m49-draw="1">Cabut 1 Percubaan</button>' +
          '<button type="button" class="lab-pause-btn" data-m49-auto="1" aria-pressed="' + autoRunning + '">' + (autoRunning ? "Jeda Simulasi" : "Main Simulasi Berterusan") + "</button>" +
          '<button type="button" class="lab-seg-btn" data-m49-reset="1">Set Semula (' + simRuns + " ujian)</button>" +
        "</div>";

      shell.innerHTML =
        '<div class="lab-controls">' + modeBtns + "</div>" +
        subControls +
        '<div class="lab-stage">' + buildTreeSvg() + "</div>" +
        simBtns +
        infoReadout;

      shell.querySelectorAll("[data-m49-sc]").forEach(function (b) {
        b.addEventListener("click", function () {
          stopAnim();
          scenario = b.getAttribute("data-m49-sc");
          simRuns = 0; simHits = 0; lastDrawLabel = "Belum dicabut";
          if (scenario === "bersyarat") selectedBranch = "diff";
          else if (scenario === "guli_bag") selectedBranch = "BM";
          playSfx("paper");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-rep]").forEach(function (b) {
        b.addEventListener("click", function () {
          replacement = b.getAttribute("data-m49-rep") === "true";
          simRuns = 0; simHits = 0;
          playSfx("snap");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-br]").forEach(function (b) {
        b.addEventListener("click", function () {
          selectedBranch = b.getAttribute("data-m49-br");
          simHits = 0; simRuns = 0;
          playSfx("tick");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-sd]").forEach(function (b) {
        b.addEventListener("click", function () {
          coinSide = b.getAttribute("data-m49-sd");
          simHits = 0; simRuns = 0;
          playSfx("tick");
          ctx.markInteracted();
          render();
        });
      });
      var drawBtn = shell.querySelector("[data-m49-draw]");
      if (drawBtn) {
        drawBtn.addEventListener("click", function () {
          runSingleDraw();
          playSfx("snap");
          ctx.markInteracted();
          render();
        });
      }
      var resetBtn = shell.querySelector("[data-m49-reset]");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          stopAnim();
          simRuns = 0; simHits = 0; lastDrawLabel = "Belum dicabut";
          playSfx("paper");
          render();
        });
      }
      var autoBtn = shell.querySelector("[data-m49-auto]");
      if (autoBtn) {
        autoBtn.addEventListener("click", function () {
          if (autoRunning) {
            stopAnim();
            playSfx("tick");
            render();
            return;
          }
          if (reducedMotion()) {
            for (var k = 0; k < 25; k++) runSingleDraw();
            playSfx("match");
            ctx.markInteracted();
            render();
            return;
          }
          autoRunning = true;
          lastFrameTs = 0;
          ctx.markInteracted();
          render();
          function stepLoop(ts) {
            if (!autoRunning) return;
            if (!lastFrameTs || ts - lastFrameTs >= 180) {
              lastFrameTs = ts;
              runSingleDraw();
              if (simRuns >= 100) {
                autoRunning = false;
                playSfx("match");
                render();
                return;
              }
              render();
            }
            rafId = requestAnimationFrame(stepLoop);
          }
          rafId = requestAnimationFrame(stepLoop);
        });
      }
    }

    render();
    return function cleanup() {
      stopAnim();
    };
  };

  /* =========================================================================
     MAKMAL 2: mat49_bersandar_vs_tak_lab
     Perbandingan Bersandar vs Tak Bersandar, Pengesahan P(A ∩ B) & 3 Peristiwa
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat49_bersandar_vs_tak_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var mode = ps.mode || "compare";
    if (mode !== "compare" && mode !== "multiply_verify" && mode !== "three_events") {
      mode = "compare";
    }
    var cardFirstType = ps.cardFirstType || "konsonan"; // "konsonan" | "vokal"
    var withReturn = Boolean(ps.withReturn);
    var threeFilter = ps.threeFilter || "exact2"; // "exact2" | "atleast1" | "all3"

    function renderCompare() {
      // Kad "K, U, A, S, A" (5 kad: K, S konsonan = 2; U, A, A vokal = 3)
      var c1 = cardFirstType === "konsonan" ? 2 : 3;
      var c2 = withReturn ? 2 : (cardFirstType === "konsonan" ? 1 : 2);
      var d2 = withReturn ? 5 : 4;
      var p1 = fracStr(c1, 5);
      var p2 = fracStr(c2, d2);
      var pJoint = fracStr(c1 * c2, 5 * d2);

      var svg = [
        '<svg viewBox="0 0 560 206" aria-label="Perbandingan Pemilihan Kad K U A S A">',
        '  <rect x="6" y="6" width="548" height="194" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>',
        '  <text x="280" y="26" text-anchor="middle" font-family="Lexend,sans-serif" font-size="10.8" font-weight="800" fill="#a7f3d0">KOTAK KAD {K, U, A, S, A}: SASARAN KEDUA = KAD KONSONAN (K atau S)</text>',
        '  <rect x="24" y="42" width="244" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>',
        '  <text x="146" y="62" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="800" fill="#bae6fd">Kali Pertama: ' + (cardFirstType === "konsonan" ? "Ambil Konsonan" : "Ambil Vokal") + "</text>",
        '  <rect x="52" y="76" width="32" height="44" rx="6" fill="' + (cardFirstType === "konsonan" ? "#059669" : "#2563eb") + '" stroke="#ffffff"/><text x="68" y="103" text-anchor="middle" font-family="Lexend,sans-serif" font-size="13" font-weight="800" fill="#ffffff">K</text>',
        '  <rect x="92" y="76" width="32" height="44" rx="6" fill="#2563eb" stroke="#ffffff"/><text x="108" y="103" text-anchor="middle" font-family="Lexend,sans-serif" font-size="13" font-weight="800" fill="#ffffff">S</text>',
        '  <rect x="132" y="76" width="32" height="44" rx="6" fill="' + (cardFirstType === "vokal" ? "#d97706" : "#475569") + '" stroke="#ffffff"/><text x="148" y="103" text-anchor="middle" font-family="Lexend,sans-serif" font-size="13" font-weight="800" fill="#ffffff">U</text>',
        '  <rect x="172" y="76" width="32" height="44" rx="6" fill="#475569" stroke="#ffffff"/><text x="188" y="103" text-anchor="middle" font-family="Lexend,sans-serif" font-size="13" font-weight="800" fill="#ffffff">A</text>',
        '  <rect x="212" y="76" width="32" height="44" rx="6" fill="#475569" stroke="#ffffff"/><text x="228" y="103" text-anchor="middle" font-family="Lexend,sans-serif" font-size="13" font-weight="800" fill="#ffffff">A</text>',
        '  <text x="146" y="156" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="800" fill="#fef08a">P(Kali 1) = ' + p1 + "</text>",
        '  <rect x="292" y="42" width="244" height="142" rx="12" fill="#1e293b" stroke="' + (withReturn ? "#10b981" : "#f59e0b") + '"/>',
        '  <text x="414" y="62" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="800" fill="' + (withReturn ? "#6ee7b7" : "#fde68a") + '">Kali Kedua (' + (withReturn ? "Dengan Pemulangan" : "Tanpa Pemulangan") + ")</text>",
        '  <text x="414" y="96" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">Baki kad dalam kotak = ' + d2 + " keping</text>",
        '  <text x="414" y="122" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">Baki kad konsonan = ' + c2 + " keping</text>",
        '  <text x="414" y="156" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" font-weight="800" fill="' + (withReturn ? "#34d399" : "#fbbf24") + '">P(Konsonan ke-2) = ' + p2 + "</text>",
        "</svg>"
      ].join("");

      return (
        '<div class="lab-controls">' +
          '<button type="button" class="lab-seg-btn" data-m49-ret="false" aria-pressed="' + (!withReturn) + '">Tanpa Pemulangan (Bersandar)</button>' +
          '<button type="button" class="lab-seg-btn" data-m49-ret="true" aria-pressed="' + withReturn + '">Dengan Pemulangan (Tak Bersandar)</button>' +
          '<button type="button" class="lab-seg-btn" data-m49-c1="konsonan" aria-pressed="' + (cardFirstType === "konsonan") + '">Kad 1: Konsonan</button>' +
          '<button type="button" class="lab-seg-btn" data-m49-c1="vokal" aria-pressed="' + (cardFirstType === "vokal") + '">Kad 1: Vokal</button>' +
        "</div>" +
        '<div class="lab-stage">' + svg + "</div>" +
        '<div class="lab-readout-grid">' +
          '<div class="lab-meter"><span class="lab-meter-label">Klasifikasi</span><strong class="lab-meter-val">' + (withReturn ? "Tak Bersandar" : "Bersandar") + "</strong></div>" +
          '<div class="lab-meter"><span class="lab-meter-label">P(Kali 1)</span><strong class="lab-meter-val tabular-nums">' + p1 + "</strong></div>" +
          '<div class="lab-meter"><span class="lab-meter-label">P(Konsonan Kali 2)</span><strong class="lab-meter-val tabular-nums">' + p2 + "</strong></div>" +
          '<div class="lab-meter"><span class="lab-meter-label">P(Gabungan)</span><strong class="lab-meter-val tabular-nums">' + pJoint + "</strong></div>" +
        "</div>" +
        '<div class="lab-callout"><strong>Konsep Teras 9.2:</strong> ' +
          (withReturn
            ? "Oleh sebab kad pertama DIPULANGKAN, P(Konsonan kali ke-2) kekal 2/5 tidak kira sama ada kad pertama konsonan atau vokal — inilah Peristiwa Tak Bersandar."
            : "Oleh sebab kad pertama TIDAK dipulangkan, komposisi kotak berubah kepada 4 kad; jika kad pertama konsonan, P(Konsonan ke-2) jatuh kepada 1/4, tetapi jika vokal, P(Konsonan ke-2) naik kepada 2/4!") +
        "</div>"
      );
    }

    function renderMultiplyVerify() {
      var letters = ["S", "U", "K", "A", "N"]; // Vokal: U, A (2/5)
      var nums = [2, 3, 5, 8]; // Perdana: 2, 3, 5 (3/4)
      var cells = [];
      var hitCount = 0;
      letters.forEach(function (ch) {
        nums.forEach(function (nm) {
          var isVokal = ch === "U" || ch === "A";
          var isPrime = nm === 2 || nm === 3 || nm === 5;
          var isHit = isVokal && isPrime;
          if (isHit) hitCount++;
          cells.push('<div class="mat49-pair-cell' + (isHit ? " is-hit" : "") + '">(' + ch + ", " + nm + ")</div>");
        });
      });

      return (
        '<div class="mat49-panel">' +
          '<h4>Jadual Penentusahan Hukum Pendaraban: Kotak X {S, U, K, A, N} &amp; Kotak Y {2, 3, 5, 8}</h4>' +
          '<div>Menyenaraikan semua <strong>20 pasangan bertertib</strong> yang mungkin. Petak hijau ialah peristiwa bergabung <em>Huruf Vokal (U, A) dan Nombor Perdana (2, 3, 5)</em>:</div>' +
          '<div class="mat49-pair-grid" style="margin-top:8px;">' + cells.join("") + "</div>" +
        "</div>" +
        '<div class="lab-readout-grid">' +
          '<div class="lab-meter"><span class="lab-meter-label">P(Vokal dari X)</span><strong class="lab-meter-val tabular-nums">2/5</strong></div>' +
          '<div class="lab-meter"><span class="lab-meter-label">P(Perdana dari Y)</span><strong class="lab-meter-val tabular-nums">3/4</strong></div>' +
          '<div class="lab-meter"><span class="lab-meter-label">Hukum Pendaraban</span><strong class="lab-meter-val tabular-nums">2/5 x 3/4 = 3/10</strong></div>' +
          '<div class="lab-meter"><span class="lab-meter-label">Kiraan Ruang Sampel</span><strong class="lab-meter-val tabular-nums">' + hitCount + "/20 = 3/10</strong></div>" +
        "</div>" +
        '<div class="lab-callout"><strong>Terbukti Sama!</strong> Kaedah pendaraban (2/5 x 3/4 = 3/10) memberi jawapan tepat sama dengan mengira 6 petak hijau daripada 20 kesudahan dalam jadual.</div>'
      );
    }

    function renderThreeEvents() {
      // 3 murid: A=3/4, B=2/5, C=1/3 -> lulus vs gagal (1/4, 3/5, 2/3), common den = 60
      var combos = [
        { k: "L, L, L", lbl: "Semua 3 Lulus", num: 3 * 2 * 1, tag: "all3" },
        { k: "L, L, G", lbl: "A & B Lulus, C Gagal", num: 3 * 2 * 2, tag: "exact2" },
        { k: "L, G, L", lbl: "A & C Lulus, B Gagal", num: 3 * 3 * 1, tag: "exact2" },
        { k: "G, L, L", lbl: "B & C Lulus, A Gagal", num: 1 * 2 * 1, tag: "exact2" },
        { k: "L, G, G", lbl: "Hanya A Lulus", num: 3 * 3 * 2, tag: "exact1" },
        { k: "G, L, G", lbl: "Hanya B Lulus", num: 1 * 2 * 2, tag: "exact1" },
        { k: "G, G, L", lbl: "Hanya C Lulus", num: 1 * 3 * 1, tag: "exact1" },
        { k: "G, G, G", lbl: "Semua 3 Gagal", num: 1 * 3 * 2, tag: "none" }
      ];
      var sumNum = 0;
      var gridCards = combos.map(function (cb) {
        var hit = threeFilter === "all3"
          ? cb.tag === "all3"
          : (threeFilter === "exact2" ? cb.tag === "exact2" : cb.tag !== "none");
        if (hit) sumNum += cb.num;
        return (
          '<div class="mat49-pair-cell' + (hit ? " is-hit" : "") + '" style="padding:7px;">' +
            "<div><strong>(" + cb.k + ")</strong></div>" +
            '<div style="font-size:0.68rem;">' + cb.num + "/60 = " + fracStr(cb.num, 60) + "</div>" +
          "</div>"
        );
      }).join("");

      return (
        '<div class="lab-controls">' +
          '<button type="button" class="lab-seg-btn" data-m49-tf="exact2" aria-pressed="' + (threeFilter === "exact2") + '">Tepat 2 Lulus</button>' +
          '<button type="button" class="lab-seg-btn" data-m49-tf="atleast1" aria-pressed="' + (threeFilter === "atleast1") + '">Sekurang-kurangnya 1 Lulus</button>' +
          '<button type="button" class="lab-seg-btn" data-m49-tf="all3" aria-pressed="' + (threeFilter === "all3") + '">Semua 3 Lulus</button>' +
        "</div>" +
        '<div class="mat49-panel">' +
          '<h4>3 Peristiwa Tak Bersandar: P(A)=3/4, P(B)=2/5, P(C)=1/3 (Penyebut Sepunya = 60)</h4>' +
          '<div class="mat49-pair-grid" style="grid-template-columns:repeat(auto-fit,minmax(108px,1fr));margin-top:8px;">' + gridCards + "</div>" +
        "</div>" +
        '<div class="lab-readout-grid">' +
          '<div class="lab-meter"><span class="lab-meter-label">Jumlah Kebarangkalian</span><strong class="lab-meter-val tabular-nums">' + sumNum + "/60 = " + fracStr(sumNum, 60) + "</strong></div>" +
          '<div class="lab-meter"><span class="lab-meter-label">Semak Pelengkap (1 - G,G,G)</span><strong class="lab-meter-val tabular-nums">1 - 6/60 = 9/10</strong></div>' +
        "</div>" +
        '<div class="lab-callout"><strong>Tip KBAT 3 Peristiwa:</strong> Bagi syarat <em>tepat dua orang lulus</em>, jumlahkan 3 cabang: (L,L,G) 12/60 + (L,G,L) 9/60 + (G,L,L) 2/60 = <strong>23/60</strong>.</div>'
      );
    }

    function render() {
      var tabs = [
        { id: "compare", lbl: "Pemulangan vs Tanpa" },
        { id: "multiply_verify", lbl: "Bukti Jadual P(A) x P(B)" },
        { id: "three_events", lbl: "3 Peristiwa (KBAT)" }
      ].map(function (t) {
        return '<button type="button" class="lab-seg-btn" data-m49-tab="' + t.id + '" aria-pressed="' + (mode === t.id) + '">' + t.lbl + "</button>";
      }).join("");

      var body = mode === "compare" ? renderCompare() : (mode === "multiply_verify" ? renderMultiplyVerify() : renderThreeEvents());
      shell.innerHTML = '<div class="lab-controls">' + tabs + "</div>" + body;

      shell.querySelectorAll("[data-m49-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          mode = b.getAttribute("data-m49-tab");
          playSfx("paper");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-ret]").forEach(function (b) {
        b.addEventListener("click", function () {
          withReturn = b.getAttribute("data-m49-ret") === "true";
          playSfx("snap");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-c1]").forEach(function (b) {
        b.addEventListener("click", function () {
          cardFirstType = b.getAttribute("data-m49-c1");
          playSfx("tick");
          ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-m49-tf]").forEach(function (b) {
        b.addEventListener("click", function () {
          threeFilter = b.getAttribute("data-m49-tf");
          playSfx("tick");
          ctx.markInteracted();
          render();
        });
      });
    }

    render();
  };

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");

  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
