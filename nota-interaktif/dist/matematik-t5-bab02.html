  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t5-bab02","subject":"Matematik","subjectGroup":"teras","form":5,"chapterNumber":2,"title":"Matriks","subtitle":"Subtopik 2.1–2.2 KSSM (35 Langkah Bit-by-Bit) — Mewakilkan Maklumat, Peringkat m × n & Unsur aᵢⱼ, Matriks Sama, Tambah & Tolak, Pendaraban Skalar, Hukum Aritmetik, Pendaraban Matriks (m × n)(n × p), Matriks Identiti I, Matriks Songsang A⁻¹ & Persamaan Linear Serentak.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t5-bab02-labs.js","coverIcon":"../assets/icons/mat52-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan tatatanda dan pengiraan matriks kamu amat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Ketelitian baris dan lajur kamu terus membara!","encourage":"[encouraging] Hampir tepat! Cuba semak semula urutan baris dahulu baru lajur, serta tanda negatif pada setiap unsur ya.","celebrate":"[excited] Tahniah! Kamu telah berjaya menakluki unit Matematik Tingkatan lima Bab dua ini dengan cemerlang!"},"units":[{"id":"mat52-u1","title":"Unit 1: Pengenalan Matriks, Peringkat m × n & Matriks Sama","subtitle":"Subtopik 2.1 — Sylvester & Cullis, Bentuk Matriks, Peringkat m × n, Unsur aᵢⱼ & Syarat Matriks Sama","iconType":"formula","iconUrl":"../assets/icons/mat52-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Asas Matriks & Tokoh Perintis","voiceCaption":"Matriks menyusun nombor dalam baris dan lajur di dalam tanda kurung; istilah matriks diperkenalkan oleh James Joseph Sylvester pada tahun 1850.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan lima, Bab dua, Matriks! Pernahkah kamu lihat data jualan dalam hamparan elektronik, pungutan pingat sukan, atau bacaan indeks pencemaran udara? Semua jadual itu boleh disusun ringkas ke dalam bentuk matriks iaitu tatasusun nombor mengikut baris dan lajur di dalam tanda kurung! Tahukah kamu istilah matriks pertama kali digunakan oleh James Joseph Sylvester pada tahun seribu lapan ratus lima puluh, manakala kurungan dan tatatanda a i j diperkenalkan oleh Cuthbert Edmund Cullis pada tahun seribu sembilan ratus tiga belas?","title":"Mewakilkan Maklumat dalam Bentuk Matriks & Jenis Bentuknya","acronym":"B×L","hook":"Tonton simulasi 3D bagaimana data baris dan lajur bertukar menjadi tatasusun matriks yang menggerakkan jadual perniagaan dan grafik komputer!","mediaKey":"mat52_sylvester","videoClip":{"src":"../assets/matematik-t5-bab02/video/mat52_video_matriks_transformasi.mp4","posterKey":"mat52_video_poster","caption":"Simulasi 3D: Transformasi tatasusun nombor dalam grid baris dan lajur serta aplikasi pemetaan matriks"},"summary":"Matriks ialah nombor-nombor yang disusun dalam baris mengufuk dan lajur mencancang untuk membentuk tatasusun segi empat tepat atau segi empat sama, diwakili huruf besar dalam tanda kurung [ ] atau ( ).","bullets":["Khazanah Silam & Situasi Sebenar: James Joseph Sylvester (1814–1897) mencipta istilah matriks pada 1850, manakala Cuthbert Edmund Cullis (1875–1954) memperkenalkan tanda kurung dan tatatanda unsur A = [aᵢⱼ] pada 1913. Data jadual seperti rekod jualan kedai berbanding dalam talian, keperluan kalori harian, pungutan pingat sukan, bacaan IPU serta rekod bacaan Nilam dipadatkan terus menjadi matriks tanpa menulis tajuk berulang.","4 Jenis Bentuk Matriks: (1) Matriks baris (1 × n) hanya mempunyai 1 baris, (2) Matriks lajur (m × 1) hanya mempunyai 1 lajur, (3) Matriks segi empat sama (n × n) mempunyai bilangan baris sama dengan bilangan lajur, dan (4) Matriks segi empat tepat (m × n, m ≠ n) mempunyai bilangan baris berbeza daripada lajur."],"examTip":"Sentiasa tulis huruf besar (seperti A, P atau M) untuk menamakan matriks dan kurung kesemua unsur di dalam kurungan siku [ ] atau lengkung ( ) tanpa garis pemisah."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 4 Jenis Bentuk Matriks","voiceCaption":"Kelaskan enam matriks berikut kepada Matriks Baris atau Lajur, Matriks Segi Empat Sama, atau Matriks Segi Empat Tepat (m, n > 1).","voiceScript":"[confident] Jom uji kefahaman awal kamu tentang rupa bentuk matriks! Asingkan keenam-enam matriks berikut mengikut pengelasan bentuknya yang tepat.","prompt":"Isihkan setiap matriks ke dalam kategori bentuk yang paling tepat:","buckets":[{"id":"baris_lajur","label":"Matriks Baris (1 × n) / Lajur (m × 1)"},{"id":"sama","label":"Matriks Segi Empat Sama (n × n)"},{"id":"tepat","label":"Segi Empat Tepat (m × n, m,n > 1)"}],"items":[{"text":"[1700  2100  2000  1800] (1 baris, 4 lajur)","bucketId":"baris_lajur","note":"Hanya satu baris (1 × 4): dikenali sebagai matriks baris."},{"text":"[[857], [3180], [211]] (3 baris, 1 lajur)","bucketId":"baris_lajur","note":"Hanya satu lajur (3 × 1): dikenali sebagai matriks lajur."},{"text":"[[13, 5, 1], [10, 2, 4], [8, 8, 9]] (3 baris, 3 lajur)","bucketId":"sama","note":"Bilangan baris = bilangan lajur (3 × 3): matriks segi empat sama."},{"text":"[[4, -2], [7, 0]] (2 baris, 2 lajur)","bucketId":"sama","note":"Bilangan baris = bilangan lajur (2 × 2): matriks segi empat sama."},{"text":"[[20, 18, 15], [12, 10, 11]] (2 baris, 3 lajur)","bucketId":"tepat","note":"2 baris berbeza dengan 3 lajur (2 × 3): matriks segi empat tepat."},{"text":"[[-2, 5], [0, 4], [1, 9]] (3 baris, 2 lajur)","bucketId":"tepat","note":"3 baris berbeza dengan 2 lajur (3 × 2): matriks segi empat tepat."}],"explanation":"Matriks baris (1 × n) dan matriks lajur (m × 1) ialah kes khas satu dimensi, matriks segi empat sama mempunyai m = n, manakala matriks segi empat tepat mempunyai bilangan baris dan lajur berlainan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Peringkat m × n & Matriks Sama","voiceCaption":"Peringkat matriks ditulis sebagai baris darab lajur (m × n), unsur pada baris i dan lajur j ditulis sebagai aᵢⱼ, dan dua matriks adalah sama jika peringkat dan semua unsur sepadannya sama.","voiceScript":"[warm] Apakah peraturan nombor satu dalam bab Matriks? Sentiasa baca dan tulis baris dahulu, barulah lajur! Matriks dengan m baris dan n lajur mempunyai peringkat m darab n, dibaca sebagai matriks m dengan n. Unsur pada baris kedua dan lajur ketiga ditulis sebagai a dua tiga, bukan a dua puluh tiga ya! Dua matriks pula hanya dikatakan sama apabila kedua-duanya mempunyai peringkat yang sama dan setiap unsur sepadannya bernilai sama. Mari ketik sel matriks di dalam makmal!","title":"Peringkat Matriks m × n, Unsur aᵢⱼ & Syarat Matriks Sama","acronym":"a_ij • M=N","hook":"Perangkap paling kerap di S P M: tertukar antara baris dan lajur! Ingat aturan B-L: Baris melintang dahulu, Lajur menegak kemudian!","mediaKey":"mat52_jadual_peringkat","summary":"Peringkat matriks ditentukan melalui bilangan baris (m) diikuti bilangan lajur (n), setiap nombor dalamnya ialah unsur aᵢⱼ, dan dua matriks sama apabila berkongsi peringkat serta nilai unsur sepadan yang sama.","bullets":["Peringkat m × n & Tatatanda Unsur aᵢⱼ: Matriks dengan m baris dan n lajur berperingkat m × n (dibaca 'matriks m dengan n'). Unsur pada baris ke-i dan lajur ke-j diwakili huruf kecil dengan subskrip i dan j, misalnya d₂₁ ialah unsur pada baris ke-2, lajur ke-1 dan dibaca 'd dua satu'. Soalan sering menguji ungkapan seperti b₁₂ + b₂₁.","Syarat Mutlak Matriks Sama (M = N): M = N jika dan hanya jika (1) kedua-dua matriks mempunyai peringkat m × n yang sama, DAN (2) setiap unsur sepadan bernilai sama (termasuk pecahan dan perpuluhan setara seperti 0.5 = 1/2 dan 0.8 = 4/5). Jika peringkat berbeza seperti [3 9] berbanding [[3], [9]] atau unsur tertukar kedudukan, maka M ≠ N."],"labId":"mat52_peringkat_sama_lab","labTitle":"Makmal Interaktif Peringkat m × n, Unsur aᵢⱼ & Penguji Matriks Sama","labProps":{"tab":"peringkat","preset":"kedai"},"examTip":"Untuk menguji matriks sama, sentiasa semak peringkat terlebih dahulu (contohnya 1 × 2 tidak mungkin sama dengan 2 × 1) sebelum membandingkan nilai setiap unsur sepadan termasuk bentuk pecahan vs perpuluhan."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Pemboleh Ubah Matriks Sama","voiceCaption":"Tentukan nilai x, y dan z dengan membandingkan unsur-unsur sepadan bagi dua matriks sama P dan Q.","voiceScript":"[curious] Mari uji kemahiran kamu membandingkan unsur sepadan! Diberi matriks P sama dengan matriks Q, dengan dua x dan sembilan tolak dua z di dalam P sepadan dengan dua belas, y tambah tiga dan z di dalam Q. Ramalkan nilai tepat bagi x, y dan z!","hook":"Setiap kedudukan (i, j) yang sepadan membentuk satu persamaan linear ringkas!","scenario":"Diberi P = [[2x, 7], [-4, 9 - 2z]] dan Q = [[12, y + 3], [-4, z]] dengan keadaan P = Q.","prompt":"Ramalkan nilai x, nilai y dan nilai z yang memenuhi persamaan P = Q:","options":["x = 6, y = 4 dan z = 3","x = 6, y = 10 dan z = 9","x = 24, y = 4 dan z = -3","x = 3, y = 4 dan z = 3"],"correctIndex":0,"proofLabId":"mat52_peringkat_sama_lab","proofState":{"tab":"sama","preset":"persamaan"},"explanation":"Kerana P = Q, bandingkan unsur sepadan: pada baris 1 lajur 1, 2x = 12 memberi x = 6; pada baris 1 lajur 2, 7 = y + 3 memberi y = 4; dan pada baris 2 lajur 2, 9 - 2z = z menghasilkan 3z = 9 iaitu z = 3."},{"type":"match","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Padan Tatatanda & Peringkat","voiceCaption":"Padankan lima konsep dan contoh matriks dalam Subtopik 2.1 dengan tafsiran yang tepat.","voiceScript":"[confident] Uji ketangkasan mata dan kefahaman tatatanda matriks kamu! Padankan kelima-lima item di sebelah kiri dengan jawapan tepatnya di sebelah kanan.","prompt":"Padankan setiap pernyataan atau matriks di sebelah kiri dengan pasangan tepatnya:","pairs":[{"id":"u1m1","left":"Matriks berperingkat 3 × 2","right":"Mempunyai 3 baris mengufuk dan 2 lajur mencancang"},{"id":"u1m2","left":"Unsur a₂₃ dalam matriks A","right":"Nombor pada baris ke-2 dan lajur ke-3 matriks A"},{"id":"u1m3","left":"[[0.25, -4]] dan [[1/4, -4]]","right":"Matriks sama kerana peringkat (1 × 2) dan nilai unsur sepadan sama"},{"id":"u1m4","left":"[5, -9] dan [[5], [-9]]","right":"Tidak sama kerana peringkat 1 × 2 berbeza daripada 2 × 1"},{"id":"u1m5","left":"Cuthbert Edmund Cullis (1913)","right":"Memperkenalkan tanda kurung matriks dan tatatanda A = [aᵢⱼ]"}],"explanation":"Setiap matriks dikenal pasti peringkatnya melalui (baris × lajur), unsur melalui indeks (baris, lajur), dan kesamaan memerlukan kedua-dua peringkat dan unsur sepadan adalah sama."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Bina Syarat Matriks Sama","voiceCaption":"Susun blok perkataan berikut untuk membina syarat lengkap dua matriks yang sama (M = N).","voiceScript":"[warm] Sekarang mari kukuhkan definisi matriks sama. Susun blok perkataan berikut supaya menjadi syarat lengkap bilakah matriks M sama dengan matriks N!","prompt":"Susun blok berikut menjadi syarat lengkap bagi dua matriks yang sama (M = N):","hint":"Kedua-dua ciri wajib dipenuhi serentak: saiz susunannya dan nilai pada setiap posisi.","answerTokens":["Peringkat yang sama","dan","setiap unsur sepadan","adalah sama"],"acceptedSequences":[["Peringkat yang sama","dan","setiap unsur sepadan","adalah sama"],["Setiap unsur sepadan","adalah sama","dan","peringkat yang sama"]],"distractors":["hanya nombor bulat positif","atau","bilangan unsur sifar sama"],"explanation":"M = N jika dan hanya jika kedua-dua matriks mempunyai peringkat yang sama dan setiap unsur sepadannya bernilai sama."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran SPM 2.1: Matriks Sama","voiceCaption":"Selesaikan soalan berformat S P M yang menggabungkan perbandingan unsur sepadan dalam persamaan matriks sama.","voiceScript":"[serious] Ini soalan latihan gaya S P M bagi Subtopik dua perpuluhan satu! Diberi dua matriks sama dua kali dua dengan pemboleh ubah a, b dan c. Kira nilai tepat bagi a tambah b tambah c!","prompt":"Diberi [[4a, 6], [3b - 1, c + 5]] = [[20, 6], [b + 7, -2a]]. Hitung nilai a + b + c.","stimulusHtml":"<strong>Panduan:</strong> Bandingkan ketiga-tiga unsur sepadan yang mengandungi pemboleh ubah satu demi satu bermula dengan <em>4a = 20</em>.","options":["-6","4","14","-1"],"correctIndex":0,"explanation":"Daripada unsur sepadan: 4a = 20 memberi a = 5; kemudian 3b - 1 = b + 7 memberi 2b = 8 iaitu b = 4; seterusnya c + 5 = -2a = -2(5) = -10 menghasilkan c = -15. Maka a + b + c = 5 + 4 + (-15) = -6."}]},{"id":"mat52-u2","title":"Unit 2: Tambah, Tolak, Pendaraban Skalar & Hukum Matriks","subtitle":"Subtopik 2.2 (Bhg. A) — Syarat Peringkat Sama, Tambah & Tolak, Skalar nA, Matriks Sifar O & Hukum Aritmetik","iconType":"scale","iconUrl":"../assets/icons/mat52-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Syarat Tambah & Tolak Matriks","voiceCaption":"Penambahan dan penolakan matriks hanya sah dilaksanakan apabila kedua-dua matriks mempunyai peringkat yang sama.","voiceScript":"[warm] Sekarang kita melangkah ke Subtopik dua perpuluhan dua, Operasi Asas Matriks! Bagaimanakah kedai elektrik menggabungkan jualan bulan Mac dan April, atau mengira stok akhir buku teks? Mudah sahaja: tambah atau tolak setiap unsur yang sepadan! Namun ingat syarat mutlak ini: penambahan dan penolakan HANYA boleh dibuat jika kedua-dua matriks mempunyai peringkat yang sama. Jika satu berperingkat dua darab tiga dan satu lagi dua darab dua, operasi itu mustahil dijalankan!","title":"Penambahan & Penolakan Matriks serta Mencari Matriks Tidak Diketahui","acronym":"A ± B","hook":"Stok akhir = Stok awal + Buku diterima - Buku rosak, dan Keuntungan = Pendapatan - Perbelanjaan — semuanya dikira serentak dengan tambah dan tolak matriks!","mediaKey":"mat52_operasi_asas","summary":"Penambahan dan penolakan hanya boleh dilakukan ke atas matriks yang sama peringkat dengan menambah atau menolak unsur sepadan untuk menghasilkan satu matriks tunggal pada peringkat yang sama.","bullets":["Syarat Peringkat Sama & Nombor Negatif/Pecahan: Jika A = [[a₁₁, a₁₂], [a₂₁, a₂₂]] dan B = [[b₁₁, b₁₂], [b₂₁, b₂₂]], maka A ± B = [[a₁₁ ± b₁₁, a₁₂ ± b₁₂], [a₂₁ ± b₂₁, a₂₂ ± b₂₂]]. Berhati-hati semasa menolak nombor negatif atau pecahan seperti 5/6 - 1/3 dan 1/4 - 0.4 = -0.15.","Mencari Matriks F & Pemboleh Ubah: Jika F + A - B = C, alihkan matriks ke sebelah kanan menjadi F = C - A + B dengan menukar tanda + dan -. Aplikasi nyata melibatkan jadual stok kedai atau pengiraan untung bersih (Pendapatan - Perbelanjaan)."],"labId":"mat52_tambah_skalar_lab","labTitle":"Makmal Tambah, Tolak & Pendaraban Skalar Matriks","labProps":{"tab":"tambah","preset":"stok","op":"+"},"examTip":"Kesilapan paling kerap semasa penolakan matriks ialah lupa mengagihkan tanda tolak pada nombor negatif, misalnya 6 - (-7) sepatutnya menjadi 6 + 7 = 13, bukan -1!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Pasangan Sah Tambah/Tolak","voiceCaption":"Asingkan enam pasangan matriks berikut sama ada operasi penambahan dan penolakan boleh dilaksanakan atau tidak.","voiceScript":"[confident] Uji ketajaman mata kamu memeriksa peringkat! Asingkan keenam-enam pasangan matriks berikut sama ada ia boleh ditambah dan ditolak ataupun tidak sah kerana peringkat berbeza.","prompt":"Isihkan setiap pasangan matriks kepada kategori kesahihan tambah dan tolak:","buckets":[{"id":"sah","label":"Boleh Tambah & Tolak (Peringkat Sama)"},{"id":"tidak","label":"Tidak Boleh (Peringkat Berbeza)"}],"items":[{"text":"[[1, 12]] dan [[0, -4]] (1 × 2 dengan 1 × 2)","bucketId":"sah","note":"Kedua-duanya berperingkat 1 × 2, maka boleh ditambah dan ditolak."},{"text":"[[15, -4], [-1, 0]] dan [[2, -5], [13, 0]] (2 × 2 dengan 2 × 2)","bucketId":"sah","note":"Kedua-duanya berperingkat 2 × 2, maka sah ditambah dan ditolak."},{"text":"[[-1], [6]] dan [[4], [9]] (2 × 1 dengan 2 × 1)","bucketId":"sah","note":"Kedua-duanya matriks lajur 2 × 1, maka boleh ditambah dan ditolak."},{"text":"[[2, -5, 3], [8, 11, 7]] dan [[9, 6], [4, -1]] (2 × 3 dengan 2 × 2)","bucketId":"tidak","note":"Peringkat 2 × 3 berbeza dengan 2 × 2, maka tidak boleh ditambah atau ditolak."},{"text":"[[10], [-3]] dan [12  -7] (2 × 1 dengan 1 × 2)","bucketId":"tidak","note":"Matriks lajur 2 × 1 berbeza peringkat daripada matriks baris 1 × 2."},{"text":"[[13, -1, 11], [-2, 8, 4]] dan matriks 3 × 3","bucketId":"tidak","note":"Peringkat 2 × 3 tidak sama dengan peringkat 3 × 3."}],"explanation":"Penambahan dan penolakan hanya dibenarkan apabila kedua-dua matriks mempunyai bilangan baris dan bilangan lajur yang sama tepat."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Pendaraban Skalar & Hukum Matriks","voiceCaption":"Pendaraban skalar mendarabkan setiap unsur dengan nombor n; penambahan mematuhi ketiga-tiga hukum aritmetik manakala penolakan hanya mematuhi hukum kalis agihan.","voiceScript":"[warm] Bagaimanakah pula mendarab matriks dengan suatu nombor, contohnya lima darab A atau negatif setengah darab D? Nombor itu dipanggil skalar, dan pendaraban skalar bermaksud setiap unsur di dalam matriks didarab dengan nombor tersebut! Selain itu, ingat hasil penting Mobilisasi Minda satu: penambahan mematuhi Hukum Kalis Tukar Tertib, Hukum Kalis Agihan dan Hukum Kalis Sekutuan. Tetapi awas! Penolakan matriks tidak mematuhi hukum tukar tertib dan sekutuan. Cuba teroka keenam-enam kad tiga dimensi di bawah!","title":"Pendaraban Skalar nA, Matriks Sifar O & 4 Hukum Operasi Aritmetik","acronym":"nA • O","hook":"Penambahan mematuhi tiga hukum aritmetik sekaligus, tetapi penolakan hanya patuh pada Hukum Agihan (h(A - B) = hA - hB)!","summary":"Pendaraban skalar nA mendarabkan setiap unsur matriks A dengan skalar n (termasuk negatif dan pecahan), manakala hukum operasi aritmetik menentukan sifat tukar tertib, agihan, sekutuan dan peranan matriks sifar O.","bullets":["Pendaraban Skalar nA & Matriks Sifar O: Untuk sebarang nombor skalar n, n[[a, b], [c, d]] = [[na, nb], [nc, nd]], seperti 5X + 2Y bagi jualan 5 hari bekerja dan 2 hari hujung minggu. Matriks yang semua unsurnya 0 ialah matriks sifar O (contoh O₁ₓ₂ = [0  0], O₂ₓ₂), dengan sifat A + O = A dan A - O = A.","Hukum Operasi Aritmetik (Mobilisasi Minda 1): (1) Kalis Tukar Tertib: A + B = B + A (Patuh), tetapi A - B ≠ B - A (Tidak patuh); (2) Kalis Agihan: h(A + B) = hA + hB dan h(A - B) = hA - hB (Kedua-duanya patuh); (3) Kalis Sekutuan: (A + B) + C = A + (B + C) (Patuh), tetapi (A - B) - C ≠ A - (B - C) (Tidak patuh)."],"labId":"mat52_hukum_matriks_flip","labTitle":"Dek Kad 3D: Hukum Operasi Aritmetik & Matriks Sifar","examTip":"Apabila menyelesaikan persamaan berbentuk 3(P - Q), kamu boleh mengira P - Q di dalam kurungan dahulu sebelum mendarabkan 3, atau mengagihkan 3P - 3Q — kedua-duanya memberi jawapan sama mengikut Hukum Kalis Agihan!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Matriks R dengan Skalar","voiceCaption":"Ramalkan matriks R yang memenuhi persamaan skalar 3R tambah A sama dengan B.","voiceScript":"[curious] Mari uji kepantasan kamu menyelesaikan persamaan skalar matriks! Diberi tiga R tambah matriks tujuh negatif dua empat lima sama dengan matriks satu sepuluh negatif dua empat belas. Ramalkan nilai matriks R!","hook":"Tolak matriks di sebelah kiri daripada matriks hasil dahulu sebelum membahagi setiap unsur dengan pekali skalar 3!","scenario":"Diberi 3R + [[7, -2], [4, 5]] = [[1, 10], [-2, 14]].","prompt":"Ramalkan matriks R yang tepat:","options":["[[-2, 4], [-2, 3]]","[[-6, 12], [-6, 9]]","[[8/3, 8/3], [2/3, 19/3]]","[[-2, 8/3], [2/3, 3]]"],"correctIndex":0,"proofLabId":"mat52_tambah_skalar_lab","proofState":{"tab":"skalar","preset":"persamaan"},"explanation":"Langkah 1: 3R = [[1, 10], [-2, 14]] - [[7, -2], [4, 5]] = [[1 - 7, 10 - (-2)], [-2 - 4, 14 - 5]] = [[-6, 12], [-6, 9]]. Langkah 2: R = (1/3)[[-6, 12], [-6, 9]] = [[-2, 4], [-2, 3]]."},{"type":"match","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Padan Hukum Operasi Matriks","voiceCaption":"Padankan lima pernyataan operasi matriks berikut dengan hukum aritmetik atau kesahihannya yang tepat.","voiceScript":"[confident] Semak kefahaman kamu terhadap Hukum Operasi Aritmetik! Padankan kelima-lima persamaan atau ketaksamaan di sebelah kiri dengan nama hukumnya.","prompt":"Padankan setiap hubungan matriks dengan hukum operasi atau sifat yang tepat:","pairs":[{"id":"u2m1","left":"A + B = B + A","right":"Penambahan mematuhi Hukum Kalis Tukar Tertib"},{"id":"u2m2","left":"A - B ≠ B - A","right":"Penolakan tidak mematuhi Hukum Kalis Tukar Tertib"},{"id":"u2m3","left":"h(A - B) = hA - hB","right":"Penolakan mematuhi Hukum Kalis Agihan skalar"},{"id":"u2m4","left":"(A + B) + C = A + (B + C)","right":"Penambahan mematuhi Hukum Kalis Sekutuan"},{"id":"u2m5","left":"A + O = A dan A - O = A","right":"Sifat Matriks Sifar O (semua unsur bernilai 0)"}],"explanation":"Mengenal pasti hukum mana yang dipatuhi oleh '+' berbanding '-' mencegah kesilapan menukar susunan sebutan semasa meringkaskan ungkapan matriks."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Bina Hukum Kalis Agihan","voiceCaption":"Susun blok simbol berikut menjadi persamaan Hukum Kalis Agihan bagi penolakan dengan skalar h.","voiceScript":"[warm] Sekarang susun blok simbol di bawah bagi membentuk Hukum Kalis Agihan skalar h ke atas penolakan dua matriks A tolak B!","prompt":"Susun blok simbol menjadi persamaan Hukum Kalis Agihan bagi penolakan matriks:","hint":"Skalar h didarab masuk kepada kedua-dua matriks A dan B dengan mengekalkan operasi tolak.","answerTokens":["h(A - B)","=","hA","-","hB"],"acceptedSequences":[["h(A - B)","=","hA","-","hB"]],"distractors":["+","h + A","B - A"],"explanation":"Hukum Kalis Agihan menyatakan h(A - B) = hA - hB dan h(A + B) = hA + hB bagi matriks A dan B yang sama peringkat."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s7","voiceToneLabel":"Cabaran SPM 2.2(b): Skalar Perpuluhan","voiceCaption":"Selesaikan persamaan matriks gabungan pendaraban skalar perpuluhan dan integer untuk mencari nilai m dan k.","voiceScript":"[serious] Ini soalan latihan S P M menggabungkan pendaraban skalar perpuluhan dan penolakan matriks! Hitung nilai m tambah k apabila sifar perpuluhan lima darab matriks pertama tolak dua darab matriks kedua sama dengan matriks hasil.","prompt":"Diberi 0.5[[8, -6], [12, 4k]] - 2[[m, -2], [3, 5]] = [[-2, 1], [0, -2]]. Hitung nilai m + k.","stimulusHtml":"<strong>Panduan:</strong> Bandingkan unsur pada kedudukan (1, 1) untuk mencari <em>m</em> dan kedudukan (2, 2) untuk mencari <em>k</em>.","options":["7","5","1","-1"],"correctIndex":0,"explanation":"Pada baris 1 lajur 1: 0.5(8) - 2m = -2 => 4 - 2m = -2 => 2m = 6 => m = 3. Pada baris 2 lajur 2: 0.5(4k) - 2(5) = -2 => 2k - 10 = -2 => 2k = 8 => k = 4. Maka m + k = 3 + 4 = 7."}]},{"id":"mat52-u3","title":"Unit 3: Pendaraban Dua Matriks (AB) & Kuasa Matriks","subtitle":"Subtopik 2.2 (Bhg. B) — Syarat (m × n)(n × p) = m × p, Baris × Lajur, AB ≠ BA & Kuasa Matriks L² = LL","iconType":"graph","iconUrl":"../assets/icons/mat52-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Syarat Keserasian Darab Matriks","voiceCaption":"Untuk mendarab A dengan B, bilangan lajur A mesti sama dengan bilangan baris B; peringkat hasil darab ialah baris A darab lajur B.","voiceScript":"[warm] Bolehkah sebarang dua matriks didarabkan begitu sahaja? Tidak sama sekali! Untuk mendarab matriks A dengan matriks B, angka dalaman iaitu bilangan lajur matriks pertama mesti sama dengan bilangan baris matriks kedua! Jika A berperingkat m darab n dan B berperingkat n darab p, barulah A B wujud dan peringkat hasilnya ialah angka luaran iaitu m darab p. Awas juga: walaupun A B boleh didarab, B A mungkin gagal terus atau memberi peringkat yang berbeza!","title":"Syarat Pendaraban (m × n)(n × p) & Sifat Tidak Kalis Tukar Tertib (AB ≠ BA)","acronym":"(m×n)(n×p)","hook":"Tulis peringkat kedua-dua matriks bersebelahan: dua nombor di tengah MESTI kembar sama untuk sah didarab, dan dua nombor di luar menjadi peringkat jawapannya!","mediaKey":"mat52_darab_dot","summary":"Pendaraban matriks AB hanya sah jika bilangan lajur A menyamai bilangan baris B, menghasilkan matriks berperingkat (baris A) × (lajur B); secara amnya pendaraban matriks tidak mematuhi Hukum Kalis Tukar Tertib (AB ≠ BA).","bullets":["Ujian Keserasian (m × n)(n × p) = (m × p): Bilangan lajur matriks A (n) mesti sama dengan bilangan baris matriks B (n). Peringkat hasil darab AB diambil daripada bilangan baris A (m) dan bilangan lajur B (p). Contohnya, matriks (2 × 3) darab matriks (3 × 1) menghasilkan matriks (2 × 1).","Mengapa AB ≠ BA secara Amnya: Jika C berperingkat 2 × 1 dan D berperingkat 2 × 2, pendaraban CD TIDAK wujud (1 ≠ 2), namun pendaraban DC wujud dengan peringkat 2 × 1! Malah bagi dua matriks segi empat sama 2 × 2, AB ≠ BA hampir selalu berlaku."],"labId":"mat52_darab_matriks_step_lab","labTitle":"Penguji Keserasian & Animator Darab Baris × Lajur","labProps":{"tab":"syarat","preset":"komisen"},"examTip":"Sentiasa semak keserasian peringkat sebelum mula mendarab; dalam soalan Kertas 1, hanya menyemak peringkat hasil darab m × p sering terus menolak 2 atau 3 pilihan jawapan pengganggu!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Pasangan Darab Sah vs Gagal","voiceCaption":"Kelaskan enam pasangan peringkat pendaraban matriks berikut kepada Boleh Didarab atau Tidak Boleh Didarab.","voiceScript":"[confident] Uji ketangkasan semakan syarat dalaman kamu! Asingkan keenam-enam pasangan pendaraban matriks ini sama ada boleh didarab ataupun gagal syarat lajur sama dengan baris.","prompt":"Isihkan setiap pasangan pendaraban AB mengikut kebolehannya untuk didarab:","buckets":[{"id":"boleh","label":"Boleh Didarab (Lajur A = Baris B)"},{"id":"gagal","label":"Tidak Boleh (Lajur A ≠ Baris B)"}],"items":[{"text":"Matriks P (2 × 3) didarab dengan Matriks Q (3 × 1)","bucketId":"boleh","note":"Sah! Lajur P (3) = Baris Q (3), menghasilkan PQ (2 × 1)."},{"text":"Matriks R (1 × 2) didarab dengan Matriks S (2 × 3)","bucketId":"boleh","note":"Sah! Lajur R (2) = Baris S (2), menghasilkan RS (1 × 3)."},{"text":"Matriks F (2 × 1) didarab dengan Matriks G (1 × 2)","bucketId":"boleh","note":"Sah! Lajur F (1) = Baris G (1), menghasilkan FG (2 × 2)."},{"text":"Matriks C (2 × 1) didarab dengan Matriks D (2 × 2)","bucketId":"gagal","note":"Gagal! Lajur C (1) tidak sama dengan Baris D (2)."},{"text":"Matriks A (2 × 2) didarab dengan Matriks B (1 × 2)","bucketId":"gagal","note":"Gagal! Lajur A (2) tidak sama dengan Baris B (1)."},{"text":"Matriks X (3 × 2) didarab dengan Matriks Y (3 × 2)","bucketId":"gagal","note":"Gagal! Lajur X (2) tidak sama dengan Baris Y (3)."}],"explanation":"Hanya pasangan yang mempunyai nombor tengah sama (lajur pertama = baris kedua) boleh didarabkan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Algoritma Baris × Lajur & Kuasa L²","voiceCaption":"Setiap unsur AB ialah hasil tambah darab baris ke-i matriks A dengan lajur ke-j matriks B; ingat bahawa L kuasa dua ialah L darab L, bukan mengkuasaduakan setiap unsur.","voiceScript":"[warm] Sekarang mari lihat bagaimana pengiraan pendaraban matriks dilakukan secara tepat! Untuk mendapatkan unsur pada baris ke-i dan lajur ke-j, ambil keseluruhan baris ke-i daripada matriks kiri, darabkan satu per satu dengan lajur ke-j daripada matriks kanan, lalu jumlahkan kesemuanya! Awas dengan perangkap kuasa matriks: L kuasa dua bermaksud L darab L menggunakan kaedah baris kali lajur, bukannya mengkuasaduakan setiap nombor secara berasingan! Tekan butang Auto Langkah di dalam makmal untuk melihat animasinya!","title":"Kaedah Baris × Lajur, Kuasa Matriks (L², L³) & Aplikasi Perniagaan","acronym":"BAR × LAJ","hook":"Perangkap maut nombor satu Bab 2: L² = L × L (guna Baris × Lajur), BUKAN [[a², b²], [c², d²]]!","summary":"Unsur hasil darab AB pada baris ke-i dan lajur ke-j diperoleh dengan menjumlahkan hasil darab unsur sepadan baris ke-i (A) dengan lajur ke-j (B); kaedah ini terpakai juga untuk kuasa matriks L² = LL dan pengiraan berwajaran seperti komisen, saham serta markah peperiksaan.","bullets":["Pendaraban Pelbagai Peringkat & Kuasa Matriks: Untuk matriks A (2×2) × B (2×2), c₁₁ = a₁₁b₁₁ + a₁₂b₂₁ dan seterusnya. Pendaraban (1×2)(2×1) memberi matriks 1×1, manakala (2×1)(1×2) memberi matriks 2×2. Bagi matriks segi empat sama L, L² = LL dan L³ = L²L = LL², BUKAN kuasa dua setiap unsur!","Aplikasi Kontekstual: Mengira jumlah komisen kipas angin (P₂ₓ₃ × K₃ₓ₁), jumlah pelaburan saham A dan B bagi pelabur (2×2 darab 2×1), dan markah keseluruhan subjek berdasarkan pemberat peratusan latihan serta peperiksaan."],"labId":"mat52_darab_matriks_step_lab","labTitle":"Animator Langkah Demi Langkah Baris × Lajur","labProps":{"tab":"animasi","preset":"2x2"},"examTip":"Semasa mengira (2×2)(2×2) di dalam peperiksaan, tulis langkah pengembangan seperti (3)(5) + (2)(1) dengan kurungan supaya tanda negatif tidak tersilap semasa menjumlahkan."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal FG (2×1)(1×2) vs GF (1×2)(2×1)","voiceCaption":"Ramalkan perbezaan peringkat dan hasil darab antara FG dan GF bagi matriks lajur F dan matriks baris G.","voiceScript":"[curious] Perhatikan keajaiban peringkat pendaraban ini! Matriks F ialah matriks lajur dua darab satu dengan nombor lima dan empat. Matriks G ialah matriks baris satu darab dua dengan nombor tiga dan negatif dua. Ramalkan hasil darab F darab G berbanding G darab F!","hook":"Walaupun nombornya sama, susunan (2×1)(1×2) meletup menjadi matriks 2×2 sedangkan (1×2)(2×1) mengecut menjadi matriks 1×1!","scenario":"Diberi F = [[5], [4]] (2 × 1) dan G = [3  -2] (1 × 2).","prompt":"Ramalkan hasil darab FG dan GF yang betul:","options":["FG = [[15, -10], [12, -8]] (2 × 2) dan GF = [7] (1 × 1)","FG = [7] (1 × 1) dan GF = [[15, -10], [12, -8]] (2 × 2)","FG = [[15], [-8]] (2 × 1) dan GF = [15  -8] (1 × 2)","Kedua-dua FG dan GF menghasilkan matriks yang sama [[15, -10], [12, -8]]"],"correctIndex":0,"proofLabId":"mat52_darab_matriks_step_lab","proofState":{"tab":"animasi","preset":"baris_lajur"},"explanation":"FG ialah (2×1)(1×2) -> (2×2) iaitu [[5(3), 5(-2)], [4(3), 4(-2)]] = [[15, -10], [12, -8]]. Sebaliknya GF ialah (1×2)(2×1) -> (1×1) iaitu [3(5) + (-2)(4)] = [15 - 8] = [7]."},{"type":"match","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Padan Peringkat Hasil Darab","voiceCaption":"Padankan lima pendaraban matriks berikut dengan peringkat hasil darabnya.","voiceScript":"[confident] Jom uji kecekapan kamu membaca peringkat hasil darab! Padankan kelima-lima pasangan matriks di sebelah kiri dengan peringkat hasil darabnya di sebelah kanan.","prompt":"Padankan setiap pasangan pendaraban dengan peringkat hasilnya:","pairs":[{"id":"u3m1","left":"A(2 × 3) didarab B(3 × 1)","right":"Peringkat 2 × 1"},{"id":"u3m2","left":"P(1 × 2) didarab Q(2 × 1)","right":"Peringkat 1 × 1"},{"id":"u3m3","left":"R(2 × 1) didarab S(1 × 2)","right":"Peringkat 2 × 2"},{"id":"u3m4","left":"M(3 × 2) didarab N(2 × 4)","right":"Peringkat 3 × 4"},{"id":"u3m5","left":"X(2 × 1) didarab Y(2 × 2)","right":"Tidak boleh didarab (1 ≠ 2)"}],"explanation":"Hanya ambil bilangan baris matriks pertama dan bilangan lajur matriks kedua selepas memastikan bilangan lajur pertama = baris kedua."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Bina Rumus Peringkat AB","voiceCaption":"Susun blok simbol berikut menjadi peraturan peringkat pendaraban matriks A(m × n) × B(n × p).","voiceScript":"[warm] Kukuhkan ingatan kamu terhadap aturan peringkat pendaraban dua matriks! Susun blok berikut bagi menunjukkan peringkat hasil darab bagi matriks A m darab n dengan matriks B n darab p.","prompt":"Susun blok berikut menjadi pernyataan syarat dan peringkat hasil darab AB:","hint":"Nilai dalaman mesti sama (n), lalu nilai luaran (m dan p) membentuk peringkat AB.","answerTokens":["A(m × n)","×","B(n × p)","=","AB(m × p)"],"acceptedSequences":[["A(m × n)","×","B(n × p)","=","AB(m × p)"]],"distractors":["AB(n × n)","+","AB(p × m)"],"explanation":"Jika A berperingkat m × n dan B berperingkat n × p, maka pendaraban AB boleh dilakukan dan peringkat hasilnya ialah m × p."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Cabaran SPM 2.2(c): Persamaan Darab","voiceCaption":"Selesaikan persamaan pendaraban dua matriks dua kali dua untuk mencari nilai r tambah s.","voiceScript":"[serious] Ini soalan latihan S P M bagi pendaraban dua matriks dengan pemboleh ubah tersembunyi! Diberi hasil darab matriks empat r dua negatif tiga dengan matriks tiga s lima dua sama dengan matriks dua lapan negatif sembilan sifar. Kira nilai r tambah s!","prompt":"Diberi [[4, r], [2, -3]] [[3, s], [5, 2]] = [[2, 8], [-9, 0]]. Hitung nilai r + s.","stimulusHtml":"<strong>Panduan:</strong> Gunakan unsur baris 1 lajur 1 untuk mencari <em>r</em> dan unsur baris 2 lajur 2 untuk mencari <em>s</em>.","options":["1","-5","5","-1"],"correctIndex":0,"explanation":"Baris 1 × Lajur 1: 4(3) + r(5) = 2 => 12 + 5r = 2 => 5r = -10 => r = -2. Baris 2 × Lajur 2: 2(s) + (-3)(2) = 0 => 2s - 6 = 0 => s = 3. Semakan Baris 1 × Lajur 2: 4(3) + (-2)(2) = 12 - 4 = 8 (Tepat!). Maka r + s = -2 + 3 = 1."}]},{"id":"mat52-u4","title":"Unit 4: Matriks Identiti I, Penentu & Matriks Songsang A⁻¹","subtitle":"Subtopik 2.2 (Bhg. C) — Ciri Identiti I (AI = IA = A), Songsangan AA⁻¹ = I, Penentu ad - bc & Syarat ad - bc = 0","iconType":"atom","iconUrl":"../assets/icons/mat52-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Ciri Matriks Identiti I","voiceCaption":"Matriks identiti I ialah matriks segi empat sama dengan unsur 1 di pepenjuru utama dari kiri atas ke kanan bawah dan 0 selainnya; AI = IA = A.","voiceScript":"[warm] Dalam nombor biasa, sebarang nombor darab satu kekal nombor itu sendiri. Dalam dunia matriks pula, peranan nombor satu dimainkan oleh Matriks Identiti berhuruf I! Ingat tiga ciri wajib matriks identiti: pertama, ia mesti segi empat sama n darab n; kedua, unsur satu hanya terletak pada pepenjuru utama dari bucu kiri atas ke kanan bawah; dan ketiga, semua unsur lain ialah sifar! Jika A darab B sama dengan I, maka B ialah matriks songsang bagi A!","title":"Ciri-ciri Matriks Identiti I & Pengenalan Matriks Songsang","acronym":"AI = IA = A","hook":"Awas perangkap identiti palsu! [[0, 1], [1, 0]] mempunyai nombor 1 pada pepenjuru yang SALAH — jika didarab, baris A akan terbalik!","mediaKey":"mat52_identiti_songsang","summary":"Matriks identiti I ialah matriks segi empat sama dengan unsur 1 sepanjang pepenjuru utama (kiri atas ke kanan bawah) dan 0 selainnya; ia memenuhi AI = IA = A, manakala dua matriks ialah songsangan jika hasil darabnya memberi I.","bullets":["3 Syarat Matriks Identiti I: (1) Mesti matriks segi empat sama (n × n, cth. [1], I₂ = [[1, 0], [0, 1]], I₃ = 3×3); (2) Unsur 1 terletak pada pepenjuru utama dari bucu kiri atas ke kanan bawah; (3) Semua unsur lain ialah 0. Sifatnya: AI = IA = A dan I² = I (cth. 4IT - I² = 4T - I).","Maksud Matriks Songsang (A⁻¹): Jika pendaraban matriks A dan B menghasilkan matriks identiti I (iaitu AB = BA = I), maka B ialah matriks songsang bagi A dan ditulis sebagai A⁻¹, lalu AA⁻¹ = A⁻¹A = I."],"labId":"mat52_songsang_persamaan_lab","labTitle":"Makmal Penguji Identiti I, Songsangan A⁻¹ & Penyelesai AX = B","labProps":{"tab":"identiti","preset":"sah2"},"examTip":"Untuk membuktikan sama ada dua matriks ialah songsangan antara satu sama lain dalam Kertas 2, darabkan kedua-duanya dan tunjukkan hasilnya tepat sama dengan [[1, 0], [0, 1]]."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Matriks Identiti Sah vs Palsu","voiceCaption":"Kelaskan enam matriks berikut antara Matriks Identiti I yang sah dengan matriks bukan identiti.","voiceScript":"[confident] Jom uji penglihatan tajam kamu mengesan matriks identiti yang sah! Asingkan keenam-enam matriks di bawah kepada Matriks Identiti Sah atau Bukan Matriks Identiti.","prompt":"Isihkan matriks berikut antara Matriks Identiti I yang sah dengan Bukan Matriks Identiti:","buckets":[{"id":"identiti","label":"Matriks Identiti I (Sah)"},{"id":"bukan","label":"Bukan Matriks Identiti"}],"items":[{"text":"[[1, 0], [0, 1]] (2 × 2)","bucketId":"identiti","note":"Segi empat sama 2 × 2, unsur 1 pada pepenjuru utama dan 0 selainnya."},{"text":"[[1, 0, 0], [0, 1, 0], [0, 0, 1]] (3 × 3)","bucketId":"identiti","note":"Segi empat sama 3 × 3 dengan unsur 1 sepanjang pepenjuru utama."},{"text":"[1] (1 × 1)","bucketId":"identiti","note":"Matriks identiti peringkat 1 × 1 ialah [1]."},{"text":"[0  1] (1 × 2)","bucketId":"bukan","note":"Bukan segi empat sama (1 × 2) dan mempunyai unsur 0 di a₁₁."},{"text":"[[0, 1], [1, 0]] (Pepenjuru songsang)","bucketId":"bukan","note":"Unsur 1 berada pada pepenjuru berlawanan (kanan atas ke kiri bawah), bukan pepenjuru utama."},{"text":"[[0, 0], [1, 1]] atau [[1, 1], [1, 1]]","bucketId":"bukan","note":"Pepenjuru utama bukan 1 sahaja dan terdapat unsur 1 di luar pepenjuru."}],"explanation":"Matriks identiti I wajib berbentuk segi empat sama dengan unsur 1 hanya pada pepenjuru kiri atas ke kanan bawah dan 0 pada semua kedudukan lain."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Rumus Songsangan & Penentu ad - bc","voiceCaption":"Bagi matriks A = [[a, b], [c, d]], songsangannya ialah satu per (a d tolak b c) darab [[d, negatif b], [negatif c, a]], dengan syarat penentu a d tolak b c tidak sama dengan sifar.","voiceScript":"[warm] Bagaimanakah kita mengira matriks songsang A kuasa negatif satu bagi sebarang matriks dua darab dua? Hafal langkah emas tiga serangkai ini! Pertama, kira penentu iaitu a darab d tolak b darab c. Kedua, tukar tempat a dan d pada pepenjuru utama. Ketiga, tukar tanda positif atau negatif pada b dan c! Akhir sekali darabkan dengan satu per penentu. Ingat syarat paling penting dalam peperiksaan S P M: matriks songsang TIDAK wujud apabila penentu a d tolak b c sama dengan sifar kerana pembahagian dengan sifar tidak tertakrif!","title":"Rumus Matriks Songsang 2 × 2, Penentu |A| & Syarat Ketidakwujudan","acronym":"ad - bc ≠ 0","hook":"Ingat frasa kilat: 'Tukar pepenjuru utama (a <-> d), tukar tanda pepenjuru sebelah (-b, -c), bahagi penentu (ad - bc)!'","summary":"Rumus matriks songsang 2 × 2 menggunakan penentu |A| = ad - bc, pertukaran posisi a dengan d, dan penukaran tanda b serta c; songsangan tidak wujud jika penentu bernilai sifar.","bullets":["Rumus Songsangan & Penentu |A|: Bagi A = [[a, b], [c, d]], penentu |A| = ad - bc dan A⁻¹ = [1 / (ad - bc)] [[d, -b], [-c, a]] dengan keadaan ad - bc ≠ 0. Apabila menyelesaikan persamaan CA = I (dengan A ialah 2×2), terus peroleh A = C⁻¹.","Syarat Tidak Wujud Songsangan (ad - bc = 0): Jika penentu ad - bc = 0, maka 1 / 0 tidak tertakrif dan A⁻¹ tidak wujud. Dalam soalan mencari pemboleh ubah m apabila matriks tidak mempunyai songsangan, terus bina persamaan ad - bc = 0; sebaliknya jika nilai A⁻¹ diberikan, gunakan AA⁻¹ = I."],"labId":"mat52_songsang_persamaan_lab","labTitle":"Kalkulator Interaktif Penentu ad - bc & Matriks Songsang A⁻¹","labProps":{"tab":"songsang","preset":"wujud"},"examTip":"Jangan tertukar dua kaedah mencari pemboleh ubah m: jika soalan sebut 'tidak mempunyai songsangan', guna ad - bc = 0; jika soalan sebut 'diberi A⁻¹ = ...', guna hasil darab AA⁻¹ = I!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Nilai k Bila Songsangan Tiada","voiceCaption":"Ramalkan nilai k supaya matriks M = [[3k, -4], [6, -2]] tidak mempunyai matriks songsang.","voiceScript":"[curious] Sebuah matriks M mengandungi unsur tiga k, negatif empat, enam dan negatif dua. Jika diberitahu bahawa matriks M tidak mempunyai matriks songsang, ramalkan nilai k yang tepat!","hook":"Syarat 'tiada songsangan' bermakna penentu ad - bc mesti tepat sama dengan 0!","scenario":"Diberi matriks M = [[3k, -4], [6, -2]] tidak mempunyai matriks songsang.","prompt":"Ramalkan nilai k yang betul:","options":["k = 4 kerana (3k)(-2) - (-4)(6) = 0 memberi -6k + 24 = 0","k = -4 kerana (3k)(-2) + (-4)(6) = 0 memberi -6k - 24 = 0","k = 2 kerana 3k = 6 terus menyamakan lajur pertama","k = -2 kerana penentu disamakan dengan 1"],"correctIndex":0,"proofLabId":"mat52_songsang_persamaan_lab","proofState":{"tab":"songsang","preset":"tiada"},"explanation":"Matriks songsang tidak wujud apabila penentu ad - bc = 0. Gantikan a = 3k, b = -4, c = 6, d = -2: (3k)(-2) - (-4)(6) = 0 => -6k + 24 = 0 => 6k = 24 => k = 4."},{"type":"match","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Padan Songsangan & Sifat Identiti","voiceCaption":"Padankan lima matriks atau ungkapan berikut dengan penentu, songsangan atau penyederhanaan identitinya yang tepat.","voiceScript":"[confident] Uji kelajuan kamu mengira penentu dan songsangan dua darab dua! Padankan kelima-lima item di sebelah kiri dengan pasangan jawapan tepatnya.","prompt":"Padankan setiap matriks atau ungkapan dengan keputusan yang betul:","pairs":[{"id":"u4m1","left":"Songsangan bagi [[5, 2], [2, 1]] (det = 1)","right":"[[1, -2], [-2, 5]]"},{"id":"u4m2","left":"Songsangan bagi [[4, 2], [6, 3]]","right":"Tidak wujud kerana penentu (4)(3) - (2)(6) = 0"},{"id":"u4m3","left":"Songsangan bagi [[3, -5], [1, -1]] (det = 2)","right":"(1/2)[[-1, 5], [-1, 3]]"},{"id":"u4m4","left":"4IT - I² (dengan I ialah matriks identiti)","right":"4T - I kerana IT = T dan I² = I"},{"id":"u4m5","left":"Jika AB = BA = I (Matriks Identiti)","right":"B = A⁻¹ dan A = B⁻¹"}],"explanation":"Sentiasa semak ad - bc dahulu: jika sifar, songsangan tidak wujud; jika bukan sifar, tukar a dengan d dan tukar tanda b serta c."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Bina Rumus Songsangan 2 × 2","voiceCaption":"Susun blok simbol berikut untuk membina rumus lengkap matriks songsang bagi A = [[a, b], [c, d]].","voiceScript":"[warm] Sekarang susun blok simbol di bawah supaya menjadi rumus lengkap matriks songsang dua darab dua bagi matriks A!","prompt":"Susun blok berikut menjadi rumus matriks songsang A⁻¹ bagi A = [[a, b], [c, d]]:","hint":"Mulakan dengan A⁻¹ = pecahan penentu, diikuti matriks terlaras [[d, -b], [-c, a]] dan syarat penentu.","answerTokens":["A⁻¹","=","1 / (ad - bc)","[[d, -b], [-c, a]]","(ad - bc ≠ 0)"],"acceptedSequences":[["A⁻¹","=","1 / (ad - bc)","[[d, -b], [-c, a]]","(ad - bc ≠ 0)"]],"distractors":["[[a, -b], [-c, d]]","1 / (ac - bd)","(ad - bc = 0)"],"explanation":"Rumus tepat ialah A⁻¹ = [1 / (ad - bc)] [[d, -b], [-c, a]] dengan keadaan penentu ad - bc ≠ 0."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s7","voiceToneLabel":"Cabaran SPM 2.2(f): Songsangan AA⁻¹ = I","voiceCaption":"Cari nilai h dan k daripada persamaan hasil darab matriks songsang yang menghasilkan matriks identiti.","voiceScript":"[serious] Ini soalan gaya Kertas dua S P M yang amat popular! Diberi satu per h darab matriks tiga negatif enam negatif satu k darab matriks empat enam satu tiga sama dengan matriks identiti. Hitung nilai h tolak k!","prompt":"Diberi (1/h)[[3, -6], [-1, k]] [[4, 6], [1, 3]] = [[1, 0], [0, 1]]. Hitung nilai h - k.","stimulusHtml":"<strong>Panduan:</strong> Matriks di dalam kurungan kiri ialah songsangan bagi [[4, 6], [1, 3]]! Gunakan penentu <em>ad - bc</em> untuk <em>h</em> dan unsur <em>a ↔ d</em> untuk <em>k</em>.","options":["2","10","-2","4"],"correctIndex":0,"explanation":"Bagi M = [[4, 6], [1, 3]], penentu ad - bc = 4(3) - 6(1) = 12 - 6 = 6, maka songsangannya M⁻¹ = (1/6)[[3, -6], [-1, 4]]. Membandingkan pekali dan unsur menghasilkan h = 6 dan k = 4. Oleh itu h - k = 6 - 4 = 2."}]},{"id":"mat52-u5","title":"Unit 5: Persamaan Serentak, Kriptografi & Cabaran Boss SPM","subtitle":"Subtopik 2.2 (Bhg. D) & Unit Boss — Kaedah Matriks AX = B, Tiada Penyelesaian, Kriptografi & Sintesis KBAT","iconType":"trophy","iconUrl":"../assets/icons/mat52-u5.jpg","boss":true,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Kaedah Matriks & Kriptografi","voiceCaption":"Tukar persamaan serentak ke bentuk piawai ax + by = p, tulis AX = B, lalu darab kiri dengan A⁻¹ untuk mendapat X = A⁻¹B; matriks songsang juga digunakan dalam kriptografi moden.","voiceScript":"[warm] Selamat tiba ke Unit terakhir dan paling penting untuk Kertas dua S P M! Bagaimanakah kita menyelesaikan dua persamaan linear serentak dengan kaedah matriks? Mula-mula wajib susun kedua-dua persamaan ke bentuk piawai a x tambah b y sama dengan p dan c x tambah d y sama dengan q. Seterusnya tulis dalam bentuk matriks A X sama dengan B, lalu darab kiri kedua-dua belah dengan songsangan A untuk mendapat X sama dengan A songsang B! Jika penentu sifar, sistem itu tiada penyelesaian. Tahukah kamu prinsip songsangan yang sama digunakan dalam penyulitan mesej rahsia kriptografi seperti mesin Enigma!","title":"Menyelesaikan Persamaan Linear Serentak (AX = B) & Kriptografi","acronym":"X = A⁻¹B","hook":"Dalam Kertas 2 S P M, soalan persamaan serentak kaedah matriks bernilai 5 hingga 6 markah penuh — wajib susun bentuk piawai dahulu dan tulis A⁻¹ di sebelah KIRI B!","mediaKey":"mat52_enigma_kriptografi","summary":"Persamaan linear serentak ax + by = p dan cx + dy = q diselesaikan melalui perwakilan AX = B yang menghasilkan X = A⁻¹B = [1/(ad - bc)][[d, -b], [-c, a]][[p], [q]]; konsep songsangan ini juga menjadi asas penyulitan dan penyahsulitan kriptografi.","bullets":["4 Langkah Kaedah Matriks AX = B -> X = A⁻¹B: (1) Susun persamaan supaya pemboleh ubah x di lajur kiri, y di lajur kanan dan pemalar di sebelah kanan tanda '=' (tukar minit/jam jika unit berbeza); (2) Bentukkan [[a, b], [c, d]][[x], [y]] = [[p], [q]]; (3) Darab sebelah KIRI dengan A⁻¹: [[x], [y]] = [1/(ad-bc)][[d, -b], [-c, a]][[p], [q]] (BUKAN B A⁻¹!); (4) Nyatakan nilai x = ... dan y = ... secara berasingan.","Tiada Penyelesaian & Kriptografi: Jika sistem px + by = r dan qx + dy = s dinyatakan tiada penyelesaian, maka penentu ad - bc = 0. Dalam kriptografi (seperti sejarah dekripsi Enigma), matriks kunci M menyulitkan data (M × P = C) manakala songsangannya K = M⁻¹ menyahulit kembali mesej asal (K × C = P)."],"labId":"mat52_songsang_persamaan_lab","labTitle":"Penyelesai Langkah Demi Langkah AX = B -> X = A⁻¹B","labProps":{"tab":"persamaan","preset":"tiket"},"examTip":"Awas tiga kesilapan maut Kertas 2: (1) lupa susun lajur x dan y sekata jika soalan tulis 2y - x = 5, (2) menulis B sebelum A⁻¹, dan (3) berhenti pada jawapan matriks [[2], [5]] tanpa menulis baris akhir 'x = 2, y = 5'."},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Ramal Bentuk Matriks AX = B","voiceCaption":"Tukarkan dua persamaan linear tidak tersusun kepada bentuk matriks AX = B yang betul.","voiceScript":"[curious] Perangkap paling licik dalam soalan Kertas dua ialah persamaan yang sengaja disusun berselerak! Diberi tiga y tolak dua x sama dengan tujuh, dan empat x tambah lima y tolak sembilan belas sama dengan sifar. Ramalkan perwakilan matriks A X sama dengan B yang betul!","hook":"Perhatikan kedudukan y yang diletakkan di hadapan x dalam persamaan pertama dan pemalar -19 di sebelah kiri dalam persamaan kedua!","scenario":"Persamaan 1: 3y - 2x = 7  |  Persamaan 2: 4x + 5y - 19 = 0","prompt":"Ramalkan bentuk matriks AX = B yang tepat bagi sistem persamaan di atas:","options":["[[-2, 3], [4, 5]] [[x], [y]] = [[7], [19]]","[[3, -2], [4, 5]] [[x], [y]] = [[7], [-19]]","[[3, -2], [4, 5]] [[x], [y]] = [[7], [19]]","[[-2, 3], [4, 5]] [[x], [y]] = [[7], [-19]]"],"correctIndex":0,"proofLabId":"mat52_songsang_persamaan_lab","proofState":{"tab":"persamaan","preset":"susun"},"explanation":"Susun semula ke bentuk ax + by = p: Persamaan 1 menjadi -2x + 3y = 7 (lajur x = -2, lajur y = 3, RHS = 7) dan Persamaan 2 menjadi 4x + 5y = 19 (lajur x = 4, lajur y = 5, RHS = 19). Maka A = [[-2, 3], [4, 5]] dan B = [[7], [19]]."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Susun Aliran Kaedah Matriks","voiceCaption":"Susun keempat-empat langkah penyelesaian persamaan linear serentak menggunakan kaedah matriks mengikut turutan yang sah.","voiceScript":"[warm] Pastikan aliran kerja Kertas dua kamu tersusun rapi! Susun keempat-empat langkah di bawah mengikut turutan yang betul daripada soalan asal hingga jawapan akhir.","prompt":"Susun aliran kerja menyelesaikan persamaan linear serentak menggunakan kaedah matriks:","hint":"Bermula dengan menyusun ax + by = p, diikuti pembinaan AX = B, pendaraban kiri A⁻¹, dan diakhiri nilai x serta y berasingan.","answerTokens":["Susun bentuk piawai ax + by = p","Bentuk persamaan matriks AX = B","Darab kiri X = A⁻¹ B","Nyatakan nilai x dan y berasingan"],"acceptedSequences":[["Susun bentuk piawai ax + by = p","Bentuk persamaan matriks AX = B","Darab kiri X = A⁻¹ B","Nyatakan nilai x dan y berasingan"]],"distractors":["Darab kanan X = B A⁻¹","Samakan penentu ad - bc = 0"],"explanation":"Urutan wajib ialah: (1) Susun ax + by = p dan cx + dy = q, (2) Tulis AX = B, (3) Kira X = A⁻¹B, (4) Nyatakan x = ... dan y = ... secara berasingan."},{"type":"match","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Padan Pemodelan Masalah Matriks","voiceCaption":"Padankan lima situasi pemodelan dan kriptografi berikut dengan persamaan matriks atau prinsipnya yang tepat.","voiceScript":"[confident] Uji kecekapan kamu menterjemah masalah harian ke bahasa matriks! Padankan kelima-lima situasi di sebelah kiri dengan persamaan atau prinsipnya yang betul.","prompt":"Padankan setiap situasi masalah dengan perwakilan matriks yang tepat:","pairs":[{"id":"u5m1","left":"66 kenderaan (kereta x, motosikal y) dengan jumlah 190 roda","right":"[[1, 1], [4, 2]][[x], [y]] = [[66], [190]]"},{"id":"u5m2","left":"Persamaan m - 3 = 4n dan 3m + 2n - 2 = 0 dalam bentuk matriks","right":"[[1, -4], [3, 2]][[m], [n]] = [[3], [2]]"},{"id":"u5m3","left":"Mesin pemasangan beroperasi 12 jam (720 min) & 9 jam (540 min)","right":"Tukarkan semua tempoh jam kepada minit sebelum menulis matriks B"},{"id":"u5m4","left":"Kunci penyulitan M menghasilkan kod C = MP dalam kriptografi","right":"Mesej asal dinyahulit menggunakan songsangan K = M⁻¹ (P = KC)"},{"id":"u5m5","left":"Simpan RM5000 (P) dan RM3000 (Q) dapat dividen RM350","right":"Persamaan pertama ialah 5000x + 3000y = 350"}],"explanation":"Kunci pemodelan SPM ialah mengekalkan unit yang seragam (seperti minit dengan minit, RM dengan RM) dan memastikan pekali sepadan dengan lajur x dan y."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Cabaran Boss 1: Tiada Penyelesaian","voiceCaption":"Cabaran Boss pertama: ungkapkan p dalam sebutan q apabila dua persamaan linear serentak tiada penyelesaian.","voiceScript":"[serious] Sekarang kamu memasuki Arena Boss S P M! Soalan Boss pertama menguji kaitan antara penentu sifar dengan sistem persamaan linear. Diberi persamaan p x tambah enam y sama dengan sebelas dan q x tolak tiga y sama dengan dua tidak mempunyai sebarang penyelesaian. Ungkapkan p dalam sebutan q!","prompt":"Cabaran Boss 1: Diberi persamaan linear serentak px + 6y = 11 dan qx - 3y = 2 tidak mempunyai penyelesaian. Ungkapkan p dalam sebutan q.","stimulusHtml":"<strong>Petunjuk Boss:</strong> Persamaan serentak <em>AX = B</em> tiada penyelesaian unik apabila matriks pekali <em>A</em> tidak mempunyai songsangan.","options":["p = -2q","p = 2q","p = -1/2 q","p = 18q"],"correctIndex":0,"explanation":"Bentuk matriks pekali ialah A = [[p, 6], [q, -3]]. Sistem tiada penyelesaian bermaksud A⁻¹ tidak wujud, iaitu penentu ad - bc = 0: p(-3) - 6(q) = 0 => -3p = 6q => p = -2q."},{"type":"sort","xp":30,"voiceIdKey":"u5-s6","voiceToneLabel":"Cabaran Boss 2: Audit Perangkap SPM","voiceCaption":"Cabaran Boss kedua: asingkan enam kenyataan peperiksaan ini antara hukum yang benar sentiasa dengan kesilapan lazim S P M.","voiceScript":"[serious] Cabaran Boss kedua! Audit enam kenyataan matematik di bawah dengan pantas — asingkan mana satu yang sentiasa benar daripada kesilapan maut pelajar di dewan peperiksaan!","prompt":"Cabaran Boss 2: Isihkan pernyataan berikut antara Fakta Benar Sentiasa dengan Kesalahan Lazim SPM:","buckets":[{"id":"benar","label":"Pernyataan Benar Sentiasa"},{"id":"salah","label":"Kesalahan Lazim SPM (Salah)"}],"items":[{"text":"Matriks songsang bagi [[a, b], [c, d]] tidak wujud apabila ad - bc = 0","bucketId":"benar","note":"Tepat! Penentu sifar menyebabkan pembahagian 1/0 yang tidak tertakrif."},{"text":"Jika matriks segi empat sama memenuhi AB = I, maka B = A⁻¹","bucketId":"benar","note":"Tepat! Pendaraban matriks dengan songsangannya sentiasa memberi matriks identiti I."},{"text":"Penambahan dan penolakan mematuhi Hukum Kalis Agihan: h(A - B) = hA - hB","bucketId":"benar","note":"Tepat! Skalar h boleh diagihkan merentasi tambah mahupun tolak."},{"text":"Jika L = [[a, b], [c, d]], maka L² = [[a², b²], [c², d²]]","bucketId":"salah","note":"SALAH! L² wajib dikira melalui pendaraban matriks L × L (baris × lajur)."},{"text":"Penyelesaian bagi AX = B ialah X = B A⁻¹ (darab B di sebelah kiri A⁻¹)","bucketId":"salah","note":"SALAH! A⁻¹ wajib berada di sebelah KIRI B (X = A⁻¹ B); B A⁻¹ malah tidak serasi peringkatnya!"},{"text":"Pendaraban dua matriks segi empat sama 2 × 2 sentiasa memenuhi AB = BA","bucketId":"salah","note":"SALAH! Secara amnya AB ≠ BA kerana pendaraban matriks tidak kalis tukar tertib."}],"explanation":"Menguasai enam pembezaan kritikal ini menjamin anda mengelakkan hampir semua perangkap kehilangan markah dalam Kertas 1 dan Kertas 2 SPM."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s7","voiceToneLabel":"Cabaran Boss Akhir: Masalah Komisen KBAT","voiceCaption":"Cabaran Boss terakhir gaya Kertas dua K B A T: hitung bilangan fon kepala Alpha dan Beta menggunakan kaedah matriks.","voiceScript":"[excited] Inilah ujian kemuncak Bab dua! Sebuah kedai elektronik menjual enam puluh unit fon kepala Alpha berharga dua ratus ringgit dengan komisen lima peratus, dan fon kepala Beta berharga seratus lima puluh ringgit dengan komisen empat peratus. Jika jumlah komisen yang diperoleh ialah empat ratus empat puluh ringgit, gunakan kaedah matriks untuk mengira bilangan unit Alpha dan Beta yang terjual!","prompt":"Cabaran Boss Akhir (Kertas 2 KBAT): Sebuah kedai menjual fon kepala Alpha (RM200, komisen 5%) dan Beta (RM150, komisen 4%). Pada bulan Oktober, sejumlah 60 unit dijual dengan jumlah komisen RM440. Dengan kaedah matriks, tentukan bilangan unit Alpha (x) dan Beta (y).","stimulusHtml":"<strong>Jadual Data:</strong> Komisen seunit Alpha = 5% × RM200 = RM10; Komisen seunit Beta = 4% × RM150 = RM6. Persamaan: <em>x + y = 60</em> dan <em>10x + 6y = 440</em>.","options":["Alpha = 20 unit, Beta = 40 unit","Alpha = 40 unit, Beta = 20 unit","Alpha = 25 unit, Beta = 35 unit","Alpha = 15 unit, Beta = 45 unit"],"correctIndex":0,"explanation":"Bentuk matriks: [[1, 1], [10, 6]][[x], [y]] = [[60], [440]]. Penentu = 1(6) - 1(10) = -4. Maka [[x], [y]] = (1 / -4)[[6, -1], [-10, 1]][[60], [440]] = (1 / -4)[[360 - 440], [-600 + 440]] = (1 / -4)[[-80], [-160]] = [[20], [40]]. Jadi Alpha = 20 unit dan Beta = 40 unit."}]}]};</script>

    var rCount = rows.length;
    var cCount = rows[0] ? rows[0].length : 0;
    var toneCls = opts.tone ? (" is-" + opts.tone) : "";
    var cellsHtml = "";
    for (var i = 0; i < rCount; i++) {
      for (var j = 0; j < cCount; j++) {
        var extra = "";
        if (typeof opts.cellClass === "function") {
          extra = opts.cellClass(i, j, rows[i][j]) || "";
        }
        var val = rows[i][j];
        if (opts.clickable) {
          cellsHtml += '<button type="button" class="mat52-cell ' + extra + '" data-mat-r="' + i + '" data-mat-c="' + j + '"' +
            (opts.idAttr ? (' data-mat-id="' + esc(opts.idAttr) + '"') : "") +
            ' aria-label="Unsur baris ' + (i + 1) + ' lajur ' + (j + 1) + ' nilai ' + esc(val) + '">' + esc(val) + "</button>";
        } else {
          cellsHtml += '<div class="mat52-cell ' + extra + '">' + esc(val) + "</div>";
        }
      }
    }
    return (
      '<div class="mat52-mat-card">' +
        (name ? ('<span class="mat52-mat-name">' + esc(name) + "</span>") : "") +
        '<div class="mat52-mat-brackets' + toneCls + '" style="grid-template-columns:repeat(' + cCount + ',minmax(44px,auto));">' +
          cellsHtml +
        "</div>" +
        '<span class="mat52-order-tag tabular-nums">' + rCount + " x " + cCount + "</span>" +
      "</div>"
    );
  }

  /* =========================================================================
     MAKMAL 1: mat52_peringkat_sama_lab
     Penguji Peringkat m x n, Indeks Unsur a_ij & Syarat Matriks Sama (M = N)
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat52_peringkat_sama_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "sama" ? "sama" : "peringkat";
    var preset = ps.preset || (tab === "sama" ? "persamaan" : "kedai");
    var selR = 1;
    var selC = 2;

    var orderPresets = {
      kedai: {
        btn: "Jualan Kipas (2x3)",
        name: "A",
        rows: [[14, 22, 19], [8, 15, 12]],
        desc: "2 baris (Di Kedai, Dalam Talian) x 3 lajur (Berdiri, Siling, Dinding) = matriks segi empat tepat."
      },
      sukan: {
        btn: "Pingat Sukan (3x3)",
        name: "B",
        rows: [[11, 6, 2], [9, 4, 5], [7, 8, 10]],
        desc: "3 baris x 3 lajur: bilangan baris sama dengan bilangan lajur (matriks segi empat sama)."
      },
      baris: {
        btn: "Matriks Baris (1x4)",
        name: "P",
        rows: [[1600, 2100, 1950, 1750]],
        desc: "Hanya 1 baris dengan 4 lajur (1 x 4) — dikenali sebagai matriks baris."
      },
      lajur: {
        btn: "Matriks Lajur (3x1)",
        name: "Q",
        rows: [[78], [86], [71]],
        desc: "Mempunyai 3 baris dan hanya 1 lajur (3 x 1) — dikenali sebagai matriks lajur."
      }
    };

    var eqPresets = {
      sama_pecahan: {
        btn: "Pecahan = Perpuluhan",
        leftName: "G",
        left: [["0.5", "-2"], ["6", "0.8"]],
        rightName: "H",
        right: [["1/2", "-2"], ["6", "4/5"]],
        equal: true,
        reason: "Kedua-dua matriks berperingkat 2 x 2 dan setiap unsur sepadan bernilai sama (0.5 = 1/2 dan 0.8 = 4/5). Maka G = H."
      },
      peringkat_beza: {
        btn: "Peringkat Berbeza",
        leftName: "C",
        left: [[3, 9]],
        rightName: "D",
        right: [[3], [9]],
        equal: false,
        reason: "C berperingkat 1 x 2 manakala D berperingkat 2 x 1. Walaupun nombornya sama, peringkat berbeza maka C != D."
      },
      unsur_tertukar: {
        btn: "Unsur Tertukar",
        leftName: "E",
        left: [[8, 3], [-7, 0]],
        rightName: "F",
        right: [[8, -7], [3, 0]],
        equal: false,
        reason: "Peringkat sama (2 x 2), tetapi unsur sepadan tidak sama kerana e12 = 3 != f12 = -7. Maka E != F."
      },
      persamaan: {
        btn: "Cari Nilai x, y, z",
        leftName: "P",
        left: [["2x", "7"], ["-4", "9 - 2z"]],
        rightName: "Q",
        right: [["12", "y + 3"], ["-4", "z"]],
        equal: true,
        reason: "Diberi P = Q: bandingkan unsur sepadan -> 2x = 12 (x = 6), 7 = y + 3 (y = 4), dan 9 - 2z = z => 3z = 9 (z = 3)."
      }
    };

    function classifyMatrix(m, n) {
      if (m === 1 && n > 1) return "Matriks Baris";
      if (n === 1 && m > 1) return "Matriks Lajur";
      if (m === n) return "Segi Empat Sama";
      return "Segi Empat Tepat";
    }

    function render() {
      var tabHtml =
        '<div class="lab-controls">' +
          '<button type="button" class="lab-seg-btn" data-m52-tab="peringkat" aria-pressed="' + (tab === "peringkat") + '">Peringkat m x n &amp; Unsur a_ij</button>' +
          '<button type="button" class="lab-seg-btn" data-m52-tab="sama" aria-pressed="' + (tab === "sama") + '">Penguji Matriks Sama (M = N)</button>' +
        "</div>";

      if (tab === "peringkat") {
        var p = orderPresets[preset] || orderPresets.kedai;
        var m = p.rows.length;
        var n = p.rows[0].length;
        if (selR >= m) selR = 0;
        if (selC >= n) selC = 0;
        var val = p.rows[selR][selC];
        var lowName = p.name.toLowerCase();

        var preBtns = Object.keys(orderPresets).map(function (k) {
          return '<button type="button" class="lab-tokoh-pill" data-m52-pre="' + k + '" aria-pressed="' + (preset === k) + '">' + esc(orderPresets[k].btn) + "</button>";
        }).join("");

        var matHtml = renderHtmlMatrix("Matriks " + p.name, p.rows, {
          clickable: true,
          cellClass: function (i, j) {
            if (i === selR && j === selC) return "is-hit";
            if (i === selR) return "is-row";
            if (j === selC) return "is-col";
            return "";
          }
        });

        shell.innerHTML =
          tabHtml +
          '<div class="lab-tokoh-pills">' + preBtns + "</div>" +
          '<div class="mat52-mat-stage">' + matHtml + "</div>" +
          '<div class="lab-readout-grid">' +
            '<div class="lab-meter"><span class="lab-meter-label">Peringkat (Baris x Lajur)</span><strong class="lab-meter-val tabular-nums">' + m + " x " + n + "</strong></div>" +
            '<div class="lab-meter"><span class="lab-meter-label">Jenis Matriks</span><strong class="lab-meter-val">' + classifyMatrix(m, n) + "</strong></div>" +
            '<div class="lab-meter"><span class="lab-meter-label">Unsur Terpilih</span><strong class="lab-meter-val tabular-nums">' + lowName + (selR + 1) + (selC + 1) + " = " + esc(val) + "</strong></div>" +
            '<div class="lab-meter"><span class="lab-meter-label">Kedudukan Tepat</span><strong class="lab-meter-val tabular-nums">Baris ' + (selR + 1) + ", Lajur " + (selC + 1) + "</strong></div>" +
          "</div>" +
          '<div class="lab-callout"><strong>Panduan Ketik Sel:</strong> Klik mana-mana nombor dalam matriks di atas untuk menyemak indeks <strong>' + lowName + "_ij</strong> (biru = baris ke-" + (selR + 1) + ", jingga = lajur ke-" + (selC + 1) + "). " + esc(p.desc) + "</div>";

        shell.querySelectorAll("[data-m52-pre]").forEach(function (b) {
          b.addEventListener("click", function () {
            preset = b.getAttribute("data-m52-pre");
            selR = 0;
            selC = 0;
            playSfx("paper");
            ctx.markInteracted();
            render();
          });
        });
        shell.querySelectorAll("[data-mat-r]").forEach(function (cell) {
          cell.addEventListener("click", function () {
            selR = Number(cell.getAttribute("data-mat-r"));
            selC = Number(cell.getAttribute("data-mat-c"));
            playSfx("tick");
            ctx.markInteracted();
            render();
          });
        });
      } else {
        var ep = eqPresets[preset] || eqPresets.persamaan;
        var eqBtns = Object.keys(eqPresets).map(function (k) {
          return '<button type="button" class="lab-tokoh-pill" data-m52-ep="' + k + '" aria-pressed="' + (preset === k) + '">' + esc(eqPresets[k].btn) + "</button>";
        }).join("");

        var leftHtml = renderHtmlMatrix("Matriks " + ep.leftName, ep.left, { tone: ep.equal ? "emerald" : "amber" });
        var rightHtml = renderHtmlMatrix("Matriks " + ep.rightName, ep.right, { tone: ep.equal ? "emerald" : "danger" });
        var eqSign = ep.equal ? "=" : "!=";

        shell.innerHTML =
          tabHtml +
          '<div class="lab-tokoh-pills">' + eqBtns + "</div>" +
          '<div class="mat52-mat-stage">' +
            leftHtml +
            '<span class="mat52-op-sym">' + eqSign + "</span>" +
            rightHtml +
          "</div>" +
          '<div class="lab-callout">' +
            '<span class="mat52-pill ' + (ep.equal ? "is-ok" : "is-bad") + '">' + (ep.equal ? "MATRIKS SAMA (SAH)" : "TIDAK SAMA") + "</span> " +
            esc(ep.reason) +
          "</div>";

        shell.querySelectorAll("[data-m52-ep]").forEach(function (b) {
          b.addEventListener("click", function () {
            preset = b.getAttribute("data-m52-ep");
            playSfx("snap");
            ctx.markInteracted();
            render();
          });
        });
      }

      shell.querySelectorAll("[data-m52-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          tab = b.getAttribute("data-m52-tab");
          preset = tab === "sama" ? "persamaan" : "kedai";
          playSfx("paper");
          ctx.markInteracted();
          render();
        });
      });
    }

    render();
  };

  /* =========================================================================
     MAKMAL 2: mat52_tambah_skalar_lab
     Tambah & Tolak Matriks (Peringkat Sama) + Pendaraban Skalar kA & Persamaan
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat52_tambah_skalar_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "skalar" ? "skalar" : "tambah";
    var preset = ps.preset || (tab === "skalar" ? "teroka" : "stok");
    var op = ps.op === "-" ? "-" : "+";
    var scalarK = 2;
    var activeR = 0;
    var activeC = 0;

    var addPresets = {
      stok: {
        btn: "Stok Kedai (2x3)",
        same: true,
        A: [[18, 12, 9], [7, 14, 6]],
        B: [[11, 5, 4], [3, 9, 8]],
        note: "Kedua-dua matriks berperingkat 2 x 3. Tambah atau tolak setiap unsur pada kedudukan baris-lajur yang sepadan."
      },
      keuntungan: {
        btn: "Untung Bersih (2x2)",
        same: true,
        A: [[2400, 1850], [1600, 950]],
        B: [[900, 720], [580, 310]],
        note: "Keuntungan = Hasil Jualan (A) - Perbelanjaan (B) untuk setiap kategori."
      },
      tak_sah: {
        btn: "Perangkap Peringkat",
        same: false,
        A: [[5, -2, 8], [1, 4, 0]],
        B: [[3, 7], [-1, 6]],
        note: "Peringkat A ialah 2 x 3 manakala peringkat B ialah 2 x 2. Operasi tambah/tolak TIDAK BOLEH dijalankan!"
      }
    };

    var scalarOptions = [-2, -0.5, 0, 2, 3, 4];
    var baseScalarA = [[-4, 6], [2, -8]];

    function render() {
      var tabHtml =
        '<div class="lab-controls">' +
          '<button type="button" class="lab-seg-btn" data-m52t-tab="tambah" aria-pressed="' + (tab === "tambah") + '">Tambah &amp; Tolak (A +/- B)</button>' +
          '<button type="button" class="lab-seg-btn" data-m52t-tab="skalar" aria-pressed="' + (tab === "skalar") + '">Pendaraban Skalar &amp; Persamaan</button>' +
        "</div>";

      if (tab === "tambah") {
        var ap = addPresets[preset] || addPresets.stok;
        var preBtns = Object.keys(addPresets).map(function (k) {
          return '<button type="button" class="lab-tokoh-pill" data-m52t-pre="' + k + '" aria-pressed="' + (preset === k) + '">' + esc(addPresets[k].btn) + "</button>";
        }).join("");

        var opBtns =
          '<div class="lab-controls">' +
            '<button type="button" class="lab-seg-btn" data-m52t-op="+" aria-pressed="' + (op === "+") + '">Operasi: Tambah (+)</button>' +
            '<button type="button" class="lab-seg-btn" data-m52t-op="-" aria-pressed="' + (op === "-") + '">Operasi: Tolak (-)</button>' +
          "</div>";

        var resultHtml = "";
        var formulaStep = ap.note;
        if (ap.same) {
          var rowsOut = [];
          for (var i = 0; i < ap.A.length; i++) {
            var rRow = [];
            for (var j = 0; j < ap.A[0].length; j++) {
              rRow.push(op === "+" ? (ap.A[i][j] + ap.B[i][j]) : (ap.A[i][j] - ap.B[i][j]));
            }
            rowsOut.push(rRow);
          }
          if (activeR >= ap.A.length) activeR = 0;
          if (activeC >= ap.A[0].length) activeC = 0;
          var aVal = ap.A[activeR][activeC];
          var bVal = ap.B[activeR][activeC];
          var resVal = rowsOut[activeR][activeC];
          formulaStep = "Unsur c" + (activeR + 1) + (activeC + 1) + " = " + aVal + " " + op + " (" + bVal + ") = " + resVal + ". " + ap.note;

          var markActive = function (i, j) { return (i === activeR && j === activeC) ? "is-hit" : ""; };
          resultHtml =
            '<div class="mat52-mat-stage">' +
              renderHtmlMatrix("A", ap.A, { clickable: true, cellClass: markActive }) +
              '<span class="mat52-op-sym">' + op + "</span>" +
              renderHtmlMatrix("B", ap.B, { clickable: true, cellClass: markActive }) +
              '<span class="mat52-op-sym">=</span>' +
              renderHtmlMatrix("Hasil", rowsOut, { clickable: true, tone: "emerald", cellClass: markActive }) +
            "</div>";
        } else {
          resultHtml =
            '<div class="mat52-mat-stage">' +
              renderHtmlMatrix("A", ap.A, { tone: "amber" }) +
              '<span class="mat52-op-sym">' + op + "</span>" +
              renderHtmlMatrix("B", ap.B, { tone: "danger" }) +
              '<span class="mat52-op-sym">!=</span>' +
              '<div class="mat52-panel" style="background:#450a0a;color:#fecaca;border-color:#f87171;"><strong>TIDAK SAH!</strong><br>2 x 3 berbeza dengan 2 x 2</div>' +
            "</div>";
        }

        shell.innerHTML =
          tabHtml +
          '<div class="lab-tokoh-pills">' + preBtns + "</div>" +
          opBtns +
          resultHtml +
          '<div class="lab-callout">' +
            '<span class="mat52-pill ' + (ap.same ? "is-ok" : "is-bad") + '">' + (ap.same ? "PERINGKAT SAMA" : "PERINGKAT BERBEZA") + "</span> " +
            esc(formulaStep) +
          "</div>";

        shell.querySelectorAll("[data-m52t-pre]").forEach(function (b) {
          b.addEventListener("click", function () {
            preset = b.getAttribute("data-m52t-pre");
            activeR = 0;
            activeC = 0;
            playSfx("paper");
            ctx.markInteracted();
            render();
          });
        });
        shell.querySelectorAll("[data-m52t-op]").forEach(function (b) {
          b.addEventListener("click", function () {
            op = b.getAttribute("data-m52t-op");
            playSfx("snap");
            ctx.markInteracted();
            render();
          });
        });
        shell.querySelectorAll("[data-mat-r]").forEach(function (cell) {
          cell.addEventListener("click", function () {
            activeR = Number(cell.getAttribute("data-mat-r"));
            activeC = Number(cell.getAttribute("data-mat-c"));
            playSfx("tick");
            ctx.markInteracted();
            render();
          });
        });
      } else {
        var modeBtns =
          '<div class="lab-tokoh-pills">' +
            '<button type="button" class="lab-tokoh-pill" data-m52s-mode="teroka" aria-pressed="' + (preset !== "persamaan") + '">Pendaraban Skalar k x A</button>' +
            '<button type="button" class="lab-tokoh-pill" data-m52s-mode="persamaan" aria-pressed="' + (preset === "persamaan") + '">Persamaan Skalar: 3R + A = B</button>' +
          "</div>";

        if (preset === "persamaan") {
          var matA = [[7, -2], [4, 5]];
          var matB = [[1, 10], [-2, 14]];
          var matDiff = [[-6, 12], [-6, 9]];
          var matR = [[-2, 4], [-2, 3]];
          shell.innerHTML =
            tabHtml +
            modeBtns +
            '<div class="mat52-mat-stage">' +
              '<span class="mat52-op-sym">3R =</span>' +
              renderHtmlMatrix("B", matB, {}) +
              '<span class="mat52-op-sym">-</span>' +
              renderHtmlMatrix("A", matA, {}) +
              '<span class="mat52-op-sym">=</span>' +
              renderHtmlMatrix("3R", matDiff, { tone: "amber" }) +
              '<span class="mat52-op-sym">=&gt; R =</span>' +
              renderHtmlMatrix("1/3 (B - A)", matR, { tone: "emerald" }) +
            "</div>" +
            '<div class="lab-callout"><strong>Langkah Selesai Persamaan Matriks:</strong> Tolak A dari B dahulu untuk mendapat 3R = [[-6, 12], [-6, 9]]. Kemudian darabkan setiap unsur dengan skalar <strong>1/3</strong> (bahagi 3), menghasilkan R = [[-2, 4], [-2, 3]].</div>';
        } else {
          var kBtns = scalarOptions.map(function (kv) {
            var lbl = kv === -0.5 ? "-1/2" : String(kv);
            return '<button type="button" class="lab-seg-btn" data-m52s-k="' + kv + '" aria-pressed="' + (scalarK === kv) + '">k = ' + lbl + "</button>";
          }).join("");

          var scaledRows = baseScalarA.map(function (r) {
            return r.map(function (v) { return fmtScalar(scalarK * v); });
          });
          var kLabel = scalarK === -0.5 ? "-1/2" : String(scalarK);

          shell.innerHTML =
            tabHtml +
            modeBtns +
            '<div class="lab-controls">' + kBtns + "</div>" +
            '<div class="mat52-mat-stage">' +
              '<span class="mat52-op-sym">' + esc(kLabel) + " x</span>" +
              renderHtmlMatrix("Matriks A", baseScalarA, {}) +
              '<span class="mat52-op-sym">=</span>' +
              renderHtmlMatrix("Hasil " + kLabel + "A", scaledRows, { tone: "emerald" }) +
            "</div>" +
            '<div class="lab-callout"><strong>Rumus Pendaraban Skalar:</strong> Setiap unsur dalam A didarabkan dengan <strong>' + esc(kLabel) + "</strong> (contoh: a11 menjadi " + esc(kLabel) + " x (-4) = " + fmtScalar(scalarK * -4) + "). Jika k = 0, terhasillah Matriks Sifar O.</div>";

          shell.querySelectorAll("[data-m52s-k]").forEach(function (b) {
            b.addEventListener("click", function () {
              scalarK = Number(b.getAttribute("data-m52s-k"));
              playSfx("snap");
              ctx.markInteracted();
              render();
            });
          });
        }

        shell.querySelectorAll("[data-m52s-mode]").forEach(function (b) {
          b.addEventListener("click", function () {
            preset = b.getAttribute("data-m52s-mode");
            playSfx("paper");
            ctx.markInteracted();
            render();
          });
        });
      }

      shell.querySelectorAll("[data-m52t-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          tab = b.getAttribute("data-m52t-tab");
          preset = tab === "skalar" ? "teroka" : "stok";
          playSfx("paper");
          ctx.markInteracted();
          render();
        });
      });
    }

    render();
  };

          '<button type="button" class="wf-flip-card' + (isOn ? " is-flipped" : "") + '" data-m52-flip="' + cd.id + '" aria-pressed="' + isOn + '">' +
            '<div class="wf-flip-inner">' +
              '<div class="wf-flip-face wf-flip-front ' + cd.tone + '">' +

              "</div>" +
              '<div class="wf-flip-face wf-flip-back">' +
                '<div class="wf-flip-num">' + esc(cd.num) + " • NOTA SPM</div>" +
                "<p>" + esc(cd.back) + "</p>" +
              "</div>" +
            "</div>" +
          "</button>"
        );
      }).join("");

      shell.innerHTML =
        '<div class="wf-flip-stage mat52-flip-deck">' +
          '<div class="lab-arcade-bar">' +
            '<span class="lab-title-pill">Ketik Kad 3D untuk Semak 6 Hukum &amp; Perangkap Matriks</span>' +
            '<span class="lab-arcade-score tabular-nums">Terbuka: ' + openCount + "/6</span>" +
          "</div>" +
          '<div class="wf-flip-grid">' + deckHtml + "</div>" +
        "</div>" +
        '<div class="lab-callout"><strong>Ringkasan Emas Mobilisasi Minda:</strong> Penambahan mematuhi <em>tiga</em> hukum (Tukar Tertib, Agihan, Sekutuan), penolakan hanya mematuhi <em>Hukum Agihan</em>, manakala pendaraban matriks secara amnya <strong>tidak kalis tukar tertib (AB != BA)</strong>.</div>';

      shell.querySelectorAll("[data-m52-flip]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-m52-flip");
          flipped[id] = !flipped[id];
          playSfx("paper");
          ctx.markInteracted();
          var nowOpen = Object.keys(flipped).filter(function (k) { return flipped[k]; }).length;
          if (!bonusGiven && nowOpen >= 6 && typeof ctx.awardMiniGameXp === "function") {
            bonusGiven = true;
            ctx.awardMiniGameXp(5, btn, "Semua 6 Kad Hukum Dikuasai!");
          }
          render();
        });
      });
    }

    render();
  };

  /* =========================================================================
     MAKMAL 4: mat52_darab_matriks_step_lab
     Penguji Keserasian (m x n)(n x p) & Animator Baris x Lajur Langkah Demi Langkah
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat52_darab_matriks_step_lab = function (shell, ctx) {

    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};

    var dimM = 2, dimN = 3, dimP = 3, dimQ = 1;
    var stepIdx = 0;

    if (preset === "songsang_tak") {
      dimM = 2; dimN = 1; dimP = 2; dimQ = 2;

    }

    var multPresets = {
