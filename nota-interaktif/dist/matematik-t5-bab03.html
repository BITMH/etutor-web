  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t5-bab03","subject":"Matematik","subjectGroup":"teras","form":5,"chapterNumber":3,"title":"Matematik Pengguna: Insurans","subtitle":"Subtopik 3.1 KSSM (34 Langkah Bit-by-Bit) — Konsep Risiko, Akta Insurans 1996, Prinsip Indemniti, Insurans Hayat vs 5 Insurans Am & Berkelompok, Tarif Motor 2015 + NCD, Deduktibel & Ko-Insurans Harta/Kesihatan.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t5-bab03-labs.js","coverIcon":"../assets/icons/mat53-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Pengiraan risiko dan analisis polisi insurans kamu amat mantap!","combo":"[laughs warmly] Kombo yang hebat! Kemahiran Matematik Pengguna kamu terus menyala!","encourage":"[encouraging] Hampir tepat! Cuba semak semula urutan deduktibel, jadual tarif atau peratusan ko-insurans ya.","celebrate":"[excited] Tahniah! Kamu telah berjaya menakluki unit Matematik Pengguna Insurans dengan cemerlang!"},"units":[{"id":"mat53-u1","title":"Unit 1: Konsep Risiko, Akta Insurans & Prinsip Indemniti","subtitle":"Subtopik 3.1 (Bhg. A) — 2 Elemen Risiko, Kawal Selia BNM (Akta Insurans 1996), Aktuari & Pemulihan Kewangan","iconType":"scale","iconUrl":"../assets/icons/mat53-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Risiko, BNM & Kerjaya Aktuari","voiceCaption":"Risiko ialah kemungkinan musibah yang tidak dapat dielakkan; Bank Negara Malaysia mengawal selia industri insurans bawah Akta Insurans 1996.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan lima Bab tiga, Matematik Pengguna Insurans! Tonton video penerangan bersuara ini dahulu untuk memahami keseluruhan konsep bab. [pause] Dalam kehidupan seharian, kemalangan, kebakaran atau bil rawatan mengejut sentiasa membawa risiko, iaitu kemungkinan musibah yang tidak dapat ditentukan dan melibatkan kerugian. Di Malaysia, industri insurans dikawal selia oleh Bank Negara Malaysia di bawah Akta Insurans seribu sembilan ratus sembilan puluh enam, manakala pakar matematik risiko yang menghitung kadar premium digelar aktuari!","title":"Makna Risiko, Kawal Selia BNM & Peranan Aktuari","acronym":"R•K•A","hook":"Walaupun kita berhati-hati, risiko kemalangan atau sakit masih wujud — insurans tidak menghalang musibah, tetapi menjadi perisai kewangan apabila ia berlaku!","mediaKey":"mat53_risiko_aktuari","videoClip":{"src":"../assets/matematik-t5-bab03/video/mat53_video_insurans_narasi.mp4","hasNarration":true,"posterKey":"mat53_video_poster","caption":"Video Penerangan Bersuara: Pengurusan Risiko, Insurans Hayat vs Am & Prinsip Indemniti"},"summary":"Risiko ialah kemungkinan berlakunya musibah tidak dapat dielakkan yang mendatangkan kerugian kewangan kepada individu, keluarga atau harta benda.","bullets":["2 Elemen Risiko & Kawal Selia: Sesuatu kejadian dikira berisiko apabila (i) tidak dapat ditentukan sama ada berlaku atau tidak, dan (ii) melibatkan kerugian wang ringgit. Di Malaysia, Bank Negara Malaysia (BNM) mengawal selia industri ini bawah Akta Insurans 1996 (menggantikan Akta Insurans 1963).","Kerjaya Aktuari & Kesedaran Perlindungan: Pakar aktuari mengira kebarangkalian risiko bagi menetapkan kadar premium polisi serta kadar anuiti syarikat insurans. Data BNM menunjukkan sekitar 41% rakyat Malaysia memiliki sekurang-kurangnya satu polisi berbanding sasaran melebihi 75%."],"examTip":"Untuk soalan definisi Kertas 2, nyatakan dua elemen teras risiko: ketidakpastian kejadian (tidak dapat ditentukan) serta implikasi kerugian kewangan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Risiko & Peranan Insurans","voiceCaption":"Kelaskan situasi berikut antara risiko kerugian tidak disengajakan yang boleh dipindahkan berbanding situasi luar skop atau salah faham insurans.","voiceScript":"[curious] Mari uji pemahaman awal kamu! Asingkan enam situasi ini kepada kategori Risiko Boleh Diinsuranskan atau Salah Faham dan Bukan Risiko Insurans.","prompt":"Isihkan enam pernyataan berikut mengikut sifat risiko dan perlindungan insurans:","buckets":[{"id":"risiko","label":"Risiko Kerugian Boleh Diinsuranskan"},{"id":"bukan","label":"Salah Faham / Bukan Risiko Insurans"}],"items":[{"text":"Kerosakan bangunan kedai akibat kebakaran tidak disengajakan atau sambaran kilat","bucketId":"risiko","note":"Kejadian luar jangka yang menyebabkan kerugian harta"},{"text":"Membeli polisi insurans supaya kemalangan jalan raya tidak akan berlaku selama-lamanya","bucketId":"bukan","note":"Insurans mengurangkan beban kewangan, bukan menghalang kemalangan berlaku"},{"text":"Bil pembedahan dan rawatan hospital yang melambung tinggi akibat penyakit kritikal","bucketId":"risiko","note":"Ketidakpastian kesihatan melibatkan beban kos rawatan besar"},{"text":"Kecederaan semasa menyertai perlawanan sukan sekolah atau perjalanan ke sekolah","bucketId":"risiko","note":"Murid juga terdedah kepada risiko kemalangan diri"},{"text":"Mengharapkan keuntungan wang tunai berlipat ganda apabila membuat tuntutan kereta","bucketId":"bukan","note":"Melanggar prinsip indemniti yang melarang keuntungan daripada polisi"},{"text":"Kehilangan beg pakaian serta pasport semasa penerbangan ke luar negara","bucketId":"risiko","note":"Kerugian perjalanan yang dilindungi insurans perjalanan"}],"explanation":"Insurans memindahkan beban kewangan akibat kejadian luar jangka yang membawa kerugian, namun tidak menghalang musibah dan tidak membenarkan keuntungan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Kontrak & Prinsip Indemniti","voiceCaption":"Kontrak insurans memindahkan risiko kepada syarikat insurans dengan bayaran premium; prinsip indemniti memulihkan kedudukan kewangan tanpa mengaut untung.","voiceScript":"[warm] Sekarang teliti kad konsep kedua mengenai kontrak insurans dan prinsip indemniti! Dalam kontrak insurans, pemegang polisi membayar premium supaya syarikat insurans menanggung pampasan kerugian yang dilindungi. [serious] Ingat peraturan emas ini: di bawah prinsip indemniti, bayaran ganti rugi hanyalah setakat kerugian sebenar bagi memulihkan kedudukan kewangan seperti sediakala. Pemegang polisi tidak dibenarkan membuat keuntungan, dan jika tiada kerugian berlaku, tiada pampasan dibayar! Ketik kad tiga dimensi di bawah untuk ulang kaji pantas.","title":"Kontrak Pemindahan Risiko, Premium & Prinsip Indemniti","acronym":"P•I•P","hook":"Jika rumah rosak RM18,000 tetapi had polisi ialah RM80,000, mengapakah anda tidak menerima RM80,000 penuh? Jawapannya ialah Prinsip Indemniti!","mediaKey":"mat53_prinsip_indemniti","summary":"Insurans memindahkan risiko kewangan individu kepada syarikat insurans sebagai balasan kepada bayaran premium mengikut syarat kontrak polisi.","bullets":["Pihak Kontrak & Premium: Pemegang polisi memeterai kontrak dengan syarikat insurans dengan membayar premium berkala atau sekaligus; sebagai balasan, syarikat membayar pampasan mengikut had perlindungan polisi jika musibah berlaku.","Prinsip Indemniti (Pulih Tanpa Untung): Jumlah ganti rugi dibayar hanya setakat kerugian sebenar bagi memulihkan kedudukan kewangan pemegang polisi kepada keadaan sebelum kerugian berlaku. Tiada keuntungan dibenarkan dan tiada bayaran diberi jika tiada kerugian."],"labId":"mat53_polisi_insurans_flip","labTitle":"Dek Kad 3D: Prinsip Asas, Akta 1996 & TPSM","labProps":{"tab":"prinsip"},"examTip":"Apabila soalan bertanya mengapa pampasan tidak melebihi nilai kerosakan sebenar, kaitkan terus dengan 'prinsip indemniti — memulihkan kedudukan kewangan tanpa keuntungan'."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Pampasan Indemniti","voiceCaption":"Ramalkan jumlah bayaran ganti rugi yang layak diterima oleh Farhana apabila dapur premisnya mengalami kerugian RM18,000.","voiceScript":"[curious] Uji ramalan kamu! Farhana membeli polisi perlindungan harta bernilai lapan puluh ribu ringgit. Tiba-tiba, ribut merosakkan bahagian dapur premisnya dengan kerugian disahkan sebanyak lapan belas ribu ringgit tanpa deduktibel. Berapakah pampasan sebenar yang akan dibayar oleh syarikat insurans?","hook":"Sahkan huraian Prinsip Indemniti pada kad 3D sebaik sahaja anda memilih jawapan!","scenario":"Farhana memegang polisi perlindungan harta dengan had perlindungan RM80,000 (tiada deduktibel). Satu kerosakan ribut menyebabkan kerugian sebenar bernilai RM18,000.","prompt":"Berapakah bayaran ganti rugi maksimum yang akan diterima oleh Farhana?","options":["RM18,000 sahaja — mengikut prinsip indemniti, pampasan memulihkan kerugian sebenar tanpa keuntungan","RM80,000 penuh mengikut had perlindungan yang tercatat dalam kontrak polisi","RM98,000 iaitu gabungan had polisi dan kos baik pulih dapur","RM9,000 kerana separuh daripada kerugian sentiasa ditanggung pemilik"],"correctIndex":0,"proofLabId":"mat53_polisi_insurans_flip","proofState":{"tab":"prinsip","focusId":"fc_indemniti"},"explanation":"Prinsip indemniti menetapkan pampasan hanyalah setakat jumlah kerugian sebenar (RM18,000) untuk memulihkan kedudukan kewangan seperti sebelum kerugian, bukan nilai penuh had polisi RM80,000."},{"type":"match","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Padan Gerbang Istilah Bab 3","voiceCaption":"Padankan lima istilah utama pengurusan risiko insurans dengan takrifannya yang tepat.","voiceScript":"[confident] Pastikan penguasaan Gerbang Istilah Bab tiga kamu mantap! Padankan lima istilah berikut dengan penerangannya yang paling tepat.","prompt":"Padankan setiap istilah asas insurans dengan huraiannya:","pairs":[{"id":"u1m1","left":"Premium","right":"Bayaran oleh pemegang polisi sebagai balasan mendapatkan perlindungan"},{"id":"u1m2","left":"Aktuari","right":"Pakar mengurus dan menghitung risiko dalam menentukan kadar premium"},{"id":"u1m3","left":"Prinsip Indemniti","right":"Prinsip memulihkan kedudukan kewangan tanpa memberi keuntungan"},{"id":"u1m4","left":"Akta Insurans 1996","right":"Perundangan utama di bawah kawal selia Bank Negara Malaysia"},{"id":"u1m5","left":"Polisi","right":"Dokumen kontrak bertulis yang menyatakan syarat dan had perlindungan"}],"explanation":"Lima istilah teras ini wajib difahami sebelum membuat pengiraan premium, deduktibel dan ko-insurans."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Bina Pernyataan Indemniti","voiceCaption":"Susun blok perkataan bagi membina definisi tepat Prinsip Indemniti untuk jawapan Kertas dua SPM.","voiceScript":"[warm] Latih kemahiran menulis ayat matematik pengguna untuk Kertas dua! Susun blok ayat berikut menjadi definisi lengkap prinsip indemniti.","prompt":"Susun blok frasa berikut bagi melengkapkan huraian prinsip indemniti:","hint":"Mulakan dengan tujuan memulihkan kedudukan kewangan dan akhiri dengan larangan mengaut keuntungan...","answerTokens":["Prinsip indemniti memulihkan","kedudukan kewangan pemegang polisi","kepada keadaan sebelum kerugian","tanpa membenarkan keuntungan diperoleh"],"distractors":["dengan menggandakan nilai pampasan","walaupun tiada kerugian berlaku"],"explanation":"Setiap jawapan berfokus prinsip indemniti mesti menekankan pemulihan kewangan kepada keadaan asal sebelum kerugian dan larangan memperoleh keuntungan."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Semak Konsep Unit 1","voiceCaption":"Kenal pasti syarikat insurans, pemegang polisi, had perlindungan serta risiko dalam satu situasi kontrak baharu.","voiceScript":"[excited] Soalan terakhir Unit satu! Encik Johan membeli polisi kemalangan daripada Syarikat Insurans Amanah dengan had perlindungan dua ratus lima puluh ribu ringgit dan bayaran seratus dua puluh ringgit sebulan. Manakah padanan butiran kontrak yang paling tepat?","stimulusHtml":"<div class='stimulus-note'><strong>Situasi Kontrak:</strong> Encik Johan membayar RM120 sebulan kepada Syarikat Insurans Amanah untuk perlindungan kemalangan bernilai RM250,000.</div>","prompt":"Manakah padanan maklumat kontrak insurans Encik Johan yang TEPAT?","options":["Syarikat insurans: Syarikat Insurans Amanah | Pemegang polisi: Encik Johan | Had perlindungan: RM250,000 | Premium bulanan: RM120","Syarikat insurans: Encik Johan | Pemegang polisi: Syarikat Insurans Amanah | Had perlindungan: RM120 | Premium: RM250,000","Syarikat insurans: Bank Negara Malaysia | Pemegang polisi: Encik Johan | Deduktibel wajib: RM250,000","Had perlindungan: RM1,440 | Premium bulanan: RM250,000 | Risiko: Keuntungan perniagaan"],"correctIndex":0,"explanation":"Syarikat Insurans Amanah bertindak sebagai penanggung insurans, Encik Johan ialah pemegang polisi, RM250,000 ialah had perlindungan (nilai muka), dan RM120 ialah premium bulanan bagi risiko kemalangan."}]},{"id":"mat53-u2","title":"Unit 2: Insurans Hayat vs Insurans Am & Polisi Motor","subtitle":"Subtopik 3.1 (Bhg. B) — Hayat, 5 Jenis Insurans Am, Berkelompok (TPSM) & Matriks 4 Polisi Motor","iconType":"book","iconUrl":"../assets/icons/mat53-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Insurans Hayat vs 5 Insurans Am","voiceCaption":"Insurans terbahagi kepada dua cabang utama iaitu insurans hayat dan insurans am yang merangkumi lima kategori serta insurans berkelompok.","voiceScript":"[warm] Mari bezakan dua cabang utama perlindungan kewangan: Insurans Hayat dan Insurans Am! Insurans hayat melindungi tanggungan keluarga sekiranya berlaku kematian serta memberi pampasan jika pemegang polisi mengalami hilang upaya menyeluruh dan kekal. [confident] Sebaliknya, insurans am yang lazimnya berjangka setahun atau kurang melindungi harta benda dan risiko lain melalui lima polisi: motor, kebakaran, perubatan dan kesihatan, kemalangan diri serta perjalanan! Jangan lupa juga skim berkelompok seperti Takaful Pelajar Sekolah Malaysia atau T P S M untuk murid sekolah!","title":"Insurans Hayat, 5 Kategori Insurans Am & Skim Berkelompok (TPSM)","acronym":"M•K•P•K•P","hook":"Insurans kemalangan diri BERBEZA daripada insurans hayat dan insurans perubatan — ia melindungi kecederaan atau kematian berpunca langsung daripada kemalangan!","mediaKey":"mat53_hayat_perubatan","summary":"Insurans terbahagi kepada insurans hayat (kematian & hilang upaya kekal menyeluruh) dan insurans am (5 jenis perlindungan lazimnya bertempoh <= 1 tahun) serta insurans berkelompok.","bullets":["Insurans Hayat vs Kemalangan Diri vs Perubatan: Insurans hayat melindungi risiko kematian dan hilang upaya menyeluruh dan kekal. Insurans perubatan meliputi 4 pelan (hospital & pembedahan, penyakit kritikal, pendapatan hilang upaya, pendapatan hospital). Insurans kemalangan diri melindungi kecederaan/kematian terus akibat kemalangan dengan premium mengikut Kelas Pekerjaan 1 (pejabat), Kelas 2 (separa bahaya) dan Kelas 3 (jentera/manual — paling mahal).","Kebakaran, Perjalanan & Berkelompok (TPSM): Insurans kebakaran melindungi api, kilat dan letupan (banjir, taufan, rusuhan perlukan tambahan premium). Insurans perjalanan meliputi bagasi, pasport, wang, perubatan dan kematian di darat, udara atau laut. Insurans berkelompok melindungi pekerja organisasi atau murid sekolah seperti skim Takaful Pelajar Sekolah Malaysia (TPSM) termasuk elaun kerusi roda."],"labId":"mat53_polisi_insurans_flip","labTitle":"Dek Kad 3D: Insurans Hayat & 5 Jenis Insurans Am","labProps":{"tab":"jenis"},"examTip":"Soalan Kelas Pekerjaan Kemalangan Diri: Pekerjaan Kelas 3 yang mengendalikan jentera berat sentiasa membayar premium paling tinggi kerana risiko kemalangan lebih besar berbanding Kelas 1 di pejabat."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Jenis Polisi & Risiko","voiceCaption":"Padankan lima jenis insurans berbeza berikut dengan skop perlindungan yang tepat mengikut silibus KSSM.","voiceScript":"[confident] Uji ketepatan kamu membezakan jenis-jenis insurans! Padankan lima kategori perlindungan berikut dengan risiko khusus yang dilindunginya.","prompt":"Padankan setiap jenis insurans dengan perlindungan yang tepat:","pairs":[{"id":"u2m1","left":"Insurans Kebakaran","right":"Kerugian bangunan akibat api, kilat dan letupan (+ tambahan banjir)"},{"id":"u2m2","left":"Insurans Hayat","right":"Manfaat kepada waris akibat kematian atau hilang upaya menyeluruh kekal"},{"id":"u2m3","left":"Insurans Perjalanan","right":"Kehilangan pasport, bagasi dan perubatan semasa perjalanan luar"},{"id":"u2m4","left":"Takaful Pelajar (TPSM)","right":"Skim berkelompok murid termasuk lumpuh, kecacatan dan elaun kerusi roda"},{"id":"u2m5","left":"Insurans Kemalangan Diri","right":"Kecederaan anggota badan berpunca secara langsung daripada kemalangan"}],"explanation":"Setiap jenis insurans menangani risiko tersendiri: hayat (kematian/keilatan), kebakaran (api/kilat/letupan), perjalanan (bagasi/pasport), kemalangan diri (kemalangan) dan TPSM (murid sekolah)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"4 Polisi Motor & Perangkap JPJ","voiceCaption":"Insurans motor menawarkan empat tahap polisi iaitu Akta, Pihak Ketiga, Pihak Ketiga Kebakaran dan Kecurian, serta Komprehensif.","voiceScript":"[warm] Sekarang fokus kepada komponen paling kerap ditanya dalam peperiksaan: empat polisi insurans motor! Bermula daripada yang paling asas iaitu Polisi Akta yang hanya melindungi kecederaan dan kematian pihak ketiga, diikuti Polisi Pihak Ketiga yang menambah perlindungan harta pihak ketiga. [serious] Polisi Pihak Ketiga, Kebakaran dan Kecurian menambah perlindungan jika kereta sendiri terbakar atau dicuri. Polisi Komprehensif pula menambah kerosakan kereta sendiri akibat kemalangan. Namun awas! Keempat-empat polisi motor ini tidak melindungi kecederaan pemandu dan penumpang kereta sendiri, dan kereta terpakai yang belum ditukar hak milik di J P J tidak layak menuntut pampasan!","title":"Insurans Motor: 4 Polisi Perlindungan & Syarat Hak Milik JPJ","acronym":"A•P3•P3KK•K","hook":"Awas perangkap SPM: Polisi Komprehensif pun TIDAK menanggung kos perubatan kecederaan pemandu atau penumpang di dalam kereta sendiri!","mediaKey":"mat53_insurans_motor","summary":"Empat jenis polisi insurans motor berbeza mengikut tahap perlindungan kepada pihak ketiga dan kenderaan sendiri, namun semuanya mengecualikan kecederaan pemandu serta penumpang sendiri.","bullets":["Hirarki 4 Polisi Motor: (1) Akta — hanya kecederaan/kematian pihak ketiga; (2) Pihak Ketiga — tambah kerosakan harta pihak ketiga; (3) Pihak Ketiga, Kebakaran & Kecurian — tambah kebakaran tidak disengajakan/kecurian kereta sendiri; (4) Komprehensif — tambah kerosakan kenderaan sendiri akibat kemalangan.","2 Syarat Kritikal Tuntutan Motor: Pertama, keempat-empat polisi tidak menanggung bil perubatan kecederaan atau kematian pemandu dan penumpang sendiri. Kedua, apabila membeli kereta terpakai, pemilik baharu mesti menukar hak milik di JPJ dan membeli polisi atas nama sendiri supaya tuntutan sah."],"labId":"mat53_polisi_insurans_flip","labTitle":"Inspektor 4 Polisi Motor & Penguji Kes Kemalangan","labProps":{"tab":"motor","policy":"komprehensif","claim":"langgar"},"examTip":"Jika soalan menyatakan tuntutan merangkumi 'kerosakan kereta pihak ketiga' DAN 'kerosakan kebakaran kereta sendiri', dua polisi layak ialah Polisi Pihak Ketiga, Kebakaran & Kecurian atau Komprehensif."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Kes Kemalangan Pihak Ketiga","voiceCaption":"Ramalkan tuntutan yang sah di bawah Polisi Pihak Ketiga apabila kereta Irfan membawa penumpang lalu melanggar kereta Cikgu Mei.","voiceScript":"[curious] Mari uji kes kemalangan jalan raya! Irfan memandu kereta berinsurans Polisi Pihak Ketiga bersama penumpang bernama Danial, lalu terbabas melanggar kereta Cikgu Mei. Kedua-dua kereta rosak dan ketiga-tiga orang tercedera. Apakah tuntutan yang boleh dibayar di bawah Polisi Pihak Ketiga Irfan?","hook":"Periksa keputusan penuh pada Inspektor 4 Polisi Motor selepas memilih jawapan!","scenario":"Irfan memegang Polisi Pihak Ketiga. Dia membawa penumpang, Danial, dan melanggar kereta Cikgu Mei sehingga kedua-dua kereta rosak serta Irfan, Danial dan Cikgu Mei cedera.","prompt":"Apakah tuntutan yang LAYAK dibayar di bawah Polisi Pihak Ketiga Irfan?","options":["Kecederaan dan kerosakan kereta Cikgu Mei (pihak ketiga) sahaja; kereta Irfan serta kos rawatan Irfan dan Danial tidak dilindungi","Kerosakan kedua-dua buah kereta serta kos rawatan Danial selaku penumpang","Kos rawatan Irfan, Danial dan Cikgu Mei tanpa kerosakan kereta","Kerosakan kereta Irfan dan kos rawatan Irfan sahaja"],"correctIndex":0,"proofLabId":"mat53_polisi_insurans_flip","proofState":{"tab":"motor","policy":"pihak3","claim":"langgar"},"explanation":"Polisi Pihak Ketiga hanya menanggung liabiliti kecederaan/kematian dan kerugian harta benda pihak ketiga (Cikgu Mei). Kerosakan kereta Irfan sendiri serta kecederaan Irfan dan penumpangnya tidak dilindungi."},{"type":"sort","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Isih Skop Tuntutan Polisi Motor","voiceCaption":"Kelaskan enam tuntutan berikut antara dilindungi oleh Polisi Komprehensif, dilindungi Polisi Akta atau tidak dilindungi mana-mana polisi motor.","voiceScript":"[confident] Asingkan enam situasi tuntutan kemalangan ini mengikut tahap perlindungan polisi motor dengan teliti!","prompt":"Isihkan enam item tuntutan berikut ke dalam kategori polisi motor yang tepat:","buckets":[{"id":"semua","label":"Dilindungi Semua (Termasuk Akta)"},{"id":"komp","label":"Hanya Polisi Komprehensif"},{"id":"tiada","label":"Tidak Dilindungi Polisi Motor"}],"items":[{"text":"Kecederaan pejalan kaki atau pemandu kereta lain (pihak ketiga) akibat kemalangan","bucketId":"semua","note":"Liabiliti kecederaan/kematian pihak ketiga wajib dalam keempat-empat polisi"},{"text":"Kerosakan bampar kereta sendiri akibat terlanggar pembahagi jalan","bucketId":"komp","note":"Kerosakan kenderaan sendiri akibat kemalangan hanya dalam Polisi Komprehensif"},{"text":"Kos pembedahan pemandu kenderaan sendiri yang cedera dalam nahas","bucketId":"tiada","note":"Pemandu sendiri tidak dilindungi oleh mana-mana polisi motor"},{"text":"Tuntutan bil hospital penumpang yang menaiki kereta pemegang polisi","bucketId":"tiada","note":"Penumpang sendiri memerlukan polisi kemalangan diri atau perubatan"},{"text":"Kematian pihak ketiga yang terlibat dalam pelanggaran jalan raya","bucketId":"semua","note":"Dilindungi dari Polisi Akta hingga Komprehensif"},{"text":"Baik pulih cermin dan badan kereta sendiri selepas kemalangan jalan raya","bucketId":"komp","note":"Eksklusif kepada Polisi Komprehensif bagi kemalangan sendiri"}],"explanation":"Hanya Polisi Komprehensif menanggung kemalangan kereta sendiri; Polisi Akta sudah memadai bagi kecederaan/kematian pihak ketiga; dan kecederaan pemandu/penumpang sendiri tidak dilindungi mana-mana polisi motor."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Bina Skop Pihak Ketiga Kebakaran & Curi","voiceCaption":"Susun blok jawapan mengenai perlindungan yang ditawarkan oleh Polisi Pihak Ketiga, Kebakaran dan Kecurian.","voiceScript":"[warm] Bina penjelasan lengkap bagi skop Polisi Pihak Ketiga, Kebakaran dan Kecurian supaya tidak tertinggal fakta penting.","prompt":"Susun blok perkataan bagi menghuraikan liputan Polisi Pihak Ketiga, Kebakaran dan Kecurian:","hint":"Gabungkan perlindungan pihak ketiga bersama kebakaran dan kecurian kenderaan sendiri...","answerTokens":["Melindungi liabiliti kecederaan dan harta","pihak ketiga serta kerugian","kenderaan sendiri akibat kebakaran","atau kecurian tanpa kemalangan sendiri"],"distractors":["termasuk kos rawatan pemandu sendiri","dan semua kemalangan kenderaan sendiri"],"explanation":"Polisi Pihak Ketiga, Kebakaran & Kecurian melindungi pihak ketiga (kecederaan & harta) dan kereta sendiri jika terbakar atau dicuri, namun tidak melindungi kerosakan kemalangan kereta sendiri."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Semak Syarat JPJ & Tambahan Kebakaran","voiceCaption":"Analisis kes tuntutan pemilik kereta terpakai yang belum menukar hak milik di J P J.","voiceScript":"[curious] Soalan pengukuhan Unit dua! Kavita membeli sebuah kereta terpakai daripada sepupunya tanpa menukar nama hak milik di J P J dan tanpa membeli polisi baharu kerana polisi lama masih aktif. Apabila kereta itu rosak terlanggar pokok, adakah Kavita boleh menuntut daripada syarikat insurans?","stimulusHtml":"<div class='stimulus-note'><strong>Kes Kereta Terpakai:</strong> Kavita membeli kereta daripada sepupunya namun tidak menukar hak milik di Jabatan Pengangkutan Jalan (JPJ) dan hanya bergantung pada polisi aktif atas nama pemilik asal.</div>","prompt":"Adakah Kavita boleh menuntut pampasan kerosakan kemalangan tersebut?","options":["Tidak boleh, kerana hak milik JPJ belum ditukar ke nama Kavita dan tiada polisi sah atas namanya sebagai pemegang polisi","Boleh menuntut sepenuhnya asalkan polisi lama belum tamat tempoh enam bulan","Boleh menuntut separuh daripada nilai kerosakan dengan kebenaran sepupunya","Boleh menuntut di bawah Polisi Akta kerana setiap kenderaan berenjin dilindungi automatik"],"correctIndex":0,"explanation":"Tuntutan ditolak kerana kontrak insurans hanya sah atas nama pemilik berdaftar dalam polisi. Selepas membeli kenderaan terpakai, hak milik JPJ mesti ditukar dan polisi motor baharu perlu dibeli atas nama pemilik baharu."}]},{"id":"mat53-u3","title":"Unit 3: Pengiraan Premium Hayat, Perjalanan & Tarif Motor","subtitle":"Subtopik 3.1 (Bhg. C) — Rumus Nilai Muka/RMx, Rider Kritikal, Tarif Motor 2015 (Semenanjung vs S&S) & NCD","iconType":"formula","iconUrl":"../assets/icons/mat53-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Formula Premium Hayat & Perjalanan","voiceCaption":"Premium insurans hayat dikira dengan membahagikan nilai muka kepada R M x lalu mendarab kadar premium berdasarkan umur, jantina dan status merokok.","voiceScript":"[warm] Mari beralih kepada kemahiran mengira premium insurans! Bagi insurans hayat, bayaran premium bergantung kepada empat faktor iaitu nilai muka polisi, umur, jantina dan status merokok. Mengapakah kadar meningkat apabila umur bertambah? Kerana jangka hayat semakin pendek! Mengapa perokok lebih mahal? Kerana risiko penyakitnya lebih tinggi! [confident] Gunakan formula Premium sama dengan Nilai muka dibahagi R M seribu, lalu didarab dengan kadar premium. Jika ada pelan tambahan penyakit kritikal, hitung nilai mukanya mengikut peratusan yang diberi dan jumlahkan kedua-duanya! Cuba ubah pelaras pada kalkulator makmal!","title":"Pengiraan Premium Hayat (+ Rider Kritikal) & Insurans Perjalanan","acronym":"N•U•J•M","hook":"Empat penentu kadar hayat: Nilai Muka, Umur (jangka hayat), Jantina & status Merokok; bagi perjalanan pula: Destinasi, Tempoh hari & Bilangan orang!","mediaKey":"mat53_kalkulator_premium","summary":"Premium insurans hayat bergantung pada nilai muka, umur, jantina dan tabiat merokok; insurans perjalanan pula bergantung pada destinasi, tempoh perjalanan dan bilangan peserta.","bullets":["Formula & Faktor Insurans Hayat: Premium = (Nilai muka polisi / RMx) x Kadar premium per RMx (lazimnya RMx = RM1 000). Kadar meningkat dengan usia kerana jangka hayat semakin pendek, dan lebih tinggi bagi perokok akibat risiko penyakit. Tambahan rider penyakit kritikal (cth. 30% nilai muka asas) dikira berasingan lalu ditambah pada premium asas.","Insurans Perjalanan (Tahunan vs Per Trip): Faktor penentu ialah destinasi (cth. Asia vs Eropah), tempoh perjalanan (semakin lama semakin tinggi risiko kerugian luar negara) dan bilangan orang (individu, pasangan, keluarga). Pelan premium tahunan lebih menjimatkan bagi pengembara kerap sepanjang tahun."],"formula":"Premium = (Nilai Muka Polisi / RMx) × Kadar Premium per RMx","labId":"mat53_premium_hayat_motor_lab","labTitle":"Kalkulator Premium Insurans Hayat & Rider Kritikal","labProps":{"mode":"hayat","age":36,"gender":"F","smoker":false,"faceValue":200000,"addRider":true},"examTip":"Untuk rider penyakit kritikal seperti '30% daripada nilai muka asas', JANGAN darab kadar rider dengan nilai muka asas penuh — darabkan dahulu 30% dengan nilai muka asas!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Premium Hayat + Rider","voiceCaption":"Ramalkan jumlah premium tahunan Puan Aina berumur tiga puluh enam tahun bukan perokok dengan nilai muka dua ratus ribu ringgit dan rider penyakit kritikal.","voiceScript":"[curious] Cuba hitung dan ramalkan jawapan tepat! Puan Aina berumur tiga puluh enam tahun dan tidak merokok memilih nilai muka asas dua ratus ribu ringgit pada kadar satu ringgit lima puluh sen per seribu. Dia turut menambah perlindungan penyakit kritikal sebanyak tiga puluh peratus nilai muka asas dengan kadar satu ringgit tujuh puluh tujuh sen per seribu. Berapakah jumlah premium tahunannya?","hook":"Semak jalan kira langkah demi langkah pada Kalkulator Insurans Hayat selepas memilih!","scenario":"Puan Aina (36 tahun, bukan perokok) membeli polisi asas RM200,000 (kadar RM1.50 per RM1,000) berserta rider penyakit kritikal 30% nilai muka asas (kadar RM1.77 per RM1,000).","stimulusHtml":"<div class='stimulus-note'><strong>Data Polisi Puan Aina:</strong> Nilai Muka Asas = RM200,000 (Kadar = RM1.50/RM1,000) • Rider Penyakit Kritikal = 30% nilai muka asas (Kadar = RM1.77/RM1,000)</div>","prompt":"Berapakah jumlah premium tahunan yang perlu dibayar oleh Puan Aina?","options":["RM406.20","RM300.00","RM654.00","RM497.00"],"correctIndex":0,"proofLabId":"mat53_premium_hayat_motor_lab","proofState":{"mode":"hayat","age":36,"gender":"F","smoker":false,"faceValue":200000,"addRider":true},"explanation":"Premium asas = (200,000/1,000) x 1.50 = RM300.00. Nilai muka rider = 30% x 200,000 = RM60,000, maka premium rider = (60,000/1,000) x 1.77 = RM106.20. Jumlah = RM300.00 + RM106.20 = RM406.20."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Jadual Tarif Motor 2015 & NCD","voiceCaption":"Tarif Motor menetapkan premium asas minimum mengikut kapasiti enjin dan wilayah sebelum ditolak Diskaun Tanpa Tuntutan N C D.","voiceScript":"[warm] Sekarang kuasai Jadual Tarif Motor dua ribu lima belas! Polisi pihak ketiga hanya bergantung pada kapasiti enjin kenderaan. Sebaliknya, polisi komprehensif serta polisi pihak ketiga, kebakaran dan kecurian bergantung pada kapasiti enjin dan nilai semasa kenderaan. [confident] Untuk polisi komprehensif, ambil kadar R M seribu pertama daripada jadual, kemudian tambah dua puluh enam ringgit bagi setiap seribu ringgit baki di Semenanjung Malaysia, atau dua puluh ringgit tiga puluh sen di Sabah dan Sarawak! Bagi polisi pihak ketiga, kebakaran dan kecurian, premium asasnya ialah tujuh puluh lima peratus daripada komprehensif. Akhir sekali, tolak peratusan N C D daripada premium asas untuk mendapat premium kasar!","title":"Jadual Tarif Motor 2015 (Semenanjung vs Sabah & Sarawak) + NCD","acronym":"26•20.3•75%","hook":"Ingat tiga nombor emas Tarif Motor 2015: +RM26 (Semenanjung), +RM20.30 (Sabah & Sarawak) bagi setiap RM1,000 baki, dan 75% komprehensif untuk Pihak Ketiga Kebakaran & Kecurian!","mediaKey":"mat53_tarif_motor","summary":"Tarif Motor menyediakan kadar premium minimum kawalan undang-undang berdasarkan wilayah, kapasiti enjin (cc) dan nilai kenderaan sebelum ditolak Diskaun Tanpa Tuntutan (NCD).","bullets":["Rumus Komprehensif & 75% P3KK: Premium asas Komprehensif = Kadar RM1 000 pertama + (Bilangan RM1 000 baki atau sebahagian x RM26.00 [Semenanjung] atau RM20.30 [Sabah & Sarawak]). Premium asas Pihak Ketiga, Kebakaran & Kecurian = 75% x Premium asas Komprehensif; manakala Polisi Pihak Ketiga merujuk terus lajur cc jadual tanpa mengira nilai kereta.","Diskaun Tanpa Tuntutan (NCD) & Caj Tambahan: NCD (0% hingga 55%) ditolak terus daripada premium asas untuk memperoleh premium kasar (Premium kasar = Premium asas - NCD). Bayaran akhir sebenar di kaunter mungkin berbeza kerana terdapat caj kendalian, komisen ejen, cukai perkhidmatan dan duti setem."],"formula":"Komprehensif (Sem.): Kadar 1k Pertama + (Baki k × RM26)  |  S&S: + (Baki k × RM20.30)","labId":"mat53_premium_hayat_motor_lab","labTitle":"Kalkulator Tarif Motor 2015 & Diskaun NCD","labProps":{"mode":"motor","region":"sm","ccTier":1650,"sumInsured":60000,"ncd":25,"policyType":"komprehensif"},"examTip":"Sentiasa baca negeri pemilik kenderaan dengan teliti! Kadar Jadual Tarif Motor bagi Semenanjung Malaysia (contoh +RM26) berbeza daripada Sabah dan Sarawak (+RM20.30)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Susun Langkah Tarif Komprehensif","voiceCaption":"Susun urutan pengiraan premium kasar polisi komprehensif di Semenanjung Malaysia dengan betul.","voiceScript":"[confident] Susun langkah kerja berturutan untuk mengira premium kasar polisi komprehensif di Semenanjung Malaysia supaya jalan kerja Kertas dua kamu mendapat markah penuh!","prompt":"Susun turutan pengiraan premium kasar Polisi Komprehensif Semenanjung Malaysia:","hint":"Bermula dari kadar RM1 000 pertama hingga penolakan NCD...","answerTokens":["Ambil kadar RM1 000 pertama mengikut cc","tambah RM26 bagi setiap RM1 000 baki","untuk memperoleh jumlah premium asas","kemudian tolak peratusan NCD daripada premium asas"],"distractors":["kemudian tambah nilai NCD kepada premium asas","dengan mendarab terus jumlah perlindungan dengan RM20.30"],"explanation":"Urutan wajib: Kadar RM1 000 pertama + (baki unit RM1 000 x RM26 bagi Semenanjung) = Premium asas; kemudian tolak (NCD% x Premium asas) = Premium kasar."},{"type":"sort","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Isih Faktor Penentu Premium","voiceCaption":"Asingkan enam faktor berikut kepada insurans yang menggunakannya sebagai penentu kadar premium.","voiceScript":"[curious] Kelaskan faktor-faktor berikut sama ada ia hanya menentukan Polisi Pihak Ketiga, menentukan Polisi Komprehensif Motor, ataupun menentukan Insurans Hayat!","prompt":"Kelaskan setiap faktor penentuan premium berikut ke dalam jenis polisi yang tepat:","buckets":[{"id":"motor_komp","label":"Polisi Komprehensif Motor"},{"id":"pihak3","label":"Polisi Pihak Ketiga Sahaja"},{"id":"hayat","label":"Insurans Hayat"}],"items":[{"text":"Status merokok atau tidak merokok oleh pemohon polisi","bucketId":"hayat","note":"Perokok berisiko penyakit tinggi, kadar per RM1,000 meningkat"},{"text":"Hanya kapasiti enjin (cc) dan wilayah tanpa bergantung pada harga pasaran kereta","bucketId":"pihak3","note":"Nilai semasa kenderaan tidak mempengaruhi kadar polisi pihak ketiga"},{"text":"Gabungan kapasiti enjin (cc), nilai kenderaan semasa dan kadar NCD","bucketId":"motor_komp","note":"Setiap RM1 000 melebihi RM1 000 pertama dicaj +RM26 atau +RM20.30"},{"text":"Umur semasa pemegang polisi yang menentukan jangka hayat baki","bucketId":"hayat","note":"Kadar premium hayat meningkat apabila umur semakin tua"},{"text":"Harga semasa kenderaan bernilai RM70,000 yang ingin diinsuranskan","bucketId":"motor_komp","note":"Digunakan dalam Komprehensif dan Pihak Ketiga Kebakaran & Kecurian"},{"text":"Kadar tetap RM135.00 (Semenanjung) bagi enjin 1 600 cc tanpa mengira nilai kereta","bucketId":"pihak3","note":"Ciri khusus pengiraan Polisi Pihak Ketiga di bawah Tarif Motor 2015"}],"explanation":"Polisi Pihak Ketiga hanya bergantung pada cc (dan wilayah), Komprehensif bergantung pada cc + nilai semasa kenderaan, manakala Insurans Hayat bergantung pada nilai muka, umur, jantina dan merokok."},{"type":"match","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Padan Komponen Tarif Motor 2015","voiceCaption":"Padankan lima komponen utama Tarif Motor dua ribu lima belas dengan nilai atau peranannya.","voiceScript":"[confident] Pastikan kamu tidak tertukar kadar Semenanjung dan Sabah Sarawak! Padankan kelima-lima komponen Tarif Motor berikut dengan maklumat tepatnya.","prompt":"Padankan setiap komponen Tarif Motor 2015 dengan nilai atau huraiannya:","pairs":[{"id":"u3m1","left":"Caj Baki RM1 000 Semenanjung","right":"RM26 bagi setiap RM1 000 atau sebahagian melebihi RM1 000"},{"id":"u3m2","left":"Caj Baki RM1 000 Sabah & Sarawak","right":"RM20.30 bagi setiap RM1 000 atau sebahagian melebihi RM1 000"},{"id":"u3m3","left":"Pihak Ketiga, Kebakaran & Kecurian","right":"Premium asas bernilai 75% daripada premium asas komprehensif"},{"id":"u3m4","left":"Diskaun Tanpa Tuntutan (NCD)","right":"Potongan peratusan daripada premium asas jika tiada tuntutan dibuat"},{"id":"u3m5","left":"Caj Tambahan Luar Tarif","right":"Komisen ejen, cukai perkhidmatan dan duti setem pada bayaran akhir"}],"explanation":"Membezakan kadar RM26 (Semenanjung) dengan RM20.30 (Sabah & Sarawak) serta pelarasan 75% sangat kritikal bagi mengelakkan kecuaian markah dalam SPM."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Kira Premium Kasar Motor","voiceCaption":"Hitung premium kasar Polisi Komprehensif bagi kereta seribu lima ratus cc bernilai tujuh puluh ribu ringgit di Melaka dengan diskaun tiga puluh peratus.","voiceScript":"[excited] Uji pengiraan penuh Tarif Motor untuk Hafiz di Melaka! Keretanya berenjin seribu lima ratus c c dengan kadar R M seribu pertama tiga ratus lima ringgit lima puluh sen, nilai diinsuranskan tujuh puluh ribu ringgit, dan N C D tiga puluh peratus. Berapakah premium kasarnya bagi Polisi Komprehensif?","stimulusHtml":"<div class='stimulus-note'><strong>Data Kereta Hafiz (Melaka, Semenanjung):</strong> Enjin = 1 500 cc (Jadual &le; 1 650 cc: RM1,000 pertama = RM305.50; baki +RM26/RM1,000) &bull; Nilai Diinsuranskan = RM70,000 &bull; NCD = 30%.</div>","prompt":"Hitung premium kasar Polisi Komprehensif bagi kereta Hafiz:","options":["RM1,469.65","RM1,487.85","RM2,099.50","RM1,102.24"],"correctIndex":0,"explanation":"RM1,000 pertama = RM305.50. Baki 69 unit x RM26 = RM1,794.00. Premium asas = RM2,099.50. Tolak NCD 30% (RM629.85) -> Premium kasar = RM1,469.65."}]},{"id":"mat53-u4","title":"Unit 4: Deduktibel & Ko-Insurans (Harta & Perubatan)","subtitle":"Subtopik 3.1 (Bhg. D) — Deduktibel Wajib RM400, Syarat 80% Ko-Insurans Harta, Penalti, Had Polisi & 80/20 Perubatan","iconType":"graph","iconUrl":"../assets/icons/mat53-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Konsep Deduktibel & Wajib RM400","voiceCaption":"Deduktibel ialah jumlah tetap yang mesti ditanggung oleh pemegang polisi sebelum layak menuntut pampasan daripada syarikat insurans.","voiceScript":"[warm] Mengapakah kadangkala kita tidak menerima pampasan penuh walaupun mengalami kerugian? Sebabnya ialah dua peruntukan khas: deduktibel dan ko-insurans! Deduktibel ialah suatu amaun tetap yang mesti ditanggung sendiri terlebih dahulu sebelum syarikat insurans membayar baki pampasan. [serious] Ingat tiga fakta wajib ini: jika kerugian kurang daripada deduktibel, tiada tuntutan boleh dibuat! Kedua, deduktibel wujud dalam insurans harta, perubatan dan motor, tetapi tiada dalam insurans hayat dan liabiliti diri. Ketiga, dalam insurans motor, deduktibel wajib empat ratus ringgit dikenakan jika pemandu tidak dinamakan dalam polisi, berumur bawah dua puluh satu tahun, pemegang lesen L, atau lesen penuh kurang dua tahun!","title":"Deduktibel Biasa, Deduktibel Wajib RM400 Motor & Had Tahunan","acronym":"L>D • RM400","hook":"Peruntukan deduktibel dan ko-insurans dimasukkan dalam polisi supaya bayaran premium tahunan yang ditanggung oleh pemegang polisi menjadi LEBIH RENDAH!","mediaKey":"mat53_deduktibel_konsep","summary":"Deduktibel ialah amaun awal yang perlu ditanggung sendiri oleh pemegang polisi sebelum tuntutan pampasan dibayar oleh syarikat insurans.","bullets":["Syarat Layak & Polisi Tanpa Deduktibel: Jika Kerugian <= Deduktibel, pemegang polisi menanggung sendiri 100% kos (tiada tuntutan). Jika Kerugian > Deduktibel, Pampasan = Kerugian - Deduktibel. Deduktibel terdapat dalam insurans harta, motor serta perubatan/kesihatan, tetapi TIADA dalam insurans hayat dan insurans liabiliti diri.","Deduktibel Wajib RM400 Motor & Had Tahunan Perubatan: Deduktibel wajib RM400 dikenakan jika kereta dipandu individu tidak dinamakan dalam polisi, individu dinamakan berumur < 21 tahun, pemegang lesen L, atau pemegang lesen penuh < 2 tahun. Bagi insurans perubatan dengan deduktibel tahunan (cth. RM30,000) dan had tahunan (cth. RM300,000), bil di bawah RM30,000 ditanggung sendiri sepenuhnya."],"formula":"Jika L > D:  Pampasan = L - D   |   Jika L <= D:  Pampasan = RM0 (Tiada tuntutan)","labId":"mat53_deduktibel_koinsurans_lab","labTitle":"Simulator Ambang Deduktibel & Deduktibel Wajib RM400","labProps":{"tab":"deduktibel","dedLoss":2800,"dedAmt":300,"mandatory400":false},"examTip":"Untuk soalan deduktibel berulang dalam setahun (cth. kemalangan Mac, Julai, Ogos), uji setiap peristiwa satu demi satu sama ada melebihi nilai deduktibel!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Kes Tuntutan Deduktibel","voiceCaption":"Kelaskan enam kes tuntutan dan polisi berikut mengikut aturan deduktibel yang tepat.","voiceScript":"[curious] Mari uji ketelitian kamu menggunakan peraturan deduktibel! Asingkan enam kes berikut mengikut kesannya terhadap tuntutan.","prompt":"Kelaskan enam situasi deduktibel berikut ke dalam kategori yang tepat:","buckets":[{"id":"layak","label":"Layak Tuntutan (L - D)"},{"id":"tolak","label":"Tiada Tuntutan / Tanggung Sendiri"},{"id":"tiadaded","label":"Polisi Tanpa Peruntukan Deduktibel"}],"items":[{"text":"Kerugian motosikal RM320 di bawah polisi dengan deduktibel RM150","bucketId":"layak","note":"RM320 > RM150, maka layak menuntut pampasan RM170"},{"text":"Bil pembedahan kecil RM4,500 apabila deduktibel tahunan perubatan ialah RM5,000","bucketId":"tolak","note":"RM4,500 <= RM5,000, kos kurang daripada deduktibel tahunan"},{"text":"Polisi insurans hayat yang membayar manfaat kematian kepada waris","bucketId":"tiadaded","note":"Deduktibel tidak terdapat dalam insurans hayat"},{"text":"Kos rawatan jantung RM210,000 dengan deduktibel RM30,000 dan had tahunan RM300,000","bucketId":"layak","note":"Syarikat membayar RM180,000 manakala pemilik tanggung RM30,000"},{"text":"Kerosakan bampar RM240 bagi polisi motor berdeduktibel RM300","bucketId":"tolak","note":"Jumlah kerugian kurang daripada amaun deduktibel polisi"},{"text":"Polisi insurans liabiliti diri dalam kontrak perlindungan peribadi","bucketId":"tiadaded","note":"Insurans liabiliti diri turut dikecualikan daripada deduktibel"}],"explanation":"Tuntutan hanya sah apabila kerugian melebihi deduktibel; insurans hayat serta insurans liabiliti diri tidak mempunyai deduktibel."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Ko-Insurans Harta & Kesihatan","voiceCaption":"Ko-insurans ialah perkongsian kerugian antara syarikat insurans dengan pemegang polisi bagi polisi harta dan penyertaan peratusan kesihatan.","voiceScript":"[warm] Sekarang fahami perbezaan antara ko-insurans harta dengan ko-insurans kesihatan! Dalam insurans harta, polisi menetapkan peratusan wajib seperti lapan puluh peratus daripada nilai boleh insurans. Jika jumlah yang dibeli M kurang daripada jumlah harus dibeli R, pemegang polisi dikenakan penalti ko-insurans dengan rumus M per R darab kerugian L, tolak deduktibel D! [serious] Jika kerugian menyeluruh berlaku pula, pampasan maksimum hanyalah M tolak D, tidak melebihi nilai polisi yang dibeli! Manakala dalam insurans kesihatan seperti lapan puluh per dua puluh, tolak deduktibel dahulu daripada bil perubatan, barulah syarikat tanggung lapan puluh peratus dan pemegang polisi tanggung baki dua puluh peratus ditambah deduktibel!","title":"Ko-Insurans Harta (3 Kes + Penalti) & Perubatan 80/20 + Pilihan Polisi","acronym":"M/R×L-D","hook":"Walaupun anda membeli insurans melebihi R, bayaran pampasan tetap tidak boleh melebihi kerugian sebenar (Prinsip Indemniti) dan tidak melebihi had nilai muka M!","mediaKey":"mat53_koinsurans_harta","summary":"Ko-insurans harta mewajibkan pembelian peratusan tertentu daripada nilai boleh insurans harta, manakala ko-insurans kesihatan membahagikan kos rawatan selepas deduktibel mengikut nisbah peratusan.","bullets":["3 Kes Ko-Insurans Harta (R = Peratusan × Nilai Boleh Insurans): (1) Jika M >= R (kerugian separa): Pampasan = L - D (tetapi tidak melebihi kerugian sebenar L atau nilai M). (2) Jika M < R (kurang insurans): Pampasan = (M/R × L) - D, manakala Penalti Ko-Insurans = L - (M/R × L). (3) Kerugian Menyeluruh: Pampasan = M - D.","Ko-Insurans Kesihatan (cth. 80/20) & 4 Panduan Memilih Polisi: Tolak deduktibel D daripada kos perubatan dahulu, kemudian syarikat membayar 80% baki dan pemegang polisi membayar 20% baki + D. Ketika membandingkan pelan (seperti pelan XX vs YY), semak 4 panduan: ketahui jumlah perlindungan, fahami skop/syarat, bandingkan kadar premium serta faedah (had ICU/bilik), dan elakkan perlindungan tidak perlu."],"formula":"Kurang Insurans (M < R): Pampasan = (M / R) × L - D   |   Penalti = L - (M / R) × L","labId":"mat53_deduktibel_koinsurans_lab","labTitle":"Kalkulator Ko-Insurans Harta (80%) & Perubatan 80/20","labProps":{"tab":"harta","propVal":350000,"coPct":80,"bought":200000,"propLoss":25000,"propDed":2000},"examTip":"Sentiasa periksa M berbanding R sebelum memilih rumus! Pelajar sering tersilap terus membahagi M/R walaupun M sudah mencukupi (M >= R) atau ketika berlakunya kerugian menyeluruh!"},{"type":"predict","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Pampasan & Penalti Harta","voiceCaption":"Ramalkan pampasan dan penalti ko-insurans apabila rumah bernilai tiga ratus ribu ringgit hanya diinsuranskan sebanyak seratus lima puluh ribu ringgit.","voiceScript":"[curious] Mari ramal kesan kurang insurans! Sebuah rumah bernilai boleh insurans tiga ratus ribu ringgit tertakluk kepada syarat ko-insurans lapan puluh peratus dan deduktibel dua ribu ringgit. Pemiliknya hanya membeli insurans seratus lima puluh ribu ringgit, lalu rumah itu mengalami kerugian kebakaran dua puluh empat ribu ringgit. Berapakah bayaran pampasan dan penalti ko-insuransnya?","hook":"Aktifkan Kalkulator Ko-Insurans Harta sebaik sahaja menjawab untuk melihat pecahan bar kerugian!","scenario":"Nilai boleh insurans rumah = RM300,000 | Syarat ko-insurans = 80% | Deduktibel = RM2,000 | Insurans dibeli (M) = RM150,000 | Kerugian kebakaran (L) = RM24,000.","prompt":"Berapakah bayaran pampasan yang diterima dan nilai penalti ko-insurans yang ditanggung?","options":["Pampasan = RM13,000 | Penalti ko-insurans = RM9,000","Pampasan = RM22,000 | Penalti ko-insurans = RM0","Pampasan = RM15,000 | Penalti ko-insurans = RM11,000","Pampasan = RM10,000 | Penalti ko-insurans = RM14,000"],"correctIndex":0,"proofLabId":"mat53_deduktibel_koinsurans_lab","proofState":{"tab":"harta","propVal":300000,"coPct":80,"bought":150000,"propLoss":24000,"propDed":2000},"explanation":"Jumlah harus dibeli R = 80% x RM300,000 = RM240,000. Oleh sebab M (RM150,000) < R, bahagian nisbah = (150,000/240,000) x 24,000 = RM15,000. Pampasan = 15,000 - 2,000 = RM13,000; Penalti ko-insurans = 24,000 - 15,000 = RM9,000."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Urutan Ko-Insurans Perubatan","voiceCaption":"Susun urutan pengiraan jumlah kos yang ditanggung pemegang polisi bagi pelan perubatan ko-insurans lapan puluh per dua puluh berserta deduktibel.","voiceScript":"[confident] Jangan tertukar langkah menolak deduktibel dalam ko-insurans perubatan! Susun urutan langkah yang tepat bagi pelan lapan puluh per dua puluh.","prompt":"Susun turutan langkah mengira bayaran pemegang polisi bagi pelan perubatan 80/20 berdeduktibel:","hint":"Tentukan apa yang mesti ditolak daripada bil hospital sebelum mendarab 20%...","answerTokens":["Tolak amaun deduktibel daripada bil perubatan","kemudian darab 20% dengan baki tersebut","lalu tambah semula deduktibel","bagi jumlah ditanggung pemegang polisi"],"distractors":["darab 20% dengan bil asal dahulu","kemudian tolak lagi amaun deduktibel"],"explanation":"Urutan wajib ko-insurans kesihatan: (1) Tolak deduktibel D daripada jumlah kos perubatan L, (2) Darab 20% dengan baki (L - D), (3) Jumlah ditanggung pemegang polisi = 20%(L - D) + D."},{"type":"match","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Padan 4 Panduan Pilih Polisi","voiceCaption":"Padankan empat panduan memilih polisi insurans terbaik dengan tindakan pengguna yang bijak.","voiceScript":"[warm] Sebelum membeli sebarang polisi, semak empat panduan pengguna bijak! Padankan panduan berikut dengan aplikasinya ketika menilai pelan insurans.","prompt":"Padankan keempat-empat panduan memilih polisi insurans terbaik dengan tindakan tepatnya:","pairs":[{"id":"u4m1","left":"Ketahui jumlah perlindungan diperlukan","right":"Menilai nilai harta atau komitmen tanggungan agar tidak kurang insurans"},{"id":"u4m2","left":"Fahami skop, terma dan syarat","right":"Menyemak fasal deduktibel, tempoh perlindungan ICU dan pengecualian"},{"id":"u4m3","left":"Bandingkan kadar premium & manfaat","right":"Memilih pelan berpremium lebih rendah dengan elaun dan had hari lebih lama"},{"id":"u4m4","left":"Elakkan perlindungan tidak perlu","right":"Tidak membayar rider bertindih yang tidak relevan dengan risiko sendiri"},{"id":"u4m5","left":"Kesan deduktibel & ko-insurans","right":"Menjadikan bayaran premium tahunan polisi lebih rendah dan mampu milik"}],"explanation":"Pengguna bijak menilai saiz perlindungan, terma pengecualian, perbandingan manfaat-berbanding-premium (seperti had ICU tanpa had caj harian) dan mengelak perlindungan bertindih."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s7","voiceToneLabel":"Kira Ko-Insurans Perubatan 80/20","voiceCaption":"Hitung jumlah bayaran yang ditanggung oleh Nadiah bagi bil perubatan lapan belas ribu empat ratus ringgit dengan deduktibel empat ratus ringgit dan ko-insurans lapan puluh per dua puluh.","voiceScript":"[excited] Soalan penutup Unit empat! Kos perubatan Nadiah berjumlah lapan belas ribu empat ratus ringgit. Polisi perubatannya mengenakan deduktibel empat ratus ringgit dan penyertaan peratusan ko-insurans lapan puluh per dua puluh. Berapakah jumlah keseluruhan yang perlu dibayar oleh Nadiah sendiri?","stimulusHtml":"<div class='stimulus-note'><strong>Bil Perubatan Nadiah:</strong> Jumlah Kos Dilindungi = RM18,400 &bull; Deduktibel = RM400 &bull; Ko-insurans = 80/20 (Syarikat 80%, Pemegang Polisi 20%).</div>","prompt":"Berapakah jumlah keseluruhan kos yang perlu ditanggung oleh Nadiah sendiri?","options":["RM4,000","RM3,600","RM3,680","RM4,080"],"correctIndex":0,"explanation":"Kos selepas deduktibel = RM18,400 - RM400 = RM18,000. Bahagian ko-insurans Nadiah = 20% x RM18,000 = RM3,600. Jumlah ditanggung Nadiah = RM3,600 + RM400 (deduktibel) = RM4,000."}]},{"id":"mat53-u5","title":"Unit 5: Cabaran Boss SPM — Sintesis Insurans & KBAT","subtitle":"Boss Arena (Kertas 1 & Kertas 2) — Indemniti & Had Polisi, Tarif Sabah/Sarawak, Masalah Berangkai & Pelan Terbaik","iconType":"trophy","iconUrl":"../assets/icons/mat53-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Prinsip Indemniti & Had Polisi","voiceCaption":"Selesaikan kes rumah Encik Daniel bernilai dua ratus lima puluh ribu ringgit yang memenuhi syarat lapan puluh peratus apabila berlaku kebakaran menyeluruh.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama menguji pemahaman mendalam tentang syarat ko-insurans lapan puluh peratus dan kerugian menyeluruh! Rumah Encik Daniel bernilai boleh insurans dua ratus lima puluh ribu ringgit dan dia menginsuranskan rumahnya tepat mengikut syarat lapan puluh peratus ko-insurans iaitu dua ratus ribu ringgit. Jika seluruh rumahnya musnah terbakar sepenuhnya, adakah Encik Daniel akan menerima pampasan penuh dua ratus lima puluh ribu ringgit?","stimulusHtml":"<div class='stimulus-note'><strong>Kes Boss 1 (Latih Ekstensif KSSM):</strong> Nilai boleh insurans rumah Encik Daniel = RM250,000. Syarat ko-insurans = 80% (tiada deduktibel). Encik Daniel membeli tepat jumlah yang harus dibeli (RM200,000), namun seluruh rumah hangus terbakar.</div>","prompt":"Adakah Encik Daniel akan menerima pampasan sebanyak RM250,000? Pilih justifikasi yang TEPAT:","options":["Tidak, kerana bayaran maksimum untuk sesuatu kerugian adalah terhad kepada jumlah nilai muka insurans yang telah dibeli iaitu RM200,000 sahaja","Ya, kerana dia telah mematuhi syarat ko-insurans 80% yang ditetapkan syarikat insurans","Tidak, dia hanya akan menerima 80% daripada RM200,000 iaitu RM160,000 sebagai penalti","Ya, mengikut prinsip indemniti syarikat mesti mengganti keseluruhan nilai pasaran rumah"],"correctIndex":0,"explanation":"Dalam kerugian menyeluruh, bayaran maksimum oleh syarikat insurans ialah nilai muka polisi yang dibeli (M = RM200,000, tolak deduktibel jika ada). Syarikat tidak membayar melebihi jumlah insurans yang telah dibeli walaupun nilai rumah RM250,000."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Tarif Motor Sabah & Sarawak","voiceCaption":"Ramalkan premium kasar Polisi Komprehensif di Sabah dan Sarawak bagi kereta seribu enam ratus c c bernilai lima puluh lima ribu ringgit dengan N C D tiga puluh peratus.","voiceScript":"[curious] Cabaran Boss kedua membawa kamu ke Kota Kinabalu, Sabah! Puan Dayang memiliki kereta berkapasiti seribu enam ratus c c dengan nilai diinsuranskan lima puluh lima ribu ringgit dan N C D tiga puluh peratus. Berpandukan Jadual Tarif Motor untuk Sabah dan Sarawak, iaitu dua ratus dua puluh ringgit bagi seribu ringgit pertama serta dua puluh ringgit tiga puluh sen setiap seribu ringgit baki, berapakah premium kasarnya?","hook":"Sahkan pengiraan Tarif Sabah & Sarawak ini menggunakan Kalkulator Tarif Motor selepas memilih!","scenario":"Kereta Puan Dayang di Sabah: Kapasiti 1 600 cc (Jadual S&S <= 1 650 cc: RM1,000 pertama = RM220.00; baki +RM20.30/RM1,000) • Nilai Diinsuranskan = RM55,000 • NCD = 30%.","prompt":"Berapakah premium kasar Polisi Komprehensif bagi kereta Puan Dayang di Sabah?","options":["RM921.34","RM1,316.20","RM1,148.35","RM691.01"],"correctIndex":0,"proofLabId":"mat53_premium_hayat_motor_lab","proofState":{"mode":"motor","region":"ss","ccTier":1650,"sumInsured":55000,"ncd":30,"policyType":"komprehensif"},"explanation":"RM1,000 pertama (S&S) = RM220.00. Baki 54 unit x RM20.30 = RM1,096.20. Premium asas = RM1,316.20. Tolak NCD 30% (RM394.86) = RM921.34. (RM1,148.35 ialah perangkap jika tersalah guna kadar Semenanjung!)."},{"type":"sort","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Isih Rumus & Peruntukan","voiceCaption":"Kelaskan enam ciri dan rumus berikut kepada jenis mekanisme insurans yang betul.","voiceScript":"[confident] Pecutan Boss ketiga menguji keupayaan kamu mengasingkan rumus serta peraturan antara Deduktibel, Ko-Insurans Harta dan Ko-Insurans Perubatan!","prompt":"Isihkan enam pernyataan berikut ke dalam kategori peruntukan insurans yang tepat:","buckets":[{"id":"ded","label":"Deduktibel"},{"id":"koharta","label":"Ko-Insurans Harta"},{"id":"komed","label":"Ko-Insurans Perubatan"}],"items":[{"text":"Amaun tetap ditanggung pemegang polisi sebelum tuntutan layak; wajib RM400 bagi pemandu lesen L","bucketId":"ded","note":"Deduktibel berfungsi sebagai ambang permulaan tuntutan"},{"text":"Syarat menginsuranskan peratusan tertentu seperti 80% daripada nilai boleh insurans","bucketId":"koharta","note":"Jika gagal dipatuhi (M < R), penalti nisbah M/R dikenakan"},{"text":"Fasal penyertaan peratusan 80/20 atau 75/25 selepas ditolak deduktibel polisi","bucketId":"komed","note":"Perkongsian kos rawatan hospital utama"},{"text":"Tuntutan ditolak terus menjadi RM0 jika jumlah kerugian kurang daripada hadnya","bucketId":"ded","note":"Contoh kerugian RM250 ditolak apabila deduktibel ialah RM300"},{"text":"Bayaran pampasan ialah (M / R) x L - D apabila jumlah diinsuranskan M < R","bucketId":"koharta","note":"Rumus pampasan bagi kes kurang insurans harta"},{"text":"Pemegang polisi membayar D + 25%(Kos Perubatan - D) bagi fasal 75/25","bucketId":"komed","note":"Urutan pengiraan jumlah kos ditanggung pesakit"}],"explanation":"Mengasingkan deduktibel (ambang awal), ko-insurans harta (syarat peratusan nilai harta M/R) dan ko-insurans kesihatan (nisbah selepas D) memastikan sifar kecuaian semasa peperiksaan."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Sintesis 5 Kes SPM","voiceCaption":"Padankan lima kes aplikasi peperiksaan berikut dengan keputusan pampasan atau tindakan yang paling tepat.","voiceScript":"[confident] Cabaran Boss keempat menyatukan semua situasi kehidupan sebenar Bab tiga! Padankan lima kes berikut dengan keputusan tepatnya.","prompt":"Padankan lima situasi SPM berikut dengan keputusan insurans yang tepat:","pairs":[{"id":"b3m1","left":"Pemandu berusia 19 tahun memandu kereta dinamakan dalam polisi","right":"Dikenakan deduktibel wajib RM400 selain deduktibel biasa"},{"id":"b3m2","left":"Jurugambar kerap ke Eropah selama 14 hari setiap trip setahun","right":"Lebih jimat memilih insurans perjalanan pelan tahunan Eropah"},{"id":"b3m3","left":"Rumah dilindungi polisi kebakaran terjejas akibat banjir kilat","right":"Hanya dibayar jika pemilik membeli perlindungan tambahan banjir"},{"id":"b3m4","left":"Pelan perubatan tiada had ICU harian dengan premium lebih rendah","right":"Lebih baik berbanding pelan berhad RM400 sehari dan premium mahal"},{"id":"b3m5","left":"Harta diinsuranskan melebihi syarat R (M > R) bagi kerugian separa","right":"Pampasan tetap terhad kepada kerugian sebenar tolak deduktibel"}],"explanation":"Kelima-lima kes ini merupakan pola soalan berstruktur KBAT yang kerap diuji dalam SPM Kertas 1 dan Kertas 2."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Hujah KBAT Had Pampasan","voiceCaption":"Susun hujah lengkap Kertas dua mengapa pemegang polisi tidak mendapat pampasan melebihi kerugian sebenar walaupun menginsuranskan hartanya lebih daripada syarat ko-insurans.","voiceScript":"[warm] Cabaran Boss kelima menguji kemahiran menghuraikan justifikasi bertulis! Terangkan mengapa syarikat insurans tidak membayar pampasan melebihi kerugian sebenar walaupun pemegang polisi membeli perlindungan melebihi jumlah ko-insurans R.","prompt":"Susun huraian KBAT SPM mengenai had pampasan apabila M > R bagi kerugian separa:","hint":"Kaitkan dengan prinsip indemniti serta had bayaran maksimum...","answerTokens":["Mengikut prinsip indemniti syarikat insurans","tidak akan membayar melebihi","jumlah kerugian sebenar yang dialami","dan terhad kepada nilai muka dibeli"],"distractors":["kerana lebihan premium akan dipulangkan tunai","supaya pemegang polisi memperoleh keuntungan bersih"],"explanation":"Walaupun rumus (M/R) x L menghasilkan nilai melebihi L apabila M > R, syarikat insurans terikat dengan prinsip indemniti untuk tidak membayar lebih daripada kerugian sebenar serta tidak melebihi nilai muka polisi M."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Masalah Songsang Ko-Insurans","voiceCaption":"Selesaikan masalah songsang K B A T untuk mencari jumlah insurans yang telah dibeli oleh Encik Hakim daripada nilai pampasan yang diterima.","voiceScript":"[excited] Soalan kemuncak Unit Boss! Gudang Encik Hakim bernilai boleh insurans satu juta ringgit tertakluk kepada syarat ko-insurans lapan puluh peratus dan deduktibel empat ribu ringgit. Selepas mengalami kerugian kebakaran dua ratus ribu ringgit, Encik Hakim menerima bayaran pampasan seratus empat puluh enam ribu ringgit. Berapakah jumlah insurans yang sebenarnya telah dibeli oleh Encik Hakim?","stimulusHtml":"<div class='stimulus-note'><strong>Masalah KBAT Akhir:</strong> Nilai Boleh Insurans Gudang = RM1,000,000 &bull; Syarat Ko-Insurans = 80% &bull; Deduktibel = RM4,000 &bull; Kerugian Kebakaran = RM200,000 &bull; Pampasan Diterima = RM146,000.</div>","prompt":"Hitung jumlah insurans (M) yang telah dibeli oleh Encik Hakim:","options":["RM600,000","RM800,000","RM584,000","RM730,000"],"correctIndex":0,"explanation":"Jumlah harus dibeli R = 80% x RM1,000,000 = RM800,000. Jika patuh syarat, pampasan = 200,000 - 4,000 = RM196,000; kerana hanya menerima RM146,000, maka M < R. Gunakan (M / 800,000) x 200,000 - 4,000 = 146,000 -> M / 4 = 150,000 -> M = RM600,000! Tahniah — Bab 3 Insurans dikuasai 100%!"}]}]};</script>

    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function round2(n) {
    return Math.round((Number(n) + 1e-9) * 100) / 100;
  }

  function fmtRm(val, decimals) {
    var d = typeof decimals === "number" ? decimals : 2;
    var num = Number(val) || 0;
    var fixed = d === 0 ? String(Math.round(num)) : round2(num).toFixed(d);
    var parts = fixed.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return "RM" + parts.join(".");
  }

  function fmtInt(val) {

  /* =========================================================================
     MAKMAL 3: mat53_deduktibel_koinsurans_lab
     Simulator Deduktibel, Ko-Insurans Harta (80%/70%) & Ko-Insurans Perubatan
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat53_deduktibel_koinsurans_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab || "deduktibel";
    if (tab !== "deduktibel" && tab !== "harta" && tab !== "perubatan") tab = "deduktibel";

    // Deductible state
    var dedLoss = typeof ps.dedLoss === "number" ? ps.dedLoss : 2800;
    var dedAmt = typeof ps.dedAmt === "number" ? ps.dedAmt : 300;
    var mandatory400 = Boolean(ps.mandatory400);

    // Property co-insurance state
    var propVal = typeof ps.propVal === "number" ? ps.propVal : 350000;
    var coPct = typeof ps.coPct === "number" ? ps.coPct : 80;
    var bought = typeof ps.bought === "number" ? ps.bought : 200000;
    var propLoss = typeof ps.propLoss === "number" ? ps.propLoss : 25000;
    var propDed = typeof ps.propDed === "number" ? ps.propDed : 2000;

    // Medical co-insurance state
    var medBill = typeof ps.medBill === "number" ? ps.medBill : 20600;
    var medDed = typeof ps.medDed === "number" ? ps.medDed : 500;
    var medInsPct = typeof ps.medInsPct === "number" ? ps.medInsPct : 80;

    function calcDed() {
      var effDed = dedAmt + (mandatory400 ? 400 : 0);
      var eligible = dedLoss > effDed;
      var pampasan = eligible ? round2(dedLoss - effDed) : 0;
      var ownerPays = eligible ? effDed : dedLoss;
      return { effDed: effDed, eligible: eligible, pampasan: pampasan, ownerPays: ownerPays };
    }

    function calcHarta() {
      var required = round2((coPct / 100) * propVal);
      var isTotalLoss = propLoss >= propVal;
      var metRule = bought >= required;
      var pampasan = 0;
      var penalty = 0;
      var status = "MEMENUHI SYARAT KO-INSURANS";

      if (isTotalLoss) {
        status = "KERUGIAN MENYELURUH (M - D)";
        pampasan = Math.max(0, round2(bought - propDed));
        penalty = 0;
      } else if (metRule) {
        var capped = Math.min(propLoss, bought);
        pampasan = Math.max(0, round2(capped - propDed));
        penalty = 0;
        if (bought > required) status = "HAD INDEMNITI (TIDAK MELEBIHI KERUGIAN SEBENAR)";
      } else {
        status = "PENALTI KO-INSURANS (M < R)";
        var ratioLoss = round2((bought / required) * propLoss);
        var beforeDed = Math.min(bought, ratioLoss);
        pampasan = Math.max(0, round2(beforeDed - propDed));
        penalty = Math.max(0, round2(propLoss - ratioLoss));
      }
      var ownerTotal = Math.max(0, round2(propLoss - pampasan));
      return {
        required: required,
        isTotalLoss: isTotalLoss,
        metRule: metRule,
        pampasan: pampasan,
        penalty: penalty,
        ownerTotal: ownerTotal,
        status: status
      };
    }

    function calcMed() {
      var ownerPct = 100 - medInsPct;
      var afterDed = Math.max(0, round2(medBill - medDed));
      var insPay = round2(afterDed * (medInsPct / 100));
      var ownerCo = round2(afterDed * (ownerPct / 100));
      var ownerTotal = round2(Math.min(medBill, medDed) + ownerCo);
      return {
        ownerPct: ownerPct,
        afterDed: afterDed,
        insPay: insPay,
        ownerCo: ownerCo,
        ownerTotal: ownerTotal
      };
    }

    function buildBarSvg(title, segA, segB, segC, total) {
      var tot = Math.max(total, 1);
      var wA = Math.round((segA.val / tot) * 480);
      var wB = Math.round((segB.val / tot) * 480);
      var wC = segC ? Math.max(0, 480 - wA - wB) : 0;
      return [
        '<svg viewBox="0 0 560 156" aria-label="' + esc(title) + '">',
        '  <rect x="6" y="6" width="548" height="144" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>',
        '  <text x="280" y="28" text-anchor="middle" font-family="Lexend,sans-serif" font-size="10.8" font-weight="800" fill="#fde68a">' + esc(title) + "</text>",
        '  <rect x="40" y="52" width="480" height="34" rx="8" fill="#1e293b"/>',

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

  var applyStep = function () {

    hideFeedbackDrawer();
    notaState.answeredCurrent = false;

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
