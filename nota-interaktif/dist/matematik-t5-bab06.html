  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t5-bab06","subject":"Matematik","subjectGroup":"teras","form":5,"chapterNumber":6,"title":"Nisbah dan Graf Fungsi Trigonometri","subtitle":"Subtopik 6.1–6.2 KSSM (35 Langkah Bit-by-Bit) — Bulatan Unit (kos θ, sin θ), 4 Sukuan & Petua ASTC, Sudut Rujukan Sepadan α, Sudut Khas (30°, 45°, 60°) & Sudut Paksi, Persamaan sin/kos/tan θ = k, Graf Asas & Asimptot, Kesan Pemalar a, b, c serta Permodelan Gelombang.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t5-bab06-labs.js","coverIcon":"../assets/icons/mat56-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan nisbah sukuan dan graf trigonometri kamu amat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Ketepatan sudut rujukan dan gelombang kamu terus membara!","encourage":"[encouraging] Hampir tepat! Cuba semak semula sukuan A S T C dan tanda koordinat x atau y dengan teliti ya.","celebrate":"[excited] Tahniah! Kamu telah berjaya menakluki unit Matematik Tingkatan lima Bab enam ini dengan cemerlang!"},"units":[{"id":"mat56-u1","title":"Unit 1: Bulatan Unit, 4 Sukuan & Nisbah (kos θ, sin θ)","subtitle":"Subtopik 6.1 (Bhg. A) — Warisan Hipparchus, Bulatan Unit r = 1, Putaran Lawan Jam 0°–360°, Koordinat (x, y) & Sudut Paksi","iconType":"compass","iconUrl":"../assets/icons/mat56-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Bulatan Unit & Koordinat P","voiceCaption":"Bulatan unit mempunyai jejari 1 unit berpusat di asalan; bagi titik P(x, y) pada sudut θ lawan jam, kos θ = x dan sin θ = y.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan lima, Bab enam, Nisbah dan Graf Fungsi Trigonometri! Tahukah kamu ahli astronomi purba Hipparchus dari Nicaea digelar Bapa Trigonometri kerana merangka sifir sudut awal untuk mengkaji bintang? Hari ini, konsep yang sama dimodelkan menggunakan bulatan unit, iaitu bulatan berjejari satu unit yang berpusat di asalan O! Tonton video tiga dimensi ini dan perhatikan bagaimana titik P yang berputar mengikut arah lawan jam dari paksi x positif menghasilkan koordinat kosinus teta dan sinus teta serta gelombang berkala!","title":"Bulatan Unit (r = 1), Putaran Lawan Jam & Koordinat (kos θ, sin θ)","acronym":"K•S•T","hook":"Ingat pasangan abjad: (x, y) sepadan dengan (kos θ, sin θ) mengikut susunan huruf k-s, dan tan θ ialah nisbah tegak bahagi mengufuk iaitu y/x!","mediaKey":"mat56_bulatan_unit","videoClip":{"src":"../assets/matematik-t5-bab06/video/mat56_video_trigonometri_gelombang.mp4","posterKey":"mat56_video_poster","caption":"Putaran jejari bulatan unit menghasilkan gelombang sinus dan kosinus secara berkala."},"summary":"Dalam bulatan unit berjejari 1 unit berpusat di O(0, 0), setiap titik P(x, y) pada lilitan pada sudut θ yang diukur lawan jam dari paksi-x positif memberikan nilai kos θ = x dan sin θ = y.","bullets":["Takrif Bulatan Unit & Arah Sudut: Bulatan unit berpusat di (0, 0) dengan jejari OP = 1. Sudut θ diukur daripada paksi-x positif mengikut arah LAWAN JAM dari 0° hingga 360°, membahagikan satah kepada Sukuan I (0° < θ < 90°), Sukuan II (90° < θ < 180°), Sukuan III (180° < θ < 270°) dan Sukuan IV (270° < θ < 360°).","Hubungan Koordinat & Nisbah Trigonometri: Kerana hipotenus jejari OP = 1, maka kos θ = koordinat-x, sin θ = koordinat-y, dan tan θ = koordinat-y / koordinat-x = sin θ / kos θ (selagi x ≠ 0). Apabila titik P bergerak ke sukuan berbeza, tanda x dan y menentukan tanda (+ atau −) nisbah tersebut."],"labId":"mat56_bulatan_unit_astc_lab","labTitle":"Simulator Bulatan Unit Interaktif (0° – 360°)","labProps":{"tab":"circle","angle":40},"examTip":"Semasa menjawab soalan bulatan unit, sentiasa semak persamaan x² + y² = 1 jika salah satu koordinat diberi tanpa sudut, kemudian baca x untuk kos θ dan y untuk sin θ."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 4 Sukuan Bulatan Unit","voiceCaption":"Kelaskan enam sudut dan koordinat titik P berikut mengikut sukuan I, II, III atau IV pada bulatan unit.","voiceScript":"[confident] Jom uji kecekapan kamu membaca satah Cartes! Isihkan keenam-enam sudut dan pasangan koordinat titik P berikut ke dalam Sukuan satu hingga dua atau Sukuan tiga hingga empat yang tepat.","prompt":"Isihkan setiap sudut dan koordinat titik P pada bulatan unit ke dalam kumpulan sukuan yang betul:","buckets":[{"id":"q12","label":"Sukuan I (0°–90°) / Sukuan II (90°–180°)"},{"id":"q34","label":"Sukuan III (180°–270°) / Sukuan IV (270°–360°)"}],"items":[{"text":"θ = 148° dengan koordinat P(−0.8480, 0.5299) berada di atas paksi-x negatif","bucketId":"q12","note":"90° < 148° < 180° dengan x negatif dan y positif -> Sukuan II."},{"text":"θ = 217° dengan kedua-dua koordinat P(−0.7986, −0.6018) bernilai negatif","bucketId":"q34","note":"180° < 217° < 270° dengan x negatif dan y negatif -> Sukuan III."},{"text":"θ = 64° dengan kedua-dua koordinat P(0.4384, 0.8988) bernilai positif","bucketId":"q12","note":"0° < 64° < 90° dengan (+x, +y) -> Sukuan I."},{"text":"θ = 322° dengan koordinat P(0.7880, −0.6157) berada di bawah paksi-x positif","bucketId":"q34","note":"270° < 322° < 360° dengan (+x, −y) -> Sukuan IV."},{"text":"Titik P(−0.5, 0.8660) yang mempunyai sin θ positif tetapi kos θ negatif","bucketId":"q12","note":"x < 0 dan y > 0 berada tepat dalam Sukuan II."},{"text":"Titik P(0.6, −0.8) yang terletak di kuadran kanan bawah bulatan unit","bucketId":"q34","note":"x > 0 dan y < 0 berada dalam Sukuan IV."}],"explanation":"Sukuan I (+x, +y) dan II (−x, +y) berada di separuh atas paksi-x (0° hingga 180°), manakala Sukuan III (−x, −y) dan IV (+x, −y) berada di separuh bawah paksi-x (180° hingga 360°)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Sudut Paksi & Tak Tertakrif","voiceCaption":"Pada sudut paksi 0°, 90°, 180°, 270° dan 360°, titik P berada di (1, 0), (0, 1), (−1, 0) dan (0, −1); nilai tan 90° dan tan 270° tidak tertakrif kerana kos θ = 0.","voiceScript":"[curious] Pernahkah kalkulator kamu memaparkan mesej ralat apabila mengira tangen sembilan puluh darjah atau tangen dua ratus tujuh puluh darjah? Mari bongkar puncanya menggunakan tab Sudut Paksi dalam makmal! Pada sudut sembilan puluh darjah, titik P terletak pada koordinat sifar, satu. Kerana tangen ialah y bahagi x, iaitu satu bahagi sifar, pembahagian dengan sifar menjadi tidak tertakrif!","title":"Nisbah Tangen (y/x) & Lima Sudut Paksi (0°, 90°, 180°, 270°, 360°)","acronym":"P•A•K•S•I","hook":"Apabila jejari OP berhenti tepat di atas paksi-y pada 90° atau 270°, nilai x menjadi sifar — menjadikan tan 90° dan tan 270° mustahil dikira!","mediaKey":"mat56_sukuan_paksi","summary":"Sudut sempadan antara sukuan iaitu 0°, 90°, 180°, 270° dan 360° tidak termasuk dalam mana-mana sukuan, tetapi nilai sin, kos dan tan mereka dibaca terus daripada titik paksi bulatan unit.","bullets":["Koordinat Paksi Mengufuk (0°, 180°, 360°): Pada 0° dan 360°, P(1, 0) memberikan kos = 1, sin = 0, tan = 0/1 = 0. Pada 180°, P(−1, 0) memberikan kos = −1, sin = 0, tan = 0/(−1) = 0.","Koordinat Paksi Mencancang (90°, 270°): Pada 90°, P(0, 1) memberikan kos 90° = 0 dan sin 90° = 1; pada 270°, P(0, −1) memberikan kos 270° = 0 dan sin 270° = −1. Kedua-dua tan 90° dan tan 270° adalah TIDAK TERTAKRIF kerana penyebut x = 0."],"labId":"mat56_bulatan_unit_astc_lab","labTitle":"Inspektor Sudut Paksi & Pembahagian Sifar","labProps":{"tab":"axes","axisAngle":90},"examTip":"Dalam jadual nilai dan lakaran graf tangen y = tan x, titik 90° dan 270° diwakili oleh garis tegak putus-putus yang dikenali sebagai asimptot."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Sudut Paksi & Koordinat","voiceCaption":"Padankan lima pernyataan sudut paksi dan koordinat bulatan unit berikut dengan nilai trigonometri yang tepat.","voiceScript":"[confident] Uji ingatan pantas kamu! Padankan kelima-lima kedudukan titik P dan sudut paksi ini dengan nilai sinus, kosinus atau tangennya yang betul.","prompt":"Padankan sudut paksi atau koordinat titik P dengan nilai fungsi trigonometri yang sepadan:","pairs":[{"id":"u1m1","left":"Titik P(0, 1) pada sudut θ = 90°","right":"sin 90° = 1, kos 90° = 0, tan 90° tidak tertakrif"},{"id":"u1m2","left":"Titik P(−1, 0) pada sudut θ = 180°","right":"sin 180° = 0, kos 180° = −1, tan 180° = 0"},{"id":"u1m3","left":"Titik P(0, −1) pada sudut θ = 270°","right":"sin 270° = −1, kos 270° = 0, tan 270° tidak tertakrif"},{"id":"u1m4","left":"Titik P(1, 0) pada sudut θ = 0° atau 360°","right":"sin θ = 0, kos θ = 1, tan θ = 0"},{"id":"u1m5","left":"Titik P(−0.6, 0.8) dalam Sukuan II","right":"kos θ = −0.6, sin θ = 0.8, tan θ = −1.3333"}],"explanation":"Sentiasa ingat x = kos θ, y = sin θ dan tan θ = y/x; sebarang pembahagian dengan x = 0 pada 90° dan 270° menghasilkan nilai tangen yang tidak tertakrif."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Nilai Titik P Sukuan III","voiceCaption":"Ramalkan nilai sin θ, kos θ dan tan θ bagi satu titik P(−0.6, −0.8) yang terletak dalam Sukuan III pada bulatan unit.","voiceScript":"[curious] Cuba ramalkan sebelum menguji pada simulator! Jika titik P berada pada koordinat negatif sifar perpuluhan enam, negatif sifar perpuluhan lapan di lilitan bulatan unit dalam Sukuan tiga, apakah nilai tepat bagi sinus, kosinus dan tangen sudut teta tersebut?","hook":"Perhatikan tanda negatif bagi kedua-dua x dan y apabila membahagi y dengan x!","scenario":"Titik P(−0.6, −0.8) terletak pada lilitan bulatan unit dengan sudut θ diukur lawan jam dari paksi-x positif ke Sukuan III.","prompt":"Manakah himpunan nilai sin θ, kos θ dan tan θ yang PALING tepat bagi titik P(−0.6, −0.8)?","options":["sin θ = −0.8, kos θ = −0.6 dan tan θ = +1.3333","sin θ = −0.6, kos θ = −0.8 dan tan θ = +0.7500","sin θ = −0.8, kos θ = −0.6 dan tan θ = −1.3333","sin θ = +0.8, kos θ = −0.6 dan tan θ = −1.3333"],"correctIndex":0,"proofLabId":"mat56_bulatan_unit_astc_lab","proofState":{"tab":"circle","angle":233},"explanation":"sin θ = koordinat-y = −0.8 dan kos θ = koordinat-x = −0.6. Oleh kerana kedua-dua x dan y negatif dalam Sukuan III, tan θ = (−0.8)/(−0.6) = +4/3 ≈ +1.3333 (positif!)."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Prinsip Bulatan Unit","voiceCaption":"Susun blok fakta untuk menyatakan hubungan lengkap koordinat titik P(x, y) pada bulatan unit dengan sin θ, kos θ dan tan θ.","voiceScript":"[confident] Susun semula blok fakta berikut untuk merumuskan definisi rasmi bulatan unit dan cara menentukan ketiga-tiga nisbah trigonometri.","prompt":"Susun blok berikut untuk menerangkan hubungan koordinat (x, y) pada bulatan unit dengan nisbah trigonometri:","hint":"Mulakan dengan jejari bulatan unit, diikuti makna x, y dan nisbah tangen...","answerTokens":["Pada bulatan unit berjejari 1 unit","kos θ bersamaan dengan koordinat-x","sin θ bersamaan dengan koordinat-y","dan tan θ ialah y bahagi x"],"distractors":["kerana sudut diukur mengikut arah jam","dengan tan 90° bernilai sifar"],"explanation":"Kerana jejari r = 1, kos θ = x/1 = x, sin θ = y/1 = y, dan tan θ = y/x, manakala sudut θ sentiasa diukur mengikut arah lawan jam dari paksi-x positif."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Cabaran SPM: Koordinat Unit","voiceCaption":"Selesaikan soalan berformat SPM mencari nilai tan θ apabila koordinat titik P dalam Sukuan IV ialah (0.28, −0.96).","voiceScript":"[excited] Soalan penutup Unit satu! Titik Q berkoordinat sifar perpuluhan dua lapan, negatif sifar perpuluhan sembilan enam terletak pada lilitan bulatan unit dengan sudut teta dalam Sukuan empat. Hitung nilai tepat tangen teta dalam bentuk pecahan termudah!","stimulusHtml":"<div class='stimulus-note'><strong>Situasi Bulatan Unit:</strong> Jejari <em>OQ</em> membentuk sudut θ (270° &lt; θ &lt; 360°) dengan titik <em>Q</em>(0.28, −0.96) pada lilitan bulatan unit.</div>","prompt":"Hitung nilai bagi kos θ + tan θ dalam bentuk perpuluhan (betul kepada 2 tempat perpuluhan) atau kenal pasti nilai tepat tan θ:","options":["tan θ = −24/7 (≈ −3.43), maka kos θ + tan θ ≈ −3.15","tan θ = −7/24 (≈ −0.29), maka kos θ + tan θ ≈ −0.01","tan θ = +24/7 (≈ +3.43), maka kos θ + tan θ ≈ +3.71","tan θ = −24/7 (≈ −3.43), maka kos θ + tan θ ≈ −4.39"],"correctIndex":0,"explanation":"Dari Q(0.28, −0.96): kos θ = x = 0.28 dan sin θ = y = −0.96. Maka tan θ = (−0.96)/0.28 = −96/28 = −24/7 ≈ −3.4286. Hasil tambah kos θ + tan θ = 0.28 − 3.4286 ≈ −3.15."}]},{"id":"mat56-u2","title":"Unit 2: Sudut Rujukan Sepadan α & Petua Tanda ASTC","subtitle":"Subtopik 6.1 (Bhg. B) — Rumus α dalam Sukuan II–IV, Petua ASTC, Sudut Bermint (° ′) & Mod Deg Kalkulator","iconType":"scale","iconUrl":"../assets/icons/mat56-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Petua ASTC & Sudut Rujukan α","voiceCaption":"Petua ASTC menentukan tanda positif atau negatif fungsi trigonometri, manakala sudut rujukan sepadan α sentiasa merupakan sudut tirus ke paksi-x terdekat.","voiceScript":"[warm] Selamat datang ke Unit dua! Bagaimanakah kita menukar sudut besar seperti seratus empat puluh dua darjah atau tiga ratus dua puluh empat darjah kepada sudut tirus yang mudah? Jawapannya ialah sudut rujukan sepadan alfa dan petua A S T C! Ingat peraturan emas ini: sudut rujukan alfa sentiasa diukur ke PAKSI X terdekat dan nilainya sentiasa kurang daripada sembilan puluh darjah. Gunakan dek kad tiga dimensi di bawah untuk menghafal rumus setiap sukuan!","title":"Petua ASTC (Semua, Sin, Tan, Kos) & Sudut Rujukan Sepadan α","acronym":"A•S•T•C","hook":"Peraturan maut sudut rujukan α: sentiasa tolak dengan 180° atau 360° (paksi-x) — JANGAN SEKALI-KALI tolak dengan 90° atau 270°!","mediaKey":"mat56_astc_kompas","summary":"Sudut rujukan sepadan α bagi mana-mana sudut bukan tirus ialah sudut tirus sepadan dalam Sukuan I yang terbentuk antara jejari OP dengan paksi-x terdekat, manakala tandanya mengikut petua ASTC.","bullets":["Rumus Sudut Rujukan Sepadan α (0° < α < 90°): Dalam Sukuan I, α = θ. Dalam Sukuan II (90° < θ < 180°), α = 180° − θ. Dalam Sukuan III (180° < θ < 270°), α = θ − 180°. Dalam Sukuan IV (270° < θ < 360°), α = 360° − θ.","Petua Tanda ASTC Merentas 4 Sukuan: Sukuan I — A (All / Semua +); Sukuan II — S (Sin + sahaja, kos & tan −); Sukuan III — T (Tan + sahaja, sin & kos −); Sukuan IV — C (Cos/Kos + sahaja, sin & tan −)."],"labId":"mat56_sudut_rujukan_flip","labTitle":"Dek Kad 3D: Petua ASTC & Rumus Sudut Rujukan α","labProps":{"tab":"cards"},"examTip":"Hafal akronim 'Semua Suka Tengok Kartun' (I: Semua +, II: Sin +, III: Tan +, IV: Kos +) dan pastikan alfa diukur dari paksi mendatar (180° atau 360°)."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Sudut θ dengan Rumus α","voiceCaption":"Padankan lima sudut θ dalam Sukuan II hingga IV (termasuk ukuran darjah dan minit) dengan sudut rujukan sepadannya α.","voiceScript":"[confident] Uji ketelitian pengiraan kamu termasuk pertukaran satu darjah kepada enam puluh minit! Padankan setiap sudut berikut dengan nilai sudut rujukan sepadannya.","prompt":"Padankan setiap sudut θ berikut dengan sudut rujukan sepadan α yang betul:","pairs":[{"id":"u2m1","left":"θ = 114° (Sukuan II: 180° − θ)","right":"α = 66°"},{"id":"u2m2","left":"θ = 219° (Sukuan III: θ − 180°)","right":"α = 39°"},{"id":"u2m3","left":"θ = 327° (Sukuan IV: 360° − θ)","right":"α = 33°"},{"id":"u2m4","left":"θ = 136° 25′ (Sukuan II: pinjam 1° = 60′)","right":"α = 43° 35′"},{"id":"u2m5","left":"θ = 241° 48′ (Sukuan III: tolak 180°)","right":"α = 61° 48′"}],"explanation":"Untuk sudut berminit seperti 180° − 136° 25′, tulis 180° sebagai 179° 60′ terlebih dahulu supaya 60′ − 25′ = 35′ dan 179° − 136° = 43°, memberikan 43° 35′."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Menilai Nisbah via α & Mod Deg","voiceCaption":"Menentukan nilai fungsi sudut besar melibatkan dua langkah: kenal pasti tanda ASTC sukuannya dan gantikan sudut dengan sudut rujukan sepadan α dalam mod Deg.","voiceScript":"[warm] Sekarang gabungkan tanda A S T C dengan sudut rujukan alfa untuk menilai apa-apa fungsi trigonometri! Mula-mula, tentukan sukuan sudut teta untuk mengunci tanda positif atau negatif. Kedua, hitung sudut rujukan alfa. Jangan lupa pastikan kalkulator saintifik kamu ditetapkan pada mod D E G, bukan R A D!","title":"Menilai sin θ, kos θ dan tan θ Menggunakan Sudut Rujukan & Mod 'Deg'","acronym":"S•α•D","hook":"Dua langkah tanpa gagal: Kunci TANDA mengikut sukuan ASTC dahulu, baru kira nilai fungsi sudut tirus α pada mod Deg!","summary":"Sebarang ungkapan sin θ, kos θ atau tan θ bagi 90° < θ < 360° boleh diungkapkan semula sebagai ±sin α, ±kos α atau ±tan α sebelum dinilai kepada 4 tempat perpuluhan.","bullets":["Algoritma 3 Langkah Penilaian: (1) Tentukan sukuan θ berada (II, III atau IV), (2) Tulis tanda + atau − berdasarkan hukum ASTC bagi fungsi berkenaan, (3) Hitung sudut rujukan sepadan α (180° − θ, θ − 180° atau 360° − θ).","Sudut Berminit & Mod Kalkulator ('Deg'): Pastikan kalkulator sentiasa memaparkan huruf 'D' atau 'Deg' sebelum mengira. Bagi sudut seperti 324° 18′, tekan kekunci darjah-minit-saat (° ′ ″) selepas nilai darjah dan minit untuk ketepatan 4 tempat perpuluhan."],"labId":"mat56_bulatan_unit_astc_lab","labTitle":"Uji Tanda & Sudut Rujukan pada Bulatan Unit","labProps":{"tab":"circle","angle":142},"examTip":"Dalam soalan kertas peperiksaan yang meminta 'nyatakan hubungan fungsi dengan sudut rujukan sepadan', jangan berhenti pada nombor perpuluhan — tulis bentuk seperti '−kos 68°' terlebih dahulu!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Tanda + vs − Mengikut ASTC","voiceCaption":"Kelaskan enam ungkapan trigonometri berikut sama ada menghasilkan nilai positif atau nilai negatif berdasarkan petua ASTC.","voiceScript":"[curious] Tanpa menekan kalkulator, guna petua A S T C untuk mengasingkan keenam-enam ungkapan berikut sama ada nilainya positif atau negatif!","prompt":"Kelaskan ungkapan trigonometri berikut mengikut tanda nilainya (Positif atau Negatif):","buckets":[{"id":"pos","label":"Bernilai Positif (+)"},{"id":"neg","label":"Bernilai Negatif (−)"}],"items":[{"text":"sin 152° (sudut berada dalam Sukuan II)","bucketId":"pos","note":"Sukuan II ialah wilayah S (Sinus positif)."},{"text":"kos 138° (sudut berada dalam Sukuan II)","bucketId":"neg","note":"Dalam Sukuan II, hanya sinus positif; kosinus bernilai negatif."},{"text":"tan 234° (sudut berada dalam Sukuan III)","bucketId":"pos","note":"Sukuan III ialah wilayah T (Tangen positif)."},{"text":"sin 295° (sudut berada dalam Sukuan IV)","bucketId":"neg","note":"Dalam Sukuan IV, hanya kosinus positif; sinus bernilai negatif."},{"text":"kos 311° (sudut berada dalam Sukuan IV)","bucketId":"pos","note":"Sukuan IV ialah wilayah C (Kosinus positif)."},{"text":"tan 169° (sudut berada dalam Sukuan II)","bucketId":"neg","note":"Dalam Sukuan II, tan θ = +y/(−x) adalah negatif."}],"explanation":"Mengikut petua ASTC: Semua positif (Sukuan I), Sin positif (Sukuan II), Tan positif (Sukuan III) dan Kos positif (Sukuan IV)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Ramal Ungkapan Sudut Rujukan","voiceCaption":"Ramalkan ungkapan sudut rujukan sepadan yang tepat bagi pasangan kos 248° dan tan 318°.","voiceScript":"[curious] Cuba ramalkan pasangan bentuk sudut rujukan yang tepat bagi kosinus dua ratus empat puluh lapan darjah dan tangen tiga ratus lapan belas darjah sebelum menyemak pada bulatan unit!","hook":"Kenal pasti sukuan 248° dan 318° dahulu sebelum mengira jarak ke paksi-x terdekat!","scenario":"Dua sudut diberikan: 248° (antara 180° dan 270°) serta 318° (antara 270° dan 360°).","prompt":"Manakah padanan ungkapan sudut rujukan sepadan yang TEPAT bagi kos 248° dan tan 318°?","options":["kos 248° = −kos 68° dan tan 318° = −tan 42°","kos 248° = +kos 68° dan tan 318° = −tan 42°","kos 248° = −kos 22° dan tan 318° = −tan 48°","kos 248° = −kos 68° dan tan 318° = +tan 42°"],"correctIndex":0,"proofLabId":"mat56_bulatan_unit_astc_lab","proofState":{"tab":"circle","angle":318},"explanation":"248° di Sukuan III (tan sahaja +) dengan α = 248° − 180° = 68°, maka kos 248° = −kos 68°. Manakala 318° di Sukuan IV (kos sahaja +) dengan α = 360° − 318° = 42°, maka tan 318° = −tan 42°."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Kaedah Sudut Rujukan","voiceCaption":"Susun turutan langkah bagi mengungkapkan dan menilai tan 324° 18′ menggunakan sudut rujukan sepadan.","voiceScript":"[confident] Susun blok langkah berikut untuk menjelaskan pengiraan tangen tiga ratus dua puluh empat darjah lapan belas minit dengan tepat!","prompt":"Susun langkah pengiraan nilai tan 324° 18′ mengikut urutan yang tepat:","hint":"Mulakan dengan menentukan sukuan dan tandanya, diikuti sudut rujukan 360° − θ...","answerTokens":["Sudut 324° 18′ terletak dalam Sukuan IV","maka nilai tangen bertanda negatif","dengan sudut rujukan α = 360° − 324° 18′ = 35° 42′","jadi tan 324° 18′ = −tan 35° 42′"],"distractors":["maka nilai tangen bertanda positif","dengan sudut rujukan α = 324° 18′ − 270°"],"explanation":"Dalam Sukuan IV, hanya kosinus positif. Menolak dari paksi-x 360° (ditulis sebagai 359° 60′) memberikan α = 35° 42′, jadi tan 324° 18′ = −tan 35° 42′ ≈ −0.7186."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s7","voiceToneLabel":"Cabaran SPM: Sudut Berminit","voiceCaption":"Hitung nilai kos 214° 36′ berdasarkan sudut rujukan sepadannya apabila diberi kos 34° 36′ = 0.8231.","voiceScript":"[excited] Soalan penutup Unit dua! Diberi kosinus tiga puluh empat darjah tiga puluh enam minit ialah sifar perpuluhan lapan dua tiga satu, dan sinus lima puluh lima darjah dua puluh empat minit ialah sifar perpuluhan lapan dua tiga satu. Tanpa kalkulator, apakah nilai tepat kosinus dua ratus empat belas darjah tiga puluh enam minit?","stimulusHtml":"<div class='stimulus-note'><strong>Maklumat Diberi:</strong> kos 34° 36′ = 0.8231 &nbsp;|&nbsp; sin 34° 36′ = 0.5678</div>","prompt":"Berdasarkan sudut rujukan sepadan, tentukan nilai kos 214° 36′:","options":["−0.8231","+0.8231","−0.5678","+0.5678"],"correctIndex":0,"explanation":"214° 36′ berada dalam Sukuan III (180° < θ < 270°), di mana kosinus bernilai negatif. Sudut rujukan sepadannya ialah α = 214° 36′ − 180° = 34° 36′. Maka kos 214° 36′ = −kos 34° 36′ = −0.8231."}]},{"id":"mat56-u3","title":"Unit 3: Sudut Khas (30°, 45°, 60°) & Penyelesaian Persamaan θ","subtitle":"Subtopik 6.1 (Bhg. C) — Jadual Surd Tanpa Kalkulator, Mencari θ daripada sin/kos/tan θ = k & Masalah Geometri","iconType":"formula","iconUrl":"../assets/icons/mat56-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Sudut Khas 30°, 45°, 60° (Surd)","voiceCaption":"Sudut khas 30°, 45° dan 60° mempunyai nilai pecahan surd tepat (1/2, 1/√2, √3/2, √3) untuk menilai sudut sukuan II–IV tanpa kalkulator.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam peperiksaan S P M, soalan sering mengarahkan kamu menghitung nilai sudut seperti kosinus seratus lima puluh darjah atau tangen dua ratus dua puluh lima darjah TANPA menggunakan kalkulator saintifik! Kuncinya ialah menghafal nilai surd tepat bagi tiga sudut khas: tiga puluh darjah, empat puluh lima darjah dan enam puluh darjah daripada segi tiga sisi satu, punca kuasa dua tiga, dua dan satu, satu, punca kuasa dua dua. Uji sendiri pada tab Sudut Khas makmal di bawah!","title":"Sudut Khas 30°, 45°, 60° dalam Bentuk Surd & Aplikasi Sukuan II–IV","acronym":"30•45•60","hook":"Trik mudah ingat sin 30°, 45°, 60°: √1/2, √2/2, √3/2 — untuk kosinus, terbalikkan sahaja susunannya!","mediaKey":"mat56_sudut_khas","summary":"Nilai sinus, kosinus dan tangen bagi sudut dalam Sukuan II, III dan IV yang berpadanan dengan α = 30°, 45° atau 60° (iaitu 120°, 135°, 150°, 210°, 225°, 240°, 300°, 315°, 330°) dapat ditentukan tepat dalam bentuk surd tanpa kalkulator.","bullets":["Jadual Nilai Khas Tepat: Untuk 30°: sin = 1/2, kos = √3/2, tan = 1/√3. Untuk 45°: sin = 1/√2, kos = 1/√2, tan = 1. Untuk 60°: sin = √3/2, kos = 1/2, tan = √3.","Penilaian Tanpa Kalkulator: sin 150° (Sukuan II, sin +, α = 30°) = +sin 30° = 1/2; kos 225° (Sukuan III, kos −, α = 45°) = −kos 45° = −1/√2; tan 300° (Sukuan IV, tan −, α = 60°) = −tan 60° = −√3."],"labId":"mat56_bulatan_unit_astc_lab","labTitle":"Simulator Sudut Khas & Surd Tanpa Kalkulator","labProps":{"tab":"special","specBase":30,"specQuad":2},"examTip":"Jika soalan berbunyi 'Diberi sin θ = √3/2, hitung kos θ dan tan θ tanpa kalkulator', semak sama ada θ boleh berada dalam dua sukuan (Sukuan I dan Sukuan II) supaya kedua-dua jawapan + dan − disertakan jika julat tidak dihadkan!"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Sudut Khas 120°–330°","voiceCaption":"Padankan lima ungkapan sudut sukuan II, III dan IV berikut dengan nilai pecahan surd tepatnya tanpa kalkulator.","voiceScript":"[confident] Tanpa kalkulator, gabungkan tanda sukuan A S T C dengan nilai surd tiga puluh, empat puluh lima dan enam puluh darjah untuk memadankan kesemua lima pasangan berikut!","prompt":"Padankan sudut sukuan II–IV berikut dengan nilai surd tepatnya tanpa menggunakan kalkulator:","pairs":[{"id":"u3m1","left":"sin 120° (Sukuan II, α = 60°)","right":"+√3 / 2"},{"id":"u3m2","left":"kos 135° (Sukuan II, α = 45°)","right":"−1 / √2"},{"id":"u3m3","left":"tan 210° (Sukuan III, α = 30°)","right":"+1 / √3"},{"id":"u3m4","left":"kos 240° (Sukuan III, α = 60°)","right":"−1 / 2"},{"id":"u3m5","left":"sin 330° (Sukuan IV, α = 30°)","right":"−1 / 2"}],"explanation":"sin 120° = +sin 60° = √3/2; kos 135° = −kos 45° = −1/√2; tan 210° = +tan 30° = 1/√3; kos 240° = −kos 60° = −1/2; dan sin 330° = −sin 30° = −1/2."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Cari Sudut θ & Aplikasi Geometri","voiceCaption":"Untuk mencari θ apabila sin/kos/tan θ = k diberi, tentukan dua sukuan dari tanda k, cari α = f⁻¹(|k|) tanpa tanda negatif, lalu hitung θ.","voiceScript":"[warm] Sekarang kita melakukan proses terbalik: mencari sudut teta apabila nilai sinus, kosinus atau tangennya diberi dalam julat sifar hingga tiga ratus enam puluh darjah! Perangkap paling besar pelajar ialah menekan tanda negatif ke dalam kalkulator semasa mencari sudut rujukan. Ingat: abaikan tanda negatif dahulu untuk mencari alfa, kerana tanda positif atau negatif hanya bertugas memberitahu kita DUA sukuan mana sudut teta itu bersembunyi! Buka tab Penyelesai pada makmal untuk mengujinya.","title":"Menentukan Sudut θ (0° ≤ θ ≤ 360°) daripada Nilai k & Aplikasi Geometri","acronym":"S•α•θ","hook":"Perangkap maut SPM: JANGAN tekan tanda negatif semasa mengira sin⁻¹, kos⁻¹ atau tan⁻¹ pada kalkulator — tanda hanya menentukan SUKUAN!","summary":"Setiap persamaan sin θ = k, kos θ = k atau tan θ = k (k ≠ 0, ±1) mempunyai tepat dua penyelesaian dalam julat 0° ≤ θ ≤ 360°; prinsip yang sama digunakan pada rajah segitiga garis lurus, lengan robotik dan jam.","bullets":["3 Langkah Selesai sin θ = k, kos θ = k atau tan θ = k: (1) Kenal pasti 2 sukuan berdasarkan tanda + atau − nilai k, (2) Hitung sudut rujukan sepadan α = sin⁻¹|k|, kos⁻¹|k| atau tan⁻¹|k| (sentiasa positif!), (3) Hitung kedua-dua θ: Sukuan I (α), Sukuan II (180° − α), Sukuan III (180° + α), Sukuan IV (360° − α).","Aplikasi Segitiga, Robotik & Jam: Apabila sudut cakah atau refleks terbentuk di luar segitiga bersudut tegak pada garis lurus, gunakan sisi segitiga sebagai sudut rujukan α dan tentukan tanda mengikut sukuan (cth. lengan robotik berputar ke Sukuan II mempunyai kos θ negatif, manakala setiap selang nombor jam menyumbang 360°/12 = 30°)."],"labId":"mat56_sudut_rujukan_flip","labTitle":"Penyelesai Interaktif Persamaan sin/kos/tan θ = k","labProps":{"tab":"solver","fn":"kos","k":-0.4226},"examTip":"Semak julat sudut dalam soalan dengan teliti: jika soalan mengehadkan 0° ≤ θ ≤ 180°, hanya sukuan I dan II diterima walaupun terdapat satu lagi penyelesaian di sukuan III atau IV."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Dua Sudut bagi kos θ = −0.5","voiceCaption":"Ramalkan kedua-dua nilai sudut θ dalam julat 0° ≤ θ ≤ 360° apabila diberi kos θ = −0.5.","voiceScript":"[curious] Cuba ramalkan tanpa kalkulator! Jika kosinus teta sama dengan negatif sifar perpuluhan lima dalam julat sifar hingga tiga ratus enam puluh darjah, apakah dua nilai sudut teta yang memenuhi persamaan ini?","hook":"Kosinus bernilai negatif bermaksud koordinat-x berada di sebelah KIRI paksi-y!","scenario":"Diberi kos θ = −0.5 bagi 0° ≤ θ ≤ 360°.","prompt":"Apakah kesemua nilai sudut θ yang tepat?","options":["120° dan 240°","60° dan 300°","150° dan 210°","120° dan 300°"],"correctIndex":0,"proofLabId":"mat56_bulatan_unit_astc_lab","proofState":{"tab":"special","specBase":60,"specQuad":2},"explanation":"kos θ bernilai negatif dalam Sukuan II dan Sukuan III. Sudut rujukan sepadan α = kos⁻¹(0.5) = 60°. Maka θ = 180° − 60° = 120° (Sukuan II) atau 180° + 60° = 240° (Sukuan III)."},{"type":"sort","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Isih Pasangan Sukuan Persamaan","voiceCaption":"Asingkan enam persamaan sin θ = k, kos θ = k dan tan θ = k mengikut pasangan sukuan penyelesaiannya yang betul.","voiceScript":"[confident] Sebelum mengira nilai sudut rujukan, pastikan kamu cekap memadankan setiap persamaan dengan DUA sukuan penyelesaiannya! Isihkan keenam-enam persamaan ini dengan tepat.","prompt":"Isihkan persamaan trigonometri berikut mengikut sama ada penyelesaiannya melibatkan Sukuan II atau tidak:","buckets":[{"id":"ada_q2","label":"Melibatkan Sukuan II (bersama I, III atau IV)"},{"id":"tiada_q2","label":"TIDAK Melibatkan Sukuan II (I & III, I & IV atau III & IV)"}],"items":[{"text":"sin θ = +0.7660 (sinus bertanda positif)","bucketId":"ada_q2","note":"sin θ > 0 terletak dalam Sukuan I dan Sukuan II."},{"text":"kos θ = −0.5829 (kosinus bertanda negatif)","bucketId":"ada_q2","note":"kos θ < 0 terletak dalam Sukuan II dan Sukuan III."},{"text":"tan θ = −1.1980 (tangen bertanda negatif)","bucketId":"ada_q2","note":"tan θ < 0 terletak dalam Sukuan II dan Sukuan IV."},{"text":"tan θ = +0.8391 (tangen bertanda positif)","bucketId":"tiada_q2","note":"tan θ > 0 terletak dalam Sukuan I dan Sukuan III."},{"text":"kos θ = +0.9336 (kosinus bertanda positif)","bucketId":"tiada_q2","note":"kos θ > 0 terletak dalam Sukuan I dan Sukuan IV."},{"text":"sin θ = −0.7314 (sinus bertanda negatif)","bucketId":"tiada_q2","note":"sin θ < 0 terletak dalam Sukuan III dan Sukuan IV."}],"explanation":"Mengikut ASTC, setiap fungsi bernilai positif dalam 2 sukuan dan negatif dalam 2 sukuan lain. Sukuan II muncul bagi sin (+), kos (−) dan tan (−)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Langkah Selesai tan θ = −1.4826","voiceCaption":"Susun langkah menyelesaikan persamaan tan θ = −1.4826 bagi julat 0° ≤ θ ≤ 360° tanpa tersilap tanda.","voiceScript":"[confident] Susun blok langkah berikut untuk menyelesaikan persamaan tangen teta sama dengan negatif satu perpuluhan empat lapan dua enam dengan tepat!","prompt":"Susun turutan penyelesaian persamaan tan θ = −1.4826 bagi 0° ≤ θ ≤ 360°:","hint":"Kenal pasti sukuan negatif bagi tangen, cari α = tan⁻¹(1.4826) = 56°, kemudian hitung dua sudut...","answerTokens":["Tanda negatif bermakna θ di Sukuan II dan IV","kira sudut rujukan α = tan⁻¹(1.4826) = 56°","maka θ = 180° − 56° atau 360° − 56°","iaitu θ = 124° dan 304°"],"distractors":["tekan tan⁻¹(−1.4826) terus untuk mendapat −56°","iaitu θ = 56° dan 236°"],"explanation":"Abaikan tanda negatif semasa menekan kalkulator: tan⁻¹(1.4826) = 56°. Oleh kerana tan θ negatif dalam Sukuan II dan IV, penyelesaiannya ialah 180° − 56° = 124° dan 360° − 56° = 304°."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Cabaran Geometri & Putaran Jam","voiceCaption":"Selesaikan masalah aplikasi menentukan sudut putaran jarum jam mengikut arah lawan jam dari nombor 2 ke nombor 7 serta nilai tepat kos θ.","voiceScript":"[excited] Soalan aplikasi penutup Unit tiga! Pada muka sebuah jam dinding, jarum minit diputar mengikut arah LAWAN JAM dari nombor dua ke nombor tujuh. Hitung sudut teta yang dicangkum dan nilai tepat kosinus teta tanpa kalkulator!","stimulusHtml":"<div class='stimulus-note'><strong>Masalah Putaran Jam:</strong> Sebuah muka jam dibahagikan kepada 12 selang nombor yang sama besar (360° ÷ 12 = 30° setiap selang). Jarum minit diputar <strong>lawan arah jam</strong> dari nombor <strong>2</strong> hingga nombor <strong>7</strong>.</div>","prompt":"Berapakah sudut θ yang dicangkum dan nilai tepat bagi kos θ?","options":["θ = 210° dan kos 210° = −√3 / 2","θ = 150° dan kos 150° = −√3 / 2","θ = 210° dan kos 210° = +√3 / 2","θ = 240° dan kos 240° = −1 / 2"],"correctIndex":0,"explanation":"Mengikut arah lawan jam dari nombor 2 ke nombor 7 (2 -> 1 -> 12 -> 11 -> 10 -> 9 -> 8 -> 7) merangkumi 7 selang nombor = 7 × 30° = 210°. Sudut 210° terletak dalam Sukuan III (α = 210° − 180° = 30°), maka kos 210° = −kos 30° = −√3 / 2."}]},{"id":"mat56-u4","title":"Unit 4: Graf Sinus, Kosinus, Tangen & Kesan Pemalar a, b, c","subtitle":"Subtopik 6.2 — Ciri Graf Asas, Asimptot 90°/270°, Amplitud |a|, Pemantulan, Tempoh, Anjakan c & Permodelan Nyata","iconType":"graph","iconUrl":"../assets/icons/mat56-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"3 Graf Asas Sin, Kos & Tan","voiceCaption":"Graf y = sin x dan y = kos x berbentuk gelombang berkala tempoh 360° antara −1 dan 1, manakala y = tan x mempunyai tempoh 180° dan asimptot tegak di 90° dan 270°.","voiceScript":"[warm] Selamat datang ke Unit empat, iaitu separuh kedua Bab enam: Graf Fungsi Sinus, Kosinus dan Tangen! Tahukah kamu bacaan elektrokardiogram jantung, gelombang bunyi konsert, dan data gempa bumi kesemuanya mengikuti corak fungsi berkala? Kenali tiga rupa asas bagi sifar hingga tiga ratus enam puluh darjah: graf sinus bermula di asalan dengan puncak satu pada sembilan puluh darjah; graf kosinus berbentuk lembah bermula di satu; manakala graf tangen berulang setiap seratus lapan puluh darjah dan melonjak ke infiniti pada asimptot sembilan puluh darjah dan dua ratus tujuh puluh darjah!","title":"Ciri-Ciri Lengkap Graf Asas: y = sin x, y = kos x & y = tan x (0° ≤ x ≤ 360°)","acronym":"M•M•P•T","hook":"Puncak sinus di 90°, puncak kosinus di 0° & 360°, manakala tangen tidak mempunyai had tinggi dan putus di asimptot 90° & 270°!","mediaKey":"mat56_tiga_graf","summary":"Setiap graf fungsi trigonometri asas mempunyai rupa gelombang, nilai ekstrem, pintasan paksi dan tempoh kitaran yang unik dalam domain 0° ≤ x ≤ 360°.","bullets":["Graf Sinus (y = sin x) vs Kosinus (y = kos x): Kedua-duanya mempunyai nilai maksimum 1, nilai minimum −1, amplitud 1 dan tempoh 360°. Graf y = sin x memintas paksi-y di 0, memintas paksi-x di 0°, 180°, 360° (maks di 90°, min di 270°). Graf y = kos x memintas paksi-y di 1 (maks di 0° & 360°, min di 180°) dan memintas paksi-x di 90°, 270°.","Graf Tangen (y = tan x): Mempunyai nilai maksimum +∞ dan minimum −∞ (tiada amplitud), memintas paksi-y di 0 serta paksi-x di 0°, 180°, 360°. Tempoh lengkapnya ialah 180° dan graf mendekati garis asimptot tegak di x = 90° dan x = 270° tanpa menyentuhnya (tidak tertakrif)."],"labId":"mat56_graf_sin_kos_tan_lab","labTitle":"Pemplot Graf Interaktif Sinus, Kosinus & Tangen","labProps":{"fn":"sin","a":1,"b":1,"c":0},"examTip":"Untuk membezakan ketiga-tiga graf dalam Sukuan I (0° ≤ x ≤ 90°), semak pintasan-y pada x = 0° (kos = 1 manakala sin & tan = 0) serta kelajuan menaik pada x = 45° (tan 45° = 1 > sin 45° = kos 45° ≈ 0.707)."},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Ciri 3 Graf Asas","voiceCaption":"Padankan lima ciri utama graf fungsi trigonometri berikut dalam julat 0° ≤ x ≤ 360° dengan fungsi atau nilainya yang tepat.","voiceScript":"[confident] Uji pemerhatian kamu pada ciri pintasan paksi, titik ekstrem dan tempoh ketiga-tiga graf asas dengan memadankan kesemua lima pasangan ini!","prompt":"Padankan fungsi atau ciri graf trigonometri berikut (0° ≤ x ≤ 360°) dengan huraian tepatnya:","pairs":[{"id":"u4m1","left":"Graf y = sin x: Pintasan-x & Nilai Minimum","right":"Memintas paksi-x di 0°, 180°, 360°; minimum −1 di 270°"},{"id":"u4m2","left":"Graf y = kos x: Pintasan-y & Pintasan-x","right":"Pintasan-y di 1; memintas paksi-x di 90° dan 270°"},{"id":"u4m3","left":"Graf y = tan x: Asimptot Tegak & Tempoh","right":"Tidak tertakrif di 90° dan 270°; berulang setiap 180°"},{"id":"u4m4","left":"Titik silang y = sin x dengan y = kos x (0° ≤ x ≤ 90°)","right":"Bersilang pada x = 45° dengan nilai y ≈ 0.7071"},{"id":"u4m5","left":"Nilai maksimum & minimum bagi y = tan x","right":"+∞ dan −∞ (graf tangen tiada amplitud)"}],"explanation":"Ciri kritikal Kertas 1 & Kertas 2: y = sin x bermula di (0, 0), y = kos x bermula di (0, 1) dengan minimum di 180°, dan y = tan x mempunyai tempoh 180° serta asimptot di 90° dan 270°."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Kesan Pemalar a, b & c","voiceCaption":"Bagi y = a f(bx) + c, |a| menentukan amplitud dan tanda negatif memantul graf, b menentukan tempoh (360°/b atau 180°/b), dan c menganjak graf secara menegak.","voiceScript":"[warm] Sekarang seret ketiga-tiga gelongsor a, b dan c dalam makmal pemplot graf untuk menemui hukum transformasi gelombang! Pemalar a mengawal ketinggian amplitud; jika a bernilai negatif, seluruh gelombang terpantul secara menegak pada garis keseimbangannya! Pemalar b pula mengawal bilangan kitaran dan memampatkan tempoh kepada tiga ratus enam puluh darjah bahagi b bagi sinus dan kosinus, atau seratus lapan puluh darjah bahagi b bagi tangen. Akhirnya, pemalar c menganjakkan seluruh graf ke atas atau ke bawah!","title":"Kesan Pemalar a (Amplitud & Pantulan), b (Tempoh) & c (Anjakan Menegak)","acronym":"A•B•C","hook":"A = Amplitud & Pantul (|a|), B = Bilangan kitaran (Tempoh = 360°/b atau 180°/b), C = Cangkat/Turun menegak (+c ke atas, −c ke bawah)!","summary":"Dalam persamaan y = a sin bx + c, y = a kos bx + c dan y = a tan bx + c, pemalar a mengubah skala menegak (dan memantul jika negatif), b mengubah skala mengufuk serta tempoh, dan c menganjakkan garis keseimbangan.","bullets":["Kesan a (Amplitud |a| & Pemantulan): Bagi sinus dan kosinus, amplitud = |a| = (maks − min) / 2, nilai maks = |a| + c, nilai min = −|a| + c. Jika a < 0 (cth. y = −2 kos x), graf dipantulkan pada garis keseimbangan y = c. Graf tangen TIDAK mempunyai amplitud.","Kesan b (Tempoh & Mampatan) dan c (Anjakan Menegak): Nilai b ialah bilangan kitaran asas dalam 360° (sin/kos) atau 180° (tan). Apabila b bertambah, graf mampat mengufuk dan tempoh berkurang: Tempoh(sin/kos) = 360°/b, manakala Tempoh(tan) = 180°/b. Pemalar c menganjakkan graf c unit ke atas jika c > 0, atau |c| unit ke bawah jika c < 0."],"labId":"mat56_graf_sin_kos_tan_lab","labTitle":"Uji Gelongsor a, b, c & Pemantulan Negatif","labProps":{"fn":"sin","a":2,"b":2,"c":1},"examTip":"Sentiasa berhati-hati dengan soalan tangen seperti y = 3 tan 0.5x − 1: nilai '3' BUKAN amplitud (tulis 'tiada amplitud') dan tempohnya ialah 180° ÷ 0.5 = 360°, bukan 720°!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Tempoh & Asimptot Tangen","voiceCaption":"Ramalkan tempoh lengkap bagi y = 4 tan 0.5x − 1 serta kedudukan asimptot tegak pertama bagi y = tan 2x.","voiceScript":"[curious] Cuba ramalkan dua perangkap klasik graf tangen! Berapakah tempoh lengkap bagi fungsi y sama dengan empat tangen kosong perpuluhan lima x tolak satu, dan pada sudut manakah terletaknya asimptot tegak pertama bagi graf y sama dengan tangen dua x?","hook":"Ingat tempoh asas graf tangen hanyalah separuh daripada sinus dan kosinus iaitu 180°!","scenario":"Bandingkan dua fungsi tangen: Fungsi P ialah y = 4 tan 0.5x − 1 dan Fungsi Q ialah y = tan 2x bagi 0° ≤ x ≤ 360°.","prompt":"Manakah kenyataan yang TEPAT tentang Fungsi P dan asimptot tegak pertama Fungsi Q?","options":["P mempunyai tempoh 360° dan tiada amplitud; asimptot pertama Q terletak di x = 45°","P mempunyai tempoh 720° dan amplitud 4; asimptot pertama Q terletak di x = 90°","P mempunyai tempoh 180° dan amplitud 4; asimptot pertama Q terletak di x = 180°","P mempunyai tempoh 360° dan amplitud −1; asimptot pertama Q terletak di x = 45°"],"correctIndex":0,"proofLabId":"mat56_graf_sin_kos_tan_lab","proofState":{"fn":"tan","a":1,"b":0.5,"c":-1},"explanation":"Bagi graf tangen y = 4 tan 0.5x − 1, tiada amplitud wujud dan tempoh = 180° / 0.5 = 360°. Bagi y = tan 2x, tan tidak tertakrif apabila 2x = 90°, 270°, ... iaitu pada x = 45°, 135°, 225°, 315°."},{"type":"sort","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Isih Kesan a, b dan c","voiceCaption":"Asingkan enam perubahan graf trigonometri berikut kepada kesan pemalar a, kesan pemalar b atau kesan pemalar c.","voiceScript":"[confident] Uji penguasaan transformasi graf kamu! Asingkan keenam-enam perubahan rupa dan kedudukan graf berikut mengikut sama ada ia berpunca daripada pemalar a, pemalar b atau pemalar c.","prompt":"Kelaskan perubahan graf fungsi y = a f(bx) + c berikut mengikut pemalar yang menyebabkan kesannya:","buckets":[{"id":"p_a","label":"Kesan Pemalar a (Amplitud & Pantulan)"},{"id":"p_b","label":"Kesan Pemalar b (Tempoh & Kekerapan)"},{"id":"p_c","label":"Kesan Pemalar c (Anjakan Menegak)"}],"items":[{"text":"Ketinggian puncak gelombang sinus berganda dari 1 unit kepada 3 unit (y = 3 sin x)","bucketId":"p_a","note":"Nilai |a| = 3 menggandakan amplitud gelombang secara menegak."},{"text":"Graf y = −kos x terbalik menjadi bermula di nilai minimum −1 pada x = 0°","bucketId":"p_a","note":"Tanda negatif pada a = −1 memantulkan graf pada paksi-x."},{"text":"Graf y = sin 3x termampat dengan 3 kitaran lengkap dalam 360° (tempoh 120°)","bucketId":"p_b","note":"Nilai b = 3 memampatkan graf mengufuk dan mengecilkan tempoh kepada 360°/3."},{"text":"Tempoh graf y = tan 0.5x memanjang daripada 180° menjadi 360°","bucketId":"p_b","note":"Nilai b = 0.5 mengembangkan graf dan menjadikan tempoh = 180°/0.5 = 360°."},{"text":"Seluruh graf y = kos x + 2 beranjak 2 unit ke atas dengan pintasan-y = 3","bucketId":"p_c","note":"Pemalar c = +2 menganjakkan garis keseimbangan ke y = 2."},{"text":"Garis keseimbangan graf y = 2 sin x − 4 turun ke y = −4 (julat −6 hingga −2)","bucketId":"p_c","note":"Pemalar c = −4 menurunkan keseluruhan graf 4 unit ke bawah."}],"explanation":"Pemalar a mengawal amplitud dan pemantulan menegak, b mengawal bilangan kitaran dan tempoh mengufuk, manakala c mengawal anjakan menegak ke atas atau ke bawah."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s6","voiceToneLabel":"Permodelan Dunia Sebenar","voiceCaption":"Fungsi y = a sin bx + c dan y = a kos bx + c memodelkan pasang surut Pulau Langkawi, kitaran pernafasan, arus ulang alik osiloskop, roda Ferris dan siaran radio AM serta FM.","voiceScript":"[warm] Mengapakah graf trigonometri amat penting di luar bilik darjah? Di Pulau Langkawi, stesen tolok air pasang surut merakam turun naik paras laut secara berkala bagi amaran awal tsunami! Fenomena berkala lain seperti kitaran pernafasan manusia, bacaan arus ulang alik pada osiloskop, putaran roda Ferris dan gelombang radio A M serta F M semuanya dimodelkan dengan rumus y sama dengan a sinus b x tambah c atau kosinus!","title":"Aplikasi Nyata: Pasang Surut Langkawi, Pernafasan, Osiloskop, Roda Ferris & Radio AM/FM","acronym":"P•O•R•F","hook":"Dari ombak Langkawi ke gelombang radio AM (ubah amplitud a) dan FM (ubah frekuensi b), trigonometri menerangkan setiap getaran alam!","mediaKey":"mat56_pasang_surut_langkawi","summary":"Data berkala dunia sebenar dengan tinggi maksimum H_maks, tinggi minimum H_min dan tempoh kitaran T saat/jam/minit diterjemah terus kepada nilai c, a dan b dalam fungsi trigonometri.","bullets":["Rumus Permodelan Pantas dari Data Sebenar: (1) Garis tengah (anjakan c) = (Maks + Min) / 2; (2) Amplitud a = (Maks − Min) / 2; (3) Kekerapan b = 360° / Tempoh T. Misalnya, kitaran aliran udara berkala 4 saat dengan laju puncak ±0.8 L/s mempunyai a = 0.8, c = 0 dan b = 360/4 = 90 -> y = 0.8 sin 90x.","Radio AM vs FM & Pergerakan Roda Ferris: Radio AM (Modulasi Amplitud) memvariasikan nilai pemalar a (ketinggian gelombang), manakala radio FM (Modulasi Frekuensi) memvariasikan nilai pemalar b (kekerapan/tempoh gelombang). Putaran roda Ferris atau paras air di pelabuhan pula menggunakan pemalar c untuk ketinggian pusat atau aras purata."],"labId":"mat56_graf_sin_kos_tan_lab","labTitle":"Simulasi Gelombang Terbalik & Anjakan Garis Keseimbangan","labProps":{"fn":"cos","a":-2,"b":2,"c":1},"examTip":"Untuk mengenal pasti sama ada jadual data sebenar memodelkan fungsi sin atau kos: jika bacaan pada x = 0 berada di nilai TENGAH (c) sebelum naik, pilih y = a sin bx + c; jika bacaan pada x = 0 berada di puncak MAKSIMUM atau dasar MINIMUM, pilih kosinus!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Susun Rumus Permodelan Gelombang","voiceCaption":"Susun langkah memperoleh nilai pemalar a, b dan c apabila memodelkan data pasang surut pelabuhan dalam bentuk y = a kos bx + c.","voiceScript":"[confident] Susun semula blok langkah berikut bagi membina persamaan trigonometri daripada data maksimum, minimum dan tempoh sesuatu kitaran berkala!","prompt":"Susun langkah memperoleh pemalar a, b dan c daripada data pasang surut berkala:","hint":"Mulakan dengan amplitud a, kemudian kekerapan b = 360°/Tempoh, dan anjakan c...","answerTokens":["Amplitud a = (Maks − Min) ÷ 2","manakala b = 360° ÷ Tempoh satu kitaran","dan garis keseimbangan c = (Maks + Min) ÷ 2","bagi membentuk model y = a sin bx + c"],"distractors":["manakala b = 180° × Tempoh satu kitaran","dengan amplitud sentiasa bernilai negatif"],"explanation":"Bagi gelombang sinus atau kosinus berkala, a = (Maks − Min)/2, c = (Maks + Min)/2 dan b = 360°/Tempoh."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Cabaran SPM: Julat & Tempoh Graf","voiceCaption":"Tentukan nilai maksimum, nilai minimum dan tempoh bagi graf fungsi terpantul y = −3 kos 2x + 4 dalam julat 0° ≤ x ≤ 360°.","voiceScript":"[excited] Soalan penutup Unit empat! Diberi fungsi y sama dengan negatif tiga kosinus dua x tambah empat. Hitung amplitud, nilai maksimum, nilai minimum serta tempoh bagi satu kitaran lengkap fungsi tersebut!","stimulusHtml":"<div class='stimulus-note'><strong>Fungsi Diberi:</strong> <em>y</em> = −3 kos 2<em>x</em> + 4 bagi 0° ≤ <em>x</em> ≤ 360°.</div>","prompt":"Manakah himpunan amplitud, nilai maksimum, nilai minimum dan tempoh yang PALING tepat?","options":["Amplitud = 3, Maks = 7, Min = 1, Tempoh = 180°","Amplitud = −3, Maks = 7, Min = 1, Tempoh = 180°","Amplitud = 3, Maks = 4, Min = −3, Tempoh = 360°","Amplitud = 3, Maks = 7, Min = −1, Tempoh = 90°"],"correctIndex":0,"explanation":"Amplitud sentiasa positif iaitu |−3| = 3. Garis keseimbangan ialah c = 4, jadi nilai maksimum ialah 4 + 3 = 7 dan nilai minimum ialah 4 − 3 = 1. Oleh kerana b = 2, tempoh = 360°/2 = 180° (2 kitaran lengkap dalam 360°)."}]},{"id":"mat56-u5","title":"Unit 5: Cabaran Boss SPM — Penguasaan Penuh Trigonometri Bab 6","subtitle":"Sintesis Kertas 1 & Kertas 2 — Heksagon Bulatan Unit, Persamaan Surd, Pemantulan Graf, Asimptot & Permodelan KBAT","iconType":"trophy","iconUrl":"../assets/icons/mat56-u5.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Kes 1: Heksagon Bulatan Unit","voiceCaption":"Selesaikan soalan KBAT heksagon sekata terterap dalam bulatan unit untuk menentukan koordinat tepat bucu-bucu pada sudut 120° dan 300°.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama menguji gabungan poligon sekata dengan bulatan unit! Sebuah heksagon sekata dilukis di dalam bulatan unit dengan satu bucunya berada pada koordinat satu, sifar. Jika bucu-bucu ditanda mengikut arah lawan jam, apakah koordinat tepat bagi bucu pada seratus dua puluh darjah dan tiga ratus darjah?","stimulusHtml":"<div class='stimulus-note'><strong>Cabaran Poligon Bulatan Unit:</strong> Satu heksagon sekata (6 sisi sama) terterap di dalam bulatan unit berpusat di <em>O</em>(0, 0) dengan satu bucunya di <em>V</em>₀(1, 0). Bucu <em>V</em>₂ berada pada 120° manakala bucu <em>V</em>₅ berada pada 300° mengikut arah lawan jam.</div>","prompt":"Tanpa menggunakan kalkulator, tentukan koordinat tepat bagi bucu V₂ (120°) dan bucu V₅ (300°):","options":["V₂(−1/2, √3/2) dan V₅(1/2, −√3/2)","V₂(−√3/2, 1/2) dan V₅(√3/2, −1/2)","V₂(1/2, √3/2) dan V₅(−1/2, −√3/2)","V₂(−1/2, −√3/2) dan V₅(1/2, √3/2)"],"correctIndex":0,"explanation":"Setiap bucu mempunyai koordinat (kos θ, sin θ). Pada 120° (Sukuan II, α = 60°): kos 120° = −kos 60° = −1/2 dan sin 120° = +sin 60° = √3/2. Pada 300° (Sukuan IV, α = 60°): kos 300° = +1/2 dan sin 300° = −√3/2."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Kes 2: Persamaan tan θ = −√3","voiceCaption":"Ramalkan kesemua penyelesaian sudut θ dalam julat 0° ≤ θ ≤ 360° bagi persamaan tan θ = −√3 tanpa menggunakan kalkulator.","voiceScript":"[curious] Cabaran Boss kedua! Tanpa menggunakan kalkulator saintifik, selesaikan persamaan tangen teta sama dengan negatif punca kuasa dua tiga bagi sudut teta dari sifar hingga tiga ratus enam puluh darjah!","hook":"Kenal pasti dua sukuan di mana tangen bernilai negatif, kemudian guna sudut khas 60°!","scenario":"Diberi tan θ = −√3 dengan keadaan 0° ≤ θ ≤ 360°.","prompt":"Apakah kesemua nilai θ yang memenuhi persamaan tersebut?","options":["θ = 120° dan θ = 300°","θ = 150° dan θ = 330°","θ = 60° dan θ = 240°","θ = 120° dan θ = 240°"],"correctIndex":0,"proofLabId":"mat56_bulatan_unit_astc_lab","proofState":{"tab":"special","specBase":60,"specQuad":4},"explanation":"Nilai tan θ bertanda negatif bermakna θ terletak dalam Sukuan II dan Sukuan IV. Sudut rujukan sepadan α dengan tan α = √3 ialah 60°. Maka θ = 180° − 60° = 120° dan θ = 360° − 60° = 300°."},{"type":"match","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Kes 3: Padan 5 Persamaan Graf","voiceCaption":"Padankan lima persamaan graf fungsi trigonometri (termasuk pemantulan negatif, anjakan menegak dan tangen) dengan julat nilai serta tempohnya.","voiceScript":"[confident] Cabaran Boss ketiga menguji kepekaan kamu membaca rumus gelombang! Padankan kelima-lima persamaan fungsi trigonometri ini dengan julat y dan tempohnya yang tepat.","prompt":"Padankan setiap persamaan graf trigonometri dengan julat nilai y serta tempoh kitarannya:","pairs":[{"id":"b6m1","left":"y = 4 sin 2x","right":"Amplitud 4, julat [−4, 4], tempoh 180°"},{"id":"b6m2","left":"y = −2 kos x + 1","right":"Dipantul pada y = 1, julat [−1, 3], tempoh 360°"},{"id":"b6m3","left":"y = 3 tan 0.5x − 2","right":"Tiada amplitud, anjak 2 unit ke bawah, tempoh 360°"},{"id":"b6m4","left":"y = 2 sin 3x + 4","right":"Amplitud 2, julat [2, 6], tempoh 120°"},{"id":"b6m5","left":"y = kos 4x − 1","right":"Amplitud 1, julat [−2, 0], tempoh 90°"}],"explanation":"Gunakan tempoh = 360°/b untuk sin dan kos, tempoh = 180°/b untuk tan, serta julat [c − |a|, c + |a|] untuk menentukan nilai minimum dan maksimum gelombang."},{"type":"sort","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Kes 4: Fakta Sah vs Mitos SPM","voiceCaption":"Asingkan enam pernyataan berikut kepada fakta trigonometri yang sah berbanding mitos atau kesilapan lazim peperiksaan SPM.","voiceScript":"[serious] Cabaran Boss keempat menguji perangkap kesilapan lazim calon S P M! Isihkan keenam-enam pernyataan ini sama ada fakta trigonometri yang sah ataupun salah faham yang mesti dielakkan.","prompt":"Isihkan pernyataan berikut antara Fakta Sah Trigonometri dengan Mitos / Salah Faham SPM:","buckets":[{"id":"sah","label":"Fakta Trigonometri Sah"},{"id":"mitos","label":"Mitos / Kesilapan Lazim SPM"}],"items":[{"text":"Sudut rujukan sepadan α sentiasa sudut tirus (< 90°) yang diukur dari paksi-x terdekat","bucketId":"sah","note":"Sentiasa guna 180° − θ, θ − 180° atau 360° − θ."},{"text":"Amplitud bagi graf y = −5 sin 2x ialah −5 kerana pekali a bertanda negatif","bucketId":"mitos","note":"Salah! Amplitud ialah jarak bernilai positif |−5| = 5; tanda negatif menyebabkan pemantulan."},{"text":"Tempoh fungsi y = a tan bx + c ialah 180° ÷ b dan grafnya tiada nilai amplitud","bucketId":"sah","note":"Graf tangen berulang setiap 180°/b dan menuju ±∞ di asimptot."},{"text":"Untuk menyelesaikan kos θ = −0.6428, tekan kos⁻¹(−0.6428) bagi mendapat sudut rujukan α","bucketId":"mitos","note":"Salah! Abaikan tanda negatif semasa mencari α = kos⁻¹(0.6428); tanda − hanya memilih Sukuan II & III."},{"text":"Bagi y = a kos bx + c, pintasan pada paksi-y apabila x = 0° terletak pada y = a + c","bucketId":"sah","note":"Kerana kos 0° = 1, maka y(0) = a(1) + c = a + c."},{"text":"Nilai tan 90° ialah 0 kerana koordinat pada sudut 90° di bulatan unit ialah (0, 1)","bucketId":"mitos","note":"Salah! tan 90° = 1/0 ialah TIDAK TERTAKRIF (asimptot), manakala kos 90° = 0."}],"explanation":"Mengelakkan empat kesilapan maut ini — amplitud negatif, tekan tanda negatif dalam songsangan, tolak sudut dari paksi-y, dan keliru tan 90° — menyelamatkan markah penuh Kertas 1 dan Kertas 2."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Kes 5: Model Roda Ferris KBAT","voiceCaption":"Susun langkah membina fungsi ketinggian roda Ferris y = a sin bx + c jika ketinggian berubah dari 6 m ke 30 m setiap 8 minit.","voiceScript":"[warm] Cabaran Boss kelima ialah soalan berstruktur Kertas dua tentang roda Ferris! Jika seorang penumpang bermula pada ketinggian pertengahan lapan belas meter, naik ke puncak tiga puluh meter pada minit kedua dan turun ke enam meter pada minit keenam sebelum lengkap satu pusingan pada minit kelapan, susun pengiraan model sinusnya!","prompt":"Susun pengiraan model ketinggian roda Ferris (min = 6 m, tengah = 18 m, maks = 30 m, tempoh = 8 minit):","hint":"Tentukan amplitud a, anjakan pusat c, dan b = 360° ÷ 8...","answerTokens":["Amplitud a = (30 − 6) ÷ 2 = 12","garisan tengah c = 18 meter","dan b = 360° ÷ 8 = 45","maka fungsi ketinggiannya ialah y = 12 sin 45x + 18"],"distractors":["dan b = 180° ÷ 8 = 22.5","maka fungsi ketinggiannya ialah y = 30 sin 8x + 6"],"explanation":"Ketinggian pertengahan (x = 0) ialah 18 m dan naik ke maksimum 30 m, maka model sinus sesuai: a = (30−6)/2 = 12, c = 18, dan b = 360°/8 = 45 -> y = 12 sin 45x + 18."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Model Pasang Surut Pelabuhan","voiceCaption":"Selesaikan soalan sintesis akhir Bab 6 memodelkan kedalaman air pasang surut di pelabuhan dengan fungsi y = 2.5 kos 30x + 4.5.","voiceScript":"[excited] Soalan penutup Unit Boss! Di sebuah pelabuhan, paras air pasang surut dimodelkan oleh y sama dengan dua perpuluhan lima kosinus tiga puluh x tambah empat perpuluhan lima, di mana y ialah kedalaman dalam meter dan x ialah bilangan jam selepas tengah malam. Hitung tempoh satu kitaran penuh, kedalaman minimum serta kedalaman air tepat pada pukul dua pagi!","stimulusHtml":"<div class='stimulus-note'><strong>Praktis Sintesis Akhir Bab 6:</strong> Kedalaman air <em>y</em> (dalam m) selepas <em>x</em> jam dari tengah malam dimodelkan dengan <strong><em>y</em> = 2.5 kos 30<em>x</em> + 4.5</strong> (gunakan sudut khas kos 60° = 0.5).</div>","prompt":"Nyatakan tempoh kitaran penuh, kedalaman air minimum (dalam m) serta kedalaman air pada pukul 2:00 pagi (x = 2):","options":["Tempoh = 12 jam, Min = 2.0 m dan Kedalaman pada x = 2 ialah 5.75 m","Tempoh = 12 jam, Min = 2.5 m dan Kedalaman pada x = 2 ialah 4.50 m","Tempoh = 6 jam, Min = 2.0 m dan Kedalaman pada x = 2 ialah 5.75 m","Tempoh = 12 jam, Min = 2.0 m dan Kedalaman pada x = 2 ialah 6.67 m"],"correctIndex":0,"explanation":"Tempoh = 360° ÷ 30 = 12 jam. Kedalaman minimum berlaku apabila kos 30x = −1, iaitu y_min = 2.5(−1) + 4.5 = 2.0 m. Pada x = 2 pagi: y = 2.5 kos(30 × 2) + 4.5 = 2.5 kos 60° + 4.5 = 2.5(0.5) + 4.5 = 1.25 + 4.5 = 5.75 m. Tahniah — Bab 6 Trigonometri dikuasai 100%!"}]}]};</script>

  /* =========================================================================
     MAKMAL 1: mat56_bulatan_unit_astc_lab
     Bulatan Unit Interaktif (0-360), Sudut Rujukan alpha, ASTC, Sudut Khas & Paksi
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat56_bulatan_unit_astc_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "special" ? "special" : (ps.tab === "axes" ? "axes" : "circle");
    var angle = typeof ps.angle === "number" ? Math.max(0, Math.min(360, ps.angle)) : 40;
    var specBase = ps.specBase || 30;
    var specQuad = ps.specQuad || 2;
    var axisAngle = typeof ps.axisAngle === "number" ? ps.axisAngle : 90;
    var playing = false;
    var rafId = 0;
    var lastTs = 0;
    var explored = {};
    var bonusAwarded = false;

    function recordExplore(tag, el) {
      explored[tag] = true;
      if (ctx && ctx.markInteracted) ctx.markInteracted();
      if (!bonusAwarded && Object.keys(explored).length >= 3 && ctx && ctx.awardMiniGameXp) {
        bonusAwarded = true;
        ctx.awardMiniGameXp(5, el, "+5 XP Jurutera Trigonometri!");
      }
    }

    function stopAnim() {
      playing = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
      lastTs = 0;
    }

    function analyzeAngle(theta) {
      var rad = theta * Math.PI / 180;
      var x = Math.cos(rad);
      var y = Math.sin(rad);
      var onAxis = (Math.abs(theta % 90) < 1e-6);
      var tanUndef = Math.abs(x) < 1e-6;
      var tanVal = tanUndef ? null : (y / x);
      var quad = "Paksi";
      var astc = "Sudut Paksi";
      var alpha = 0;
      var alphaFormula = "Sudut di atas paksi";
      if (theta > 0 && theta < 90) {
        quad = "Sukuan I";
        astc = "A: Semua (+)";
        alpha = theta;
        alphaFormula = "α = θ = " + Math.round(alpha) + "°";
      } else if (theta > 90 && theta < 180) {
        quad = "Sukuan II";
        astc = "S: Sin (+) sahaja";
        alpha = 180 - theta;
        alphaFormula = "α = 180° − " + Math.round(theta) + "° = " + Math.round(alpha) + "°";
      } else if (theta > 180 && theta < 270) {
        quad = "Sukuan III";
        astc = "T: Tan (+) sahaja";
        alpha = theta - 180;
        alphaFormula = "α = " + Math.round(theta) + "° − 180° = " + Math.round(alpha) + "°";
      } else if (theta > 270 && theta < 360) {
        quad = "Sukuan IV";
        astc = "C: Kos (+) sahaja";
        alpha = 360 - theta;
        alphaFormula = "α = 360° − " + Math.round(theta) + "° = " + Math.round(alpha) + "°";
      }
      return {
        theta: theta,
        x: x,
        y: y,
        tanUndef: tanUndef,
        tanVal: tanVal,
        onAxis: onAxis,
        quad: quad,
        astc: astc,
        alpha: alpha,
        alphaFormula: alphaFormula
      };
    }

    function buildUnitCircleSvg(theta) {
      var info = analyzeAngle(theta);
      var cx = 172;
      var cy = 158;
      var r = 98;
      var rad = theta * Math.PI / 180;
      var cosA = Math.cos(rad);
      var sinA = Math.sin(rad);
      var px = cx + r * cosA;
      var py = cy - r * sinA;

      // Blue arc for theta
      var arcR = 32;
      var thetaArc = "";
      if (theta >= 359.5) {
        thetaArc = '<circle cx="' + cx + '" cy="' + cy + '" r="' + arcR + '" fill="rgba(56,189,248,0.16)" stroke="#38bdf8" stroke-width="2.6"/>';
      } else if (theta > 0.5) {
        var ax1 = cx + arcR;
        var ay1 = cy;
        var ax2 = cx + arcR * cosA;
        var ay2 = cy - arcR * sinA;
        var largeFlag = theta > 180 ? 1 : 0;
        thetaArc =
          '<path d="M ' + cx + " " + cy + " L " + ax1.toFixed(1) + " " + ay1.toFixed(1) +
          " A " + arcR + " " + arcR + " 0 " + largeFlag + " 0 " + ax2.toFixed(1) + " " + ay2.toFixed(1) +
          ' Z" fill="rgba(56,189,248,0.22)" stroke="#38bdf8" stroke-width="2.4"/>';
      }

      // Reference angle alpha arc
      var alphaArc = "";
      if (!info.onAxis && theta > 90) {
        var ar2 = 48;
        var rx2 = cx + ar2 * cosA;
        var ry2 = cy - ar2 * sinA;
        if (theta < 180) {
          // From 180 deg (-x) clockwise (sweep=1) to theta
          alphaArc = '<path d="M ' + (cx - ar2) + " " + cy + " A " + ar2 + " " + ar2 + " 0 0 1 " + rx2.toFixed(1) + " " + ry2.toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>';
        } else if (theta < 270) {
          // From 180 deg (-x) counter-clockwise (sweep=0) to theta
          alphaArc = '<path d="M ' + (cx - ar2) + " " + cy + " A " + ar2 + " " + ar2 + " 0 0 0 " + rx2.toFixed(1) + " " + ry2.toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>';
        } else {
          // From 0 deg (+x) clockwise (sweep=1) to theta
          alphaArc = '<path d="M ' + (cx + ar2) + " " + cy + " A " + ar2 + " " + ar2 + " 0 0 1 " + rx2.toFixed(1) + " " + ry2.toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>';
        }
      }

      // IEEE-754 threshold label placement for P(x, y)
      var lx = px + (cosA > 0.25 ? 14 : (cosA < -0.25 ? -14 : 0));
      var ly = py + (sinA > 0.8 ? -16 : (sinA < -0.8 ? 22 : (sinA >= 0 ? -12 : 18)));
      var pAnchor = cosA > 0.25 ? "start" : (cosA < -0.25 ? "end" : "middle");
      lx = Math.max(58, Math.min(286, lx));
      ly = Math.max(44, Math.min(270, ly));

      // Active quadrant highlight wedge
      var quadHighlight = "";
      if (theta > 0 && theta < 90) {
        quadHighlight = '<path d="M ' + cx + " " + cy + " L " + (cx + r) + " " + cy + " A " + r + " " + r + " 0 0 0 " + cx + " " + (cy - r) + ' Z" fill="rgba(16,185,129,0.16)"/>';
      } else if (theta > 90 && theta < 180) {
        quadHighlight = '<path d="M ' + cx + " " + cy + " L " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 0 0 " + (cx - r) + " " + cy + ' Z" fill="rgba(56,189,248,0.16)"/>';
      } else if (theta > 180 && theta < 270) {
        quadHighlight = '<path d="M ' + cx + " " + cy + " L " + (cx - r) + " " + cy + " A " + r + " " + r + " 0 0 0 " + cx + " " + (cy + r) + ' Z" fill="rgba(245,158,11,0.16)"/>';
      } else if (theta > 270 && theta < 360) {
        quadHighlight = '<path d="M ' + cx + " " + cy + " L " + cx + " " + (cy + r) + " A " + r + " " + r + " 0 0 0 " + (cx + r) + " " + cy + ' Z" fill="rgba(167,139,250,0.16)"/>';
      }

      var sinSign = info.y > 1e-6 ? "+" : (info.y < -1e-6 ? "-" : "0");
      var cosSign = info.x > 1e-6 ? "+" : (info.x < -1e-6 ? "-" : "0");
      var tanSign = info.tanUndef ? "∞" : (info.tanVal > 1e-6 ? "+" : (info.tanVal < -1e-6 ? "-" : "0"));

      return [
        '<svg viewBox="0 0 560 306" aria-label="Simulasi Bulatan Unit Interaktif 0 hingga 360 darjah">',
        '  <rect x="6" y="6" width="548" height="294" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>',
        // Quadrant background & circle
        quadHighlight,
        '  <circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#94a3b8" stroke-width="2.2"/>',
        '  <line x1="' + (cx - r - 24) + '" y1="' + cy + '" x2="' + (cx + r + 24) + '" y2="' + cy + '" stroke="#475569" stroke-width="1.6"/>',
        '  <line x1="' + cx + '" y1="' + (cy - r - 24) + '" x2="' + cx + '" y2="' + (cy + r + 24) + '" stroke="#475569" stroke-width="1.6"/>',
        // ASTC quadrant badges pinned to far corners of plot (zero collision with circle or P label)
        '  <text x="322" y="30" text-anchor="end" font-family="Lexend,sans-serif" font-size="10.5" font-weight="800" fill="' + (info.quad === "Sukuan I" ? "#6ee7b7" : "#64748b") + '">I: A (+)</text>',
        '  <text x="20" y="30" text-anchor="start" font-family="Lexend,sans-serif" font-size="10.5" font-weight="800" fill="' + (info.quad === "Sukuan II" ? "#7dd3fc" : "#64748b") + '">II: S (+)</text>',
        '  <text x="20" y="286" text-anchor="start" font-family="Lexend,sans-serif" font-size="10.5" font-weight="800" fill="' + (info.quad === "Sukuan III" ? "#fde047" : "#64748b") + '">III: T (+)</text>',
        '  <text x="322" y="286" text-anchor="end" font-family="Lexend,sans-serif" font-size="10.5" font-weight="800" fill="' + (info.quad === "Sukuan IV" ? "#c4b5fd" : "#64748b") + '">IV: C (+)</text>',
        // Axis degree labels safely placed outside endpoints
        '  <text x="' + (cx + r + 28) + '" y="' + (cy + 4) + '" text-anchor="start" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#cbd5e1">0°/360°</text>',
        '  <text x="' + cx + '" y="' + (cy - r - 30) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#cbd5e1">90° (0,1)</text>',
        '  <text x="' + (cx - r - 28) + '" y="' + (cy + 4) + '" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#cbd5e1">180°</text>',
        '  <text x="' + cx + '" y="' + (cy + r + 38) + '" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="700" fill="#cbd5e1">270° (0,-1)</text>',
        // Arcs and projection triangle
        thetaArc,
        alphaArc,
        '  <line x1="' + cx + '" y1="' + cy + '" x2="' + px.toFixed(1) + '" y2="' + cy + '" stroke="#38bdf8" stroke-width="3"/>',
        '  <line x1="' + px.toFixed(1) + '" y1="' + cy + '" x2="' + px.toFixed(1) + '" y2="' + py.toFixed(1) + '" stroke="#34d399" stroke-width="3" stroke-dasharray="4 3"/>',
        '  <line x1="' + cx + '" y1="' + cy + '" x2="' + px.toFixed(1) + '" y2="' + py.toFixed(1) + '" stroke="#fde047" stroke-width="3.6" stroke-linecap="round"/>',
        '  <circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#ffffff"/>',
        '  <circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="6.5" fill="#fde047" stroke="#0f172a" stroke-width="2"/>',
        '  <text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + pAnchor + '" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="800" fill="#fef08a">P(' + fmtNum(info.x, 2) + ', ' + fmtNum(info.y, 2) + ")</text>",
        // Right Telemetry Panel
        '  <rect x="336" y="22" width="202" height="262" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>',
        '  <text x="437" y="44" text-anchor="middle" font-family="Lexend,sans-serif" font-size="11.5" font-weight="800" fill="#93c5fd">TELEMETRI BULATAN UNIT</text>',
        '  <rect x="350" y="54" width="174" height="44" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>',
        '  <text x="437" y="72" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="800" fill="#ffffff">θ = ' + Math.round(theta) + "° (" + esc(info.quad) + ")</text>",
        '  <text x="437" y="89" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="9.8" font-weight="700" fill="#fde68a">' + esc(info.astc) + "</text>",
        '  <rect x="350" y="106" width="174" height="38" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>',
        '  <text x="437" y="122" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="9" font-weight="700" fill="#94a3b8">Sudut Rujukan Sepadan (α)</text>',
        '  <text x="437" y="137" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10.2" font-weight="800" fill="#fde047">' + esc(info.alphaFormula) + "</text>",
        '  <rect x="350" y="152" width="174" height="118" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>',
        '  <text x="362" y="175" text-anchor="start" font-family="JetBrains Mono,monospace" font-size="10.8" font-weight="800" fill="#34d399">sin θ = y = ' + fmtNum(info.y, 4) + "</text>",
        '  <text x="514" y="175" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10.5" font-weight="800" fill="#34d399">[" + sinSign + "]</text>'.replace('[" + sinSign + "]', "[" + sinSign + "]"),
        '  <text x="362" y="204" text-anchor="start" font-family="JetBrains Mono,monospace" font-size="10.8" font-weight="800" fill="#38bdf8">kos θ = x = ' + fmtNum(info.x, 4) + "</text>",
        '  <text x="514" y="204" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10.5" font-weight="800" fill="#38bdf8">[" + cosSign + "]</text>'.replace('[" + cosSign + "]', "[" + cosSign + "]"),
        '  <text x="362" y="233" text-anchor="start" font-family="JetBrains Mono,monospace" font-size="' + (info.tanUndef ? "10" : "10.8") + '" font-weight="800" fill="#fbbf24">' + (info.tanUndef ? "tan θ = Tak Tertakrif" : ("tan θ = y/x = " + fmtNum(info.tanVal, 4))) + "</text>",
        '  <text x="514" y="233" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10.5" font-weight="800" fill="#fbbf24">[" + tanSign + "]</text>'.replace('[" + tanSign + "]', "[" + tanSign + "]"),
        '  <text x="437" y="258" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="9" font-weight="700" fill="#94a3b8">Jejari OP = 1 unit (Lawan Jam)</text>',
        "</svg>"
      ].join("");
    }

    function getSpecialExact(baseDeg, quad) {
      var surds = {
        30: { sin: "1/2", kos: "√3/2", tan: "1/√3", dec: { sin: 0.5, kos: 0.866, tan: 0.5774 } },
        45: { sin: "1/√2", kos: "1/√2", tan: "1", dec: { sin: 0.7071, kos: 0.7071, tan: 1.0 } },
        60: { sin: "√3/2", kos: "1/2", tan: "√3", dec: { sin: 0.866, kos: 0.5, tan: 1.7321 } }
      };
      var s = surds[baseDeg] || surds[30];
      var theta = baseDeg;
      var sSign = "+", cSign = "+", tSign = "+";
      var rel = "α = " + baseDeg + "°";
      if (quad === 2) {
        theta = 180 - baseDeg;
        cSign = "−"; tSign = "−";
        rel = "180° − " + theta + "° = " + baseDeg + "°";
      } else if (quad === 3) {
        theta = 180 + baseDeg;
        sSign = "−"; cSign = "−";
        rel = theta + "° − 180° = " + baseDeg + "°";
      } else if (quad === 4) {
        theta = 360 - baseDeg;
        sSign = "−"; tSign = "−";
        rel = "360° − " + theta + "° = " + baseDeg + "°";
      }
      return {
        theta: theta,
        baseDeg: baseDeg,
        quad: quad,
        rel: rel,
        sinExact: (sSign === "+" ? "" : "−") + s.sin,
        kosExact: (cSign === "+" ? "" : "−") + s.kos,
        tanExact: (tSign === "+" ? "" : "−") + s.tan,
        sSign: sSign,
        cSign: cSign,
        tSign: tSign
      };
    }

    function render() {
      var tabsHtml =
        '<div class="wf-jucas-pills">' +
          '<button type="button" class="wf-jpill jp-mint" data-m56-tab="circle" aria-pressed="' + (tab === "circle") + '">Bulatan Unit &amp; ASTC (0°–360°)</button>' +
          '<button type="button" class="wf-jpill jp-violet" data-m56-tab="special" aria-pressed="' + (tab === "special") + '">Sudut Khas 30°, 45°, 60° (Surd)</button>' +
          '<button type="button" class="wf-jpill jp-amber" data-m56-tab="axes" aria-pressed="' + (tab === "axes") + '">Sudut Paksi (0°, 90°, 180°, 270°, 360°)</button>' +
        "</div>";

      var bodyHtml = "";
      if (tab === "circle") {
        var info = analyzeAngle(angle);
        var presets = [38, 138, 150, 225, 239, 300, 312];
        var presetHtml = presets.map(function (p) {
          return '<button type="button" class="mat56-btn" data-m56-preset="' + p + '" aria-pressed="' + (Math.round(angle) === p) + '">' + p + "°</button>";
        }).join("");

        bodyHtml = [
          '<div class="lab-controls">',
          '  <button type="button" id="m56PlayBtn" class="lab-pause-btn" aria-pressed="' + playing + '">' + (playing ? "Jeda Putaran" : "Putar Lawan Jam") + "</button>",
          '  <button type="button" class="mat56-btn" id="m56MinusBtn">-15°</button>',
          '  <button type="button" class="mat56-btn" id="m56PlusBtn">+15°</button>',
          "</div>",
          '<div class="lab-controls">' + presetHtml + "</div>",
          '<div class="lab-slider-group">',
          '  <label class="lab-slider-label" for="m56AngleRange"><span>Seret Sudut Jejari OP (Lawan Jam dari Paksi-x Positif)</span><span id="m56AngleLabel" class="tabular-nums">' + Math.round(angle) + "°</span></label>",
          '  <input id="m56AngleRange" class="lab-range" type="range" min="0" max="360" step="1" value="' + Math.round(angle) + '">',
          "</div>",
          '<div class="lab-stage" id="m56CircleStage">' + buildUnitCircleSvg(angle) + "</div>",
          '<div class="lab-callout"><strong>Rumusan Pantas (' + esc(info.quad) + "):</strong> " +
            (info.onAxis
              ? "Sudut <strong>" + Math.round(angle) + "°</strong> terletak tepat di atas paksi pada koordinat <strong>(" + fmtShort(info.x) + ", " + fmtShort(info.y) + ")</strong>."
              : "Sudut rujukan sepadan <strong>" + esc(info.alphaFormula) + "</strong>; tanda nilai mengikut petua <strong>" + esc(info.astc) + "</strong>.") +
          "</div>"
        ].join("");
      } else if (tab === "special") {
        var sp = getSpecialExact(specBase, specQuad);
        var baseBtns = [30, 45, 60].map(function (b) {
          return '<button type="button" class="mat56-btn is-violet" data-m56-sbase="' + b + '" aria-pressed="' + (specBase === b) + '">α = ' + b + "°</button>";
        }).join("");
        var quadBtns = [1, 2, 3, 4].map(function (q) {
          var qLbl = ["Sukuan I", "Sukuan II", "Sukuan III", "Sukuan IV"][q - 1];
          return '<button type="button" class="mat56-btn is-emerald" data-m56-squad="' + q + '" aria-pressed="' + (specQuad === q) + '">' + qLbl + "</button>";
        }).join("");

        bodyHtml = [
          '<div class="lab-controls">' + baseBtns + "</div>",
          '<div class="lab-controls">' + quadBtns + "</div>",
          '<div class="lab-stage">' + buildUnitCircleSvg(sp.theta) + "</div>",
          '<div class="lab-readout-grid">',
          '  <div class="lab-meter"><span class="lab-meter-label">Sudut Terbitan θ</span><strong class="lab-meter-val tabular-nums">' + sp.theta + "° (" + esc(sp.rel) + ")</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">sin ' + sp.theta + '° (Tanpa Kalkulator)</span><strong class="lab-meter-val tabular-nums">' + esc(sp.sinExact) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">kos ' + sp.theta + '° (Tanpa Kalkulator)</span><strong class="lab-meter-val tabular-nums">' + esc(sp.kosExact) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">tan ' + sp.theta + '° (Tanpa Kalkulator)</span><strong class="lab-meter-val tabular-nums">' + esc(sp.tanExact) + "</strong></div>",
          "</div>",
          '<div class="lab-callout"><strong>Kaedah Sudut Khas:</strong> Kenal pasti Sukuan ' + sp.quad + ", kira sudut rujukan sepadan <strong>" + sp.baseDeg + "°</strong>, kemudian gabungkan tanda ASTC bersama nilai tepat sudut khas (" + sp.baseDeg + "°).</div>"
        ].join("");
      } else {
        var axisBtns = [0, 90, 180, 270, 360].map(function (ax) {
          return '<button type="button" class="mat56-btn is-amber" data-m56-axis="' + ax + '" aria-pressed="' + (axisAngle === ax) + '">' + ax + "°</button>";
        }).join("");
        var axInfo = analyzeAngle(axisAngle);
        bodyHtml = [
          '<div class="lab-controls">' + axisBtns + "</div>",
          '<div class="lab-stage">' + buildUnitCircleSvg(axisAngle) + "</div>",
          '<div class="lab-readout-grid">',
          '  <div class="lab-meter"><span class="lab-meter-label">Koordinat (kos θ, sin θ)</span><strong class="lab-meter-val tabular-nums">(' + fmtShort(axInfo.x) + ", " + fmtShort(axInfo.y) + ")</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">sin ' + axisAngle + '° = y</span><strong class="lab-meter-val tabular-nums">' + fmtShort(axInfo.y) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">kos ' + axisAngle + '° = x</span><strong class="lab-meter-val tabular-nums">' + fmtShort(axInfo.x) + "</strong></div>",
          '  <div class="lab-meter"><span class="lab-meter-label">tan ' + axisAngle + '° = y / x</span><strong class="lab-meter-val tabular-nums">' + (axInfo.tanUndef ? "Tak Tertakrif" : fmtShort(axInfo.tanVal)) + "</strong></div>",
          "</div>",
          '<div class="lab-callout"><strong>Mengapa tan 90° dan tan 270° Tidak Tertakrif?</strong> Kerana pada sudut 90° (0, 1) dan 270° (0, −1), nilai koordinat-x (kos θ) ialah <strong>0</strong>. Pembahagian dengan sifar (y / 0) adalah tidak tertakrif dan menghasilkan <strong>asimptot tegak</strong> pada graf y = tan x!</div>'
        ].join("");
      }

      shell.innerHTML = tabsHtml + bodyHtml;

      shell.querySelectorAll("[data-m56-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          stopAnim();

          playSfx("snap");
          recordExplore("axis", btn);
          render();
        });
      });
    }

    render();

    return function cleanup() {

  /* =========================================================================
     MAKMAL 3: mat56_graf_sin_kos_tan_lab
     Pemplot Interaktif Graf y = a sin bx + c, y = a kos bx + c & y = a tan bx + c
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.mat56_graf_sin_kos_tan_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var fn = ps.fn === "cos" || ps.fn === "kos" ? "cos" : (ps.fn === "tan" ? "tan" : "sin");
    var a = typeof ps.a === "number" ? ps.a : 1;
    var b = typeof ps.b === "number" ? ps.b : 1;
    var c = typeof ps.c === "number" ? ps.c : 0;
    var showBase = true;
    var traceX = 90;
    var playing = false;
    var rafId = 0;
    var lastTs = 0;
    var explored = {};
    var bonusAwarded = false;

    function recordExplore(tag, el) {
      explored[tag] = true;
      if (ctx && ctx.markInteracted) ctx.markInteracted();
      if (!bonusAwarded && Object.keys(explored).length >= 3 && ctx && ctx.awardMiniGameXp) {
        bonusAwarded = true;
        ctx.awardMiniGameXp(5, el, "+5 XP Jurutera Gelombang!");
      }
    }

    function stopAnim() {
      playing = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
      lastTs = 0;
    }

    function evalFn(kind, aV, bV, cV, xDeg) {
      var rad = (bV * xDeg) * Math.PI / 180;
      if (kind === "sin") return aV * Math.sin(rad) + cV;
      if (kind === "cos") return aV * Math.cos(rad) + cV;
      var cs = Math.cos(rad);
      if (Math.abs(cs) < 0.045) return null;
      return aV * Math.tan(rad) + cV;
    }

    function formatEq(kind, aV, bV, cV) {
      var fname = kind === "cos" ? "kos" : kind;
      var aPart = Math.abs(aV - 1) < 1e-6 ? "" : (Math.abs(aV + 1) < 1e-6 ? "−" : (fmtShort(aV) + " "));
      var bPart = Math.abs(bV - 1) < 1e-6 ? "x" : (fmtShort(bV) + "x");
      var cPart = Math.abs(cV) < 1e-6 ? "" : (cV > 0 ? (" + " + fmtShort(cV)) : (" − " + fmtShort(Math.abs(cV))));
      return "y = " + aPart + fname + " " + bPart + cPart;
    }

    function buildGraphSvg() {
      var W = 560;
      var H = 294;
      var x0 = 54;
      var x1 = 526;
      var yTop = 38;
      var yBot = 256;
      var yMid = (yTop + yBot) / 2; // 147
      var yMaxUnits = 5;
