  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-t5-bab07","subject":"Matematik","subjectGroup":"teras","form":5,"chapterNumber":7,"title":"Sukatan Serakan Data Terkumpul","subtitle":"Subtopik 7.1–7.2 KSSM (35 Langkah Bit-by-Bit) — Had & Sempadan Kelas, Histogram & Poligon Kekerapan, 5 Bentuk Taburan, Ogif (Q1, Q2, Q3 & Persentil), Julat & Julat Antara Kuartil, Varians, Sisihan Piawai, Plot Kotak serta Perbandingan Dua Set Data.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","labScript":"matematik-t5-bab07-labs.js","coverIcon":"../assets/icons/mat57-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan jadual kekerapan, graf serakan dan pengiraan statistik kamu sangat mantap!","combo":"[laughs warmly] Kombo yang luar biasa! Ketelitian kamu membaca graf dan mengira sukatan serakan terus menyala!","encourage":"[encouraging] Hampir tepat! Cuba semak semula sempadan kelas, titik tengah atau paksi lengkung ogif dengan teliti ya.","celebrate":"[excited] Tahniah! Satu lagi unit Sukatan Serakan Data Terkumpul berjaya kamu takluki dengan cemerlang!"},"units":[{"id":"mat57-u1","title":"Unit 1: Jadual Kekerapan, Histogram & Poligon Kekerapan","subtitle":"Subtopik 7.1 (Bhg. A) — Selang Kelas, Had & Sempadan, Titik Tengah, Kekerapan Longgokan serta Pembinaan Histogram & Poligon","iconType":"graph","iconUrl":"../assets/icons/mat57-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Istilah Asas Data Terkumpul","voiceCaption":"Data mentah yang besar disusun ke dalam selang kelas seragam dengan had bawah, had atas, titik tengah, sempadan kelas dan kekerapan longgokan.","voiceScript":"[warm] Selamat datang ke Matematik Tingkatan lima Bab tujuh, Sukatan Serakan Data Terkumpul! Sejak tahun seribu tujuh ratus lapan puluh enam, perintis graf statistik William Playfair menggunakan graf visual untuk meringkaskan data yang banyak. [pause] Untuk mengorganisasi data mentah kepada selang kelas yang seragam, kita perlu mengenal pasti had bawah, had atas, titik tengah, sempadan bawah, sempadan atas serta kekerapan longgokan. Tonton video tiga dimensi dan teroka kad interaktif di bawah ya!","title":"Selang Kelas, Had, Titik Tengah, Sempadan & Kekerapan Longgokan","acronym":"H•T•S•L","hook":"Jangan keliru antara HAD kelas (ada jurang antara 149 dan 150) dengan SEMPADAN kelas (bercantum rapat pada 149.5)!","mediaKey":"mat57_playfair_statistik","videoClip":{"src":"../assets/matematik-t5-bab07/video/mat57_video_sukatan_serakan.mp4","posterKey":"mat57_video_poster","caption":"Animasi 3D: Penyusunan data terkumpul kepada histogram, lengkung ogif dan taburan sisihan piawai"},"summary":"Sebelum melukis graf statistik data terkumpul, data mentah disusun ke dalam selang kelas seragam yang merakam had kelas, titik tengah, sempadan kelas dan kekerapan longgokan.","bullets":["Saiz Selang Kelas & Had Kelas: Saiz anggaran = (Nilai terbesar - Nilai terkecil) / Bilangan kelas. Had bawah ialah nilai terkecil dalam satu kelas manakala had atas ialah nilai terbesarnya. Bagi kelas seragam, saiz selang kelas = beza dua had bawah berturutan (contohnya 150 - 145 = 5) ATAU sempadan atas - sempadan bawah (149.5 - 144.5 = 5).","Titik Tengah, Sempadan & Kekerapan Longgokan: Titik tengah = (Had bawah + Had atas) / 2. Sempadan bawah = titik tengah antara had atas kelas sebelumnya dengan had bawah kelas itu; sempadan atas = titik tengah antara had atas kelas itu dengan had bawah kelas selepasnya. Kekerapan longgokan ialah jumlah terkumpul kekerapan kelas itu bersama semua kelas sebelumnya dalam tertib menaik."],"labId":"mat57_rumus_terkumpul_flip","labTitle":"Dek Kad 3D Istilah Data Terkumpul & Peneroka Jadual 7 Lajur","labProps":{"tab":"istilah"},"formula":"Titik Tengah = (Had Bawah + Had Atas) / 2   |   Saiz Kelas = Sempadan Atas - Sempadan Bawah","examTip":"Kesilapan lazim pelajar ialah menolak had atas dengan had bawah (cth. 149 - 145 = 4). Saiz sebenar kelas 145–149 dan 150–154 ialah 150 - 145 = 5!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Sempadan vs Had & Titik Tengah","voiceCaption":"Bezakan antara nilai sempadan kelas yang bercantum rapat dengan nilai had kelas atau titik tengah.","voiceScript":"[curious] Mari uji kecekapan mata statistik kamu! Isihkan enam nilai daripada jadual selang kelas berikut ke dalam kategori Sempadan Kelas ataupun Had Kelas dan Titik Tengah.","prompt":"Berdasarkan kelas tinggi murid 145–149, 150–154 dan jisim bayi 2.0–2.4, 2.5–2.9, isihkan nilai berikut:","buckets":[{"id":"sempadan","label":"Sempadan Bawah / Sempadan Atas"},{"id":"had_mid","label":"Had Kelas / Titik Tengah"}],"items":[{"text":"149.5 bagi pertemuan antara kelas 145–149 dan 150–154","bucketId":"sempadan","note":"Nilai pertengahan (149 + 150)/2 menutup jurang kelas bersebelahan"},{"text":"147 bagi pusat selang kelas 145–149","bucketId":"had_mid","note":"Titik tengah kelas = (145 + 149)/2 = 147"},{"text":"2.45 sebagai titik cantuman kelas 2.0–2.4 dan 2.5–2.9","bucketId":"sempadan","note":"Sempadan atas bagi 2.0–2.4 dan sempadan bawah bagi 2.5–2.9"},{"text":"145 sebagai nilai terkecil dalam selang 145–149","bucketId":"had_mid","note":"Had bawah bagi selang kelas pertama"},{"text":"144.5 sebagai tepi kiri kelas pertama 145–149","bucketId":"sempadan","note":"Sempadan bawah kelas 145–149"},{"text":"2.2 bagi wakil tunggal kelas jisim bayi 2.0–2.4","bucketId":"had_mid","note":"Titik tengah kelas perpuluhan = (2.0 + 2.4)/2 = 2.2"}],"explanation":"Sempadan kelas sentiasa terletak tepat di tengah jurang antara had atas satu kelas dengan had bawah kelas berikutnya (149.5, 2.45), manakala had kelas dan titik tengah merujuk sempadan dalaman atau pusat selang kelas itu sendiri."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Membina Histogram & Poligon Kekerapan","voiceCaption":"Histogram melukis palang bersebelahan pada paksi sempadan kelas, manakala poligon kekerapan menyambung titik tengah sehingga mencecah paksi mendatar.","voiceScript":"[warm] Sekarang mari kita lukis dua graf paling asas bagi data terkumpul: Histogram dan Poligon Kekerapan! Histogram terdiri daripada palang-palang yang bercantum rapat tanpa ruang, dengan sempadan kelas pada paksi mengufuk dan kekerapan pada paksi mencancang. Poligon kekerapan pula menyambungkan titik tengah setiap kelas menggunakan garis lurus, serta wajib ditambah kelas berfrekuensi sifar di hujung kiri dan kanan!","title":"Membina Histogram & Poligon Kekerapan Tanpa Jurang","acronym":"S•T•0","hook":"Poligon kekerapan mesti bertutup di paksi-x — sentiasa tambah satu selang kelas berkekerapan SIFAR sebelum kelas pertama dan selepas kelas terakhir!","mediaKey":"mat57_histogram_poligon","summary":"Histogram memaparkan taburan menggunakan palang bercantum berasaskan sempadan kelas, manakala poligon kekerapan menggunakan garisan lurus antara titik tengah kelas.","bullets":["Langkah Membina Histogram (Contoh 3): Tentukan sempadan bawah dan sempadan atas setiap kelas. Plot kekerapan pada paksi mencancang dan sempadan kelas pada paksi mengufuk. Lukis palang bersebelahan dengan lebar bersamaan saiz selang kelas dan tinggi berkadaran kekerapan.","Langkah Membina Poligon Kekerapan (Contoh 3 & 4): Sama ada tandakan titik tengah pada bucu atas palang histogram, ATAU bina terus daripada jadual dengan menambah satu kelas sebelum kelas pertama dan satu kelas selepas kelas terakhir yang berkekerapan 0, cari semua titik tengahnya, plot dan sambung dengan garis lurus."],"labId":"mat57_histogram_poligon_lab","labTitle":"Simulator Graf Histogram & Poligon Kekerapan KSSM","labProps":{"mode":"gabung","dataset":"kelajuan"},"examTip":"Dalam peperiksaan SPM, jangan guna lengkung bebas untuk poligon kekerapan — wajib guna pembaris (garis lurus) dan tutup kedua-dua hujungnya ke kekerapan 0."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Komponen Graf & Rumus","voiceCaption":"Padankan lima konsep utama graf dan jadual kekerapan dengan fungsinya yang tepat.","voiceScript":"[confident] Uji ingatan pantas kamu! Padankan kelima-lima komponen jadual dan graf ini dengan peranan atau rumusnya yang betul.","prompt":"Padankan setiap istilah data terkumpul berikut dengan keterangan atau rumusnya:","pairs":[{"id":"u1m1","left":"Paksi Mengufuk Histogram","right":"Mewakili sempadan bawah dan sempadan atas kelas tanpa ruang"},{"id":"u1m2","left":"Paksi Mengufuk Poligon Kekerapan","right":"Mewakili titik tengah setiap selang kelas termasuk hujung f = 0"},{"id":"u1m3","left":"Saiz Selang Kelas Seragam","right":"Sempadan atas tolak sempadan bawah atau beza dua had bawah berturutan"},{"id":"u1m4","left":"Kekerapan Longgokan","right":"Hasil tambah kekerapan kelas itu dengan semua kelas sebelumnya"},{"id":"u1m5","left":"Penutup Poligon Kekerapan","right":"Menambah satu kelas berkekerapan 0 di awal dan di akhir jadual"}],"explanation":"Histogram menggunakan sempadan kelas sebagai lebar palang, poligon menggunakan titik tengah berangkai garis lurus dengan dua hujung berkekerapan sifar, dan kekerapan longgokan sentiasa meningkat."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Titik Tengah Penutup Poligon","voiceCaption":"Ramalkan dua nilai titik tengah tambahan yang wajib diletakkan pada kekerapan sifar untuk melukis poligon kekerapan masa berenang.","voiceScript":"[curious] Cuba ramalkan berdasarkan Contoh empat! Diberi lima selang kelas masa berenang daripada lima puluh hingga lima puluh empat saat sampai tujuh puluh hingga tujuh puluh empat saat. Jika kita hendak membina poligon kekerapan terus daripada jadual, apakah dua nilai titik tengah berkekerapan sifar yang perlu ditambah pada kedua-dua hujung paksi mengufuk?","hook":"Selidik graf poligon Contoh 4 pada makmal selepas memilih ramalan kamu!","scenario":"Jadual masa peserta renang mengandungi kelas 50–54, 55–59, 60–64, 65–69 dan 70–74 saat tanpa histogram dilukis terlebih dahulu.","prompt":"Apakah dua nilai titik tengah tambahan (dengan kekerapan 0) bagi menutup poligon kekerapan tersebut?","options":["44.5 dan 79.5 kerana itu ialah sempadan kelas tambahan","47 dan 77 bagi kelas tambahan 45–49 serta 75–79","49.5 dan 74.5 kerana itu ialah sempadan bawah pertama dan atas terakhir","0 dan 80 supaya graf sentiasa bermula dari asalan"],"correctIndex":1,"proofLabId":"mat57_histogram_poligon_lab","proofState":{"mode":"poligon","dataset":"renang"},"explanation":"Saiz selang kelas ialah 5 saat (55 - 50 = 5). Kelas sebelum 50–54 ialah 45–49 (titik tengah 47) dan kelas selepas 70–74 ialah 75–79 (titik tengah 77). Kedua-duanya diplot pada kekerapan 0."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Langkah Poligon Kekerapan","voiceCaption":"Susun turutan langkah membina poligon kekerapan terus daripada jadual kekerapan.","voiceScript":"[confident] Susun blok langkah berikut mengikut tertib yang betul untuk membina poligon kekerapan tanpa perlu melukis histogram terlebih dahulu!","prompt":"Susun turutan pembinaan poligon kekerapan daripada jadual kekerapan:","hint":"Mulakan dengan menambah kelas sifar, hitung titik tengah, plot titik dan sambung garis...","answerTokens":["Tambah kelas sebelum dan selepas berkekerapan sifar","kemudian hitung titik tengah setiap kelas","seterusnya plot titik tengah melawan kekerapan","dan sambungkan dengan garis lurus"],"distractors":["menggunakan lengkung S secara bebas tangan","dengan kekerapan longgokan pada paksi mencancang"],"explanation":"Poligon kekerapan daripada jadual memerlukan tambahan kelas f = 0 pada kedua-dua hujung, titik tengah setiap kelas pada paksi mengufuk, kekerapan biasa pada paksi mencancang, dan sambungan garis lurus."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s7","voiceToneLabel":"Ujian Unit 1: Sempadan Kelas Perpuluhan","voiceCaption":"Hitung sempadan atas dan saiz selang kelas bagi jadual data perpuluhan seperti Latih Kendiri tujuh perpuluhan satu a.","voiceScript":"[serious] Soalan pengukuhan Unit satu menguji selang kelas berbentuk perpuluhan! Jadual tidur pekerja kilang mempunyai selang kelas empat perpuluhan sifar lima hingga lima perpuluhan sifar empat, diikuti lima perpuluhan sifar lima hingga enam perpuluhan sifar empat. Hitungkan sempadan atas kelas pertama serta saiz selang kelasnya!","stimulusHtml":"<table class='nota-table'><thead><tr><th>Jumlah jam tidur sehari</th><th>Bilangan pekerja</th></tr></thead><tbody><tr><td>4.05 – 5.04</td><td>2</td></tr><tr><td>5.05 – 6.04</td><td>4</td></tr><tr><td>6.05 – 7.04</td><td>22</td></tr></tbody></table>","prompt":"Apakah sempadan atas bagi kelas 4.05 – 5.04 dan saiz selang kelas bagi jadual ini?","options":["Sempadan atas = 5.045 jam; saiz selang kelas = 0.99 jam","Sempadan atas = 5.045 jam; saiz selang kelas = 1.0 jam","Sempadan atas = 5.04 jam; saiz selang kelas = 1.0 jam","Sempadan atas = 5.05 jam; saiz selang kelas = 0.99 jam"],"correctIndex":1,"explanation":"Sempadan atas kelas 4.05 – 5.04 ialah (5.04 + 5.05) / 2 = 5.045 jam. Sempadan bawahnya ialah 4.045 jam, maka saiz selang kelas = 5.045 - 4.045 = 1.0 jam (sama dengan 5.05 - 4.05 = 1.0)."}]},{"id":"mat57-u2","title":"Unit 2: Bentuk Taburan Data & Tafsiran Serakan","subtitle":"Subtopik 7.1 (Bhg. B) — 5 Bentuk Taburan (Loceng, Seragam, Dwimod, Pencong Kanan & Kiri) serta Perbandingan Dua Set Data","iconType":"graph","iconUrl":"../assets/icons/mat57-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Bentuk Taburan Data Terkumpul","voiceCaption":"Bentuk taburan data dikenal pasti secara keseluruhan sebagai simetri seperti loceng, seragam atau dwimod, ataupun pencong ke kanan dan pencong ke kiri.","voiceScript":"[warm] Selamat tiba di Unit dua! Selepas melukis histogram atau poligon kekerapan, ahli statistik memerhati bentuk keseluruhan taburan data tersebut. Terdapat dua keluarga besar: taburan simetri seperti bentuk loceng, seragam dan dwimod berpuncak dua, serta taburan pencong sama ada pencong ke kanan atau pencong ke kiri. Awas, jangan terkeliru arah ekor dengan arah puncak! Teroka kelima-lima bentuk pada simulator di bawah.","title":"Lima Bentuk Taburan: Simetri (Loceng, Seragam, Dwimod) & Pencong","acronym":"L•S•D•PK","hook":"Ingat petua emas: Pencong ke KANAN bermaksud EKOR panjang di kanan (puncak data di kiri), manakala Pencong ke KIRI bermaksud EKOR panjang di kiri!","mediaKey":"mat57_bentuk_taburan","summary":"Bentuk taburan data dihuraikan secara keseluruhan melalui histogram atau poligon kekerapan sama ada simetri (kiri dan kanan hampir sepadan) atau pencong (satu ekor lebih panjang).","bullets":["Taburan Simetri (Bentuk Loceng, Seragam & Dwimod): Apabila dibahagi dua di tengah, bentuk dan saiz kiri dan kanan adalah hampir sama. Bentuk loceng memuncak tunggal di tengah; bentuk seragam mempunyai palang hampir sama rata; taburan dwimod memaparkan dua puncak mod jelas (dua kelompok utama).","Taburan Pencong ke Kanan vs Pencong ke Kiri: Taburan pencong ke kanan mempunyai ekor panjang ke kanan manakala kebanyakan nilai data kecil berkumpul di sebelah kiri. Taburan pencong ke kiri mempunyai ekor panjang ke kiri manakala kebanyakan nilai data besar berkumpul di sebelah kanan."],"labId":"mat57_histogram_poligon_lab","labTitle":"Simulator 5 Bentuk Taburan Data Interaktif","labProps":{"mode":"bentuk","shape":"loceng"},"examTip":"Tip Bestari KSSM: Data dunia sebenar jarang simetri 100% sempurna; kenal pasti corak keseluruhannya berpandukan kedudukan puncak dan ekor yang lebih panjang."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih 3 Keluarga Bentuk Taburan","voiceCaption":"Kelaskan enam ciri dan situasi berikut kepada taburan simetri, pencong ke kanan atau pencong ke kiri.","voiceScript":"[curious] Mari uji kepakaran kamu membezakan kepencongan graf! Asingkan keenam-enam situasi berikut ke dalam kategori Simetri, Pencong ke Kanan atau Pencong ke Kiri.","prompt":"Kelaskan ciri visual dan konteks berikut mengikut bentuk taburan data yang tepat:","buckets":[{"id":"simetri","label":"Simetri (Loceng / Seragam / Dwimod)"},{"id":"kanan","label":"Pencong ke Kanan"},{"id":"kiri","label":"Pencong ke Kiri"}],"items":[{"text":"Bahagian kiri dan kanan poligon mempunyai bentuk cermin hampir serupa di keliling tengah","bucketId":"simetri","note":"Ciri asas taburan simetri seperti bentuk loceng"},{"text":"Ekor graf memanjang ke arah nilai besar di kanan; kebanyakan skor rendah","bucketId":"kanan","note":"Arah kepencongan dinamakan mengikut arah ekor yang panjang"},{"text":"Ekor graf memanjang ke arah nilai kecil di kiri; kebanyakan skor tinggi","bucketId":"kiri","note":"Majoriti data berada di kanan manakala ekor menirus ke kiri"},{"text":"Semua selang kelas mencatatkan ketinggian kekerapan yang hampir sama rata","bucketId":"simetri","note":"Taburan seragam tergolong dalam keluarga simetri"},{"text":"Harga jualan rumah di kawasan luar bandar dengan majoriti rumah berharga rendah","bucketId":"kanan","note":"Contoh 6: Kawasan A pencong ke kanan (kebanyakan harga rendah)"},{"text":"Kelajuan kereta di lebuh raya di mana kebanyakan pemandu memandu laju (nilai tinggi)","bucketId":"kiri","note":"Latih Kendiri 7.1b: Majoriti nilai tinggi di kanan, ekor ke kiri"}],"explanation":"Arah pencong sentiasa mengikut arah EKOR yang panjang: ekor panjang ke kanan (data kecil dominan) ialah pencong ke kanan; ekor panjang ke kiri (data besar dominan) ialah pencong ke kiri."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Banding Serakan & Prestasi Dua Graf","voiceCaption":"Lebar julat paksi mengufuk menunjukkan luas serakan, manakala kedudukan longgokan data menunjukkan kumpulan manakah mempunyai prestasi atau nilai lebih tinggi.","voiceScript":"[warm] Selain menamakan bentuk taburan, peperiksaan SPM sering meminta kamu membanding dua histogram atau dua poligon kekerapan seperti Contoh lima dan Contoh enam. Perhatikan dua aspek: pertama, bezakan lebar julat antara titik paling kiri dan paling kanan untuk menilai luas serakan. Kedua, tafsirkan kedudukan longgokan data mengikut konteks sama ada masa renang yang singkat ataupun markah ujian yang tinggi!","title":"Mentafsir & Membanding Serakan Dua Set Data Terkumpul","acronym":"L•S•K","hook":"Dua set data boleh memiliki luas serakan yang HAMPIR SAMA walaupun satu pencong ke kanan dan satu lagi pencong ke kiri!","summary":"Perbandingan dua taburan data menilai tiga aspek utama iaitu bentuk taburan, luas serakan (beza julat taburan) serta kedudukan penumpuan majoriti data.","bullets":["Contoh 5 (Acara Renang 100 m): Acara kuak lentang berbentuk loceng dan mempunyai serakan masa lebih luas (102 s - 72 s = 30 s). Acara gaya bebas pula berbentuk seragam dan menunjukkan prestasi lebih baik kerana catatan masa perenangnya lebih rendah (pantas) dan sekata.","Contoh 6 (Harga Rumah Kawasan A vs B): Kawasan A pencong ke kanan (mewakili luar bandar kerana kebanyakan harga rumah rendah) manakala Kawasan B pencong ke kiri (mewakili bandar kerana kebanyakan harga rumah tinggi), namun luas serakan harga kedua-duanya hampir sama."],"labId":"mat57_histogram_poligon_lab","labTitle":"Banding Bentuk Pencong Kanan vs Pencong Kiri pada Simulator","labProps":{"mode":"bentuk","shape":"pencong_kanan"},"examTip":"Sentiasa semak unit paksi-x sebelum menyimpulkan prestasi baik: bagi masa larian atau renang, nilai KECIL bermaksud prestasi LEBIH BAIK; bagi markah ujian, nilai BESAR lebih baik!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Poligon Kawasan Bandar vs Luar Bandar","voiceCaption":"Ramalkan tafsiran poligon kekerapan harga jualan rumah di Kawasan A dan Kawasan B berdasarkan bentuk kepencongannya.","voiceScript":"[curious] Berdasarkan Contoh enam dalam buku teks, dua poligon kekerapan melakar taburan harga rumah dalam ribuan ringgit bagi Kawasan A dan Kawasan B. Graf Kawasan A memuncak di harga rendah lalu berekor ke kanan, manakala Kawasan B memuncak di harga tinggi lalu berekor ke kiri dengan rentang julat yang sama lebar. Apakah kesimpulan paling tepat?","hook":"Perhatikan bentuk pencong ke kiri dan pencong ke kanan pada simulator selepas mengesahkan jawapan!","scenario":"Poligon harga rumah Kawasan A meliputi julat RM150k–RM550k dengan puncak di RM200k, manakala Kawasan B meliputi RM150k–RM550k dengan puncak di RM450k.","prompt":"Manakah padanan bentuk taburan, luas serakan dan kawasan yang paling tepat?","options":["Kawasan A pencong ke kiri (bandar), Kawasan B pencong ke kanan (luar bandar)","Kawasan A pencong ke kanan (luar bandar), Kawasan B pencong ke kiri (bandar), dan serakan keduanya hampir sama","Kawasan A lebih luas serakannya kerana puncak graf berada di kiri","Kedua-dua graf bersifat simetri kerana julat harganya sama lebar"],"correctIndex":1,"proofLabId":"mat57_histogram_poligon_lab","proofState":{"mode":"bentuk","shape":"pencong_kiri"},"explanation":"Kawasan A berekor panjang ke kanan (pencong ke kanan, majoriti harga rendah -> luar bandar). Kawasan B berekor panjang ke kiri (pencong ke kiri, majoriti harga tinggi -> bandar). Oleh sebab rentang harga minimum hingga maksimum kedua-duanya sama (RM150k–RM550k), serakannya hampir sama."},{"type":"match","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Padan 5 Bentuk Taburan dengan Cirinya","voiceCaption":"Padankan kelima-lima nama bentuk taburan data dengan huraian visualnya yang tepat.","voiceScript":"[confident] Uji penguasaan visual kamu terhadap kesemua lima bentuk taburan! Padankan setiap bentuk dengan ciri grafnya yang sebenar.","prompt":"Padankan lima bentuk taburan berikut dengan ciri visualnya pada histogram atau poligon:","pairs":[{"id":"u2m1","left":"Bentuk Loceng","right":"Simetri tunggal dengan kekerapan tertinggi di tengah dan menirus ke kedua-dua hujung"},{"id":"u2m2","left":"Taburan Seragam","right":"Simetri rata kerana hampir semua kelas mempunyai kekerapan yang sama"},{"id":"u2m3","left":"Taburan Dwimod","right":"Memaparkan dua puncak mod jelas yang dipisahkan oleh kelas tengah rendah"},{"id":"u2m4","left":"Pencong ke Kanan","right":"Ekor panjang menghala ke nilai besar di kanan dan longgokan data di kiri"},{"id":"u2m5","left":"Pencong ke Kiri","right":"Ekor panjang menghala ke nilai kecil di kiri dan longgokan data di kanan"}],"explanation":"Mengenal pasti kelima-lima corak ini membantu kamu menghuraikan serakan graf tanpa perlu melakukan pengiraan panjang."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Huraian Serakan & Prestasi","voiceCaption":"Susun jawapan berstruktur menerangkan mengapa kumpulan dengan masa renang lebih rendah dan taburan seragam menunjukkan prestasi lebih baik.","voiceScript":"[warm] Latih kemahiran menulis justifikasi Kertas dua SPM! Susun blok huraian berikut bagi membandingkan acara seratus meter gaya bebas dengan gaya kuak lentang dalam Contoh lima.","prompt":"Susun huraian lengkap perbandingan prestasi dan serakan acara renang 100 m:","hint":"Nyatakan acara yang mempunyai serakan lebih luas dahulu, diikuti sebab prestasi yang lebih baik...","answerTokens":["Acara kuak lentang mempunyai serakan lebih luas","iaitu beza masa tiga puluh saat","manakala acara gaya bebas lebih baik","kerana catatan masa perenang lebih pantas"],"distractors":["kerana bentuk loceng sentiasa paling lemah","walaupun julat masanya adalah sifar"],"explanation":"Skema Kertas 2 menilai dua bukti: nilai beza julat (102 - 72 = 30 s bagi kuak lentang -> serakan lebih luas) dan penumpuan masa lebih rendah bagi gaya bebas (catatan lebih pantas)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s7","voiceToneLabel":"Ujian Unit 2: Trafik Lebuh Raya vs Perumahan","voiceCaption":"Tafsir dua graf kajian lalu lintas 50 buah kereta bagi menentukan lokasi lebuh raya dan kawasan perumahan.","voiceScript":"[serious] Soalan akhir Unit dua merujuk Latih Kendiri tujuh perpuluhan satu b! Kajian laju lima puluh buah kereta dijalankan di Lokasi X dan Lokasi Y. Graf Lokasi X berbentuk pencong ke kiri dengan puncak laju sekitar seratus sepuluh kilometer sejam, manakala Lokasi Y berbentuk pencong ke kanan dengan puncak laju sekitar empat puluh kilometer sejam. Kesimpulan manakah yang paling tepat?","stimulusHtml":"<div class='stimulus-note'><strong>Kajian Lalu Lintas (50 Kereta / Lokasi):</strong><br>Lokasi X: Puncak laju di sebelah kanan (100–120 km/j), ekor panjang ke kiri.<br>Lokasi Y: Puncak laju di sebelah kiri (30–50 km/j), ekor panjang ke kanan.</div>","prompt":"Berdasarkan taburan tersebut, manakah padanan lokasi yang paling munasabah bagi Lokasi X dan Lokasi Y?","options":["Lokasi X ialah kawasan perumahan kerana pencong ke kiri, manakala Lokasi Y ialah lebuh raya","Lokasi X ialah lebuh raya kerana kebanyakan kereta bergerak laju (pencong ke kiri), manakala Lokasi Y ialah kawasan perumahan kerana kebanyakan kereta bergerak perlahan (pencong ke kanan)","Kedua-duanya ialah kawasan perumahan kerana jumlah kereta sama iaitu 50 buah","Lokasi Y adalah lebuh raya kerana ekor grafnya memanjang ke kanan"],"correctIndex":1,"explanation":"Di lebuh raya, majoriti pemandu memecut pada kelajuan tinggi (nilai di kanan) menghasilkan taburan pencong ke kiri (Lokasi X). Di kawasan perumahan, pemandu memperlahankan kenderaan pada kelajuan rendah (nilai di kiri) menghasilkan taburan pencong ke kanan (Lokasi Y)."}]},{"id":"mat57-u3","title":"Unit 3: Ogif, Kuartil (Q1, Q2, Q3) & Persentil","subtitle":"Subtopik 7.1 (Bhg. C) — Melukis Lengkung S Ogif, Histogram Longgokan, Kuartil & Persentil serta Peratusan Data","iconType":"graph","iconUrl":"../assets/icons/mat57-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Membina Ogif & Histogram Longgokan","voiceCaption":"Ogif ialah lengkung licin berbentuk S yang memplot sempadan atas melawan kekerapan longgokan, bermula pada kekerapan sifar.","voiceScript":"[warm] Selamat datang ke Unit tiga! Sekarang kita meneroka graf berbentuk huruf S yang paling banyak keluar dalam Kertas dua SPM, iaitu ogif atau lengkung kekerapan longgokan. Berbeza daripada poligon yang menggunakan garis lurus dan titik tengah, ogif memplot sempadan atas pada paksi mengufuk melawan kekerapan longgokan pada paksi mencancang, lalu disambung menjadi lengkung licin! Jangan lupa aktifkan butang Histogram Longgokan pada makmal untuk melihat bagaimana bucu atas kanan setiap palang membentuk ogif!","title":"Membina Ogif Berbentuk S & Perkaitan Histogram Longgokan","acronym":"SA•KL•S","hook":"Poligon guna titik tengah + garis lurus + 2 hujung f=0; OGIF pula guna SEMPADAN ATAS + LENGKUNG LICIN S + kelas f=0 di pangkal sahaja!","mediaKey":"mat57_ogif_kuartil","summary":"Ogif ialah lengkung kekerapan longgokan berbentuk S yang menghubungkan bucu atas kanan histogram longgokan melalui setiap pasangan koordinat (sempadan atas, kekerapan longgokan).","bullets":["4 Langkah Membina Ogif (Contoh 7): (1) Tambah satu kelas sebelum kelas pertama dengan kekerapan 0. (2) Cari sempadan atas dan kekerapan longgokan bagi semua kelas. (3) Plot sempadan atas pada paksi mengufuk dan kekerapan longgokan pada paksi mencancang. (4) Lukis lengkung licin berbentuk S melalui semua titik tersebut.","Perkaitan dengan Histogram Longgokan (ms 219): Histogram longgokan melukis palang kekerapan longgokan pada sempadan kelas. Apabila kita menanda bucu atas sebelah kanan setiap palang histogram longgokan dan menyambungkannya dengan lengkung licin dari sempadan bawah kelas pertama (F = 0), terhasillah ogif!"],"labId":"mat57_ogif_kuartil_persentil_lab","labTitle":"Pengesan Ogif Interaktif & Lapisan Histogram Longgokan","labProps":{"tab":"kuartil","dataset":"garam","pct":50,"showCumHist":true},"examTip":"Jika graf ogif kamu tidak bermula pada F = 0 di sempadan atas kelas sifar tambahan, markah paksi graf Kertas 2 akan ditolak!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Langkah Membina Ogif","voiceCaption":"Susun turutan pembinaan ogif yang tepat daripada jadual kekerapan.","voiceScript":"[confident] Susun semula blok langkah berikut untuk melukis ogif yang tepat daripada jadual kekerapan tanpa terkeliru dengan poligon!","prompt":"Susun langkah pembinaan lengkung ogif mengikut urutan yang betul:","hint":"Bermula dengan menambah kelas f = 0 di pangkal jadual, diikuti sempadan atas & kekerapan longgokan...","answerTokens":["Tambah satu kelas sebelum kelas pertama berkekerapan sifar","hitung sempadan atas dan kekerapan longgokan","plot kekerapan longgokan melawan sempadan atas","lalu lukis lengkung licin berbentuk S"],"distractors":["plot titik tengah melawan kekerapan biasa","dan sambungkan setiap titik menggunakan pembaris lurus"],"explanation":"Ogif mesti bermula dengan kelas f = 0 sebelum kelas pertama (bukan di akhir), memplot (sempadan atas, kekerapan longgokan), dan dilukis sebagai lengkung licin berbentuk S."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Menentukan Kuartil & Persentil daripada Ogif","voiceCaption":"Daripada ogif berjumlah N data, kuartil dibaca pada seperempat N, setengah N dan tiga perempat N, manakala persentil P k dibaca pada k per seratus N.","voiceScript":"[warm] Mengapakah ogif sangat penting dalam statistik? Kerana daripada lengkung S ogif, kita boleh membaca kuartil pertama, median dan kuartil ketiga secara tepat! Untuk jumlah data N, cari kedudukan seperempat N bagi Q satu, setengah N bagi median Q dua, dan tiga perempat N bagi Q tiga. Malah, bagi data besar, persentil P k membahagi data kepada seratus bahagian pada kedudukan k per seratus darab N!","title":"Membaca Kuartil (Q1, Q2, Q3), Persentil (Pk) & Peratusan Data","acronym":"Q1•Q2•Q3•Pk","hook":"Q1 ialah 25% data (P25), Median Q2 ialah 50% data (P50), dan Q3 ialah 75% data (P75) — semuanya dibaca secara mengufuk lalu turun mencancang!","summary":"Kuartil membahagikan satu set data tersusun kepada 4 bahagian sama banyak, manakala persentil (P1 hingga P99) membahagikannya kepada 100 bahagian sama banyak menggunakan ogif.","bullets":["Menentukan Kuartil (Contoh 7, N = 60 makanan): Kedudukan Q1 = (1/4) x 60 = 15 (baca 199.5 mg); Median Q2 = (1/2) x 60 = 30 (baca 249.5 mg); Q3 = (3/4) x 60 = 45 (baca 284.5 mg, bermaksud 45 makanan ada <= 284.5 mg garam).","Menentukan Persentil & Songsangan Peratusan (Contoh 8, N = 50 calon): P10 berada pada (10/100) x 50 = 5 (skor 46.5); P46 pada (46/100) x 50 = 23 (skor 63.5); P92 pada (92/100) x 50 = 46 (skor 77). Songsangan: jika skor 57 berada pada kekerapan longgokan 15, maka (15/50) x 100% = 30% calon mendapat skor 57 dan ke bawah."],"labId":"mat57_ogif_kuartil_persentil_lab","labTitle":"Pengesan Kuartil, Persentil P1–P99 & Songsangan Peratusan","labProps":{"tab":"persentil","dataset":"kecerdasan","pct":46,"showCumHist":false},"formula":"Kedudukan Q1 = N/4  |  Q2 = N/2  |  Q3 = 3N/4  |  Pk = (k/100) x N","examTip":"Berhati-hati dengan soalan peratusan 'MELEBIHI x' (seperti Latih Ekstensif No. 9): cari kekerapan longgokan c di x, kemudian tolak dahulu (N - c) sebelum bahagi N dan darab 100%!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Skor Minimum P92 Temuduga","voiceCaption":"Ramalkan kedudukan kekerapan longgokan dan skor minimum bagi calon persentil ke-92 daripada 50 orang pemohon.","voiceScript":"[curious] Cuba selesaikan kes Contoh lapan! Sebuah syarikat menguji lima puluh orang calon dan hanya calon yang memperoleh persentil ke sembilan puluh dua dan ke atas dipanggil temuduga. Berapakah kedudukan kekerapan longgokan pada paksi mencancang untuk membaca P sembilan puluh dua dan apakah skor minimumnya pada ogif?","hook":"Sahkan kedudukan garis merah pada pengesan ogif Contoh 8 selepas menjawab!","scenario":"Seramai N = 50 calon menduduki ujian kecerdasan. Hanya 8% calon teratas (persentil ke-92 dan ke atas) layak ke sesi temuduga.","prompt":"Apakah kedudukan kekerapan longgokan bagi P92 dan skor minimum yang dibaca daripada ogif Contoh 8?","options":["Kekerapan longgokan = 4, skor minimum = 46.5","Kekerapan longgokan = 46, skor minimum = 77","Kekerapan longgokan = 23, skor minimum = 63.5","Kekerapan longgokan = 42, skor minimum = 73"],"correctIndex":1,"proofLabId":"mat57_ogif_kuartil_persentil_lab","proofState":{"tab":"persentil","dataset":"kecerdasan","pct":92},"explanation":"Kedudukan P92 = (92/100) x 50 = 46 pada paksi kekerapan longgokan. Garis mengufuk dari 46 menyilang ogif pada skor 77, iaitu skor minimum untuk menerima panggilan temuduga."},{"type":"match","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Padan Jenis Graf & Formula Kedudukan","voiceCaption":"Padankan lima konsep graf dan kedudukan kuartil atau persentil dengan nilai tepatnya.","voiceScript":"[confident] Uji kelancaran kamu menukar antara tiga graf Subtopik tujuh perpuluhan satu dan kedudukan kuartil! Padankan kelima-lima pasangan berikut.","prompt":"Padankan istilah graf dan ukuran kedudukan berikut dengan huraian atau nilainya:","pairs":[{"id":"u3m1","left":"Paksi-x Histogram","right":"Sempadan bawah dan sempadan atas selang kelas"},{"id":"u3m2","left":"Paksi-x Ogif","right":"Sempadan atas setiap kelas (bermula pada F = 0)"},{"id":"u3m3","left":"Kedudukan Q1 apabila N = 80","right":"Kekerapan longgokan 20 (mewakili 25% data pertama)"},{"id":"u3m4","left":"Kedudukan Q3 apabila N = 80","right":"Kekerapan longgokan 60 (mewakili 75% data terkumpul)"},{"id":"u3m5","left":"Persentil ke-40 (P40) bagi N = 50","right":"Dibaca pada kekerapan longgokan (40/100) x 50 = 20"}],"explanation":"Membezakan paksi-x antara histogram (sempadan kelas), poligon (titik tengah) dan ogif (sempadan atas) mengelakkan kesilapan paling kerap dalam Kertas 2."},{"type":"sort","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Isih Histogram vs Poligon vs Ogif","voiceCaption":"Kelaskan enam ciri pembinaan graf ini mengikut Histogram, Poligon Kekerapan dan Ogif.","voiceScript":"[curious] Mari buat perbandingan muktamad antara tiga graf Subtopik tujuh perpuluhan satu! Asingkan keenam-enam ciri berikut kepada Histogram, Poligon Kekerapan atau Ogif.","prompt":"Isihkan enam ciri pembinaan graf berikut mengikut graf yang betul:","buckets":[{"id":"hist","label":"Histogram"},{"id":"poli","label":"Poligon Kekerapan"},{"id":"ogif","label":"Ogif"}],"items":[{"text":"Palang menegak bersebelahan tanpa ruang pada sempadan kelas","bucketId":"hist","note":"Histogram guna palang rapat yang mewakili kekerapan kelas"},{"text":"Garisan lurus menyambung titik tengah dan wajib ada kelas f = 0 di kedua-dua hujung","bucketId":"poli","note":"Poligon kekerapan bertutup di paksi-x pada titik tengah hujung"},{"text":"Lengkung licin berbentuk S yang memplot sempadan atas melawan kekerapan longgokan","bucketId":"ogif","note":"Ogif tidak pernah menurun dan sentiasa berbentuk S"},{"text":"Digunakan untuk menentukan nilai kuartil Q1, median Q2 dan persentil Pk","bucketId":"ogif","note":"Kedudukan N/4, N/2, 3N/4 dibaca pada paksi mencancang ogif"},{"text":"Tingginya ditentukan oleh kekerapan biasa setiap kelas dengan lebar sama saiz selang kelas","bucketId":"hist","note":"Paksi-y histogram biasa ialah kekerapan kelas (f)"},{"text":"Boleh dibina terus tanpa histogram dengan memplot koordinat (titik tengah, kekerapan)","bucketId":"poli","note":"Contoh 4 menunjukkan kaedah membina poligon terus daripada jadual"}],"explanation":"Ringkasannya: Histogram = palang + sempadan; Poligon = garis lurus + titik tengah + 2 hujung 0; Ogif = lengkung S + sempadan atas + kekerapan longgokan."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s7","voiceToneLabel":"Ujian Unit 3: Kuartil & Peratusan Melebihi","voiceCaption":"Hitung peratusan murid yang panjang tapak kakinya melebihi nilai tertentu berdasarkan bacaan kekerapan longgokan pada ogif.","voiceScript":"[serious] Soalan pengukuhan Unit tiga! Daripada sebuah ogif panjang tapak kaki empat puluh orang murid, didapati kekerapan longgokan bagi panjang tapak kaki dua puluh empat perpuluhan enam sentimeter ialah tiga puluh orang. Berapakah peratusan murid yang mempunyai panjang tapak kaki dua puluh empat perpuluhan enam sentimeter dan ke bawah berbanding yang melebihinya?","stimulusHtml":"<div class='stimulus-note'><strong>Data Ogif Panjang Tapak Kaki (N = 40 murid):</strong><br>Pada sempadan nilai 24.6 cm, garis mencancang bertemu ogif pada kekerapan longgokan <strong>30</strong>.</div>","prompt":"Berapakah peratusan murid yang panjang tapak kakinya 24.6 cm dan ke bawah, SERTA peratusan yang melebihi 24.6 cm?","options":["30% dan ke bawah; 70% melebihi 24.6 cm","75% dan ke bawah; 25% melebihi 24.6 cm","61.5% dan ke bawah; 38.5% melebihi 24.6 cm","24.6% dan ke bawah; 75.4% melebihi 24.6 cm"],"correctIndex":1,"explanation":"Kekerapan longgokan 30 bermaksud 30 daripada 40 murid mempunyai tapak kaki <= 24.6 cm, iaitu (30/40) x 100% = 75%. Bakinya 40 - 30 = 10 orang melebihi 24.6 cm, iaitu (10/40) x 100% = 25%."}]},{"id":"mat57-u4","title":"Unit 4: Julat, Varians, Sisihan Piawai & Plot Kotak","subtitle":"Subtopik 7.2 — Julat, Julat Antara Kuartil (Q3 - Q1), Jadual 6 Lajur Varians & Sisihan Piawai, Plot Kotak & Banding Dua Set Data","iconType":"formula","iconUrl":"../assets/icons/mat57-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Julat & Julat Antara Kuartil Terkumpul","voiceCaption":"Julat data terkumpul ialah titik tengah kelas tertinggi tolak titik tengah kelas terendah, manakala julat antara kuartil ialah Q tiga tolak Q satu daripada ogif.","voiceScript":"[warm] Kini kita masuk ke Subtopik tujuh perpuluhan dua, iaitu Sukatan Serakan Berangka bagi data terkumpul! Dalam Tingkatan empat kamu telah mengira julat bagi data tak terkumpul. Bagi data terkumpul pula, julat bukan lagi nilai terbesar tolak terkecil yang mentah, sebaliknya titik tengah kelas tertinggi tolak titik tengah kelas terendah! Julat antara kuartil pula ialah Q tiga tolak Q satu yang dibaca daripada ogif.","title":"7.2 Julat & Julat Antara Kuartil bagi Data Terkumpul","acronym":"TT•Q3-Q1","hook":"Perangkap maut SPM: Julat data terkumpul = TITIK TENGAH kelas tertinggi tolak TITIK TENGAH kelas terendah (bukan had atas tolak had bawah)!","mediaKey":"mat57_varians_sisihan","summary":"Julat mengukur keseluruhan rentang data antara pusat kelas tertinggi dan terendah, manakala julat antara kuartil (Q3 - Q1) mengukur serakan 50% tengah taburan yang kebal terhadap nilai ekstrem.","bullets":["Rumus Julat (Contoh 9 Nanas Pak Hamidi): Kelas terendah ialah 400–499 g (titik tengah 449.5 g) dan kelas tertinggi ialah 900–999 g (titik tengah 949.5 g). Maka Julat = 949.5 - 449.5 = 500 g.","Julat Antara Kuartil = Q3 - Q1: Daripada ogif 80 biji nanas, kedudukan Q1 = (1/4) x 80 = 20 memberi Q1 = 614.5 g dan kedudukan Q3 = (3/4) x 80 = 60 memberi Q3 = 809.5 g. Maka Julat antara kuartil = 809.5 - 614.5 = 195 g (beza jisim bagi 50% nanas di tengah taburan)."],"labId":"mat57_rumus_terkumpul_flip","labTitle":"Dek Kad 3D Rumus Sukatan Serakan Data Terkumpul","labProps":{"tab":"rumus"},"formula":"Julat = Titik Tengah(tertinggi) - Titik Tengah(terendah)   |   Julat Antara Kuartil = Q3 - Q1","examTip":"Apabila diminta menerangkan maksud julat antara kuartil dalam Kertas 2, nyatakan bahawa ia menunjukkan beza nilai bagi 50% data di bahagian tengah taburan."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Perangkap Julat Data Terkumpul","voiceCaption":"Elakkan perangkap menolak had atas dengan had bawah semasa menghitung julat jadual bil elektrik.","voiceScript":"[curious] Cuba teka jawapan yang betul dan elakkan kesilapan klasik pelajar SPM! Satu jadual bil elektrik bulanan pangsapuri bermula pada kelas tiga puluh hingga empat puluh sembilan ringgit dan berakhir pada kelas seratus sepuluh hingga seratus dua puluh sembilan ringgit. Berapakah julat bil elektrik tersebut?","hook":"Sahkan rumus julat pada Kad 3D Rumus 01 sebaik sahaja menjawab!","scenario":"Dalam Latih Kendiri 7.2a No. 1, bil elektrik (RM) dikumpulkan dalam kelas seragam 30–49, 50–69, 70–89, 90–109 dan 110–129.","prompt":"Berapakah julat bagi taburan bil elektrik pangsapuri tersebut?","options":["RM99.00 kerana 129 - 30 = 99","RM100.00 kerana sempadan atas 129.5 - sempadan bawah 29.5 = 100","RM80.00 kerana titik tengah tertinggi (119.5) tolak titik tengah terendah (39.5)","RM19.00 kerana had atas tolak had bawah satu kelas"],"correctIndex":2,"proofLabId":"mat57_rumus_terkumpul_flip","proofState":{"tab":"rumus"},"explanation":"Titik tengah kelas tertinggi (110–129) ialah (110 + 129)/2 = 119.5, manakala titik tengah kelas terendah (30–49) ialah (30 + 49)/2 = 39.5. Maka Julat = 119.5 - 39.5 = RM80.00!"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Min, Varians & Sisihan Piawai","voiceCaption":"Jadual enam lajur menghimpun kekerapan, titik tengah x, f x, x kuasa dua dan f x kuasa dua untuk menghitung min, varians serta sisihan piawai.","voiceScript":"[warm] Seterusnya mari kita kuasai rumus teras pengiraan Kertas dua: Min anggaran, Varians sigma kuasa dua, dan Sisihan Piawai sigma! Untuk mengiranya tanpa kesilapan cuai, bina jadual enam lajur: selang kelas, kekerapan f, titik tengah x, hasil darab f x, x kuasa dua dan f x kuasa dua. Gunakan kalkulator saintifik dalam mod S D untuk menyemak jawapan akhir dengan pantas!","title":"Jadual 6 Lajur: Min Anggaran, Varians & Sisihan Piawai","acronym":"6L•V•SP","hook":"Ingat kuasa dua pada min! Varians = (Jumlah fx² / Jumlah f) - MIN², dan JANGAN bulat min terlalu awal sebelum menolak x̄²!","summary":"Varians dan sisihan piawai mengukur purata jarak serakan data daripada min anggarannya menerusi titik tengah setiap selang kelas.","bullets":["Rumus Lengkap (Contoh 10 Isi Padu Air, N = 95): Min x̄ = Sum(fx) / Sum(f) = 17 417.5 / 95 = 183.34 L. Varians σ² = [Sum(fx²) / Sum(f)] - x̄² = (3 215 133.75 / 95) - (17 417.5 / 95)² = 229.19 L². Sisihan piawai σ = punca kuasa varians = 15.14 L.","Semak dengan Kalkulator Saintifik (Mod SD): Tekan MODE MODE -> 1 (SD) -> masukkan setiap pasangan 'x SHIFT , f M+' -> kemudian tekan AC SHIFT 2: tekan 1 untuk min (x̄) dan tekan 2 untuk sisihan piawai (σ)."],"labId":"mat57_varians_sisihan_terkumpul_lab","labTitle":"Kalkulator Jadual 6 Lajur Interaktif & Mod Semak SD","labProps":{"dataset":"air"},"formula":"x̄ = Sum(fx)/Sum(f)   |   σ² = [Sum(fx²)/Sum(f)] - x̄²   |   σ = sqrt(σ²)","examTip":"Dalam pengiraan σ², kekalkan nilai pecahan asal x̄ = Sum(fx)/Sum(f) (contohnya 17417.5/95) supaya jawapan 2 tempat perpuluhan kamu tidak lari akibat pembundaran awal!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Pilih Sukatan Serakan Paling Sesuai","voiceCaption":"Tentukan bila wajar menggunakan min bersama sisihan piawai berbanding median bersama julat antara kuartil.","voiceScript":"[curious] Kemahiran KBAT SPM selalu bertanya: sukatan serakan manakah paling sesuai untuk menghurai sesuatu set data? Isihkan enam ciri dan situasi berikut antara pasangan Min dan Sisihan Piawai berbanding Median dan Julat Antara Kuartil!","prompt":"Isihkan situasi berikut kepada pilihan sukatan kecenderungan memusat & serakan yang paling sesuai:","buckets":[{"id":"sd","label":"Min & Sisihan Piawai"},{"id":"iqr","label":"Median & Julat Antara Kuartil"}],"items":[{"text":"Taburan data berbentuk loceng atau hampir simetri tanpa nilai ekstrem","bucketId":"sd","note":"Min dan sisihan piawai mengambil kira semua nilai apabila taburan simetri"},{"text":"Taburan data pencong ke kiri atau ke kanan dengan kehadiran nilai ekstrem","bucketId":"iqr","note":"Median dan Q3 - Q1 tidak terherot oleh pencilan atau ekor panjang"},{"text":"Membandingkan ketekalan diameter kelopak bunga raya yang bertabur seimbang (Contoh 12)","bucketId":"sd","note":"Sisihan piawai kecil membuktikan konsistensi di keliling min"},{"text":"Graf asal yang diberikan dalam soalan hanyalah ogif atau plot kotak","bucketId":"iqr","note":"Q1, Q2 (median) dan Q3 dibaca terus tanpa perlu mengira titik tengah"},{"text":"Mengukur serakan bagi 50% data di bahagian tengah taburan sahaja","bucketId":"iqr","note":"Definisi tepat bagi julat antara kuartil (Q3 - Q1)"},{"text":"Mengawal ketepatan mesin bola supaya purata tekanan hampir sasaran dan seragam","bucketId":"sd","note":"Mengguna pakai min (ketepatan sasaran) dan sisihan piawai (konsistensi)"}],"explanation":"Gunakan Min & Sisihan Piawai bagi taburan simetri tanpa nilai ekstrem untuk menilai purata dan konsistensi. Gunakan Median & Julat Antara Kuartil bagi taburan pencong, ada pencilan, atau graf ogif/plot kotak."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Plot Kotak & Banding Dua Set Data","voiceCaption":"Plot kotak memaparkan lima nilai serangkai iaitu minimum, Q satu, median, Q tiga dan maksimum untuk mengenal pasti kepencongan serta membanding dua set data.","voiceScript":"[warm] Kad konsep terakhir Unit empat menghimpunkan dua kemahiran penting: Plot Kotak dan Perbandingan Dua Set Data Terkumpul! Plot kotak dibina daripada lima nilai iaitu minimum, Q satu, median, Q tiga dan maksimum yang dibaca daripada ogif. Jika bahagian kiri kotak atau sungut kiri lebih besar, taburan itu pencong ke kiri! Dalam membanding dua set data seperti Contoh dua belas bunga raya Hibrid A dan B, nilai min yang lebih besar serta sisihan piawai yang lebih kecil membuktikan prestasi yang lebih baik dan lebih konsisten!","title":"Membina Plot Kotak & Membanding Dua Set Data (Contoh 11 & 12)","acronym":"5N•PK•SP","hook":"Awas arah plot kotak! Jika bahagian KIRI kotak (Q2 - Q1) lebih besar daripada kanan, taburan adalah PENCONG KE KIRI — sama arah dengan kotak yang lebih lebar!","mediaKey":"mat57_plot_kotak","summary":"Plot kotak memvisualkan lima nilai serangkai daripada ogif untuk mengesan simetri atau kepencongan, manakala min dan sisihan piawai digunakan untuk membanding dua set data terkumpul.","bullets":["Plot Kotak 5 Nilai (Contoh 11 Belimbing, N = 90): Daripada ogif diperoleh Min = 80, Q1 = 116, Median Q2 = 123, Q3 = 128, Maks = 150. Taburan simetri mempunyai garis median di tengah kotak dan sungut sama panjang. Taburan pencong ke kiri mempunyai bahagian kiri kotak lebih besar (123 - 116 = 7 > 128 - 123 = 5) atau sungut kiri lebih panjang; pencong ke kanan pula sebaliknya.","Membanding Dua Set Data & Membina Jadual daripada Ogif (Contoh 12 & 13): Dalam Contoh 12 (bunga raya), Hibrid A mempunyai min lebih besar (14.35 cm > 14.1 cm) dan sisihan piawai lebih kecil (0.64 cm < 0.7 cm), jadi Hibrid A lebih mekar dan konsisten. Dalam Contoh 13, kekerapan kelas f diperoleh daripada ogif dengan menolak kekerapan longgokan kelas berturutan sebelum mengira min dan sisihan piawai."],"labId":"mat57_varians_sisihan_terkumpul_lab","labTitle":"Pembanding Dua Set Data: Bunga Raya Hibrid A vs B & Mesin P vs Q","labProps":{"dataset":"hibrid"},"examTip":"Berbeza daripada histogram/poligon yang menamakan pencong mengikut ekor, pada plot kotak jika kotak bahagian kiri lebih besar maka ia pencong ke kiri; jika kotak sama besar, lihat sungut yang lebih panjang!"},{"type":"match","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Padan Ciri Plot Kotak & Serakan","voiceCaption":"Padankan lima petunjuk pada plot kotak dan perbandingan sisihan piawai dengan maknanya yang tepat.","voiceScript":"[confident] Uji ketelitian kamu mentafsir plot kotak dan statistik perbandingan! Padankan kelima-lima petunjuk berikut dengan maksud statistiknya.","prompt":"Padankan komponen plot kotak dan ukuran serakan berikut dengan tafsirannya:","pairs":[{"id":"u4m1","left":"Garis tegak di dalam kotak","right":"Menunjukkan kedudukan Median (Q2) bagi taburan"},{"id":"u4m2","left":"Lebar kotak (hujung kiri ke kanan)","right":"Mewakili Julat Antara Kuartil (Q3 - Q1)"},{"id":"u4m3","left":"Bahagian kiri kotak lebih besar daripada kanan","right":"Menandakan taburan data pencong ke kiri"},{"id":"u4m4","left":"Sisihan piawai (σ) yang lebih kecil","right":"Menunjukkan data lebih seragam dan lebih konsisten"},{"id":"u4m5","left":"Kekerapan kelas daripada ogif","right":"Beza kekerapan longgokan suatu sempadan dengan sempadan sebelumnya"}],"explanation":"Plot kotak merakam 5 nilai (Min, Q1, Q2, Q3, Maks), kotak = Q3 - Q1, kelebaran sebelah kiri menandakan pencong ke kiri, dan sisihan piawai kecil bermaksud lebih konsisten."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Susun Justifikasi Hibrid A vs B","voiceCaption":"Susun ayat justifikasi lengkap Kertas dua bagi menentukan hibrid bunga raya yang lebih baik daripada nilai min dan sisihan piawai.","voiceScript":"[warm] Latih jawapan penuh Kertas dua SPM! Berdasarkan Contoh dua belas, Hibrid A mencatat min empat belas perpuluhan tiga lima sentimeter dan sisihan piawai sifar perpuluhan enam empat sentimeter, berbanding Hibrid B empat belas perpuluhan satu sentimeter dan sifar perpuluhan tujuh sentimeter. Susun justifikasi lengkapnya!","prompt":"Susun ayat keputusan lengkap bagi membandingkan bunga raya Hibrid A dengan Hibrid B:","hint":"Gabungkan perbandingan min (lebih mekar) serta perbandingan sisihan piawai (lebih konsisten)...","answerTokens":["Hibrid A menghasilkan kelopak lebih mekar","kerana minnya lebih besar daripada Hibrid B","dan sisihan piawainya lebih kecil","menunjukkan diameter bunga lebih konsisten"],"distractors":["kerana variansnya paling besar","dan kekerapannya melebihi seratus"],"explanation":"Jawapan markah penuh Kertas 2 mesti menyebut kedua-dua hujah berangka: min lebih besar (14.35 cm > 14.1 cm = lebih mekar) dan sisihan piawai lebih kecil (0.64 cm < 0.7 cm = lebih konsisten)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Ujian Unit 4: Kira Varians & Sisihan Piawai","voiceCaption":"Hitung min, varians dan sisihan piawai daripada jadual enam lajur Latih Kendiri tujuh perpuluhan dua a.","voiceScript":"[serious] Soalan pengiraan Unit empat menguji ketepatan rumus varians dan sisihan piawai! Jadual masa dalam minit bagi seratus lima puluh dua sampel mempunyai jumlah f x bersamaan seribu tujuh puluh dan jumlah f x kuasa dua bersamaan lapan ribu sembilan ratus tujuh puluh enam. Hitungkan varians dan sisihan piawainya betul kepada dua tempat perpuluhan!","stimulusHtml":"<div class='stimulus-note'><strong>Data Terkumpul Ringkas (Latih Kendiri 7.2a):</strong><br>Bilangan data &Sigma;f = 152 &nbsp;|&nbsp; &Sigma;fx = 1 070 &nbsp;|&nbsp; &Sigma;fx&sup2; = 8 976</div>","prompt":"Berapakah min, varians (σ²) dan sisihan piawai (σ) betul kepada dua tempat perpuluhan?","options":["Min = 7.04 minit, σ² = 9.50 minit², σ = 3.08 minit","Min = 7.04 minit, σ² = 52.02 minit², σ = 7.21 minit","Min = 7.04 minit, σ² = 12.14 minit², σ = 3.48 minit","Min = 6.95 minit, σ² = 9.50 minit², σ = 3.08 minit"],"correctIndex":0,"explanation":"Min x̄ = 1070 / 152 = 7.0395 ≈ 7.04 minit. Varians σ² = (8976 / 152) - (1070 / 152)² = 59.0526 - 49.5542 = 9.4984 ≈ 9.50 minit². Sisihan piawai σ = sqrt(9.4984) ≈ 3.08 minit."}]},{"id":"mat57-u5","title":"Unit 5: Cabaran Boss SPM — Sintesis Graf & Sukatan Serakan","subtitle":"Unit Boss (Kertas 1 & Kertas 2 KBAT) — Ekstrak Ogif, Plot Kotak, Varians, Sisihan Piawai & Membuat Keputusan Statistik","iconType":"trophy","iconUrl":"../assets/icons/mat57-u5.jpg","boss":true,"steps":[{"type":"predict","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Ekstrak Kekerapan daripada Ogif","voiceCaption":"Cabaran Boss pertama menguji Contoh tiga belas: tentukan kekerapan kelas serta min anggaran daripada bacaan kekerapan longgokan ogif.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama menggabungkan ogif dengan min anggaran seperti Contoh tiga belas. Sebuah ogif masa pelanggan di pasar raya mencatatkan kekerapan longgokan sifar pada sifar perpuluhan empat lima jam, enam pada sifar perpuluhan sembilan lima, dua puluh dua pada satu perpuluhan empat lima, lima puluh empat pada satu perpuluhan sembilan lima, tujuh puluh pada dua perpuluhan empat lima, dan lapan puluh pada dua perpuluhan sembilan lima. Berapakah bilangan pelanggan bagi kelas satu perpuluhan lima hingga satu perpuluhan sembilan jam dan julat datanya?","hook":"Semak perkaitan ogif dan jadual kekerapan pada makmal selepas meramal!","mediaKey":"mat57_bunga_raya_hibrid","scenario":"Bacaan ogif lapan puluh orang pelanggan pasar raya: (0.45, 0), (0.95, 6), (1.45, 22), (1.95, 54), (2.45, 70), (2.95, 80).","prompt":"Berapakah kekerapan f bagi selang kelas 1.5 – 1.9 jam dan apakah julat keseluruhan taburan ini?","options":["f = 54 orang; Julat = 2.5 jam","f = 32 orang; Julat = 2.0 jam","f = 32 orang; Julat = 2.5 jam","f = 16 orang; Julat = 2.0 jam"],"correctIndex":1,"proofLabId":"mat57_ogif_kuartil_persentil_lab","proofState":{"tab":"kuartil","dataset":"nanas","showCumHist":false},"explanation":"Kekerapan kelas 1.5–1.9 ialah beza kekerapan longgokan 54 - 22 = 32 orang. Kelas terendah ialah 0.5–0.9 (titik tengah 0.7) dan kelas tertinggi ialah 2.5–2.9 (titik tengah 2.7), maka Julat = 2.7 - 0.7 = 2.0 jam!"},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Audit Graf & Rumus Bab 7","voiceCaption":"Kelaskan enam pernyataan sintesis Bab tujuh mengikut kategori Graf Titik Tengah/Sempadan, Graf Kekerapan Longgokan/Plot Kotak dan Sukatan Berangka.","voiceScript":"[confident] Cabaran Boss kedua menguji seluruh peta minda Bab tujuh! Asingkan enam fakta peperiksaan ini ke dalam tiga kategori utama dengan cermat.","prompt":"Kelaskan enam pernyataan teras Bab 7 berikut ke dalam kategori yang tepat:","buckets":[{"id":"hist_poli","label":"Histogram & Poligon Kekerapan"},{"id":"ogif_box","label":"Ogif & Plot Kotak"},{"id":"num_stat","label":"Julat, Varians & Sisihan Piawai"}],"items":[{"text":"Wajib menambah kelas f = 0 sebelum kelas pertama dan selepas kelas terakhir","bucketId":"hist_poli","note":"Syarat penutup poligon kekerapan di paksi mengufuk"},{"text":"Menentukan Q1, Median Q2, Q3 dan persentil Pk daripada lengkung berbentuk S","bucketId":"ogif_box","note":"Ogif memplot sempadan atas melawan kekerapan longgokan"},{"text":"Dihitung menggunakan formula (Sum fx² / Sum f) - x̄²","bucketId":"num_stat","note":"Rumus varians σ² bagi data terkumpul"},{"text":"Memaparkan lima nilai termasuk nilai minimum, Q1, median, Q3 dan maksimum","bucketId":"ogif_box","note":"Lima nilai serangkai untuk membina plot kotak"},{"text":"Titik tengah kelas tertinggi tolak titik tengah kelas terendah","bucketId":"num_stat","note":"Rumus rasmi julat bagi data terkumpul"},{"text":"Mengenal pasti taburan loceng, seragam, dwimod atau pencong daripada palang bercantum","bucketId":"hist_poli","note":"Histogram menggunakan sempadan kelas tanpa jurang"}],"explanation":"Pengasingan jelas antara ciri Histogram/Poligon, Ogif/Plot Kotak serta rumus Julat/Varians menjamin sifar kecuaian dalam Kertas 1 dan Kertas 2."},{"type":"match","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Padan Kajian Kes KSSM","voiceCaption":"Padankan lima kajian kes kehidupan sebenar KSSM Bab tujuh dengan tafsiran statistiknya.","voiceScript":"[confident] Cabaran Boss ketiga menguji aplikasi kehidupan sebenar daripada Latih Kendiri dan Latih Ekstensif! Padankan kelima-lima kajian kes ini dengan kesimpulan statistik yang tepat.","prompt":"Padankan lima kes kajian statistik KSSM berikut dengan tafsiran tepatnya:","pairs":[{"id":"b7m1","left":"Harga Beras 10 kg Pasar Raya P vs Q (min sama RM32)","right":"Pasar Raya P (Q1=30, Med=32, Q3=34) lebih simetri manakala Q berbeza selang kuartil"},{"id":"b7m2","left":"Ujian Ubat Tekanan Darah Sebelum vs Selepas Dos","right":"Ubat berkesan jika min tekanan sistolik dan sisihan piawai menurun selepas dos"},{"id":"b7m3","left":"Lontar Peluru Rozaidy vs Wildan pada Ogif","right":"Atlet dengan nilai median dan kuartil ketiga lebih besar berprestasi lebih jauh"},{"id":"b7m4","left":"Projek Kempen BMI Remaja NHMS & WHO","right":"Ogif BMI digunakan menentukan peratusan murid kurang berat badan dan obes"},{"id":"b7m5","left":"Penerima Temuduga Persentil ke-92 (P92)","right":"Hanya 8% calon teratas berjaya melepasi skor ambang minimum pada ogif"}],"explanation":"Kesemua lima kes ini merupakan kerangka soalan KBAT SPM yang menggabungkan graf, kuartil, persentil, min dan sisihan piawai dalam konteks sebenar."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Justifikasi KBAT Tekanan Darah","voiceCaption":"Susun jawapan KBAT Kertas dua menganalisis kesan ubat penurun tekanan darah sebelum dan selepas pengambilan dos.","voiceScript":"[warm] Cabaran Boss keempat menguji teknik menjawab soalan KBAT Latih Ekstensif nombor lapan! Berdasarkan jadual tekanan darah sistolik pesakit sebelum dan selepas satu dos ubat, susun hujah lengkap untuk membuktikan ubat tersebut berkesan dan menjadikan bacaan lebih konsisten.","prompt":"Susun jawapan lengkap KBAT Kertas 2 mengenai keberkesanan ubat tekanan darah:","hint":"Nyatakan sama ada ubat mampu menurunkan tekanan darah, rujuk penurunan min, serta penurunan sisihan piawai...","answerTokens":["Ya, ubat tersebut berkesan menurunkan tekanan darah","kerana min bacaan sistolik menurun selepas dos","dan sisihan piawainya juga lebih kecil","menunjukkan tekanan darah pesakit lebih terkawal"],"distractors":["kerana kekerapan longgokan menjadi sifar","walaupun julat antara kuartil meningkat mendadak"],"explanation":"Apabila min tekanan darah turun (semakin hampir normal) dan sisihan piawai berkurang (pesakit bertindak balas secara seragam), kita dapat menyimpulkan ubat tersebut berkesan dan bacaan lebih terkawal."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Kiraan Lengkap Varians & Plot Kotak","voiceCaption":"Selesaikan soalan gabungan Kertas satu dan dua melibatkan jadual data terkumpul dua puluh sampel serta tafsiran plot kotak.","voiceScript":"[serious] Cabaran Boss kelima menguji pengiraan tepat tanpa kesilapan! Diberi jadual kekerapan dua puluh orang murid dengan selang kelas sepuluh hingga empat belas, lima belas hingga sembilan belas, dua puluh hingga dua puluh empat dan dua puluh lima hingga dua puluh sembilan bersama kekerapan empat, lapan, lima dan tiga. Hitungkan min serta variansnya betul kepada dua tempat perpuluhan!","stimulusHtml":"<table class='nota-table'><thead><tr><th>Skor Latihan</th><th>10 – 14</th><th>15 – 19</th><th>20 – 24</th><th>25 – 29</th></tr></thead><tbody><tr><td>Bilangan murid (f)</td><td>4</td><td>8</td><td>5</td><td>3</td></tr></tbody></table>","prompt":"Berdasarkan jadual di atas, berapakah min anggaran (x̄) dan varians (σ²) bagi skor tersebut?","options":["Min = 18.75, Varians = 23.19","Min = 18.75, Varians = 4.82","Min = 19.50, Varians = 23.19","Min = 18.75, Varians = 374.75"],"correctIndex":0,"explanation":"Titik tengah x ialah 12, 17, 22, 27. Sum(f) = 20, Sum(fx) = 4(12) + 8(17) + 5(22) + 3(27) = 375 -> Min x̄ = 375/20 = 18.75. Sum(fx²) = 4(144) + 8(289) + 5(484) + 3(729) = 7 495. Maka Varians σ² = (7495/20) - 18.75² = 374.75 - 351.5625 = 23.1875 ≈ 23.19 (manakala sisihan piawai σ = 4.82)."},{"type":"predict","xp":35,"voiceIdKey":"u5-s6","voiceToneLabel":"Boss Akhir: Audit Kualiti Kilang Bola","voiceCaption":"Buat keputusan pengawal kualiti kilang memilih antara Mesin P dengan Mesin Q bagi sasaran tekanan angin bola 11.3 hingga 11.7 psi.","voiceScript":"[excited] Inilah cabaran penutup Unit Boss berdasarkan Latih Kendiri tujuh perpuluhan dua c! Sebuah kilang bola menetapkan tekanan angin piawai antara sebelas perpuluhan tiga hingga sebelas perpuluhan tujuh p s i. Mesin P mencatat min sepuluh perpuluhan lima satu p s i dengan sisihan piawai satu perpuluhan tiga tiga, manakala Mesin Q mencatat min sebelas perpuluhan enam lima p s i dengan sisihan piawai satu perpuluhan sifar empat. Mesin manakah yang terbaik dan mengapa?","hook":"Buka bukti pengiraan penuh Mesin P vs Mesin Q pada makmal selepas menjawab!","scenario":"Piawaian kilang = 11.3 – 11.7 psi. Mesin P: x̄ = 10.51 psi, σ = 1.33 psi. Mesin Q: x̄ = 11.65 psi, σ = 1.04 psi.","prompt":"Mesin manakah menunjukkan prestasi lebih baik dari segi ketepatan tekanan angin dan konsistensi?","options":["Mesin P kerana sisihan piawainya lebih besar iaitu 1.33 psi untuk julat lebih luas","Mesin Q kerana minnya (11.65 psi) berada tepat dalam julat sasaran 11.3–11.7 psi dan sisihan piawainya lebih kecil (1.04 psi)","Kedua-dua mesin setara kerana bilangan sampel bola sama iaitu 50 biji","Mesin P kerana minnya 10.51 psi lebih rendah daripada had minimum kilang"],"correctIndex":1,"proofLabId":"mat57_varians_sisihan_terkumpul_lab","proofState":{"dataset":"mesin"},"explanation":"Mesin Q jelas lebih unggul: min tekanannya (11.65 psi) jatuh tepat di dalam julat sasaran kilang 11.3–11.7 psi (berbanding Mesin P yang terkurang angin pada 10.51 psi), dan sisihan piawai lebih kecil (1.04 < 1.33) membuktikan tekanan bola lebih konsisten. Tahniah — Bab 7 dikuasai 100%!"}]}]};</script>

    var d = typeof dec === "number" ? dec : 2;
    var num = Number(val);
    if (!isFinite(num)) return "0";

        skipBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {

    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderPredictStep(step, card) {

            proofState: step.proofState || null,
            markInteracted: function () {}
          });
        }
      }

      handleStepOutcome(isCorrect, step.explanation || "", Number(step.xp) || 20, btn);
    });
  });
}
