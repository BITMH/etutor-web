/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab01","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":1,"title":"Fungsi","subtitle":"Subtopik 1.1–1.3 KSSM — Tatatanda Fungsi, Ujian Garis Mencancang, Nilai Mutlak |ax+b|, Fungsi Gubahan fg(x) vs gf(x), Fungsi Berulang f^n & Songsangan f^-1(x).","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab01-labs.js","coverIcon":"../assets/icons/addm41-u1.jpg","editionBadge":"Edisi Simulasi & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep pemetaan fungsi kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Semua soalan gubahan dan songsangan kamu selesaikan dengan tepat!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula perbezaan domain, julat atau susunan fungsi luar dan dalam.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab satu berjaya kamu takluki!"},"units":[{"id":"addm41-u1","title":"Unit 1: Konsep Fungsi, Domain, Julat & Nilai Mutlak","subtitle":"Subtopik 1.1 — Hubungan vs Fungsi, Ujian Garis Mencancang, Objek & Imej serta Graf f(x) = |ax + b|","iconType":"graph","iconUrl":"../assets/icons/addm41-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Syarat Fungsi & Ujian Garis","voiceCaption":"Fungsi ialah hubungan khas yang memetakan setiap objek dalam domain kepada tepat satu imej dalam kodomain, dan disahkan menggunakan ujian garis mencancang.","voiceScript":"[warm] Selamat datang ke Matematik Tambahan Tingkatan empat, Bab satu, Fungsi! Dalam subtopik satu perpuluhan satu, ingat satu prinsip teras yang dirintis oleh Leonhard Euler melalui tatatanda f x. Suatu hubungan hanya layak digelar fungsi jika ia berbentuk satu kepada satu atau banyak kepada satu, iaitu setiap objek dalam domain memetakan tepat satu imej sahaja! Jika satu objek menghasilkan dua imej, atau jika ujian garis mencancang memotong graf pada dua titik atau lebih, maka hubungan itu bukan fungsi! Jangan lupa juga syarat fungsi tidak tertakrif apabila penyebut bernilai sifar. Terokai pengimbas garis di bawah!","title":"1.1 Pengertian Fungsi, Tatatanda & Ujian Garis Mencancang","acronym":"D•K•J•U","hook":"Gerakkan garis mencancang pada plot nilai mutlak, kubik dan bulatan untuk menentukan graf mana yang sah menjadi fungsi!","mediaKey":"addm41_euler_fungsi","summary":"Fungsi f: X -> Y memetakan setiap unsur x dalam domain kepada tepat satu unsur y dalam kodomain; ujian garis mencancang menentukan sama ada suatu graf ialah fungsi.","bullets":["Hubungan yang Sah sebagai Fungsi: Hanya hubungan satu-dengan-satu dan banyak-dengan-satu ialah fungsi. Hubungan satu-dengan-banyak dan banyak-dengan-banyak BUKAN fungsi. Tatatanda ditulis sebagai f: x -> 2x + 1 atau f(x) = 2x + 1.","Domain, Kodomain, Julat & Fungsi Tidak Tertakrif: Domain ialah set semua objek x; kodomain ialah set sasaran Y; julat ialah subset kodomain yang mengandungi semua imej yang dipetakan. Bagi fungsi pecahan f(x) = a/(x - k), fungsi tidak tertakrif apabila penyebut x - k = 0 (iaitu x = k).","Ujian Garis Mencancang (Vertical Line Test): Jika garis mencancang yang dilukis memotong graf hanya pada SATU titik untuk semua nilai x dalam domain, graf itu ialah fungsi."],"formula":"f: x -> y   atau   y = f(x)   |   f(x) = 1/(x - k) tidak tertakrif apabila x = k","labId":"addm41_ujian_garis_lab","labTitle":"Pengimbas Ujian Garis Mencancang & Mengufuk","labProps":{"fnKey":"bulatan","scanX":1,"showHoriz":false},"examTip":"Skema SPM Kertas 1: Apabila diberi rajah anak panah atau pasangan tertib, pastikan tiada objek yang mempunyai dua anak panah keluar dan tiada objek dalam domain yang tidak dipetakan!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Hubungan Fungsi vs Bukan","voiceCaption":"Kelaskan enam jenis hubungan, graf dan ungkapan berikut antara Fungsi yang Sah dengan Bukan Fungsi.","voiceScript":"[curious] Mari uji kecekapan kamu! Asingkan enam situasi graf dan pemetaan ini kepada kategori Fungsi yang Sah atau Bukan Fungsi.","prompt":"Isihkan hubungan dan graf berikut kepada Fungsi yang Sah atau Bukan Fungsi:","buckets":[{"id":"fungsi","label":"Fungsi yang Sah"},{"id":"bukan","label":"Bukan Fungsi"}],"items":[{"text":"Hubungan banyak-dengan-satu dengan setiap objek di domain mempunyai satu anak panah keluar","bucketId":"fungsi","note":"Betul! Banyak objek boleh berkongsi satu imej yang sama, asalkan setiap objek ada tepat 1 imej."},{"text":"Hubungan satu-dengan-banyak seperti {(2, 4), (2, -4), (3, 9)}","bucketId":"bukan","note":"Tepat! Objek 2 dipetakan kepada dua imej berbeza (4 dan -4), melanggar syarat fungsi."},{"text":"Graf bulatan x^2 + y^2 = 9 yang dipotong pada 2 titik oleh garis mencancang x = 1","bucketId":"bukan","note":"Betul! Gagal ujian garis mencancang kerana memotong pada lebih daripada satu titik."},{"text":"Graf fungsi nilai mutlak f(x) = |2x - 3| berbentuk huruf V","bucketId":"fungsi","note":"Tepat! Setiap nilai x menghasilkan tepat satu nilai y >= 0, lulus ujian garis mencancang."},{"text":"Pemetaan satu-dengan-satu f(x) = 3x - 5 bagi domain x nyata","bucketId":"fungsi","note":"Betul! Fungsi linear satu-dengan-satu sentiasa sah sebagai fungsi."},{"text":"Hubungan dengan satu unsur dalam domain tiada langsung imej di kodomain","bucketId":"bukan","note":"Tepat! Setiap unsur dalam domain wajib mempunyai satu imej."}],"explanation":"Suatu hubungan ialah fungsi hanya jika ia pemetaan satu-dengan-satu atau banyak-dengan-satu, dan setiap unsur dalam domain mesti dipetakan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Fungsi Nilai Mutlak |ax + b|","voiceCaption":"Fungsi nilai mutlak sentiasa memulangkan nilai bukan negatif dan menghasilkan graf berbentuk huruf V dengan bucu di atas paksi-x.","voiceScript":"[warm] Sekarang mari fahami fungsi nilai mutlak f x sama dengan modulus a x tambah b. Nilai mutlak bermaksud jarak dari sifar, jadi nilainya sentiasa sifar atau positif! Bahagian graf garis lurus y sama dengan a x tambah b yang berada di bawah paksi x akan dipantulkan ke atas paksi x untuk membentuk bucu tajam berbentuk huruf V tepat pada titik di mana a x tambah b sama dengan sifar! Apabila menyelesaikan persamaan nilai mutlak seperti modulus x tolak tiga sama dengan lima, pecahkan kepada dua kes, iaitu x tolak tiga sama dengan positif lima atau negatif lima!","title":"Fungsi Nilai Mutlak f(x) = |ax + b| & Lakaran Graf V","acronym":"M•V•2K","hook":"Bahagian graf di bawah paksi-x dipantulkan ke atas membentuk bucu tajam tepat pada pintasan-x!","summary":"Fungsi nilai mutlak f(x) = |ax + b| menukarkan nilai negatif kepada positif melalui pantulan pada paksi-x, menghasilkan julat f(x) >= 0 bagi domain tak terhad.","bullets":["Takrifan Nilai Mutlak: |u| = u jika u >= 0, dan |u| = -u jika u < 0. Contoh: |-7| = 7 dan |3 - 8| = 5.","Melakar Graf f(x) = |ax + b| pada Domain Tertutup c <= x <= d: Cari 3 titik utama — hujung kiri x = c, titik bucu apabila ax + b = 0 (y = 0), dan hujung kanan x = d. Julat bagi graf ialah [0, maks(f(c), f(d))] jika bucu berada dalam domain.","Menyelesaikan Persamaan |ax + b| = k (k >= 0): Gunakan dua cabang ax + b = k atau ax + b = -k. Jika k < 0, tiada penyelesaian nyata!"],"formula":"|ax + b| = k  =>  ax + b = k  atau  ax + b = -k   (syarat k >= 0)","labId":"addm41_ujian_garis_lab","labTitle":"Uji Graf Nilai Mutlak f(x) = |x - 1| & Pantulannya","labProps":{"fnKey":"mutlak","scanX":1,"showHoriz":true,"scanY":2},"examTip":"Kesilapan lazim SPM: Apabila mencari julat bagi f(x) = |2x - 4| untuk -1 <= x <= 5, JANGAN hanya masukkan hujung -1 dan 5! Semak sama ada bucu y = 0 berada dalam domain (-1 <= 2 <= 5), maka nilai minimum julat ialah 0, jadi 0 <= f(x) <= 6."},{"type":"predict","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Julat Fungsi Nilai Mutlak","voiceCaption":"Ramalkan julat bagi fungsi f x sama dengan modulus dua x tolak empat bagi domain negatif satu kurang atau sama x kurang atau sama tiga.","voiceScript":"[curious] Cuba soalan perangkap peperiksaan ini! Diberi fungsi nilai mutlak f x sama dengan modulus dua x tolak empat untuk domain negatif satu hingga tiga. Apakah julat yang tepat bagi f x?","hook":"Periksa kedudukan titik bucu y = 0 sebelum menentukan nilai minimum julat!","scenario":"Fungsi nilai mutlak ditakrifkan oleh f(x) = |2x - 4| bagi domain -1 <= x <= 3.","prompt":"Apakah julat yang tepat bagi f(x) dalam domain tersebut?","options":["0 <= f(x) <= 6","2 <= f(x) <= 6","-6 <= f(x) <= 2","0 <= f(x) <= 2"],"correctIndex":0,"proofLabId":"addm41_ujian_garis_lab","proofState":{"fnKey":"mutlak","scanX":1,"showHoriz":true,"scanY":2},"explanation":"Nilai hujung: f(-1) = |-2 - 4| = 6 dan f(3) = |6 - 4| = 2. Oleh sebab bucu 2x - 4 = 0 memberi x = 2 yang berada dalam domain [-1, 3], nilai minimum ialah f(2) = 0 dan maksimum ialah 6. Maka julatnya ialah 0 <= f(x) <= 6."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Kira Objek bagi Nilai Mutlak","voiceCaption":"Cari nilai-nilai objek x apabila imej di bawah fungsi nilai mutlak modulus dua x tambah tiga ialah tujuh.","voiceScript":"[confident] Soalan penutup Unit satu! Cari semua nilai objek x yang mungkin apabila modulus dua x tambah tiga bernilai tujuh.","prompt":"Diberi f(x) = |2x + 3|. Cari nilai-nilai x jika f(x) = 7.","options":["x = 2 atau x = -5","x = 2 atau x = 5","x = -2 atau x = 5","x = 2 sahaja"],"correctIndex":0,"explanation":"|2x + 3| = 7 bermaksud 2x + 3 = 7 (2x = 4 => x = 2) atau 2x + 3 = -7 (2x = -10 => x = -5)."}]},{"id":"addm41-u2","title":"Unit 2: Fungsi Gubahan & Fungsi Berulang","subtitle":"Subtopik 1.2 — Menggabung fg(x) vs gf(x), Mencari Objek/Fungsi Hilang, Fungsi Berulang f^n & Aplikasi","iconType":"formula","iconUrl":"../assets/icons/addm41-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Pemetaan Fungsi Gubahan fg(x)","voiceCaption":"Fungsi gubahan fg(x) bermaksud melaksanakan fungsi g terlebih dahulu ke atas objek x, kemudian memasukkan hasilnya ke dalam fungsi f.","voiceScript":"[warm] Selamat datang ke Unit dua, Fungsi Gubahan! Tonton dahulu video penerangan bersuara di bawah untuk melihat aliran pemetaan berantai dari set X ke set Y ke set Z! Dalam tatatanda f g x, fungsi sebelah kanan iaitu g bertindak dahulu ke atas x menjadi g x, sebelum fungsi luar f menerima g x sebagai input baharu! Ingat: secara amnya, f g x tidak sama dengan g f x kerana tertib penggantian berbeza. Gunakan mesin fungsi gubahan di bawah untuk membandingkan f g x dengan g f x!","title":"1.2 Pengertian & Pengiraan Fungsi Gubahan fg(x) vs gf(x)","acronym":"K•D•L","hook":"Tonton video penerangan bersuara dan uji perbezaan fg(x) vs gf(x) pada Mesin Fungsi Gubahan!","mediaKey":"addm41_fungsi_gubahan","videoClip":{"src":"../assets/matematik-tambahan-t4-bab01/video/addm41_video_fungsi_gubahan_narasi.mp4","hasNarration":true,"posterKey":"addm41_fungsi_gubahan","caption":"Video Penerangan Bersuara (BM): Pemetaan fungsi gubahan fg(x) dan pantulan songsangan f^-1(x)"},"summary":"Fungsi gubahan fg(x) = f(g(x)) menggabungkan dua pemetaan berurutan dari kanan ke kiri: g bertindak dahulu, diikuti oleh f.","bullets":["Tertib Dari Kanan ke Kiri: fg(x) = f[g(x)] (laksanakan g dahulu, kemudian f). Sebaliknya gf(x) = g[f(x)]. f^2(x) = ff(x) = f[f(x)].","Syarat Kewujudan fg: Julat bagi fungsi dalam g mestilah subset kepada domain bagi fungsi luar f.","Contoh Pantas: Jika f(x) = 2x + 1 dan g(x) = x^2 - 3, maka fg(x) = 2(x^2 - 3) + 1 = 2x^2 - 5, manakala gf(x) = (2x + 1)^2 - 3 = 4x^2 + 4x - 2."],"formula":"fg(x) = f(g(x))   |   gf(x) = g(f(x))   |   f^2(x) = f(f(x))","labId":"addm41_gubahan_songsang_lab","labTitle":"Mesin Dua Langkah Fungsi Gubahan fg(x) vs gf(x)","labProps":{"tab":"gubahan","order":"fg","x":3},"examTip":"Jangan keliru f^2(x) dengan [f(x)]^2! Dalam tajuk Fungsi, f^2(x) bermaksud gubahan f(f(x)), BUKAN kuasa dua nilai f(x)."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Gubahan & Fungsi Berulang","voiceCaption":"Padankan lima ungkapan fungsi gubahan bagi pasangan f(x) = 3x - 1 dan g(x) = x^2 dengan bentuk teringkasnya.","voiceScript":"[confident] Uji kemahiran penggantian algebra kamu! Diberi f x sama dengan tiga x tolak satu dan g x sama dengan x kuasa dua, padankan setiap ungkapan fungsi gubahan di kiri dengan jawapan tepat di kanan.","prompt":"Diberi f(x) = 3x - 1 dan g(x) = x^2. Padankan ungkapan gubahan berikut dengan hasilnya:","pairs":[{"id":"a41u2m1","left":"fg(x)","right":"3x^2 - 1"},{"id":"a41u2m2","left":"gf(x)","right":"(3x - 1)^2 = 9x^2 - 6x + 1"},{"id":"a41u2m3","left":"f^2(x)","right":"3(3x - 1) - 1 = 9x - 4"},{"id":"a41u2m4","left":"g^2(x)","right":"(x^2)^2 = x^4"},{"id":"a41u2m5","left":"fg(2)","right":"3(2)^2 - 1 = 11"}],"explanation":"fg(x) menggantikan x dalam f dengan x^2 menjadi 3x^2 - 1; gf(x) menggantikan x dalam g dengan (3x - 1) menjadi (3x - 1)^2; f^2(x) = f(3x - 1) = 9x - 4."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Cari Fungsi Hilang & f^n","voiceCaption":"Apabila fungsi gubahan fg(x) dan salah satu fungsi diberi, fungsi dalam g dicari secara terus manakala fungsi luar f dicari menggunakan penggantian u.","voiceScript":"[warm] Bagaimana pula jika soalan memberi f g x dan menyuruh kita mencari fungsi yang hilang? Terdapat dua teknik berbeza mengikut kedudukan fungsi hilang itu! Jika fungsi dalam g hilang apabila f dan f g diberi, terus gantikan g x ke dalam persamaan f dan selesaikan untuk g x. Tetapi jika fungsi luar f hilang apabila g dan f g diberi, biarkan u sama dengan g x, ungkapkan x dalam sebutan u, lalu gantikan ke dalam ungkapan f g x! Bagi soalan fungsi berulang berindeks besar seperti f kuasa dua puluh, cari f kuasa dua, f kuasa tiga dan f kuasa empat dahulu untuk mengesan pola berulang!","title":"Menentukan Fungsi Asal daripada fg(x) & Pola Fungsi Berulang f^n","acronym":"D•G•U•P","hook":"Fungsi dalam dicari terus melalui gantian; fungsi luar dicari dengan kaedah penggantian u = g(x)!","summary":"Dua teknik SPM teras: mencari fungsi dalam g(x) secara langsung daripada f[g(x)], atau mencari fungsi luar f(x) dengan pembolehubah gentian u = g(x), serta mengesan kitaran f^n.","bullets":["Kes 1 (Cari fungsi dalam g apabila f dan fg diberi): Contoh f(x) = x - 2 dan fg(x) = x^2 + 3. Tulis f[g(x)] = g(x) - 2 = x^2 + 3, maka g(x) = x^2 + 5.","Kes 2 (Cari fungsi luar f apabila g dan fg diberi): Contoh g(x) = 3x dan fg(x) = 9x - 7. Biar u = 3x => x = u/3. Maka f(u) = 9(u/3) - 7 = 3u - 7, iaitu f(x) = 3x - 7.","Fungsi Berulang Berkuasa Tinggi f^n (Latih Diri 1.7): Jika f(x) = x/(x+1), maka f^2(x) = x/(2x+1), f^3(x) = x/(3x+1). Secara pola, f^n(x) = x/(nx+1), maka f^20(x) = x/(20x+1). Ada juga fungsi berkala dengan f^2(x) = x (genap -> x, ganjil -> f(x))."],"formula":"Jika g(x) & fg(x) diberi: biar u = g(x), ungkapkan x(u), ganti ke dalam f(u)","examTip":"Sentiasa semak jawapan anda! Selepas memperoleh f(x) atau g(x), gantikan semula untuk membentuk fg(x) dan pastikan ia sepadan tepat dengan soalan."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Susun Langkah Cari Fungsi Luar","voiceCaption":"Susun langkah algebra yang betul untuk mencari fungsi f x apabila diberi g x sama dengan dua x tolak satu dan f g x sama dengan enam x tambah lima.","voiceScript":"[confident] Susun empat langkah algebra ini mengikut turutan tepat untuk mencari fungsi luar f x apabila g x dan f g x diberi!","prompt":"Susun langkah mencari f(x) apabila diberi g(x) = 2x - 1 dan fg(x) = 6x + 5:","hint":"Mulakan dengan membiarkan u = g(x)...","answerTokens":["Biarkan u = 2x - 1 supaya x = (u + 1)/2","Gantikan x ke dalam f(u) = 6((u + 1)/2) + 5","Permudahkan menjadi f(u) = 3u + 3 + 5 = 3u + 8","Tukar pemboleh ubah kepada f(x) = 3x + 8"],"distractors":["Kira 2(6x + 5) - 1 terus sebagai f(x)","Samakan 2x - 1 = 6x + 5 untuk mencari x"],"explanation":"Menggunakan penggantian u = 2x - 1 memberi x = (u + 1)/2; menggantikannya ke dalam 6x + 5 menghasilkan f(u) = 3u + 8, iaitu f(x) = 3x + 8. Semakan: fg(x) = 3(2x - 1) + 8 = 6x + 5."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s5","voiceToneLabel":"Cabaran Fungsi Berulang f^20","voiceCaption":"Tentukan ungkapan bagi fungsi berulang f kuasa dua puluh x jika f x sama dengan x per x tambah satu.","voiceScript":"[excited] Uji pengesanan pola fungsi berulang buku teks! Jika f x sama dengan x bahagi x tambah satu, apakah ungkapan bagi f kuasa dua puluh x?","prompt":"Diberi f(x) = x / (x + 1) dengan x != -1. Cari fungsi f^20(x).","options":["x / (20x + 1)","20x / (x + 20)","x / (x + 20)","20x / (20x + 1)"],"correctIndex":0,"explanation":"f^1(x) = x/(x+1); f^2(x) = [x/(x+1)] / [x/(x+1) + 1] = x/(2x+1); f^3(x) = x/(3x+1). Mengikut induksi pola, f^n(x) = x/(nx+1), maka f^20(x) = x/(20x + 1)."}]},{"id":"addm41-u3","title":"Unit 3: Sifat Fungsi Songsang & Ujian Garis Mengufuk","subtitle":"Subtopik 1.3 — Syarat Satu-dengan-Satu, Ujian Garis Mengufuk, Pantulan y = x & Semakan fg(x) = gf(x) = x","iconType":"scale","iconUrl":"../assets/icons/addm41-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Syarat Wujud Fungsi Songsang","voiceCaption":"Hanya fungsi satu-dengan-satu mempunyai fungsi songsang, dan ia boleh diuji secara grafik menggunakan ujian garis mengufuk.","voiceScript":"[warm] Selamat datang ke Unit tiga, Sifat Fungsi Songsang! Mengapa bukan semua fungsi mempunyai songsangan? Jika suatu fungsi adalah banyak kepada satu seperti kuadratik f x sama dengan x kuasa dua, apabila kita cuba menyongsangkannya, satu nilai y akan dipetakan balik kepada dua nilai x! Pemetaan satu kepada banyak bukan lagi fungsi! Oleh itu, syarat mutlak bagi kewujudan fungsi songsang f kuasa negatif satu ialah f mestilah fungsi satu dengan satu! Pada graf, kita sahkannya dengan ujian garis mengufuk: garis mengufuk mesti memotong graf paling banyak pada satu titik sahaja!","title":"1.3 Syarat Kewujudan Songsangan & Ujian Garis Mengufuk","acronym":"1:1 • UGM","hook":"Garis mengufuk memotong tepat 1 titik = fungsi satu-dengan-satu = ADA fungsi songsang!","summary":"Fungsi songsang f^-1 memetakan imej kembali kepada objek asalnya dan hanya wujud jika f ialah fungsi satu-dengan-satu (lulus ujian garis mengufuk).","bullets":["Syarat Mutlak: Hanya fungsi SATU-DENGAN-SATU mempunyai fungsi songsang f^-1. Fungsi banyak-dengan-satu (seperti y = x^2 pada semua x nyata) tidak mempunyai songsangan kecuali domainnya disekat (cth. x >= 0).","Ujian Garis Mengufuk (Horizontal Line Test): Lukis garis mengufuk y = k pada graf f. Jika ia memotong graf hanya pada SATU titik, f ialah satu-dengan-satu dan mempunyai f^-1. Jika memotong >= 2 titik, f^-1 tidak wujud.","Hubungan Domain & Julat: Domain bagi f = Julat bagi f^-1, manakala Julat bagi f = Domain bagi f^-1."],"formula":"f: x -> y   <==>   f^-1: y -> x   |   Domain(f) = Julat(f^-1)","labId":"addm41_ujian_garis_lab","labTitle":"Uji Fungsi dengan Garis Mengufuk (y = k)","labProps":{"fnKey":"kubik","scanX":1.5,"showHoriz":true,"scanY":1},"examTip":"Skema SPM: Jika ditanya 'Adakah fungsi f mempunyai fungsi songsang? Beri sebab', nyatakan: 'Ya/Tidak, kerana melalui ujian garis mengufuk, garis mengufuk memotong graf pada satu titik sahaja / lebih daripada satu titik (satu-dengan-satu / bukan satu-dengan-satu)'."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Ujian Garis Mengufuk","voiceCaption":"Ramalkan sama ada fungsi kuadratik f x sama dengan x kuasa dua bagi domain semua nombor nyata mempunyai fungsi songsang atau tidak.","voiceScript":"[curious] Cuba ramalkan keputusan ujian garis mengufuk! Pertimbangkan fungsi f x sama dengan x kuasa dua bagi semua nombor nyata. Jika garis mengufuk y sama dengan empat dilukis, apakah kesimpulannya tentang kewujudan fungsi songsang?","hook":"Bandingkan graf simetri parabola dengan graf kubik pada makmal ujian garis!","scenario":"Graf f(x) = x^2 dilukis bagi domain -3 <= x <= 3 dan diuji dengan garis mengufuk y = 4.","prompt":"Apakah keputusan ujian garis mengufuk dan status fungsi songsang bagi f(x) tersebut?","options":["Garis mengufuk memotong graf pada 2 titik (-2, 4) dan (2, 4), maka f bukan satu-dengan-satu dan TIDAK mempunyai fungsi songsang","Garis mencancang memotong graf pada 2 titik, maka f bukan fungsi langsung","Garis mengufuk memotong graf pada 1 titik sahaja, maka f mempunyai songsangan f^-1(x) = x","f mempunyai fungsi songsang kerana nilai y sentiasa positif"],"correctIndex":0,"proofLabId":"addm41_ujian_garis_lab","proofState":{"fnKey":"mutlak","scanX":1,"showHoriz":true,"scanY":2},"explanation":"Garis mengufuk y = 4 memotong parabola y = x^2 pada dua titik, iaitu x = -2 dan x = 2. Oleh sebab fungsi ini banyak-dengan-satu pada [-3, 3], ia tidak mempunyai fungsi songsang kecuali domain disekat (contohnya 0 <= x <= 3)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Pantulan y = x & Identiti fg = x","voiceCaption":"Graf fungsi songsang ialah pantulan graf asal pada garis y sama dengan x, dan dua fungsi ialah songsangan satu sama lain jika f g x sama dengan g f x sama dengan x.","voiceScript":"[warm] Mari lihat dua sifat paling penting fungsi songsang! Pertama, secara geometri, graf f kuasa negatif satu ialah pantulan tepat graf f pada garis lurus y sama dengan x! Jika titik a koma b berada di atas graf f, maka titik b koma a pasti berada di atas graf f kuasa negatif satu! Kedua, secara algebra, bagaimana hendak mengesahkan dua fungsi f dan g ialah songsangan satu sama lain? Kira kedua-dua f g x dan g f x! Jika kedua-duanya meringkas kepada tepat x, maka sah g ialah songsangan bagi f! Terokai simulasi pantulan di bawah.","title":"Pantulan Simetri pada y = x & Pengesahan fg(x) = gf(x) = x","acronym":"P•Y=X•I","hook":"Seret koordinat titik (a, b) untuk melihat pantulan simetrinya (b, a) merentasi garis putus y = x!","summary":"Setiap titik (a, b) pada graf f dipantulkan merentasi garis y = x ke titik (b, a) pada graf f^-1; secara algebra, g = f^-1 jika dan hanya jika fg(x) = gf(x) = x.","bullets":["Sifat Pantulan Simetri: Graf y = f^-1(x) ialah imej pantulan bagi graf y = f(x) pada paksi simetri y = x. Jika (3, 4) pada f, maka (4, 3) pasti pada f^-1.","Ujian Pengesahan Songsangan (Contoh 16): Untuk membuktikan g(x) ialah songsangan bagi f(x), tunjukkan kedua-dua gubahan fg(x) = x DAN gf(x) = x. Jangan uji satu hala sahaja!","Pintasan Khas: Jika f dan f^-1 bersilang, persilangan lazimnya berlaku di atas garis y = x (di mana f(x) = x)."],"formula":"(a, b) pada f  <==>  (b, a) pada f^-1   |   fg(x) = gf(x) = x","labId":"addm41_gubahan_songsang_lab","labTitle":"Plot Pantulan Simetri f(x) & f^-1(x) pada Garis y = x","labProps":{"tab":"songsang","a":2.5},"examTip":"Apabila soalan meminta anda 'mengesahkan' atau 'menentukan' sama ada g ialah songsangan f tanpa mencari f^-1 secara langsung, WAJIB tunjukkan kedua-dua fg(x) = x dan gf(x) = x!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Isih Sifat Songsangan Benar vs Palsu","voiceCaption":"Kelaskan enam pernyataan mengenai fungsi songsang berikut kepada Betul atau Salah.","voiceScript":"[confident] Uji kefahaman konsep kamu tentang sifat fungsi songsang! Asingkan keenam-enam pernyataan ini kepada kategori Betul atau Salah.","prompt":"Kelaskan pernyataan tentang fungsi songsang berikut sebagai Betul atau Salah:","buckets":[{"id":"betul","label":"Pernyataan Betul"},{"id":"salah","label":"Pernyataan Salah"}],"items":[{"text":"Jika titik (-2, 5) berada pada graf f, maka (5, -2) berada pada graf f^-1","bucketId":"betul","note":"Tepat! Koordinat x dan y bertukar tempat akibat pantulan pada y = x."},{"text":"Julat bagi fungsi f adalah sama dengan domain bagi fungsi songsangnya f^-1","bucketId":"betul","note":"Betul! Domain dan julat saling bertukar antara f dan f^-1."},{"text":"f^-1(x) membawa maksud 1 / f(x) iaitu salingan nilai fungsi","bucketId":"salah","note":"SALAH! Perangkap klasik: f^-1(x) ialah tatatanda fungsi songsang, BUKAN [f(x)]^-1."},{"text":"Semua fungsi kuadratik pada domain semua nombor nyata mempunyai fungsi songsang","bucketId":"salah","note":"SALAH! Tanpa sekatan domain, fungsi kuadratik gagal ujian garis mengufuk."},{"text":"Jika fg(x) = x dan gf(x) = x, maka g(x) = f^-1(x)","bucketId":"betul","note":"Tepat! Itulah definisi algebra bagi pasangan fungsi songsang."},{"text":"Graf y = f^-1(x) ialah pantulan graf y = f(x) pada paksi-x","bucketId":"salah","note":"SALAH! Pantulan ialah pada garis y = x, bukan pada paksi-x."}],"explanation":"Fungsi songsang wujud hanya untuk fungsi satu-dengan-satu, memantul pada garis y = x, menukar domain dengan julat, dan memenuhi fg(x) = gf(x) = x."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Aplikasi Koordinat Songsang","voiceCaption":"Gunakan sifat songsangan untuk mencari nilai f kuasa negatif satu bagi lima jika f bagi tiga ialah lima.","voiceScript":"[confident] Soalan pantas akhir Unit tiga! Diberi fungsi f memetakan tiga kepada lima dan g ialah songsangan bagi f. Apakah nilai g bagi lima?","prompt":"Diberi fungsi satu-dengan-satu f memetakan f(3) = 5 dan f(7) = -2. Apakah nilai bagi f^-1(5) + f^-1(-2)?","options":["10","3","-10","1 / 3"],"correctIndex":0,"explanation":"Oleh sebab f(3) = 5, maka f^-1(5) = 3. Oleh sebab f(7) = -2, maka f^-1(-2) = 7. Jadi f^-1(5) + f^-1(-2) = 3 + 7 = 10."}]},{"id":"addm41-u4","title":"Unit 4: Menentukan Formula f^-1(x) & Aplikasi","subtitle":"Subtopik 1.3 — Kaedah Algebra Songsangan Linear, Pecahan Algebra (ax+b)/(cx+d) & Masalah Kontekstual","iconType":"pendulum","iconUrl":"../assets/icons/addm41-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kaedah Algebra Cari f^-1(x)","voiceCaption":"Untuk mencari formula fungsi songsang secara algebra, biarkan f kuasa negatif satu bagi x sama dengan y, jadikan y perkara rumus, dan nyatakan syarat penyebut tidak sifar.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari kuasai teknik algebra mencari formula f kuasa negatif satu x, terutamanya bagi fungsi pecahan yang hampir pasti keluar dalam peperiksaan S P M! Langkahnya sangat sistematik: mula-mula, tulis biarkan f kuasa negatif satu x sama dengan y, maka f y sama dengan x. Seterusnya, gantikan y ke dalam rumus f dan gunakan algebra untuk mengasingkan y di satu sisi persamaan! Bagi fungsi pecahan seperti a x tambah b bahagi c x tambah d, darab silang penyebut dahulu, kumpulkan semua sebutan yang ada y di sebelah kiri, faktorkan y, dan bahagikan! Jangan lupa nyatakan syarat nilai x yang menjadikan penyebut baharu tidak sama dengan sifar!","title":"Kaedah Algebra Menentukan f^-1(x) (Linear & Pecahan)","acronym":"B•G•F•S","hook":"Darab silang -> Kumpul sebutan y -> Faktorkan y -> Bahagi -> Nyatakan syarat penyebut != 0!","summary":"Langkah piawai menentukan f^-1(x) bermula dengan f(y) = x, mengasingkan y melalui pemfaktoran, dan menyertakan sekatan domain penyebut != 0.","bullets":["Kaedah 4 Langkah (Contoh Pecahan f(x) = (x + 2)/(x - 2), x != 2): (1) Biar y = f^-1(x), maka f(y) = x => (y + 2)/(y - 2) = x. (2) Darab silang: y + 2 = xy - 2x. (3) Kumpul y & faktor: y(1 - x) = -2x - 2 atau y(x - 1) = 2x + 2. (4) Bahagi: f^-1(x) = (2x + 2)/(x - 1), x != 1.","Menilai Songsangan Tanpa Mencari Formula Penuh: Jika soalan hanya meminta nilai f^-1(7), terus tulis f(x) = 7 dan selesaikan untuk x! Ini menjimatkan banyak masa di Kertas 1.","Sekatan Domain Kuadratik: Jika f(x) = x^2 + 3 bagi x >= 0, maka songsangannya mengambil punca positif sahaja: f^-1(x) = punca(x - 3) dengan domain x >= 3."],"formula":"Biar f^-1(x) = y  =>  f(y) = x   |   Selesaikan y dalam sebutan x","examTip":"Markah wajib hilang jika anda terlupa menulis syarat ketaksamaan penyebut (cth. x != 1) pada jawapan akhir fungsi songsang berbentuk pecahan!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Algebra Pecahan Songsang","voiceCaption":"Susun urutan langkah algebra untuk mencari fungsi songsang bagi f x sama dengan dua x per x tolak tiga.","voiceScript":"[confident] Susun empat langkah algebra ini dengan kemas untuk mendapatkan f kuasa negatif satu x bagi fungsi pecahan dua x bahagi x tolak tiga!","prompt":"Susun langkah mencari f^-1(x) bagi fungsi f(x) = 2x / (x - 3), x != 3:","hint":"Mulakan dengan menulis f(y) = x...","answerTokens":["Biar y = f^-1(x), maka 2y / (y - 3) = x","Darab silang untuk memperoleh 2y = xy - 3x","Kumpul dan faktorkan y menjadi y(x - 2) = 3x","Jadi f^-1(x) = 3x / (x - 2), dengan syarat x != 2"],"distractors":["Terbalikkan pecahan menjadi (x - 3) / 2x terus","Tetapkan syarat penyebut x != 3 pada jawapan akhir"],"explanation":"Daripada 2y = xy - 3x, susun semula kepada xy - 2y = 3x => y(x - 2) = 3x => f^-1(x) = 3x / (x - 2), x != 2."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Fungsi & Songsangannya","voiceCaption":"Padankan lima fungsi f x di lajur kiri dengan fungsi songsangnya f kuasa negatif satu x di lajur kanan.","voiceScript":"[curious] Uji kepantasan algebra songsangan kamu! Padankan kelima-lima fungsi ini dengan formula songsangan tepatnya.","prompt":"Padankan setiap fungsi f(x) dengan fungsi songsangnya f^-1(x):","pairs":[{"id":"a41u4m1","left":"f(x) = 4x - 5","right":"(x + 5) / 4"},{"id":"a41u4m2","left":"f(x) = 3 / (x - 1), x != 1","right":"(3 / x) + 1 = (x + 3) / x, x != 0"},{"id":"a41u4m3","left":"f(x) = (x + 2) / 5","right":"5x - 2"},{"id":"a41u4m4","left":"f(x) = 6 - 2x","right":"(6 - x) / 2"},{"id":"a41u4m5","left":"f(x) = x^2 + 4 (x >= 0)","right":"punca(x - 4), x >= 4"}],"explanation":"Setiap pasangan menukar peranan operasi songsang; bagi pecahan 3/(y - 1) = x memberi y - 1 = 3/x, maka y = (x + 3)/x dengan x != 0."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s4","voiceToneLabel":"Gubahan dengan Songsangan & Aplikasi","voiceCaption":"Menggabungkan kaedah fungsi gubahan dan songsangan membolehkan kita menyelesaikan masalah kehidupan harian seperti penukaran suhu dan kadar upah.","voiceScript":"[warm] Dalam soalan Kertas dua bahagian aplikasi seperti penukar suhu darjah Celsius ke Fahrenheit atau kadar penggunaan bahan api, fungsi songsang membolehkan kita menukar arah pengiraan secara langsung! Selain itu, ingat identiti pintar untuk menjimatkan masa apabila mencari f jika diberi g dan f g: f sama dengan f g digubah dengan g songsang, iaitu f g g songsang! Cuba semak kenapa: g bertindak dengan g songsang saling menghapus menghasilkan x!","title":"Gabungan Songsangan-Gubahan & Aplikasi Kontekstual KSSM","acronym":"I•S•K","hook":"Identiti pantas: f = (fg)g^-1 dan g = f^-1(fg) mempermudah penyelesaian soalan gubahan kompleks!","summary":"Aplikasi fungsi songsang merangkumi penukaran unit saintifik serta teknik identiti songsangan untuk mencari fungsi asal dalam gubahan.","bullets":["Identiti Gubahan-Songsangan: (1) Jika fg dan g diberi, f = (fg)g^-1. (2) Jika fg dan f diberi, g = f^-1(fg). (3) Songsangan bagi gubahan ialah (fg)^-1 = g^-1 f^-1 (songsang tertibnya!).","Aplikasi Termometer Fahrenheit-Celsius (Subtopik 1.3): F(C) = (9/5)C + 32 memetakan Celsius ke Fahrenheit, maka fungsi songsangnya C(F) = F^-1(F) = (5/9)(F - 32) menukar suhu Fahrenheit kembali ke darjah Celsius."],"formula":"(fg)^-1(x) = g^-1 f^-1(x)   |   f(x) = (fg)g^-1(x)","examTip":"Hati-hati dengan susunan songsangan gubahan: (fg)^-1 BUKAN f^-1 g^-1, tetapi g^-1 f^-1 (seperti memakai stoking dan kasut, apabila menanggalkannya kasut dibuka dahulu sebelum stoking!)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s5","voiceToneLabel":"Selesai Gubahan Songsang","voiceCaption":"Selesaikan masalah gubahan songsang menggunakan sifat g f kuasa negatif satu bagi suatu nilai tetap.","voiceScript":"[confident] Uji aplikasi gabungan songsangan dan gubahan! Jika f x sama dengan dua x tambah satu dan g x sama dengan x bahagi x tolak satu, cari nilai g f kuasa negatif satu bagi lima.","prompt":"Diberi f(x) = 2x + 1 dan g(x) = x / (x - 1), x != 1. Hitung nilai bagi gf^-1(5).","options":["2","11 / 10","3","5 / 4"],"correctIndex":0,"explanation":"Mula-mula cari f^-1(5): biar 2x + 1 = 5 => 2x = 4 => x = 2. Kemudian masukkan ke dalam g: gf^-1(5) = g(2) = 2 / (2 - 1) = 2."}]},{"id":"addm41-u5","title":"Unit 5: Cabaran Boss SPM — Fungsi","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Nilai Mutlak, Gubahan Tersongsang, Ujian Mengufuk & Pemetaan Pecahan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Pemalar Fungsi Pecahan","voiceCaption":"Soalan Boss pertama menguji pengiraan pemalar h dan k bagi pemetaan fungsi pecahan berpandukan dua maklumat imej.","voiceScript":"[excited] Selamat datang ke Unit Boss S P M bagi Bab satu! Lima soalan sintesis menanti untuk menguji ketajaman pemikiran kamu. Soalan pertama: cari nilai pemalar h dan k daripada pemetaan fungsi pecahan yang diberi!","prompt":"Diberi pemetaan f(x) = hx + k/x (x != 0) dengan f(2) = 9 dan f(-1) = -9. Cari nilai h dan k.","options":["h = 3, k = 6","h = 6, k = 3","h = 4, k = 2","h = 2, k = 10"],"correctIndex":0,"explanation":"f(2) = 2h + k/2 = 9 => 4h + k = 18. f(-1) = -h - k = -9 => h + k = 9. Tolakkan kedua-dua persamaan: 3h = 9 => h = 3, maka k = 6."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Persilangan Nilai Mutlak","voiceCaption":"Ramalkan nilai x yang memenuhi persamaan modulus x tolak tiga sama dengan dua x tolak tiga.","voiceScript":"[curious] Soalan Boss kedua daripada Latihan Pengukuhan buku teks! Selesaikan modulus x tolak tiga sama dengan dua x tolak tiga dan berhati-hati dengan penyelesaian palsu!","hook":"Sentiasa semak syarat bahawa sebelah kanan 2x - 3 mestilah >= 0!","scenario":"Graf f(x) = |x - 3| dilakar bersama garis lurus y = 2x - 3 pada paksi yang sama.","prompt":"Apakah nilai x yang sah memenuhi persamaan |x - 3| = 2x - 3?","options":["x = 2 sahaja","x = 0 sahaja","x = 0 dan x = 2","x = 3 dan x = 2"],"correctIndex":0,"proofLabId":"addm41_ujian_garis_lab","proofState":{"fnKey":"mutlak","scanX":2,"showHoriz":true,"scanY":1},"explanation":"Kes 1: x - 3 = 2x - 3 => x = 0; semakan: |0 - 3| = 3, tetapi 2(0) - 3 = -3 (PALSU!). Kes 2: -(x - 3) = 2x - 3 => 3x = 6 => x = 2; semakan: |2 - 3| = 1 dan 2(2) - 3 = 1 (SAH!). Maka x = 2 sahaja."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Cari Fungsi Songsang Pecahan","voiceCaption":"Susun langkah tepat menyelesaikan soalan Kertas dua apabila g songsang bagi dua sama dengan f bagi tiga dan g f songsang dua sama dengan lima.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas dua S P M! Susun turutan penyelesaian untuk mencari pemalar m dan c bagi fungsi linear g yang digandingkan dengan fungsi songsang f.","prompt":"Diberi f(x) = (x + 2)/(x - 2) dan g(x) = mx + c. Jika g^-1(2) = f(3) dan gf^-1(2) = 5, susun langkah untuk mencari m dan c:","hint":"Hitung nilai f(3) dan f^-1(2) terlebih dahulu...","answerTokens":["Cari f(3) = 5 dan f^-1(2) = 6 daripada f(y) = 2","Guna g^-1(2) = 5 untuk membentuk g(5) = 5m + c = 2","Guna gf^-1(2) = g(6) = 5 untuk membentuk 6m + c = 5","Tolak persamaan untuk mendapat m = 3 dan c = -13"],"distractors":["Gantikan x = 2 ke dalam f(x) = (x + 2)/(x - 2) terus","Anggap gf^-1(2) sama dengan g(2) / f(2)"],"explanation":"f(3) = 5/1 = 5; untuk f^-1(2), (y+2)/(y-2) = 2 => y + 2 = 2y - 4 => y = 6. Maka g(5) = 2 dan g(6) = 5 memberi m = 3, c = -13."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Identiti Songsangan","voiceCaption":"Padankan empat identiti algebra fungsi gubahan dan songsangan dengan huraian atau hasilnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat identiti fungsi gubahan dan songsangan ini dengan tepat.","prompt":"Padankan setiap ungkapan fungsi dengan identiti atau sifatnya yang tepat:","pairs":[{"id":"a41b4m1","left":"ff^-1(x) dan f^-1f(x)","right":"Kedua-duanya sentiasa sama dengan x"},{"id":"a41b4m2","left":"(fg)^-1(x)","right":"g^-1 f^-1(x)"},{"id":"a41b4m3","left":"Jika f(x) = g(x) = f^-1(x)","right":"f^2(x) = x (fungsi songsang kendiri)"},{"id":"a41b4m4","left":"Persilangan f(x) dan f^-1(x)","right":"Berlaku di sepanjang garis y = x"}],"explanation":"Menguasai kesemua empat identiti ini membolehkan anda menyemak jawapan gubahan dan songsangan dalam peperiksaan SPM dengan pantas."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Fungsi Gubahan Berganda","voiceCaption":"Selesaikan soalan cabaran terakhir bagi mencari nilai pemalar apabila dua fungsi linear digubah secara bersilang.","voiceScript":"[excited] Soalan Boss terakhir Bab satu! Diberi f x sama dengan tiga x tambah k dan g x sama dengan dua x tolak tiga. Jika f g x sama dengan g f x untuk semua x, berapakah nilai k?","prompt":"Diberi f(x) = 3x + k dan g(x) = 2x - 3. Jika fg(x) = gf(x) bagi semua nilai x, cari nilai pemalar k.","options":["k = -6","k = 6","k = -12","k = 4"],"correctIndex":0,"explanation":"fg(x) = 3(2x - 3) + k = 6x - 9 + k. gf(x) = 2(3x + k) - 3 = 6x + 2k - 3. Samakan sebutan pemalar: -9 + k = 2k - 3 => k = -6."}]}]};</script>

      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") {

      window.NotaAudio.playPaperRustle();
    } else if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {
