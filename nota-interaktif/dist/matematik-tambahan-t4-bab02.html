/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab02","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":2,"title":"Fungsi Kuadratik","subtitle":"Subtopik 2.1–2.3 KSSM — Penyempurnaan Kuasa Dua, Pembentukan Persamaan (HTP/HDP), Ketaksamaan Kuadratik, Pembezalayan b^2 - 4ac, Kesan a, b, c & Bentuk Verteks/Pintasan.","estimatedMinutes":34,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab02-labs.js","coverIcon":"../assets/icons/addm42-u1.jpg","editionBadge":"Edisi Simulasi & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep kuadratik dan pembezalayan kamu memang padu!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Semua punca, julat ketaksamaan dan bentuk verteks berjaya kamu selesaikan!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula tanda pekali a, b, c atau arah simbol ketaksamaan kuadratik.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab dua berjaya kamu kuasai!"},"units":[{"id":"addm42-u1","title":"Unit 1: Persamaan Kuadratik & Membentuk Persamaan","subtitle":"Subtopik 2.1 — Penyempurnaan Kuasa Dua, Rumus Kuadratik, Hasil Tambah & Hasil Darab Punca (HTP/HDP)","iconType":"formula","iconUrl":"../assets/icons/addm42-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Penyempurnaan Kuasa Dua & Rumus","voiceCaption":"Persamaan kuadratik bentuk am boleh diselesaikan menggunakan penyempurnaan kuasa dua, rumus kuadratik atau pemfaktoran.","voiceScript":"[warm] Selamat datang ke Bab dua, Fungsi Kuadratik! Dalam subtopik dua perpuluhan satu, selain pemfaktoran, dua kaedah utama S P M ialah penyempurnaan kuasa dua dan rumus kuadratik x sama dengan negatif b tambah tolak punca kuasa dua b kuasa dua tolak empat a c bahagi dua a. Semasa menyempurnakan kuasa dua pada a x kuasa dua tambah b x tambah c sama dengan sifar, wajib bahagikan semua sebutan dengan a dahulu supaya pekali x kuasa dua menjadi satu! Kemudian, tambah dan tolak kurungan pekali x bahagi dua kuasa dua! Jangan lupa juga hubungan emas punca: hasil tambah punca alfa tambah beta sama dengan negatif b per a, dan hasil darab punca alfa darab beta sama dengan c per a!","title":"2.1 Penyempurnaan Kuasa Dua, Rumus & Pembentukan Persamaan","acronym":"H•T•P•D","hook":"Ingat: bahagi pekali a dahulu sebelum melengkapkan kuasa dua, dan guna x^2 - (HTP)x + HDP = 0 untuk membina persamaan baharu!","mediaKey":"addm42_gerbang_parabola","summary":"Menyelesaikan ax^2 + bx + c = 0 menggunakan kaedah penyempurnaan kuasa dua dan rumus kuadratik, serta membentuk persamaan kuadratik daripada punca alfa dan beta.","bullets":["Kaedah Penyempurnaan Kuasa Dua (a != 0): (1) Pindahkan pemalar c ke kanan. (2) Bahagikan semua sebutan dengan a agar pekali x^2 ialah 1: x^2 + (b/a)x = -c/a. (3) Tambah [(b/2a)]^2 pada kedua-dua belah untuk membentuk (x + b/2a)^2. (4) Ambil punca kuasa dua (+/-) untuk mendapat punca.","Hasil Tambah Punca (HTP) & Hasil Darab Punca (HDP): Bagi ax^2 + bx + c = 0 dengan punca alfa dan beta: HTP = alfa + beta = -b/a, manakala HDP = alfa * beta = c/a.","Membentuk Persamaan Baharu: Jika punca baharu diketahui (cth. 2*alfa dan 2*beta), kira HTP baharu dan HDP baharu, lalu masukkan ke dalam rumus x^2 - (HTP)x + (HDP) = 0."],"formula":"x = [-b +/- punca(b^2 - 4ac)] / (2a)   |   x^2 - (alfa + beta)x + alfa*beta = 0","labId":"addm42_diskriminan_parabola_lab","labTitle":"Simulator Parabola & Punca Kuadratik","labProps":{"a":1,"b":-4,"c":3},"examTip":"Identiti algebra paling kerap ditanya bersama HTP dan HDP: alfa^2 + beta^2 = (alfa + beta)^2 - 2*alfa*beta. Hafal identiti ini!"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Susun Langkah Kuasa Dua","voiceCaption":"Susun urutan langkah yang betul untuk menyelesaikan persamaan kuadratik dua x kuasa dua tambah lapan x tolak enam sama dengan sifar menggunakan kaedah penyempurnaan kuasa dua.","voiceScript":"[confident] Susun empat langkah penyempurnaan kuasa dua bagi dua x kuasa dua tambah lapan x tolak enam sama dengan sifar mengikut turutan tepat!","prompt":"Susun langkah menyelesaikan 2x^2 + 8x - 6 = 0 dengan kaedah penyempurnaan kuasa dua:","hint":"Asingkan pemalar dan bahagikan dengan pekali x^2 = 2 dahulu...","answerTokens":["Bahagi dengan 2 untuk mendapat x^2 + 4x = 3","Tambah (4/2)^2 = 4 pada kedua-dua belah: x^2 + 4x + 4 = 3 + 4","Faktorkan kepada bentuk (x + 2)^2 = 7","Ambil punca kuasa dua: x = -2 +/- punca(7)"],"distractors":["Tambah (8/2)^2 = 16 terus sebelum membahagi dengan 2","Abaikan tanda negatif bagi punca kuasa dua 7"],"explanation":"Pekali x^2 MESTI dijadikan 1 terlebih dahulu dengan membahagi semua sebutan dengan 2; kemudian tambah (4/2)^2 = 4 pada kedua-dua belah menjadi (x + 2)^2 = 7."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan HTP, HDP & Identiti","voiceCaption":"Padankan lima kuantiti berkaitan punca persamaan dua x kuasa dua tolak enam x tambah lima sama dengan sifar dengan nilai tepatnya.","voiceScript":"[curious] Uji kepantasan H T P dan H D P kamu! Bagi persamaan dua x kuasa dua tolak enam x tambah lima sama dengan sifar dengan punca alfa dan beta, padankan setiap ungkapan berikut.","prompt":"Diberi punca bagi 2x^2 - 6x + 5 = 0 ialah alfa dan beta. Padankan setiap ungkapan:","pairs":[{"id":"a42u1m1","left":"Hasil Tambah Punca (alfa + beta)","right":"-(-6)/2 = 3"},{"id":"a42u1m2","left":"Hasil Darab Punca (alfa * beta)","right":"5/2 = 2.5"},{"id":"a42u1m3","left":"Nilai bagi alfa^2 + beta^2","right":"3^2 - 2(5/2) = 4"},{"id":"a42u1m4","left":"Nilai bagi 1/alfa + 1/beta","right":"(alfa + beta)/(alfa * beta) = 6/5"},{"id":"a42u1m5","left":"Persamaan punca 2*alfa dan 2*beta","right":"x^2 - 6x + 10 = 0"}],"explanation":"HTP = 3 dan HDP = 5/2. Bagi punca baharu 2*alfa dan 2*beta: HTP baharu = 2(3) = 6 dan HDP baharu = 4(5/2) = 10, memberi x^2 - 6x + 10 = 0."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Cari Pemalar daripada Punca","voiceCaption":"Cari nilai p dan q jika persamaan kuadratik x kuasa dua tambah kurungan p tolak lima x tambah dua q sama dengan sifar mempunyai punca negatif tiga dan enam.","voiceScript":"[confident] Soalan pantas buku teks! Persamaan x kuasa dua tambah p tolak lima x tambah dua q sama dengan sifar mempunyai punca negatif tiga dan enam. Berapakah nilai p dan q?","prompt":"Persamaan kuadratik x^2 + (p - 5)x + 2q = 0 mempunyai punca-punca -3 dan 6. Cari nilai p dan q.","options":["p = 2, q = -9","p = 8, q = -9","p = 2, q = 9","p = -2, q = -18"],"correctIndex":0,"explanation":"Daripada punca -3 dan 6: HTP = -3 + 6 = 3, dan daripada persamaan -(p - 5) = 3 => p - 5 = -3 => p = 2. HDP = (-3)(6) = -18 = 2q => q = -9."}]},{"id":"addm42-u2","title":"Unit 2: Ketaksamaan Kuadratik","subtitle":"Subtopik 2.1 — Kaedah Lakaran Graf, Garis Nombor & Jadual untuk Menentukan Julat Nilai x","iconType":"scale","iconUrl":"../assets/icons/addm42-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"3 Kaedah Ketaksamaan Kuadratik","voiceCaption":"Ketaksamaan kuadratik diselesaikan dengan mengubah kepada bentuk am berpekali x kuasa dua positif, memfaktorkan punca, dan menggunakan lakaran graf, garis nombor atau jadual.","voiceScript":"[warm] Selamat datang ke Unit dua, Ketaksamaan Kuadratik! Dalam buku teks K S S M, anda wajib menguasai tiga kaedah penyelesaian: lakaran graf, garis nombor dan jadual! Namun peraturan pertama paling penting ialah: susun ketaksamaan menjadi bentuk am dengan sebelah kanan bernilai sifar, dan pastikan pekali a bagi x kuasa dua bernilai positif! Ingat: jika anda mendarab atau membahagi ketaksamaan dengan nombor negatif, arah simbol ketaksamaan mesti diterbalikkan! Untuk lengkung senyum a lebih besar daripada sifar, nilai lebih besar daripada sifar berada pada sayap luar punca, manakala nilai kurang daripada sifar berada di antara dua punca!","title":"Menyelesaikan Ketaksamaan Kuadratik (Graf, Garis Nombor & Jadual)","acronym":"G•G•J","hook":"Gelar dua sayap luar untuk '> 0' dan satu selang tengah untuk '< 0' apabila a > 0!","summary":"Langkah wajib ketaksamaan kuadratik ialah menyusun ke bentuk (x - p)(x - q) > 0 atau < 0 (dengan a > 0), lalu memilih julat melalui lakaran graf, garis nombor, atau jadual tanda.","bullets":["Langkah Persediaan: (1) Pindahkan semua sebutan ke kiri supaya sebelah kanan = 0. (2) Pastikan pekali x^2 positif (jika negatif, darab -1 dan TERBALIKKAN tanda < / >). (3) Faktorkan atau cari dua punca p < q.","3 Kaedah KSSM: (1) Lakaran Graf: Lakar parabola bentuk U memotong paksi-x di p dan q; rantau di atas paksi-x ialah > 0 (x < p atau x > q), di bawah paksi-x ialah < 0 (p < x < q). (2) Garis Nombor: Uji satu titik dalam setiap selang (-inf, p), (p, q), (q, inf). (3) Jadual Tanda: Semak tanda bagi faktor (x - p) dan (x - q) dalam ketiga-tiga selang.","Amaran Kertas 1: Jangan sesekali tulis 'x > 3 dan x < -1' untuk dua sayap luar! Kata hubung wajib ialah 'x < -1 ATAU x > 3'."],"formula":"(x - p)(x - q) > 0  =>  x < p atau x > q   |   (x - p)(x - q) < 0  =>  p < x < q  (p < q)","labId":"addm42_ketaksamaan_verteks_lab","labTitle":"Penjelajah Ketaksamaan Kuadratik & Rantau Paksi-x","labProps":{"op":"gt","p":-1,"q":3},"examTip":"Jika soalan meminta ketaksamaan seperti 3x^2 - 5x >= 16 + x(2x + 1), kembangkan dahulu dan kumpul ke kiri menjadi x^2 - 6x - 16 >= 0 sebelum memfaktorkan kepada (x - 8)(x + 2) >= 0!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Julat Ketaksamaan","voiceCaption":"Ramalkan julat nilai x yang memenuhi ketaksamaan x kuasa dua tolak dua x tolak tiga kurang daripada sifar.","voiceScript":"[curious] Cuba ramalkan kawasan lorekan pada graf! Diberi ketaksamaan x kuasa dua tolak dua x tolak tiga kurang daripada sifar. Selepas difaktorkan menjadi x tambah satu darab x tolak tiga kurang daripada sifar, julat manakah yang betul?","hook":"Periksa kedudukan lengkung di bawah paksi-x pada Penjelajah Ketaksamaan!","scenario":"Lengkung y = (x + 1)(x - 3) berbentuk U memotong paksi-x pada x = -1 dan x = 3.","prompt":"Apakah julat nilai x yang memenuhi (x + 1)(x - 3) < 0?","options":["-1 < x < 3","x < -1 atau x > 3","x < -3 atau x > 1","-3 < x < 1"],"correctIndex":0,"proofLabId":"addm42_ketaksamaan_verteks_lab","proofState":{"op":"lt","p":-1,"q":3},"explanation":"Kerana simbol ialah < 0 (lengkung berada di bawah paksi-x di antara kedua-dua pintasan-x), julat penyelesaian ialah satu selang tercantum -1 < x < 3."},{"type":"sort","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Isih Jenis Julat Ketaksamaan","voiceCaption":"Asingkan enam ketaksamaan kuadratik berikut antara yang menghasilkan dua julat luar berpisah dengan yang menghasilkan satu julat dalam tercantum.","voiceScript":"[confident] Uji mata tajam kamu terhadap tanda ketaksamaan dan pekali x kuasa dua! Asingkan enam ketaksamaan ini mengikut bentuk penyelesaiannya.","prompt":"Isihkan ketaksamaan kuadratik berikut kepada jenis julat penyelesaiannya:","buckets":[{"id":"luar","label":"Dua Julat Berpisah (x < p atau x > q)"},{"id":"dalam","label":"Satu Julat Tercantum (p <= x <= q / p < x < q)"}],"items":[{"text":"(x - 2)(x + 5) > 0","bucketId":"luar","note":"Betul! Pekali x^2 positif dan tanda > 0 memberi x < -5 atau x > 2."},{"text":"x^2 - 9 <= 0","bucketId":"dalam","note":"Tepat! (x + 3)(x - 3) <= 0 memberi -3 <= x <= 3."},{"text":"-x^2 + 4x + 5 > 0","bucketId":"dalam","note":"Perangkap berjaya dielak! Darab -1 menjadi x^2 - 4x - 5 < 0 => -1 < x < 5."},{"text":"-2x^2 + 8 < 0","bucketId":"luar","note":"Betul! Bahagi -2 membalikkan tanda menjadi x^2 - 4 > 0 => x < -2 atau x > 2."},{"text":"(2x - 1)(x - 4) >= 0","bucketId":"luar","note":"Tepat! x <= 1/2 atau x >= 4."},{"text":"x(x - 6) < -8","bucketId":"dalam","note":"Betul! x^2 - 6x + 8 < 0 => (x - 2)(x - 4) < 0 => 2 < x < 4."}],"explanation":"Sentiasa perhatikan tanda pekali x^2! Jika negatif (seperti -x^2 + 4x + 5 > 0), tukar kepada +x^2 dan terbalikkan tanda ketaksamaan sebelum menentukan selang."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kira Julat Ketaksamaan KSSM","voiceCaption":"Cari julat nilai x bagi ketaksamaan tiga x kuasa dua tolak lima x lebih besar atau sama enam belas tambah x kurungan dua x tambah satu.","voiceScript":"[confident] Selesaikan soalan Latih Diri buku teks ini: cari julat nilai x bagi tiga x kuasa dua tolak lima x lebih besar atau sama enam belas tambah x darab dua x tambah satu.","prompt":"Cari julat nilai x bagi 3x^2 - 5x >= 16 + x(2x + 1).","options":["x <= -2 atau x >= 8","-2 <= x <= 8","x <= -8 atau x >= 2","-8 <= x <= 2"],"correctIndex":0,"explanation":"Kembangkan: 3x^2 - 5x >= 16 + 2x^2 + x => x^2 - 6x - 16 >= 0 => (x - 8)(x + 2) >= 0. Maka x <= -2 atau x >= 8."}]},{"id":"addm42-u3","title":"Unit 3: Jenis-jenis Punca & Pembezalayan","subtitle":"Subtopik 2.2 — Nilai Pembezalayan b^2 - 4ac (> 0, = 0, < 0), Kedudukan Garis Tangen & Julat Pemalar","iconType":"atom","iconUrl":"../assets/icons/addm42-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Pembezalayan & 3 Jenis Punca","voiceCaption":"Nilai pembezalayan b kuasa dua tolak empat a c menentukan sama ada persamaan kuadratik mempunyai dua punca nyata berbeza, dua punca sama, atau tiada punca nyata.","voiceScript":"[warm] Selamat datang ke Unit tiga, Jenis-jenis Punca Persamaan Kuadratik! Tonton dahulu video penerangan bersuara lima belas saat di bawah tentang kuasa pembezalayan b kuasa dua tolak empat a c! Dalam rumus kuadratik, ungkapan di dalam tanda punca kuasa dua iaitu b kuasa dua tolak empat a c menentukan bilangan pintasan paksi x! Jika b kuasa dua tolak empat a c lebih besar daripada sifar, terdapat dua punca nyata yang berbeza. Jika sama dengan sifar, graf menyentuh paksi x pada satu titik sahaja iaitu dua punca nyata yang sama! Jika kurang daripada sifar, tiada punca nyata dan graf terapung tidak menyilang paksi x! Terokai simulator parabola di bawah!","title":"2.2 Nilai Pembezalayan (b^2 - 4ac) & Tafsiran Geometri","acronym":"D>0 • D=0 • D<0","hook":"Tonton video penerangan bersuara dan ubah b^2 - 4ac untuk melihat lengkung menyentuh atau terapung di atas paksi-x!","mediaKey":"addm42_kuadratik_parabola","videoClip":{"src":"../assets/matematik-tambahan-t4-bab02/video/addm42_video_fungsi_kuadratik_pembezalayan_narasi.mp4","hasNarration":true,"posterKey":"addm42_kuadratik_parabola","caption":"Video Penerangan Bersuara (BM): Kesan pembezalayan b^2 - 4ac terhadap pintasan-x dan tiga bentuk kuadratik"},"summary":"Pembezalayan D = b^2 - 4ac mengelaskan punca persamaan ax^2 + bx + c = 0 kepada 3 kes: D > 0 (2 punca nyata berbeza), D = 0 (2 punca nyata sama), dan D < 0 (tiada punca nyata).","bullets":["D = b^2 - 4ac > 0: Dua punca nyata dan berbeza (graf memotong paksi-x pada 2 titik berbeza; garis lurus memotong lengkung pada 2 titik).","D = b^2 - 4ac = 0: Dua punca nyata yang sama (graf menyentuh paksi-x pada 1 titik; garis lurus ialah TANGEN kepada lengkung).","D = b^2 - 4ac < 0: Tiada punca nyata (graf tidak menyilang paksi-x — sentiasa positif jika a > 0, atau sentiasa negatif jika a < 0).","Kes Gabungan 'Mempunyai Punca Nyata': Jika soalan menyebut mempunyai punca nyata tanpa membezakan sama atau berbeza, gunakan b^2 - 4ac >= 0!"],"formula":"D = b^2 - 4ac   |   Berbeza: D > 0   |   Sama/Tangen: D = 0   |   Tiada: D < 0","labId":"addm42_diskriminan_parabola_lab","labTitle":"Simulator Pembezalayan D = b^2 - 4ac","labProps":{"a":1,"b":-4,"c":4},"examTip":"Kata kunci SPM wajib kenal: 'Menyentuh paksi-x pada satu titik' atau 'garis ialah tangen kepada lengkung' bermaksud D = 0. 'Mempunyai punca nyata' bermaksud D >= 0!"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Kata Kunci Pembezalayan","voiceCaption":"Padankan lima situasi geometri atau kata kunci soalan peperiksaan dengan syarat pembezalayan b kuasa dua tolak empat a c yang tepat.","voiceScript":"[confident] Terjemahkan setiap kata kunci soalan S P M berikut kepada syarat pembezalayan yang tepat!","prompt":"Padankan kata kunci soalan peperiksaan dengan syarat pembezalayan b^2 - 4ac:","pairs":[{"id":"a42u3m1","left":"Graf menyilang paksi-x pada dua titik berbeza","right":"b^2 - 4ac > 0"},{"id":"a42u3m2","left":"Graf menyentuh paksi-x pada satu titik sahaja (tangen)","right":"b^2 - 4ac = 0"},{"id":"a42u3m3","left":"Lengkung sentiasa berada di atas paksi-x (a > 0)","right":"b^2 - 4ac < 0"},{"id":"a42u3m4","left":"Persamaan mempunyai punca-punca nyata","right":"b^2 - 4ac >= 0"},{"id":"a42u3m5","left":"Garis lurus tidak memotong lengkung kuadratik","right":"b^2 - 4ac < 0 (selepas penggantian)"}],"explanation":"Setiap pernyataan geometri tentang bilangan titik persilangan diterjemahkan terus kepada tanda pembezalayan b^2 - 4ac."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Kes Graf Terapung","voiceCaption":"Ramalkan keadaan graf bagi fungsi f x sama dengan x kuasa dua tolak dua x tambah tiga berdasarkan nilai pembezalayannya.","voiceScript":"[curious] Kira pembezalayan secara mental bagi x kuasa dua tolak dua x tambah tiga! Apakah kesimpulan tentang kedudukan grafnya terhadap paksi x?","hook":"Sahkan kedudukan graf terapung pada Simulator Parabola selepas menjawab!","scenario":"Diberi fungsi kuadratik f(x) = x^2 - 2x + 3 (a = 1, b = -2, c = 3).","prompt":"Apakah nilai pembezalayan dan kedudukan graf f(x) tersebut?","options":["D = -8 (< 0); graf berbentuk U dan terletak sepenuhnya di atas paksi-x tanpa pintasan-x","D = 0; graf menyentuh paksi-x tepat pada x = 1","D = 16 (> 0); graf memotong paksi-x pada dua titik","D = -8 (< 0); graf berbentuk n dan terletak di bawah paksi-x"],"correctIndex":0,"proofLabId":"addm42_diskriminan_parabola_lab","proofState":{"a":1,"b":-2,"c":3},"explanation":"D = (-2)^2 - 4(1)(3) = 4 - 12 = -8 < 0. Oleh sebab a = 1 > 0 dan D < 0, graf berbentuk U dan sentiasa positif di atas paksi-x."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cari Julat Pemalar Menggunakan D","voiceCaption":"Cari julat nilai k jika persamaan kuadratik x kuasa dua tambah k x sama dengan k tolak lapan mempunyai dua punca nyata yang berbeza.","voiceScript":"[confident] Soalan wajib Kertas satu! Persamaan x kuasa dua tambah k x sama dengan k tolak lapan mempunyai dua punca nyata dan berbeza. Cari julat nilai k!","prompt":"Cari julat nilai k dengan keadaan persamaan x^2 + kx = k - 8 mempunyai dua punca nyata dan berbeza.","options":["k < -8 atau k > 4","-8 < k < 4","k < -4 atau k > 8","k = -8 atau k = 4"],"correctIndex":0,"explanation":"Susun bentuk am: x^2 + kx + (8 - k) = 0. Syarat dua punca nyata berbeza ialah D > 0: k^2 - 4(1)(8 - k) > 0 => k^2 + 4k - 32 > 0 => (k + 8)(k - 4) > 0, maka k < -8 atau k > 4."}]},{"id":"addm42-u4","title":"Unit 4: Bentuk Fungsi Kuadratik & Melakar Graf","subtitle":"Subtopik 2.3 — Kesan Pekali a, b, c, Tiga Bentuk (Am, Verteks, Pintasan), Paksi Simetri & Aplikasi","iconType":"graph","iconUrl":"../assets/icons/addm42-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"3 Bentuk & Kesan Pekali a, b, c","voiceCaption":"Fungsi kuadratik boleh diungkapkan dalam bentuk am, bentuk verteks dan bentuk pintasan, manakala pekali a, b dan c mengawal bentuk dan kedudukan graf.","voiceScript":"[warm] Selamat datang ke Unit empat, Fungsi Kuadratik! Dalam subtopik dua perpuluhan tiga, kenali tiga bentuk fungsi kuadratik: bentuk am a x kuasa dua tambah b x tambah c, bentuk verteks a kurungan x tolak h kuasa dua tambah k dengan verteks h koma k, dan bentuk pintasan a kurungan x tolak p darab x tolak q dengan pintasan x pada p dan q! Perhatikan kesan pekali: semakin besar nilai mutlak a, semakin sempit parabola! Untuk b pula, jika a dan b sama tanda, verteks berada di sebelah kiri paksi y; jika a dan b berlainan tanda, verteks di sebelah kanan paksi y! Pemalar c ialah pintasan y yang menggerakkan graf ke atas atau ke bawah!","title":"2.3 Kesan a, b, c & Tiga Bentuk Fungsi Kuadratik","acronym":"A•V•P","hook":"Ingat hukum 'Sama Tanda = Kiri, Lain Tanda = Kanan' untuk menentukan kedudukan paksi simetri!","summary":"Tiga perwakilan algebra bagi fungsi kuadratik ialah Bentuk Am, Bentuk Verteks (mendedahkan paksi simetri x = h dan titik maksimum/minimum k), dan Bentuk Pintasan (mendedahkan punca p, q).","bullets":["Kesan Pekali a, b, c dalam f(x) = ax^2 + bx + c: (1) Nilai |a| besar = lengkung lebih sempit; a > 0 bentuk U (minimum), a < 0 bentuk n (maksimum). (2) Tanda b berbanding a: jika a dan b sama tanda (x = -b/2a < 0), verteks di KIRI paksi-y; jika berlainan tanda (-b/2a > 0), verteks di KANAN paksi-y; jika b = 0, verteks tepat pada paksi-y. (3) c ialah pintasan-y.","Bentuk Verteks f(x) = a(x - h)^2 + k: Titik pusingan/verteks = (h, k), paksi simetri x = h. Menambah h menggerakkan graf ke kanan; menambah k menggerakkan graf ke atas.","Bentuk Pintasan f(x) = a(x - p)(x - q): Pintasan-x ialah p dan q; paksi simetri terletak di titik tengah x = (p + q)/2."],"formula":"f(x) = a(x - h)^2 + k   |   Verteks = (h, k)   |   Paksi Simetri x = h = -b/(2a) = (p + q)/2","labId":"addm42_diskriminan_parabola_lab","labTitle":"Ubah Pekali a, b, c & Perhatikan Pergerakan Verteks","labProps":{"a":-1,"b":4,"c":1},"examTip":"Perangkap tanda Bentuk Verteks! Jika f(x) = 2(x + 3)^2 - 5, koordinat verteks ialah (-3, -5), BUKAN (3, -5)! Sentiasa samakan ungkapan dalam kurungan dengan sifar: x + 3 = 0 => x = -3."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Kedudukan Verteks Kiri vs Kanan","voiceCaption":"Kelaskan enam fungsi kuadratik berikut mengikut kedudukan verteksnya sama ada di sebelah kiri paksi-y atau di sebelah kanan paksi-y.","voiceScript":"[curious] Uji hukum kedudukan paksi simetri x sama dengan negatif b bahagi dua a! Asingkan enam fungsi kuadratik ini mengikut kedudukan verteks di kiri atau kanan paksi y.","prompt":"Isihkan fungsi kuadratik berikut mengikut kedudukan titik verteksnya terhadap paksi-y:","buckets":[{"id":"kiri","label":"Verteks di Kiri Paksi-y (h < 0)"},{"id":"kanan","label":"Verteks di Kanan Paksi-y (h > 0)"}],"items":[{"text":"f(x) = 2x^2 + 8x + 3","bucketId":"kiri","note":"Betul! a = +2, b = +8 (sama tanda) => h = -8/4 = -2 < 0 (kiri)."},{"text":"f(x) = x^2 - 6x + 5","bucketId":"kanan","note":"Tepat! a = +1, b = -6 (lain tanda) => h = 6/2 = 3 > 0 (kanan)."},{"text":"f(x) = -x^2 + 4x + 1","bucketId":"kanan","note":"Tepat! a = -1, b = +4 (lain tanda) => h = -4/(-2) = 2 > 0 (kanan)."},{"text":"f(x) = -3x^2 - 12x - 7","bucketId":"kiri","note":"Betul! a = -3, b = -12 (sama tanda) => h = 12/(-6) = -2 < 0 (kiri)."},{"text":"f(x) = 2(x + 4)^2 - 1","bucketId":"kiri","note":"Tepat! x + 4 = 0 memberi h = -4 < 0 (kiri)."},{"text":"f(x) = -2(x - 1)(x - 5)","bucketId":"kanan","note":"Betul! Paksi simetri di titik tengah h = (1 + 5)/2 = 3 > 0 (kanan)."}],"explanation":"Kedudukan paksi simetri ditentukan oleh h = -b/(2a): sama tanda (a, b) meletakkan verteks di kiri paksi-y; berlainan tanda meletakkan verteks di kanan paksi-y."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Tukar Bentuk Am ke Bentuk Verteks","voiceCaption":"Susun langkah menukar fungsi f x sama dengan dua x kuasa dua tolak dua belas x tambah tiga belas kepada bentuk verteks untuk mencari titik minimum.","voiceScript":"[confident] Susun langkah demi langkah untuk menukar fungsi dua x kuasa dua tolak dua belas x tambah tiga belas daripada bentuk am kepada bentuk verteks!","prompt":"Susun langkah menukar f(x) = 2x^2 - 12x + 13 kepada bentuk verteks:","hint":"Faktorkan pekali 2 daripada sebutan x^2 dan x dahulu...","answerTokens":["Faktorkan 2: f(x) = 2(x^2 - 6x) + 13","Tambah dan tolak (-6/2)^2 = 9 dalam kurungan: 2[(x - 3)^2 - 9] + 13","Kembangkan: f(x) = 2(x - 3)^2 - 18 + 13","Permudahkan: f(x) = 2(x - 3)^2 - 5 dengan titik minimum (3, -5)"],"distractors":["Bahagi semua sebutan dengan 2 sehingga hilang pekali di hadapan","Kira 2(x - 3)^2 - 9 + 13 tanpa mendarab 2 dengan -9"],"explanation":"Kesilapan paling kerap berlaku apabila pelajar lupa mendarab pekali luar 2 dengan -9! 2 * (-9) + 13 = -18 + 13 = -5, menghasilkan titik minimum (3, -5)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Aplikasi Tinggi Maksimum Parabola","voiceCaption":"Cari tinggi maksimum dan masa untuk bola mencapai puncak berdasarkan fungsi kuadratik tinggi terhadap masa.","voiceScript":"[confident] Selesaikan soalan aplikasi melakar graf dan titik maksimum ini! Ketinggian sebiji bola yang dilambung diberi oleh h t sama dengan negatif lima t kuasa dua tambah dua puluh t tambah satu perpuluhan lima.","prompt":"Ketinggian sebiji bola dalam meter selepas t saat diberi oleh h(t) = -5(t - 2)^2 + 21.5. Nyatakan tinggi maksimum bola itu dan masa t ketika ia mencapainya.","options":["Tinggi maksimum = 21.5 m pada t = 2 saat","Tinggi maksimum = 20 m pada t = 2 saat","Tinggi maksimum = 21.5 m pada t = -2 saat","Tinggi minimum = -5 m pada t = 21.5 saat"],"correctIndex":0,"explanation":"Oleh sebab a = -5 < 0, parabola berbentuk n mempunyai titik maksimum pada verteks (2, 21.5). Maka tinggi maksimum ialah 21.5 m pada t = 2 saat."}]},{"id":"addm42-u5","title":"Unit 5: Cabaran Boss SPM — Fungsi Kuadratik","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Pantulan Bentuk Verteks, Pembezalayan Garis Tangen & Ketaksamaan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Julat k Pembezalayan","voiceCaption":"Soalan Boss pertama: cari julat nilai k apabila garis lurus tidak menyilang lengkung kuadratik.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab dua! Soalan pertama menguji kemahiran menggabungkan garis lurus dan lengkung dengan syarat pembezalayan kurang daripada sifar!","prompt":"Garis lurus y = 2x + k tidak menyilang lengkung y = x^2 + 4x + 5. Cari julat nilai pemalar k.","options":["k < 4","k > 4","k <= 4","k < -4"],"correctIndex":0,"explanation":"Samakan: x^2 + 4x + 5 = 2x + k => x^2 + 2x + (5 - k) = 0. Tiada persilangan bermaksud D < 0: 2^2 - 4(1)(5 - k) < 0 => 4 - 20 + 4k < 0 => 4k < 16 => k < 4."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Graf Menyentuh Paksi-x","voiceCaption":"Ramalkan nilai n yang mungkin jika graf fungsi kuadratik x kuasa dua tambah enam x tambah n menyentuh paksi-x pada satu titik sahaja.","voiceScript":"[curious] Soalan Boss kedua! Graf fungsi kuadratik f x sama dengan x kuasa dua tambah enam x tambah n menyentuh paksi x pada satu titik sahaja. Berapakah nilai n dan koordinat verteksnya?","hook":"Gunakan syarat D = 0 atau tukarkan kepada bentuk (x + 3)^2 + (n - 9)!","scenario":"Graf f(x) = x^2 + 6x + n berbentuk U dan menyentuh paksi-x pada tepat satu titik.","prompt":"Apakah nilai pemalar n dan titik minimum graf tersebut?","options":["n = 9 dengan titik minimum (-3, 0)","n = -9 dengan titik minimum (3, 0)","n = 6 dengan titik minimum (-3, -3)","n = 3 dengan titik minimum (-6, 0)"],"correctIndex":0,"proofLabId":"addm42_diskriminan_parabola_lab","proofState":{"a":1,"b":6,"c":9},"explanation":"D = 6^2 - 4(1)(n) = 0 => 36 = 4n => n = 9. Dalam bentuk verteks, f(x) = (x + 3)^2 + 0, maka titik minimum ialah (-3, 0)."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Bina Persamaan Punca Baharu","voiceCaption":"Susun langkah membina persamaan kuadratik baharu yang mempunyai punca dua alfa dan dua beta daripada persamaan asal.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas satu! Susun langkah membentuk persamaan kuadratik dengan punca baharu daripada punca alfa dan beta bagi persamaan asal!","prompt":"Persamaan 3x^2 - 6x + 2 = 0 mempunyai punca alfa dan beta. Susun langkah membentuk persamaan dengan punca 3*alfa dan 3*beta:","hint":"Kira HTP dan HDP asal dahulu sebelum mencari HTP dan HDP baharu...","answerTokens":["Daripada persamaan asal: alfa + beta = 2 dan alfa * beta = 2/3","HTP baharu = 3(alfa + beta) = 3(2) = 6","HDP baharu = (3*alfa)(3*beta) = 9(2/3) = 6","Persamaan baharu ialah x^2 - 6x + 6 = 0"],"distractors":["HDP baharu = 3(2/3) = 2","Persamaan baharu ialah x^2 + 6x + 6 = 0"],"explanation":"Perhatikan HDP baharu ialah (3*alfa)(3*beta) = 9*alfa*beta = 9(2/3) = 6. Maka persamaan baharu ialah x^2 - (6)x + 6 = 0."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan 3 Bentuk Kuadratik","voiceCaption":"Padankan empat maklumat fungsi kuadratik dengan persamaan atau cirinya yang tepat.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat ungkapan fungsi kuadratik ini dengan ciri atau persamaan setaranya.","prompt":"Padankan setiap fungsi atau syarat kuadratik dengan jawapan tepat:","pairs":[{"id":"a42b4m1","left":"f(x) = -2(x - 1)^2 + 8","right":"Titik maksimum (1, 8) dan pintasan-y ialah 6"},{"id":"a42b4m2","left":"f(x) = (x - 2)(x + 4)","right":"Paksi simetri x = -1 dan nilai minimum -9"},{"id":"a42b4m3","left":"f(x) = -(x + 2)^2 + 5 digerak 3 unit ke kanan","right":"Menjadi f(x) = -(x - 1)^2 + 5"},{"id":"a42b4m4","left":"f(x) = 3x^2 - 2x + 7","right":"Sentiasa positif (a > 0, D = -80 < 0)"}],"explanation":"Menggerakkan graf 3 unit ke kanan bermaksud menggantikan x dengan (x - 3), jadi h berubah daripada -2 kepada -2 + 3 = +1."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Ketaksamaan Serentak","voiceCaption":"Selesaikan soalan cabaran terakhir bagi mencari julat x yang memenuhi kedua-dua syarat ketaksamaan kuadratik.","voiceScript":"[excited] Soalan Boss terakhir Bab dua! Cari nilai pemalar m jika garis lurus y sama dengan m x tolak lima ialah tangen kepada lengkung y sama dengan x kuasa dua tambah dua x tambah empat, dengan syarat m lebih besar daripada sifar.","prompt":"Garis lurus y = mx - 5 ialah tangen kepada lengkung y = x^2 + 2x + 4. Jika m > 0, cari nilai m.","options":["m = 8","m = -4","m = 6","m = 12"],"correctIndex":0,"explanation":"Samakan: x^2 + 2x + 4 = mx - 5 => x^2 + (2 - m)x + 9 = 0. Syarat tangen D = 0: (2 - m)^2 - 4(1)(9) = 0 => (2 - m)^2 = 36 => 2 - m = +/-6. Maka m = -4 atau m = 8. Oleh sebab m > 0, maka m = 8."}]}]};</script>

(function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") {
      window.NotaAudio.playTypewriterTick();
    } else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") {
      window.NotaAudio.playPaperRustle();
    } else if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {
      window.NotaAudio.playSnap();
    } else if (typeof window.NotaAudio.playTap === "function") {
      window.NotaAudio.playTap();
    }
  }

  function ensureScopedStyles() {
    if (typeof document === "undefined" || document.getElementById("addm42-labs-css")) return;

      ".addm42-svg{display:block;width:100%;height:auto;border-radius:12px;}",
      ".addm42-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}",
      ".addm42-pill{min-height:44px;padding:6px 12px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.14s ease;}",
      ".addm42-pill:hover{border-color:#2563eb;background:#eff6ff;}",
      ".addm42-pill[aria-pressed='true']{border-color:#1d4ed8;background:#1d4ed8;color:#fff;}"
    ].join("");
    document.head.appendChild(style);
  }

  function renderArchivalGallery(keys, headLabel) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) {
      return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null;
    }).filter(Boolean);
    if (items.length === 0) return "";
    var cards = items.map(function (it, idx) {
      var r = it.rec;
      var src = r.dataUri || r.src || "";
      var prio = idx === 0 ? ' fetchpriority="high"' : ' loading="lazy"';
      return (
        '<button type="button" class="archival-plate-btn" data-addm42-plate="' + esc(it.key) + '">' +
          '<img class="archival-plate-img" src="' + src + '" alt="' + esc(r.label || "Visual Kuadratik") + '" decoding="async"' + prio + ">" +
          '<div class="archival-plate-meta">' +
            (r.era ? '<div class="archival-plate-era">' + esc(r.era) + "</div>" : "") +
            '<div class="archival-plate-title">' + esc(r.label || "") + "</div>" +
          "</div>" +
        "</button>"
      );
    }).join("");
    return (
      '<div class="archival-section-head"><span>' + esc(headLabel || "Galeri Aplikasi Lengkung Parabola") + "</span></div>" +
      '<div class="archival-gallery-grid">' + cards + "</div>"
    );
  }

  function bindArchivalGallery(shell, ctx) {

    shell.querySelectorAll("[data-addm42-plate]").forEach(function (btn) {

        if (!rec) return;
        playSfx("paper");

        if (typeof NotaFeel !== "undefined" && typeof NotaFeel.openArchivalLightbox === "function") {

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

        });

        });

        });
        slides.push({

        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),

        });

        });
