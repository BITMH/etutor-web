/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab03","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":3,"title":"Sistem Persamaan","subtitle":"Subtopik 3.1–3.2 KSSM — Sistem Persamaan Linear Tiga Pemboleh Ubah (Unik, Tak Terhingga, Tiada), Penghapusan & Penggantian serta Persamaan Serentak Linear & Tak Linear.","estimatedMinutes":30,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab03-labs.js","coverIcon":"../assets/icons/addm43-u1.jpg","editionBadge":"Edisi Simulasi & Visual 3D","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Kecekapan kamu menghapus dan mengganti pemboleh ubah memang mengagumkan!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Sistem tiga satah dan persamaan serentak tak linear kamu kuasai dengan kemas!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak semula tanda negatif semasa menyingkirkan pemboleh ubah atau kembangkan kurungan dengan teliti.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab tiga berjaya kamu takluki!"},"units":[{"id":"addm43-u1","title":"Unit 1: Sistem Persamaan Linear Tiga Pemboleh Ubah","subtitle":"Subtopik 3.1 — Tafsiran Geometri 3 Satah (1 Penyelesaian Unik, Penyelesaian Tak Terhingga, Tiada Penyelesaian)","iconType":"scale","iconUrl":"../assets/icons/addm43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Geometri Tiga Satah 3D","voiceCaption":"Sistem persamaan linear dalam tiga pemboleh ubah mewakili tiga satah dalam ruang tiga dimensi dengan tiga kemungkinan penyelesaian.","voiceScript":"[warm] Selamat datang ke Bab tiga, Sistem Persamaan! Dalam subtopik tiga perpuluhan satu, persamaan linear berbentuk a x tambah b y tambah c z sama dengan d mewakili satu satah dalam ruang tiga dimensi! Apabila kita menggabungkan tiga satah serentak, terdapat tiga kemungkinan geometri: pertama, satu penyelesaian unik apabila ketiga-tiga satah bersilang pada tepat satu titik! Kedua, penyelesaian tak terhingga apabila ketiga-tiga satah bertemu sepanjang satu garis lurus atau bertindih, lalu menghasilkan identiti sifar sama dengan sifar! Ketiga, tiada penyelesaian apabila satah selari atau tiada titik sepunya, menghasilkan pernyataan palsu seperti sifar sama dengan lima! Terokai visualisator satah tiga dimensi di bawah!","title":"3.1 Tafsiran Geometri Sistem Persamaan Linear 3 Pemboleh Ubah","acronym":"1•∞•0","hook":"Tukar mod tiga satah di bawah untuk membezakan titik tunggal, garis sepunya dan satah selari!","mediaKey":"addm43_satah_3d","videoClip":{"src":"../assets/matematik-tambahan-t4-bab03/video/addm43_video_sistem_persamaan_narasi.mp4","hasNarration":true,"posterKey":"addm43_satah_3d","caption":"Persilangan tiga satah sistem persamaan linear dan kaedah penggantian garis lurus dengan lengkung."},"summary":"Persamaan ax + by + cz = d ialah satah 3D; gabungan tiga satah menghasilkan satu penyelesaian unik, penyelesaian tak terhingga (0 = 0), atau tiada penyelesaian (0 = k, k != 0).","bullets":["Satu Penyelesaian Unik: Ketiga-tiga satah bersilang di tepat satu titik tunggal P(x, y, z).","Penyelesaian Tak Terhingga: Ketiga-tiga satah bertindih atau bersilang sepanjang satu garis lurus sepunya. Pengiraan algebra menghasilkan identiti benar seperti 0 = 0 (bilangan penyelesaian tidak terhingga).","Tiada Penyelesaian: Satah adalah selari atau bersilang berpasangan membentuk prisma tanpa titik sepunya. Pengiraan algebra menghasilkan pernyataan palsu seperti 0 = 5 atau 0 = -3."],"formula":"ax + by + cz = d   |   0 = 0 (Tak terhingga)   |   0 = k, k != 0 (Tiada penyelesaian)","labId":"addm43_tiga_satah_lab","labTitle":"Visualisator Tiga Satah Linear dalam Ruang 3D","labProps":{"caseKey":"unik"},"examTip":"Dalam peperiksaan, jika langkah penghapusan menghasilkan persamaan mustahil seperti 0 = 4, JANGAN panik menganggap anda tersalah kira terus — semak dahulu sama ada ia kes 'Tiada Penyelesaian'!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Jenis Penyelesaian 3 Satah","voiceCaption":"Kelaskan enam ciri dan hasil algebra berikut antara Satu Penyelesaian Unik, Penyelesaian Tak Terhingga dan Tiada Penyelesaian.","voiceScript":"[curious] Uji penguasaan tafsiran satah tiga dimensi kamu! Isihkan keenam-enam hasil algebra dan geometri ini mengikut kategori penyelesaian yang betul.","prompt":"Kelaskan situasi sistem persamaan linear 3 pemboleh ubah berikut mengikut jenis penyelesaiannya:","buckets":[{"id":"unik","label":"Satu Penyelesaian Unik"},{"id":"inf","label":"Penyelesaian Tak Terhingga"},{"id":"tiada","label":"Tiada Penyelesaian"}],"items":[{"text":"Tiga satah bersilang pada satu titik tunggal (2, 1, 3)","bucketId":"unik","note":"Betul! Koordinat tunggal (x, y, z) bermaksud satu penyelesaian unik."},{"text":"Penghapusan algebra menghasilkan persamaan 0 = 0","bucketId":"inf","note":"Tepat! Identiti 0 = 0 menandakan satah bersilang sepanjang satu garis sepunya."},{"text":"Penghapusan algebra menghasilkan pernyataan palsu 0 = 7","bucketId":"tiada","note":"Betul! Pernyataan palsu menandakan tiada titik yang memenuhi ketiga-tiga satah."},{"text":"Dua persamaan ialah 2x + y - z = 3 dan 4x + 2y - 2z = 10","bucketId":"tiada","note":"Tepat! Nisbah pekali sama tetapi pemalar berbeza bermaksud dua satah selari!"},{"text":"Tiga satah bersilang sepanjang satu garis lurus sepunya","bucketId":"inf","note":"Betul! Setiap titik di atas garis itu ialah penyelesaian."},{"text":"Penggantian berjaya memperoleh nilai x, y dan z yang tunggal","bucketId":"unik","note":"Tepat! Penyelesaian unik bagi sistem 3 pemboleh ubah."}],"explanation":"Hasil 0 = 0 menunjukkan penyelesaian tak terhingga, hasil 0 = k (k != 0) menunjukkan tiada penyelesaian, manakala nilai tunggal (x, y, z) ialah satu penyelesaian unik."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kes Tiada Penyelesaian","voiceCaption":"Ramalkan keputusan apabila dua daripada tiga persamaan satah mempunyai nisbah pekali sama tetapi pemalar berbeza.","voiceScript":"[curious] Cuba ramalkan hasil sistem persamaan berikut! Persamaan satu ialah x tambah dua y tolak z sama dengan empat, dan persamaan dua ialah dua x tambah empat y tolak dua z sama dengan sebelas. Apakah jenis penyelesaiannya?","hook":"Darab persamaan pertama dengan 2 untuk membandingkan sebelah kiri dan kanannya!","scenario":"Sistem: (1) x + 2y - z = 4, (2) 2x + 4y - 2z = 11, (3) 3x - y + z = 2.","prompt":"Apakah jenis penyelesaian bagi sistem tiga persamaan linear tersebut?","options":["Tiada penyelesaian kerana persamaan (1) dan (2) mewakili dua satah yang selari","Penyelesaian tak terhingga kerana pekali x, y, z berkadaran","Satu penyelesaian unik pada titik (1, 2, 1)","Dua penyelesaian unik kerana terdapat dua satah selari"],"correctIndex":0,"proofLabId":"addm43_tiga_satah_lab","proofState":{"caseKey":"tiada"},"explanation":"Darab (1) dengan 2 memberi 2x + 4y - 2z = 8. Tolak daripada (2): 0 = 3 (palsu). Maka satah (1) dan (2) selari dan tidak pernah bertemu, jadi tiada penyelesaian."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Sahkan Titik Persilangan 3 Satah","voiceCaption":"Tentukan pasangan koordinat yang memenuhi kesemua tiga persamaan linear dalam sistem tiga pemboleh ubah.","voiceScript":"[confident] Uji semakan pantas! Antara titik berikut, manakah penyelesaian unik yang memenuhi ketiga-tiga persamaan x tambah y tambah z sama dengan enam, dua x tolak y tambah z sama dengan enam, dan x tambah dua y tolak z sama dengan satu?","prompt":"Selesaikan sistem persamaan linear: x + y + z = 6, 2x - y + z = 6, x + 2y - z = 1.","options":["(2, 1, 3)","(1, 2, 3)","(3, 1, 2)","(2, 3, 1)"],"correctIndex":0,"explanation":"Daripada (1) + (3): 2x + 3y = 7. Daripada (2) - (1): x - 2y = 0 => x = 2y. Gantikan: 4y + 3y = 7 => y = 1, maka x = 2 dan z = 6 - 2 - 1 = 3."}]},{"id":"addm43-u2","title":"Unit 2: Kaedah Penghapusan, Penggantian & Aplikasi","subtitle":"Subtopik 3.1 — Mengurangkan 3 Pemboleh Ubah kepada 2 Pemboleh Ubah & Masalah Kehidupan Harian","iconType":"formula","iconUrl":"../assets/icons/addm43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Strategi Turun ke 2 Pemboleh Ubah","voiceCaption":"Strategi teras menyelesaikan sistem tiga persamaan linear ialah menghapuskan pemboleh ubah yang sama daripada dua pasangan persamaan berbeza untuk memperoleh dua persamaan dengan dua pemboleh ubah.","voiceScript":"[warm] Selamat datang ke Unit dua! Bagaimanakah cara menyelesaikan sistem tiga pemboleh ubah tanpa keliru? Gunakan strategi tiga kepada dua kepada satu! Pilih satu pemboleh ubah paling mudah untuk dihapuskan, contohnya z jika pekalinya satu atau negatif satu. Hapuskan z daripada pasangan persamaan satu dan dua untuk mendapat persamaan empat dalam x dan y. Kemudian hapus z SEKALI LAGI daripada pasangan persamaan dua dan tiga atau satu dan tiga untuk mendapat persamaan lima dalam x dan y yang sama! Kini selesaikan persamaan empat dan lima seperti tingkatan dua, dan akhirnya ganti balik untuk mencari z!","title":"Strategi Penghapusan & Penggantian (3 -> 2 -> 1 Pemboleh Ubah)","acronym":"3->2->1","hook":"WAJIB hapuskan pemboleh ubah yang SAMA dalam kedua-dua pasangan persamaan supaya tinggal 2 pemboleh ubah!","summary":"Dengan menghapuskan atau menggantikan pemboleh ubah yang sama daripada dua pasangan persamaan, sistem 3x3 diturunkan kepada sistem 2x2 yang mudah diselesaikan.","bullets":["Kaedah Penghapusan (Elimination): (1) Pilih pemboleh ubah sasaran (cth. z). (2) Gabung Persamaan (1) & (2) untuk menghapuskan z -> dapat Persamaan (4). (3) Gabung Persamaan (1) & (3) [atau (2) & (3)] untuk menghapuskan z yang SAMA -> dapat Persamaan (5). (4) Selesaikan (4) & (5) serentak.","Kaedah Penggantian (Substitution): Jadikan satu pemboleh ubah perkara rumus daripada persamaan termudah (cth. z = 6 - x - y), gantikan ke dalam KEDUA-DUA persamaan yang lain untuk membentuk sistem 2x2.","Aplikasi Harian (Latihan Pengukuhan): Takrifkan pemboleh ubah dengan jelas beserta unitnya (cth. x = harga 1 buku Sejarah dalam RM) sebelum membina 3 persamaan."],"formula":"Sistem 3x3  --[hapus z dua kali]-->  Sistem 2x2 (x, y)  -->  Selesai z","examTip":"Kesilapan paling maut: Menghapuskan z dalam pasangan pertama (dapat x, y), tetapi menghapuskan y dalam pasangan kedua (dapat x, z)! Sentiasa pastikan pemboleh ubah yang dihapuskan adalah SAMA."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun Langkah Penghapusan 3x3","voiceCaption":"Susun langkah penyelesaian sistem tiga persamaan x tambah y tambah z sama dengan enam, dua x tambah y tolak z sama dengan satu, dan x tolak y tambah dua z sama dengan lima.","voiceScript":"[confident] Susun empat langkah penghapusan ini mengikut urutan yang betul untuk menyelesaikan sistem tiga pemboleh ubah!","prompt":"Susun langkah menyelesaikan: (1) x+y+z=6, (2) 2x+y-z=1, (3) x-y+2z=5:","hint":"Tambahkan (1) dan (2) dahulu untuk terus menghapuskan z...","answerTokens":["Tambah (1) dan (2) untuk hapuskan z: 3x + 2y = 7","Guna 2(2) + (3) untuk hapuskan z lagi: 5x + y = 7","Selesaikan serentak 3x + 2y = 7 dan 5x + y = 7 untuk dapat x = 1, y = 2","Gantikan ke dalam (1) untuk memperoleh z = 3"],"distractors":["Hapuskan x dalam pasangan pertama dan hapus y dalam pasangan kedua","Darab (1) dan (2) bersama menjadi (x + y)(2x + y)"],"explanation":"Tambahan (1)+(2) menghapuskan z menjadi 3x + 2y = 7; manakala 2(2)+(3) ialah (4x+2y-2z)+(x-y+2z) = 2+5 => 5x + y = 7. Daripada y = 7 - 5x, ganti ke 3x + 2(7 - 5x) = 7 => -7x = -7 => x = 1, y = 2, z = 3."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Masalah & Model Linear 3D","voiceCaption":"Padankan empat pernyataan masalah kehidupan harian dengan persamaan linear tiga pemboleh ubah yang mewakilinya.","voiceScript":"[curious] Uji kemahiran menterjemah ayat kepada model matematik! Padankan setiap pernyataan masalah dengan persamaan linear yang sepadan.","prompt":"Padankan situasi harian berikut dengan persamaan linear yang betul:","pairs":[{"id":"a43u2m1","left":"Jumlah 30 keping syiling 10 sen (x), 20 sen (y) dan 50 sen (z)","right":"x + y + z = 30"},{"id":"a43u2m2","left":"Jumlah nilai wang syiling 10 sen, 20 sen dan 50 sen ialah RM8.50","right":"0.10x + 0.20y + 0.50z = 8.50"},{"id":"a43u2m3","left":"Sudut dalam segi tiga A, B dan C","right":"A + B + C = 180"},{"id":"a43u2m4","left":"Harga 2 pen (x), 3 buku (y) dan 1 fail (z) ialah RM24","right":"2x + 3y + z = 24"}],"explanation":"Pastikan setiap unit wang konsisten (semua dalam RM atau semua dalam sen) semasa menukar maklumat kuantiti dan nilai kepada persamaan linear."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Aplikasi Pembelian 3 Item","voiceCaption":"Hitung harga setiap item daripada sistem tiga persamaan pembelian peralatan sekolah.","voiceScript":"[confident] Selesaikan masalah pembelian ini! Ali membeli satu buku, dua pen dan satu fail berharga lima puluh ringgit; Chong membeli dua buku, satu pen dan satu fail berharga lima puluh lima ringgit; Raju membeli satu buku, satu pen dan dua fail berharga lima puluh lima ringgit. Berapakah harga sebuah buku?","prompt":"Sistem belian: x + 2y + z = 50, 2x + y + z = 55, dan x + y + 2z = 55. Cari harga seunit x (dalam RM).","options":["RM15","RM10","RM20","RM12"],"correctIndex":0,"explanation":"Jumlahkan ketiga-tiga persamaan: 4x + 4y + 4z = 160 => x + y + z = 40. Tolak persamaan pertama (x + 2y + z = 50): y = 10. Tolak persamaan ketiga: z = 15. Maka x = 40 - 10 - 15 = RM15."}]},{"id":"addm43-u3","title":"Unit 3: Persamaan Serentak Linear & Tak Linear","subtitle":"Subtopik 3.2 — Persilangan Garis Lurus & Lengkung, Kaedah Penggantian & Tafsiran Graf","iconType":"graph","iconUrl":"../assets/icons/addm43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Persamaan Serentak Linear & Tak Linear","voiceCaption":"Persamaan serentak melibatkan satu persamaan linear dan satu persamaan tak linear diselesaikan dengan kaedah penggantian yang membentuk persamaan kuadratik.","voiceScript":"[warm] Selamat datang ke Unit tiga, Persamaan Serentak melibatkan satu persamaan linear dan satu persamaan tak linear! Secara grafik, ini mencari titik persilangan antara satu garis lurus dengan satu lengkung seperti parabola, bulatan atau hiperbola! Garis lurus boleh memotong lengkung pada dua titik, menyentuh pada satu titik tangen, atau tidak bersilang langsung! Secara algebra, kaedah wajib ialah penggantian: gunakan persamaan linear untuk mengungkapkan satu pemboleh ubah sebagai perkara rumus, kemudian gantikannya ke dalam persamaan tak linear untuk membentuk satu persamaan kuadratik dalam satu pemboleh ubah! Terokai plot persilangan di bawah!","title":"3.2 Penyelesaian Persamaan Serentak (Satu Linear & Satu Tak Linear)","acronym":"L•K•G•P","hook":"Seret pintasan-y garis lurus pada plot untuk melihat bilangan titik persilangan berubah dari 2 ke 1 tangen ke 0!","mediaKey":"addm43_orbit_persilangan","summary":"Kaedah penggantian menukarkan gabungan satu persamaan linear dan satu persamaan tak linear kepada satu persamaan kuadratik untuk mencari koordinat titik persilangan.","bullets":["4 Langkah Kaedah Penggantian: (1) Daripada persamaan linear, ungkapkan y dalam sebutan x (atau x dalam sebutan y — pilih yang tiada pecahan jika boleh!). (2) Gantikan ke dalam persamaan tak linear. (3) Kembangkan dan susun kepada bentuk am kuadratik ax^2 + bx + c = 0. (4) Selesaikan x (pemfaktoran atau rumus kuadratik) lalu cari nilai y sepadan menggunakan persamaan linear.","Tafsiran Geometri: Penyelesaian (x1, y1) dan (x2, y2) ialah koordinat titik-titik persilangan antara garis lurus dengan lengkung tersebut.","Format Jawapan SPM: Sentiasa nyatakan jawapan dalam pasangan sepadan (cth. x = -1, y = -1; x = 3, y = 7) — jangan campur adukkan x1 dengan y2!"],"formula":"Persamaan Linear (y = mx + c)  --[ganti]-->  Tak Linear  -->  ax^2 + bx + c = 0","labId":"addm43_serentak_persilangan_lab","labTitle":"Plot Persilangan Garis Lurus & Lengkung Kuadratik","labProps":{"c":1},"examTip":"Jika pekali kedua-dua x dan y bukan 1 dalam persamaan linear (cth. 2x + 3y = 7), tulis x = (7 - 3y)/2 dan berhati-hati semasa mengkuasadua pecahan: [(7 - 3y)/2]^2 = (49 - 42y + 9y^2)/4!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Titik Persilangan Garis-Lengkung","voiceCaption":"Ramalkan titik persilangan antara garis lurus y sama dengan dua x tambah satu dengan lengkung y sama dengan x kuasa dua tolak dua.","voiceScript":"[curious] Cuba ramalkan koordinat dua titik persilangan antara garis lurus y sama dengan dua x tambah satu dengan parabola y sama dengan x kuasa dua tolak dua!","hook":"Sahkan kedudukan kedua-dua titik persilangan pada Plot Persilangan selepas menjawab!","scenario":"Diberi garis lurus y = 2x + 1 dan lengkung y = x^2 - 2.","prompt":"Apakah koordinat titik-titik persilangan bagi kedua-dua graf tersebut?","options":["(-1, -1) dan (3, 7)","(1, 3) dan (-3, -5)","(-1, 1) dan (3, 5)","(0, 1) dan (2, 5)"],"correctIndex":0,"proofLabId":"addm43_serentak_persilangan_lab","proofState":{"c":1},"explanation":"x^2 - 2 = 2x + 1 => x^2 - 2x - 3 = 0 => (x - 3)(x + 1) = 0. Apabila x = -1, y = 2(-1) + 1 = -1; apabila x = 3, y = 2(3) + 1 = 7."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Langkah Persamaan Serentak","voiceCaption":"Susun langkah penyelesaian persamaan serentak bagi x tambah y sama dengan lima dan x kuasa dua tambah y kuasa dua sama dengan tiga belas.","voiceScript":"[confident] Susun empat langkah kaedah penggantian ini untuk mencari titik persilangan antara garis x tambah y sama dengan lima dengan bulatan x kuasa dua tambah y kuasa dua sama dengan tiga belas!","prompt":"Susun langkah menyelesaikan persamaan serentak x + y = 5 dan x^2 + y^2 = 13:","hint":"Ungkapkan y daripada persamaan linear dahulu...","answerTokens":["Daripada persamaan linear, ungkapkan y = 5 - x","Gantikan ke dalam lengkung: x^2 + (5 - x)^2 = 13","Kembang dan permudah kepada x^2 - 5x + 6 = 0","Faktorkan menjadi x = 2 (y = 3) dan x = 3 (y = 2)"],"distractors":["Kembangkan (5 - x)^2 menjadi 25 - x^2","Hapuskan x^2 terus dengan menolak kedua-dua persamaan"],"explanation":"Berhati-hati semasa mengembangkan (5 - x)^2 = 25 - 10x + x^2! Maka 2x^2 - 10x + 25 = 13 => 2x^2 - 10x + 12 = 0 => x^2 - 5x + 6 = 0."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cari Pemalar Persamaan Serentak","voiceCaption":"Cari nilai h jika titik lima koma h ialah satu penyelesaian bagi persamaan serentak.","voiceScript":"[confident] Uji soalan Latih Diri buku teks: diberi koordinat lima koma h ialah penyelesaian kepada persamaan serentak yang diberi, cari nilai h!","prompt":"Diberi (5, h) ialah satu penyelesaian bagi persamaan serentak 2x - y = 7 dan x^2 + ky = 34. Cari nilai h dan k.","options":["h = 3, k = 3","h = -3, k = -3","h = 3, k = 9","h = 17, k = 1"],"correctIndex":0,"explanation":"Gantikan x = 5, y = h ke dalam persamaan linear: 2(5) - h = 7 => h = 3. Kemudian gantikan (5, 3) ke dalam x^2 + ky = 34: 25 + 3k = 34 => 3k = 9 => k = 3."}]},{"id":"addm43-u4","title":"Unit 4: Aplikasi Persamaan Serentak & Pecahan","subtitle":"Subtopik 3.2 — Masalah Geometri Perimeter/Luas/Pythagoras & Persamaan Pecahan Algebra","iconType":"pendulum","iconUrl":"../assets/icons/addm43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Aplikasi Geometri & Pecahan","voiceCaption":"Masalah aplikasi persamaan serentak sering menggabungkan perimeter dengan luas atau Teorem Pythagoras, serta memerlukan penolakan jawapan bernilai negatif bagi ukuran fizikal.","voiceScript":"[warm] Dalam Kertas dua S P M, soalan persamaan serentak hampir selalu muncul dalam bentuk masalah geometri atau pecahan algebra! Bagi soalan geometri seperti papan segi empat tepat, pagar kebun atau segi tiga bersudut tegak, perimeter membina persamaan linear, manakala luas atau Teorem Pythagoras membina persamaan tak linear! Bagi persamaan pecahan seperti a per x tambah b per y sama dengan c, darabkan semua sebutan dengan penyebut sepunya x y dahulu supaya tiada lagi pecahan sebelum menggantikan pemboleh ubah! Dan ingat: bagi panjang, lebar atau masa, tolak sebarang jawapan bernilai negatif atau sifar!","title":"Menyelesaikan Masalah Geometri & Pecahan Persamaan Serentak","acronym":"P•L•T•S","hook":"Perimeter = Linear; Luas & Pythagoras = Tak Linear. Sentiasa singkirkan panjang bernilai negatif!","summary":"Aplikasi persamaan serentak melibatkan pembinaan dua persamaan daripada maklumat geometri atau pecahan, penghapusan penyebut dengan x*y, dan penapisan penyelesaian fizikal positif.","bullets":["Model Geometri Lazim: (1) Segi empat tepat panjang x, lebar y: Perimeter = 2x + 2y (linear), Luas = xy (tak linear) atau Pepenjuru = punca(x^2 + y^2). (2) Segi tiga bersudut tegak: Perimeter = a + b + c (linear), Teorem Pythagoras a^2 + b^2 = c^2 (tak linear).","Pecahan Algebra Seperti x/y - 2y/x = 1: Darab keseluruhan persamaan dengan xy untuk menghapuskan semua penyebut menjadi x^2 - 2y^2 = xy sebelum membuat penggantian daripada persamaan linear.","Semakan Konteks Fizikal: Ukuran panjang/lebar tidak boleh negatif (x > 0, y > 0). Nyatakan sebab penolakan dengan jelas jika mendapat satu punca negatif."],"formula":"Perimeter: 2(x + y) = P   |   Luas: xy = A   |   Pythagoras: x^2 + y^2 = d^2","examTip":"Jika soalan meminta jawapan betul kepada 3 tempat perpuluhan atau 4 angka bererti apabila kuadratik tidak boleh difaktorkan, gunakan rumus kuadratik dan simpan nilai penuh dalam kalkulator sebelum mengira pasangan pemboleh ubah kedua!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Masalah Geometri & Rumus","voiceCaption":"Padankan empat pernyataan geometri dengan persamaan linear atau tak linear yang sepadan.","voiceScript":"[confident] Padankan setiap maklumat geometri berikut dengan persamaan algebra yang betul!","prompt":"Padankan pernyataan geometri (panjang = x, lebar = y) dengan persamaannya:","pairs":[{"id":"a43u4m1","left":"Dawai sepanjang 40 cm dibengkokkan menjadi segi empat tepat","right":"2x + 2y = 40  =>  x + y = 20"},{"id":"a43u4m2","left":"Luas segi empat tepat ialah 96 cm^2","right":"xy = 96"},{"id":"a43u4m3","left":"Panjang pepenjuru segi empat tepat ialah 10 cm","right":"x^2 + y^2 = 100"},{"id":"a43u4m4","left":"Beza luas dua segi empat sama bersisi x dan y ialah 24 cm^2","right":"x^2 - y^2 = 24"}],"explanation":"Mengenal pasti dengan pantas persamaan mana yang linear dan mana yang tak linear mempercepatkan pembinaan model dalam soalan aplikasi SPM."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s3","voiceToneLabel":"Kira Dimensi Segi Empat Tepat","voiceCaption":"Hitung panjang dan lebar sebidang kadbod segi empat tepat apabila diberi perimeter dua puluh lapan sentimeter dan luas empat puluh lapan sentimeter persegi.","voiceScript":"[curious] Selesaikan soalan geometri klasik! Perimeter sebuah segi empat tepat ialah dua puluh lapan sentimeter dan luasnya ialah empat puluh lapan sentimeter persegi. Berapakah dimensi panjang dan lebarnya?","prompt":"Sebuah segi empat tepat mempunyai perimeter 28 cm dan luas 48 cm^2. Cari panjang dan lebarnya (panjang > lebar).","options":["Panjang = 8 cm, Lebar = 6 cm","Panjang = 12 cm, Lebar = 4 cm","Panjang = 10 cm, Lebar = 4 cm","Panjang = 9 cm, Lebar = 5 cm"],"correctIndex":0,"explanation":"2x + 2y = 28 => x + y = 14 => y = 14 - x. Ganti ke xy = 48: x(14 - x) = 48 => x^2 - 14x + 48 = 0 => (x - 8)(x - 6) = 0. Maka panjang = 8 cm dan lebar = 6 cm."},{"type":"sort","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Isih Penyelesaian Sah vs Ditolak","voiceCaption":"Asingkan enam hasil penyelesaian berikut antara yang diterima sebagai sah dengan yang mesti ditolak atas faktor fizikal atau domain pecahan.","voiceScript":"[confident] Jangan lupa menapis jawapan akhir sebelum menulis kesimpulan! Asingkan keenam-enam calon penyelesaian berikut kepada kategori Sah atau Mesti Ditolak.","prompt":"Kelaskan calon nilai berikut sama ada Sah atau Mesti Ditolak mengikut konteks soalan:","buckets":[{"id":"sah","label":"Penyelesaian Sah"},{"id":"tolak","label":"Mesti Ditolak (Tidak Sah)"}],"items":[{"text":"Panjang sisi segi tiga x = 7.5 cm","bucketId":"sah","note":"Betul! Nilai positif sah sebagai ukuran panjang."},{"text":"Lebar kebun y = -4 m daripada penyelesaian kuadratik","bucketId":"tolak","note":"Tepat! Ukuran dimensi fizikal tidak boleh bernilai negatif."},{"text":"Nilai x = 0 dalam persamaan pecahan 2/x + 3/y = 1","bucketId":"tolak","note":"Betul! x = 0 menyebabkan pembahagian dengan sifar (tidak tertakrif)."},{"text":"Koordinat persilangan (-2, 5) bagi graf y = x^2 + 1 dan y = -x + 3","bucketId":"sah","note":"Tepat! Dalam satah Cartes, koordinat x dan y boleh bernilai negatif."},{"text":"Bilangan pekerja n = 3.5 orang dalam masalah kilang","bucketId":"tolak","note":"Betul! Bilangan orang atau objek diskret mesti integer positif."},{"text":"Dua pasangan (4, 2) dan (2, 3) bagi persamaan 2/x + 3/y = 2","bucketId":"sah","note":"Tepat! Kedua-dua penyebut bukan sifar dan memenuhi persamaan."}],"explanation":"Dalam masalah koordinat graf, nilai negatif adalah sah; namun bagi dimensi geometri, bilangan diskret dan penyebut pecahan, semak syarat > 0 atau != 0."}]},{"id":"addm43-u5","title":"Unit 5: Cabaran Boss SPM — Sistem Persamaan","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Penghapusan 3D, Garis Tangen Lengkung & Pecahan Serentak","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Persilangan Hiperbola","voiceCaption":"Soalan Boss pertama menguji pencarian titik persilangan antara garis lurus dan lengkung hiperbola.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab tiga! Soalan pertama mencari titik persilangan antara garis lurus y sama dengan x tambah tiga dengan hiperbola x y sama dengan sepuluh!","prompt":"Cari titik-titik persilangan bagi garis lurus y = x + 3 dan lengkung xy = 10.","options":["(2, 5) dan (-5, -2)","(5, 2) dan (-2, -5)","(2, -5) dan (5, -2)","(1, 10) dan (2, 5)"],"correctIndex":0,"explanation":"Ganti y = x + 3 ke xy = 10: x(x + 3) = 10 => x^2 + 3x - 10 = 0 => (x - 2)(x + 5) = 0. Apabila x = 2, y = 5; apabila x = -5, y = -2."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Garis Tangen pada Lengkung","voiceCaption":"Ramalkan nilai k supaya garis lurus y sama dengan dua x tambah k menyentuh lengkung y sama dengan x kuasa dua tolak dua hanya pada satu titik.","voiceScript":"[curious] Soalan Boss kedua menggabungkan Bab dua dan Bab tiga! Berapakah nilai k jika garis lurus y sama dengan dua x tambah k menyentuh lengkung y sama dengan x kuasa dua tolak dua tepat pada satu titik tangen?","hook":"Selesaikan D = 0 bagi x^2 - 2x - (2 + k) = 0 dan semak pada plot!","scenario":"Garis lurus y = 2x + k menjadi tangen kepada lengkung y = x^2 - 2.","prompt":"Apakah nilai pemalar k yang menghasilkan tepat satu titik tangen?","options":["k = -3","k = -1","k = 0","k = -5"],"correctIndex":0,"proofLabId":"addm43_serentak_persilangan_lab","proofState":{"c":-3},"explanation":"x^2 - 2 = 2x + k => x^2 - 2x - (2 + k) = 0. Syarat tangen D = 0: (-2)^2 - 4(1)(-2 - k) = 0 => 4 + 8 + 4k = 0 => 4k = -12 => k = -3."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Pecahan Serentak SPM","voiceCaption":"Susun langkah menyelesaikan persamaan serentak yang melibatkan pecahan dua per x tambah tiga per y sama dengan dua dan garis lurus x tambah dua y sama dengan lapan.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas dua! Susun langkah menyelesaikan sistem pecahan dua per x tambah tiga per y sama dengan dua bersama x tambah dua y sama dengan lapan.","prompt":"Susun langkah menyelesaikan 2/x + 3/y = 2 dan x + 2y = 8:","hint":"Darab persamaan pecahan dengan xy dahulu...","answerTokens":["Darab pecahan dengan xy menjadi 2y + 3x = 2xy","Daripada persamaan linear, ungkapkan x = 8 - 2y","Gantikan x untuk memperoleh 4y^2 - 20y + 24 = 0 atau y^2 - 5y + 6 = 0","Jadi y = 2 (x = 4) dan y = 3 (x = 2)"],"distractors":["Terbalikkan pecahan menjadi x/2 + y/3 = 1/2","Biarkan x = 0 sebagai satu daripada penyelesaian sah"],"explanation":"2y + 3(8 - 2y) = 2y(8 - 2y) => 24 - 4y = 16y - 4y^2 => 4y^2 - 20y + 24 = 0 => y^2 - 5y + 6 = 0 => (y - 2)(y - 3) = 0."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Kaedah & Kes Sistem","voiceCaption":"Padankan empat kes sistem persamaan linear dan tak linear dengan diagnosis algebra tepatnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan setiap dapatan pengiraan dengan kesimpulan sistem persamaan yang tepat.","prompt":"Padankan hasil pengiraan algebra dengan kesimpulan sistem persamaannya:","pairs":[{"id":"a43b4m1","left":"Penghapusan sistem 3x3 memberi 0 = 0","right":"Tiga satah mempunyai penyelesaian tak terhingga"},{"id":"a43b4m2","left":"Penghapusan sistem 3x3 memberi 0 = -6","right":"Tiada penyelesaian bagi ketiga-tiga satah"},{"id":"a43b4m3","left":"Persamaan kuadratik serentak mempunyai D = 0","right":"Garis lurus ialah tangen kepada lengkung (1 titik)"},{"id":"a43b4m4","left":"Persamaan kuadratik serentak mempunyai D < 0","right":"Garis lurus tidak memotong lengkung (tiada titik nyata)"}],"explanation":"Menguasai hubungan antara hasil algebra (0=0, 0=k, D>0, D=0, D<0) dengan tafsiran geometri adalah teras Bab 3."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Sistem 3 Pemboleh Ubah","voiceCaption":"Selesaikan sistem tiga persamaan linear untuk mencari nilai jumlah x tambah y tambah z.","voiceScript":"[excited] Soalan Boss terakhir Bab tiga! Selesaikan sistem tiga persamaan linear berikut dan hitung nilai jumlah x tambah y tambah z!","prompt":"Diberi sistem persamaan: 3x + 2y - z = 5, x - y + 2z = 7, dan 2x + y + z = 8. Hitung nilai bagi x + y + z.","options":["6","5","8","7"],"correctIndex":0,"explanation":"Tambah (1) dan (3): 5x + 3y = 13. Guna (1) + (2) bukan hapus z; guna 2(3) - (2): (4x + 2y + 2z) - (x - y + 2z) = 16 - 7 => 3x + 3y = 9 => x + y = 3. Tolak daripada 5x + 3y = 13: 2x = 4? Tunggu: 5x + 3y = 13 dan 3x + 3y = 9 => tolak: 2x = 4 => x = 2! Maka y = 1, dan daripada (3): 4 + 1 + z = 8 => z = 3. Jadi x + y + z = 2 + 1 + 3 = 6."}]}]};</script>

(function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")

      .replace(/"/g, "&quot;")

    if (!window.NotaAudio) return;

    } else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") {

    } else if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {

  function renderArchivalGallery(keys, headLabel) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) {
      return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null;
    }).filter(Boolean);
    if (items.length === 0) return "";
    var cards = items.map(function (it, idx) {
      var r = it.rec;
      var src = r.dataUri || r.src || "";
      var prio = idx === 0 ? ' fetchpriority="high"' : ' loading="lazy"';
      return (
        '<button type="button" class="archival-plate-btn" data-addm43-plate="' + esc(it.key) + '">' +
          '<img class="archival-plate-img" src="' + src + '" alt="' + esc(r.label || "Visual Sistem Persamaan") + '" decoding="async"' + prio + ">" +
          '<div class="archival-plate-meta">' +

      '<div class="archival-gallery-grid">' + cards + "</div>"
    );

  /* =========================================================================
     MAKMAL 2: addm43_serentak_persilangan_lab
     Plot Persamaan Serentak: Garis Lurus y = 2x + c memotong Lengkung y = x^2 - 2
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.addm43_serentak_persilangan_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var cVal = typeof ps.c === "number" ? ps.c : 1;

    function mapX(x) { return 280 + x * 42; }
    function mapY(y) { return 165 - y * 15; }

    function render() {
      // Intersection of y = x^2 - 2 and y = 2x + c => x^2 - 2x - (2 + c) = 0
      var disc = 4 + 4 * (2 + cVal);
      var hits = [];
      if (disc > 0.001) {
        var s = Math.sqrt(disc);
        var x1 = (2 - s) / 2;
        var x2 = (2 + s) / 2;
        hits.push({ x: x1, y: 2 * x1 + cVal });
        hits.push({ x: x2, y: 2 * x2 + cVal });
      } else if (Math.abs(disc) <= 0.001) {

    }

  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var mindMapHostHtml = (!isBite && nodes.length > 0) ? '<div id="conceptMindMapHost"></div>' : "";

  var fullNotesItems = bullets.map(function (b, idx) {

  var deepDrawerHtml = !isBite

        "<summary>" + tUi("Nota Lengkap Buku Teks &amp; Tip SPM", "Full Textbook Notes &amp; SPM Tip") + "</summary>" +
        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
