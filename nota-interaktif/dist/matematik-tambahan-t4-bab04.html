/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab04","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":4,"title":"Indeks, Surd dan Logaritma","subtitle":"Subtopik 4.1–4.4 KSSM — Hukum Indeks, Nombor Nisbah vs Tak Nisbah, Hukum Surd & Konjugat Penisbahan Penyebut, Hukum Logaritma, Log Jati (ln), Penukaran Asas & Aplikasi Pertumbuhan/Pereputan.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab04-labs.js","coverIcon":"../assets/icons/addm44-u1.jpg","editionBadge":"Edisi Simulasi & Kalkulator Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan hukum indeks, surd dan logaritma kamu sangat cemerlang!","combo":"[laughs warmly] Kombo yang sangat pantas! [excited] Penisbahan konjugat dan penukaran asas logaritma berjaya kamu kuasai!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak semula asas logaritma dan pastikan tanda konjugat disongsangkan dengan betul.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab empat berjaya kamu takluki!"},"units":[{"id":"addm44-u1","title":"Unit 1: Hukum Indeks & Persamaan Indeks","subtitle":"Subtopik 4.1 — Hukum Pendaraban, Pembahagian, Kuasa, Indeks Sifar/Negatif/Pecahan & Pemfaktoran Indeks","iconType":"formula","iconUrl":"../assets/icons/addm44-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Hukum Indeks & Persamaan Asas","voiceCaption":"Hukum indeks mempermudah ungkapan kuasa berasas sama, dan persamaan indeks boleh diselesaikan dengan menyamakan asas atau memfaktorkan sebutan sepunya.","voiceScript":"[warm] Selamat datang ke Bab empat, Indeks, Surd dan Logaritma! Dalam subtopik empat perpuluhan satu, ulang kaji hukum asas indeks dengan teliti: pendaraban berasas sama menambah indeks, pembahagian menolak indeks, kuasa ke atas kuasa mendarab indeks, kuasa sifar bernilai satu, indeks negatif menjadi salingan, dan indeks pecahan m per n bermaksud punca kuasa ke n bagi a kuasa m! Untuk persamaan indeks seperti empat kuasa dua x tolak satu tambah empat kuasa dua x sama dengan lima, JANGAN terus samakan indeks apabila ada tanda tambah atau tolak! Sebaliknya, faktorkan kuasa terendah dahulu menjadi satu sebutan tunggal sebelum menyamakan asas!","title":"4.1 Hukum Indeks & Teknik Pemfaktoran Persamaan Indeks","acronym":"D•B•K•F","hook":"Apabila persamaan indeks mempunyai tanda + atau -, WAJIB faktorkan sebutan kuasa sepunya dahulu!","summary":"Lima hukum asas indeks mengawal operasi algebra berasas sama; persamaan indeks dengan operasi tambah/tolak diselesaikan melalui pemfaktoran faktor sepunya.","bullets":["Hukum Asas (a != 0): a^m * a^n = a^(m+n); a^m / a^n = a^(m-n); (a^m)^n = a^(mn); a^0 = 1; a^(-n) = 1/a^n; a^(m/n) = (punca_n(a))^m.","Menyamakan Asas: Jika a^x = a^y (a > 0, a != 1), maka x = y. Tukar nombor seperti 8 -> 2^3, 27 -> 3^3, 1/16 -> 2^(-4).","Kes Pemfaktoran (+ atau -) & Kuadratik Indeks: Bagi 5^(n+1) - 5^n + 5^(n-1) = 105, tulis sebagai 5^n * 5 - 5^n + 5^n / 5 atau faktorkan 5^(n-1)(5^2 - 5 + 1) = 105 => 5^(n-1)(21) = 105 => 5^(n-1) = 5^1 => n = 2. Bagi 2^(2x) - 5(2^x) + 4 = 0, guna gantian y = 2^x."],"formula":"a^m * a^n = a^(m+n)   |   a^(-n) = 1/a^n   |   a^x = a^y  =>  x = y","labId":"addm44_kalkulator_indeks_log_lab","labTitle":"Kalkulator Kuasa Indeks & Padanan Logaritma","labProps":{"a":2,"x":3},"examTip":"Pembuktian lazim Kertas 2: 'Tunjukkan bahawa 4^(x+2) + 4^(x+1) + 4^x boleh dibahagi tepat dengan 7'. Faktorkan 4^x(16 + 4 + 1) = 21 * 4^x = 7 * (3 * 4^x), jelas gandaan 7!"},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Hukum & Nilai Indeks","voiceCaption":"Padankan lima ungkapan indeks berikut dengan bentuk teringkasnya.","voiceScript":"[confident] Uji penguasaan hukum indeks kamu! Padankan kelima-lima ungkapan indeks di kiri dengan nilai atau bentuk ringkas tepatnya di kanan.","prompt":"Padankan setiap ungkapan indeks dengan bentuk teringkasnya:","pairs":[{"id":"a44u1m1","left":"27^(2/3)","right":"9"},{"id":"a44u1m2","left":"16^(-3/4)","right":"1 / 8"},{"id":"a44u1m3","left":"(2a^3)^4 / (4a^5)","right":"4a^7"},{"id":"a44u1m4","left":"3^(x+2) - 3^x","right":"8 * 3^x"},{"id":"a44u1m5","left":"(x^0 + y^0)^3 (x, y != 0)","right":"8"}],"explanation":"27^(2/3) = (punca_3(27))^2 = 3^2 = 9; 16^(-3/4) = 1/(2^3) = 1/8; 3^(x+2) - 3^x = 3^x(9 - 1) = 8(3^x); x^0 + y^0 = 1 + 1 = 2, maka 2^3 = 8."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Pemfaktoran Persamaan Indeks","voiceCaption":"Susun langkah menyelesaikan persamaan lima kuasa n tambah satu tolak lima kuasa n tambah lima kuasa n tolak satu sama dengan seratus lima.","voiceScript":"[curious] Susun empat langkah pemfaktoran ini untuk menyelesaikan persamaan indeks lima kuasa n tambah satu tolak lima kuasa n tambah lima kuasa n tolak satu sama dengan seratus lima!","prompt":"Susun langkah menyelesaikan 5^(n+1) - 5^n + 5^(n-1) = 105:","hint":"Faktorkan kuasa terkecil 5^(n-1) dahulu...","answerTokens":["Faktorkan 5^(n-1): 5^(n-1) * (5^2 - 5^1 + 1) = 105","Permudahkan dalam kurungan: 5^(n-1) * 21 = 105","Bahagi kedua-dua belah dengan 21 menjadi 5^(n-1) = 5^1","Samakan indeks: n - 1 = 1, maka n = 2"],"distractors":["Samakan indeks terus: (n + 1) - n + (n - 1) = 105","Gabungkan asas menjadi 5^(3n) = 105"],"explanation":"Memfaktorkan 5^(n-1) mendedahkan 5^2 - 5 + 1 = 21. Selepas membahagi 105 dengan 21 mendapat 5^1, indeks disamakan n - 1 = 1 => n = 2."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Kira Persamaan Indeks 4^(2x)","voiceCaption":"Cari nilai x yang memenuhi persamaan empat kuasa dua x tolak satu tambah empat kuasa dua x sama dengan lima.","voiceScript":"[confident] Selesaikan persamaan indeks empat kuasa dua x tolak satu tambah empat kuasa dua x sama dengan lima!","prompt":"Selesaikan persamaan 4^(2x - 1) + 4^(2x) = 5.","options":["x = 1/2","x = 1","x = 1/4","x = 2"],"correctIndex":0,"explanation":"4^(2x) * (4^-1 + 1) = 5 => 4^(2x) * (5/4) = 5 => 4^(2x) = 4^1 => 2x = 1 => x = 1/2."}]},{"id":"addm44-u2","title":"Unit 2: Hukum Surd & Penisbahan Penyebut","subtitle":"Subtopik 4.2 — Nombor Nisbah vs Tak Nisbah, Surd Serupa, Hukum Surd & Konjugat (a + punca(b))(a - punca(b))","iconType":"atom","iconUrl":"../assets/icons/addm44-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Surd & Penisbahan Konjugat","voiceCaption":"Surd ialah punca kuasa tak nisbah dengan perpuluhan tak terhingga dan tidak berulang, dan penyebut bersurd dinisbahkan dengan mendarab pasangan konjugatnya.","voiceScript":"[warm] Selamat datang ke Unit dua, Hukum Surd! Berhati-hati membezakan surd dengan punca kuasa biasa: punca kuasa dua bagi sembilan ialah tiga iaitu nombor nisbah, jadi ia BUKAN surd! Sebaliknya, punca kuasa dua bagi lima menghasilkan perpuluhan tak terhingga yang tidak berulang, itulah surd! Hanya surd serupa seperti tiga punca dua dan lima punca dua boleh ditambah atau ditolak. Dalam peperiksaan, jawapan akhir tidak boleh meninggalkan surd pada penyebut! Jika penyebut berbentuk a tambah punca b, darabkan pengangka dan penyebut dengan konjugatnya a tolak punca b supaya penyebut bertukar menjadi nombor nisbah a kuasa dua tolak b! Uji konjugat di bawah!","title":"4.2 Takrif Surd, Operasi & Penisbahan Penyebut (Konjugat)","acronym":"S•K•A2-B","hook":"Konjugat (a + punca(b))(a - punca(b)) = a^2 - b menghapuskan tanda punca di penyebut!","summary":"Surd ialah nombor tak nisbah dalam bentuk punca kuasa; penisbahan penyebut menukar penyebut bersurd kepada integer menggunakan faktor konjugat.","bullets":["Nombor Nisbah vs Surd: Nombor nisbah boleh ditulis sebagai pecahan a/b (termasuk perpuluhan berulang seperti 0.333... = 1/3, dan punca sempurna seperti punca(16) = 4). Surd ialah nombor tak nisbah dalam bentuk punca seperti punca(2), punca(12) = 2*punca(3), punca_3(5).","Hukum Surd: punca(a) * punca(b) = punca(ab); punca(a) / punca(b) = punca(a/b); (punca(a))^2 = a. Surd serupa mempunyai nombor sama di bawah punca (cth. 3*punca(5) + 5*punca(5) = 8*punca(5)).","Penisbahan Penyebut: (1) Untuk 1/punca(a), darab dengan punca(a)/punca(a). (2) Untuk 1/(a +/- punca(b)), darab dengan konjugat (a -/+ punca(b))/(a -/+ punca(b)) menggunakan (a + punca(b))(a - punca(b)) = a^2 - b."],"formula":"punca(a)*punca(b) = punca(ab)   |   (a + punca(b))(a - punca(b)) = a^2 - b","labId":"addm44_konjugat_eksponen_lab","labTitle":"Makmal Penisbahan Penyebut dengan Konjugat Surd","labProps":{"tab":"surd","m":3,"n":5},"examTip":"Apabila mempermudah surd besar seperti punca(75) + punca(12), pecahkan kepada faktor kuasa dua sempurna terbesar: punca(25*3) + punca(4*3) = 5*punca(3) + 2*punca(3) = 7*punca(3)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Nombor Nisbah vs Surd","voiceCaption":"Kelaskan enam nombor dan ungkapan berikut antara Nombor Nisbah (Bukan Surd) dengan Nombor Tak Nisbah (Surd).","voiceScript":"[curious] Uji Inkuiri empat buku teks! Asingkan keenam-enam nombor berikut kepada Nombor Nisbah atau Surd iaitu nombor tak nisbah.","prompt":"Kelaskan setiap nombor berikut kepada Nombor Nisbah (Bukan Surd) atau Surd (Tak Nisbah):","buckets":[{"id":"nisbah","label":"Nombor Nisbah (Bukan Surd)"},{"id":"surd","label":"Surd (Nombor Tak Nisbah)"}],"items":[{"text":"0.5636363... (perpuluhan berulang)","bucketId":"nisbah","note":"Betul! Perpuluhan berulang boleh ditukar kepada pecahan 31/55."},{"text":"punca(75) / punca(3)","bucketId":"nisbah","note":"Perangkap berjaya! punca(75/3) = punca(25) = 5 (integer nisbah)."},{"text":"punca(18) = 3 * punca(2)","bucketId":"surd","note":"Tepat! Mengandungi punca(2) yang tidak boleh dipermudah menjadi integer."},{"text":"punca_3(27) = 3","bucketId":"nisbah","note":"Betul! 27 ialah kuasa tiga sempurna, maka hasilnya ialah integer 3."},{"text":"punca(2) + punca(3)","bucketId":"surd","note":"Tepat! Hasil tambah dua surd tak serupa kekal nombor tak nisbah."},{"text":"punca_3(10)","bucketId":"surd","note":"Betul! Punca kuasa tiga bagi 10 ialah perpuluhan tak terhingga tak berulang."}],"explanation":"Jangan tertipu dengan simbol punca semata-mata! Sentiasa permudahkan dahulu seperti punca(75)/punca(3) = punca(25) = 5 untuk menyemak sama ada ia nisbah."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Hasil Penisbahan Konjugat","voiceCaption":"Ramalkan bentuk termudah bagi pecahan empat per kurungan tiga tolak punca lima selepas penyebutnya dinisbahkan.","voiceScript":"[curious] Cuba ramalkan hasil penisbahan penyebut bagi empat bahagi tiga tolak punca lima! Darabkan pengangka dan penyebut dengan konjugatnya tiga tambah punca lima.","hook":"Periksa nilai penyebut 3^2 - 5 dalam Makmal Konjugat Surd!","scenario":"Ungkapan pecahan bersurd ialah 4 / (3 - punca(5)).","prompt":"Apakah bentuk termudah selepas penyebutnya dinisbahkan?","options":["3 + punca(5)","(3 + punca(5)) / 4","3 - punca(5)","12 + 4*punca(5)"],"correctIndex":0,"proofLabId":"addm44_konjugat_eksponen_lab","proofState":{"tab":"surd","m":3,"n":5},"explanation":"Darab dengan (3 + punca(5))/(3 + punca(5)): pengangka = 4(3 + punca(5)), penyebut = 3^2 - 5 = 4. Potong faktor 4 memberi jawapan 3 + punca(5)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Permudah Pecahan Surd Konjugat","voiceCaption":"Nisbahkan penyebut bagi enam per kurungan punca lima tolak punca dua.","voiceScript":"[confident] Selesaikan soalan Latih Diri buku teks ini: nisbahkan penyebut bagi enam bahagi kurungan punca lima tolak punca dua.","prompt":"Nisbahkan penyebut dan permudahkan 6 / (punca(5) - punca(2)).","options":["2(punca(5) + punca(2))","2(punca(5) - punca(2))","6(punca(5) + punca(2)) / 7","3(punca(5) + punca(2))"],"correctIndex":0,"explanation":"Darab dengan konjugat (punca(5) + punca(2)): penyebut menjadi (punca(5))^2 - (punca(2))^2 = 5 - 2 = 3. Maka 6(punca(5) + punca(2)) / 3 = 2(punca(5) + punca(2))."}]},{"id":"addm44-u3","title":"Unit 3: Hukum Logaritma & Penukaran Asas","subtitle":"Subtopik 4.3 — Hubungan Indeks-Logaritma, Log Biasa & Jati (ln), 3 Hukum Logaritma & Penukaran Asas","iconType":"graph","iconUrl":"../assets/icons/addm44-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"3 Hukum Logaritma & Tukar Asas","voiceCaption":"Logaritma ialah songsangan kepada indeks dengan tiga hukum teras hasil darab, hasil bahagi dan kuasa, serta hukum penukaran asas untuk menilai sebarang asas.","voiceScript":"[warm] Selamat datang ke Unit tiga, Hukum Logaritma! Ingat hubungan songsangan asas: N sama dengan a kuasa x jika dan hanya jika log asas a bagi N sama dengan x! Di sini, a mesti lebih besar daripada sifar dan tidak sama dengan satu, manakala N wajib positif! Kenali juga dua logaritma khas: logaritma biasa berasas sepuluh, dan logaritma jati l n yang berasas pemalar Euler e! Tiga hukum logaritma mesti dihafal luar kepala: log hasil darab menjadi hasil tambah log, log hasil bahagi menjadi hasil tolak log, dan kuasa boleh diturunkan ke hadapan! Apabila berjumpa asas berbeza, gunakan rumus penukaran asas log asas a bagi b sama dengan log asas c bagi b bahagi log asas c bagi a!","title":"4.3 Takrif Logaritma, 3 Hukum Asas & Penukaran Asas","acronym":"D•B•K•T","hook":"Gunakan Penukar Indeks <-> Logaritma di bawah untuk membuktikan kesetaraan log_a N = log10 N / log10 a!","mediaKey":"addm44_lingkaran_logaritma","videoClip":{"src":"../assets/matematik-tambahan-t4-bab04/video/addm44_video_indeks_surd_log_narasi.mp4","hasNarration":true,"posterKey":"addm44_lingkaran_logaritma","caption":"Video Penerangan Bersuara (BM): Hukum indeks, merasionalkan penyebut surd dengan konjugat serta hubungan songsang graf eksponen dan logaritma"},"summary":"Logaritma menukar pendaraban kepada penambahan dan kuasa kepada pendaraban; hukum penukaran asas membolehkan mana-mana asas dinilai dengan log10 atau ln.","bullets":["Takrif & Syarat: a^x = N <==> log_a N = x (syarat: a > 0, a != 1, N > 0). Nilai khas: log_a 1 = 0, log_a a = 1, log_a a^x = x. Logaritma bagi 0 atau nombor negatif TIDAK TERTAKRIF.","3 Hukum Asas Logaritma: (1) log_a(xy) = log_a x + log_a y; (2) log_a(x/y) = log_a x - log_a y; (3) log_a(x^n) = n log_a x.","Penukaran Asas & Log Jati (ln = log_e): log_a b = (log_c b) / (log_c a) dan kes khas log_a b = 1 / (log_b a). Nilai ln e = 1 dan ln e^x = x."],"formula":"log_a(xy) = log_a x + log_a y   |   log_a(x/y) = log_a x - log_a y   |   log_a b = log_c b / log_c a","labId":"addm44_kalkulator_indeks_log_lab","labTitle":"Kalkulator Penukar Indeks <-> Logaritma & Tukar Asas","labProps":{"a":3,"x":2},"examTip":"Amaran kesilapan paling popular SPM: log_a(x + y) TIDAK SAMA dengan log_a x + log_a y! Dan log_a x / log_a y TIDAK SAMA dengan log_a(x/y)!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Identiti Logaritma Sah vs Palsu","voiceCaption":"Asingkan enam pernyataan logaritma berikut antara yang Sah mengikut hukum logaritma dengan yang Salah atau merupakan perangkap biasa.","voiceScript":"[curious] Elakkan perangkap paling kerap dalam S P M! Asingkan keenam-enam persamaan logaritma berikut kepada kategori Sah atau Salah.","prompt":"Isihkan pernyataan logaritma berikut kepada Hukum Sah atau Kesilapan Lazim (Salah):","buckets":[{"id":"sah","label":"Hukum Logaritma Sah"},{"id":"salah","label":"Kesilapan Lazim (Salah)"}],"items":[{"text":"log_2 (8x) = 3 + log_2 x","bucketId":"sah","note":"Betul! log_2(8) + log_2(x) = log_2(2^3) + log_2(x) = 3 + log_2 x."},{"text":"log_a (x + y) = log_a x + log_a y","bucketId":"salah","note":"SALAH! Tambah log ialah log(x * y), bukan log(x + y)."},{"text":"log_a (x^3 / y^2) = 3 log_a x - 2 log_a y","bucketId":"sah","note":"Tepat! Gabungan hukum bahagi dan hukum kuasa."},{"text":"(log_a x) / (log_a y) = log_a x - log_a y","bucketId":"salah","note":"SALAH! Itu sebenarnya ialah log_y x (hukum penukaran asas), bukan log_a(x/y)!"},{"text":"log_4 9 = (log_2 9) / (log_2 4) = log_2 3","bucketId":"sah","note":"Betul! 2 log_2 3 / 2 = log_2 3."},{"text":"log_5 (-25) = -2","bucketId":"salah","note":"SALAH! Logaritma bagi nombor negatif tidak tertakrif dalam nombor nyata."}],"explanation":"Sentiasa bezakan log(x/y) = log x - log y daripada (log x)/(log y) = log_y x!"},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Ungkapan Logaritma Tunggal","voiceCaption":"Padankan lima ungkapan logaritma dengan bentuk logaritma tunggal atau nilai tepatnya.","voiceScript":"[confident] Uji kemahiran menukar ungkapan panjang kepada satu logaritma tunggal! Padankan kelima-lima ungkapan ini.","prompt":"Padankan setiap ungkapan logaritma dengan bentuk teringkasnya:","pairs":[{"id":"a44u3m1","left":"log_2 x + 2 log_2 y","right":"log_2 (xy^2)"},{"id":"a44u3m2","left":"log_b x - 3 log_b y","right":"log_b (x / y^3)"},{"id":"a44u3m3","left":"2 + log_4 (punca(x)) - 3 log_4 y","right":"log_4 (16 * punca(x) / y^3)"},{"id":"a44u3m4","left":"log_3 5 * log_5 9","right":"2"},{"id":"a44u3m5","left":"3 ln e - ln 1","right":"3"}],"explanation":"Gunakan 2 = log_4(4^2) = log_4 16 untuk menggabung pemalar ke dalam logaritma tunggal; dan log_3 5 * log_5 9 = (ln 5/ln 3)*(ln 9/ln 5) = log_3 9 = 2."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Selesai Persamaan Logaritma","voiceCaption":"Cari nilai x yang memenuhi persamaan log asas dua bagi kurungan x tambah satu tambah log asas dua bagi tiga sama dengan log asas dua bagi lima belas.","voiceScript":"[confident] Selesaikan persamaan logaritma berikut dan pastikan nilai x yang diperoleh memenuhi syarat domain positif!","prompt":"Selesaikan persamaan log_2(x + 1) + log_2 3 = log_2 15.","options":["x = 4","x = 5","x = 11","x = 3"],"correctIndex":0,"explanation":"Gabungkan sebelah kiri menjadi log_2[3(x + 1)] = log_2 15 => 3(x + 1) = 15 => x + 1 = 5 => x = 4. Semakan: x + 1 = 5 > 0 (SAH)."}]},{"id":"addm44-u4","title":"Unit 4: Penyelesaian Persamaan & Aplikasi Logaritma","subtitle":"Subtopik 4.3–4.4 — Menyelasaikan a^x = b, Persamaan Log Jati (ln/e) & Masalah Pertumbuhan/Susutan/Desibel","iconType":"pendulum","iconUrl":"../assets/icons/addm44-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Persamaan Eksponen & Aplikasi","voiceCaption":"Persamaan eksponen dengan asas berbeza diselesaikan dengan mengambil logaritma sepuluh atau logaritma jati pada kedua-dua belah persamaan.","voiceScript":"[warm] Selamat datang ke Unit empat! Bagaimana menyelesaikan persamaan seperti empat kuasa dua x tolak satu sama dengan tujuh kuasa x apabila asas empat dan tujuh tidak boleh disamakan? Ambil log asas sepuluh atau log jati l n pada kedua-dua belah persamaan! Kemudian guna hukum kuasa untuk menurunkan indeks ke hadapan, kumpulkan semua sebutan ber x di kiri, dan faktorkan x! Bagi persamaan melibatkan pemalar e seperti tiga puluh e kuasa dua x sama dengan seratus empat puluh lima, guna log jati l n supaya l n e menjadi satu! Kaedah yang sama menyelesaikan masalah aplikasi faedah kompaun, susut nilai kereta, pereputan radioaktif dan pemanasan logam!","title":"4.4 Menyelesaikan a^x = b, Persamaan ln/e & Aplikasi Nyata","acronym":"L•T•F•S","hook":"Ambil log10 atau ln pada kedua-dua belah persamaan apabila asas tidak dapat disamakan!","mediaKey":"addm44_jam_atom_reput","summary":"Pengambilan logaritma menukarkan pemboleh ubah dalam indeks kepada pekali linear; logaritma jati (ln) menyingkirkan asas eksponen e melalui identiti ln(e) = 1.","bullets":["Menyelesaikan a^(px+q) = b^(rx): Ambil log10 pada kedua-dua belah => (px + q)log a = (rx)log b => kumpul sebutan x dan faktorkan x.","Menyelesaikan Persamaan e & ln: (1) Jika ln(4x - 2) = 5, tukar ke bentuk indeks e^5 = 4x - 2. (2) Jika 10e^(2x) = 35, bahagi 10 dulu => e^(2x) = 3.5 => ambil ln: 2x = ln 3.5 => x = (ln 3.5)/2.","Model Pertumbuhan & Susutan: Nilai kereta/suhu menyusut V = V0(1 - r)^n atau suhu meningkat T = 30(1.2)^x. Guna ketaksamaan logaritma untuk mencari bilangan tahun/saat integer minimum."],"formula":"a^x = b  =>  x = (log10 b)/(log10 a)   |   e^y = k  <==>  y = ln k","labId":"addm44_konjugat_eksponen_lab","labTitle":"Plot Simetri Lengkung Eksponen y = 2^x & Logaritma y = log_2 x","labProps":{"tab":"graf"},"examTip":"Semasa menyelesaikan ketaksamaan seperti (7/8)^n < 1/3, apabila membahagi kedua-dua belah dengan log(7/8) yang BERNILAI NEGATIF (kerana 7/8 < 1), WAJIB terbalikkan simbol '<' kepada '>'!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Langkah Ketaksamaan Susutan","voiceCaption":"Susun langkah mencari bilangan tahun apabila harga kereta susut nilai enam puluh ribu darab tujuh perlapan kuasa n menjadi kurang daripada dua puluh ribu ringgit.","voiceScript":"[confident] Perhatikan arah tanda ketaksamaan apabila membahagi dengan logaritma negatif! Susun empat langkah penyelesaian masalah susut nilai kereta buku teks ini.","prompt":"Susun langkah menyelesaikan 60000 * (7/8)^n < 20000 (Latihan Pengukuhan 7):","hint":"Bahagi dengan 60000 dahulu sebelum mengambil log10...","answerTokens":["Bahagi kedua-dua belah dengan 60000: (7/8)^n < 1/3","Ambil log10: n log(7/8) < log(1/3)","Bahagi dengan log(7/8) yang negatif sambil membalikkan tanda: n > log(1/3) / log(7/8)","Jadi n > 8.23, maka tahun penuh pertama ialah n = 9 tahun"],"distractors":["Kekalkan tanda < menjadi n < 8.23 kerana 7/8 positif","Tulis log(7/8)^n sebagai log(7) - log(8) + n"],"explanation":"Oleh sebab 0 < 7/8 < 1, nilai log10(7/8) = -0.0580 < 0! Membahagi ketaksamaan dengan nombor negatif wajib membalikkan '<' kepada '>' menjadi n > 8.23, iaitu tahun ke-9."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Syarat Domain Persamaan Log","voiceCaption":"Ramalkan nilai x yang sah bagi persamaan logaritma apabila memperoleh dua calon punca daripada persamaan kuadratik.","voiceScript":"[curious] Soalan perangkap klasik! Daripada persamaan log asas tiga kurungan x tambah enam tambah log asas tiga x sama dengan tiga, terbentuk kuadratik x kuasa dua tambah enam x tolak dua puluh tujuh sama dengan sifar dengan calon x sama dengan tiga dan negatif sembilan. Manakah jawapan yang sah?","hook":"Semak syarat log_a N hanya tertakrif apabila N > 0!","scenario":"Persamaan asal: log_3(x + 6) + log_3(x) = 3 menghasilkan x = 3 atau x = -9.","prompt":"Apakah penyelesaian yang sah bagi persamaan logaritma tersebut?","options":["x = 3 sahaja (x = -9 ditolak kerana log_3(-9) tidak tertakrif)","Kedua-dua x = 3 dan x = -9 adalah sah","x = -9 sahaja","Tiada penyelesaian nyata"],"correctIndex":0,"proofLabId":"addm44_konjugat_eksponen_lab","proofState":{"tab":"graf"},"explanation":"Graf y = log_a x hanya wujud pada domain x > 0! Apabila x = -9, kedua-dua log_3(-9) dan log_3(-3) tidak tertakrif, maka x = -9 wajib ditolak."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Kira Masa Penyusutan Suhu Logam","voiceCaption":"Hitung masa x dalam saat apabila suhu sebongkah logam menyusut daripada seratus darjah Celsius kepada lapan puluh satu darjah Celsius mengikut persamaan eksponen.","voiceScript":"[confident] Selesaikan masalah aplikasi penyusutan suhu ini! Suhu T sama dengan seratus darab sifar perpuluhan sembilan kuasa x. Berapakah masa x untuk suhu menyusut kepada lapan puluh satu darjah Celsius?","prompt":"Suhu logam menyusut mengikut T = 100(0.9)^x selepas x saat. Cari nilai x apabila T = 81 darjah Celsius.","options":["x = 2 saat","x = 3 saat","x = 1.9 saat","x = 9 saat"],"correctIndex":0,"explanation":"81 = 100(0.9)^x => (0.9)^x = 0.81 = (0.9)^2 => x = 2 saat."}]},{"id":"addm44-u5","title":"Unit 5: Cabaran Boss SPM — Indeks, Surd & Logaritma","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Ungkapan Algebra Logaritma, Persamaan Surd & Sistem Eksponen-Log","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Ungkapan Log Penukaran Asas","voiceCaption":"Soalan Boss pertama menguji keupayaan mengungkapkan log asas sembilan bagi dua puluh tujuh x per y kuasa dua dalam sebutan p dan q.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab empat! Soalan pertama menukar asas kepada asas tiga untuk mengungkapkan log asas sembilan bagi dua puluh tujuh x bahagi y kuasa dua dalam sebutan p dan q!","prompt":"Diberi log_3 x = p dan log_3 y = q. Ungkapkan log_9 (27x / y^2) dalam sebutan p dan q.","options":["(3 + p - 2q) / 2","3 + p - 2q","(27 + p - 2q) / 2","(3 + p + 2q) / 2"],"correctIndex":0,"explanation":"Tukar ke asas 3: log_3(27x / y^2) / log_3(9) = (log_3 27 + log_3 x - 2 log_3 y) / 2 = (3 + p - 2q) / 2."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Nilai Log & Pertukaran Asas","voiceCaption":"Ramalkan nilai log asas lapan bagi enam belas menggunakan hukum penukaran asas.","voiceScript":"[curious] Soalan Boss kedua! Tanpa kalkulator, ramalkan nilai tepat bagi log asas lapan bagi enam belas!","hook":"Tukar kedua-dua nombor 8 dan 16 kepada asas 2!","scenario":"Ungkapan logaritma ialah log_8 16.","prompt":"Apakah nilai tepat bagi log_8 16?","options":["4 / 3","2","3 / 4","1 / 2"],"correctIndex":0,"proofLabId":"addm44_kalkulator_indeks_log_lab","proofState":{"a":8,"x":1},"explanation":"log_8 16 = (log_2 16)/(log_2 8) = 4/3 (atau 8^x = 16 => 2^(3x) = 2^4 => x = 4/3)."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Persamaan Linear Bersurd","voiceCaption":"Susun langkah menyelesaikan persamaan bersurd punca lima darab x sama dengan punca tiga darab x tambah punca tujuh.","voiceScript":"[confident] Soalan Boss ketiga daripada Latihan Pengukuhan buku teks! Susun langkah mencari nilai x dalam bentuk pecahan bernisbah bagi punca lima x sama dengan punca tiga x tambah punca tujuh.","prompt":"Susun langkah mencari x dalam bentuk punca(a)/b bagi punca(5)x = punca(3)x + punca(7):","hint":"Kumpulkan sebutan x di kiri dan faktorkan x...","answerTokens":["Kumpul dan faktorkan x: x(punca(5) - punca(3)) = punca(7)","Bahagi untuk dapat x = punca(7) / (punca(5) - punca(3))","Darab konjugat (punca(5) + punca(3)) pada pengangka dan penyebut","Permudahkan menjadi x = (punca(35) + punca(21)) / 2"],"distractors":["Gabungkan punca(5) - punca(3) menjadi punca(2)","Kuasa duakan terus menjadi 5x^2 = 3x^2 + 7"],"explanation":"Berhati-hati: punca(5) - punca(3) BUKAN punca(2)! Faktorkan x dan nisbahkan penyebut menggunakan konjugat (punca(5) + punca(3)), memberi penyebut 5 - 3 = 2."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Identiti Indeks-Surd-Log","voiceCaption":"Padankan empat ungkapan gabungan indeks, surd dan logaritma dengan nilai tepatnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat ungkapan ringkas ini dengan nilainya yang tepat.","prompt":"Padankan setiap ungkapan dengan nilai tepatnya:","pairs":[{"id":"a44b4m1","left":"log_x a + log_x (1/a)","right":"0"},{"id":"a44b4m2","left":"e^(ln 7)","right":"7"},{"id":"a44b4m3","left":"(punca(5) + 2)(punca(5) - 2)","right":"1"},{"id":"a44b4m4","left":"2^(log_2 9)","right":"9"}],"explanation":"log_x(a * 1/a) = log_x 1 = 0; a^(log_a k) = k kerana eksponen dan logaritma ialah fungsi songsang antara satu sama lain."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Sistem Eksponen & Log","voiceCaption":"Selesaikan sistem serentak persamaan eksponen dan logaritma daripada buku teks untuk mencari nilai x dan y.","voiceScript":"[excited] Soalan Boss terakhir Bab empat daripada Latihan Pengukuhan buku teks! Selesaikan serentak tiga darab sembilan kuasa x sama dengan dua puluh tujuh kuasa y, dan log asas dua bagi y sama dengan dua tambah log asas dua kurungan x tolak dua!","prompt":"Selesaikan persamaan serentak 3(9^x) = 27^y dan log_2 y = 2 + log_2(x - 2).","options":["x = 5/2, y = 2","x = 3, y = 4","x = 2, y = 5/2","x = 4, y = 3"],"correctIndex":0,"explanation":"Persamaan 1: 3 * 3^(2x) = 3^(3y) => 2x + 1 = 3y. Persamaan 2: log_2 y = log_2 4 + log_2(x - 2) => y = 4(x - 2) = 4x - 8. Ganti y: 2x + 1 = 3(4x - 8) = 12x - 24 => 10x = 25 => x = 5/2, dan y = 4(2.5) - 8 = 2."}]}]};</script>

        ].join("");
      }

      shell.innerHTML = [

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        });

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
