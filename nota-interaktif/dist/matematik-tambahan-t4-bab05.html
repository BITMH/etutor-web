/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab05","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":5,"title":"Janjang","subtitle":"Subtopik 5.1–5.2 KSSM — Janjang Aritmetik (Beza Sepunya d, Tn, Sn & Tn = Sn - S(n-1)), Janjang Geometri (Nisbah Sepunya r, Tn, Sn), Hasil Tambah Ketakterhinggaan S_inf & Perpuluhan Berulang.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab05-labs.js","coverIcon":"../assets/icons/addm45-u1.jpg","editionBadge":"Edisi Simulasi & Kalkulator Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan rumus janjang aritmetik dan geometri kamu sangat mantap!","combo":"[laughs warmly] Kombo yang sangat cemerlang! [excited] Beza sepunya, nisbah sepunya dan ketakterhinggaan kamu takluki dengan pantas!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula beza antara T n dengan S n atau syarat mutlak r kurang daripada satu.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab lima berjaya kamu selesaikan!"},"units":[{"id":"addm45-u1","title":"Unit 1: Janjang Aritmetik — Beza Sepunya & Sebutan Ke-n","subtitle":"Subtopik 5.1 — Mengenal Pasti Janjang Aritmetik (d = T2 - T1), Terbitan & Aplikasi Rumus Tn = a + (n - 1)d","iconType":"graph","iconUrl":"../assets/icons/addm45-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Janjang Aritmetik & Rumus Tn","voiceCaption":"Janjang aritmetik ialah jujukan dengan beza antara dua sebutan berturutan adalah pemalar tetap d, dan sebutan ke-n diberi oleh a tambah kurungan n tolak satu darab d.","voiceScript":"[warm] Selamat datang ke Bab lima, Janjang! Dalam subtopik lima perpuluhan satu, janjang aritmetik ialah jujukan nombor di mana setiap sebutan baharu terhasil dengan menambah satu nombor tetap yang digelar beza sepunya d! Untuk membuktikan suatu jujukan ialah janjang aritmetik, wajib tunjukkan T dua tolak T satu sama dengan T tiga tolak T dua sama dengan pemalar d — jangan uji satu pasangan sahaja! Sebutan ke n diberi oleh rumus T n sama dengan a tambah kurungan n tolak satu darab d, di mana a ialah sebutan pertama! Terokai carta tangga bar di bawah untuk melihat bagaimana perubahan a dan d membentuk jujukan aritmetik!","title":"5.1 Mengenal Pasti Janjang Aritmetik & Rumus Tn","acronym":"A•D•T","hook":"Ubah nilai sebutan pertama a dan beza sepunya d untuk melihat tangga sebutan menaik atau menurun!","mediaKey":"addm45_sarang_lebah_janjang","videoClip":{"src":"../assets/matematik-tambahan-t4-bab05/video/addm45_video_janjang_narasi.mp4","hasNarration":true,"posterKey":"addm45_sarang_lebah_janjang","caption":"Video Penerangan Bersuara (BM): Perbandingan janjang aritmetik (beza sepunya d) dan janjang geometri (nisbah sepunya r & hasil tambah ketakterhinggaan)"},"summary":"Janjang aritmetik mempunyai beza sepunya tetap d = Tk - T(k-1) dengan sebutan ke-n diberi oleh Tn = a + (n - 1)d.","bullets":["Takrif & Ujian Janjang Aritmetik (JA): Suatu jujukan T1, T2, T3, ... ialah JA jika T2 - T1 = T3 - T2 = d (pemalar). Nilai d boleh positif, negatif, pecahan, surd (cth. 3*punca(3)), atau ungkapan algebra (p - q).","Rumus Sebutan Ke-n: Tn = a + (n - 1)d, dengan a = T1 (sebutan pertama), d = beza sepunya, dan n = bilangan sebutan (integer positif).","Soalan 3 Sebutan Berturutan: Jika x, y, z ialah tiga sebutan berturutan dalam JA, terus guna persamaan y - x = z - y (atau 2y = x + z)!"],"formula":"d = T2 - T1 = T3 - T2   |   Tn = a + (n - 1)d","labId":"addm45_janjang_aritmetik_lab","labTitle":"Visualisator Tangga Bar Janjang Aritmetik","labProps":{"a":4,"d":3,"n":6},"examTip":"Semasa mencari bilangan sebutan n yang memenuhi syarat seperti 'sebutan pertama yang melebihi 500' (Tn > 500), selesaikan ketaksamaan linear untuk n dan bundarkan KE ATAS kepada integer seterusnya!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Janjang Aritmetik vs Bukan","voiceCaption":"Asingkan enam jujukan berikut antara Janjang Aritmetik yang mempunyai beza sepunya tetap dengan Bukan Janjang Aritmetik.","voiceScript":"[curious] Uji mata tajam kamu menyemak beza sepunya! Asingkan keenam-enam jujukan nombor dan algebra ini kepada Janjang Aritmetik atau Bukan Janjang Aritmetik.","prompt":"Kelaskan jujukan berikut kepada Janjang Aritmetik atau Bukan Janjang Aritmetik:","buckets":[{"id":"ja","label":"Janjang Aritmetik (d tetap)"},{"id":"bukan","label":"Bukan Janjang Aritmetik"}],"items":[{"text":"5, 19, 33, 47, ... (d = +14)","bucketId":"ja","note":"Betul! Beza sepunya sentiasa +14."},{"text":"8.2, 5.7, 3.2, 1.7, -0.8","bucketId":"bukan","note":"Perangkap Latihan Intensif 5.1! 5.7 - 8.2 = -2.5, tetapi 1.7 - 3.2 = -1.5 (tidak sama!)."},{"text":"punca(3), 4*punca(3), 7*punca(3), 10*punca(3)","bucketId":"ja","note":"Tepat! Setiap sebutan bertambah sebanyak d = 3*punca(3)."},{"text":"log_a 2, log_a 16, log_a 128, ...","bucketId":"ja","note":"Hebat! Beza ialah log_a(16/2) = log_a(8) = log_a(128/16), d = log_a 2^3!"},{"text":"2, 6, 18, 54, ...","bucketId":"bukan","note":"Betul! Bezanya 4, 12, 36 tidak sama — ini ialah Janjang Geometri."},{"text":"2x - 1, 3x + 2, 4x + 5","bucketId":"ja","note":"Tepat! Beza sepunya ialah x + 3 bagi kedua-dua pasangan."}],"explanation":"Sentiasa uji sekurang-kurangnya dua pasangan beza (T2 - T1 dan T3 - T2, serta T4 - T3 jika diberi)! Jujukan 8.2, 5.7, 3.2, 1.7, -0.8 daripada buku teks gagal pada pasangan ketiga."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Langkah Bilangan Sebutan JA","voiceCaption":"Susun langkah mencari bilangan sebutan bagi janjang aritmetik negatif sifar perpuluhan satu dua, sifar perpuluhan sifar tujuh, sifar perpuluhan dua enam hingga satu perpuluhan sembilan tujuh.","voiceScript":"[confident] Susun empat langkah untuk menentukan bilangan sebutan n dalam janjang aritmetik perpuluhan ini!","prompt":"Susun langkah mencari bilangan sebutan n bagi JA: -0.12, 0.07, 0.26, ..., 1.97:","hint":"Kenal pasti nilai a, d dan sebutan terakhir Tn dahulu...","answerTokens":["Kenal pasti a = -0.12 dan d = 0.07 - (-0.12) = 0.19","Gantikan ke dalam rumus Tn = a + (n - 1)d = 1.97","Selesaikan -0.12 + 0.19(n - 1) = 1.97 menjadi 0.19(n - 1) = 2.09","Bahagi dengan 0.19 untuk mendapat n - 1 = 11, maka n = 12"],"distractors":["Kira d = -0.12 - 0.07 = -0.19","Guna rumus hasil tambah Sn = 1.97"],"explanation":"Beza sepunya d = T2 - T1 = 0.07 - (-0.12) = +0.19. Maka -0.12 + (n - 1)(0.19) = 1.97 => 0.19(n - 1) = 2.09 => n - 1 = 11 => n = 12."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Cari Pemalar Tiga Sebutan JA","voiceCaption":"Cari nilai x dan beza sepunya jika negatif dua x tolak satu, tiga x tambah dua dan sembilan x tambah tiga ialah tiga sebutan berturutan janjang aritmetik.","voiceScript":"[confident] Soalan Latihan Pengukuhan buku teks! Tiga sebutan berturutan bagi janjang aritmetik ialah negatif dua x tolak satu, tiga x tambah dua, dan sembilan x tambah tiga. Berapakah beza sepunyanya?","prompt":"Tiga sebutan berturutan suatu janjang aritmetik ialah -2x - 1, 3x + 2 dan 9x + 3. Cari beza sepunya janjang ini.","options":["13","2","8","21"],"correctIndex":0,"explanation":"T2 - T1 = T3 - T2 => (3x + 2) - (-2x - 1) = (9x + 3) - (3x + 2) => 5x + 3 = 6x + 1 => x = 2. Maka beza sepunya d = 5(2) + 3 = 13."}]},{"id":"addm45-u2","title":"Unit 2: Hasil Tambah Janjang Aritmetik & Aplikasi","subtitle":"Subtopik 5.1 — Rumus Sn = (n/2)[2a + (n-1)d] & (n/2)(a + l), Hubungan Emas Tn = Sn - S(n-1) & Aplikasi","iconType":"formula","iconUrl":"../assets/icons/addm45-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Rumus Sn & Hubungan Tn = Sn - S(n-1)","voiceCaption":"Hasil tambah n sebutan pertama janjang aritmetik dikira menggunakan dua bentuk rumus S n, manakala sebutan ke-n boleh diperoleh terus melalui beza S n tolak S n tolak satu.","voiceScript":"[warm] Selamat datang ke Unit dua! Mari kuasai rumus hasil tambah n sebutan pertama S n bagi janjang aritmetik! Ada dua rumus kembar: apabila d diketahui, guna S n sama dengan n per dua kurungan dua a tambah kurungan n tolak satu darab d; apabila sebutan terakhir l diketahui, guna rumus pendek S n sama dengan n per dua kurungan a tambah l! Satu lagi hubungan wajib hafal untuk Kertas satu ialah T n sama dengan S n tolak S n tolak satu, yang berlaku untuk semua janjang! Contohnya, untuk mencari sebutan ke tujuh apabila rumus S n diberi, cukup kira S tujuh tolak S enam!","title":"Hasil Tambah n Sebutan Pertama (Sn) & Hubungan Tn = Sn - S(n-1)","acronym":"S•L•T=S-S","hook":"Sahkan identiti Tn = Sn - S(n-1) pada Visualisator Tangga Bar selepas memilih sebarang a, d dan n!","summary":"Hasil tambah JA diberi oleh Sn = (n/2)[2a + (n - 1)d] atau (n/2)(a + l); apabila ungkapan Sn diberi dalam soalan, Tn = Sn - S(n-1) dan a = S1.","bullets":["Dua Rumus Hasil Tambah JA: (1) Sn = (n/2)[2a + (n - 1)d]; (2) Sn = (n/2)(a + l), di mana l = Tn ialah sebutan terakhir.","Hubungan Universal Tn & Sn: T1 = a = S1, dan bagi n >= 2, Tn = Sn - S(n - 1). Hasil tambah daripada sebutan ke-m hingga ke-k ialah Sk - S(m - 1)!","Aplikasi Harian (Buku Teks): Susunan kerusi bertingkat (tinggi pertama 80 cm + 4 cm setiap kerusi tambahan), jumlah simpanan gaji berkala, atau jumlah panjang pagar/dawai."],"formula":"Sn = (n/2)[2a + (n - 1)d] = (n/2)(a + l)   |   Tn = Sn - S(n - 1)","labId":"addm45_janjang_aritmetik_lab","labTitle":"Uji Sn dan Tn = Sn - S(n-1) Secara Langsung","labProps":{"a":4,"d":3,"n":7},"examTip":"Perangkap mencari hasil tambah dari sebutan ke-5 hingga sebutan ke-12: Ia BUKAN S12 - S5! Anda mesti tolak S4 supaya T5 masih termasuk, iaitu S12 - S4."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Hasil Tambah daripada T5 hingga T10","voiceCaption":"Ramalkan hasil tambah daripada sebutan kelima hingga sebutan kesepuluh bagi janjang aritmetik empat, tujuh, sepuluh dan seterusnya.","voiceScript":"[curious] Uji teknik mencari hasil tambah julat sebutan tengah! Diberi janjang aritmetik empat, tujuh, sepuluh dan seterusnya, bagaimanakah cara mengira hasil tambah daripada sebutan kelima hingga sebutan kesepuluh?","hook":"Ingat: untuk mengekalkan T5 dalam jumlah, tolak S4 daripada S10!","scenario":"Janjang aritmetik: 4, 7, 10, 13, ... (a = 4, d = 3).","prompt":"Apakah ungkapan dan nilai bagi hasil tambah dari sebutan ke-5 hingga ke-10?","options":["S10 - S4 = 175 - 34 = 141","S10 - S5 = 175 - 50 = 125","S10 + S5 = 225","T10 - T5 = 15"],"correctIndex":0,"proofLabId":"addm45_janjang_aritmetik_lab","proofState":{"a":4,"d":3,"n":10},"explanation":"S10 = (10/2)[8 + 9(3)] = 175, manakala S4 = (4/2)[8 + 3(3)] = 34. Jumlah dari T5 hingga T10 ialah S10 - S4 = 175 - 34 = 141."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Rumus Sn & Kuantiti JA","voiceCaption":"Padankan empat maklumat janjang aritmetik berikut dengan jawapan tepatnya.","voiceScript":"[confident] Padankan setiap soalan ringkas janjang aritmetik di kiri dengan nilai jawapannya di kanan.","prompt":"Padankan maklumat janjang aritmetik berikut dengan nilai yang betul:","pairs":[{"id":"a45u2m1","left":"JA: a = -10, d = 6; cari S100","right":"28 700"},{"id":"a45u2m2","left":"JA: n = 42, S42 = 5 838, l = -22; cari a","right":"300"},{"id":"a45u2m3","left":"Diberi Sn = 3n^2 + 2n; cari a (T1)","right":"5"},{"id":"a45u2m4","left":"Diberi Sn = 3n^2 + 2n; cari beza sepunya d","right":"6"}],"explanation":"S100 = 50[-20 + 99(6)] = 28 700; 5838 = 21(a - 22) => a - 22 = 278 => a = 300. Bagi Sn = 3n^2 + 2n: T1 = S1 = 5; S2 = 16 => T2 = 16 - 5 = 11 => d = 11 - 5 = 6."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Aplikasi Susunan Kerusi JA","voiceCaption":"Hitung bilangan kerusi maksimum yang boleh disusun menegak di dalam stor setinggi tiga meter.","voiceScript":"[confident] Selesaikan masalah stor kerusi Latihan Pengukuhan buku teks! Tinggi satu kerusi ialah lapan puluh sentimeter dan setiap kerusi tambahan menaikkan ketinggian sebanyak empat sentimeter. Berapakah bilangan kerusi maksimum dalam stor setinggi tiga meter?","prompt":"Tinggi kerusi pertama ialah 80 cm dan setiap kerusi berikutnya menambah 4 cm. Cari bilangan kerusi maksimum yang muat dalam stor setinggi 3 m (300 cm).","options":["56 kerusi","55 kerusi","75 kerusi","54 kerusi"],"correctIndex":0,"explanation":"a = 80, d = 4. Syarat Tn <= 300: 80 + (n - 1)(4) <= 300 => 4(n - 1) <= 220 => n - 1 <= 55 => n <= 56 kerusi."}]},{"id":"addm45-u3","title":"Unit 3: Janjang Geometri — Nisbah Sepunya, Tn & Sn","subtitle":"Subtopik 5.2 — Mengenal Pasti JG (r = T2/T1), Rumus Sebutan Ke-n (ar^(n-1)) & Hasil Tambah n Sebutan (Sn)","iconType":"atom","iconUrl":"../assets/icons/addm45-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Janjang Geometri: r, Tn & Sn","voiceCaption":"Janjang geometri terhasil dengan mendarab sebutan sebelumnya dengan pemalar nisbah sepunya r, dan menggunakan logaritma apabila mencari nilai indeks n.","voiceScript":"[warm] Selamat datang ke Unit tiga, Janjang Geometri! Jika janjang aritmetik menggunakan operasi tambah dengan beza sepunya d, janjang geometri pula menggunakan operasi DARAB dengan nisbah sepunya r, iaitu T dua bahagi T satu sama dengan T tiga bahagi T dua! Sebutan ke n diberi oleh T n sama dengan a darab r kuasa n tolak satu! Untuk mencari bilangan sebutan n daripada persamaan seperti satu perpuluhan lima kuasa n tolak satu lebih besar daripada dua puluh lima, gunakan logaritma! Bagi hasil tambah S n, pilih rumus a kurungan satu tolak r kuasa n bahagi satu tolak r apabila nilai mutlak r kurang daripada satu, atau a kurungan r kuasa n tolak satu bahagi r tolak satu apabila lebih besar daripada satu, supaya penyebut sentiasa positif!","title":"5.2 Janjang Geometri: Nisbah Sepunya r, Rumus Tn & Sn","acronym":"R•A•R•L","hook":"Pilih rumus Sn dengan penyebut positif (1 - r bagi |r| < 1, atau r - 1 bagi |r| > 1) untuk mengelak ralat tanda!","summary":"Janjang geometri mempunyai nisbah sepunya tetap r = Tk / T(k-1) dengan Tn = ar^(n-1) dan Sn = a(r^n - 1)/(r - 1) bagi r != 1.","bullets":["Mengenal Pasti JG: T2 / T1 = T3 / T2 = r (pemalar, r != 0, r != 1). Contoh r negatif: 4, -20, 100, -500 mempunyai r = -5 (tanda berselang-seli).","Rumus Sebutan Ke-n & Tiga Sebutan Berturutan: Tn = a * r^(n - 1). Jika x, y, z tiga sebutan berturutan dalam JG, gunakan y / x = z / y iaitu y^2 = xz!","Rumus Hasil Tambah n Sebutan Pertama (r != 1): Sn = a(1 - r^n)/(1 - r) jika |r| < 1; Sn = a(r^n - 1)/(r - 1) jika |r| > 1."],"formula":"r = T2/T1   |   Tn = a * r^(n - 1)   |   Sn = a(r^n - 1)/(r - 1)  (r != 1)","labId":"addm45_janjang_geometri_inf_lab","labTitle":"Simulator Janjang Geometri (Ubah Nilai r)","labProps":{"a":12,"r":1.5},"examTip":"Kesilapan lazim kuasa negatif: Bagi r = -5 dan n = 5, T5 = 4 * (-5)^4 = 4 * (+625) = +2500. Sentiasa letakkan kurungan pada r negatif dalam kalkulator: (-5)^4, BUKAN -5^4!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih JA vs JG vs Bukan Kedua-duanya","voiceCaption":"Kelaskan enam jujukan berikut kepada Janjang Aritmetik, Janjang Geometri atau Bukan Kedua-duanya.","voiceScript":"[curious] Bezakan ketiga-tiga keluarga jujukan ini! Kelaskan enam jujukan berikut kepada Janjang Aritmetik, Janjang Geometri atau Bukan Kedua-duanya.","prompt":"Isihkan setiap jujukan nombor atau ungkapan berikut ke dalam kategori yang tepat:","buckets":[{"id":"ja","label":"Janjang Aritmetik (Beza Tetap)"},{"id":"jg","label":"Janjang Geometri (Nisbah Tetap)"},{"id":"bukan","label":"Bukan Kedua-duanya"}],"items":[{"text":"2, 2/3, 2/9, 2/27, ...","bucketId":"jg","note":"Betul! Nisbah sepunya r = 1/3."},{"text":"-25/3, 5/3, -1/3, 1/15, ...","bucketId":"jg","note":"Tepat! Nisbah sepunya r = -1/5."},{"text":"1, 4, 9, 16, 25, ...","bucketId":"bukan","note":"Betul! Ini jujukan kuasa dua sempurna (beza 3,5,7; nisbah 4, 9/4)."},{"text":"12, 7, 2, -3, ...","bucketId":"ja","note":"Tepat! Beza sepunya d = -5."},{"text":"0.12, 0.0012, 0.000012, ...","bucketId":"jg","note":"Betul! Nisbah sepunya r = 0.01 (Contoh 13 buku teks)."},{"text":"1, 1, 2, 3, 5, 8, ... (Fibonacci)","bucketId":"bukan","note":"Tepat! Tiada d atau r yang tetap."}],"explanation":"JG mempunyai hasil bahagi berturutan tetap r, JA mempunyai hasil tolak berturutan tetap d, manakala jujukan kuasa dua dan Fibonacci bukan kedua-duanya."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Langkah Cari n dalam JG","voiceCaption":"Susun langkah mencari bilangan sebutan apabila diberi hasil tambah janjang geometri tiga ribu lima ratus, tujuh ratus, seratus empat puluh ialah empat ribu tiga ratus enam puluh lapan.","voiceScript":"[confident] Susun empat langkah algebra dan logaritma ini untuk mencari bilangan sebutan n dalam janjang geometri!","prompt":"Susun langkah mencari n jika Sn bagi JG 3 500, 700, 140, ... ialah 4 368:","hint":"Cari nisbah sepunya r = 700 / 3500 dahulu...","answerTokens":["Kenal pasti a = 3500 dan r = 700/3500 = 0.2","Guna rumus Sn: 3500(1 - 0.2^n) / (1 - 0.2) = 4368","Permudah kepada 1 - 0.2^n = 0.9984 => 0.2^n = 0.0016","Tukar kepada 0.2^n = 0.2^4 (atau guna log), maka n = 4"],"distractors":["Guna rumus Tn = 4368 untuk mencari n","Kira r = 3500 - 700 = 2800"],"explanation":"4368 * 0.8 / 3500 = 0.9984 => 0.2^n = 1 - 0.9984 = 0.0016 = 0.2^4, maka n = 4."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kira T5 bagi JG Berselang Tanda","voiceCaption":"Cari nisbah sepunya dan sebutan kelima bagi janjang geometri empat, negatif dua puluh, seratus, negatif lima ratus.","voiceScript":"[confident] Selesaikan Contoh sebelas buku teks: cari nisbah sepunya dan sebutan kelima bagi janjang geometri empat, negatif dua puluh, seratus, negatif lima ratus.","prompt":"Cari nisbah sepunya r dan sebutan ke-5 bagi janjang geometri 4, -20, 100, -500, ...","options":["r = -5, T5 = 2 500","r = -5, T5 = -2 500","r = 5, T5 = 2 500","r = -1/5, T5 = 4/625"],"correctIndex":0,"explanation":"r = -20 / 4 = -5. Maka T5 = 4 * (-5)^(5 - 1) = 4 * (-5)^4 = 4 * 625 = +2 500."}]},{"id":"addm45-u4","title":"Unit 4: Hasil Tambah Ketakterhinggaan & Aplikasi JG","subtitle":"Subtopik 5.2 — Syarat Penumpuan |r| < 1, Rumus S_inf = a/(1 - r), Perpuluhan Berulang & Faedah Kompaun","iconType":"pendulum","iconUrl":"../assets/icons/addm45-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Hasil Tambah Ketakterhinggaan S_inf","voiceCaption":"Apabila nilai mutlak nisbah sepunya r kurang daripada satu, janjang geometri menumpu dan mempunyai hasil tambah ketakterhinggaan a bahagi kurungan satu tolak r.","voiceScript":"[warm] Selamat datang ke Unit empat, Hasil Tambah Ketakterhinggaan! Apabila nisbah sepunya r terletak di antara negatif satu dan positif satu, iaitu nilai mutlak r kurang daripada satu, setiap sebutan baharu menjadi semakin kecil menghampiri sifar! Oleh itu, nilai r kuasa n menghampiri sifar apabila n menuju ketakterhinggaan, dan rumus hasil tambah diringkaskan kepada S infiniti sama dengan a bahagi satu tolak r! Rumus hebat ini membolehkan kita menukar sebarang perpuluhan berulang seperti sifar perpuluhan lima enam tiga enam tiga berulang menjadi pecahan termudah! Uji batas penumpuan pada simulator di bawah!","title":"Hasil Tambah Ketakterhinggaan (S_inf) & Perpuluhan Berulang","acronym":"|r|<1 • S∞","hook":"Gerakkan slider r melepasi 1.0 untuk melihat janjang berhenti menumpu dan menjadi mencapah!","mediaKey":"addm45_fraktal_geometri","summary":"Janjang geometri dengan |r| < 1 menumpu kepada hasil tambah ketakterhinggaan S_inf = a/(1 - r), digunakan untuk menukar perpuluhan berulang kepada pecahan dan masalah geometri berulang.","bullets":["Syarat Penumpuan (-1 < r < 1, r != 0): Apabila |r| < 1, r^n -> 0 apabila n -> inf. Maka S_inf = a / (1 - r). Jika |r| >= 1, hasil tambah ketakterhinggaan TIDAK WUJUD.","Menukar Perpuluhan Berulang (Contoh 18): Asingkan bahagian tak berulang (jika ada) daripada bahagian berulang. Cth. 0.56363... = 0.5 + (0.063 + 0.00063 + ...), guna a = 0.063 dan r = 0.01.","Aplikasi Faedah Kompaun / Pertumbuhan Berperatus: Simpanan dengan faedah k% setahun membentuk JG dengan nisbah sepunya r = 1 + k/100 (cth. faedah 5% -> r = 1.05). Perhatikan: selepas 18 tahun, kuasa ialah n = 18!"],"formula":"S_inf = a / (1 - r)   (syarat mutlak: |r| < 1)","labId":"addm45_janjang_geometri_inf_lab","labTitle":"Simulator Penumpuan Ketakterhinggaan (|r| < 1 vs |r| >= 1)","labProps":{"a":45,"r":0.2},"examTip":"Hati-hati dalam soalan faedah kompaun bank! Pada awal tahun 1 wang asal ialah P (T0). Selepas 1 tahun nilainya P(1 + k); selepas n tahun nilainya ialah P(1 + k)^n (BUKAN n - 1!)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Status Penumpuan JG","voiceCaption":"Ramalkan sama ada janjang geometri dengan nisbah sepunya satu perpuluhan lima mempunyai hasil tambah ketakterhinggaan terhingga atau tidak.","voiceScript":"[curious] Cuba ramalkan kelakuan janjang geometri apabila nisbah sepunyanya ialah satu perpuluhan lima! Adakah janjang ini menumpu kepada satu nilai atau mencapah?","hook":"Sahkan perbezaan r = 0.5 berbanding r = 1.5 dalam simulator di atas!","scenario":"Satu janjang geometri mempunyai a = 12 dan r = 1.5.","prompt":"Apakah status bagi hasil tambah ketakterhinggaan janjang ini?","options":["Tidak wujud (mencapah ke ketakterhinggaan) kerana syarat |r| < 1 dilanggar","Menumpu kepada S_inf = 12 / (1 - 1.5) = -24","Menumpu kepada S_inf = 12 / (1.5 - 1) = 24","Sama dengan jumlah 10 sebutan pertama"],"correctIndex":0,"proofLabId":"addm45_janjang_geometri_inf_lab","proofState":{"a":12,"r":1.5},"explanation":"Jangan sesekali terus masukkan r = 1.5 ke dalam rumus a/(1 - r)! Rumus S_inf = a/(1 - r) hanya sah jika -1 < r < 1. Kerana r = 1.5 > 1, sebutan membesar tanpa had."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Jujukan dengan S_inf","voiceCaption":"Padankan empat janjang geometri dengan nilai hasil tambah ketakterhinggaannya.","voiceScript":"[confident] Uji pengiraan pantas rumus S infiniti sama dengan a bahagi satu tolak r! Padankan keempat-empat janjang geometri ini.","prompt":"Padankan setiap janjang geometri dengan hasil tambah ketakterhinggaannya:","pairs":[{"id":"a45u4m1","left":"45, 9, 1.8, ...","right":"56.25"},{"id":"a45u4m2","left":"24, -12, 6, -3, ...","right":"16"},{"id":"a45u4m3","left":"0.7 + 0.07 + 0.007 + ... (0.777...)","right":"7 / 9"},{"id":"a45u4m4","left":"S_inf = 4 480 dengan r = 1/2; cari a","right":"2 240"}],"explanation":"Bagi 24, -12, 6, ...: r = -1/2, maka S_inf = 24 / (1 - (-1/2)) = 24 / 1.5 = 16. Bagi 0.777...: 0.7 / (1 - 0.1) = 7/9."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cari Tiga Sebutan Berturutan JG","voiceCaption":"Cari nilai x yang mungkin jika x, dua x tambah tiga dan sepuluh x tolak tiga ialah tiga sebutan berturutan janjang geometri.","voiceScript":"[confident] Selesaikan soalan Latih Diri buku teks: tiga sebutan berturutan suatu janjang geometri ialah x, dua x tambah tiga, dan sepuluh x tolak tiga. Cari nilai x yang mungkin!","prompt":"Tiga sebutan berturutan bagi suatu janjang geometri ialah x, 2x + 3 dan 10x - 3. Cari nilai-nilai x yang mungkin.","options":["x = 3 atau x = -1/2","x = -3 atau x = 1/2","x = 3 atau x = 1/2","x = 6 atau x = -1"],"correctIndex":0,"explanation":"Guna T2/T1 = T3/T2 => (2x + 3)^2 = x(10x - 3) => 4x^2 + 12x + 9 = 10x^2 - 3x => 6x^2 - 15x - 9 = 0 => 2x^2 - 5x - 3 = 0 => (2x + 1)(x - 3) = 0 => x = -1/2 atau x = 3."}]},{"id":"addm45-u5","title":"Unit 5: Cabaran Boss SPM — Janjang","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Gabungan JA & JG, Perpuluhan Berulang, Sn - S(n-1) & Ketakterhinggaan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Cari T5 daripada Rumus Sn","voiceCaption":"Soalan Boss pertama meminta sebutan kelima apabila diberi rumus hasil tambah n sebutan pertama S n sama dengan dua n kuasa dua tambah tiga n.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab lima! Soalan pertama menguji hubungan emas T lima sama dengan S lima tolak S empat apabila diberi S n sama dengan dua n kuasa dua tambah tiga n!","prompt":"Hasil tambah n sebutan pertama suatu janjang aritmetik diberi oleh Sn = 2n^2 + 3n. Cari nilai sebutan ke-5 (T5).","options":["21","65","44","25"],"correctIndex":0,"explanation":"T5 = S5 - S4 = [2(25) + 3(5)] - [2(16) + 3(4)] = (50 + 15) - (32 + 12) = 65 - 44 = 21."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: S_inf daripada Dua Maklumat","voiceCaption":"Ramalkan nilai hasil tambah ketakterhinggaan bagi janjang geometri jika S infiniti ialah tiga puluh satu setengah dan hasil tambah dua sebutan pertama ialah dua puluh lapan.","voiceScript":"[curious] Soalan Boss kedua daripada Contoh tujuh belas buku teks! Hasil tambah ketakterhinggaan ialah tiga puluh satu perpuluhan lima dan hasil tambah dua sebutan pertama ialah dua puluh lapan. Berapakah nisbah sepunya r jika r bernilai positif?","hook":"Bahagikan S2 = a(1 - r^2)/(1 - r) dengan S_inf = a/(1 - r) untuk menghapuskan a!","scenario":"Suatu janjang geometri mempunyai S_inf = 31.5 dan T1 + T2 = 28 dengan r > 0.","prompt":"Apakah nilai nisbah sepunya r bagi janjang geometri tersebut?","options":["r = 1/3","r = 2/3","r = 1/9","r = 1/2"],"correctIndex":0,"proofLabId":"addm45_janjang_geometri_inf_lab","proofState":{"a":21,"r":0.3333},"explanation":"S2 = a(1 - r^2)/(1 - r) = S_inf * (1 - r^2). Maka 28 = 31.5(1 - r^2) => 1 - r^2 = 28/31.5 = 8/9 => r^2 = 1/9. Kerana r > 0, r = 1/3 (dan a = 21)."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Perpuluhan Berulang kepada Pecahan","voiceCaption":"Susun langkah menukar perpuluhan berulang sifar perpuluhan lima enam tiga enam tiga kepada pecahan termudah menggunakan janjang geometri ketakterhinggaan.","voiceScript":"[confident] Soalan Boss ketiga daripada Contoh lapan belas buku teks! Susun langkah menukar perpuluhan berulang sifar perpuluhan lima enam tiga enam tiga kepada pecahan termudah!","prompt":"Susun langkah mengungkapkan 0.5636363... dalam bentuk pecahan termudah:","hint":"Asingkan 0.5 yang tidak berulang daripada janjang berulang 0.063 + 0.00063...","answerTokens":["Pisahkan kepada 0.5 + (0.063 + 0.00063 + 0.0000063 + ...)","Kenal pasti JG berulang: a = 0.063 dan r = 0.01","Kira S_inf = 0.063 / (1 - 0.01) = 63/990 = 7/110","Jumlahkan 1/2 + 7/110 = 62/110 = 31/55"],"distractors":["Anggap a = 0.563 dan r = 0.1 terus","Guna rumus Janjang Aritmetik S_n"],"explanation":"Hanya digit '63' yang berulang selepas '0.5', maka 0.5 = 1/2 diasingkan manakala siri JG bermula pada a = 0.063 dengan r = 0.01 memberi 7/110. Jumlah = 1/2 + 7/110 = 31/55."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Rumus & Aplikasi Janjang","voiceCaption":"Padankan empat maklumat atau masalah aplikasi janjang dengan ungkapan atau jawapan tepatnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan setiap formula atau aplikasi janjang aritmetik dan geometri ini dengan padanannya yang tepat.","prompt":"Padankan setiap situasi atau rumus janjang dengan padanan tepatnya:","pairs":[{"id":"a45b4m1","left":"Isi padu silinder mengikut JA: T1 + T3 = 24, T5 = 36","right":"a = 4 cm^3 dan d = 8 cm^3"},{"id":"a45b4m2","left":"Simpanan RM14 000 dengan faedah 5% setahun selama 18 tahun","right":"RM14 000 * (1.05)^18"},{"id":"a45b4m3","left":"Syarat kewujudan hasil tambah ketakterhinggaan S_inf","right":"-1 < r < 1 (dengan r != 0)"},{"id":"a45b4m4","left":"Jumlah sebutan dari T6 hingga T15","right":"S15 - S5"}],"explanation":"T1 + T3 = 2a + 2d = 24 => a + d = 12; T5 = a + 4d = 36. Tolak kedua-dua persamaan: 3d = 24 => d = 8 cm^3 dan a = 4 cm^3."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: T3, T4 dan S_inf JG","voiceCaption":"Selesaikan soalan Latihan Pengukuhan buku teks: sebutan ketiga janjang geometri ialah tiga puluh dan hasil tambah sebutan ketiga dan keempat ialah empat puluh lima.","voiceScript":"[excited] Soalan Boss terakhir Bab lima! Sebutan ketiga bagi suatu janjang geometri ialah tiga puluh dan hasil tambah sebutan ketiga dan keempat ialah empat puluh lima. Cari hasil tambah ketakterhinggaannya!","prompt":"Sebutan ke-3 suatu janjang geometri ialah 30 dan hasil tambah sebutan ke-3 dan ke-4 ialah 45. Cari hasil tambah ketakterhinggaannya.","options":["240","120","180","480"],"correctIndex":0,"explanation":"T3 = 30 dan T3 + T4 = 45 => T4 = 15. Maka r = T4/T3 = 15/30 = 1/2. Seterusnya a * r^2 = 30 => a(1/4) = 30 => a = 120. Jadi S_inf = 120 / (1 - 1/2) = 240."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";

  return "sains";

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
