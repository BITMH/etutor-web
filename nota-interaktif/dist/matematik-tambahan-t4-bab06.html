/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;

  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;

}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {

  border: 2px solid var(--brand-border);

  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;

@media (prefers-reduced-motion: no-preference) {

.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }

.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }

.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab06","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":6,"title":"Hukum Linear","subtitle":"Subtopik 6.1–6.3 KSSM — Hubungan Linear & Tak Linear, Garis Penyuaian Terbaik, Penukaran Persamaan Tak Linear kepada Y = mX + c & Aplikasi Eksperimen.","estimatedMinutes":28,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab06-labs.js","coverIcon":"../assets/icons/addm46-u1.jpg","editionBadge":"Edisi Simulasi & Plot Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan hukum linear Y sama dengan m X tambah c kamu sangat mantap!","combo":"[laughs warmly] Kombo yang sangat pantas! [excited] Semua pemelinearan dan bacaan graf eksperimen kamu kuasai dengan kemas!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula paksi Y dan paksi X yang dipilih serta pastikan penukaran logaritma tepat.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab enam berjaya kamu selesaikan!"},"units":[{"id":"addm46-u1","title":"Unit 1: Hubungan Linear & Garis Penyuaian Terbaik","subtitle":"Subtopik 6.1 — Membezakan Hubungan Linear vs Tak Linear & Melukis Garis Lurus Penyuaian Terbaik","iconType":"graph","iconUrl":"../assets/icons/addm46-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Garis Penyuaian Terbaik","voiceCaption":"Garis lurus penyuaian terbaik mesti melalui sebanyak mungkin titik plot sambil mengekalkan taburan seimbang titik di atas dan di bawah garis.","voiceScript":"[warm] Selamat datang ke Bab enam, Hukum Linear! Dalam subtopik enam perpuluhan satu, data eksperimen sains jarang jatuh tepat di atas satu garis lurus akibat ralat pengukuran! Oleh itu, kita melukis garis lurus penyuaian terbaik! Ingat tiga syarat mutlak garis penyuaian terbaik K S S M: pertama, garis mesti melalui seberapa banyak titik yang mungkin! Kedua, bilangan titik yang tidak dilalui di sebelah atas dan bawah garis mestilah hampir sama serta bertaburan seimbang! Ketiga, JANGAN sambungkan titik demi titik secara zig zag, dan pastikan garis melintasi paksi Y untuk membaca pintasan c! Laraskan kecerunan m dan pintasan c pada pelaras di bawah!","title":"6.1 Hubungan Linear vs Tak Linear & Garis Penyuaian Terbaik","acronym":"Y=mX+c","hook":"Laraskan kecerunan m dan pintasan c sehingga bilangan titik di atas dan bawah garis seimbang!","mediaKey":"addm46_graf_linear","videoClip":{"src":"../assets/matematik-tambahan-t4-bab06/video/addm46_video_hukum_linear_narasi.mp4","hasNarration":true,"posterKey":"addm46_graf_linear","caption":"Video Penerangan Bersuara (BM): Transformasi hubungan tak linear kepada bentuk linear Y = mX + c dan lukisan garis penyuaian terbaik"},"summary":"Garis penyuaian terbaik mewakili arah aliran purata titik data dengan keseimbangan titik di kedua-dua sisi garis untuk membentuk persamaan Y = mX + c.","bullets":["Hubungan Linear vs Tak Linear: Graf garis lurus menunjukkan hubungan linear (kadar perubahan malar), manakala graf melengkung menunjukkan hubungan tak linear.","3 Kriteria Garis Penyuaian Terbaik: (1) Melalui seberapa banyak titik plot yang boleh. (2) Titik yang terkeluar diagih seimbang (hampir sama bilangan & jarak) di atas dan di bawah garis. (3) Gunakan pembaris lutsinar tunggal tanpa menyambung zig-zag.","Mengira Kecerunan m & Pintasan c: Pilih DUA titik yang terletak TEPAT di atas garis penyuaian terbaik (sebaiknya berjauhan antara satu sama lain) untuk mengira m = (Y2 - Y1)/(X2 - X1) dan pintasan-Y c."],"formula":"Y = mX + c   |   m = (Y2 - Y1)/(X2 - X1)   |   Pintasan-Y = c (apabila X = 0)","labId":"addm46_garis_penyuaian_lab","labTitle":"Pelaras Interaktif Garis Penyuaian Terbaik","labProps":{"m":1.2,"c":2},"examTip":"Semasa mengira kecerunan m dari graf penyuaian terbaik di Kertas 2, WAJIB guna dua koordinat titik yang berada DI ATAS GARIS lurus anda, BUKAN titik data jadual yang terkeluar daripada garis!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Graf Linear vs Tak Linear","voiceCaption":"Asingkan enam persamaan berikut antara yang membentuk graf garis lurus apabila y diplot melawan x dengan yang membentuk graf melengkung tak linear.","voiceScript":"[curious] Uji mata tajam kamu mengenal pasti persamaan garis lurus! Asingkan keenam-enam persamaan ini kepada Hubungan Linear atau Tak Linear apabila y diplot melawan x.","prompt":"Kelaskan persamaan berikut apabila y diplot terus melawan x:","buckets":[{"id":"linear","label":"Hubungan Linear (Garis Lurus)"},{"id":"tak","label":"Hubungan Tak Linear (Melengkung)"}],"items":[{"text":"y = 3x - 7","bucketId":"linear","note":"Betul! Berbentuk y = mx + c dengan m = 3, c = -7."},{"text":"2x + 5y = 10","bucketId":"linear","note":"Tepat! Boleh disusun semula kepada y = -0.4x + 2."},{"text":"y = 2x^2 + 3","bucketId":"tak","note":"Betul! Mengandungi x kuasa dua, menghasilkan lengkung parabola."},{"text":"y = 6 / x","bucketId":"tak","note":"Tepat! Kuasa x ialah -1, menghasilkan lengkung hiperbola."},{"text":"y = 4 * (1.5)^x","bucketId":"tak","note":"Betul! Pemboleh ubah x berada pada indeks, menghasilkan lengkung eksponen."},{"text":"y / 2 - x = 4","bucketId":"linear","note":"Tepat! Menyusun semula memberi y = 2x + 8 (garis lurus)."}],"explanation":"Graf y melawan x ialah garis lurus hanya jika kuasa tertinggi bagi kedua-dua x dan y ialah 1 tanpa hasil darab xy atau punca kuasa."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Garis Penyuaian Optimum","voiceCaption":"Ramalkan bacaan pintasan-Y dan kecerunan yang menghasilkan garis penyuaian terbaik bagi enam titik data eksperimen.","voiceScript":"[curious] Cuba ramalkan kecerunan dan pintasan Y terbaik bagi titik eksperimen dalam makmal di atas!","hook":"Uji kombinasi m dan c pada Pelaras Garis Penyuaian Terbaik!","scenario":"Enam titik data eksperimen mempunyai nilai (1, 2.6), (2, 3.9), (3, 5.7), (4, 6.8), (5, 8.6), (6, 9.9).","prompt":"Manakah persamaan garis penyuaian terbaik yang paling hampir dan seimbang melalui taburan data itu?","options":["Y = 1.5X + 1.0","Y = 2.0X + 0.5","Y = 1.0X + 2.5","Y = 1.5X + 3.0"],"correctIndex":0,"proofLabId":"addm46_garis_penyuaian_lab","proofState":{"m":1.5,"c":1},"explanation":"Dengan Y = 1.5X + 1.0, ramalan pada X = 1, 2, 3, 4, 5, 6 ialah 2.5, 4.0, 5.5, 7.0, 8.5, 10.0 — berselisih +/-0.1 hingga +/-0.2 sahaja secara seimbang di atas dan di bawah garis!"},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Cari Persamaan Garis Lurus","voiceCaption":"Cari persamaan garis lurus dalam sebutan Y dan X yang melalui dua titik di atas garis penyuaian terbaik.","voiceScript":"[confident] Hitung persamaan garis penyuaian terbaik yang melalui titik dua koma lima dan titik lima koma sebelas!","prompt":"Satu garis penyuaian terbaik bagi plot Y melawan X melalui titik (2, 5) dan (5, 11). Cari persamaan garis lurus itu.","options":["Y = 2X + 1","Y = 2X + 5","Y = 0.5X + 4","Y = 3X - 1"],"correctIndex":0,"explanation":"Kecerunan m = (11 - 5)/(5 - 2) = 6/3 = 2. Ganti (2, 5): 5 = 2(2) + c => c = 1. Maka Y = 2X + 1."}]},{"id":"addm46-u2","title":"Unit 2: Menukar Persamaan Tak Linear ke Y = mX + c","subtitle":"Subtopik 6.2 — Teknik Bahagi x, Darab x & Pengambilan Logaritma (log10) untuk Membentuk Garis Lurus","iconType":"formula","iconUrl":"../assets/icons/addm46-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Transformasi Y = mX + c","voiceCaption":"Hukum Linear menukarkan persamaan tak linear kepada bentuk linear Y sama dengan m X tambah c dengan memilih pemboleh ubah paksi baharu Y dan X.","voiceScript":"[warm] Selamat datang ke Unit dua, Hukum Linear! Bagaimana ahli sains mengukur pemalar daripada graf lengkung? Kita meluruskan lengkung itu menjadi Y besar sama dengan m darab X besar tambah c! Ingat tiga syarat mutlak: pertama, paksi mencancang Y besar dan paksi mengufuk X besar boleh mengandungi pemboleh ubah x dan y seperti y per x, satu per x, atau log sepuluh y; kedua, kecerunan m dan pintasan c MESTILAH pemalar sahaja tanpa sebarang x atau y! Ketiga, bagi persamaan kuasa y sama dengan a x kuasa n atau eksponen y sama dengan a b kuasa x, ambil log sepuluh pada kedua-dua belah! Uji keempat-empat transformasi ini dalam makmal penukar di bawah!","title":"6.2 Hukum Linear: Mengungkapkan Y = mX + c","acronym":"P•K•L","hook":"Klik 4 jenis lengkung di bawah untuk melihat bagaimana paksi Y dan X berubah meluruskan graf!","mediaKey":"addm46_eksperimen_lengkung","summary":"Untuk menukar persamaan tak linear kepada Y = mX + c, susun persamaan supaya pekali pemalar (a, b, p, q) hanya wujud pada kecerunan m dan pintasan c.","bullets":["Syarat Mutlak m dan c: Kecerunan m dan pintasan-Y c MESTI bebas daripada pemboleh ubah asal x dan y (hanya terdiri daripada pemalar seperti a, b, p, q, n).","4 Jenis Transformasi Utama: (1) y = ax^2 + bx -> bahagi x: y/x = ax + b (Y = y/x, X = x). (2) y = p/x + q -> p(1/x) + q (Y = y, X = 1/x). (3) y = ab^x -> log10(y) = (log10 b)x + log10 a (Y = log10 y, X = x). (4) y = ax^n -> log10(y) = n log10(x) + log10 a (Y = log10 y, X = log10 x).","Pecahan Tak Linear (cth. y = x/(ax + b)): Ambil salingan kedua-dua belah! 1/y = (ax + b)/x = a + b(1/x) => Y = 1/y, X = 1/x, m = b, c = a!"],"formula":"Y = mX + c   (m & c = pemalar tanpa x atau y)","labId":"addm46_penukar_linear_lab","labTitle":"Makmal Penukar Persamaan Tak Linear -> Y = mX + c","labProps":{"eqKey":"kuadratik"},"examTip":"Jangan pernah tulis X = ax atau m = px! Pemalar mesti diasingkan sepenuhnya sebagai m, manakala pemboleh ubah x atau y berada dalam Y dan X."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Persamaan & Bentuk Linearnya","voiceCaption":"Padankan lima persamaan tak linear di kiri dengan padanan paksi Y, X, kecerunan m dan pintasan c yang betul di kanan.","voiceScript":"[confident] Uji kemahiran pemelinearan kamu! Padankan kelima-lima persamaan tak linear berikut dengan bentuk linear dan paksinya.","prompt":"Padankan setiap persamaan tak linear dengan bentuk linear Y = mX + c yang tepat:","pairs":[{"id":"a46u2m1","left":"y = 2x^2 - 5x","right":"Y = y/x, X = x (y/x = 2x - 5)"},{"id":"a46u2m2","left":"y = p * q^x","right":"Y = log10(y), X = x, m = log10(q), c = log10(p)"},{"id":"a46u2m3","left":"y = a * x^n","right":"Y = log10(y), X = log10(x), m = n, c = log10(a)"},{"id":"a46u2m4","left":"y = p/x + qx","right":"Y = xy, X = x^2 (xy = qx^2 + p)"},{"id":"a46u2m5","left":"y = 1 / (ax + b)","right":"Y = 1/y, X = x (1/y = ax + b)"}],"explanation":"Setiap transformasi memastikan kecerunan m dan pintasan c adalah pemalar tulen tanpa sebarang pemboleh ubah x atau y."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Pemelinearan Persamaan Kuasa","voiceCaption":"Susun langkah menukar persamaan y sama dengan p darab x kuasa n kepada bentuk linear dengan menggunakan logaritma biasa.","voiceScript":"[curious] Susun empat langkah algebra dan hukum logaritma ini untuk melinearkan y sama dengan p x kuasa n!","prompt":"Susun langkah menukar y = px^n kepada bentuk linear Y = mX + c:","hint":"Ambil log10 pada kedua-dua belah persamaan dahulu...","answerTokens":["Ambil log10 kedua-dua belah: log10(y) = log10(p * x^n)","Guna hukum tambah log: log10(y) = log10(p) + log10(x^n)","Turunkan kuasa n: log10(y) = n log10(x) + log10(p)","Banding Y = mX + c: Y = log10(y), X = log10(x), m = n, c = log10(p)"],"distractors":["Tukar menjadi log10(y) = n * log10(p) * log10(x)","Tetapkan paksi-X sebagai x sahaja tanpa log10"],"explanation":"Oleh sebab kuasa n hanya milik x (bukan px), hukum tambah memisahkan log10(p) dan log10(x^n) = n log10(x)."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kenal Pasti m dan c Bentuk Linear","voiceCaption":"Tentukan nilai kecerunan m dan pintasan-Y c apabila y sama dengan x per kurungan p x tambah q ditukar kepada plot satu per y melawan satu per x.","voiceScript":"[confident] Soalan kegemaran S P M! Jika y sama dengan x bahagi kurungan p x tambah q diplot sebagai satu per y melawan satu per x, apakah kecerunan dan pintasannya?","prompt":"Persamaan y = x / (px + q) diplot sebagai 1/y melawan 1/x. Nyatakan kecerunan m dan pintasan-Y c dalam sebutan p dan q.","options":["m = q, c = p","m = p, c = q","m = 1/q, c = 1/p","m = -q, c = p"],"correctIndex":0,"explanation":"Salingkan kedua-dua belah: 1/y = (px + q)/x = p + q(1/x) => 1/y = q(1/x) + p. Bandingkan dengan Y = mX + c (Y = 1/y, X = 1/x): m = q dan c = p."}]},{"id":"addm46-u3","title":"Unit 3: Membaca Kecerunan, Pintasan & Mencari Pemalar","subtitle":"Subtopik 6.2–6.3 — Mentafsir Graf Terlinear, Mencari Pemalar a, b, p, q & Menyelesaikan Masalah Eksperimen","iconType":"scale","iconUrl":"../assets/icons/addm46-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Mencari Pemalar daripada Graf","voiceCaption":"Pemalar asal persamaan tak linear diperoleh dengan memadankan kecerunan dan pintasan graf garis lurus, termasuk mengambil antilog sepuluh kuasa c bagi graf logaritma.","voiceScript":"[warm] Selamat datang ke Unit tiga! Dalam kebanyakan soalan S P M, graf garis lurus sudah dilukis dengan paksi tertentu seperti y per x melawan x, atau log sepuluh y melawan x, dan anda diminta mencari nilai pemalar asal seperti a, b, p atau q! Langkahnya sentiasa konsisten: pertama, kira kecerunan m dan pintasan Y c daripada dua titik pada garis lurus! Kedua, tukarkan persamaan tak linear soalan kepada bentuk Y sama dengan m X tambah c yang sepadan dengan label paksi graf! Ketiga, bandingkan m dan c untuk menyelesaikan pemalar! Jangan lupa, jika c sama dengan log sepuluh a, maka a ialah sepuluh kuasa c!","title":"Menentukan Nilai Pemalar daripada Graf Garis Lurus","acronym":"M•C•T•A","hook":"Sentiasa padankan bentuk algebra anda tepat mengikut label paksi-Y dan paksi-X pada graf yang diberi!","summary":"Nilai pemalar eksperimen ditentukan dengan membandingkan kecerunan m dan pintasan-Y c daripada graf garis lurus dengan bentuk linear persamaan tak linear.","bullets":["Kaedah Terus daripada 2 Titik: Jika graf Y melawan X melalui (X1, Y1) dan (X2, Y2), terus guna m = (Y2 - Y1)/(X2 - X1) dan c = Y1 - mX1 (tanpa perlu graf bermula di X = 0!).","Kes Graf Logaritma (log10 y melawan x): Jika y = ab^x, maka log10 b = m => b = 10^m; dan log10 a = c => a = 10^c.","Meramal Nilai y atau x (Subtopik 6.3): Gantikan nilai x ke dalam persamaan lengkap (atau baca Y dari graf pada X tertentu, lalu tukar balik kepada y asal!)."],"formula":"Jika log10(k) = v, maka k = 10^v   |   Jika Y = y/x, maka y = X * Y","examTip":"Perangkap bacaan graf! Jika graf menunjukkan paksi mencancang ialah 'xy' dan pada x = 3 nilai pada graf ialah 12, maka xy = 12 => y = 12/3 = 4, BUKAN y = 12!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Nilai Asal daripada Paksi Terubah","voiceCaption":"Ramalkan nilai asal y apabila nilai pada paksi mencancang y per x ialah empat pada x sama dengan tiga.","voiceScript":"[curious] Elakkan kesilapan klasik membaca graf Hukum Linear! Pada graf y per x melawan x, satu titik di atas garis ialah tiga koma empat. Berapakah nilai y yang sebenar pada x sama dengan tiga?","hook":"Perhatikan label paksi mencancang ialah Y = y/x, bukan y!","scenario":"Graf garis lurus diplot dengan paksi mencancang Y = y/x dan paksi mengufuk X = x, melalui titik (3, 4).","prompt":"Apakah nilai pemboleh ubah asal y apabila x = 3?","options":["y = 12","y = 4","y = 4/3","y = 7"],"correctIndex":0,"proofLabId":"addm46_penukar_linear_lab","proofState":{"eqKey":"kuadratik"},"explanation":"Titik (X, Y) = (3, 4) bermaksud x = 3 dan y/x = 4. Oleh itu, y/3 = 4 => y = 12."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Langkah Cari Pemalar Eksponen","voiceCaption":"Susun langkah mencari nilai a dan b bagi y sama dengan a b kuasa x daripada graf log sepuluh y melawan x.","voiceScript":"[confident] Susun empat langkah untuk menentukan pemalar a dan b daripada graf garis lurus log sepuluh y melawan x!","prompt":"Graf log10(y) melawan x bagi y = ab^x mempunyai kecerunan 0.3010 dan pintasan-Y 0.6990. Susun langkah mencari a dan b:","hint":"Tukar y = ab^x kepada bentuk linear log10 terlebih dahulu...","answerTokens":["Linearize y = ab^x menjadi log10(y) = (log10 b)x + log10(a)","Samakan kecerunan: log10(b) = 0.3010 => b = 10^0.3010 = 2","Samakan pintasan-Y: log10(a) = 0.6990 => a = 10^0.6990 = 5","Persamaan asal ialah y = 5 * (2^x)"],"distractors":["Tetapkan terus b = 0.3010 dan a = 0.6990 tanpa antilog","Darab 0.3010 dan 0.6990 dengan 10"],"explanation":"Daripada log10(b) = 0.3010, antilog memberi b = 10^0.3010 = 2.00; daripada log10(a) = 0.6990, antilog memberi a = 10^0.6990 = 5.00."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Kira Pemalar daripada 2 Titik Graf","voiceCaption":"Cari nilai a dan b bagi y sama dengan a x kuasa dua tambah b x jika graf y per x melawan x melalui titik dua koma lima dan enam koma tiga belas.","voiceScript":"[confident] Kira nilai pemalar a dan b bagi persamaan y sama dengan a x kuasa dua tambah b x jika graf garis lurus y per x melawan x melalui dua koma lima dan enam koma tiga belas!","prompt":"Graf garis lurus y/x melawan x bagi hubungan y = ax^2 + bx melalui titik (2, 5) dan (6, 13). Cari nilai a dan b.","options":["a = 2, b = 1","a = 1, b = 2","a = 4, b = -3","a = 2, b = 5"],"correctIndex":0,"explanation":"Bahagi dengan x: y/x = ax + b (m = a, c = b). Kecerunan a = (13 - 5)/(6 - 2) = 8/4 = 2. Ganti (2, 5): 5 = 2(2) + b => b = 1."}]},{"id":"addm46-u4","title":"Unit 4: Aplikasi Hukum Linear & Pelbagai Soalan Kertas 2","subtitle":"Subtopik 6.3 — Jadual Data Eksperimen, Skala Graf Kertas 2, Ralat Titik Terpencil & Pembolehubah Fizik","iconType":"pendulum","iconUrl":"../assets/icons/addm46-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"SOP Kertas 2 Bahagian B Hukum Linear","voiceCaption":"Soalan wajib sepuluh markah Kertas dua Hukum Linear menguji pembinaan jadual nilai terubah, pemplotan garis penyuaian terbaik, pengiraan pemalar dan ramalan bacaan.","voiceScript":"[warm] Tahukah anda Hukum Linear ialah soalan wajib sepuluh markah dalam Kertas dua S P M? Mari ikuti S O P penuh untuk mengaut kesemua sepuluh markah! Pertama, bina baris jadual baharu mengikut paksi linear yang diminta, seperti satu per x dan y per x, dan bundarkan kepada dua atau tiga tempat perpuluhan seperti diarahkan. Kedua, plot semua titik dengan tanda pangkah kecil dan lukis satu garis penyuaian terbaik yang seimbang! Ketiga, jika terdapat satu titik yang jelas tersasar jauh daripada garis, itulah ralat eksperimen — abaikannya semasa melukis garis penyuaian terbaik! Keempat, tukar persamaan asal kepada Y sama dengan m X tambah c untuk membaca pemalar daripada kecerunan dan pintasan Y!","title":"6.3 Aplikasi Hukum Linear & Teknik Skor Penuh Kertas 2","acronym":"J•P•G•R","hook":"Abaikan satu titik ralat terpencil apabila melukis garis penyuaian terbaik, dan sentiasa baca semula paksi asal!","summary":"Aplikasi Hukum Linear merangkumi pemodelan eksperimen fizik/biologi/ekonomi melalui jadual nilai terlinear, pengecaman titik ralat, dan ekstrapolasi ramalan.","bullets":["Mengesan Titik Tersalah Rekod (Outlier): Jika 5 daripada 6 titik membentuk garis lurus tetapi 1 titik terkeluar jauh, garis penyuaian terbaik melintasi 5 titik yang sejajar itu; titik yang jauh tidak dikira dalam keseimbangan.","Jadual Nilai Logaritma & Pecahan: Semasa mengisi jadual log10(y) atau 1/x untuk Kertas 2, gunakan sekurang-kurangnya 2 tempat perpuluhan (ikut kehendak skala graf kertas graf 2 cm).","Kes Aplikasi Sains (cth. Bandul T^2 = (4*pi^2/g)*l): Kecerunan graf T^2 melawan l memberi 4*pi^2/g, membolehkan pecutan graviti g dihitung!"],"formula":"T^2 = (4*pi^2 / g) * l   =>   Kecerunan m = 4*pi^2 / g","examTip":"Skala kertas graf Kertas 2: Hanya guna skala mudah (1, 2, 5 atau gandaannya per 2 cm) — JANGAN guna skala 3, 4, 6, 7 atau 9 per 2 cm kerana sukar diplot dan ditolak markah skala!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Hukum Sains & Graf Linearnya","voiceCaption":"Padankan empat rumus fizik atau biologi dengan paksi dan maksud kecerunannya apabila diplot secara linear.","voiceScript":"[confident] Hubungkan Hukum Linear dengan sains tulen! Padankan keempat-empat rumus eksperimen ini dengan kecerunan graf linearnya.","prompt":"Padankan setiap rumus eksperimen dengan paksi linear dan nilai kecerunannya:","pairs":[{"id":"a46u4m1","left":"Tempoh bandul T^2 = (4*pi^2 / g) * l (plot T^2 vs l)","right":"m = 4*pi^2 / g, c = 0"},{"id":"a46u4m2","left":"Hukum Boyle P = k / V (plot P vs 1/V)","right":"m = k, c = 0"},{"id":"a46u4m3","left":"Halaju awal v^2 = u^2 + 2as (plot v^2 vs s)","right":"m = 2a, c = u^2"},{"id":"a46u4m4","left":"Pertumbuhan populasi P = P0 * e^(kt) (plot ln P vs t)","right":"m = k, c = ln(P0)"}],"explanation":"Semua rumus sains tak linear boleh diluruskan kepada Y = mX + c agar pemalar fizik g, k, a, u dapat ditentukan terus daripada kecerunan dan pintasan."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Amalan Graf Kertas 2 Betul vs Salah","voiceCaption":"Asingkan enam amalan melukis graf Hukum Linear Kertas dua antara Amalan Betul yang mengekalkan markah penuh dengan Amalan Salah yang memotong markah.","voiceScript":"[curious] Elakkan kehilangan markah teknikal di Kertas dua! Asingkan amalan melukis graf berikut kepada Amalan Betul atau Amalan Salah.","prompt":"Kelaskan amalan melukis graf Hukum Linear berikut kepada Amalan Betul atau Amalan Salah:","buckets":[{"id":"betul","label":"Amalan Betul (Markah Penuh)"},{"id":"salah","label":"Amalan Salah (Potong Markah)"}],"items":[{"text":"Guna skala 2 cm : 0.5 unit atau 2 cm : 2 unit yang seragam","bucketId":"betul","note":"Betul! Skala berasaskan 1, 2, 5 mudah dibaca dengan tepat."},{"text":"Guna skala 2 cm : 3 unit atau 2 cm : 7 unit supaya graf muat penuh","bucketId":"salah","note":"SALAH! Skala ganjil seperti 3 dan 7 menyebabkan bacaan perpuluhan tidak tepat."},{"text":"Kira kecerunan menggunakan dua titik berjauhan di atas garis penyuaian terbaik","bucketId":"betul","note":"Tepat! Mengurangkan ralat peratus kecerunan."},{"text":"Sambungkan titik-titik data eksperimen satu demi satu dengan pembaris","bucketId":"salah","note":"SALAH! Graf penyuaian terbaik mestilah SATU garis lurus tunggal."},{"text":"Memanjangkan garis lurus sehingga memotong paksi mencancang X = 0 untuk membaca c","bucketId":"betul","note":"Betul! Pintasan-Y dibaca pada garis X = 0."},{"text":"Membaca pintasan-Y terus walaupun paksi mengufuk bermula pada X = 2 (bukan 0)","bucketId":"salah","note":"SALAH! Perangkap maut: jika paksi tidak bermula pada X = 0, nilai itu BUKAN c!"}],"explanation":"Sentiasa semak sama ada paksi menegak berada di X = 0 sebelum membaca nilai c secara langsung daripada graf!"},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Amaran Paksi Tidak Bermula pada Sifar","voiceCaption":"Hitung pintasan-Y sebenar apabila paksi mencancang graf garis lurus dilukis pada X sama dengan dua.","voiceScript":"[confident] Soalan perangkap skala graf! Satu garis lurus berkecerunan tiga melalui titik pada paksi tegak bernilai sepuluh apabila X sama dengan dua. Berapakah pintasan Y sebenar c pada X sama dengan sifar?","prompt":"Suatu graf garis lurus Y melawan X mempunyai kecerunan 3. Jika paksi tegak dilukis pada X = 2 dan garis memotong paksi itu pada Y = 10, berapakah nilai sebenar pintasan-Y (c)?","options":["c = 4","c = 10","c = 16","c = 6"],"correctIndex":0,"explanation":"Titik pada garis ialah (2, 10) dan kecerunan m = 3. Gantikan ke dalam Y = mX + c: 10 = 3(2) + c => c = 10 - 6 = 4."}]},{"id":"addm46-u5","title":"Unit 5: Cabaran Boss SPM — Hukum Linear","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Penukaran Dua Arah Graf Tak Linear, Eksponen & Graf Paksi Terubah","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Bentuk Kuasa Log10","voiceCaption":"Soalan Boss pertama menentukan nilai pemalar p dan n apabila graf log sepuluh y melawan log sepuluh x mempunyai kecerunan satu perpuluhan lima dan pintasan sifar perpuluhan tiga sifar satu.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab enam! Soalan pertama menguji persamaan kuasa y sama dengan p darab x kuasa n daripada graf log sepuluh y melawan log sepuluh x!","prompt":"Graf garis lurus log10(y) melawan log10(x) bagi y = px^n mempunyai kecerunan 1.5 dan pintasan paksi mencancang 0.3010. Cari nilai p dan n.","options":["p = 2, n = 1.5","p = 1.5, n = 2","p = 0.3010, n = 1.5","p = 10, n = 1.5"],"correctIndex":0,"explanation":"log10(y) = n log10(x) + log10(p). Maka n = kecerunan = 1.5, dan log10(p) = 0.3010 => p = 10^0.3010 = 2."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Graf Salingan Kuasa Dua","voiceCaption":"Ramalkan persamaan asal y dalam sebutan x apabila graf satu per y melawan x kuasa dua melalui titik satu koma empat dan lima koma enam belas.","voiceScript":"[curious] Soalan Boss kedua! Graf garis lurus satu per y melawan x kuasa dua melalui titik satu koma empat dan lima koma enam belas. Apakah persamaan asal y dalam sebutan x?","hook":"Cari persamaan Y = mX + c dahulu sebelum menggantikan Y = 1/y dan X = x^2!","scenario":"Plot garis lurus bagi paksi Y = 1/y melawan X = x^2 melalui titik (1, 4) dan (5, 16).","prompt":"Apakah ungkapan y dalam sebutan x yang tepat?","options":["y = 1 / (3x^2 + 1)","y = 3x^2 + 1","y = 1 / (3x + 1)","y = 3x^2 + 4"],"correctIndex":0,"proofLabId":"addm46_penukar_linear_lab","proofState":{"eqKey":"pecahan"},"explanation":"m = (16 - 4)/(5 - 1) = 3; c = 4 - 3(1) = 1. Maka Y = 3X + 1 => 1/y = 3x^2 + 1 => y = 1 / (3x^2 + 1)."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Tukar Lengkung kepada xy vs x^3","voiceCaption":"Susun langkah menukar persamaan y sama dengan p x kuasa dua tambah q per x kepada bentuk garis lurus yang sepadan.","voiceScript":"[confident] Soalan Boss ketiga! Susun langkah menukar persamaan y sama dengan p x kuasa dua tambah q bahagi x kepada bentuk linear!","prompt":"Susun langkah melinearkan y = px^2 + q/x supaya kecerunan ialah p dan pintasan ialah q:","hint":"Darabkan seluruh persamaan dengan x dahulu untuk menyingkirkan penyebut...","answerTokens":["Darab semua sebutan dengan x: xy = px^3 + q","Bandingkan dengan Y = mX + c","Tetapkan paksi Y = xy dan paksi X = x^3","Maka kecerunan m = p dan pintasan-Y c = q"],"distractors":["Bahagi dengan x menjadi y/x = px + q/x^2","Tetapkan paksi X = x sahaja"],"explanation":"Mendarab y = px^2 + q/x dengan x menghasilkan xy = px^3 + q, di mana Y = xy dan X = x^3 memberi kecerunan m = p dan pintasan c = q."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Graf Linear & Persamaan Asal","voiceCaption":"Padankan empat maklumat graf garis lurus terlinear dengan persamaan tak linear asalnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan setiap persamaan garis lurus berlabel paksi baharu dengan persamaan asal y dalam sebutan x!","prompt":"Padankan bentuk linear di kiri dengan persamaan asal y dalam sebutan x di kanan:","pairs":[{"id":"a46b4m1","left":"y/x = 4x - 3","right":"y = 4x^2 - 3x"},{"id":"a46b4m2","left":"x^2 y = 5x + 2","right":"y = 5/x + 2/x^2"},{"id":"a46b4m3","left":"log10(y) = 2x + 1","right":"y = 10 * 100^x"},{"id":"a46b4m4","left":"punca(y) = 3(1/x) + 2","right":"y = (3/x + 2)^2"}],"explanation":"Bagi log10(y) = 2x + 1: y = 10^(2x + 1) = 10^1 * (10^2)^x = 10 * 100^x!"},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Persamaan Eksponen Base 10","voiceCaption":"Tentukan nilai a dan b apabila graf log sepuluh y melawan x bagi y sama dengan sepuluh kuasa a tambah b x melalui dua koma satu setengah dan enam koma tiga setengah.","voiceScript":"[excited] Soalan Boss terakhir Bab enam! Graf log sepuluh y melawan x bagi y sama dengan sepuluh kuasa a tambah b x melalui dua koma satu perpuluhan lima dan enam koma tiga perpuluhan lima. Cari nilai a dan b!","prompt":"Graf garis lurus log10(y) melawan x bagi y = 10^(a + bx) melalui titik (2, 1.5) dan (6, 3.5). Cari nilai a dan b.","options":["a = 0.5, b = 0.5","a = 1.5, b = 0.5","a = 0.5, b = 2.0","a = 1.0, b = 0.5"],"correctIndex":0,"explanation":"Ambil log10: log10(y) = a + bx => Y = bx + a (m = b, c = a). Maka b = (3.5 - 1.5)/(6 - 2) = 2/4 = 0.5. Ganti (2, 1.5): 1.5 = 0.5(2) + a => a = 0.5."}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {

function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;
  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");

  if (heartEl) heartEl.textContent = String(notaState.hearts);

    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
