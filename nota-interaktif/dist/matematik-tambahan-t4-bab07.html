/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;

}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;

}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);

  height: 28px;
  border-radius: 50%;

  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);

}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";

  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;

@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;

.node-float-tag {

  font-weight: 800;

.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab07","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":7,"title":"Geometri Koordinat","subtitle":"Subtopik 7.1–7.4 KSSM — Pembahagi Tembereng Garis (m:n), Garis Lurus Selari & Serenjang (m1*m2 = -1), Luas Poligon Kaedah Tali Kasut, Titik Segaris & Persamaan Lokus.","estimatedMinutes":34,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab07-labs.js","coverIcon":"../assets/icons/addm47-u1.jpg","editionBadge":"Edisi Simulasi & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pengiraan koordinat, kecerunan serenjang dan lokus kamu sangat kemas!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Kaedah tali kasut dan persamaan lokus kamu selesaikan tanpa ralat!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula susunan darab silang m dan n serta tanda nilai mutlak luas poligon.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab tujuh berjaya kamu kuasai!"},"units":[{"id":"addm47-u1","title":"Unit 1: Pembahagi Tembereng Garis","subtitle":"Subtopik 7.1 — Membahagi Tembereng Garis dalam Nisbah m : n, Titik Tengah & Mencari Nisbah","iconType":"scale","iconUrl":"../assets/icons/addm47-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Rumus Pembahagi Tembereng","voiceCaption":"Koordinat titik pembahagi P di atas tembereng A B dengan nisbah m kepada n dikira secara darab silang n darab koordinat A tambah m darab koordinat B bahagi m tambah n.","voiceScript":"[warm] Selamat datang ke Bab tujuh, Geometri Koordinat! Tonton dahulu video ringkas di bawah untuk melihat konsep pembahagian tembereng dan garis serenjang dalam satah Cartes! Dalam subtopik tujuh perpuluhan satu, apabila titik P membahagi tembereng garis A B secara dalaman dengan nisbah A P kepada P B sama dengan m kepada n, sentiasa ingat peraturan DARAB SILANG! Nisbah sebelah kanan n didarabkan dengan koordinat sebelah kiri A, manakala nisbah sebelah kiri m didarabkan dengan koordinat sebelah kanan B, kemudian dibahagi dengan jumlah nisbah m tambah n! Apabila nisbah m sama dengan n, rumus ini meringkas terus kepada rumus titik tengah! Laraskan nisbah m dan n dalam penjelajah di bawah!","title":"7.1 Pembahagi Tembereng Garis (Nisbah m : n & Titik Tengah)","acronym":"D•S•M+N","hook":"Tonton video animasi dan seret nisbah m : n untuk melihat titik P bergerak sepanjang tembereng AB!","mediaKey":"addm47_peta_koordinat","videoClip":{"src":"../assets/matematik-tambahan-t4-bab07/video/addm47_video_geometri_koordinat.mp4","hasNarration":false,"posterKey":"addm47_peta_koordinat","caption":"Video Animasi Geometri Koordinat: Pembahagian tembereng garis, garis serenjang dan lokus bulatan"},"summary":"Titik P(x, y) yang membahagikan tembereng garis AB dengan nisbah AP : PB = m : n ialah [(nx1 + mx2)/(m + n), (ny1 + my2)/(m + n)].","bullets":["Rumus Darab Silang: Bagi A(x1, y1), B(x2, y2) dan AP : PB = m : n, x = (n*x1 + m*x2)/(m + n) dan y = (n*y1 + m*y2)/(m + n).","Kes Khas Titik Tengah (m : n = 1 : 1): M = ((x1 + x2)/2, (y1 + y2)/2).","Mencari Nisbah Apabila P, A, B Diberi: Guna komponen-x (atau komponen-y) sahaja! Biar AP : PB = k : 1 atau m : n, selesaikan (n*x1 + m*x2)/(m + n) = xP. Pastikan anda periksa bentuk nisbah soalan (cth. AP : AB = m : (m + n)!)."],"formula":"P(x, y) = ( (nx1 + mx2)/(m + n),  (ny1 + my2)/(m + n) )","labId":"addm47_pembahagi_serenjang_lab","labTitle":"Penjelajah Pembahagi Tembereng Garis (m : n)","labProps":{"m":2,"n":3,"showPerp":false},"examTip":"Perangkap nisbah SPM! Jika soalan menulis '3AP = 2AB' (bukan AP : PB!), lukis garis lurus: AP = 2 bahagian, AB = 3 bahagian, maka PB = 3 - 2 = 1 bahagian! Nisbah m : n = AP : PB = 2 : 1!"},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Kedudukan Titik P (m:n)","voiceCaption":"Ramalkan koordinat titik P jika ia membahagi tembereng garis dari A negatif dua koma enam ke B lapan koma negatif empat dalam nisbah dua kepada tiga.","voiceScript":"[curious] Gunakan kaedah darab silang! Titik P berada pada garis A negatif dua koma enam ke B lapan koma negatif empat dengan nisbah A P kepada P B sama dengan dua kepada tiga. Di manakah koordinat P?","hook":"Sahkan kedudukan titik P pada Penjelajah Pembahagi Tembereng selepas menjawab!","scenario":"A(-2, 6), B(8, -4) dan titik P membahagi AB dengan nisbah AP : PB = 2 : 3.","prompt":"Apakah koordinat titik P?","options":["(2, 2)","(4, 0)","(3, 1)","(6, -2)"],"correctIndex":0,"proofLabId":"addm47_pembahagi_serenjang_lab","proofState":{"m":2,"n":3,"showPerp":false},"explanation":"x = [3(-2) + 2(8)] / (2 + 3) = (-6 + 16)/5 = 2. y = [3(6) + 2(-4)] / 5 = (18 - 8)/5 = 2. Maka P(2, 2)."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Langkah Nisbah daripada 3AP = 2PB","voiceCaption":"Susun langkah menukar hubungan panjang tiga A P sama dengan dua A B kepada pengiraan koordinat titik P.","voiceScript":"[confident] Elakkan perangkap nisbah! Susun empat langkah mencari koordinat P apabila diberi hubungan tiga A P sama dengan dua A B!","prompt":"Titik P terletak di antara A(1, 2) dan B(7, 8) dengan 3AP = 2AB. Susun langkah mencari P:","hint":"Tukarkan 3AP = 2AB kepada pecahan nisbah AP/AB dahulu...","answerTokens":["Tulis AP/AB = 2/3, maka PB = 3 - 2 = 1 bahagian","Kenal pasti nisbah dalaman AP : PB = m : n = 2 : 1","Guna rumus darab silang: x = [1(1) + 2(7)] / 3 = 5","Kira y = [1(2) + 2(8)] / 3 = 6, maka P(5, 6)"],"distractors":["Gunakan terus m = 3 dan n = 2 dalam rumus","Gantikan B sebagai titik tengah antara A dan P"],"explanation":"Daripada 3AP = 2AB, AP : AB = 2 : 3 bermaksud PB = AB - AP = 1 bahagian. Jadi AP : PB = 2 : 1, memberi P(5, 6)."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Cari Nisbah P pada Paksi-y","voiceCaption":"Tentukan nisbah pembahagian tembereng garis apabila titik P memintas paksi-y.","voiceScript":"[confident] Tembereng garis menyambungkan A negatif tiga koma dua dengan B enam koma lima memotong paksi y pada titik P. Apakah nisbah A P kepada P B?","prompt":"Garis lurus yang menyambungkan A(-3, 2) dan B(6, 5) memotong paksi-y di titik P. Cari nisbah AP : PB.","options":["1 : 2","2 : 1","1 : 3","3 : 2"],"correctIndex":0,"explanation":"Sebarang titik pada paksi-y mempunyai koordinat-x = 0. Biar AP : PB = m : n => [n(-3) + m(6)]/(m + n) = 0 => 6m = 3n => m/n = 3/6 = 1/2, iaitu 1 : 2."}]},{"id":"addm47-u2","title":"Unit 2: Garis Lurus Selari & Garis Lurus Serenjang","subtitle":"Subtopik 7.2 — Syarat m1 = m2 dan m1*m2 = -1, Pembahagi Dua Sama Serenjang & Bentuk Persamaan Garis","iconType":"graph","iconUrl":"../assets/icons/addm47-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kecerunan Selari & Serenjang","voiceCaption":"Dua garis lurus adalah selari jika kecerunannya sama m satu sama dengan m dua, dan berserenjang pada sudut sembilan puluh darjah jika hasil darab kecerunan ialah negatif satu.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam subtopik tujuh perpuluhan dua, pelajari dua syarat kecerunan paling penting: dua garis lurus bukan tegak adalah SELARI jika dan hanya jika m satu sama dengan m dua! Dan dua garis lurus adalah BERSERENJANG pada sudut tepat sembilan puluh darjah jika dan hanya jika hasil darab kecerunannya m satu darab m dua sama dengan negatif satu! Cara pantas mencari kecerunan serenjang: TERBALIKKAN pecahan dan TUKAR TANDA! Contohnya, jika kecerunan garis asal ialah dua per tiga, kecerunan garis serenjang ialah negatif tiga per dua! Kenali juga tiga bentuk persamaan garis lurus: bentuk kecerunan y sama dengan m x tambah c, bentuk am a x tambah b y tambah c sama dengan sifar, dan bentuk pintasan x per a tambah y per b sama dengan satu!","title":"7.2 Garis Lurus Selari, Serenjang & Pembahagi Dua Sama Serenjang","acronym":"S•T•-1","hook":"Untuk mendapat m2 serenjang: terbalikkan pecahan m1 dan tukar tandanya (+ kepada - atau sebaliknya)!","summary":"Garis selari memenuhi m1 = m2 manakala garis berserenjang memenuhi m1 * m2 = -1; pembahagi dua sama serenjang AB melalui titik tengah AB dengan kecerunan -1/m_AB.","bullets":["Syarat Selari vs Serenjang: Selari <=> m1 = m2. Serenjang (90 darjah) <=> m1 * m2 = -1 (m2 = -1/m1). Bagi garis mengufuk (m = 0) dan mencancang (m tak tertakrif), kedua-duanya juga berserenjang.","3 Bentuk Persamaan Garis Lurus: (1) Bentuk Kecerunan: y = mx + c; (2) Bentuk Am: ax + by + c = 0; (3) Bentuk Pintasan: x/a + y/b = 1 (a = pintasan-x, b = pintasan-y, maka m = -b/a).","Pembahagi Dua Sama Serenjang AB: (1) Cari titik tengah M bagi AB. (2) Kira m_AB, lalu m_serenjang = -1/m_AB. (3) Bina persamaan melalui M dengan kecerunan m_serenjang."],"formula":"Selari: m1 = m2   |   Serenjang: m1 * m2 = -1   |   Bentuk Pintasan: x/a + y/b = 1","labId":"addm47_pembahagi_serenjang_lab","labTitle":"Aktifkan Garis Serenjang & Banding Kecerunan m1*m2 = -1","labProps":{"m":1,"n":1,"showPerp":true},"examTip":"Untuk mencari jarak terdekat dari titik P ke satu garis lurus AB, jarak terdekat sentiasa diukur secara BERSERENJANG! Cari persamaan garis melalui P yang serenjang dengan AB, cari titik persilangan Q, lalu guna rumus jarak PQ."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Pasangan Garis & Hubungannya","voiceCaption":"Padankan lima persamaan garis lurus di kiri dengan kecerunan atau persamaan garis serenjangnya di kanan.","voiceScript":"[confident] Uji kecekapan membaca kecerunan daripada bentuk am dan bentuk pintasan! Padankan kelima-lima garis lurus ini.","prompt":"Padankan setiap garis lurus dengan kecerunan atau garis serenjangnya:","pairs":[{"id":"a47u2m1","left":"2y = 6x - 5","right":"Selari dengan y = 3x + 4 (m = 3)"},{"id":"a47u2m2","left":"x/4 + y/8 = 1","right":"Kecerunan m = -8/4 = -2"},{"id":"a47u2m3","left":"3x + 2y - 7 = 0","right":"Serenjang kepada garis berkecerunan 2/3"},{"id":"a47u2m4","left":"Garis serenjang kepada y = -0.25x + 1","right":"Berkecerunan m = +4"},{"id":"a47u2m5","left":"Garis mengufuk y = 5","right":"Serenjang kepada garis mencancang x = 2"}],"explanation":"Dalam bentuk 3x + 2y - 7 = 0, susun menjadi y = (-3/2)x + 7/2 (m1 = -3/2). Hasil darab dengan m2 = 2/3 ialah -1, maka berserenjang!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Isih Pasangan Selari vs Serenjang","voiceCaption":"Kelaskan enam pasangan kecerunan atau persamaan garis berikut kepada Selari, Berserenjang atau Tidak Kedua-duanya.","voiceScript":"[curious] Semak nilai m satu dan m dua dengan teliti! Kelaskan enam pasangan garis ini kepada Selari, Berserenjang atau Tidak Kedua-duanya.","prompt":"Isihkan pasangan garis lurus berikut mengikut hubungannya:","buckets":[{"id":"selari","label":"Garis Selari (m1 = m2)"},{"id":"serenjang","label":"Garis Serenjang (m1*m2 = -1)"},{"id":"lain","label":"Bersilang Biasa (Bukan Kedua-duanya)"}],"items":[{"text":"y = 4x - 1 dan 8x - 2y + 5 = 0","bucketId":"selari","note":"Betul! Kedua-duanya mempunyai kecerunan +4."},{"text":"y = (2/5)x + 3 dan 5x + 2y = 10","bucketId":"serenjang","note":"Tepat! m1 = 2/5 dan m2 = -5/2 memberi m1*m2 = -1."},{"text":"y = 3x + 2 dan y = -3x + 2","bucketId":"lain","note":"Perangkap berjaya dielak! 3 * (-3) = -9 != -1."},{"text":"x/3 + y/6 = 1 dan y = -2x + 9","bucketId":"selari","note":"Betul! m1 = -6/3 = -2 sama dengan m2 = -2."},{"text":"y = x + 4 dan y = -x + 7","bucketId":"serenjang","note":"Tepat! 1 * (-1) = -1."},{"text":"y = (1/2)x dan y = 2x","bucketId":"lain","note":"Betul! Hasil darab ialah +1, bukan -1."}],"explanation":"Sentiasa periksa kedua-dua syarat: sama nilai & sama tanda bagi selari; terbalik & berlawanan tanda (hasil darab = -1) bagi berserenjang."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Persamaan Pembahagi Dua Sama Serenjang","voiceCaption":"Cari persamaan pembahagi dua sama serenjang bagi tembereng garis yang menyambungkan A satu koma dua dengan B lima koma sepuluh.","voiceScript":"[confident] Selesaikan soalan wajib ini: cari persamaan pembahagi dua sama serenjang bagi tembereng garis A satu koma dua dan B lima koma sepuluh!","prompt":"Cari persamaan pembahagi dua sama serenjang bagi tembereng garis AB dengan A(1, 2) dan B(5, 10).","options":["2y + x = 15","y = 2x","2y - x = 9","y + 2x = 12"],"correctIndex":0,"explanation":"Titik tengah M = ((1+5)/2, (2+10)/2) = (3, 6). Kecerunan AB = (10 - 2)/(5 - 1) = 2, maka kecerunan serenjang = -1/2. Persamaan melalui (3, 6): y - 6 = (-1/2)(x - 3) => 2y - 12 = -x + 3 => 2y + x = 15."}]},{"id":"addm47-u3","title":"Unit 3: Luas Poligon (Kaedah Tali Kasut)","subtitle":"Subtopik 7.3 — Rumus Luas Segi Tiga & Sisi Empat Mengikut Tertib Lawan Arah Jam serta Syarat Titik Segaris","iconType":"formula","iconUrl":"../assets/icons/addm47-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kaedah Tali Kasut Luas Poligon","voiceCaption":"Luas sebarang poligon di atas satah Cartes dikira dengan kaedah tali kasut dengan menyenaraikan bucu mengikut tertib lawan arah jam dan mengulang titik pertama pada hujung.","voiceScript":"[warm] Selamat datang ke Unit tiga, Luas Poligon! Untuk mencari luas segi tiga, sisi empat atau pentagon daripada koordinat bucu, kita gunakan rumus tali kasut atau shoelace formula! Peraturan paling wajib: susun semua koordinat bucu mengikut tertib LAWAN ARAH JAM atau arah jam secara berurutan mengelilingi poligon — JANGAN melompat bucu secara bersilang bagi sisi empat! Dan jangan lupa mengulang semula titik pertama di lajur paling kanan! Darabkan pepenjuru ke bawah kanan untuk jumlah pertama, tolakkan hasil darab pepenjuru ke atas kanan untuk jumlah kedua, ambil nilai mutlak dan darab setengah! Jika tiga titik adalah SEGARIS, luas segi tiga bernilai sifar! Uji pada plot di bawah!","title":"7.3 Luas Poligon (Kaedah Tali Kasut) & Syarat Titik Segaris","acronym":"L•A•J•0","hook":"Seret bucu C(2, y) ke y = 0.4 pada plot di bawah untuk melihat luas segi tiga runtuh menjadi sifar apabila segaris!","summary":"Luas poligon dengan n bucu mengikut turutan lawan arah jam ialah 0.5 * |(jumlah darab silang ke bawah) - (jumlah darab silang ke atas)|; luas = 0 menandakan titik segaris.","bullets":["Kaedah Tali Kasut (Shoelace Formula): Tulis bucu (x1, y1), (x2, y2), ..., (xn, yn) dan ULANG (x1, y1) di akhir. Luas = (1/2) * |(x1*y2 + x2*y3 + ... + xn*y1) - (x2*y1 + x3*y2 + ... + x1*yn)|.","Kepentingan Tertib Bucu bagi Sisi Empat / Pentagon: Sentiasa lakarkan titik secara kasar dahulu supaya bucu disusun mengikut perimeter (lawan arah jam memberi nilai positif terus tanpa perlu tanda mutlak).","Syarat Titik Segaris (Collinear): Tiga titik A, B, C segaris jika (1) Kecerunan AB = Kecerunan BC, ATAU (2) Luas segi tiga ABC = 0."],"formula":"Luas = (1/2) * |(x1y2 + x2y3 + ... + xny1) - (x2y1 + x3y2 + ... + x1yn)|","labId":"addm47_luas_lokus_lab","labTitle":"Penjelajah Luas Poligon (Tali Kasut) & Titik Segaris","labProps":{"tab":"luas","cy":5},"examTip":"Apabila soalan memberi luas segi tiga (cth. 12 unit^2) dan meminta nilai pemalar k di salah satu bucu, JANGAN buang tanda nilai mutlak |...| begitu sahaja! Ia memberi DUA kes: ungkapan dalam mutlak = +24 ATAU -24, jadi lazimnya ada DUA nilai k!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Syarat Luas Sifar (Segaris)","voiceCaption":"Ramalkan nilai y bagi titik C dua koma y jika ketiga-tiga titik A sifar koma sifar, B lima koma satu dan C adalah segaris.","voiceScript":"[curious] Cuba ramalkan nilai y bagi titik C dua koma y supaya ia jatuh tepat di atas garis yang menyambungkan asalan sifar koma sifar dan B lima koma satu, menjadikan luas segi tiga sifar!","hook":"Sahkan dengan menggerakkan slider y pada Penjelajah Luas Poligon!","scenario":"Tiga titik A(0, 0), B(5, 1) dan C(2, y) mempunyai luas segi tiga ABC = 0 unit^2.","prompt":"Apakah nilai y supaya ketiga-tiga titik A, B dan C adalah segaris?","options":["y = 0.4","y = 2.0","y = 0.2","y = 1.0"],"correctIndex":0,"proofLabId":"addm47_luas_lokus_lab","proofState":{"tab":"luas","cy":0.4},"explanation":"Kecerunan AB = (1 - 0)/(5 - 0) = 0.2. Maka kecerunan AC = (y - 0)/(2 - 0) = 0.2 => y = 0.4 (atau dengan rumus luas: 0.5 |5y - 2| = 0 => y = 0.4)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Langkah Kaedah Tali Kasut","voiceCaption":"Susun langkah mengira luas segi tiga dengan bucu kosong koma kosong, empat koma satu dan dua koma lima menggunakan kaedah tali kasut.","voiceScript":"[confident] Susun empat langkah pengiraan luas segi tiga bucu asalan, empat koma satu dan dua koma lima menggunakan kaedah tali kasut!","prompt":"Susun langkah mengira luas segi tiga A(0, 0), B(4, 1), C(2, 5):","hint":"Ulang titik pertama A(0, 0) di bahagian akhir susunan...","answerTokens":["Susun koordinat mengikut tertib lawan arah jam dan ulang (0,0) di hujung","Darab ke bawah: (0)(1) + (4)(5) + (2)(0) = 20","Darab ke atas: (4)(0) + (2)(1) + (0)(5) = 2","Kira Luas = 0.5 * |20 - 2| = 9 unit^2"],"distractors":["Bahagi hasil tolak dengan 4 dan bukannya 2","Lupa mengulang koordinat A(0, 0) pada lajur terakhir"],"explanation":"Susunan lajur (0,0) -> (4,1) -> (2,5) -> (0,0) memberi jumlah ke bawah 20 dan ke atas 2. Maka Luas = 0.5 * |20 - 2| = 9 unit^2."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cari Dua Nilai Pemalar k daripada Luas","voiceCaption":"Cari semua nilai k yang mungkin apabila diberi luas segi tiga dengan satu bucu berkordinat pemalar k.","voiceScript":"[confident] Soalan lazim Kertas satu! Cari nilai-nilai k yang mungkin jika luas segi tiga bagi bucu sifar koma sifar, empat koma sifar dan dua koma k ialah sepuluh unit persegi.","prompt":"Luas segi tiga dengan bucu A(0, 0), B(4, 0) dan C(2, k) ialah 10 unit^2. Cari semua nilai k yang mungkin.","options":["k = 5 atau k = -5","k = 5 sahaja","k = 10 atau k = -10","k = 2.5 atau k = -2.5"],"correctIndex":0,"explanation":"Luas = 0.5 * |(0 + 4k + 0) - (0 + 0 + 0)| = 0.5 |4k| = 2|k| = 10 => |k| = 5 => k = 5 atau k = -5 (satu di atas paksi-x, satu di bawah paksi-x)."}]},{"id":"addm47-u4","title":"Unit 4: Persamaan Lokus dalam Satah Cartes","subtitle":"Subtopik 7.4 — Lokus Jarak Malar (Bulatan), Jarak Sama dari 2 Titik, Nisbah m : n & Sudut Tepat","iconType":"pendulum","iconUrl":"../assets/icons/addm47-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"3 Jenis Persamaan Lokus Utama","voiceCaption":"Persamaan lokus titik bergerak P x koma y dibina menggunakan rumus jarak dua titik bagi kes jarak malar, jarak sama dari dua titik, dan jarak bernisbah m kepada n.","voiceScript":"[warm] Selamat datang ke Unit empat, Persamaan Lokus! Dalam Geometri Koordinat, lokus ialah lintasan yang dilalui oleh titik bergerak P x koma y yang mematuhi syarat jarak tertentu! Ingat tiga jenis lokus teras S P M: pertama, jika P bergerak pada jarak tetap r dari satu titik tetap A, maka jarak P A sama dengan r menghasilkan persamaan BULATAN kurungan x tolak x satu kuasa dua tambah y tolak y satu kuasa dua sama dengan r kuasa dua! Kedua, jika P sentiasa berjarak sama dari dua titik tetap A dan B, iaitu P A sama dengan P B, sebutan x kuasa dua dan y kuasa dua saling menghapus meninggalkan persamaan GARIS LURUS pembahagi dua sama serenjang! Ketiga, jika nisbah P A kepada P B ialah m kepada n dengan m tidak sama n, gunakan n kuasa dua darab P A kuasa dua sama dengan m kuasa dua darab P B kuasa dua yang juga menghasilkan satu bulatan! Terokai simulator lokus di bawah!","title":"7.4 Persamaan Lokus Titik Bergerak P(x, y)","acronym":"J•B•S•N","hook":"Bandingkan nisbah 1 : 1 (garis lurus) dengan nisbah 2 : 1 (bulatan) dalam Simulator Lokus di bawah!","mediaKey":"addm47_lokus_bulatan","summary":"Persamaan lokus dibentuk dengan menukar syarat geometri jarak kepada persamaan algebra menggunakan rumus jarak PA = punca[(x - x1)^2 + (y - y1)^2] dan mengkuasadua kedua-dua belah.","bullets":["Kes 1 (Jarak malar r dari A): PA = r => (x - x1)^2 + (y - y1)^2 = r^2 (Bulatan berpusat A, berjejari r).","Kes 2 (Jarak sama dari A & B, PA = PB): (x - x1)^2 + (y - y1)^2 = (x - x2)^2 + (y - y2)^2. Sebutan x^2 dan y^2 terhapus -> Garis lurus (pembahagi dua sama serenjang AB).","Kes 3 (Nisbah PA : PB = m : n, m != n): PA / PB = m / n => n^2 [(x - x1)^2 + (y - y1)^2] = m^2 [(x - x2)^2 + (y - y2)^2].","Kes 4 (Sudut APB = 90 darjah): Guna hasil darab kecerunan m_AP * m_BP = -1 ATAU Teorem Pythagoras AP^2 + BP^2 = AB^2 (Bulatan berdiameter AB!)."],"formula":"PA : PB = m : n  =>  n^2 * PA^2 = m^2 * PB^2","labId":"addm47_luas_lokus_lab","labTitle":"Simulator Lokus Titik Bergerak PA : PB = m : n","labProps":{"tab":"lokus","ratioM":2},"examTip":"Kesilapan paling kerap apabila diberi PA : PB = 2 : 1! Jangan tulis 2 * PA^2 = PB^2 — anda MESTI kuasadua nisbah itu juga: PA = 2 PB => PA^2 = 4 * PB^2!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Syarat & Bentuk Lokus","voiceCaption":"Padankan empat syarat gerakan titik P dengan bentuk geometri dan persamaan lokusnya yang tepat.","voiceScript":"[confident] Padankan setiap syarat pergerakan titik P dengan bentuk geometri dan persamaannya yang betul!","prompt":"Padankan syarat lokus titik P(x, y) dengan bentuk geometri dan persamaannya:","pairs":[{"id":"a47u4m1","left":"Jarak P dari titik tetap (2, -3) sentiasa 5 unit","right":"Bulatan: (x - 2)^2 + (y + 3)^2 = 25"},{"id":"a47u4m2","left":"Jarak P dari A(1, 2) dan B(5, 2) sentiasa sama","right":"Garis lurus menegak: x = 3"},{"id":"a47u4m3","left":"Titik P bergerak supaya 2PA = 3PB","right":"4 * PA^2 = 9 * PB^2 (Bulatan)"},{"id":"a47u4m4","left":"Sudut APB sentiasa 90 darjah bagi A dan B tetap","right":"AP^2 + BP^2 = AB^2 (Lokus bulatan berdiameter AB)"}],"explanation":"Sentiasa kuasadua pekali di hadapan apabila mengkuasadua kedua-dua belah persamaan jarak, misalnya (2PA)^2 = 4PA^2."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Jenis Lokus PA = PB","voiceCaption":"Ramalkan jenis persamaan yang terhasil apabila titik P bergerak dengan jarak sama dari A satu koma dua dan B lima koma dua.","voiceScript":"[curious] Apabila titik bergerak P sentiasa berjarak sama dari A satu koma dua dan B lima koma dua, apakah jenis persamaan lokus yang terbentuk?","hook":"Sahkan dengan nisbah 1 : 1 pada Simulator Lokus!","scenario":"Titik P(x, y) bergerak dengan keadaan PA = PB bagi A(1, 2) dan B(5, 2).","prompt":"Apakah persamaan lokus bagi titik P tersebut?","options":["x = 3 (garis lurus menegak yang menjadi pembahagi dua sama serenjang AB)","y = 2 (garis lurus mengufuk)","(x - 3)^2 + (y - 2)^2 = 4 (bulatan)","x^2 + y^2 = 16"],"correctIndex":0,"proofLabId":"addm47_luas_lokus_lab","proofState":{"tab":"lokus","ratioM":1},"explanation":"(x - 1)^2 + (y - 2)^2 = (x - 5)^2 + (y - 2)^2 => x^2 - 2x + 1 = x^2 - 10x + 25 => 8x = 24 => x = 3."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cari Persamaan Lokus Bulatan","voiceCaption":"Tentukan persamaan am lokus bagi titik bergerak P yang sentiasa berjarak tiga unit dari titik tetap empat koma negatif satu.","voiceScript":"[confident] Kembangkan persamaan lokus bulatan berpusat empat koma negatif satu dan berjejari tiga kepada bentuk am!","prompt":"Cari persamaan lokus bagi titik P(x, y) yang sentiasa berjarak 3 unit dari titik tetap C(4, -1).","options":["x^2 + y^2 - 8x + 2y + 8 = 0","x^2 + y^2 - 8x + 2y + 14 = 0","x^2 + y^2 + 8x - 2y + 8 = 0","x^2 + y^2 - 4x + y - 9 = 0"],"correctIndex":0,"explanation":"(x - 4)^2 + (y + 1)^2 = 3^2 => x^2 - 8x + 16 + y^2 + 2y + 1 = 9 => x^2 + y^2 - 8x + 2y + 8 = 0."}]},{"id":"addm47-u5","title":"Unit 5: Cabaran Boss SPM — Geometri Koordinat","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Rombos/Segi Empat Selari, Pembahagi Tembereng, Luas & Lokus","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Cari Hujung daripada Titik Tengah","voiceCaption":"Soalan Boss pertama menentukan pemalar h dan k pada titik hujung apabila titik tengah AB diberi.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab tujuh! Soalan pertama daripada Latihan Pengukuhan buku teks: titik tengah bagi A h koma satu dan B tujuh koma k ialah M dua koma tiga. Cari nilai h dan k!","prompt":"Titik tengah bagi garis lurus yang menyambungkan A(h, 1) dan B(7, k) ialah M(2, 3). Cari nilai h dan k.","options":["h = -3, k = 5","h = 5, k = -3","h = -5, k = 5","h = 3, k = 2"],"correctIndex":0,"explanation":"(h + 7)/2 = 2 => h + 7 = 4 => h = -3. (1 + k)/2 = 3 => 1 + k = 6 => k = 5."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Garis Serenjang & Titik Segaris","voiceCaption":"Ramalkan nilai k supaya tiga titik A dua koma satu, B empat koma lima dan C k koma sembilan adalah segaris.","voiceScript":"[curious] Soalan Boss kedua! Tiga titik A dua koma satu, B empat koma lima dan C k koma sembilan terletak di atas satu garis lurus yang sama. Berapakah nilai k?","hook":"Samakan kecerunan AB dengan kecerunan BC!","scenario":"Tiga titik A(2, 1), B(4, 5) dan C(k, 9) adalah segaris.","prompt":"Apakah nilai pemalar k?","options":["k = 6","k = 8","k = 5","k = 7"],"correctIndex":0,"proofLabId":"addm47_pembahagi_serenjang_lab","proofState":{"m":1,"n":1,"showPerp":true},"explanation":"Kecerunan AB = (5 - 1)/(4 - 2) = 2. Kecerunan BC = (9 - 5)/(k - 4) = 4/(k - 4) = 2 => k - 4 = 2 => k = 6."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Lokus Nisbah PA = 2 PB","voiceCaption":"Susun langkah membina persamaan am lokus bagi titik bergerak P supaya jarak P A sentiasa dua kali jarak P B.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas dua! Susun langkah mencari persamaan lokus titik P jika P A sama dengan dua P B bagi A asalan dan B tiga koma sifar.","prompt":"Susun langkah mencari persamaan lokus P(x, y) jika PA = 2PB bagi A(0, 0) dan B(3, 0):","hint":"Kuasaduakan kedua-dua belah persamaan PA = 2PB menjadi PA^2 = 4 PB^2...","answerTokens":["Kuasadua kedua-dua belah: PA^2 = 4 * PB^2","Ganti rumus jarak: x^2 + y^2 = 4[(x - 3)^2 + y^2]","Kembangkan: x^2 + y^2 = 4x^2 - 24x + 36 + 4y^2","Permudah dengan membahagi 3: x^2 + y^2 - 8x + 12 = 0"],"distractors":["Tulis x^2 + y^2 = 2[(x - 3)^2 + y^2] tanpa mengkuasadua 2","Hapuskan x^2 dan y^2 supaya tinggal garis lurus"],"explanation":"Mengkuasadua pekali 2 menjadi 4 memberi 3x^2 + 3y^2 - 24x + 36 = 0, yang diringkaskan kepada x^2 + y^2 - 8x + 12 = 0."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Teknik Sisi Empat & Lokus","voiceCaption":"Padankan empat strategi pantas Kertas dua Geometri Koordinat dengan penerangan atau rumus tepatnya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat strategi Geometri Koordinat ini dengan teknik penyelesaiannya.","prompt":"Padankan masalah Geometri Koordinat dengan strategi penyelesaian pantasnya:","pairs":[{"id":"a47b4m1","left":"Cari bucu ke-4 D bagi segi empat selari ABCD","right":"Samakan titik tengah pepenjuru AC = titik tengah BD"},{"id":"a47b4m2","left":"Cari pintasan lokus pada paksi-x","right":"Gantikan y = 0 ke dalam persamaan lokus"},{"id":"a47b4m3","left":"Semak sama ada 2 garis membentuk sudut tegak 90 darjah","right":"Tunjukkan hasil darab kecerunan m1 * m2 = -1"},{"id":"a47b4m4","left":"Luas segi empat PQRS mengikut perimeter","right":"Susun 4 bucu lawan arah jam & ulang bucu P di akhir"}],"explanation":"Menggunakan sifat pepenjuru segi empat selari saling membahagi dua sama (Titik Tengah AC = Titik Tengah BD) membolehkan bucu keempat dicari dalam dua baris sahaja!"},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Luas Sisi Empat Tali Kasut","voiceCaption":"Hitung luas sisi empat dengan empat koordinat bucu yang disusun mengikut tertib lawan arah jam.","voiceScript":"[excited] Soalan Boss terakhir Bab tujuh! Hitung luas sisi empat dengan bucu P sifar koma sifar, Q enam koma sifar, R empat koma empat dan S satu koma tiga!","prompt":"Hitung luas sisi empat PQRS dengan bucu-bucu mengikut tertib lawan arah jam: P(0, 0), Q(6, 0), R(4, 4) dan S(1, 3).","options":["16 unit^2","32 unit^2","14 unit^2","18 unit^2"],"correctIndex":0,"explanation":"Susunan (0,0) -> (6,0) -> (4,4) -> (1,3) -> (0,0). Jumlah ke bawah = 0 + 24 + 12 + 0 = 36. Jumlah ke atas = 0 + 0 + 4 + 0 = 4. Luas = 0.5 * |36 - 4| = 16 unit^2."}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {

(function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") {
      window.NotaAudio.playTypewriterTick();
    } else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") {
      window.NotaAudio.playPaperRustle();
    } else if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {
      window.NotaAudio.playSnap();
    } else if (typeof window.NotaAudio.playTap === "function") {
      window.NotaAudio.playTap();
    }
  }

  function ensureScopedStyles() {
    if (typeof document === "undefined" || document.getElementById("addm47-labs-css")) return;
    var style = document.createElement("style");
    style.id = "addm47-labs-css";
    style.textContent = [
      ".addm47-svg{display:block;width:100%;height:auto;border-radius:12px;}",
      ".addm47-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}",
      ".addm47-pill{min-height:44px;padding:6px 12px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.14s ease;}",

    ].join("");
    document.head.appendChild(style);
  }

  function renderArchivalGallery(keys, headLabel) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) {
      return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null;
    }).filter(Boolean);
    if (items.length === 0) return "";
    var cards = items.map(function (it, idx) {
      var r = it.rec;
      var src = r.dataUri || r.src || "";
      var prio = idx === 0 ? ' fetchpriority="high"' : ' loading="lazy"';
      return (
        '<button type="button" class="archival-plate-btn" data-addm47-plate="' + esc(it.key) + '">' +
          '<img class="archival-plate-img" src="' + src + '" alt="' + esc(r.label || "Visual Geometri Koordinat") + '" decoding="async"' + prio + ">" +
          '<div class="archival-plate-meta">' +
            (r.era ? '<div class="archival-plate-era">' + esc(r.era) + "</div>" : "") +
            '<div class="archival-plate-title">' + esc(r.label || "") + "</div>" +
          "</div>" +
        "</button>"
      );
    }).join("");
    return (
      '<div class="archival-section-head"><span>' + esc(headLabel || "Galeri Aplikasi Geometri Koordinat") + "</span></div>" +
      '<div class="archival-gallery-grid">' + cards + "</div>"
    );
  }

  function bindArchivalGallery(shell, ctx) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    shell.querySelectorAll("[data-addm47-plate]").forEach(function (btn) {
      btn.addEventListener("click", function () {

        var rec = mediaMap[key];
        if (!rec) return;
        playSfx("paper");
        if (ctx && ctx.markInteracted) ctx.markInteracted();
        if (typeof NotaFeel !== "undefined" && typeof NotaFeel.openArchivalLightbox === "function") {

  /* =========================================================================
     MAKMAL 1: addm47_pembahagi_serenjang_lab

     ========================================================================= */
  window.ETUTOR_NOTA_LABS.addm47_pembahagi_serenjang_lab = function (shell, ctx) {

    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var m = typeof ps.m === "number" ? ps.m : 2;
    var n = typeof ps.n === "number" ? ps.n : 3;
    var showPerp = Boolean(ps.showPerp);

    // Fixed segment A(-2, 6) to B(8, -4)
    var ax = -2, ay = 6, bx = 8, by = -4;
    function mapX(x) { return 180 + x * 28; }
    function mapY(y) { return 155 - y * 15; }

    function render() {
      var px = (n * ax + m * bx) / (m + n);
      var py = (n * ay + m * by) / (m + n);
      var gradAB = (by - ay) / (bx - ax); // -1
      var gradPerp = -1 / gradAB; // +1

        '  <line x1="' + pAx + '" y1="' + pAy + '" x2="' + pBx + '" y2="' + pBy + '" stroke="#38bdf8" stroke-width="3.4"/>',

        '  <text x="' + (pBx + 10) + '" y="' + (pBy + 12) + '" text-anchor="start" font-family="JetBrains Mono,monospace" font-size="9.5" font-weight="800" fill="#bae6fd">B(8, -4)</text>',

      ].join("");

      shell.innerHTML = [
        '<div class="addm47-chip-row">',

        '<div class="lab-readout-grid">',
        '  <div class="lab-meter"><span class="lab-meter-label">Koordinat P</span><strong class="lab-meter-val">(' + px.toFixed(2) + ", " + py.toFixed(2) + ")</strong></div>",
        '  <div class="lab-meter"><span class="lab-meter-label">Kecerunan AB vs Serenjang</span><strong class="lab-meter-val">m1 = ' + gradAB.toFixed(1) + " | m2 = +" + gradPerp.toFixed(1) + "</strong></div>",

function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;
  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderTopHud() {

  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");

  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");

  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");

  var muteBtn = document.getElementById("notaMuteBtn");
