/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;

}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;

}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);

}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;

@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;

.node-float-tag {

  font-size: 0.74rem;
  font-weight: 800;

.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab08","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":8,"title":"Vektor","subtitle":"Subtopik 8.1–8.3 KSSM — Kuantiti Skalar vs Vektor, Vektor Selari & Titik Segaris, Penambahan/Penolakan Vektor Paduan (Segi Tiga & Segi Empat Selari), Vektor Cartes (i, j) & Vektor Unit.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab08-labs.js","coverIcon":"../assets/icons/addm48-u1.jpg","editionBadge":"Edisi Simulasi & Plot Vektor","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pengiraan vektor paduan dan vektor unit kamu sangat mantap!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Hukum segi tiga, titik segaris dan vektor Cartes berjaya kamu selesaikan!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Semak semula arah anak panah vektor negatif dan pendaraban skalar selari.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab lapan berjaya kamu takluki!"},"units":[{"id":"addm48-u1","title":"Unit 1: Konsep Vektor, Vektor Selari & Titik Segaris","subtitle":"Subtopik 8.1 — Skalar vs Vektor, Tatatanda, Vektor Negatif/Sifar & Syarat Vektor Selari (u = kv)","iconType":"pendulum","iconUrl":"../assets/icons/addm48-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Asas Vektor & Syarat Selari","voiceCaption":"Vektor memiliki kedua-dua magnitud dan arah, manakala dua vektor adalah selari jika satu vektor ialah gandaan skalar vektor yang satu lagi.","voiceScript":"[warm] Selamat datang ke Bab lapan, Vektor! Dalam subtopik lapan perpuluhan satu, bezakan kuantiti skalar yang hanya ada magnitud seperti jisim dan laju, daripada kuantiti vektor yang wajib ada KEDUA-DUA magnitud dan arah seperti halaju, sesaran dan daya! Vektor dari A ke B ditulis A B beranak panah, dan jika arahnya diterbalikkan kepada B A, ia menjadi vektor negatif negatif A B! Dua vektor u dan v adalah SELARI jika dan hanya jika u sama dengan k darab v, di mana k ialah pemalar skalar! Jika tiga titik A, B dan C memenuhi A B sama dengan k B C, kerana kedua-duanya berkongsi titik sepunya B, maka A, B dan C adalah SEGARIS!","title":"8.1 Kuantiti Vektor, Tatatanda & Syarat Vektor Selari","acronym":"M•A•K•S","hook":"Ingat syarat emas: Vektor selari <=> u = kv; Titik segaris <=> AB = kBC (ada titik sepunya B)!","mediaKey":"addm48_vektor_kapal","videoClip":{"src":"../assets/matematik-tambahan-t4-bab08/video/addm48_video_vektor_narasi.mp4","hasNarration":true,"posterKey":"addm48_vektor_kapal","caption":"Video Penerangan Bersuara (BM): Hukum Segi Tiga dan Hukum Segi Empat Selari bagi vektor paduan serta leraian komponen vektor unit i dan j"},"summary":"Vektor mempunyai magnitud dan arah; vektor negatif menterbalikkan arah (-AB = BA); dua vektor bukan sifar adalah selari jika u = kv.","bullets":["Skalar vs Vektor: Skalar hanya ada magnitud (jarak, laju, suhu, jisim, luas). Vektor ada magnitud DAN arah (sesaran, halaju, pecutan, daya, momentum).","Vektor Sifar (0), Negatif (-a) & Sama: Vektor sifar mempunyai magnitud 0 dan tiada arah tentu. Dua vektor adalah SAMA hanya jika kedua-dua magnitud DAN arahnya sama. Vektor negatif -AB = BA (magnitud sama, arah bertentangan).","Vektor Selari & Titik Segaris: Jika u = kv (k != 0), u dan v selari (k > 0 searah; k < 0 arah bertentangan). Jika AB = kBC (atau AB = kAC), wujud titik sepunya, maka titik A, B, C adalah SEGARIS!"],"formula":"BA = -AB   |   Selari: u = k * v   |   Segaris: AB = k * BC","labId":"addm48_vektor_paduan_lab","labTitle":"Simulator Hukum Segi Tiga & Vektor Paduan","labProps":{"op":"tambah","ax":4,"ay":1,"bx":2,"by":3},"examTip":"Semasa membuktikan tiga titik P, Q, R adalah segaris dalam Kertas 2, WAJIB tulis kedua-dua fakta untuk markah penuh: (1) PQ = k QR (selari), dan (2) Q ialah titik sepunya!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Kuantiti Skalar vs Vektor","voiceCaption":"Asingkan enam kuantiti fizik berikut antara Kuantiti Skalar dengan Kuantiti Vektor.","voiceScript":"[curious] Mari semak asas subtopik lapan perpuluhan satu! Asingkan keenam-enam kuantiti berikut kepada Kuantiti Skalar atau Kuantiti Vektor.","prompt":"Kelaskan kuantiti berikut kepada Kuantiti Skalar atau Kuantiti Vektor:","buckets":[{"id":"skalar","label":"Kuantiti Skalar (Magnitud Sahaja)"},{"id":"vektor","label":"Kuantiti Vektor (Magnitud + Arah)"}],"items":[{"text":"Sebuah pesawat terbang pada laju 800 km/j ke arah Timur Laut","bucketId":"vektor","note":"Betul! Mempunyai magnitud (800 km/j) dan arah (Timur Laut) — ini ialah halaju."},{"text":"Sebuah kotak berjisim 15 kg diletakkan di atas meja","bucketId":"skalar","note":"Tepat! Jisim tidak mempunyai arah."},{"text":"Daya tolakan 40 N ke bawah ke atas omboh","bucketId":"vektor","note":"Betul! Daya sentiasa bertindak pada arah tertentu."},{"text":"Jarak larian seorang atlet ialah 400 m mengelilingi trek","bucketId":"skalar","note":"Tepat! Jarak ialah jumlah panjang lintasan (skalar), berbeza dengan sesaran (vektor)."},{"text":"Sesaran kapal ialah 12 km pada bearing 060 darjah","bucketId":"vektor","note":"Betul! Sesaran mengukur kedudukan dengan arah bearing."},{"text":"Suhu makmal sains ialah 27 darjah Celsius","bucketId":"skalar","note":"Tepat! Suhu ialah kuantiti skalar."}],"explanation":"Vektor wajib menentukan arah (seperti Timur Laut, ke bawah, bearing 060 darjah), manakala skalar hanya menyatakan nilai berangka dan unit."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Bukti Titik Segaris","voiceCaption":"Susun langkah pembuktian bahawa tiga titik A, B dan C adalah segaris apabila diberi vektor A B dan B C.","voiceScript":"[confident] Susun empat langkah pembuktian rasmi S P M untuk menunjukkan bahawa tiga titik A, B dan C terletak di atas satu garis lurus yang sama!","prompt":"Diberi AB = 4u + 6v dan BC = 6u + 9v. Susun langkah membuktikan A, B, C segaris:","hint":"Faktorkan pemalar daripada kedua-dua vektor untuk mencari nisbah k...","answerTokens":["Faktorkan kedua-dua vektor: AB = 2(2u + 3v) dan BC = 3(2u + 3v)","Ungkapkan hubungan skalar: AB = (2/3) BC","Nyatakan AB dan BC adalah selari dengan arah yang sama","Oleh sebab B ialah titik sepunya, maka A, B dan C adalah segaris"],"distractors":["Tunjukkan magnitud |AB| = |BC|","Katakan AC tidak mempunyai kaitan dengan AB"],"explanation":"Dua elemen mesti disebut: persamaan skalar AB = (2/3)BC membuktikan keselarasan, dan titik sepunya B membuktikan ketiga-tiga titik berada pada satu garis."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Banding Vektor Selari & Arah","voiceCaption":"Tentukan hubungan antara vektor A B sama dengan enam a tolak dua b dengan vektor C D sama dengan negatif sembilan a tambah tiga b.","voiceScript":"[confident] Uji keselarasan vektor! Jika vektor A B sama dengan enam a tolak dua b dan vektor C D sama dengan negatif sembilan a tambah tiga b, apakah hubungan antara A B dan C D?","prompt":"Diberi AB = 6a - 2b dan CD = -9a + 3b. Nyatakan hubungan antara AB dan CD.","options":["CD = -(3/2) AB; kedua-duanya selari tetapi bertentangan arah","CD = (3/2) AB; kedua-duanya selari dan searah","CD dan AB berserenjang antara satu sama lain","CD tidak selari dengan AB kerana pekali negatif"],"correctIndex":0,"explanation":"CD = -9a + 3b = -(3/2)(6a - 2b) = -(3/2) AB. Kerana wujud pemalar skalar negatif k = -3/2, kedua-duanya selari dengan arah bertentangan dan |CD| = 1.5 |AB|."}]},{"id":"addm48-u2","title":"Unit 2: Penambahan, Penolakan & Vektor Paduan","subtitle":"Subtopik 8.2 — Hukum Segi Tiga, Segi Empat Selari, Poligon, Penolakan Vektor & Vektor Tidak Selari","iconType":"formula","iconUrl":"../assets/icons/addm48-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Hukum Segi Tiga & Vektor Paduan","voiceCaption":"Penambahan vektor mengikut hukum segi tiga menggabungkan pangkal-ke-hujung A B tambah B C menjadi A C, manakala dua vektor tidak selari memenuhi h a sama dengan k b hanya jika h dan k sifar.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam subtopik lapan perpuluhan dua, rahsia paling mudah mencari vektor laluan adalah Hukum Segi Tiga: huruf hujung pertama mesti sama dengan huruf pangkal kedua! Contohnya A B tambah B C menjadi A C — huruf B di tengah hilang! Jika diberi vektor kedudukan dari asalan O, maka A B sentiasa sama dengan O B tolak O A, iaitu belakang tolak hadapan! Satu lagi teorem sangat berguna dalam Kertas dua ialah vektor bukan sifar yang tidak selari: jika h darab vektor a sama dengan k darab vektor b dan kedua-duanya tidak selari, maka satu-satunya penyelesaian ialah h sama dengan sifar dan k sama dengan sifar! Terokai penambahan dan penolakan pada simulator di bawah!","title":"8.2 Penambahan, Penolakan Vektor & Teorem Vektor Tak Selari","acronym":"AB+BC=AC","hook":"Tukar mod Penambahan vs Penolakan dan seret komponen vektor pada Simulator Vektor Paduan!","mediaKey":"addm48_daya_paduan","summary":"Vektor paduan terhasil melalui Hukum Segi Tiga (AB + BC = AC) atau Hukum Segi Empat Selari; bagi vektor tak selari a dan b, h*a = k*b memberi h = 0 dan k = 0.","bullets":["Hukum Segi Tiga & Poligon: AB + BC = AC (pangkal ke hujung). Secara umum, AB + BC + CD + DE = AE! Penolakan: a - b = a + (-b), dan AB = OB - OA (Hujung tolak Pangkal!).","Hukum Segi Empat Selari: Jika OA = a dan OB = b bermula dari titik sepunya O, pepenjuru daripada O ialah vektor paduan OC = a + b.","Prinsip Vektor Bukan Sifar & Tidak Selari: Jika h*a = k*b (dengan a, b bukan sifar dan tidak selari), maka h = 0 DAN k = 0. Digunakan untuk mencari dua pemalar apabila ungkapan vektor disamakan!"],"formula":"AB + BC = AC   |   AB = OB - OA   |   h*a = k*b (tak selari) => h = 0, k = 0","labId":"addm48_vektor_paduan_lab","labTitle":"Uji Hukum Segi Tiga & Penolakan Vektor (a - b)","labProps":{"op":"tolak","ax":4,"ay":1,"bx":2,"by":3},"examTip":"Apabila mencari vektor dari A ke B melalui titik tengah atau nisbah (cth. AP : PB = 1 : 2), tuliskan jalan berantai OP = OA + AP = OA + (1/3)AB sebelum menggantikan ungkapan."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Hasil Penolakan Vektor a - b","voiceCaption":"Ramalkan komponen vektor paduan a tolak b apabila vektor a ialah empat i tambah j dan vektor b ialah dua i tambah tiga j.","voiceScript":"[curious] Gunakan hukum penolakan vektor a tolak b sama dengan a tambah negatif b! Jika a ialah empat i tambah j dan b ialah dua i tambah tiga j, apakah komponen vektor paduan a tolak b?","hook":"Sahkan arah anak panah kuning pada mod Penolakan dalam simulator!","scenario":"Diberi vektor a = 4i + j dan vektor b = 2i + 3j.","prompt":"Apakah ungkapan dan magnitud bagi vektor r = a - b?","options":["r = 2i - 2j dengan |r| = punca(8) = 2.83","r = 6i + 4j dengan |r| = punca(52) = 7.21","r = -2i + 2j dengan |r| = 2.83","r = 2i + 4j dengan |r| = punca(20) = 4.47"],"correctIndex":0,"proofLabId":"addm48_vektor_paduan_lab","proofState":{"op":"tolak","ax":4,"ay":1,"bx":2,"by":3},"explanation":"r = (4 - 2)i + (1 - 3)j = 2i - 2j. Magnitud |r| = punca(2^2 + (-2)^2) = punca(8) = 2.83."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Laluan Poligon Vektor","voiceCaption":"Padankan empat hasil tambah atau tolak laluan vektor dengan vektor paduannya yang teringkas.","voiceScript":"[confident] Gunakan Hukum Segi Tiga dan sifat vektor negatif untuk memadankan setiap gabungan laluan vektor ini!","prompt":"Padankan gabungan vektor berikut dengan vektor paduan teringkasnya:","pairs":[{"id":"a48u2m1","left":"PQ + QR + RS","right":"PS"},{"id":"a48u2m2","left":"OQ - OP","right":"PQ"},{"id":"a48u2m3","left":"AB + BC + CA","right":"0 (vektor sifar)"},{"id":"a48u2m4","left":"XY - ZY","right":"XZ (kerana XY + YZ = XZ)"}],"explanation":"Perhatikan XY - ZY = XY + YZ = XZ, dan sebarang gelung tertutup seperti AB + BC + CA kembali ke titik asal lalu menghasilkan vektor sifar 0."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Kira Vektor Pembahagian Nisbah","voiceCaption":"Ungkapkan vektor O P dalam sebutan a dan b apabila titik P membahagi tembereng garis A B dalam nisbah satu kepada dua.","voiceScript":"[confident] Selesaikan soalan klasik Kertas dua ini! Diberi O A sama dengan tiga a, O B sama dengan enam b, dan P terletak pada A B supaya A P kepada P B ialah satu kepada dua. Ungkapkan O P dalam sebutan a dan b!","prompt":"Dalam segi tiga OAB, OA = 3a dan OB = 6b. Titik P terletak pada AB dengan nisbah AP : PB = 1 : 2. Ungkapkan OP dalam sebutan a dan b.","options":["2a + 2b","a + 4b","a + 2b","2a + 4b"],"correctIndex":0,"explanation":"AB = OB - OA = 6b - 3a. Maka OP = OA + (1/3)AB = 3a + (1/3)(6b - 3a) = 3a + 2b - a = 2a + 2b."}]},{"id":"addm48-u3","title":"Unit 3: Vektor dalam Satah Cartes & Vektor Unit","subtitle":"Subtopik 8.3 — Vektor Lajur & Komponen (xi + yj), Magnitud |r| = punca(x^2 + y^2) & Vektor Unit r^","iconType":"graph","iconUrl":"../assets/icons/addm48-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Vektor Cartes & Vektor Unit","voiceCaption":"Vektor dalam satah Cartes diwakili dalam komponen i dan j atau vektor lajur, dengan magnitud dikira melalui Teorem Pythagoras dan vektor unit diperoleh dengan membahagi vektor dengan magnitudnya.","voiceScript":"[warm] Selamat datang ke Unit tiga, Vektor dalam Satah Cartes! Dalam satah Cartes, i topi ialah vektor unit arah positif paksi x, dan j topi ialah vektor unit arah positif paksi y! Maka sebarang vektor r ditulis sebagai x i tambah y j atau dalam bentuk vektor lajur x di atas y! Magnitudnya sentiasa dihitung menggunakan Teorem Pythagoras: punca kuasa dua bagi x kuasa dua tambah y kuasa dua! Untuk mencari VEKTOR UNIT dalam arah r yang mempunyai panjang tepat satu unit, bahagikan vektor r itu dengan magnitudnya! Dan ingat: jika soalan meminta vektor berarah r tetapi bermagnitud k, darabkan k dengan vektor unitnya! Uji kalkulator Cartes di bawah!","title":"8.3 Vektor Cartes (xi + yj), Magnitud & Vektor Unit","acronym":"I•J•|R|•Û","hook":"Laraskan komponen x dan y pada kalkulator di bawah untuk melihat bagaimana vektor unit sentiasa kekal bermagnitud 1!","summary":"Vektor r = xi + yj mempunyai magnitud |r| = punca(x^2 + y^2) dan vektor unit r^ = (xi + yj)/punca(x^2 + y^2).","bullets":["Dua Perwakilan Cartes: xi + yj (komponen i, j) atau vektor lajur (x ; y). Penambahan/penolakan dilakukan terus mengikut komponen x dengan x, dan y dengan y.","Magnitud & Vektor Kedudukan: |r| = punca(x^2 + y^2). Jika A(x1, y1) dan B(x2, y2), vektor AB = OB - OA = (x2 - x1)i + (y2 - y1)j.","Vektor Unit (|r^| = 1): r^ = r / |r|. Untuk membina vektor baharu yang selari/searah dengan r dan bermagnitud M, gunakan M * r^ = M * (r / |r|)."],"formula":"|r| = punca(x^2 + y^2)   |   r^ = (xi + yj) / punca(x^2 + y^2)","labId":"addm48_cartes_unit_lab","labTitle":"Kalkulator Magnitud & Vektor Unit Satah Cartes","labProps":{"vx":6,"vy":8},"examTip":"Skema SPM: Semasa menulis vektor unit, biarkan dalam bentuk pecahan tepat seperti (3i - 4j)/5 atau (3/5)i - (4/5)j; jika melibatkan surd seperti 13, tulis (5i + 12j)/13 atau dengan punca yang kemas."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Langkah Membina Vektor Bermagnitud M","voiceCaption":"Susun langkah mencari satu vektor dalam arah v sama dengan tiga i tambah empat j yang mempunyai magnitud dua puluh unit.","voiceScript":"[confident] Susun empat langkah ini untuk membina satu vektor dalam arah tiga i tambah empat j yang bermagnitud dua puluh unit!","prompt":"Cari vektor yang searah dengan v = 3i + 4j dan mempunyai magnitud 20 unit:","hint":"Kira magnitud asal |v| dahulu untuk membentuk vektor unit...","answerTokens":["Kira magnitud asal |v| = punca(3^2 + 4^2) = 5","Bentukkan vektor unit v^ = (3i + 4j) / 5","Darab vektor unit dengan magnitud sasaran 20: 20 * (3i + 4j) / 5","Permudahkan untuk memperoleh 12i + 16j"],"distractors":["Darab terus v dengan 20 menjadi 60i + 80j","Bahagi 20 dengan 3 + 4 = 7"],"explanation":"Bahagikan v dengan |v| = 5 dahulu untuk menormalkan panjangnya kepada 1, kemudian skala sebanyak 20 kali: 4(3i + 4j) = 12i + 16j."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Vektor Cartes & Magnitud/Unit","voiceCaption":"Padankan empat vektor Cartes di kiri dengan magnitud atau vektor unitnya di kanan.","voiceScript":"[curious] Gunakan tigaan Pythagoras tiga empat lima dan lima dua belas tiga belas! Padankan keempat-empat vektor Cartes ini.","prompt":"Padankan setiap vektor Cartes dengan magnitud atau vektor unitnya:","pairs":[{"id":"a48u3m1","left":"r = 5i - 12j","right":"|r| = 13 dan r^ = (5i - 12j)/13"},{"id":"a48u3m2","left":"r = -8i + 6j","right":"|r| = 10 dan r^ = (-4i + 3j)/5"},{"id":"a48u3m3","left":"OA = 2i + 3j dan OB = 5i + 7j; cari |AB|","right":"punca(3^2 + 4^2) = 5"},{"id":"a48u3m4","left":"Vektor unit p = 0.6i + kj (k > 0)","right":"k = 0.8 (kerana 0.36 + k^2 = 1)"}],"explanation":"Setiap vektor unit memenuhi x^2 + y^2 = 1. Bagi 0.6i + kj, 0.6^2 + k^2 = 1 => k^2 = 0.64 => k = 0.8."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kira Pemalar bagi Magnitud Diberi","voiceCaption":"Cari nilai p yang positif apabila vektor tiga i tambah p j mempunyai magnitud lima unit.","voiceScript":"[confident] Jika vektor v sama dengan tiga i tambah p j mempunyai magnitud lima dan p lebih besar daripada sifar, berapakah nilai p?","prompt":"Diberi vektor v = 3i + pj mempunyai magnitud 5 unit dengan p > 0. Cari nilai p.","options":["p = 4","p = 2","p = 16","p = punca(34)"],"correctIndex":0,"explanation":"|v| = punca(3^2 + p^2) = 5 => 9 + p^2 = 25 => p^2 = 16. Kerana p > 0, maka p = 4."}]},{"id":"addm48-u4","title":"Unit 4: Aplikasi Vektor dalam Sains, Pelayaran & Geometri","subtitle":"Subtopik 8.2–8.3 — Halaju Paduan (Sungai/Angin), Keseimbangan Daya & Masalah Geometri Vektor","iconType":"scale","iconUrl":"../assets/icons/addm48-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Halaju Paduan & Keseimbangan Daya","voiceCaption":"Dalam masalah pelayaran dan penerbangan, halaju paduan sebenar ialah hasil tambah vektor halaju kenderaan dengan halaju arus air atau angin.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari lihat aplikasi vektor dalam pelayaran feri menyeberangi sungai dan pesawat menempuh angin lintang! Halaju sebenar yang dialami ialah VEKTOR PADUAN, iaitu hasil tambah vektor halaju enjin dengan vektor arus air atau angin! Jika bot mahu bergerak lurus terus ke utara menyeberangi sungai yang berarus ke timur, bot mesti diarahkan sedikit menyerong ke barat laut supaya komponen timur arus sungai dipadamkan! Dalam statik pula, jika tiga daya berada dalam keseimbangan, jumlah vektor daya ialah sifar! Dan dalam persamaan gerakan kedudukan, kedudukan pada masa t ialah r sifar tambah t darab v!","title":"Aplikasi Vektor: Halaju Paduan, Keseimbangan & Gerakan","acronym":"V=Vb+Va","hook":"Halaju paduan = halaju bot/pesawat + halaju arus/angin; keseimbangan daya => jumlah daya = 0!","summary":"Masalah halaju paduan, keseimbangan daya (F1 + F2 + F3 = 0) dan lintasan zarah (r = r0 + vt) diselesaikan dengan menambah komponen i dan j secara berasingan.","bullets":["Halaju Paduan: v_paduan = v_bot + v_arus (atau v_pesawat + v_angin). Laju sebenar = |v_paduan|. Arah sudut tan(theta) = |komponen-y / komponen-x|.","Keseimbangan Daya: Jika objek pegun/bergerak seragam di bawah F1, F2, F3, maka F1 + F2 + F3 = 0i + 0j (jumlah komponen-i = 0 dan jumlah komponen-j = 0).","Kedudukan Zarah pada Masa t: r(t) = r0 + t * v, di mana r0 ialah vektor kedudukan awal dan v ialah vektor halaju malar."],"formula":"v_paduan = v_objek + v_medium   |   r(t) = r0 + t*v   |   Keseimbangan: sum F = 0","examTip":"Jika soalan menyatakan objek bergerak 'selari dengan paksi-x' atau 'tepat ke Timur', itu bermaksud komponen-j bagi vektor paduan ialah SIFAR (y = 0)!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Syarat Bergerak Selari Paksi-x","voiceCaption":"Ramalkan nilai k supaya daya paduan bagi F satu sama dengan tiga i tambah k j dan F dua sama dengan lima i tolak empat j bertindak tepat ke arah paksi-x positif.","voiceScript":"[curious] Uji syarat pergerakan selari paksi x! Daya F satu ialah tiga i tambah k j dan F dua ialah lima i tolak empat j. Berapakah nilai k supaya daya paduan bertindak tepat ke arah paksi x positif?","hook":"Untuk arah selari paksi-x, jumlah komponen-j mestilah sifar!","scenario":"Dua daya F1 = 3i + kj dan F2 = 5i - 4j bertindak serentak menghasilkan daya paduan R selari dengan paksi-x positif.","prompt":"Apakah nilai k dan magnitud daya paduan R tersebut?","options":["k = 4 dan |R| = 8 N","k = -4 dan |R| = 8 N","k = 4 dan |R| = 2 N","k = -8 dan |R| = 4 N"],"correctIndex":0,"proofLabId":"addm48_cartes_unit_lab","proofState":{"vx":8,"vy":1},"explanation":"R = F1 + F2 = (3 + 5)i + (k - 4)j = 8i + (k - 4)j. Selari paksi-x bermaksud komponen-j = 0 => k - 4 = 0 => k = 4, dan R = 8i memberi |R| = 8 N."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Masalah & Syarat Vektornya","voiceCaption":"Padankan empat situasi aplikasi vektor dengan syarat matematik tepatnya.","voiceScript":"[confident] Padankan setiap situasi aplikasi vektor dalam fizik dan geometri dengan persamaan syaratnya!","prompt":"Padankan situasi aplikasi vektor dengan syarat matematik yang tepat:","pairs":[{"id":"a48u4m1","left":"Tiga daya F1, F2 dan F3 berada dalam keseimbangan","right":"F1 + F2 + F3 = 0i + 0j"},{"id":"a48u4m2","left":"Zarah bergerak tepat ke arah Utara (paksi-y positif)","right":"Komponen-i = 0 dan komponen-j > 0"},{"id":"a48u4m3","left":"Dua zarah P dan Q berlanggar pada masa t","right":"Vektor kedudukan r_P(t) = r_Q(t)"},{"id":"a48u4m4","left":"ABCD ialah sebuah segi empat selari","right":"AB = DC dan AD = BC"}],"explanation":"Perhatikan susunan huruf bagi segi empat selari ABCD: AB selari dan sama dengan DC (BUKAN CD, kerana arahnya akan terbalik!)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Kira Laju Paduan Bot & Arus","voiceCaption":"Hitung laju paduan sebuah bot dengan vektor halaju enjin tiga i tambah enam j yang merentas arus sungai berhalaju lima i.","voiceScript":"[confident] Selesaikan masalah pelayaran ini! Sebuah bot memandu pada halaju tiga i tambah enam j kilometer per jam manakala arus sungai mengalir pada lima i kilometer per jam. Berapakah laju sebenar bot itu?","prompt":"Sebuah bot bergerak dengan halaju v_b = (3i + 6j) km/j merentasi arus sungai v_a = 5i km/j. Hitung laju paduan sebenar bot itu.","options":["10 km/j","8 km/j","14 km/j","punca(45) km/j"],"correctIndex":0,"explanation":"v_paduan = (3i + 6j) + 5i = 8i + 6j. Laju paduan = |v_paduan| = punca(8^2 + 6^2) = punca(64 + 36) = punca(100) = 10 km/j."}]},{"id":"addm48-u5","title":"Unit 5: Cabaran Boss SPM — Vektor","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Vektor Kedudukan, Pemalar Tak Selari, Titik Segaris & Aplikasi","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Magnitud Vektor AB","voiceCaption":"Soalan Boss pertama mencari jarak tepat antara titik A dua koma lima dan B tujuh koma tujuh belas menggunakan vektor A B.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab lapan! Soalan pertama: diberi titik A dua koma lima dan B tujuh koma tujuh belas, cari magnitud vektor A B!","prompt":"Diberi koordinat A(2, 5) dan B(7, 17). Cari vektor AB dan magnitudnya |AB|.","options":["AB = 5i + 12j, |AB| = 13","AB = 9i + 22j, |AB| = punca(565)","AB = -5i - 12j, |AB| = 13","AB = 5i + 12j, |AB| = 17"],"correctIndex":0,"explanation":"AB = OB - OA = (7 - 2)i + (17 - 5)j = 5i + 12j. Magnitud |AB| = punca(5^2 + 12^2) = punca(169) = 13."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Pemalar Vektor Tak Selari","voiceCaption":"Ramalkan nilai pemalar h dan k apabila dua vektor bukan sifar yang tidak selari memenuhi persamaan kurungan dua h tolak tiga a sama dengan kurungan k tambah empat b.","voiceScript":"[curious] Soalan Boss kedua menguji teorem vektor bukan sifar tidak selari! Jika dua h tolak tiga darab vektor a sama dengan k tambah empat darab vektor b, apakah nilai h dan k?","hook":"Apabila a dan b tidak selari, kedua-dua pekali di kiri dan kanan mesti sama dengan sifar!","scenario":"Diberi vektor bukan sifar a dan b yang tidak selari memenuhi (2h - 3)a = (k + 4)b.","prompt":"Apakah nilai pemalar h dan k?","options":["h = 3/2, k = -4","h = -3/2, k = 4","h = 3, k = -4","h = 2/3, k = 4"],"correctIndex":0,"proofLabId":"addm48_vektor_paduan_lab","proofState":{"op":"tambah","ax":4,"ay":1,"bx":2,"by":3},"explanation":"Kerana a dan b tidak selari, satu-satunya cara h_a * a = k_b * b berlaku ialah kedua-dua pekali bernilai sifar: 2h - 3 = 0 => h = 3/2, dan k + 4 = 0 => k = -4."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Cari Pemalar Titik Segaris","voiceCaption":"Susun langkah mencari nilai k jika tiga titik P, Q dan R adalah segaris dengan P Q dan Q R diberi dalam sebutan a dan b.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas satu! Susun langkah mencari nilai k supaya titik P, Q dan R adalah segaris!","prompt":"Diberi PQ = 3a + 6b dan QR = (k - 1)a + 4b. Jika P, Q, R segaris, susun langkah mencari k:","hint":"Guna syarat segaris QR = m * PQ dan bandingkan pekali b dahulu...","answerTokens":["Tulis syarat selari dan segaris: QR = m * PQ","Gantikan: (k - 1)a + 4b = 3m a + 6m b","Bandingkan pekali b: 6m = 4 => m = 2/3","Bandingkan pekali a: k - 1 = 3(2/3) = 2, maka k = 3"],"distractors":["Samakan 3a + 6b = (k - 1)a + 4b terus memberi m = 1","Tambahkan PQ + QR = 0"],"explanation":"Daripada QR = m * PQ, pekali b memberi 6m = 4 => m = 2/3. Masukkan ke pekali a: k - 1 = 3(2/3) = 2 => k = 3."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Rumus Vektor SPM","voiceCaption":"Padankan empat konsep teras Vektor dengan ungkapan atau kesimpulannya yang tepat.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat konsep teras Vektor ini dengan rumus atau kesimpulannya.","prompt":"Padankan setiap konsep vektor dengan rumusnya yang tepat:","pairs":[{"id":"a48b4m1","left":"Vektor kedudukan titik tengah M bagi AB","right":"OM = (OA + OB) / 2"},{"id":"a48b4m2","left":"Vektor unit dalam arah r = (x ; y)","right":"(x ; y) / punca(x^2 + y^2)"},{"id":"a48b4m3","left":"Luas segi empat selari dengan sisi u dan v (berserenjang)","right":"|u| * |v|"},{"id":"a48b4m4","left":"Titik P membahagi AB dengan nisbah AP : PB = m : n","right":"OP = (n*OA + m*OB) / (m + n)"}],"explanation":"Perhatikan bahawa rumus vektor pembahagi tembereng OP = (n*OA + m*OB)/(m + n) mempunyai struktur darab silang yang sama tepat dengan Geometri Koordinat!"},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Pertembungan Dua Lintasan Vektor","voiceCaption":"Selesaikan masalah gerakan zarah dengan mencari masa t apabila kedudukan zarah A menyamai satu titik tertentu.","voiceScript":"[excited] Soalan Boss terakhir Bab lapan! Sebuah dron bermula pada kedudukan dua i tambah tiga j dan bergerak dengan halaju malar tiga i tambah empat j meter per saat. Berapakah jarak dron dari asalan selepas dua saat?","prompt":"Sebuah dron bermula dari kedudukan r0 = 2i + 3j (meter) dengan halaju malar v = 3i + 4j m/s. Hitung jarak dron dari asalan O pada t = 2 saat.","options":["punca(185) = 13.60 m","10.00 m","punca(13) = 3.61 m","19.00 m"],"correctIndex":0,"explanation":"r(2) = r0 + 2v = (2i + 3j) + 2(3i + 4j) = (2 + 6)i + (3 + 8)j = 8i + 11j. Jarak dari asalan = |r(2)| = punca(8^2 + 11^2) = punca(64 + 121) = punca(185) = 13.60 m."}]}]};</script>

(function () {

  function esc(str) {

      .replace(/>/g, "&gt;")

function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;
  return '<svg class="icon ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">' + d + "</svg>";
}

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderStaticChromeIcons() {
  if (typeof document !== "undefined" && document.body) {
    document.body.classList.toggle("wf-edition", Boolean(CHAPTER && CHAPTER.enableWebflowEdition));
    document.body.setAttribute("data-world-theme", resolveNotaWorldTheme_());
  }
  var map = [
    ["notaBackIcon", "back", ""],
    ["notaMapExitIcon", "map", "icon-sm"],
    ["notaXpIcon", "bolt", "icon-sm"],
    ["notaHeartIcon", "heart", "icon-sm"],
    ["notaCikguIcon", "chat", "icon-sm"],
    ["heartModalIcon", "heart", "icon-lg"]
  ];
  map.forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    if (el) el.innerHTML = getSvgIcon(pair[1], pair[2]);
  });
  if (isEnglishNota()) {
    var txtMap = {
      feedbackContinueBtn: "CONTINUE",
      celEyebrow: "UNIT COMPLETE",
      celNextBtn: "NEXT UNIT",
      celMapBtn: "BACK TO CHAPTER MAP",
      heartModalTitle: "Out of Hearts for Now",
      recoverHeartsBtn: "RESTORE 3 HEARTS & CONTINUE",
      heartBackMapBtn: "REVIEW ON CHAPTER MAP"
    };
    Object.keys(txtMap).forEach(function (id) {
      var node = document.getElementById(id);
      if (node) node.textContent = txtMap[id];
    });
    var statLabels = document.querySelectorAll(".cel-stat-label");
    if (statLabels[0]) statLabels[0].textContent = "Accuracy";
    if (statLabels[1]) statLabels[1].textContent = "XP Earned";
    if (statLabels[2]) statLabels[2].textContent = "Max Combo";
    var closeBtn = document.querySelector(".archival-close-form button");
    if (closeBtn) closeBtn.textContent = "Close";
  }
}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}

            '<span class="hero-tag">' + (isEnglishNota() ? "Chapter " : "Bab ") + escapeHtml(CHAPTER.chapterNumber) + " • ~" + escapeHtml(CHAPTER.estimatedMinutes || 15) + " min</span>" +
            freeTag +
          "</div>" +
          '<h1 id="chapterHeroTitle" class="chapter-hero-title" tabindex="-1">' + escapeHtml(CHAPTER.title) + "</h1>" +
          '<p class="chapter-hero-sub">' + escapeHtml(CHAPTER.subtitle || "") + "</p>" +

            '<div class="hero-mastery-meta">' +

              '<span class="tabular-nums">' + stats.masteryPct + "% • " + stats.totalStars + "/" + stats.maxStars + tUi(" Bintang", " Stars") + "</span>" +

          window.gsap.to(obj, {

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
