/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {

  gap: 5px;

#pathView:not([hidden]),

}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab09","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":9,"title":"Penyelesaian Segi Tiga","subtitle":"Subtopik 9.1–9.4 KSSM — Petua Sinus & Kes Berambiguiti (2 Segi Tiga), Petua Kosinus (SAS & SSS), Luas Segi Tiga (1/2 ab sin C & Rumus Heron) serta Aplikasi 2D & 3D.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab09-labs.js","coverIcon":"../assets/icons/addm49-u1.jpg","editionBadge":"Edisi Simulasi & Geometri Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan Petua Sinus, Kosinus dan kes berambiguiti kamu sangat cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Semua sudut cakah, luas Heron dan satah tiga dimensi kamu selesaikan!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula pasangan sisi dan sudut bertentangan atau tanda kosinus bagi sudut cakah.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan empat Bab sembilan berjaya kamu takluki!"},"units":[{"id":"addm49-u1","title":"Unit 1: Petua Sinus & Kes Berambiguiti","subtitle":"Subtopik 9.1 — Rumus a/sin A = b/sin B = c/sin C, Syarat Penggunaan & Kes Berambiguiti (b sin A < a < b)","iconType":"scale","iconUrl":"../assets/icons/addm49-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Petua Sinus & Kes Berambiguiti","voiceCaption":"Petua Sinus mengaitkan setiap sisi dengan sinus sudut bertentangannya, dan kes berambiguiti menghasilkan dua segi tiga apabila sudut A tirus serta b sin A kurang daripada a kurang daripada b.","voiceScript":"[warm] Selamat datang ke Bab sembilan, Penyelesaian Segi Tiga! Dalam subtopik sembilan perpuluhan satu, gunakan Petua Sinus a per sin A sama dengan b per sin B sama dengan c per sin C apabila kita mengetahui satu pasangan SISI dan SUDUT BERTENTANGANnya! Tetapi berhati-hati dengan perangkap paling terkenal S P M iaitu KES BERAMBIGUITI! Apabila diberi dua sisi a, b dan satu sudut tirus A yang bertentangan dengan a, jika panjang a lebih pendek daripada b tetapi masih lebih panjang daripada tinggi tegak b sin A, maka sisi a boleh dihayunkan ke dalam dan ke luar membentuk DUA segi tiga yang berbeza: satu bersudut tirus B satu dan satu lagi bersudut cakah seratus lapan puluh tolak B satu! Uji sendiri ayunan sisi a pada simulator di bawah!","title":"9.1 Petua Sinus & Syarat Kes Berambiguiti","acronym":"S•B•S•2Δ","hook":"Gerakkan panjang sisi a di antara 5.0 cm dengan 10.0 cm untuk melihat 2 segi tiga terhasil serentak!","mediaKey":"addm49_kes_berambiguiti","videoClip":{"src":"../assets/matematik-tambahan-t4-bab09/video/addm49_video_penyelesaian_segitiga_narasi.mp4","hasNarration":true,"posterKey":"addm49_kes_berambiguiti","caption":"Video Penerangan Bersuara (BM): Aplikasi Petua Sinus, Petua Kosinus dan fenomena kes berambiguiti (dua segi tiga) dalam segi tiga bukan bersudut tegak"},"summary":"Petua Sinus digunakan apabila pasangan (sisi, sudut bertentangan) diketahui; kes berambiguiti berlaku jika A tirus dan b sin A < a < b, menghasilkan B1 (tirus) dan B2 = 180 - B1 (cakah).","bullets":["Petua Sinus: a / sin A = b / sin B = c / sin C (atau sin A / a = sin B / b = sin C / c untuk mencari sudut).","Bila Guna Petua Sinus: (1) Dua sudut dan satu sisi (AAS/ASA), atau (2) Dua sisi dan satu sudut bukan kandung (SSA — periksa kes berambiguiti!).","Analisis Kes Berambiguiti (Sudut A tirus, diberi a, b, A): (a) Jika a < b sin A => 0 segi tiga. (b) Jika a = b sin A => 1 segi tiga bersudut tegak (B = 90 darjah). (c) Jika b sin A < a < b => 2 segi tiga (B1 tirus & B2 = 180 - B1 cakah). (d) Jika a >= b => 1 segi tiga sahaja."],"formula":"a / sin A = b / sin B = c / sin C   |   Ambiguiti (A tirus): b sin A < a < b","labId":"addm49_kes_berambiguiti_lab","labTitle":"Simulator Kes Berambiguiti Petua Sinus","labProps":{"a":7},"examTip":"Semasa melakar dua segi tiga kes berambiguiti di Kertas 2, lukis dahulu segi tiga besar dengan sisi a menghala ke kanan bawah, kemudian hayunkan lengkok kompas ke kiri untuk membentuk segi tiga kedua yang bersudut cakah!"},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Bilangan Segi Tiga Kes SSA","voiceCaption":"Ramalkan bilangan segi tiga yang boleh dibina jika sudut A tiga puluh darjah, sisi b sepuluh sentimeter dan sisi a empat sentimeter.","voiceScript":"[curious] Hitung tinggi tegak b sin A sama dengan sepuluh sin tiga puluh darjah iaitu lima sentimeter! Jika panjang sisi a yang diberi ialah empat sentimeter, berapakah bilangan segi tiga yang boleh terbentuk?","hook":"Uji slider a = 4.0 cm pada Simulator Kes Berambiguiti!","scenario":"Diberi segi tiga ABC dengan A = 30 darjah, b = 10 cm dan a = 4 cm.","prompt":"Berapakah bilangan segi tiga ABC yang boleh dibina?","options":["Tiada segi tiga (0 segi tiga) kerana a < b sin A","1 segi tiga bersudut tegak","2 segi tiga (kes berambiguiti)","1 segi tiga bersudut cakah"],"correctIndex":0,"proofLabId":"addm49_kes_berambiguiti_lab","proofState":{"a":4},"explanation":"b sin A = 10 sin 30 = 5 cm. Oleh sebab a = 4 cm < 5 cm, sisi a terlalu pendek untuk sampai ke garis tapak AB (sin B = 5/4 = 1.25 > 1, tidak wujud!)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Isih Bilangan Segi Tiga (0, 1, 2)","voiceCaption":"Asingkan enam set data segi tiga berikut antara yang menghasilkan Sifar, Satu atau Dua Segi Tiga.","voiceScript":"[confident] Uji ketangkasan kamu menganalisis kes berambiguiti! Asingkan keenam-enam set data segi tiga A sama dengan tiga puluh darjah dan b sama dengan sepuluh sentimeter ini.","prompt":"Bagi setiap segi tiga dengan A = 30 darjah dan b = 10 cm (b sin A = 5 cm), kelaskan bilangan segi tiga yang terbentuk:","buckets":[{"id":"sifar","label":"0 Segi Tiga (Mustahil)"},{"id":"satu","label":"1 Segi Tiga Unik"},{"id":"dua","label":"2 Segi Tiga (Berambiguiti)"}],"items":[{"text":"a = 3.5 cm","bucketId":"sifar","note":"Betul! 3.5 < 5.0 (tidak menyentuh garis tapak)."},{"text":"a = 5.0 cm","bucketId":"satu","note":"Tepat! Tepat sama dengan tinggi tegak, membentuk 1 segi tiga bersudut tegak."},{"text":"a = 7.0 cm","bucketId":"dua","note":"Betul! 5.0 < 7.0 < 10.0 memenuhi syarat kes berambiguiti."},{"text":"a = 8.5 cm","bucketId":"dua","note":"Tepat! 5.0 < 8.5 < 10.0 menghasilkan 2 segi tiga berbeza."},{"text":"a = 10.0 cm","bucketId":"satu","note":"Betul! a = b membentuk 1 segi tiga sama kaki."},{"text":"a = 12.0 cm","bucketId":"satu","note":"Tepat! a > b menghasilkan 1 segi tiga sahaja."}],"explanation":"Sentiasa bandingkan panjang sisi bertentangan a dengan tinggi tegak h = b sin A dan sisi bersebelahan b."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Kira Sudut Cakah Kes Berambiguiti","voiceCaption":"Cari sudut cakah yang mungkin bagi sudut Z jika sudut X empat puluh dua perpuluhan dua darjah, sisi x sepuluh sentimeter dan sisi z tiga belas perpuluhan empat sentimeter.","voiceScript":"[confident] Selesaikan soalan Latihan Pengukuhan buku teks! Diberi sudut X empat puluh dua perpuluhan dua darjah, x sepuluh sentimeter, dan z tiga belas perpuluhan empat sentimeter. Berapakah nilai sudut Z yang cakah?","prompt":"Dalam segi tiga XYZ, sudut X = 42.2 darjah, x = 10 cm dan z = 13.4 cm. Cari sudut cakah Z yang mungkin (sin Z = 13.4 sin 42.2 / 10 = 0.900).","options":["115.8 darjah (kerana 180 - 64.2 = 115.8)","64.2 darjah","137.8 darjah","105.4 darjah"],"correctIndex":0,"explanation":"sin Z = 0.900 memberi sudut tirus Z1 = 64.2 darjah. Maka sudut cakah Z2 = 180 - 64.2 = 115.8 darjah (semakan: 42.2 + 115.8 = 158 < 180, SAH!)."}]},{"id":"addm49-u2","title":"Unit 2: Petua Kosinus (SAS & SSS)","subtitle":"Subtopik 9.2 — Mencari Sisi Ketiga (SAS) dan Mencari Sudut termasuk Sudut Cakah (SSS)","iconType":"formula","iconUrl":"../assets/icons/addm49-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Petua Kosinus untuk SAS & SSS","voiceCaption":"Petua Kosinus digunakan apabila dua sisi dengan sudut kandungnya diberi, atau apabila ketiga-tiga sisi segi tiga diketahui tanpa sebarang sudut.","voiceScript":"[warm] Selamat datang ke Unit dua, Petua Kosinus! Bilakah Petua Sinus tidak boleh digunakan? Pertama, apabila diberi dua sisi dan satu sudut kandung di antaranya, dipanggil S A S! Kedua, apabila diberi ketiga-tiga panjang sisi tanpa sebarang sudut, dipanggil S S S! Dalam kes itu, gunakan Petua Kosinus a kuasa dua sama dengan b kuasa dua tambah c kuasa dua tolak dua b c kosinus A! Kelebihan besar Petua Kosinus semasa mencari sudut ialah kosinus sudut cakah bernilai NEGATIF, jadi kalkulator terus memaparkan sudut cakah yang tepat melebihi sembilan puluh darjah tanpa sebarang kes berambiguiti! Terokai kalkulator Petua Kosinus di bawah!","title":"9.2 Petua Kosinus & Pengiraan Sudut Cakah Secara Terus","acronym":"SAS • SSS","hook":"Laraskan sudut kandung A sehingga 120 darjah pada simulator di bawah untuk melihat kesan kos(A) negatif ke atas panjang sisi a!","mediaKey":"addm49_segi_tiga_jambatan","summary":"Petua Kosinus a^2 = b^2 + c^2 - 2bc kos A menyelesaikan segi tiga dalam kes SAS (2 sisi + 1 sudut kandung) dan SSS (3 sisi).","bullets":["Mencari Sisi (Kes SAS): a^2 = b^2 + c^2 - 2bc kos A. Perhatikan jika A > 90 darjah, nilai kos A adalah NEGATIF, maka -2bc kos A menjadi TAMBAH!","Mencari Sudut (Kes SSS): kos A = (b^2 + c^2 - a^2) / (2bc). Petua: Apabila menyusun pecahan ini, sisi yang BERTENTANGAN dengan sudut A (iaitu a^2) sentiasa ditolak!","Sudut Terbesar Bertentangan Sisi Terpanjang: Untuk mencari sudut terbesar dalam segi tiga SSS, sentiasa gunakan sisi terpanjang sebagai a^2 yang ditolak."],"formula":"a^2 = b^2 + c^2 - 2bc kos A   |   kos A = (b^2 + c^2 - a^2) / (2bc)","labId":"addm49_kosinus_luas_lab","labTitle":"Simulator Petua Kosinus & Luas Segi Tiga","labProps":{"b":5,"c":8,"A":60},"examTip":"Kesilapan maut di kalkulator: Dalam a^2 = b^2 + c^2 - 2bc kos A, JANGAN tolak 2bc daripada (b^2 + c^2) sebelum mendarab dengan kos A! Patuhi BODMAS: darab 2bc * kos A dahulu!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Pilih Petua Sinus vs Petua Kosinus","voiceCaption":"Padankan empat maklumat segi tiga yang diberi dengan petua paling sesuai untuk menyelesaikannya.","voiceScript":"[curious] Kemahiran terpenting Bab sembilan ialah memilih petua yang betul pada langkah pertama! Padankan setiap set maklumat dengan petua yang tepat.","prompt":"Padankan maklumat segi tiga yang diberi dengan petua paling tepat untuk memulakan pengiraan:","pairs":[{"id":"a49u2m1","left":"Diberi a = 7 cm, b = 9 cm, c = 11 cm; cari sudut terbesar","right":"Petua Kosinus (kes SSS)"},{"id":"a49u2m2","left":"Diberi b = 6 cm, c = 10 cm, dan sudut kandung A = 110 darjah","right":"Petua Kosinus (kes SAS)"},{"id":"a49u2m3","left":"Diberi sudut A = 50 darjah, sudut B = 72 darjah, sisi c = 5.8 cm","right":"Cari C = 58 darjah, lalu guna Petua Sinus"},{"id":"a49u2m4","left":"Diberi a = 7 cm, b = 10 cm, dan sudut bukan kandung A = 30 darjah","right":"Petua Sinus (semak kes berambiguiti)"}],"explanation":"Gunakan Petua Kosinus hanya apabila 3 sisi diberi (SSS) atau 2 sisi dengan sudut di tengahnya diberi (SAS); selainnya gunakan Petua Sinus."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Sisi daripada Petua Kosinus","voiceCaption":"Ramalkan panjang sisi a apabila b lima sentimeter, c lapan sentimeter dan sudut kandung A enam puluh darjah.","voiceScript":"[curious] Kira secara tepat! Diberi b sama dengan lima sentimeter, c lapan sentimeter dan sudut kandung A enam puluh darjah. Dengan kosinus enam puluh darjah sama dengan setengah, berapakah panjang sisi a?","hook":"Sahkan nilai sisi a pada Simulator Petua Kosinus di atas!","scenario":"Segi tiga ABC mempunyai b = 5 cm, c = 8 cm dan sudut kandung A = 60 darjah (kos 60 = 0.5).","prompt":"Apakah panjang sisi a?","options":["7 cm","9 cm","punca(49) tidak sama 7; ia 49 cm","punca(129) = 11.36 cm"],"correctIndex":0,"proofLabId":"addm49_kosinus_luas_lab","proofState":{"b":5,"c":8,"A":60},"explanation":"a^2 = 5^2 + 8^2 - 2(5)(8)(0.5) = 25 + 64 - 40 = 49. Maka a = punca(49) = 7 cm!"},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Kira Sudut Cakah Menggunakan Petua Kosinus","voiceCaption":"Cari sudut A bagi segi tiga bersisi tiga sentimeter, lima sentimeter dan tujuh sentimeter menggunakan Petua Kosinus.","voiceScript":"[confident] Selesaikan soalan kes S S S ini! Cari sudut terbesar A bagi segi tiga bersisi a tujuh sentimeter, b lima sentimeter, dan c tiga sentimeter.","prompt":"Sebuah segi tiga mempunyai sisi a = 7 cm, b = 5 cm dan c = 3 cm. Hitung saiz sudut A.","options":["120 darjah","60 darjah","150 darjah","90 darjah"],"correctIndex":0,"explanation":"kos A = (5^2 + 3^2 - 7^2) / (2 * 5 * 3) = (25 + 9 - 49) / 30 = -15 / 30 = -0.5. Maka sudut A = kos^-1(-0.5) = 120 darjah (sudut cakah!)."}]},{"id":"addm49-u3","title":"Unit 3: Luas Segi Tiga & Rumus Heron","subtitle":"Subtopik 9.3 — Rumus Luas 1/2 ab sin C (SAS) dan Rumus Heron punca[s(s-a)(s-b)(s-c)] (SSS)","iconType":"graph","iconUrl":"../assets/icons/addm49-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Luas 1/2 ab sin C & Rumus Heron","voiceCaption":"Luas sebarang segi tiga dikira menggunakan setengah darab dua sisi darab sinus sudut kandung, atau Rumus Heron apabila ketiga-tiga panjang sisi diketahui.","voiceScript":"[warm] Selamat datang ke Unit tiga, Luas Segi Tiga! Selain rumus asas setengah kali tapak kali tinggi, dalam Matematik Tambahan kita ada dua rumus kuasa tinggi untuk sebarang segi tiga bukan bersudut tegak! Pertama, jika dua sisi dan sudut kandung di antaranya diketahui, guna luas sama dengan setengah a b sin C! Kedua, jika hanya ketiga-tiga sisi a, b, c diketahui tanpa sebarang sudut, gunakan RUMUS HERON! Kira dahulu semiperimeter s sama dengan kurungan a tambah b tambah c bahagi dua, kemudian luas ialah punca kuasa dua bagi s darab s tolak a darab s tolak b darab s tolak c! Ini sangat pantas untuk mengira luas sisi empat yang dibahagi kepada dua segi tiga!","title":"9.3 Rumus Luas Segi Tiga (1/2 ab sin C & Rumus Heron)","acronym":"SAS • HERON","hook":"Ingat: sudut dalam 1/2 ab sin C WAJIB merupakan sudut KANDUNG di antara sisi a dan sisi b!","summary":"Luas segi tiga ialah 0.5 * a * b * sin C apabila 2 sisi dan sudut kandungnya diketahui, atau punca[s(s - a)(s - b)(s - c)] dengan s = (a + b + c)/2 apabila 3 sisi diketahui.","bullets":["Rumus SAS: Luas = (1/2) ab sin C = (1/2) ac sin B = (1/2) bc sin A. Sudut MESTI berada di antara dua sisi yang didarab.","Rumus Heron (Kes 3 Sisi SSS): s = (a + b + c) / 2 (semiperimeter). Luas = punca[s(s - a)(s - b)(s - c)].","Luas Sisi Empat / Poligon: Bahagikan sisi empat kepada 2 segi tiga melalui satu pepenjuru, hitung luas setiap segi tiga lalu jumlahkan kedua-duanya!"],"formula":"Luas = (1/2) ab sin C   |   Heron: Luas = punca[s(s-a)(s-b)(s-c)], s = (a+b+c)/2","labId":"addm49_kosinus_luas_lab","labTitle":"Pembanding Luas 1/2 bc sin A vs Rumus Heron","labProps":{"b":6,"c":8,"A":90},"examTip":"Semasa menyelesaikan luas poligon berbilang bahagian di Kertas 2, simpan jawapan pertengahan (seperti panjang pepenjuru) kepada sekurang-kurangnya 4 tempat perpuluhan sebelum dimasukkan ke dalam Rumus Heron!"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Langkah Rumus Heron","voiceCaption":"Susun langkah mengira luas segi tiga bersisi tiga belas, empat belas dan lima belas sentimeter menggunakan Rumus Heron.","voiceScript":"[confident] Susun empat langkah menggunakan Rumus Heron untuk mencari luas segi tiga bersisi tiga belas, empat belas dan lima belas sentimeter!","prompt":"Susun langkah mengira luas segi tiga dengan sisi a = 13 cm, b = 14 cm, c = 15 cm:","hint":"Kira nilai semiperimeter s = (a + b + c)/2 terlebih dahulu...","answerTokens":["Kira semiperimeter s = (13 + 14 + 15) / 2 = 21 cm","Hitung faktor: (s - a) = 8, (s - b) = 7, (s - c) = 6","Gantikan ke dalam Rumus Heron: punca(21 * 8 * 7 * 6)","Permudahkan punca(7056) = 84 cm^2"],"distractors":["Tetapkan s = 13 + 14 + 15 = 42 terus tanpa membahagi 2","Kira 0.5 * 13 * 14 * 15"],"explanation":"Semiperimeter s = 42/2 = 21. Maka Luas = punca(21 * 8 * 7 * 6) = punca(7056) = 84 cm^2."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Maklumat dengan Luas Segi Tiga","voiceCaption":"Padankan empat segi tiga di kiri dengan luas tepatnya di kanan.","voiceScript":"[curious] Uji pengiraan pantas kedua-dua rumus luas! Padankan keempat-empat segi tiga berikut dengan luas tepatnya.","prompt":"Padankan maklumat segi tiga berikut dengan luas tepatnya:","pairs":[{"id":"a49u3m1","left":"a = 8 cm, b = 10 cm, sudut kandung C = 30 darjah","right":"20 cm^2"},{"id":"a49u3m2","left":"Segi tiga sama sisi berpanjang sisi 6 cm (C = 60 darjah)","right":"9 * punca(3) = 15.59 cm^2"},{"id":"a49u3m3","left":"Segi tiga bersisi 5 cm, 12 cm dan 13 cm","right":"30 cm^2"},{"id":"a49u3m4","left":"Segi tiga sama kaki bersisi 8 cm, 8 cm, dan 6 cm (s = 11)","right":"punca(11 * 3 * 3 * 5) = 21.79 cm^2"}],"explanation":"0.5 * 8 * 10 * sin 30 = 40 * 0.5 = 20 cm^2; manakala 5-12-13 ialah segi tiga bersudut tegak dengan luas 0.5 * 5 * 12 = 30 cm^2 (atau Heron s=15)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cari Sudut Kandung daripada Luas Diberi","voiceCaption":"Tentukan sudut kandung C jika luas segi tiga ialah dua puluh empat sentimeter persegi dengan sisi lapan dan dua belas sentimeter.","voiceScript":"[confident] Jika luas segi tiga ialah dua puluh empat sentimeter persegi dengan sisi a lapan sentimeter dan b dua belas sentimeter, apakah dua nilai sudut C yang mungkin?","prompt":"Diberi luas segi tiga ABC ialah 24 cm^2 dengan a = 8 cm dan b = 12 cm. Cari nilai-nilai sudut C yang mungkin.","options":["30 darjah atau 150 darjah","30 darjah sahaja","60 darjah atau 120 darjah","45 darjah atau 135 darjah"],"correctIndex":0,"explanation":"24 = 0.5(8)(12) sin C = 48 sin C => sin C = 0.5. Oleh sebab sinus positif di sukuan I dan II, C = 30 darjah (tirus) atau 180 - 30 = 150 darjah (cakah)!"}]},{"id":"addm49-u4","title":"Unit 4: Aplikasi Segi Tiga dalam 2D & 3D","subtitle":"Subtopik 9.4 — Masalah Geometri 3D (Satah Mengufuk & Tiang Tegak 90°), Bearing, Sudut Dongak & Tunduk","iconType":"pendulum","iconUrl":"../assets/icons/addm49-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Strategi Masalah 3D SPM Kertas 2","voiceCaption":"Masalah tiga dimensi diselesaikan dengan mengasingkan rajah kepada satah mengufuk menggunakan Petua Sinus dan Kosinus, serta satah mencancang bersudut tegak menggunakan trigonometri asas.","voiceScript":"[warm] Selamat datang ke Unit empat! Soalan Kertas dua Bahagian B Penyelesaian Segi Tiga hampir selalu menggabungkan dua bentuk 2 D atau satu rajah 3 D seperti tiang bendera tegak di atas padang segi tiga! Rahsia menyelesaikan soalan 3 D tanpa pening kepala adalah MEMISAHKAN SATAH! Pertama, lukis semula tapak mengufuk sebagai segi tiga rata 2 D — gunakan Petua Sinus atau Petua Kosinus pada tapak ini. Kedua, bagi sebarang tiang atau menara yang berdiri tegak di atas satah mengufuk, sudut di tapak tiang sentiasa SEMBILAN PULUH DARJAH, maka anda boleh terus guna nisbah SOH CAH TOA atau Teorem Pythagoras! Ingat juga, jarak terdekat dari titik B ke garis A C adalah panjang garis serenjang dari B ke A C, yang sering dikira melalui luas!","title":"9.4 Aplikasi 2D & 3D (Satah Mengufuk, Tiang Tegak & Jarak Terdekat)","acronym":"2D+3D","hook":"Pisahkan rajah 3D kepada (1) Tapak Mengufuk (Petua Sinus/Kosinus) dan (2) Satah Tegak 90° (SOH-CAH-TOA)!","summary":"Masalah 3D dipecahkan kepada satah mengufuk dan satah mencancang bersudut tegak 90°, manakala jarak terdekat dari titik ke garis dicari melalui tinggi tegak segi tiga.","bullets":["Pemisahan Satah 3D: Jika tiang VT berdiri tegak di atas satah mengufuk PQR, maka sudut VTP = sudut VTQ = sudut VTR = 90 darjah! Guna tan(sudut dongak) = VT / tapak mengufuk.","Bearing (Ukur Arah Utara): Bearing sentiasa diukur mengikut ARAH JAM daripada arah UTARA (000° hingga 360°).","Jarak Terdekat (Tinggi Tegak h): Jarak terdekat dari bucu B ke garis AC ialah tinggi tegak BD yang memenuhi Luas(ABC) = 0.5 * AC * BD!"],"formula":"Sudut Dongak theta: tan(theta) = Tinggi Tegak / Jarak Mengufuk   |   BD = (2 * Luas) / AC","examTip":"Apabila soalan meminta sudut antara satah condong VAB dengan tapak mengufuk ABC (atau sudut dongak puncak V dari titik terdekat pada AB), sentiasa cari titik N di atas AB supaya CN serenjang AB dan VN serenjang AB!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Konsep 3D & Tekniknya","voiceCaption":"Padankan empat elemen soalan aplikasi 2D dan 3D dengan rumus atau kaedah penyelesaiannya.","voiceScript":"[confident] Padankan setiap konsep dalam soalan aplikasi 2 D dan 3 D Penyelesaian Segi Tiga dengan teknik penyelesaian yang betul!","prompt":"Padankan elemen masalah 2D/3D berikut dengan kaedah penyelesaiannya:","pairs":[{"id":"a49u4m1","left":"Menara VP tegak di atas satah mengufuk PQR dengan sudut dongak dari Q ialah theta","right":"VP = PQ * tan(theta) dalam segi tiga tegak VPQ"},{"id":"a49u4m2","left":"Jarak terdekat dari bucu Q ke garis lurus PR","right":"2 * Luas(PQR) / PR"},{"id":"a49u4m3","left":"Sisi empat ABCD dibina daripada 2 segi tiga ABC dan ACD berkongsi AC","right":"Cari pepenjuru AC dahulu guna Kosinus/Sinus dalam ABC"},{"id":"a49u4m4","left":"Sudut dongak puncak T dari P berbanding sudut tunduk P dari T","right":"Kedua-duanya sama besar (sudut selang-seli)"}],"explanation":"Mengenal pasti sisi sepunya (seperti pepenjuru AC) dan garis tegak 90 darjah pada tiang 3D ialah kunci utama Kertas 2."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Satah Mengufuk vs Satah Tegak 90°","voiceCaption":"Kelaskan enam pernyataan atau pengiraan berikut antara Satah Mengufuk (2D Umum) dengan Satah Tegak 90 darjah (SOH-CAH-TOA / Pythagoras).","voiceScript":"[curious] Pisahkan satah dengan jelas! Kelaskan enam langkah penyelesaian rajah 3 D ini kepada Satah Mengufuk atau Satah Mencancang Tegak.","prompt":"Dalam rajah 3D dengan tiang tegak TP di bucu P tapak segi tiga PQR, kelaskan setiap langkah berikut:","buckets":[{"id":"ufuk","label":"Satah Mengufuk PQR (Sinus/Kosinus)"},{"id":"tegak","label":"Satah Tegak TPQ / TPR (Sudut 90°)"}],"items":[{"text":"Mengira panjang QR menggunakan Petua Kosinus daripada PQ, PR dan sudut QPR","bucketId":"ufuk","note":"Betul! PQR ialah segi tiga tak bersudut tegak di atas tanah."},{"text":"Mengira tinggi tiang TP = PQ * tan(sudut dongak dari Q)","bucketId":"tegak","note":"Tepat! Segi tiga TPQ bersudut tegak 90° di P."},{"text":"Mengira panjang kabel condong TQ = punca(TP^2 + PQ^2)","bucketId":"tegak","note":"Betul! Teorem Pythagoras dalam segi tiga tegak TPQ."},{"text":"Mengira luas tapak PQR menggunakan 0.5 * PQ * PR * sin(QPR)","bucketId":"ufuk","note":"Tepat! Luas permukaan tanah mengufuk."},{"text":"Mencari jarak terdekat PN dari P ke garis QR","bucketId":"ufuk","note":"Betul! N terletak di atas tapak mengufuk QR."},{"text":"Mengira sudut dongak puncak T dari titik N menggunakan tan(TNP) = TP / PN","bucketId":"tegak","note":"Tepat! Segi tiga TPN tegak di P."}],"explanation":"Semua ukuran di atas tanah tapak PQR diselesaikan dengan Petua Sinus/Kosinus/Luas; semua ukuran melibatkan tinggi menegak TP menggunakan trigonometri sudut tegak 90°."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Kira Tinggi Tiang dalam Masalah 3D","voiceCaption":"Hitung tinggi tiang bendera tegak TP apabila sudut dongak T dari R ialah empat puluh lima darjah dan jarak mengufuk PR ialah dua belas meter.","voiceScript":"[confident] Selesaikan masalah tiga dimensi ini! Tiang T P berdiri tegak di atas padang mengufuk P Q R. Jika P R sama dengan dua belas meter dan sudut dongak T dari R ialah empat puluh lima darjah, berapakah tinggi tiang T P?","prompt":"Sebatang tiang TP berdiri tegak di bucu P suatu padang mengufuk PQR. Diberi PR = 12 m dan sudut dongak puncak T dari R ialah 45 darjah. Hitung tinggi TP dan panjang TR.","options":["TP = 12 m, TR = 12 * punca(2) = 16.97 m","TP = 6 m, TR = 12 m","TP = 12 * punca(2) m, TR = 12 m","TP = 12 m, TR = 24 m"],"correctIndex":0,"explanation":"Dalam segi tiga bersudut tegak TPR (tegak di P): TP = 12 tan 45° = 12(1) = 12 m. Hipotenus TR = punca(12^2 + 12^2) = 12 * punca(2) = 16.97 m."}]},{"id":"addm49-u5","title":"Unit 5: Cabaran Boss SPM — Penyelesaian Segi Tiga","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Petua Sinus, Kosinus, Kes Berambiguiti, Luas & Sisi Empat","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Petua Sinus Tepat","voiceCaption":"Soalan Boss pertama menggunakan Petua Sinus apabila dua sudut dan satu sisi diberi.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab sembilan! Soalan pertama menggunakan Petua Sinus untuk mencari panjang sisi b apabila sudut A tiga puluh darjah, sudut B empat puluh lima darjah dan a sepuluh sentimeter!","prompt":"Dalam segi tiga ABC, sudut A = 30 darjah, sudut B = 45 darjah dan a = 10 cm. Hitung panjang b.","options":["10 * punca(2) = 14.14 cm","5 * punca(2) = 7.07 cm","10 * punca(3) = 17.32 cm","20 cm"],"correctIndex":0,"explanation":"b / sin 45° = 10 / sin 30° => b = 10 * (punca(2)/2) / (0.5) = 10 * punca(2) = 14.14 cm."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Kes Berambiguiti Lengkap","voiceCaption":"Ramalkan panjang sisi a supaya segi tiga dengan sudut A tiga puluh darjah dan sisi b sepuluh sentimeter membentuk tepat dua segi tiga berbeza.","voiceScript":"[curious] Soalan Boss kedua! Diberi sudut A tiga puluh darjah dan sisi b sepuluh sentimeter. Antara nilai a berikut, manakah yang menghasilkan kes berambiguiti dengan dua segi tiga berbeza?","hook":"Ingat julat berambiguiti b sin A < a < b!","scenario":"Segi tiga ABC dengan A = 30 darjah dan b = 10 cm.","prompt":"Nilai sisi a manakah yang menghasilkan DUA segi tiga yang berbeza?","options":["a = 7.5 cm","a = 4.5 cm","a = 5.0 cm","a = 11.0 cm"],"correctIndex":0,"proofLabId":"addm49_kes_berambiguiti_lab","proofState":{"a":7.5},"explanation":"b sin A = 10 sin 30 = 5.0 cm. Syarat dua segi tiga ialah 5.0 < a < 10.0, maka hanya a = 7.5 cm memenuhi julat itu."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Langkah Kes Berambiguiti","voiceCaption":"Susun langkah menyelesaikan kes berambiguiti untuk mencari sudut tirus B1, sudut cakah B2 dan sudut puncak C2.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas dua! Susun langkah mencari kedua-dua sudut B dan sudut C bagi kes berambiguiti apabila diberi A tiga puluh darjah, b sepuluh sentimeter dan a tujuh sentimeter!","prompt":"Diberi A = 30 darjah, b = 10 cm dan a = 7 cm. Susun langkah mencari sudut B2 (cakah) dan sudut C2:","hint":"Guna Petua Sinus untuk mencari sudut tirus B1 terlebih dahulu...","answerTokens":["Guna Petua Sinus: sin B = 10 * sin 30 / 7 = 5/7 = 0.7143","Dapat sudut tirus B1 = 45.58 darjah","Cari sudut cakah B2 = 180 - 45.58 = 134.42 darjah","Jadi sudut puncak C2 = 180 - 30 - 134.42 = 15.58 darjah"],"distractors":["Ambil C2 = 180 - 45.58 - 30 = 104.42 darjah untuk kes cakah","Gunakan Petua Kosinus terus tanpa mencari B1"],"explanation":"Sudut cakah B2 ialah 180 - B1 = 134.42°; jumlah sudut segi tiga memberi C2 = 180 - 30 - 134.42 = 15.58°."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Rumus Segi Tiga SPM","voiceCaption":"Padankan empat kes soalan Penyelesaian Segi Tiga dengan rumus atau sifat kuncinya.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat rumus teras Penyelesaian Segi Tiga ini dengan penggunaannya yang betul.","prompt":"Padankan setiap rumus atau identiti segi tiga dengan kesnya:","pairs":[{"id":"a49b4m1","left":"sin(180 - theta) = sin(theta)","right":"Punca wujudnya sudut tirus dan cakah dalam Petua Sinus"},{"id":"a49b4m2","left":"kos(180 - theta) = -kos(theta)","right":"Menjelaskan nilai kosinus negatif bagi sudut cakah"},{"id":"a49b4m3","left":"punca[s(s - a)(s - b)(s - c)]","right":"Rumus Heron mencari luas apabila 3 sisi diberi"},{"id":"a49b4m4","left":"Luas(ABC) = 0.5 * AC * h_terdekat","right":"Mencari jarak serenjang terdekat dari bucu B ke sisi AC"}],"explanation":"Identiti sin(180 - theta) = sin(theta) menerangkan mengapa dua sudut berbeza berkongsi nilai sinus yang sama."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Gabungan Kosinus & Luas Sisi Empat","voiceCaption":"Selesaikan soalan gabungan Kertas dua yang meminta panjang pepenjuru melalui Petua Kosinus diikuti luas segi tiga.","voiceScript":"[excited] Soalan Boss terakhir Bab sembilan! Dalam sisi empat A B C D, panjang A B ialah empat sentimeter, B C tujuh sentimeter, dan sudut A B C ialah seratus dua puluh darjah. Hitung luas segi tiga A B C dan panjang pepenjuru A C!","prompt":"Dalam segi tiga ABC, AB = 4 cm, BC = 7 cm dan sudut ABC = 120 darjah (kos 120 = -0.5, sin 120 = 0.8660). Hitung panjang AC dan luas segi tiga ABC.","options":["AC = punca(93) = 9.64 cm, Luas = 12.12 cm^2","AC = punca(37) = 6.08 cm, Luas = 12.12 cm^2","AC = 9.64 cm, Luas = 24.25 cm^2","AC = 11.00 cm, Luas = 14.00 cm^2"],"correctIndex":0,"explanation":"AC^2 = 4^2 + 7^2 - 2(4)(7)(-0.5) = 16 + 49 + 28 = 93 => AC = 9.64 cm. Luas = 0.5(4)(7) sin 120° = 14 * 0.8660 = 12.12 cm^2."}]}]};</script>

window.ETUTOR_NOTA_MEDIA = Object.assign(window.ETUTOR_NOTA_MEDIA || {}, {

      window.NotaAudio.playTap();

    var items = (keys || []).map(function (k) {
      return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null;
    }).filter(Boolean);
    if (items.length === 0) return "";
    var cards = items.map(function (it, idx) {

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var unlockedMap = { 0: true };
  var activeNodeIdx = 0;
  var mindMapBonusDone = false;

  var acronymPill = buildAcronymPillHtml(step, nodes);

  var formulaHtml = step.formula
    ? '<div class="concept-formula-box tabular-nums" role="note" tabindex="0"><span class="formula-kicker">' + tUi("RUMUS KILAT", "QUICK FORMULA") + "</span><span>" + escapeHtml(step.formula) + "</span></div>"
    : "";

  var labHtml = step.labId
    ? '<div class="lab-shell">' +
