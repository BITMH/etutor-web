/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;

}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;

}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);

}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;

.node-float-tag {

  font-size: 0.74rem;
  font-weight: 800;

.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t4-bab10","subject":"Matematik Tambahan","subjectGroup":"sains","form":4,"chapterNumber":10,"title":"Nombor Indeks","subtitle":"Subtopik 10.1–10.2 KSSM — Rumus Nombor Indeks I = (Q1/Q0)*100, Tafsiran Peratus Perubahan, Aturan Rantai Tahun Asas, Indeks Gubahan Berpemberat & Kos Pengeluaran.","estimatedMinutes":28,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t4-bab10-labs.js","coverIcon":"../assets/icons/addm410-u1.jpg","editionBadge":"Edisi Simulasi & Kalkulator Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan nombor indeks dan indeks gubahan kamu memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Aturan rantai dan kos pengeluaran berpemberat berjaya kamu selesaikan!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula tahun asas Q sifar di penyebut atau jumlah pemberat di bawah.","celebrate":"[excited] Tahniah! Keseluruhan Bab sepuluh Matematik Tambahan Tingkatan empat berjaya kamu kuasai!"},"units":[{"id":"addm410-u1","title":"Unit 1: Konsep Nombor Indeks & Tafsiran Perubahan","subtitle":"Subtopik 10.1 — Rumus I = (Q1/Q0) x 100, Tahun Asas (100) & Tafsiran Kenaikan/Penyusutan Peratus","iconType":"graph","iconUrl":"../assets/icons/addm410-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Rumus & Tafsiran Nombor Indeks","voiceCaption":"Nombor indeks mengukur nisbah perubahan sesuatu kuantiti pada masa tertentu berbanding tahun asas seratus menggunakan rumus Q satu bahagi Q sifar darab seratus.","voiceScript":"[warm] Selamat datang ke Bab sepuluh, Nombor Indeks! Dalam subtopik sepuluh perpuluhan satu, nombor indeks I ialah nombor piawai tanpa unit yang membandingkan harga, kuantiti atau indeks udara pada tahun tertentu Q satu berbanding tahun asas Q sifar melalui rumus I sama dengan Q satu bahagi Q sifar darab seratus! Pada tahun asas sendiri, nilai indeks sentiasa tepat seratus! Apabila mentafsir indeks: jika I ialah seratus lima belas, harga telah meningkat sebanyak lima belas peratus berbanding tahun asas; jika I ialah lapan puluh lapan, harga telah menyusut sebanyak dua belas peratus! Uji pelaras nombor indeks di bawah!","title":"10.1 Nombor Indeks: Rumus I = (Q1 / Q0) * 100 & Tafsiran","acronym":"Q1/Q0×100","hook":"Ingat: Nombor indeks pada tahun asas sentiasa 100; tolak 100 untuk membaca peratus kenaikan atau penurunan!","mediaKey":"addm410_indeks_harga","videoClip":{"src":"../assets/matematik-tambahan-t4-bab10/video/addm410_video_nombor_indeks_narasi.mp4","hasNarration":true,"posterKey":"addm410_indeks_harga","caption":"Pengiraan nombor indeks harga berbanding tahun asas serta indeks gubahan mengikut pemberat komponen."},"summary":"Nombor indeks I = (Q1 / Q0) * 100 membandingkan kuantiti Q1 pada tahun semasa terhadap tahun asas Q0 (I0 = 100), dengan perubahan peratus = (I - 100)%.","bullets":["Rumus Asas: I = (Q1 / Q0) * 100, dengan Q0 = harga/kuantiti pada masa asas dan Q1 = harga/kuantiti pada masa tertentu.","Tafsiran Nilai I: (1) I > 100 => peningkatan sebanyak (I - 100)%. (2) I = 100 => tiada perubahan (0%). (3) I < 100 => penyusutan/penurunan sebanyak (100 - I)%.","Mencari Q0 atau Q1: Jika harga meningkat 22% daripada tahun asas, terus tulis indeks I = 100 + 22 = 122. Jika menyusut 10%, terus tulis I = 100 - 10 = 90!"],"formula":"I = (Q1 / Q0) * 100   |   Peratus Perubahan = (I - 100)%","labId":"addm410_indeks_rantai_lab","labTitle":"Kalkulator Nombor Indeks & Aturan Rantai","labProps":{"q0":500,"q1":550,"q2":660},"examTip":"Semasa menjawab soalan 'Tafsirkan nombor indeks yang diperoleh' dalam SPM, JANGAN hanya tulis 'meningkat 10%' — WAJIB nyatakan kedua-dua tahun: 'Terdapat peningkatan harga sebanyak 10% dari tahun 2017 ke tahun 2018'!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Naik vs Susut daripada Indeks","voiceCaption":"Asingkan enam maklumat nombor indeks dan perubahan harga berikut antara Kenaikan, Tiada Perubahan dan Penyusutan.","voiceScript":"[curious] Uji kemahiran mentafsir nombor indeks tanpa mengira panjang! Asingkan keenam-enam indeks berikut kepada Kenaikan, Tiada Perubahan atau Penyusutan.","prompt":"Kelaskan setiap maklumat nombor indeks berikut mengikut arah perubahannya berbanding tahun asas:","buckets":[{"id":"naik","label":"Meningkat (I > 100)"},{"id":"tetap","label":"Tiada Perubahan (I = 100)"},{"id":"susut","label":"Menyusut (I < 100)"}],"items":[{"text":"Indeks harga bahan C ialah 100 (harga RM1.10 kekal RM1.10)","bucketId":"tetap","note":"Betul! Indeks 100 bermaksud 0% perubahan."},{"text":"Indeks kenderaan berdaftar = 82.2 (turun daripada 75 376 ke 61 956)","bucketId":"susut","note":"Tepat! Penyusutan sebanyak 100 - 82.2 = 17.8%."},{"text":"Harga barang melonjak 35% berbanding tahun asas (I = 135)","bucketId":"naik","note":"Betul! 100 + 35 = 135."},{"text":"Indeks pengeluaran buah sawit = 90.23","bucketId":"susut","note":"Tepat! Menyusut sebanyak 9.77%."},{"text":"Indeks pendaftaran badan sukan = 156.39","bucketId":"naik","note":"Betul! Peningkatan sebanyak 56.39%."},{"text":"Harga pada tahun semasa sama dengan harga pada tahun asas","bucketId":"tetap","note":"Tepat! Q1/Q0 = 1, maka I = 100."}],"explanation":"Nilai ambang 100 sentiasa mewakili tahun asas: melebihi 100 ialah peningkatan, kurang daripada 100 ialah penyusutan."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Pengiraan Q0, Q1 dan I","voiceCaption":"Padankan empat situasi harga barang dengan nilai indeks atau harga yang tepat.","voiceScript":"[confident] Uji pengiraan pantas Q sifar, Q satu dan indeks I! Padankan keempat-empat situasi harga ini dengan jawapannya.","prompt":"Padankan setiap situasi pengiraan nombor indeks dengan nilai tepatnya:","pairs":[{"id":"a410u1m1","left":"Q0 = RM2.00, Q1 = RM2.20; cari indeks I","right":"110"},{"id":"a410u1m2","left":"Q0 = RM0.80, I = 125; cari Q1","right":"RM1.00"},{"id":"a410u1m3","left":"Q1 = RM1.20, I = 120; cari Q0","right":"RM1.00"},{"id":"a410u1m4","left":"Harga susut 15% berbanding tahun asas; cari indeks I","right":"85"}],"explanation":"Gunakan I = (Q1/Q0)*100 secara songsang: Q1 = (I/100)*Q0 dan Q0 = (100/I)*Q1."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Hitung & Tafsir Nombor Indeks","voiceCaption":"Hitung nombor indeks bagi harga jam tangan pada tahun dua ribu lapan belas berasaskan tahun dua ribu tujuh belas.","voiceScript":"[confident] Selesaikan Contoh satu buku teks: harga jam tangan pada tahun dua ribu tujuh belas ialah lima ratus ringgit dan pada tahun dua ribu lapan belas ialah lima ratus lima puluh ringgit. Hitung dan tafsirkan indeksnya!","prompt":"Harga seutas jam tangan pada tahun 2017 dan 2018 masing-masing ialah RM500 dan RM550. Hitung nombor indeks harga pada tahun 2018 berasaskan tahun 2017 serta tafsirannya.","options":["I = 110; terdapat peningkatan harga sebanyak 10% dari tahun 2017 ke 2018","I = 110; harga meningkat sebanyak RM50 atau 110%","I = 90.9; terdapat penurunan harga sebanyak 9.1%","I = 150; harga meningkat sebanyak 50%"],"correctIndex":0,"explanation":"I = (550 / 500) * 100 = 110. Maka peningkatan ialah 110 - 100 = 10% dari tahun 2017 ke tahun 2018."}]},{"id":"addm410-u2","title":"Unit 2: Aturan Rantai & Penukaran Tahun Asas","subtitle":"Subtopik 10.1 — Mengaitkan Indeks Tiga Tahun Berbeza Menggunakan I(C/A) = [I(C/B) * I(B/A)] / 100","iconType":"scale","iconUrl":"../assets/icons/addm410-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Aturan Rantai Tahun Asas","voiceCaption":"Apabila menghubungkan indeks harga merentasi tiga tahun berbeza, gunakan rumus aturan rantai hasil darab dua indeks bahagi seratus.","voiceScript":"[warm] Selamat datang ke Unit dua! Sering kali dalam peperiksaan S P M, anda diberi indeks tahun C berasaskan tahun A dan tahun B berasaskan tahun A, lalu disuruh mencari indeks tahun C berasaskan tahun B! Ingat ATURAN RANTAI yang amat mudah: indeks C ke A sama dengan indeks C ke B darab indeks B ke A bahagi seratus! Perhatikan huruf tengah B saling bersambung seperti rantai! Jika anda lupa rumus itu, bayangkan sahaja harga tahun asas A bernilai seratus ringgit — kira harga tahun B dan tahun C secara langsung lalu gunakan rumus asas Q satu bahagi Q sifar darab seratus!","title":"Aturan Rantai Menukar Tahun Asas (Tiga Tahun Berbeza)","acronym":"I_CA=(I_CB×I_BA)/100","hook":"Huruf tengah B menyambung rantai (C/B) x (B/A) / 100 — atau andaikan Q_asas = 100 untuk semakan pantas!","summary":"Aturan rantai menghubungkan indeks tiga tahun A, B dan C melalui I(C/A) = [I(C/B) * I(B/A)] / 100 tanpa memerlukan harga sebenar.","bullets":["Rumus Aturan Rantai: I(C/A) = [I(C/B) * I(B/A)] / 100. Contoh: I(2020/2016) = [I(2020/2018) * I(2018/2016)] / 100.","Kaedah Alternatif (Andaikan Harga Asas = 100): Jika I(2018/2010) = 176 dan I(2018/2015) = 110, biarkan Q2010 = 100 => Q2018 = 176. Kemudian 176/Q2015 * 100 = 110 => Q2015 = 160. Maka I(2015/2010) = 160!","Penukaran Indeks Songsang: I(A/B) = 10000 / I(B/A)."],"formula":"I(C/A) = [ I(C/B) * I(B/A) ] / 100","labId":"addm410_indeks_rantai_lab","labTitle":"Uji Aturan Rantai Pada 3 Tahun (T0 -> T1 -> T2)","labProps":{"q0":500,"q1":550,"q2":660},"examTip":"Elakkan kesilapan paling lazim: JANGAN sekali-kali menolak atau menambah indeks untuk menukar tahun asas (cth. 176 - 110 adalah SALAH)! Sentiasa darab/bahagi dengan faktor 100."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Aturan Rantai Tiga Tahun","voiceCaption":"Ramalkan nombor indeks harga tahun dua ribu lapan belas berasaskan tahun dua ribu sepuluh apabila Q sifar lima ratus, Q satu lima ratus lima puluh dan Q dua enam ratus enam puluh.","voiceScript":"[curious] Gunakan aturan rantai! Jika indeks dari T kosong ke T satu ialah seratus sepuluh, dan indeks dari T satu ke T dua ialah seratus dua puluh, berapakah indeks dari T kosong terus ke T dua?","hook":"Sahkan nilai (110 x 120) / 100 pada Kalkulator Aturan Rantai!","scenario":"Indeks harga meningkat 10% dari T0 ke T1 (I10 = 110), kemudian meningkat lagi 20% dari T1 ke T2 (I21 = 120).","prompt":"Apakah nombor indeks T2 berasaskan T0 (I20)?","options":["132 (peningkatan keseluruhan 32%)","130 (kerana 10% + 20% = 30%)","115 (purata kedua-dua indeks)","230"],"correctIndex":0,"proofLabId":"addm410_indeks_rantai_lab","proofState":{"q0":500,"q1":550,"q2":660},"explanation":"I20 = (120 * 110) / 100 = 132! Peningkatan berganda 10% diikuti 20% ialah 32%, bukan 30%, kerana kenaikan kedua dikira di atas harga T1 yang sudah lebih tinggi."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Langkah Penukaran Tahun Asas","voiceCaption":"Susun langkah mencari indeks harga tahun dua ribu lima belas berasaskan tahun dua ribu sepuluh daripada Contoh tiga buku teks.","voiceScript":"[confident] Susun empat langkah penyelesaian Contoh tiga buku teks untuk mencari indeks harga basikal tahun dua ribu lima belas berasaskan tahun dua ribu sepuluh!","prompt":"Diberi I(2018/2010) = 176 dan I(2018/2015) = 110. Susun langkah mencari I(2015/2010):","hint":"Tuliskan rumus rantai I(2018/2010) = [I(2018/2015) * I(2015/2010)] / 100...","answerTokens":["Tulis rumus rantai: I(2018/2010) = [I(2018/2015) * I(2015/2010)] / 100","Gantikan nilai: 176 = [110 * I(2015/2010)] / 100","Susun semula: I(2015/2010) = (176 * 100) / 110","Kira jawapan tepat: I(2015/2010) = 160"],"distractors":["Tolak terus 176 - 110 = 66 + 100 = 166","Bahagikan 110 dengan 176 darab 100"],"explanation":"176 / 110 * 100 = 160, menunjukkan harga basikal naik 60% dari 2010 ke 2015 sebelum naik 10% lagi dari 2015 ke 2018."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kira Indeks Rantai Menurun & Menaik","voiceCaption":"Hitung indeks harga pada tahun dua ribu dua puluh lima berasaskan tahun dua ribu dua puluh jika harga mula-mula menyusut sepuluh peratus dan kemudian meningkat dua puluh peratus.","voiceScript":"[confident] Kira indeks keseluruhan jika harga pada tahun dua ribu dua puluh hingga dua ribu dua puluh dua menyusut sepuluh peratus, kemudian meningkat dua puluh peratus hingga tahun dua ribu dua puluh lima!","prompt":"Harga suatu komponen menyusut 10% dari 2020 ke 2022, dan kemudian menokok 20% dari 2022 ke 2025. Cari indeks harga pada tahun 2025 berasaskan tahun 2020.","options":["108","110","105","98"],"correctIndex":0,"explanation":"I(2022/2020) = 100 - 10 = 90; I(2025/2022) = 100 + 20 = 120. Maka I(2025/2020) = (120 * 90) / 100 = 108 (naik 8% keseluruhan)."}]},{"id":"addm410-u3","title":"Unit 3: Indeks Gubahan & Jenis-jenis Pemberat","subtitle":"Subtopik 10.2 — Rumus Indeks Gubahan I_bar = sum(I*w)/sum(w) serta Pemberat Nisbah, Peratus & Carta Pai","iconType":"atom","iconUrl":"../assets/icons/addm410-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Indeks Gubahan & Pemberat","voiceCaption":"Indeks gubahan menggabungkan nombor indeks beberapa bahan berdasarkan pemberat kepentingannya menggunakan hasil tambah indeks darab pemberat bahagi jumlah pemberat.","voiceScript":"[warm] Selamat datang ke Unit tiga, Indeks Gubahan! Dalam pengeluaran produk seperti kek, perabot atau indeks harga pengguna, setiap bahan mempunyai tahap kepentingan atau kos yang berbeza yang dipanggil PEMBERAT w! Oleh itu, kita tidak boleh mengambil purata ringkas semata-mata — kita mesti menggunakan INDEKS GUBAHAN I bar sama dengan hasil tambah I darab w dibahagi jumlah w! Dalam soalan S P M, pemberat w boleh diberi dalam pelbagai bentuk: nisbah seperti empat kepada dua kepada satu, peratus yang berjumlah seratus, sudut sektor dalam carta pai yang berjumlah tiga ratus enam puluh darjah, ataupun perbelanjaan tahun asas! Uji pemberat pada kalkulator di bawah!","title":"10.2 Indeks Gubahan Berpemberat: I_bar = sum(I_i * w_i) / sum(w_i)","acronym":"ΣIw / Σw","hook":"Laraskan indeks dan pemberat Bahan A di bawah untuk melihat bagaimana wajaran menarik purata gubahan!","mediaKey":"addm410_carta_wajaran","summary":"Indeks gubahan I_bar = sum(I_i * w_i) / sum(w_i) mengira purata berpemberat bagi pelbagai item, dengan pemberat boleh berupa nisbah, peratus, sudut carta pai atau kos tahun asas.","bullets":["Rumus Indeks Gubahan: I_bar = (I1*w1 + I2*w2 + ... + In*wn) / (w1 + w2 + ... + wn).","4 Cara Pemberat Diberi dalam Soalan: (1) Jadual pemberat integer/nisbah (cth. 4 : 1 : 2 : 3); (2) Peratus penggunaan (sum w = 100%, jika satu peratus hilang -> tolak dari 100%); (3) Sudut carta pai (sum w = 360 darjah); (4) Kos/kuantiti pada TAHUN ASAS!","Mengenal Pasti Bahan Hilang w/I: Gunakan I_bar yang diberi untuk membentuk persamaan linear tunggal dan selesaikan nilai x yang hilang."],"formula":"I_bar = sum(I_i * w_i) / sum(w_i)","labId":"addm410_indeks_gubahan_lab","labTitle":"Kalkulator Indeks Gubahan Berpemberat","labProps":{"iA":120,"wA":4,"iB":110,"wB":2,"iC":140,"wC":4},"examTip":"Jika jadual pemberat menggunakan 'Carta Palang' atau 'Carta Pai' dengan satu nilai tidak berlabel, ingat: jumlah peratus = 100% dan jumlah sudut carta pai = 360°!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Kesan Pemberat Lebih Besar","voiceCaption":"Ramalkan arah perubahan indeks gubahan apabila pemberat bagi bahan berindeks tertinggi dinaikkan.","voiceScript":"[curious] Jika Bahan A berindeks seratus empat puluh lima mempunyai pemberat ditingkatkan daripada dua kepada lapan manakala bahan lain mempunyai indeks seratus sepuluh, bagaimanakah nilai indeks gubahan berubah?","hook":"Naikkan slider pemberat wA pada Kalkulator Indeks Gubahan!","scenario":"Bahan A (I = 145) digabungkan dengan Bahan B (I = 110) dan Bahan C (I = 110).","prompt":"Apakah kesan apabila pemberat bagi Bahan A digandakan menjadi jauh lebih besar?","options":["Indeks gubahan meningkat dan mendekati nilai 145","Indeks gubahan menurun mendekati nilai 110","Indeks gubahan kekal tetap kerana indeks setiap bahan tidak berubah","Indeks gubahan melebihi 145"],"correctIndex":0,"proofLabId":"addm410_indeks_gubahan_lab","proofState":{"iA":145,"wA":8,"iB":110,"wB":2,"iC":110,"wC":2},"explanation":"Purata berpemberat sentiasa terletak di antara indeks minimum dan maksimum (110 <= I_bar <= 145), dan semakin dekat ke indeks item yang berwajaran paling besar."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Jenis Pemberat & Jumlahnya","voiceCaption":"Padankan empat jenis pemberat dalam soalan Indeks Gubahan dengan cara menentukan nilai pemberat yang hilang.","voiceScript":"[confident] Padankan setiap bentuk pemberat yang sering keluar dalam soalan S P M dengan jumlah rujukannya!","prompt":"Padankan jenis perwakilan pemberat dengan kaedah menentukan nilai pemberatnya:","pairs":[{"id":"a410u3m1","left":"Peratus penggunaan bahan A, B, C, D","right":"Jumlah kesemua pemberat ialah 100"},{"id":"a410u3m2","left":"Carta pai sudut sektor bahan pengeluaran","right":"Jumlah kesemua sudut pemberat ialah 360 darjah"},{"id":"a410u3m3","left":"Nisbah kuantiti atau belanja pada tahun asas (cth. 3:5:2)","right":"Guna angka nisbah terus (sum w = 10)"},{"id":"a410u3m4","left":"Kos bahan pada tahun asas ialah RM20, RM50 dan RM30","right":"Boleh ringkas nisbah pemberat kepada 2 : 5 : 3"}],"explanation":"Meringkaskan pemberat berkadaran (cth. 20:50:30 kepada 2:5:3) memberi indeks gubahan yang sama tepat sambil memudahkan pengiraan!"},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Hitung Indeks Gubahan 4 Bahan","voiceCaption":"Hitung indeks gubahan bagi empat bahan A, B, C dan D daripada jadual indeks dan pemberat.","voiceScript":"[confident] Selesaikan soalan Latihan Pengukuhan ini: kira indeks gubahan bagi empat bahan dengan indeks seratus dua puluh, seratus sepuluh, seratus dan seratus empat puluh serta pemberat empat, dua, tiga dan satu!","prompt":"Empat bahan mempunyai indeks 120, 110, 100 dan 140 dengan pemberat masing-masing 4, 2, 3 dan 1. Hitung indeks gubahannya.","options":["114","117.5","116","120"],"correctIndex":0,"explanation":"sum(I*w) = 120(4) + 110(2) + 100(3) + 140(1) = 480 + 220 + 300 + 140 = 1140. sum(w) = 4 + 2 + 3 + 1 = 10. Maka I_bar = 1140 / 10 = 114."}]},{"id":"addm410-u4","title":"Unit 4: Aplikasi Indeks Gubahan & Jumlah Kos","subtitle":"Subtopik 10.2 — Mengira Jumlah Kos Pengeluaran, Keuntungan/Harga Jualan & Gabungan Aturan Rantai","iconType":"pendulum","iconUrl":"../assets/icons/addm410-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Kos Pengeluaran & Indeks Gubahan","voiceCaption":"Indeks gubahan bertindak tepat seperti nombor indeks tunggal untuk mengira jumlah kos pengeluaran pada tahun semasa atau tahun asas melalui rumus C satu bahagi C sifar darab seratus.","voiceScript":"[warm] Selamat datang ke Unit empat! Ini ialah bahagian kemuncak sepuluh markah Kertas dua bagi Bab sepuluh! Sebaik sahaja anda mendapat INDEKS GUBAHAN I bar, anda boleh melayannya tepat seperti nombor indeks tunggal untuk keseluruhan kos pengeluaran! I bar sama dengan jumlah kos tahun semasa C satu bahagi jumlah kos tahun asas C sifar darab seratus! Satu peringatan penting dalam soalan keuntungan dan jualan: jika pembekal mahu mengekalkan peratus keuntungan yang sama apabila kos bahan meningkat, maka harga jualan juga mesti meningkat pada kadar indeks gubahan yang sama! Dan ingat, jika kos setiap bahan dalam ringgit diberi pada tahun asas, kos itu sendirilah yang menjadi pemberat!","title":"10.2 Aplikasi Kos Pengeluaran, Harga Jualan & Gabungan Rantai","acronym":"Ī=C1/C0×100","hook":"Indeks gubahan = (Jumlah Kos Tahun Semasa / Jumlah Kos Tahun Asas) x 100!","summary":"Jumlah kos pembuatan pada tahun semasa C1 dan tahun asas C0 dihubungkan secara langsung melalui indeks gubahan I_bar = (C1 / C0) * 100.","bullets":["Rumus Jumlah Kos: I_bar = (C1 / C0) * 100 => C1 = (I_bar / 100) * C0, dan C0 = (100 / I_bar) * C1.","Menentukan Pemberat daripada Kos Tahun Asas: Jika jadual memberi kos tahun asas bagi 3 bahan ialah RM12, RM20 dan RM8 (jumlah RM40), gunakan 12, 20, 8 (atau 3, 5, 2) sebagai pemberat w! JANGAN guna kos tahun semasa sebagai pemberat!","Mencari Indeks Gubahan Tahun ke-3: Aturan rantai juga sah untuk indeks gubahan keseluruhan: I_bar(T2/T0) = [I_bar(T2/T1) * I_bar(T1/T0)] / 100."],"formula":"I_bar = (Kos_1 / Kos_0) * 100   |   Pemberat w = Perbelanjaan pada Tahun Asas (bukan tahun semasa!)","examTip":"Kesilapan maut Kertas 2: Apabila jadual hanya menyenaraikan kuantiti (kg) dan harga seunit (RM/kg) pada tahun asas, PEMBERAT ialah (Kuantiti * Harga Tahun Asas), bukan kuantiti semata-mata jika melibatkan gabungan kos perbelanjaan!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Langkah Kira Kos Tahun Semasa","voiceCaption":"Susun langkah mengira kos pengeluaran sebuah kek pada tahun baharu apabila indeks gubahan dan kos tahun asas diketahui.","voiceScript":"[confident] Susun empat langkah mengira kos pengeluaran pada tahun dua ribu dua puluh enam jika indeks gubahan dari dua ribu dua puluh ke dua ribu dua puluh tiga ialah seratus dua puluh dan kos naik lagi sepuluh peratus ke dua ribu dua puluh enam!","prompt":"Kos asas tahun 2020 ialah RM50. I_bar(2023/2020) = 120 dan kos naik 10% dari 2023 ke 2026. Susun langkah mencari kos 2026:","hint":"Tukarkan kenaikan 10% kepada I(2026/2023) = 110 dan guna aturan rantai...","answerTokens":["Kenal pasti I_bar(2023/2020) = 120 dan I_bar(2026/2023) = 110","Guna aturan rantai: I_bar(2026/2020) = (120 * 110) / 100 = 132","Gantikan ke dalam rumus kos: (Kos_2026 / 50) * 100 = 132","Jadi Kos_2026 = (132 / 100) * 50 = RM66.00"],"distractors":["Tambah indeks 120 + 10 = 130 untuk mendapat RM65.00","Bahagi 50 dengan 1.32 untuk mendapat kos 2026"],"explanation":"Aturan rantai memberi indeks gubahan 2026 berasaskan 2020 = (120 * 110)/100 = 132, maka kos baharu = 1.32 * RM50 = RM66.00."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Konsep Benar vs Perangkap Bab 10","voiceCaption":"Kelaskan enam pernyataan mengenai Indeks Gubahan dan Kos Pengeluaran berikut antara Benar atau Salah.","voiceScript":"[curious] Elakkan kesilapan konsep dalam soalan sepuluh markah Kertas dua! Kelaskan keenam-enam pernyataan ini kepada Benar atau Salah.","prompt":"Kelaskan pernyataan mengenai Indeks Gubahan berikut kepada Benar atau Salah:","buckets":[{"id":"benar","label":"Pernyataan Benar"},{"id":"salah","label":"Pernyataan Salah (Perangkap)"}],"items":[{"text":"Indeks gubahan keseluruhan sentiasa mempunyai nilai di antara indeks terkecil dan terbesar itemnya","bucketId":"benar","note":"Betul! Purata berpemberat tidak pernah melebihi julat nilai komponennya."},{"text":"Jika kos meningkat sebanyak 24% (I_bar = 124), kos asal C0 = C1 / 1.24","bucketId":"benar","note":"Tepat! Daripada (C1/C0)*100 = 124."},{"text":"Pemberat kos tahun 2026 berasaskan 2020 diambil daripada perbelanjaan pada tahun 2026","bucketId":"salah","note":"SALAH! Pemberat mestilah berasaskan perbelanjaan pada tahun asas 2020."},{"text":"Aturan rantai hanya boleh digunakan untuk satu bahan, bukan untuk indeks gubahan","bucketId":"salah","note":"SALAH! Aturan rantai boleh digunakan untuk jumlah kos dan indeks gubahan selagi pemberat kekal sama."},{"text":"Jika pemberat semua bahan digandakan 2 kali, nilai I_bar tidak berubah","bucketId":"benar","note":"Tepat! Faktor 2 di pengangka dan penyebut saling memotong."},{"text":"Untuk mengekalkan kadar keuntungan apabila kos naik 20%, harga jualan juga naik 20%","bucketId":"benar","note":"Betul! Nisbah jualan kepada kos kekal malar."}],"explanation":"Menguasai sifat pemberat dan aturan rantai mengelakkan kesilapan teknikal semasa menjawab Bahagian B Kertas 2."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Kira Jumlah Kos Baharu daripada I_bar","voiceCaption":"Hitung jumlah kos pengeluaran semasa jika jumlah kos pada tahun asas ialah dua ribu lima ratus ringgit dan indeks gubahannya seratus dua puluh empat.","voiceScript":"[confident] Hitung jumlah kos pengeluaran baharu apabila kos tahun asas ialah dua ribu lima ratus ringgit dan indeks gubahannya ialah seratus dua puluh empat!","prompt":"Jumlah kos pembuatan sebuah meja pada tahun asas ialah RM2 500. Jika indeks gubahan bagi kos tersebut ialah 124, hitung kos pembuatannya pada tahun semasa.","options":["RM3 100","RM2 624","RM2 016","RM3 000"],"correctIndex":0,"explanation":"124 = (C1 / 2500) * 100 => C1 = 1.24 * 2500 = RM3 100."}]},{"id":"addm410-u5","title":"Unit 5: Cabaran Boss SPM — Nombor Indeks","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Indeks Gubahan Pelbagai Bentuk, Cari Indeks Hilang & Aturan Rantai Kos","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Indeks Gubahan Peratus Perubahan","voiceCaption":"Soalan Boss pertama menguji penukaran peratus kenaikan dan penyusutan tiga bahan kepada indeks gubahan berpemberat.","voiceScript":"[excited] Selamat datang ke Unit Boss Bab sepuluh! Soalan pertama menukar peratus kenaikan dan penyusutan kepada nombor indeks sebelum mengira indeks gubahan!","prompt":"Dalam pembuatan produk, kos A naik 10%, B susut 15%, dan C naik 25% dengan pemberat masing-masing 3, 2 dan 5. Hitung indeks gubahannya.","options":["112.5","115.0","106.7","120.0"],"correctIndex":0,"explanation":"IA = 110, IB = 85, IC = 125. sum(I*w) = 110(3) + 85(2) + 125(5) = 330 + 170 + 625 = 1125. sum(w) = 3 + 2 + 5 = 10 => I_bar = 1125 / 10 = 112.5."},{"type":"predict","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Aturan Rantai Tahun Asas Baharu","voiceCaption":"Ramalkan nilai indeks gubahan tahun dua ribu dua puluh lima berasaskan tahun dua ribu lapan belas menggunakan aturan rantai.","voiceScript":"[curious] Soalan Boss kedua! Jika indeks harga tahun dua ribu dua puluh dua berasaskan dua ribu lapan belas ialah seratus dua puluh, dan dari dua ribu dua puluh dua ke dua ribu dua puluh lima ialah seratus dua puluh lima, berapakah indeks dua ribu dua puluh lima berasaskan dua ribu lapan belas?","hook":"Gunakan (I_2025/2022 x I_2022/2018) / 100!","scenario":"I(2022/2018) = 120 dan I(2025/2022) = 125.","prompt":"Apakah nombor indeks tahun 2025 berasaskan tahun 2018?","options":["150","145","122.5","160"],"correctIndex":0,"proofLabId":"addm410_indeks_rantai_lab","proofState":{"q0":400,"q1":480,"q2":600},"explanation":"I(2025/2018) = (125 * 120) / 100 = 150 (peningkatan keseluruhan 50%)."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Cari Indeks x daripada Indeks Gubahan","voiceCaption":"Susun langkah mencari indeks yang tidak diketahui x apabila diberi indeks gubahan seratus dua puluh dan pemberat.","voiceScript":"[confident] Soalan Boss ketiga berformat Kertas satu! Susun langkah menyelesaikan nilai indeks x yang hilang apabila diberi indeks gubahan seratus dua puluh!","prompt":"Tiga bahan mempunyai indeks 110, 130 dan x dengan pemberat 4, 2 dan 4. Jika I_bar = 120, susun langkah mencari x:","hint":"Bina persamaan (110*4 + 130*2 + 4x) / 10 = 120...","answerTokens":["Tuliskan persamaan I_bar: [110(4) + 130(2) + 4x] / (4 + 2 + 4) = 120","Permudah pengangka dan darab silang: 700 + 4x = 1200","Asingkan 4x = 1200 - 700 = 500","Bahagi 4 untuk memperoleh x = 125"],"distractors":["Puratakan 110 + 130 + x bahagi 3 = 120","Bahagi 1200 dengan 10 menjadi 120 = x"],"explanation":"440 + 260 + 4x = 1200 => 700 + 4x = 1200 => 4x = 500 => x = 125."},{"type":"match","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Masalah Kos & Indeks Gubahan","voiceCaption":"Padankan empat maklumat indeks dan kos dengan nilai jawapannya yang tepat.","voiceScript":"[confident] Soalan Boss keempat! Padankan keempat-empat masalah kos dan nombor indeks ini dengan jawapannya yang tepat.","prompt":"Padankan setiap masalah Nombor Indeks dengan penyelesaian tepatnya:","pairs":[{"id":"a410b4m1","left":"Kos semasa C1 = RM690 dengan I_bar = 115; cari kos asas C0","right":"RM600"},{"id":"a410b4m2","left":"Indeks harga 2024/2020 = 80; tafsirkan perubahan","right":"Harga menyusut 20% dari 2020 ke 2024"},{"id":"a410b4m3","left":"Sudut carta pai bahan P, Q, R ialah 144°, 108°, k°","right":"k = 108° (nisbah pemberat 4 : 3 : 3)"},{"id":"a410b4m4","left":"I(B/A) = 125; cari I(A/B)","right":"10000 / 125 = 80"}],"explanation":"Perhatikan C0 = 690 / 1.15 = RM600, dan indeks songsang I(A/B) = (100/125)*100 = 80."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss 5: Gabungan Kos & Aturan Rantai","voiceCaption":"Selesaikan soalan kemuncak Bab sepuluh yang menggabungkan kos asal empat ratus ringgit dengan dua peringkat kenaikan indeks gubahan.","voiceScript":"[excited] Soalan Boss terakhir Matematik Tambahan Tingkatan empat! Kos pengeluaran tahun dua ribu dua puluh ialah empat ratus ringgit. Jika indeks gubahan dua ribu dua puluh tiga berasaskan dua ribu dua puluh ialah seratus lima belas dan dua ribu dua puluh enam berasaskan dua ribu dua puluh tiga ialah seratus dua puluh, berapakah kos pada tahun dua ribu dua puluh enam?","prompt":"Kos asas pengeluaran pada tahun 2020 ialah RM400. Diberi I_bar(2023/2020) = 115 dan I_bar(2026/2023) = 120. Hitung kos pengeluaran pada tahun 2026.","options":["RM552","RM540","RM460","RM480"],"correctIndex":0,"explanation":"Aturan rantai: I_bar(2026/2020) = (120 * 115) / 100 = 138. Maka kos pada tahun 2026 = (138 / 100) * RM400 = RM552."}]}]};</script>

  "addm410_indeks_harga": {

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");

  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

    "</figure>"
  );
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

        });
      } else if (bullets.length >= 2) {
        slides.push({
          label: tUi("Fakta 1", "Fact 1"),

        });
        slides.push({

        });
      } else {
        slides.push({

        });
      }
    } else {

        });
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }

        });

      if (parts.labHtml) {

          label: tUi("Makmal 3D", "3D Lab"),

          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({

        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),

        });
      }
    }
    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {

      (acronymPill || "") +
    "</div>";

    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {

          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +

        }).join("") +
      "</div>"
    : "";
