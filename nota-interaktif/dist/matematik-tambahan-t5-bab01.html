/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab01","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":1,"title":"Sukatan Membulat","subtitle":"Subtopik 1.1–1.4 KSSM — Takrifan 1 Radian (s = j), Penukaran Darjah-Radian (π = 3.142), Panjang Lengkok s = jθ, Perimeter Tembereng (Petua Kosinus/Sinus), Luas Sektor L = ½j²θ = ½js, Rumus Heron & Aplikasi Kejuruteraan SPM.","estimatedMinutes":35,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t5-bab01-labs.js","coverIcon":"../assets/icons/addm51-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Pengiraan radian, panjang lengkok dan luas sektor kamu sangat tepat!","combo":"[laughs warmly] Kombo yang luar biasa! [excited] Semua penukaran sudut dan tembereng bulatan berjaya diselesaikan!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Pastikan sudut sudah ditukar kepada radian sebelum memasukkan nilai ke dalam rumus s = jθ dan L = 1/2 j^2 θ.","celebrate":"[excited] Tahniah! Satu lagi unit Matematik Tambahan Tingkatan lima Bab satu berjaya dikuasai!"},"units":[{"id":"addm51-u1","title":"Unit 1: Radian & Penukaran Darjah–Radian","subtitle":"Subtopik 1.1 — Takrif 1 Radian (s = j), Hubungan π rad = 180°, Nilai 1 rad ≈ 57.29° & Penukaran Minit Sudut","iconType":"formula","iconUrl":"../assets/icons/addm51-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Takrif 1 Radian & Video","voiceCaption":"Satu radian ialah sudut yang tercangkum di pusat bulatan oleh lengkok yang sama panjang dengan jejarinya (s = j).","voiceScript":"[warm] Selamat datang ke Matematik Tambahan Tingkatan lima, Bab satu, Sukatan Membulat! Dalam bab ini kita mempelajari bagaimana jurutera kawalan trafik udara dan arkitek menggunakan unit radian untuk mengukur lengkok dan sektor bulatan. Tonton video penerangan bersuara ini dahulu untuk memahami takrifan satu radian apabila panjang lengkok s menyamai jejari j, serta perkaitan pi radian bersamaan seratus lapan puluh darjah!","title":"1.1 Takrifan 1 Radian dan Perkaitan π rad = 180°","acronym":"s = j • π = 180°","hook":"Apabila panjang lengkok melengkung di lilitan menyamai panjang jejari lurus bulatan, sudut pusatnya ialah tepat 1 radian!","mediaKey":"addm51_radian_hero","videoClip":{"src":"../assets/matematik-tambahan-t5-bab01/video/addm51_video_sukatan_membulat_narasi.mp4","hasNarration":true,"posterKey":"addm51_radian_hero","caption":"Takrifan 1 Radian (s = j), Panjang Lengkok s = jθ, Luas Sektor L = 1/2 j²θ & Aplikasi Sukatan Membulat."},"summary":"Satu radian (1 rad) ditakrifkan sebagai ukuran sudut tercangkum di pusat bulatan apabila panjang lengkok sama dengan jejari bulatan tersebut; satu putaran lengkap 360° bersamaan 2π rad.","bullets":["Takrifan Radian: Bagi bulatan berpusat O dan jejari j, jika panjang lengkok AB = j maka ∠AOB = 1 rad; jika AB = πj maka ∠AOB = π rad (180°); dan jika AB = 2πj (satu pusingan lengkap) maka ∠AOB = 2π rad (360°).","Anggaran Piawai (π = 3.142): 1 rad = 180° / π ≈ 57.29° (57° 17'), manakala 1° = π / 180° ≈ 0.01746 rad."],"labId":"addm51_radian_converter_lab","labTitle":"Simulator Takrifan 1 Radian & Penukar Sudut","labProps":{"rad":1,"j":10},"formula":"2π rad = 360°   |   π rad = 180°   |   1 rad ≈ 57.29°   |   1° ≈ 0.01746 rad","examTip":"Dalam peperiksaan S.P.M., sentiasa gunakan nilai π = 3.142 seperti yang diarahkan oleh soalan kecuali jawapan diminta dalam sebutan π!"},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Nilai 2.25 Radian","voiceCaption":"Tukarkan 2.25 rad kepada darjah dan minit dengan menggunakan π = 3.142.","voiceScript":"[curious] Mari kita uji kemahiran menukar unit sudut! Sebuah papan permainan baling damak mempunyai sudut sektor dua perpuluhan dua lima radian. Menggunakan pi sama dengan tiga perpuluhan satu empat dua, berapakah sudut tersebut dalam darjah dan minit?","hook":"Bandingkan jawapan kamu dalam Simulator Penukar Sudut selepas memilih!","scenario":"Contoh 1(b) Buku Teks: Sudut θ = 2.25 rad hendak ditukar kepada unit darjah dan minit (gunakan π = 3.142).","prompt":"Berapakah ukuran sudut bagi 2.25 rad dalam darjah dan minit terhampir?","options":["128° 54'","72° 00'","126° 02'","40° 30'"],"correctIndex":0,"proofLabId":"addm51_radian_converter_lab","proofState":{"rad":2.25,"j":8},"explanation":"2.25 rad × (180° / 3.142) = 128.8988°, dan 0.8988 × 60' ≈ 54', maka jawapan tepat ialah 128° 54'.","examTip":"Untuk menukar pecahan darjah kepada minit, darabkan bahagian perpuluhan darjah dengan 60 atau tekan butang darjah-minit-saat pada kalkulator."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Penukaran Darjah ke Radian","voiceCaption":"Untuk menukar darjah kepada radian, darabkan sudut darjah dengan π/180°; sudut 110° 30' bersamaan 1.929 rad.","voiceScript":"[confident] Sekarang kita terbalikkan proses tadi, daripada darjah kepada radian! Caranya amat mudah: darabkan nilai sudut darjah dengan pi bahagi seratus lapan puluh darjah. Jika soalan meminta jawapan dalam sebutan pi, contohnya seratus lima puluh darjah, biarkan pi sebagai simbol untuk mendapat lima per enam pi radian. Jika melibatkan minit seperti seratus sepuluh darjah tiga puluh minit, tukar kepada seratus sepuluh perpuluhan lima darjah dahulu lalu darab tiga perpuluhan satu empat dua bahagi seratus lapan puluh untuk mendapat satu perpuluhan sembilan dua sembilan radian!","title":"Menukar Darjah & Minit kepada Radian","acronym":"× π / 180°","hook":"Darab π/180° untuk masuk ke dunia radian, dan darab 180°/π untuk pulang semula ke dunia darjah!","mediaKey":"addm51_radian_hero","summary":"Penukaran darjah ke radian dilakukan dengan mendarab faktor π/180° sama ada meninggalkan jawapan dalam sebutan π atau menggunakan π = 3.142.","bullets":["Dalam Sebutan π (Contoh 2a): 40° = 40° × (π / 180°) = (2/9)π rad; manakala 150° = 150° × (π / 180°) = (5/6)π rad.","Dengan Minit & Perpuluhan (Contoh 2b): 110° 30' = 110.5° × (3.142 / 180°) = 1.929 rad, dan 320° = 320° × (3.142 / 180°) = 5.586 rad."],"formula":"Sudut (rad) = Sudut (°) × (π / 180°)   |   Sudut (°) = Sudut (rad) × (180° / π)","examTip":"Sentiasa semak julat jawapan: sudut cakah (>90°) melebihi π/2 ≈ 1.571 rad, dan sudut refleks (>180°) melebihi π ≈ 3.142 rad."},{"type":"match","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Sudut Darjah-Radian","voiceCaption":"Padankan lima ukuran sudut dalam darjah dengan nilai setaranya dalam radian.","voiceScript":"[warm] Jom padankan lima pasangan sudut darjah dan radian yang kerap keluar dalam soalan Kertas satu S P M!","prompt":"Padankan setiap sudut dalam darjah dengan nilai setaranya dalam radian (π = 3.142):","pairs":[{"id":"p1","left":"72°","right":"(2/5)π rad"},{"id":"p2","left":"120°","right":"(2/3)π rad"},{"id":"p3","left":"225°","right":"(5/4)π rad"},{"id":"p4","left":"300°","right":"(5/3)π rad"},{"id":"p5","left":"110° 30'","right":"1.929 rad"}],"explanation":"Darabkan setiap sudut darjah dengan π/180°: 72/180 = 2/5, 120/180 = 2/3, 225/180 = 5/4, 300/180 = 5/3, manakala 110.5 × 3.142 / 180 = 1.929 rad."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Susun Takrif 1 Radian","voiceCaption":"Susun blok perkataan berikut untuk melengkapkan takrif rasmi satu radian mengikut buku teks KSSM.","voiceScript":"[confident] Lengkapkan ayat takrifan rasmi bagi satu radian menggunakan blok kata yang disediakan.","prompt":"Susun blok perkataan untuk membentuk takrifan rasmi bagi 1 radian:","hint":"Fokus pada hubungan antara panjang lengkok dan jejari bulatan di pusat.","answerTokens":["Satu radian ialah","sudut di pusat bulatan","yang tercangkum oleh lengkok","yang sama panjang dengan","jejari bulatan itu"],"distractors":["diameter bulatan itu","luas sektor minor"],"explanation":"1 radian terhasil tepat apabila panjang lengkok s yang mencangkum sudut di pusat bulatan adalah sama panjang dengan jejari j bulatan itu."}]},{"id":"addm51-u2","title":"Unit 2: Panjang Lengkok Suatu Bulatan (s = jθ)","subtitle":"Subtopik 1.2 (Bhg. A) — Menerbitkan s = jθ, Mencari s, j atau θ serta Sudut Refleks Sektor Major","iconType":"graph","iconUrl":"../assets/icons/addm51-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Rumus Panjang Lengkok s = jθ","voiceCaption":"Panjang lengkok bulatan berjejari j dengan sudut θ radian ialah s = jθ.","voiceScript":"[warm] Mari masuk ke Subtopik satu perpuluhan dua, Panjang Lengkok Suatu Bulatan! Jika sudut pusat diukur dalam darjah, panjang lengkok ialah dua pi j darab sudut bahagi tiga ratus enam puluh darjah. Tetapi apabila sudut diukur dalam radian, dua pi saling terhapus! Maka lahirlah rumus yang sangat ringkas dan berkuasa: s sama dengan j theta, dengan syarat mutlak theta wajib berada dalam unit radian!","title":"1.2 Rumus Panjang Lengkok s = jθ & Sudut Refleks","acronym":"s = j • θ","hook":"Apabila sudut diukur dalam radian, faktor 2π terhapus kemas sehingga panjang lengkok menjadi sekadar jejari darab sudut!","mediaKey":"addm51_arc_segment","summary":"Nisbah panjang lengkok s terhadap lilitan bulatan 2πj adalah sama dengan nisbah sudut θ radian terhadap 2π rad, menghasilkan s = jθ.","bullets":["Penerbitan Rumus: s / (2πj) = θ / (2π) memudahkan terus kepada s = jθ (θ dalam radian). Contoh: Buaian panjang 2.5 m berayun melalui 1.7 rad menghasilkan s = 2.5 × 1.7 = 4.25 m.","Lengkok Major vs Minor: Jika soalan memberi sudut minor θ (cth. 140° atau 1.284 rad) tetapi meminta panjang lengkok MAJOR, cari sudut refleks dahulu: θ_major = 2π - θ_minor (atau (360° - 140°) × π/180° = 3.84 rad)."],"labId":"addm51_arc_segment_lab","labTitle":"Peneroka Panjang Lengkok s = jθ & Sektor Major","labProps":{"j":10,"theta":3.84},"formula":"s = jθ   |   j = s / θ   |   θ = s / j   (θ wajib dalam radian)","examTip":"Kesilapan paling kerap dalam S.P.M. ialah menggantikan sudut dalam DARJAH terus ke dalam s = jθ. Semak sentiasa unit sudut!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Kaedah Kira Lengkok","voiceCaption":"Kelaskan situasi berikut sama ada sudut boleh terus dimasukkan ke s = jθ atau perlu ditukar/ditolak daripada 2π dahulu.","voiceScript":"[curious] Uji kepekaan kamu mengelak perangkap soalan! Asingkan situasi berikut sama ada sudut boleh terus diganti ke dalam rumus s sama dengan j theta, ataupun perlu ditukar terlebih dahulu.","prompt":"Isihkan setiap maklumat sudut berikut sebelum mengira panjang lengkok dengan rumus s = jθ:","buckets":[{"id":"terus","label":"Terus Ganti dalam s = jθ"},{"id":"tukar","label":"Perlu Tukar / Cari Sudut Refleks"}],"items":[{"text":"Sektor POQ berjejari 5 cm dan sudut POQ = 0.9 rad (cari lengkok minor PQ)","bucketId":"terus","note":"Sudut sudah dalam radian dan sepadan dengan lengkok minor PQ."},{"text":"Sektor POQ berjejari 6 cm dan sudut POQ = (2/3)π rad (cari lengkok minor PQ)","bucketId":"terus","note":"Sudut dalam sebutan π sudah pun merupakan ukuran radian."},{"text":"Sudut minor POQ = 140° tetapi soalan meminta panjang lengkok major PQ","bucketId":"tukar","note":"Cari sudut refleks 360° - 140° = 220°, kemudian darab π/180° = 3.84 rad."},{"text":"Panjang lengkok major EF = 25 cm dan sudut minor EOF = 1.284 rad (cari jejari j)","bucketId":"tukar","note":"Sudut yang sepadan dengan lengkok major ialah 2π - 1.284 = 5.00 rad, bukan 1.284 rad!"}],"explanation":"Sudut θ dalam s = jθ mestilah dalam unit radian DAN mesti menghadap lengkok yang sama (minor dengan minor, major dengan sudut refleks)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Jejari Lengkok Major","voiceCaption":"Diberi panjang lengkok major EF ialah 25 cm dan sudut minor EOF ialah 1.284 rad; ramalkan jejari j bulatan.","voiceScript":"[curious] Cuba selesaikan Latihan Kendiri satu perpuluhan dua soalan dua! Panjang lengkok major E F ialah dua puluh lima sentimeter manakala sudut minor E O F ialah satu perpuluhan dua lapan empat radian. Berapakah jejari bulatan tersebut?","hook":"Periksa nilai panjang lengkok dan sudut dalam Simulator Panjang Lengkok selepas menjawab!","scenario":"Latihan Kendiri 1.2: Panjang lengkok major EF = 25 cm, sudut minor ∠EOF = 1.284 rad (guna π = 3.142).","prompt":"Berapakah jejari j (dalam cm) bagi bulatan tersebut?","options":["5.00 cm","19.47 cm","3.21 cm","12.50 cm"],"correctIndex":0,"proofLabId":"addm51_arc_segment_lab","proofState":{"j":5,"theta":5},"explanation":"Sudut major ∠EOF = 2(3.142) - 1.284 = 6.284 - 1.284 = 5.00 rad. Maka j = s / θ = 25 / 5.00 = 5.00 cm.","examTip":"Elakkan perangkap membahagi 25 terus dengan 1.284! Sentiasa padankan lengkok major dengan sudut refleks (2π - θ_minor)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Soalan Semibulatan & Lontar Peluru","voiceCaption":"Hitung perimeter kawasan lontaran peluru ABQP apabila OA = 2 m, AP = 8 m dan sudut AOB = 50°.","voiceScript":"[confident] Mari cuba Contoh enam buku teks! Kawasan lontar peluru A B Q P dibentuk oleh dua sektor berpusat O dengan sudut lima puluh darjah, O A dua meter dan A P lapan meter. Hitung jumlah perimeter kawasan A B Q P.","prompt":"Berdasarkan Contoh 6 (kawasan lontar peluru ABQP dengan ∠AOB = 50°, OA = 2 m, AP = 8 m, π = 3.142), berapakah perimeter kawasan berlorek ABQP?","options":["26.48 m","10.48 m","18.48 m","24.73 m"],"correctIndex":0,"explanation":"50° = 0.873 rad. Lengkok AB = 2(0.873) = 1.746 m; jejari besar OP = 2 + 8 = 10 m, jadi lengkok PQ = 10(0.873) = 8.73 m. Perimeter ABQP = 1.746 + 8 + 8.73 + 8 = 26.48 m."}]},{"id":"addm51-u3","title":"Unit 3: Perimeter Tembereng & Petua Kosinus / Sinus","subtitle":"Subtopik 1.2 (Bhg. B) — Panjang Perentas (Petua Kosinus vs Trigonometri 2j sin(θ/2)) & Perimeter Tembereng ABC","iconType":"scale","iconUrl":"../assets/icons/addm51-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Perimeter Tembereng Bulatan","voiceCaption":"Perimeter tembereng ialah hasil tambah panjang lengkok melengkung dengan panjang perentas lurus yang menyambungkan dua hujungnya.","voiceScript":"[warm] Apakah beza sektor dan tembereng? Sektor dibatasi oleh dua jejari dan satu lengkok, manakala tembereng ialah kawasan antara satu lengkok dengan satu garis lurus perentas! Jadi untuk mencari perimeter tembereng A B C, kita tambah panjang lengkok s sama dengan j theta dengan panjang perentas lurus A C. Panjang perentas A C boleh dicari dengan dua cara: Petua Kosinus atau dua j sin theta per dua!","title":"Menentukan Panjang Perentas & Perimeter Tembereng","acronym":"s + AC","hook":"Perimeter tembereng hanyalah dua sempadan: lengkok melengkung s = jθ ditambah garis lurus perentas AC!","mediaKey":"addm51_arc_segment","summary":"Perimeter tembereng bulatan diperoleh dengan menjumlahkan panjang lengkok s = jθ dan panjang perentas AC yang dihitung melalui Petua Kosinus atau trigonometri segi tiga bersudut tegak.","bullets":["Kaedah 1 (Petua Kosinus): Dalam ΔAOC dengan OA = OC = j, AC = √(j² + j² - 2j² kos θ). Contoh 5 (j = 10 cm, θ = 114° = 1.990 rad): AC = √(200 - 200 kos 114°) = 16.77 cm.","Kaedah 2 (Garis Serenjang OD membahagi dua perentas): ∠COD = θ/2 = 57°, maka AC = 2j sin(θ/2) = 2(10) sin 57° = 16.77 cm. Perimeter tembereng = 19.90 + 16.77 = 36.67 cm."],"labId":"addm51_arc_segment_lab","labTitle":"Kalkulator Perentas & Perimeter Tembereng (Contoh 5)","labProps":{"j":10,"theta":1.99},"formula":"Perimeter Tembereng = jθ + √(2j² - 2j² kos θ)   =   jθ + 2j sin(θ / 2)","examTip":"Awas mod kalkulator! Apabila mengira kos 114° atau sin 57° pastikan kalkulator dalam mod DEG, atau tukar ke mod RAD jika memasukkan nilai radian."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Panjang Perentas","voiceCaption":"Bagi bulatan berjejari 10 cm dengan sudut pusat 114°, semak panjang perentas AC dan perimeter tembereng ABC.","voiceScript":"[curious] Gunakan Contoh lima tadi! Jika sebuah rim basikal berjejari sepuluh sentimeter mempunyai perentas A C yang mencangkum sudut seratus empat belas darjah di pusat O, berapakah perimeter tembereng A B C?","hook":"Sahkan nilai j = 10 dan θ = 1.99 rad dalam Makmal Tembereng!","scenario":"Bulatan berjejari j = 10 cm dan ∠AOC = 114° (bersamaan 1.990 rad).","prompt":"Berapakah perimeter tembereng berlorek ABC (dalam cm)?","options":["36.67 cm","19.90 cm","39.90 cm","16.77 cm"],"correctIndex":0,"proofLabId":"addm51_arc_segment_lab","proofState":{"j":10,"theta":1.99},"explanation":"Panjang lengkok s = 10 × 1.990 = 19.90 cm. Panjang perentas AC = 2(10) sin 57° = 16.77 cm. Maka perimeter tembereng = 19.90 + 16.77 = 36.67 cm (berbeza dengan perimeter sektor 2j + s = 39.90 cm)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Langkah Cari Perentas","voiceCaption":"Susun turutan langkah mencari perimeter tembereng apabila sudut diberi dalam radian.","voiceScript":"[confident] Susun turutan kerja yang paling sistematik untuk mencari perimeter suatu tembereng bulatan.","prompt":"Susun langkah penyelesaian perimeter tembereng secara berturutan:","answerTokens":["Hitung panjang lengkok s = jθ","Tukar θ kepada darjah jika perlu","Cari panjang perentas dengan Petua Kosinus","Tambah panjang lengkok dan perentas"],"distractors":["Tambah dua kali jejari bulatan","Tolak luas segi tiga daripada sektor"],"explanation":"Perimeter tembereng hanya menjumlahkan lengkok s = jθ dan perentas AC; jangan tambahkan 2j kerana jejari bukan sempadan tembereng."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Sektor & Tangen","voiceCaption":"Tangen di titik M dan N pada bulatan berjejari 10 cm bertemu di P dengan ∠MON = 51°; cari perimeter kawasan berlorek MPN.","voiceScript":"[confident] Ini soalan latihan formatif yang amat popular dalam S P M! Dua tangen dari titik M dan N pada bulatan berjejari sepuluh sentimeter bertemu di luar pada titik P, membentuk sudut M O N lima puluh satu darjah. Ingat bahawa tangen sentiasa berserenjang sembilan puluh darjah dengan jejari!","prompt":"Latihan Formatif 1.2(5): Bulatan berpusat O dan jejari 10 cm mempunyai tangen di M dan N yang bertemu di P dengan ∠MON = 51°. Cari perimeter kawasan berlorek MPN (dalam cm). [Guna π = 3.142]","options":["18.44 cm","8.90 cm","14.37 cm","28.90 cm"],"correctIndex":0,"explanation":"51° = 0.8902 rad, jadi lengkok MN = 10 × 0.8902 = 8.902 cm. Garis OP membahagi dua ∠MON menjadi 25.5°. Dalam ΔOMP bersudut tegak di M, PM = 10 tan 25.5° = 4.770 cm (dan PN = 4.770 cm). Perimeter berlorek MPN = 8.902 + 2(4.770) = 18.44 cm."}]},{"id":"addm51-u4","title":"Unit 4: Luas Sektor & Luas Tembereng (Rumus Heron)","subtitle":"Subtopik 1.3 — Rumus L = ½j²θ = ½js, Sektor Major, Luas Tembereng (½j²θ − ½j² sin θ) & Rumus Heron","iconType":"book","iconUrl":"../assets/icons/addm51-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Rumus Luas Sektor & ½js","voiceCaption":"Luas sektor bulatan berjejari j dan bersudut θ radian diberi oleh L = ½j²θ atau L = ½js.","voiceScript":"[warm] Sekarang kita ke Subtopik satu perpuluhan tiga, Luas Sektor Suatu Bulatan! Apabila sepotong piza membentuk sudut theta radian, nisbah luas sektor terhadap luas bulatan pi j kuasa dua sama dengan nisbah theta terhadap dua pi. Maka pi terhapus, meninggalkan rumus L sama dengan setengah j kuasa dua theta! Dan kerana s sama dengan j theta, kita juga ada rumus pintas L sama dengan setengah j s apabila panjang lengkok sudah diketahui!","title":"1.3 Rumus Luas Sektor (L = ½j²θ = ½js) & Sektor Major","acronym":"L = ½j²θ = ½js","hook":"Jika soalan memberi jejari dan panjang lengkok tanpa sudut θ, gunakan terus rumus pintas L = ½js!","mediaKey":"addm51_ferris_sector","summary":"Luas sektor bulatan yang mencangkum sudut θ radian di pusat ialah L = ½j²θ, dan boleh ditulis sebagai L = ½js apabila panjang lengkok s diketahui.","bullets":["Terbitan Rumus: L / (πj²) = θ / (2π) memberikan L = ½j²θ. Menggantikan s = jθ menghasilkan bentuk kedua L = ½js (sangat pantas jika j dan s diberi, contohnya sektor berjejari 5 cm dan perimeter 16 cm mempunyai s = 16 - 10 = 6 cm, lalu L = ½(5)(6) = 15 cm²).","Sektor Major (Contoh 7c): Jika sudut minor ialah 124°, sudut refleks sektor major ialah (360° - 124°) × (3.142/180°) = 4.12 rad, maka L_major = ½(10)²(4.12) = 206 cm²."],"labId":"addm51_sector_area_lab","labTitle":"Kalkulator Luas Sektor, Tembereng & Rumus Heron","labProps":{"j":6,"theta":2.2,"mode":"sektor"},"formula":"L = ½ j² θ   =   ½ j s   (θ dalam radian)","examTip":"Hafal hubungan perimeter sektor P = 2j + s bersama L = ½js; gabungan dua persamaan ini kerap diuji dalam soalan Kertas 2!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Luas Sektor dari Perimeter","voiceCaption":"Suatu sektor berjejari 5 cm mempunyai perimeter 16 cm; ramalkan luas sektor tersebut.","voiceScript":"[curious] Cuba selesaikan Latihan Kendiri satu perpuluhan lima soalan dua tanpa menggunakan nilai theta dahulu! Sebuah sektor bulatan berjejari lima sentimeter mempunyai perimeter enam belas sentimeter. Berapakah luas sektor itu?","hook":"Ingat: perimeter sektor ialah dua jejari campur satu lengkok!","scenario":"Sektor bulatan mempunyai jejari j = 5 cm dan jumlah perimeter sektor ialah 16 cm.","prompt":"Berapakah luas sektor (dalam cm²) tersebut?","options":["15 cm²","30 cm²","12.5 cm²","40 cm²"],"correctIndex":0,"proofLabId":"addm51_sector_area_lab","proofState":{"j":5,"theta":1.2,"mode":"sektor"},"explanation":"Perimeter = 2j + s = 16 -> 2(5) + s = 16 -> s = 6 cm. Menggunakan L = ½js = ½(5)(6) = 15 cm² (atau θ = 6/5 = 1.2 rad, L = ½(25)(1.2) = 15 cm²)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Luas Tembereng & Rumus Heron","voiceCaption":"Luas tembereng minor ialah Luas Sektor tolak Luas Segi Tiga, yang boleh dihitung dengan ½ab sin C atau Rumus Heron.","voiceScript":"[confident] Bagaimana pula untuk mencari luas tembereng minor seperti renda alas meja bulat? Tolakkan luas segi tiga daripada luas sektor! Terdapat dua cara mencari luas segi tiga P O Q: pertama, setengah j kuasa dua sin sudut P O Q dalam darjah; kedua, jika panjang ketiga-tiga sisi segi tiga diketahui, gunakan Rumus Heron: punca kuasa dua s darab s tolak a darab s tolak b darab s tolak c, dengan s ialah semiperimeter!","title":"Luas Tembereng: ½ab sin C vs Rumus Heron","acronym":"Sektor − Δ • Heron","hook":"Dua senjata mencari luas segi tiga di dalam sektor: ½j² sin θ jika sudut diberi, atau Rumus Heron jika tiga sisi diberi!","mediaKey":"addm51_ferris_sector","summary":"Luas tembereng minor ialah hasil tolak luas sektor dengan luas segi tiga sama kaki di pusat, sama ada menggunakan L_Δ = ½j² sin θ atau Rumus Heron.","bullets":["Kaedah Trigonometri (Contoh 9a, j = 6 cm, θ = 2.2 rad = 126° 2'): L_sektor = ½(6)²(2.2) = 39.60 cm²; L_Δ = ½(6)(6) sin 126° 2' = 14.56 cm². Luas tembereng = 39.60 - 14.56 = 25.04 cm².","Kaedah Rumus Heron (Contoh 9b, sisi 3.5 cm, 3.5 cm, perentas 4 cm): Semiperimeter s = (3.5 + 3.5 + 4)/2 = 5.5 cm. Luas Δ = √[5.5(5.5-3.5)(5.5-3.5)(5.5-4)] = √33 = 5.745 cm². Luas tembereng = 7.454 - 5.745 = 1.709 cm²."],"labId":"addm51_sector_area_lab","labTitle":"Banding Luas Tembereng vs Rumus Heron","labProps":{"j":6,"theta":2.2,"mode":"heron"},"formula":"L_tembereng = ½j²(θ − sin θ)   |   Heron: L_Δ = √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2","examTip":"Rumus pintas L_tembereng = ½j²(θ - sin θ) sangat cepat! Cuma pastikan θ pertama dalam RADIAN, dan sin θ dikira menggunakan nilai radian (atau tukar ke darjah)."},{"type":"match","xp":15,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Rumus Sukatan Membulat","voiceCaption":"Padankan setiap kuantiti geometri bulatan dengan rumus tepat yang sepadan dengannya.","voiceScript":"[warm] Padankan kelima-lima kuantiti bulatan ini dengan rumus tepat masing-masing!","prompt":"Padankan setiap kuantiti geometri dengan rumus tepatnya (θ dalam radian):","pairs":[{"id":"m1","left":"Panjang lengkok sektor","right":"jθ"},{"id":"m2","left":"Perimeter sektor","right":"2j + jθ"},{"id":"m3","left":"Luas sektor (guna j dan s)","right":"½js"},{"id":"m4","left":"Luas tembereng minor","right":"½j²(θ − sin θ)"},{"id":"m5","left":"Semiperimeter Rumus Heron","right":"(a + b + c) / 2"}],"explanation":"Panjang lengkok = jθ, perimeter sektor = 2j + s, luas sektor = ½j²θ = ½js, luas tembereng minor = ½j²θ - ½j² sin θ, dan semiperimeter s = (a+b+c)/2."}]},{"id":"addm51-u5","title":"Unit 5: Aplikasi Sukatan Membulat (Terowong, Kipas & Kon)","subtitle":"Subtopik 1.4 — Keratan Terowong Tembereng Major, Kipas Kertas, Kon Dibuka Menjadi Sektor & Silinder Air","iconType":"map","iconUrl":"../assets/icons/addm51-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Aplikasi Terowong & Kipas","voiceCaption":"Untuk keratan terowong berbentuk tembereng major, luasnya ialah Luas Sektor Major DITAMBAH Luas Segi Tiga AOC.","voiceScript":"[warm] Subtopik satu perpuluhan empat menguji kebolehan kita menggabungkan semua rumus tadi dalam masalah kejuruteraan dan reka bentuk! Perhatikan Contoh sebelas: sebuah terowong kereta api mempunyai keratan rentas berbentuk tembereng major berjejari empat meter dengan sudut minor satu perpuluhan lapan radian. Untuk mencari luas keratan rentas terowong, kita guna sudut refleks empat perpuluhan empat lapan empat radian bagi sektor major, lalu TAMBAHKAN dengan luas segi tiga A O C!","title":"1.4 Aplikasi: Tembereng Major, Kon Berongga & Paip Air","acronym":"Major = Sektor + Δ","hook":"Tembereng minor menolak luas segi tiga, tetapi tembereng major MENAMBAH luas segi tiga kepada sektor major!","mediaKey":"addm51_ferris_sector","summary":"Aplikasi kehidupan harian melibatkan tembereng major (sektor major + segi tiga), beza dua sektor sepusat (kipas kertas), serta hubungan bentangan kon menjadi sektor bulatan.","bullets":["Terowong Tembereng Major (Contoh 11, j = 4 m, θ_minor = 1.8 rad): Sudut refleks = 2π - 1.8 = 4.484 rad. Panjang lengkok major = 4(4.484) = 17.94 m. Luas terowong = Luas sektor major (35.87 m²) + Luas ΔAOC (7.791 m²) = 43.66 m².","Kon Menjadi Sektor (Formatif 1.3 Q3): Apabila kon berongga berjejari tapak r dan tinggi t dibuka menjadi sektor POQ, jejari sektor J = tinggi sendeng kon √(r² + t²) dan panjang lengkok sektor = lilitan tapak kon 2πr, maka θ = 2πr / J."],"labId":"addm51_aplikasi_terowong_lab","labTitle":"Simulator Aplikasi Terowong, Kipas & Tangki","labProps":{"tab":"terowong"},"formula":"L_tembereng_major = ½j²(2π − θ) + ½j² sin θ   |   Bentangan Kon: Jθ = 2πr","examTip":"Untuk soalan kipas kertas (Contoh 10) atau pelari trek, ingat bahawa sudut θ yang sama dikongsi oleh sektor luar dan sektor dalam yang sepusat!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Ramal Sudut Bentangan Kon","voiceCaption":"Sebuah kon berongga berjejari 3 cm dan tinggi 4 cm dibuka menjadi sektor POQ; ramalkan sudut θ dalam radian.","voiceScript":"[curious] Cuba fikirkan masalah bentangan kon ini! Sebuah kon berongga mempunyai jejari tapak tiga sentimeter dan tinggi menegak empat sentimeter. Apabila kon itu dibuka rata menjadi sektor P O Q, berapakah sudut theta dalam radian?","hook":"Gunakan Teorem Pythagoras untuk mencari tinggi sendeng kon sebagai jejari sektor POQ!","scenario":"Kon berongga berjejari tapak r = 3 cm dan tinggi t = 4 cm dibentangkan menjadi sektor POQ berjejari J dan bersudut θ rad (π = 3.142).","prompt":"Berapakah nilai sudut θ (dalam radian) bagi sektor POQ tersebut?","options":["3.770 rad","4.713 rad","1.885 rad","2.357 rad"],"correctIndex":0,"proofLabId":"addm51_aplikasi_terowong_lab","proofState":{"tab":"silinder"},"explanation":"Jejari sektor J = tinggi sendeng kon = √(3² + 4²) = 5 cm. Panjang lengkok PQ = lilitan tapak kon = 2πr = 2(3.142)(3) = 18.852 cm. Oleh itu θ = s / J = 18.852 / 5 = 3.770 rad."},{"type":"sort","xp":20,"voiceIdKey":"u5-s3","voiceToneLabel":"Isih Operasi Luas Komposit","voiceCaption":"Kelaskan situasi bentuk geometri berikut sama ada operasinya menambah luas segi tiga atau menolak luas segi tiga/sektor dalam.","voiceScript":"[confident] Semasa melukis pelan penyelesaian Kertas dua, pastikan kamu tahu bila perlu menambah dan bila perlu menolak luas!","prompt":"Isihkan kaedah pengiraan luas yang tepat bagi setiap bentuk geometri komposit berikut:","buckets":[{"id":"tambah","label":"Sektor + Segi Tiga"},{"id":"tolak","label":"Sektor Besar − (Segi Tiga / Sektor Kecil)"}],"items":[{"text":"Keratan rentas terowong berbentuk tembereng major (θ_minor < π)","bucketId":"tambah","note":"Luas tembereng major = Luas sektor major + Luas segi tiga AOC."},{"text":"Renda alas meja berbentuk tembereng minor di luar heksagon","bucketId":"tolak","note":"Luas tembereng minor = Luas sektor minor - Luas segi tiga."},{"text":"Bahagian kertas kipas PQNM antara jejari dalam 6 cm dan jejari luar 15 cm","bucketId":"tolak","note":"Tolak luas sektor dalam MON daripada luas sektor luar POQ."},{"text":"Keratan rentas kayu terapung di atas air (paras air di bawah pusat bulatan)","bucketId":"tambah","note":"Keratan di atas paras air berbentuk tembereng major, jadi sektor major + segi tiga."}],"explanation":"Tembereng major sentiasa lebih besar daripada semibulatan dan melibatkan sektor major ditambah segi tiga; tembereng minor dan cincin sektor pula menggunakan penolakan."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Uji Silinder Air Mengufuk","voiceCaption":"Bekas separuh silinder mengufuk panjang 200 cm dan jejari 35 cm diisi air sehingga paras PQ mencangkum 118° di pusat O; kira isi padu air.","voiceScript":"[confident] Ini soalan aras T P lima daripada Latihan Sumatif! Air diisi ke dalam bekas separuh silinder sepanjang dua ratus sentimeter dengan jejari tiga puluh lima sentimeter sehingga sudut di pusat ialah seratus lapan belas darjah. Kira luas tembereng keratan rentas dan tukar isi padunya kepada liter!","prompt":"Sebuah bekas separuh silinder mengufuk sepanjang 200 cm dan berjejari 35 cm diisi air sehingga permukaan air PQ mencangkum sudut 118° pada pusat O. Hitung isi padu air di dalam bekas itu dalam liter. [Guna π = 3.142]","options":["144.2 liter","252.4 liter","108.2 liter","72.1 liter"],"correctIndex":0,"explanation":"118° = 2.060 rad. Luas sektor = ½(35)²(2.060) = 1261.75 cm²; Luas ΔPOQ = ½(35)² sin 118° = 540.91 cm². Luas tembereng air = 1261.75 - 540.91 = 720.84 cm². Isi padu = 720.84 × 200 = 144 168 cm³ = 144.2 liter."}]},{"id":"addm51-u6","title":"Unit 6 (Boss SPM): Cabaran Ketua Arkitek Sukatan Membulat","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Persamaan Serentak Sektor, 4 Tin Diikat Tali, Bulatan Terterap & Semibulatan Bersudut Tegak","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Persamaan Serentak Sektor","voiceCaption":"Suatu sektor MON mempunyai perimeter 18 cm dan luas 8 cm²; cari nilai j dan θ yang mungkin.","voiceScript":"[excited] Selamat datang ke Peringkat Boss S P M Sukatan Membulat! Soalan pertama menggabungkan perimeter dan luas dalam bentuk persamaan serentak! Sektor M O N mempunyai perimeter lapan belas sentimeter dan luas lapan sentimeter persegi. Cari pasangan jejari j dan sudut theta yang mungkin!","prompt":"Latihan Sumatif Q4: Sektor MON berjejari j cm dan bersudut θ rad mempunyai perimeter 18 cm dan luas 8 cm². Cari pasangan nilai (j, θ) yang memenuhi keadaan tersebut:","options":["j = 8 cm, θ = 0.25 rad atau j = 1 cm, θ = 16 rad (tidak sah kerana > 2π)","j = 4 cm, θ = 1.0 rad","j = 6 cm, θ = 0.5 rad","j = 2 cm, θ = 4.0 rad"],"correctIndex":0,"explanation":"2j + jθ = 18 dan ½j²θ = 8 -> jθ = 16/j. Gantikan: 2j + 16/j = 18 -> j² - 9j + 8 = 0 -> (j - 8)(j - 1) = 0. Jika j = 8, θ = 16/64 = 0.25 rad; jika j = 1, θ = 16 rad (> 2π, maka θ yang sah untuk satu bulatan ialah j = 8 cm, θ = 0.25 rad)."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Ikat 4 Tin Silinder","voiceCaption":"Empat tin minuman silinder berjejari 5.5 cm diikat rapat dengan seutas tali; ramalkan panjang tali tersebut.","voiceScript":"[curious] Cabaran Boss kedua daripada Latihan Sumatif soalan lima belas! Empat buah tin minuman berbentuk silinder berjejari lima perpuluhan lima sentimeter diikat rapat dalam susunan segi empat sama. Berapakah jumlah panjang tali yang mengelilinginya?","hook":"Pecahkan laluan tali kepada 4 bahagian lurus dan 4 lengkok sukuan di setiap bucu!","scenario":"Empat tin silinder sama saiz (jejari j = 5.5 cm) disusun bersentuhan membentuk susunan 2 × 2 lalu diikat ketat dengan seutas tali.","prompt":"Berapakah panjang tali (dalam cm) yang diperlukan untuk mengikat keempat-empat tin tersebut? [Guna π = 3.142]","options":["78.56 cm","44.00 cm","34.56 cm","67.56 cm"],"correctIndex":0,"proofLabId":"addm51_radian_converter_lab","proofState":{"rad":6.284,"j":5.5},"explanation":"4 bahagian lurus antara pusat tin = 4 × (2j) = 4 × 11 = 44 cm. 4 lengkok sukuan di empat penjuru bergabung menjadi tepat 1 lilitan bulatan penuh = 2πj = 2(3.142)(5.5) = 34.562 cm. Jumlah = 44 + 34.562 = 78.56 cm."},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Turutan Bulatan Terterap","voiceCaption":"Susun langkah menyelesaikan masalah bulatan kecil terterap di dalam sebuah sektor yang diapit dua tangen.","voiceScript":"[confident] Untuk soalan KBAT bulatan terterap di dalam sektor, susun strategi penyelesaiannya daripada langkah pertama hingga akhir!","prompt":"Susun strategi menyelesaikan masalah bulatan berpusat O terterap di dalam sektor PQR berpusat P (Latihan Sumatif Q13):","answerTokens":["Bina segi tiga tegak PAO dengan sudut ∠PAO = 90°","Cari jarak PO menggunakan nisbah sin θ/2","Tentukan jejari sektor besar R = PO + jejari bulatan kecil","Tolak luas bulatan penuh daripada luas sektor PQR"],"distractors":["Anggap jejari bulatan kecil sama dengan jejari sektor","Tambah luas bulatan kepada luas sektor PQR"],"explanation":"Jejari sektor PQR ialah jarak dari P melalui pusat bulatan kecil O hingga lilitan, iaitu PO + r. Kemudian kawasan berlorek = L_sektor - L_bulatan."},{"type":"match","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Padan Nilai Piawai Bab 1","voiceCaption":"Padankan lima masalah klasik Sukatan Membulat dengan jawapan tepat masing-masing.","voiceScript":"[confident] Uji ketangkasan kamu memadankan nilai bagi lima soalan piawai daripada buku teks Bab satu!","prompt":"Padankan setiap situasi dengan nilai jawapan tepatnya (π = 3.142):","pairs":[{"id":"b1","left":"2/5 π rad dalam darjah","right":"72°"},{"id":"b2","left":"Lengkok j = 5 cm, θ = 0.9 rad","right":"4.5 cm"},{"id":"b3","left":"Luas sektor j = 12 cm, θ = 1.7 rad","right":"122.4 cm²"},{"id":"b4","left":"Luas Δ bagi sisi 3.5, 3.5, 4 cm","right":"5.745 cm²"},{"id":"b5","left":"Sudut refleks jika minor = 1.8 rad","right":"4.484 rad"}],"explanation":"Semua nilai padan terus dengan Contoh 1(a), 3(a), 7(a), 9(b) dan 11(b) dalam Buku Teks KSSM."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss Final: Taman Semibulatan & Pokok Bunga","voiceCaption":"Selesaikan soalan akhir Latihan Sumatif Q14 tentang taman sektor AOB berluas 243 m² dan semibulatan bunga ACB.","voiceScript":"[excited] Soalan terakhir Boss S P M! Sektor berumput A O B berjejari lapan belas meter mempunyai luas dua ratus empat puluh tiga meter persegi, dan di atas perentas A B dibina taman bunga berbentuk semibulatan A C B. Hitung panjang pagar lengkok semibulatan A C B!","prompt":"Latihan Sumatif Q14: AOB ialah sektor bulatan berjejari 18 m dengan luas 243 m². ACB ialah sebuah semibulatan berdiameter AB. Hitung panjang pagar lengkok semibulatan ACB (dalam m). [Guna π = 3.142]","options":["38.55 m","24.54 m","27.00 m","77.10 m"],"correctIndex":0,"explanation":"Luas sektor AOB: ½(18)²θ = 243 -> 162θ = 243 -> θ = 1.5 rad (85.932°). Panjang perentas AB (diameter semibulatan) = 2(18) sin(42.966°) = 24.54 m, maka jejari semibulatan = 12.27 m. Panjang pagar lengkok ACB = πr = 3.142 × 12.27 = 38.55 m (jumlah perimeter taman = 27.00 + 38.55 = 65.55 m)."}]}]};</script>

(function () {
  "use strict";

  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function fmt(v, dp) {
    if (!isFinite(v)) return "-";
    var d = typeof dp === "number" ? dp : 3;
    var s = Number(v).toFixed(d);
    if (d > 0) s = s.replace(/\.?0+$/, "");
    return s === "-0" ? "0" : s;
  }

  function playSfx(kind) {
    if (!window.NotaAudio) return;
    if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {
      window.NotaAudio.playSnap();
    } else if (kind === "match" && typeof window.NotaAudio.playMatch === "function") {
      window.NotaAudio.playMatch();
    } else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") {
      window.NotaAudio.playPaperRustle();
    } else if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") {
      window.NotaAudio.playTypewriterTick();
    } else if (typeof window.NotaAudio.playTap === "function") {
      window.NotaAudio.playTap();
    }
  }

  function syncSliderCss(sl, txt) {
    if (!sl) return;
    sl.style.setProperty("--attr-min", sl.min || "0");
    sl.style.setProperty("--attr-max", sl.max || "10");
    sl.style.setProperty("--control-value", sl.value);
    if (txt) sl.setAttribute("aria-valuetext", txt);
  }

  function ensureScopedStyles() {

    document.head.appendChild(st);

  function renderArchivalGallery(keys, headLabel) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) {
      return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null;
    }).filter(Boolean);
    if (!items.length) return "";
    var cards = items.map(function (it, idx) {
      var r = it.rec;
      var src = r.dataUri || r.src || "";
      var prioAttr = idx === 0 ? ' fetchpriority="high"' : ' loading="lazy"';
      return (
        '<button type="button" class="archival-plate-btn" data-addm51-plate="' + esc(it.key) + '">' +

  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
