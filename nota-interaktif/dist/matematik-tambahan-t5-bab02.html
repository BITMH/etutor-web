            '<label class="lab-slider-group">' +
              '<span class="lab-slider-label"><span>Tokokan kecil δx</span><span class="tabular-nums">' + fmt(dx, 3) + "</span></span>" +
              '<input id="addm52DxRange" class="lab-range" type="range" min="0.005" max="1.2" step="0.005" value="' + fmt(dx, 3) + '">' +
            "</label>" +
          "</div>";
      } else {
        bodyHtml =
          '<div class="addm52-panel">' +
            "<h4>Menilai Had Bentuk Tak Tentu 0/0 (Subtopik 2.1)</h4>" +
            '<div class="addm52-step-box" style="margin-bottom:8px;">' +
              "<div><strong>Kes A (Pemfaktoran):</strong> had (x -> 1) [(x^2 - 1)/(x - 1)]</div>" +
              "<div>  Ganti terus: (1 - 1)/(1 - 1) = 0/0 (tak tentu)</div>" +
              "<div>  Faktor: (x + 1)(x - 1)/(x - 1) = x + 1 -> ganti x=1 -> 2</div>" +
              '<div style="margin-top:8px;"><strong>Kes B (Darab Konjugat):</strong> had (x -> 0) [(sqrt(x + 1) - 1) / x]</div>' +
              "<div>  Darab konjugat (sqrt(x + 1) + 1) / (sqrt(x + 1) + 1)</div>" +
              "<div>  Pengangka = (x + 1) - 1 = x; hapus faktor x -> 1 / (sqrt(0 + 1) + 1) = 1/2</div>" +
            "</div>" +
            '<div class="lab-callout"><strong>Tip SPM:</strong> Jangan tinggalkan jawapan 0/0! Hapuskan dahulu faktor sifar melalui pemfaktoran atau pendaraban konjugat.</div>' +
          "</div>";
      }

      shell.innerHTML =
        '<div class="lab-header-row">' +
          '<span class="lab-title-pill">Makmal Had Fungsi &amp; Prinsip Pertama Pembezaan</span>' +
          '<span class="lab-arcade-score tabular-nums">' + (tab === "prinsip" ? "δy/δx = " + fmt(slope, 3) : "Teknik 0/0") + "</span>" +
        "</div>" +
        '<div class="addm52-row" style="margin-bottom:8px;">' +
          '<button type="button" class="addm52-btn" data-lim-tab="prinsip" aria-pressed="' + (tab === "prinsip" ? "true" : "false") + '">Prinsip Pertama (δx -> 0)</button>' +
          '<button type="button" class="addm52-btn" data-lim-tab="had" aria-pressed="' + (tab === "had" ? "true" : "false") + '">Had Tak Tentu 0/0</button>' +
        "</div>" +
        bodyHtml +
        renderArchivalGallery(["addm52_limits_tangent"], "Rajah Rujukan Subtopik 2.1");

      var dxSl = shell.querySelector("#addm52DxRange");
      if (dxSl) {
        syncSliderCss(dxSl, fmt(dx, 3));
        dxSl.addEventListener("input", function () {
          dx = Number(dxSl.value);
          playSfx("tick");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      }
      shell.querySelectorAll("[data-lim-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          tab = btn.getAttribute("data-lim-tab");
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });
      bindArchivalGallery(shell, ctx);
    }

    render();
  };

  /* =========================================================================
     MAKMAL 2: addm52_rules_workbench_lab
     Meja Kerja Petua Pembezaan: Kuasa, Rantai, Hasil Darab, Hasil Bahagi
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.addm52_rules_workbench_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var rule = ps.rule || "rantai";

    var rules = {
      kuasa: {
        btn: "Rumus Kuasa ax^n",
        title: "Pembezaan Fungsi Algebra: d/dx (ax^n) = a n x^(n-1)",
        fnLabel: "y = (2x + 1)(x - 1) / x",
        steps: [
          "1. Kembangkan & tukar ke bentuk indeks: y = (2x^2 - x - 1)/x = 2x - 1 - x^(-1)",
          "2. Bezakan sebutan demi sebutan: dy/dx = 2(1) - 0 - (-1)x^(-2)",
          "3. Permudahkan: dy/dx = 2 + 1/x^2"
        ],
        tip: "Sentiasa tukar punca kuasa sqrt(x) -> x^(1/2) dan 1/x^n -> x^(-n) sebelum membezakan!"
      },
      rantai: {
        btn: "Petua Rantai (u^n)",
        title: "Terbitan Pertama Fungsi Gubahan: dy/dx = (dy/du) x (du/dx)",
        fnLabel: "y = (3x^2 - 4x)^7",
        steps: [
          "1. Biarkan u = 3x^2 - 4x, maka y = u^7",
          "2. du/dx = 6x - 4  dan  dy/du = 7u^6",
          "3. dy/dx = 7u^6 (6x - 4) = 14(3x - 2)(3x^2 - 4x)^6"
        ],
        tip: "Cara pantas: bawa kuasa ke depan, tolak 1 pada kuasa, dan DARAB terbitan ungkapan di dalam kurungan."
      },
      darab: {
        btn: "Hasil Darab (uv)",
        title: "Petua Hasil Darab: d/dx (uv) = u(dv/dx) + v(du/dx)",
        fnLabel: "y = (3x + 2) sqrt(4x - 1)",
        steps: [
          "1. u = 3x + 2 -> du/dx = 3",
          "2. v = (4x - 1)^(1/2) -> dv/dx = 1/2 (4x - 1)^(-1/2) x 4 = 2 / sqrt(4x - 1)",
          "3. dy/dx = (3x + 2)(2 / sqrt(4x - 1)) + 3 sqrt(4x - 1)",
          "4. Samakan penyebut: [2(3x + 2) + 3(4x - 1)] / sqrt(4x - 1) = (18x + 1) / sqrt(4x - 1)"
        ],
        tip: "Faktorkan kuasa terendah atau samakan penyebut punca kuasa supaya bentuk akhir kemas."
      },
      bahagi: {
        btn: "Hasil Bahagi (u/v)",
        title: "Petua Hasil Bahagi: d/dx (u/v) = [v(du/dx) - u(dv/dx)] / v^2",
        fnLabel: "y = (2x + 1) / (x^2 - 3)",
        steps: [
          "1. u = 2x + 1 -> du/dx = 2  |  v = x^2 - 3 -> dv/dx = 2x",
          "2. dy/dx = [(x^2 - 3)(2) - (2x + 1)(2x)] / (x^2 - 3)^2",
          "3. Permudahkan pengangka: (2x^2 - 6 - 4x^2 - 2x) / (x^2 - 3)^2",
          "4. dy/dx = -2(x^2 + x + 3) / (x^2 - 3)^2"
        ],
        tip: "Jaga tertib penolakan: sentiasa MULAKAN pengangka dengan v(du/dx) dahulu, BUKAN u(dv/dx)!"
      }
    };

    function render() {
      var r = rules[rule] || rules.rantai;
      var btns = Object.keys(rules).map(function (k) {
        return '<button type="button" class="addm52-btn" data-rule="' + k + '" aria-pressed="' + (rule === k ? "true" : "false") + '">' + esc(rules[k].btn) + "</button>";
      }).join("");

      shell.innerHTML =
        '<div class="lab-header-row">' +
          '<span class="lab-title-pill">Meja Kerja 4 Petua Pembezaan (Subtopik 2.2)</span>' +
          '<span class="lab-arcade-score tabular-nums">' + esc(r.fnLabel) + "</span>" +
        "</div>" +
        '<div class="addm52-row" style="margin-bottom:8px;">' + btns + "</div>" +
        '<div class="addm52-panel">' +
          "<h4>" + esc(r.title) + "</h4>" +
          '<div class="addm52-step-box" style="margin-bottom:8px;">' +
            r.steps.map(function (s) { return "<div>" + esc(s) + "</div>"; }).join("") +
          "</div>" +
          '<div class="lab-callout"><strong>Tip SPM:</strong> ' + esc(r.tip) + "</div>" +
        "</div>";

      shell.querySelectorAll("[data-rule]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          rule = btn.getAttribute("data-rule");
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });
    }

    render();
  };

  /* =========================================================================
     MAKMAL 3: addm52_tangent_normal_turning_lab
     Kecerunan Tangen, Garis Normal, Titik Pusingan (Maks/Min) & Lengkok Balas
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.addm52_tangent_normal_turning_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var fnKey = ps.fnKey || "kubik";
    var xProbe = typeof ps.x === "number" ? ps.x : -1.0;

    var funcs = {
      kubik: {
        label: "y = x^3 - 3x^2 - 9x + 11",
        f: function (x) { return x * x * x - 3 * x * x - 9 * x + 11; },
        df: function (x) { return 3 * x * x - 6 * x - 9; },
        d2f: function (x) { return 6 * x - 6; },
        xMin: -2.6, xMax: 4.6, yMin: -22, yMax: 24,
        pts: [
          { x: -1, tag: "Maksimum (-1, 16)" },
          { x: 3, tag: "Minimum (3, -16)" }
        ]
      },
      quartik: {
        label: "y = x^4 - 4x^3 + 1",
        f: function (x) { return Math.pow(x, 4) - 4 * Math.pow(x, 3) + 1; },
        df: function (x) { return 4 * Math.pow(x, 3) - 12 * x * x; },
        d2f: function (x) { return 12 * x * x - 24 * x; },
        xMin: -1.4, xMax: 4.2, yMin: -32, yMax: 16,
        pts: [
          { x: 0, tag: "Lengkok Balas (0, 1)" },
          { x: 3, tag: "Minimum (3, -26)" }
        ]
      }
    };

    function render() {
      var fn = funcs[fnKey] || funcs.kubik;
      if (xProbe < fn.xMin) xProbe = fn.xMin;
      if (xProbe > fn.xMax) xProbe = fn.xMax;
      var yVal = fn.f(xProbe);
      var mTan = fn.df(xProbe);
      var d2 = fn.d2f(xProbe);
      var isStat = Math.abs(mTan) < 0.25;

      var statusText = "";
      if (isStat) {
        if (d2 < -0.1) statusText = "TITIK MAKSIMUM (dy/dx ≈ 0, d2y/dx2 < 0)";
        else if (d2 > 0.1) statusText = "TITIK MINIMUM (dy/dx ≈ 0, d2y/dx2 > 0)";
        else statusText = "TITIK LENGKOK BALAS (dy/dx = 0, d2y/dx2 = 0, tiada ubah tanda)";
      } else if (mTan > 0) {
        statusText = "Kecerunan POSITIF (lengkung menaik, condong ke kanan)";
      } else {
        statusText = "Kecerunan NEGATIF (lengkung menurun, condong ke kiri)";
      }

      function mx(x) { return 35 + ((x - fn.xMin) / (fn.xMax - fn.xMin)) * 255; }
      function my(y) { return 235 - ((y - fn.yMin) / (fn.yMax - fn.yMin)) * 205; }

      var pathPts = [];
      for (var xv = fn.xMin; xv <= fn.xMax; xv += 0.1) {
        var yv = fn.f(xv);
        if (yv >= fn.yMin - 8 && yv <= fn.yMax + 8) {
          pathPts.push(mx(xv).toFixed(1) + "," + my(yv).toFixed(1));
        }
      }

      var px = mx(xProbe), py = my(yVal);
      // Tangent segment in x-space
      var txA = xProbe - 0.9, txB = xProbe + 0.9;
      var tyA = yVal + mTan * (txA - xProbe), tyB = yVal + mTan * (txB - xProbe);
      // Normal line in pixel space (perpendicular visually or mathematically)
      var mNormText = Math.abs(mTan) < 0.05 ? "Mencancang (x = " + fmt(xProbe, 2) + ")" : fmt(-1 / mTan, 3);

      var yZero = my(0);
      var xZero = mx(0);

      var jumpBtns = fn.pts.map(function (pt) {
        return '<button type="button" class="addm52-btn" data-jump="' + pt.x + '">' + esc(pt.tag) + "</button>";
      }).join("");

      shell.innerHTML =
        '<div class="lab-header-row">' +
          '<span class="lab-title-pill">Simulator Tangen, Normal &amp; Titik Pusingan (Subtopik 2.3–2.4)</span>' +
          '<span class="lab-arcade-score tabular-nums">dy/dx = ' + fmt(mTan, 2) + "</span>" +
        "</div>" +
        '<div class="addm52-row" style="margin-bottom:8px;">' +
          '<button type="button" class="addm52-btn" data-fn="kubik" aria-pressed="' + (fnKey === "kubik" ? "true" : "false") + '">Kubik: x^3 - 3x^2 - 9x + 11</button>' +
          '<button type="button" class="addm52-btn" data-fn="quartik" aria-pressed="' + (fnKey === "quartik" ? "true" : "false") + '">Kuartik: x^4 - 4x^3 + 1</button>' +
          jumpBtns +
        "</div>" +
        '<div class="lab-stage">' +
          '<svg class="addm52-svg" viewBox="0 0 560 264" aria-label="Graf lengkung, tangen dan titik pusingan">' +
            '<line x1="28" y1="' + yZero.toFixed(1) + '" x2="295" y2="' + yZero.toFixed(1) + '" stroke="#475569" stroke-width="1.5"/>' +
            '<line x1="' + xZero.toFixed(1) + '" y1="22" x2="' + xZero.toFixed(1) + '" y2="244" stroke="#475569" stroke-width="1.5"/>' +
            '<polyline points="' + pathPts.join(" ") + '" fill="none" stroke="#38bdf8" stroke-width="4"/>' +
            '<line x1="' + mx(txA).toFixed(1) + '" y1="' + my(tyA).toFixed(1) + '" x2="' + mx(txB).toFixed(1) + '" y2="' + my(tyB).toFixed(1) + '" stroke="#fde047" stroke-width="3.2"/>' +
            '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="6" fill="#fde047" stroke="#ffffff" stroke-width="2"/>' +
            '<rect x="305" y="24" width="235" height="216" rx="14" fill="rgba(30,41,59,0.92)" stroke="#c084fc" stroke-width="1.8"/>' +
            '<text x="322" y="52" fill="#e9d5ff" font-size="12" font-weight="800">' + esc(fn.label) + '</text>' +
            '<text x="322" y="84" fill="#fde047" font-family="Consolas, monospace" font-size="14" font-weight="800">Titik: (' + fmt(xProbe, 2) + ', ' + fmt(yVal, 2) + ')</text>' +
            '<text x="322" y="114" fill="#34d399" font-family="Consolas, monospace" font-size="14" font-weight="800">m_tangen = ' + fmt(mTan, 2) + '</text>' +
            '<text x="322" y="144" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">m_normal = ' + esc(mNormText) + '</text>' +
            '<text x="322" y="176" fill="#f472b6" font-family="Consolas, monospace" font-size="14" font-weight="800">d2y/dx2 = ' + fmt(d2, 2) + '</text>' +
            '<text x="322" y="212" fill="#cbd5e1" font-size="11" font-weight="700">Ketik butang titik pusingan di atas!</text>' +
          "</svg>" +
        "</div>" +
        '<div class="lab-controls">' +
          '<label class="lab-slider-group">' +
            '<span class="lab-slider-label"><span>Gerak koordinat x</span><span class="tabular-nums">x = ' + fmt(xProbe, 2) + "</span></span>" +
            '<input id="addm52TurnX" class="lab-range" type="range" min="' + fn.xMin + '" max="' + fn.xMax + '" step="0.1" value="' + fmt(xProbe, 1) + '">' +
          "</label>" +
        "</div>" +
        '<div class="addm52-step-box">' + esc(statusText) + "</div>" +
        renderArchivalGallery(["addm52_rollercoaster_turning"], "Rajah Rujukan Subtopik 2.3 & 2.4");

      var xEl = shell.querySelector("#addm52TurnX");
      syncSliderCss(xEl, fmt(xProbe, 2));
      if (xEl) {
        xEl.addEventListener("input", function () {
          xProbe = Number(xEl.value);
          playSfx("tick");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      }
      shell.querySelectorAll("[data-fn]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          fnKey = btn.getAttribute("data-fn");
          xProbe = fnKey === "kubik" ? -1.0 : 0.0;
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });
      shell.querySelectorAll("[data-jump]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          xProbe = Number(btn.getAttribute("data-jump"));
          playSfx("match");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });
      bindArchivalGallery(shell, ctx);
    }

    render();
  };

  /* =========================================================================
     MAKMAL 4: addm52_rate_approx_lab
     Kadar Perubahan Terhubung (Kon/Sfera) & Penghampiran Kecil dy ≈ (dy/dx)dx
     ========================================================================= */
  window.ETUTOR_NOTA_LABS.addm52_rate_approx_lab = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab || "kadar";
    var h = typeof ps.h === "number" ? ps.h : 3.0;
    var dx = typeof ps.dx === "number" ? ps.dx : 0.02;

    function render() {
      var body = "";
      var badge = "";
      if (tab === "kadar") {
        // Kon: R = 5 cm, H = 12 cm, dV/dt = -4 cm^3/s -> r = 5h/12, V = (25 pi / 432) h^3
        // dV/dh = (25 pi / 144) h^2; dh/dt = -4 / dV/dh
        var dVdh = (25 * 3.142 / 144) * h * h;
        var dhdt = -4 / dVdh;
        badge = "dh/dt = " + fmt(dhdt, 4) + " cm/s";
        body =
          '<div class="addm52-panel">' +
            "<h4>Contoh 20: Air Mengalir Keluar dari Bekas Kon (R = 5 cm, H = 12 cm, dV/dt = -4 cm^3/s)</h4>" +
            '<div class="addm52-step-box" style="margin-bottom:8px;">' +
              "<div>1. Segi tiga serupa: r / 5 = h / 12 -> r = 5h / 12</div>" +
              "<div>2. V = 1/3 pi r^2 h = (25 pi / 432) h^3  ->  dV/dh = (25 pi / 144) h^2</div>" +
              "<div>3. Pada h = " + fmt(h, 1) + " cm: dV/dh = " + fmt(dVdh, 3) + " cm^3/cm</div>" +
              "<div>4. Petua rantai: dh/dt = (dV/dt) / (dV/dh) = -4 / " + fmt(dVdh, 3) + " = " + fmt(dhdt, 4) + " cm/s</div>" +
            "</div>" +
            '<div class="lab-controls">' +
              '<label class="lab-slider-group">' +
                '<span class="lab-slider-label"><span>Kedalaman air h (cm)</span><span class="tabular-nums">h = ' + fmt(h, 1) + " cm</span></span>" +
                '<input id="addm52RateH" class="lab-range" type="range" min="2" max="11" step="0.5" value="' + fmt(h, 1) + '">' +
              "</label>" +
            "</div>" +
            '<div class="lab-callout"><strong>Tafsiran:</strong> Semakin cetek air di dalam kon, semakin laju paras ketinggiannya menyusut walaupun kadar isi padu keluar malar!</div>' +
          "</div>";
      } else {
        // y = sqrt(x) near x = 4
        var dydx = 1 / (2 * Math.sqrt(4)); // 0.25
        var dyApprox = dydx * dx;
        var approxVal = 2 + dyApprox;
        var exactVal = Math.sqrt(4 + dx);
        var pctY = (dyApprox / 2) * 100;
        badge = "sqrt(" + fmt(4 + dx, 3) + ") ≈ " + fmt(approxVal, 4);
        body =
          '<div class="addm52-panel">' +
            "<h4>Contoh 23: Penghampiran Kecil y = sqrt(x) berhampiran x = 4</h4>" +
            '<div class="addm52-step-box" style="margin-bottom:8px;">' +
              "<div>1. dy/dx = 1 / (2 sqrt(x)); pada x = 4, y = 2 dan dy/dx = 1/4 = 0.25</div>" +
              "<div>2. δx = " + fmt(dx, 3) + " -> δy ≈ (dy/dx) x δx = 0.25 x " + fmt(dx, 3) + " = " + fmt(dyApprox, 5) + "</div>" +
              "<div>3. Nilai hampir sqrt(" + fmt(4 + dx, 3) + ") ≈ 2 + (" + fmt(dyApprox, 5) + ") = " + fmt(approxVal, 5) + " (tepat: " + fmt(exactVal, 5) + ")</div>" +
              "<div>4. Peratus perubahan y = (δy / y) x 100% = " + fmt(pctY, 2) + "%</div>" +
            "</div>" +
            '<div class="lab-controls">' +
              '<label class="lab-slider-group">' +
                '<span class="lab-slider-label"><span>Perubahan kecil δx</span><span class="tabular-nums">δx = ' + fmt(dx, 3) + "</span></span>" +
                '<input id="addm52ApproxDx" class="lab-range" type="range" min="-0.08" max="0.08" step="0.01" value="' + fmt(dx, 2) + '">' +
              "</label>" +
            "</div>" +
            '<div class="lab-callout"><strong>Peringatan SPM:</strong> Jika δx negatif (menyusut), δy juga negatif. Jangan gunakan kalkulator terus apabila soalan mengarahkan kaedah kalkulus!</div>' +
          "</div>";
      }

      shell.innerHTML =
        '<div class="lab-header-row">' +
          '<span class="lab-title-pill">Simulator Kadar Perubahan &amp; Penghampiran Kecil (2.4)</span>' +
          '<span class="lab-arcade-score tabular-nums">' + esc(badge) + "</span>" +
        "</div>" +
        '<div class="addm52-row" style="margin-bottom:8px;">' +
          '<button type="button" class="addm52-btn" data-ra-tab="kadar" aria-pressed="' + (tab === "kadar" ? "true" : "false") + '">Kadar Perubahan Kon (dV/dt)</button>' +
          '<button type="button" class="addm52-btn" data-ra-tab="hampir" aria-pressed="' + (tab === "hampir" ? "true" : "false") + '">Perubahan Kecil (δy ≈ dy/dx δx)</button>' +
        "</div>" +
        body +
        renderArchivalGallery(["addm52_rate_approx"], "Rajah Rujukan Subtopik 2.4");

      var hEl = shell.querySelector("#addm52RateH");
      if (hEl) {
        syncSliderCss(hEl, fmt(h, 1));
        hEl.addEventListener("input", function () {
          h = Number(hEl.value);
          playSfx("tick");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      }
      var dxEl = shell.querySelector("#addm52ApproxDx");
      if (dxEl) {
        syncSliderCss(dxEl, fmt(dx, 2));
        dxEl.addEventListener("input", function () {
          dx = Number(dxEl.value);
          playSfx("tick");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      }
      shell.querySelectorAll("[data-ra-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          tab = btn.getAttribute("data-ra-tab");
          playSfx("snap");
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          render();
        });
      });
      bindArchivalGallery(shell, ctx);
    }

    render();
  };
})();

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);

        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

/* 04-step-minigames.js — Tap-to-Match, Word-Bank Assembly, Card Sort & Tactile MCQ */
function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });
    }
    var isOk = validList.indexOf(userJoined) !== -1;
    var exp = (isOk ? "" : "Susunan tepat: " + answerTokens.join(" ") + ". ") + (step.explanation || "");
    handleStepOutcome(isOk, exp, Number(step.xp) || 20, document.getElementById("wbCheckBtn"));
  });
}

function renderSortStep(step, card) {

          msgEl.className = "sort-mini-feedback ok";
          msgEl.textContent = item.note || tUi("Tepat!", "Spot on!");
        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";
          msgEl.textContent = tUi("Kurang tepat — fikirkan semula fungsi atau sifat istilah ini.", "Not quite — check the grammar rule and clues.");
        }
      }
    });
  });
}

function renderMcqStep(step, card) {
  var letters = ["A", "B", "C", "D"];

  var selectedIdx = -1;

  var heroMediaHtml = typeof buildHeroMediaHtml === "function" ? buildHeroMediaHtml(step) : "";
  var hookHtml = typeof buildHookRibbonHtml === "function" ? buildHookRibbonHtml(step) : "";

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("crown", "icon-sm") + " <span>" + tUi("Cabaran SPM", "SPM Challenge") + "</span></span>" +
    hookHtml +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || "") + "</h2>" +
    heroMediaHtml +
    (step.stimulusHtml ? '<div class="stimulus-box">' + step.stimulusHtml + "</div>" : "") +
    '<div class="choice-grid">' +
      opts.map(function (opt, idx) {
        return '<button type="button" class="tactile-choice js-mcq-opt" data-idx="' + idx + '"><span class="choice-key">' + (letters[idx] || (idx + 1)) + "</span><span>" + escapeHtml(opt) + "</span></button>";
      }).join("") +
    "</div>" +
    '<div class="step-actions-footer"><button type="button" id="mcqCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button></div>";

  if (typeof bindHeroMediaClicks === "function") bindHeroMediaClicks(card, step);

  var checkBtn = document.getElementById("mcqCheckBtn");
  card.querySelectorAll(".js-mcq-opt").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      NotaAudio.playTap();
      selectedIdx = Number(btn.getAttribute("data-idx"));
      card.querySelectorAll(".js-mcq-opt").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      if (checkBtn) checkBtn.disabled = false;
    });
  });

  if (checkBtn) {
    checkBtn.addEventListener("click", function () {
      if (notaState.answeredCurrent || selectedIdx < 0) return;
      var ok = selectedIdx === Number(step.correctIndex);
      card.querySelectorAll(".js-mcq-opt").forEach(function (b, idx) {
        b.disabled = true;
        if (idx === Number(step.correctIndex)) b.classList.add("is-correct");
        else if (idx === selectedIdx && !ok) b.classList.add("is-wrong");
      });
      checkBtn.disabled = true;
      handleStepOutcome(ok, step.explanation || "", Number(step.xp) || 20, checkBtn);
    });
  }
}

function spawnXpFloat(xpAmount, anchorEl) {
  var layer = document.getElementById("xpPopLayer");
  if (!layer || !xpAmount) return;
  var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
  var badge = document.createElement("span");
  badge.className = "xp-float-badge";
  badge.textContent = "+" + xpAmount + " XP";
  badge.style.left = Math.max(16, Math.min(window.innerWidth - 96, rect.left + rect.width / 2 - 34)) + "px";
  badge.style.top = Math.max(54, rect.top - 10) + "px";
  layer.appendChild(badge);
  setTimeout(function () {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 980);
}

function hideFeedbackDrawer() {

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

function showCelebration() {

  saveNotaState();

/* 06-feel-and-transitions.js — GSAP Feel Layer, Same-Document View Transitions, Sibling Stagger Fallback & Keyboard Nav */
var NotaFeel = (function () {
  var keysBound = false;

  function prefersReducedMotion() {
    return Boolean(typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function focusElementSafe(selector) {
    if (!selector || typeof document === "undefined") return;
    var el = document.querySelector(selector);
    if (el && typeof el.focus === "function") {
      try {
        el.focus({ preventScroll: true });
      } catch (e) {
        el.focus();
      }
    }
  }

  function runViewTransition(mutatorFn, focusSelector) {
    if (typeof mutatorFn !== "function") return;
    if (typeof document === "undefined" || typeof document.startViewTransition !== "function" || prefersReducedMotion()) {
      mutatorFn();
      if (focusSelector) {
        requestAnimationFrame(function () { focusElementSafe(focusSelector); });
      }
      return;
    }
    try {
      var vt = document.startViewTransition(mutatorFn);
      if (vt && vt.finished && focusSelector) {
        var onDone = function () { focusElementSafe(focusSelector); };
        vt.finished.then(onDone, onDone);
      }
    } catch (err) {
      mutatorFn();
      if (focusSelector) focusElementSafe(focusSelector);
    }
  }

  function applySiblingFallback(rootEl) {
    if (typeof CSS === "undefined" || typeof CSS.supports !== "function") return;
    if (CSS.supports("animation-delay: calc(sibling-index() * 0.1s)")) return;
    var scope = rootEl || document;
    [".skill-path-trail", ".concept-bullets", ".choice-grid"].forEach(function (parentSel) {
      scope.querySelectorAll(parentSel).forEach(function (parent) {
        Array.prototype.forEach.call(parent.children, function (child, idx) {
          child.style.setProperty("--sibling-index", String(idx + 1));
        });
      });
    });
  }

  function burstRewardParticles(anchorEl, count) {
    if (prefersReducedMotion()) return;
    var layer = document.getElementById("xpPopLayer");
    if (!layer) return;
    var rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    var cx = Math.max(24, Math.min(window.innerWidth - 24, rect.left + rect.width / 2));
    var cy = Math.max(60, Math.min(window.innerHeight - 24, rect.top + (rect.height || 0) / 2));
    var total = Math.min(14, Math.max(4, count || 10));
    var colors = ["#059669", "#f59e0b", "#2563eb", "#34d399", "#fbbf24"];

    for (var i = 0; i < total; i++) {
      (function (idx) {
        var dot = document.createElement("span");
        dot.className = "reward-particle-glint";
        dot.style.left = (cx - 4) + "px";
        dot.style.top = (cy - 4) + "px";
        dot.style.background = colors[idx % colors.length];
        layer.appendChild(dot);

        var angle = ((Math.PI * 2) / total) * idx + (Math.random() - 0.5) * 0.4;
        var dist = 34 + Math.random() * 44;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist - 14;

        if (window.gsap) {
          window.gsap.fromTo(
            dot,
            { x: 0, y: 0, scale: 0.4, rotation: 0, autoAlpha: 1 },
            {
              x: dx,
              y: dy,
              scale: 1.15,
              rotation: (idx % 2 === 0 ? 120 : -120),
              autoAlpha: 0,
              duration: 0.58 + Math.random() * 0.16,
              ease: "power2.out",
              onComplete: function () {
                if (dot.parentNode) dot.parentNode.removeChild(dot);
              }
            }
          );
        } else {
          setTimeout(function () {
            if (dot.parentNode) dot.parentNode.removeChild(dot);
          }, 520);
        }
      })(i);
    }
  }

  function animateXpCounter(fromXp, toXp) {
    var xpEl = document.getElementById("notaXpValue");
    var pill = document.getElementById("notaXpPill");
    if (!xpEl) return;
    var startVal = Number(fromXp) || 0;
    var endVal = Number(toXp) || 0;
    if (prefersReducedMotion() || !window.gsap || startVal === endVal) {
      xpEl.textContent = endVal + " XP";
      return;
    }
    var stateObj = { val: startVal };
    window.gsap.to(stateObj, {
      val: endVal,
      duration: 0.42,
      ease: "power2.out",
      overwrite: "auto",
      onUpdate: function () {
        xpEl.textContent = Math.round(stateObj.val) + " XP";
      }
    });
    if (pill) {
      window.gsap.fromTo(
        pill,
        { scale: 1 },
        { scale: 1.11, duration: 0.18, yoyo: true, repeat: 1, ease: "back.out(2)", clearProps: "scale" }
      );
    }
  }

  function spawnComboBanner(combo, bonusXp) {
    if (prefersReducedMotion() || combo < 2) return;
    var layer = document.getElementById("xpPopLayer");
    if (!layer) return;
    var tag = document.createElement("div");
    tag.className = "nota-combo-burst" + (combo >= 3 ? " is-fire" : "");
    var isEn = typeof isEnglishNota === "function" && isEnglishNota();
    tag.textContent = combo >= 3
      ? ((isEn ? "COMBO x" : "KOMBO x") + combo + "! +" + (bonusXp || 5) + " BONUS XP!")
      : ((isEn ? "COMBO x" : "KOMBO x") + combo + (isEn ? "! KEEP GOING!" : "! TERUSKAN!"));
    layer.appendChild(tag);
    if (window.gsap) {
      window.gsap.fromTo(
        tag,
        { y: 18, scale: 0.72, autoAlpha: 0 },
        {
          y: -26,
          scale: 1.04,
          autoAlpha: 1,
          duration: 0.34,
          ease: "back.out(2)",
          onComplete: function () {
            window.gsap.to(tag, {
              y: -52,
              autoAlpha: 0,
              duration: 0.45,
              delay: 0.55,
              ease: "power2.in",
              onComplete: function () {
                if (tag.parentNode) tag.parentNode.removeChild(tag);
              }
            });
          }
        }
      );
    } else {
      setTimeout(function () { if (tag.parentNode) tag.parentNode.removeChild(tag); }, 1100);
    }
  }

  function pulseComboEscalation(combo) {
    var comboEl = document.getElementById("notaComboPill");
    if (!comboEl) return;
    if (combo >= 3) comboEl.classList.add("hud-combo-fire");
    else comboEl.classList.remove("hud-combo-fire");
    if (combo >= 2 && window.gsap && !prefersReducedMotion()) {
      window.gsap.fromTo(
        comboEl,
        { scale: 0.84 },
        { scale: 1, duration: 0.36, ease: "elastic.out(1, 0.5)", clearProps: "scale" }
      );
    }
  }

  function pulseHeartLoss() {
    var pill = document.getElementById("notaHeartsPill");
    if (!pill || prefersReducedMotion()) return;
    if (window.gsap) {
      var tl = window.gsap.timeline();
      tl.to(pill, { x: -6, borderColor: "#dc2626", duration: 0.07, ease: "power1.out" })
        .to(pill, { x: 6, duration: 0.08, ease: "power1.inOut" })
        .to(pill, { x: -4, duration: 0.07, ease: "power1.inOut" })
        .to(pill, { x: 0, duration: 0.08, ease: "power1.out", clearProps: "x,borderColor" });
    } else {
      pill.classList.add("is-shaking");
      setTimeout(function () { pill.classList.remove("is-shaking"); }, 380);
    }
  }

  function initKeyboardShortcuts() {
    if (keysBound || typeof document === "undefined") return;
    keysBound = true;
    initArchivalDialog();
    document.addEventListener("keydown", function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      var target = ev.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT" || target.isContentEditable)) return;

      if (document.querySelector("dialog[open]")) return;
      var celModal = document.getElementById("celebrationOverlay");
      var heartModal = document.getElementById("heartModal");
      if ((celModal && !celModal.hidden) || (heartModal && !heartModal.hidden)) return;

      if (ev.key >= "1" && ev.key <= "4" && notaState.mode === "lesson" && !notaState.answeredCurrent) {
        var opts = document.querySelectorAll("#lessonView .js-predict-opt, #lessonView .js-mcq-opt");
        var btn = opts[Number(ev.key) - 1];
        if (btn && !btn.disabled) {
          ev.preventDefault();
          btn.click();
        }
        return;
      }

      if (ev.key === "Enter") {
        var drawer = document.getElementById("feedbackDrawer");
        if (drawer && !drawer.hidden) {
          var contBtn = document.getElementById("feedbackContinueBtn");
          if (contBtn && target !== contBtn) {
            ev.preventDefault();
            contBtn.click();
          }
          return;
        }
        if (notaState.mode === "lesson" && !notaState.answeredCurrent && (!target || target.tagName !== "BUTTON")) {
          var primary = document.querySelector("#mcqCheckBtn:not(:disabled), #wbCheckBtn:not(:disabled), #conceptDoneBtn:not(:disabled)");
          if (primary) {
            ev.preventDefault();
            primary.click();
          }
        }
        return;
      }

      if (ev.key === "Escape" && notaState.mode === "lesson") {
        var backBtn = document.getElementById("notaBackBtn");
        if (backBtn) {
          ev.preventDefault();
          backBtn.click();
        }
      }
    });
  }

  var dialogBound = false;
  function initArchivalDialog() {
    if (dialogBound || typeof document === "undefined") return;
    var dlgs = document.querySelectorAll('dialog[closedby="any"]');
    if (!dlgs.length) return;
    dialogBound = true;

    var hasClosedBy = typeof HTMLDialogElement !== "undefined" && ("closedBy" in HTMLDialogElement.prototype);
    var outside = function (e, dialogEl) {
      var r = dialogEl.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    };

    dlgs.forEach(function (dlg) {
      dlg.addEventListener("close", function () {
        dlg.returnValue = "";
      });
      if (!hasClosedBy) {
        var pressedOutside = false;
        dlg.addEventListener("pointerdown", function (e) { pressedOutside = outside(e, dlg); });
        dlg.addEventListener("pointerup", function (e) { if (pressedOutside && outside(e, dlg)) dlg.close(); });
      }
    });
  }

  function openArchivalLightbox(info) {
    initArchivalDialog();
    var dlg = document.getElementById("archivalLightboxDialog");
    if (!dlg) return;
    var eraEl = document.getElementById("archivalDialogEra");
    var imgEl = document.getElementById("archivalDialogImg");
    var titleEl = document.getElementById("archivalDialogTitle");
    var capEl = document.getElementById("archivalDialogCaption");
    var credEl = document.getElementById("archivalDialogCredit");
    if (eraEl) eraEl.textContent = (info && info.era) || "ARKIB SEJARAH";
    if (imgEl) {
      imgEl.src = (info && info.src) || "";
      imgEl.alt = (info && info.alt) || (info && info.title) || "Foto arkib sejarah";
    }
    if (titleEl) titleEl.textContent = (info && info.title) || "";
    if (capEl) capEl.textContent = (info && info.caption) || "";
    if (credEl) {
      credEl.textContent = "";
      credEl.hidden = true;
    }
    if (typeof NotaAudio !== "undefined" && NotaAudio.playPaperRustle) NotaAudio.playPaperRustle();
    if (typeof dlg.showModal === "function") dlg.showModal();
  }

  function buildMascotSvg(mood) {
    var brow = mood === "combo" ? "M16 18 L22 16 M32 18 L26 16" : mood === "encourage" ? "M16 16 L22 18 M32 16 L26 18" : "M16 17 L22 17 M32 17 L26 17";
    var bodyFill = mood === "combo" ? "#d97706" : mood === "boss" ? "#7c3aed" : "#2563eb";
    var wingFill = mood === "combo" ? "#b45309" : mood === "boss" ? "#5b21b6" : "#1d4ed8";
    return (
      '<svg class="cikgu-mascot-svg" viewBox="0 0 48 48" aria-hidden="true">' +
        '<rect x="10" y="42" width="28" height="4" rx="2" fill="#cbd5e1"/>' +
        '<ellipse class="cikgu-wing-l" cx="8" cy="26" rx="4.5" ry="9" fill="' + wingFill + '"/>' +
        '<ellipse class="cikgu-wing-r" cx="40" cy="26" rx="4.5" ry="9" fill="' + wingFill + '"/>' +
        '<rect x="8" y="8" width="32" height="33" rx="14" fill="' + bodyFill + '"/>' +
        '<ellipse cx="24" cy="34" rx="10" ry="6" fill="rgba(255,255,255,0.22)"/>' +
        '<circle cx="19" cy="22" r="5" fill="#ffffff"/>' +
        '<circle cx="29" cy="22" r="5" fill="#ffffff"/>' +
        '<circle cx="19.5" cy="22" r="2.2" fill="#0f172a"/>' +
        '<circle cx="29.5" cy="22" r="2.2" fill="#0f172a"/>' +
        '<path d="' + brow + '" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" fill="none"/>' +
        '<polygon class="cikgu-mascot-beak" points="24,25 21,29 27,29" fill="#fbbf24"/>' +
        '<rect x="15" y="4" width="18" height="4" rx="2" fill="#1e3a8a"/>' +
      "</svg>"
    );
  }

  function animateStepEntrance(cardEl) {
    if (!cardEl || !window.gsap || prefersReducedMotion()) return;
    var targets = cardEl.querySelectorAll(".step-top-row, .step-kicker, .step-heading, .bite-lead-pill, .nota-hero-media-grid, .lab-shell, .mindmap-shell, .bite-cards-row, .concept-formula-box, .bite-tip-strip, .nota-deep-drawer, .choice-grid, .match-columns, .sort-board, .wordbank-tray");
    if (!targets || targets.length === 0) return;
    window.gsap.fromTo(
      targets,
      { y: 12, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, duration: 0.28, stagger: 0.045, ease: "power2.out", clearProps: "transform,opacity" }
    );
  }

  function renderCikguCompanion(hostEl, mood, message, stepObj) {
    if (!hostEl) return;
    var activeMood = mood || "explore";
    var isEn = typeof isEnglishNota === "function" && isEnglishNota();
    var roleText = activeMood === "combo"
      ? (isEn ? "Cikgu AI • On Fire!" : "Cikgu AI • Kombo Hangat!")
      : activeMood === "boss"
        ? (isEn ? "Cikgu AI • Boss Challenge" : "Cikgu AI • Mod Cabaran Boss")
        : activeMood === "encourage"
          ? (isEn ? "Cikgu AI • Keep Going!" : "Cikgu AI • Terus Cuba!")
          : (activeMood === "correct" ? (isEn ? "Cikgu AI • Awesome!" : "Cikgu AI • Mantap!") : (isEn ? "Cikgu AI • Study Coach" : "Cikgu AI • Rakan Ulang Kaji"));
    var defaultMsg = isEn ? "Explore interactive visuals and lock in every CEFR rule!" : "Teroka peta, potret arkib dan aktiviti untuk menguasai fakta SPM!";
    var hasVoice = Boolean(typeof CHAPTER !== "undefined" && CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
    var voiceBtnHtml = hasVoice && NotaVoice.renderSingleButtonHtml ? NotaVoice.renderSingleButtonHtml(stepObj) : "";

    hostEl.innerHTML =
      '<div id="cikguCompanionBar" class="cikgu-companion-bar mood-' + activeMood + '">' +
        buildMascotSvg(activeMood) +
        '<div class="cikgu-companion-copy">' +
          '<span class="cikgu-companion-role">' + roleText + "</span>" +
          '<p class="cikgu-companion-msg">' + escapeHtml(message || defaultMsg) + "</p>" +
        "</div>" +
        voiceBtnHtml +
      "</div>";

    if (hasVoice && NotaVoice.wireBarControls) {
      NotaVoice.wireBarControls(hostEl);
    }

    var svg = hostEl.querySelector(".cikgu-mascot-svg");
    if (svg && window.gsap && !prefersReducedMotion()) {
      window.gsap.fromTo(svg, { scale: 0.85, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(1.8)", clearProps: "transform" });
    }
  }

  return {
    prefersReducedMotion: prefersReducedMotion,
    runViewTransition: runViewTransition,
    applySiblingFallback: applySiblingFallback,
    burstRewardParticles: burstRewardParticles,
    animateXpCounter: animateXpCounter,
    pulseComboEscalation: pulseComboEscalation,
    spawnComboBanner: spawnComboBanner,
    pulseHeartLoss: pulseHeartLoss,
    openArchivalLightbox: openArchivalLightbox,
    renderCikguCompanion: renderCikguCompanion,
    animateStepEntrance: animateStepEntrance,
    initKeyboardShortcuts: initKeyboardShortcuts
  };
})();

if (typeof window !== "undefined") {
  window.NotaFeel = NotaFeel;
  if (typeof NotaAudio !== "undefined") window.NotaAudio = NotaAudio;
}

  // --- [runtime/07-voice-narration.js] ---
/* 07-voice-narration.js — Pure Pre-Generated ElevenLabs v4 Autoplay MP3 Player (Single Duolingo Speaker Button) */
var NotaVoice = (function () {
  var audioEl = null;
  var preloadMap = {};
  var pendingTimer = null;
  var beakTween = null;
  var isPlaying = false;
  var lastKey = "";

  var SPEAKER_SVG =
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>' +
      '<path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>' +
    "</svg>";
  var EQ_BARS_HTML = '<span class="voice-eq-bars" aria-hidden="true"><i class="voice-eq-bar"></i><i class="voice-eq-bar"></i><i class="voice-eq-bar"></i></span>';

  function getPackUrl(clipKey) {
    if (!clipKey || typeof window === "undefined") return "";
    var pack = window.ETUTOR_NOTA_VOICE;
    var raw = (pack && pack[clipKey]) || "";
    if (!raw) return "";
    var cdnBase = window.ETUTOR_NOTA_CDN_BASE ? String(window.ETUTOR_NOTA_CDN_BASE).replace(/\/+$/, "") : "";
    if (cdnBase && raw.indexOf("../assets/") === 0) {
      var host = typeof location !== "undefined" ? String(location.hostname || "") : "";
      var proto = typeof location !== "undefined" ? String(location.protocol || "") : "";
      var search = typeof location !== "undefined" ? String(location.search || "") : "";
      var isLocalHost = host === "localhost" || host === "127.0.0.1" || proto === "file:";
      var forceCdn = /[?&]cdn=r2\b/i.test(search);
      if (!isLocalHost || forceCdn) {
        return cdnBase + "/nota-interaktif/assets/" + raw.slice("../assets/".length);
      }
    }
    return raw;
  }

  function stripVoiceTags(raw) {
    return String(raw || "")
      .replace(/\[[^\]]+\]\s*/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function getCleanStepText(step, unit) {
    if (step && step.voiceCaption) return step.voiceCaption;
    if (step && step.voiceScript) return stripVoiceTags(step.voiceScript);
    if (step && step.title && step.summary) return step.title + ". " + step.summary;
    if (step && step.prompt) return step.prompt;
    return unit && unit.title ? "Teroka unit " + unit.title + "." : "";
  }

  function getCleanReactionText(isCorrect, combo) {
    var vr = (typeof CHAPTER !== "undefined" && CHAPTER.voiceReactions) || {};
    if (isCorrect) {
      return stripVoiceTags((combo >= 3 && vr.combo) ? vr.combo : (vr.correct || "Tepat sekali!"));
    }
    return stripVoiceTags(vr.encourage || "Hampir tepat! Semak penjelasan di bawah.");
  }

  function setSpeakingAnim(speakingNow) {
    if (typeof document === "undefined") return;
    var bar = document.getElementById("cikguCompanionBar");
    if (bar) bar.classList.toggle("is-speaking", Boolean(speakingNow));

    var beak = document.querySelector("#cikguCompanionBar .cikgu-mascot-beak");
    if (beakTween) {
      try { beakTween.kill(); } catch (e) {}
      beakTween = null;
    }
    var reduced = typeof NotaFeel !== "undefined" && NotaFeel.prefersReducedMotion && NotaFeel.prefersReducedMotion();
    if (speakingNow && beak && window.gsap && !reduced) {
      beakTween = window.gsap.to(beak, {
        scaleY: 1.45,
        transformOrigin: "50% 25%",
        duration: 0.16,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });
    } else if (beak && window.gsap) {
      window.gsap.set(beak, { clearProps: "transform" });
    }
  }

  function syncUi() {
    if (typeof document === "undefined") return;
    var btn = document.getElementById("voiceSingleBtn");
    if (btn) {
      btn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
      btn.setAttribute("aria-label", isPlaying ? "Hentikan suara penerangan" : "Dengar suara penerangan Cikgu AI");
      btn.setAttribute("title", isPlaying ? "Klik untuk henti" : "Mainkan semula penerangan Cikgu AI");
      btn.innerHTML = isPlaying ? EQ_BARS_HTML : SPEAKER_SVG;
    }
    setSpeakingAnim(isPlaying);
  }

  function stop() {
    if (pendingTimer) {
      clearTimeout(pendingTimer);
      pendingTimer = null;
    }
    if (audioEl) {
      try {
        audioEl.onended = null;
        audioEl.onerror = null;
        audioEl.pause();
        audioEl.currentTime = 0;
      } catch (e) {}
      audioEl = null;
    }
    isPlaying = false;
    syncUi();
  }

  function preloadClip(clipKey) {
    var url = getPackUrl(clipKey);
    if (!url || preloadMap[clipKey] || typeof Audio === "undefined") return;
    try {
      var a = new Audio(url);
      a.preload = "auto";
      preloadMap[clipKey] = a;
    } catch (e) {}
  }

  function playClip(clipKey, isManual) {
    var url = getPackUrl(clipKey);
    if (!url) return;
    lastKey = clipKey;
    stop();

    if (notaState.muted && !isManual) {
      syncUi();
      return;
    }
    if (notaState.muted && isManual) {
      notaState.muted = false;
      saveNotaState();
      if (typeof renderTopHud === "function") renderTopHud();
    }

    var el = preloadMap[clipKey] || new Audio(url);
    try { el.currentTime = 0; } catch (e0) {}
    audioEl = el;
    isPlaying = true;
    syncUi();

    el.onended = function () {
      if (audioEl !== el) return;
      audioEl = null;
      isPlaying = false;
      syncUi();
    };
    el.onerror = function () {
      if (audioEl !== el) return;
      audioEl = null;
      isPlaying = false;
      syncUi();
    };

    try {
      var p = el.play();
      if (p && typeof p.catch === "function") {
        p.catch(function () {
          if (audioEl === el) {
            audioEl = null;
            isPlaying = false;
            syncUi();
          }
        });
      }
    } catch (err) {
      audioEl = null;
      isPlaying = false;
      syncUi();
    }
  }

  function scheduleClip(clipKey, delayMs) {
    if (!clipKey) return;
    lastKey = clipKey;
    if (pendingTimer) {
      clearTimeout(pendingTimer);
      pendingTimer = null;
    }
    if (notaState.muted || !getPackUrl(clipKey)) {
      syncUi();
      return;
    }
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      playClip(clipKey, false);
    }, delayMs || 150);
  }

  function autoplayStep(unit, step, nextStep) {
    if (!step || !step.voiceIdKey) return;
    if (nextStep && nextStep.voiceIdKey) preloadClip(nextStep.voiceIdKey);
    scheduleClip(step.voiceIdKey, 150);
  }

  function autoplayReaction(isCorrect, combo) {
    var key = isCorrect ? (combo >= 3 ? "reaction-combo" : "reaction-correct") : "reaction-encourage";
    scheduleClip(key, 240);
  }

  function autoplayCelebration() {
    scheduleClip("reaction-celebrate", 320);
  }

  function handleSingleButtonClick() {
    if (isPlaying) {
      stop();
      return;
    }
    if (lastKey) {
      playClip(lastKey, true);
    }
  }

  function onMuteChanged() {
    if (notaState.muted) stop();
    else syncUi();
  }

  function renderSingleButtonHtml() {
    var lbl = isPlaying ? "Hentikan suara penerangan" : "Dengar suara penerangan Cikgu AI";
    return (
      '<button type="button" id="voiceSingleBtn" class="voice-duolingo-btn" aria-pressed="' + (isPlaying ? "true" : "false") + '" aria-label="' + lbl + '" title="' + lbl + '">' +
        (isPlaying ? EQ_BARS_HTML : SPEAKER_SVG) +
      "</button>"
    );
  }

  function wireBarControls(hostEl) {
    if (!hostEl) return;
    var btn = hostEl.querySelector("#voiceSingleBtn");
    if (btn) btn.addEventListener("click", handleSingleButtonClick);
  }

  return {
    stripVoiceTags: stripVoiceTags,
    getCleanStepText: getCleanStepText,
    getCleanReactionText: getCleanReactionText,
    autoplayStep: autoplayStep,
    autoplayReaction: autoplayReaction,
    autoplayCelebration: autoplayCelebration,
    onMuteChanged: onMuteChanged,
    renderSingleButtonHtml: renderSingleButtonHtml,
    wireBarControls: wireBarControls,
    stop: stop
  };
})();

if (typeof window !== "undefined") {
  if (typeof NotaAudio !== "undefined") window.NotaAudio = NotaAudio;
  if (typeof NotaFeel !== "undefined") window.NotaFeel = NotaFeel;
  window.NotaVoice = NotaVoice;
}
})();</script>
