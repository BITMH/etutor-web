/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab02","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":2,"title":"Pembezaan","subtitle":"Subtopik 2.1–2.4 KSSM — Had Fungsi (0/0: Pemfaktoran & Konjugat), Prinsip Pertama, Terbitan Pertama (ax^n, Petua Rantai, Hasil Darab, Hasil Bahagi), Terbitan Kedua, Tangen & Normal, Titik Pusingan & Lengkok Balas, Kadar Perubahan Terhubung serta Penghampiran Kecil.","estimatedMinutes":38,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t5-bab02-labs.js","coverIcon":"../assets/icons/addm52-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan pembezaan dan analisis kecerunan kamu sungguh cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Semua petua rantai, hasil darab, tangen dan titik pusingan berjaya diselesaikan!","encourage":"[softly] Hampir tepat... jangan berputus asa! [warm] Semak semula tanda kuasa atau syarat titik pegun dy/dx = 0 pada nota di bawah.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan lima Bab dua berjaya ditakluki!"},"units":[{"id":"addm52-u1","title":"Unit 1: Had Fungsi (0/0) & Pembezaan Prinsip Pertama","subtitle":"Subtopik 2.1 — Menilai Had (Penggantian, Pemfaktoran, Konjugat) & Menerbitkan dy/dx = had (δx→0) δy/δx","iconType":"graph","iconUrl":"../assets/icons/addm52-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Had Fungsi & Video Pembezaan","voiceCaption":"Apabila penggantian langsung menghasilkan bentuk tak tentu 0/0, tentukan had melalui pemfaktoran atau pendaraban konjugat.","voiceScript":"[warm] Selamat datang ke Matematik Tambahan Tingkatan lima, Bab dua, Pembezaan! Kalkulus yang dipelopori oleh Isaac Newton dan Gottfried Leibniz bermula dengan idea had. Apabila penggantian nilai x secara terus menghasilkan sifar per sifar, iaitu bentuk tak tentu, kita tidak boleh berhenti! Sebaliknya, faktorkan ungkapan atau darabkan dengan konjugat punca kuasa untuk menghapuskan faktor sifar. Tonton animasi tiga dimensi ini dahulu untuk melihat bagaimana pembezaan dan pengamiran saling berhubung!","title":"2.1 Had Suatu Fungsi & Mengatasi Bentuk Tak Tentu 0/0","acronym":"Faktor • Konjugat","hook":"Jika penggantian terus memberi 0/0, jangan panik — faktorkan atau darab konjugat untuk memotong faktor penyifar!","mediaKey":"addm52_limits_tangent","videoClip":{"src":"../assets/matematik-tambahan-t5-bab02/video/addm52_video_pembezaan_kamiran.mp4","hasNarration":false,"posterKey":"addm52_limits_tangent","caption":"Animasi 3D: Perkaitan antara kecerunan tangen pembezaan dengan luas di bawah lengkung pengamiran"},"summary":"Had f(x) apabila x menghampiri a (x ≠ a) ialah nilai sasaran L yang dihampiri dari arah kiri dan kanan; bentuk tak tentu 0/0 diselesaikan melalui pemfaktoran atau merasionalkan punca kuasa.","bullets":["Penggantian Langsung vs Pemfaktoran: Jika f(a) ≠ 0/0, maka had = f(a). Jika mendapat 0/0 seperti had (x→1) (x²−1)/(x−1), faktorkan menjadi (x+1)(x−1)/(x−1) = x+1, lalu ganti x = 1 untuk mendapat 2.","Merasionalkan dengan Konjugat (Contoh 1c): Untuk had (x→0) [√(x+1) − 1] / x, darabkan pengangka dan penyebut dengan konjugat [√(x+1) + 1] menggunakan (a−b)(a+b) = a²−b², menjadi x / [x(√(x+1)+1)] = 1 / (1+1) = 1/2."],"labId":"addm52_limit_first_principle_lab","labTitle":"Makmal Had 0/0 & Prinsip Pertama","labProps":{"tab":"had"},"formula":"had (x→a) f(x) = L   |   (√A − B)(√A + B) = A − B²","examTip":"Semasa menulis penyelesaian had, kekalkan perkataan 'had' di hadapan ungkapan pada setiap baris SEHINGGA nilai x digantikan."},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Nilai Had Konjugat","voiceCaption":"Ramalkan nilai bagi had (x→3) [(3 − √(2x + 3)) / (x − 3)] setelah didarabkan dengan konjugat.","voiceScript":"[curious] Cuba selesaikan soalan had berbentuk konjugat ini! Apabila x menghampiri tiga, ungkapan tiga tolak punca kuasa dua dua x campur tiga dibahagi x tolak tiga memberi sifar per sifar. Apakah nilai hadnya selepas didarabkan konjugat?","hook":"Hapuskan faktor (x - 3) di pengangka dan penyebut sebelum mengganti x = 3!","scenario":"Latihan Kendiri 2.1 Q2(h): had (x→3) [3 − √(2x + 3)] / (x − 3).","prompt":"Apakah nilai tepat bagi had fungsi tersebut apabila x → 3?","options":["-1/3","1/3","0","-1/6"],"correctIndex":0,"proofLabId":"addm52_limit_first_principle_lab","proofState":{"tab":"had"},"explanation":"Darab konjugat [3 + √(2x+3)]: pengangka menjadi 9 − (2x + 3) = 6 − 2x = −2(x − 3). Hapus faktor (x − 3), tinggal −2 / [3 + √(2x+3)]. Ganti x = 3 memberi −2 / (3 + 3) = −1/3."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Prinsip Pertama Pembezaan","voiceCaption":"Fungsi kecerunan tangen melalui prinsip pertama ialah dy/dx = had (δx→0) [f(x+δx) − f(x)] / δx.","voiceScript":"[confident] Sekarang mari fahami bagaimana had melahirkan pembezaan melalui Prinsip Pertama! Bayangkan titik B berada sedikit jauh dari titik A dengan tokokan kecil delta x. Kecerunan garis perentas A B ialah delta y bahagi delta x. Apabila delta x mengecil sehingga menghampiri sifar, garis perentas bertukar menjadi garis tangen tepat di titik A! Itulah terbitan pertama d y per d x!","title":"Terbitan Pertama dengan Prinsip Pertama","acronym":"δy / δx → dy/dx","hook":"Gerakkan titik C mendekati titik B sehingga δx → 0 untuk menyaksikan garis perentas bertukar menjadi garis tangen!","mediaKey":"addm52_limits_tangent","summary":"Pembezaan dengan prinsip pertama menentukan fungsi kecerunan tangen dy/dx pada sebarang titik menggunakan had nisbah tokokan δy/δx apabila δx → 0.","bullets":["4 Langkah Wajib Prinsip Pertama: (1) Ambil A(x, y) dan B(x+δx, y+δy); (2) Cari δy = f(x+δx) − f(x); (3) Permudahkan nisbah δy/δx dengan memfaktorkan δx; (4) Ambil had apabila δx → 0 untuk memperoleh dy/dx.","Contoh 3 Buku Teks: Bagi y = 3x², δy = 3(x+δx)² − 3x² = 6x(δx) + 3(δx)², maka δy/δx = 6x + 3δx. Apabila δx → 0, dy/dx = 6x. Ingat: simbol dy/dx BUKAN pecahan dy dibahagi dx!"],"labId":"addm52_limit_first_principle_lab","labTitle":"Simulator Prinsip Pertama (y = x² di B(3, 9))","labProps":{"tab":"prinsip","dx":0.8},"formula":"dy/dx = had (δx→0) δy / δx = had (δx→0) [f(x + δx) − f(x)] / δx","examTip":"Jika soalan mengarahkan 'Cari dy/dx dengan menggunakan prinsip pertama', penggunaan terus rumus kuasa nx^(n-1) mendapat 0 markah!"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Susun Langkah Prinsip Pertama","voiceCaption":"Susun keempat-empat langkah untuk menerbitkan dy/dx bagi fungsi y = 1/(4x) dengan prinsip pertama.","voiceScript":"[confident] Susun langkah kerja prinsip pertama mengikut turutan yang tepat mengikut Tip Pintar buku teks!","prompt":"Susun turutan langkah menentukan dy/dx menggunakan prinsip pertama:","answerTokens":["Pertimbangkan titik (x, y) dan (x+δx, y+δy)","Tentukan tokokan δy = f(x+δx) − f(x)","Permudahkan nisbah δy/δx dengan membahagi δx","Ambil had δy/δx apabila δx menghampiri 0"],"distractors":["Gantikan terus nilai δx = 0 sebelum membahagi","Kamirkan fungsi f(x) terhadap x"],"explanation":"Sentiasa kembangkan dan hapuskan faktor δx pada nisbah δy/δx terlebih dahulu sebelum mengambil had δx → 0."}]},{"id":"addm52-u2","title":"Unit 2: Pembezaan Peringkat Pertama & 3 Petua Utama","subtitle":"Subtopik 2.2 — Rumus ax^n, Fungsi Gubahan (Petua Rantai), Petua Hasil Darab uv' + vu' & Hasil Bahagi","iconType":"formula","iconUrl":"../assets/icons/addm52-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Rumus Kuasa & Petua Rantai","voiceCaption":"Terbitan pertama bagi y = ax^n ialah anx^(n-1), manakala fungsi gubahan menggunakan petua rantai dy/dx = (dy/du) × (du/dx).","voiceScript":"[warm] Selamat tinggal pengiraan panjang prinsip pertama! Dalam Subtopik dua perpuluhan dua, kita menggunakan rumus terbitan pertama kuasa: jika y sama dengan a x kuasa n, maka d y per d x sama dengan a n x kuasa n tolak satu! Untuk fungsi berpunca kuasa atau di penyebut, tukarkan dahulu kepada bentuk indeks seperti x kuasa setengah atau x kuasa negatif dua. Bagi kurungan berkuasa tinggi seperti u kuasa tujuh, gunakan Petua Rantai!","title":"2.2 Rumus Kuasa ax^n & Petua Rantai Fungsi Gubahan","acronym":"anx^(n−1) • Rantai","hook":"Tukar punca kuasa dan pecahan kepada indeks dahulu, kemudian bawa kuasa ke hadapan dan tolak satu!","mediaKey":"addm52_limits_tangent","summary":"Terbitan pertama fungsi polinomial/indeks mengikut rumus d/dx(ax^n) = anx^(n-1), manakala fungsi gubahan y = u^n dibezakan melalui petua rantai dy/dx = (dy/du) × (du/dx).","bullets":["Tukar ke Indeks Dahulu (Contoh 4 & 6): (a) y = (1/5)√x = (1/5)x^(1/2) memberi dy/dx = 1/(10√x); (b) y = 3/(8x²) = (3/8)x^(-2) memberi dy/dx = −3/(4x³); (c) y = (2x+1)(x−1)/x = 2x − 1 − x^(-1) memberi dy/dx = 2 + 1/x².","Petua Rantai (Contoh 7): Jika y = u^n dengan u = h(x), maka d/dx(u^n) = n u^(n-1) × (du/dx). Contoh: y = √(6x² + 8) = (6x² + 8)^(1/2) memberi dy/dx = ½(6x² + 8)^(-1/2) × (12x) = 6x / √(6x² + 8)."],"labId":"addm52_rules_workbench_lab","labTitle":"Meja Kerja Petua Pembezaan (Kuasa & Rantai)","labProps":{"rule":"rantai"},"formula":"d/dx (ax^n) = a n x^(n−1)   |   dy/dx = (dy/du) × (du/dx)","examTip":"Jangan lupa mendarab dengan terbitan dalam kurungan (du/dx) apabila membezakan (ax + b)^n! Itulah punca hilang markah paling lazim."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Petua Pembezaan Tepat","voiceCaption":"Kelaskan ungkapan berikut mengikut petua pembezaan yang paling sesuai: Petua Rantai, Hasil Darab atau Hasil Bahagi.","voiceScript":"[curious] Sebelum membezakan sebarang fungsi dalam S P M, pilih senjata yang paling sesuai! Asingkan fungsi berikut kepada Petua Rantai atau Petua Hasil Darab dan Hasil Bahagi.","prompt":"Isihkan fungsi berikut mengikut petua pembezaan utama yang diperlukan:","buckets":[{"id":"rantai","label":"Rumus Kuasa / Petua Rantai"},{"id":"darab_bahagi","label":"Petua Hasil Darab / Bahagi"}],"items":[{"text":"y = (3x² − 4x)^7","bucketId":"rantai","note":"Satu kurungan berkuasa 7; guna dy/dx = 7u^6 (du/dx)."},{"text":"y = 6 / (2 − x)²","bucketId":"rantai","note":"Pengangka pemalar -> tulis sebagai 6(2 − x)^(-2) dan guna Petua Rantai."},{"text":"y = (3x + 2) √(4x − 1)","bucketId":"darab_bahagi","note":"Hasil darab dua ungkapan berbeza u dan v."},{"text":"y = (2x + 1) / (x² − 3)","bucketId":"darab_bahagi","note":"Pecahan dua ungkapan x di pengangka dan penyebut -> guna (vu' - uv')/v²."}],"explanation":"Fungsi tunggal berkuasa atau berpunca menggunakan rumus kuasa/petua rantai, manakala pendaraban atau pembahagian dua fungsi x menggunakan petua hasil darab atau hasil bahagi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Petua Hasil Darab & Bahagi","voiceCaption":"Gunakan petua hasil darab uv' + vu' untuk pendaraban dua fungsi dan (vu' − uv')/v² untuk pembahagian.","voiceScript":"[confident] Bagaimana jika dua ungkapan algebra didarabkan atau dibahagikan dan tidak dapat dikembangkan seperti punca kuasa? Gunakan Petua Hasil Darab iaitu u v prima tambah v u prima, atau Petua Hasil Bahagi iaitu v u prima tolak u v prima, semuanya dibahagi v kuasa dua! Ingat betul-betul tertib penolakan pada petua hasil bahagi: sentiasa mulakan dengan penyebut v darab u prima dahulu!","title":"Petua Hasil Darab (uv) & Petua Hasil Bahagi (u/v)","acronym":"uv'+vu' • (vu'−uv')/v²","hook":"Untuk pecahan u/v, mulakan pengangka dengan penyebut v dahulu: (v u' − u v') / v² — tertib salah menyebabkan tanda terbalik!","mediaKey":"addm52_limits_tangent","summary":"Dua ungkapan algebra yang didarabkan dibezakan dengan petua hasil darab, manakala pecahan dua ungkapan dibezakan dengan petua hasil bahagi.","bullets":["Petua Hasil Darab: d/dx(uv) = u(dv/dx) + v(du/dx). Contoh 8(b): y = (3x + 2)√(4x − 1) menghasilkan (3x + 2)[2/√(4x−1)] + 3√(4x−1) = (18x + 1) / √(4x − 1).","Petua Hasil Bahagi: d/dx(u/v) = [v(du/dx) − u(dv/dx)] / v². Contoh 10(b): y = x / √(4x − 1) menghasilkan [(4x−1) − 2x] / (4x−1)^(3/2) = (2x − 1) / √(4x − 1)³."],"labId":"addm52_rules_workbench_lab","labTitle":"Meja Kerja Hasil Darab & Hasil Bahagi","labProps":{"rule":"bahagi"},"formula":"(uv)' = uv' + vu'   |   (u/v)' = (vu' − uv') / v²","examTip":"Jika pengangka hanyalah pemalar seperti y = 6/(2−x)², lebih cepat menulisnya sebagai 6(2−x)^(-2) dan menggunakan Petua Rantai berbanding Petua Hasil Bahagi."},{"type":"match","xp":15,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Hasil Pembezaan","voiceCaption":"Padankan lima fungsi algebra dan gubahan berikut dengan terbitan pertama dy/dx yang tepat.","voiceScript":"[warm] Jom uji ketangkasan membezakan! Padankan setiap fungsi di sebelah kiri dengan terbitan pertamanya di sebelah kanan.","prompt":"Padankan setiap fungsi y berikut dengan terbitan pertamanya dy/dx:","pairs":[{"id":"d1","left":"y = -(2/3)x^6","right":"-4x^5"},{"id":"d2","left":"y = 9∛x","right":"3 / x^(2/3)"},{"id":"d3","left":"y = 1 / (2x + 3)³","right":"-6 / (2x + 3)^4"},{"id":"d4","left":"y = √(6x² + 8)","right":"6x / √(6x² + 8)"},{"id":"d5","left":"y = x√(x + 3)","right":"3(x + 2) / [2√(x + 3)]"}],"explanation":"Semua terbitan ini terhasil daripada rumus kuasa ax^n, petua rantai (Contoh 7) dan petua hasil darab (Contoh 9)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s5","voiceToneLabel":"Uji Petua Hasil Bahagi","voiceCaption":"Cari nilai pemalar r jika d/dx[(2x − 3)/(x + 5)] = r / (x + 5)².","voiceScript":"[confident] Uji kemahiran Petua Hasil Bahagi kamu dengan soalan Latihan Kendiri dua perpuluhan lima ini! Bezakan pecahan dua x tolak tiga per x campur lima dan tentukan nilai pemalar r di bahagian pengangka.","prompt":"Diberi d/dx [ (2x − 3) / (x + 5) ] = r / (x + 5)². Apakah nilai pemalar r?","options":["13","7","-13","10"],"correctIndex":0,"explanation":"Dengan petua hasil bahagi: [(x + 5)(2) − (2x − 3)(1)] / (x + 5)² = (2x + 10 − 2x + 3) / (x + 5)² = 13 / (x + 5)². Jadi r = 13."}]},{"id":"addm52-u3","title":"Unit 3: Pembezaan Peringkat Kedua, Tangen & Normal","subtitle":"Subtopik 2.3 & 2.4 (Bhg. A) — Terbitan Kedua d²y/dx², Kecerunan Tangen f'(a) & Persamaan Garis Tangen/Normal","iconType":"scale","iconUrl":"../assets/icons/addm52-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Terbitan Kedua d²y/dx²","voiceCaption":"Terbitan kedua d²y/dx² atau f''(x) diperoleh dengan membezakan fungsi terbitan pertama dy/dx sekali lagi terhadap x.","voiceScript":"[warm] Dalam Subtopik dua perpuluhan tiga, jika kita membezakan fungsi terbitan pertama d y per d x sekali lagi terhadap x, kita memperoleh terbitan kedua yang ditulis sebagai d kuasa dua y per d x kuasa dua atau f double prime x! Terbitan kedua sangat berguna nanti untuk menguji sama ada titik pusingan itu maksimum atau minimum.","title":"2.3 Terbitan Kedua d²y/dx² & f''(x)","acronym":"d²y/dx² = f''(x)","hook":"Beza sekali beri kecerunan f'(x); beza dua kali beri kadar perubahan kecerunan f''(x)!","mediaKey":"addm52_rollercoaster_turning","summary":"Pembezaan peringkat kedua d²y/dx² = d/dx(dy/dx) ialah pembezaan terbitan pertama terhadap x.","bullets":["Contoh 11(a): Jika y = x³ + 4/x² = x³ + 4x^(-2), maka dy/dx = 3x² − 8x^(-3) = 3x² − 8/x³, dan d²y/dx² = 6x + 24x^(-4) = 6x + 24/x^4.","Menyelesaikan Persamaan f'(x) = f''(x) (Contoh 12): Bagi f(x) = x³ + 2x² + 3x + 4, f'(x) = 3x² + 4x + 3 dan f''(x) = 6x + 4; menyamakan kedua-duanya memberi 3x² − 2x − 1 = 0 -> x = −1/3 atau x = 1."],"labId":"addm52_tangent_normal_turning_lab","labTitle":"Simulator Tangen, Normal & Terbitan Kedua","labProps":{"fnKey":"kubik","x":1},"formula":"d²y/dx² = d/dx (dy/dx)   |   f''(x) = d/dx [f'(x)]","examTip":"Jangan kelirukan d²y/dx² dengan (dy/dx)²! d²y/dx² bermaksud pembezaan kedua, bukan mengkuasaduakan terbitan pertama."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Uji Persamaan f'(x) = f''(x)","voiceCaption":"Diberi f(x) = x³ + 2x² + 3x + 4; cari nilai-nilai x apabila f'(x) = f''(x).","voiceScript":"[curious] Cuba selesaikan Contoh dua belas bagi pembezaan peringkat kedua! Diberi f x sama dengan x kuasa tiga tambah dua x kuasa dua tambah tiga x tambah empat. Cari nilai x yang memenuhi persamaan f prima x sama dengan f double prime x!","prompt":"Contoh 12: Diberi f(x) = x³ + 2x² + 3x + 4. Cari nilai-nilai x dengan keadaan f'(x) = f''(x):","options":["x = -1/3 atau x = 1","x = 1/3 atau x = -1","x = -2/3 atau x = 2","x = 0 atau x = 1"],"correctIndex":0,"explanation":"f'(x) = 3x² + 4x + 3 dan f''(x) = 6x + 4. Samakan: 3x² + 4x + 3 = 6x + 4 -> 3x² − 2x − 1 = 0 -> (3x + 1)(x − 1) = 0 -> x = −1/3 atau x = 1."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Persamaan Tangen & Normal","voiceCaption":"Kecerunan tangen ialah m₁ = f'(a), manakala garis normal yang berserenjang dengannya mempunyai kecerunan m₂ = -1 / f'(a).","voiceScript":"[confident] Subtopik dua perpuluhan empat bermula dengan Aplikasi Tangen dan Normal! Tangen ialah garis lurus yang menyentuh lengkung dengan kecerunan m satu sama dengan nilai d y per d x pada titik tersebut. Normal pula ialah garis lurus yang berserenjang sembilan puluh darjah dengan tangen, jadi kecerunan normal m dua ialah negatif satu per m satu mengikut hubungan m satu m dua sama dengan negatif satu!","title":"2.4 Kecerunan Tangen, Persamaan Tangen & Persamaan Normal","acronym":"m₁·m₂ = −1","hook":"Tangen meluncur di permukaan lengkung; normal memotong tegak 90° dengan kecerunan songsang negatif −1/f'(a)!","mediaKey":"addm52_rollercoaster_turning","summary":"Kecerunan tangen pada titik P(a, f(a)) ialah f'(a), manakala kecerunan normal ialah -1/f'(a), lalu kedua-dua persamaan garis dibina menggunakan y - y1 = m(x - x1).","bullets":["Tiga Keadaan Kecerunan: f'(a) > 0 bermaksud kecerunan positif (tangen condong ke kanan); f'(a) < 0 bermaksud kecerunan negatif (condong ke kiri); f'(a) = 0 bermaksud tangen mengufuk.","Contoh 14: Bagi f(x) = x³ − 2x² + 5 di P(2, 5), f'(x) = 3x² − 4x -> m_tangen = f'(2) = 4, maka persamaan tangen ialah y − 5 = 4(x − 2) => y = 4x − 3. Kecerunan normal = −1/4, memberi y − 5 = −(1/4)(x − 2) => 4y + x = 22."],"labId":"addm52_tangent_normal_turning_lab","labTitle":"Teroka Tangen & Normal pada Lengkung Kubik","labProps":{"fnKey":"kubik","x":2},"formula":"Tangen: y − y1 = f'(a)(x − a)   |   Normal: y − y1 = [−1 / f'(a)](x − a)","examTip":"Jika dua garis lurus adalah SELARI, kecerunan keduanya adalah SAMA (m1 = m2). Jika BERSERENJANG, hasil darab kecerunan ialah −1!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Laluan Tangen Kereta","voiceCaption":"Kereta tersasar di titik A pada lengkung jalan y = ½x² − 2x + 2 lalu mengikut garis tangen y = 2x − c; cari koordinat A dan nilai c.","voiceScript":"[curious] Uji kemahiran kamu dengan Contoh lima belas buku teks! Kereta Kumar tergelincir di titik A pada jalan melengkung y sama dengan setengah x kuasa dua tolak dua x campur dua, lalu meluncur mengikut garis tangen y sama dengan dua x tolak c. Cari koordinat titik A dan pemalar c!","hook":"Samakan fungsi kecerunan jalan dy/dx dengan kecerunan garis tangen y = 2x - c!","scenario":"Contoh 15: Lengkung jalan raya y = ½x² − 2x + 2 mempunyai garis tangen y = 2x − c pada titik A.","prompt":"Apakah koordinat titik A dan nilai pemalar c?","options":["A(4, 2) dan c = 6","A(2, 0) dan c = 4","A(4, 6) dan c = 2","A(6, 8) dan c = 4"],"correctIndex":0,"proofLabId":"addm52_tangent_normal_turning_lab","proofState":{"fnKey":"kubik","x":3},"explanation":"dy/dx = x − 2. Oleh sebab kecerunan tangen y = 2x − c ialah 2, maka x − 2 = 2 -> x = 4. Pada lengkung, y = ½(16) − 2(4) + 2 = 2, jadi A(4, 2). Gantikan (4, 2) ke dalam y = 2x − c: 2 = 8 − c -> c = 6."},{"type":"sort","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Isih Sifat Kecerunan & Garis","voiceCaption":"Kelaskan pernyataan berikut kepada sifat Kecerunan Positif/Sifar/Negatif atau Persamaan Normal.","voiceScript":"[confident] Asingkan pernyataan geometri tangen dan normal berikut ke dalam dua kategori yang tepat!","prompt":"Isihkan pernyataan berikut kepada kategori Tangen atau Normal:","buckets":[{"id":"tangen","label":"Sifat Garis Tangen"},{"id":"normal","label":"Sifat Garis Normal"}],"items":[{"text":"Kecerunannya pada x = a ialah nilai f'(a)","bucketId":"tangen","note":"Fungsi kecerunan f'(x) memberikan kecerunan tangen secara langsung."},{"text":"Garisnya mengufuk apabila f'(a) = 0","bucketId":"tangen","note":"Apabila dy/dx = 0, tangen sejajar dengan paksi-x."},{"text":"Berserenjang 90° dengan garis tangen pada titik sentuh","bucketId":"normal","note":"Normal memotong tegak garis tangen di titik sentuh."},{"text":"Kecerunannya ialah -1 / f'(a) dengan syarat f'(a) bukan sifar","bucketId":"normal","note":"Menggunakan hubungan garis serenjang m1 × m2 = -1."}],"explanation":"Tangen berkecerunan f'(a) manakala normal berserenjang dengan tangen berkecerunan −1/f'(a)."}]},{"id":"addm52-u4","title":"Unit 4: Titik Pusingan, Lengkok Balas & Masalah Maks/Min","subtitle":"Subtopik 2.4 (Bhg. B) — Titik Pegun (dy/dx = 0), Ujian Tanda vs Ujian Terbitan Kedua (d²y/dx²) & Pengoptimuman","iconType":"crown","iconUrl":"../assets/icons/addm52-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Titik Maksimum, Minimum & Lengkok Balas","voiceCaption":"Titik pegun berlaku apabila dy/dx = 0; ujian terbitan kedua d²y/dx² < 0 menandakan maksimum, d²y/dx² > 0 menandakan minimum.","voiceScript":"[warm] Seperti puncak dan lembah pada trek roller coaster, titik pegun di atas suatu lengkung berlaku apabila kecerunan tangen d y per d x sama dengan sifar! Ada tiga jenis titik pegun: titik maksimum apabila d kuasa dua y per d x kuasa dua kurang daripada sifar, titik minimum apabila d kuasa dua y per d x kuasa dua lebih daripada sifar, dan titik lengkok balas yang BUKAN titik pusingan apabila tanda d y per d x tidak berubah langsung melalui titik tersebut!","title":"Titik Pusingan (Maks/Min) vs Titik Lengkok Balas","acronym":"dy/dx=0 • d²y/dx²","hook":"Maksimum apabila terbitan kedua NEGATIF (< 0); Minimum apabila terbitan kedua POSITIF (> 0) — berlawanan dengan naluri biasa!","mediaKey":"addm52_rollercoaster_turning","summary":"Titik pegun diperoleh dengan menyelesaikan dy/dx = 0, dan sifatnya ditentukan sama ada melalui perubahan tanda dy/dx di kiri/kanan titik tersebut atau melalui tanda d²y/dx².","bullets":["Tiga Jenis Titik Pegun (dy/dx = 0): (1) Titik Maksimum: dy/dx berubah + ke −, atau d²y/dx² < 0 (cth. (-2, 25) pada y = 2x³ + 3x² − 12x + 5); (2) Titik Minimum: dy/dx berubah − ke +, atau d²y/dx² > 0 (cth. (1, -2)).","Titik Lengkok Balas (Contoh 17b, y = x^4 − 4x³ + 1 di (0, 1)): dy/dx = 4x²(x−3) memberi dy/dx = 0 dan d²y/dx² = 0 di x = 0. Kerana d²y/dx² = 0, WAJIB uji tanda dy/dx: pada x = -0.1 dan +0.1, dy/dx kekal negatif (- ke 0 ke -), maka (0, 1) ialah titik lengkok balas (bukan titik pusingan)!"],"labId":"addm52_tangent_normal_turning_lab","labTitle":"Peneroka Titik Pusingan & Lengkok Balas","labProps":{"fnKey":"quartik","x":0},"formula":"dy/dx = 0:   Maksimum (d²y/dx² < 0)   |   Minimum (d²y/dx² > 0)   |   d²y/dx² = 0 → Semak Tanda dy/dx","examTip":"Jangan terus menyimpulkan titik lengkok balas hanya kerana d²y/dx² = 0! Wajib bina jadual perubahan tanda dy/dx di kiri dan kanan untuk membuktikannya."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Jejari Optimum Tin Aluminium","voiceCaption":"Kilang membuat tin silinder isi padu 512 cm³ daripada jumlah luas kepingan L = 8j² + 1024/j; cari jejari j untuk luas minimum.","voiceScript":"[curious] Mari selesaikan masalah pengoptimuman kilang dalam Contoh lapan belas! Jumlah luas kepingan aluminium untuk menghasilkan tin berjejari j ialah L sama dengan lapan j kuasa dua tambah seribu dua puluh empat per j. Berapakah jejari j yang meminimumkan penggunaan aluminium?","hook":"Bezakan L terhadap j, samakan dL/dj = 0, kemudian sahkan d²L/dj² > 0!","scenario":"Contoh 18: Jumlah luas permukaan kepingan aluminium tin ialah L = 8j² + 1024/j cm².","prompt":"Berapakah nilai jejari j (dalam cm) supaya jumlah luas permukaan L adalah minimum?","options":["4 cm","8 cm","2 cm","16 cm"],"correctIndex":0,"proofLabId":"addm52_tangent_normal_turning_lab","proofState":{"fnKey":"kubik","x":3},"explanation":"dL/dj = 16j − 1024/j² = 0 -> 16j³ = 1024 -> j³ = 64 -> j = 4 cm. Semakan d²L/dj² = 16 + 2048/4³ = 48 > 0 (minimum disahkan)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Sifat Titik Pegun","voiceCaption":"Kelaskan ciri ujian berikut kepada Titik Maksimum, Titik Minimum atau Titik Lengkok Balas.","voiceScript":"[confident] Asingkan kesemua ciri kecerunan dan terbitan kedua ini ke dalam kategori jenis titik pegun yang betul!","prompt":"Isihkan setiap ciri ujian berikut mengikut jenis titik pegunnya (pada dy/dx = 0):","buckets":[{"id":"maks","label":"Titik Maksimum"},{"id":"min","label":"Titik Minimum"},{"id":"infleksi","label":"Titik Lengkok Balas"}],"items":[{"text":"d²y/dx² < 0 dan kecerunan berubah daripada + kepada -","bucketId":"maks","note":"Lengkung memuncak ke atas lalu mula menurun."},{"text":"d²y/dx² > 0 dan kecerunan berubah daripada - kepada +","bucketId":"min","note":"Lengkung berada di lembah lalu mula menaik."},{"text":"Tanda dy/dx kekal (- ke 0 ke -) apabila x menokok melalui titik pegun","bucketId":"infleksi","note":"Tiada perubahan tanda dy/dx, bukan titik pusingan."},{"text":"Titik (-1, 16) bagi lengkung y = x³ - 3x² - 9x + 11 (d²y/dx² = -12)","bucketId":"maks","note":"Nilai d²y/dx² = 6(-1) - 6 = -12 < 0."},{"text":"Titik (3, -26) bagi lengkung y = x^4 - 4x³ + 1 (d²y/dx² = +36)","bucketId":"min","note":"Nilai d²y/dx² = 12(9) - 24(3) = +36 > 0."}],"explanation":"Titik pusingan merangkumi titik maksimum (d²y/dx² < 0) dan titik minimum (d²y/dx² > 0); titik lengkok balas tiada perubahan tanda dy/dx."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Uji Luas Sektor Maksimum","voiceCaption":"Seutas wayar panjang 80 cm dibentuk menjadi sektor POQ berjejari j cm; cari luas maksimum sektor itu.","voiceScript":"[confident] Selesaikan Latihan Kendiri dua perpuluhan sebelas soalan satu! Wayar sepanjang lapan puluh sentimeter dibengkokkan membentuk satu sektor P O Q. Ungkapkan luas sektor dalam sebutan j sahaja dan cari luas maksimumnya!","prompt":"Seutas wayar panjang 80 cm dibengkokkan membentuk sebuah sektor POQ berjejari j cm dengan luas A = ½j(80 − 2j). Berapakah luas maksimum (dalam cm²) bagi sektor POQ itu?","options":["400 cm²","800 cm²","200 cm²","1600 cm²"],"correctIndex":0,"explanation":"A = 40j − j². Untuk maksimum, dA/dj = 40 − 2j = 0 -> j = 20 cm (d²A/dj² = −2 < 0). Maka luas maksimum A = 40(20) − (20)² = 800 − 400 = 400 cm²."}]},{"id":"addm52-u5","title":"Unit 5: Kadar Perubahan Terhubung & Penghampiran Kecil","subtitle":"Subtopik 2.4 (Bhg. C) — Petua Rantai dy/dt = (dy/dx)(dx/dt), Tokokan/Susutan Kon & Sfera, serta δy ≈ (dy/dx)δx","iconType":"pendulum","iconUrl":"../assets/icons/addm52-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Kadar Perubahan Kuantiti Terhubung","voiceCaption":"Kadar perubahan terhadap masa dihubungkan oleh petua rantai dy/dt = (dy/dx) × (dx/dt); nilai negatif bermaksud kuantiti menyusut.","voiceScript":"[warm] Bahagian akhir Subtopik dua perpuluhan empat menyentuh dua aplikasi kalkulus yang paling kerap ditanya dalam Kertas dua S P M: pertama ialah Kadar Perubahan Terhubung, dan kedua ialah Perubahan Kecil! Untuk kadar perubahan, kita gunakan petua rantai d y per d t sama dengan d y per d x darab d x per d t. Jika jawapan negatif, nyatakan dengan jelas bahawa kuantiti itu menyusut!","title":"Kadar Perubahan Terhubung (dy/dt = dy/dx × dx/dt)","acronym":"dy/dt = dy/dx · dx/dt","hook":"Apabila air mengalir keluar dari bekas kon, guna segi tiga serupa r/R = h/H dahulu untuk membuang pemboleh ubah r!","mediaKey":"addm52_rate_approx","summary":"Apabila dua pemboleh ubah y dan x berubah mengikut masa t dan terhubung melalui y = f(x), kadar perubahan mereka dikaitkan oleh petua rantai dy/dt = (dy/dx) × (dx/dt).","bullets":["Bekas Kon (Contoh 20): Jejari 5 cm, tinggi 12 cm, air keluar pada dV/dt = −4 cm³/s. Guna nisbah segi tiga serupa r/5 = h/12 -> r = 5h/12. Maka V = (25π/432)h³, dV/dh = (25π/144)h². Pada h = 3 cm, dh/dt = −4 ÷ (25π/16) = −64/(25π) = −0.8148 cm/s (menyusut).","Belon Sfera (Contoh 21): I = (4/3)πj³ -> dI/dj = 4πj². Jika dj/dt = 0.5 cm/s pada j = 4 cm, maka dI/dt = 4π(4)²(0.5) = 32π ≈ 100.5 cm³/s (menokok)."],"labId":"addm52_rate_approx_lab","labTitle":"Simulator Kadar Perubahan Kon & Penghampiran","labProps":{"tab":"kadar","h":3},"formula":"dy/dt = (dy/dx) × (dx/dt)   |   Kon Serupa: r / R = h / H","examTip":"Perhatikan kata kunci 'menyusut' atau 'mengalir keluar' — wajib letakkan tanda NEGATIF pada kadar perubahan tersebut semasa mengganti nilai!"},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Susun Langkah Kadar Kon","voiceCaption":"Susun langkah menyelesaikan masalah kadar perubahan kedalaman air dh/dt dalam tangki berbentuk kon.","voiceScript":"[confident] Susun keempat-empat langkah piawai menyelesaikan masalah kadar perubahan tangki kon!","prompt":"Susun langkah mengira kadar perubahan kedalaman air dh/dt dalam bekas berbentuk kon:","answerTokens":["Hubungkan jejari r dengan tinggi h menggunakan segi tiga serupa","Ungkapkan isi padu V dalam sebutan h sahaja","Bezakan V terhadap h untuk memperoleh dV/dh","Gunakan petua rantai dV/dt = dV/dh × dh/dt"],"distractors":["Biarkan kedua-dua pemboleh ubah r dan h semasa membezakan","Kamirkan rumus luas permukaan kon"],"explanation":"Rumus isi padu kon V = 1/3 πr²h mengandungi dua pemboleh ubah (r dan h), maka nisbah segi tiga serupa wajib digunakan terlebih dahulu supaya V hanya bergantung pada h."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Perubahan Kecil & Penghampiran","voiceCaption":"Perubahan kecil dihitung melalui δy ≈ (dy/dx) × δx dan nilai hampir f(x + δx) ≈ y + (dy/dx)δx.","voiceScript":"[confident] Aplikasi kedua ialah Perubahan Kecil dan Penghampiran! Apabila x berubah sedikit sebanyak delta x, perubahan hampir dalam y ialah delta y hampir sama dengan d y per d x darab delta x. Dari situ, nilai hampir f x tambah delta x sama dengan y tambah d y per d x darab delta x. Jika soalan memberi perubahan dalam bentuk peratus seperti tiga peratus, tukar kepada perpuluhan sifar perpuluhan sifar tiga darab nilai asal x terlebih dahulu!","title":"Perubahan Kecil (δy ≈ dy/dx · δx) & Nilai Hampir","acronym":"δy ≈ (dy/dx)δx","hook":"Hitung √4.02 tanpa kalkulator hanya dalam 3 baris dengan menggunakan lengkung rujukan y = √x pada x = 4!","mediaKey":"addm52_rate_approx","summary":"Perubahan hampir δy bagi perubahan kecil δx diberi oleh δy ≈ (dy/dx)δx, manakala nilai hampir fungsi ialah f(x + δx) ≈ f(x) + (dy/dx)δx.","bullets":["Nilai Hampir (Contoh 23): Bagi y = √x, dy/dx = 1/(2√x). Pada x = 4, y = 2, dy/dx = 1/4 dan δx = 4.02 − 4 = 0.02. Maka √4.02 ≈ 2 + (1/4)(0.02) = 2.005.","Peratus Perubahan (Contoh 24): Peratus perubahan dalam x = (δx/x) × 100%, dan peratus perubahan dalam y = (δy/y) × 100%. Jika y = 2x² − 3x + 4 dan x meningkat 3% pada x = 2 (δx = 0.06, y = 6, dy/dx = 5), maka δy ≈ 0.3 dan peratus perubahan y = (0.3/6) × 100% = 5%."],"labId":"addm52_rate_approx_lab","labTitle":"Kalkulator Penghampiran Kecil y = √x","labProps":{"tab":"hampir","dx":0.02},"formula":"δy ≈ (dy/dx) × δx   |   f(x + δx) ≈ y + (dy/dx)δx   |   %Δy = (δy / y) × 100%","examTip":"Untuk mengira nilai hampir bagi pecahan seperti 16 / (2.02)², pilih x = 2 dan δx = +0.02 pada fungsi y = 16/x²."},{"type":"predict","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Ramal Nilai Hampir Pecahan","voiceCaption":"Gunakan y = 16/x² untuk meramal nilai hampir bagi 16 / (2.02)² apabila x berubah daripada 2 kepada 2.02.","voiceScript":"[curious] Cuba selesaikan Latihan Kendiri dua perpuluhan empat belas soalan tiga! Diberi y sama dengan enam belas per x kuasa dua. Menggunakan dy per dx pada x sama dengan dua, tentukan nilai hampir bagi enam belas per dua perpuluhan sifar dua kuasa dua!","hook":"Perhatikan dy/dx bagi y = 16x^(-2) adalah negatif, maka y akan menyusut sedikit dari 4!","scenario":"Diberi y = 16/x², pada x = 2 nilai y = 4 dan δx = 2.02 − 2 = +0.02.","prompt":"Apakah nilai hampir bagi 16 / (2.02)² menggunakan kaedah kalkulus?","options":["3.92","4.08","3.84","3.96"],"correctIndex":0,"proofLabId":"addm52_rate_approx_lab","proofState":{"tab":"hampir","dx":0.02},"explanation":"y = 16x^(-2) -> dy/dx = −32/x³. Pada x = 2, dy/dx = −32/8 = −4. Maka δy ≈ (−4)(0.02) = −0.08. Nilai hampir = 4 + (−0.08) = 3.92."}]},{"id":"addm52-u6","title":"Unit 6 (Boss SPM): Cabaran Master Kalkulus Pembezaan","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Gabungan Had 0/0, Tangga Tergelincir, Bayang-bayang & Peratus Perubahan 3p%","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Had Pemalar k","voiceCaption":"Cari nilai k jika had (x→k) [(9 − x²) / (4 − √(x² + 7))] = 8.","voiceScript":"[excited] Selamat datang ke Peringkat Boss S P M Bab dua! Cabaran pertama daripada Latihan Sumatif soalan satu c: cari nilai k yang positif jika had x menghampiri k bagi sembilan tolak x kuasa dua per empat tolak punca kuasa dua x kuasa dua tambah tujuh sama dengan lapan!","prompt":"Latihan Sumatif Q1(c): Diberi had (x→k) [ (9 − x²) / (4 − √(x² + 7)) ] = 8 dengan keadaan k > 0. Cari nilai k:","options":["k = 3","k = 4","k = 9","k = 2"],"correctIndex":0,"explanation":"Darabkan dengan konjugat [4 + √(x² + 7)]: penyebut menjadi 16 − (x² + 7) = 9 − x², lalu faktor (9 − x²) terhapus! Maka had menjadi 4 + √(k² + 7) = 8 -> √(k² + 7) = 4 -> k² + 7 = 16 -> k² = 9 -> k = 3."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Tangen Selari & Titik Lain","voiceCaption":"Lengkung y = x³ − 4x + 2 mempunyai tangen di x = 2; ramalkan koordinat-x titik lain yang tangennya selari.","voiceScript":"[curious] Cabaran Boss kedua: apabila dua garis tangen pada satu lengkung adalah selari, kecerunan d y per d x di kedua-dua titik adalah sama! Pada lengkung y sama dengan x kuasa tiga tolak empat x campur dua, tangen di x sama dengan dua selari dengan satu lagi titik pada lengkung tersebut. Apakah koordinat x bagi titik kedua itu?","hook":"Cari dy/dx di x = 2, kemudian selesaikan dy/dx = kecerunan itu!","scenario":"Diberi lengkung y = x³ − 4x + 2. Tangen pada titik A (di x = 2) adalah selari dengan tangen pada satu lagi titik B.","prompt":"Apakah koordinat-x bagi titik B tersebut?","options":["x = -2","x = 0","x = -1","x = 1"],"correctIndex":0,"proofLabId":"addm52_tangent_normal_turning_lab","proofState":{"fnKey":"kubik","x":-1},"explanation":"dy/dx = 3x² − 4. Pada x = 2, kecerunan = 3(2)² − 4 = 8. Untuk tangen selari: 3x² − 4 = 8 -> 3x² = 12 -> x² = 4 -> x = 2 atau x = −2. Maka titik lain ialah di x = −2."},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Peratus Susutan 3p%","voiceCaption":"Susun hujah matematik yang membuktikan susutan p% dalam tinggi air kon menyebabkan susutan 3p% dalam isi padu.","voiceScript":"[confident] Soalan Latihan Sumatif enam belas menguji pembuktian algebra bagi peratus perubahan tiga p peratus! Susun langkah pembuktiannya dengan kemas.","prompt":"Susun langkah membuktikan bahawa susutan kecil p% dalam tinggi h pada V = (3/25)πh³ menyebabkan susutan 3p% dalam isi padu V:","answerTokens":["Bezakan V untuk mendapat dV/dh = (9/25)πh²","Gantikan δh = −(p/100)h ke dalam δV ≈ (dV/dh)δh","Ringkaskan δV ≈ −3(p/100) × (3/25)πh³ = −3(p/100)V","Bahagi δV dengan V dan darab 100% mendapat −3p%"],"distractors":["Gantikan δh = +p tanpa membahagi 100","Ambil punca kuasa tiga bagi isi padu V"],"explanation":"Kerana V berkadar terus dengan h³, pemalar eksponen 3 turun sebagai faktor pengali semasa pembezaan, menjadikan peratus perubahan V tepat 3 kali ganda peratus perubahan h."},{"type":"match","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Padan Kadar & Luas Permukaan","voiceCaption":"Padankan lima masalah aplikasi pembezaan Kertas 2 berikut dengan jawapan akhirnya.","voiceScript":"[confident] Uji penguasaan keseluruhan Bab dua kamu dengan memadankan lima jawapan tepat bagi soalan aplikasi Kertas dua!","prompt":"Padankan setiap masalah aplikasi pembezaan dengan nilai jawapan tepatnya:","pairs":[{"id":"m1","left":"Kadar luas permukaan kubus (ds/dt=2, V=8)","right":"48 cm²/s"},{"id":"m2","left":"Jejari sfera jika dV/dt=20π, dj/dt=0.2","right":"5 cm"},{"id":"m3","left":"Kayu 10 m, x=8, dx/dt=3 -> dy/dt","right":"-4 m/s"},{"id":"m4","left":"Kotak terbuka L=75 -> x untuk V maks","right":"5 cm"},{"id":"m5","left":"y = 1/√x, x=4 berubah 2% -> %Δy","right":"-1%"}],"explanation":"Kubus V=8 -> sisi x=2, dL/dt = 12x(dx/dt) = 48. Sfera: 4πj²(0.2)=20π -> j=5. Kayu: x²+y²=100 -> 2x(3)+2y(dy/dt)=0 di x=8, y=6 -> dy/dt=-4. Kotak: V=¼(75x-x³) -> dV/dx=0 di x=5."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss Final: Kadar Luas Segi Tiga POQ","voiceCaption":"Berdasarkan lengkung y = 6x − x² dengan luas segi tiga POQ ialah A = ½(6x² − x³), cari kadar tokokan A apabila x = 2 dan dx/dt = 2.","voiceScript":"[excited] Soalan terakhir Boss S P M daripada Latihan Sumatif lima belas! Luas segi tiga P O Q diberi oleh A sama dengan setengah kali enam x kuasa dua tolak x kuasa tiga. Jika x menokok dua unit per saat, hitung kadar tokokan luas A ketika x sama dengan dua!","prompt":"Latihan Sumatif Q15: Luas segi tiga POQ diberi oleh A = ½(6x² − x³). Diberi x menokok dengan kadar 2 unit/s. Hitung kadar tokokan bagi A apabila x = 2:","options":["12 unit²/s","6 unit²/s","24 unit²/s","-15 unit²/s"],"correctIndex":0,"explanation":"dA/dx = ½(12x − 3x²). Apabila x = 2, dA/dx = ½(24 − 12) = 6. Dengan petua rantai: dA/dt = (dA/dx) × (dx/dt) = 6 × 2 = 12 unit²/s."}]}]};</script>

      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
