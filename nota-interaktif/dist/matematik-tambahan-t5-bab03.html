/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab03","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":3,"title":"Pengamiran","subtitle":"Subtopik 3.1–3.4 KSSM — Antiterbitan Songsangan Pembezaan, Kamiran Tak Tentu ∫ax^n dx + c, Kamiran (ax+b)^n, Kamiran Tentu & 5 Sifat, Luas di Bawah/Antara Lengkung (Paksi-x & Paksi-y), Isi Padu Kisaran 360° & Aplikasi Kejuruteraan/Ekonomi.","estimatedMinutes":36,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t5-bab03-labs.js","coverIcon":"../assets/icons/addm53-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan kamiran tak tentu, luas lengkung dan isi padu kisaran kamu sangat mantap!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Semua batas kamiran dan pemalar c kamu selesaikan tanpa silap!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Ingat untuk menambah pemalar pengamiran c bagi kamiran tak tentu dan membahagi dengan pekali a bagi (ax + b)^n.","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan lima Bab tiga berjaya dikuasai!"},"units":[{"id":"addm53-u1","title":"Unit 1: Pengamiran sebagai Songsangan Pembezaan & Kamiran Tak Tentu","subtitle":"Subtopik 3.1 & 3.2 (Bhg. A) — Antiterbitan ∫f'(x)dx = f(x) serta Rumus ∫a dx = ax + c dan ∫ax^n dx = ax^(n+1)/(n+1) + c","iconType":"formula","iconUrl":"../assets/icons/addm53-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Pengamiran Songsangan Pembezaan","voiceCaption":"Pengamiran ialah proses songsangan bagi pembezaan; jika d/dx[f(x)] = f'(x), maka ∫f'(x) dx = f(x) + c.","voiceScript":"[warm] Selamat datang ke Matematik Tambahan Tingkatan lima, Bab tiga, Pengamiran! Konsep yang diasaskan oleh Cavalieri dan John Wallis ini ialah operasi songsangan kepada pembezaan. Jika pembezaan mencari kadar perubahan daripada fungsi asal, pengamiran pula memulihkan fungsi asal atau antiterbitan daripada fungsi kecerunannya! Untuk kuasa x kuasa n dengan syarat n tidak sama dengan negatif satu, tambah satu pada kuasa dan bahagikan dengan kuasa baharu itu, kemudian wajib tambah pemalar pengamiran c!","title":"3.1–3.2 Antiterbitan & Rumus Kamiran Tak Tentu","acronym":"+1 Kuasa / Kuasa Baharu","hook":"Pembezaan menurunkan kuasa satu tingkat; pengamiran menaikkan kuasa satu tingkat lalu membahagi dengan kuasa baharu itu!","mediaKey":"addm53_antiderivative_hero","summary":"Pengamiran ialah songsangan kepada pembezaan; kamiran tak tentu bagi ax^n terhadap x ialah ax^(n+1)/(n+1) + c untuk semua integer n ≠ -1.","bullets":["Songsangan Pembezaan (3.1): Jika d/dx(4x²) = 8x, maka ∫8x dx = 4x² (+ c). Dalam Contoh 2, jika kadar arang batu berubah daripada dK/dt = 48000 − 300t² kepada 2(48000 − 300t²), maka jisim K = 2(48000t − 100t³).","Rumus Kamiran Tak Tentu (3.2): ∫ a dx = ax + c; ∫ ax^n dx = [ax^(n+1)] / (n + 1) + c (n ≠ -1); dan ∫ [f(x) ± g(x)] dx = ∫ f(x) dx ± ∫ g(x) dx. Hanya satu pemalar pengamiran c diperlukan untuk gabungan semua sebutan."],"labId":"addm53_antiderivative_c_lab","labTitle":"Simulator Keluarga Lengkung & Pemalar c","labProps":{"tab":"family","c":0},"formula":"∫ ax^n dx = ax^(n+1) / (n + 1) + c   (n ≠ −1)   |   ∫ a dx = ax + c","examTip":"Sentiasa kembangkan hasil darab seperti (x−2)(x+6) atau permudahkan pecahan seperti x²(3 + 1/x^5) menjadi sebutan indeks tunggal sebelum mengamir!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Songsangan vs Pengamiran Terus","voiceCaption":"Asingkan ungkapan berikut sama ada boleh dikamir terus sebutan demi sebutan atau perlu dikembangkan/ditukar indeks dahulu.","voiceScript":"[curious] Sebelum mengamirkan sesuatu ungkapan algebra, semak bentuknya dahulu! Asingkan ungkapan yang boleh terus dikamirkan dengan yang wajib dikembangkan atau ditukar ke bentuk indeks negatif.","prompt":"Isihkan setiap kamiran berikut mengikut langkah persediaan sebelum mengamir:","buckets":[{"id":"terus","label":"Kamir Terus Sebutan Demi Sebutan"},{"id":"kemas","label":"Kembang / Tukar Indeks Dahulu"}],"items":[{"text":"∫ (3x² + 2) dx","bucketId":"terus","note":"Sudah berbentuk polinomial piawai ax^n + pemalar."},{"text":"∫ (x - 2)(x + 6) dx","bucketId":"kemas","note":"Tiada petua hasil darab dalam kamiran KSSM; wajib kembangkan menjadi x² + 4x - 12."},{"text":"∫ x²(3 + 1/x^5) dx","bucketId":"kemas","note":"Kembangkan dan tukar menjadi 3x² + x^(-3) dahulu."},{"text":"∫ (4x² + 5x) dx","bucketId":"terus","note":"Boleh terus kamirkan setiap sebutan secara berasingan."}],"explanation":"Berbeza daripada pembezaan, tiada petua hasil darab atau hasil bahagi mudah di sini — kembangkan dan tukar pecahan kepada indeks negatif terlebih dahulu."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Kamiran Kembang & Pecahan","voiceCaption":"Ramalkan hasil kamiran tak tentu bagi ∫ x²(3 + 1/x^5) dx.","voiceScript":"[curious] Cuba selesaikan Contoh lima c! Kembangkan x kuasa dua darab tiga campur satu per x kuasa lima, tukarkan pecahan kepada indeks negatif, kemudian kamirkan terhadap x!","hook":"Ingat: kamiran bagi x^(-3) menaikkan kuasa kepada (-3 + 1) = -2!","scenario":"Contoh 5(c): Cari kamiran tak tentu bagi ∫ x²(3 + 1/x^5) dx.","prompt":"Apakah hasil kamiran tak tentu yang betul?","options":["x³ − 1/(2x²) + c","x³ + 1/(2x²) + c","3x³ − 1/(4x^4) + c","x³ − 3/x^4 + c"],"correctIndex":0,"proofLabId":"addm53_antiderivative_c_lab","proofState":{"tab":"family","c":2},"explanation":"x²(3 + 1/x^5) = 3x² + x^(-3). Kamirkan: 3x³/3 + x^(-2)/(-2) + c = x³ − 1/(2x²) + c."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Uji Songsangan Pembezaan","voiceCaption":"Diberi d/dx[(5x+2)/(2−3x)] atau fungsi gubahan, gunakan hubungan songsangan untuk mencari nilai kamiran.","voiceScript":"[confident] Uji kemahiran Subtopik tiga perpuluhan satu daripada Latihan Formatif! Diberi y sama dengan tiga darab dua x tambah dua kuasa tiga. Jika pembezaannya ialah lapan belas darab dua x tambah dua kuasa dua, apakah kamiran bagi lapan belas darab dua x tambah dua kuasa dua?","prompt":"Latihan Formatif 3.1 Q1: Diberi y = 3(2x + 2)³, maka dy/dx = 18(2x + 2)². Tanpa mengira semula dari awal, cari ∫ [18(2x + 2)²] dx:","options":["3(2x + 2)³ + c","6(2x + 2)³ + c","18(2x + 2)³ + c","(2x + 2)³ + c"],"correctIndex":0,"explanation":"Mengikut prinsip songsangan pembezaan, kerana d/dx[3(2x + 2)³] = 18(2x + 2)², maka antiterbitan ∫ 18(2x + 2)² dx terus memulangkan 3(2x + 2)³ + c."}]},{"id":"addm53-u2","title":"Unit 2: Pemalar c, Persamaan Lengkung & Penggantian (ax+b)^n","subtitle":"Subtopik 3.2 (Bhg. B) — Mencari Persamaan Lengkung daripada dy/dx dan Titik (x, y) serta Kaedah Penggantian ∫(ax+b)^n dx","iconType":"book","iconUrl":"../assets/icons/addm53-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Pemalar c & Kamiran (ax+b)^n","voiceCaption":"Kamiran bagi (ax + b)^n ialah [(ax + b)^(n+1)] / [a(n + 1)] + c; nilai pemalar c ditentukan dengan menggantikan koordinat titik pada lengkung.","voiceScript":"[warm] Mengapa pemalar pengamiran c sangat penting? Kerana fungsi kecerunan d y per d x yang sama menghasilkan keluarga lengkung yang selari secara menegak! Dengan menggantikan koordinat satu titik yang dilalui oleh lengkung ke dalam y sama dengan kamiran d y per d x, kita dapat mengunci nilai c yang tepat! Dan bagi ungkapan linear berkuasa seperti tiga x tambah lima kuasa lima, gunakan kaedah penggantian untuk mendapat satu per a kali n tambah satu di bahagian penyebut!","title":"Persamaan Lengkung (Pemalar c) & Kamiran Fungsi (ax + b)^n","acronym":"÷ a(n+1) • Ganti Titik","hook":"Fungsi kecerunan hanya memberi bentuk lengkung; koordinat satu titiklah yang mengunci kedudukan tepat pemalar c!","mediaKey":"addm53_antiderivative_hero","summary":"Kaedah penggantian membolehkan pengamiran bentuk (ax + b)^n dilakukan terus, manakala pemalar c diperoleh dengan menggantikan koordinat titik yang diberi.","bullets":["Kamiran Bentuk (ax + b)^n (Contoh 6 & 7): ∫ (ax + b)^n dx = (ax + b)^(n+1) / [a(n + 1)] + c (n ≠ -1). Contoh: ∫ (3x + 5)^5 dx = (3x + 5)^6 / [3(6)] + c = (3x + 5)^6 / 18 + c; dan ∫ 3/(5x − 3)^6 dx = −3 / [25(5x − 3)^5] + c.","Mencari Persamaan Lengkung: Jika fungsi kecerunan dy/dx = 3x² − 8x dan lengkung melalui A(1, −1), kamirkan mendapat y = x³ − 4x² + c. Ganti (1, −1): −1 = 1 − 4 + c -> c = 2, maka y = x³ − 4x² + 2."],"labId":"addm53_antiderivative_c_lab","labTitle":"Workbench Penggantian (ax+b)^n & Pemalar c","labProps":{"tab":"sub","c":2},"formula":"∫ (ax + b)^n dx = (ax + b)^(n+1) / [a(n + 1)] + c   |   y = ∫ (dy/dx) dx","examTip":"Awas apabila soalan memberi kecerunan NORMAL (cth. 1/(6x−2)): tukar dahulu kepada kecerunan lengkung dy/dx = −(6x−2) = 2 − 6x sebelum mengamir!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kamiran Punca Kuasa (ax+b)","voiceCaption":"Ramalkan hasil kamiran tak tentu bagi ∫ √(5x + 2) dx menggunakan kaedah penggantian u = 5x + 2.","voiceScript":"[curious] Cuba selesaikan Contoh enam b! Kamirkan punca kuasa dua lima x tambah dua terhadap x. Tukar punca kuasa kepada kuasa setengah, naikkan kuasa kepada tiga per dua, dan jangan lupa bahagi dengan pekali lima!","hook":"Bahagi dengan (5 × 3/2) = 15/2 adalah sama dengan mendarab pecahan dengan 2/15!","scenario":"Contoh 6(b): Tentukan ∫ √(5x + 2) dx dengan kaedah penggantian.","prompt":"Apakah hasil kamiran tak tentu bagi ∫ √(5x + 2) dx?","options":["(2/15)(5x + 2)^(3/2) + c","(2/3)(5x + 2)^(3/2) + c","(10/3)(5x + 2)^(3/2) + c","(1/15)(5x + 2)^(3/2) + c"],"correctIndex":0,"proofLabId":"addm53_antiderivative_c_lab","proofState":{"tab":"sub"},"explanation":"∫ (5x + 2)^(1/2) dx = (5x + 2)^(3/2) / [5 × (3/2)] + c = (2/15)(5x + 2)^(3/2) + c."},{"type":"match","xp":15,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Kamiran Bentuk (ax+b)^n","voiceCaption":"Padankan lima kamiran tak tentu berikut dengan antiterbitan tepatnya.","voiceScript":"[warm] Padankan setiap kamiran tak tentu fungsi linear berkuasa ini dengan jawapan tepat masing-masing!","prompt":"Padankan setiap kamiran tak tentu berikut dengan hasil tepatnya:","pairs":[{"id":"k1","left":"∫ (2 − 3x)^4 dx","right":"-(2 − 3x)^5 / 15 + c"},{"id":"k2","left":"∫ 1 / √(5 − 2x) dx","right":"-√(5 − 2x) + c"},{"id":"k3","left":"∫ 3 / (5x − 3)^6 dx","right":"-3 / [25(5x − 3)^5] + c"},{"id":"k4","left":"∫ (5 − 6x)³ dx","right":"-(5 − 6x)^4 / 24 + c"},{"id":"k5","left":"∫ (3x + 5)^5 dx","right":"(3x + 5)^6 / 18 + c"}],"explanation":"Setiap satu menggunakan rumus (ax + b)^(n+1) / [a(n + 1)] + c; perhatikan tanda negatif apabila pekali a bagi x adalah negatif (seperti -3, -2 dan -6)."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Uji Kecerunan Normal ke Lengkung","voiceCaption":"Kecerunan normal suatu lengkung ialah 1/(6x − 2) dan ia melalui titik (2, 2); cari persamaan lengkung.","voiceScript":"[confident] Ini soalan perangkap klasik Latihan Formatif tiga perpuluhan dua soalan enam! Kecerunan normal kepada lengkung ialah satu per enam x tolak dua. Jangan terus kamirkan kecerunan normal — tukarkan kepada kecerunan tangen d y per d x dahulu, kemudian guna titik dua koma dua untuk mencari pemalar c!","prompt":"Latihan Formatif 3.2 Q6: Kecerunan normal bagi suatu lengkung ialah 1 / (6x − 2) dan lengkung melalui titik (2, 2). Apakah persamaan lengkung itu?","options":["y = −3x² + 2x + 10","y = 3x² − 2x − 6","y = −3x² + 2x − 10","y = 6x² − 2x − 18"],"correctIndex":0,"explanation":"m_tangen = dy/dx = −1 / m_normal = −(6x − 2) = −6x + 2. Kamirkan: y = −3x² + 2x + c. Ganti (2, 2): 2 = −3(4) + 2(2) + c = −8 + c -> c = 10. Jadi y = −3x² + 2x + 10."}]},{"id":"addm53-u3","title":"Unit 3: Kamiran Tentu & 5 Sifat Asas Kamiran Tentu","subtitle":"Subtopik 3.3 (Bhg. A) — Penilaian [g(x)]_a^b = g(b) − g(a) serta Lima Sifat Pengamiran Tentu","iconType":"scale","iconUrl":"../assets/icons/addm53-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kamiran Tentu & 5 Sifatnya","voiceCaption":"Kamiran tentu ∫_a^b f(x) dx = g(b) − g(a) melenyapkan pemalar c dan mematuhi lima sifat penggabungan serta pembalikan had.","voiceScript":"[warm] Sekarang kita melangkah ke Subtopik tiga perpuluhan tiga, Kamiran Tentu! Apabila pengamiran mempunyai batas bawah a dan batas atas b, pemalar c akan saling terhapus semasa penolakan g b tolak g a! Di samping itu, ada lima sifat kamiran tentu yang wajib dikuasai untuk soalan Kertas satu: kamiran dari a ke a ialah sifar, menukar posisi had a dan b menukar tanda menjadi negatif, dan selang a ke c boleh dipecahkan kepada a ke b campur b ke c!","title":"3.3 Penilaian Kamiran Tentu & 5 Sifat Asasnya","acronym":"g(b) − g(a) • 5 Sifat","hook":"Terbalikkan batas atas dan bawah? Letak tanda negatif di hadapan! Batas bawah sama dengan batas atas? Jawapan terus 0!","mediaKey":"addm53_bakun_area","summary":"Kamiran tentu menilai luas bertanda antara batas x = a hingga x = b menggunakan g(b) − g(a) serta lima sifat kelinearan dan selang.","bullets":["Penilaian Kamiran Tentu (Contoh 10 & 11): ∫_a^b f(x) dx = [g(x)]_a^b = g(b) − g(a). Contoh: ∫_2^4 (2x − 5)^4 dx = [(2x − 5)^5 / 10]_2^4 = 243/10 − (−1/10) = 244/10 = 122/5.","5 Sifat Kamiran Tentu: (a) ∫_a^a f(x) dx = 0; (b) ∫_a^b f(x) dx = −∫_b^a f(x) dx; (c) ∫_a^b k f(x) dx = k ∫_a^b f(x) dx; (d) ∫_a^b f(x) dx + ∫_b^c f(x) dx = ∫_a^c f(x) dx; (e) ∫_a^b [f(x) ± g(x)] dx = ∫_a^b f(x) dx ± ∫_a^b g(x) dx."],"labId":"addm53_riemann_area_lab","labTitle":"Simulator Jalur Riemann & Kamiran Tentu","labProps":{"mode":"riemann","n":8},"formula":"∫_a^b f(x) dx = g(b) − g(a)   |   ∫_a^b f = −∫_b^a f   |   ∫_a^b f + ∫_b^c f = ∫_a^c f","examTip":"Dalam soalan seperti ∫_2^5 [h f(x) − 3] dx = 51, asingkan pemalar −3 daripada f(x): h ∫_2^5 f(x) dx − [3x]_2^5 = 51. Jangan lupa mengamirkan nombor −3 menjadi −3x!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Nilai Pemalar h dalam Kamiran","voiceCaption":"Diberi ∫_2^5 f(x) dx = 12 dan ∫_2^5 [h f(x) − 3] dx = 51; ramalkan nilai h.","voiceScript":"[curious] Cuba selesaikan Contoh tiga belas buku teks! Diberi kamiran f x dari dua hingga lima ialah dua belas, dan kamiran h f x tolak tiga dari dua hingga lima ialah lima puluh satu. Awas: angka tiga turut dikamirkan dari dua hingga lima! Berapakah nilai h?","hook":"Kira ∫_2^5 3 dx = [3x]_2^5 = 15 − 6 = 9 terlebih dahulu!","scenario":"Contoh 13: Diberi ∫_2^5 f(x) dx = 12 dan ∫_2^5 [h f(x) − 3] dx = 51.","prompt":"Berapakah nilai pemalar h?","options":["h = 5","h = 4","h = 4.5","h = 6"],"correctIndex":0,"proofLabId":"addm53_riemann_area_lab","proofState":{"mode":"riemann","n":24},"explanation":"h ∫_2^5 f(x) dx − ∫_2^5 3 dx = 51 -> 12h − [3(5) − 3(2)] = 51 -> 12h − 9 = 51 -> 12h = 60 -> h = 5."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Prinsip Had Jalur Riemann","voiceCaption":"Susun pernyataan yang menghubungkan jumlah luas jalur segi empat tepat dengan kamiran tentu ∫_a^b y dx.","voiceScript":"[confident] Lengkapkan perkaitan antara hasil tambah luas jalur segi empat tepat dengan kamiran tentu luas di bawah lengkung!","prompt":"Susun blok perkataan untuk menjelaskan makna geometri kamiran tentu ∫_a^b y dx:","answerTokens":["Apabila bilangan jalur segi empat tepat","menokok menuju ketakterhinggaan","lebar setiap jalur δx menghampiri sifar","dan hasil tambah luas menghampiri ∫_a^b y dx"],"distractors":["lebar setiap jalur δx menjadi semakin besar","pemalar pengamiran c ditambah dua kali"],"explanation":"Mengikut Aktiviti Penerokaan 4, luas di bawah lengkung ialah had apabila δx → 0 bagi Σ y_i δx = ∫_a^b y dx."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Uji Gabungan Sifat Kamiran Tentu","voiceCaption":"Diberi ∫_0^4 f(x) dx = 4 dan ∫_1^v g(x) dx = 3; cari nilai ∫_0^2 f(x) dx − ∫_4^2 f(x) dx.","voiceScript":"[confident] Uji ketajaman mata kamu pada tanda dan batas soalan Latihan Sumatif lima a! Kamiran dari sifar ke dua tolak kamiran dari empat ke dua — perhatikan tanda tolak itu boleh membalikkan batas empat ke dua menjadi dua ke empat!","prompt":"Latihan Sumatif Q5(a): Diberi ∫_0^4 f(x) dx = 4. Hitung nilai bagi ∫_0^2 f(x) dx − ∫_4^2 f(x) dx:","options":["4","-4","0","8"],"correctIndex":0,"explanation":"Menggunakan sifat pembalikan batas: −∫_4^2 f(x) dx = +∫_2^4 f(x) dx. Maka ∫_0^2 f(x) dx + ∫_2^4 f(x) dx = ∫_0^4 f(x) dx = 4."}]},{"id":"addm53-u4","title":"Unit 4: Luas di Bawah Lengkung & Antara Dua Lengkung","subtitle":"Subtopik 3.3 (Bhg. B) — Luas Paksi-x (Atas +ve / Bawah -ve), Luas Paksi-y (Kanan +ve / Kiri -ve) & Antara Lengkung","iconType":"graph","iconUrl":"../assets/icons/addm53-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Luas Paksi-x & Paksi-y","voiceCaption":"Luas di bawah paksi-x atau di kiri paksi-y menghasilkan nilai kamiran negatif, tetapi nilai luas sentiasa positif dan mesti dikamirkan berasingan.","voiceScript":"[warm] Ini antara konsep terpenting dalam S P M: mengira luas rantau! Jika rantau terletak di bawah paksi x, hasil kamiran tentu kamiran y d x adalah negatif; maka ambil nilai mutlaknya dan sentiasa pecahkan kamiran jika lengkung melintas paksi x! Begitu juga bagi paksi y dengan kamiran x d y: rantau di kanan paksi y bernilai positif, manakala rantau di kiri paksi y bernilai negatif!","title":"Luas Rantau Paksi-x (∫ y dx) & Paksi-y (∫ x dy)","acronym":"|Atas| + |Bawah|","hook":"Jangan sekali-kali kamir terus merentas pintasan paksi — bahagian atas (+) dan bawah (−) akan saling membatalkan!","mediaKey":"addm53_bakun_area","summary":"Luas dengan paksi-x menggunakan ∫ y dx manakala luas dengan paksi-y menggunakan ∫ x dy; setiap rantau bertanda negatif mesti diasingkan dan dijadikan positif.","bullets":["Paksi-x (Contoh 15, y = 2x² − 6x dari 0 ke 6): Lengkung memintas paksi-x di x = 3. Rantau A [0, 3] di bawah paksi-x memberi ∫_0^3 = −9 (Luas = 9). Rantau B [3, 6] di atas memberi ∫_3^6 = +45. Jumlah Luas = 9 + 45 = 54 unit².","Paksi-y (Contoh 17, x = y(y−2)(y−5)): Memintas paksi-y di y = 0, 2, 5. Rantau A [0, 2] di kanan paksi-y = +16/3; Rantau B [2, 5] di kiri paksi-y = −63/4 (Luas = 63/4). Jumlah Luas = 16/3 + 63/4 = 253/12 unit²."],"labId":"addm53_riemann_area_lab","labTitle":"Simulator Atas vs Bawah Paksi & Dua Lengkung","labProps":{"mode":"sign"},"formula":"Paksi-x: L = ∫_a^b y dx   |   Paksi-y: L = ∫_a^b x dy   (Luas sentiasa > 0)","examTip":"Tanda negatif pada kamiran cuma penunjuk kedudukan (bawah paksi-x atau kiri paksi-y). Tukar kepada nilai positif sebelum menjumlahkan luas!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Tanda & Rumus Luas","voiceCaption":"Padankan kedudukan rantau pada satah Cartes dengan tanda kamiran dan rumus yang betul.","voiceScript":"[confident] Padankan kelima-lima kedudukan rantau di bawah lengkung ini dengan sifat dan rumus pengiraannya!","prompt":"Padankan setiap kedudukan rantau dengan ciri atau rumus pengamiran yang tepat:","pairs":[{"id":"a1","left":"Rantau di atas paksi-x [a, b]","right":"∫_a^b y dx bernilai positif"},{"id":"a2","left":"Rantau di bawah paksi-x [a, b]","right":"∫_a^b y dx bernilai negatif; ambil |nilai|"},{"id":"a3","left":"Rantau di kanan paksi-y [c, d]","right":"∫_c^d x dy bernilai positif"},{"id":"a4","left":"Rantau di kiri paksi-y [c, d]","right":"∫_c^d x dy bernilai negatif; ambil |nilai|"},{"id":"a5","left":"Rantau antara y=x² dan y=2x−x²","right":"∫_0^1 (2x − 2x²) dx"}],"explanation":"Kamiran terhadap x positif di atas paksi-x dan negatif di bawahnya; kamiran terhadap y positif di kanan paksi-y dan negatif di kirinya."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Luas Antara Garis & Dua Lengkung","voiceCaption":"Luas antara dua lengkung atau antara lengkung dengan garis lurus ialah ∫_a^b [fungsi atas − fungsi bawah] dx.","voiceScript":"[confident] Apabila rantau berlorek diapit oleh dua lengkung atau satu lengkung dengan garis lurus seperti Contoh lapan belas dan dua puluh, cari dahulu titik persilangan kedua-dua graf untuk mendapatkan batas kamiran a dan b! Kemudian kamirkan fungsi yang berada di atas tolak fungsi yang berada di bawah — ataupun gunakan luas bentuk geometri seperti segi tiga atau trapezium jika lebih pantas!","title":"Luas Antara Lengkung, Garis Lurus & Dua Lengkung","acronym":"Atas − Bawah","hook":"Cari persilangan dahulu untuk batas [a, b], kemudian tolakkan fungsi bawah daripada fungsi atas!","mediaKey":"addm53_bakun_area","summary":"Luas rantau terkurung antara dua graf diperoleh dengan menyamakan kedua-dua persamaan bagi mencari titik persilangan, lalu mengamirkan beza fungsi atas dan bawah.","bullets":["Lengkung & Garis (Contoh 18): y = −x² + 2x + 8 bersilang dengan y = x + 2 di x = −2 dan x = 3. Luas = ∫_{-2}^3 [(−x² + 2x + 8) − (x + 2)] dx = ∫_{-2}^3 (−x² + x + 6) dx = 125/6 unit².","Dua Lengkung (Contoh 20): y = x^(1/3) bersilang dengan y = x² di (0, 0) dan (1, 1). Dalam [0, 1], x^(1/3) > x², maka Luas = ∫_0^1 (x^(1/3) − x²) dx = [3/4 x^(4/3) − 1/3 x³]_0^1 = 5/12 unit²."],"labId":"addm53_riemann_area_lab","labTitle":"Peneroka Luas Antara Dua Lengkung","labProps":{"mode":"between"},"formula":"L = ∫_a^b [g(x) − f(x)] dx   (dengan g(x) ≥ f(x) pada [a, b])","examTip":"Jika rantau mempunyai bucu segi tiga atau sisi tegak bersama garis lurus, menyemak atau memisahkan kepada Luas Trapezium/Segi Tiga − Kamiran Lengkung sering mengurangkan kesilapan algebra!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Luas Lengkung & Garis","voiceCaption":"Garis y = ½x + 6 bersilang dengan lengkung y = ½x² + 3; ramalkan luas rantau terkurung.","voiceScript":"[curious] Cuba selesaikan Contoh sembilan belas buku teks! Garis lurus y sama dengan setengah x tambah enam bersilang dengan lengkung kuadratik y sama dengan setengah x kuasa dua tambah tiga. Cari titik persilangannya dahulu dan kira luas rantau di antara keduanya!","hook":"Samakan ½x² + 3 = ½x + 6 -> x² − x − 6 = 0 untuk batas kamiran!","scenario":"Contoh 19: Rantau berlorek dibatasi oleh garis lurus y = ½x + 6 (atas) dan lengkung y = ½x² + 3 (bawah).","prompt":"Berapakah luas rantau terkurung antara garis lurus dan lengkung tersebut?","options":["125/12 unit²","125/6 unit²","25/4 unit²","64/3 unit²"],"correctIndex":0,"proofLabId":"addm53_riemann_area_lab","proofState":{"mode":"between"},"explanation":"Persilangan: x² − x − 6 = 0 -> x = −2, x = 3. Luas = ∫_{-2}^3 (½x − ½x² + 3) dx = [x²/4 − x³/6 + 3x]_{-2}^3 = (9/4 − 27/6 + 9) − (1 + 8/6 − 6) = 27/4 − (−11/3) = 125/12 unit²."}]},{"id":"addm53-u5","title":"Unit 5: Isi Padu Kisaran 360° & Aplikasi Pengamiran","subtitle":"Subtopik 3.3 (Bhg. C) & 3.4 — Bongkah Kisaran ∫πy² dx dan ∫πx² dy, Mangkuk Parabola, Bakteria & Ekonomi","iconType":"atom","iconUrl":"../assets/icons/addm53-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Isi Padu Kisaran 360°","voiceCaption":"Isi padu janaan apabila rantau dikisarkan 360° pada paksi-x ialah ∫_a^b πy² dx, dan pada paksi-y ialah ∫_a^b πx² dy.","voiceScript":"[warm] Bagaimana pula apabila satu rantau rata diputarkan tiga ratus enam puluh darjah mengelilingi paksi x atau paksi y seperti tanglung kertas? Ia membentuk bongkah tiga dimensi! Bayangkan bongkah itu dihiris menjadi cakera silinder nipis berjejari y dan tebal delta x: isi padu setiap cakera ialah pi y kuasa dua delta x! Maka isi padu janaan pada paksi x ialah kamiran pi y kuasa dua d x, manakala pada paksi y ialah kamiran pi x kuasa dua d y!","title":"Isi Padu Bongkah Kisaran 360° (Paksi-x & Paksi-y)","acronym":"∫πy²dx • ∫πx²dy","hook":"Hafal padanan bertentangan: pusing pada paksi-x guna y² dx; pusing pada paksi-y guna x² dy!","mediaKey":"addm53_solid_revolution","videoClip":{"src":"../assets/matematik-tambahan-t5-bab03/video/addm53_video_pengamiran_kisaran_narasi.mp4","hasNarration":true,"posterKey":"addm53_solid_revolution","caption":"Pengamiran tentu bagi luas di bawah lengkung dan isi padu janaan kisaran 360 darjah."},"summary":"Kisaran penuh 360° mengelilingi paksi-x menjana isi padu ∫_a^b πy² dx, manakala mengelilingi paksi-y menjana ∫_a^b πx² dy.","bullets":["Kisaran Paksi-x vs Paksi-y: Pada paksi-x, V = π ∫_a^b y² dx (jangan lupa kuasaduakan y sebelum mengamir!). Pada paksi-y, V = π ∫_a^b x² dy (ungkapkan x² dalam sebutan y dahulu).","Contoh 24 (Mangkuk Parabola y = ax², diameter 12 cm, dalam 2 cm): Pada tepi mangkuk, x = 6 dan y = 2 -> a = 2/36 = 1/18, maka x² = 18y. Kisaran 360° pada paksi-y: V = π ∫_0^2 18y dy = π [9y²]_0^2 = 36π cm³."],"labId":"addm53_volume_revolution_lab","labTitle":"Simulator Bongkah Kisaran 360° (Paksi-x & Paksi-y)","labProps":{"axis":"y","b":2},"formula":"Paksi-x: V = ∫_a^b π y² dx   |   Paksi-y: V = ∫_a^b π x² dy","examTip":"Jika soalan meminta kisaran 180° sahaja (seperti Latihan Sumatif Q13c), ambil SEPARUH (½) daripada hasil rumus kisaran 360°!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Ramal Isi Padu Mangkuk Parabola","voiceCaption":"Ramalkan isi padu janaan dalam sebutan π bagi y = √x yang dikisarkan 360° pada paksi-x dari x = 0 hingga x = 4.","voiceScript":"[curious] Cuba selesaikan latihan pengiraan isi padu kisaran ini! Lengkung y sama dengan punca kuasa dua x dikisarkan tiga ratus enam puluh darjah mengelilingi paksi x dari x sifar hingga x empat. Berapakah isi padu janaannya dalam sebutan pi?","hook":"Kerana y = √x, nilai y² hanyalah x!","scenario":"Rantau di bawah lengkung y = √x dari x = 0 hingga x = 4 diputarkan 360° pada paksi-x.","prompt":"Berapakah isi padu bongkah janaan (dalam sebutan π)?","options":["8π unit³","16π unit³","4π unit³","32π unit³"],"correctIndex":0,"proofLabId":"addm53_volume_revolution_lab","proofState":{"axis":"x","b":4},"explanation":"V = π ∫_0^4 (√x)² dx = π ∫_0^4 x dx = π [x² / 2]_0^4 = π(16/2 − 0) = 8π unit³."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Aplikasi Koloni Bakteria & Ekonomi","voiceCaption":"Pengamiran menentukan jumlah populasi bakteria daripada kadar luas dA/dt serta lebihan pengguna dan pengeluar.","voiceScript":"[confident] Dalam Subtopik tiga perpuluhan empat, pengamiran digunakan dalam biologi, kejuruteraan dan ekonomi! Dalam Contoh dua puluh lima, kadar pertambahan luas koloni bakteria ialah d A per d t sama dengan dua t tambah lima. Mengamirkan dari t sifar hingga t lima memberi luas lima puluh sentimeter persegi, lalu didarab sejuta sel menjadi lima darab sepuluh kuasa tujuh sel!","title":"3.4 Aplikasi Kejuruteraan, Biologi & Ekonomi","acronym":"∫ Kadar = Jumlah","hook":"Kamiran tentu bagi sebarang fungsi kadar perubahan memberi jumlah pertambahan bersih sepanjang tempoh masa tersebut!","mediaKey":"addm53_solid_revolution","summary":"Pengamiran tentu menyelesaikan masalah biologi (pertumbuhan bakteria), pengisian tangki air dan analisis pasaran ekonomi (titik keseimbangan, lebihan pengguna dan pengeluar).","bullets":["Koloni Bakteria (Contoh 25): dA/dt = 2t + 5 -> Luas selepas 5 s ialah ∫_0^5 (2t + 5) dt = [t² + 5t]_0^5 = 50 cm². Bilangan sel = 50 × 1 000 000 = 5 × 10^7 sel.","Lebihan Pengguna & Pengeluar (Sumatif Q8): Samakan keluk permintaan d(x) dengan penawaran s(x) untuk titik keseimbangan P(x0, y0). Lebihan pengguna = ∫_0^x0 d(x) dx − x0 y0; Lebihan pengeluar = x0 y0 − ∫_0^x0 s(x) dx."],"labId":"addm53_aplikasi_pengamiran_lab","labTitle":"Simulator Aplikasi Biologi, Tangki & Ekonomi","labProps":{"tab":"bakteria"},"formula":"ΔKuantiti = ∫_t1^t2 (dQ/dt) dt   |   Lebihan Pengguna = ∫_0^x0 d(x) dx − x0 y0","examTip":"Untuk isi padu antara garis condong dan lengkung (seperti bongkah berongga), tolakkan isi padu kon atau silinder dalaman daripada isi padu lengkung luar!"},{"type":"mcq","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Uji Pengisian Kolam Encik Razak","voiceCaption":"Kadar pengisian kolam renang ialah dV/dt = 3t² + 14t selama 5 jam dengan kedalaman 1.2 m; kira isi padu dan luas dasar kolam.","voiceScript":"[confident] Cuba selesaikan Latihan Sumatif lima belas! Kadar pengisian air kolam Encik Razak ialah d V per d t sama dengan tiga t kuasa dua campur empat belas t selama lima jam. Jika kedalaman sekata kolam ialah satu perpuluhan dua meter dan kos cat dasar ialah lima ringgit per meter persegi, cukupkah bajet seribu ringgit?","prompt":"Latihan Sumatif Q15: Kadar pengisian kolam ialah dV/dt = 3t² + 14t (m³/jam) selama 5 jam dan kedalaman kolam sekata ialah 1.2 m. Jika kos mengecat dasar kolam ialah RM5/m², berapakah kos mengecat keseluruhan dasar kolam itu?","options":["RM1 250 (tidak mencukupi bajet RM1 000)","RM900 (mencukupi bajet RM1 000)","RM1 500 (tidak mencukupi bajet RM1 000)","RM625 (mencukupi bajet RM1 000)"],"correctIndex":0,"explanation":"Isi padu V = ∫_0^5 (3t² + 14t) dt = [t³ + 7t²]_0^5 = 125 + 175 = 300 m³. Luas dasar = V / tinggi = 300 / 1.2 = 250 m². Kos cat = 250 × RM5 = RM1 250 (> RM1 000, maka bajet tidak mencukupi)."}]},{"id":"addm53-u6","title":"Unit 6 (Boss SPM): Cabaran Jurutera Pengamiran","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Pembezaan Terbalik, Tangen ke Lengkung, Kisaran 180° & Ketumpatan Beras","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Kamir Bentuk Pecahan Rumit","voiceCaption":"Gunakan identiti d/dx[3(2x+1)²/(5x−1)] untuk menilai kamiran tentu dari 1 hingga 4.","voiceScript":"[excited] Selamat datang ke Peringkat Boss S P M Pengamiran! Soalan pertama daripada Latihan Sumatif soalan tiga: kita tidak boleh mengamir pecahan dua puluh x kuasa dua tolak lapan x tolak sembilan per lima x tolak satu kuasa dua secara terus, tetapi soalan sudah membuktikan ia ialah terbitan kepada tiga kali dua x tambah satu kuasa dua per lima x tolak satu! Gunakan jalan pintas songsangan pembezaan!","prompt":"Latihan Sumatif Q3: Diberi d/dx [ 3(2x + 1)² / (5x − 1) ] = 3(20x² − 8x − 9) / (5x − 1)². Hitung nilai ∫_1^4 [ 3(20x² − 8x − 9) / (5x − 1)² ] dx:","options":["459/76","243/19","27/4","105/19"],"correctIndex":0,"explanation":"Menggunakan songsangan pembezaan: kamiran tentu = [ 3(2x + 1)² / (5x − 1) ]_1^4 = [3(9)² / 19] − [3(3)² / 4] = 243/19 − 27/4 = (972 − 513) / 76 = 459/76."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Tentukan Pemalar dari Tangen","voiceCaption":"Lengkung mempunyai f'(x) = px² + 6x dan tangen y = 24x − 30 di titik (2, q); cari nilai p dan q.","voiceScript":"[curious] Cabaran Boss kedua menggabungkan Pembezaan dan Pengamiran! Lengkung mempunyai fungsi kecerunan p x kuasa dua tambah enam x, dan garis tangen di x sama dengan dua ialah y sama dengan dua puluh empat x tolak tiga puluh. Cari nilai pemalar p dan koordinat y iaitu q!","hook":"Titik (2, q) terletak pada kedua-dua lengkung dan garis tangen y = 24x - 30!","scenario":"Latihan Sumatif Q11: f'(x) = px² + 6x dan garis y = 24x − 30 ialah tangen kepada lengkung pada titik (2, q).","prompt":"Apakah nilai p dan nilai q?","options":["p = 3 dan q = 18","p = 6 dan q = 18","p = 3 dan q = 30","p = 4 dan q = 18"],"correctIndex":0,"proofLabId":"addm53_antiderivative_c_lab","proofState":{"tab":"family","c":2},"explanation":"Titik (2, q) berada di atas tangen y = 24x − 30 -> q = 24(2) − 30 = 18. Kecerunan tangen di x = 2 ialah 24 -> f'(2) = p(2)² + 6(2) = 24 -> 4p + 12 = 24 -> p = 3."},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Strategi Bongkah 180°","voiceCaption":"Susun langkah mencari isi padu kisaran 180° bagi rantau antara lengkung y = 2x² − 3x + c dengan paksi-x.","voiceScript":"[confident] Untuk soalan kisaran separuh bulatan seratus lapan puluh darjah dalam Latihan Sumatif tiga belas, susun turutan strategi yang betul!","prompt":"Susun langkah mengira isi padu kisaran 180° pada paksi-x bagi suatu lengkung kuadratik:","answerTokens":["Cari pintasan-x sebagai batas bawah a dan batas atas b","Kuasa duakan fungsi y menjadi y² dan kembangkan","Kamirkan π y² dari a hingga b terhadap x","Darabkan isi padu kisaran 360° dengan faktor 1/2"],"distractors":["Darabkan isi padu kisaran 360° dengan faktor 2","Ambil nilai mutlak sebelum mengkuasaduakan y"],"explanation":"Kisaran 180° membentuk separuh bongkah kisaran penuh, maka isi padunya ialah ½ × π ∫_a^b y² dx."},{"type":"match","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Padan Nilai Piawai Pengamiran","voiceCaption":"Padankan lima masalah pengamiran berikut dengan keputusan berangka yang tepat.","voiceScript":"[confident] Uji ketelitian pengiraan kamu dengan memadankan lima nilai kamiran dan aplikasi berikut!","prompt":"Padankan setiap ungkapan atau masalah dengan nilai jawapan tepatnya:","pairs":[{"id":"p1","left":"∫_2^3 x² dx","right":"19/3"},{"id":"p2","left":"∫_{-1}^4 (3x² + 2x) dx","right":"80"},{"id":"p3","left":"∫_1^2 (x³ − 2x²)/x² dx","right":"-1/2"},{"id":"p4","left":"Luas di bawah y=2x² dari x=0 hingga x=6","right":"144 unit²"},{"id":"p5","left":"Isi padu mangkuk x²=18y [0, 2]","right":"36π cm³"}],"explanation":"[x³/3]_2^3 = 19/3; [x³+x²]_{-1}^4 = 80 − 0 = 80; [x²/2−2x]_1^2 = −2 − (−3/2) = −1/2; [2x³/3]_0^6 = 144; π[9y²]_0^2 = 36π."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss Final: Isi Padu Tembok & Luas Bersepadu","voiceCaption":"Lengkung y + x² = 4 mempunyai tangen di Q(1, 3); cari isi padu janaan apabila rantau antara lengkung, paksi-y dan garis y = 3 dikisarkan 360° pada paksi-y.","voiceScript":"[excited] Soalan penutup Boss S P M daripada Latihan Sumatif sepuluh! Lengkung y tambah x kuasa dua sama dengan empat mempunyai titik Q satu koma tiga. Jika rantau yang dibatasi oleh lengkung, paksi y dan garis y sama dengan tiga dikisarkan tiga ratus enam puluh darjah mengelilingi paksi y, berapakah isi padu janaannya?","prompt":"Latihan Sumatif Q10(c): Rantau dibatasi oleh lengkung y + x² = 4, paksi-y dan garis lurus y = 3 (melalui Q(1, 3)) diputarkan 360° pada paksi-y. Hitung isi padu janaannya dalam sebutan π:","options":["π/2 unit³","π unit³","3π/2 unit³","9π/2 unit³"],"correctIndex":0,"explanation":"Lengkung memotong paksi-y di x = 0 -> y = 4. Jadi batas y ialah dari y = 3 hingga y = 4, dan x² = 4 − y. Isi padu = π ∫_3^4 (4 − y) dy = π [4y − y²/2]_3^4 = π [(16 − 8) − (12 − 4.5)] = π(8 − 7.5) = π/2 unit³."}]}]};</script>

    if (kind === "snap" && typeof window.NotaAudio.playSnap === "function") {
      window.NotaAudio.playSnap();
    } else if (kind === "match" && typeof window.NotaAudio.playMatch === "function") {
      window.NotaAudio.playMatch();
    } else if (kind === "paper" && typeof window.NotaAudio.playPaperRustle === "function") {
      window.NotaAudio.playPaperRustle();
    } else if (kind === "tick" && typeof window.NotaAudio.playTypewriterTick === "function") {
      window.NotaAudio.playTypewriterTick();
    } else if (typeof window.NotaAudio.playTap === "function") {
      window.NotaAudio.playTap();
    }
  }

  function syncSliderCss(sl, txt) {
    if (!sl) return;
    sl.style.setProperty("--attr-min", sl.min || "0");
    sl.style.setProperty("--attr-max", sl.max || "10");
    sl.style.setProperty("--control-value", sl.value);
    if (txt) sl.setAttribute("aria-valuetext", txt);
  }

    if (typeof document === "undefined" || document.getElementById("addm53-labs-css")) return;
