/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab04","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":4,"title":"Pilih Atur dan Gabungan","subtitle":"Subtopik 4.1–4.2 KSSM — Petua Pendaraban (m × n), Faktorial n!, Pilih Atur Linear & Membulat (n−1)!, Gelang/Rantai, nPr & nPr/r, Objek Secaman n!/(a!b!c!), Pilih Atur Bersyarat, Gabungan nCr = nPr/r! & Syarat Poligon/Jawatankuasa SPM.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"labScript":"matematik-tambahan-t5-bab04-labs.js","coverIcon":"../assets/icons/addm54-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Ketepatan kamu membezakan pilih atur dan gabungan memang cemerlang!","combo":"[laughs warmly] Kombo yang sangat padu! [excited] Semua syarat susunan membulat, secaman dan gabungan berjaya dikira!","encourage":"[softly] Hampir kena... jangan putus asa! [warm] Tanya diri kamu dahulu: adakah tertib kedudukan objek penting (nPr) atau tidak penting (nCr)?","celebrate":"[excited] Syabas! Satu lagi unit Matematik Tambahan Tingkatan lima Bab empat berjaya dikuasai!"},"units":[{"id":"addm54-u1","title":"Unit 1: Petua Pendaraban, Faktorial n! & Pilih Atur Membulat","subtitle":"Subtopik 4.1 (Bhg. A) — Petua Pendaraban m × n, Pilih Atur Linear n! serta Susunan Membulat (n−1)! dan Gelang","iconType":"atom","iconUrl":"../assets/icons/addm54-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Petua Pendaraban & Faktorial n!","voiceCaption":"Petua pendaraban m × n mengira gabungan peristiwa berturutan; n objek berbeza disusun secara linear dalam n! cara.","voiceScript":"[warm] Selamat datang ke Matematik Tambahan Tingkatan lima, Bab empat, Pilih Atur dan Gabungan! Konsep kriptografi yang dirintis oleh Al-Khalil dan Al-Kindi bermula dengan Petua Pendaraban: jika peristiwa pertama berlaku dalam m cara dan peristiwa kedua dalam n cara, kedua-duanya berlaku dalam m darab n cara! Apabila menyusun n objek berbeza tanpa ulangan secara sebaris, kita mendapat faktorial n tanda seru! Jika disusun mengelilingi meja bulat pula, rumusnya turun menjadi n tolak satu faktorial!","title":"4.1 Petua Pendaraban (m × n), Linear n! & Bulatan (n−1)!","acronym":"m×n • n! • (n−1)!","hook":"Susunan sebaris guna n!, tetapi di meja bulat satu kerusi dipancang tetap menjadi (n − 1)!, dan untuk gelang manik bahagi 2 lagi!","mediaKey":"addm54_combination_lock","videoClip":{"src":"../assets/matematik-tambahan-t5-bab04/video/addm54_video_pilih_atur_gabungan_narasi.mp4","hasNarration":true,"posterKey":"addm54_combination_lock","caption":"Video Penerangan Bersuara (BM): Perbezaan konsep pilih atur (nPr, tertib penting) dan gabungan (nCr, tertib tidak penting)"},"summary":"Petua pendaraban m × n menjadi asas pilih atur linear n! bagi n objek berbeza, manakala pilih atur membulat membahagi n dengan faktor putaran n menghasilkan (n − 1)!.","bullets":["Petua Pendaraban (Contoh 1): 3 jenis roti × 2 kuah × 4 minuman = 24 set sarapan; kod PIN 4 digit dengan ulangan dibenarkan = 10 × 10 × 10 × 10 = 10 000 cara; dadu dan syiling serentak = 6 × 2 = 12 cara.","Linear vs Bulatan vs Gelang: Menyusun semua n huruf berbeza secara linear = n! (cth. TUAH = 4! = 24, BIJAK = 5! = 120). Di meja bulat = n!/n = (n − 1)! (6 murid = 5! = 120). Bagi gelang atau rantai manik yang arah jam dan lawan jam adalah sama apabila diterbalikkan = (n − 1)! / 2 (12 manik = 11!/2 = 19 958 400)."],"labId":"addm54_multiplication_factorial_lab","labTitle":"Kalkulator Faktorial, Linear & Meja Bulat","labProps":{"n":5,"mode":"linear"},"formula":"Linear: n!   |   Meja Bulat: (n − 1)!   |   Gelang/Rantai: (n − 1)! / 2","examTip":"Bezakan betul-betul 'meja bulat' (tetamu menghadap ke dalam, arah jam ≠ lawan jam -> guna (n−1)!) dengan 'gelang/kalungan bunga' (boleh diterbalikkan -> bahagi 2!)."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Linear vs Bulatan vs Gelang","voiceCaption":"Kelaskan situasi susunan berikut kepada rumus n!, (n − 1)! atau (n − 1)! / 2.","voiceScript":"[curious] Uji pemahaman kamu tentang bentuk susunan! Asingkan situasi berikut kepada tiga rumus pilih atur: linear n faktorial, meja bulat n tolak satu faktorial, atau gelang bahagi dua.","prompt":"Isihkan setiap situasi berikut mengikut rumus pilih atur yang betul:","buckets":[{"id":"lin","label":"Linear: n!"},{"id":"bulat","label":"Meja Bulat: (n−1)!"},{"id":"gelang","label":"Gelang/Rantai: (n−1)!/2"}],"items":[{"text":"Menyusun semua 6 huruf dalam perkataan VEKTOR secara sebaris","bucketId":"lin","note":"6 huruf berbeza dalam satu baris lurus = 6! = 720."},{"text":"Menyusun 7 orang pelanggan duduk mengelilingi sebuah meja bulat restoran","bucketId":"bulat","note":"Orang di meja bulat ada kanan dan kiri tetap -> (7−1)! = 6! = 720."},{"text":"Menyusun 8 butir permata berlainan warna membentuk seutas rantai","bucketId":"gelang","note":"Rantai boleh diterbalikkan -> (8−1)!/2 = 7!/2 = 2 520."},{"text":"Menyusun 12 manik pelbagai warna menjadi rantai mainan","bucketId":"gelang","note":"Contoh 5 buku teks: (12−1)!/2 = 11!/2."}],"explanation":"Susunan sebaris guna n!, meja bulat guna (n−1)!, dan objek berbentuk gelang/kalungan tanpa had arah guna (n−1)!/2."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Ramal Laluan Pergi Balik Jalan Berbeza","voiceCaption":"Terdapat 4 jalan dari A ke B dan 5 jalan dari B ke C; ramalkan bilangan cara perjalanan pergi dan balik melalui B tanpa mengulangi jalan yang sama.","voiceScript":"[curious] Cuba selesaikan Latihan Kendiri empat perpuluhan satu soalan tiga b! Ada empat jalan dari Kota A ke Kota B, dan lima jalan dari Kota B ke Kota C. Jika perjalanan pergi ke C dan pulang semula ke A TIDAK boleh menggunakan jalan yang sama, berapakah bilangan cara perjalanan itu?","hook":"Semasa pergi ada 4 × 5 cara; semasa balik setiap bahagian jalan berkurang 1 pilihan!","scenario":"Latihan Kendiri 4.1 Q3(b): 4 jalan menghubungkan A ke B dan 5 jalan menghubungkan B ke C.","prompt":"Berapakah bilangan cara perjalanan pergi dari A ke C dan balik ke A melalui B tanpa menggunakan mana-mana jalan yang sama?","options":["240 cara","400 cara","320 cara","120 cara"],"correctIndex":0,"proofLabId":"addm54_multiplication_factorial_lab","proofState":{"n":4,"mode":"linear"},"explanation":"Pergi A->B (4 cara) × B->C (5 cara) × Balik C->B (4 baki cara) × B->A (3 baki cara) = 4 × 5 × 4 × 3 = 240 cara. (Jika boleh guna jalan sama: 4 × 5 × 5 × 4 = 400)."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Uji Pengiraan Faktorial Tanpa Kalkulator","voiceCaption":"Permudahkan ungkapan faktorial (8! − 6!) / 6! tanpa menggunakan kalkulator.","voiceScript":"[confident] Uji kemahiran algebra faktorial kamu daripada Latihan Kendiri empat perpuluhan dua! Permudahkan lapan faktorial tolak enam faktorial dibahagi enam faktorial tanpa menggunakan kalkulator.","prompt":"Tanpa menggunakan kalkulator, cari nilai bagi (8! − 6!) / 6!:","options":["55","56","49","7"],"correctIndex":0,"explanation":"Faktorkan 6!: 8! = 8 × 7 × 6! = 56 × 6!. Maka (56 × 6! − 1 × 6!) / 6! = 56 − 1 = 55."}]},{"id":"addm54-u2","title":"Unit 2: Pilih Atur nPr, Bulatan nPr/r & Objek Secaman","subtitle":"Subtopik 4.1 (Bhg. B) — Pilih Atur r daripada n (nPr), Bulatan Separa (nPr/r & nPr/2r) serta Objek Secaman P = n! / (a!b!c!...)","iconType":"graph","iconUrl":"../assets/icons/addm54-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Rumus nPr & Objek Secaman","voiceCaption":"Pilih atur r daripada n objek diberi oleh nPr = n!/(n−r)!; objek secaman pula dibahagi dengan faktorial ulangan a!b!c!.","voiceScript":"[warm] Bagaimana jika kita ada tujuh huruf dalam perkataan B E R T U A H tetapi hanya mahu menyusun empat huruf sahaja? Gunakan rumus n P r iaitu n faktorial dibahagi n tolak r faktorial! Jika r objek itu disusun secara bulatan, bahagi lagi dengan r; dan jika membentuk gelang, bahagi dua r! Seterusnya, bagi perkataan dengan huruf berulang seperti S I M B I O S I S, gunakan rumus objek secaman: bahagi n faktorial dengan a faktorial b faktorial bagi setiap objek yang sama!","title":"Pilih Atur nPr, Bulatan Separuh & Objek Secaman","acronym":"nPr • nPr/r • ÷a!b!","hook":"Apabila hanya r daripada n objek dipilih untuk disusun dalam bulatan, bahagikan nPr dengan r (bukan n)!","mediaKey":"addm54_circular_identical","summary":"Bilangan pilih atur bagi r objek daripada n objek berbeza ialah nPr = n!/(n−r)!, manakala kehadiran objek secaman memerlukan pembahagian dengan a!b!c!...","bullets":["Pilih Atur r daripada n (Contoh 6–8): Linear = nPr = n!/(n−r)! (cth. 3 jawatan daripada 8 calon = 8P3 = 336). Meja bulat = nPr / r (cth. 6 pinggan daripada 10 = 10P6 / 6 = 25 200). Gelang manik = nPr / (2r) (Contoh 8: 8 daripada 12 manik = 12P8 / 16 = 1 247 400).","Objek Secaman (Contoh 9): P = n! / (a! b! c! ...). Perkataan SIMBIOSIS mempunyai 9 huruf dengan 3 huruf S dan 3 huruf I, maka bilangan susunan = 9! / (3! × 3!) = 10 080 cara."],"labId":"addm54_npr_circular_identical_lab","labTitle":"Kalkulator nPr, Bulatan & Objek Secaman","labProps":{"tab":"secaman","word":"SIMBIOSIS"},"formula":"nPr = n! / (n − r)!   |   Bulatan: nPr / r   |   Gelang: nPr / (2r)   |   Secaman: n! / (a!b!c!...)","examTip":"Semasa mengira objek secaman, sentiasa kira jumlah semua huruf (n) dan senaraikan setiap huruf yang berulang lebih daripada 1 kali supaya tiada yang tertinggal."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Susunan Meja Bulat 6 Pinggan","voiceCaption":"Seorang pekerja menyusun 6 daripada 10 biji pinggan di atas meja bulat; ramalkan bilangan pilih aturnya.","voiceScript":"[curious] Cuba selesaikan Latihan Kendiri empat perpuluhan tiga soalan lima! Ada sepuluh biji pinggan yang berbeza, tetapi meja bulat hanya muat enam biji pinggan sahaja. Berapakah bilangan pilih atur susunan tersebut?","hook":"Meja bulat tetap mempunyai arah jam dan lawan jam berbeza, jadi bahagi 10P6 dengan 6 (bukan 12)!","scenario":"Latihan Kendiri 4.3 Q5: Menyusun r = 6 biji pinggan daripada n = 10 biji pinggan di atas sebuah meja bulat.","prompt":"Apakah ungkapan dan nilai bagi bilangan pilih atur menyusun pinggan-pinggan tersebut?","options":["10P6 / 6 = 25 200","10P6 = 151 200","10P6 / 12 = 12 600","6! = 720"],"correctIndex":0,"proofLabId":"addm54_npr_circular_identical_lab","proofState":{"tab":"npr","n":10,"r":6},"explanation":"Menggunakan rumus pilih atur membulat r daripada n objek: P = nPr / r = 10P6 / 6 = 151 200 / 6 = 25 200."},{"type":"match","xp":15,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Susunan Perkataan Secaman","voiceCaption":"Padankan lima perkataan daripada Latihan Kendiri 4.4 dengan bilangan cara susunan hurufnya.","voiceScript":"[warm] Jom semak bilangan huruf secaman bagi perkataan dalam Latihan Kendiri empat perpuluhan empat dan padankan jawapannya!","prompt":"Padankan setiap perkataan/objek berikut dengan bilangan susunan tepatnya:","pairs":[{"id":"s1","left":"APA (n=3, dua A)","right":"3! / 2! = 3"},{"id":"s2","left":"CORONA (n=6, dua O)","right":"6! / 2! = 360"},{"id":"s3","left":"MALARIA (n=7, tiga A)","right":"7! / 3! = 840"},{"id":"s4","left":"5 pen biru, 3 pen merah","right":"8! / (5! 3!) = 56"},{"id":"s5","left":"4 bendera putih, 6 kuning","right":"10! / (4! 6!) = 210"}],"explanation":"Semua pengiraan menggunakan rumus objek secaman n! / (a!b!...) dengan membilang tepat kekerapan setiap unsur yang sama."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Uji Permainan Kerusi Berirama","voiceCaption":"7 kanak-kanak berebut 6 kerusi bulat sambil berpusing lawan arah jam; tentukan bilangan pilih aturnya.","voiceScript":"[confident] Selesaikan soalan Latihan Formatif empat perpuluhan satu soalan tujuh! Tujuh orang kanak-kanak berebut enam buah kerusi yang disusun dalam bentuk bulatan. Berapakah bilangan pilih atur tempat duduk kanak-kanak itu?","prompt":"Latihan Formatif 4.1 Q7: Sekumpulan 7 orang kanak-kanak merebut 6 buah kerusi yang disusun dalam bentuk bulatan. Tentukan bilangan pilih atur susunan duduk mereka:","options":["7P6 / 6 = 840","7P6 = 5 040","(7 − 1)! = 720","7P6 / 12 = 420"],"correctIndex":0,"explanation":"6 daripada 7 orang kanak-kanak disusun dalam bulatan -> nPr / r = 7P6 / 6 = 5 040 / 6 = 840."}]},{"id":"addm54-u3","title":"Unit 3: Pilih Atur Bersyarat (Ganjil/Genap, Kelompok & Seling)","subtitle":"Subtopik 4.1 (Bhg. C) — Menyelesaikan Syarat Kedudukan Bertindih (Pecah Kes), Kaedah Ikat Blok & Objek Tidak Bersebelahan","iconType":"book","iconUrl":"../assets/icons/addm54-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Strategi Pilih Atur Bersyarat","voiceCaption":"Isi kedudukan bersyarat dahulu; jika syarat awal dan akhir bertindih, pecahkan mengikut kes; ikat objek bersebelahan sebagai satu unit.","voiceScript":"[warm] Soalan Kertas dua S P M paling gemar meletakkan syarat khusus pada pilih atur! Tiga strategi wajib kamu kuasai: pertama, penuhi syarat kedudukan hujung atau nombor ganjil dahulu sebelum mengisi baki kotak tengah. Kedua, jika dua syarat berkongsi digit yang sama seperti Contoh tiga belas, WAJIB pecahkan kepada Kes satu dan Kes dua lalu tambahkan! Ketiga, jika objek mesti bersebelahan seperti vokal dalam S U A S A N A, ikat objek itu menjadi satu blok dan darabkan susunan luar dengan susunan dalaman blok!","title":"Strategi Pilih Atur Bersyarat: Blok, Seling & Pecahan Kes","acronym":"Syarat Dulu • Blok • Kes","hook":"Jika syarat tidak boleh bersebelahan: susun kumpulan lain dahulu, kemudian selitkan ke dalam ruang kosong (atau tolak daripada jumlah tanpa syarat)!","mediaKey":"addm54_circular_identical","summary":"Masalah pilih atur bersyarat diselesaikan dengan mendahulukan kedudukan berhad, menggabungkan objek bersebelahan sebagai satu blok, atau memecahkan kes apabila syarat bertindih.","bullets":["Kaedah Blok (Contoh 11 & 12): 5 pekerja di meja bulat dengan A & B bersebelahan -> ikat AB sebagai 1 unit -> (4−1)! × 2! = 12 cara. Perkataan SUASANA dengan vokal {AAAU} bersama -> blok luar {AAAU, S, S, N} = 4!/2! × dalam blok 4!/3! = 12 × 4 = 48 cara.","Pecahan Kes Bertindih (Contoh 13): Nombor 4 digit ganjil dan < 5000 daripada {2, 3, 5, 7}. Kotak 1 boleh jadi 2 atau 3, manakala kotak 4 boleh jadi 3, 5 atau 7. Kerana digit 3 muncul di kedua-dua syarat: Kes 1 (digit 3 di kotak 4: 1×2×1×3? atau Kes 1 digit 2 di depan = 1×2×1×3 = 6; Kes 2 digit 3 di depan = 1×2×1×2 = 4) -> Jumlah = 6 + 4 = 10."],"labId":"addm54_conditional_perm_lab","labTitle":"Workbench Pecahan Kes & Blok Bersyarat","labProps":{"caseKey":"kes"},"formula":"Berasingan (2 objek): Jumlah − Bersebelahan   |   Berselang-seli (4 & 3): 4! × 3!","examTip":"Untuk 'tidak bersebelahan' bagi HANYA 2 objek (cth. Emma dan Fakhrul di meja bulat), kaedah terpantas ialah (Jumlah tanpa syarat) − (Bersebelahan)! Tetapi bagi 3+ objek tidak bersebelahan, WAJIB guna kaedah selit ruang kosong!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Meja Bulat Tidak Bersebelahan","voiceCaption":"6 orang duduk di meja bulat; ramalkan bilangan cara jika Emma dan Fakhrul TIDAK boleh duduk bersebelahan.","voiceScript":"[curious] Uji kaedah tolak jumlah! Enam orang termasuk Emma dan Fakhrul duduk di meja bulat. Berapakah bilangan cara jika Emma dan Fakhrul tidak boleh duduk bersebelahan?","hook":"Kira susunan 6 orang di meja bulat tanpa syarat = 5!, kemudian tolak kes Emma & Fakhrul duduk bersebelahan!","scenario":"Latihan Sumatif Q8(b): 6 orang (Amin, Budi, Cheng, Deepak, Emma, Fakhrul) duduk di meja bulat dengan Emma dan Fakhrul tidak boleh bersebelahan.","prompt":"Berapakah bilangan cara mereka boleh duduk?","options":["72 cara","48 cara","120 cara","96 cara"],"correctIndex":0,"proofLabId":"addm54_conditional_perm_lab","proofState":{"caseKey":"suasana"},"explanation":"Tanpa syarat = (6−1)! = 5! = 120. Jika Emma & Fakhrul bersebelahan = (5−1)! × 2! = 24 × 2 = 48. Maka tidak bersebelahan = 120 − 48 = 72 cara."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Kaedah Blok SUASANA","voiceCaption":"Susun langkah menyelesaikan bilangan susunan huruf perkataan SUASANA apabila semua huruf vokal sentiasa bersama.","voiceScript":"[confident] Susun keempat-empat langkah untuk menyelesaikan Contoh dua belas bagi perkataan S U A S A N A!","prompt":"Susun turutan langkah mengira susunan perkataan SUASANA jika semua huruf vokal sentiasa bersama:","answerTokens":["Kumpulkan 4 huruf vokal AAAU sebagai 1 unit blok","Susun 4 unit luar dengan 2 huruf S secaman: 4! / 2!","Susun huruf di dalam blok vokal dengan 3 huruf A secaman: 4! / 3!","Darabkan kedua-dua hasil mendapat 12 × 4 = 48"],"distractors":["Bahagikan jumlah dengan 7! sekali lagi","Tambah 4!/2! dengan 4!/3!"],"explanation":"Oleh sebab susunan luar dan susunan dalaman blok berlaku serentak (berangkai), kita menggunakan Petua Pendaraban (darab, bukan tambah)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Uji Nombor > 2000 dengan Sifar","voiceCaption":"Cari bilangan nombor 4 digit lebih daripada 2 000 daripada digit 0, 2, 4, 5, 6, 7 tanpa ulangan.","voiceScript":"[confident] Hati-hati dengan angka sifar! Daripada digit sifar, dua, empat, lima, enam dan tujuh tanpa ulangan, berapakah bilangan nombor empat digit yang lebih besar daripada dua ribu?","prompt":"Latihan Kendiri 4.5 Q2: Cari bilangan nombor 4 digit yang lebih daripada 2 000 dapat dibentuk daripada digit 0, 2, 4, 5, 6 dan 7 tanpa ulangan:","options":["300","360","240","120"],"correctIndex":0,"explanation":"Kotak pertama mesti ≥ 2 (tidak boleh 0), maka ada 5 pilihan {2, 4, 5, 6, 7}. Baki 5 digit (termasuk 0) mengisi 3 kotak seterusnya: 5 × 5P3 = 5 × 60 = 300 cara."}]},{"id":"addm54-u4","title":"Unit 4: Gabungan (nCr), Poligon & Syarat Pemilihan","subtitle":"Subtopik 4.2 — Perbezaan Pilih Atur vs Gabungan, Rumus nCr = nPr/r! = n!/[r!(n−r)!], Poligon & Syarat 'Sekurang-kurangnya'","iconType":"scale","iconUrl":"../assets/icons/addm54-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Gabungan nCr vs Pilih Atur nPr","voiceCaption":"Gabungan memilih objek tanpa mengambil kira tertib susunan menggunakan rumus nCr = nPr / r! = n! / [r!(n−r)!].","voiceScript":"[warm] Sekarang kita ke Subtopik empat perpuluhan dua, Gabungan! Apakah perbezaan mutlak antara pilih atur dengan gabungan? Dalam pilih atur, susunan A B dan B A dikira dua cara berbeza kerana jawatan atau kedudukan penting. Dalam gabungan, memilih Aakif dan Wong untuk berkayak adalah SAMA dengan memilih Wong dan Aakif! Oleh itu, kita membahagikan n P r dengan r faktorial untuk menghapuskan susunan yang berulang, menghasilkan rumus n C r!","title":"4.2 Konsep Gabungan (nCr) & Aplikasi Poligon","acronym":"nCr = nPr / r!","hook":"Jawatan khusus (Presiden, Setiausaha) = Pilih Atur nPr; Ahli jawatankuasa sama taraf atau bucu poligon = Gabungan nCr!","mediaKey":"addm54_combinations_polygon","summary":"Gabungan nCr = n! / [r!(n−r)!] mengira bilangan pemilihan r daripada n objek tanpa mengira tertib susunan, serta mempunyai sifat simetri nCr = nC(n−r).","bullets":["Contoh Poligon & Jawatankuasa (Contoh 14–16): Memilih 2 daripada 8 murid = 8C2 = 28; 3 daripada 10 calon = 10C3 = 120; Segi tiga daripada 6 bucu heksagon = 6C3 = 20; Pepenjuru oktagon (8 bucu) = 8C2 − 8 = 28 − 8 = 20 pepenjuru (garis penyambung dua bucu tolak sisi luar!).","Pembahagian Kumpulan & Syarat (Contoh 17–18): Membahagi 10 orang kepada kumpulan 2, 3, 5 = 10C2 × 8C3 × 5C5 = 45 × 56 × 1 = 2 520. Memilih 3 motif batik (≥1 organik daripada 4 dan ≥1 geometri daripada 5) = 4C2 × 5C1 + 4C1 × 5C2 = 30 + 40 = 70 cara."],"labId":"addm54_ncr_combinations_lab","labTitle":"Peneroka Gabungan nCr, Segi Tiga & Pepenjuru Poligon","labProps":{"n":6,"r":3},"formula":"nCr = nPr / r! = n! / [r!(n − r)!]   |   nCr = nC(n − r)   |   Pepenjuru = nC2 − n","examTip":"Kata kunci 'sekurang-kurangnya' atau 'tidak lebih daripada' bermaksud senaraikan semua kes yang sah, DARAB untuk pemilihan dalam satu kes, dan TAMBAH antara kes-kes berbeza!"},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Situasi Pilih Atur vs Gabungan","voiceCaption":"Kelaskan situasi berikut sama ada tertib penting (Pilih Atur nPr) atau tertib tidak penting (Gabungan nCr).","voiceScript":"[curious] Langkah pertama setiap soalan kombinasi S P M ialah mengenal pasti sama ada tertib penting atau tidak! Asingkan situasi berikut.","prompt":"Isihkan setiap situasi berikut sama ada melibatkan Pilih Atur (nPr) atau Gabungan (nCr):","buckets":[{"id":"perm","label":"Pilih Atur (Tertib Penting)"},{"id":"comb","label":"Gabungan (Tertib Tidak Penting)"}],"items":[{"text":"Memilih 5 pemain bola baling sebagai Penyerang 1, 2, 3 dan Pertahanan 1, 2","bucketId":"perm","note":"Posisi berbeza menetapkan tertib kedudukan -> 12P5."},{"text":"Memilih 5 pemain bola baling daripada 12 pemain untuk menyertai pertandingan daerah","bucketId":"comb","note":"Tiada posisi tetap dinyatakan, hanya kumpulan 5 orang -> 12C5."},{"text":"Memilih 7 saluran TV daripada 18 saluran yang ditawarkan kepada pelanggan","bucketId":"comb","note":"Latihan Kendiri 4.6: senarai saluran tiada tertib -> 18C7."},{"text":"Memilih pemenang johan, naib johan dan tempat ketiga daripada 9 pelumba basikal","bucketId":"perm","note":"Kedudukan pingat 1, 2 dan 3 berbeza -> 9P3."}],"explanation":"Apabila peranan, posisi, pingat atau susunan digit berbeza, gunakan Pilih Atur; apabila sekadar membentuk kumpulan atau set, gunakan Gabungan."},{"type":"predict","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Ramal Jawatankuasa Tidak Lebih 1 Wanita","voiceCaption":"Jawatankuasa 5 ahli dipilih daripada 5 lelaki dan 3 wanita; ramalkan bilangan cara jika tidak lebih daripada seorang wanita.","voiceScript":"[curious] Cuba selesaikan Latihan Formatif empat perpuluhan dua soalan dua c! Lima ahli jawatankuasa dipilih daripada lima lelaki dan tiga wanita. 'Tidak lebih daripada seorang wanita' bermaksud sama ada sifar wanita atau satu wanita sahaja!","hook":"Senaraikan dua kes: (5L, 0W) ATAU (4L, 1W), kemudian tambahkan kedua-duanya!","scenario":"Latihan Formatif 4.2 Q2(c): Memilih 5 orang ahli jawatankuasa daripada 5 orang lelaki dan 3 orang wanita dengan syarat tidak lebih daripada seorang wanita.","prompt":"Berapakah bilangan jawatankuasa berbeza yang boleh dibentuk?","options":["16 cara","56 cara","15 cara","30 cara"],"correctIndex":0,"proofLabId":"addm54_ncr_combinations_lab","proofState":{"n":8,"r":5},"explanation":"Kes 1 (5L, 0W): 5C5 × 3C0 = 1 × 1 = 1. Kes 2 (4L, 1W): 5C4 × 3C1 = 5 × 3 = 15. Jumlah = 1 + 15 = 16 cara."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Uji Pembahagian Buku & Kumpulan","voiceCaption":"5 buku berbeza dibahagikan kepada 3 murid (2 murid dapat 2 buku, 1 murid dapat 1 buku); kira bilangan cara.","voiceScript":"[confident] Ini soalan pembahagian kumpulan berperingkat! Lima buah buku berbeza akan diagihkan kepada tiga orang murid: murid pertama dapat dua buku, murid kedua dapat dua buku, dan murid ketiga dapat sebuah buku. Jangan lupa mengambil kira tiga murid berbeza yang menerima bilangan satu buku!","prompt":"Latihan Kendiri 4.8 Q1: 5 buah buku yang berbeza dibahagikan kepada 3 orang murid dengan 2 orang murid mendapat 2 buah buku dan seorang murid mendapat 1 buah buku. Cari bilangan cara pembahagian itu:","options":["90 cara","30 cara","60 cara","15 cara"],"correctIndex":0,"explanation":"Pilih siapa dalam 3 murid mendapat 1 buku (3C1 = 3 cara) × pilih 1 buku untuknya (5C1 = 5) × pilih 2 buku daripada 4 untuk murid kedua (4C2 = 6) × baki 2 buku untuk murid ketiga (2C2 = 1) = 3 × 5 × 6 × 1 = 90 cara."}]},{"id":"addm54-u5","title":"Unit 5 (Boss SPM): Cabaran Pakar Kombinatorik & Kriptografi","subtitle":"Sintesis Kertas 1 & Kertas 2 SPM — Gabungan Berpasangan Suami-Isteri, Bersalaman, Teksi 1+3 & Nonagon","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss 1: Jawatankuasa Tanpa Pasangan Suami-Isteri","voiceCaption":"Pilih 3 ahli daripada 4 pasangan suami isteri supaya tiada pasangan suami isteri memegang jawatan bersama.","voiceScript":"[excited] Selamat datang ke Peringkat Boss S P M Bab empat! Soalan pertama daripada Latihan Sumatif sebelas c: terdapat empat pasangan suami isteri, iaitu lapan orang kesemuanya. Kita mahu memilih tiga ahli jawatankuasa tanpa membenarkan mana-mana pasangan suami dan isteri berada bersama!","prompt":"Latihan Sumatif Q11(c): Satu jawatankuasa 3 orang ahli dipilih daripada 4 pasangan suami isteri (8 orang). Cari bilangan cara jika tiada pasangan suami dan isteri dibenarkan memegang jawatan bersama:","options":["32 cara","56 cara","24 cara","16 cara"],"correctIndex":0,"explanation":"Pilih 3 pasangan berbeza daripada 4 pasangan (4C3 = 4 cara), kemudian daripada setiap pasangan terpilih pilih 1 orang sama ada suami atau isteri (2C1 × 2C1 × 2C1 = 8). Jumlah = 4 × 8 = 32 cara! (Semakan tolak: 8C3 − 4C1×6C1 = 56 − 24 = 32)."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss 2: Bersalaman 15 Murid","voiceCaption":"15 murid saling bersalaman kecuali 3 orang yang sudah saling mengenali tidak bersalaman sesama mereka; ramalkan jumlah salaman.","voiceScript":"[curious] Cabaran Boss kedua daripada Latihan Sumatif tiga belas b! Lima belas orang murid saling bersalaman satu sama lain, tetapi tiga orang daripada mereka sudah kenal lama dan tidak bersalaman sesama mereka bertiga. Berapakah jumlah salaman yang berlaku?","hook":"Setiap 1 salaman melibatkan gabungan 2 orang (15C2), kemudian tolak salaman sesama 3 orang tersebut (3C2)!","scenario":"Latihan Sumatif Q13(b): 15 orang murid saling bersalaman, tetapi 3 orang daripada mereka tidak bersalaman sesama mereka.","prompt":"Berapakah bilangan salaman yang berlaku?","options":["102","105","99","204"],"correctIndex":0,"proofLabId":"addm54_ncr_combinations_lab","proofState":{"n":9,"r":2},"explanation":"Jumlah salaman semua 15 orang = 15C2 = 105. Salaman sesama 3 orang yang tidak berlaku = 3C2 = 3. Maka bilangan salaman sebenar = 105 − 3 = 102."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss 3: Susunan Kalungan 12 Bunga","voiceCaption":"Susun langkah mengira bilangan kalungan bunga dengan 3 bunga merah, 4 biru dan 5 putih.","voiceScript":"[confident] Soalan Latihan Sumatif sembilan menggabungkan konsep objek secaman dengan gelang bulatan! Susun langkah pengiraannya.","prompt":"Susun langkah mencari bilangan cara menyusun 3 bunga merah, 4 biru dan 5 putih menjadi satu kalungan bunga (Latihan Sumatif Q9):","answerTokens":["Gunakan formula bulatan boleh terbalik (n−1)! / 2 = 11! / 2","Bahagi dengan faktorial bunga secaman 3! 4! 5!","Hitung 11! / (2 × 3! × 4! × 5!) = 1 155"],"distractors":["Gunakan 12! tanpa membahagi dengan 12","Darabkan dengan 2 kerana arah jam berbeza"],"explanation":"Gabungan gelang bulatan (12−1)!/2 dengan objek secaman (3!, 4!, 5!) menghasilkan 11! / (2 × 3! × 4! × 5!) = 39 916 800 / 34 560 = 1 155 cara."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss 4: Padan Nilai Nonagon & Teksi","voiceCaption":"Padankan lima soalan Latihan Sumatif Bab 4 berikut dengan jawapan tepat masing-masing.","voiceScript":"[confident] Uji ketangkasan kamu memadankan lima jawapan tepat daripada Latihan Sumatif Bab empat!","prompt":"Padankan setiap situasi berikut dengan bilangan cara tepatnya:","pairs":[{"id":"c1","left":"Kod 4 huruf SEMBUNYI tanpa ulangan","right":"8P4 = 1 680"},{"id":"c2","left":"5 perlawanan futsal (menang/kalah/seri)","right":"3^5 = 243"},{"id":"c3","left":"Zara & 3 rakan di teksi (Zara di depan)","right":"1 × 3! = 6"},{"id":"c4","left":"Garis lurus daripada bucu nonagon (9 bucu)","right":"9C2 = 36"},{"id":"c5","left":"Segi tiga daripada bucu nonagon","right":"9C3 = 84"}],"explanation":"Setiap kes memisahkan dengan jelas antara pemilihan bersusun (8P4, 3!, 3^5) dengan gabungan tanpa tertib (9C2, 9C3)."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Final: Ujian Kemasukan Sekolah Swasta","voiceCaption":"Calon perlu menjawab 10 soalan daripada 6 soalan Bahagian A dan 7 soalan Bahagian B dengan sekurang-kurangnya 4 soalan Bahagian A.","voiceScript":"[excited] Soalan terakhir Boss S P M Bab empat daripada Latihan Sumatif sepuluh! Calon dikehendaki menjawab sepuluh soalan daripada enam soalan Bahagian A dan tujuh soalan Bahagian B, dengan syarat sekurang-kurangnya empat soalan Bahagian A dijawab. Pecahkan semua kes yang sah!","prompt":"Latihan Sumatif Q10: Satu ujian mempunyai 6 soalan di Bahagian A dan 7 soalan di Bahagian B. Calon perlu menjawab 10 soalan dengan syarat sekurang-kurangnya 4 soalan daripada Bahagian A dijawab. Cari bilangan cara memilih 10 soalan itu:","options":["266 cara","286 cara","210 cara","140 cara"],"correctIndex":0,"explanation":"Tiga kes sah (jumlah 10 soalan): (4A, 6B) = 6C4 × 7C6 = 15 × 7 = 105; (5A, 5B) = 6C5 × 7C5 = 6 × 21 = 126; (6A, 4B) = 6C6 × 7C4 = 1 × 35 = 35. Jumlah = 105 + 126 + 35 = 266 cara."}]}]};</script>
