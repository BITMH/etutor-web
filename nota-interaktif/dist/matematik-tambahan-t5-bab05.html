/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab05","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":5,"title":"Taburan Kebarangkalian","subtitle":"Pemboleh ubah rawak diskret & selanjar, taburan binomial B(n, p), serta taburan normal piawai Z","estimatedMinutes":25,"themeAccent":"#2563eb","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/addm55-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Kiraan taburan kebarangkalian kamu sangat kemas.","combo":"[cheering] Rentak padu! Pemahaman kamu terhadap kebarangkalian makin mantap.","encourage":"[gentle] Jangan risau. Semak semula syarat diskret, nilai p dan q, atau tanda ketaksamaan Z.","celebrate":"[cheering] Tahniah! Bab 5 Taburan Kebarangkalian berjaya ditamatkan dengan cemerlang!"},"units":[{"id":"addm55-u1","title":"Pemboleh Ubah Rawak Diskret & Selanjar","subtitle":"Subtopik 5.1: Ruang sampel, tatatanda set dan jumlah kebarangkalian = 1","iconType":"atom","iconUrl":"../assets/icons/addm55-u1.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u1-s1","voiceToneLabel":"Teruja","voiceCaption":"Pemboleh ubah rawak diskret mengambil nilai boleh dibilang seperti 0, 1, 2; manakala selanjar mengambil nilai dalam suatu selang ukuran.","voiceScript":"[curious] Pernahkah kamu tertanya beza bilangan gol dengan masa larian seratus meter? [excited] Dalam Matematik Tambahan, pemboleh ubah rawak diskret mengambil nilai boleh dibilang seperti sifar, satu, dua, [warm] manakala pemboleh ubah rawak selanjar diukur dalam suatu selang seperti tinggi atau jisim.","title":"Mengenal Pemboleh Ubah Rawak (5.1)","summary":"Pemboleh ubah rawak (X) ialah pemboleh ubah yang nilainya ditentukan secara berangka oleh kesudahan suatu eksperimen rawak.","bullets":["<strong>Pemboleh Ubah Rawak Diskret:</strong> Nilai boleh dibilang (biasanya integer), ditulis dalam tatatanda set seperti X = {0, 1, 2, 3}.","<strong>Pemboleh Ubah Rawak Selanjar:</strong> Nilai diperoleh melalui pengukuran dalam suatu selang berterusan, seperti {x : 150 <= x <= 185}.","<strong>Syarat Kesahan Taburan Diskret:</strong> Setiap nilai memenuhi 0 <= P(X = r) <= 1 dan hasil tambah kesemua kebarangkalian mestilah tepat 1."],"formula":"Jumlah P(X = r_i) = 1 dan 0 <= P(X = r_i) <= 1","examTip":"Gunakan rajah pokok untuk menyenaraikan ruang sampel eksperimen berturutan sebelum menukar kesudahan kepada nilai berangka X.","mediaKey":"peta_binomial_vs_normal","videoClip":{"src":"../assets/matematik-tambahan-t5-bab05/video/addm55_video_taburan_normal_narasi.mp4","hasNarration":true,"posterKey":"peta_binomial_vs_normal","caption":"Video Penerangan Bersuara (BM): Taburan binomial diskrit dan penjelmaan kepada lengkung taburan normal piawai skor-Z"},"labId":"addm55_discrete_rv_lab","labTitle":"Makmal 5.1: Pemboleh Ubah Rawak Diskret","labCaption":"Uji bilangan lambungan syiling untuk melihat ruang sampel dan jumlah kebarangkalian = 1."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Membimbing","voiceCaption":"Isihkan pemboleh ubah rawak berikut kepada kategori Diskret atau Selanjar.","voiceScript":"[friendly] Mari uji kefahaman awal kamu. Isihkan setiap situasi di bawah sama ada ia pemboleh ubah rawak diskret atau selanjar.","prompt":"Kelaskan pemboleh ubah rawak berikut kepada Diskret atau Selanjar:","buckets":[{"id":"diskret","label":"Diskret (Boleh Dibilang)"},{"id":"selanjar","label":"Selanjar (Diukur dalam Selang)"}],"items":[{"text":"Bilangan mentol rosak dalam kotak 12 biji","bucketId":"diskret","note":"Nilai integer boleh dibilang {0, 1, ..., 12}."},{"text":"Jisim sebiji tembikai di pasar tani","bucketId":"selanjar","note":"Jisim boleh mengambil sebarang nilai perpuluhan dalam selang."},{"text":"Bilangan kali nombor 6 muncul dalam 10 balingan dadu","bucketId":"diskret","note":"Bilangan kekerapan adalah diskret."},{"text":"Masa yang diambil seorang perenang menamatkan 100 m","bucketId":"selanjar","note":"Masa diukur secara berterusan."}],"explanation":"Pemboleh ubah diskret melibatkan pembilangan (integer tepat), manakala pemboleh ubah selanjar melibatkan pengukuran dalam suatu selang berterusan."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Cabaran","voiceCaption":"Jika suatu pemboleh ubah diskret X = {1, 2, 3} mempunyai P(X=1)=0.25, P(X=2)=2k, dan P(X=3)=0.35, ramalkan nilai pemalar k.","voiceScript":"[curious] Diberi X mempunyai nilai satu, dua, dan tiga dengan kebarangkalian sifar perpuluhan dua lima, dua k, dan sifar perpuluhan tiga lima. [friendly] Berapakah nilai pemalar k supaya taburan ini sah?","prompt":"Suatu pemboleh ubah rawak diskret X = {1, 2, 3} mempunyai P(X = 1) = 0.25, P(X = 2) = 2k, dan P(X = 3) = 0.35. Berapakah nilai k?","options":["0.20","0.40","0.15"],"correctIndex":0,"explanation":"Jumlah kebarangkalian mestilah 1: 0.25 + 2k + 0.35 = 1 -> 2k + 0.60 = 1 -> 2k = 0.40 -> k = 0.20."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Fokus","voiceCaption":"Tiga keping syiling adil dilambung serentak. Cari kebarangkalian mendapat tepat dua Gambar.","voiceScript":"[calm] Bayangkan tiga keping syiling adil dilambung serentak, menghasilkan lapan kesudahan ruang sampel. [curious] Apakah kebarangkalian mendapat tepat dua Gambar?","prompt":"Tiga keping syiling adil dilambung serentak. Jika X mewakili bilangan Gambar yang diperoleh, apakah nilai P(X = 2)?","options":["3/8","1/8","1/2","5/8"],"correctIndex":0,"explanation":"Ruang sampel mempunyai 2^3 = 8 kesudahan. Kesudahan dengan tepat dua Gambar ialah {GGA, GAG, AGG}, iaitu 3 kesudahan. Maka P(X = 2) = 3/8."}]},{"id":"addm55-u2","title":"Taburan Binomial & Percubaan Bernoulli","subtitle":"Subtopik 5.2: Syarat Bernoulli dan rumus kebarangkalian P(X = r)","iconType":"formula","iconUrl":"../assets/icons/addm55-u2.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Jelas","voiceCaption":"Taburan Binomial X ~ B(n, p) berlaku apabila n percubaan Bernoulli tak bersandar dijalankan dengan kebarangkalian berjaya p yang malar.","voiceScript":"[warm] Apabila suatu percubaan hanya ada dua kesudahan, iaitu berjaya atau gagal, ia dinamakan percubaan Bernoulli. [excited] Ulangi percubaan ini sebanyak n kali secara tak bersandar dengan kebarangkalian berjaya p yang tetap, maka lahirlah Taburan Binomial!","title":"Syarat & Rumus Taburan Binomial (5.2)","summary":"Taburan Binomial X ~ B(n, p) memodelkan bilangan kejayaan r daripada n ulangan percubaan Bernoulli yang tak bersandar.","bullets":["Terdapat <strong>n percubaan</strong> yang tetap dan setiap percubaan adalah <strong>tak bersandar</strong>.","Hanya ada <strong>2 kesudahan</strong>: Berjaya (kebarangkalian p) atau Gagal (kebarangkalian q = 1 - p).","Kebarangkalian berjaya p adalah <strong>malar</strong> pada setiap percubaan.","Taktik pelengkap: P(X >= 1) = 1 - P(X = 0) sangat penting untuk mencari bilangan minimum n."],"formula":"P(X = r) = ^nC_r p^r q^(n - r), dengan q = 1 - p","examTip":"Sentiasa tafsir frasa dengan tepat: 'sekurang-kurangnya r' ialah X >= r, manakala 'selebih-lebihnya r' ialah X <= r.","labId":"addm55_binomial_dist_lab","labTitle":"Makmal 5.2: Simulator Binomial B(n, p)","labCaption":"Ubah n, p dan r untuk melihat carta bar, min, varians serta bentuk pencongan graf."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Aktif","voiceCaption":"Susun ungkapan kebarangkalian Binomial untuk 2 kejayaan daripada 5 percubaan apabila p = 0.3.","voiceScript":"[friendly] Susun token untuk membentuk rumus lengkap mencari kebarangkalian mendapat tepat dua kejayaan daripada lima percubaan apabila p sama dengan sifar perpuluhan tiga.","prompt":"Susun rumus untuk menghitung P(X = 2) jika X ~ B(5, 0.3):","answerTokens":["5C2","x","(0.3)^2","x","(0.7)^3"],"distractors":["(0.3)^3","(0.7)^2","5C3"],"explanation":"Dengan n = 5, r = 2, p = 0.3 dan q = 1 - 0.3 = 0.7, maka P(X = 2) = 5C2 x (0.3)^2 x (0.7)^3."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s3","voiceToneLabel":"Strategi","voiceCaption":"Kebarangkalian sebiji roti rosak ialah 0.12. Cari bilangan minimum roti supaya kebarangkalian sekurang-kurangnya sebiji rosak melebihi 0.85.","voiceScript":"[curious] Ini soalan wajib SPM KSSM. Kebarangkalian sebiji roti rosak ialah sifar perpuluhan satu dua. [calm] Berapakah bilangan minimum roti n supaya kebarangkalian sekurang-kurangnya sebiji rosak melebihi sifar perpuluhan lapan lima?","prompt":"Kebarangkalian seketul roti rosak ialah 0.12. Hitung bilangan minimum roti, n, yang perlu dipilih secara rawak supaya kebarangkalian mendapat sekurang-kurangnya seketul roti rosak melebihi 0.85.","options":["15","14","16","12"],"correctIndex":0,"explanation":"P(X >= 1) > 0.85 -> 1 - (0.88)^n > 0.85 -> (0.88)^n < 0.15. Ambil log10 kedua-dua belah: n > log10(0.15)/log10(0.88) = 14.84. Maka integer minimum ialah n = 15."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Pantas","voiceCaption":"Jika X ~ B(4, 0.25), ramalkan nilai P(X = 0) dalam bentuk perpuluhan.","voiceScript":"[friendly] Jika X bertabur secara binomial dengan n empat dan p sifar perpuluhan dua lima, berapakah nilai kebarangkalian sifar kejayaan?","prompt":"Diberi X ~ B(4, 0.25). Hitung nilai P(X = 0) betul kepada 4 tempat perpuluhan.","options":["0.3164","0.0039","0.6836"],"correctIndex":0,"explanation":"P(X = 0) = 4C0 x (0.25)^0 x (0.75)^4 = 1 x 1 x 0.31640625 = 0.3164."}]},{"id":"addm55-u3","title":"Min, Varians, Sisihan Piawai & Graf Binomial","subtitle":"Subtopik 5.2: Mengira mu = np, varians = npq dan mentafsir bentuk graf","iconType":"graph","iconUrl":"../assets/icons/addm55-u3.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Informatif","voiceCaption":"Bagi taburan Binomial, min ialah np, varians ialah npq, dan nilai p menentukan sama ada graf simetri atau pencong.","voiceScript":"[warm] Tidak perlu membina jadual panjang untuk mencari min dan varians taburan binomial! [excited] Min hanyalah n darab p, manakala varians ialah n darab p darab q. Lihat juga bagaimana nilai p mengawal bentuk graf sama ada simetri atau pencong!","title":"Min, Varians & Bentuk Graf Binomial","summary":"Parameter statistik taburan Binomial B(n, p) diperoleh secara langsung daripada n, p dan q = 1 - p, manakala nilai p menentukan kesimetrian graf.","bullets":["<strong>Min (mu):</strong> mu = np dan <strong>Varians (sigma^2):</strong> npq.","<strong>Sisihan Piawai (sigma):</strong> punca kuasa dua bagi npq.","<strong>p < 0.5:</strong> Graf pencong ke kanan (ekor panjang ke kanan).","<strong>p = 0.5:</strong> Graf simetri sempurna di tengah; <strong>p > 0.5:</strong> graf pencong ke kiri."],"formula":"mu = np | sigma^2 = npq | Varians / Min = q","examTip":"Apabila soalan memberi nilai min dan varians, bahagikan varians dengan min (npq / np) untuk mendapatkan q secara terus!","mediaKey":"simetri_bernoulli_graf"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Pengukuhan","voiceCaption":"Padankan parameter taburan Binomial dengan bentuk graf atau rumus yang sepadan.","voiceScript":"[friendly] Padankan setiap nilai parameter atau ungkapan di kiri dengan tafsiran graf dan statistik yang tepat di kanan.","prompt":"Padankan sifat taburan Binomial berikut:","pairs":[{"id":"p1","left":"X ~ B(10, 0.2)","right":"Graf pencong ke kanan"},{"id":"p2","left":"X ~ B(10, 0.5)","right":"Graf berbentuk simetri"},{"id":"p3","left":"X ~ B(10, 0.8)","right":"Graf pencong ke kiri"},{"id":"p4","left":"Nisbah Varians / Min","right":"Sama dengan q = 1 - p"}],"explanation":"Nilai p < 0.5 menghasilkan pencongan kanan, p = 0.5 menghasilkan taburan simetri, p > 0.5 menghasilkan pencongan kiri, dan npq / np = q."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s3","voiceToneLabel":"Aplikasi","voiceCaption":"Dalam ujian aneka pilihan 20 soalan dengan 4 pilihan setiap soalan, apakah min dan sisihan piawai jawapan betul jika diteka secara rawak?","voiceScript":"[curious] Seorang murid meneka secara rawak semua dua puluh soalan aneka pilihan yang mempunyai empat pilihan jawapan. [friendly] Hitung min dan sisihan piawai bagi bilangan jawapan yang betul.","prompt":"Dalam suatu kuiz 20 soalan objektif dengan 4 pilihan jawapan bagi setiap soalan (1 betul), seorang peserta meneka semua soalan secara rawak. Cari min dan sisihan piawai bilangan jawapan betul.","options":["Min = 5, Sisihan piawai = 1.936","Min = 4, Sisihan piawai = 2.000","Min = 5, Sisihan piawai = 3.750","Min = 15, Sisihan piawai = 1.936"],"correctIndex":0,"explanation":"Di sini n = 20, p = 1/4 = 0.25, q = 0.75. Min = np = 20(0.25) = 5. Varians = npq = 20(0.25)(0.75) = 3.75. Sisihan piawai = punca(3.75) = 1.936."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Sistematik","voiceCaption":"Susun pengiraan songsang mencari n apabila diberi min = 12 dan varians = 4.8.","voiceScript":"[calm] Susun aliran langkah mengira nilai n apabila min sama dengan dua belas dan varians sama dengan empat perpuluhan lapan.","prompt":"Diberi X ~ B(n, p) dengan min = 12 dan varians = 4.8. Susun langkah mencari q, p dan n:","answerTokens":["q = 4.8 / 12 = 0.4,","p = 1 - 0.4 = 0.6,","n = 12 / 0.6 = 20"],"distractors":["q = 0.6,","n = 12 / 0.4 = 30","p = 0.5,"],"explanation":"Gunakan q = Varians / Min = 4.8 / 12 = 0.4. Maka p = 0.6, dan daripada np = 12 diperoleh n = 12 / 0.6 = 20."}]},{"id":"addm55-u4","title":"Taburan Normal, Piawaian & Skor-Z","subtitle":"Subtopik 5.3: Lengkung loceng simetri, peraturan empirik dan rumus Z = (X - mu)/sigma","iconType":"graph","iconUrl":"../assets/icons/addm55-u4.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Inspirasi","voiceCaption":"Taburan Normal ialah lengkung loceng simetri dengan min = median = mod, manakala skor-z menukarkan sebarang X kepada taburan normal piawai N(0, 1).","voiceScript":"[warm] Bagi pemboleh ubah selanjar seperti ketinggian pelajar, graf taburannya membentuk lengkung loceng yang simetri. [excited] Dengan rumus piawaian Z sama dengan X tolak miu per sigma, semua taburan normal boleh dibaca menggunakan satu sifir tunggal!","title":"Lengkung Normal & Skor-Z Piawai (5.3)","summary":"Taburan Normal X ~ N(mu, sigma^2) mempunyai lengkung loceng simetri dengan jumlah luas 1, dan dipiawaikan kepada Z ~ N(0, 1).","bullets":["Lengkung berbentuk loceng, simetri pada garis x = mu (min = median = mod), dan menghampiri paksi-x secara asimptot.","<strong>Peraturan Empirik:</strong> 68.26% data dalam mu +/- 1 sigma, 95.44% dalam mu +/- 2 sigma, dan 99.74% dalam mu +/- 3 sigma.","<strong>Tatatanda N(mu, sigma^2):</strong> Nombor kedua ialah VARIANS (sigma^2), bukannya sisihan piawai."],"formula":"Z = (X - mu) / sigma","examTip":"Sentiasa ambil punca kuasa dua bagi nombor kedua dalam N(mu, sigma^2) untuk mendapatkan sisihan piawai sigma sebelum membahagi!","mediaKey":"lengkung_normal_68_95_99","labId":"addm55_normal_z_lab","labTitle":"Makmal 5.3: Lengkung Normal Piawai Z","labCaption":"Lorek kawasan ekor kanan, ekor kiri dan tengah untuk menguasai simetri sifir Z."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s2","voiceToneLabel":"Berhati-hati","voiceCaption":"Perangkap klasik SPM! Diberi X ~ N(64, 16). Cari nilai skor-z apabila X = 70.","voiceScript":"[serious] Awas dengan perangkap paling kerap dalam kertas SPM! Diberi X bertabur secara normal dengan miu enam puluh empat dan varians enam belas. [curious] Apakah nilai skor-z apabila X sama dengan tujuh puluh?","prompt":"Diberi pemboleh ubah rawak selanjar X ~ N(64, 16). Hitung skor-z yang sepadan dengan X = 70.","options":["1.50","0.375","-1.50","6.00"],"correctIndex":0,"explanation":"Daripada N(64, 16), min mu = 64 dan varians sigma^2 = 16, maka sisihan piawai sigma = punca(16) = 4. Jadi Z = (70 - 64) / 4 = 6 / 4 = 1.50."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Tepat","voiceCaption":"Susun identiti simetri lengkung Normal Piawai untuk menulis P(|Z| <= a) dalam sebutan P(Z > a).","voiceScript":"[friendly] Sifir normal piawai KSSM hanya memberikan bacaan ekor kanan P Z lebih besar daripada a. [curious] Bagaimanakah kita menulis kebarangkalian bahagian tengah antara negatif a dan positif a?","prompt":"Bentuk rumus untuk menghitung P(-a <= Z <= a) menggunakan ekor kanan sifir normal:","answerTokens":["1","-","2","x","P(Z > a)"],"distractors":["+","P(Z < a)","0.5"],"explanation":"Oleh sebab jumlah luas ialah 1 dan dua ekor |Z| > a masing-masing seluas P(Z > a), maka kawasan tengah P(-a <= Z <= a) = 1 - 2 P(Z > a)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Visual","voiceCaption":"Diberi P(Z > 1.2) = 0.1151. Ramalkan nilai P(Z < 1.2).","voiceScript":"[warm] Diberi bacaan sifir P Z lebih besar daripada satu perpuluhan dua ialah sifar perpuluhan satu satu lima satu. [curious] Apakah nilai kebarangkalian Z lebih kecil daripada satu perpuluhan dua?","prompt":"Diberi daripada sifir taburan normal piawai bahawa P(Z > 1.2) = 0.1151. Apakah nilai P(Z < 1.2)?","options":["0.8849","0.1151","0.3849"],"correctIndex":0,"explanation":"P(Z < 1.2) = 1 - P(Z > 1.2) = 1 - 0.1151 = 0.8849."}]},{"id":"addm55-u5","title":"Sifir Normal Piawai, Songsang & Hampiran Binomial","subtitle":"Subtopik 5.3: Membaca nilai songsang k, mencari mu atau sigma, dan syarat hampiran normal","iconType":"scale","iconUrl":"../assets/icons/addm55-u5.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u5-s1","voiceToneLabel":"Berfokus","voiceCaption":"Jika diberi kebarangkalian melebihi 0.5 seperti P(Z < k) = 0.85, lukis lakaran terlebih dahulu untuk menentukan sama ada k positif atau negatif.","voiceScript":"[serious] Ketika menyelesaikan soalan songsang skor-z, lakaran ringkas lengkung loceng sangat menyelamatkan markah. [warm] Pastikan anda tahu sama ada garis k berada di sebelah kanan min atau kiri min sebelum menukar kebarangkalian kepada bacaan ekor kanan.","title":"Songsang Skor-Z & Hampiran Normal","summary":"Penentuan tanda skor-z songsang bergantung pada sama ada kawasan berlorek melebihi 0.5 atau kurang daripada 0.5, manakala taburan binomial besar boleh dihampirkan dengan taburan normal.","bullets":["Jika P(Z > k) < 0.5 maka k > 0 (kanan min); jika P(Z > k) > 0.5 maka k < 0 (kiri min).","Jika P(Z < k) < 0.5 maka k < 0 (ekor kiri), guna P(Z > |k|) = P(Z < k).","<strong>Hampiran Normal kepada Binomial:</strong> Sah apabila kedua-dua syarat <strong>np >= 10</strong> dan <strong>n(1 - p) >= 10</strong> dipenuhi, dengan X ~ N(np, npq)."],"formula":"Jika np >= 10 dan nq >= 10, maka B(n, p) ~ N(np, npq)","examTip":"Sentiasa lakar lengkung loceng kecil pada ruang kerja kertas jawapan supaya anda tidak tersilap meletakkan tanda negatif pada skor-z songsang.","labId":"addm55_aplikasi_normal_lab","labTitle":"Makmal 5.4: Penukaran X ke Skor-Z","labCaption":"Ubah min, sisihan piawai dan nilai X untuk melihat penukaran skor-z dan kebarangkalian ekor."},{"type":"sort","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Semakan","voiceCaption":"Kelaskan pernyataan kebarangkalian normal piawai mengikut tanda nilai k: k > 0 atau k < 0.","voiceScript":"[friendly] Isihkan setiap pernyataan kebarangkalian skor-z di bawah sama ada nilai k berada di kanan min iaitu positif, atau di kiri min iaitu negatif.","prompt":"Kelaskan setiap pernyataan berikut mengikut tanda skor-z k yang terhasil:","buckets":[{"id":"pos","label":"k Positif (Di kanan min Z = 0)"},{"id":"neg","label":"k Negatif (Di kiri min Z = 0)"}],"items":[{"text":"P(Z > k) = 0.08","bucketId":"pos","note":"Ekor kanan < 0.5 bermakna k di kanan Z = 0."},{"text":"P(Z > k) = 0.72","bucketId":"neg","note":"Luas ke kanan > 0.5 bermakna k berada di kiri Z = 0."},{"text":"P(Z < k) = 0.12","bucketId":"neg","note":"Ekor kiri < 0.5 bermakna k di kiri Z = 0."},{"text":"P(Z < k) = 0.90","bucketId":"pos","note":"Luas ke kiri > 0.5 bermakna k berada di kanan Z = 0."}],"explanation":"Garis Z = 0 membahagi luas tepat 0.5 di kiri dan 0.5 di kanan. Luas ekor yang lebih kecil daripada 0.5 menentukan bahagian kanan atau kiri garis k berada."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Aplikasi","voiceCaption":"Antara taburan binomial berikut, yang manakah memenuhi syarat hampiran normal KSSM (np >= 10 dan nq >= 10)?","voiceScript":"[curious] Mengikut piawai buku teks KSSM, apakah syarat bagi membolehkan taburan binomial B n p dihampirkan oleh taburan normal?","prompt":"Antara taburan binomial B(n, p) berikut, yang manakah memenuhi syarat hampiran normal KSSM (np >= 10 dan nq >= 10)?","options":["X ~ B(50, 0.3)","X ~ B(20, 0.2)","X ~ B(40, 0.1)","X ~ B(15, 0.5)"],"correctIndex":0,"explanation":"Bagi B(50, 0.3): np = 50(0.3) = 15 >= 10 dan nq = 50(0.7) = 35 >= 10. Pilihan lain mempunyai np < 10 atau nq < 10."},{"type":"predict","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Teratur","voiceCaption":"Diberi X ~ N(mu, 25), P(X < 40) = 0.1587, dan P(Z > 1.00) = 0.1587. Ramalkan nilai mu.","voiceScript":"[calm] Jika kebarangkalian X kurang daripada empat puluh ialah sifar perpuluhan satu lima lapan tujuh dan varians ialah dua puluh lima, ramalkan nilai min miu.","prompt":"Diberi X ~ N(mu, 25), P(X < 40) = 0.1587, dan daripada sifir P(Z > 1.00) = 0.1587. Hitung nilai min mu.","options":["45","35","65"],"correctIndex":0,"explanation":"Kerana P(X < 40) = 0.1587 < 0.5, skor-z ialah negatif: z = -1.00. Dengan sigma = punca(25) = 5, maka (40 - mu)/5 = -1.00 -> 40 - mu = -5 -> mu = 45."}]},{"id":"addm55-u6","title":"Ujian Maut Kebarangkalian SPM","subtitle":"Cabaran Master: Gabungan soalan Kertas 1 dan Kertas 2 Berformat SPM","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Cabaran Boss","voiceCaption":"Jisim mangga bertabur normal N(180, 100). Jika gred A sekurang-kurangnya 195 g, cari kebarangkalian gred A.","voiceScript":"[excited] Selamat datang ke Ujian Maut Bab Lima! [curious] Jisim mangga bertabur normal dengan min seratus lapan puluh gram dan varians seratus. Jika gred A memerlukan sekurang-kurangnya seratus sembilan puluh lima gram, cari kebarangkalian mangga gred A diberi P Z lebih besar daripada satu perpuluhan lima ialah sifar perpuluhan sifar enam enam lapan.","prompt":"Jisim sebiji mangga di sebuah ladang bertabur secara normal dengan min 180 g dan varians 100 g^2. Mangga dengan jisim sekurang-kurangnya 195 g dikelaskan sebagai Gred A. Diberi P(Z > 1.5) = 0.0668, cari kebarangkalian sebiji mangga yang dipilih secara rawak ialah Gred A.","options":["0.0668","0.9332","0.4332","0.1500"],"correctIndex":0,"explanation":"mu = 180, sigma = punca(100) = 10. P(X >= 195) = P(Z >= (195 - 180)/10) = P(Z >= 1.5) = 0.0668."},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Berstrategi","voiceCaption":"Jika 150 biji mangga dipilih secara rawak dengan p(Gred A) = 0.0668, nyatakan nilai jangkaan (min) bilangan mangga Gred A.","voiceScript":"[curious] Sekarang kita gabungkan Normal ke Binomial! [friendly] Jika seratus lima puluh biji mangga dipilih dengan kebarangkalian Gred A sifar perpuluhan sifar enam enam lapan, ramalkan min bilangan mangga Gred A.","prompt":"Daripada soalan sebelumnya, kebarangkalian mangga Gred A ialah p = 0.0668. Jika satu sampel 150 biji mangga dipilih, apakah min bilangan mangga Gred A?","options":["10.02","9.35","15.00"],"correctIndex":0,"explanation":"Bilangan mangga Gred A mengikuti Taburan Binomial B(150, 0.0668). Min = np = 150 x 0.0668 = 10.02."},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s3","voiceToneLabel":"Cermat","voiceCaption":"Dalam suatu peperiksaan, markah X ~ N(52, sigma^2) dan 15.87% calon mendapat lebih daripada 64 markah. Susun ungkapan mencari sigma.","voiceScript":"[serious] Diberi P Z lebih besar daripada satu ialah sifar perpuluhan satu lima lapan tujuh. Susun langkah aritmetik untuk memperoleh nilai sisihan piawai sigma jika enam puluh empat markah mempunyai skor-z tepat satu.","prompt":"Diberi P(Z > 1.0) = 0.1587, mu = 52, dan P(X > 64) = 0.1587. Susun langkah mencari sigma:","answerTokens":["(64 - 52)","/","sigma","=","1.0","->","sigma = 12"],"distractors":["-1.0","sigma = 144","(52 - 64)"],"explanation":"Oleh sebab P(X > 64) = 0.1587 = P(Z > 1.0), maka skor-z bagi X = 64 ialah +1.0. (64 - 52)/sigma = 1.0 memberi sigma = 12."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s4","voiceToneLabel":"Misi Akhir","voiceCaption":"Sebuah kilang menghasilkan cip dengan kebarangkalian rosak 0.05. Dalam satu kotak 5 biji cip, cari kebarangkalian tepat 1 cip rosak.","voiceScript":"[excited] Soalan terakhir Ujian Maut Bab Lima! Dalam kotak lima biji cip dengan kebarangkalian rosak sifar perpuluhan sifar lima, hitung kebarangkalian tepat sebiji cip rosak.","prompt":"Kebarangkalian seunit cip elektronik adalah rosak ialah 0.05. Jika 5 unit cip dipilih secara rawak, hitung kebarangkalian tepat 1 unit cip adalah rosak (betul kepada 4 tempat perpuluhan).","options":["0.2036","0.7738","0.0407","0.2262"],"correctIndex":0,"explanation":"X ~ B(5, 0.05). P(X = 1) = 5C1 x (0.05)^1 x (0.95)^4 = 5 x 0.05 x 0.81450625 = 0.2036."}]}]};</script>

/* Lab interaktif untuk Matematik Tambahan Tingkatan 5 Bab 5: Taburan Kebarangkalian */
(function () {
  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function createEl(tag, cls, text) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function sfx(type) {
    try {
      if (window.NotaAudio && typeof window.NotaAudio[type] === "function") {
        window.NotaAudio[type]();
      }
    } catch (_) {}
  }

  function comb(n, r) {
    if (r < 0 || r > n) return 0;
    let res = 1;
    for (let i = 1; i <= r; i++) {
      res = (res * (n - r + i)) / i;
    }
    return Math.round(res);
  }

  // Hampiran fungsi taburan kumulatif Normal Piawai P(Z <= z) tepat ~1e-6
  function normCdf(z) {
    const sign = z < 0 ? -1 : 1;
    const x = Math.abs(z) / Math.SQRT2;
    const t = 1 / (1 + 0.3275911 * x);
    const poly =
      (((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t);
    const erf = 1 - poly * Math.exp(-x * x);
    return 0.5 * (1 + sign * erf);
  }

  function normPdf(z) {
    return Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
  }

  // 1. Makmal Pemboleh Ubah Rawak Diskret
  window.ETUTOR_NOTA_LABS.addm55_discrete_rv_lab = function (mount, ctx) {
    mount.innerHTML = "";
    const wrap = createEl("div", "nota-lab-card");
    wrap.style.cssText =
      "padding:14px;border-radius:16px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#f8fafc;border:1px solid rgba(56,189,248,0.28);font-family:system-ui,sans-serif;";

    const head = createEl("div", "", "Makmal 5.1: Pemboleh Ubah Rawak Diskret X");
    head.style.cssText = "font-weight:800;font-size:15px;color:#38bdf8;margin-bottom:6px;";
    wrap.appendChild(head);

    const sub = createEl(
      "div",
      "",
      "Pilih bilangan lambungan syiling adil (n) dan lihat bagaimana X = bilangan Gambar (G) membentuk taburan kebarangkalian dengan jumlah tepat 1."
    );
    sub.style.cssText = "font-size:12.5px;color:#cbd5e1;margin-bottom:10px;line-height:1.45;";
    wrap.appendChild(sub);

    const btnRow = createEl("div", "");
    btnRow.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;";
    let nCoins = 3;
    const nBtns = {};

    const outBox = createEl("div", "");
    const svgWrap = createEl("div", "");

    function render() {
      Object.keys(nBtns).forEach((k) => {
        const active = Number(k) === nCoins;
        nBtns[k].style.background = active ? "#0284c7" : "#1e293b";
        nBtns[k].style.borderColor = active ? "#7dd3fc" : "#475569";
      });

      const total = Math.pow(2, nCoins);
      const rows = [];
      let sumP = 0;
      for (let x = 0; x <= nCoins; x++) {
        const c = comb(nCoins, x);
        const p = c / total;
        sumP += p;
        rows.push({ x, c, p });
      }

      const setText = "X = {" + rows.map((r) => r.x).join(", ") + "}";
      outBox.innerHTML =
        `<div style="background:#0b1220;padding:10px 12px;border-radius:12px;border:1px solid #334155;font-size:13px;margin-bottom:10px;">` +
        `<div><b>Ruang Sampel:</b> 2^${nCoins} = ${total} kesudahan</div>` +
        `<div style="margin-top:4px;color:#fde047;"><b>Tatatanda Set:</b> ${setText}</div>` +
        `<div style="margin-top:4px;color:#4ade80;"><b>Jumlah Kebarangkalian:</b> Hasil tambah semua P(X = r) = ${sumP.toFixed(4)}</div>` +
        `</div>`;

      const w = 480;
      const h = 190;
      const padL = 42;
      const padB = 34;
      const usableW = w - padL - 20;
      const barW = Math.min(44, Math.floor(usableW / (nCoins + 1)) - 10);
      const stepX = usableW / (nCoins + 1);
      const maxP = Math.max(...rows.map((r) => r.p), 0.3);

      let bars = "";
      rows.forEach((r, idx) => {
        const bh = Math.max(6, (r.p / maxP) * 112);
        const cx = padL + stepX * idx + stepX / 2;
        const bx = cx - barW / 2;
        const by = h - padB - bh;
        bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW}" height="${bh.toFixed(1)}" rx="5" fill="#38bdf8"/>`;
        bars += `<text x="${cx.toFixed(1)}" y="${(by - 6).toFixed(1)}" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">${r.c}/${total}</text>`;
        bars += `<text x="${cx.toFixed(1)}" y="${h - 12}" text-anchor="middle" fill="#fde047" font-size="12" font-weight="700">X=${r.x}</text>`;
      });

      svgWrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;background:#0b1220;border-radius:12px;border:1px solid #334155;">
        <line x1="${padL - 8}" y1="${h - padB}" x2="${w - 14}" y2="${h - padB}" stroke="#94a3b8" stroke-width="2"/>
        ${bars}
      </svg>`;
    }

    [2, 3, 4].forEach((n) => {
      const b = createEl("button", "", `n = ${n} syiling`);
      b.type = "button";
      b.style.cssText =
        "min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #475569;color:#f8fafc;font-weight:700;font-size:13px;cursor:pointer;";
      b.addEventListener("click", () => {
        nCoins = n;
        sfx("click");
        ctx.markInteracted();
        render();
      });
      nBtns[n] = b;
      btnRow.appendChild(b);
    });

    wrap.appendChild(btnRow);
    wrap.appendChild(outBox);
    wrap.appendChild(svgWrap);
    mount.appendChild(wrap);
    render();
  };

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

        });

        });

        });
        slides.push({

        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),

        });

        });

          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({

        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),

        });

    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {

function renderConceptStep(step, card) {

        '<div class="nota-deep-body">' +
