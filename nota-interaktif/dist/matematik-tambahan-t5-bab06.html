/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;

}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }

body.is-lesson-open .nota-shell::after {

  -webkit-backdrop-filter: blur(6px);

  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {

.hud-progress-fill::after {

.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }

/* Tactile 3D Chunky Buttons */
.btn-3d {

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* Winding Duolingo Skill Path */

.path-connector-line {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab06","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":6,"title":"Fungsi Trigonometri","subtitle":"Sudut positif/negatif, 6 nisbah, graf modulus, identiti asas, sudut majmuk & berganda serta persamaan","estimatedMinutes":28,"themeAccent":"#ea580c","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/addm56-u1.jpg","voiceReactions":{"correct":"[excited] Mantap! Nisbah sukuan dan identiti trigonometri kamu tepat sekali.","combo":"[cheering] Rentak juara! Rumus sudut majmuk dan berganda dikuasai penuh.","encourage":"[gentle] Cuba semak semula sukuan sudut dan tanda nisbah trigonometri.","celebrate":"[cheering] Tahniah! Bab 6 Fungsi Trigonometri berjaya ditakluki!"},"units":[{"id":"addm56-u1","title":"Sudut Positif, Negatif & 6 Nisbah Trigonometri","subtitle":"Subtopik 6.1-6.2: Arah putaran, sukuan bulatan unit, kosek/sek/kot dan sudut pelengkap","iconType":"atom","iconUrl":"../assets/icons/addm56-u1.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u1-s1","voiceToneLabel":"Teruja","voiceCaption":"Sudut positif berputar lawan arah jam manakala sudut negatif ikut arah jam; tiga nisbah salingan baharu ialah kosek, sek dan kot.","voiceScript":"[excited] Dalam Tingkatan Lima, sudut bukan lagi terhad antara sifar hingga tiga ratus enam puluh darjah! [warm] Putaran lawan arah jam menghasilkan sudut positif, manakala ikut arah jam menghasilkan sudut negatif. Kita juga mengenali tiga nisbah salingan baharu iaitu kosek, sek dan kot.","title":"Sudut Putaran & 6 Nisbah Trigonometri (6.1-6.2)","summary":"Putaran melawan atau mengikut arah jam menentukan tanda sudut, manakala nisbah salingan memanjangkan sin, kos dan tan kepada 6 nisbah lengkap.","bullets":["<strong>Sudut Positif:</strong> Putaran lawan arah jam dari paksi-x positif; <strong>Sudut Negatif:</strong> putaran ikut arah jam.","Tolak atau tambah gandaan 360 darjah (atau 2 pi rad) untuk mencari kedudukan sukuan sudut besar.","<strong>Tiga Nisbah Salingan:</strong> kosek theta = 1/sin theta, sek theta = 1/kos theta, kot theta = 1/tan theta = kos theta / sin theta.","<strong>Sudut Pelengkap:</strong> sin(90 - theta) = kos theta, tan(90 - theta) = kot theta, sek(90 - theta) = kosek theta."],"formula":"kosek = 1/sin | sek = 1/kos | kot = 1/tan","examTip":"Tanda nisbah salingan (kosek, sek, kot) sentiasa SAMA dengan nisbah asalnya (sin, kos, tan) pada setiap sukuan.","mediaKey":"bulatan_unit_sukuan","videoClip":{"src":"../assets/matematik-tambahan-t5-bab06/video/addm56_video_fungsi_trigo_narasi.mp4","hasNarration":true,"posterKey":"bulatan_unit_sukuan","caption":"Penjanaan graf sinus, kosinus dan tangen daripada bulatan unit serta kesan amplitud dan kitaran."},"labId":"addm56_quadrant_special_lab","labTitle":"Makmal 6.1: Bulatan Unit & 6 Nisbah","labCaption":"Putar sudut dari -360 hingga +450 darjah untuk melihat sukuan, sudut rujukan dan nilai keenam-enam nisbah."},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Membimbing","voiceCaption":"Padankan sudut putaran dan nisbah salingan dengan kedudukan sukuan atau nilainya.","voiceScript":"[friendly] Padankan setiap sudut putaran atau nisbah salingan di kiri dengan kedudukan sukuan atau nilai tepat di kanan.","prompt":"Padankan sudut dan nisbah trigonometri berikut:","pairs":[{"id":"p1","left":"Sudut -120 darjah","right":"Sukuan III (sudut rujukan 60 darjah)"},{"id":"p2","left":"Sudut 405 darjah","right":"Sukuan I (sudut rujukan 45 darjah)"},{"id":"p3","left":"kosek 30 darjah","right":"2"},{"id":"p4","left":"sek 60 darjah","right":"2"}],"explanation":"-120 + 360 = 240 darjah (Sukuan III, sudut rujukan 60). 405 - 360 = 45 darjah (Sukuan I). kosek 30 = 1/sin 30 = 2; sek 60 = 1/kos 60 = 2."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Cabaran","voiceCaption":"Diberi kos theta = -3/5 dan theta dalam Sukuan II. Ramalkan nilai kot theta.","voiceScript":"[curious] Jika kos teta bernilai negatif tiga per lima dan sudut teta terletak dalam Sukuan Kedua, apakah nilai bagi kot teta?","prompt":"Diberi kos theta = -3/5 dan 90 darjah < theta < 180 darjah (Sukuan II). Tanpa kalkulator, cari nilai tepat bagi kot theta.","options":["-3/4","-4/3","3/4"],"correctIndex":0,"explanation":"Menggunakan trirangkap Pythagoras 3-4-5 dalam Sukuan II, sin theta positif iaitu +4/5. Maka kot theta = kos theta / sin theta = (-3/5) / (4/5) = -3/4."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Tepat","voiceCaption":"Cari nilai sudut rujukan sepadan dan sukuan bagi -410 darjah.","voiceScript":"[calm] Bayangkan putaran ikut arah jam sebanyak empat ratus sepuluh darjah. Di sukuan manakah garis penamat itu berhenti dan berapakah sudut rujukannya?","prompt":"Nyatakan sukuan dan sudut rujukan sepadan bagi sudut -410 darjah.","options":["Sukuan IV, sudut rujukan 50 darjah","Sukuan I, sudut rujukan 50 darjah","Sukuan III, sudut rujukan 40 darjah","Sukuan II, sudut rujukan 40 darjah"],"correctIndex":0,"explanation":"-410 + 2(360) = -410 + 720 = 310 darjah, yang terletak di Sukuan IV (270 hingga 360). Sudut rujukan = 360 - 310 = 50 darjah."}]},{"id":"addm56-u2","title":"Graf Fungsi Sinus, Kosinus, Tangen & Modulus","subtitle":"Subtopik 6.3: Amplitud, kala, asimptot dan pantulan nilai mutlak","iconType":"graph","iconUrl":"../assets/icons/addm56-u2.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Visual","voiceCaption":"Bagi graf y = a sin bx + c, |a| ialah amplitud, b menentukan bilangan kitaran dalam 360 darjah, dan c ialah anjakan menegak.","voiceScript":"[excited] Melakar graf trigonometri sangat mudah apabila kamu menguasai tiga huruf a, b, dan c! [warm] Nilai mutlak a menentukan ketinggian amplitud, nilai b menentukan kekerapan kitaran dalam tiga ratus enam puluh darjah, manakala c menganjak seluruh graf ke atas atau ke bawah.","title":"Parameter Graf & Transformasi Modulus (6.3)","summary":"Fungsi y = a f(bx) + c mengubah amplitud, kala, dan garis keseimbangan graf asas trigonometri, manakala nilai mutlak |...| memantulkan bahagian negatif ke atas paksi-x.","bullets":["Untuk sin dan kos: <strong>Amplitud = |a|</strong>, <strong>Kala = 360 darjah / b</strong> (atau 2 pi / b), dan <strong>Julat: c - |a| <= y <= c + |a|</strong>.","Untuk tan: <strong>Tiada amplitud</strong> (menghampiri garisan <strong>asimptot</strong>), <strong>Kala = 180 darjah / b</strong> (atau pi / b).","<strong>Graf Modulus y = |f(x)|:</strong> Bahagian lengkung di bawah paksi-x dipantulkan ke atas paksi-x."],"formula":"Kala sin/kos = 360/b | Kala tan = 180/b","examTip":"Untuk mencari bilangan penyelesaian graf persamaan seperti a sin bx + c = mx + k, lakar graf trigo dahulu, kemudian lukis garis lurus y = mx + k dan bilang titik persilangan.","mediaKey":"graf_sin_kos_tan_kala","labId":"addm56_trig_graph_lab","labTitle":"Makmal 6.3: Peneroka Graf Trigonometri","labCaption":"Ubah a, b, c serta mod modulus untuk melihat perubahan amplitud, kala dan julat y secara langsung."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Aktif","voiceCaption":"Bina sifat lengkap bagi graf y = -3 kos(2x) + 1 dalam julat 0 hingga 2 pi.","voiceScript":"[friendly] Susun ciri tepat bagi graf y sama dengan negatif tiga kos dua x tambah satu dalam selang sifar hingga dua pi.","prompt":"Lengkapkan penerangan sifat bagi fungsi y = -3 kos(2x) + 1 untuk 0 <= x <= 2 pi:","answerTokens":["Amplitud = 3,","Kala = pi,","Julat:","-2 <= y <= 4"],"distractors":["Amplitud = -3,","Kala = 2 pi,","0 <= y <= 4"],"explanation":"Amplitud sentiasa positif iaitu |-3| = 3. Kala = 2 pi / 2 = pi. Nilai maksimum = 1 + 3 = 4, minimum = 1 - 3 = -2."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s3","voiceToneLabel":"Kritis","voiceCaption":"Di manakah asimptot bagi y = tan(2x) berlaku dalam 0 <= x <= 180 darjah?","voiceScript":"[curious] Bagi graf y sama dengan tan dua x, garis asimptot berlaku apabila tan dua x tidak tertakrif. Di manakah asimptot berlaku dalam julat sifar hingga seratus lapan puluh darjah?","prompt":"Bagi fungsi y = tan(2x) dalam julat 0 darjah <= x <= 180 darjah, di nilai x manakah asimptot menegak berlaku?","options":["x = 45 darjah dan x = 135 darjah","x = 90 darjah sahaja","x = 0 darjah dan x = 180 darjah","x = 60 darjah dan x = 120 darjah"],"correctIndex":0,"explanation":"tan(theta) tidak tertakrif pada 90 dan 270 darjah. Jadi 2x = 90 darjah -> x = 45 darjah, dan 2x = 270 darjah -> x = 135 darjah."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Penilaian","voiceCaption":"Ramalkan bilangan titik persilangan antara graf y = |2 sin x| dengan garis y = 1 untuk 0 <= x <= 2 pi.","voiceScript":"[curious] Apabila graf y sama dengan nilai mutlak dua sin x dilakar daripada sifar hingga dua pi, dua bonggol positif terbentuk di atas paksi-x. [friendly] Berapakah bilangan penyelesaian jika ia bersilang dengan garis mengufuk y sama dengan satu?","prompt":"Nyatakan bilangan penyelesaian bagi persamaan |2 sin x| = 1 dalam selang 0 <= x <= 2 pi.","options":["4 penyelesaian","2 penyelesaian","3 penyelesaian"],"correctIndex":0,"explanation":"Graf y = |2 sin x| mempunyai 2 kitaran puncak berketinggian 2 dalam [0, 2 pi]. Garis y = 1 memotong setiap puncak sebanyak 2 kali, menghasilkan 2 x 2 = 4 penyelesaian."}]},{"id":"addm56-u3","title":"Identiti Asas & Pembuktian Trigonometri","subtitle":"Subtopik 6.4: Tiga identiti Pythagoras dan teknik membuktikan LHS = RHS","iconType":"formula","iconUrl":"../assets/icons/addm56-u3.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Jelas","voiceCaption":"Tiga identiti Pythagoras asas ialah sin^2 A + kos^2 A = 1, 1 + tan^2 A = sek^2 A, dan 1 + kot^2 A = kosek^2 A.","voiceScript":"[warm] Daripada satu identiti ibu, iaitu sin kuasa dua A tambah kos kuasa dua A sama dengan satu, [excited] kita boleh menerbitkan dua lagi identiti penting dengan membahagikannya kepada kos kuasa dua A dan sin kuasa dua A!","title":"Tiga Identiti Asas Pythagoras (6.4)","summary":"Tiga identiti Pythagoras menjadi tulang belakang kepada pemudahan ungkapan dan pembuktian identiti trigonometri.","bullets":["<strong>Identiti 1:</strong> sin^2 A + kos^2 A = 1.","<strong>Identiti 2 (bahagi kos^2 A):</strong> 1 + tan^2 A = sek^2 A.","<strong>Identiti 3 (bahagi sin^2 A):</strong> 1 + kot^2 A = kosek^2 A.","<strong>Strategi Pembuktian:</strong> Mula dari sisi lebih kompleks (LHS), tukar semua fungsi kepada sin/kos, dan gabung pecahan."],"formula":"sin^2 A + kos^2 A = 1 | 1 + tan^2 A = sek^2 A | 1 + kot^2 A = kosek^2 A","examTip":"Jangan sekali-kali mengalih sebutan merentasi tanda '=' semasa membuktikan identiti. Buktikan LHS berubah menjadi bentuk tepat RHS secara sehala.","mediaKey":"peta_identiti_pythagoras_majmuk","labId":"addm56_identity_compound_lab","labTitle":"Makmal 6.4: Pengesah Identiti & Sudut Berganda","labCaption":"Uji nilai sudut A dan B untuk mengesahkan kesamaan LHS dan RHS setiap identiti."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Pengukuhan","voiceCaption":"Kelaskan ungkapan trigonometri berikut mengikut nilai identiti setaranya.","voiceScript":"[friendly] Isihkan setiap ungkapan trigonometri di bawah sama ada ia bernilai satu atau bernilai sifar berdasarkan identiti asas.","prompt":"Kelaskan setiap ungkapan berikut mengikut nilai identiti setaranya:","buckets":[{"id":"satu","label":"Bernilai 1 (Identiti Pythagoras)"},{"id":"lain","label":"Bernilai tan^2 x atau kot^2 x"}],"items":[{"text":"sin^2 x + kos^2 x","bucketId":"satu","note":"Identiti asas pertama."},{"text":"sek^2 x - tan^2 x","bucketId":"satu","note":"Terbit daripada 1 + tan^2 x = sek^2 x."},{"text":"kosek^2 x - 1","bucketId":"lain","note":"Bersamaan dengan kot^2 x."},{"text":"sek^2 x - 1","bucketId":"lain","note":"Bersamaan dengan tan^2 x."}],"explanation":"Daripada tiga identiti Pythagoras asas: sin^2 x + kos^2 x = 1, sek^2 x - tan^2 x = 1, manakala sek^2 x - 1 = tan^2 x dan kosek^2 x - 1 = kot^2 x."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s3","voiceToneLabel":"Tajam","voiceCaption":"Ringkaskan ungkapan (sek^2 x - 1) / tan x kepada satu fungsi trigonometri tunggal.","voiceScript":"[curious] Jika kita mempunyai ungkapan sek kuasa dua x tolak satu dibahagi dengan tan x, apakah bentuk teringkasnya?","prompt":"Ringkaskan ungkapan (sek^2 x - 1) / tan x kepada bentuk paling mudah.","options":["tan x","kot x","sek x","sin x"],"correctIndex":0,"explanation":"Daripada identiti 1 + tan^2 x = sek^2 x, maka sek^2 x - 1 = tan^2 x. Oleh itu tan^2 x / tan x = tan x."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Logik","voiceCaption":"Susun langkah pembuktian (1 - kos^2 x)(1 + kot^2 x) = 1.","voiceScript":"[calm] Susun penjelmaan identiti untuk membuktikan bahawa satu tolak kos kuasa dua x didarab dengan satu tambah kot kuasa dua x bersamaan dengan satu.","prompt":"Susun pembuktian (1 - kos^2 x)(1 + kot^2 x) = 1:","answerTokens":["(sin^2 x)","x","(kosek^2 x)","=","1"],"distractors":["(kos^2 x)","(sek^2 x)","0"],"explanation":"1 - kos^2 x = sin^2 x dan 1 + kot^2 x = kosek^2 x = 1/sin^2 x, maka hasil darabnya ialah 1."}]},{"id":"addm56-u4","title":"Rumus Sudut Majmuk, Berganda & Separuh","subtitle":"Subtopik 6.5: sin(A +/- B), kos(A +/- B), sin 2A, kos 2A dan tan(A/2)","iconType":"scale","iconUrl":"../assets/icons/addm56-u4.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Amaran","voiceCaption":"AWAS: sin(A + B) BUKAN sin A + sin B! Untuk kos(A + B), tanda tengahnya bertukar menjadi tolak.","voiceScript":"[serious] Ingat larangan nombor satu dalam bab ini: sin kurungan A tambah B bukan sin A tambah sin B! [warm] Bagi kembangan kos pula, tanda di tengah sentiasa berlawanan. Dari rumus sudut majmuk ini, gantikan B dengan A untuk memperoleh rumus sudut berganda dua A.","title":"Sudut Majmuk, Berganda & Separuh (6.5)","summary":"Rumus sudut majmuk membolehkan pengiraan nilai tepat sudut gabungan dan penerbitan rumus sudut berganda 2A serta sudut separuh A/2.","bullets":["<strong>Sudut Majmuk:</strong> sin(A +/- B) = sin A kos B +/- kos A sin B; kos(A +/- B) = kos A kos B -/+ sin A sin B.","<strong>Sudut Berganda sin 2A:</strong> 2 sin A kos A; <strong>tan 2A:</strong> 2 tan A / (1 - tan^2 A).","<strong>Sudut Berganda kos 2A:</strong> kos^2 A - sin^2 A = 2 kos^2 A - 1 = 1 - 2 sin^2 A.","<strong>Sudut Separuh:</strong> kos^2(x/2) = (1 + kos x)/2 dan sin^2(x/2) = (1 - kos x)/2."],"formula":"kos 2A = 2 kos^2 A - 1 = 1 - 2 sin^2 A","examTip":"Pilih variasi kos 2A mengikut fungsi yang ingin dikekalkan: guna 2 kos^2 A - 1 jika hanya kosinus diperlukan, atau 1 - 2 sin^2 A jika hanya sinus diperlukan."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s2","voiceToneLabel":"Teliti","voiceCaption":"Diberi sin A = 3/5 dan kos B = 5/13 dengan A serta B sudut tirus. Cari nilai tepat sin(A + B).","voiceScript":"[curious] Diberi sudut tirus A dengan sin A tiga per lima, dan sudut tirus B dengan kos B lima per tiga belas. [friendly] Tanpa menggunakan kalkulator, apakah nilai bagi sin A tambah B?","prompt":"Diberi sin A = 3/5 dan kos B = 5/13, dengan keadaan A dan B ialah sudut tirus. Hitung nilai tepat bagi sin(A + B).","options":["63/65","33/65","56/65","16/65"],"correctIndex":0,"explanation":"Kerana A dan B sudut tirus: kos A = 4/5 dan sin B = 12/13. sin(A + B) = sin A kos B + kos A sin B = (3/5)(5/13) + (4/5)(12/13) = 63/65."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Aktif","voiceCaption":"Susun penjelmaan nilai tepat bagi sin 75 darjah menggunakan sin(45 + 30).","voiceScript":"[friendly] Susun token rumus sudut majmuk untuk mengira nilai tepat bagi sin tujuh puluh lima darjah tanpa kalkulator.","prompt":"Susun langkah mencari nilai tepat sin 75 darjah menggunakan sudut khas 45 dan 30 darjah:","answerTokens":["sin 45 kos 30","+","kos 45 sin 30","=","(punca 6 + punca 2) / 4"],"distractors":["-","(punca 6 - punca 2) / 4","sin 45 sin 30"],"explanation":"(punca 2 / 2)(punca 3 / 2) + (punca 2 / 2)(1 / 2) = (punca 6 + punca 2) / 4."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Pintar","voiceCaption":"Diberi kos 2x = 1/9 untuk x sudut tirus. Ramalkan nilai sin x tanpa mencari sudut x.","voiceScript":"[curious] Diberi kos dua x sama dengan satu per sembilan bagi sudut tirus x. Pilih bentuk kos dua x yang hanya mengandungi sin kuasa dua x, dan ramalkan nilai sin x.","prompt":"Diberi kos 2x = 1/9 dan x ialah sudut tirus. Cari nilai sin x.","options":["2/3","1/3","punca(5)/3"],"correctIndex":0,"explanation":"Gunakan kos 2x = 1 - 2 sin^2 x -> 1/9 = 1 - 2 sin^2 x -> 2 sin^2 x = 8/9 -> sin^2 x = 4/9. Oleh sebab x tirus (sin x > 0), sin x = 2/3."}]},{"id":"addm56-u5","title":"Persamaan & Aplikasi Trigonometri","subtitle":"Subtopik 6.6: Menyelesaikan persamaan trigonometri pelbagai sukuan dan masalah dunia nyata","iconType":"pendulum","iconUrl":"../assets/icons/addm56-u5.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u5-s1","voiceToneLabel":"Strategi","voiceCaption":"Untuk persamaan 2x seperti kos 2x = 0.5 dalam 0 <= x <= 360 darjah, gandakan julat kepada 0 <= 2x <= 720 darjah dahulu sebelum membahagi dua.","voiceScript":"[serious] Jangan sesekali tertinggal punca apabila menyelesaikan persamaan sudut berganda seperti kos dua x sama dengan sifar perpuluhan lima! [warm] Sentiasa gandakan julat daripada tiga ratus enam puluh menjadi tujuh ratus dua puluh darjah terlebih dahulu sebelum membahagikan kesemua sudut dengan dua.","title":"Menyelesaikan Persamaan Trigonometri (6.6)","summary":"Persamaan trigonometri diselesaikan dengan menyeragamkan fungsi/sudut, memfaktorkan, mencari sudut rujukan alpha, dan menyelaraskan julat.","bullets":["Tukarkan fungsi bercampur kepada satu nisbah tunggal menggunakan identiti asas atau rumus 2A.","Cari sudut rujukan positif alpha (abaikan tanda negatif semasa mengira songsang).","Laraskan julat terlebih dahulu: jika 0 <= x <= 360 dan persamaan melibatkan 2x, cari semua punca dalam 0 <= 2x <= 720 sebelum membahagi 2."],"formula":"0 <= x <= 360  ==>  0 <= 2x <= 720","examTip":"Jangan bahagi kedua-dua belah persamaan dengan sin x atau kos x; faktorkan supaya punca sin x = 0 atau kos x = 0 tidak hilang.","labId":"addm56_trig_solver_lab","labTitle":"Makmal 6.6: Penyelesai Persamaan Trigonometri","labCaption":"Terokai langkah pemfaktoran, pelarasan julat 2x dan pengesanan punca mengikut sukuan."},{"type":"match","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Pengukuhan","voiceCaption":"Padankan persamaan trigonometri dalam julat 0 <= x <= 360 darjah dengan himpunan penyelesaiannya.","voiceScript":"[friendly] Padankan setiap persamaan asas trigonometri di sebelah kiri dengan punca sudut yang betul antara sifar hingga tiga ratus enam puluh darjah.","prompt":"Padankan persamaan dengan penyelesaian dalam 0 darjah <= x <= 360 darjah:","pairs":[{"id":"p1","left":"tan x = -1","right":"135 darjah, 315 darjah"},{"id":"p2","left":"sin x = 1","right":"90 darjah"},{"id":"p3","left":"kos x = -0.5","right":"120 darjah, 240 darjah"},{"id":"p4","left":"sek x = 2","right":"60 darjah, 300 darjah"}],"explanation":"tan x = -1 berada di Sukuan II & IV (sudut rujukan 45). kos x = -0.5 di Sukuan II & III (sudut rujukan 60). sek x = 2 bermakna kos x = 0.5 di Sukuan I & IV."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Tepat","voiceCaption":"Selesaikan persamaan kos 2x = 0.5 bagi 0 <= x <= 180 darjah.","voiceScript":"[curious] Bagi persamaan kos dua x sama dengan sifar perpuluhan lima dalam julat terhad sifar hingga seratus lapan puluh darjah, apakah kesemua nilai x yang memuaskan?","prompt":"Selesaikan persamaan kos 2x = 0.5 bagi julat 0 darjah <= x <= 180 darjah.","options":["30 darjah, 150 darjah","60 darjah, 300 darjah","30 darjah sahaja","30 darjah, 120 darjah"],"correctIndex":0,"explanation":"Julat untuk 2x ialah 0 <= 2x <= 360 darjah. Sudut rujukan ialah 60 darjah (Sukuan I & IV untuk kos positif). Jadi 2x = 60, 300 -> x = 30, 150 darjah."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Teratur","voiceCaption":"Susun penyelesaian 2 kos^2 x + sin x - 1 = 0 bagi 0 <= x <= 360 darjah.","voiceScript":"[calm] Susun aliran pemfaktoran untuk menyelesaikan dua kos kuasa dua x tambah sin x tolak satu sama dengan sifar.","prompt":"Susun aliran menyelesaikan 2 kos^2 x + sin x - 1 = 0 untuk 0 <= x <= 360 darjah:","answerTokens":["2(1 - sin^2 x) + sin x - 1 = 0","->","(2 sin x + 1)(sin x - 1) = 0","->","90, 210, 330 darjah"],"distractors":["30, 150, 270 darjah","(2 sin x - 1)(sin x + 1) = 0"],"explanation":"Mengganti kos^2 x = 1 - sin^2 x memberi 2 sin^2 x - sin x - 1 = 0 -> (2 sin x + 1)(sin x - 1) = 0. Punca ialah sin x = 1 (90) dan sin x = -0.5 (210, 330)."}]},{"id":"addm56-u6","title":"Ujian Maut Trigonometri SPM","subtitle":"Cabaran Master: Pembuktian, graf, sudut berganda dan persamaan aras tinggi","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Cabaran Boss","voiceCaption":"Ujian Maut bermula! Selesaikan 3 sin 2x - 2 sin x = 0 bagi 0 <= x <= 360 darjah.","voiceScript":"[excited] Selamat datang ke Ujian Maut Bab Enam! [serious] Untuk persamaan tiga sin dua x tolak dua sin x sama dengan sifar, jangan bahagikan kedua-dua belah dengan sin x kerana punca sifar akan hilang! Faktorkan secara bersih dan cari semua penyelesaiannya.","prompt":"Selesaikan persamaan 3 sin 2x - 2 sin x = 0 bagi 0 darjah <= x <= 360 darjah (betul kepada 2 tempat perpuluhan jika perlu).","options":["0, 70.53, 180, 289.47, 360 darjah","70.53, 289.47 darjah sahaja","0, 19.47, 180, 340.53, 360 darjah","90, 180, 270 darjah"],"correctIndex":0,"explanation":"3(2 sin x kos x) - 2 sin x = 0 -> 2 sin x (3 kos x - 1) = 0. Maka sin x = 0 (x = 0, 180, 360) atau kos x = 1/3 (Sukuan I & IV, sudut rujukan 70.53 -> x = 70.53, 289.47)."},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Strategi","voiceCaption":"Susun ungkapan teringkas bagi pembuktian sin 2A / (1 + kos 2A).","voiceScript":"[curious] Gunakan rumus sudut berganda untuk meringkaskan sin dua A per satu tambah kos dua A menjadi satu nisbah trigonometri tunggal.","prompt":"Susun penjelmaan untuk membuktikan bahawa sin 2A / (1 + kos 2A) = tan A:","answerTokens":["(2 sin A kos A)","/","(2 kos^2 A)","=","tan A"],"distractors":["(2 sin^2 A)","kot A","1 - 2 sin^2 A"],"explanation":"Pilih kos 2A = 2 kos^2 A - 1 supaya pemalar +1 terhapus: 1 + (2 kos^2 A - 1) = 2 kos^2 A. Kemudian (2 sin A kos A)/(2 kos^2 A) = sin A / kos A = tan A."},{"type":"predict","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Visual","voiceCaption":"Ramalkan bilangan penyelesaian persamaan tan x = x / pi untuk 0 <= x <= 2 pi dengan membayangkan graf.","voiceScript":"[curious] Bayangkan graf y sama dengan tan x daripada sifar hingga dua pi bersilang dengan garis lurus y sama dengan x per pi yang bermula di asalan dan berakhir di dua. Berapakah bilangan titik persilangannya?","prompt":"Dengan membayangkan graf y = tan x dan garis lurus y = x / pi pada satah yang sama bagi 0 <= x <= 2 pi, ramalkan bilangan penyelesaian bagi persamaan tan x = x / pi.","options":["3 penyelesaian","2 penyelesaian","4 penyelesaian"],"correctIndex":0,"explanation":"Pada x = 0 kedua-dua graf melalui (0, 0) [penyelesaian 1]. Dalam selang (0, pi/2), lengkung tan x mencanak ke infiniti lalu memotong garis y = x/pi [penyelesaian 2]. Dalam selang (pi, 3pi/2), tan x positif semula dan memotong garis y = x/pi sekali lagi [penyelesaian 3]. Bagi (3pi/2, 2pi], tan x <= 0 sedangkan garis y > 0, maka tiada persilangan lagi. Jumlah keseluruhan ialah 3 penyelesaian."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s4","voiceToneLabel":"Misi Akhir","voiceCaption":"Soalan aplikasi! Diberi tan theta = t bagi sudut tirus. Ungkapkan kos 2 theta dalam sebutan t.","voiceScript":"[excited] Soalan kemuncak Bab Enam! Jika tan teta sama dengan t, apakah ungkapan kos dua teta dalam sebutan t?","prompt":"Diberi tan theta = t, dengan theta ialah sudut tirus. Ungkapkan kos 2 theta dalam sebutan t.","options":["(1 - t^2) / (1 + t^2)","(1 + t^2) / (1 - t^2)","2t / (1 + t^2)","2t / (1 - t^2)"],"correctIndex":0,"explanation":"Daripada segi tiga bersudut tegak dengan sisi bertentangan t dan sisi bersebelahan 1, hipotenus = punca(1 + t^2). Maka kos theta = 1/punca(1 + t^2). Gantikan ke dalam kos 2 theta = 2 kos^2 theta - 1 = 2/(1 + t^2) - 1 = (1 - t^2)/(1 + t^2)."}]}]};</script>

/* Lab interaktif untuk Matematik Tambahan Tingkatan 5 Bab 6: Fungsi Trigonometri */
(function () {
  window.ETUTOR_NOTA_LABS = window.ETUTOR_NOTA_LABS || {};

  function createEl(tag, cls, text) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function sfx(type) {
    try {
      if (window.NotaAudio && typeof window.NotaAudio[type] === "function") {
        window.NotaAudio[type]();
      }
    } catch (_) {}
  }

  // 1. Makmal Sukuan, Bulatan Unit & 6 Nisbah Trigonometri
  window.ETUTOR_NOTA_LABS.addm56_quadrant_special_lab = function (mount, ctx) {
    mount.innerHTML = "";
    const wrap = createEl("div", "nota-lab-card");
    wrap.style.cssText =
      "padding:14px;border-radius:16px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#f8fafc;border:1px solid rgba(56,189,248,0.28);font-family:system-ui,sans-serif;";

    const head = createEl("div", "", "Makmal 6.1: Bulatan Unit, Sudut Rujukan dan 6 Nisbah");
    head.style.cssText = "font-weight:800;font-size:15px;color:#38bdf8;margin-bottom:6px;";
    wrap.appendChild(head);

    let deg = 150;

    const sliderBox = createEl("div", "");
    sliderBox.style.cssText = "background:#0b1220;padding:8px 12px;border-radius:10px;border:1px solid #334155;margin-bottom:10px;";
    const lbl = createEl("div", "", "Sudut theta = 150 darjah");
    lbl.style.cssText = "font-size:13px;font-weight:700;color:#fde047;margin-bottom:4px;";
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "-360";
    slider.max = "450";
    slider.step = "15";
    slider.value = "150";
    slider.style.cssText = "width:100%;min-height:36px;accent-color:#38bdf8;";
    slider.addEventListener("input", () => {
      deg = Number(slider.value);
      lbl.textContent = `Sudut theta = ${deg} darjah (${deg >= 0 ? "Lawan jam: Positif" : "Ikut jam: Negatif"})`;
      ctx.markInteracted();
      render();
    });
    sliderBox.appendChild(lbl);
    sliderBox.appendChild(slider);

    const grid = createEl("div", "");
    grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:center;";
    const svgBox = createEl("div", "");
    const valBox = createEl("div", "");

    grid.appendChild(svgBox);
    grid.appendChild(valBox);
    wrap.appendChild(sliderBox);
    wrap.appendChild(grid);
    mount.appendChild(wrap);

    function render() {
      const rad = (deg * Math.PI) / 180;
      const normDeg = ((deg % 360) + 360) % 360;
      let sukuan = "Paksi";
      let refAngle = normDeg;
      let rule = "Semua +";
      if (normDeg > 0 && normDeg < 90) {
        sukuan = "Sukuan I";
        refAngle = normDeg;
        rule = "Semua (sin, kos, tan) +";
      } else if (normDeg > 90 && normDeg < 180) {
        sukuan = "Sukuan II";
        refAngle = 180 - normDeg;
        rule = "Sinus & Kosekan +";
      } else if (normDeg > 180 && normDeg < 270) {
        sukuan = "Sukuan III";
        refAngle = normDeg - 180;
        rule = "Tangen & Kotangen +";
      } else if (normDeg > 270 && normDeg < 360) {
        sukuan = "Sukuan IV";
        refAngle = 360 - normDeg;
        rule = "Kosinus & Sekan +";
      } else {
        refAngle = normDeg === 0 || normDeg === 180 ? 0 : 90;
        rule = "Pada paksi sempadan";
      }

      const cx = 120;
      const cy = 120;
      const r = 82;
      const px = cx + r * Math.cos(rad);
      const py = cy - r * Math.sin(rad);

      svgBox.innerHTML = `<svg viewBox="0 0 240 240" style="width:100%;max-width:250px;height:auto;display:block;margin:auto;background:#0b1220;border-radius:12px;border:1px solid #334155;">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2.5"/>
        <line x1="20" y1="${cy}" x2="220" y2="${cy}" stroke="#64748b" stroke-width="1.5"/>
        <line x1="${cx}" y1="20" x2="${cx}" y2="220" stroke="#64748b" stroke-width="1.5"/>
        <line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#fde047" stroke-width="3"/>
        <line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${cy}" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,3"/>
        <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="6" fill="#fde047"/>
        <text x="172" y="54" fill="#94a3b8" font-size="11" font-weight="700">I (S)</text>
        <text x="52" y="54" fill="#94a3b8" font-size="11" font-weight="700">II (A/Sin)</text>
        <text x="48" y="196" fill="#94a3b8" font-size="11" font-weight="700">III (Tan)</text>
        <text x="166" y="196" fill="#94a3b8" font-size="11" font-weight="700">IV (Kos)</text>
      </svg>`;

      const s = Math.sin(rad);
      const c = Math.cos(rad);
      const t = Math.abs(c) < 1e-9 ? null : s / c;
      const fmt = (v) => (v === null || Math.abs(v) > 999 ? "Tidak tertakrif" : v.toFixed(4));

      valBox.innerHTML =
        `<div style="background:#0b1220;padding:10px 12px;border-radius:12px;border:1px solid #334155;font-size:12.5px;line-height:1.6;">` +
        `<div><b style="color:#38bdf8;">Kedudukan:</b> ${sukuan} (${rule})</div>` +
        `<div><b style="color:#fde047;">Sudut Rujukan Sepadan:</b> ${refAngle} darjah</div>` +
        `<hr style="border-color:#334155;margin:6px 0;"/>` +
        `<div>sin = <b>${fmt(s)}</b> | kosek = <b>${fmt(Math.abs(s) < 1e-9 ? null : 1 / s)}</b></div>` +
        `<div>kos = <b>${fmt(c)}</b> | sek = <b>${fmt(Math.abs(c) < 1e-9 ? null : 1 / c)}</b></div>` +
        `<div>tan = <b>${fmt(t)}</b> | kot = <b>${fmt(Math.abs(s) < 1e-9 ? null : c / s)}</b></div>` +
        `</div>`;
    }

    render();
  };

  // 2. Makmal Graf Fungsi Trigonometri y = a f(bx) + c
  window.ETUTOR_NOTA_LABS.addm56_trig_graph_lab = function (mount, ctx) {
    mount.innerHTML = "";
    const wrap = createEl("div", "nota-lab-card");
    wrap.style.cssText =
      "padding:14px;border-radius:16px;background:linear-gradient(145deg,#1e1b4b,#0f172a);color:#f8fafc;border:1px solid rgba(251,146,60,0.35);font-family:system-ui,sans-serif;";

    const head = createEl("div", "", "Makmal 6.3: Peneroka Graf Trigonometri & Modulus");
    head.style.cssText = "font-weight:800;font-size:15px;color:#fb923c;margin-bottom:6px;";
    wrap.appendChild(head);

    let fnType = "sin"; // sin, cos, tan, abs_sin
    let a = 2;
    let b = 2;
    let c = 1;

    const btnRow = createEl("div", "");
    btnRow.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;";
    const fnBtns = {};
    const fns = [
      { id: "sin", label: "a sin(bx) + c" },
      { id: "cos", label: "a kos(bx) + c" },
      { id: "tan", label: "a tan(bx) + c" },
      { id: "abs_sin", label: "|a sin(bx)| + c" },
    ];

    const ctrl = createEl("div", "");
    ctrl.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:10px;";

    function mkS(title, min, max, step, val, cb) {
      const box = createEl("div", "");
      box.style.cssText = "background:#0b1220;padding:8px 10px;border-radius:10px;border:1px solid #334155;";
      const lbl = createEl("div", "", title);
      lbl.style.cssText = "font-size:12px;font-weight:700;color:#e2e8f0;margin-bottom:4px;";
      const inp = document.createElement("input");
      inp.type = "range";
      inp.min = min;
      inp.max = max;
      inp.step = step;
      inp.value = val;
      inp.style.cssText = "width:100%;min-height:36px;accent-color:#fb923c;";
      inp.addEventListener("input", () => {
        ctx.markInteracted();
        cb(Number(inp.value), lbl);
      });
      box.appendChild(lbl);
      box.appendChild(inp);
      return box;
    }

    const svgBox = createEl("div", "");
    const infoBox = createEl("div", "");

    fns.forEach((f) => {
      const btn = createEl("button", "", f.label);
      btn.type = "button";
      btn.style.cssText =
        "min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid #475569;color:#f8fafc;font-weight:700;font-size:12.5px;cursor:pointer;";
      btn.addEventListener("click", () => {
        fnType = f.id;
        sfx("click");
        ctx.markInteracted();
        render();
      });
      fnBtns[f.id] = btn;
      btnRow.appendChild(btn);
    });

    ctrl.appendChild(
      mkS("a = 2", -3, 3, 1, a, (v, l) => {
        a = v === 0 ? 1 : v;
        l.textContent = `a = ${a}`;
        render();
      })
    );
    ctrl.appendChild(
      mkS("b = 2 kitaran", 1, 3, 0.5, b, (v, l) => {
        b = v;
        l.textContent = `b = ${b}`;
        render();
      })
    );
    ctrl.appendChild(
      mkS("c = 1 anjakan", -2, 2, 1, c, (v, l) => {
        c = v;
        l.textContent = `c = ${c}`;
        render();
      })
    );

    wrap.appendChild(btnRow);
    wrap.appendChild(ctrl);
    wrap.appendChild(svgBox);
    wrap.appendChild(infoBox);
    mount.appendChild(wrap);

    function evalY(deg) {
      const r = (b * deg * Math.PI) / 180;
      if (fnType === "sin") return a * Math.sin(r) + c;
      if (fnType === "cos") return a * Math.cos(r) + c;
      if (fnType === "abs_sin") return Math.abs(a * Math.sin(r)) + c;

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

function buildConceptSlides(step, parts) {
  var slides = [];
  var isBite = parts.isBite;
  var bullets = parts.bullets || [];
  var titleMiniHtml = '<h3 class="flash-slide-title">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h3>";

  if (isBite) {
    if (parts.heroMediaHtml) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + parts.heroMediaHtml
      });
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        if (bullets.length > 0 || parts.formulaHtml || parts.biteTipHtml) {
          slides.push({
            label: tUi("Fakta & Tip", "Key Facts"),
            html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
          });
        }
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      } else if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      } else if (bullets.length >= 2) {
        slides.push({
          label: tUi("Fakta 1", "Fact 1"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta 2 & Tip", "Fact 2 & Tip"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
    } else {
      if (bullets.length >= 2) {
        slides.push({
          label: tUi("Konsep 1", "Concept 1"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
    }
    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {
      var headLead = !primaryVisual ? (parts.hookHtml + parts.titleHtml + summaryLeadHtml) : titleMiniHtml;
      slides.push({
        label: tUi("Peta Konsep", "Concept Map"),
        hasMindMap: Boolean(parts.mindMapHostHtml),
        html: headLead + parts.mindMapHostHtml + parts.formulaHtml + parts.deepDrawerHtml
      });
    }
    if (parts.labHtml) {
      slides.push({
        label: tUi("Makmal", "Lab"),
        hasLab: true,
        html: titleMiniHtml + parts.labHtml
      });
    }
  }

  return slides;
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"
