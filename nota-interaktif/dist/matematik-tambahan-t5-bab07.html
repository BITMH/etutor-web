/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {

}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab07","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":7,"title":"Pengaturcaraan Linear","subtitle":"Model ketaksamaan kekangan, rantau tersaur R, kaedah garis selari fungsi objektif dan optimum integer","estimatedMinutes":22,"themeAccent":"#16a34a","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/addm57-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Model ketaksamaan dan titik optimum kamu betul.","combo":"[cheering] Rentak cemerlang! Kamu menguasai garis selari dan kekangan integer.","encourage":"[gentle] Semak semula kata kunci ketaksamaan seperti 'sekurang-kurangnya' atau 'tidak melebihi'.","celebrate":"[cheering] Tahniah! Bab 7 Pengaturcaraan Linear berjaya diselesaikan!"},"units":[{"id":"addm57-u1","title":"Model Pengaturcaraan Linear & Ketaksamaan","subtitle":"Subtopik 7.1: Pemboleh ubah keputusan, fungsi objektif dan garis sempadan","iconType":"scale","iconUrl":"../assets/icons/addm57-u1.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u1-s1","voiceToneLabel":"Teruja","voiceCaption":"Pengaturcaraan linear memodelkan masalah pengoptimuman menggunakan ketaksamaan kekangan dan satu fungsi objektif k = ax + by.","voiceScript":"[excited] Bayangkan kamu menguruskan sebuah kilang kek dengan bajet dan masa terhad. [warm] Bagaimanakah memaksimumkan keuntungan? Itulah kuasa Pengaturcaraan Linear! Kita menukar setiap syarat kekangan menjadi ketaksamaan linear, serta membina satu fungsi objektif k sama dengan a x tambah b y.","title":"Membentuk Model Pengaturcaraan Linear (7.1)","summary":"Setiap masalah pengaturcaraan linear diterjemahkan kepada pemboleh ubah keputusan (x, y), sistem ketaksamaan kekangan dan satu fungsi objektif k = ax + by.","bullets":["<strong>Garis Padu (<= atau >=):</strong> Digunakan untuk 'tidak melebihi', 'selebih-lebihnya', 'sekurang-kurangnya' atau 'minimum'.","<strong>Garis Sempang (< atau >):</strong> Digunakan untuk 'kurang daripada' atau 'melebihi' secara ketat.","<strong>Perangkap Nisbah:</strong> 'Bilangan meja (y) sekurang-kurangnya dua kali bilangan kerusi (x)' ditulis sebagai y >= 2x (bukan 2y >= x!)."],"formula":"Fungsi Objektif: k = ax + by","examTip":"Uji ayat nisbah dengan angka mudah: jika kerusi x = 5, maka meja y sekurang-kurangnya 10, justeru y >= 2x.","mediaKey":"garis_padu_vs_sempang","labId":"addm57_inequality_region_lab","labTitle":"Makmal 7.1: Garis Padu, Sempang & Pekali y Negatif","labCaption":"Uji ketaksamaan termasuk kes perangkap pekali y negatif seperti x - 2y >= -4."},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Membimbing","voiceCaption":"Padankan frasa pernyataan masalah dengan ketaksamaan linear dan jenis garis sempadannya.","voiceScript":"[friendly] Mari berlatih menterjemah ayat masalah dunia nyata kepada simbol ketaksamaan linear yang tepat.","prompt":"Padankan frasa syarat dengan model ketaksamaan yang tepat:","pairs":[{"id":"p1","left":"Jumlah buku x dan y tidak melebihi 80 buah","right":"x + y <= 80 (Garis padu)"},{"id":"p2","left":"Bilangan y kurang daripada 3 kali bilangan x","right":"y < 3x (Garis sempang)"},{"id":"p3","left":"Jumlah kos RM5x + RM8y sekurang-kurangnya RM200","right":"5x + 8y >= 200 (Garis padu)"},{"id":"p4","left":"Nisbah x kepada y tidak lebih daripada 2 : 3","right":"3x <= 2y (Garis padu)"}],"explanation":"Nisbah x : y <= 2 : 3 bermakna x / y <= 2 / 3 -> 3x <= 2y (kerana y > 0). Tanda ketat '<' menggunakan garis sempang."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Awas","voiceCaption":"Kos seunit produk P ialah RM20 dan Q ialah RM30. Jumlah kos tidak boleh melebihi RM600. Ramalkan ketaksamaan teringkasnya.","voiceScript":"[curious] Jika sehelai baju berharga dua puluh ringgit dan sehelai seluar tiga puluh ringgit, dan jumlah perbelanjaan tidak melebihi enam ratus ringgit, apakah ketaksamaan teringkasnya?","prompt":"Kos seunit produk P ialah RM20 dan produk Q ialah RM30. Jumlah kos untuk x unit P dan y unit Q tidak boleh melebihi RM600. Tentukan ketaksamaan dalam bentuk paling ringkas.","options":["2x + 3y <= 60","3x + 2y <= 60","2x + 3y < 60"],"correctIndex":0,"explanation":"20x + 30y <= 600 dibahagi dengan 10 menghasilkan 2x + 3y <= 60. Frasa 'tidak boleh melebihi' termasuk nilai sempadan (<=)."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Semakan","voiceCaption":"Tentukan jenis garis dan kedudukan rantau bagi ketaksamaan x - 2y >= -4.","voiceScript":"[serious] Berhati-hati dengan tanda pekali y yang negatif! Untuk ketaksamaan x tolak dua y lebih besar atau sama dengan negatif empat, adakah rantaunya di atas atau di bawah garis?","prompt":"Pada satah Cartes, di manakah letaknya rantau yang memuaskan ketaksamaan x - 2y >= -4?","options":["Di bawah garis padu x - 2y = -4","Di atas garis padu x - 2y = -4","Di bawah garis sempang x - 2y = -4","Di atas garis sempang x - 2y = -4"],"correctIndex":0,"explanation":"x - 2y >= -4 boleh disusun menjadi 2y <= x + 4 -> y <= 0.5x + 2. Kerana y <= ..., rantau terletak di BAWAH garis padu. Uji (0, 0): 0 - 0 = 0 >= -4 (benar)."}]},{"id":"addm57-u2","title":"Rantau Tersaur & Ketaksamaan Dua Pemboleh Ubah","subtitle":"Subtopik 7.1: Melorek rantau tersaur R dan membaca ketaksamaan daripada graf","iconType":"graph","iconUrl":"../assets/icons/addm57-u2.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Visual","voiceCaption":"Rantau tersaur R ialah kawasan persilangan sepunya yang memuaskan kesemua ketaksamaan serentak.","voiceScript":"[warm] Apabila semua ketaksamaan kekangan dilukis pada kertas graf yang sama, kawasan bertindih yang memuaskan setiap satu daripadanya digelar Rantau Tersaur R. [excited] Pastikan kamu menggunakan titik uji jika ragu-ragu dengan arah lorekan!","title":"Menentukan Rantau Tersaur R (7.1)","summary":"Rantau Tersaur R ialah rantau bertindih yang memenuhi setiap kekangan model pada satah Cartes secara serentak.","bullets":["Jadikan pekali y positif dalam y ... mx + c: tanda <= lorek di bawah garis; tanda >= lorek di atas garis.","<strong>Kaedah Titik Uji:</strong> Pilih titik jelas seperti (0, 0); jika ketaksamaan asal benar, rantau berada pada sisi titik itu.","Untuk garis menegak x >= 10, lorek di sebelah kanan; untuk garis mengufuk y <= 20, lorek di bawah."],"formula":"Lorek HANYA kawasan persilangan sepunya dan labelkan R","examTip":"Dalam kertas SPM, elakkan melorek luar kawasan sepunya dengan tebal; tandakan anak panah kecil dahulu dan lorek hanya rantau R yang akhir.","labId":"addm57_feasible_objective_lab","labTitle":"Makmal 7.2: Rantau Tersaur R & Garis Selari","labCaption":"Anjakkan garis selari fungsi objektif merentasi rantau tersaur R untuk melihat titik bucu optimum."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Aktif","voiceCaption":"Bina ketaksamaan garis lurus yang melalui (0, 6) dan (12, 0) apabila rantau R terletak di bawah garis padu tersebut.","voiceScript":"[friendly] Susun token untuk membentuk ketaksamaan bagi garis padu yang memotong paksi-y di enam dan paksi-x di dua belas jika rantau R berada di bawahnya.","prompt":"Sebuah garis padu melalui (0, 6) dan (12, 0), dan rantau R berada di bawah garis itu. Susun ketaksamaan teringkas:","answerTokens":["x","+","2y","<=","12"],"distractors":[">=","2x","6"],"explanation":"Persamaan garis: x/12 + y/6 = 1 -> darab 12 menjadi x + 2y = 12. Kerana rantau di bawah garis padu (termasuk asalan (0,0)), x + 2y <= 12."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s3","voiceToneLabel":"Analisis","voiceCaption":"Suatu rantau dibatasi oleh garis y = x, y = 8 - x, dan x = 0 dengan titik dalaman (1, 4). Apakah tiga ketaksamaannya?","voiceScript":"[curious] Jika titik satu koma empat berada di dalam rantau yang dibatasi oleh y sama dengan x, y sama dengan lapan tolak x, dan paksi-y, tentukan ketaksamaan yang benar bagi ketiga-tiganya.","prompt":"Titik (1, 4) terletak di dalam rantau tersaur R yang dibatasi oleh garis padu y = x, x + y = 8, dan paksi-y (x = 0). Apakah tiga ketaksamaan yang mentakrifkan R?","options":["y >= x, x + y <= 8, x >= 0","y <= x, x + y <= 8, x >= 0","y >= x, x + y >= 8, x >= 0","y <= x, x + y >= 8, x <= 0"],"correctIndex":0,"explanation":"Uji (1, 4): 4 >= 1 (maka y >= x); 1 + 4 = 5 <= 8 (maka x + y <= 8); dan 1 >= 0 (maka x >= 0)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Semakan","voiceCaption":"Kelaskan frasa dan tanda ketaksamaan mengikut jenis garis sempadan: Garis Padu atau Garis Sempang.","voiceScript":"[friendly] Isihkan setiap frasa dan simbol ketaksamaan di bawah sama ada ia dilukis dengan garis padu atau garis sempang.","prompt":"Kelaskan kekangan berikut mengikut jenis garis sempadan yang betul:","buckets":[{"id":"padu","label":"Garis Padu (Sempadan Termasuk)"},{"id":"sempang","label":"Garis Sempang (Sempadan Tidak Termasuk)"}],"items":[{"text":"x + y <= 40","bucketId":"padu","note":"Tanda <= merangkumi garis sempadan."},{"text":"y > 2x","bucketId":"sempang","note":"Tanda ketat > menolak titik di atas garis."},{"text":"Sekurang-kurangnya 15 peserta","bucketId":"padu","note":"Bermaksud >= 15 (termasuk 15)."},{"text":"Kurang daripada RM500","bucketId":"sempang","note":"Bermaksud < 500 secara ketat."}],"explanation":"Simbol <= dan >= menghasilkan garis padu; simbol < dan > menghasilkan garis sempang."}]},{"id":"addm57-u3","title":"Fungsi Objektif & Kaedah Garis Selari","subtitle":"Subtopik 7.1-7.2: Menggerakkan garis k = ax + by dan mencari titik bucu optimum","iconType":"formula","iconUrl":"../assets/icons/addm57-u3.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Strategi","voiceCaption":"Fungsi objektif k = ax + by dilukis untuk satu nilai k pilihan, kemudian digerakkan secara selari ke titik bucu terjauh atau terdekat dalam R.","voiceScript":"[excited] Bagaimanakah menentukan titik optimum paling pantas tanpa menguji semua bucu? [warm] Lukiskan satu garis fungsi objektif sementara, contohnya tiga puluh x tambah dua puluh y sama dengan seratus dua puluh, lalu anjakkannya secara selari menggunakan pembaris sesiku!","title":"Kaedah Garis Selari Fungsi Objektif (7.2)","summary":"Garis fungsi objektif ax + by = k_0 dilukis dengan pintasan bulat dan dianjakkan secara selari untuk menyentuh titik optimum dalam R.","bullets":["Pilih k_0 sebagai gandaan sepunya a dan b supaya kedua-dua pintasan paksi mudah diplot.","<strong>Nilai Maksimum (a, b > 0):</strong> Anjak ke atas-kanan hingga menyentuh titik terakhir dalam R.","<strong>Nilai Minimum (a, b > 0):</strong> Anjak ke bawah-kiri hingga menyentuh titik pertama dalam R."],"formula":"ax + by = k_0  ->  Pintasan-x = k_0/a, Pintasan-y = k_0/b","examTip":"Sentiasa semak nilai k pada titik optimum terpilih serta dua bucu berdekatan secara algebra bagi memastikan ketepatan mutlak.","mediaKey":"rantau_tersaur_optimum","videoClip":{"src":"../assets/matematik-tambahan-t5-bab07/video/addm57_video_pengaturcaraan_linear_narasi.mp4","hasNarration":true,"posterKey":"rantau_tersaur_optimum","caption":"Penentuan rantau tersaur daripada ketaksamaan kekangan dan kaedah garis fungsi objektif optimum."}},{"type":"mcq","xp":25,"voiceIdKey":"u3-s2","voiceToneLabel":"Kiraan","voiceCaption":"Suatu rantau R mempunyai bucu (0, 0), (6, 0), (4, 4), dan (0, 8). Cari nilai maksimum bagi fungsi objektif k = 30x + 20y.","voiceScript":"[curious] Jika bucu rantau tersaur R ialah sifar sifar, enam sifar, empat empat, dan sifar lapan, berapakah nilai maksimum bagi tiga puluh x tambah dua puluh y?","prompt":"Rantau tersaur R dibatasi oleh bucu-bucu (0, 0), (6, 0), (4, 4), dan (0, 8). Hitung nilai maksimum bagi fungsi objektif k = 30x + 20y.","options":["200","180","160","240"],"correctIndex":0,"explanation":"Nilai k pada bucu: (0,0) -> 0; (6,0) -> 180; (4,4) -> 30(4) + 20(4) = 200; (0,8) -> 160. Nilai maksimum ialah 200 pada titik (4, 4)."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Aktif","voiceCaption":"Susun pemilihan nilai awal k0 dan pintasan untuk melukis garis fungsi objektif k = 400x + 500y pada graf berskala 0 <= x <= 10.","voiceScript":"[friendly] Jika fungsi objektif ialah empat ratus x tambah lima ratus y dalam skala kosong hingga sepuluh, pilih nilai permulaan k sifar yang memberikan pintasan paksi bulat dan bersih.","prompt":"Untuk melukis garis selari fungsi objektif k = 400x + 500y pada graf skala 0 <= x <= 10, susun pintasan bagi k0 = 2 000:","answerTokens":["400x + 500y = 2000","->","Pintasan-x = 5,","Pintasan-y = 4"],"distractors":["Pintasan-x = 4,","Pintasan-y = 5","k0 = 900"],"explanation":"Memilih k0 = 2 000 (gandaan sepunya 400 dan 500) memberi pintasan bulat x = 2000/400 = 5 dan y = 2000/500 = 4."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Minima","voiceCaption":"Sebuah projek mempunyai bucu rantau R pada (2, 8), (5, 3), dan (9, 2). Ramalkan bucu manakah yang meminimumkan kos C = 100x + 150y.","voiceScript":"[curious] Sekarang kita cari kos minimum pula! Antara bucu dua lapan, lima tiga, dan sembilan dua, yang manakah memberi kos terendah bagi seratus x tambah seratus lima puluh y?","prompt":"Titik bucu rantau R bagi suatu masalah kos ialah (2, 8), (5, 3), dan (9, 2). Titik manakah yang meminimumkan kos C = 100x + 150y?","options":["(5, 3) dengan C = 950","(9, 2) dengan C = 1 200","(2, 8) dengan C = 1 400"],"correctIndex":0,"explanation":"C(2,8) = 200 + 1200 = 1400; C(5,3) = 500 + 450 = 950; C(9,2) = 900 + 300 = 1200. Minimum ialah 950 pada (5, 3)."}]},{"id":"addm57-u4","title":"Optimum Integer & Aplikasi Pengeluaran","subtitle":"Subtopik 7.2: Penyelesaian integer apabila bucu bukan bulat dan had kekangan tambahan","iconType":"atom","iconUrl":"../assets/icons/addm57-u4.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Teliti","voiceCaption":"Apabila pemboleh ubah mewakili objek tidak boleh dibelah seperti meja atau peserta, titik optimum mestilah pasangan integer di dalam rantau R.","voiceScript":"[serious] Ini situasi yang sering menguji pelajar SPM! Apabila garis optimum menyentuh bucu pecahan seperti lima perpuluhan lima koma empat perpuluhan lima, kamu tidak boleh membeli separuh meja! [warm] Cari titik grid integer terdekat yang masih berada di dalam rantau R.","title":"Menangani Titik Optimum Integer (7.2)","summary":"Jika koordinat bucu optimum berbentuk perpuluhan bagi objek fizikal diskret, pilih titik grid integer berhampiran yang sah di dalam R.","bullets":["Undurkan garis selari sedikit ke dalam R (kes maksimum) atau maju sedikit ke dalam R (kes minimum) sehingga menyentuh titik grid integer pertama.","Sahkan calon titik integer mematuhi SEMUA ketaksamaan asal.","<strong>Awas Garis Sempang:</strong> Titik di atas garis sempang (< atau >) adalah TIDAK SAH."],"formula":"Calon (x, y) mesti integer dan mematuhi semua kekangan","examTip":"Senaraikan 2 hingga 3 titik integer paling hampir di dalam R berdekatan bucu pecahan dan hitung k bagi setiap satu untuk kepastian.","mediaKey":"titik_bucu_vs_integer","labId":"addm57_aplikasi_lp_lab","labTitle":"Makmal 7.3: Penguji Titik Grid Integer","labCaption":"Uji beberapa koordinat integer dalam R untuk memaksimumkan keuntungan P = 40x + 30y."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s2","voiceToneLabel":"Ujian Titik","voiceCaption":"Kekangan ialah x + y <= 10, x <= 6, y >= 2, dengan fungsi keuntungan P = 40x + 30y. Titik integer manakah memberi keuntungan maksimum?","voiceScript":"[curious] Dengan syarat x tambah y tidak melebihi sepuluh, x selebih-lebihnya enam, dan y sekurang-kurangnya dua, titik integer manakah memaksimumkan empat puluh x tambah tiga puluh y?","prompt":"Diberi kekangan x + y <= 10, x <= 6, dan y >= 2 untuk integer x, y. Apakah pasangan (x, y) yang memaksimumkan P = 40x + 30y?","options":["(6, 4) dengan P = 360","(5, 5) dengan P = 350","(6, 2) dengan P = 300","(4, 6) dengan P = 340"],"correctIndex":0,"explanation":"Pekali x (40) lebih besar daripada y (30), maka maksimumkan x kepada 6 dan pilih y terbesar iaitu 4 supaya 6 + 4 <= 10. P(6, 4) = 40(6) + 30(4) = 360."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Semakan","voiceCaption":"Padankan situasi sempadan dan kekangan dengan kesahan titik tersebut.","voiceScript":"[friendly] Padankan setiap titik calon dengan kesahannya berdasarkan jenis garis sempadan dan syarat integer.","prompt":"Padankan situasi titik dengan kesahannya dalam R:","pairs":[{"id":"p1","left":"Titik di atas garis padu x + y = 10","right":"SAH termasuk dalam rantau R"},{"id":"p2","left":"Titik di atas garis sempang y = 2x","right":"TIDAK SAH (hanya sempadan terbuka)"},{"id":"p3","left":"Titik (4.5, 3) untuk bilangan kerusi","right":"TIDAK SAH (perlu nilai integer)"},{"id":"p4","left":"Titik (5, 4) memenuhi semua syarat ketat","right":"SAH sebagai calon optimum integer"}],"explanation":"Garis padu merangkumi titik pada garis itu, garis sempang menolak titik pada garis itu, dan item diskret memerlukan koordinat integer."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Pantas","voiceCaption":"Jika kekangan tambahan menyatakan x > 3 (garis sempang) dan x ialah integer, apakah nilai integer terkecil bagi x?","voiceScript":"[curious] Jika x mewakili bilangan bungkusan dan ketaksamaan ialah x lebih besar secara ketat daripada tiga, apakah nilai integer terkecil yang sah bagi x?","prompt":"Jika x ialah integer dan ketaksamaan memerlukan x > 3 serta x + y <= 9, apakah nilai integer terkecil yang sah bagi x?","options":["4","3","3.1"],"correctIndex":0,"explanation":"Oleh sebab x > 3 adalah ketat, x = 3 tidak termasuk. Integer pertama yang lebih besar daripada 3 ialah x = 4."}]},{"id":"addm57-u5","title":"Ujian Maut Pengaturcaraan Linear SPM","subtitle":"Cabaran Master: Terjemahan model penuh, kekangan nisbah dan pengoptimuman","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"wordbank","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Cabaran Boss","voiceCaption":"Sebuah kolej mengambil x lelaki dan y perempuan. Jumlah tidak melebihi 100, perempuan sekurang-kurangnya 20, dan lelaki tidak lebih 2 kali perempuan.","voiceScript":"[excited] Selamat datang ke Ujian Maut Bab Tujuh! Susun tiga ketaksamaan model daripada masalah pengambilan x peserta lelaki dan y peserta perempuan.","prompt":"Lengkapkan sistem ketaksamaan untuk: jumlah x + y tidak melebihi 100, perempuan (y) sekurang-kurangnya 20, dan lelaki (x) selebih-lebihnya 2 kali perempuan:","answerTokens":["x + y <= 100,","y >= 20,","x <= 2y"],"distractors":["x >= 2y","y <= 20,","x + y < 100,"],"explanation":"Jumlah <= 100 memberi x + y <= 100; sekurang-kurangnya 20 memberi y >= 20; dan lelaki tidak lebih 2 kali perempuan memberi x <= 2y."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s2","voiceToneLabel":"Teliti","voiceCaption":"Daripada model x + y <= 100, y >= 20, x <= 2y: cari bilangan maksimum peserta lelaki (x) yang boleh diambil.","voiceScript":"[curious] Berpandukan model yang sama iaitu x tambah y kurang atau sama seratus, y sekurang-kurangnya dua puluh, dan x tidak melebihi dua y, berapakah nilai integer maksimum bagi bilangan lelaki x?","prompt":"Dalam rantau yang ditakrifkan oleh x + y <= 100, y >= 20, x <= 2y, dan x >= 0, cari nilai integer maksimum bagi x (bilangan lelaki).","options":["66","67","40","80"],"correctIndex":0,"explanation":"Persilangan x = 2y dan x + y = 100 memberi 3y = 100 -> y = 33 1/3, x = 66 2/3. Nilai integer terbesar x yang memenuhi x <= 2y dan x + y <= 100 ialah x = 66 (bersama y = 33 atau 34)."},{"type":"predict","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Strategi","voiceCaption":"Jika garis objektif memaksimumkan 2x + 3y pada bucu (5.4, 3.2), ramalkan calon integer terbaik di dalam rantau x + y <= 8, x >= 0, y >= 0.","voiceScript":"[curious] Apabila garis objektif maksimum menyentuh titik bukan integer berhampiran, calon manakah dalam kekangan x tambah y kurang atau sama lapan memberikan nilai dua x tambah tiga y paling tinggi?","prompt":"Bagi kekangan x + y <= 8 dengan x <= 5, y <= 4 (x, y integer positif), titik manakah memaksimumkan k = 2x + 3y?","options":["(4, 4) dengan k = 20","(5, 3) dengan k = 19","(5, 4) dengan k = 22"],"correctIndex":0,"explanation":"(5, 4) tidak sah kerana 5 + 4 = 9 > 8! Antara titik sah, (4, 4) memberi 2(4) + 3(4) = 20, lebih tinggi daripada (5, 3) = 19."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s4","voiceToneLabel":"Misi Akhir","voiceCaption":"Apakah berlaku apabila kecerunan garis fungsi objektif sama tepat dengan kecerunan salah satu sempadan maksimum rantau tersaur R?","voiceScript":"[excited] Soalan penutup Bab Tujuh! Apakah yang berlaku apabila kecerunan garis fungsi objektif sama tepat dengan kecerunan salah satu sempadan rantau tersaur R?","prompt":"Garis fungsi objektif k = 50x + 25y mempunyai kecerunan yang sama dengan garis sempadan maksimum 2x + y = 60 pada rantau R. Apakah kesimpulannya?","options":["Semua titik di sepanjang segmen garis sempadan itu dalam R memberi nilai maksimum sama (k = 1 500)","Masalah itu tiada penyelesaian optimum","Hanya titik asalan (0, 0) menjadi optimum","Nilai maksimum menjadi infiniti"],"correctIndex":0,"explanation":"50x + 25y = 25(2x + y). Apabila kecerunan fungsi objektif sejajar dengan sempadan luar maksimum 2x + y = 60, setiap titik pada segmen sempadan tersebut menghasilkan nilai maksimum yang sama iaitu 25(60) = 1 500."}]}]};</script>

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

      '<video class="nota-hero-video" controls' + muteAttr + ' playsinline preload="metadata" width="640" height="360"' + autoplayAttrs + posterAttr + ">" +
        sourcesHtml +
      "</video>" +
      caption +
    "</figure>"
  );
}

function buildHeroMediaHtml(step) {
  var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
  var keys = [];
  if (Array.isArray(step.mediaKeys)) keys = step.mediaKeys.slice();
  else if (step.mediaKey) keys = [step.mediaKey];
  var items = keys.map(function (k) {
    var rec = mediaMap[k];
    return rec ? { key: k, rec: rec } : null;
  }).filter(Boolean);
  if (items.length === 0) return "";

  var gridCls = items.length >= 2 ? "nota-hero-media-grid is-duo" : "nota-hero-media-grid is-single";
  var cardsHtml = items.map(function (item) {
    var r = item.rec;
    var src = r.dataUri || r.src || "";
    if (!src) return "";
    return (
      '<figure class="nota-hero-media-card">' +
        '<div class="nota-hero-media-frame">' +
          '<img src="' + src + '" alt="' + escapeHtml(r.label || tUi("Ilustrasi", "Illustration")) + '" loading="eager" decoding="async">' +
        "</div>" +
        ((r.era || r.label)
          ? '<figcaption class="nota-hero-media-meta">' +
              (r.era ? '<span class="nota-hero-era">' + escapeHtml(r.era) + "</span>" : "") +
              (r.label ? '<strong class="nota-hero-label">' + escapeHtml(r.label) + "</strong>" : "") +
            "</figcaption>"
          : "") +
      "</figure>"
    );
  }).join("");
  return cardsHtml ? '<div class="' + gridCls + '">' + cardsHtml + "</div>" : "";
}

function buildBiteCardsHtml(bullets, startIdx) {
  var offset = Number(startIdx) || 0;
  var cols = ["#2563eb", "#059669", "#7c3aed", "#d97706"];
  var cards = bullets.map(function (b, idx) {
    var numIdx = offset + idx;
    var raw = String(b || "").trim();
    var sepIdx = raw.indexOf(":");
    var head = sepIdx > 0 && sepIdx < 56 ? raw.slice(0, sepIdx).trim() : "";
    var body = sepIdx > 0 && sepIdx < 56 ? raw.slice(sepIdx + 1).trim() : raw;
    var col = cols[numIdx % cols.length];
    return (
      '<button type="button" class="bite-card js-bite-card" data-bite-idx="' + numIdx + '" style="--bite-col:' + col + ';" aria-pressed="false">' +
        '<span class="bite-num-dot tabular-nums">' + (numIdx + 1) + "</span>" +
        '<div class="bite-card-copy">' +
          '<div class="bite-card-head-row">' +
            (head ? '<strong class="bite-card-head">' + escapeHtml(head) + "</strong>" : "<span></span>") +
            '<span class="bite-check-pill" data-bite-badge="' + numIdx + '">TAP +2 XP</span>' +
          "</div>" +
          '<p class="bite-card-text">' + escapeHtml(body) + "</p>" +
        "</div>" +
      "</button>"
    );
  }).join("");
  return '<div class="bite-cards-row">' + cards + "</div>";
}

function buildConceptSlides(step, parts) {

  var titleMiniHtml = '<h3 class="flash-slide-title">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h3>";

  if (isBite) {
    if (parts.heroMediaHtml) {
      slides.push({

      });
      if (parts.heroVideoHtml) {

        });

      if (parts.labHtml) {
        if (bullets.length > 0 || parts.formulaHtml || parts.biteTipHtml) {

          });
        }
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),

          html: titleMiniHtml + parts.labHtml
        });
      } else if (parts.heroVideoHtml) {

        });
      } else if (bullets.length >= 2) {
        slides.push({
          label: tUi("Fakta 1", "Fact 1"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta 2 & Tip", "Fact 2 & Tip"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
    } else {
      if (bullets.length >= 2) {
        slides.push({
          label: tUi("Konsep 1", "Concept 1"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + buildBiteCardsHtml(bullets.slice(0, 1), 0)
        });
        slides.push({
          label: tUi("Fakta & Tip", "Key Facts"),
          html: titleMiniHtml + buildBiteCardsHtml(bullets.slice(1), 1) + parts.formulaHtml + parts.biteTipHtml
        });
      } else {
        slides.push({
          label: tUi("Konsep", "Concept"),
          html: parts.hookHtml + parts.titleHtml + parts.biteSummaryHtml + (bullets.length > 0 ? buildBiteCardsHtml(bullets, 0) : "") + parts.formulaHtml + parts.biteTipHtml
        });
      }
      if (parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
      if (parts.labHtml) {
        slides.push({
          label: tUi("Makmal 3D", "3D Lab"),
          hasLab: true,
          html: titleMiniHtml + parts.labHtml
        });
      }
    }
  } else {
    var summaryLeadHtml = step.summary ? '<p class="bite-lead-pill">' + escapeHtml(step.summary) + "</p>" : "";
    var primaryVisual = parts.heroMediaHtml || parts.heroVideoHtml;
    if (primaryVisual) {
      slides.push({
        label: tUi("Visual", "Visual"),
        html: parts.hookHtml + parts.titleHtml + summaryLeadHtml + primaryVisual
      });
      if (parts.heroMediaHtml && parts.heroVideoHtml) {
        slides.push({
          label: tUi("Video 3D", "3D Video"),
          html: titleMiniHtml + parts.heroVideoHtml
        });
      }
    }
    if (parts.mindMapHostHtml || parts.formulaHtml || parts.deepDrawerHtml || !primaryVisual) {
      var headLead = !primaryVisual ? (parts.hookHtml + parts.titleHtml + summaryLeadHtml) : titleMiniHtml;
      slides.push({
        label: tUi("Peta Konsep", "Concept Map"),
        hasMindMap: Boolean(parts.mindMapHostHtml),

    if (parts.labHtml) {
      slides.push({
        label: tUi("Makmal", "Lab"),
        hasLab: true,
        html: titleMiniHtml + parts.labHtml
      });

  }

  return slides;
}

    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,

    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,

  });
