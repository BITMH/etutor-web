/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx]:hover {

  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"matematik-tambahan-t5-bab08","subject":"Matematik Tambahan","subjectGroup":"sains","form":5,"chapterNumber":8,"title":"Kinematik Gerakan Linear","subtitle":"Sesaran, halaju, pecutan, pembezaan dan pengamiran kinematik, jumlah jarak serta aplikasi gerakan lurus","estimatedMinutes":26,"themeAccent":"#dc2626","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/addm58-u1.jpg","voiceReactions":{"correct":"[excited] Tepat! Hubungan sesaran, halaju dan pecutan kamu sangat jelas.","combo":"[cheering] Rentak padu! Pembezaan dan pengamiran kinematik dikuasai mantap.","encourage":"[gentle] Semak semula tanda positif atau negatif pada v(t) untuk mengesan titik zarah berpatah balik.","celebrate":"[cheering] Tahniah! Kamu telah menamatkan keseluruhan 8 bab Matematik Tambahan Tingkatan 5!"},"units":[{"id":"addm58-u1","title":"Sesaran, Halaju & Pecutan Pada Garis Lurus","subtitle":"Subtopik 8.1: Konvensyen tanda kanan/kiri, vektor vs skalar dan graf gerakan","iconType":"pendulum","iconUrl":"../assets/icons/addm58-u1.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u1-s1","voiceToneLabel":"Teruja","voiceCaption":"Dalam kinematik linear, tanda + dan - menentukan arah dari titik tetap O: kanan positif, kiri negatif, dan v = 0 bermakna zarah berhenti seketika.","voiceScript":"[excited] Selamat datang ke bab penutup Matematik Tambahan Tingkatan Lima! [warm] Dalam Kinematik Gerakan Linear, tanda positif dan negatif bukan sekadar angka, tetapi arah kompas! Secara piawai, arah ke kanan dari titik tetap O ialah positif, manakala ke kiri ialah negatif.","title":"Sesaran (s), Halaju (v) & Pecutan (a) (8.1)","summary":"Sesaran, halaju dan pecutan ialah kuantiti vektor dengan konvensyen arah ke kanan (+) dan ke kiri (-) dari satu titik tetap O.","bullets":["<strong>Sesaran s (m):</strong> s = 0 di titik tetap O; s > 0 di sebelah kanan O; s < 0 di sebelah kiri O.","<strong>Halaju v (m s^-1):</strong> v > 0 bergerak ke kanan; v < 0 bergerak ke kiri; <strong>v = 0 berhenti seketika / tukar arah</strong>.","<strong>Pecutan a (m s^-2):</strong> a > 0 pecutan; a < 0 nyahpecutan; <strong>a = 0 halaju seragam (maksimum atau minimum)</strong>."],"formula":"t = 0 (awal) | v = 0 (rehat seketika) | a = 0 (halaju ekstrem)","examTip":"Jarak dan laju ialah kuantiti skalar (sentiasa >= 0), manakala sesaran dan halaju ialah kuantiti vektor (boleh negatif).","mediaKey":"syarat_pegang_kinematik","labId":"addm58_motion_numberline_lab","labTitle":"Makmal 8.1: Simulator Zarah s(t) = t^2 - 6t","labCaption":"Gerakkan masa t untuk memerhati zarah berpatah balik pada v = 0 dan bagaimana jumlah jarak dikira."},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Membimbing","voiceCaption":"Padankan syarat kinematik dengan tafsiran fizikal gerakan zarah.","voiceScript":"[friendly] Padankan setiap syarat matematik bagi s, v, dan a di kiri dengan maksud fizikal gerakannya di sebelah kanan.","prompt":"Padankan syarat kinematik dengan tafsiran gerakan yang betul:","pairs":[{"id":"p1","left":"t = 0","right":"Keadaan awal (pada permulaan gerakan)"},{"id":"p2","left":"s = 0 (t > 0)","right":"Zarah melalui titik tetap O semula"},{"id":"p3","left":"v = 0","right":"Zarah berhenti seketika / sesaran ekstrem"},{"id":"p4","left":"a = 0","right":"Halaju seragam / halaju maksimum atau minimum"}],"explanation":"t = 0 merujuk nilai awal; s = 0 ialah kedudukan titik O; v = 0 menandakan pegun seketika dan calon titik patah balik; a = 0 ialah titik halaju ekstrem."},{"type":"predict","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Kritis","voiceCaption":"Suatu zarah bergerak ke kiri dari O selama 3 saat sehingga s = -9 m, kemudian berpatah balik ke kanan sehingga s = +7 m. Ramalkan jumlah jarak yang dilalui.","voiceScript":"[curious] Bayangkan seekor semut berjalan sembilan meter ke kiri dari titik O, kemudian berpatah balik ke kanan sehingga kedudukan positif tujuh meter. [friendly] Berapakah jumlah jarak sebenar yang ditempuhnya?","prompt":"Suatu zarah bermula di O (s = 0), bergerak ke kiri sehingga s = -9 m pada t = 3 s, lalu bergerak ke kanan sehingga s = +7 m pada t = 7 s. Apakah jumlah jarak yang dilalui dalam 7 saat itu?","options":["25 m","7 m","16 m"],"correctIndex":0,"explanation":"Sesaran akhir memang +7 m, tetapi jumlah jarak mestilah mengambil kira laluan patah balik: |-9 - 0| + |7 - (-9)| = 9 + 16 = 25 m!"},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Semakan","voiceCaption":"Diberi halaju zarah v = t^2 - 5t + 4. Cari julat masa apabila zarah bergerak ke kiri.","voiceScript":"[calm] Zarah bergerak ke arah kiri apabila halajunya kurang daripada sifar. Selesaikan ketaksamaan kuadratik t kuasa dua tolak lima t tambah empat kurang daripada sifar.","prompt":"Halaju suatu zarah diberi oleh v = t^2 - 5t + 4 m s^-1. Cari julat masa t apabila zarah itu bergerak ke arah kiri (anggapan kanan sebagai positif).","options":["1 < t < 4","t < 1 atau t > 4","0 <= t < 1","t > 4"],"correctIndex":0,"explanation":"Bergerak ke kiri bermakna v < 0 -> t^2 - 5t + 4 < 0 -> (t - 1)(t - 4) < 0, iaitu julat 1 < t < 4."}]},{"id":"addm58-u2","title":"Pembezaan Kinematik: v = ds/dt dan a = dv/dt","subtitle":"Subtopik 8.2: Menukar fungsi sesaran kepada halaju dan pecutan menggunakan pembezaan","iconType":"graph","iconUrl":"../assets/icons/addm58-u2.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u2-s1","voiceToneLabel":"Jelas","voiceCaption":"Membezakan sesaran s terhadap t menghasilkan halaju v = ds/dt, dan membezakan v terhadap t menghasilkan pecutan a = dv/dt.","voiceScript":"[warm] Rantai kalkulus kinematik sangat teratur! Apabila fungsi sesaran s dalam sebutan t diberikan, bezakan sekali terhadap t untuk mendapat halaju v, [excited] dan bezakan sekali lagi untuk memperoleh pecutan a!","title":"Tangga Pembezaan Kinematik (8.2)","summary":"Halaju ialah terbitan pertama sesaran terhadap masa, manakala pecutan ialah terbitan pertama halaju (atau terbitan kedua sesaran).","bullets":["<strong>v = ds/dt</strong> ialah kecerunan tangen pada graf sesaran-masa.","<strong>a = dv/dt = d^2s/dt^2</strong> ialah kecerunan tangen pada graf halaju-masa.","Untuk mencari <strong>halaju maksimum atau minimum</strong>, selesaikan <strong>a = 0</strong> untuk mendapatkan masa t dahulu sebelum menggantikannya ke dalam v(t)."],"formula":"v = ds/dt  |  a = dv/dt = d^2s/dt^2","examTip":"Jangan tertukar: v = 0 mencari sesaran maksimum/minimum; a = 0 mencari halaju maksimum/minimum.","mediaKey":"hubungan_s_v_a_kalkulus","videoClip":{"src":"../assets/matematik-tambahan-t5-bab08/video/addm58_video_kinematik_linear_narasi.mp4","hasNarration":true,"posterKey":"hubungan_s_v_a_kalkulus","caption":"Hubungan sesaran (s), halaju (v = ds/dt) dan pecutan (a = dv/dt) serta syarat halaju maksimum dan berhenti seketika."},"labId":"addm58_sva_calculus_lab","labTitle":"Makmal 8.2: Graf s(t) dan v(t) = ds/dt","labCaption":"Gerakkan penanda masa t untuk melihat kaitan kecerunan graf s(t) dengan nilai halaju v(t) dan pecutan a(t)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Aktif","voiceCaption":"Diberi s = 2t^3 - 9t^2 + 12t. Susun ungkapan halaju dan masa zarah berhenti seketika.","voiceScript":"[friendly] Bezakan s sama dengan dua t kuasa tiga tolak sembilan t kuasa dua tambah dua belas t terhadap t, kemudian susun masa apabila zarah itu berhenti seketika.","prompt":"Diberi s = 2t^3 - 9t^2 + 12t. Susun ungkapan v = ds/dt dan nilai t apabila v = 0:","answerTokens":["v = 6t^2 - 18t + 12","->","6(t - 1)(t - 2) = 0","->","t = 1 s atau t = 2 s"],"distractors":["t = 1.5 s","v = 6t^2 - 9t + 12","a = 0"],"explanation":"ds/dt = 6t^2 - 18t + 12 = 6(t - 1)(t - 2) = 0, memberi t = 1 s dan t = 2 s."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s3","voiceToneLabel":"Tepat","voiceCaption":"Sebuah objek mempunyai s = t^3 - 6t^2 + 9t + 2. Cari nilai halaju minimumnya.","voiceScript":"[curious] Gunakan rumus pecutan sifar untuk mencari bilakah halaju objek mencapai nilai minimum, lalu kira nilai halaju minimum itu.","prompt":"Sesaran suatu zarah ialah s = t^3 - 6t^2 + 9t + 2 m. Hitung halaju minimum, dalam m s^-1, zarah tersebut.","options":["-3 m s^-1","0 m s^-1","2 m s^-1","9 m s^-1"],"correctIndex":0,"explanation":"v = 3t^2 - 12t + 9, a = 6t - 12. Halaju minimum apabila a = 0 -> t = 2 s. Maka v(2) = 3(4) - 12(2) + 9 = -3 m s^-1."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Nyahpecutan","voiceCaption":"Diberi v = 24t - 6t^2. Ramalkan julat masa apabila objek mengalami nyahpecutan.","voiceScript":"[curious] Diberi fungsi halaju v sama dengan dua puluh empat t tolak enam t kuasa dua. Bilakah pecutan bertukar daripada positif kepada negatif?","prompt":"Halaju suatu objek diberi oleh v = 24t - 6t^2. Untuk julat masa manakah objek mengalami nyahpecutan?","options":["t > 2 s","0 <= t < 2 s","t > 4 s"],"correctIndex":0,"explanation":"a = dv/dt = 24 - 12t. Nyahpecutan berlaku apabila a < 0 -> 24 - 12t < 0 -> t > 2 s."}]},{"id":"addm58-u3","title":"Jumlah Jarak, Rehat Seketika & Jarak Saat ke-n","subtitle":"Subtopik 8.1-8.2: Perbezaan jumlah jarak n saat pertama dengan jarak dalam saat ke-n","iconType":"scale","iconUrl":"../assets/icons/addm58-u3.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u3-s1","voiceToneLabel":"Berhati-hati","voiceCaption":"Jumlah jarak dalam n saat pertama mesti memecahkan selang pada titik v = 0; manakala jarak dalam saat ke-n ialah |s_n - s_(n-1)|.","voiceScript":"[serious] Ini kesalahan paling popular pelajar SPM dalam Bab Lapan! [warm] Sentiasa bezakan 'jumlah jarak dalam n saat pertama' iaitu dari sifar hingga n dengan memeriksa titik patah balik v sifar, berbanding 'jarak dalam saat ke-n' iaitu perubahan jarak antara t sama dengan n tolak satu dan n sahaja!","title":"Jumlah Jarak vs Jarak Saat ke-n (8.1-8.2)","summary":"Pengiraan jumlah jarak memerlukan pecahan segmen setiap kali zarah berpatah balik (v = 0), manakala jarak dalam saat ke-n hanya mengukur selang 1 saat terakhir tersebut.","bullets":["<strong>Jumlah Jarak n saat pertama [0, n]:</strong> Cari semua t dalam (0, n) di mana v = 0; hitung s pada setiap titik dan jumlahkan |s_1 - s_0| + |s_n - s_1|.","<strong>Jarak dalam saat ke-n [n - 1, n]:</strong> Gunakan |s(n) - s(n - 1)| jika tiada titik patah balik di antara n - 1 dan n."],"formula":"Jarak saat ke-n = |s(n) - s(n - 1)|","examTip":"Jika zarah berpatah balik dalam selang, mengambil |s(n) - s(0)| akan SALAH kerana gerakan ke kanan dan kiri saling membatalkan!","mediaKey":"garis_nombor_jumlah_jarak","labId":"addm58_jumlah_jarak_lab","labTitle":"Makmal 8.3: Jumlah Jarak vs Saat ke-n","labCaption":"Bandingkan contoh buku teks KSSM antara jumlah jarak 7 saat pertama dengan jarak dalam saat ke-7."},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Semakan","voiceCaption":"Padankan istilah tempoh masa dengan selang t yang sepadan.","voiceScript":"[friendly] Padankan setiap frasa masa dalam soalan kinematik SPM dengan selang nilai t yang tepat.","prompt":"Padankan frasa tempoh gerakan dengan selang masa t:","pairs":[{"id":"p1","left":"Dalam 5 saat yang pertama","right":"Dari t = 0 hingga t = 5"},{"id":"p2","left":"Dalam saat ke-5","right":"Dari t = 4 hingga t = 5"},{"id":"p3","left":"Pada saat ke-5","right":"Pada t = 5 tepat"},{"id":"p4","left":"Di awal gerakan","right":"Pada t = 0"}],"explanation":"Perhatikan perbezaan halus kata sendi '5 saat pertama' [0, 5], 'dalam saat ke-5' [4, 5], dan 'pada saat ke-5' (titik t = 5)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s3","voiceToneLabel":"Teliti","voiceCaption":"Diberi s = 12t + 2t^2 - (1/3)t^3. Hitung jarak yang dilalui dalam saat ke-7.","voiceScript":"[curious] Diberi fungsi sesaran s sama dengan dua belas t tambah dua t kuasa dua tolak satu per tiga t kuasa tiga. Hitung jarak zarah dalam saat ketujuh, iaitu dari t enam ke t tujuh.","prompt":"Fungsi sesaran suatu zarah diberi oleh s = 12t + 2t^2 - (1/3)t^3. Cari jarak yang dilalui oleh zarah itu dalam saat ke-7.","options":["4 1/3 m","67 2/3 m","72 m","13 1/3 m"],"correctIndex":0,"explanation":"Saat ke-7 ialah antara t = 6 dan t = 7. s(6) = 72 m dan s(7) = 67 2/3 m. Jarak dalam saat ke-7 = |67 2/3 - 72| = 4 1/3 m."},{"type":"sort","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kategori","voiceCaption":"Kelaskan kuantiti dan rumus berikut kepada Kategori Vektor (ada tanda + / -) atau Skalar (sentiasa >= 0).","voiceScript":"[friendly] Isihkan istilah gerakan berikut sama ada ia bersifat vektor yang bergantung kepada arah, atau skalar yang sentiasa positif.","prompt":"Kelaskan istilah kinematik berikut kepada Kuantiti Vektor atau Kuantiti Skalar:","buckets":[{"id":"vektor","label":"Vektor (Sesaran / Halaju: Boleh + atau -)"},{"id":"skalar","label":"Skalar (Jarak / Laju / Masa: Sentiasa >= 0)"}],"items":[{"text":"Sesaran seketika s(t) dari titik O","bucketId":"vektor","note":"Boleh negatif jika zarah di kiri O."},{"text":"Jumlah jarak dalam 7 saat pertama","bucketId":"skalar","note":"Hasil tambah nilai mutlak semua segmen."},{"text":"Halaju seketika v = ds/dt","bucketId":"vektor","note":"Tanda menunjukkan arah ke kanan atau kiri."},{"text":"Masa perjalanan t dalam saat","bucketId":"skalar","note":"Masa sentiasa bukan negatif (t >= 0)."}],"explanation":"Sesaran dan halaju mempunyai arah (+ kanan, - kiri), manakala jarak dan masa hanyalah magnitud skalar yang tidak pernah negatif."}]},{"id":"addm58-u4","title":"Pengamiran & Aplikasi Kinematik Gerakan Linear","subtitle":"Subtopik 8.3-8.4: Menentukan v = Kamir a dt, s = Kamir v dt, pemalar c dan kamiran tentu","iconType":"formula","iconUrl":"../assets/icons/addm58-u4.jpg","boss":false,"steps":[{"type":"concept","xp":15,"voiceIdKey":"u4-s1","voiceToneLabel":"Menyeluruh","voiceCaption":"Pengamiran membalikkan pembezaan kinematik: v = Kamir a dt + c1 dan s = Kamir v dt + c2 dengan pemalar dicari menggunakan syarat awal.","voiceScript":"[warm] Sekarang kita menuruni tangga sebaliknya menggunakan pengamiran! [excited] Apabila pecutan a diberi, kamirkan sekali untuk memperoleh halaju v tambah c, dan kamirkan sekali lagi untuk memperoleh sesaran s tambah c. Jangan sesekali lupa mencari nilai pemalar c!","title":"Pengamiran Kinematik & Syarat Sempadan (8.3-8.4)","summary":"Pengamiran menukarkan pecutan a kepada halaju v dan seterusnya kepada sesaran s dengan menentukan pemalar pengamiran c melalui syarat awal.","bullets":["<strong>v = Kamir a dt + c_1</strong> dan <strong>s = Kamir v dt + c_2</strong>.","'Melalui titik tetap O dengan halaju awal u' bermakna pada t = 0, s = 0 dan v = u.","'Bermula dari keadaan rehat di O' bermakna pada t = 0, s = 0 dan v = 0.","Pada graf halaju-masa, sesaran dari t = a ke t = b ialah kamiran tentu Kamir_a^b v dt."],"formula":"v = Kamir a dt  |  s = Kamir v dt","examTip":"Jika nilai halaju diberi pada t = 1 s (bukan t = 0), gantikan t = 1 ke dalam fungsi halaju untuk mencari pemalar c dengan tepat.","labId":"addm58_aplikasi_kinematik_lab","labTitle":"Makmal 8.4: Pengamiran a -> v -> s","labCaption":"Ubah halaju awal v0 untuk melihat bagaimana pemalar pengamiran c mengubah v(t) dan s(t)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s2","voiceToneLabel":"Kiraan","voiceCaption":"Pecutan zarah dari O ialah a = 12t - 8. Diberi pada t = 1 s, halaju ialah -10 m s^-1. Cari fungsi halaju v.","voiceScript":"[curious] Jika pecutan zarah ialah dua belas t tolak lapan dan pada saat pertama halajunya ialah negatif sepuluh meter per saat, berapakah nilai pemalar c dan fungsi halaju v?","prompt":"Pecutan suatu zarah ialah a = 12t - 8 m s^-2. Diberi halaju pada t = 1 s ialah -10 m s^-1. Cari ungkapan v dalam sebutan t.","options":["v = 6t^2 - 8t - 8","v = 6t^2 - 8t - 10","v = 6t^2 - 8t + 2","v = 12t^2 - 8t - 10"],"correctIndex":0,"explanation":"v = Kamir (12t - 8) dt = 6t^2 - 8t + c. Gantikan t = 1, v = -10: -10 = 6 - 8 + c -> c = -8. Maka v = 6t^2 - 8t - 8."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Aplikasi","voiceCaption":"Roket air dilancarkan menegak dengan v = 20 - 10t. Susun fungsi sesaran s dan ketinggian maksimumnya.","voiceScript":"[excited] Sebiji roket air dilancarkan menegak ke atas dengan halaju dua puluh tolak sepuluh t. Susun pengamiran untuk mencari ketinggian maksimum roket apabila ia berhenti seketika di puncak.","prompt":"Sebiji roket dilancarkan dari tanah (t=0, s=0) dengan v = 20 - 10t. Susun langkah mencari ketinggian maksimum:","answerTokens":["s = 20t - 5t^2,","v = 0 -> t = 2 s,","s_maks = 20 m"],"distractors":["s_maks = 40 m","t = 4 s,","s = 20t - 10t^2,"],"explanation":"s = Kamir (20 - 10t) dt = 20t - 5t^2 (t=0, s=0 -> c=0). Roket berhenti seketika di puncak apabila v = 0 -> t = 2 s. Ketinggian maksimum = 20(2) - 5(4) = 20 m."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Kamiran Tentu","voiceCaption":"Larian Fariza mengikut v = 0.9t - 0.03t^2 untuk 0 <= t <= 30 s (sentiasa positif). Ramalkan jarak lariannya dalam 30 s.","voiceScript":"[curious] Halaju Fariza mengikut sifar perpuluhan sembilan t tolak sifar perpuluhan sifar tiga t kuasa dua selama tiga puluh saat. Oleh sebab halajunya sentiasa positif, berapakah jarak penuh lariannya?","prompt":"Halaju pelari sepanjang trek lurus ialah v = 0.9t - 0.03t^2 m s^-1 untuk 0 <= t <= 30. Cari jarak penuh, dalam m, yang dilalui dalam 30 saat.","options":["135 m","270 m","405 m"],"correctIndex":0,"explanation":"Jarak = Kamir_0^30 (0.9t - 0.03t^2) dt = [0.45t^2 - 0.01t^3]_0^30 = 0.45(900) - 0.01(27000) = 405 - 270 = 135 m."}]},{"id":"addm58-u5","title":"Ujian Maut Kinematik SPM","subtitle":"Cabaran Master: Masalah penuh pemalar tak diketahui m, n, kembali ke O dan jumlah jarak","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u5-s1","voiceToneLabel":"Cabaran Boss","voiceCaption":"Ujian Maut bermula! Zarah melalui O dengan halaju -12 dan pecutan awal -10. Diberi a = m + nt dan zarah berhenti seketika pada t = 6. Cari m dan n.","voiceScript":"[excited] Selamat datang ke Ujian Maut terakhir Matematik Tambahan Tingkatan Lima! [serious] Suatu zarah melalui O dengan halaju negatif dua belas dan pecutan negatif sepuluh, serta berhenti seketika apabila t sama dengan enam. Gunakan kedua-dua syarat untuk mencari pemalar m dan n.","prompt":"Suatu zarah melalui O dengan halaju -12 m s^-1 dan pecutan -10 m s^-2. Pecutannya selepas t saat ialah a = m + nt dan zarah berhenti seketika pada t = 6 s. Hitung nilai m dan n.","options":["m = -10, n = 4","m = -12, n = 4","m = -10, n = 2","m = 10, n = -4"],"correctIndex":0,"explanation":"Pada t = 0, a = -10 -> m = -10. Kemudian v = Kamir (-10 + nt) dt = -10t + (n/2)t^2 - 12 (kerana t=0, v=-12). Apabila t=6, v=0: 0 = -60 + 18n - 12 -> 18n = 72 -> n = 4."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Sambungan","voiceCaption":"Daripada soalan tadi (v = 2t^2 - 10t - 12), ramalkan nilai halaju minimum zarah tersebut.","voiceScript":"[curious] Dengan fungsi halaju v sama dengan dua t kuasa dua tolak sepuluh t tolak dua belas dan pecutan sifar pada t sama dengan dua perpuluhan lima saat, apakah halaju minimum zarah ini?","prompt":"Daripada soalan sebelumnya, v = 2t^2 - 10t - 12 dan a = 4t - 10. Hitung halaju minimum zarah itu.","options":["-24.5 m s^-1","-12.0 m s^-1","-18.5 m s^-1"],"correctIndex":0,"explanation":"Halaju minimum apabila a = 0 -> 4t - 10 = 0 -> t = 2.5 s. Gantikan t = 2.5 ke dalam v: 2(6.25) - 10(2.5) - 12 = 12.5 - 25 - 12 = -24.5 m s^-1."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Strategi","voiceCaption":"Suatu zarah melalui O dengan halaju 8 m s^-1 dan a = 6 - 6t. Susun pengiraan sesaran zarah dari O apabila t = 5 s.","voiceScript":"[calm] Susun aliran langkah mencari sesaran pada saat kelima apabila halaju awal lapan meter per saat dan pecutan ialah enam tolak enam t.","prompt":"Diberi pada t=0: s=0, v=8 dan a = 6 - 6t. Susun langkah menghitung s(5):","answerTokens":["v = 8 + 6t - 3t^2,","s = 8t + 3t^2 - t^3,","s(5) = -10 m"],"distractors":["s(5) = +10 m","s = 8t + 6t^2 - t^3,","v = 6t - 3t^2,"],"explanation":"v = 6t - 3t^2 + 8; s = 3t^2 - t^3 + 8t. Pada t = 5: s(5) = 8(5) + 3(25) - 125 = 40 + 75 - 125 = -10 m (10 m di kiri O)."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s4","voiceToneLabel":"Misi Akhir","voiceCaption":"Halaju zarah ialah v = t^2 - 6t + 8, dan berhenti seketika di titik P dan R. Cari jarak di antara P dan R.","voiceScript":"[excited] Soalan terakhir seluruh sukatan Matematik Tambahan Tingkatan Lima! Jika halaju zarah ialah t kuasa dua tolak enam t tambah lapan dan zarah berhenti seketika di titik P serta R, berapakah jarak di antara P dan R?","prompt":"Suatu zarah melalui O dengan halaju v = t^2 - 6t + 8 m s^-1. Zarah itu berhenti seketika di titik P dan kemudian di titik R. Hitung jarak, dalam m, antara titik P dengan titik R.","options":["4/3 m","8/3 m","20/3 m","2 m"],"correctIndex":0,"explanation":"v = (t - 2)(t - 4) = 0 -> berhenti seketika di P (t = 2) dan R (t = 4). s = (1/3)t^3 - 3t^2 + 8t. s(2) = 20/3 m; s(4) = 16/3 m. Jarak PR = |16/3 - 20/3| = 4/3 m."}]}]};</script>

(function () {

    return el;
  }

  function sfx(type) {

        window.NotaAudio[type]();
      }
    } catch (_) {}
  }

  // 1. Makmal 8.1: Zarah Pada Garis Nombor (s = t^2 - 6t)
  window.ETUTOR_NOTA_LABS.addm58_motion_numberline_lab = function (mount, ctx) {
    mount.innerHTML = "";
    const wrap = createEl("div", "nota-lab-card");
    wrap.style.cssText =
      "padding:14px;border-radius:16px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#f8fafc;border:1px solid rgba(56,189,248,0.28);font-family:system-ui,sans-serif;";

    const head = createEl("div", "", "Makmal 8.1: Simulator Zarah s(t) = t^2 - 6t pada Garis Lurus");
    head.style.cssText = "font-weight:800;font-size:15px;color:#38bdf8;margin-bottom:6px;";
    wrap.appendChild(head);

    let t = 3;
    const sliderBox = createEl("div", "");
    sliderBox.style.cssText = "background:#0b1220;padding:8px 12px;border-radius:10px;border:1px solid #334155;margin-bottom:10px;";
    const lbl = createEl("div", "", "Masa t = 3.0 s");
    lbl.style.cssText = "font-size:13px;font-weight:700;color:#fde047;margin-bottom:4px;";
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = "7";
    slider.step = "0.5";
    slider.value = "3";
    slider.style.cssText = "width:100%;min-height:36px;accent-color:#38bdf8;";
    slider.addEventListener("input", () => {
      t = Number(slider.value);
      lbl.textContent = `Masa t = ${t.toFixed(1)} s`;
      ctx.markInteracted();
      render();
    });
    sliderBox.appendChild(lbl);
    sliderBox.appendChild(slider);

    const svgBox = createEl("div", "");
    const infoBox = createEl("div", "");
    wrap.appendChild(sliderBox);
    wrap.appendChild(svgBox);
    wrap.appendChild(infoBox);
    mount.appendChild(wrap);

    function render() {
      const s = t * t - 6 * t;
      const v = 2 * t - 6;
      const a = 2;
      const totalDist = t <= 3 ? Math.abs(s) : 9 + (s + 9);

      const w = 480;
      const h = 110;
      const toX = (pos) => 240 + pos * 18; // julat -10..10
      const zx = toX(s);

      svgBox.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;background:#0b1220;border-radius:12px;border:1px solid #334155;margin-bottom:10px;">

        <circle cx="${toX(0)}" cy="62" r="5" fill="#cbd5e1"/>
        <text x="${toX(0)}" y="86" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">O (s=0)</text>
        <text x="${toX(-9)}" y="86" text-anchor="middle" fill="#fb923c" font-size="11">s=-9</text>
        <text x="${toX(7)}" y="86" text-anchor="middle" fill="#4ade80" font-size="11">s=+7</text>
        <circle cx="${zx.toFixed(1)}" cy="62" r="9" fill="#fde047"/>
        <text x="${zx.toFixed(1)}" y="34" text-anchor="middle" fill="#fde047" font-size="12" font-weight="800">Zarah (${s.toFixed(1)} m)</text>
      </svg>`;

      const arah =
        Math.abs(v) < 1e-6
          ? "REHAT SEKETIKA (v = 0, sedang berpatah balik)"
          : v > 0
          ? "Bergerak ke KANAN (v > 0)"
          : "Bergerak ke KIRI (v < 0)";

      infoBox.innerHTML =
        `<div style="background:#0b1220;padding:10px 12px;border-radius:12px;border:1px solid #334155;font-size:12.5px;line-height:1.6;">` +

function getSvgIcon(name, cls) {
  var d = NOTA_ICONS[name] || NOTA_ICONS.book;

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {

    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
