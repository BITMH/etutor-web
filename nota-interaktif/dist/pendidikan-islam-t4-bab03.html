/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-islam-t4-bab03","subject":"Pendidikan Islam","subjectGroup":"teras","form":4,"chapterNumber":3,"title":"Keutamaan Ilmu dan Amal","subtitle":"Dakwah Pemacu Kemajuan (Fussilat: 33), Tajwid T4, Kemuliaan Berdikari & Keunggulan Tokoh Empat Mazhab","estimatedMinutes":20,"themeAccent":"#0d9488","labScript":"pendidikan-islam-t4-bab03-labs.js","coverIcon":"../assets/icons/pi43-u1.jpg","editionBadge":"Edisi Simulasi 3D & Video Interaktif","isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[ceria] Tepat sekali, kefahaman ilmu dan amal anda sangat mantap!","combo":"[teruja] Hebat, teruskan momentum belajar sepanjang hayat!","encourage":"[lembut] Semak semula hukum tajwid serta sumbangan imam mazhab.","celebrate":"[bangga] Syabas, anda telah menguasai keseluruhan Bab Tiga dengan cemerlang!"},"units":[{"id":"pi43-u1","title":"Dakwah Pemacu Kemajuan & Ikhlas Beramal","subtitle":"Surah Fussilat: 33, Surah al-An'am: 162-163 & Surah al-Kahfi: 101-110","iconType":"book","iconUrl":"../assets/icons/pi43-u1.jpg","steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"pi43_u1_s1","voiceToneLabel":"Penerangan Teras","voiceCaption":"Tuntutan Surah Fussilat ayat 33 iaitu berdakwah, beramal soleh dan menjadikan Islam cara hidup.","voiceScript":"[tenang] Surah Fussilat ayat tiga puluh tiga menggariskan bahawa perkataan terbaik ialah ucapan mereka yang menyeru manusia kepada Allah, beramal soleh dan mengakui diri daripada kalangan Muslimin. [ceria] Ingat akronim mudah iaitu D.I.S: Dakwah, Islam sebagai cara hidup, dan beramal Soleh.","title":"Dakwah Pemacu Kemajuan (Surah Fussilat: 33)","acronym":"D.I.S: Dakwah - Islam Cara Hidup - Soleh (Amal Khusus & Umum)","hook":"Mengapakah seseorang pendakwah wajib membuktikan seruan lisannya melalui amal soleh?","mediaKey":"pi43_masjid_nabawi","summary":"Dakwah ialah menyeru manusia melakukan perintah Allah dan meninggalkan larangan-Nya disertai amal soleh (ibadat khusus dan umum) serta menjadikan Islam cara hidup berlandaskan keikhlasan (al-An'am: 162-163).","bullets":["Tiga tuntutan utama Surah Fussilat ayat 33: berdakwah dengan pendekatan terbaik, beramal soleh menurut al-Quran dan Sunnah, serta menjadikan Islam cara hidup menyeluruh.","Contoh Amal Soleh: Ibadat khusus (solat, puasa, zakat) dan Ibadat umum (berakhlak mulia, menolong orang lain, bekerja dengan amanah).","Kesinambungan Surah al-An'am: 162-163 dan al-Kahfi: 101-110: seluruh hidup dan ibadat hamba mesti ikhlas kerana Allah SWT tanpa menyekutukan-Nya agar tidak tergolong dalam orang yang rugi amalannya.","Empat pakar rujuk tilawah al-Quran (Muqri') daripada kalangan sahabat SAW: Abdullah bin Mas'ud, Salim Maula Abi Huzaifah, Ubay bin Ka'ab, dan Muaz bin Jabal."],"examTip":"Bezakan contoh ibadat khusus (solat/puasa/zakat) dengan ibadat umum (gotong-royong/berakhlak mulia) apabila menjawab soalan Surah Fussilat: 33."},{"type":"sort","xp":20,"voiceIdKey":"pi43_u1_s2","voiceToneLabel":"Pengelasan Amal Soleh","voiceCaption":"Kelaskan contoh amalan kepada Ibadat Khusus dan Ibadat Umum.","voiceScript":"[jelas] Kelaskan enam contoh amalan soleh berikut kepada kategori Ibadat Khusus atau Ibadat Umum.","prompt":"Kelaskan contoh amal soleh berikut:","buckets":[{"id":"khusus","label":"Ibadat Khusus"},{"id":"umum","label":"Ibadat Umum"}],"items":[{"text":"Menunaikan solat fardu lima waktu dengan sempurna","bucketId":"khusus","note":"Kewajipan ritual langsung dengan Allah SWT."},{"text":"Menolong rakan yang kesusahan dengan ikhlas","bucketId":"umum","note":"Amal kebajikan sosial berniat kerana Allah."},{"text":"Mengeluarkan zakat harta kepada golongan asnaf","bucketId":"khusus","note":"Rukun Islam yang khusus penetapan syarak."},{"text":"Menjaga adab dan bertutur sopan terhadap ibu bapa","bucketId":"umum","note":"Akhlak terpuji dalam kehidupan bermasyarakat."}],"explanation":"Ibadat khusus mempunyai tatacara khusus seperti solat, manakala ibadat umum merangkumi segala pekerjaan halal dan akhlak mulia yang diniatkan kerana Allah."},{"type":"match","xp":15,"voiceIdKey":"pi43_u1_s3","voiceToneLabel":"Padanan Muqri","voiceCaption":"Padankan istilah dakwah dan tokoh sahabat Muqri al-Quran.","voiceScript":"[tenang] Padankan empat konsep dalam unit Surah Fussilat dengan huraian tepatnya.","prompt":"Padankan konsep dan istilah berikut:","pairs":[{"id":"d1","left":"Maksud Dakwah","right":"Menyeru melakukan perintah Allah dan meninggalkan larangan-Nya"},{"id":"d2","left":"Islam Cara Hidup","right":"Melaksanakan ajaran Islam dalam semua bidang kehidupan"},{"id":"d3","left":"Muqri' Sahabat","right":"Abdullah bin Mas'ud, Ubay bin Ka'ab, Muaz bin Jabal, Salim"},{"id":"d4","left":"Pesanan Umar al-Khattab","right":"Kemuliaan umat terletak pada agama Islam itu sendiri"}],"explanation":"Empat sahabat Muqri menjadi rujukan utama bacaan al-Quran yang sahih pada zaman Rasulullah SAW."},{"type":"mcq","xp":15,"voiceIdKey":"pi43_u1_s4","voiceToneLabel":"Semakan Ayat","voiceCaption":"Mengenal pasti mesej teras al-An'am 162-163 dan al-Kahfi 110.","voiceScript":"[fokus] Apakah syarat utama agar amalan baik diterima oleh Allah SWT menurut panduan ayat tilawah Tingkatan Empat?","prompt":"Berdasarkan penghayatan Surah al-An'am (162-163) dan Surah al-Kahfi (110), apakah syarat amalan soleh diterima di sisi Allah SWT?","options":["Dilakukan dengan ikhlas kerana Allah semata-mata tanpa syirik serta mengikut syariat Rasul","Dilakukan di hadapan orang ramai supaya mendapat pujian masyarakat","Dilakukan tanpa perlu mempelajari ilmu akidah atau sunnah terlebih dahulu","Dilakukan hanya pada bulan haji sebelum meninggalkan Kota Mekah"],"correctIndex":0,"explanation":"Ikhlas (al-An'am: 162) dan mutaba'ah al-Sunnah tanpa syirik (al-Kahfi: 110) ialah dua syarat asas diterimanya setiap ibadah."}]},{"id":"pi43-u2","title":"Hukum Tajwid T4: Mad Silah, Qalqalah & Mad Lazim","subtitle":"Pengenalan Huruf, Syarat Pertemuan & Kadar Harakat Bacaan","iconType":"lantern","iconUrl":"../assets/icons/pi43-u2.jpg","steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"pi43_u2_s1","voiceToneLabel":"Kuasai Tajwid","voiceCaption":"Ringkasan tiga hukum tajwid utama Tingkatan Empat.","voiceScript":"[jelas] Terdapat tiga hukum tajwid utama dalam silibus Tingkatan Empat: pertama Mad Silah Qasirah dan Tawilah pada huruf Ha' Dhamir; kedua Qalqalah iaitu bunyi lantunan pada lima huruf Qaf, Ta', Ba', Jim, Dal; dan ketiga Mad Lazim yang wajib dibaca enam harakat.","title":"Hukum Tajwid T4: Mad Silah, Qalqalah & Mad Lazim","acronym":"QALQALAH: Ba-Ju Di To-Qo (Ba, Jim, Dal, Ta, Qaf)","hook":"Bagaimanakah membezakan bacaan dua harakat dan empat atau lima harakat selepas huruf Ha' Dhamir?","mediaKey":"pi43_kitab_klasik","summary":"Tajwid T4 merangkumi Mad Silah Qasirah (2 harakat, selain Hamzah) vs Tawilah (4/5 harakat, bertemu Hamzah), tiga tahap Qalqalah (Sughra, Kubra, Akbar) serta empat bahagian Mad Lazim (6 harakat).","bullets":["Mad Silah (Ha' Dhamir berbaris kasrah/dhammah antara dua huruf berbaris): Qasirah (2 harakat, bertemu huruf selain Hamzah) dan Tawilah (4 atau 5 harakat, bertemu huruf Hamzah pada dua kalimah berlainan).","Qalqalah (lantunan huruf Qaf, Ta', Ba', Jim, Dal): Sughra (lantunan rendah, sukun tengah kalimah/wasal), Kubra (lantunan kuat, sukun hujung ketika waqaf), Akbar (lantunan lebih kuat, bersyaddah hujung ketika waqaf).","Mad Lazim Kalimi (6 harakat dalam satu kalimah): Mukhaffaf (tiada idgham, contoh al-Ana) dan Muthaqqal (dibaca idgham/bersyaddah, contoh wa la ad-dhallin).","Mad Lazim Harfi (6 harakat pada huruf Fawatih as-Suwar pembukaan surah): Mukhaffaf (tanpa idgham seperti Yasin, Qaf) dan Muthaqqal (secara idgham seperti Alif-Lam-Mim, Ta-Sin-Mim)."],"labId":"pi43_tajwid_simulator_lab","labTitle":"Makmal Interaktif Hukum Tajwid T4","labProps":{"ruleIndex":0},"examTip":"Semua empat jenis Mad Lazim (Kalimi Mukhaffaf, Kalimi Muthaqqal, Harfi Mukhaffaf, Harfi Muthaqqal) wajib dibaca 6 harakat!"},{"type":"predict","xp":20,"voiceIdKey":"pi43_u2_s2","voiceToneLabel":"Cabaran Tajwid","voiceCaption":"Mengenal pasti jenis Qalqalah pada kalimah bersyaddah di hujung ayat.","voiceScript":"[fokus] Dengarkan kes bacaan ini. [jeda] Apabila seorang qari memberhentikan bacaan waqaf pada kalimah 'bi al-haqqi' atau 'wa tabba' yang berakhir dengan huruf Qalqalah bersyaddah, apakah hukum lantunannya?","hook":"Huruf Ba' atau Qaf bertasydid berada tepat di tempat berhenti (waqaf).","scenario":"Ahmad membaca ayat pertama Surah al-Masad secara waqaf pada kalimah 'wa tabba' yang huruf akhirnya Ba' bertanda syaddah.","prompt":"Apakah hukum Qalqalah dan cara bacaan yang betul ketika waqaf pada kalimah tersebut?","options":["Qalqalah Akbar dengan bunyi lantunan yang lebih kuat ketika waqaf","Qalqalah Sughra dengan bunyi lantunan rendah tanpa hentian","Mad Silah Tawilah dengan kadar bacaan empat atau lima harakat","Mad Lazim Harfi Mukhaffaf dengan kadar bacaan enam harakat"],"correctIndex":0,"proofLabId":"pi43_tajwid_simulator_lab","proofState":{"ruleIndex":2},"explanation":"Huruf Qalqalah yang berbaris syaddah di hujung kalimah apabila dibaca secara waqaf menghasilkan Qalqalah Akbar (lantunan paling kuat)."},{"type":"sort","xp":20,"voiceIdKey":"pi43_u2_s3","voiceToneLabel":"Pengelasan Mad","voiceCaption":"Kelaskan contoh hukum Mad mengikut kadar harakatnya.","voiceScript":"[jelas] Kelaskan hukum tajwid berikut kepada kategori dua harakat, empat atau lima harakat, atau enam harakat.","prompt":"Kelaskan hukum tajwid mengikut kadar harakat bacaannya:","buckets":[{"id":"h2","label":"2 Harakat"},{"id":"h45","label":"4 atau 5 Harakat"},{"id":"h6","label":"6 Harakat"}],"items":[{"text":"Mad Silah Qasirah (Ha' Dhamir bertemu selain Hamzah)","bucketId":"h2","note":"Dibaca panjang 2 harakat sahaja."},{"text":"Mad Silah Tawilah (Ha' Dhamir bertemu huruf Hamzah)","bucketId":"h45","note":"Kadar bacaannya 4 atau 5 harakat."},{"text":"Mad Lazim Kalimi Muthaqqal (wa la ad-dhallin)","bucketId":"h6","note":"Huruf mad bertemu huruf bersyaddah dalam satu kalimah (6 harakat)."},{"text":"Mad Lazim Harfi Muthaqqal (Alif-Lam-Mim)","bucketId":"h6","note":"Fawatih as-Suwar dibaca secara idgham (6 harakat)."}],"explanation":"Penguasaan kadar harakat (2, 4/5 dan 6 harakat) memastikan ketepatan tilawah al-Quran."},{"type":"match","xp":15,"voiceIdKey":"pi43_u2_s4","voiceToneLabel":"Padanan Istilah","voiceCaption":"Padankan istilah Fawatih as-Suwar, Ha' Dhamir, Idgham dan Qalqalah.","voiceScript":"[tenang] Padankan empat istilah ilmu tajwid berikut dengan takrif tepatnya.","prompt":"Padankan istilah tajwid dengan maksudnya:","pairs":[{"id":"tj1","left":"Ha' Dhamir","right":"Ganti nama dalam Bahasa Arab yang bermaksud '-Nya'"},{"id":"tj2","left":"Fawatih as-Suwar","right":"Huruf hijaiyah yang terletak pada permulaan surah"},{"id":"tj3","left":"Idgham","right":"Memasukkan bunyi huruf pertama kepada huruf kedua"},{"id":"tj4","left":"Qalqalah Kubra","right":"Lantunan kuat pada huruf qalqalah sukun ketika waqaf"}],"explanation":"Mengenali takrif istilah membantu murid mengesan hukum tajwid dalam mana-mana petikan surah."}]},{"id":"pi43-u3","title":"Hadis Kemuliaan Berdikari","subtitle":"Usaha Halal, Pekerjaan Para Nabi & Kelebihan Berdikari","iconType":"compass","iconUrl":"../assets/icons/pi43-u3.jpg","steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"pi43_u3_s1","voiceToneLabel":"Huraian Hadis","voiceCaption":"Hadis Abu Hurairah tentang kemuliaan mengumpul kayu api berbanding meminta-minta.","voiceScript":"[tenang] Sabda Nabi salallahu alaihi wasallam riwayat Imam al-Bukhari menegaskan bahawa mengumpul seberkas kayu api dan menanggungnya di atas belakang untuk dijual jauh lebih mulia daripada meminta-minta kepada orang lain. [ceria] Semua para Nabi bekerja keras demi mencari rezeki yang halal dan menjaga maruah diri.","title":"Kemuliaan Berdikari (Hadis Riwayat al-Bukhari)","acronym":"4 KELEBIHAN: Agama - Ekonomi - Pendidikan - Kemasyarakatan","hook":"Apakah pekerjaan mulia yang dilakukan oleh Nabi Daud AS, Nabi Idris AS dan Rasulullah SAW?","mediaKey":"pi43_kraf_berdikari","summary":"Berdikari bermaksud berusaha sendiri tanpa bergantung kepada bantuan orang lain dengan meyakini potensi diri, memelihara maruah serta mencari sumber rezeki halal.","bullets":["Pekerjaan para Nabi: Nabi Adam AS (petani), Nabi Idris AS (tukang jahit), Nabi Musa AS (penternak kambing), Nabi Daud AS (tukang besi), Nabi Zakaria AS (tukang kayu), Nabi Muhammad SAW (penggembala kambing dan peniaga).","Konsep berdikari: menggunakan potensi diri kurniaan Allah, meyakini kemampuan melaksanakan tugas, dan bersungguh-sungguh menyara kehidupan.","Empat kelebihan berdikari: Agama (Islam dipandang tinggi), Ekonomi (pendapatan diyakini halal), Pendidikan (melahirkan modal insan berkepakaran tinggi), Kemasyarakatan (memperkasakan daya saing dan taraf hidup).","Cara mencapai kejayaan beradab: mendalami ilmu pekerjaan secara berterusan dan berusaha gigih tanpa menjatuhkan orang lain."],"examTip":"Hafal jadual pekerjaan enam Nabi kerana soalan objektif atau struktur sering menanyakan padanan Nabi Daud AS (tukang besi) dan Nabi Idris AS (tukang jahit)."},{"type":"match","xp":15,"voiceIdKey":"pi43_u3_s2","voiceToneLabel":"Padanan Nabi","voiceCaption":"Padankan nama para Nabi dengan pekerjaan masing-masing.","voiceScript":"[ceria] Padankan nama empat Nabi berikut dengan bidang pekerjaan masing-masing dalam sirah.","prompt":"Padankan nama Nabi dengan pekerjaannya:","pairs":[{"id":"nb1","left":"Nabi Adam AS","right":"Petani"},{"id":"nb2","left":"Nabi Idris AS","right":"Tukang jahit"},{"id":"nb3","left":"Nabi Daud AS","right":"Tukang besi"},{"id":"nb4","left":"Nabi Zakaria AS","right":"Tukang kayu"}],"explanation":"Nabi Musa AS pula merupakan penternak kambing, manakala Nabi Muhammad SAW menjadi penggembala kambing dan peniaga."},{"type":"wordbank","xp":20,"voiceIdKey":"pi43_u3_s3","voiceToneLabel":"Pengajaran Hadis","voiceCaption":"Bina ayat pengajaran hadis kemuliaan berdikari.","voiceScript":"[jelas] Susun perkataan berikut untuk melengkapkan ayat pengajaran hadis kemuliaan berdikari mengikut format SPM.","prompt":"Susun frasa untuk membina ayat pengajaran hadis:","hint":"Mulakan dengan 'Kita hendaklah menghindari...'","answerTokens":["Kita","hendaklah","menghindari","perbuatan","meminta-minta","demi","memelihara","maruah","diri."],"distractors":["menggalakkan","mengabaikan","kejayaan"],"explanation":"Menjauhi sikap meminta-minta memelihara maruah diri dan mengangkat martabat umat Islam."},{"type":"mcq","xp":15,"voiceIdKey":"pi43_u3_s4","voiceToneLabel":"Kesan Berdikari","voiceCaption":"Mengenal pasti kelebihan berdikari dari aspek pendidikan.","voiceScript":"[tenang] Pilih pernyataan paling tepat tentang kelebihan budaya berdikari dari aspek pendidikan.","prompt":"Apakah kelebihan berdikari dari aspek pendidikan mengikut silibus KSSM?","options":["Melahirkan modal insan berkepakaran tinggi melalui penerokaan ilmu dan kemahiran","Memperoleh pendapatan sementara daripada sumbangan ihsan orang ramai","Mengurangkan keperluan mempelajari teknologi baharu dalam perniagaan","Membataskan hubungan perdagangan antara masyarakat pelbagai kaum"],"correctIndex":0,"explanation":"Sikap berdikari mendorong penerokaan ilmu serta kemahiran baharu lalu melahirkan tenaga kerja berkepakaran tinggi."}]},{"id":"pi43-u4","title":"Keunggulan Tokoh Empat Mazhab","subtitle":"Imam Abu Hanifah, Imam Malik, Imam as-Syafie & Imam Ahmad bin Hanbal","iconType":"scroll","iconUrl":"../assets/icons/pi43-u4.jpg","steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"pi43_u4_s1","voiceToneLabel":"Sirah Ilmuwan","voiceCaption":"Riwayat hidup, asas hukum dan karya utama Imam Empat Mazhab.","voiceScript":"[berwibawa] Kegigihan ilmu empat imam mazhab iaitu Imam Abu Hanifah di Kufah, Imam Malik di Madinah, Imam as-Syafie di Ghazzah dan Mesir serta Imam Ahmad bin Hanbal di Baghdad membentuk khazanah fekah Ahli Sunnah Wal-Jamaah sehingga ke hari ini.","title":"Keunggulan Tokoh Empat Mazhab Fekah","acronym":"NukFah 80 (Kufah) | MAM 93 (Madinah) | GAM 150 (Ghazzah) | ABA 164 (Baghdad)","hook":"Bagaimanakah tokoh empat mazhab saling berguru antara satu sama lain dan menghormati perbezaan pendapat?","mediaKey":"pi43_kitab_klasik","summary":"Keempat-empat imam mazhab berpegang pada al-Quran dan Sunnah sebagai sumber utama, diikuti kaedah istinbat masing-masing serta menghasilkan karya agung seperti al-Fiqhul Akbar, al-Muwattok, al-Umm dan al-Musnad.","bullets":["Imam Abu Hanifah (An-Nukman bin Thabit al-Kufi, 80H-150H): Asas mazhab pada fatwa sahabat, qias, istihsan, ijmak dan uruf; karya al-Faraid dan al-Fiqhul Akbar.","Imam Malik (Malik bin Anas al-Madani, 93H-179H): Asas pada amalan penduduk Madinah, qias dan masalih al-mursalah; karya al-Muwattok; prinsip murid mencari guru.","Imam as-Syafie (Muhammad bin Idris as-Syafie, 150H-204H): Berguru dengan Imam Malik; asas pada ijmak, qias dan istidlal; karya ar-Risalah dan al-Umm; pengasas Usul Fiqh.","Imam Ahmad bin Hanbal (Ahmad bin Muhammad, 164H-241H): Berguru dengan Imam as-Syafie; asas pada fatwa sahabat, qias dan istishab; karya al-Musnad; sanggup dipenjara mempertahankan bahawa al-Quran bukan makhluk."],"labId":"pi43_empat_mazhab_lab","labTitle":"Direktori Tokoh Empat Mazhab","labProps":{"imamIndex":2},"examTip":"Hafal rantai guru-murid: Imam Malik mengajar Imam as-Syafie, dan Imam as-Syafie pula mengajar Imam Ahmad bin Hanbal."},{"type":"match","xp":15,"voiceIdKey":"pi43_u4_s2","voiceToneLabel":"Padanan Karya","voiceCaption":"Padankan tokoh empat mazhab dengan kitab karangan agung masing-masing.","voiceScript":"[ceria] Padankan keempat-empat imam mazhab di sebelah kiri dengan hasil karya terkenal mereka.","prompt":"Padankan Imam Mazhab dengan hasil karyanya:","pairs":[{"id":"im1","left":"Imam Abu Hanifah","right":"Kitab al-Fiqhul Akbar dan al-Faraid"},{"id":"im2","left":"Imam Malik","right":"Kitab al-Muwattok"},{"id":"im3","left":"Imam as-Syafie","right":"Kitab al-Umm dan ar-Risalah"},{"id":"im4","left":"Imam Ahmad bin Hanbal","right":"Kitab al-Musnad dan at-Tarikh"}],"explanation":"Karya al-Muwattok (Imam Malik), ar-Risalah/al-Umm (Imam as-Syafie), al-Fiqhul Akbar (Imam Abu Hanifah) dan al-Musnad (Imam Ahmad) kekal dirujuk ulama hingga kini."},{"type":"predict","xp":20,"voiceIdKey":"pi43_u4_s3","voiceToneLabel":"Cabaran Sejarah","voiceCaption":"Menghayati keteguhan Imam Ahmad bin Hanbal dalam mempertahankan akidah.","voiceScript":"[serius] Pada zaman Khalifah al-Makmun, berlaku fitnah besar tentang sifat kalam Allah. Mengapakah Imam Ahmad bin Hanbal sanggup dipukul dan dipenjara?","hook":"Keteguhan mempertahankan kebenaran akidah mengatasi kesakitan fizikal.","scenario":"Seorang ilmuwan berhadapan tekanan pemerintah supaya menandatangani pengakuan palsu bahawa al-Quran adalah makhluk baharu, namun beliau menolak dengan tegas.","prompt":"Berdasarkan sejarah tokoh empat mazhab, siapakah imam tersebut dan apakah pendirian yang dipertahankannya?","options":["Imam Ahmad bin Hanbal yang berpegang teguh bahawa al-Quran adalah Kalam Allah, bukan makhluk","Imam Abu Hanifah yang menerima jawatan ketua hakim demi menutup mazhab lain","Imam Malik yang melarang muridnya bermusafir menuntut ilmu ke luar Madinah","Imam as-Syafie yang mengasaskan pasukan tentera laut di Damsyik"],"correctIndex":0,"proofLabId":"pi43_empat_mazhab_lab","proofState":{"imamIndex":3},"explanation":"Imam Ahmad bin Hanbal diuji berat dan dipenjarakan semasa pemerintahan al-Makmun kerana ketegasannya mempertahankan akidah bahawa al-Quran bukan makhluk."},{"type":"mcq","xp":15,"voiceIdKey":"pi43_u4_s4","voiceToneLabel":"Adab Perbezaan","voiceCaption":"Iktibar menghormati perbezaan pandangan mazhab.","voiceScript":"[lembut] Apakah sikap terbaik umat Islam terhadap perbezaan pandangan fekah antara empat mazhab muktabar?","prompt":"Manakah antara berikut iktibar paling tepat daripada pengajian keunggulan tokoh empat mazhab?","options":["Menghormati perbezaan pandangan cabang antara mazhab supaya masyarakat hidup harmoni","Mengkafirkan pengikut mazhab lain yang berbeza amalan sunat","Menolak terus pandangan ulama silam tanpa mempelajari ilmu Usul Fiqh","Mengamalkan ilmu hanya apabila ditawarkan jawatan bergaji lumayan"],"correctIndex":0,"explanation":"Keempat-empat mazhab bersatu dalam akidah ASWJ dan saling menghormati perbezaan ijtihad dalam perkara cabang (furu')."}]},{"id":"pi43-u5","title":"Cabaran Master Ilmu & Amal SPM","subtitle":"Penilaian Bersepadu Dakwah, Tajwid, Berdikari & Empat Mazhab","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":20,"voiceIdKey":"pi43_u5_s1","voiceToneLabel":"Ujian Boss 1","voiceCaption":"Analisis hukum Mad Lazim dan Qalqalah dalam al-Quran.","voiceScript":"[bersemangat] Selamat tiba ke Cabaran Master Bab Tiga! Kenal pasti contoh Mad Lazim Kalimi Muthaqqal dengan tepat.","prompt":"Manakah antara kalimah berikut merupakan contoh hukum Mad Lazim Kalimi Muthaqqal?","options":["Al-Haqqah (huruf mad bertemu huruf Qaf bertasydid dalam satu kalimah)","Al-Ana (huruf mad bertemu huruf sukun tanpa syaddah dalam satu kalimah)","Yasin (huruf mad pada pembukaan surah tanpa idgham)","Innahu (Ha' Dhamir bertemu huruf selain Hamzah)"],"correctIndex":0,"explanation":"Kalimah al-Haqqah dan ad-Dhallin mempunyai huruf mad bertemu huruf bersyaddah dalam satu kalimah, dibaca 6 harakat secara idgham (Muthaqqal)."},{"type":"sort","xp":20,"voiceIdKey":"pi43_u5_s2","voiceToneLabel":"Ujian Boss 2","voiceCaption":"Kelaskan sumber asas ijtihad Imam Malik dan Imam Abu Hanifah.","voiceScript":"[fokus] Asingkan kaedah pengasasan hukum serta karya berikut antara mazhab Hanafi dan mazhab Maliki.","prompt":"Kelaskan fakta berikut mengikut mazhabnya:","buckets":[{"id":"hanafi","label":"Mazhab Hanafi (Abu Hanifah)"},{"id":"maliki","label":"Mazhab Malik u dan Amal?","options":["Menghayati Sunnah berdikari mencari rezeki halal sambil menjadikan Islam cara hidup melalui ibadat khusus dan umum","Mengabaikan tuntutan ilmu fardu kifayah demi beribadat secara terasing","Menunjukkan kelebihan diri di hadapan masyarakat supaya dipuji berdikari","Menghentikan usaha perniagaan kerana berdikari hanya diwajibkan kepada para Nabi"],"correctIndex":0,"proofLabId":"pi43_empat_mazhab_lab","proofState":{"imamIndex":2},"explanation":"Usaha mencari rezeki halal dengan beradab yang disulami solat awal waktu menggabungkan kemuliaan berdikari, amal soleh dan Islam sebagai cara hidup."}]}]};</script>

  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

        nextBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
