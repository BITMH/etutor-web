/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-islam-t5-bab01","subject":"Pendidikan Islam","subjectGroup":"teras","form":5,"chapterNumber":1,"title":"Ciri-Ciri Mukmin Berjaya","subtitle":"Bidang al-Quran KSSM T5: Hafazan Surah at-Taubah & al-Hasyr, 7 Ciri Mukmin Berjaya (al-Mu'minun: 1-11), Pencegahan Salah Laku Seksual & Tajwid T5","estimatedMinutes":24,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#059669","coverIcon":"../assets/icons/pi51-u1.jpg","voiceReactions":{"correct":"[warmly] Syabas! Jawapan anda menepati maksud ayat al-Quran dan kaedah tajwid dengan tepat.","combo":"[excited] Masya-Allah, momentum cemerlang! Teruskan penghayatan sifat mukmin berjaya.","encourage":"[gentle] Semak semula turutan ciri dalam Surah al-Mukminun atau baris huruf Ra sebelum mencuba lagi.","celebrate":"[cheerful] Alhamdulillah, Bab 1 berjaya ditamatkan! Semoga sifat mukmin berjaya terus subur dalam diri."},"units":[{"id":"unit-1","number":1,"title":"Hafazan & Intisari at-Taubah (128-129) & al-Hasyr (21-24)","subtitle":"Rahmat Rasulullah SAW kepada umat, tawakal mutlak dan keagungan Asmaul Husna al-Hasyr","iconUrl":"../assets/icons/pi51-u1.jpg","boss":false,"steps":[{"id":"u1-s1","type":"concept","xp":15,"title":"Kasih Nabi SAW & Keagungan Kalamullah (SK 1.33 - 1.34)","summary":"Ayat hafazan Tingkatan 5 membina rasa cinta mendalam terhadap pengorbanan Rasulullah SAW dalam Surah at-Taubah ayat 128-129 serta menginsafi keagungan al-Quran dalam Surah al-Hasyr ayat 21-24.","bullets":["Surah at-Taubah ayat 128: Rasulullah SAW berasa berat hati melihat kesusahan umat, amat menginginkan keimanan dan keselamatan kita serta bersifat pengasih lagi penyayang.","Surah at-Taubah ayat 129: Kalimah 'Hasbiyallahu la ilaha illa Huwa' mengajar mukmin bertawakal mutlak kepada Allah Pemilik Arasy yang agung apabila manusia berpaling.","Surah al-Hasyr ayat 21-24: Perumpamaan gunung yang tunduk dan pecah kerana takut kepada Allah jika al-Quran diturunkan ke atasnya, diikuti rangkaian Asmaul Husna seperti al-Malik, al-Quddus, as-Salam, al-Khaliq, al-Bari' dan al-Musawwir."],"formula":"Cinta Rasul (at-Taubah: 128) + Tawakal Mutlak (at-Taubah: 129) + Tadabbur Kebesaran Allah (al-Hasyr: 21-24)","examTip":"Dalam soalan pemahaman SPM, bezakan intisari at-Taubah 128-129 (sifat prihatin Nabi dan tawakal) daripada al-Hasyr 21-24 (kesan al-Quran pada hati manusia dan sifat kesempurnaan Allah).","mediaKey":"pi51_hafazan_t5_intisari","caption":"Ringkasan intisari bacaan dan hafazan Surah at-Taubah 128-129 dan Surah al-Hasyr 21-24.","alt":"Rajah intisari Surah at-Taubah ayat 128 hingga 129 dan Surah al-Hasyr ayat 21 hingga 24","voiceIdKey":"u1-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Hayati kasih sayang Rasulullah dalam at-Taubah dan keagungan al-Quran dalam al-Hasyr.","voiceScript":"[warmly] Selamat datang ke Pendidikan Islam Tingkatan Lima, Bab Satu: Ciri-Ciri Mukmin Berjaya. [pause] Pertama sekali, ayat hafazan kita dalam Surah at-Taubah ayat seratus dua puluh lapan hingga seratus dua puluh sembilan menonjolkan betapa kasihnya Rasulullah kepada umat baginda, diikuti zikir tawakal Hasbiyallah. Manakala Surah al-Hasyr pula menggambarkan gunung pun boleh hancur tunduk kerana mengagungkan Kalamullah."},{"id":"u1-s2","type":"predict","xp":15,"prompt":"Mengapakah Surah al-Hasyr ayat 21 membawa perumpamaan gunung-ganang yang tunduk dan pecah sekiranya al-Quran diturunkan ke atasnya?","options":["Supaya manusia berfikir dan menginsafi kehebatan al-Quran lalu tunduk mematuhi perintah Allah SWT","Kerana kitab al-Quran tidak sesuai dibaca di kawasan tanah tinggi dan pergunungan","Untuk menunjukkan bahawa batu gunung lebih lembut berbanding jasad makhluk hidup","Supaya umat terdahulu tidak perlu menghafaz ayat-ayat suci al-Quran"],"correctIndex":0,"explanation":"Allah SWT membuat perbandingan tersebut supaya hati manusia berasa gerun, insaf dan bersungguh-sungguh menghayati serta mengamalkan ajaran al-Quran.","voiceIdKey":"u1-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Ramalkan tujuan perumpamaan gunung tunduk pecah dalam Surah al-Hasyr ayat 21.","voiceScript":"[curious] Cuba fikirkan, batu gunung yang keras pun digambarkan hancur kerana takutkan Allah. Apakah pengajaran utama perumpamaan itu kepada hati manusia?"},{"id":"u1-s3","type":"match","xp":15,"prompt":"Padankan petikan ayat hafazan Tingkatan 5 dengan maksud Asmaul Husna atau pengajarannya.","pairs":[{"id":"p1","left":"Hasbiyallahu la ilaha illa Huwa","right":"Cukuplah Allah bagiku, tiada Tuhan yang layak disembah melainkan Dia"},{"id":"p2","left":"Al-Khaliq, Al-Bari', Al-Musawwir","right":"Maha Pencipta, Maha Mengadakan dari tiada, Maha Membentuk rupa"},{"id":"p3","left":"Al-Malik dan Al-Quddus","right":"Maha Menguasai seluruh alam dan Maha Suci daripada sebarang kekurangan"},{"id":"p4","left":"Sifat Rasul dalam at-Taubah 128","right":"Amat prihatin atas kesusahan umat serta amat pengasih lagi penyayang"}],"explanation":"Menguasai terjemahan kata kunci memudahkan anda menjawab soalan isi tersirat SPM dengan tepat.","voiceIdKey":"u1-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Padankan lafaz hafazan Tingkatan Lima dengan maksudnya yang tepat.","voiceScript":"[warmly] Mari kita padankan lafaz-lafaz terpilih daripada Surah at-Taubah dan al-Hasyr dengan maknanya yang tepat."},{"id":"u1-s4","type":"mcq","xp":15,"prompt":"Apakah amalan harian yang paling selaras dengan tuntutan Surah at-Taubah ayat 129 selepas berusaha bersungguh-sungguh mengulang kaji pelajaran?","options":["Mengamalkan zikir Hasbiyallah serta menyerahkan keputusan akhir dengan penuh tawakal kepada Allah SWT","Berhenti membaca nota ulang kaji kerana kejayaan berlaku tanpa sebarang ikhtiar manusia","Mengharapkan pujian rakan sekelas apabila mendapat markah peperiksaan tertinggi","Menyalahkan takdir sekiranya keputusan tidak menyebelahi usaha pertama"],"correctIndex":0,"explanation":"Tawakal menurut Surah at-Taubah ayat 129 menggabungkan usaha gigih dan pergantungan mutlak kepada Allah Pemilik Arasy Yang Agung.","voiceIdKey":"u1-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Pilih amalan pelajar yang menzahirkan tawakal sejati dalam at-Taubah 129.","voiceScript":"[informative] Setelah berusaha sedaya upaya, bagaimanakah cara seorang pelajar menzahirkan tawakal sejati mengikut ayat seratus dua puluh sembilan?"}]},{"id":"unit-2","number":2,"title":"7 Ciri Mukmin Berjaya (Surah al-Mu'minun: 1-11)","subtitle":"Khusyuk solat, jauhi sia-sia, zakat, amanah dan ganjaran Syurga Firdaus","iconUrl":"../assets/icons/pi51-u2.jpg","boss":false,"steps":[{"id":"u2-s1","type":"concept","xp":15,"title":"Tujuh Sifat Teras Pewaris Syurga Firdaus (SK 1.36)","summary":"Surah al-Mu'minun ayat 1 hingga 11 membuka kalam dengan jaminan kejayaan hakiki kepada orang beriman yang menyempurnakan tujuh amalan terpuji sehingga layak mewarisi Syurga Firdaus.","bullets":["1. Beriman kepada Allah SWT & 2. Khusyuk dalam solat (tumpukan hati, fahami bacaan, pandang tempat sujud dan anggap solat terakhir).","3. Menjauhi perbuatan serta perkataan sia-sia (melepak, berbual kosong, mencarut, ketagihan hiburan melalaikan).","4. Menunaikan zakat untuk menyucikan harta dan membantu asnaf & 5. Menjaga kehormatan diri daripada zina dan maksiat.","6. Menjaga amanah serta menepati janji & 7. Memelihara kesempurnaan solat fardu pada awal waktu."],"formula":"Iman + Khusyuk Solat + Jauhi Lagha + Zakat + Jaga Maruah + Amanah/Janji + Pelihara Solat = Syurga Firdaus","examTip":"Bezakan Ciri Ke-2 (Khusyuk dalam solat = kualiti fokus batin) dengan Ciri Ke-7 (Memelihara solat = disiplin waktu, rukun dan berjemaah).","mediaKey":"pi51_tujuh_ciri_mukmin","caption":"Carta tujuh ciri mukmin berjaya daripada Surah al-Mu'minun ayat 1-11 menuju Syurga Firdaus.","alt":"Rajah tujuh ciri mukmin berjaya menurut Surah al-Mukminun ayat 1 hingga 11","voiceIdKey":"u2-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Kenali tujuh ciri mukmin berjaya yang mewarisi Syurga Firdaus kekal abadi.","voiceScript":"[warmly] Allah menjanjikan kejayaan abadi kepada mukmin yang memiliki tujuh sifat utama dalam Surah al-Mukminun. [pause] Perhatikan dua sifat berkait dengan solat: mula-mula khusyuk dari sudut hati, dan penutupnya memelihara waktu serta rukun solat. Di tengah-tengahnya pula ialah meninggalkan perkara sia-sia, menunaikan zakat, menjaga maruah serta memelihara amanah."},{"id":"u2-s2","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi rumusan tepat mengenai perbezaan khusyuk solat dan memelihara solat.","answerTokens":["Khusyuk","merujuk","tumpuan","hati","manakala","memelihara","solat","bererti","menjaga","waktunya"],"distractors":["menangguhkan","zakat","sia-sia"],"explanation":"Khusyuk menumpukan ketenangan hati ketika bersolat, manakala memelihara solat memastikan ia dikerjakan pada waktunya dengan sempurna syarat dan rukun.","voiceIdKey":"u2-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Bina ayat tepat yang membezakan khusyuk solat daripada memelihara solat.","voiceScript":"[warmly] Susun kenyataan ringkas ini untuk memastikan anda tidak tertukar antara khusyuk dengan memelihara solat."},{"id":"u2-s3","type":"concept","xp":15,"title":"Makmal Semak 7 Ciri Mukmin Berjaya","summary":"Klik setiap satu daripada tujuh ciri dalam makmal interaktif untuk menghayati contoh amali pelajar Tingkatan 5 dan ganjaran ayat 10-11.","bullets":["Teliti cara menjauhi perkara sia-sia (lagha) daripada segi perbuatan dan perkataan.","Semak bentuk amanah harian terhadap kerja, harta sekolah dan rahsia rakan."],"formula":"Ilmu + Penghayatan Harian + Menjaga Amanah = Mukmin Berjaya","examTip":"Soalan KBAT sering mengaitkan perbuatan membazir masa di media sosial dengan ciri ke-3 iaitu menjauhi perkara sia-sia.","labId":"pi51_mukmin_berjaya_lab","labTitle":"Senarai Semak 7 Ciri Mukmin Berjaya","labHeight":320,"voiceIdKey":"u2-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Teroka ketujuh-tujuh ciri mukmin berjaya secara amali di dalam makmal interaktif.","voiceScript":"[curious] Klik setiap butang ciri di dalam makmal di bawah bagi menyemak huraian tepat mengikut DSKP untuk kegunaan jawapan peperiksaan anda."},{"id":"u2-s4","type":"mcq","xp":15,"prompt":"Berdasarkan Surah al-Mu'minun ayat 10-11, apakah ganjaran tertinggi yang dikurniakan kepada golongan mukmin berjaya?","options":["Mewarisi Syurga Firdaus dan kekal di dalamnya selama-lamanya","Diberikan kekayaan harta dunia tanpa perlu bekerja","Terlepas daripada semua ujian kesusahan hidup di dunia","Diberi jawatan pemimpin kerajaan dunia secara automatik"],"correctIndex":0,"explanation":"Ayat 10-11 menegaskan bahawa mereka ialah orang yang berhak mewarisi Syurga Firdaus dan kekal di dalamnya.","voiceIdKey":"u2-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Nyatakan ganjaran mulia bagi mukmin berjaya menurut ayat penutup surah tersebut.","voiceScript":"[informative] Apakah ganjaran istimewa yang disebut secara khusus pada ayat kesepuluh dan kesebelas Surah al-Mukminun?"}]},{"id":"unit-3","number":3,"title":"Menjaga Kehormatan Diri & Pencegahan Salah Laku Seksual","subtitle":"Memahami zina, hubungan seks luar tabii dan sumbang mahram serta akibatnya (SP 1.36.5)","iconUrl":"../assets/icons/pi51-u3.jpg","boss":false,"steps":[{"id":"u3-s1","type":"concept","xp":15,"title":"Tiga Salah Laku Seksual yang Wajib Dijauhi (SP 1.36.5)","summary":"Ciri kelima mukmin berjaya mewajibkan umat Islam menjaga kemaluan dan kehormatan diri dengan menjauhi zina, hubungan seks luar tabii dan sumbang mahram.","bullets":["Zina: Persetubuhan haram antara lelaki dan perempuan tanpa ikatan perkahwinan yang sah menurut syarak.","Hubungan seks luar tabii: Hubungan seksual menyalahi fitrah manusia seperti liwat (sesama lelaki) dan musahaqah (sesama perempuan).","Sumbang mahram: Persetubuhan haram antara individu yang mempunyai pertalian nasab/mahram yang diharamkan berkahwin.","Akibat buruk: Merosakkan nasab keturunan, menularkan penyakit berjangkit berbahaya, menjatuhkan maruah diri serta mengundang kemurkaan Allah SWT."],"formula":"Benteng Diri: Tundukkan Pandangan + Tutup Aurat Sempurna + Jauhi Ikhtilat Bebas & Bahan Lucah","examTip":"Apabila menjawab soalan akibat salah laku seksual, gabungkan kesan rohani (dosa besar/murka Allah) dengan kesan sosial dan kesihatan (kecerelaruan nasab dan penyakit).","voiceIdKey":"u3-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Fahami larangan zina, hubungan luar tabii dan sumbang mahram demi memelihara nasab dan maruah.","voiceScript":"[serious] Ciri kelima mukmin berjaya menyentuh tanggungjawab menjaga kehormatan diri. [pause] DSKP menggariskan tiga salah laku seksual besar yang mesti dijauhi: zina, hubungan seks luar tabii seperti liwat dan musahaqah, serta sumbang mahram. Menutup aurat dan mengawal pergaulan ialah benteng utama menyelamatkan nasab dan maruah umat."},{"id":"u3-s2","type":"sort","xp":15,"prompt":"Kelaskan perbuatan berikut kepada Amalan Memelihara Kehormatan Diri atau Punca Jerumus Salah Laku Seksual.","buckets":[{"id":"jaga","label":"Amalan Menjaga Kehormatan"},{"id":"bahaya","label":"Punca Jerumus Maksiat"}],"items":[{"text":"Menundukkan pandangan dan menjaga batas aurat","bucketId":"jaga","note":"Benteng asas syarak memelihara hati"},{"text":"Melayari laman kandungan lucah secara sembunyi","bucketId":"bahaya","note":"Merangsang nafsu ke arah zina dan luar tabii"},{"text":"Menyertai aktiviti berfaedah serta memilih rakan soleh","bucketId":"jaga","note":"Mengisi masa lapang dan membina persekitaran sihat"},{"text":"Bergaul bebas tanpa batas antara lelaki dan perempuan","bucketId":"bahaya","note":"Membuka pintu zina dan kehamilan luar nikah"}],"explanation":"Islam menutup jalan menuju zina sejak peringkat awal iaitu menjaga pandangan, aurat dan batas pergaulan.","voiceIdKey":"u3-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Kelaskan amalan benteng maruah berbanding perbuatan yang merosakkan kehormatan diri.","voiceScript":"[warmly] Susun empat tindakan remaja ini mengikut sama ada ia memelihara kehormatan ataupun menjadi pintu kepada maksiat."},{"id":"u3-s3","type":"predict","xp":15,"prompt":"Apakah kategori salah laku seksual apabila berlaku hubungan terlarang antara dua individu yang haram berkahwin disebabkan pertalian darah atau penyusuan?","options":["Sumbang mahram","Perkahwinan mut'ah","Nikah tanpa wali","Khuluk sukarela"],"correctIndex":0,"explanation":"Sumbang mahram merujuk kepada perlakuan seksual haram antara mahram yang mempunyai hubungan darah, penyusuan atau persemendaan.","voiceIdKey":"u3-s3","voiceToneLabel":"Mentor SPM","voiceCaption":"Kenal pasti istilah tepat bagi hubungan haram sesama ahli mahram.","voiceScript":"[curious] Apakah nama kesalahan berat bagi perbuatan seksual antara dua individu yang mempunyai ikatan mahram?"},{"id":"u3-s4","type":"mcq","xp":15,"prompt":"Manakah langkah paling berkesan untuk seorang remaja membina benteng diri daripada terjebak dalam gejala salah laku seksual?","options":["Mengamalkan kawalan diri, menyaring tontonan digital dan memelihara batas pergaulan syariat","Menghabiskan masa bersendirian di bilik sambil menyertai ruang sembang tanpa identiti","Menyembunyikan masalah pergaulan daripada ibu bapa serta guru kaunseling","Menganggap batas ikhtilat hanya terpakai di kawasan masjid dan surau"],"correctIndex":0,"explanation":"Disiplin menjaga pandangan, batasan digital dan pergaulan syariat secara berterusan memelihara kesucian diri dan keturunan.","voiceIdKey":"u3-s4","voiceToneLabel":"Ustaz Coach","voiceCaption":"Pilih strategi paling tuntas menjaga kehormatan remaja masa kini.","voiceScript":"[informative] Pilih tindakan paling berkesan membentengi diri remaja daripada pengaruh tidak bermoral di dunia nyata mahupun maya."}]},{"id":"unit-4","number":4,"title":"Tajwid T5: Hukum Ra', Jenis Waqaf & Ibtida'","subtitle":"Bacaan Tafkhim vs Tarqiq, Waqaf Tam/Kafi/Hasan/Qabih dan Ibtida' Hasan vs Qabih (SK 1.35)","iconUrl":"../assets/icons/pi51-u4.jpg","boss":false,"steps":[{"id":"u4-s1","type":"concept","xp":15,"title":"Menguasai Hukum Bacaan Ra', Waqaf dan Ibtida' (SK 1.35)","summary":"Tajwid Tingkatan 5 menilai kecekapan murid menyebut huruf Ra' dengan tebal atau nipis serta berhenti (Waqaf) dan memulakan semula bacaan (Ibtida') tanpa merosakkan makna ayat al-Quran.","bullets":["Hukum Ra': Tafkhim (tebal) apabila Ra' berbaris atas/depan atau sukun selepas atas/depan; Tarqiq (nipis) apabila Ra' berbaris bawah (kasrah) atau sukun selepas kasrah asli tanpa huruf isti'la.","Empat Jenis Waqaf: Tam (sempurna makna & tiada kaitan lafaz/makna), Kafi (sempurna makna, ada kaitan makna sahaja), Hasan (sempurna makna, masih berkait lafaz & makna), Qabih (merosakkan makna—dilarang sengaja).","Jenis Ibtida': Ibtida' Hasan (HARUS—memulakan bacaan pada kalimah yang tepat dan menepati maksud sebenar) berbanding Ibtida' Qabih (TIDAK HARUS—merosakkan maksud ayat)."],"formula":"Ra' Fathah/Dhammah = Tafkhim | Ra' Kasrah = Tarqiq | Mula Sempurna = Ibtida' Hasan","examTip":"Apabila berhenti secara Waqaf Hasan di tengah ayat, teruskan membaca kalimah seterusnya jika di hujung ayat, atau ulang satu dua kalimah sebelumnya agar tidak berlaku Ibtida' Qabih.","mediaKey":"pi51_tajwid_ra_waqaf","caption":"Panduan ringkas Hukum Ra' (Tafkhim vs Tarqiq), empat jenis Waqaf serta perbezaan Ibtida' Hasan dan Qabih.","alt":"Carta Tajwid Tingkatan 5: Hukum Ra', empat jenis Waqaf, dan Ibtida' Hasan serta Qabih","voiceIdKey":"u4-s1","voiceToneLabel":"Guru Tajwid","voiceCaption":"Bezakan Ra' Tafkhim dan Tarqiq serta jaga Waqaf dan Ibtida' agar makna al-Quran terpelihara.","voiceScript":"[informative] Sekarang kita beralih ke Tajwid Tingkatan Lima. [pause] Pertama, huruf Ra' dibaca tebal atau Tafkhim apabila berbaris atas atau depan, dan dibaca nipis atau Tarqiq apabila berbaris bawah. Kedua, sentiasa perhatikan tempat berhenti Waqaf dan tempat memulakan semula bacaan iaitu Ibtida' supaya maksud ayat Allah tidak terpesong kepada Qabih."},{"id":"u4-s2","type":"sort","xp":15,"prompt":"Kelaskan istilah tajwid berikut mengikut Hukum Bacaan atau Jenis Penghentian & Permulaan.","buckets":[{"id":"ra","label":"Hukum Bacaan Ra'"},{"id":"waqaf","label":"Waqaf & Ibtida'"}],"items":[{"text":"Tafkhim (Ra' dibaca tebal)","bucketId":"ra","note":"Berbaris fathah atau dhammah"},{"text":"Waqaf Tam (berhenti sempurna)","bucketId":"waqaf","note":"Tiada kaitan lafaz dan makna selepasnya"},{"text":"Tarqiq (Ra' dibaca nipis)","bucketId":"ra","note":"Berbaris kasrah atau didahului Ya' sukun"},{"text":"Ibtida' Qabih (dilarang mula di sini)","bucketId":"waqaf","note":"Memulakan bacaan hingga rosak makna"}],"explanation":"Mengenal pasti istilah tepat membantu anda menjawab soalan definisi tajwid Kertas 1 dengan pantas.","voiceIdKey":"u4-s2","voiceToneLabel":"Guru Tajwid","voiceCaption":"Asingkan istilah Hukum Ra' daripada istilah Waqaf dan Ibtida'.","voiceScript":"[warmly] Kelaskan istilah tajwid Tingkatan Lima ini mengikut kumpulan hukum huruf Ra' dan kumpulan Waqaf serta Ibtida'."},{"id":"u4-s3","type":"concept","xp":15,"title":"Makmal Bengkel Tajwid T5","summary":"Gunakan butang interaktif dalam makmal tajwid untuk menyemak tanda waqaf mashaf (Mim kecil, Mu'anaqah, Jim, Qaf-Lam-Ya, Sad-Lam-Ya) dan contoh bacaan Ra'.","bullets":["Tanda Mim kecil menandakan Waqaf Lazim (wajib berhenti).","Tanda titik tiga berganda (Mu'anaqah) membolehkan waqaf pada salah satu tempat sahaja."],"formula":"Mim Kecil = Wajib Waqaf | Mu'anaqah = Pilih Salah Satu | Sad-Lam-Ya = Wasal Lebih Utama","examTip":"Jangan kelirukan Sad-Lam-Ya (Al-Waslu Aula: sambung lebih utama) dengan Qaf-Lam-Ya (Al-Waqfu Aula: berhenti lebih utama).","labId":"pi51_tajwid_t5_lab","labTitle":"Makmal Tajwid T5: Hukum Ra', Waqaf & Ibtida'","labHeight":320,"voiceIdKey":"u4-s3","voiceToneLabel":"Guru Tajwid","voiceCaption":"Semak tanda waqaf utama dan contoh hukum Ra' dalam bengkel interaktif.","voiceScript":"[curious] Klik setiap bahagian dalam Makmal Tajwid di bawah untuk melihat perbezaan antara tanda Mim kecil, Mu'anaqah, serta Qaf-Lam-Ya dan Sad-Lam-Ya."},{"id":"u4-s4","type":"mcq","xp":15,"prompt":"Seorang murid tercungap-cungap lalu berhenti tepat di kalimah yang merosakkan maksud ayat, kemudian terus menyambung pada kalimah meragukan. Apakah hukum Waqaf dan Ibtida' yang berlaku?","options":["Waqaf Qabih dan Ibtida' Qabih — tidak harus dilakukan dengan sengaja dan perlu mengulang dari kalimah sesuai","Waqaf Tam dan Ibtida' Hasan — harus terus menyambung bacaan tanpa mengulang","Waqaf Kafi yang wajib dilakukan setiap kali terdapat tanda Jim","Tafkhim wajib kerana nafas habis di pertengahan ayat"],"correctIndex":0,"explanation":"Berhenti atau memulakan bacaan pada tempat yang mencacatkan maksud sebenar dikenali sebagai Waqaf Qabih dan Ibtida' Qabih; pembaca hendaklah mengundur satu dua kalimah supaya makna pulih sempurna.","voiceIdKey":"u4-s4","voiceToneLabel":"Guru Tajwid","voiceCaption":"Tentukan hukum apabila bacaan berhenti dan bermula pada tempat yang mengubah makna.","voiceScript":"[informative] Apabila nafas terputus di tempat yang merosakkan maksud ayat lalu disambung secara sumbang, apakah nama hukum tersebut?"}]},{"id":"unit-5","number":5,"title":"Cabaran Bos: Mukmin Berjaya & Tajwid T5","subtitle":"Gabungkan hafazan, 7 ciri mukmin, pencegahan salah laku dan hukum Tajwid T5 dalam ujian penutup","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","xp":25,"prompt":"Lengkapkan pasangan tepat berikut: 'Ciri kelima Surah al-Mu'minun menyeru penjagaan ______ agar terhindar daripada zina dan sumbang mahram, manakala huruf Ra' berbaris kasrah dibaca secara ______.'","options":["kehormatan diri ... Tarqiq (nipis)","harta wakaf ... Tafkhim (tebal)","zakat fitrah ... Waqaf Qabih","amanah harta ... Ibtida' Qabih"],"correctIndex":0,"explanation":"Menjaga kehormatan diri ialah ciri kelima mukmin berjaya (1.36.5), dan Ra' berbaris bawah dibaca Tarqiq (nipis).","voiceIdKey":"u5-s1","voiceToneLabel":"Mentor Bos","voiceCaption":"Selesaikan gandingan kefahaman Surah al-Mu'minun dan Hukum Ra'.","voiceScript":"[dramatic] Peringkat Bos Bab Satu! Gabungkan pengetahuan dua kemahiran serentak: ciri kelima al-Mu'minun dan hukum Ra' berbaris kasrah."},{"id":"u5-s2","type":"match","xp":25,"prompt":"Padankan tanda Waqaf dengan hukum bacaannya yang tepat.","pairs":[{"id":"w1","left":"Tanda Mim Kecil","right":"Waqaf Lazim (Wajib berhenti di situ)"},{"id":"w2","left":"Tanda Qaf-Lam-Ya","right":"Waqaf lebih utama daripada wasal"},{"id":"w3","left":"Tanda Sad-Lam-Ya","right":"Wasal (sambung) lebih utama daripada waqaf"},{"id":"w4","left":"Tanda Tiga Titik Berganda","right":"Waqaf Mu'anaqah (berhenti pada salah satu tempat)"}],"explanation":"Pengecaman tepat empat tanda waqaf utama ini sering ditanya dalam peperiksaan tilawah dan bertulis.","voiceIdKey":"u5-s2","voiceToneLabel":"Mentor Bos","voiceCaption":"Padankan kesemua empat tanda waqaf dengan kaedah bacaannya.","voiceScript":"[warmly] Padankan kesemua empat tanda waqaf mashaf al-Quran dengan makna berhenti atau sambungnya."},{"id":"u5-s3","type":"wordbank","xp":25,"prompt":"Susun perkataan menjadi pengajaran utama gabungan Surah at-Taubah 128-129 dan al-Mu'minun 1-11.","answerTokens":["Mukmin","berjaya","sentiasa","khusyuk","menjaga","amanah","dan","bertawakal","kepada","Allah"],"distractors":["sia-sia","berputus asa","Qabih"],"explanation":"Rumusan ini menggabungkan khusyuk solat serta amanah (al-Mu'minun) dengan pergantungan tawakal (at-Taubah: 129).","voiceIdKey":"u5-s3","voiceToneLabel":"Mentor Bos","voiceCaption":"Susun rumusan penutup ciri mukmin berjaya dan tawakal.","voiceScript":"[warmly] Rangkaikan rumusan penutup yang menyatukan ciri al-Mu'minun dan sifat tawakal Surah at-Taubah."},{"id":"u5-s4","type":"mcq","xp":25,"prompt":"Soalan Bos Akhir: Manakah pernyataan yang 100% BENAR mengenai kandungan Bab 1 Pendidikan Islam T5?","options":["Tujuh ciri mukmin berjaya bermula dengan iman serta khusyuk solat dan berakhir dengan memelihara solat demi mewarisi Syurga Firdaus.","Waqaf Hasan bermaksud tempat berhenti yang merosakkan makna ayat al-Quran secara keseluruhan.","Surah al-Hasyr ayat 21-24 menceritakan kisah tujuh ciri mukmin yang menjauhi perbuatan sia-sia.","Sumbang mahram hanya berlaku apabila pasangan yang tiada hubungan nasab melangsungkan akad nikah."],"correctIndex":0,"explanation":"Pilihan A tepat merangkumi struktur Surah al-Mu'minun: 1-11. Pilihan B tertukar Waqaf Hasan dengan Qabih, C tertukar al-Hasyr dengan al-Mu'minun, dan D menyalahi takrif sumbang mahram.","voiceIdKey":"u5-s4","voiceToneLabel":"Mentor Bos","voiceCaption":"Pilih satu kenyataan yang 100 peratus sahih untuk menamatkan Bab 1.","voiceScript":"[excited] Soalan Bos terakhir Bab Satu! Semak fakta al-Mu'minun, al-Hasyr dan hukum waqaf untuk memilih satu kenyataan yang tepat sepenuhnya."}]}]};</script>

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

        });

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
