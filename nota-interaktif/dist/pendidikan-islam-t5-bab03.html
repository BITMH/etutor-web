/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-islam-t5-bab03","subject":"Pendidikan Islam","subjectGroup":"teras","form":5,"chapterNumber":3,"title":"Keagungan Allah SWT Al-Raqib & Al-Hasib","subtitle":"Bidang Akidah KSSM T5: Asmaul Husna Al-Raqib, Al-Hasib & Asy-Syahid, Akidah Ahli Sunnah Wal-Jamaah serta Aliran Syiah, Khawarij & Muktazilah","estimatedMinutes":24,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#4f46e5","coverIcon":"../assets/icons/pi53-u1.jpg","voiceReactions":{"correct":"[warmly] Tepat! Kefahaman akidah anda mantap serta berpandukan hujah al-Quran dan as-Sunnah.","combo":"[excited] Cemerlang! Anda membezakan manhaj Ahli Sunnah Wal-Jamaah daripada aliran menyimpang dengan tajam.","encourage":"[gentle] Semak semula pendirian ASWJ terhadap pelaku dosa besar dan sifat kalam al-Quran sebelum mencuba lagi.","celebrate":"[cheerful] Alhamdulillah, Bab 3 selesai! Semoga benteng akidah Ahli Sunnah Wal-Jamaah sentiasa terpelihara."},"units":[{"id":"unit-1","number":1,"title":"Asmaul Husna: Al-Raqib, Al-Hasib & Asy-Syahid (SK 3.12)","subtitle":"Maksud, dalil naqli, bukti kefahaman dan penghayatan sifat waspada (muraqabah)","iconUrl":"../assets/icons/pi53-u1.jpg","boss":false,"steps":[{"id":"u1-s1","type":"concept","xp":15,"title":"Allah Maha Mengawasi, Menghitung & Menyaksikan (SK 3.12)","summary":"Keimanan terhadap nama Allah SWT al-Raqib, al-Hasib dan asy-Syahid membentuk kesedaran muraqabah dalam diri mukmin bahawa setiap niat dan perbuatan sentiasa dalam pengawasan serta hitungan-Nya.","bullets":["Al-Raqib: Nama Allah yang menunjukkan Allah SWT Maha Mengawasi semua perbuatan, percakapan dan bisikan hati makhluk pada setiap masa tanpa terlepas walau zarah.","Al-Hasib: Nama Allah yang bermaksud Maha Menghitung segala amalan hamba secara teliti serta Cukup Memelihara hamba-Nya yang bertawakal.","Asy-Syahid: Nama Allah yang menunjukkan Allah SWT Maha Menyaksikan segala perkara yang nyata mahupun tersembunyi.","Kesan penghayatan: Melahirkan sifat waspada dan jujur walaupun bersendirian, menjauhi penipuan serta rajin bermuhasabah sebelum dihitung di akhirat."],"formula":"Al-Raqib (Mengawasi) + Al-Hasib (Menghitung) + Asy-Syahid (Menyaksikan) = Integriti & Waspada","examTip":"Dalam soalan KBAT integriti pelajar (contoh: meniru dalam peperiksaan), kaitkan larangan menipu dengan keyakinan bahawa Allah al-Raqib dan asy-Syahid sentiasa mengawasi walau guru tiada.","mediaKey":"pi53_raqib_hasib_syahid","caption":"Perbandingan maksud, bukti dan kesan penghayatan nama Allah al-Raqib, al-Hasib dan asy-Syahid.","alt":"Carta Asmaul Husna al-Raqib, al-Hasib dan asy-Syahid beserta kesan muraqabah","voiceIdKey":"u1-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Hayati nama Allah al-Raqib, al-Hasib dan asy-Syahid agar sentiasa berwaspada dan amanah.","voiceScript":"[warmly] Selamat datang ke Bab Tiga Akidah Tingkatan Lima. [pause] Tiga Asmaul Husna penting kita pelajari di sini: al-Raqib bererti Allah Maha Mengawasi segala gerak-geri makhluk; al-Hasib bererti Maha Menghitung setiap amal dengan saksama; dan asy-Syahid bererti Maha Menyaksikan yang zahir mahupun tersembunyi. Kesedarannya membina integriti walaupun kita berseorangan."},{"id":"u1-s2","type":"predict","xp":15,"prompt":"Ketika bekerja di kaunter bayaran tanpa pengawasan kamera litar tertutup, seorang pekerja menolak peluang mengambil wang baki pelanggan. Keimanan terhadap Asmaul Husna manakah paling kuat mendorong sifat waspada tersebut?","options":["Al-Raqib (Maha Mengawasi) dan Asy-Syahid (Maha Menyaksikan)","Al-Qahhar semata-mata tanpa kesedaran pengawasan","Perasaan riak supaya majikan menaikkan gaji bulanan","Takut kepada teguran rakan sekerja sahaja"],"correctIndex":0,"explanation":"Keyakinan bahawa Allah SWT al-Raqib (Maha Mengawasi) dan asy-Syahid (Maha Menyaksikan) melahirkan integriti sejati walaupun tiada saksi manusia.","voiceIdKey":"u1-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Tentukan nama Allah yang mendidik amanah ketika tiada pengawasan manusia.","voiceScript":"[curious] Walaupun kamera pengawas tiada, pekerja itu tetap jujur tidak mengambil sebarang sen. Nama Allah manakah yang membina kawalan dalaman tersebut?"},{"id":"u1-s3","type":"concept","xp":15,"title":"Makmal Pengawasan & Penghitungan Asmaul Husna","summary":"Klik setiap nama Allah dalam makmal interaktif untuk meneliti dalil naqli, bukti kefahaman dan ibrah kehidupannya.","bullets":["Semak perkaitan antara Surah an-Nisa' ayat 1 (al-Raqib) dan Surah al-Ahzab ayat 39 (al-Hasib).","Bina rutin muhasabah amal harian sebelum tidur."],"formula":"Dalil Naqli + Kefahaman Maksud + Muhasabah Diri = Taqwa","examTip":"Pastikan anda menghafal maksud ringkas ketiga-tiga nama agar tidak tertukar antara 'Maha Mengawasi' (al-Raqib) dengan 'Maha Menghitung' (al-Hasib).","labId":"pi53_raqib_hasib_lab","labTitle":"Asmaul Husna Pengawasan & Penghitungan","labHeight":320,"voiceIdKey":"u1-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Teroka dalil dan bukti bagi al-Raqib, al-Hasib dan asy-Syahid di dalam makmal.","voiceScript":"[curious] Gunakan makmal interaktif di bawah bagi menyemak maksud tepat, dalil al-Quran serta ibrah bagi al-Raqib, al-Hasib dan asy-Syahid."},{"id":"u1-s4","type":"mcq","xp":15,"prompt":"Apakah maksud tepat nama Allah SWT 'al-Hasib' menurut DSKP Pendidikan Islam?","options":["Allah Maha Menghitung amalan makhluk dengan teliti serta Cukup Memelihara orang yang bertawakal","Allah Maha Pencipta rupa bentuk tubuh manusia dari setitis air","Allah Maha Memberi rezeki tanpa perlu usaha ikhtiar manusia","Allah Maha Mengampunkan dosa syirik walaupun tanpa taubat"],"correctIndex":0,"explanation":"Al-Hasib berasal daripada makna perhitungan dan kecukupan; Allah menghitung segala amal hamba dan mencukupkan keperluan mereka yang berserah kepada-Nya.","voiceIdKey":"u1-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Pilih takrif paling tepat bagi nama Allah al-Hasib.","voiceScript":"[informative] Pilih jawapan yang menerangkan maksud sebenar Asmaul Husna al-Hasib secara lengkap."}]},{"id":"unit-2","number":2,"title":"Akidah Ahli Sunnah Wal-Jamaah (ASWJ) (SK 3.13.1 - 3.13.2)","subtitle":"Definisi, sumber pegangan, tokoh pengasas manhaj dan prinsip asas ASWJ","iconUrl":"../assets/icons/pi53-u2.jpg","boss":false,"steps":[{"id":"u2-s1","type":"concept","xp":15,"title":"Mengenal Pegangan Sahih Ahli Sunnah Wal-Jamaah (SK 3.13)","summary":"Ahli Sunnah Wal-Jamaah ialah golongan yang memahami dan berpegang teguh dengan al-Quran, sunnah Rasulullah SAW serta ijmak para sahabat r.a. dengan manhaj pertengahan (wasatiyyah).","bullets":["Tokoh pengasas sistematik manhaj ASWJ: Imam Abu al-Hasan al-Asy'ari dan Imam Abu Mansur al-Maturidi dalam bidang akidah.","Prinsip asas ASWJ: Beriman kepada enam Rukun Iman, menerima al-Quran dan hadis sahih sebagai sumber utama serta menghormati seluruh para sahabat Nabi SAW.","Prinsip pertengahan: Tidak mudah mengkafirkan sesama umat Islam melainkan terbukti kekufuran nyata yang mengingkari perkara asas agama.","Kepentingan berpegang dengan ASWJ: Membersihkan akidah daripada kesesatan, memelihara perpaduan ummah dan menjamin keselamatan hidup di dunia serta akhirat."],"formula":"Al-Quran + As-Sunnah + Manhaj Para Sahabat = Pegangan Akidah Ahli Sunnah Wal-Jamaah","examTip":"Nama Imam Abu al-Hasan al-Asy'ari dan Imam Abu Mansur al-Maturidi wajib diingat sebagai tokoh utama penyusun hujah akidah ASWJ.","mediaKey":"pi53_aswj_prinsip","caption":"Definisi, prinsip teras dan tokoh pengasas akidah Ahli Sunnah Wal-Jamaah.","alt":"Rajah definisi, prinsip akidah dan tokoh pengasas Ahli Sunnah Wal-Jamaah","voiceIdKey":"u2-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Pelajari asas akidah Ahli Sunnah Wal-Jamaah yang berpaksikan al-Quran, Sunnah dan para sahabat.","voiceScript":"[warmly] Kini kita mendalami benteng akidah Ahli Sunnah Wal-Jamaah. [pause] ASWJ merujuk golongan yang berpegang teguh kepada al-Quran, sunnah Rasulullah SAW serta jalan para sahabat baginda, yang disusun hujah ilmunya oleh Imam Abu al-Hasan al-Asy'ari dan Imam Abu Mansur al-Maturidi. Prinsip utamanya ialah bersikap sederhana dan tidak sewenang-wenangnya mengkafirkan sesama Muslim."},{"id":"u2-s2","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi takrif tepat Ahli Sunnah Wal-Jamaah.","answerTokens":["Golongan","yang","berpegang","teguh","dengan","al-Quran","sunnah","Rasulullah","dan","ijmak","para","sahabat"],"distractors":["falsafah","akal","kafir"],"explanation":"Pegangan ASWJ berpaksikan wahyu al-Quran, sunnah Nabi SAW dan kefahaman para sahabat yang adil.","voiceIdKey":"u2-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Bina definisi lengkap golongan Ahli Sunnah Wal-Jamaah.","voiceScript":"[warmly] Susun definisi sahih Ahli Sunnah Wal-Jamaah menggunakan sumber utama pegangan Islam."},{"id":"u2-s3","type":"match","xp":15,"prompt":"Padankan aspek pegangan ASWJ berikut dengan keterangannya.","pairs":[{"id":"s1","left":"Imam Abu al-Hasan al-Asy'ari","right":"Ulama terkemuka penyusun aliran akidah Ahli Sunnah Wal-Jamaah"},{"id":"s2","left":"Sikap terhadap Sahabat Nabi","right":"Menghormati dan memuliakan seluruh para sahabat tanpa mencela"},{"id":"s3","left":"Hukum Takfir (Mengkafirkan)","right":"Tidak mudah mengkafirkan sesama muslim tanpa bukti syarak yang qat'i"},{"id":"s4","left":"Kedudukan Akal & Wahyu","right":"Wahyu mendahului akal; akal sihat selari dengan al-Quran dan Sunnah"}],"explanation":"Prinsip keseimbangan wahyu dan penghormatan kepada sahabat memelihara umat daripada perpecahan.","voiceIdKey":"u2-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Padankan prinsip utama ASWJ dengan huraian sahihnya.","voiceScript":"[curious] Padankan keempat-empat prinsip Ahli Sunnah Wal-Jamaah ini dengan keterangan yang benar."},{"id":"u2-s4","type":"mcq","xp":15,"prompt":"Apakah kesan utama apabila umat Islam di Malaysia berpegang teguh dengan akidah Ahli Sunnah Wal-Jamaah?","options":["Perpaduan ummah terpelihara serta terhindar daripada ajaran sesat dan fahaman ekstremis","Umat Islam tidak lagi perlu mengkaji ilmu al-Quran dan hadis sahih","Perbezaan pendapat dalam hal cabang fekah diharamkan serta-merta","Semua umat dibenarkan menilai hukum agama hanya berpandukan akal semata-mata"],"correctIndex":0,"explanation":"Manhaj ASWJ menyatukan akidah teras umat di samping bersikap toleran terhadap khilaf cabang fekah yang muktabar.","voiceIdKey":"u2-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Nyatakan kepentingan utama berpegang kepada akidah ASWJ.","voiceScript":"[informative] Apakah impak besar kepada kestabilan masyarakat apabila umat Islam berpaut teguh pada pegangan Ahli Sunnah Wal-Jamaah?"}]},{"id":"unit-3","number":3,"title":"Sejarah & Prinsip Aliran Syiah, Khawarij & Muktazilah (SK 3.13.3)","subtitle":"Mengenal asal kemunculan serta pegangan bercanggah tiga aliran sejarah utama","iconUrl":"../assets/icons/pi53-u3.jpg","boss":false,"steps":[{"id":"u3-s1","type":"concept","xp":15,"title":"Mengenal Aliran Menyimpang dalam Sejarah Akidah (SK 3.13.3)","summary":"DSKP Tingkatan 5 menuntut murid mengenal secara ringkas latar sejarah serta prinsip utama yang menyalahi ASWJ bagi tiga aliran iaitu Syiah, Khawarij dan Muktazilah.","bullets":["Syiah: Muncul selepas Perang Siffin dengan dakwaan Sayidina Ali r.a. dan keturunan beliau berhak mutlak menjadi khalifah (Imamah); mengkafirkan majoriti sahabat Nabi SAW serta menolak hadis yang tidak diriwayatkan Ahlul Bait.","Khawarij: Kumpulan yang keluar daripada barisan Sayidina Ali r.a. selepas peristiwa Majlis Tahkim; berpendirian keras menghukum pelaku dosa besar sebagai kafir dan menghalalkan darah sesama muslim yang berbeza pandangan.","Muktazilah: Diasaskan oleh Wasil bin Ata' selepas berpisah daripada majlis ilmu Imam Hasan al-Basri; mengutamakan akal melebihi nas wahyu serta berpegang dengan konsep 'al-manzilah baina al-manzilatain' bagi pelaku dosa besar."],"formula":"Syiah (Taksub Imamah & Cela Sahabat) | Khawarij (Takfir Ekstrem) | Muktazilah (Akal Mengatasi Wahyu)","examTip":"Hafal pengasas atau titik tolak setiap aliran: Khawarij (keluar selepas Tahkim), Muktazilah (Wasil bin Ata' berpisah daripada Hasan al-Basri), Syiah (isu kekhalifahan Sayidina Ali).","voiceIdKey":"u3-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Fahami sejarah kemunculan dan prinsip bercanggah aliran Syiah, Khawarij dan Muktazilah.","voiceScript":"[serious] Selain ASWJ, DSKP menyenaraikan tiga aliran bersejarah yang menyimpang dalam beberapa prinsip akidah. [pause] Syiah bertolak daripada pengagungan Imamah dan mencela sebahagian besar sahabat Nabi. Khawarij keluar selepas peristiwa Tahkim lalu mengkafirkan pelaku dosa besar secara keras. Muktazilah pula diasaskan oleh Wasil bin Ata' dengan mengangkat akal mengatasi nas wahyu."},{"id":"u3-s2","type":"sort","xp":15,"prompt":"Kelaskan kenyataan berikut mengikut aliran sejarah yang tepat: Khawarij atau Muktazilah.","buckets":[{"id":"khawarij","label":"Aliran Khawarij"},{"id":"muktazilah","label":"Aliran Muktazilah"}],"items":[{"text":"Keluar daripada tentera Sayidina Ali selepas Majlis Tahkim","bucketId":"khawarij","note":"Asal nama Khawarij bermaksud golongan yang keluar"},{"text":"Diasaskan oleh Wasil bin Ata' dan mengutamakan akal","bucketId":"muktazilah","note":"Berpisah daripada majlis Imam Hasan al-Basri"},{"text":"Menghukum pelaku dosa besar terus menjadi kafir","bucketId":"khawarij","note":"Pegangan takfir keras terhadap sesama Muslim"},{"text":"Pelaku dosa besar di tempat pertengahan (al-manzilah baina al-manzilatain)","bucketId":"muktazilah","note":"Bukan mukmin dan bukan kafir di dunia, kekal di neraka jika tidak bertaubat"}],"explanation":"Membezakan titik tolak sejarah dan hukum pelaku dosa besar antara Khawarij dengan Muktazilah ialah soalan wajib SPM Akidah T5.","voiceIdKey":"u3-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Asingkan ciri aliran Khawarij daripada aliran Muktazilah.","voiceScript":"[warmly] Susun keempat-empat fakta sejarah dan prinsip akidah ini di antara kumpulan Khawarij dan Muktazilah."},{"id":"u3-s3","type":"predict","xp":15,"prompt":"Apakah ciri paling ketara bagi aliran Syiah yang menyalahi prinsip Ahli Sunnah Wal-Jamaah?","options":["Mendakwa jawatan Imamah khusus milik Sayidina Ali dan keturunannya sebagai rukun iman serta mencela para sahabat","Menganggap al-Quran tidak lagi perlu dibaca setelah tamat zaman tabiin","Menghapuskan ibadah solat lima waktu bagi golongan yang mengkaji falsafah","Menghukum setiap orang yang berbeza pendapat politik sebagai murtad kecuali Wasil bin Ata'"],"correctIndex":0,"explanation":"Fahaman Syiah menolak kekhalifahan Abu Bakar, Umar serta Uthman r.a., mencela majoriti sahabat dan menjadikan Imamah yang maksum sebagai asas akidah.","voiceIdKey":"u3-s3","voiceToneLabel":"Mentor SPM","voiceCaption":"Kenal pasti ciri utama pegangan aliran Syiah yang bercanggah dengan ASWJ.","voiceScript":"[curious] Antara keempat-empat kenyataan ini, yang manakah mencerminkan prinsip aliran Syiah yang bercanggah dengan ASWJ?"},{"id":"u3-s4","type":"mcq","xp":15,"prompt":"Mengapakah ASWJ menolak pendekatan aliran Muktazilah yang meletakkan akal lebih tinggi daripada dalil naqli (al-Quran dan Hadis)?","options":["Kerana akal manusia bersifat terhad dan tidak mampu menjangkau perkara ghaib serta ketuhanan tanpa bimbingan wahyu","Kerana Islam melarang umatnya berfikir dan mengkaji sains tabii","Kerana hanya ulama sejarah dibenarkan menggunakan akal fikiran","Kerana akal manusia tidak pernah mampu memahami bahasa al-Quran"],"correctIndex":0,"explanation":"Dalam manhaj ASWJ, akal ialah kurniaan penting untuk memahami wahyu, namun akal yang terbatas tidak boleh menolak nas wahyu yang sahih.","voiceIdKey":"u3-s4","voiceToneLabel":"Ustaz Coach","voiceCaption":"Jelaskan batas keupayaan akal dalam memahami hal ghaib dan akidah.","voiceScript":"[informative] Mengapakah ASWJ meletakkan wahyu di hadapan akal dalam persoalan akidah dan ghaibiyat?"}]},{"id":"unit-4","number":4,"title":"Banding Beza 5 Isu Akidah: ASWJ vs Aliran Lain (SK 3.13.4)","subtitle":"Al-Quran bukan makhluk, melihat Allah, pelaku dosa besar, iman naik-turun & qadak qadar","iconUrl":"../assets/icons/pi53-u4.jpg","boss":false,"steps":[{"id":"u4-s1","type":"concept","xp":15,"title":"Lima Isu Perbandingan Akidah dalam SPM (SK 3.13.4)","summary":"DSKP menyenaraikan lima isu perbandingan tepat antara pegangan ASWJ dengan aliran bertentangan yang kerap disoal secara berjadual dalam peperiksaan.","bullets":["1. Al-Quran: ASWJ yakin al-Quran ialah Kalam Allah yang Qadim (bukan makhluk); Muktazilah mendakwa al-Quran itu makhluk (baharu).","2. Melihat Allah di Akhirat: ASWJ yakin mukmin akan melihat Allah di akhirat kelak; Muktazilah menafikan dan menganggapnya mustahil.","3. Pelaku Dosa Besar: ASWJ menghukumnya kekal mukmin (namun fasik jika belum bertaubat); Khawarij mengkafirkannya; Muktazilah meletakkannya di tempat pertengahan (al-manzilah baina al-manzilatain).","4. Iman & Qadak Qadar: ASWJ berpendirian iman boleh bertambah dan berkurang, serta baik/buruk berlaku atas ketentuan Allah dengan ikhtiar hamba; Khawarij/Muktazilah menyatakan iman tidak naik turun."],"formula":"Al-Quran = Qadim | Akhirat = Lihat Allah | Dosa Besar = Mukmin Fasik | Iman = Naik & Turun","examTip":"Apabila diminta mengisi jadual perbandingan 5 isu ini, pastikan lajur 'ASWJ' sentiasa menulis empat kunci tepat: Kalam Qadim, Dapat Melihat Allah, Tetap Mukmin (Fasik), dan Iman Bertambah/Berkurang.","mediaKey":"pi53_aliran_bandingan","caption":"Jadual banding beza pandangan ASWJ menentang Khawarij dan Muktazilah bagi lima isu akidah.","alt":"Carta perbandingan lima isu akidah antara Ahli Sunnah Wal-Jamaah dengan Khawarij dan Muktazilah","voiceIdKey":"u4-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Kuasai pendirian ASWJ berbanding aliran lain pada lima isu akidah utama.","voiceScript":"[informative] Ini jadual emas untuk soalan struktur Akidah SPM! [pause] Pertama, al-Quran ialah Kalam Allah yang Qadim, bukan makhluk. Kedua, orang beriman dapat melihat Allah di akhirat. Ketiga, pelaku dosa besar kekal mukmin yang fasik, bukan kafir seperti dakwaan Khawarij. Keempat, iman bertambah dengan ketaatan dan berkurang dengan maksiat."},{"id":"u4-s2","type":"match","xp":15,"prompt":"Padankan lima isu akidah berikut dengan pandangan SAHIH Ahli Sunnah Wal-Jamaah.","pairs":[{"id":"i1","left":"Kedudukan al-Quran","right":"Kalam Allah yang bersifat Qadim dan bukan makhluk"},{"id":"i2","left":"Melihat Allah di Akhirat","right":"Semua orang beriman berpeluang melihat Allah di Syurga"},{"id":"i3","left":"Pelaku Dosa Besar","right":"Kekal mukmin (fasik) dan layak mendapat keampunan jika bertaubat"},{"id":"i4","left":"Kadar Iman Seseorang","right":"Bertambah dengan amal soleh dan berkurang akibat maksiat"}],"explanation":"Empat pendirian ini membezakan akidah Ahli Sunnah Wal-Jamaah daripada aliran Muktazilah dan Khawarij dengan jelas.","voiceIdKey":"u4-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Padankan empat isu utama dengan jawapan sahih Ahli Sunnah Wal-Jamaah.","voiceScript":"[warmly] Padankan kesemua empat isu akidah ini dengan jawapan muktamad Ahli Sunnah Wal-Jamaah."},{"id":"u4-s3","type":"concept","xp":15,"title":"Makmal Matriks Banding Beza ASWJ vs Aliran Lain","summary":"Klik setiap isu akidah dalam matriks perbandingan untuk membandingkan pendirian ASWJ di kotak hijau menentang aliran Muktazilah/Khawarij di kotak merah.","bullets":["Semak isu Qadak dan Qadar (baik dan buruk daripada Allah dengan ikhtiar akal manusia vs dakwaan Muktazilah).","Bandingkan hukum pelaku dosa besar bagi ketiga-tiga aliran."],"formula":"Qadak & Qadar (ASWJ) = Ketentuan Allah + Ikhtiar Manusia | Muktazilah = Perbuatan Manusia Semata","examTip":"Soalan sering memerangkap murid tentang siapa yang berkata al-Quran itu makhluk—ingat jawapannya ialah Muktazilah.","labId":"pi53_aswj_perbandingan_lab","labTitle":"Matriks Akidah: Ahli Sunnah Wal-Jamaah vs Aliran Lain","labHeight":320,"voiceIdKey":"u4-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Semak banding beza lima isu akidah di dalam matriks interaktif.","voiceScript":"[curious] Klik butang isu satu demi satu di dalam matriks untuk menyemak jawapan tepat Ahli Sunnah Wal-Jamaah berbanding aliran lain."},{"id":"u4-s4","type":"mcq","xp":15,"prompt":"Seorang muslim terlanjur melakukan dosa besar tetapi tidak mengingkari kewajipan hukum syarak dan kemudian menyesal. Bagaimanakah statusnya menurut Ahli Sunnah Wal-Jamaah?","options":["Masih dikira mukmin yang berdosa (fasik) serta wajib bertaubat dan masih layak mendapat rahmat atau syafaat","Terus menjadi kafir murtad serta batal semua ibadahnya selama-lamanya seperti dakwaan Khawarij","Berada di luar kategori mukmin dan kafir lalu kekal di neraka selamanya walaupun bertaubat","Dihapuskan terus keimanannya secara kekal tanpa sebarang pintu taubat"],"correctIndex":0,"explanation":"ASWJ menegaskan pelaku dosa besar masih muslim yang fasik (lemah imannya) selagi tidak syirik/ingkar, dan pintu taubat nasuha sentiasa terbuka.","voiceIdKey":"u4-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Tentukan status pelaku dosa besar mengikut neraca adil ASWJ.","voiceScript":"[informative] Menurut pendirian adil Ahli Sunnah Wal-Jamaah, apakah status sebenar seorang Muslim yang terlanjur melakukan dosa besar?"}]},{"id":"unit-5","number":5,"title":"Cabaran Bos: Asmaul Husna & Benteng Akidah ASWJ","subtitle":"Ujian penguasaan al-Raqib, al-Hasib, asy-Syahid serta lima isu perbandingan ASWJ","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","xp":25,"prompt":"Lengkapkan rumusan akidah tepat berikut: 'Aliran ______ mendakwa al-Quran ialah makhluk yang baharu dan menafikan peluang melihat Allah di akhirat, sedangkan ASWJ beriman bahawa al-Quran ialah ______ yang Qadim.'","options":["Muktazilah ... Kalam Allah","Khawarij ... karangan sahabat","Syiah ... makhluk baharu","ASWJ ... tafsiran akal"],"correctIndex":0,"explanation":"Aliran Muktazilah menganggap al-Quran makhluk dan menafikan rukyah (melihat Allah), bertentangan dengan akidah ASWJ yang mengimani al-Quran sebagai Kalam Allah yang Qadim.","voiceIdKey":"u5-s1","voiceToneLabel":"Mentor Bos","voiceCaption":"Selesaikan gandingan aliran akidah dan sifat al-Quran pada Peringkat Bos.","voiceScript":"[dramatic] Cabaran Bos Bab Tiga! Kenal pasti aliran mana yang mendakwa al-Quran itu makhluk, serta nyatakan pegangan sahih ASWJ."},{"id":"u5-s2","type":"sort","xp":25,"prompt":"Kelaskan kenyataan berikut kepada Pegangan ASWJ yang Sahih atau Fahaman Aliran Bertentangan.","buckets":[{"id":"sahih","label":"Pegangan Sahih ASWJ"},{"id":"sesat","label":"Aliran Bertentangan (Syiah/Khawarij/Muktazilah)"}],"items":[{"text":"Iman bertambah dengan ketaatan dan berkurang kerana maksiat","bucketId":"sahih","note":"Pegangan rasmi ASWJ (3.13.4)"},{"text":"Pelaku dosa besar dihukum terus sebagai kafir","bucketId":"sesat","note":"Pegangan ekstrem aliran Khawarij"},{"text":"Allah al-Raqib mengawasi bisikan hati walau bersendirian","bucketId":"sahih","note":"Keimanan sifat al-Raqib (3.12)"},{"text":"Mencela majoriti sahabat Nabi kecuali beberapa orang","bucketId":"sesat","note":"Penyelewengan aliran Syiah"}],"explanation":"Keupayaan memisahkan pegangan ASWJ daripada aliran luar melindungi akidah pelajar di zaman maklumat terbuka.","voiceIdKey":"u5-s2","voiceToneLabel":"Mentor Bos","voiceCaption":"Asingkan kenyataan akidah sahih ASWJ daripada fahaman aliran bertentangan.","voiceScript":"[warmly] Asingkan kesemua empat kenyataan akidah ini antara pegangan sahih Ahli Sunnah Wal-Jamaah dan fahaman yang menyimpang."},{"id":"u5-s3","type":"wordbank","xp":25,"prompt":"Susun perkataan menjadi pengajaran utama gabungan sifat al-Raqib dan akidah ASWJ.","answerTokens":["Meyakini","pengawasan","Allah","al-Raqib","dan","berpegang","teguh","kepada","akidah","ASWJ","menyelamatkan","iman"],"distractors":["Muktazilah","mengabaikan","Khawarij"],"explanation":"Menggabungkan kesedaran muraqabah (al-Raqib) dengan kejelasan akidah sahih ASWJ memelihara integriti dan keimanan mukmin.","voiceIdKey":"u5-s3","voiceToneLabel":"Mentor Bos","voiceCaption":"Susun rumusan penutup menggabungkan Asmaul Husna al-Raqib dan akidah ASWJ.","voiceScript":"[warmly] Susun kenyataan penutup yang menyatukan pengawasan al-Raqib dan keteguhan akidah ASWJ."},{"id":"u5-s4","type":"mcq","xp":25,"prompt":"Soalan Bos Akhir: Manakah pernyataan yang 100% BENAR bagi keseluruhan Bab 3 Pendidikan Islam T5?","options":["Allah SWT al-Raqib Maha Mengawasi, al-Hasib Maha Menghitung dan ASWJ beriman bahawa orang mukmin akan melihat Allah di akhirat.","ASWJ menghukum pelaku dosa besar kekal di neraka bersama golongan kafir tanpa peluang syafaat.","Imam Abu al-Hasan al-Asy'ari ialah tokoh utama pengasas aliran Muktazilah di Baghdad.","Khawarij bermaksud kumpulan pengikut yang bersikap sederhana dan menolak amalan mengkafirkan Muslim."],"correctIndex":0,"explanation":"Pilihan A menepati SK 3.12 dan 3.13. Pilihan B ialah fahaman Khawarij/Muktazilah, C salah kerana al-Asy'ari tokoh ASWJ (Muktazilah diasaskan Wasil bin Ata'), dan D bercanggah dengan sejarah Khawarij.","voiceIdKey":"u5-s4","voiceToneLabel":"Mentor Bos","voiceCaption":"Pilih satu kenyataan 100 peratus benar untuk menguasai Bab 3.","voiceScript":"[excited] Soalan terakhir Bab Tiga! Semak nama tokoh, takrif Asmaul Husna dan prinsip ASWJ untuk melengkapkan kemenangan anda."}]}]};</script>

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;

    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +

    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +

      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
