/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-islam-t5-bab04","subject":"Pendidikan Islam","subjectGroup":"teras","form":5,"chapterNumber":4,"title":"Solat Sunat Istikharah dan Tasbih","subtitle":"Bidang Fiqah KSSM T5: Solat Sunat Istikharah & Tasbih, Perkahwinan Islam & Isu Munakahat, Wasiat, Faraid & Jenayah Syariah","estimatedMinutes":26,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#0284c7","coverIcon":"../assets/icons/pi54-u1.jpg","voiceReactions":{"correct":"[warmly] Tepat sekali! Hukum fiqah, rukun nikah dan kadar faraid anda sangat mantap.","combo":"[excited] Cemerlang! Penguasaan ibadat, munakahat, faraid dan jenayah syariah anda di tahap terbaik.","encourage":"[gentle] Semak semula bilangan rakaat serta tasbih atau kadar waris ada anak berbanding tiada anak sebelum mencuba lagi.","celebrate":"[cheerful] Alhamdulillah, Bab 4 selesai! Ilmu fiqah ini menjadi panduan sepanjang hayat."},"units":[{"id":"unit-1","number":1,"title":"Solat Sunat Istikharah & Solat Sunat Tasbih (SK 4.25)","subtitle":"Tujuan, hukum, kaifiat 2 rakaat Istikharah vs 4 rakaat 300 tasbih serta hikmahnya","iconUrl":"../assets/icons/pi54-u1.jpg","boss":false,"steps":[{"id":"u1-s1","type":"concept","xp":15,"title":"Kaifiat & Hikmah Solat Sunat Istikharah dan Tasbih (SK 4.25)","summary":"Syariat menetapkan dua solat sunat penting dalam SK 4.25: Solat Sunat Istikharah untuk memohon petunjuk membuat pilihan terbaik dan Solat Sunat Tasbih untuk memohon keampunan dosa dengan 300 bacaan tasbih.","bullets":["Solat Sunat Istikharah (Sunat): Dikerjakan 2 rakaat secara bersendirian bagi memohon petunjuk Allah apabila berhadapan pilihan harus (seperti kerjaya, jurusan atau jodoh); rakaat 1 baca al-Kafirun dan rakaat 2 al-Ikhlas diikuti Doa Istikharah.","Hikmah Istikharah: Menyerahkan urusan kepada Allah yang Maha Mengetahui serta menjauhkan perbuatan syirik seperti menemui bomoh atau menilik nasib.","Solat Sunat Tasbih (Sunat): Dikerjakan 4 rakaat dengan jumlah 300 kali tasbih ('Subhanallahi walhamdulillahi wa la ilaha illallahu wallahu akbar')—siang 4 rakaat 1 salam, malam 4 rakaat 2 salam.","Agihan 75 Tasbih Per Rakaat: 15 selepas surah + 10 rukuk + 10 iktidal + 10 sujud pertama + 10 duduk antara dua sujud + 10 sujud kedua + 10 duduk istirahah/tahiyat."],"formula":"Istikharah = 2 Rakaat (al-Kafirun & al-Ikhlas) | Tasbih = 4 Rakaat x 75 = 300 Tasbih","examTip":"Sentiasa ingat perbezaan bilangan salam Solat Sunat Tasbih: siang hari 4 rakaat 1 salam, manakala malam hari lebih utama 4 rakaat 2 salam (2+2).","mediaKey":"pi54_istikharah_tasbih","caption":"Perbandingan tujuan, rakaat dan agihan tasbih antara Solat Sunat Istikharah dengan Solat Sunat Tasbih.","alt":"Carta perbandingan Solat Sunat Istikharah dua rakaat dan Solat Sunat Tasbih tiga ratus tasbih","videoClip":{"src":"../assets/pendidikan-islam-t5-bab04/video/pi54_video_istikharah_tasbih_narasi.mp4","posterKey":"pi54_istikharah_tasbih","hasNarration":true,"caption":"Video Penerangan Bersuara (BM): Tujuan dan kaifiat ringkas Solat Sunat Istikharah memohon petunjuk serta Solat Sunat Tasbih"},"voiceIdKey":"u1-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Pelajari kaifiat Solat Sunat Istikharah 2 rakaat dan Solat Sunat Tasbih 300 bacaan.","voiceScript":"[warmly] Selamat datang ke Bab Empat: Solat Sunat Istikharah dan Tasbih. [pause] Apabila berdepan dua pilihan penting yang harus, dirikanlah Solat Sunat Istikharah dua rakaat bersendirian agar kita tidak terjebak menilik nasib atau khurafat. Manakala Solat Sunat Tasbih pula mengandungi tiga ratus kali tasbih—tujuh puluh lima tasbih bagi setiap daripada empat rakaat."},{"id":"u1-s2","type":"predict","xp":15,"prompt":"Berapakah agihan jumlah tasbih yang tepat dalam SATU rakaat Solat Sunat Tasbih sebelum didarabkan kepada empat rakaat?","options":["75 kali tasbih (15 selepas surah + 10 pada enam rukun/duduk berikutnya)","50 kali tasbih (10 pada lima tempat sahaja)","100 kali tasbih (25 pada empat tempat utama)","300 kali tasbih dalam satu rakaat"],"correctIndex":0,"explanation":"75 kali tasbih dibaca dalam setiap rakaat (15 selepas bacaan surah dan 10 pada rukuk, iktidal, sujud pertama, duduk antara dua sujud, sujud kedua serta duduk istirahah/tahiyat); 75 x 4 = 300.","voiceIdKey":"u1-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Kira jumlah bacaan tasbih bagi setiap satu rakaat Solat Sunat Tasbih.","voiceScript":"[curious] Jika keseluruhan Solat Sunat Tasbih mengandungi tiga ratus kali bacaan dalam empat rakaat, berapakah bilangan tasbih dalam setiap satu rakaat?"},{"id":"u1-s3","type":"concept","xp":15,"title":"Makmal Penghitung Tasbih 300 & Kaifiat Istikharah","summary":"Gunakan kalkulator interaktif dalam makmal untuk menyemak surah pilihan Istikharah dan pecahan 75 tasbih setiap rakaat.","bullets":["Tukar antara paparan Solat Sunat Istikharah dan Solat Sunat Tasbih.","Semak hikmah Istikharah dalam membentengi akidah daripada amalan syirik dan khurafat."],"formula":"15 (Selepas Surah) + 10x6 (Rukuk, Iktidal, Sujud 1, Duduk, Sujud 2, Istirahah) = 75","examTip":"Istikharah TIDAK dilakukan pada perkara yang jelas wajib atau jelas haram—hanya untuk memilih perkara yang harus atau terbaik antara dua kebaikan.","labId":"pi54_solat_sunat_lab","labTitle":"Kaifiat Solat Sunat Istikharah & Penghitung Tasbih 300","labHeight":320,"voiceIdKey":"u1-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Semak pecahan tujuh puluh lima tasbih setiap rakaat di dalam penghitung interaktif.","voiceScript":"[warmly] Tekan butang di dalam makmal di bawah bagi menyemak semula surah pilihan Istikharah dan agihan tujuh puluh lima tasbih setiap rakaat."},{"id":"u1-s4","type":"mcq","xp":15,"prompt":"Dalam situasi manakah Solat Sunat Istikharah paling tepat diamalkan mengikut syarak?","options":["Ketika memilih antara dua tawaran universiti atau bidang kerjaya yang sama-sama baik dan halal","Ketika berfikir sama ada hendak menunaikan solat Zuhur ataupun meninggalkannya","Untuk meminta petunjuk memilih nombor ramalan bertuah","Sebelum melakukan perbuatan rasuah supaya tidak dikesan pihak berkuasa"],"correctIndex":0,"explanation":"Istikharah hanya disyariatkan untuk urusan harus yang baik demi memohon ketenangan memilih yang paling diberkati, bukan perkara wajib atau haram.","voiceIdKey":"u1-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Pilih situasi paling tepat mengamalkan Solat Sunat Istikharah.","voiceScript":"[informative] Antara keempat-empat situasi ini, bilakah seorang Muslim disunatkan mendirikan Solat Sunat Istikharah?"}]},{"id":"unit-2","number":2,"title":"Perkahwinan dalam Islam: Rukun, Mahram & Persediaan (SK 4.26)","subtitle":"Hukum nikah, golongan wanita haram dikahwini, 5 rukun nikah, mahar, walimatulurus & keibubapaan","iconUrl":"../assets/icons/pi54-u2.jpg","boss":false,"steps":[{"id":"u2-s1","type":"concept","xp":15,"title":"Teras Perkahwinan Islam & Lima Rukun Nikah (SK 4.26)","summary":"Perkahwinan ialah akad menghalalkan persetubuhan antara lelaki dan perempuan mengikut syarak dengan hukum asal Sunat (boleh menjadi Wajib, Harus, Makruh atau Haram mengikut keadaan), dibina atas lima rukun nikah.","bullets":["5 Rukun Nikah: (1) Bakal suami (Islam, bukan mahram, tidak dalam ihram), (2) Bakal isteri (Islam/ahli kitab terpelihara, bukan mahram, tidak dalam idah/ihram), (3) Wali (bapa -> datuk -> saudara lelaki seibu sebapa -> dan seterusnya / wali hakim), (4) Dua orang saksi (lelaki, Islam, baligh, berakal, adil, dengar & lihat jelas), (5) Sighah (lafaz Ijab dan Qabul).","Wanita Haram Dikahwini Selama-lamanya (Muabbad): Faktor Keturunan (ibu, anak, adik-beradik, emak saudara), Faktor Penyusuan (ibu susuan, adik-beradik susuan), Faktor Persemendaan (ibu mentua, menantu, ibu tiri, anak tiri yang ibunya telah disetubuhi).","Adab & Tanggungjawab: Merisik dan meminang mengikut batas syarak, pemberian Mahar (wajib kepada isteri), Walimatulurus (sunat muakkad tanpa pembaziran) serta kemahiran keibubapaan menjaga akidah, ibadah dan akhlak anak."],"formula":"5 Rukun Nikah = Suami + Isteri + Wali + 2 Saksi + Sighah (Ijab & Qabul)","examTip":"Bezakan haram selama-lamanya (seperti ibu mentua dan ibu susuan) daripada haram sementara (seperti menghimpun dua beradik perempuan serentak atau wanita dalam idah).","mediaKey":"pi54_munakahat_rukun","caption":"Lima rukun nikah wajib dan istilah pembubaran serta isu rumah tangga Islam.","alt":"Carta lima rukun nikah serta definisi talak, fasakh, khuluk dan rujuk","voiceIdKey":"u2-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Kuasai lima rukun nikah, tiga faktor mahram muabbad serta adab walimatulurus.","voiceScript":"[warmly] Kini kita memasuki bidang Munakahat yang sangat kerap keluar dalam SPM. [pause] Pastikan anda ingat lima rukun nikah tanpa tertinggal satu pun: bakal suami, bakal isteri, wali, dua saksi lelaki adil, dan sighah iaitu ijab dan qabul. Kenali juga wanita yang haram dikahwini selama-lamanya disebabkan tiga faktor: keturunan, penyusuan dan persemendaan."},{"id":"u2-s2","type":"sort","xp":15,"prompt":"Kelaskan golongan wanita berikut kepada Faktor Keturunan (Nasab) atau Faktor Persemendaan (Perkahwinan).","buckets":[{"id":"nasab","label":"Haram Sebab Keturunan"},{"id":"semenda","label":"Haram Sebab Persemendaan"}],"items":[{"text":"Ibu kandung dan nenek sebelah ibu atau bapa","bucketId":"nasab","note":"Pertalian darah menegak ke atas"},{"text":"Ibu mentua setelah berlangsung akad nikah","bucketId":"semenda","note":"Menjadi mahram kekal sebaik sahaja akad sah"},{"text":"Adik perempuan seibu sebapa","bucketId":"nasab","note":"Pertalian darah kandung"},{"text":"Isteri kepada anak lelaki (menantu perempuan)","bucketId":"semenda","note":"Hubungan kekeluargaan melalui perkahwinan"}],"explanation":"Faktor keturunan berpunca daripada darah daging, manakala faktor persemendaan terbentuk melalui ikatan perkahwinan yang sah.","voiceIdKey":"u2-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Asingkan mahram sebab keturunan daripada mahram sebab persemendaan.","voiceScript":"[warmly] Susun keempat-empat hubungan keluarga ini sama ada termasuk pengharaman sebab keturunan ataupun persemendaan."},{"id":"u2-s3","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi hukum nikah mengikut situasi individu berpendapatan cukup dan khuatir terjerumus zina.","answerTokens":["Hukum","berkahwin","menjadi","wajib","bagi","individu","yang","berkemampuan","dan","bimbang","melakukan","zina"],"distractors":["haram","makruh","sunat"],"explanation":"Walaupun hukum asal nikah ialah Sunat, ia bertukar Wajib jika seseorang berkemampuan menunaikan nafkah serta khuatir terjatuh dalam maksiat zina.","voiceIdKey":"u2-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Susun syarat situasi apabila hukum nikah bertukar menjadi wajib.","voiceScript":"[warmly] Bina kenyataan tepat bila hukum perkahwinan berubah daripada sunat kepada wajib."},{"id":"u2-s4","type":"mcq","xp":15,"prompt":"Ahmad bernikah dengan Aminah menggunakan dua orang saksi yang terdiri daripada bapa saudara lelaki serta seorang rakan wanita yang solehah. Mengapakah akad nikah itu TIDAK SAH?","options":["Kerana kedua-dua saksi nikah wajib terdiri daripada orang lelaki Muslim yang adil dan baligh","Kerana saksi nikah tidak boleh mempunyai pertalian saudara dengan pengantin","Kerana mahar wajib dibayar secara tunai sebelum majlis walimatulurus","Kerana lafaz ijab mesti diucapkan oleh pengantin lelaki sendiri"],"correctIndex":0,"explanation":"Salah satu syarat sah saksi dalam rukun nikah ialah kedua-duanya mestilah lelaki; saksi perempuan tidak sah menggantikan tempat saksi lelaki.","voiceIdKey":"u2-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Kenal pasti kecacatan rukun nikah melibatkan syarat dua orang saksi.","voiceScript":"[informative] Semak syarat rukun saksi nikah: mengapa kehadiran seorang saksi wanita menyebabkan akad itu tidak sah?"}]},{"id":"unit-3","number":3,"title":"Isu-Isu dalam Perkahwinan Islam (SK 4.27)","subtitle":"Memahami Talak, Fasakh, Khuluk, Idah, Rujuk, Nusyuz, Li'an, Poligami, Hadanah & Anak Angkat","iconUrl":"../assets/icons/pi54-u3.jpg","boss":false,"steps":[{"id":"u3-s1","type":"concept","xp":15,"title":"Sepuluh Istilah Penting Isu Rumah Tangga (SK 4.27)","summary":"Islam menyediakan saluran penyelesaian beradab apabila rumah tangga berdepan konflik atau kehilangan pasangan, namun perkahwinan yang membelakangi syarak dan undang-undang membawa implikasi serius.","bullets":["Talak: Pembubaran perkahwinan melalui lafaz cerai daripada suami | Fasakh: Pembatalan ikatan nikah melalui kuasa hakim syarie kerana mudarat seperti suami ghaib/tidak beri nafkah | Khuluk: Perceraian tebus talak dengan bayaran tertentu daripada isteri.","Idah: Tempoh masa tertentu bagi isteri selepas cerai atau kematian suami sebelum dibenarkan berkahwin semula | Rujuk: Hak suami mengambil kembali isteri yang diceraikan dengan talak raj'i (1 atau 2) dalam tempoh idah tanpa akad baharu.","Nusyuz: Keengganan isteri mentaati perintah suami yang sah di sisi syarak tanpa sebab | Li'an: Sumpah laknat suami isteri di mahkamah apabila suami menuduh isteri berzina tanpa empat saksi.","Poligami (syarat adil, maksima 4), Hadanah (hak penjagaan kanak-kanak mumaiyiz/kecil mengikut keutamaan ibu jika layak), Anak Angkat (wajib pelihara batas aurat, tidak boleh dinasabkan kepada bapa angkat)."],"formula":"Lafaz Suami = Talak | Kuasa Hakim = Fasakh | Tebus Isteri = Khuluk | Kembali Dlm Idah = Rujuk","examTip":"Implikasi kahwin tidak ikut syarak/undang-undang (seperti sindiket nikah luar negara tanpa daftar): pasangan didenda/dipenjara, anak sukar didaftar sijil lahir/persekolahan, serta hak nafkah/faraid isteri terabai.","voiceIdKey":"u3-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Bezakan Talak, Fasakh, Khuluk, Idah, Rujuk, Li'an dan hukum anak angkat dengan tepat.","voiceScript":"[informative] Unit Tiga menghimpunkan sepuluh istilah penting isu rumah tangga dalam SK empat perpuluhan dua puluh tujuh. [pause] Bezakan tiga jalan perceraian: Talak oleh lafaz suami, Fasakh oleh keputusan hakim kerana mudarat, dan Khuluk melalui bayaran tebus talak isteri. Ingat juga, anak angkat haram dibinkan kepada bapa angkat dan batas auratnya kekal seperti ajnabi jika tiada susuan."},{"id":"u3-s2","type":"match","xp":15,"prompt":"Padankan istilah isu perkahwinan Islam berikut dengan maksudnya yang tepat.","pairs":[{"id":"m1","left":"Fasakh","right":"Pembubaran perkahwinan melalui perintah mahkamah syariah kerana mudarat"},{"id":"m2","left":"Khuluk","right":"Perceraian secara tebus talak oleh isteri dengan bayaran persetujuan"},{"id":"m3","left":"Rujuk","right":"Menyambung kembali ikatan suami isteri ketika idah talak satu atau dua"},{"id":"m4","left":"Hadanah","right":"Hak penjagaan anak kecil yang belum berupaya mengurus diri"}],"explanation":"Mengenal pasti perbezaan mekanisme antara Fasakh, Khuluk, Rujuk dan Hadanah sangat kerap diuji dalam Kertas 1 & 2.","voiceIdKey":"u3-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Padankan Fasakh, Khuluk, Rujuk dan Hadanah dengan maksud tepatnya.","voiceScript":"[curious] Padankan keempat-empat istilah Munakahat ini dengan takrif hukum syarak yang tepat."},{"id":"u3-s3","type":"predict","xp":15,"prompt":"Sepasang suami isteri mengambil seorang anak angkat lelaki berusia dua tahun tanpa ikatan penyusuan dan membesarkannya hingga remaja. Manakah peraturan syarak yang WAJIB dipatuhi?","options":["Mengekalkan bin atau binti bapa kandungnya serta memelihara batas aurat apabila anak tersebut mencapai baligh","Menukarkan nama bapanya kepada nama bapa angkat dalam kad pengenalan","Memasukkan anak angkat itu ke dalam senarai waris wajib pembahagian harta faraid","Membenarkan anak angkat lelaki bersalaman dengan ibu angkat tanpa batas selepas baligh"],"correctIndex":0,"explanation":"Menurut syarak, nasab bapa kandung wajib dikekalkan, batas aurat ajnabi terpakai selepas baligh (kecuali ada susuan sah), dan anak angkat menerima harta melalui hibah atau wasiat (maksimum 1/3), bukan faraid.","voiceIdKey":"u3-s3","voiceToneLabel":"Mentor SPM","voiceCaption":"Tentukan hukum nasab dan aurat terhadap anak angkat tanpa penyusuan.","voiceScript":"[curious] Jika tiada penyusuan sah semasa kecil, apakah kewajipan hukum syarak berkaitan nasab dan aurat terhadap anak angkat apabila dia meningkat remaja?"},{"id":"u3-s4","type":"mcq","xp":15,"prompt":"Mengapakah seseorang isteri yang baru kematian suaminya masih wajib menjalani tempoh Idah (4 bulan 10 hari jika tidak hamil) sebelum berkahwin semula?","options":["Untuk memastikan kekosongan rahim serta menghormati ikatan perkahwinan dan kesedihan keluarga arwah suami","Supaya isteri dapat menukar hak wali perkahwinan kepada pihak lain","Kerana mahkamah memerlukan tempoh setahun untuk mengeluarkan sijil kematian","Supaya harta pusaka faraid boleh diagihkan sepenuhnya kepada anak angkat"],"correctIndex":0,"explanation":"Tempoh idah bertujuan memastikan rahim suci daripada kehamilan (menjaga kesucian nasab) serta memberi ruang bertenang dan menghormati tempoh berkabung.","voiceIdKey":"u3-s4","voiceToneLabel":"Ustaz Coach","voiceCaption":"Nyatakan hikmah utama pensyariatan tempoh Idah kematian suami.","voiceScript":"[informative] Apakah tujuan utama syarak mewajibkan tempoh Idah empat bulan sepuluh hari bagi seorang balu?"}]},{"id":"unit-4","number":4,"title":"Wasiat, Faraid & Pembahagian Jenayah Syariah (SK 4.28 - 4.29)","subtitle":"Kadar waris utama Faraid, batas 1/3 Wasiat serta klasifikasi Hudud, Qisas dan Takzir","iconUrl":"../assets/icons/pi54-u4.jpg","boss":false,"steps":[{"id":"u4-s1","type":"concept","xp":15,"title":"Pengurusan Harta Pusaka & Jenayah dalam Islam (SK 4.28 - 4.29)","summary":"Islam mengatur pengurusan harta selepas kematian melalui Wasiat dan Faraid secara adil, serta memelihara keamanan masyarakat menerusi hukuman Hudud, Qisas dan Takzir.","bullets":["Wasiat (4.28): Pengakuan sukarela pemilik harta agar hartanya diberi kepada pihak BUKAN waris faraid selepas kematiannya—terhad maksimum 1/3 daripada baki harta selepas selesai belanja jenazah dan hutang.","Faraid (4.28): Pembahagian harta pusaka kepada waris mengikut kadar al-Quran: Suami 1/2 (tiada anak) atau 1/4 (ada anak); Isteri 1/4 (tiada anak) atau 1/8 (ada anak); Anak lelaki vs anak perempuan = Asabah nisbah 2:1.","Jenayah Hudud (4.29): Kesalahan yang jenis dan kadar hukumannya ditetapkan secara tetap dalam al-Quran/as-Sunnah (minum arak 40 sebatan, qazaf 80 sebatan, zina, mencuri, merompak).","Jenayah Qisas & Takzir: Qisas ialah hukuman seimbang bagi jenayah membunuh atau mencederakan anggota (boleh diganti Diat/kemaafan waris); Takzir ialah hukuman berdasar budi bicara hakim (teguran, denda, penjara, sebatan)."],"formula":"Wasiat <= 1/3 (Bukan Waris) | Suami (1/2 vs 1/4) | Isteri (1/4 vs 1/8) | Anak L:P = 2:1","examTip":"Jangan kelirukan kadar Suami dan Isteri: kadar Isteri sentiasa separuh daripada kadar Suami (1/4 atau 1/8 berbanding 1/2 atau 1/4)! Dan Wasiat tidak sah kepada waris faraid kecuali dipersetujui semua waris lain.","mediaKey":"pi54_faraid_jenayah","caption":"Kadar pembahagian waris utama Faraid, batas Wasiat dan klasifikasi jenayah Hudud, Qisas serta Takzir.","alt":"Carta Faraid waris utama, Wasiat satu pertiga, dan jenayah Hudud, Qisas serta Takzir","voiceIdKey":"u4-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Hafal kadar Faraid suami isteri serta perbezaan Hudud, Qisas dan Takzir.","voiceScript":"[informative] Unit Empat membahaskan dua bidang penting: pengurusan harta selepas mati dan undang-undang jenayah Islam. [pause] Wasiat hanya boleh dibuat maksimum satu pertiga harta kepada bukan waris. Bagi Faraid pula, suami mendapat satu per dua jika tiada anak atau satu per empat jika ada anak, manakala bahagian isteri separuh daripada itu iaitu satu per empat atau satu per lapan. Bagi jenayah pula, Hudud tetap kadarnya, Qisas balasan seimbang dan Takzir budi bicara hakim."},{"id":"u4-s2","type":"sort","xp":15,"prompt":"Kelaskan kesalahan jenayah berikut mengikut kategori Hudud, Qisas atau Takzir.","buckets":[{"id":"hudud","label":"Kesalahan Hudud (Kadar Nas Tetap)"},{"id":"lain","label":"Qisas / Takzir (Seimbang atau Budi Bicara Hakim)"}],"items":[{"text":"Qazaf (menuduh zina tanpa empat saksi — 80 sebatan)","bucketId":"hudud","note":"Kadar hukuman ditetapkan jelas dalam al-Quran"},{"text":"Membunuh dengan sengaja (balasan bunuh balas atau Diat)","bucketId":"lain","note":"Kesalahan Qisas yang membolehkan waris memaafkan dengan Diat"},{"text":"Minum arak yang memabukkan (40 sebatan)","bucketId":"hudud","note":"Kesalahan Hudud dengan kadar sabit"},{"text":"Pecah amanah atau khalwat (denda/penjara budi bicara hakim)","bucketId":"lain","note":"Kesalahan Takzir tanpa kadar tetap dalam nas"}],"explanation":"Mengenal pasti sama ada hukuman ditetapkan secara tetap dalam nas (Hudud) atau melibatkan hak kemaafan waris (Qisas) dan ijtihad hakim (Takzir).","voiceIdKey":"u4-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Asingkan kesalahan Hudud daripada kesalahan Qisas dan Takzir.","voiceScript":"[warmly] Kelaskan keempat-empat jenis kesalahan ini mengikut kategori Hudud berbanding Qisas atau Takzir."},{"id":"u4-s3","type":"concept","xp":15,"title":"Makmal Kalkulator Faraid & Pengelas Jenayah Syariah","summary":"Klik waris utama dalam kalkulator faraid interaktif untuk menyemak pecahan bahagian suami, isteri, ibu, bapa, anak perempuan serta ringkasan Hudud, Qisas dan Takzir.","bullets":["Semak perubahan bahagian bapa apabila ada anak lelaki berbanding hanya ada anak perempuan.","Semak urutan wajib sebelum pembahagian pusaka: belanja jenazah -> hutang -> wasiat (<=1/3) -> Faraid."],"formula":"Tertib Pusaka: Belanja Urus Jenazah -> Lunaskan Hutang -> Tunaikan Wasiat -> Agih Faraid","examTip":"Jangan sekali-kali membahagi faraid sebelum menjelaskan hutang arwah terlebih dahulu!","labId":"pi54_faraid_jenayah_lab","labTitle":"Kalkulator Faraid Waris Utama & Pengelas Jenayah Syariah","labHeight":320,"voiceIdKey":"u4-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Semak pecahan bahagian faraid waris utama di dalam kalkulator interaktif.","voiceScript":"[curious] Klik setiap butang senario dalam kalkulator faraid di bawah untuk memastikan anda mengingati pecahan bahagian suami, isteri, ibu, bapa dan anak."},{"id":"u4-s4","type":"mcq","xp":15,"prompt":"Seorang suami meninggal dunia dengan meninggalkan baki harta pusaka bersih sebanyak RM80,000, seorang balu (isteri), seorang anak lelaki dan seorang anak perempuan. Berapakah bahagian faraid ISTERI tersebut?","options":["1/8 iaitu RM10,000 (kerana arwah mempunyai anak)","1/4 iaitu RM20,000 (kerana hanya ada seorang balu)","1/2 iaitu RM40,000 sebagai ketua keluarga baharu","1/3 iaitu RM26,666 mengikut kadar maksimum wasiat"],"correctIndex":0,"explanation":"Apabila arwah suami mempunyai anak, kadar fardu bagi isteri ialah 1/8 daripada harta pusaka bersih (1/8 x RM80,000 = RM10,000).","voiceIdKey":"u4-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Hitung bahagian faraid seorang isteri apabila arwah mempunyai anak.","voiceScript":"[informative] Kira bahagian fardu isteri daripada lapan puluh ribu ringgit pusaka bersih apabila arwah mempunyai anak."}]},{"id":"unit-5","number":5,"title":"Cabaran Bos: Fiqah Ibadat, Munakahat, Faraid & Jenayah","subtitle":"Selesaikan ujian sintesis keseluruhan bidang Fiqah Tingkatan 5","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","xp":25,"prompt":"Lengkapkan gandingan tepat berikut: 'Solat Sunat Tasbih mengandungi ______ kali bacaan tasbih keseluruhannya, manakala pembubaran nikah melalui kuasa hakim syarie kerana mudarat dikenali sebagai ______.'","options":["300 ... Fasakh","75 ... Khuluk","300 ... Rujuk","150 ... Talak"],"correctIndex":0,"explanation":"75 tasbih x 4 rakaat = 300 tasbih, dan pembatalan nikah melalui perintah hakim ialah Fasakh.","voiceIdKey":"u5-s1","voiceToneLabel":"Mentor Bos","voiceCaption":"Gabungkan kiraan tasbih penuh dan istilah pembubaran nikah oleh hakim.","voiceScript":"[dramatic] Peringkat Bos Bab Empat! Gabungkan bilangan tasbih penuh dalam Solat Sunat Tasbih dengan istilah pembatalan nikah oleh hakim."},{"id":"u5-s2","type":"match","xp":25,"prompt":"Padankan kadar hukum atau istilah Bab 4 berikut dengan pasangan tepatnya.","pairs":[{"id":"b1","left":"Suami (tiada anak)","right":"1/2 daripada baki harta pusaka bersih"},{"id":"b2","left":"Wasiat kepada bukan waris","right":"Maksimum 1/3 daripada harta selepas hutang"},{"id":"b3","left":"Qazaf (Hudud)","right":"80 kali sebatan bagi penuduh zina tanpa 4 saksi"},{"id":"b4","left":"Solat Sunat Istikharah","right":"2 rakaat memohon petunjuk pilihan halal terbaik"}],"explanation":"Kesemua empat angka dan konsep ini merupakan intipati teras Bidang Fiqah Tingkatan 5.","voiceIdKey":"u5-s2","voiceToneLabel":"Mentor Bos","voiceCaption":"Padankan kesemua empat kadar dan konsep teras Fiqah Tingkatan Lima.","voiceScript":"[warmly] Padankan kesemua empat perkara asas Fiqah ini dengan angka dan maksudnya yang tepat."},{"id":"u5-s3","type":"wordbank","xp":25,"prompt":"Susun perkataan menjadi tertib pengurusan harta pusaka yang sah menurut syarak.","answerTokens":["Belanja","jenazah","dan","hutang","arwah","diselesaikan","dahulu","sebelum","wasiat","serta","faraid"],"distractors":["hadanah","mahar","takzir"],"explanation":"Tertib wajib ialah mengurus jenazah dan melangsaikan segala hutang sebelum melaksanakan wasiat (maksimum 1/3) lalu membahagikan faraid.","voiceIdKey":"u5-s3","voiceToneLabel":"Mentor Bos","voiceCaption":"Susun turutan pengurusan harta selepas kematian mengikut hukum syarak.","voiceScript":"[warmly] Rangkaikan susunan keutamaan pengurusan harta pusaka sejurus selepas berlakunya kematian."},{"id":"u5-s4","type":"mcq","xp":25,"prompt":"Soalan Bos Akhir: Manakah pernyataan yang 100% BENAR mengenai Bab 4 Pendidikan Islam T5?","options":["Solat Sunat Istikharah menjauhkan syirik tilik nasib, anak lelaki dan perempuan mewarisi Asabah nisbah 2:1, dan Khuluk ialah tebus talak isteri.","Saksi nikah boleh terdiri daripada dua orang wanita adil sekiranya wali bersetuju.","Seorang ayah dibenarkan mewasiatkan 100 peratus hartanya kepada satu orang anak kesayangan tanpa persetujuan waris lain.","Hukuman Qisas bermaksud teguran atau denda mengikut budi bicara hakim tanpa kadar dalam al-Quran."],"correctIndex":0,"explanation":"Pilihan A tepat merangkumi Istikharah, nisbah Faraid 2:1 dan takrif Khuluk. Pilihan B salah syarat saksi lelaki, C melanggar had 1/3 bukan waris, dan D tertukar Qisas dengan Takzir.","voiceIdKey":"u5-s4","voiceToneLabel":"Mentor Bos","voiceCaption":"Pilih satu kenyataan fiqah 100 peratus tepat untuk melengkapkan Bab 4.","voiceScript":"[excited] Soalan Bos penutup Bab Empat! Periksa syarat saksi, had wasiat serta jenayah Qisas untuk memilih satu jawapan sempurna."}]}]};</script>

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);

        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
