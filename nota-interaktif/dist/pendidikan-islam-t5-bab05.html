/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }

.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {

}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-islam-t5-bab05","subject":"Pendidikan Islam","subjectGroup":"teras","form":5,"chapterNumber":5,"title":"Kepimpinan Kerajaan Uthmaniyah","subtitle":"Bidang Sirah, Tamadun & Akhlak KSSM T5: Pengasasan Empayar Uthmaniyah, Empat Sultan Agung, Faktor Kegemilangan, Kemerosotan, Iktibar & Adab Menjaga Alam Sekitar","estimatedMinutes":24,"isFreePreview":false,"enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","themeAccent":"#dc2626","coverIcon":"../assets/icons/pi55-u1.jpg","voiceReactions":{"correct":"[warmly] Tepat sekali! Salasilah sultan, strategi pentadbiran dan iktibar tamadun anda sangat tepat.","combo":"[excited] Hebat! Anda menguasai era kegemilangan Uthmaniyah serta adab memelihara alam sekitar.","encourage":"[gentle] Semak semula ibu kota pemerintahan setiap sultan antara Sogut, Bursa, Edirne dan Istanbul sebelum mencuba lagi.","celebrate":"[cheerful] Alhamdulillah, Bab 5 selesai! Semangat kepimpinan berwibawa Sultan Muhammad al-Fateh wajar diteladani."},"units":[{"id":"unit-1","number":1,"title":"Sejarah & Empat Sultan Terunggul Kerajaan Uthmaniyah (SK 5.14.1 - 5.14.2)","subtitle":"Penubuhan 1299M di Sogut hingga kemuncak Kanunname serta pembukaan Konstantiniah 1453M","iconUrl":"../assets/icons/pi55-u1.jpg","boss":false,"steps":[{"id":"u1-s1","type":"concept","xp":15,"title":"600 Tahun Kekuasaan & Empat Sultan Agung Uthmaniyah (SK 5.14)","summary":"Kerajaan Uthmaniyah diasaskan oleh Sultan Uthman bin Ertughrul pada tahun 1299M sehingga 1924M merangkumi Eropah, Asia dan Afrika, dengan empat tokoh khalifah terunggul dalam sukatan KSSM.","bullets":["1. Sultan Uthman bin Ertughrul (Pemerintah Pertama, 27 tahun, pusat Sogut): Menyatukan wilayah Anatolia selatan dan mengisytiharkan kemerdekaan Anatolia daripada Kerajaan Saljuk.","2. Sultan Murad I bin Urkhan (Ketiga, 30 tahun, pusat Bursa ke Edirne): Membentuk pasukan elit Janissary, memodenkan tentera laut dan memindahkan pusat ke Edirne.","3. Sultan Muhammad al-Fateh (Ketujuh, 31 tahun, pusat Istanbul): Membuka Kota Konstantiniah pada 857H / 1453M pada usia muda, menyatukan Balkan serta mewakafkan Aya Sofia dan membina Kompleks al-Fateh.","4. Sultan Sulaiman al-Qanuni (Kesepuluh, 48 tahun, kemuncak keemasan): Membuka Belgrade, Algeria & Tunisia serta menyusun undang-undang bertulis 'Kanunname'."],"formula":"Uthman (Sogut) -> Murad I (Edirne / Janissary) -> Muhammad al-Fateh (Istanbul 1453M) -> Sulaiman (Kanunname)","examTip":"Tahun pembukaan Konstantiniah (857H / 1453M) dan nama undang-undang Kanunname oleh Sultan Sulaiman al-Qanuni wajib dihafal tepat.","mediaKey":"pi55_sultan_uthmaniyah","caption":"Garis masa empat sultan terunggul, pusat pemerintahan dan sumbangan teras Empayar Uthmaniyah.","alt":"Rajah empat sultan terunggul Kerajaan Uthmaniyah dan ibu kota dari Sogut hingga Istanbul","videoClip":{"src":"../assets/pendidikan-islam-t5-tamadun/video/pi5_video_tamadun_islam_narasi.mp4","posterKey":"pi55_sultan_uthmaniyah","hasNarration":true,"caption":"Video Penerangan Bersuara (BM): Kegemilangan kepimpinan Kerajaan Uthmaniyah, penaklukan Konstantiniah serta sumbangan tamadun Islam"},"voiceIdKey":"u1-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Ikuti jejak empat sultan agung Uthmaniyah dari Sogut hingga membuka Kota Konstantiniah.","voiceScript":"[warmly] Selamat datang ke Bab Lima: Kepimpinan Kerajaan Uthmaniyah. [pause] Kerajaan agung ini bertahan lebih enam ratus tahun bermula di Sogut oleh Sultan Uthman bin Ertughrul. Sultan Murad Pertama menubuhkan pasukan Janissary di Edirne; Sultan Muhammad al-Fateh menawan Konstantiniah pada seribu empat ratus lima puluh tiga Masihi; dan Sultan Sulaiman al-Qanuni menyusun Kanunname di era kemuncak kegemilangan."},{"id":"u1-s2","type":"match","xp":15,"prompt":"Padankan setiap sultan Kerajaan Uthmaniyah dengan pencapaian utamanya.","pairs":[{"id":"u1","left":"Sultan Uthman bin Ertughrul","right":"Pengasas kerajaan di Sogut serta memerdekakan Anatolia daripada Saljuk"},{"id":"u2","left":"Sultan Murad I bin Urkhan","right":"Menubuhkan pasukan elit Janissary dan membuka ibu kota Edirne"},{"id":"u3","left":"Sultan Muhammad al-Fateh","right":"Membuka Kota Konstantiniah (Istanbul) pada 1453M & mewakafkan Aya Sofia"},{"id":"u4","left":"Sultan Sulaiman al-Qanuni","right":"Menggubal kitab undang-undang Kanunname pada puncak empayar"}],"explanation":"Keempat-empat sumbangan ini melengkapkan jawapan struktur biografi khalifah Uthmaniyah dalam Kertas 2.","voiceIdKey":"u1-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Padankan keempat-empat sultan Uthmaniyah dengan sumbangan terpenting mereka.","voiceScript":"[curious] Padankan keempat-empat tokoh sultan terkemuka Kerajaan Uthmaniyah dengan pencapaian sejarah masing-masing."},{"id":"u1-s3","type":"concept","xp":15,"title":"Makmal Peta Sultan & Ibu Kota Uthmaniyah","summary":"Klik nama setiap sultan dalam makmal untuk meneliti tempoh pemerintahan, ibu kota (Sogut -> Bursa -> Edirne -> Istanbul) dan sumbangan terperinci.","bullets":["Jejaki peralihan ibu kota daripada Anatolia (Sogut & Bursa) menyeberang ke Eropah (Edirne & Istanbul).","Catat tarikh penting 857H / 1453M pembukaan Konstantiniah."],"formula":"Sogut (1299) -> Bursa (1335) -> Edirne (1363) -> Istanbul (1453 - 1924M)","examTip":"Apabila menyebut gelaran 'al-Qanuni', kaitkannya dengan keupayaan baginda menyusun Kanunname iaitu undang-undang pentadbiran bertulis.","labId":"pi55_uthmaniyah_sultan_lab","labTitle":"Peta Empat Sultan Terunggul & Ibu Kota Kerajaan Uthmaniyah","labHeight":320,"voiceIdKey":"u1-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Jelajahi garis masa dan ibu kota empat sultan Uthmaniyah di dalam makmal.","voiceScript":"[warmly] Tekan setiap nama sultan dalam makmal di bawah untuk meneliti tempoh pemerintahan serta perpindahan ibu kota empayar."},{"id":"u1-s4","type":"mcq","xp":15,"prompt":"Apakah kepentingan pembukaan Kota Konstantiniah oleh Sultan Muhammad al-Fateh pada tahun 1453M?","options":["Menjatuhkan Empayar Rom Timur (Byzantine) serta membenarkan hadis Rasulullah SAW tentang sebaik-baik raja dan tentera","Menamatkan penggunaan pasukan tentera laut dalam empayar Uthmaniyah","Memindahkan pusat pemerintahan Uthmaniyah keluar dari wilayah Istanbul ke Sogut","Menutup kesemua sekolah dan masjid di rantau Balkan"],"correctIndex":0,"explanation":"Penaklukan Konstantiniah membuka pintu penyebaran Islam ke Eropah Timur, menjadikan Istanbul ibu kota baharu yang makmur dengan wakaf dan institusi ilmu.","voiceIdKey":"u1-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Nyatakan impak sejarah pembukaan Kota Konstantiniah pada 1453 Masihi.","voiceScript":"[informative] Mengapakah pembukaan Kota Konstantiniah oleh Sultan Muhammad al-Fateh menjadi titik sejarah teragung tamadun Uthmaniyah?"}]},{"id":"unit-2","number":2,"title":"Faktor Kegemilangan Kerajaan Uthmaniyah (SK 5.14.3)","subtitle":"Kekuatan pentadbiran, pusat ilmu masjid, sistem wakaf sosial dan keunggulan ketenteraan","iconUrl":"../assets/icons/pi55-u2.jpg","boss":false,"steps":[{"id":"u2-s1","type":"concept","xp":15,"title":"Empat Tonggak Kegemilangan Empayar Uthmaniyah (SK 5.14.3)","summary":"Kegemilangan Uthmaniyah selama berabad-abad berpunca daripada keseimbangan pentadbiran strategik, perkembangan ilmu, kebajikan rakyat melalui wakaf dan kekuatan ketenteraan berdisiplin.","bullets":["1. Pentadbiran: Sultan bertindak tegas sebagai ketua tentera, agama dan hakim tertinggi; penguasaan laluan laut strategik Selat Dardanelles dan Selat Bosporus.","2. Keilmuan: Masjid (seperti Aya Sofia dan Masjid Kasbah) serta madrasah dijadikan pusat pengajian, penyelidikan dan perkembangan seni bina Islam.","3. Sosial & Kebajikan: Sistem wakaf terancang membiayai sekolah, hospital, rumah anak yatim dan dapur umum tanpa mengira latar rakyat.","4. Ketenteraan: Semangat jihad yang tinggi, kenaikan pangkat berasaskan merit, imbuhan saksama serta pemodenan meriam dan kapal perang pada zamannya."],"formula":"Pentadbiran (Selat Strategik) + Keilmuan (Masjid) + Sosial (Wakaf) + Tentera (Jihad & Merit)","examTip":"Sentiasa kaitkan faktor geografi Uthmaniyah dengan penguasaan dua selat strategik: Selat Dardanelles dan Selat Bosporus yang mengawal perdagangan Eropah-Asia.","mediaKey":"pi55_faktor_gemilang_merosot","caption":"Perbandingan empat faktor kegemilangan menentang punca kemerosotan Kerajaan Uthmaniyah.","alt":"Carta empat faktor kegemilangan dan kemerosotan Kerajaan Uthmaniyah","voiceIdKey":"u2-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Kenali empat tonggak kegemilangan Uthmaniyah dalam pentadbiran, ilmu, wakaf dan ketenteraan.","voiceScript":"[warmly] Mengapakah Empayar Uthmaniyah mampu bertahan gagah lebih enam abad? [pause] Ada empat tonggak utama dalam DSKP: pentadbiran tegas yang menguasai laluan Selat Dardanelles dan Bosporus, masjid sebagai pusat ilmu dan seni bina, sistem wakaf memelihara kebajikan rakyat, serta angkatan tentera bermotivasi jihad dengan kelengkapan moden zamannya."},{"id":"u2-s2","type":"predict","xp":15,"prompt":"Mengapakah penguasaan Selat Dardanelles dan Selat Bosporus sangat penting kepada kegemilangan Kerajaan Uthmaniyah?","options":["Mengawal laluan strategik maritim dan perdagangan antara Eropah dan Asia serta mengukuhkan pertahanan ibu kota","Menghalang kapal pedagang Muslim daripada memasuki Laut Mediterranean","Menggantikan sistem wakaf pendidikan dengan kutipan cukai paksaan","Menghapuskan keperluan membina armada tentera laut Uthmaniyah"],"correctIndex":0,"explanation":"Kedudukan selat tersebut menghubungkan Laut Hitam dengan Laut Mediterranean, memberi kelebihan ekonomi dan pertahanan ketenteraan yang besar.","voiceIdKey":"u2-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Ramalkan kelebihan strategik penguasaan Selat Dardanelles dan Bosporus.","voiceScript":"[curious] Apakah kelebihan strategik yang diperoleh Kerajaan Uthmaniyah apabila berjaya menguasai Selat Dardanelles dan Bosporus?"},{"id":"u2-s3","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi huraian tepat faktor sosial kegemilangan Uthmaniyah.","answerTokens":["Sistem","wakaf","yang","sistematik","membela","kebajikan","pendidikan","dan","kesihatan","rakyat","jelata"],"distractors":["hutang","penindasan","asing"],"explanation":"Institusi wakaf Uthmaniyah menaja pendidikan percuma, rawatan hospital dan bantuan fakir miskin secara berterusan.","voiceIdKey":"u2-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Bina ayat tentang peranan sistem wakaf membela kebajikan rakyat Uthmaniyah.","voiceScript":"[warmly] Susun kenyataan ringkas tentang bagaimana sistem wakaf menjadi tonggak kebajikan sosial zaman Uthmaniyah."},{"id":"u2-s4","type":"mcq","xp":15,"prompt":"Manakah contoh penyelarasan ketenteraan yang menyumbang kepada kehebatan tentera Uthmaniyah pada zaman kegemilangannya?","options":["Semangat jihad tinggi digabung dengan kenaikan pangkat tersusun, imbuhan adil serta senjata moden pada zamannya","Menyerahkan kepimpinan medan perang kepada negara asing tanpa latihan","Mengabaikan pembinaan armada laut dan meriam berat","Memberikan pangkat panglima hanya berdasarkan kekayaan peribadi tanpa merit"],"correctIndex":0,"explanation":"Disiplin, semangat jihad, merit kenaikan pangkat dan inovasi senjata (termasuk meriam besar al-Fateh) menjadikan Uthmaniyah kuasa dunia yang digeruni.","voiceIdKey":"u2-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Pilih faktor ketenteraan yang memacu kekuatan tentera Uthmaniyah.","voiceScript":"[informative] Apakah faktor dalaman ketenteraan yang menjadikan pasukan Uthmaniyah begitu digeruni pada era kegemilangannya?"}]},{"id":"unit-3","number":3,"title":"Faktor Kemerosotan Empayar Uthmaniyah (SK 5.14.3)","subtitle":"Krisis ekonomi dan hutang, kemerdekaan wilayah, ketinggalan teknologi dan campur tangan asing","iconUrl":"../assets/icons/pi55-u3.jpg","boss":false,"steps":[{"id":"u3-s1","type":"concept","xp":15,"title":"Mengapa Kuasa Agung Uthmaniyah Akhirnya Merosot?","summary":"Memahami punca kejatuhan Empayar Uthmaniyah pada 1924M menjadi cermin peringatan agar kelemahan ekonomi, perpecahan dan kelalaian teknologi tidak berulang.","bullets":["Ekonomi & Hutang: Kemerosotan hasil negara serta beban hutang luar yang tinggi kepada kuasa Eropah melemahkan pentadbiran.","Teknologi Ketenteraan Ketinggalan: Tidak mengikuti arus Revolusi Perindustrian menyebabkan senjata dan kapal perang ketinggalan berbanding kuasa Barat.","Pemberontakan & Wilayah Jajahan: Gerakan nasionalis menuntut kemerdekaan di wilayah Balkan dan Timur Tengah melemahkan kesatuan empayar.","Campur Tangan Kuasa Asing & Kelemahan Dalaman: Konspirasi kuasa Barat (Perancis, Britain, Rusia) serta perebutan kuasa dalaman menghakis kedaulatan khalifah."],"formula":"Hutang Negara + Ketinggalan Teknologi + Gerakan Merdeka + Campur Tangan Asing = Kejatuhan 1924M","examTip":"Bandingkan faktor ketenteraan gemilang (senjata moden zamannya) dengan faktor merosot (ketinggalan teknologi berbanding Barat) sebagai isi kontras yang markah penuh!","voiceIdKey":"u3-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Teliti punca kemerosotan Uthmaniyah: hutang ekonomi, ketinggalan teknologi dan campur tangan asing.","voiceScript":"[serious] Mengapakah empayar besar ini akhirnya runtuh pada tahun seribu sembilan ratus dua puluh empat? [pause] Empat punca utama berkait rapat: beban hutang ekonomi negara yang tenat, teknologi ketenteraan yang jauh ketinggalan di belakang Revolusi Perindustrian Barat, pemberontakan wilayah jajahan, serta campur tangan kuasa asing yang memecahbelahkan dalaman istana."},{"id":"u3-s2","type":"sort","xp":15,"prompt":"Kelaskan keadaan berikut kepada Faktor Kegemilangan atau Punca Kemerosotan Uthmaniyah.","buckets":[{"id":"gemilang","label":"Faktor Kegemilangan"},{"id":"merosot","label":"Punca Kemerosotan"}],"items":[{"text":"Penguasaan Selat Bosporus dan Dardanelles","bucketId":"gemilang","note":"Kedudukan geostrategik yang mengukuhkan ekonomi"},{"text":"Beban hutang negara yang tinggi kepada kuasa luar","bucketId":"merosot","note":"Membuka ruang kawalan politik kuasa asing"},{"text":"Teknologi senjata ketinggalan berbanding kuasa Barat","bucketId":"merosot","note":"Kalah dalam peperangan moden abad ke-19 dan 20"},{"text":"Masjid dan wakaf membiayai pendidikan percuma","bucketId":"gemilang","note":"Menjana masyarakat berilmu dan sejahtera"}],"explanation":"Mengaitkan punca kejayaan dan keruntuhan secara berpasang melatih pemikiran analitikal sejarah tamadun.","voiceIdKey":"u3-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Asingkan faktor kegemilangan daripada punca kemerosotan empayar Uthmaniyah.","voiceScript":"[warmly] Susun keempat-empat fakta sejarah ini mengikut sama ada ia memacu kegemilangan atau membawa kemerosotan Uthmaniyah."},{"id":"u3-s3","type":"concept","xp":15,"title":"Makmal Analisis Kekuatan & Kemerosotan Uthmaniyah","summary":"Gunakan butang togol dalam makmal untuk membandingkan empat faktor kegemilangan dan punca kemerosotan serta iktibar yang dirumuskan dalam DSKP.","bullets":["Semak peranan setiap bidang (pentadbiran, keilmuan, sosial, ketenteraan) dalam mengekalkan kestabilan.","Kenal pasti amaran campur tangan asing demi kedaulatan negara."],"formula":"Kegemilangan (Ilmu + Ekonomi Kukuh) <-> Kemerosotan (Hutang + Ketinggalan Teknologi)","examTip":"Setiap soalan faktor kemerosotan lazimnya disambung dengan subsoalan iktibar kepada Malaysia masa kini.","labId":"pi55_uthmaniyah_faktor_lab","labTitle":"Analisis Kekuatan & Kemerosotan Empayar Uthmaniyah","labHeight":320,"voiceIdKey":"u3-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Bandingkan punca kekuatan dan kejatuhan Uthmaniyah di dalam makmal analisis.","voiceScript":"[curious] Tekan dua tab utama dalam makmal di bawah bagi menyemak semula perbandingan faktor kegemilangan dengan punca kemerosotan dan iktibar."},{"id":"u3-s4","type":"mcq","xp":15,"prompt":"Apakah kesan jangka panjang apabila sesebuah kerajaan menanggung hutang luar yang terlampau tinggi sambil ketinggalan dalam bidang sains dan teknologi?","options":["Kedaulatan negara mudah diceroboh dan dipengaruhi oleh kuasa asing yang membiayai hutang","Pasukan tentera menjadi lebih kebal tanpa perlu senjata moden","Semua wilayah naungan secara sukarela menggandakan cukai kesetiaan","Institusi wakaf berkembang dua kali ganda tanpa sumber ekonomi"],"correctIndex":0,"explanation":"Kebergantungan kewangan dan kelemahan teknologi membuka pintu tekanan politik serta campur tangan kuasa luar seperti yang menimpa Uthmaniyah.","voiceIdKey":"u3-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Rumuskan akibat krisis hutang dan kelemahan teknologi terhadap kedaulatan negara.","voiceScript":"[informative] Mengapakah beban hutang negara yang melampau dan ketinggalan teknologi menjadi ancaman maut kepada sesebuah tamadun?"}]},{"id":"unit-4","number":4,"title":"Iktibar Tamadun Uthmaniyah & Adab Menjaga Alam Sekitar (SK 5.14.4 & 6.21)","subtitle":"Menolak campur tangan asing, memacu inovasi serta memelihara amanah alam sekitar","iconUrl":"../assets/icons/pi55-u4.jpg","boss":false,"steps":[{"id":"u4-s1","type":"concept","xp":15,"title":"Iktibar Kepimpinan & Amanah Alam Sekitar (SK 5.14.4 & 6.21)","summary":"Unit ini menggabungkan iktibar membina negara berdaulat daripada sejarah Uthmaniyah dengan adab menjaga alam sekitar sebagai khalifah Allah di muka bumi (SK 6.21).","bullets":["Iktibar Kepimpinan Uthmaniyah (5.14.4): Memilih pemimpin berintegriti lagi adil, menolak campur tangan kuasa asing, memperkukuh perpaduan rakyat serta menguasai sains dan teknologi terkini.","Dalil & Tuntutan Alam Sekitar (6.21): Surah ar-Rum ayat 41 mengingatkan bahawa kerosakan (fasad) di darat dan di laut berlaku akibat tangan manusia.","Adab Menjaga Alam Sekitar: Memelihara kebersihan sumber air dan udara, mengurus sisa buangan melalui amalan 3R (guna semula, kitar semula), tidak menebang hutan sewenang-wenangnya dan bersikap ihsan terhadap flora serta fauna.","Hikmah: Mengelakkan bencana banjir kilat/pencemaran, mengekalkan keseimbangan ekosistem dan melestarikan bumi untuk generasi akan datang."],"formula":"Iktibar Negara (Integriti + Sains & Teknologi + Tolak Asing) + Khalifah Bumi (Pelihara Alam)","examTip":"Bezakan konsep 'Memelihara' (menjaga sumber sedia ada daripada rosak) dan 'Memulihara' (membaik pulih kawasan alam yang sudah tercemar/terjejas).","mediaKey":"pi55_iktibar_alam_sekitar","caption":"Gandingan iktibar kepimpinan Uthmaniyah dan tanggungjawab khalifah menjaga alam sekitar.","alt":"Rajah iktibar kepimpinan Uthmaniyah dan adab memelihara alam sekitar","voiceIdKey":"u4-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Terjemahkan iktibar sejarah Uthmaniyah serta adab memelihara alam sekitar dalam kehidupan moden.","voiceScript":"[warmly] Daripada sejarah Uthmaniyah, generasi muda belajar dua teras penting: pertahankan kedaulatan negara dengan pemimpin berintegriti dan penguasaan sains, serta pikul amanah menjaga alam sekitar. [pause] Surah ar-Rum ayat empat puluh satu mengingatkan bahawa pencemaran di darat dan di laut terjadi akibat kerakusan manusia, maka kita mesti memelihara dan memulihara alam secara beradab."},{"id":"u4-s2","type":"predict","xp":15,"prompt":"Sebuah kilang menyalurkan sisa kimia ke sungai sehingga menjejaskan bekalan air penduduk, bertepatan dengan peringatan Surah ar-Rum ayat 41. Apakah tindakan pelajar yang selaras dengan adab Islam menjaga alam sekitar?","options":["Melaporkan pencemaran kepada pihak berkuasa serta menyertai kempen pemuliharaan sungai dan amalan kitar semula","Membiarkan sahaja pencemaran tersebut kerana sungai hanya urusan jabatan kerajaan","Membakar sisa plastik di tepi sungai supaya tidak hanyut ke laut","Menganggap bencana pencemaran tiada kaitan langsung dengan etika khalifah manusia"],"correctIndex":0,"explanation":"Setiap Muslim bertanggungjawab mencegah kemungkaran terhadap alam melalui saluran sah, pemuliharaan aktif serta mengurangkan sisa pencemaran.","voiceIdKey":"u4-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Pilih tindakan bertanggungjawab mencegah kerosakan alam sekitar.","voiceScript":"[curious] Bagaimanakah seorang pelajar melaksanakan tanggungjawab khalifah apabila berdepan pencemaran sungai oleh sisa toksik?"},{"id":"u4-s3","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi iktibar utama kepimpinan Kerajaan Uthmaniyah bagi generasi muda.","answerTokens":["Rakyat","perlu","menolak","campur","tangan","asing","serta","menguasai","sains","dan","teknologi","moden"],"distractors":["berhutang","berpecah","melalaikan"],"explanation":"Iktibar 5.14.4 menegaskan dua syarat kemerdekaan kukuh: kedaulatan bebas campur tangan asing dan kemajuan sains serta teknologi.","voiceIdKey":"u4-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Susun iktibar utama daripada kejatuhan Uthmaniyah demi kedaulatan negara.","voiceScript":"[warmly] Susun rumusan iktibar penting yang mesti dipegang oleh rakyat Malaysia daripada sejarah kejatuhan Uthmaniyah."},{"id":"u4-s4","type":"mcq","xp":15,"prompt":"Apakah perbezaan tepat antara 'memelihara' dengan 'memulihara' alam sekitar dalam SP 6.21.4?","options":["Memelihara ialah menjaga alam yang masih elok daripada tercemar, manakala memulihara ialah membaik pulih ekosistem yang telah rosak","Memelihara hanya terpakai di darat manakala memulihara hanya di kawasan laut","Memelihara bermaksud menebang hutan tua manakala memulihara bermaksud membina lebuh raya","Kedua-duanya bermaksud menutup semua kilang perindustrian di Malaysia"],"correctIndex":0,"explanation":"Memelihara bersifat pencegahan (menjaga hutan dara/sungai bersih), manakala memulihara bersifat pemulihan (menanam semula pokok bakau atau merawat sungai tercemar).","voiceIdKey":"u4-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Bezakan makna memelihara dengan memulihara alam sekitar.","voiceScript":"[informative] Soalan kerap menguji dua istilah ini: apakah beza tepat antara memelihara dengan memulihara alam sekitar?"}]},{"id":"unit-5","number":5,"title":"Cabaran Bos: Kepimpinan Uthmaniyah & Alam Sekitar","subtitle":"Ujian penguasaan empat sultan, faktor kegemilangan, kejatuhan dan amanah alam sekitar","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","xp":25,"prompt":"Lengkapkan pasangan tepat berikut: 'Pasukan tentera elit ______ ditubuhkan pada zaman Sultan Murad I dengan ibu kota baharu di Edirne, manakala kitab undang-undang ______ disusun oleh Sultan Sulaiman al-Qanuni.'","options":["Janissary ... Kanunname","Saljuk ... al-Ma'thurat","Byzantine ... Jurnal Hukum","Ayyubiyah ... Risalah at-Ta'lim"],"correctIndex":0,"explanation":"Sultan Murad I membentuk pasukan elit Janissary di Edirne, dan Sultan Sulaiman al-Qanuni menyusun undang-undang bertulis Kanunname.","voiceIdKey":"u5-s1","voiceToneLabel":"Mentor Bos","voiceCaption":"Selesaikan gandingan istilah pasukan elit dan kitab undang-undang Uthmaniyah.","voiceScript":"[dramatic] Peringkat Bos Bab Lima! Namakan pasukan elit zaman Sultan Murad Pertama dan kitab undang-undang era Sultan Sulaiman al-Qanuni."},{"id":"u5-s2","type":"match","xp":25,"prompt":"Padankan lokasi strategik dan sumbangan tamadun Uthmaniyah berikut.","pairs":[{"id":"l1","left":"Sogut","right":"Pusat pemerintahan terawal pengasasan Sultan Uthman bin Ertughrul"},{"id":"l2","left":"Istanbul (1453M)","right":"Ibu kota selepas pembukaan Konstantiniah oleh Muhammad al-Fateh"},{"id":"l3","left":"Selat Dardanelles & Bosporus","right":"Laluan maritim strategik yang dikuasai pentadbiran Uthmaniyah"},{"id":"l4","left":"Surah ar-Rum: 41","right":"Dalil kerosakan alam berlaku akibat tangan manusia (fasad)"}],"explanation":"Penggabungan lokasi sejarah dan dalil alam sekitar melengkapkan keseluruhan Bab 5.","voiceIdKey":"u5-s2","voiceToneLabel":"Mentor Bos","voiceCaption":"Padankan tempat bersejarah Uthmaniyah dan dalil amanah alam sekitar.","voiceScript":"[warmly] Padankan kesemua empat lokasi bersejarah serta dalil al-Quran ini dengan keterangannya yang tepat."},{"id":"u5-s3","type":"wordbank","xp":25,"prompt":"Susun perkataan menjadi rumusan iktibar penutup Bab 5.","answerTokens":["Pemimpin","berintegriti","dan","rakyat","berilmu","menjamin","kedaulatan","negara","serta","kelestarian","alam"],"distractors":["hutang","fasad","merosot"],"explanation":"Integriti kepimpinan dan penguasaan ilmu menjamin keutuhan negara di samping memelihara kelestarian alam ciptaan Tuhan.","voiceIdKey":"u5-s3","voiceToneLabel":"Mentor Bos","voiceCaption":"Susun rumusan akhir gabungan kepimpinan berintegriti dan kelestarian alam.","voiceScript":"[warmly] Susun kenyataan penutup yang menyatukan kepimpinan berintegriti, ilmu rakyat dan kelestarian alam sekitar."},{"id":"u5-s4","type":"mcq","xp":25,"prompt":"Soalan Bos Akhir: Manakah pernyataan yang 100% BENAR mengenai Bab 5 Pendidikan Islam T5?","options":["Sultan Muhammad al-Fateh membuka Konstantiniah pada 1453M, manakala kemerosotan Uthmaniyah dipicu hutang tinggi dan ketinggalan teknologi.","Sultan Uthman bin Ertughrul memerintah selama 48 tahun di Istanbul dan menyusun kitab Kanunname.","Sistem wakaf Uthmaniyah menyekat golongan miskin daripada menerima rawatan hospital.","Menjaga alam sekitar bermaksud membiarkan pencemaran sungai berlaku sebagai tanda takdir semula jadi."],"correctIndex":0,"explanation":"Pilihan A menepati sejarah Uthmaniyah. Pilihan B menyalahi Sultan Uthman (terawal di Sogut, Kanunname oleh Sulaiman al-Qanuni), C salah fungsi wakaf, dan D menyalahi adab menjaga alam.","voiceIdKey":"u5-s4","voiceToneLabel":"Mentor Bos","voiceCaption":"Pilih kenyataan 100 peratus benar bagi menamatkan cabaran Bab 5.","voiceScript":"[excited] Soalan terakhir Bab Lima! Semak nama sultan, tarikh 1453 Masihi serta faktor kemerosotan untuk mengungguli peringkat Bos."}]}]};</script>

  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
