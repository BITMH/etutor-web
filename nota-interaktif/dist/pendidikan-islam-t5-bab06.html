/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }

  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

Membebaskan Baitul Maqdis daripada penguasaan tentera Salib (583H / 1187M) serta menjaga keselamatan jemaah haji dan penduduk semua agama secara adil.","Sumbangan Keilmuan: Mengembalikan pegangan akidah Ahli Sunnah Wal-Jamaah dalam sistem pendidikan madrasah serta membina sekolah-sekolah Islam.","Sumbangan Pentadbiran: Mengubah dewan istana kepada hospital awam al-Bimaristan al-'Atiq lengkap dengan gedung ubat-ubatan yang bergred mengikut jenis penyakit."],"formula":"Salahuddin (532H Tikrit) -> Bebas Baitul Maqdis + Kembalikan ASWJ + Hospital al-Bimaristan al-'Atiq","examTip":"Nama hospital 'al-Bimaristan al-'Atiq' dan pengembalian akidah ASWJ ialah dua fakta pentadbiran & keilmuan Salahuddin yang kerap membezakan jawapan cemerlang dalam SPM.","mediaKey":"pi56_salahuddin_ayyubi","caption":"Biodata serta tiga teras sumbangan Salahuddin al-Ayyubi dalam ketenteraan, keilmuan dan pentadbiran.","alt":"Carta biografi dan sumbangan Salahuddin al-Ayyubi dalam ketenteraan, keilmuan dan pentadbiran","voiceIdKey":"u1-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Pelajari biografi, sifat ihsan dan tiga sumbangan agung Salahuddin al-Ayyubi.","voiceScript":"[warmly] Selamat datang ke Bab Enam, bab penutup Tingkatan Lima: Tokoh-Tokoh Islam Terbilang! [pause] Tokoh pertama ialah Salahuddin al-Ayyubi atau nama penuhnya Yusuf bin Ayub bin Shazi, pengasas Kerajaan al-Ayyubiyah. Selain membebaskan Baitul Maqdis daripada tentera Salib, beliau mengembalikan akidah Ahli Sunnah Wal-Jamaah dalam pendidikan serta menubuhkan hospital al-Bimaristan al-'Atiq untuk merawat rakyat."},{"id":"u1-s2","type":"predict","xp":15,"prompt":"Bagaimanakah Salahuddin al-Ayyubi membuktikan keperihatinan pentadbirannya terhadap kesihatan dan kebajikan rakyat selepas menguasai Mesir dan Syria?","options":["Mengubah dewan istana menjadi hospital al-Bimaristan al-'Atiq yang dilengkapi gedung ubat-ubatan bergred","Menutup semua hospital awam supaya tentera tidak terganggu","Mengenakan bayaran cukai berganda kepada rakyat miskin yang sakit","Menyerahkan pengurusan hospital kepada pasukan Salib sepenuhnya"],"correctIndex":0,"explanation":"Salahuddin menukar dewan istana di Kaherah menjadi hospital al-Bimaristan al-'Atiq dengan rawatan percuma serta pengelasan ubat bergred.","voiceIdKey":"u1-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Ramalkan bukti keprihatinan pentadbiran Salahuddin dalam bidang kesihatan awam.","voiceScript":"[curious] Salahuddin tidak menggunakan kemewahan istana untuk kepentingan diri. Apakah tindakan pentadbiran beliau terhadap dewan istana untuk kesihatan rakyat?"},{"id":"u1-s3","type":"concept","xp":15,"title":"Makmal Direktori Tokoh Islam Terbilang","summary":"Gunakan direktori interaktif dalam makmal untuk menyemak nama sebenar, tahun lahir/wafat, akhlak mulia dan sumbangan terperinci ketiga-tiga tokoh KSSM 5.15.","bullets":["Bandingkan latar zaman Salahuddin (abad ke-12M), Hassan al-Banna (awal abad ke-20M) dan Prof. Ahmad Ibrahim (Malaysia moden).","Catat nama penuh bapa setiap tokoh dengan tepat."],"formula":"Yusuf bin Ayub (Tikrit) | Hassan bin Ahmad (Mesir) | Ahmad bin Mohamed Ibrahim (Singapura)","examTip":"Soalan objektif Kertas 1 sering menguji nama sebenar Salahuddin (Yusuf bin Ayub bin Shazi) serta tempat kelahirannya (Tikrit, Iraq).","labId":"pi56_tokoh_islam_lab","labTitle":"Direktori Tokoh Islam Terbilang (DSKP 5.15)","labHeight":320,"voiceIdKey":"u1-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Teliti biodata dan sumbangan ketiga-tiga tokoh di dalam direktori interaktif.","voiceScript":"[warmly] Klik setiap nama tokoh dalam direktori di bawah bagi menyemak biodata tepat, sifat akhlak serta sumbangan yang digariskan dalam DSKP."},{"id":"u1-s4","type":"mcq","xp":15,"prompt":"Apakah sumbangan terbesar Salahuddin al-Ayyubi dalam bidang keilmuan dan akidah?","options":["Mengembalikan pegangan akidah Ahli Sunnah Wal-Jamaah dalam sistem pendidikan serta mendirikan madrasah","Menggubal Akta Mahkamah Syariah di Semenanjung Tanah Melayu","Menubuhkan pertubuhan Ikhwanul Muslimin di Ismailiyah pada tahun 1928","Mencipta sistem percetakan moden berbahasa Inggeris di Damsyik"],"correctIndex":0,"explanation":"Setelah berakhirnya era Kerajaan Fatimiyah di Mesir, Salahuddin mengembalikan pengajaran akidah ASWJ dan ilmu syariat ke madrasah-madrasah serta al-Azhar.","voiceIdKey":"u1-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Kenal pasti sumbangan keilmuan Salahuddin al-Ayyubi dalam memelihara akidah.","voiceScript":"[informative] Apakah jasa besar Salahuddin al-Ayyubi dalam bidang pendidikan dan pemurnian akidah umat?"}]},{"id":"unit-2","number":2,"title":"Hassan al-Banna: Pendidik & Penggerak Dakwah Berorganisasi (SK 5.15)","subtitle":"Riwayat hidup di Mesir, kehebatan pidato, Ikhwanul Muslimin (1928) serta karya al-Ma'thurat","iconUrl":"../assets/icons/pi56-u2.jpg","boss":false,"steps":[{"id":"u2-s1","type":"concept","xp":15,"title":"Ketokohan Hassan al-Banna (1906M - 1949M)","summary":"Hassan bin Ahmad bin Abdur Rahman al-Banna lahir di Mahmudiyyah, Mesir (1906M) dan mendapat pendidikan di Darul Ulum Kaherah—terkenal sebagai pendidik berjiwa kental yang menyatukan tarbiah masyarakat secara tersusun.","bullets":["Latar & Akhlak: Lulusan cemerlang Darul Ulum Kaherah dan bertugas sebagai guru di Ismailiyah; berjiwa pendidik gigih, petah berpidato menyatukan hati masyarakat serta membina tarbiah secara berperingkat.","Sumbangan Dakwah & Sosial: Mengasaskan gerakan Ikhwanul Muslimin pada tahun 1928M di Ismailiyah untuk memurnikan akhlak, membasmi buta huruf, membina sekolah serta menjaga kebajikan rakyat.","Sumbangan Karya Penulisan: Menghasilkan himpunan zikir pagi dan petang 'al-Ma'thurat', 'Risalah at-Ta'lim' serta 'Mudhakkirat ad-Da'wah wa ad-Da'iyah'."],"formula":"Hassan al-Banna (1906M Mesir) -> Guru Darul Ulum -> Asas Ikhwanul Muslimin (1928M) -> Karya al-Ma'thurat","examTip":"Kaitkan bandar 'Ismailiyah' (tempat beliau mengajar) dengan tahun 1928M sebagai lokasi pengasasan Ikhwanul Muslimin, dan 'al-Ma'thurat' sebagai amalan zikir karya beliau.","mediaKey":"pi56_banna_ahmad","caption":"Perbandingan biodata serta sumbangan Hassan al-Banna dan Prof. Emeritus Tan Sri Dr. Ahmad bin Ibrahim.","alt":"Carta biografi dan sumbangan Hassan al-Banna serta Prof. Emeritus Tan Sri Dr. Ahmad Ibrahim","voiceIdKey":"u2-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Kenali perjuangan dakwah berhikmah Hassan al-Banna dan himpunan zikir al-Ma'thurat.","voiceScript":"[warmly] Tokoh kedua ialah Hassan al-Banna, lahir di Mesir pada tahun seribu sembilan ratus enam Masihi dan lulusan Darul Ulum Kaherah. [pause] Ketika bertugas sebagai guru di Ismailiyah, beliau mengasaskan Ikhwanul Muslimin pada tahun seribu sembilan ratus dua puluh lapan untuk memurnikan akhlak masyarakat dan memperkasa pendidikan, di samping menyusun himpunan zikir al-Ma'thurat yang masih diamalkan hingga kini."},{"id":"u2-s2","type":"wordbank","xp":15,"prompt":"Susun perkataan menjadi ringkasan tepat sumbangan dakwah dan penulisan Hassan al-Banna.","answerTokens":["Hassan","al-Banna","mengasaskan","Ikhwanul","Muslimin","di","Ismailiyah","serta","menyusun","himpunan","zikir","al-Ma'thurat"],"distractors":["Kanunname","al-Bimaristan","UIAM"],"explanation":"Ikhwanul Muslimin diasaskan oleh Hassan al-Banna pada 1928 di Ismailiyah manakala al-Ma'thurat ialah susunan wirid dan zikir nabawi karyanya.","voiceIdKey":"u2-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Bina ayat ringkas yang merumuskan pengasasan Ikhwanul Muslimin dan karya al-Ma'thurat.","voiceScript":"[warmly] Susun kenyataan ringkas mengenai lokasi pengasasan gerakan dakwah dan karya terkenal Hassan al-Banna."},{"id":"u2-s3","type":"sort","xp":15,"prompt":"Kelaskan fakta berikut mengikut tokoh yang tepat: Salahuddin al-Ayyubi atau Hassan al-Banna.","buckets":[{"id":"salahuddin","label":"Salahuddin al-Ayyubi"},{"id":"banna","label":"Hassan al-Banna"}],"items":[{"text":"Membuka hospital al-Bimaristan al-'Atiq dengan gedung ubat bergred","bucketId":"salahuddin","note":"Sumbangan pentadbiran kesihatan awam"},{"text":"Lulusan Darul Ulum Kaherah dan guru di Ismailiyah","bucketId":"banna","note":"Latar pendidikan dan kerjaya awal"},{"text":"Menghasilkan Risalah at-Ta'lim dan himpunan al-Ma'thurat","bucketId":"banna","note":"Karya dakwah dan zikir harian"},{"text":"Membebaskan Baitul Maqdis daripada tentera Salib","bucketId":"salahuddin","note":"Pencapaian ketenteraan bersejarah"}],"explanation":"Mengasingkan latar abad ke-12M Salahuddin daripada gerakan moden abad ke-20M Hassan al-Banna mengelakkan kekeliruan fakta.","voiceIdKey":"u2-s3","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Asingkan jasa Salahuddin al-Ayyubi daripada sumbangan Hassan al-Banna.","voiceScript":"[warmly] Susun kesemua empat fakta sejarah ini mengikut tokohnya antara Salahuddin al-Ayyubi dan Hassan al-Banna."},{"id":"u2-s4","type":"mcq","xp":15,"prompt":"Mengapakah pendekatan dakwah Hassan al-Banna di kedai-kedai kopi di Ismailiyah berjaya menarik minat ramai masyarakat pelbagai lapisan?","options":["Kerana beliau menyampaikan pengajaran secara hikmah, berperingkat, penuh kasih sayang dan mendekati realiti rakyat biasa","Kerana beliau mewajibkan orang ramai menghafal kitab undang-undang Inggeris dahulu","Kerana beliau menolak pembinaan sekolah serta pusat kebajikan masyarakat","Kerana beliau hanya berpidato kepada golongan bangsawan di istana"],"correctIndex":0,"explanation":"Keberkesanan dakwah beliau lahir daripada sikap tawaduk, tutur kata lemah lembut dan kesungguhan menyantuni rakyat marhaen di tempat mereka berkumpul.","voiceIdKey":"u2-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Jelaskan rahsia keberkesanan pendekatan dakwah masyarakat Hassan al-Banna.","voiceScript":"[informative] Mengapakah pendekatan dakwah Hassan al-Banna di kedai kopi di Ismailiyah diterima mesra oleh masyarakat?"}]},{"id":"unit-3","number":3,"title":"Prof. Emeritus Tan Sri Dr. Ahmad bin Ibrahim: Tokoh Syariah Malaysia","subtitle":"Latar pendidikan Cambridge, hakim Mahkamah Rayuan & Syariah, pengasas Kuliah Undang-undang UIAM & karya UKIM/SUM","iconUrl":"../assets/icons/pi56-u3.jpg","boss":false,"steps":[{"id":"u3-s1","type":"concept","xp":15,"title":"Pemartabat Undang-Undang Islam di Malaysia (1916 - 1999)","summary":"Prof. Emeritus Tan Sri Dr. Ahmad bin Mohamed Ibrahim (lahir 15 Mei 1916 di Singapura; wafat 17 April 1999) merupakan tokoh perundangan unggul yang berjaya mengarusperdanakan perundangan Syariah di Malaysia.","bullets":["Pendidikan & Akhlak: Mendapat pendidikan di Raffles College dan University of Cambridge (kelas pertama bidang undang-undang); terkenal dengan sifat amanah kehakiman, tekun menyelidik dan suka menyebarkan ilmu.","Sumbangan Kehakiman & Pentadbiran: Hakim Mahkamah Rayuan & Mahkamah Syariah; anggota panel pengasas Kuliah Undang-Undang Universiti Islam Antarabangsa Malaysia (UIAM); pengasas dan penggubal Enakmen Undang-undang Islam Kelantan.","Sumbangan Karya Akademik: Menghasilkan karya rujukan utama 'Undang-Undang Keluarga Islam di Malaysia' (UKIM), 'Sistem Undang-undang Malaysia' (SUM) serta pelopor penerbitan 'Jurnal Hukum'.","Pengiktirafan: Dianugerahi gelaran Profesor Emeritus, Tan Sri dan Anugerah Tokoh Maal Hijrah atas jasa memartabatkan institusi syariah."],"formula":"Ahmad Ibrahim (Raffles + Cambridge) -> Panel Pengasas UIAM + Hakim Syariah -> Karya UKIM, SUM & Jurnal Hukum","examTip":"Ingat akronim penting sukatan KSSM bagi tokoh Malaysia ini: UIAM (Kuliah Undang-undang), UKIM (Undang-Undang Keluarga Islam di Malaysia), SUM (Sistem Undang-undang Malaysia) dan Jurnal Hukum.","voiceIdKey":"u3-s1","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Pelajari jasa Prof. Ahmad Ibrahim menggabungkan ilmu naqli dan aqli memartabatkan Mahkamah Syariah.","voiceScript":"[warmly] Tokoh ketiga amat dekat dengan tanah air kita: Profesor Emeritus Tan Sri Doktor Ahmad bin Ibrahim. [pause] Lulusan cemerlang Raffles College dan University of Cambridge ini bukan sahaja hakim Mahkamah Rayuan dan Syariah, malah menjadi pengasas bersama Kuliah Undang-Undang UIAM, penggubal Enakmen Islam Kelantan, pelopor Jurnal Hukum serta penulis kitab rujukan UKIM dan SUM."},{"id":"u3-s2","type":"match","xp":15,"prompt":"Padankan butiran berkaitan Prof. Emeritus Tan Sri Dr. Ahmad Ibrahim dengan fakta tepatnya.","pairs":[{"id":"a1","left":"Raffles College & University of Cambridge","right":"Institusi pengajian tinggi yang membentuk asas undang-undang beliau"},{"id":"a2","left":"Kuliah Undang-Undang UIAM","right":"Institusi tempat beliau menjadi anggota panel pengasas serta dekan"},{"id":"a3","left":"UKIM & SUM","right":"Karya penulisan terkenal tentang undang-undang keluarga dan sistem Malaysia"},{"id":"a4","left":"Jurnal Hukum","right":"Penerbitan laporan keputusan kes syariah yang dipelopori oleh beliau"}],"explanation":"Mengaitkan pendidikan Cambridge beliau dengan pembaharuan undang-undang Syariah di UIAM dan Malaysia menyerlahkan integrasi ilmu naqli dan aqli.","voiceIdKey":"u3-s2","voiceToneLabel":"Ustaz Sejarah","voiceCaption":"Padankan latar pendidikan, institusi dan karya Prof. Ahmad Ibrahim dengan tepat.","voiceScript":"[curious] Padankan keempat-empat fakta berkaitan Profesor Ahmad Ibrahim dengan keterangan tepatnya."},{"id":"u3-s3","type":"predict","xp":15,"prompt":"Mengapakah penubuhan Kuliah Undang-Undang di UIAM dan penerbitan Jurnal Hukum oleh Prof. Ahmad Ibrahim dianggap lonjakan besar kepada perundangan Islam di Malaysia?","options":["Melahirkan graduan yang menguasai kedua-dua undang-undang sivil dan syariah serta mendokumentasikan kes-kes syariah secara profesional","Memansuhkan semua mahkamah sivil di seluruh Malaysia dalam tempoh satu bulan","Mengehadkan kajian undang-undang Islam di negeri Kelantan sahaja","Menghentikan penerbitan semua buku rujukan undang-undang berbahasa Melayu"],"correctIndex":0,"explanation":"Integrasi pengajian sivil dan syariah di UIAM serta penghasilan Jurnal Hukum menaikkan taraf profesionalisme peguam serta hakim Mahkamah Syariah di Malaysia.","voiceIdKey":"u3-s3","voiceToneLabel":"Mentor SPM","voiceCaption":"Ramalkan impak penubuhan Kuliah Undang-undang UIAM dan Jurnal Hukum kepada negara.","voiceScript":"[curious] Apakah impak jangka panjang inisiatif Profesor Ahmad Ibrahim mengasaskan Kuliah Undang-undang UIAM dan Jurnal Hukum?"},{"id":"u3-s4","type":"mcq","xp":15,"prompt":"Bagaimanakah seorang pelajar aliran sains atau sastera hari ini dapat mencontohi kecemerlangan akademik Prof. Ahmad Ibrahim?","options":["Menguasai bahasa antarabangsa dan kepakaran moden sambil mengintegrasikannya untuk memartabatkan prinsip Islam","Memilih satu bidang moden sahaja dan mengabaikan asas ilmu fardu ain","Mengelakkan penulisan karya ilmiah atau jurnal selepas tamat pengajian","Berhenti menyumbang kepakaran kepada masyarakat selepas mendapat ijazah"],"correctIndex":0,"explanation":"Prof. Ahmad Ibrahim menjadi teladan terbaik penyatuan ilmu aqli (kepakaran undang-undang Cambridge) dengan ilmu naqli (Syariah Islam).","voiceIdKey":"u3-s4","voiceToneLabel":"Ustaz Coach","voiceCaption":"Pilih teladan akademik terbaik daripada keperibadian Prof. Ahmad Ibrahim.","voiceScript":"[informative] Bagaimanakah pelajar Tingkatan Lima dapat meneladani kesepaduan ilmu aqli dan naqli Profesor Ahmad Ibrahim?"}]},{"id":"unit-4","number":4,"title":"Iktibar Kepimpinan, Dakwah & Perundangan Tokoh (SK 5.15.2 - 5.15.4)","subtitle":"Menghubungkait keunggulan ketiga-tiga tokoh dalam usaha mengislah diri dan masyarakat","iconUrl":"../assets/icons/pi56-u4.jpg","boss":false,"steps":[{"id":"u4-s1","type":"concept","xp":15,"title":"Mengislah Diri & Membina Bakti Berdasarkan Tiga Bidang Tokoh","summary":"DSKP 5.15.3-5.15.4 menuntut pelajar merumuskan iktibar ketiga-tiga tokoh serta melaksanakannya dalam usaha mengislah diri (memperbaiki diri) secara beradab dan istiqamah.","bullets":["Iktibar Pertahanan & Kebajikan (Salahuddin al-Ayyubi): Berani mempertahankan kebenaran berpaksikan akidah ASWJ, menghormati ulama dan prihatin menyediakan kemudahan kesihatan rakyat.","Iktibar Dakwah & Tarbiah (Hassan al-Banna): Menyampaikan dakwah secara teratur, berhikmah, menubuhkan persatuan berfaedah dan memelihara zikir harian.","Iktibar Keilmuan & Perundangan (Prof. Ahmad Ibrahim): Tekun menuntut ilmu hingga peringkat tertinggi dan menyumbang kepakaran demi menegakkan keadilan syariah.","Usaha Mengislah Diri: Bermula daripada memperbaiki ibadah, akhlak dengan guru/ibu bapa dan kesungguhan menuntut ilmu."],"formula":"Pertahanan/Kebajikan (Salahuddin) + Dakwah/Tarbiah (al-Banna) + Keilmuan/Keadilan (Ahmad Ibrahim) = Islah Ummah","examTip":"Apabila menjawab soalan KBAT tentang cara pelajar mengislah diri mengikut tokoh, gabungkan sikap tekun belajar, menyertai aktiviti dakwah/persatuan sekolah dan menjaga integriti diri.","mediaKey":"pi56_iktibar_tokoh","caption":"Tiga teras iktibar daripada Salahuddin al-Ayyubi, Hassan al-Banna dan Prof. Ahmad Ibrahim.","alt":"Carta tiga teras iktibar tokoh Islam terbilang untuk mengislah diri dan ummah","voiceIdKey":"u4-s1","voiceToneLabel":"Ustaz Coach","voiceCaption":"Amalkan tiga teras iktibar tokoh untuk mengislah diri secara beradab dan istiqamah.","voiceScript":"[warmly] Keunggulan tokoh tidak bermakna jika hanya dihafal tarikhnya tanpa iktibar untuk mengislah diri. [pause] Salahuddin mengajar keberanian berpaksikan akidah dan ihsan kebajikan; Hassan al-Banna mengajar kesabaran dakwah berorganisasi; dan Profesor Ahmad Ibrahim membuktikan bagaimana kepakaran akademik mampu memartabatkan sistem keadilan Islam."},{"id":"u4-s2","type":"sort","xp":15,"prompt":"Kelaskan aplikasi iktibar murid berikut mengikut tokoh inspirasinya.","buckets":[{"id":"banna","label":"Teladan Hassan al-Banna (Dakwah & Tarbiah)"},{"id":"ahmad","label":"Teladan Prof. Ahmad Ibrahim (Ilmu & Keadilan)"}],"items":[{"text":"Menggerakkan kelab usrah dan program zikir al-Ma'thurat di sekolah","bucketId":"banna","note":"Semangat tarbiah berorganisasi dan zikir harian"},{"text":"Berusaha gigih menguasai ilmu perundangan dan penulisan ilmiah","bucketId":"ahmad","note":"Kesepaduan ilmu naqli dan aqli dalam bidang profesional"},{"text":"Membimbing rakan secara berhikmah dan lemah lembut meninggalkan tabiat buruk","bucketId":"banna","note":"Pendekatan dakwah secara berperingkat dan mesra"},{"text":"Menjaga integriti serta berlaku adil ketika menjadi pengawas atau hakim kuiz","bucketId":"ahmad","note":"Etika kehakiman yang telus dan amanah"}],"explanation":"Mengaitkan teladan khusus tokoh dengan peranan murid sekolah menjadikan jawapan KBAT anda bernilai tinggi.","voiceIdKey":"u4-s2","voiceToneLabel":"Ustaz Coach","voiceCaption":"Padankan tindakan harian murid dengan inspirasi Hassan al-Banna atau Prof. Ahmad Ibrahim.","voiceScript":"[warmly] Kelaskan keempat-empat amalan murid sekolah ini mengikut teladan tokoh yang menjadi inspirasinya."},{"id":"u4-s3","type":"concept","xp":15,"title":"Makmal Papan Iktibar Tokoh Islam","summary":"Klik setiap bidang sumbangan di dalam makmal untuk menyemak iktibar terperinci bagi ketenteraan/kebajikan, dakwah/tarbiah serta kehakiman/perundangan.","bullets":["Semak perkaitan setiap iktibar dengan kehidupan remaja masa kini.","Rangkumkan langkah konkrit memulakan islah diri hari ini."],"formula":"Islah Diri (Ilmu + Akhlak + Amal) -> Islah Keluarga & Sekolah -> Sumbangan Tamadun","examTip":"Istilah 'mengislah diri' (SP 5.15.4) bermaksud berusaha memperbaiki dan memperelok pegangan agama serta akhlak diri secara berterusan.","labId":"pi56_iktibar_tokoh_lab","labTitle":"Papan Iktibar Kepimpinan & Keilmuan Tokoh Islam","labHeight":320,"voiceIdKey":"u4-s3","voiceToneLabel":"Ustaz Coach","voiceCaption":"Semak iktibar kepimpinan tiga bidang tokoh di dalam papan interaktif.","voiceScript":"[curious] Klik kesemua tiga bidang dalam Papan Iktibar di bawah bagi melihat cara menyusun jawapan islah diri untuk Kertas Dua SPM."},{"id":"u4-s4","type":"mcq","xp":15,"prompt":"Apakah maksud usaha 'mengislah diri' yang dituntut dalam Standard Pembelajaran 5.15.4 setelah mempelajari keunggulan tokoh Islam terbilang?","options":["Berusaha memperbaiki kelemahan rohani, ilmu dan akhlak diri secara beradab dan istiqamah demi manfaat ummah","Menghafal tahun wafat tokoh semata-mata tanpa mengubah tingkah laku harian","Mengkritik kesalahan masyarakat tanpa membaiki amalan peribadi sendiri","Menunggu sehingga menjawat jawatan tinggi barulah memulakan kerja kebajikan"],"correctIndex":0,"explanation":"Islah bermaksud pembaikan; mengislah diri ialah komitmen memperbaiki diri dengan ilmu, takwa dan akhlak sebelum memimpin perubahan dalam masyarakat.","voiceIdKey":"u4-s4","voiceToneLabel":"Mentor SPM","voiceCaption":"Tentukan maksud sebenar tuntutan mengislah diri dalam DSKP 5.15.4.","voiceScript":"[informative] Apakah maksud tepat tuntutan mengislah diri setelah menghayati perjuangan tokoh Islam terbilang?"}]},{"id":"unit-5","number":5,"title":"Cabaran Bos: Tokoh Islam Terbilang & Penutup T5","subtitle":"Ujian penguasaan keseluruhan Salahuddin al-Ayyubi, Hassan al-Banna dan Prof. Ahmad Ibrahim","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"id":"u5-s1","type":"predict","xp":25,"prompt":"Lengkapkan pasangan tepat berikut: 'Salahuddin al-Ayyubi mengasaskan hospital ______ bagi merawat rakyat, manakala Prof. Ahmad Ibrahim memelopori penerbitan ______ serta menulis karya UKIM dan SUM.'","options":["al-Bimaristan al-'Atiq ... Jurnal Hukum","al-Ma'thurat ... Risalah at-Ta'lim","Kanunname ... Darul Ulum","Ikhwanul Muslimin ... Baitul Maqdis"],"correctIndex":0,"explanation":"Hospital kebajikan Salahuddin ialah al-Bimaristan al-'Atiq, dan penerbitan kes syariah yang dipelopori Prof. Ahmad Ibrahim ialah Jurnal Hukum.","voiceIdKey":"u5-s1","voiceToneLabel":"Mentor Bos","voiceCaption":"Lengkapkan nama hospital Salahuddin dan penerbitan syariah Prof. Ahmad Ibrahim.","voiceScript":"[dramatic] Peringkat Bos penutup Tingkatan Lima! Namakan hospital tinggalan Salahuddin al-Ayyubi serta jurnal perundangan yang dipelopori Profesor Ahmad Ibrahim."},{"id":"u5-s2","type":"match","xp":25,"prompt":"Padankan ketiga-tiga tokoh SK 5.15 serta sumbangan unik dengan tepat.","pairs":[{"id":"t1","left":"Salahuddin al-Ayyubi","right":"Lahir di Tikrit (532H), bebas Baitul Maqdis & pulih akidah ASWJ"},{"id":"t2","left":"Hassan al-Banna","right":"Lahir di Mesir (1906M), pengasas Ikhwanul Muslimin & al-Ma'thurat"},{"id":"t3","left":"Prof. Ahmad Ibrahim","right":"Lahir di Singapura (1916M), panel pengasas Kuliah Undang-undang UIAM"},{"id":"t4","left":"Usaha Mengislah Diri","right":"Memperbaiki ilmu, akhlak dan amal secara istiqamah meneladani tokoh"}],"explanation":"Penguasaan penuh biografi serta iktibar ketiga-tiga tokoh melengkapkan persediaan cemerlang Bidang Sirah & Tamadun T5.","voiceIdKey":"u5-s2","voiceToneLabel":"Mentor Bos","voiceCaption":"Padankan kesemua tokoh Islam terbilang serta konsep islah diri dengan tepat.","voiceScript":"[warmly] Padankan ketiga-tiga tokoh hebat ini serta prinsip islah diri dengan biodata dan jasanya."},{"id":"u5-s3","type":"wordbank","xp":25,"prompt":"Susun perkataan menjadi rumusan penutup keunggulan tokoh Islam Tingkatan 5.","answerTokens":["Kesepaduan","ilmu","naqli","dan","aqli","serta","ketinggian","akhlak","melahirkan","tokoh","terbilang"],"distractors":["khurafat","pecah belah","lalai"],"explanation":"Gabungan pegangan wahyu (naqli), kepakaran moden (aqli) dan ketinggian akhlak menjadi resipi lahirnya tokoh pemangkin tamadun ummah.","voiceIdKey":"u5-s3","voiceToneLabel":"Mentor Bos","voiceCaption":"Susun rumusan akhir mengenai resipi kehebatan tokoh Islam sepanjang zaman.","voiceScript":"[warmly] Rangkaikan rumusan penutup mengenai kesepaduan ilmu naqli, ilmu aqli dan ketinggian akhlak yang melahirkan tokoh unggul."},{"id":"u5-s4","type":"mcq","xp":25,"prompt":"Soalan Bos Penutup T5: Manakah pernyataan yang 100% BENAR bagi Bab 6 Pendidikan Islam Tingkatan 5?","options":["Salahuddin membebaskan Baitul Maqdis dengan akidah ASWJ, Hassan al-Banna menulis al-Ma'thurat, dan Prof. Ahmad Ibrahim memartabatkan Mahkamah Syariah.","Hassan al-Banna ialah graduan University of Cambridge yang menggubal Enakmen Undang-undang Islam Kelantan.","Prof. Ahmad Ibrahim dilahirkan di Tikrit, Iraq pada tahun 532H dan mengasaskan Kerajaan al-Ayyubiyah.","Salahuddin al-Ayyubi menubuhkan gerakan Ikhwanul Muslimin di bandar Ismailiyah pada tahun 1928M."],"correctIndex":0,"explanation":"Pilihan A merangkumi dengan tepat ketiga-tiga tokoh DSKP 5.15. Pilihan B, C dan D sengaja menukar tempat lahir, universiti serta sumbangan antara tokoh.","voiceIdKey":"u5-s4","voiceToneLabel":"Mentor Bos","voiceCaption":"Pilih kenyataan penutup 100 peratus benar bagi menamatkan Pendidikan Islam Tingkatan 5.","voiceScript":"[excited] Soalan Bos terakhir Pendidikan Islam Tingkatan Lima! Sahkan fakta tepat bagi Salahuddin, Hassan al-Banna dan Profesor Ahmad Ibrahim untuk meraih piala kemenangan!"}]}]};</script>

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;

              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}
