/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.step-heading { font-family: var(--font-heading); font-size: clamp(1.15rem, 1rem + 0.6vw, 1.4rem); color: var(--brand-navy); margin: 0; line-height: 1.3; }
.step-summary { margin: 0; font-size: 0.96rem; color: var(--text-secondary); line-height: 1.6; }

.concept-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.concept-bullets li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.bullet-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.step-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.step-top-row--right { justify-content: flex-end; }
.step-acronym-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #312e81 0%, #2563eb 100%);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.acro-kicker { font-size: 0.65rem; opacity: 0.85; letter-spacing: 0.05em; }
.acro-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.35);
  font-size: 0.72rem;
  font-weight: 900;
}
.acro-dot { opacity: 0.6; font-size: 0.7rem; }

.nota-hook-ribbon {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  border-radius: 13px;
  background: linear-gradient(90deg, #fef3c7 0%, #ffedd5 100%);
  border: 1.5px solid #fbbf24;
  color: #78350f;
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.4;
  box-shadow: 0 3px 10px rgba(245, 158, 11, 0.14);
}
@keyframes bulbGlowPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.55); transform: scale(1); }
  50% { box-shadow: 0 0 16px rgba(234, 88, 12, 0.82); transform: scale(1.06); }
}
.hook-bulb-badge {
  flex: 0 0 30px;
  height: 30px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
  color: #ffffff;
  animation: bulbGlowPulse 2.4s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .hook-bulb-badge { animation: none; }
}
.hook-copy { flex: 1; }
.mindmap-shell {
  border-radius: 16px;
  border: 2px solid #c7d2fe;
  background: linear-gradient(180deg, #ffffff 0%, #f5f3ff 100%);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mm-node-grp { cursor: pointer; outline: none; }
.mm-node-grp:hover rect { filter: brightness(0.97); }
.mm-node-grp:focus-visible rect { stroke-width: 3.5; }
.mm-flash-pill {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #ffffff;
  border: 1.5px solid #93c5fd;
  font-size: 0.86rem;
  font-weight: 600;
  line-height: 1.45;
  color: var(--brand-navy);
}
.mm-flash-pill.is-hint { border-style: dashed; border-color: #a5b4fc; color: #4338ca; background: #eef2ff; }
.mm-flash-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: #1e3a8a;
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 1px;
}
.nota-deep-drawer {
  border-radius: 12px;
  border: 1.5px solid var(--border-subtle);
  background: var(--surface-page);
  padding: 8px 12px;
}
.nota-deep-drawer summary {
  cursor: pointer;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  list-style: none;
}
.nota-deep-drawer summary::-webkit-details-marker { display: none; }
.nota-deep-drawer summary::after { content: " +"; color: var(--brand-primary); font-weight: 800; }
.nota-deep-drawer[open] summary::after { content: " -"; }
.nota-deep-body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

.story-deck-box {
  border-radius: 16px;
  border: 2px solid #bfdbfe;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.story-deck-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.story-deck-title { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-heading); font-size: 0.8rem; font-weight: 800; color: var(--brand-primary); }
.story-mode-btn {
  min-height: 32px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1.5px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}
.story-mode-btn:hover { border-color: var(--brand-border); color: var(--brand-primary); }
.story-card-active {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 13px;
  background: #eff6ff;
  border: 1.5px solid #93c5fd;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
}
.story-num-badge {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--brand-accent);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.story-card-text { margin: 0; font-size: 0.93rem; line-height: 1.55; color: var(--brand-navy); font-weight: 600; }
.story-deck-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.story-dots-row { display: flex; align-items: center; gap: 6px; }
.story-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  border: 0;
  padding: 0;
  background: #cbd5e1;
  cursor: pointer;
  transition: width 0.18s ease, background-color 0.18s ease;
}
.story-dot.is-seen { background: #93c5fd; }
.story-dot.is-active { width: 24px; background: var(--brand-accent); }
.story-nav-btn {
  min-height: 36px;
  padding: 6px 14px;
  border-radius: 10px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 3px;
  background: var(--surface-card);
  color: var(--text-secondary);
  font-family: var(--font-heading);
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
}
.story-nav-btn.is-primary { background: var(--brand-accent); border-color: #1d4ed8; color: #ffffff; }
.story-nav-btn:disabled { opacity: 0.42; cursor: default; }

.concept-formula-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 12px 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  border: 2px solid #3b82f6;
  color: #f8fafc;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
  box-shadow: 0 6px 16px rgba(30, 58, 138, 0.18);
}
.formula-kicker {
  font-family: var(--font-heading);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #93c5fd;
  background: rgba(255, 255, 255, 0.1);
  padding: 2px 8px;
  border-radius: 999px;
}
.concept-exam-tip {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--grade-gold-soft);
  border: 1px solid #fde68a;
  color: #92400e;
  font-size: 0.88rem;
  line-height: 1.5;
}
.step-actions-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.step-prev-btn { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; }
.step-footer-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-next-revisit-btn, .step-skip-btn { display: inline-flex; align-items: center; gap: 6px; }

@keyframes nodePulseRing { 0% { transform: scale(0.95); opacity: 0.55; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes floatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fadeSlideIn { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }

.skill-path-trail > .path-node-row,
.concept-bullets > li {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.32s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .skill-path-trail > .path-node-row,
  .concept-bullets > li {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .skill-path-trail > .path-node-row,
  .concept-bullets > li,
  .lesson-view {
    animation: none;
  }
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation: none !important;
  }
}

@media (max-width: 520px) {
  .path-node-row.offset-left { transform: translateX(-24px); }
  .path-node-row.offset-right { transform: translateX(24px); }
  .step-card { padding: 16px; border-radius: 16px; }
  .step-actions-footer { flex-wrap: wrap; }
  .step-actions-footer .btn-3d { width: auto; justify-content: center; }
  .step-actions-footer .step-prev-btn { flex: 0 0 auto; }
  .step-footer-right { flex: 1 1 auto; justify-content: flex-end; }
}

/* === Webflow Interactive Edition: Saavo Obsidian Bento Hero & Numbered Unit Badges === */
.wf-obsidian-hero {
  position: relative;
  overflow: hidden;
  background: transparent;
  color: #f8fafc;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;

}
.wf-spectrum-bar {

  top: 0;
  left: 0;
  right: 0;

}
.wf-spectrum-bar span:nth-child(1) { background: #ec4899; }
.wf-spectrum-bar span:nth-child(2) { background: #8b5cf6; }

.wf-hero-top-row {

}
.wf-dark-tag {
  display: inline-flex;
  align-items: center;

  border-radius: 999px;

.wf-live-dot {

@media (prefers-reduced-motion: reduce) {

.wf-hero-title {

  line-height: 1.22;

}
.wf-hero-accent {
  background: linear-gradient(90deg, #f472b6 0%, #34d399 100%);

.wf-hero-sub { margin: 0; font-size: 0.92rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.wf-bento-metrics {

.wf-track { background: rgba(255, 255, 255, 0.24); height: 9px; }
.wf-fill { background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 30%, #10b981 65%, #f59e0b 100%); }

.node-label-card.is-wf-card { position: relative; padding-right: 18px; }
.wf-unit-tick {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab03","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":3,"title":"Prinsip Keadilan dan Keprihatinan dalam Membuat Keputusan","subtitle":"Bidang 5 Unit 3 — Prinsip Keadilan vs Prinsip Keprihatinan, Kepentingan, 4 Strategi Penyelesaian Konflik & Dilema Moral","estimatedMinutes":30,"themeAccent":"#1d4ed8","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab03-labs.js","coverIcon":"../assets/icons/pm43-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Pertimbangan prinsip keadilan dan keprihatinan kamu sangat seimbang.","combo":"[excited] Hebat! Jawapan berurutan membuktikan kemahiran menaakul dilema moral.","encourage":"[gentle] Cuba teliti semula empat langkah strategi penyelesaian konflik dan perbezaan antara keadilan dengan keprihatinan.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit tiga Prinsip Keadilan dan Keprihatinan!"},"units":[{"id":"pm43-u1","title":"Unit 1: Prinsip Keadilan & Prinsip Keprihatinan","subtitle":"SP 5.3.1 & 5.3.2 — Maksud dan Contoh Prinsip Keadilan (Kesaksamaan) vs Prinsip Keprihatinan (Kemanusiaan)","iconType":"scale","iconUrl":"../assets/icons/pm43-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Prinsip Keadilan vs Prinsip Keprihatinan","voiceCaption":"Prinsip keadilan menegakkan kesaksamaan tanpa berat sebelah, manakala prinsip keprihatinan mempertimbangkan kebajikan dan kemanusiaan terhadap orang lain.","voiceScript":"[warm] Selamat datang ke Unit tiga: Prinsip Keadilan dan Keprihatinan dalam Membuat Keputusan! Lima nilai cadangan unit ini ialah Rasional, Kasih Sayang, Baik Hati, Kejujuran dan Keberanian. Dalam menyelesaikan sebarang isu moral, terdapat dua prinsip utama! Pertama, PRINSIP KEADILAN bermaksud sikap dan tingkah laku untuk menegakkan kesaksamaan dengan keseimbangan dalam pemikiran, pertuturan, perasaan dan perlakuan — ia digunakan sebagai nilai asas dilema moral. Lima contohnya ialah tidak berat sebelah dalam pemilihan atau hukuman, layanan sama rata tanpa mengira status sosial, menghormati hak individu seperti kemudahan Orang Kurang Upaya O.K.U., adil mengagihkan bantuan kepada mangsa bencana, serta bersikap rasional menganalisis situasi! Kedua, PRINSIP KEPRIHATINAN bermaksud perlakuan yang memberi pertimbangan moral dengan mengambil kira kepentingan orang lain — biasanya digunakan sebagai ukuran dalam situasi berperikemanusiaan! Lima contohnya ialah berperikemanusiaan terhadap mangsa bencana, menjaga kebajikan orang lain melebihi kepentingan diri melalui kesukarelawanan, pemurah, kasih sayang terhadap flora fauna, dan kepedulian menyelamatkan haiwan yang dianiaya!","title":"5.3.1 & 5.3.2 Prinsip Keadilan dan Prinsip Keprihatinan","acronym":"K•K•R","hook":"Bandingkan kedua-dua prinsip serta contohnya dalam makmal interaktif di bawah!","mediaKey":"pm43_prinsip_keadilan","summary":"Prinsip Keadilan = tegak kesaksamaan, tidak berat sebelah, layanan sama rata, hormati hak OKU, adil & rasional. Prinsip Keprihatinan = pertimbangan kebajikan orang lain, simpati, kesukarelawanan, pemurah, kasih sayang & kepedulian.","bullets":["Prinsip Keadilan (Asas Dilema Moral): Tidak berat sebelah (calon/hukuman); layanan sama rata tanpa mengira status; menghormati hak individu (kemudahan OKU); adil mengagih sumbangan; bersikap rasional menganalisis situasi.","Prinsip Keprihatinan (Situasi Kemanusiaan): Berperikemanusiaan terhadap mangsa bencana; menjaga kebajikan melebihi diri sendiri; pemurah; kasih sayang sesama insan serta flora fauna; kepedulian menyelamatkan haiwan teraniaya.","Nilai Cadangan KSSM: Rasional, Kasih sayang, Baik hati, Kejujuran dan Keberanian."],"labId":"pm43_keadilan_keprihatinan_lab","labTitle":"Makmal Perbandingan Keadilan & Keprihatinan","labProps":{"tab":"keadilan"},"examTip":"Bezakan dengan jelas dalam peperiksaan: Prinsip KEADILAN merujuk kesaksamaan, peraturan dan hak individu; Prinsip KEPRIHATINAN merujuk empati, kebajikan dan kemanusiaan."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Contoh Prinsip Keadilan vs Keprihatinan","voiceCaption":"Kelaskan enam situasi keputusan moral berikut antara Prinsip Keadilan dengan Prinsip Keprihatinan.","voiceScript":"[confident] Kelaskan keenam-enam perlakuan berikut antara Prinsip Keadilan dengan Prinsip Keprihatinan!","prompt":"Isihkan contoh perlakuan berikut mengikut prinsip moralnya:","buckets":[{"id":"adil","label":"Prinsip Keadilan"},{"id":"prihatin","label":"Prinsip Keprihatinan"}],"items":[{"text":"Panel penilai memilih calon anugerah murid cemerlang tanpa sikap pilih kasih","bucketId":"adil","note":"Tepat! Bersikap tidak berat sebelah dalam pemilihan calon."},{"text":"Menyediakan laluan khas dan tandas mesra Orang Kurang Upaya (OKU)","bucketId":"adil","note":"Betul! Menghormati hak individu mengikut kesaksamaan."},{"text":"Meluangkan masa hujung minggu sebagai sukarelawan membantu mangsa banjir","bucketId":"prihatin","note":"Tepat! Menjaga kebajikan orang lain melebihi kepentingan diri."},{"text":"Menyelamatkan dan merawat kucing jalanan yang sakit atau dianiaya","bucketId":"prihatin","note":"Betul! Menunjukkan sikap kepedulian dan Akta Kebajikan Haiwan 2015."},{"text":"Memberikan layanan sama rata kepada pelanggan tanpa mengira taraf sosioekonomi","bucketId":"adil","note":"Tepat! Layanan saksama tanpa mengira status."},{"text":"Memberikan sumbangan kewangan secara ikhlas kepada keluarga miskin yang ditimpa kebakaran","bucketId":"prihatin","note":"Betul! Sikap pemurah dan berperikemanusiaan."}],"explanation":"Prinsip keadilan menekankan hak dan kesaksamaan saksama; prinsip keprihatinan menekankan belas kasihan dan kebajikan."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Ciri Prinsip Moral","voiceCaption":"Padankan lima ciri prinsip keadilan dan keprihatinan berikut dengan contoh pelaksanaannya.","voiceScript":"[confident] Padankan setiap ciri prinsip moral berikut dengan contoh pelaksanaannya!","prompt":"Padankan ciri prinsip moral berikut dengan contohnya:","pairs":[{"id":"pm43u1m1","left":"Tidak berat sebelah","right":"Pemberian ganjaran atau hukuman mengikut peraturan tanpa mengira rakan"},{"id":"pm43u1m2","left":"Menghormati hak individu","right":"Menjaga kemudahan OKU dan golongan kurang bernasib baik"},{"id":"pm43u1m3","left":"Berperikemanusiaan","right":"Simpati terhadap mangsa bencana alam dan mengutamakan keperluan mereka"},{"id":"pm43u1m4","left":"Kepedulian terhadap haiwan","right":"Membantu haiwan teraniaya selaras Akta Kebajikan Haiwan 2015"},{"id":"pm43u1m5","left":"Bersikap rasional","right":"Menganalisis situasi dan membuat pertimbangan moral berasaskan bukti"}],"explanation":"Kedua-dua prinsip saling melengkapi dalam membina keputusan beretika."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Definisi Prinsip Keprihatinan","voiceCaption":"Pilih pernyataan tepat yang membezakan prinsip keprihatinan dalam membuat keputusan.","voiceScript":"[excited] Uji perbezaan asas antara prinsip keprihatinan dengan prinsip keadilan!","prompt":"Bilakah prinsip keprihatinan lazimnya digunakan sebagai asas ukuran utama dalam membuat keputusan moral?","options":["Dalam situasi yang melibatkan aspek berperikemanusiaan, empati dan kebajikan golongan yang memerlukan","Hanya apabila mahu mengira markah peperiksaan secara matematik","Apabila ingin mengutamakan kepentingan diri sendiri melebihi mangsa bencana","Apabila seseorang hendak mengelak daripada mematuhi undang-undang tanpa alasan"],"correctIndex":0,"explanation":"Prinsip keprihatinan menjadi teras dalam situasi kemanusiaan dan menjaga kebajikan orang lain."}]},{"id":"pm43-u2","title":"Unit 2: Kepentingan & 4 Strategi Penyelesaian Konflik","subtitle":"SP 5.3.3 & 5.3.4 — Kepentingan Keadilan & Keprihatinan serta 4 Langkah Strategi Konflik (Kes Charles)","iconType":"book","iconUrl":"../assets/icons/pm43-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kepentingan & 4 Strategi Penyelesaian Konflik","voiceCaption":"Keputusan berasaskan keadilan dan keprihatinan membela golongan tertindas dan menjamin keamanan melalui empat langkah strategi penyelesaian konflik.","voiceScript":"[warm] Selamat datang ke Unit dua! Mengapakah kita perlu membuat keputusan menggunakan kedua-dua prinsip ini? Kepentingan prinsip keadilan ialah tidak menjejaskan kepentingan orang lain, menjaga hak kemanusiaan sejagat, mengelakkan perselisihan faham serta membela nasib golongan tertindas! Kepentingan prinsip keprihatinan pula ialah mengelakkan diri daripada menjadi mangsa keadaan, menjamin keamanan masyarakat dan memastikan semua lapisan mendapat keprihatinan sewajarnya! Apabila berdepan konflik di mana keadilan dan keprihatinan bertindih — seperti kes Charles, atlet sekolah berbakat yang digantung disiplin tetapi merayu menyertai acara larian dan berjanji berubah — gunakan empat langkah strategi: satu, mengenal pasti konflik; dua, membuat pertimbangan moral antara kedua-dua prinsip; tiga, membuat keputusan memilih prinsip keadilan atau keprihatinan seperti kebenaran bersyarat; dan empat, memberi justifikasi kewajaran keputusan tersebut!","title":"5.3.3 & 5.3.4 Kepentingan Prinsip dan 4 Strategi Penyelesaian Konflik","acronym":"K•P•K•J","hook":"Ikuti langkah demi langkah kes Charles & kes kecemasan hospital pada simulator di bawah!","mediaKey":"pm43_dilema_moral","summary":"Kepentingan: bela tertindas, jaga hak sejagat, elak perselisihan, elak jadi mangsa keadaan & jamin keharmonian. 4 Strategi Konflik: (1) Kenal pasti konflik, (2) Pertimbangan moral, (3) Pemilihan prinsip, (4) Justifikasi kewajaran.","bullets":["Kepentingan Keadilan (SP 5.3.3): Tidak menjejaskan kepentingan orang lain, menjaga hak kemanusiaan sejagat, mengelak perselisihan faham dan membela nasib golongan tertindas.","Kepentingan Keprihatinan (SP 5.3.3): Mengelak menjadi mangsa keadaan, menjamin keamanan dan keharmonian serta memastikan semua lapisan masyarakat terbela.","4 Strategi Penyelesaian Konflik (SP 5.3.4 — Kes Charles): (1) Kenal pasti konflik -> (2) Buat pertimbangan moral -> (3) Buat keputusan pilih prinsip -> (4) Justifikasi kewajaran keputusan."],"labId":"pm43_dilema_strategi_sim","labTitle":"Simulator 4 Strategi Penyelesaian Konflik Moral","labProps":{"kes":"charles"},"examTip":"Jika soalan meminta anda menyelesaikan dilema moral seperti Kes Charles atau Chin Meng Keong, susun jawapan mengikut 4 langkah strategi buku teks untuk markah penuh!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun 4 Langkah Strategi Penyelesaian Konflik","voiceCaption":"Susun urutan empat langkah strategi penyelesaian konflik moral antara prinsip keadilan dengan keprihatinan.","voiceScript":"[confident] Susun keempat-empat langkah strategi penyelesaian konflik moral mengikut urutan tepat buku teks!","prompt":"Susun urutan empat langkah strategi menyelesaikan konflik moral:","hint":"Langkah pertama mengenal pasti konflik...","answerTokens":["Mengenal pasti konflik atau permasalahan yang timbul,","membuat pertimbangan moral antara prinsip keadilan dengan prinsip keprihatinan,","membuat keputusan pemilihan prinsip serta memberikan justifikasi kewajaran keputusan."],"distractors":["menghukum semua pihak tanpa menyiasat punca konflik terlebih dahulu","membiarkan konflik berlarutan supaya masalah selesai dengan sendirinya"],"explanation":"Urutan tepat: Kenal pasti konflik -> Pertimbangan moral -> Pemilihan prinsip -> Justifikasi kewajaran."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Dilema Charles (Kebenaran Bersyarat)","voiceCaption":"Ramalkan keputusan paling seimbang bagi pihak pentadbir sekolah terhadap rayuan atlet Charles.","voiceScript":"[curious] Charles digantung sekolah kerana disiplin kehadiran, namun dia atlet berbakat ke peringkat kebangsaan yang sudah merayu dan berjanji berubah. Apakah pilihan terbaik pihak sekolah?","hook":"Semak tab Kes Charles pada simulator di atas!","scenario":"Charles digantung kerana masalah kehadiran tetapi mempunyai bakat sukan cemerlang dan berjanji mematuhi peraturan sekolah.","prompt":"Bagaimanakah pentadbir sekolah boleh menggabungkan prinsip keadilan dan keprihatinan secara wajar?","options":["Memberikan kebenaran bersyarat kepada Charles untuk bertanding dengan syarat dia mematuhi rekod kehadiran dan pemantauan disiplin ketat","Membatalkan semua peraturan sekolah supaya mana-mana murid bebas ponteng","Menghalang Charles daripada menyertai sukan buat seumur hidup walaupun dia sudah insaf","Menyembunyikan rekod kesalahan Charles daripada rekod disiplin sekolah"],"correctIndex":0,"proofLabId":"pm43_dilema_strategi_sim","proofState":{"kes":"charles"},"explanation":"Kebenaran bersyarat mengekalkan keadilan peraturan sekolah sambil memberi peluang kedua atas dasar keprihatinan."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Kepentingan Keprihatinan","voiceCaption":"Kenal pasti kepentingan utama prinsip keprihatinan dalam membela mangsa ketidakstabilan ekonomi.","voiceScript":"[excited] Uji sebab nasib mangsa kemiskinan atau bencana perlu dibela dengan prinsip keprihatinan!","prompt":"Mengapakah prinsip keprihatinan penting apabila berhadapan dengan masyarakat berpendapatan rendah yang menjadi mangsa ketidakstabilan ekonomi?","options":["Supaya mereka tidak terus menjadi mangsa keadaan, kebajikan mereka terbela dan keamanan masyarakat kekal terjamin","Supaya jurang antara golongan kaya dengan miskin semakin melebar","Kerana mereka tidak mempunyai hak sebagai warganegara","Supaya bantuan hanya diberikan kepada orang kenamaan sahaja"],"correctIndex":0,"explanation":"Prinsip keprihatinan mengelakkan golongan lemah terus menjadi mangsa keadaan."}]},{"id":"pm43-u3","title":"Unit 3: Dilema Moral & Prinsip Mengatasi Keadilan","subtitle":"Pengukuhan, Pengayaan & Pemulihan — Kes Pemandu Kecemasan, Florin, Chin Meng Keong, Keldai Dadah, Sumathi & Akta Haiwan 2015","iconType":"shield","iconUrl":"../assets/icons/pm43-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Analisis Kes Dilema Moral Buku Teks","voiceCaption":"Dalam situasi tertentu seperti kecemasan nyawa, prinsip keprihatinan boleh mengatasi prinsip keadilan sementara, namun kesalahan jenayah seperti mencuri atau tuntutan palsu tetap memerlukan prinsip keadilan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bilakah prinsip keprihatinan boleh mengatasi prinsip keadilan, dan bilakah prinsip keadilan wajib ditegakkan? Mari analisis kes buku teks! Dalam kes polis trafik menahan pemandu laju yang membawa ayahnya sakit tenat ke hospital, prinsip KEPRIHATINAN mengatasi prinsip keadilan sementara demi menyelamatkan nyawa dengan mengiringi pemandu ke hospital! Namun dalam kes Florin yang mencuri kasut sukan untuk anaknya, kes Sumathi yang diajak menipu tuntutan perjalanan, atau kes Jeeva pengawas yang keluar dari tapak perkhemahan jambori antarabangsa tanpa kebenaran, prinsip KEADILAN wajib ditegakkan kerana mencuri, memalsukan tuntutan dan melanggar peraturan keselamatan tidak boleh dihalalkan! Begitu juga kes Chin Meng Keong banduan seumur hidup yang melanjutkan pelajaran ke peringkat ijazah serta insaf — permohonan pengampunan boleh dipertimbangkan mengikut proses undang-undang berteraskan keprihatinan! Jangan lupa juga isu keldai dadah serta perlindungan haiwan di bawah Akta Kebajikan Haiwan dua ribu lima belas!","title":"Keutamaan Prinsip dalam Kes Dilema Moral KSSM","acronym":"D•K•H•A","hook":"Lihat perincian kes kecemasan hospital dan analisis konflik dalam makmal di bawah!","mediaKey":"pm43_prinsip_keprihatinan","summary":"Keprihatinan mengatasi keadilan dalam kecemasan nyawa (bawa ayah tenat ke hospital). Keadilan ditegakkan dalam kes mencuri kasut (Florin), tuntutan palsu (Sumathi), keluar kem tanpa izin (Jeeva) & keldai dadah. Akta Kebajikan Haiwan 2015 lindungi haiwan.","bullets":["Keprihatinan Mengatasi Keadilan: Kes pemandu laju membawa bapa sakit tenat ke hospital — nyawa didahulukan dengan bantuan iringan kecemasan ke hospital.","Keadilan Wajib Ditegakkan: Kes Florin mencuri kasut sukan, kes Sumathi menipu tuntutan perjalanan, dan kes Jeeva melanggar peraturan jambori pengawas — matlamat tidak menghalalkan perbuatan salah, bantuan kewangan wajar disalurkan secara sah.","Kes Chin Meng Keong, Keldai Dadah & Akta Kebajikan Haiwan 2015: Keinsafan banduan dan risiko penipuan beg di lapangan terbang ditangani dengan pertimbangan moral rasional serta pemeliharaan hak haiwan."],"labId":"pm43_dilema_strategi_sim","labTitle":"Analisis Kes Dilema Kecemasan vs Peraturan","labProps":{"kes":"trafik"},"examTip":"Soalan KBAT popular: Adakah wajar mencuri ubat atau kasut atas alasan kemiskinan? Jawapan tepat: TIDAK wajar — tegakkan prinsip keadilan terhadap perbuatan mencuri, namun bantu kesempitan hidupnya menggunakan prinsip keprihatinan secara sah!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Keutamaan Prinsip Situasi Buku Teks","voiceCaption":"Kelaskan enam kes dilema buku teks berikut antara Keutamaan Prinsip Keadilan dengan Keutamaan Prinsip Keprihatinan.","voiceScript":"[confident] Tentukan prinsip moral utama yang wajar menjadi asas tindakan bagi keenam-enam kes buku teks ini!","prompt":"Isihkan kes dilema berikut mengikut prinsip keutamaannya:","buckets":[{"id":"keadilan","label":"Tegakkan Prinsip Keadilan"},{"id":"keprihatinan","label":"Utamakan Prinsip Keprihatinan"}],"items":[{"text":"Sumathi menolak ajakan rakan sekerja untuk membuat tuntutan perjalanan palsu","bucketId":"keadilan","note":"Tepat! Tuntutan berlebihan ialah pecah amanah dan menindas syarikat."},{"text":"Pihak penganjur mengenakan tindakan kepada pengawas Jeeva yang keluar tapak kem tanpa izin","bucketId":"keadilan","note":"Betul! Memastikan keselamatan peserta dan pematuhan peraturan."},{"text":"Polis trafik mengiringi pemandu yang membawa bapanya sakit tenat ke hospital dahulu","bucketId":"keprihatinan","note":"Tepat! Nyawa manusia menjadi keutamaan mendesak."},{"text":"Masyarakat mengumpul bantuan kewangan dan tempat tinggal kepada mangsa kebakaran besar","bucketId":"keprihatinan","note":"Betul! Prinsip keprihatinan membantu mangsa yang kehilangan harta benda."},{"text":"Pelapor melaporkan pencurian kasut oleh Florin supaya tidak berulang sambil membantunya secara sah","bucketId":"keadilan","note":"Tepat! Perbuatan mencuri tetap salah mengikut prinsip keadilan."},{"text":"Membawa kucing jalanan yang cedera dan sakit ke klinik veterinar untuk dirawat","bucketId":"keprihatinan","note":"Betul! Selaras dengan kepedulian dan Akta Kebajikan Haiwan 2015."}],"explanation":"Keprihatinan diutamakan dalam kecemasan nyawa dan bantuan bencana, manakala keadilan ditegakkan terhadap pecah amanah, kecurian dan keselamatan peraturan."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tindakan Kes Keldai Dadah","voiceCaption":"Ramalkan akibat sekiranya seorang pesalah keldai dadah dibebaskan sewenang-wenangnya tanpa siasatan kehakiman hanya atas dasar simpati.","voiceScript":"[curious] Seorang wanita ditahan membawa beg milik orang lain yang rupa-rupanya berisi dadah di lapangan terbang. Apakah kesannya jika dia terus dibebaskan atas dasar keprihatinan tanpa siasatan undang-undang?","hook":"Fikirkan kaitan antara kedaulatan undang-undang, sindiket dadah dan prinsip keadilan!","scenario":"Seorang pelancong membawa beg kiriman individu yang baru dikenalinya tanpa memeriksa isi kandungan dan ditahan pihak kastam kerana dadah.","prompt":"Apakah kesan sekiranya dia dibebaskan serta-merta tanpa siasatan kehakiman?","options":["Sindiket pengedaran dadah akan mengambil kesempatan memperdaya lebih ramai mangsa kerana tiada tindakan undang-undang yang adil sebagai pengajaran","Keselamatan negara dan sempadan akan menjadi lebih kukuh tanpa pemeriksaan","Semua dadah berbahaya akan hilang dari pasaran antarabangsa","Tidak ada lagi orang yang mahu bekerja di luar negara"],"correctIndex":0,"proofLabId":"pm43_keadilan_keprihatinan_lab","proofState":{"tab":"keadilan"},"explanation":"Prinsip keadilan melalui perbicaraan adil menentukan sama ada seseorang benar-benar diperdaya dan mencegah eksploitasi sindiket dadah."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: Kes Florin & Sumathi","voiceCaption":"Pilih tindakan paling bermoral apabila melihat rakan sekerja atau kenalan menghadapi kesempitan wang lalu terdorong mencuri.","voiceScript":"[excited] Uji penyelesaian serentak prinsip keadilan dan keprihatinan dalam kes Florin!","prompt":"Anda melihat rakan sekerja anda, Florin, mencuri kasut sukan untuk anaknya kerana kesempitan wang. Apakah tindakan yang menggabungkan prinsip keadilan dan keprihatinan secara paling wajar?","options":["Menasihati Florin memulangkan kasut atau melaporkannya mengikut peraturan syarikat demi keadilan, kemudian membantu menyumbang wang atau mencadangkan bantuan kebajikan secara sah kepadanya","Menolong Florin menyembunyikan kasut curi di dalam begnya","Membiarkan Florin terus mencuri barang kedai setiap bulan","Memecat Florin dan menghinanya di hadapan pelanggan"],"correctIndex":0,"explanation":"Prinsip keadilan menghalang kesalahan mencuri manakala prinsip keprihatinan menghulurkan bantuan kewangan secara halal dan sah."}]},{"id":"pm43-u4","title":"Unit 4: Perasaan & Tindakan Wajar Dalam Kehidupan Harian","subtitle":"SP 5.3.5 & 5.3.6 — Kebanggaan & Kesyukuran Membuat Keputusan Bermoral, Perbicaraan Olok-Olok & Kebajikan OKU/Haiwan","iconType":"heart","iconUrl":"../assets/icons/pm43-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Perasaan & Tindakan Wajar Harian","voiceCaption":"Membuat keputusan berasaskan prinsip keadilan dan keprihatinan melahirkan perasaan bangga dan bersyukur serta melindungi kebajikan warga tua, mangsa bencana dan haiwan.","voiceScript":"[warm] Selamat datang ke Unit empat! Bagaimana perasaan anggota masyarakat apabila keputusan harian dibuat berteraskan prinsip keadilan dan keprihatinan? Mengikut buku teks, masyarakat akan berasa BANGGA, BERSYUKUR dan TENANG kerana hak setiap individu dipelihara dan golongan memerlukan mendapat pembelaan! Dalam aktiviti penilaian, perbicaraan olok-olok atau mock trial di dalam kelas melatih murid memahami peranan hakim, peguam bela, peguam cara, saksi dan polis dalam menimbang bukti dengan adil serta saksama! Dalam kehidupan harian pula, kita wajar mengamalkan kedua-dua prinsip ini — contohnya mengagihkan kerja rumah dengan adil, membantu anak kucing terbuang di pasar, dan tidak menyalahgunakan tempat letak kereta O.K.U.!","title":"5.3.5 & 5.3.6 Perasaan Bermoral, Mock Trial & Tindakan Harian","acronym":"B•B•T","hook":"Buka galeri arkib Unit 3 di bawah untuk meneliti visual prinsip keadilan dan keprihatinan!","mediaKey":"pm43_prinsip_keadilan","summary":"Perasaan (SP 5.3.5): bangga dan bersyukur kerana keadilan serta kebajikan masyarakat terpelihara. Tindakan harian (SP 5.3.6): jaga hak OKU, agih sumbangan mangsa bencana secara saksama, serta pelihara kebajikan haiwan.","bullets":["Perasaan Moral (SP 5.3.5): Berasa bangga dan bersyukur apabila keputusan yang dibuat tidak menindas mana-mana pihak serta membantu golongan berkeperluan.","Perbicaraan Olok-Olok (Mock Trial): Melatih murid menghayati proses keadilan melalui watak hakim, peguam bela, peguam cara, saksi dan polis berasaskan bukti sahih.","Tindakan Harian (SP 5.3.6): Tidak menggunakan parkir atau tandas khas OKU, melaporkan penganiayaan haiwan dan menyertai kutipan bantuan bencana."],"labId":"pm43_galeri_arkib","labTitle":"Galeri Arkib Visual Prinsip Keadilan & Keprihatinan","examTip":"Untuk soalan SP 5.3.5 tentang perasaan, gunakan perkataan 'bangga dan bersyukur' kerana tepat mengikut teks muka surat 43!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Bina Pernyataan Perasaan & Kebajikan","voiceCaption":"Susun frasa untuk melengkapkan kesan pengamalan keadilan dan keprihatinan terhadap kesejahteraan masyarakat.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan rumusan SP lima perpuluhan tiga perpuluhan lima!","prompt":"Susun frasa berikut mengenai kepentingan dan perasaan membuat keputusan adil:","hint":"Anggota masyarakat akan berasa bangga dan bersyukur...","answerTokens":["Anggota masyarakat akan berasa bangga dan bersyukur","apabila prinsip keadilan dan prinsip keprihatinan diamalkan","untuk melindungi hak serta menjaga kebajikan semua golongan yang memerlukan."],"distractors":["apabila hukuman dijatuhkan mengikut pangkat dan kekayaan seseorang","supaya haiwan peliharaan yang sakit dibiarkan tanpa rawatan"],"explanation":"Prinsip keadilan dan keprihatinan bersama-sama memelihara hak asasi serta kebajikan komuniti."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Tindakan Harian & Prinsip Moral","voiceCaption":"Padankan lima situasi harian dan peranan berikut dengan tindakan bermoral yang tepat.","voiceScript":"[confident] Padankan setiap situasi harian berikut dengan tindakan wajar mengikut prinsip keadilan atau keprihatinan!","prompt":"Padankan situasi harian berikut dengan tindakan wajarnya:","pairs":[{"id":"pm43u4m1","left":"Tempat letak kereta khas OKU","right":"Tidak memarkir kenderaan di situ bagi menghormati hak golongan OKU"},{"id":"pm43u4m2","left":"Haiwan peliharaan dijangkiti penyakit","right":"Membawa ke klinik veterinar untuk rawatan selaras Akta Kebajikan Haiwan 2015"},{"id":"pm43u4m3","left":"Mangsa kebakaran rumah","right":"Menghulurkan bantuan makanan, pakaian dan sumbangan kewangan secara ikhlas"},{"id":"pm43u4m4","left":"Perbicaraan olok-olok (Mock Trial)","right":"Menimbang hujah peguam dan keterangan saksi tanpa berat sebelah"},{"id":"pm43u4m5","left":"Agihan tugas kumpulan projek","right":"Membahagikan kerja sama rata mengikut kebolehan setiap ahli"}],"explanation":"Tindakan kecil dalam kehidupan harian mencerminkan kematangan pertimbangan moral."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Akta Kebajikan Haiwan 2015","voiceCaption":"Pilih pernyataan tepat tentang perlindungan undang-undang terhadap haiwan di Malaysia.","voiceScript":"[excited] Uji pengetahuan kamu tentang hak haiwan daripada bahagian Pengayaan buku teks!","prompt":"Apakah akta yang diketengahkan dalam Unit 3 bagi melindungi haiwan daripada perbuatan penganiayaan atau ditinggalkan tanpa rawatan?","options":["Akta Kebajikan Haiwan 2015","Akta Rahsia Rasmi 1972","Akta Bahasa Kebangsaan 1963/1967","Akta Orang Asli 1954"],"correctIndex":0,"explanation":"Buku teks muka surat 47 mengetengahkan Akta Kebajikan Haiwan 2015 untuk melindungi hak haiwan daripada penganiayaan."}]},{"id":"pm43-u5","title":"Unit 5 (Boss): Misi Hakim Moral Keadilan & Keprihatinan SPM","subtitle":"Penilaian Bersepadu Unit 3 — Perbandingan Prinsip, Kepentingan, 4 Strategi Konflik & Kes Dilema KSSM","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Padanan Master Unit 3","voiceCaption":"Padankan lima konsep dan kes utama Unit 3 daripada prinsip keadilan hingga kes Charles dan Chin Meng Keong.","voiceScript":"[excited] Cabaran Boss Unit tiga bermula! Padankan kelima-lima konsep master ini!","prompt":"Padankan konsep dan situasi Unit 3 berikut dengan tepat:","pairs":[{"id":"pm43u5m1","left":"Prinsip Keadilan","right":"Menegakkan kesaksamaan tanpa berat sebelah, layanan sama rata dan rasional"},{"id":"pm43u5m2","left":"Prinsip Keprihatinan","right":"Mengutamakan kebajikan, empati dan kemanusiaan terhadap orang lain"},{"id":"pm
