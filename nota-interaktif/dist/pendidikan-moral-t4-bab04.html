/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.step-heading { font-family: var(--font-heading); font-size: clamp(1.15rem, 1rem + 0.6vw, 1.4rem); color: var(--brand-navy); margin: 0; line-height: 1.3; }
.step-summary { margin: 0; font-size: 0.96rem; color: var(--text-secondary); line-height: 1.6; }

.concept-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.concept-bullets li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.bullet-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.step-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.step-top-row--right { justify-content: flex-end; }
.step-acronym-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #312e81 0%, #2563eb 100%);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.acro-kicker { font-size: 0.65rem; opacity: 0.85; letter-spacing: 0.05em; }
.acro-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.35);
  font-size: 0.72rem;
  font-weight: 900;
}
.acro-dot { opacity: 0.6; font-size: 0.7rem; }

.nota-hook-ribbon {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  border-radius: 13px;
  background: linear-gradient(90deg, #fef3c7 0%, #ffedd5 100%);
  border: 1.5px solid #fbbf24;
  color: #78350f;
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.4;
  box-shadow: 0 3px 10px rgba(245, 158, 11, 0.14);
}
@keyframes bulbGlowPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.55); transform: scale(1); }
  50% { box-shadow: 0 0 16px rgba(234, 88, 12, 0.82); transform: scale(1.06); }
}
.hook-bulb-badge {
  flex: 0 0 30px;
  height: 30px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
  color: #ffffff;
  animation: bulbGlowPulse 2.4s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .hook-bulb-badge { animation: none; }
}
.hook-copy { flex: 1; }
.mindmap-shell {
  border-radius: 16px;
  border: 2px solid #c7d2fe;
  background: linear-gradient(180deg, #ffffff 0%, #f5f3ff 100%);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mm-node-grp { cursor: pointer; outline: none; }
.mm-node-grp:hover rect { filter: brightness(0.97); }
.mm-node-grp:focus-visible rect { stroke-width: 3.5; }
.mm-flash-pill {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #ffffff;
  border: 1.5px solid #93c5fd;
  font-size: 0.86rem;
  font-weight: 600;
  line-height: 1.45;
  color: var(--brand-navy);
}
.mm-flash-pill.is-hint { border-style: dashed; border-color: #a5b4fc; color: #4338ca; background: #eef2ff; }
.mm-flash-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: #1e3a8a;
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 1px;
}
.nota-deep-drawer {
  border-radius: 12px;
  border: 1.5px solid var(--border-subtle);
  background: var(--surface-page);
  padding: 8px 12px;
}
.nota-deep-drawer summary {
  cursor: pointer;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  list-style: none;
}
.nota-deep-drawer summary::-webkit-details-marker { display: none; }
.nota-deep-drawer summary::after { content: " +"; color: var(--brand-primary); font-weight: 800; }
.nota-deep-drawer[open] summary::after { content: " -"; }
.nota-deep-body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

.story-deck-box {
  border-radius: 16px;
  border: 2px solid #bfdbfe;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.story-deck-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.story-deck-title { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-heading); font-size: 0.8rem; font-weight: 800; color: var(--brand-primary); }
.story-mode-btn {
  min-height: 32px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1.5px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}
.story-mode-btn:hover { border-color: var(--brand-border); color: var(--brand-primary); }
.story-card-active {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 13px;
  background: #eff6ff;
  border: 1.5px solid #93c5fd;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
}
.story-num-badge {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--brand-accent);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.story-card-text { margin: 0; font-size: 0.93rem; line-height: 1.55; color: var(--brand-navy); font-weight: 600; }
.story-deck-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.story-dots-row { display: flex; align-items: center; gap: 6px; }
.story-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  border: 0;
  padding: 0;
  background: #cbd5e1;
  cursor: pointer;
  transition: width 0.18s ease, background-color 0.18s ease;
}
.story-dot.is-seen { background: #93c5fd; }
.story-dot.is-active { width: 24px; background: var(--brand-accent); }
.story-nav-btn {
  min-height: 36px;
  padding: 6px 14px;
  border-radius: 10px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 3px;
  background: var(--surface-card);
  color: var(--text-secondary);
  font-family: var(--font-heading);
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
}
.story-nav-btn.is-primary { background: var(--brand-accent); border-color: #1d4ed8; color: #ffffff; }
.story-nav-btn:disabled { opacity: 0.42; cursor: default; }

.concept-formula-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 12px 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  border: 2px solid #3b82f6;
  color: #f8fafc;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
  box-shadow: 0 6px 16px rgba(30, 58, 138, 0.18);
}
.formula-kicker {
  font-family: var(--font-heading);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #93c5fd;
  background: rgba(255, 255, 255, 0.1);
  padding: 2px 8px;
  border-radius: 999px;
}
.concept-exam-tip {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--grade-gold-soft);
  border: 1px solid #fde68a;
  color: #92400e;
  font-size: 0.88rem;
  line-height: 1.5;
}
.step-actions-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.step-prev-btn { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; }
.step-footer-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-next-revisit-btn, .step-skip-btn { display: inline-flex; align-items: center; gap: 6px; }

@keyframes nodePulseRing { 0% { transform: scale(0.95); opacity: 0.55; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes floatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fadeSlideIn { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }

.skill-path-trail > .path-node-row,
.concept-bullets > li {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.32s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .skill-path-trail > .path-node-row,
  .concept-bullets > li {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .skill-path-trail > .path-node-row,
  .concept-bullets > li,
  .lesson-view {
    animation: none;
  }
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation: none !important;
  }
}

@media (max-width: 520px) {
  .path-node-row.offset-left { transform: translateX(-24px); }
  .path-node-row.offset-right { transform: translateX(24px); }
  .step-card { padding: 16px; border-radius: 16px; }
  .step-actions-footer { flex-wrap: wrap; }
  .step-actions-footer .btn-3d { width: auto; justify-content: center; }
  .step-actions-footer .step-prev-btn { flex: 0 0 auto; }
  .step-footer-right { flex: 1 1 auto; justify-content: flex-end; }
}

/* === Webflow Interactive Edition: Saavo Obsidian Bento Hero & Numbered Unit Badges === */
.wf-obsidian-hero {
  position: relative;
  overflow: hidden;
  background: transparent;
  color: #f8fafc;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;

}
.wf-spectrum-bar {

  top: 0;
  left: 0;
  right: 0;

}
.wf-spectrum-bar span:nth-child(1) { background: #ec4899; }
.wf-spectrum-bar span:nth-child(2) { background: #8b5cf6; }

.wf-hero-top-row {

}
.wf-dark-tag {
  display: inline-flex;
  align-items: center;

  border-radius: 999px;

.wf-live-dot {

@media (prefers-reduced-motion: reduce) {

.wf-hero-title {

  line-height: 1.22;

}
.wf-hero-accent {
  background: linear-gradient(90deg, #f472b6 0%, #34d399 100%);

.wf-hero-sub { margin: 0; font-size: 0.92rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.wf-bento-metrics {

.wf-track { background: rgba(255, 255, 255, 0.24); height: 9px; }
.wf-fill { background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 30%, #10b981 65%, #f59e0b 100%); }

.node-label-card.is-wf-card { position: relative; padding-right: 18px; }
.wf-unit-tick {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab04","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":4,"title":"Penggunaan Teknologi Maklumat dan Komunikasi Secara Beretika","subtitle":"Bidang 5 Unit 4 — 6 Etika TMK, Kepentingan, E-Mel & Pengiklanan, Kesan Pengabaian, Buli Siber, Phishing & Hak Cipta MyIPO","estimatedMinutes":30,"themeAccent":"#0284c7","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab04-labs.js","coverIcon":"../assets/icons/pm44-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat sekali! Etika digital dan keselamatan siber kamu sangat mantap.","combo":"[excited] Hebat! Jawapan berterusan menunjukkan penguasaan penuh etika TMK.","encourage":"[gentle] Cuba teliti semula langkah pencegahan penipuan dalam talian dan hak cipta MyIPO.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit empat Penggunaan TMK Secara Beretika!"},"units":[{"id":"pm44-u1","title":"Unit 1: Etika & Kepentingan Penggunaan TMK","subtitle":"SP 5.4.1 & 5.4.2 — 6 Etika TMK serta 6 Kepentingan dalam Pendidikan, Ekonomi, Perkhidmatan & Hubungan Sosial","iconType":"globe","iconUrl":"../assets/icons/pm44-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"6 Etika & 6 Kepentingan TMK","voiceCaption":"Penggunaan TMK beretika mematuhi enam etika termasuk tidak menyebar berita palsu serta membawa enam kepentingan dalam pendidikan, ekonomi dan hubungan sosial.","voiceScript":"[warm] Selamat datang ke Unit empat: Penggunaan Teknologi Maklumat dan Komunikasi Secara Beretika! Lima nilai cadangan unit ini ialah Rasional, Kebebasan, Harga Diri, Kesederhanaan dan Kerajinan. Teknologi maklumat dan komunikasi atau T.M.K. membolehkan pengumpulan, pengurusan dan penyampaian maklumat pelbagai bentuk. Enam etika T.M.K. ialah: tidak memuat naik bahan tanpa izin pemilik sah, berkomunikasi secara berhemah dalam talian, tidak menyebar maklumat palsu yang menggugat ketenteraman awam, berintegriti memberi maklumat betul, tidak menceroboh atau menyebar virus, serta tidak mengeksploitasi data peribadi pihak lain! Terdapat enam kepentingan utama T.M.K. beretika: meningkatkan kualiti pendidikan berinovasi seperti permohonan lepasan S.P.M. ke universiti, mempelbagaikan perkhidmatan dalam talian tanpa bersesak di kaunter, meningkatkan hubungan sosial seluruh dunia, menjana ekonomi e-dagang, memudahkan perkongsian maklumat penyelidikan, dan menjimatkan kos serta masa melalui mesyuarat telesidang!","title":"5.4.1 & 5.4.2 Etika dan Kepentingan TMK Secara Beretika","acronym":"E•P•S•T","hook":"Tonton video penerangan bersuara tentang etika digital, kemudian klik kedua-dua tab dalam Makmal Etika TMK di bawah!","mediaKey":"pm44_etika_tmk","videoClip":{"src":"../assets/pendidikan-moral-t4-bab04/video/pm44_video_etika_tmk_narasi.mp4","hasNarration":true,"posterKey":"pm44_etika_tmk","caption":"Video Penerangan Bersuara (BM): Etika komunikasi digital, semakan kesahihan maklumat dan pencegahan buli siber"},"summary":"6 Etika TMK: tiada muat naik tanpa izin, komunikasi berhemah, tolak berita palsu, berintegriti, tiada virus/pencerobohan, tidak eksploitasi data peribadi. 6 Kepentingan: pendidikan, perkhidmatan dalam talian, sosial, ekonomi, perkongsian ilmu, penjimatan kos telesidang.","bullets":["6 Etika Penggunaan TMK (SP 5.4.1): (1) Izin pemilik sah sebelum muat naik, (2) Berkomunikasi berhemah, (3) Elak berita palsu, (4) Berintegriti memberi data sahih, (5) Tiada pencerobohan/virus, (6) Tidak eksploitasi data peribadi.","6 Kepentingan TMK Beretika (SP 5.4.2): Kualiti pendidikan (permohonan lepasan SPM/STPM), perkhidmatan dalam talian, jaringan sosial, penjana ekonomi e-dagang, perkongsian maklumat penyelidikan, serta jimat kos pengangkutan melalui telesidang.","Nilai Cadangan KSSM: Rasional, Kebebasan, Harga diri, Kesederhanaan dan Kerajinan."],"labId":"pm44_etika_tmk_lab","labTitle":"Makmal 6 Etika & Kepentingan TMK","labProps":{"tab":"etika"},"examTip":"Untuk soalan SP 5.4.2 kepentingan TMK (4 markah), gabungkan aspek pendidikan, ekonomi e-dagang, perkhidmatan kaunter dalam talian dan penjimatan kos telesidang."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Etika TMK vs Perbuatan Tidak Beretika","voiceCaption":"Kelaskan enam tindakan digital berikut antara Penggunaan TMK Beretika dengan Penggunaan Tidak Beretika.","voiceScript":"[confident] Kelaskan keenam-enam tindakan dalam talian ini mengikut etika T.M.K.!","prompt":"Isihkan tindakan pengguna TMK berikut:","buckets":[{"id":"etika","label":"Penggunaan TMK Beretika"},{"id":"langgar","label":"Melanggar Etika TMK"}],"items":[{"text":"Menyemak kesahihan maklumat sebelum berkongsi dalam kumpulan sembang keluarga","bucketId":"etika","note":"Tepat! Menghalang penularan maklumat palsu."},{"text":"Mengadakan mesyuarat pasukan secara telesidang bagi menjimatkan kos pengangkutan","bucketId":"etika","note":"Betul! Manfaat TMK untuk kecekapan kerja."},{"text":"Memuat naik karya digital milik pihak lain tanpa kebenaran bertulis","bucketId":"langgar","note":"Tepat! Melanggar hak pemilik yang sah."},{"text":"Menyebarkan pautan mengandungi perisian hasad virus untuk melumpuhkan komputer sekolah","bucketId":"langgar","note":"Betul! Pencerobohan siber yang merosakkan sistem."},{"text":"Menulis komen dengan bahasa sopan dan membina di forum pembelajaran","bucketId":"etika","note":"Tepat! Berkomunikasi secara berhemah dalam talian."},{"text":"Menjual data nombor kad pengenalan pelanggan kepada pihak ketiga","bucketId":"langgar","note":"Betul! Mengeksploitasi data peribadi orang lain."}],"explanation":"Etika TMK melindungi keselamatan sistem, privasi pengguna serta kebenaran maklumat."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Bidang Manfaat TMK","voiceCaption":"Padankan lima bidang manfaat TMK berikut dengan contoh aplikasinya dalam buku teks.","voiceScript":"[confident] Padankan setiap manfaat penggunaan T.M.K. beretika ini dengan contoh tepatnya!","prompt":"Padankan manfaat TMK berikut dengan contohnya:","pairs":[{"id":"pm44u1m1","left":"Meningkatkan kualiti pendidikan","right":"Permohonan melanjutkan pelajaran lepasan SPM/STPM ke IPT secara dalam talian"},{"id":"pm44u1m2","left":"Mempelbagaikan perkhidmatan","right":"Transaksi bil dan perbankan dalam talian tanpa perlu bersesak di kaunter"},{"id":"pm44u1m3","left":"Menjanakan ekonomi","right":"Promosi serta jual beli barangan e-dagang secara meluas dan jujur"},{"id":"pm44u1m4","left":"Menjimatkan kos & masa","right":"Mengadakan perbincangan secara telesidang bagi mengurangkan kos perjalanan"},{"id":"pm44u1m5","left":"Perkongsian maklumat","right":"Penyelidikan serta pembelajaran menjadi lebih sistematik dengan rujukan sahih"}],"explanation":"Kelima-lima manfaat ini hanya terjamin apabila teknologi digunakan secara beretika."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Batas Kebebasan TMK","voiceCaption":"Kenal pasti pernyataan tepat mengenai batasan kebebasan dalam menggunakan kemudahan TMK.","voiceScript":"[excited] Uji pemahaman kamu tentang batas kebebasan dan sikap sederhana dalam penggunaan T.M.K.!","prompt":"Mengapakah kebebasan dalam penggunaan teknologi maklumat dan komunikasi tetap mempunyai batas etika tertentu?","options":["Bagi mengelakkan jenayah siber, penyebaran fitnah dan pencerobohan hak serta keselamatan orang lain","Supaya tiada sesiapa pun dibenarkan menggunakan Internet untuk belajar","Kerana telesidang memerlukan kos penerbangan antarabangsa","Supaya pengiklanan boleh memburukkan produk pesaing secara bebas"],"correctIndex":0,"explanation":"Kebebasan digital mesti disertai nilai rasional dan kesederhanaan agar tidak memudaratkan masyarakat."}]},{"id":"pm44-u2","title":"Unit 2: Cara Penggunaan Beretika & Kesan Pengabaian","subtitle":"SP 5.4.3 & 5.4.4 — E-Mel, Pengiklanan & Muat Naik Berlesen vs 5 Kesan Pengabaian (Phishing, Buli Siber, Virus & Ketagihan)","iconType":"shield","iconUrl":"../assets/icons/pm44-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Amalan E-Mel/Pengiklanan & Kesan Pengabaian","voiceCaption":"Pengguna beretika merahsiakan kata laluan e-mel, mengiklan dengan jujur serta mengelak perisian tidak berlesen bagi mencegah risiko penggodaman dan ketagihan.","voiceScript":"[warm] Selamat datang ke Unit dua! Mari kita lihat tiga cara penggunaan T.M.K. secara beretika: pertama, Akaun E-mel — rahsiakan nama pengguna serta kata laluan dan tidak memalsukan maklumat diri; kedua, Pengiklanan — mempromosikan barang yang sah, berintegriti agar pengguna tidak tertipu serta bersaing sihat tanpa memburukkan produk pesaing; dan ketiga, Muat Turun dan Muat Naik — mendapatkan izin pemilik sah, menjauhi bahan negatif serta menolak perisian tidak berlesen! Apabila etika ini diabaikan, timbullah lima kesan buruk: ketidaktepatan maklumat yang mengaibkan orang, isu keselamatan seperti pancingan data atau phishing dan buli siber, serangan virus yang melumpuhkan sistem komputer, pendedahan kepada bahan negatif, serta ketagihan gajet yang membazirkan masa dan menjejaskan masa berkualiti bersama keluarga!","title":"5.4.3 & 5.4.4 Amalan Harian TMK dan 5 Kesan Pengabaian","acronym":"K•I•S•B•K","hook":"Periksa simulasi kes Kelvin (e-mel bank palsu) dan ancaman siber pada makmal di bawah!","mediaKey":"pm44_komunikasi_hemah","summary":"3 Amalan (SP 5.4.3): E-mel (rahsiakan kata laluan), Pengiklanan (jujur & saing sihat), Muat turun/naik (berlesen & berizin). 5 Kesan Pengabaian (SP 5.4.4): Ketidaktepatan maklumat, Isu keselamatan (godam/buli siber), Serangan virus, Bahan negatif, Ketagihan.","bullets":["3 Contoh Penggunaan Beretika (SP 5.4.3): Akaun e-mel (rahsiakan kata laluan & identiti benar); Pengiklanan (sah, jujur, tidak burukkan pesaing); Muat turun/naik (izin pemilik, elak perisian cetak rompak).","5 Kesan Pengabaian TMK (SP 5.4.4): (1) Ketidaktepatan maklumat/fitnah, (2) Isu keselamatan (data digodam & buli siber), (3) Serangan virus melumpuhkan organisasi, (4) Bahan negatif dorong gejala sosial, (5) Ketagihan mengurangkan masa berkualiti keluarga.","Kes Buku Teks: SMS hadiah RM50,000, gangguan lucah pelanggan kepada Olivia, e-mel phishing bank kepada Kelvin, dan penipuan belian dalam talian."],"labId":"pm44_siber_hakcipta_sim","labTitle":"Simulator Keselamatan Siber & Phishing","labProps":{"mode":"phishing"},"examTip":"Dalam soalan kes Kelvin (e-mel menyerupai bank) atau pembelian dalam talian, sebut langkah semakan rasmi dengan bank/polis serta mengelak klik pautan mencurigakan."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kesan Mengklik E-Mel Phishing Bank","voiceCaption":"Ramalkan tindakan selamat apabila menerima e-mel mendakwa dari pihak bank meminta kemas kini kata laluan akaun.","voiceScript":"[curious] Kelvin menerima e-mel menyerupai laman sesawang bank meminta mengemas kini maklumat akaun lalu wang keluar tanpa pengetahuannya. Apakah tindakan bijak sebelum itu?","hook":"Semak tab Ancaman Phishing pada simulator di atas!","scenario":"Anda menerima e-mel dan SMS mendakwa anda memenangi RM50,000 serta meminta nombor akaun dan kata laluan perbankan dalam talian.","prompt":"Apakah tindakan beretika dan selamat yang wajar anda ambil?","options":["Mengabaikan pautan tersebut, menyekat pengirim dan menghubungi nombor rasmi pihak bank atau pihak berkuasa untuk pengesahan","Memasukkan semua kata laluan dan nombor PIN dengan segera supaya tidak terlepas hadiah","Mengirimkan mesej penipuan itu kepada seluruh kumpulan WhatsApp sekolah","Memadam aplikasi keselamatan telefon pintar agar pautan terbuka lebih cepat"],"correctIndex":0,"proofLabId":"pm44_siber_hakcipta_sim","proofState":{"mode":"phishing"},"explanation":"Langkah merahsiakan kata laluan dan menyemak maklumat secara rasional melindungi pengguna daripada pancingan data (phishing)."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Etika Pengiklanan & Muat Turun","voiceCaption":"Susun frasa untuk membina amalan pengiklanan dan muat turun TMK yang beretika.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan panduan pengiklanan serta muat naik digital!","prompt":"Susun frasa untuk menyatakan amalan pengiklanan dan muat naik beretika:","hint":"Pengiklanan dalam talian hendaklah dijalankan secara jujur...","answerTokens":["Pengiklanan dalam talian hendaklah dijalankan secara jujur dan bersaing sihat","tanpa memburukkan barangan pesaing,","serta mendapatkan kebenaran sah sebelum memuat naik atau memuat turun sebarang perisian."],"distractors":["dengan menggunakan perisian cetak rompak dan menyebar maklumat sulit","bagi menipu pelanggan melalui promosi palsu tanpa penghantaran barang"],"explanation":"Integriti pengiklanan dan pematuhan lesen perisian melindungi hak pengguna serta pemilik karya."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Kesan Ketagihan Digital","voiceCaption":"Pilih kesan negatif ketagihan penggunaan gajet terhadap keluarga dan tugas harian.","voiceScript":"[excited] Uji pengenalpastian impak ketagihan T.M.K. mengikut buku teks!","prompt":"Manakah kesan utama pengabaian etika kesederhanaan apabila seseorang mengalami ketagihan penggunaan TMK?","options":["Membazirkan masa, mengganggu tugas harian serta menjejaskan masa berkualiti bersama-sama keluarga","Meningkatkan produktiviti kerja sekolah dan mengurangkan keletihan mata","Melindungi sistem komputer daripada sebarang serangan virus","Menghapuskan kejadian buli siber di sekolah"],"correctIndex":0,"explanation":"Ketagihan penggunaan menjejaskan tugas harian dan hubungan kekeluargaan — sebab itu nilai Kesederhanaan ditekankan."}]},{"id":"pm44-u3","title":"Unit 3: Buli Siber, Hak Cipta MyIPO & Penipuan Dalam Talian","subtitle":"Pengayaan & Pemulihan — Perlindungan Hak Cipta (MyIPO), Kes Rakaman Pawagam, Panggilan Video & Penipuan Belian Online","iconType":"lock","iconUrl":"../assets/icons/pm44-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Hak Cipta MyIPO, Buli Siber & Panggilan Video","voiceCaption":"Merakam filem di pawagam dan menularkannya melanggar hak cipta yang dilindungi MyIPO, manakala panggilan video dan belian dalam talian memerlukan sikap berwaspada.","voiceScript":"[warm] Selamat datang ke Unit tiga! Tahukah kamu agensi yang mengurus perlindungan harta intelek dan hak cipta di Malaysia ialah Perbadanan Harta Intelek Malaysia atau MyIPO? Dalam bahagian Pengayaan, murid diingatkan tentang pelanggaran hak cipta seperti merakam filem terbaharu di pawagam menggunakan telefon pintar lalu memuat naik ke media sosial! Perbuatan ini menceroboh hak ekonomi dan hak moral pencipta karya sehingga boleh dikenakan tindakan undang-undang! Selain itu, kita mestilah menjauhi buli siber, menyekat pelanggan berunsur lucah seperti kes peniaga dalam talian Olivia, menggunakan panggilan video secara sopan hanya kepada kenalan dipercayai, dan menyemak kesahihan penjual dalam talian agar tidak tertipu selepas membuat bayaran!","title":"Hak Cipta MyIPO, Panggilan Video & Penipuan E-Dagang","acronym":"MyIPO•BS","hook":"Buka tab Hak Cipta MyIPO pada simulator di bawah untuk meneliti perlindungan karya asal!","mediaKey":"pm44_keselamatan_siber","summary":"MyIPO melindungi hak cipta dan hak moral karya asal (dilarang merakam & menularkan filem pawagam). Panggilan video beradab hanya dengan kenalan; hentikan gangguan seksual dalam talian & semak peniaga sebelum membayar.","bullets":["Hak Cipta & Peranan MyIPO: Melindungi karya asli serta hak moral pencipta; merakam filem di pawagam dan memuat naiknya ialah pelanggaran hak cipta.","Etika Panggilan Video: Gunakan bahasa sopan, tiada tingkah la (function () {

      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  function playSfx(kind) {
    if (!window.NotaAudio) return;

  function renderGallery(keys, title) {
    var mediaMap = (typeof window !== "undefined" && window.ETUTOR_NOTA_MEDIA) || {};
    var items = (keys || []).map(function (k) { return mediaMap[k] ? { key: k, rec: mediaMap[k] } : null; }).filter(Boolean);
    if (!items.length) return "";
    return (
      '<div class="archival-section-head"><span>' + esc(title) + "</span></div>" +
      '<div class="archival-gallery-grid">' +
      items.map(function (it, idx) {
        var r = it.rec;
        return (

      "</div>"
    );
  }

  };

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;

    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +

    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
