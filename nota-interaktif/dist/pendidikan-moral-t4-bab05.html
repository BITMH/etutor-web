/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;

  background: rgba(255, 255, 255, 0.86);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {

}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab05","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":5,"title":"Mantap Integriti Mantaplah Jati Diri","subtitle":"Bidang 6 Unit 5 — Maksud 'Integer', Kepentingan & Implikasi, Perspektif 5 Agama, Pelan Antirasuah Nasional (NACP) & Akta Rahsia Rasmi 1972","estimatedMinutes":30,"themeAccent":"#b45309","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab05-labs.js","coverIcon":"../assets/icons/pm45-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Pegangan nilai integriti dan jati diri kamu amat kukuh.","combo":"[excited] Hebat! Jawapan konsisten membuktikan prinsip amanah dan kejujuran yang tinggi.","encourage":"[gentle] Cuba semak semula implikasi pengabaian integriti serta peruntukan Akta Rahsia Rasmi 1972.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit lima Mantap Integriti Mantaplah Jati Diri!"},"units":[{"id":"pm45-u1","title":"Unit 1: Maksud, Kepentingan & Implikasi Integriti Individu","subtitle":"SP 6.1.1, 6.1.2 & 6.1.3 — Asal Latin 'Integer', 8 Kepentingan IIM serta Implikasi kepada Diri, Keluarga & Negara","iconType":"shield","iconUrl":"../assets/icons/pm45-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Integriti Individu, Kepentingan & Implikasi","voiceCaption":"Integriti berasal daripada perkataan Latin 'integer' bermaksud sempurna dan tulen; pengamalannya memelihara kepercayaan manakala pengabaiannya menjatuhkan maruah diri, keluarga dan negara.","voiceScript":"[warm] Selamat datang ke Bidang enam, Jati Diri Moral, Unit lima: Mantap Integriti Mantaplah Jati Diri! Lima nilai cadangan unit ini ialah Kepercayaan kepada Tuhan, Kejujuran, Harga Diri, Kerajinan dan Bertanggungjawab. Perkataan integriti berasal daripada perkataan Latin 'integer' yang bermaksud menyeluruh, sempurna, tulen dan tidak berubah! Integriti individu bermaksud sifat jati diri merangkumi kejujuran dan keikhlasan, ketulusan dan keutuhan dalam perlakuan serta pemikiran, dan pegangan teguh terhadap nilai positif! Institut Integriti Malaysia atau I.I.M. menekankan lapan kepentingan integriti individu: melahirkan modal insan berbakti, meraih keyakinan orang lain, menjamin hasil kerja berkualiti, memelihara imej diri dan keluarga, mewujudkan pentadbiran cekap, berpegang pada prinsip etika, mengelakkan salah guna kuasa, serta membentuk jati diri bangsa! Sebaliknya, perbuatan tidak berintegriti memberi implikasi buruk kepada tiga pihak: diri iaitu menjatuhkan maruah dan hilang kepercayaan, keluarga iaitu memalukan dan merenggangkan hubungan, serta negara iaitu mencemarkan nama baik dan menjejaskan keyakinan pelabur asing!","title":"6.1.1, 6.1.2 & 6.1.3 Maksud, Kepentingan dan Implikasi Integriti","acronym":"D•K•N•I","hook":"Tonton video penerangan bersuara tentang integriti individu, kemudian terokai kepentingan IIM dan kesan pengabaian pada Makmal Integriti!","mediaKey":"pm45_integriti_individu","videoClip":{"src":"../assets/pendidikan-moral-t4-bab05/video/pm45_video_integriti_jati_diri_narasi.mp4","hasNarration":true,"posterKey":"pm45_integriti_individu","caption":"Video Penerangan Bersuara (BM): Kepentingan integriti individu dalam membina jati diri kukuh serta menolak penipuan akademik dan harian"},"summary":"Integer (Latin) = menyeluruh, sempurna, tulen & tidak berubah. Kepentingan: kualiti kerja, kepercayaan, cegah salah guna kuasa, imej diri/keluarga. Implikasi pengabaian: Diri (maruah jatuh), Keluarga (malu & renggang), Negara (pelabur asing hilang yakin).","bullets":["Maksud Integriti Individu (SP 6.1.1): Daripada perkataan Latin 'integer' (menyeluruh, sempurna, tulen, tidak berubah) — kejujuran, keikhlasan, ketulusan dan keutuhan perlakuan serta pemikiran.","8 Kepentingan (SP 6.1.2 — IIM): Modal insan berbakti, keyakinan orang lain, kerja berkualiti, imej diri/keluarga, pentadbiran cekap, ketinggian etika, elak salah guna kuasa dan jati diri bangsa.","Implikasi Tidak Berintegriti (SP 6.1.3): Diri (maruah jatuh, hilang kepercayaan, jejas masa depan, individualistik); Keluarga (malukan keluarga, renggang hubungan, dipinggir); Negara (harmoni terjejas, nama tercemar, pelabur asing ragu)."],"labId":"pm45_integriti_dasar_lab","labTitle":"Makmal Integriti Individu & Implikasi","labProps":{"tab":"kepentingan"},"examTip":"Apabila soalan bertanya implikasi perbuatan tidak berintegriti, kategorikan jawapan kepada Diri, Keluarga dan Negara supaya hujah lengkap dan tidak berulang!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Implikasi Diri, Keluarga vs Negara","voiceCaption":"Kelaskan enam implikasi pengabaian integriti berikut antara Kesan Diri & Keluarga dengan Kesan kepada Negara.","voiceScript":"[confident] Kelaskan keenam-enam implikasi pengabaian integriti ini mengikut pihak yang terjejas!","prompt":"Isihkan implikasi perbuatan tidak berintegriti berikut:","buckets":[{"id":"dk","label":"Implikasi kepada Diri & Keluarga"},{"id":"neg","label":"Implikasi kepada Negara"}],"items":[{"text":"Menjatuhkan maruah diri dan menghilangkan kepercayaan orang lain","bucketId":"dk","note":"Tepat! Kesan langsung kepada individu."},{"text":"Memalukan anggota keluarga dan merenggangkan hubungan kekeluargaan","bucketId":"dk","note":"Betul! Keluarga turut menanggung aib perbuatan tersebut."},{"text":"Menjejaskan keyakinan pelabur asing untuk melabur dalam ekonomi tempatan","bucketId":"neg","note":"Tepat! Pelabur menjauhi negara yang lemah tadbir urus integriti."},{"text":"Mencemarkan nama baik serta menjejaskan keharmonian negara","bucketId":"neg","note":"Betul! Reputasi antarabangsa negara terjejas."},{"text":"Menjejaskan masa hadapan diri serta dipinggirkan oleh masyarakat","bucketId":"dk","note":"Tepat! Kehilangan peluang kerjaya dan sokongan sosial."},{"text":"Pentadbiran awam menjadi tidak cekap akibat penyalahgunaan kuasa","bucketId":"neg","note":"Betul! Melemahkan sistem pentadbiran negara."}],"explanation":"Integriti individu merupakan asas kestabilan ekonomi dan reputasi sesebuah negara."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Konsep Asas Integriti","voiceCaption":"Padankan lima konsep asas integriti individu berikut dengan penerangannya.","voiceScript":"[confident] Padankan setiap istilah integriti individu berikut dengan maksudnya!","prompt":"Padankan istilah integriti berikut:","pairs":[{"id":"pm45u1m1","left":"Perkataan Latin 'Integer'","right":"Menyeluruh, sempurna, tulen dan tidak berubah"},{"id":"pm45u1m2","left":"Institut Integriti Malaysia (IIM)","right":"Institusi negara yang memartabatkan budaya integriti dan tadbir urus"},{"id":"pm45u1m3","left":"Ketulusan & keutuhan","right":"Keselarasan antara pemikiran, pertuturan dengan perlakuan jujur"},{"id":"pm45u1m4","left":"Tidak menepati masa","right":"Salah satu cabaran integriti generasi abad ke-21 yang perlu diatasi"},{"id":"pm45u1m5","left":"Plagiarisme tugasan","right":"Mengambil karya pihak lain dan mendakwanya sebagai hasil kerja sendiri"}],"explanation":"Integriti meliputi ketepatan masa, kejujuran akademik serta keamanahan tugas."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Kepentingan Tadbir Urus","voiceCaption":"Kenal pasti kepentingan utama integriti individu terhadap sistem pentadbiran dan organisasi.","voiceScript":"[excited] Uji peranan integriti individu dalam melahirkan pentadbiran negara yang cekap!","prompt":"Apakah kesan positif utama apabila setiap penjawat dan pekerja mengamalkan integriti individu dalam kerjaya mereka?","options":["Menjamin hasil kerja berkualiti, mengelakkan penyalahgunaan kuasa dan mewujudkan pentadbiran yang cekap","Memudahkan seseorang mengambil kesempatan mencuri cuti tanpa pengetahuan majikan","Mengurangkan kepercayaan pelabur asing terhadap projek tempatan","Melahirkan pekerja yang bersikap individualistik di tempat kerja"],"correctIndex":0,"explanation":"Integriti menjamin kualiti kerja dan mencegah penyelewengan kuasa dalam organisasi."}]},{"id":"pm45-u2","title":"Unit 2: Perspektif 5 Agama, NACP & Akta Rahsia Rasmi 1972","subtitle":"SP 6.1.4 — Tuntutan Integriti dalam Agama Islam, Buddha, Hindu, Kristian & Sikh serta NACP & Seksyen 9 Akta 88","iconType":"book","iconUrl":"../assets/icons/pm45-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Integriti 5 Agama, NACP & Akta Rahsia Rasmi","voiceCaption":"Kelima-lima agama utama menuntut kejujuran dan amanah, selaras Pelan Antirasuah Nasional serta Seksyen 9 Akta Rahsia Rasmi 1972.","voiceScript":"[warm] Selamat datang ke Unit dua! Setiap agama dan kepercayaan menuntut penganutnya hidup berintegriti! Dalam buku teks muka surat tujuh puluh tiga: Agama Islam melalui Surah al-Anfal ayat dua puluh tujuh melarang mengkhianati amanah dan menuntut kejujuran tugas; Agama Buddha melalui Dhammapada Bab empat belas menyeru menyucikan niat hati dan tidak menipu; Agama Hindu melalui Tirukural dua ratus sembilan puluh lapan menekankan kesucian hati dicapai dengan kebenaran serta berani mengaku silap; Agama Kristian melalui Amsal enam belas ayat lapan menyatakan lebih baik miskin namun benar daripada kaya tetapi tidak jujur serta tidak memalsukan dokumen; dan Agama Sikh melalui Sri Guru Granth Sahib Ji menuntut mencari rezeki jujur serta berkongsi dengan memerlukan! Pada peringkat negara pula, kerajaan melaksanakan Pelan Antirasuah Nasional dua ribu sembilan belas hingga dua ribu dua puluh tiga demi ketelusan bebas rasuah, manakala Seksyen sembilan Akta Rahsia Rasmi seribu sembilan ratus tujuh puluh dua menghukum individu yang menyamar atau memakai pakaian seragam rasmi tanpa kuasa sah untuk memasuki tempat larangan!","title":"6.1.4 Integriti Perspektif 5 Agama, NACP & Akta Rahsia Rasmi","acronym":"I•B•H•K•S","hook":"Klik setiap satu daripada 5 agama pada Simulator Perspektif Agama di bawah!","mediaKey":"pm45_perspektif_agama","summary":"5 Agama: Islam (Surah al-Anfal 8:27 - jangan khianati amanah), Buddha (Dhammapada XIV:183 - sucikan niat hati), Hindu (Kural 298 - kebenaran), Kristian (Amsal 16:8 - elak palsu dokumen), Sikh (nafkah jujur & berkongsi). NACP (bebas rasuah) & Akta Rahsia Rasmi 1972 Seksyen 9.","bullets":["5 Perspektif Agama (SP 6.1.4): Islam (Surah al-Anfal 8:27 — jujur laksana amanah), Buddha (Dhammapada XIV:183 — suci niat, setia & tidak menipu), Hindu (Kural 298 — kebenaran hati, mengaku silap), Kristian (Amsal 16:8 — tidak memalsukan dokumen), Sikh (Sri Guru Granth Sahib Ji — rezeki jujur & berkongsi).","Pelan Antirasuah Nasional (NACP 2019-2023): Dasar antirasuah Jabatan Perdana Menteri memupuk ketelusan, kebertanggungjawaban dan integriti.","Akta Rahsia Rasmi 1972 (Seksyen 9): Kesalahan memakai pakaian seragam tentera/polis/rasmi tanpa kuasa sah atau menyamar untuk memasuki tempat larangan."],"labId":"pm45_agama_integriti_sim","labTitle":"Simulator Integriti 5 Agama & Kepercayaan","labProps":{"rel":"islam"},"examTip":"Dalam soalan struktur SP 6.1.4, nyatakan perlakuan spesifik mengikut ajaran agama, contohnya: tidak memalsukan dokumen, mengaku kesilapan, jujur melaksanakan amanah serta mencari rezeki halal."},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 5 Agama & Contoh Perlakuan Integriti","voiceCaption":"Padankan lima agama dan dasar undang-undang berikut dengan prinsip integriti yang tepat.","voiceScript":"[confident] Padankan kesemua ajaran agama dan akta negara ini dengan prinsip integritinya!","prompt":"Padankan ajaran agama atau dasar negara berikut dengan penekanannya:","pairs":[{"id":"pm45u2m1","left":"Agama Islam (Surah al-Anfal 8:27)","right":"Tidak mengkhianati amanah serta jujur melaksanakan tugas yang diamanahkan"},{"id":"pm45u2m2","left":"Agama Buddha (Dhammapada XIV:183)","right":"Menyucikan niat hati, tidak menipu, setia pada keluarga & buat kebajikan"},{"id":"pm45u2m3","left":"Agama Hindu (Tirukural 298)","right":"Kesucian hati dicapai dengan kebenaran; berani mengaku silap daripada berbohong"},{"id":"pm45u2m4","left":"Agama Kristian (Amsal 16:8)","right":"Melakukan apa yang benar serta tidak memalsukan sebarang dokumen"},{"id":"pm45u2m5","left":"Agama Sikh (Sri Guru Granth Sahib Ji)","right":"Mencari rezeki secara jujur dan berkongsi dengan golongan memerlukan"}],"explanation":"Kesemua ajaran agama bersatu dalam memuliakan kejujuran, amanah dan kebenaran."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Susun Tujuan Pelan Antirasuah Nasional","voiceCaption":"Susun frasa untuk melengkapkan objektif Pelan Antirasuah Nasional (NACP) dan Akta Rahsia Rasmi 1972.","voiceScript":"[confident] Susun frasa berikut bagi merumuskan usaha kerajaan memartabatkan integriti negara!","prompt":"Susun frasa untuk menerangkan NACP dan Akta Rahsia Rasmi 1972:","hint":"Pelan Antirasuah Nasional mencerminkan harapan negara bebas rasuah...","answerTokens":["Pelan Antirasuah Nasional mencerminkan harapan negara bebas rasuah","yang mengamalkan ketelusan, kebertanggungjawaban dan integriti,","manakala Akta Rahsia Rasmi 1972 menghukum penyamaran seragam rasmi demi keselamatan Malaysia."],"distractors":["supaya dokumen rasmi boleh dipalsukan demi kepentingan peribadi","untuk membenarkan individu menyamar memasuki kawasan larangan kerajaan"],"explanation":"Dasar NACP dan Akta Rahsia Rasmi 1972 menegakkan integriti pentadbiran serta keselamatan negara."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Seksyen 9 Akta Rahsia Rasmi","voiceCaption":"Kenal pasti kesalahan khusus di bawah Seksyen 9 Akta Rahsia Rasmi 1972.","voiceScript":"[excited] Uji ketepatan fahaman kamu mengenai Seksyen sembilan Akta Rahsia Rasmi!","prompt":"Perbuatan manakah yang boleh dikenakan hukuman di bawah Seksyen 9 Akta Rahsia Rasmi 1972?","options":["Memakai pakaian seragam tentera atau polis tanpa kuasa sah serta menyamar untuk memasuki tempat larangan keselamatan negara","Membayar cukai pendapatan tahunan melalui portal rasmi kerajaan","Membuat laporan polis apabila melihat aktiviti rasuah di syarikat","Menghadiri perhimpunan sekolah dengan memakai pakaian pengawas rasmi"],"correctIndex":0,"explanation":"Seksyen 9(1)(a) Akta Rahsia Rasmi 1972 menghukum pemakaian seragam rasmi tanpa kuasa sah untuk memperdaya atau masuk ke kawasan larangan."}]},{"id":"pm45-u3","title":"Unit 3: Dilema Moral Remaja, Kerja & Plagiarisme","subtitle":"Pengukuhan & Penilaian — Kes Ravi & Thira, Bah Goli (Duit Kelab), Dylan, Joven, Rakan Tak Berintegriti & Plagiarisme","iconType":"scale","iconUrl":"../assets/icons/pm45-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Dilema Integriti Sekolah, Pekerjaan & Plagiarisme","voiceCaption":"Kejujuran dan amanah mesti dipertahankan dalam peperiksaan, pengurusan kewangan kelab, penguatkuasaan disiplin, tempat kerja serta penulisan artikel tanpa plagiarisme.","voiceScript":"[warm] Selamat datang ke Unit tiga! Mari kita bedah lima dilema integriti terkenal dalam buku teks Unit lima! Pertama, Kes Ravi dan Thira: walaupun Thira sahabat baik yang lama sakit, Ravi TIDAK wajar membenarkannya meniru dalam peperiksaan, sebaliknya membantu Thira mengulang kaji selepas waktu sekolah! Kedua, Kes Bah Goli bendahari kelab: menggunakan duit kelab untuk rawatan adiknya tanpa kebenaran walaupun dipulangkan hujung bulan tetap TIDAK BERINTEGRITI dan merupakan pecah amanah — Bah Goli wajar memohon pinjaman peribadi atau bantuan pihak sekolah secara sah! Ketiga, Kes Dylan ketua pengawas: tetap merampas barang terlarang milik rakan karib tanpa pilih kasih! Keempat, Kes Joven dan pekerja syarikat: jangan terpengaruh dengan rakan sekerja tidak amanah dan jangan mengambil kesempatan selepas dinaikkan pangkat dengan datang lewat atau kerap bercuti! Kelima, Kes tugasan plagiarisme: jangan memuat turun bahan orang lain tanpa izin atau mendakwa karya orang sebagai milik sendiri!","title":"Analisis Dilema Moral Integriti (Kes Ravi, Bah Goli, Dylan & Joven)","acronym":"R•B•D•J","hook":"Buka tab 'NACP & Akta Rahsia Rasmi' dalam makmal di bawah untuk semak isu plagiarisme dan tadbir urus!","mediaKey":"pm45_antirasuah_osa","summary":"Kes Ravi: tolak meniru peperiksaan & bantu ulang kaji. Kes Bah Goli: dilarang guna duit kelab tanpa izin walau dipulangkan (pecah amanah). Kes Dylan: rampas barang larangan tanpa pilih kasih. Kes Joven & rakan kerja: kekal amanah walau rakan tidak berintegriti. Tolak plagiarisme.","bullets":["Kes Sekolah (Ravi, Bah Goli & Dylan): Tolak permintaan meniru peperiksaan; jangan guna wang amanah kelab untuk urusan peribadi tanpa kelulusan; kuatkuasa peraturan sekolah kepada semua murid termasuk rakan karib.","Kes Alam Pekerjaan (Joven & Pekerja Amanah): Elakkan datang lewat atau mengabaikan tugas selepas naik pangkat; jangan ikut budaya tidak berintegriti rakan sekerja walaupun mereka dipuji.","Anti-Plagiarisme: Menyatakan sumber rujukan dengan jujur dan tidak mengakui karya dimuat turun sebagai hasil sendiri."],"labId":"pm45_integriti_dasar_lab","labTitle":"Kajian Kes Tadbir Urus, Pekerjaan & Plagiarisme","labProps":{"tab":"dasar"},"examTip":"Soalan Kes Bah Goli (guna duit kelab sementara lalu pulangkan): Jangan tertipu! Jawapan KSSM wajib menyatakan TIDAK PATUT kerana menyalahgunakan wang amanah tanpa kebenaran ialah pecah amanah!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Penilaian Kes Bah Goli (Wang Kelab)","voiceCaption":"Ramalkan kewajaran tindakan bendahari Bah Goli menggunakan wang kelab tanpa izin untuk tujuan kecemasan walaupun memulangkannya hujung bulan.","voiceScript":"[curious] Bah Goli seorang bendahari kelab. Adiknya terlibat dalam kemalangan lalu dia mengambil duit kelab tanpa kebenaran dan memulangkannya pada hujung bulan. Wajarkah tindakan itu?","hook":"Fikirkan definisi amanah, keizinan jawatankuasa serta risiko pecah amanah!","scenario":"Bendahari Kelab Kewangan menggunakan duit kelab tanpa kelulusan guru penasihat untuk bil rawatan adiknya dan membayarnya semula pada hujung bulan.","prompt":"Apakah penilaian moral paling tepat terhadap tindakan Bah Goli?","options":["Tidak patut kerana menggunakan wang amanah organisasi tanpa kebenaran merupakan pecah amanah; dia patut memohon bantuan rasmi sekolah atau pinjaman sah daripada keluarga/guru","Patut sepenuhnya kerana bendahari berhak meminjam duit kelab secara rahsia pada bila-bila masa","Patut asalkan tidak ada ahli kelab yang menyedari kehilangan wang tersebut","Tidak patut hanya jika dia terlupa memulangkannya dalam masa lima tahun"],"correctIndex":0,"proofLabId":"pm45_integriti_dasar_lab","proofState":{"tab":"kepentingan"},"explanation":"Wang organisasi bukan milik peribadi; mengambilnya tanpa kelulusan rasmi melanggar nilai kejujuran dan bertanggungjawab."},{"type":"sort","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Isih Tindakan Berintegriti vs Tidak Berintegriti","voiceCaption":"Kelaskan enam kes situasi sekolah dan pejabat berikut antara Tindakan Berintegriti dengan Tidak Berintegriti.","voiceScript":"[confident] Nilaikan keenam-enam tindakan watak dalam dilema sekolah dan kerjaya berikut!","prompt":"Isihkan tindakan watak berikut mengikut kepatuhan integriti:","buckets":[{"id":"amanah","label":"Tindakan Berintegriti"},{"id":"khianat","label":"Tindakan Tidak Berintegriti"}],"items":[{"text":"Dylan tetap merampas barang terlarang milik rakan karibnya mengikut peraturan sekolah","bucketId":"amanah","note":"Tepat! Penguatkuasaan adil tanpa pilih kasih."},{"text":"Ravi enggan memberi jawapan peperiksaan kepada Thira sebaliknya menolongnya mengulang kaji","bucketId":"amanah","note":"Betul! Jujur dan prihatin dalam pelajaran."},{"text":"Pekerja datang lewat dan mengambil cuti sewenang-wenangnya selepas dinaikkan pangkat","bucketId" "xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Perasaan & Amalan Harian di Sekolah","voiceCaption":"Pemantapan integriti melahirkan perasaan puas hati, gembira dan bersyukur serta perlu diamalkan di semua lokasi sekolah termasuk menepati masa.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut buku teks muka surat tujuh puluh tiga, pemantapan integriti diri demi aspirasi negara melahirkan perasaan PUAS HATI, GEMBIRA dan BERSYUKUR dalam diri setiap individu! Di sekolah pula, amalan integriti perlu dipraktikkan di semua lokasi — di kantin apabila jujur membayar makanan mengikut harga sebenar, di bilik darjah dengan tidak meniru, di perpustakaan dengan memulangkan buku tepat pada waktunya, dan di padang atau makmal dengan menjaga peralatan bersama! Jangan lupa cabaran abad kedua puluh satu yang ditekankan dalam buku teks: menepati masa! Hadir tepat pada waktu kelas atau temu janji ialah bukti disiplin, amanah dan penghormatan terhadap masa orang lain!","title":"6.1.5 & 6.1.6 Perasaan, Integriti di Sekolah & Ketepatan Masa","acronym":"P•G•B•M","hook":"Buka galeri arkib Unit 5 di bawah untuk mengimbas visual integriti individu dan agama!","mediaKey":"pm45_integriti_individu","summary":"Perasaan (SP 6.1.5): puas hati, gembira dan bersyukur. Amalan sekolah (SP 6.1.6): jujur di kantin, tidak meniru di kelas, pulangkan buku perpustakaan tepat waktu, jaga harta sekolah, dan menepati masa.","bullets":["Perasaan Moral (SP 6.1.5): Puas hati, gembira dan bersyukur apabila menunaikan tanggungjawab dengan amanah dan jujur.","Amalan di Lokasi Sekolah (SP 6.1.6): Membayar harga penuh di kantin, memulangkan barang tercicir, tidak meniru semasa ujian serta menjaga peralatan makmal dan perpustakaan.","Menepati Masa Abad ke-21: Menghormati jadual perhimpunan, kelas dan mesyuarat menunjukkan kebolehpercayaan serta kerajinan."],"labId":"pm45_galeri_arkib","labTitle":"Galeri Arkib Visual Integriti Individu","examTip":"Untuk soalan mengenai cabaran menepati masa abad ke-21, kaitkan dengan implikasi hilangnya kepercayaan rakan/majikan dan merosotnya produktiviti organisasi."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Bina Pernyataan Ketepatan Masa & Integriti","voiceCaption":"Susun frasa untuk menghuraikan kepentingan menepati masa dalam membentuk integriti murid.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan kepentingan amalan menepati masa dan integriti!","prompt":"Susun frasa berikut menjadi hujah tepat tentang menepati masa:","hint":"Amalan menepati masa mencerminkan sikap bertanggungjawab...","answerTokens":["Amalan menepati masa mencerminkan sikap bertanggungjawab dan berdisiplin","yang meningkatkan keyakinan orang lain terhadap kewibawaan diri,","lalu melahirkan rasa puas hati, gembira dan bersyukur."],"distractors":["yang membolehkan pelajar menangguhkan kerja sekolah sesuka hati","supaya rakan sepasukan terpaksa menunggu lama di tempat perjumpaan"],"explanation":"Menepati masa membuktikan kebolehpercayaan diri dan menghormati hak masa orang lain."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Lokasi Sekolah & Amalan Integriti","voiceCaption":"Padankan lima lokasi sekolah berikut dengan contoh amalan integriti yang tepat.","voiceScript":"[confident] Padankan setiap lokasi di sekolah berikut dengan amalan integriti murid yang sepatutnya!","prompt":"Padankan lokasi sekolah berikut dengan perlakuan berintegriti:","pairs":[{"id":"pm45u4m1","left":"Kantin sekolah","right":"Membayar jumlah harga makanan yang tepat dan beratur dengan tertib"},{"id":"pm45u4m2","left":"Pusat sumber / perpustakaan","right":"Memulangkan buku mengikut tarikh tanpa merosakkan muka surat"},{"id":"pm45u4m3","left":"Dewan peperiksaan","right":"Menjawab soalan dengan usaha sendiri tanpa membawa nota atau meniru"},{"id":"pm45u4m4","left":"Makmal sains & bengkel","right":"Melaporkan radas yang pecah kepada guru dengan jujur"},{"id":"pm45u4m5","left":"Tapak perhimpunan pagi","right":"Hadir tepat pada waktunya dan berdiri tegak menghormati lagu kebangsaan"}],"explanation":"Integriti dibina melalui kebiasaan kecil setiap hari di semua ruang sekolah."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Perasaan & Hasil Integriti","voiceCaption":"Pilih pernyataan tepat tentang perasaan apabila berjaya mempromosikan poster kata-kata hikmat dengan berintegriti.","voiceScript":"[excited] Uji ekspresi perasaan yang tepat menurut buku teks Unit lima!","prompt":"Apakah perasaan yang terhasil apabila seseorang berjaya melaksanakan tanggungjawabnya secara berintegriti dan telus?","options":["Berasa puas hati, gembira dan bersyukur kerana memelihara maruah diri serta meraih kepercayaan orang lain","Berasa gelisah kerana bimbang penipuan akan terbongkar pada bila-bila masa","Berasa sombong dan memandang rendah golongan yang kurang berjaya","Berasa kecewa kerana tidak menerima wang rasuah"],"correctIndex":0,"explanation":"Ketulusan hati melahirkan ketenangan, kepuasan diri, kegembiraan dan kesyukuran."}]},{"id":"pm45-u5","title":"Unit 5 (Boss): Misi Pejuang Integriti & Antirasuah SPM","subtitle":"Penilaian Bersepadu Unit 5 — 'Integer', Kepentingan & Implikasi, 5 Agama, NACP, Akta Rahsia Rasmi & Dilema Kes","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Padanan Master Unit 5","voiceCaption":"Padankan lima konsep utama Unit 5 daripada maksud 'integer', NACP dan Akta Rahsia Rasmi hingga ajaran agama.","voiceScript":"[excited] Cabaran Boss Unit lima bermula! Padankan kelima-lima fakta utama ini!","prompt":"Padankan konsep teras Unit 5 berikut dengan tepat:","pairs":[{"id":"pm45u5m1","left":"'Integer' (Latin)","right":"Menyeluruh, sempurna, tulen dan tidak berubah"},{"id":"pm45u5m2","left":"Pelan Antirasuah Nasional (NACP)","right":"Dasar kerajaan memupuk ketelusan, kebertanggungjawaban & negara bebas rasuah"},{"id":"pm45u5m3","left":"Akta ian seragam rasmi tanpa kebenaran di tempat larangan","supaya budaya datang lewat dan pecah amanah dianggap biasa"],"explanation":"Integriti diri memelihara maruah peribadi, kestabilan keluarga dan kemajuan negara."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Cabaran Akhir Boss Unit 5","voiceCaption":"Pilih pernyataan menyeluruh yang benar bagi menamatkan Unit 5 Mantap Integriti Mantaplah Jati Diri.","voiceScript":"[celebratory] Soalan akhir Boss Unit lima! Pilih gabungan fakta paling tepat.","prompt":"Manakah gabungan pernyataan yang BENAR mengenai Unit 5?","options":["Perkataan Latin 'integer' bermaksud tulen dan tidak berubah; kelima-lima ajaran agama menuntut kejujuran; Pelan Antirasuah Nasional serta Akta Rahsia Rasmi 1972 memperkukuh tadbir urus negara","Menggunakan wang kelab tanpa izin adalah berintegriti asalkan dibayar semula selepas sebulan","Akta Rahsia Rasmi 1972 membenarkan orang awam menyamar anggota polis masuk ke kawasan larangan","Plagiarisme ialah amalan mulia yang digalakkan dalam penulisan artikel sekolah"],"correctIndex":0,"proofLabId":"pm45_galeri_arkib","explanation":"Tahniah! Kamu telah berjaya menamatkan Unit 5 Mantap Integriti Mantaplah Jati Diri!"}]}]};</script>

  return Boolean(CHAPTER && /inggeris|english/i.test(String(CHAPTER.subject || "")));
}

function tUi(msText, enText) {
  return isEnglishNota() ? enText : msText;
}

var notaState = {
  mode: "map",
  activeUnitIdx: 0,
  activeStepIdx: 0,
  hearts: 5,
  maxHearts: 5,
  xp: 0,
  unitXpEarned: 0,
  combo: 0,
  maxCombo: 0,
  unitCorrect: 0,
  unitTotal: 0,
  completedUnits: {},
  muted: false,
  voiceAutoplay: true,
  answeredCurrent: false,
  activeLabCleanups: []
};

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* Procedural Web Audio Synthesizer — Zero external MP3s, iframe-sandbox safe */
var NotaAudio = (function () {
  var ctx = null;
  function getCtx() {
    if (notaState.muted || typeof window === "undefined") return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") {
      try { ctx.resume(); } catch (e2) {}
    }
    return ctx;
  }
  function tone(freq, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  var noiseBuf = null;
  function noiseBurst(dur, filterFreq, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      var len = Math.floor(c.sampleRate * 0.5);
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    var t0 = c.currentTime + (delay || 0);
    var src = c.createBufferSource();
    src.buffer = noiseBuf;
    var filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(filterFreq || 1200, t0);
    filter.Q.setValueAtTime(1.1, t0);
    var gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.09, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }
  function sweepTone(fStart, fEnd, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(fStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  return {
    playTap: function () { tone(540, 0.06, "triangle", 0.07, 0); },
    playSnap: function () {
      tone(620, 0.045, "triangle", 0.1, 0);
      tone(930, 0.08, "sine", 0.11, 0.03);
    },
    playLaserZap: function () {
      sweepTone(520, 170, 0.18, "sawtooth", 0.065, 0);
      tone(210, 0.12, "triangle", 0.06, 0.06);
    },
    playMatch: function () { tone(659.25, 0.1, "sine", 0.11, 0); tone(880, 0.13, "sine", 0.11, 0.06); },
    playCorrect: function (combo) {
      var shift = Math.min(6, Number(combo) || 0) * 28;
      tone(523.25 + shift, 0.12, "triangle", 0.13, 0);
      tone(659.25 + shift, 0.14, "triangle", 0.13, 0.08);
      tone(783.99 + shift, 0.22, "sine", 0.14, 0.16);
    },
    playWrong: function () {
      tone(240, 0.15, "sawtooth", 0.08, 0);
      tone(190, 0.22, "sawtooth", 0.08, 0.12);
    },
    playFanfare: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        tone(f, 0.24, "triangle", 0.13, i * 0.09);
      });
    },
    playPaperRustle: function () {
      noiseBurst(0.11, 1650, 0.08, 0);
      noiseBurst(0.08, 2200, 0.05, 0.04);
    },
    playPrintingPress: function () {
      sweepTone(145, 70, 0.16, "triangle", 0.14, 0);
      noiseBurst(0.06, 1850, 0.09, 0.04);
      sweepTone(125, 65, 0.15, "triangle", 0.12, 0.13);
      tone(980, 0.06, "square", 0.04, 0.2);
    },
    playOceanWave: function () {
      noiseBurst(0.36, 420, 0.07, 0);
      tone(1046.5, 0.14, "sine", 0.05, 0.06);
    },
    playFortressBoom: function () {
      sweepTone(105, 38, 0.34, "triangle", 0.16, 0);
      noiseBurst(0.18, 480, 0.08, 0.02);
    },
    playTypewriterTick: function () {
      tone(2100, 0.022, "square", 0.035, 0);
    },
    playBossDrum: function () {
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0);
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0.14);
      sweepTone(210, 110, 0.26, "triangle", 0.16, 0.28);
    }
  };
})();

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}

        nextBtn.addEventListener("click", function () {

    }

  };

  }
}
