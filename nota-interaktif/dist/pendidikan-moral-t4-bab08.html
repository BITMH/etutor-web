/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {

  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;

  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab08","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":8,"title":"Hak dan Tanggungjawab Warganegara","subtitle":"Bidang 7 Unit 8 — Perkara 5, 6, 8, 9, 10, 12 & 13 Perlembagaan, Batasan Hak, Akta Orang Asli 1954, SUHAKAM, AHRD & Mother Mangalam","estimatedMinutes":35,"themeAccent":"#1d4ed8","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab08-labs.js","coverIcon":"../assets/icons/pm48-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Pengetahuan Perlembagaan dan tanggungjawab sivik kamu sangat mantap.","combo":"[excited] Hebat! Jawapan berterusan menunjukkan semangat patriotisme dan tanggungjawab tinggi.","encourage":"[gentle] Cuba semak semula nombor Perkara Perlembagaan Persekutuan dan batasan hak warganegara.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit lapan Hak dan Tanggungjawab Warganegara!"},"units":[{"id":"pm48-u1","title":"Unit 1: Perkara 5–13 Perlembagaan & Tanggungjawab","subtitle":"SP 7.1.1 & 7.1.2 — Hak Kebebasan Diri (P5), Larangan Kerja Paksa (P6), Kesamarataan (P8), Bersuara (P10), Harta (P13) & Kepentingan","iconType":"book","iconUrl":"../assets/icons/pm48-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Hak & Tanggungjawab dalam Perlembagaan","voiceCaption":"Perlembagaan Persekutuan menjamin kebebasan diri, larangan kerja paksa, kesamarataan, kebebasan bersuara dan hak harta berserta tanggungjawab setiap warganegara.","voiceScript":"[warm] Selamat datang ke Bidang tujuh, Moral dan Kenegaraan, Unit lapan: Hak dan Tanggungjawab Warganegara! Lima nilai cadangan unit ini ialah Bertanggungjawab, Patriotisme, Berterima Kasih, Kebebasan dan Berdikari. Hak ialah kuasa melakukan sesuatu mengikut undang-undang, manakala tanggungjawab ialah kesanggupan melaksanakan kewajipan menjaga kedaulatan negara! Mengikut Perlembagaan Persekutuan dalam buku teks: Perkara lima menjamin kebebasan diri dengan tanggungjawab memelihara nyawa diri dan orang lain; Perkara enam melarang keabdian dan kerja paksa dengan tanggungjawab melayan pekerja secara adil; Perkara lapan menetapkan kesamarataan di sisi undang-undang dengan tanggungjawab menolak diskriminasi kaum, agama atau jantina; Perkara sepuluh menjamin kebebasan bercakap, berhimpun dan berpersatuan dengan tanggungjawab mendapatkan kebenaran pihak berkuasa sebelum berhimpun; dan Perkara tiga belas menjamin hak terhadap harta dengan tanggungjawab mengisytiharkan harta serta membayar cukai!","title":"7.1.1 & 7.1.2 Perkara 5, 6, 8, 10 & 13 Perlembagaan Persekutuan","acronym":"5•6•8•10•13","hook":"Klik setiap Perkara Perlembagaan pada makmal interaktif di bawah untuk menyemak hak dan tanggungjawab padanannya!","mediaKey":"pm48_perlembagaan_spr","summary":"Perkara 5 (kebebasan diri), Perkara 6 (larangan kerja paksa), Perkara 8 (kesamarataan), Perkara 10 (bercakap/berhimpun dengan izin), Perkara 13 (hak harta & bayar cukai). Kepentingan: elak diskriminasi, kestabilan politik & pentadbiran licin.","bullets":["Hak vs Tanggungjawab (SP 7.1.1): Perkara 5 (kebebasan diri -> jaga nyawa); Perkara 6 (tiada kerja paksa -> layanan pekerja adil); Perkara 8 (kesamarataan -> tolak diskriminasi); Perkara 10 (kebebasan bersuara/berhimpun -> izin pihak berkuasa); Perkara 13 (hak harta -> isytihar harta & bayar cukai).","Kepentingan Hak & Tanggungjawab (SP 7.1.2): Hak — elak perselisihan kaum, tolak diskriminasi & jamin hak asasi; Tanggungjawab — lestarikan alam sekitar, licinkan pentadbiran kerajaan & stabilkan ekonomi/politik.","Nilai Cadangan KSSM: Bertanggungjawab, Patriotisme, Berterima kasih, Kebebasan dan Berdikari."],"labId":"pm48_perlembagaan_lab","labTitle":"Makmal Perkara 5–13 Perlembagaan Persekutuan","labProps":{"art":"p5_8"},"examTip":"Hafalan pantas nombor Perkara SPM: 5 = Nyawa/Kebebasan; 6 = Kerja Paksa; 8 = Sama Rata; 9 = Gerak; 10 = Himpun/Suara; 12 = Pendidikan; 13 = Harta!"},{"type":"match","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Padan Perkara Perlembagaan & Tanggungjawab","voiceCaption":"Padankan lima Perkara dalam Perlembagaan Persekutuan berikut dengan tanggungjawab warganegara yang sepadan.","voiceScript":"[confident] Padankan kelima-lima Perkara Perlembagaan ini dengan tanggungjawabnya yang tepat!","prompt":"Padankan setiap Perkara Perlembagaan dengan hak dan tanggungjawabnya:","pairs":[{"id":"pm48u1m1","left":"Perkara 5 (Kebebasan diri)","right":"Memelihara nyawa diri sendiri dan nyawa orang lain mengikut undang-undang"},{"id":"pm48u1m2","left":"Perkara 6 (Keabdian & kerja paksa dilarang)","right":"Tidak menindas pekerja dan memberi layanan adil kepada semua pihak"},{"id":"pm48u1m3","left":"Perkara 8 (Kesamarataan)","right":"Tidak mendiskriminasi atas alasan kaum, agama atau jantina"},{"id":"pm48u1m4","left":"Perkara 10 (Bercakap & berhimpun)","right":"Mendapatkan kebenaran pihak berkuasa sebelum mengadakan perhimpunan"},{"id":"pm48u1m5","left":"Perkara 13 (Hak terhadap harta)","right":"Membuat pengisytiharan harta dan membayar cukai kepada negara"}],"explanation":"Setiap hak yang dijamin oleh Perlembagaan Persekutuan bergerak seiring dengan tanggungjawab sivik."},{"type":"sort","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Isih Kepentingan Hak vs Kepentingan Tanggungjawab","voiceCaption":"Kelaskan enam pernyataan berikut antara Kepentingan Hak Warganegara dengan Kepentingan Tanggungjawab Warganegara.","voiceScript":"[confident] Asingkan kepentingan melaksanakan hak daripada kepentingan melaksanakan tanggungjawab!","prompt":"Isihkan pernyataan berikut mengikut kategorinya:","buckets":[{"id":"hak","label":"Kepentingan Hak Warganegara"},{"id":"tj","label":"Kepentingan Tanggungjawab Warganegara"}],"items":[{"text":"Mengelakkan diskriminasi perbezaan agama, bangsa, budaya dan bahasa","bucketId":"hak","note":"Tepat! Kepentingan jaminan hak asasi SP 7.1.2."},{"text":"Merapatkan jurang dan mengelakkan perselisihan faham antara kaum","bucketId":"hak","note":"Betul! Menjamin taraf hidup sosial yang adil."},{"text":"Melicinkan pentadbiran kerajaan dan memastikan dasar negara berjalan lancar","bucketId":"tj","note":"Tepat! Hasil kepatuhan warganegara terhadap tanggungjawab."},{"text":"Melestarikan alam sekitar serta membangunkan ekonomi negara yang stabil","bucketId":"tj","note":"Betul! Sumbangan aktif rakyat memartabatkan negara."},{"text":"Menjamin kebebasan hak asasi warganegara dalam komuniti aman","bucketId":"hak","note":"Tepat! Perlindungan undang-undang kepada setiap individu."},{"text":"Menzahirkan kesetiaan yang tinggi terhadap raja dan negara","bucketId":"tj","note":"Betul! Teras patriotisme warganegara."}],"explanation":"Hak menjamin perlindungan individu; tanggungjawab menjamin kestabilan pentadbiran dan kemajuan negara."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Pengisian MyKad & Pendaftaran Kelahiran","voiceCaption":"Kenal pasti kepentingan pemilikan MyKad tulen serta pendaftaran kelahiran rasmi warganegara.","voiceScript":"[excited] Uji kesedaran warganegara tentang dokumen pengenalan diri rasmi Malaysia!","prompt":"Mengapakah perbuatan menggunakan MyKad palsu merupakan pelanggaran serius terhadap undang-undang dan hak warganegara?","options":["Kerana ia menceroboh identiti warganegara sah, mengancam keselamatan negara serta menyalahi peraturan Jabatan Pendaftaran Negara","Kerana MyKad palsu dibenarkan di bawah Perkara 8 kesamarataan","Kerana pendaftaran kelahiran tidak memberi sebarang hak pendidikan atau kewarganegaraan","Kerana setiap orang bebas mencetak kad pengenalan sendiri di rumah"],"correctIndex":0,"explanation":"Kes wanita ditahan menggunakan MyKad palsu membuktikan kepentingan menjaga dokumen rasmi negara."}]},{"id":"pm48-u2","title":"Unit 2: Kesan Pengabaian, Batasan Hak & AHRD","subtitle":"SP 7.1.3 & 7.1.4 — Kesan Pengabaian (Diri, Masyarakat, Negara), Batasan Hak (Perkara 9, 10, 12) & Deklarasi AHRD (2012)","iconType":"shield","iconUrl":"../assets/icons/pm48-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kesan Pengabaian & Batasan Hak Warganegara","voiceCaption":"Pengabaian hak dan tanggungjawab menjejaskan imej serta kestabilan negara, justeru hak seperti Perkara 9, 10 dan 12 tertakluk pada batasan demi keselamatan bersama.","voiceScript":"[warm] Selamat datang ke Unit dua! Jika hak dan tanggungjawab diabaikan, wujudlah kesan buruk kepada tiga peringkat: pada DIRI menyebabkan tersisih, hilang hak asasi serta didiskriminasi; pada MASYARAKAT menyebabkan perselisihan faham, keselamatan terancam dan taraf hidup merosot; dan pada NEGARA menyebabkan imej tercemar, patriotisme luntur, kestabilan tergugat serta tadbir urus kucar-kacir! Pada peringkat serantau pula, anggota negara ASEAN menubuhkan Deklarasi Hak Asasi Manusia ASEAN atau A.H.R.D. sejak tahun dua ribu dua belas untuk melindungi hak asasi antarabangsa! Namun ingat, setiap hak mempunyai BATASAN mengikut Perlembagaan: di bawah Perkara sembilan tentang kebebasan bergerak, rakyat tidak boleh memasuki kawasan larangan atas alasan keselamatan atau kesihatan; di bawah Perkara sepuluh, dilarang berhimpun tanpa izin pihak berkuasa; dan di bawah Perkara dua belas, hak pendidikan terjamin tanpa diskriminasi!","title":"7.1.3 & 7.1.4 Kesan Pengabaian, Batasan Hak & Deklarasi AHRD","acronym":"P9•P10•P12","hook":"Buka tab 'Perkara 9, 10, 12 & 13' dalam Makmal Perlembagaan di bawah!","mediaKey":"pm48_perlembagaan_spr","summary":"Kesan Pengabaian: Diri (tersisih, hilang hak), Masyarakat (konflik, taraf hidup susut), Negara (imej tercemar, tadbir urus kucar-kacir). AHRD (2012) = Deklarasi Hak Asasi Manusia ASEAN. Batasan Hak: Perkara 9 (sekatan keselamatan/kesihatan), Perkara 10 (izin berhimpun), Perkara 12 (pendidikan tanpa diskriminasi).","bullets":["Kesan Pengabaian Hak (SP 7.1.3): Diri (tersisih, dipandang rendah), Masyarakat (perselisihan faham, keselamatan terancam), Negara (imej tercemar, patriotik berkurang).","Kesan Pengabaian Tanggungjawab (SP 7.1.3): Diri (hak asasi hilang, diskriminasi), Masyarakat (taraf hidup terjejas), Negara (kestabilan tergugat, tadbir urus kucar-kacir).","Batasan Hak (SP 7.1.4) & AHRD (2012): Perkara 9 (larangan masuk zon sekatan keselamatan/kesihatan), Perkara 10 (larangan berhimpun tanpa kebenaran), Perkara 12 (pendidikan tanpa diskriminasi); AHRD melindungi hak di peringkat ASEAN sejak 2012."],"labId":"pm48_perlembagaan_lab","labTitle":"Semak Batasan Hak Perkara 9, 10 & 12","labProps":{"art":"p9_13"},"examTip":"Bezakan Perkara 9 (kebebasan bergerak / sekatan zon keselamatan & kesihatan) dengan Perkara 10 (kebebasan bersuara & berhimpun dengan kebenaran)!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Bina Huraian Batasan Hak Perlembagaan","voiceCaption":"Susun frasa untuk menghuraikan batasan Perkara 9 dan Perkara 10 demi keamanan negara.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan keperluan batasan hak dalam Perlembagaan Persekutuan!","prompt":"Susun frasa berikut mengenai batasan hak sebagai warganegara:","hint":"Hak warganegara mempunyai batasan agar individu tidak menyalahi...","answerTokens":["Hak warganegara mempunyai batasan agar individu tidak menyalahi Perlembagaan Persekutuan,","termasuk mematuhi sekatan zon keselamatan atau kesihatan di bawah Perkara 9","serta tidak berhimpun tanpa kebenaran pihak berkuasa di bawah Perkara 10."],"distractors":["untuk menghalang kanak-kanak daripada menerima pendidikan di sekolah","supaya semua warganegara tidak perlu membayar cukai harta"],"explanation":"Batasan hak mengimbangi kebebasan individu dengan ketenteraman dan keselamatan awam."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kesan Mengabaikan Pembayaran Cukai & Peraturan","voiceCaption":"Ramalkan implikasi kepada negara sekiranya majoriti rakyat mengabaikan tanggungjawab membayar cukai serta melanggar peraturan.","voiceScript":"[curious] Ramalkan kesan terhadap tadbir urus dan pembangunan negara apabila ramai warganegara mengelak membayar cukai pendapatan serta melanggar undang-undang!","hook":"Hubungkan Perkara 13 dengan kesan pengabaian SP 7.1.3!","scenario":"Ramai rakyat enggan membayar cukai dan mengabaikan peraturan jalan raya serta alam sekitar.","prompt":"Apakah kesan jangka panjang pengabaian tanggungjawab tersebut kepada negara?","options":["Hasil pendapatan negara berkurang, kemudahan awam terbantut, tadbir urus menjadi kucar-kacir dan kestabilan negara tergugat","Taraf hidup rakyat meningkat mendadak tanpa peruntukan kerajaan","Imej negara dipuji sebagai negara paling berdisiplin di dunia","Semua kes jenayah dan diskriminasi terhapus secara automatik"],"correctIndex":0,"proofLabId":"pm48_perlembagaan_lab","proofState":{"art":"p9_13"},"explanation":"Tanggungjawab cukai dan kepatuhan undang-undang membiayai hospital, sekolah dan menjamin ketenteraman negara."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Deklarasi Hak Asasi ASEAN (AHRD)","voiceCaption":"Kenal pasti tahun penubuhan serta tujuan utama Deklarasi Hak Asasi Manusia ASEAN (AHRD).","voiceScript":"[excited] Uji maklumat Info Tambahan mengenai Deklarasi Hak Asasi Manusia ASEAN!","prompt":"Apakah tujuan utama penubuhan Deklarasi Hak Asasi Manusia ASEAN (AHRD) sejak tahun 2012?","options":["Memberikan perlindungan hak asasi manusia secara kolektif di peringkat serantau dan antarabangsa dalam kalangan negara anggota ASEAN","Menyekat kanak-kanak Orang Asli daripada menghadiri sekolah awam","Memansuhkan sistem pilihan raya di Asia Tenggara","Mewajibkan kerja paksa di semua negara anggota ASEAN"],"correctIndex":0,"explanation":"AHRD (2012) menjadi kerangka perlindungan hak asasi manusia bagi negara anggota ASEAN."}]},{"id":"pm48-u3","title":"Unit 3: Akta Orang Asli 1954, SUHAKAM & Mother Mangalam","subtitle":"Pengukuhan & Penilaian — Seksyen 6/17/19 Akta 134, Peranan SUHAKAM, Mother Mangalam (1949), SPR & Kelestarian","iconType":"globe","iconUrl":"../assets/icons/pm48-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Akta Orang Asli 1954, SUHAKAM & Mother Mangalam","voiceCaption":"Kerajaan melindungi hak Orang Asli melalui Akta 134, SUHAKAM memantau hak asasi, manakala tokoh seperti Mother Mangalam membela anak yatim sejak 1949.","voiceScript":"[warm] Selamat datang ke Unit tiga! Mari kita teliti contoh pengisian konkrit dalam buku teks Unit lapan! Pertama, perlindungan masyarakat Orang Asli seperti kaum Semai daripada rumpun bangsa Senoi di Pos Sinderut di bawah AKTA ORANG ASLI seribu sembilan ratus lima puluh empat atau Akta seratus tiga puluh empat: Seksyen enam melarang tanah kawasan Orang Asli dipajak atau diberi milik tanpa rundingan Pesuruhjaya; Seksyen tujuh belas melarang sebarang halangan terhadap kanak-kanak Orang Asli untuk belajar di sekolah; dan Seksyen sembilan belas mewujudkan perkampungan serta rizab Orang Asli! Kedua, peranan Suruhanjaya Hak Asasi Manusia Malaysia atau SUHAKAM meningkatkan kesedaran hak dan tanggungjawab rakyat! Ketiga, ketokohan Datin Paduka Dr. Mother A. Mangalam selaku Presiden The Pure Life Society yang ditubuhkan pada tahun seribu sembilan ratus empat puluh sembilan bersama Swami Satyananda sebagai rumah kebajikan bukan kerajaan pertama di Malaysia yang membela lebih dua ribu anak yatim tanpa mengira kaum! Keempat, tanggungjawab alam sekitar termasuk larangan straw plastik mulai satu Januari dua ribu dua puluh serta usaha menghentikan pembaziran tiga ribu tan metrik makanan setiap hari!","title":"Akta Orang Asli 1954 (Akta 134), SUHAKAM, Mother Mangalam & Alam","acronym":"134•SKM•MM","hook":"Buka kedua-dua tab Makmal Akta & Tokoh di bawah untuk menyemak seksyen penting!","mediaKey":"pm48_hak_orang_asli","summary":"Akta Orang Asli 1954 (Akta 134): S.6(2)(iii) lindungi tanah; S.17(1) hak sekolah kanak-kanak; S.19(1)(a) rizab Orang Asli. SUHAKAM = kesedaran hak asasi. Mother Mangalam = Pure Life Society (1949, >2,000 anak yatim). Straw plastik dilarang (1 Jan 2020); 3,000 tan makanan dibazir/hari.","bullets":["Akta Orang Asli 1954 (Akta 134): Seksyen 6(2)(iii) (tiada pindah milik/pajak tanah Orang Asli tanpa runding Pesuruhjaya); Seksyen 17(1) (kanak-kanak Orang Asli tak boleh dihalang belajar di sekolah); Seksyen 19(1)(a) (pewujudan rizab Orang Asli).","Mother Mangalam & Pure Life Society (1949): Ditubuhkan bersama Swami Satyananda sebagai rumah kebajikan NGO pertama Malaysia membantu >2,000 anak yatim pelbagai kaum.","SUHAKAM, SPR & Alam Sekitar: SUHAKAM (video Peluang/Roda/Kasih Sayang); SPR (simulasi pilihan raya); larangan straw plastik (1 Jan 2020) & isu 3,000 tan metrik makanan dibuang setiap hari + aduan bauksit kepada Jabatan Alam Sekitar."],"labId":"pm48_akta_tokoh_sim","labTitle":"Makmal Akta Orang Asli 1954, SUHAKAM & Mother Mangalam","labProps":{"tab":"orangasli"},"examTip":"Nama tokoh Mother Mangalam & Pure Life Society (1949) serta Seksyen 17(1) Akta 134 ialah isi berimpak tinggi bagi soalan esei contoh tanggungjawab warganegara!"},{"type":"match","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan Akta 134, Agensi & Tokoh Negara","voiceCaption":"Padankan lima peruntukan undang-undang, tokoh dan agensi dalam buku teks dengan peranannya.","voiceScript":"[confident] Padankan kesemua akta, tokoh dan agensi dalam Unit lapan ini!","prompt":"Padankan peruntukan atau institusi berikut dengan peranannya:","pairs":[{"id":"pm48u3m1","left":"Seksyen 17(1) Akta Orang Asli 1954","right":"Menjamin tiada kanak-kanak Orang Asli dihalang daripada belajar di sekolah"},{"id":"pm48u3m2","left":"Seksyen 6(2)(iii) Akta 134","right":"Melindungi tanah kawasan Orang Asli daripada dipajak tanpa rundingan Pesuruhjaya"},{"id":"pm48u3m3","left":"Mother Mangalam (Pure Life Society 1949)","right":"Menubuhkan rumah kebajikan NGO pertama membela >2,000 anak yatim pelbagai kaum"},{"id":"pm48u3m4","left":"SUHAKAM","right":"Suruhanjaya memupuk kesedaran dan memantau hak asasi manusia di Malaysia"},{"id":"pm48u3m5","left":"Suruhanjaya Pilihan Raya (SPR)","right":"Mengendalikan pendaftaran pemilih dan perjalanan pilihan raya secara adil"}],"explanation":"Kesemua institusi dan akta ini menjadi mekanisme rasmi menjaga hak serta demokrasi rakyat."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tindakan Pencemaran Bauksit & Pilihan Raya","voiceCaption":"Ramalkan saluran rasmi yang patut digunakan oleh warganegara apabila berhadapan pencemaran perlombongan bauksit serta tanggungjawab semasa hari mengundi.","voiceScript":"[curious] Kawasan tempat tinggal anda mengalami pencemaran udara akibat perlombongan bauksit tidak terkawal. Apakah tindakan warganegara yang bertanggungjawab?","hook":"Ingat saluran e-aduan rasmi yang dicadangkan pada muka surat 121 buku teks!","scenario":"Lori perlombongan bauksit menyebabkan debu merah tebal mencemari udara dan menjejaskan kesihatan penduduk setempat.","prompt":"Apakah saluran dan tindakan paling tepat sebagai warganegara bertanggungjawab?","options":["Mengumpul bukti gambar dan menyalurkan aduan rasmi melalui portal e-aduan Jabatan Alam Sekitar serta pihak berkuasa tempatan","Membakar lori lombong di tepi jalan secara senyap","Membazirkan air dan membuang sampah plastik bersama debu bauksit","Berdiam diri kerana penjagaan alam sekitar bukan tanggungjawab rakyat"],"correctIndex":0,"proofLabId":"pm48_akta_tokoh_sim","proofState":{"tab":"mangalam"},"explanation":"Menyalurkan aduan melalui e-aduan Jabatan Alam Sekitar mematuhi undang-undang dan menjaga kelestarian alam sekitar."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: Hak Mengundi vs Mesyuarat Syarikat","voiceCaption":"Pilih penyelesaian tepat apabila syarikat mengarahkan mesyuarat pada hari pilihan raya umum.","voiceScript":"[excited] Uji dilema pekerjaan vs hak mengundi dalam buku teks muka surat 126!","prompt":"Pada hari Pilihan Raya Umum, majikan mengarahkan anda menghadiri mesyuarat syarikat. Bagaimanakah tindakan warganegara yang bertanggungjawab?","options":["Berbincang secara sopan dengan majikan agar diberi pelepasan masa mengundi (hak undang-undang pemilih) sebelum atau selepas mesyuarat supaya kedua-dua kewajipan negara dan kerja terlaksana","Mengoyakkan kertas undi dan menghasut rakan sekerja tidak mengundi","Menipu majikan dengan mengambil cuti sakit palsu selama seminggu","Membiarkan hak mengundi terlepas kerana tidak mahu berbincang dengan majikan"],"correctIndex":0,"explanation":"Setiap warganegara berhak menunaikan tanggungjawab mengundi dan boleh menguruskan masa secara berhemah bersama majikan."}]},{"id":"pm48-u4","title":"Unit 4: Perasaan & Dilema Lagu Negaraku vs Kecemasan","subtitle":"SP 7.1.5 & 7.1.6 — Perasaan Gembira & Bersyukur, Misi Bantuan Banjir, Dilema Kawad Kaki & Tanggungjawab Sosial","iconType":"flag","iconUrl":"../assets/icons/pm48-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Perasaan, Misi Banjir & Dilema Lagu Negaraku","voiceCaption":"Menunaikan hak dan tanggungjawab melahirkan perasaan gembira dan bersyukur, sambil mengutamakan keselamatan nyawa apabila rakan pengsan semasa lagu Negaraku.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut buku teks muka surat seratus lapan belas, apabila setiap individu memahami hak, tanggungjawab serta batasannya dalam negara aman, lahirlah perasaan GEMBIRA dan BERSYUKUR! Mari kita analisis satu dilema moral popular buku teks pada muka surat seratus dua puluh lima: semasa menyertai pertandingan kawad kaki dan berdiri tegak menyanyikan lagu Negaraku, tiba-tiba seorang rakan pasukan jatuh pengsan! Apakah tindakan yang patut diambil? Walaupun menghormati lagu Negaraku adalah kewajipan patriotik, MENYELAMATKAN NYAWA DAN KESIHATAN RAKAN YANG PENGSAN adalah lebih mendesak atas dasar nilai kasih sayang, baik hati dan tanggungjawab kemanusiaan — selepas memapahnya ke tempat teduh dan memanggil pegawai perubatan, kita tetap menunjukkan hormat kepada lagu kebangsaan! Selain itu, amalan harian merangkumi menyertai misi bantuan banjir dan tidak membazirkan makanan!","title":"7.1.5 & 7.1.6 Perasaan, Bantuan Bencana & Dilema Kawad Kaki","acronym":"G•B•N•R","hook":"Buka galeri arkib Unit 8 di bawah untuk mengimbas visual Perlembagaan dan tokoh kemanusiaan!","mediaKey":"pm48_mother_mangalam","summary":"Perasaan (SP 7.1.5): gembira dan bersyukur. Dilema lagu Negaraku vs rakan pengsan: utamakan menyelamatkan rakan yang pengsan (nyawa lebih utama) lalu serahkan kepada pasukan perubatan sambil kekal menghormati lagu. Amalan: misi banjir, undi SPR & elak pembaziran.","bullets":["Perasaan Moral (SP 7.1.5): Gembira, bangga dan bersyukur dapat hidup dalam negara aman yang melindungi hak rakyat.","Dilema Kawad Kaki & Lagu Negaraku: Segera membantu atau memberi isyarat kepada pasukan perubatan/guru bertugas menyelamatkan rakan yang pengsan kerana nyawa lebih utama daripada kekal berdiri kaku tanpa bertindak.","Amalan Harian (SP 7.1.6): Misi kemanusiaan bencana banjir (kewangan, perubatan, makanan, pakaian), mengurangkan pembaziran makanan dan mematuhi peraturan."],"labId":"pm48_galeri_arkib","labTitle":"Galeri Arkib Visual Hak & Tanggungjawab","examTip":"Dalam dilema rakan pengsan semasa lagu Negaraku, jelaskan bahawa tindakan membantu rakan pengsan mencerminkan keutamaan prinsip keprihatinan menyelamatkan nyawa tanpa niat menghina lagu kebangsaan!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Bina Penyelesaian Dilema Lagu Negaraku","voiceCaption":"Susun frasa untuk menghuraikan tindakan bermoral sekiranya rakan jatuh pengsan semasa menyanyikan lagu Negaraku.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan penyelesaian dilema kawad kaki lagu Negaraku!","prompt":"Susun frasa berikut menjadi jawapan tepat bagi dilema kawad kaki:","hint":"Walaupun berdiri tegak menghormati lagu Negaraku itu wajib...","answerTokens":["Walaupun berdiri tegak menghormati lagu Negaraku adalah tanda patriotik,","nyawa dan keselamatan rakan yang pengsan mesti diutamakan dengan membantunya ke tempat selamat","dan memanggil pegawai perubatan berhampiran tanpa mengabaikan adab hormat."],"distractors":["kita patut membiarkan rakan tersebut terbaring pengsan tanpa pertolongan selama setengah jam","semua peserta kawad mesti menertawakan rakan yang pengsan itu"],"explanation":"Prinsip keprihatinan memelihara nyawa mengimbangi peraturan berdiri tegak semasa kecemasan perubatan."},{"type":"sort","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Isih Hak vs Tanggungjawab Mangsa Banjir & Pekerja","voiceCaption":"Kelaskan enam butiran misi bantuan banjir dan hak pekerja berikut antara Hak Diterima dengan Tanggungjawab Dilaksanakan.","voiceScript":"[confident] Asingkan hak yang patut diterima daripada tanggungjawab yang wajar dilaksanakan dalam situasi komuniti!","prompt":"Isihkan pernyataan berikut antara Hak dengan Tanggungjawab:","buckets":[{"id":"hak","label":"Hak yang Wajar Diperoleh"},{"id":"tj","label":"Tanggungjawab Warganegara"}],"items":[{"text":"Mangsa banjir menerima bekalan makanan, pakaian, ubat dan pusat pemindahan selamat","bucketId":"hak","note":"Tepat! Hak asasi keperluan asas ketika bencana."},{"text":"Pekerja sekolah mendapat gaji tepat masa, cuti rehat dan keselamatan tempat kerja","bucketId":"hak","note":"Betul! Hak pekerja mengikut undang-undang."},{"text":"Sukarelawan dan rakyat menyumbang dana, tenaga serta mematuhi arahan berpindah banjir","bucketId":"tj","note":"Tepat! Tanggungjawab kemasyarakatan bersama."},{"text":"Pekerja melaksanakan tugas dengan jujur, berdisiplin dan menjaga harta sekolah","bucketId":"tj","note":"Betul! Tanggungjawab terhadap majikan dan komuniti."},{"text":"Kanak-kanak Orang Asli mendapat akses penuh belajar di sekolah tanpa diskriminasi","bucketId":"hak","note":"Tepat! Dijamin oleh Perkara 12 dan Akta 134."},{"text":"Mengurangkan pembaziran makanan harian dan mengasingkan sisa kitar semula","bucketId":"tj","note":"Betul! Tanggungjawab menjaga kelestarian alam."}],"explanation":"Keseimbangan hak yang dilindungi dan tanggungjawab yang ditunaikan melahirkan warganegara cemerlang."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Perasaan & Pembaziran Makanan","voiceCaption":"Pilih langkah tepat mengurangkan pembaziran 3,000 tan metrik makanan sehari mengikut tanggungjawab warganegara.","voiceScript":"[excited] Uji peranan pengguna menangani pembaziran tiga ribu tan metrik makanan setiap hari!","prompt":"Menurut laporan yang dipetik dalam buku teks, rakyat Malaysia membuang sekurang-kurangnya 3,000 tan metrik makanan masih elok setiap hari. Apakah amalan tanggungjawab terbaik untuk menanganinya?","options":["Merancang pembelian makanan mengikut keperluan sebenar, mengambil hidangan secukupnya dan menyalurkan lebihan makanan bersih kepada bank makanan","Membeli sebanyak mungkin makanan semasa jualan murah walaupun separuh daripadanya akan dibuang","Membuang makanan ke dalam sungai bersama straw plastik","Menganggap pembaziran makanan sebagai tanda kemewahan yang membanggakan"],"correctIndex":0,"explanation":"Amalan berjimat cermat dan merancang keperluan makanan mengurangkan kos sisa serta menyelamatkan sumber alam."}]},{"id":"pm48-u5","title":"Unit 5 (Boss): Misi Warganegara Berperlembagaan SPM","subtitle":"Penilaian Bersepadu Unit 8 — Perkara 5–13, Batasan Hak, AHRD, Akta 134, Mother Mangalam & Tanggungjawab Sivik","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"match","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Pusingan 1: Padanan Master Unit 8","voiceCaption":"Padankan lima konsep utama Unit 8 daripada Perkara Perlembagaan hingga Akta 134 dan AHRD.","voiceScript":  tergugat dan tadbir urus pentadbiran kucar-kacir","bucketId":"neg","note":"Betul! Kesan pengabaian tanggungjawab rakyat."},{"text":"Hak asasi individu hilang apabila tidak dipertahankan mengikut undang-undang","bucketId":"dm","note":"Tepat! Individu gagal menikmati perlindungan sah."},{"text":"Kerajaan sukar melaksanakan dasar pembangunan akibat kekurangan dana cukai","bucketId":"neg","note":"Betul! Mengganggu kelancaran dasar kerajaan."}],"explanation":"Kegagalan melaksanakan hak dan tanggungjawab merugikan diri, komuniti serta kestabilan negara."},{"type":"predict","xp":30,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Pusingan 3: Analisis Hak Masyarakat Pedalaman","voiceCaption":"Ramalkan strategi meningkatkan taraf hidup masyarakat pedalaman apabila hak pendidikan dan infrastruktur mereka diberi perhatian.","voiceScript":"[curious] Soalan Town Hall buku teks: apakah strategi terbaik untuk meningkatkan taraf hidup masyarakat pedalaman agar hak mereka tidak terpinggir?","hook":"Gabungkan hak pendidikan Perkara 12, Seksyen 17 Akta 134 serta infrastruktur asas!","scenario":"Sebuah perkampungan masyarakat pedalaman masih kekurangan kemudahan sekolah menengah, klinik kesihatan dan liputan Internet.","prompt":"Apakah strategi paling berkesan oleh kerajaan bersama rakyat untuk memperkasa komuniti pedalaman tersebut?","options":["Membina prasarana pendidikan, jalan perhubungan, klinik desa dan latihan kemahiran ekonomi sambil mengekalkan perlindungan tanah rizab mereka di bawah Akta 134","Menghalang kanak-kanak pedalaman daripada memasuki sekolah awam","Memajak semua tanah kampung mereka kepada syarikat luar tanpa rundingan","Membiarkan mereka tanpa capaian kesihatan dan air bersih"],"correctIndex":0,"proofLabId":"pm48_akta_tokoh_sim","proofState":{"tab":"orangasli"},"explanation":"Akses pendidikan, infrastruktur asas dan perlindungan rizab tanah menaikkan taraf hidup sambil menghormati hak asal."},{"type":"wordbank","xp":30,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Pusingan 4: Rumusan Warganegara Bertanggungjawab","voiceCaption":"Susun frasa untuk merumuskan keseimbangan hak asasi Perlembagaan, batasan undang-undang dan tanggungjawab sivik.","voiceScript":"[confident] Pusingan keempat! Susun frasa bagi membina rumusan penutup Unit lapan.","prompt":"Susun frasa berikut menjadi rumusan lengkap Unit 8:","hint":"Warganegara bertanggungjawab memahami haknya di bawah Perlembagaan...","answerTokens":["Warganegara bertanggungjawab memahami haknya di bawah Perlembagaan serta mematuhi batasannya,","menunaikan kewajipan seperti membayar cukai, mengundi dan menjaga alam sekitar,","demi mengekalkan kemakmuran serta keamanan Malaysia."],"distractors":["dengan menyalahgunakan MyKad palsu dan melarang pendidikan Orang Asli","untuk berhimpun secara haram tanpa menghiraukan keselamatan awam"],"explanation":"Keseimbangan hak, batasan undang-undang dan tanggungjawab mengukuhkan demokrasi Malaysia."},{"type":"mcq","xp":35,"voiceIdKey":"u5-s5","voiceToneLabel":"Cabaran Akhir Boss Unit 8","voiceCaption":"Pilih pernyataan menyeluruh yang benar bagi menamatkan Unit 8 Hak dan Tanggungjawab Warganegara.","voiceScript":"[celebratory] Soalan akhir Boss Unit lapan! Pilih gabungan fakta paling tepat.","prompt":"Manakah gabungan pernyataan yang BENAR mengenai Unit 8?","options":["Perkara 8 menjamin kesamarataan, Perkara 10 memerlukan izin pihak berkuasa untuk berhimpun, Akta Orang Asli 1954 melindungi tanah & pendidikan Orang Asli, dan Pure Life Society diasaskan oleh Mother Mangalam pada 1949","Perkara 13 melarang warganegara membayar cukai harta kepada kerajaan","Larangan straw plastik konvensional dimansuhkan pada 1 Januari 2020","AHRD ditubuhkan oleh Pertubuhan Negara Eropah pada tahun 1949"],"correctIndex":0,"proofLabId":"pm48_galeri_arkib","explanation":"Tahniah! Kamu telah berjaya menamatkan Unit 8 Hak dan Tanggungjawab Warganegara!"}]}]};</script>

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
