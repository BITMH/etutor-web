/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);

  border: 2px solid rgba(255, 255, 255, 0.65);

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab09","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":9,"title":"Perpaduan Masyarakat Asas Kemakmuran Negara","subtitle":"Bidang 7 Unit 9 — 6 Amalan Perpaduan, Peranan Agensi (JPNIN, KRT, JKKN, JaPen), 3 Elemen DSKP, Perkara 152 & Permainan Tradisional","estimatedMinutes":30,"themeAccent":"#0d9488","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab09-labs.js","coverIcon":"../assets/icons/pm49-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Penghayatan perpaduan dan keharmonian kaum kamu amat baik.","combo":"[excited] Hebat! Jawapan berurutan membuktikan kesedaran perpaduan nasional yang tinggi.","encourage":"[gentle] Cuba semak semula peranan empat agensi kerajaan serta tiga elemen perpaduan DSKP.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit sembilan Perpaduan Masyarakat Asas Kemakmuran Negara!"},"units":[{"id":"pm49-u1","title":"Unit 1: Contoh Amalan & 3 Elemen Perpaduan","subtitle":"SP 7.2.1 & 7.2.3 — Enam Amalan Harian Perpaduan, Hari Gawai, 3 Elemen DSKP (Menerima, Menghormati, Mengurus) & Kepentingan","iconType":"globe","iconUrl":"../assets/icons/pm49-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"6 Amalan, 3 Elemen & Kepentingan Perpaduan","voiceCaption":"Perpaduan ialah penyatuan masyarakat membentuk identiti nasional melalui enam amalan harian dan tiga elemen iaitu menerima, menghormati serta mengurus kepelbagaian.","voiceScript":"[warm] Selamat datang ke Unit sembilan: Perpaduan Masyarakat Asas Kemakmuran Negara! Lima nilai cadangan unit ini ialah Toleransi, Kerjasama, Baik Hati, Hormat dan Kasih Sayang. Perpaduan bermaksud penyatuan masyarakat dalam membentuk satu identiti nasional dan nilai bersama! Enam contoh amalan perpaduan di Malaysia ialah menjaga keselamatan penduduk melalui rondaan kejiranan, menyertai aktiviti patriotik mengibarkan Jalur Gemilang, bersukan menyokong pasukan negara, memelihara kelestarian alam, menghadiri majlis keramaian rumah terbuka atau sambutan Hari Gawai, serta aktiviti kesukarelawanan membantu mangsa bencana! Menurut D.S.K.P., perpaduan digerakkan oleh tiga elemen: Menerima kepelbagaian dengan toleransi dan kerjasama; Menghormati kepelbagaian dengan hemah tinggi dan prihatin; serta Mengurus kepelbagaian dengan amanah, adil dan rasional! Kepentingannya termasuklah meningkatkan keyakinan pelabur asing, mengukuhkan ekonomi serta mengekalkan kedaulatan dan keselamatan negara!","title":"7.2.1 & 7.2.3 Amalan Perpaduan, 3 Elemen DSKP & Kepentingan","acronym":"M•M•M","hook":"Klik tab dalam Makmal Perpaduan di bawah untuk meneliti 3 Elemen DSKP dan contohnya!","mediaKey":"pm49_perpaduan_kaum","summary":"6 Amalan: keselamatan penduduk, patriotik, sukan, kelestarian alam, majlis keramaian (rumah terbuka/Hari Gawai), kesukarelawanan. 3 Elemen DSKP: Menerima, Menghormati & Mengurus kepelbagaian. Kepentingan: pelabur asing yakin, ekonomi kukuh, kedaulatan terpelihara.","bullets":["6 Amalan Perpaduan (SP 7.2.1): Keselamatan penduduk (rondaan), aktiviti patriotik (Jalur Gemilang), sukan, kelestarian alam, majlis keramaian (rumah terbuka/Hari Gawai) dan kesukarelawanan.","3 Elemen Perpaduan DSKP: Menerima kepelbagaian (toleransi, kerjasama, terbuka); Menghormati kepelbagaian (hemah tinggi, menghargai, prihatin); Mengurus kepelbagaian (amanah, adil, rasional).","5 Kepentingan (SP 7.2.3): Keyakinan pelabur asing, mengukuhkan ekonomi, mengekalkan kedaulatan & keselamatan, kemudahan berkualiti dan hidup harmoni."],"labId":"pm49_elemen_perpaduan_lab","labTitle":"Makmal 3 Elemen & Amalan Perpaduan","labProps":{"tab":"elemen"},"examTip":"Gunakan 3 Elemen Perpaduan DSKP — Menerima, Menghormati, Mengurus kepelbagaian — sebagai struktur isi esei perpaduan masyarakat majmuk!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 3 Elemen Perpaduan DSKP","voiceCaption":"Kelaskan enam sifat dan nilai berikut antara Menerima & Menghormati Kepelbagaian dengan Mengurus Kepelbagaian.","voiceScript":"[confident] Kelaskan keenam-enam nilai elemen perpaduan D.S.K.P. ini dengan tepat!","prompt":"Isihkan nilai elemen perpaduan berikut:","buckets":[{"id":"mh","label":"Menerima & Menghormati Kepelbagaian"},{"id":"urus","label":"Mengurus Kepelbagaian"}],"items":[{"text":"Bertoleransi, bekerjasama dan bersikap terbuka terhadap budaya jiran","bucketId":"mh","note":"Tepat! Nilai di bawah elemen Menerima kepelbagaian."},{"text":"Berhemah tinggi, menghargai dan prihatin terhadap perayaan kaum lain","bucketId":"mh","note":"Betul! Nilai di bawah elemen Menghormati kepelbagaian."},{"text":"Bersikap adil dan amanah ketika mengagihkan sumber atau peluang komuniti","bucketId":"urus","note":"Tepat! Nilai teras elemen Mengurus kepelbagaian."},{"text":"Bertindak rasional menyelesaikan isu sensitif perkauman tanpa emosi","bucketId":"urus","note":"Betul! Mengurus kepelbagaian secara bijaksana."},{"text":"Menyertai acara rumah terbuka Hari Gawai dan Deepavali rakan dengan mesra","bucketId":"mh","note":"Tepat! Menghargai dan menerima tradisi kaum lain."},{"text":"Menetapkan garis panduan adil dalam penganjuran sukan sekolah pelbagai kaum","bucketId":"urus","note":"Betul! Pengurusan saksama oleh jawatankuasa."}],"explanation":"Menerima (toleransi, kerjasama, terbuka), Menghormati (hemah tinggi, menghargai, prihatin) dan Mengurus (amanah, adil, rasional)."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Amalan Perpaduan & Contoh Konkrit","voiceCaption":"Padankan lima bidang amalan perpaduan berikut dengan contoh aktivitinya dalam buku teks.","voiceScript":"[confident] Padankan kelima-lima bidang amalan perpaduan berikut dengan contoh tepatnya!","prompt":"Padankan bidang amalan perpaduan berikut dengan contohnya:","pairs":[{"id":"pm49u1m1","left":"Keselamatan penduduk","right":"Membuat rondaan di kawasan kediaman dan berkomunikasi melalui media sosial"},{"id":"pm49u1m2","left":"Aktiviti patriotik","right":"Menyertai sambutan kemerdekaan serta mengibarkan Jalur Gemilang"},{"id":"pm49u1m3","left":"Majlis keramaian","right":"Menghadiri rumah terbuka Aidilfitri, Tahun Baharu Cina dan Hari Gawai"},{"id":"pm49u1m4","left":"Sukan negara","right":"Sokongan padu rakyat pelbagai kaum kepada pasukan kebangsaan"},{"id":"pm49u1m5","left":"Kesukarelawanan & Alam","right":"Gotong-royong kelestarian alam dan membantu mangsa bencana bersama"}],"explanation":"Pelbagai aktiviti harian menjadi platform penyatuan rakyat berbilang bangsa."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Kepentingan Ekonomi Perpaduan","voiceCaption":"Kenal pasti kesan ekonomi positif hasil perpaduan rakyat Malaysia.","voiceScript":"[excited] Uji pengetahuan kamu tentang hubungan perpaduan dengan ekonomi negara!","prompt":"Bagaimanakah amalan perpaduan dalam masyarakat majmuk membantu memakmurkan ekonomi Malaysia?","options":["Menjamin kestabilan politik dan keamanan sekali gus meningkatkan keyakinan pelabur asing serta pelancongan","Mengurangkan keperluan rakyat menikmati kemudahan awam berkualiti","Mengasingkan setiap kaum dalam zon ekonomi tertutup","Meningkatkan konflik perkauman agar harga barang naik"],"correctIndex":0,"explanation":"Negara yang bersatu padu dan stabil menarik pelaburan asing yang mencipta pekerjaan serta kemudahan rakyat."}]},{"id":"pm49-u2","title":"Unit 2: Peranan 4 Agensi Kerajaan Pemupuk Perpaduan","subtitle":"SP 7.2.2 — Peranan JPNIN, Kawasan Rukun Tetangga (KRT), Jabatan Kebudayaan dan Kesenian Negara (JKKN) & Jabatan Penerangan (JaPen)","iconType":"shield","iconUrl":"../assets/icons/pm49-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Peranan 4 Agensi Pemupuk Perpaduan","voiceCaption":"Empat agensi kerajaan iaitu JPNIN, Kawasan Rukun Tetangga (KRT), JKKN dan Jabatan Penerangan bekerjasama memupuk perpaduan serta keharmonian kaum.","voiceScript":"[warm] Selamat datang ke Unit dua! Dalam buku teks muka surat seratus tiga puluh satu, empat agensi kerajaan memikul tugas utama memupuk perpaduan negara! Pertama, Jabatan Perpaduan Negara dan Integrasi Nasional atau J.P.N.I.N. mendidik masyarakat cinta perpaduan, mempromosikan keharmonian antara agama, menjalankan wacana kajian perhubungan kaum serta mengurus langkah intervensi perpaduan negara! Kedua, Kawasan Rukun Tetangga atau K.R.T. di bawah J.P.N.I.N. menganjurkan aktiviti muhibah kejiranan seperti pertandingan boling K.R.T., memantau isu konflik setempat serta menyediakan pengantaraan pendamaian perselisihan masyarakat! Ketiga, Jabatan Kebudayaan dan Kesenian Negara atau J.K.K.N. memulihara seni budaya warisan bangsa dan memacu ekonomi serta pelancongan melalui seni budaya! Keempat, Jabatan Penerangan Malaysia meningkatkan kefahaman serta sokongan rakyat terhadap dasar kerajaan ke arah negara bangsa yang bermaklumat dan bersatu padu!","title":"7.2.2 Peranan JPNIN, KRT, JKKN & Jabatan Penerangan Malaysia","acronym":"JPNIN•KRT•JKKN","hook":"Klik setiap satu daripada 4 agensi pada Simulator Agensi Perpaduan di bawah!","mediaKey":"pm49_agensi_jpnin","summary":"4 Agensi: JPNIN (wacana, keharmonian agama & intervensi perpaduan), KRT (aktiviti kejiranan, rondaan keselamatan & pengantaraan pendamaian), JKKN (seni budaya warisan & pelancongan), Jabatan Penerangan (kefahaman dasar kerajaan & negara bangsa).","bullets":["JPNIN (Jabatan Perpaduan Negara & Integrasi Nasional): Mendidik cinta perpaduan, keharmonian antara agama, kajian perhubungan kaum dan langkah intervensi perpaduan nasional.","KRT (Kawasan Rukun Tetangga): Mengukuhkan kejiranan (cth. pertandingan boling KRT), memantau konflik setempat, keselamatan komuniti dan pengantaraan pendamaian pertikaian.","JKKN & Jabatan Penerangan Malaysia: JKKN memulihara seni budaya warisan dan menyokong pelancongan budaya; Jabatan Penerangan meningkatkan kefahaman rakyat terhadap dasar negara."],"labId":"pm49_agensi_perpaduan_sim","labTitle":"Simulator 4 Agensi Kerajaan Pemupuk Perpaduan","labProps":{"ag":"jpnin"},"examTip":"Jangan tertukar peranan JPNIN dan JKKN dalam SPM! JPNIN menumpukan integrasi nasional, dialog agama & intervensi konflik; JKKN menumpukan seni budaya warisan!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 4 Agensi Kerajaan dengan Tugasnya","voiceCaption":"Padankan agensi kerajaan berikut dengan peranan tepat masing-masing.","voiceScript":"[confident] Padankan kesemua agensi kerajaan pemupuk perpaduan ini dengan fungsinya!","prompt":"Padankan agensi kerajaan berikut dengan peranannya:","pairs":[{"id":"pm49u2m1","left":"JPNIN","right":"Promosi keharmonian antara agama, wacana kaum & intervensi perpaduan negara"},{"id":"pm49u2m2","left":"Kawasan Rukun Tetangga (KRT)","right":"Aktiviti kejiranan, rondaan keselamatan & pengantaraan pendamaian setempat"},{"id":"pm49u2m3","left":"JKKN","right":"Memulihara seni budaya warisan bangsa dan menyokong pelancongan budaya"},{"id":"pm49u2m4","left":"Jabatan Penerangan Malaysia","right":"Meningkatkan kefahaman rakyat terhadap dasar kerajaan ke arah negara bangsa"},{"id":"pm49u2m5","left":"Pertandingan Boling KRT Daerah","right":"Contoh program muhibah kejiranan yang menyatukan penduduk setempat"}],"explanation":"Keempat-empat agensi saling bekerjasama pada peringkat komuniti hingga dasar kebangsaan."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Bina Huraian Peranan KRT & JPNIN","voiceCaption":"Susun frasa untuk menghuraikan peranan KRT dalam menyelesaikan konflik kejiranan.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan peranan K.R.T. dan J.P.N.I.N.!","prompt":"Susun frasa untuk menerangkan peranan KRT dalam masyarakat:","hint":"Kawasan Rukun Tetangga berperanan mengukuhkan semangat kejiranan...","answerTokens":["Kawasan Rukun Tetangga berperanan mengukuhkan semangat kejiranan dan keselamatan setempat,","memantau serta melaporkan isu konflik masyarakat kepada pengarah,","serta menyediakan pengantaraan bagi mendamaikan pertikaian penduduk."],"distractors":["untuk menyebarkan isu perkauman dan menutup semua rumah terbuka","bagi menggantikan peranan Jabatan Penerangan dalam seni budaya"],"explanation":"KRT bertindak sebagai mata, telinga dan pengantara pendamaian di peringkat komuniti."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Peranan Pengantaraan KRT","voiceCaption":"Pilih fungsi khusus KRT apabila berlaku perselisihan faham antara jiran berlainan kaum.","voiceScript":"[excited] Uji pengetahuan kamu tentang fungsi pengantaraan K.R.T.!","prompt":"Apabila berlaku perselisihan kecil antara jiran di kawasan perumahan, bagaimanakah Kawasan Rukun Tetangga (KRT) membantu menyelesaikannya?","options":["Menyediakan pengantaraan secara aman bagi maksud pendamaian dan menyiasat isu konflik setempat untuk keharmonian bersama","Menghasut kedua-dua jiran supaya bertengkar di media sosial","Menghalau salah satu kaum keluar dari taman perumahan tanpa perbincangan","Mengadakan persembahan teater kebudayaan tanpa menyelesaikan pertikaian"],"correctIndex":0,"explanation":"Salah satu tugas rasmi KRT dalam buku teks muka surat 131 ialah pengantaraan bagi mendamaikan pertikaian masyarakat."}]},{"id":"pm49-u3","title":"Unit 3: Cabaran, Budaya Tular & Perkara 152","subtitle":"SP 7.2.4 & Pengayaan — 4 Cabaran Perpaduan, Budaya Tular Media Sosial, Perkara 152 Bahasa Kebangsaan & Sukan","iconType":"globe","iconUrl":"../assets/icons/pm49-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Cabaran Perpaduan, Budaya Tular & Perkara 152","voiceCaption":"Perpaduan dicabar oleh penyebaran maklumat palsu, penguasaan bahasa kebangsaan yang lemah, prejudis kaum dan budaya tular, yang ditangani melalui Perkara 152 dan perpaduan sukan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Usaha memupuk perpaduan berhadapan empat cabaran besar dalam buku teks: pertama, penyebaran maklumat palsu dan isu perkauman akibat penggunaan media sosial tanpa had atau budaya tular seperti memuat naik video negatif dan memburukkan agama kaum lain; kedua, penguasaan bahasa kebangsaan yang lemah; ketiga, sikap prejudis dan kurang toleransi terhadap kepelbagaian; dan keempat, kurang pemahaman serta kurang sensitif terhadap agama dan budaya kaum lain! Untuk memperkukuh perpaduan melalui bahasa, Perlembagaan Persekutuan 1957 Perkara seratus lima puluh dua Fasal satu menetapkan Bahasa Melayu sebagai Bahasa Kebangsaan, dan Akta Bahasa Kebangsaan 1963 atau 1967 menetapkannya sebagai bahasa rasmi negara! Selain itu, bidang sukan serta permainan tradisional seperti congkak, catur Cina, kabaddi dan tibow turut membuktikan nilai kebersamaan rakyat Malaysia!","title":"7.2.4 Cabaran, Budaya Tular, Perkara 152(1) & Permainan Tradisional","acronym":"P152•BT","hook":"Buka tab 'Cabaran & Perkara 152' dalam Makmal Perpaduan di bawah!","mediaKey":"pm49_bahasa_tradisional","summary":"4 Cabaran: berita palsu/budaya tular, bahasa kebangsaan lemah, prejudis, kurang faham agama/budaya lain. Perkara 152(1) Perlembagaan & Akta Bahasa Kebangsaan 1963/1967 = Bahasa Melayu Bahasa Kebangsaan & Rasmi. Permainan: congkak, catur Cina, kabaddi, tibow.","bullets":["4 Cabaran Perpaduan (SP 7.2.4): (1) Maklumat palsu & budaya tular perkauman; (2) Penguasaan bahasa kebangsaan lemah; (3) Prejudis & kurang menerima/menghormati/mengurus; (4) Kurang sensitif terhadap agama dan budaya kaum lain.","Bahasa Kebangsaan (Perkara 152 & Bicarawara): Perkara 152(1) Perlembagaan 1957 (Bahasa Melayu Bahasa Kebangsaan) dan Akta Bahasa Kebangsaan 1963/1967 (Bahasa Rasmi); bicarawara ialah rancangan temu bual hos dan tetamu.","Sukan & Permainan Tradisional: Menyokong pasukan negara mengatasi dilema sokongan luar negara; permainan congkak, catur Cina, kabaddi dan tibow memupuk muhibah."],"labId":"pm49_elemen_perpaduan_lab","labTitle":"Makmal Cabaran Budaya Tular & Perkara 152","labProps":{"tab":"cabaran"},"examTip":"Hafal punca perundangan Bahasa Melayu: Perkara 152(1) Perlembagaan Persekutuan (Bahasa Kebangsaan) dan Akta Bahasa Kebangsaan 1963/1967 (Bahasa Rasmi)!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Tindakan Mengatasi vs Memburukkan Cabaran","voiceCaption":"Kelaskan enam situasi media sosial dan bahasa berikut antara Memperkukuh Perpaduan dengan Cabaran Budaya Tular.","voiceScript":"[confident] Asingkan enam situasi ini antara pemangkin perpaduan dengan cabaran budaya tular!","prompt":"Isihkan situasi berikut mengikut kategorinya:","buckets":[{"id":"kukuh","label":"Memperkukuh Perpaduan"},{"id":"cabaran","label":"Cabaran & Budaya Tular"}],"items":[{"text":"Menggunakan bahasa Melayu dengan fasih dalam majlis rasmi dan perbualan pelbagai kaum","bucketId":"kukuh","note":"Tepat! Merealisasikan Perkara 152(1) sebagai bahasa perpaduan."},{"text":"Menganjurkan pertandingan congkak, catur Cina, kabaddi dan tibow bersama rakan","bucketId":"kukuh","note":"Betul! Memupuk persefahaman warisan pelbagai kaum."},{"text":"Memuat naik klip video sensitif yang memburukkan agama dan budaya kaum lain","bucketId":"cabaran","note":"Tepat! Contoh budaya tular yang menggugat perpaduan."},{"text":"Menulis komen negatif berbaur prasangka perkauman di ruangan berita dalam talian","bucketId":"cabaran","note":"Betul! Menimbulkan prejudis dan permusuhan."},{"text":"Menasihati rakan secara berhemah supaya memadamkan hantaran berunsur perkauman","bucketId":"kukuh","note":"Tepat! Peranan proaktif remaja menjaga keharmonian siber."},{"text":"Enggan mempelajari bahasa kebangsaan sehingga menyukarkan komunikasi harian","bucketId":"cabaran","note":"Betul! Melemahkan jambatan interaksi antara kaum."}],"explanation":"Bahasa kebangsaan, sukan dan penggunaan media sosial berhemah membendung budaya tular negatif."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tindakan Remaja Terhadap Komen Perkauman","voiceCaption":"Ramalkan tindakan pengguna media sosial beretika apabila rakan menyebarkan komen negatif menyentuh isu perkauman.","voiceScript":"[curious] Jika rakan anda berkongsi klip video atau komen negatif mengungkit isu perkauman di laman sosial, apakah tindakan yang patut anda ambil?","hook":"Gunakan gabungan emosi moral tenang, nasihat berhemah serta laporan kandungan!","scenario":"Rakan sekolah berkongsi komen menghina adat perayaan kaum lain di media sosial dan mengundang pertengkaran warganet.","prompt":"Apakah tindakan paling bertanggungjawab yang patut anda lakukan?","options":["Mengurus emosi secara rasional, menasihati rakan secara peribadi agar memadamkan hantaran itu kerana melanggar sensitiviti kaum, dan menyebarkan mesej keharmonian","Turut menulis komen memaki hamun rakan serta kaum lain dengan lebih kasar","Menularkan tangkap layar komen tersebut agar pertengkaran semakin besar","Menggalakkan rakan membuat akaun palsu untuk menyebarkan lebih banyak kebencian"],"correctIndex":0,"proofLabId":"pm49_elemen_perpaduan_lab","proofState":{"tab":"cabaran"},"explanation":"Menahan emosi marah dan menasihati rakan menghentikan penyebaran kebencian memelihara keharmonian."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: Maksud Bicarawara & Perkara 152","voiceCaption":"Pilih pernyataan tepat tentang Perkara 152(1) Perlembagaan Persekutuan dan Akta Bahasa Kebangsaan.","voiceScript":"[excited] Uji fakta perundangan Bahasa Kebangsaan dalam Unit sembilan!","prompt":"Apakah peranan Perkara 152(1) Perlembagaan Persekutuan 1957 dan Akta Bahasa Kebangsaan 1963/1967 dalam memupuk perpaduan?","options":["Menetapkan bahasa Melayu sebagai bahasa kebangsaan dan bahasa rasmi negara untuk menyatupadukan komunikasi pelbagai kaum tanpa menghapuskan bahasa ibunda","Melarang rakyat mempelajari mana-mana bahasa kaum atau bahasa antarabangsa lain","Menjadikan bahasa Melayu hanya terpakai di mahkamah antarabangsa","Memansuhkan semua permainan tradisional seperti congkak dan kabaddi"],"correctIndex":0,"explanation":"Bahasa kebangsaan berfungsi sebagai bahasa pengantara rasmi yang menyatukan seluruh rakyat Malaysia."}]},{"id":"pm49-u4","title":"Unit 4: Perasaan, Pendidikan & Amalan Bersatu Padu","subtitle":"SP 7.2.5 & 7.2.6 — Rasa Gembira & Bertolak Ansur, Pengelompokan Kriteria, Pendidikan Perpaduan & Permainan Tradisional","iconType":"flag","iconUrl":"../assets/icons/pm49-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Perasaan, Sukan & Peranan Institusi Pendidikan","voiceCaption":"Mengamalkan perpaduan melahirkan perasaan gembira dan saling bertolak ansur, manakala institusi pendidikan dan sukan menjadi wadah utama memupuk kebersamaan sejak muda.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut buku teks muka surat seratus tiga puluh empat, dengan adanya perpaduan, rakyat Malaysia hidup dalam suasana GEMBIRA dan saling BERTOLAK ANSUR antara satu sama lain! Bagaimana perpaduan dipupuk sejak bangku sekolah? Institusi pendidikan menjadi wadah paling wajar kerana murid berbilang kaum belajar di bawah satu bumbung, saling mengenali serta menjalin hubungan baik sejak muda — termasuk melalui aktiviti 'Pengelompokan Kriteria' yang membina rasa kebersamaan walaupun memiliki perbezaan latar belakang! Begitu juga dalam aktiviti sukan dan permainan tradisional seperti congkak, catur Cina, kabaddi dan tibow — apabila kita menyokong pasukan kebangsaan Malaysia walaupun meminati pasukan luar, semangat kebersamaan dan patriotisme semakin teguh!","title":"7.2.5 & 7.2.6 Perasaan, Institusi Pendidikan & Kebersamaan Sukan","acronym":"G•T•P•S","hook":"Buka galeri arkib Unit 9 di bawah untuk mengimbas visual perpaduan, Hari Gawai dan congkak!","mediaKey":"pm49_perpaduan_kaum","summary":"Perasaan (SP 7.2.5): gembira, bersyukur dan saling bertolak ansur. Wadah Pendidikan & Sukan (SP 7.2.6): sekolah satukan murid pelbagai kaum; sukan negara & permainan tradisional (congkak, catur Cina, kabaddi, tibow) memupuk kebersamaan.","bullets":["Perasaan Moral (SP 7.2.5): Gembira, bangga dan bertolak ansur apabila dapat menyertai perayaan kaum lain serta menyokong pasukan negara.","Peranan Institusi Pendidikan: Tempat murid pelbagai kaum bertemu, menimba ilmu dan membina persahabatan jangka panjang (Pengelompokan Kriteria).","Dilema Sukan Negara: Menyokong pasukan kebangsaan Malaysia apabila bertanding di peringkat antarabangsa sebagai tanda kesetiaan dan perpaduan."],"labId":"pm49_galeri_arkib","labTitle":"Galeri Arkib Visual Perpaduan Masyarakat","examTip":"Untuk soalan Penilaian B (perpaduan dalam pendidikan), nyatakan sebab sekolah berkesan: murid berinteraksi setiap hari, menyertai kokurikulum bersepadu & menimba ilmu bersama tanpa prejudis!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Bina Hujah Perpaduan Melalui Pendidikan","voiceCaption":"Susun frasa untuk melengkapkan peranan institusi pendidikan dalam menyemai perpaduan generasi muda.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan kepentingan aktiviti perpaduan di sekolah!","prompt":"Susun frasa berikut untuk menghuraikan peranan institusi pendidikan dalam perpaduan:","hint":"Institusi pendidikan merupakan wadah terbaik...","answerTokens":["Institusi pendidikan merupakan wadah terbaik untuk murid pelbagai kaum berjumpa dan menimba ilmu,","supaya mereka saling mengenal, bertolak ansur dan menjalin hubungan baik,","sekali gus menanam jiwa perpaduan dengan perasaan gembira sejak muda."],"distractors":["agar murid hanya bergaul dengan kaum sendiri tanpa toleransi","supaya perpaduan hanya diamalkan di bibir bukan di hati"],"explanation":"Pergaulan harian di bilik darjah dan kokurikulum membina kepercayaan merentas kaum."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Permainan Tradisional & Aktiviti Sekolah","voiceCaption":"Padankan lima aktiviti dan permainan tradisional berikut dengan impak perpaduannya.","voiceScript":"[confident] Padankan setiap permainan tradisional dan aktiviti perpaduan berikut dengan manfaatnya!","prompt":"Padankan aktiviti berikut dengan sumbangannya kepada perpaduan:","pairs":[{"id":"pm49u4m1","left":"Permainan congkak, catur Cina, kabaddi & tibow","right":"Memperkenalkan budaya warisan kaum berbeza sambil bersukan bersama"},{"id":"pm49u4m2","left":"Aktiviti Pengelompokan Kriteria","right":"Menemukan persamaan minat dan pilihan antara rakan pelbagai kaum"},{"id":"pm49u4m3","left":"Sokongan kepada pasukan negara","right":"Menyatukan penyokong pelbagai bangsa dengan semangat patriotisme"},{"id":"pm49u4m4","left":"Menghadiri sambutan Hari Gawai","right":"Menghargai adat tradisi masyarakat Sarawak dan mengeratkan silaturahim"},{"id":"pm49u4m5","left":"Program bicarawara bahasa kebangsaan","right":"Menggalakkan penggunaan bahasa Melayu sebagai bahasa perpaduan"}],"explanation":"Aktiviti budaya, bahasa dan sukan mengukuhkan perpaduan dari hati bukan sekadar di bibir."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Perpaduan Hanya Di Bibir","voiceCaption":"Pilih huraian paling tepat untuk mengubah perpaduan daripada slogan kepada amalan ikhlas di hati.","voiceScript":"[excited] Uji refleksi mendalam buku teks: 'Perpaduan hanya di bibir, bukan di hati.' Bagaimanakah kita membuktikan perpaduan sebenar?","prompt":"Bagaimanakah generasi muda membuktikan bahawa perpaduan masyarakat bukan sekadar 'di bibir sahaja', tetapi lahir ikhlas dari hati?","options":["Dengan mengamalkan tiga elemen menerima, menghormati dan mengurus kepelbagaian secara jujur dalam pergaulan harian, bukan hanya ketika musim kempen atau kamera","Hanya bergambar di majlis rumah terbuka tetapi menulis komen berbaur prejudis secara senyap","Enggan mengambil tahu adat kaum lain atau berinteraks function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var unlockedMap = { 0: true };
  var activeNodeIdx = 0;
  var mindMapBonusDone = false;

  var acronymPill = buildAcronymPillHtml(step, nodes);

  var formulaHtml = step.formula
    ? '<div class="concept-formula-box tabular-nums" role="note" tabindex="0"><span class="formula-kicker">' + tUi("RUMUS KILAT", "QUICK FORMULA") + "</span><span>" + escapeHtml(step.formula) + "</span></div>"
    : "";

  var labHtml = step.labId
    ? '<div class="lab-shell">' +
