/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx]:hover {

  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab10","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":10,"title":"Pengurusan Perbelanjaan Secara Beretika","subtitle":"Bidang 7 Unit 10 — Maksud & 6 Cara Pengurusan Perbelanjaan Beretika, 8 Hak Pengguna FOMCA, Kesan Pengabaian, Kajian Kes Pelan Prabayar vs Pascabayar & Karnival PIBG","estimatedMinutes":30,"themeAccent":"#059669","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab10-labs.js","coverIcon":"../assets/icons/pm410-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Keputusan kewangan dan kepenggunaan beretika kamu amat bijaksana.","combo":"[excited] Syabas! Jawapan berurutan membuktikan penguasaan bajet, hak pengguna dan pelaburan bijak.","encourage":"[gentle] Cuba semak semula perbezaan keperluan dengan kehendak serta lapan hak pengguna FOMCA.","celebrate":"[celebratory] Tahniah! Kamu telah menamatkan Unit sepuluh Pengurusan Perbelanjaan Secara Beretika!"},"units":[{"id":"pm410-u1","title":"Unit 1: Maksud & 6 Cara Menguruskan Perbelanjaan Secara Beretika","subtitle":"SP 7.3.1 & 7.3.2 — Definisi Pengurusan Perbelanjaan Beretika, Nilai Moral, 6 Cara Urus Wang & Dokumentasi Resit","iconType":"wallet","iconUrl":"../assets/icons/pm410-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Maksud & 6 Cara Pengurusan Perbelanjaan Beretika","voiceCaption":"Pengurusan perbelanjaan secara beretika bermaksud cara wang dibelanjakan dan diuruskan dengan berhemah melalui enam langkah termasuk bajet keperluan dan dokumentasi resit.","voiceScript":"[warm] Selamat datang ke Unit sepuluh: Pengurusan Perbelanjaan Secara Beretika! Lima nilai cadangan unit ini ialah Kesederhanaan, Bertanggungjawab, Berdikari, Rasional dan Kejujuran. Pengurusan perbelanjaan secara beretika bermaksud cara wang dibelanjakan dan diuruskan dengan berhemah untuk mendapatkan sesuatu barangan dan perkhidmatan! Terdapat enam cara menguruskan perbelanjaan secara beretika: pertama, menentukan kedudukan kewangan yang dimiliki agar tidak berhutang; kedua, mengenal pasti dan membuat anggaran perbelanjaan dengan mendahulukan keperluan berbanding kehendak serta menyimpan sampul bajet; ketiga, membeli barangan secara tunai atau kad debit, atau jika menggunakan kad kredit hendaklah melunaskan bayaran dalam tempoh bebas faedah; keempat, mendisiplinkan diri agar tidak membeli mengikut jenama semata-mata dan mencari alternatif harga berpatutan; kelima, tidak terpengaruh dengan jualan murah atau dalam talian tanpa perancangan; dan keenam, mendokumentasikan perbelanjaan serta menyimpan resit secara sistematik!","title":"7.3.1 & 7.3.2 Maksud & 6 Cara Urus Perbelanjaan Beretika","acronym":"6•K•T•D","hook":"Tonton video penerangan bersuara tentang bajet beretika, kemudian klik tab dalam Makmal Bajet di bawah!","mediaKey":"pm410_perbelanjaan_etika","videoClip":{"src":"../assets/pendidikan-moral-t4-bab10/video/pm410_video_perbelanjaan_beretika_narasi.mp4","hasNarration":true,"posterKey":"pm410_perbelanjaan_etika","caption":"Perancangan bajet, perbezaan keperluan vs kehendak dan amalan menabung secara beretika."},"summary":"Maksud: cara wang dibelanjakan dan diuruskan dengan berhemah. 6 Cara: tentukan kedudukan kewangan, anggar keperluan vs kehendak, beli tunai/kad debit atau lunas kad kredit dalam tempoh bebas faedah, disiplin diri tolak obsesi jenama, elak perangkap jualan murah/dalam talian, dokumentasikan resit.","bullets":["Maksud (SP 7.3.1): Cara wang dibelanjakan dan diuruskan dengan berhemah untuk mendapatkan barangan dan perkhidmatan berteraskan Kesederhanaan, Bertanggungjawab, Berdikari, Rasional dan Kejujuran.","6 Cara Beretika (SP 7.3.2): (1) Tentukan kedudukan kewangan, (2) Anggaran perbelanjaan utamakan keperluan, (3) Beli tunai/kad debit atau bayar kad kredit tanpa faedah, (4) Disiplin diri pilih kualiti bukan jenama semata-mata, (5) Rancang sebelum jualan murah/dalam talian, (6) Dokumentasi & simpan resit.","Amalan Harian Buku Teks: Gunakan sampul bajet berasingan untuk perbelanjaan mingguan serta tabung baki wang syiling kecil."],"labId":"pm410_bajet_etika_lab","labTitle":"Makmal Bajet & 6 Cara Urus Perbelanjaan","labProps":{"tab":"cara"},"examTip":"Dalam soalan esei cara mengurus perbelanjaan, sertakan kata kunci 'keperluan berbanding kehendak', 'tempoh bebas faedah kad kredit' dan 'mendokumentasikan resit'."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Amalan Beretika vs Tidak Beretika","voiceCaption":"Kelaskan enam tingkah laku kewangan berikut antara Pengurusan Perbelanjaan Beretika dengan Pengurusan Tidak Beretika.","voiceScript":"[confident] Kelaskan keenam-enam tindakan kewangan berikut dengan tepat!","prompt":"Isihkan tindakan perbelanjaan berikut mengikut kategorinya:","buckets":[{"id":"etika","label":"Pengurusan Beretika"},{"id":"boros","label":"Pengurusan Tidak Beretika"}],"items":[{"text":"Menentukan kedudukan kewangan dan membuat sampul bajet mengikut keperluan asas","bucketId":"etika","note":"Tepat! Langkah pertama dan kedua pengurusan berhemah."},{"text":"Membeli barang menggunakan wang tunai atau melunaskan kad kredit dalam tempoh bebas faedah","bucketId":"etika","note":"Betul! Mengelakkan caj faedah berganda dan hutang."},{"text":"Memborong sebanyak mungkin barang semasa iklan jualan murah tanpa senarai keperluan","bucketId":"boros","note":"Tepat! Terperangkap dengan muslihat jualan murah membawa pembaziran."},{"text":"Membeli kasut berjenama RM400 sekadar mengejar trend walaupun baru memiliki kasut baharu","bucketId":"boros","note":"Betul! Tidak mendisiplinkan diri dan mengutamakan kehendak."},{"text":"Menyimpan resit dan merekodkan setiap perbelanjaan harian dalam buku catatan","bucketId":"etika","note":"Tepat! Dokumentasi memudahkan rujukan serta bukti tuntutan ganti rugi."},{"text":"Membayar ansuran minimum kad kredit setiap bulan sehingga faedah terus meningkat","bucketId":"boros","note":"Betul! Membawa risiko keberhutangan dan muflis."}],"explanation":"Pengguna bijak merancang mengikut kemampuan sebenar dan menyimpan rekod resit."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Langkah Pengurusan & Tujuannya","voiceCaption":"Padankan lima amalan pengurusan perbelanjaan berikut dengan rasional moralnya.","voiceScript":"[confident] Padankan kelima-lima langkah pengurusan kewangan ini dengan tujuannya!","prompt":"Padankan amalan pengurusan kewangan berikut dengan tujuannya:","pairs":[{"id":"pm410u1m1","left":"Menentukan kedudukan kewangan dimiliki","right":"Memastikan perbelanjaan tidak melebihi pendapatan dan mengelak hutang"},{"id":"pm410u1m2","left":"Membuat anggaran perbelanjaan bulanan","right":"Mengutamakan keperluan asas terlebih dahulu berbanding kehendak"},{"id":"pm410u1m3","left":"Membeli secara tunai atau kad debit","right":"Berbelanja mengikut baki wang sedia ada tanpa caj faedah"},{"id":"pm410u1m4","left":"Mendokumentasikan perbelanjaan & resit","right":"Menjadi rujukan bajet akan datang dan bukti sekiranya barang rosak"},{"id":"pm410u1m5","left":"Menabung baki wang syiling kecil","right":"Melatih disiplin kesederhanaan dan jaminan kecemasan masa depan"}],"explanation":"Setiap langkah saling melengkapi bagi membentuk tabiat kewangan sihat sejak remaja."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Menilai Iklan Jualan Murah","voiceCaption":"Kenal pasti mengapa promosi 'beli sebanyak mungkin untuk penjimatan bulan seterusnya' dianggap tidak wajar.","voiceScript":"[excited] Uji pemikiran rasional kamu terhadap strategi iklan jualan murah!","prompt":"Sebuah iklan jualan murah menyarankan pengguna 'membeli sebanyak mungkin barangan sekarang untuk penjimatan bulan seterusnya'. Mengapakah tindakan menurut saranan ini tidak wajar?","options":["Menggalakkan pembelian barangan di luar keperluan dan berisiko melebihi anggaran kewangan serta menyebabkan pembaziran atau tarikh luput","Memastikan pengguna mendapat semua lapan hak FOMCA secara automatik","Menghapuskan keperluan menyimpan resit pembelian secara sistematik","Menjamin tiada penipuan dalam urus niaga dalam talian"],"correctIndex":0,"explanation":"Buku teks menegaskan pengguna perlu meneliti harga serta kualiti dan merancang pembelian sebelum terpengaruh dengan jualan murah."}]},{"id":"pm410-u2","title":"Unit 2: 8 Hak Pengguna FOMCA & Kepentingan Pengurusan Beretika","subtitle":"SP 7.3.3 & Info Tambahan — Lapan Hak Asasi Pengguna (FOMCA) & 5 Kepentingan Mengurus Perbelanjaan Secara Beretika","iconType":"shield","iconUrl":"../assets/icons/pm410-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"8 Hak Pengguna FOMCA & 5 Kepentingan Beretika","voiceCaption":"Pengguna dilindungi oleh lapan hak FOMCA daripada keperluan asas hingga alam sekitar selamat, manakala pengurusan beretika menjamin masa hadapan dan mengelak ditipu.","voiceScript":"[warm] Selamat datang ke Unit dua! Menurut Gabungan Persatuan-Persatuan Pengguna Malaysia atau F.O.M.C.A., terdapat lapan hak pengguna yang wajib kita ketahui: hak mendapatkan keperluan asas, hak mendapatkan keselamatan, hak mendapatkan maklumat, hak membuat pilihan, hak bersuara, hak mendapatkan ganti rugi, hak mendapatkan pendidikan pengguna, dan hak mendapatkan alam sekitar yang sihat dan selamat! Selain itu, terdapat lima kepentingan menguruskan perbelanjaan secara beretika: pertama, menjamin masa hadapan seperti menabung untuk pendidikan tinggi dan alam dewasa; kedua, mengelakkan pembaziran akibat pembelian ikut nafsu; ketiga, menjadi rujukan untuk perbelanjaan akan datang; keempat, mengelakkan diri daripada ditipu dalam urus niaga seperti skim cepat kaya atau jualan dalam talian palsu; dan kelima, mengurangkan bebanan hutang agar tidak terjerat dengan faedah tinggi!","title":"7.3.3 8 Hak Pengguna (FOMCA) & 5 Kepentingan Beretika","acronym":"8•FOMCA","hook":"Terokai kedua-dua kumpulan 8 Hak Pengguna pada Simulator FOMCA di bawah!","mediaKey":"pm410_hak_pengguna_fomca","summary":"8 Hak FOMCA: keperluan asas, keselamatan, maklumat, membuat pilihan, bersuara, ganti rugi, pendidikan pengguna, alam sekitar sihat & selamat. 5 Kepentingan: jamin masa hadapan, elak pembaziran, rujukan masa depan, elak ditipu, kurangkan bebanan hutang.","bullets":["8 Hak Pengguna (FOMCA): (1) Keperluan asas, (2) Keselamatan, (3) Maklumat, (4) Membuat pilihan, (5) Bersuara, (6) Ganti rugi, (7) Pendidikan pengguna, (8) Alam sekitar yang sihat dan selamat.","5 Kepentingan Urus Beretika (SP 7.3.3): (1) Menjamin masa hadapan (pendidikan/kecemasan), (2) Mengelakkan pembaziran, (3) Menjadi rujukan perbelanjaan akan datang, (4) Mengelakkan diri daripada ditipu, (5) Mengurangkan bebanan hutang.","Hubungan Resit & Hak Ganti Rugi: Menyimpan resit membolehkan pengguna menuntut hak ganti rugi sekiranya barangan rosak atau perkhidmatan gagal dipenuhi."],"labId":"pm410_fomca_sim","labTitle":"Simulator 8 Hak Pengguna FOMCA","labProps":{"grp":"hak1"},"examTip":"Hafal sekurang-kurangnya 4 hak FOMCA paling kerap ditanya: keselamatan, maklumat tepat, membuat pilihan dan mendapatkan ganti rugi!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Hak Pengguna FOMCA dengan Situasinya","voiceCaption":"Padankan lima hak pengguna FOMCA berikut dengan situasi pengguna yang sepadan.","voiceScript":"[confident] Padankan kelima-lima hak pengguna F.O.M.C.A. ini dengan contoh tindakannya!","prompt":"Padankan hak pengguna FOMCA berikut dengan situasi tepat:","pairs":[{"id":"pm410u2m1","left":"Hak mendapatkan ganti rugi","right":"Menuntut pemulangan wang apabila peralatan elektrik yang dibeli rosak serta tidak berfungsi"},{"id":"pm410u2m2","left":"Hak mendapatkan maklumat","right":"Menyemak label tarikh luput, kandungan bahan dan harga sebelum membayar"},{"id":"pm410u2m3","left":"Hak mendapatkan keselamatan","right":"Memastikan barangan kosmetik dan mainan kanak-kanak bebas bahan kimia beracun"},{"id":"pm410u2m4","left":"Hak bersuara","right":"Mengemukakan aduan rasmi kepada Tribunal Tuntutan Pengguna atau KPDN"},{"id":"pm410u2m5","left":"Hak membuat pilihan","right":"Membandingkan harga dan kualiti beberapa jenama tanpa paksaan jurujual"}],"explanation":"Mengenali hak pengguna FOMCA melindungi rakyat daripada eksploitasi peniaga tidak bertanggungjawab."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Bina Pernyataan Kepentingan Dokumentasi & Bajet","voiceCaption":"Susun frasa berikut bagi melengkapkan kepentingan pengurusan perbelanjaan secara beretika.","voiceScript":"[confident] Susun frasa berikut untuk menerangkan kepentingan mengurus perbelanjaan dengan beretika!","prompt":"Susun frasa untuk melengkapkan kepentingan pengurusan perbelanjaan beretika:","hint":"Pengurusan perbelanjaan secara beretika dapat menjamin...","answerTokens":["Pengurusan perbelanjaan secara beretika dapat menjamin masa hadapan melalui tabungan,","mengelakkan pembaziran serta mengurangkan bebanan hutang,","dan menjadikan rekod resit sebagai rujukan perbelanjaan akan datang."],"distractors":["supaya pengguna boleh membelanjakan wang tanpa batas setiap minggu","untuk menggalakkan pembelian barangan import berjenama mewah secara hutang"],"explanation":"Lima kepentingan utama SP 7.3.3 saling mengukuhkan kesejahteraan kewangan individu."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Rujukan Perbelanjaan & Hak Ganti Rugi","voiceCaption":"Kenal pasti sebab utama pengguna beretika perlu menyimpan resit pembayaran.","voiceScript":"[excited] Uji kefahaman kamu tentang kepentingan menyimpan resit dan hak pengguna!","prompt":"Encik Amir sentiasa merekodkan perbelanjaan bulanannya dan menyimpan resit pembelian telefon bimbit. Apakah dua manfaat utama amalan tersebut?","options":["Menjadi rujukan kawalan bajet pada bulan berikutnya serta bukti sah untuk menuntut hak ganti rugi jika berlaku kerosakan","Membolehkan beliau memohon status muflis dengan lebih cepat di mahkamah","Membantu beliau menyembunyikan hutang kad kredit daripada pengetahuan keluarga","Memastikan harga barangan import naik secara mendadak di pasaran"],"correctIndex":0,"explanation":"Menyimpan resit memenuhi cara pengurusan ke-6, kepentingan ke-3 (rujukan) dan hak FOMCA ke-6 (ganti rugi)."}]},{"id":"pm410-u3","title":"Unit 3: Kesan Pengurusan Perbelanjaan Tidak Beretika","subtitle":"SP 7.3.4 — Kesan Buruk kepada Diri, Keluarga, Masyarakat dan Negara (Inflasi, Import & Muflis)","iconType":"scale","iconUrl":"../assets/icons/pm410-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"4 Kesan Pengurusan Perbelanjaan Tidak Beretika","voiceCaption":"Pengurusan perbelanjaan tidak beretika membawa kesan serius kepada diri, keluarga, masyarakat dan negara termasuk masalah muflis, beban pemiutang tak berlesen dan inflasi.","voiceScript":"[warm] Selamat datang ke Unit tiga! Apakah kesan jika seseorang menguruskan perbelanjaan secara tidak beretika? Terdapat empat kelompok kesan mengikut buku teks muka surat seratus empat puluh sembilan! Pertama, kepada diri sendiri: menghadapi masalah kewangan, dibebani hutang, disenaraihitamkan oleh pihak bank, berisiko diisytiharkan muflis seperti yang dilaporkan Berita Harian mengenai hutang kad kredit, serta mengalami tekanan perasaan! Kedua, kepada keluarga: keluarga terpaksa berkongsi menanggung beban hutang, menjejaskan perbelanjaan keperluan lain dan merenggangkan hubungan kekeluargaan! Ketiga, kepada masyarakat: melahirkan persaingan yang tidak sihat atau menunjuk-nunjuk, membentuk tabiat berbelanja secara boros serta meningkatkan jumlah pemiutang yang tidak berlesen seperti along! Keempat, kepada negara: meningkatkan kadar inflasi, melambungkan kadar barangan import, meningkatkan kadar keberhutangan rakyat serta menambah kos pelupusan barangan yang dibuang akibat pembaziran!","title":"7.3.4 Kesan Buruk kepada Diri, Keluarga, Masyarakat & Negara","acronym":"D•K•M•N","hook":"Klik tab 'Kesan Kepada 4 Pihak' dalam Makmal Bajet di bawah dan bandingkan implikasinya!","mediaKey":"pm410_jualan_dalam_talian","summary":"Diri: masalah kewangan, hutang, disenaraihitam bank, muflis, stres. Keluarga: kongsi beban hutang, jejas perbelanjaan lain, renggang hubungan. Masyarakat: persaingan tak sihat, boros, pemiutang tak berlesen. Negara: inflasi, barangan import meningkat, keberhutangan rakyat, kos pelupusan sisa.","bullets":["Kesan kepada Diri: Menghadapi masalah kewangan, dibebani hutang, disenaraihitamkan oleh bank, berisiko diisytiharkan muflis dan mengalami tekanan perasaan.","Kesan kepada Keluarga: Keluarga terpaksa menanggung bebanan hutang, menjejaskan perbelanjaan keperluan anak-anak serta menjejaskan keharmonian hubungan kekeluargaan.","Kesan kepada Masyarakat & Negara: Masyarakat berdepan persaingan tidak sihat, budaya boros dan pemiutang tidak berlesen; Negara mengalami inflasi, peningkatan barangan import, keberhutangan rakyat dan kos pelupusan barang terbuang."],"labId":"pm410_bajet_etika_lab","labTitle":"Makmal Kesan Pengabaian Kepada Diri, Keluarga, Masyarakat & Negara","labProps":{"tab":"kesan"},"examTip":"Jika soalan meminta kesan pengurusan kewangan tidak beretika kepada NEGARA, nyatakan inflasi, kadar keberhutangan rakyat, peningkatan import dan kos pelupusan sisa!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Kesan Diri/Keluarga vs Masyarakat/Negara","voiceCaption":"Kelaskan enam kesan pengurusan kewangan tidak beretika antara Peringkat Diri & Keluarga dengan Masyarakat & Negara.","voiceScript":"[confident] Kelaskan keenam-enam kesan pengabaian pengurusan kewangan ini dengan tepat!","prompt":"Isihkan kesan pengurusan kewangan tidak beretika mengikut peringkat:","buckets":[{"id":"dk","label":"Kesan kepada Diri & Keluarga"},{"id":"mn","label":"Kesan kepada Masyarakat & Negara"}],"items":[{"text":"Disenaraihitamkan oleh pihak bank, berisiko muflis dan mengalami tekanan perasaan","bucketId":"dk","note":"Tepat! Kesan langsung ke atas individu."},{"text":"Ahli keluarga terpaksa menanggung beban hutang sehingga perbelanjaan asas terjejas","bucketId":"dk","note":"Betul! Menjejaskan kebajikan dan hubungan keluarga."},{"text":"Kadar inflasi negara meningkat dan perbelanjaan barangan import melonjak tinggi","bucketId":"mn","note":"Tepat! Kesan makroekonomi kepada negara."},{"text":"Meningkatkan bilangan pemiutang tidak berlesen dan budaya menunjuk-nunjuk","bucketId":"mn","note":"Betul! Gejala sosial dalam masyarakat akibat hutang."},{"text":"Kerajaan menanggung kos pelupusan barangan yang dibuang akibat pembaziran pengguna","bucketId":"mn","note":"Tepat! Kesan ekonomi dan alam sekitar negara."},{"text":"Hubungan suami isteri atau ahli rumah menjadi tegang akibat tunggakan bil bulanan","bucketId":"dk","note":"Betul! Menjejaskan keharmonian institusi keluarga."}],"explanation":"Masalah hutang individu bukan sahaja memusnahkan diri dan keluarga malah menggugat ekonomi negara."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tindakan Bijak Kes Kasut Min Seng","voiceCaption":"Ramalkan keputusan paling beretika bagi Min Seng yang berbaki simpanan RM150 tetapi tertarik membeli kasut berharga RM400 dengan diskaun 50 peratus.","voiceScript":"[curious] Dengar situasi Min Seng! Baki simpanannya hanya seratus lima puluh ringgit dan dia baru membeli kasut dua minggu lepas, tetapi ternampak kasut empat ratus ringgit berdiskaun lima puluh peratus. Apakah keputusan paling beretika?","hook":"Semak Panduan Pengurusan Kewangan: Punca Kewangan, Keperluan atau Kehendak, serta Kesan!","scenario":"Min Seng mempunyai baki wang simpanan RM150. Dua minggu lalu dia telah membeli sepasang kasut baharu. Kini dia ternampak promosi kasut RM400 dengan diskaun 50 peratus (RM200).","prompt":"Berdasarkan Panduan Pengurusan Kewangan buku teks, apakah keputusan paling rasional dan beretika?","options":["Menolak pembelian kasut tersebut kerana ia merupakan kehendak bukannya keperluan, harganya RM200 melebihi baki simpanan RM150, dan beliau baru memiliki kasut dua minggu lepas","Meminjam RM50 daripada rakan supaya tidak terlepas tawaran diskaun 50 peratus itu","Memaksa ibu bapa membayar bakinya supaya dapat mempamerkan jenama baharu di sekolah","Menggunakan kad kredit pihak lain tanpa memberitahu anggaran sebenar"],"correctIndex":0,"proofLabId":"pm410_bajet_etika_lab","proofState":{"tab":"cara"},"explanation":"Mengikut kajian kes buku teks, kasut kedua selepas dua minggu adalah kehendak dan RM200 melebihi simpanan RM150."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: Pemiutang Tidak Berlesen & Inflasi","voiceCaption":"Kenal pasti kesan pengurusan kewangan tidak beretika kepada masyarakat dan negara.","voiceScript":"[excited] Uji kefahaman kamu tentang kesan makro pengurusan perbelanjaan tidak beretika!","prompt":"Apabila ramai pengguna berbelanja melebihi kemampuan melalui pinjaman tidak sah dan melakukan pembaziran barangan import, apakah kesan kepada masyarakat dan negara?","options":["Aktiviti pemiutang tidak berlesen berleluasa dalam masyarakat manakala negara menghadapi kadar inflasi serta kos pelupusan barangan buangan yang tinggi","Semua rakyat memperoleh simpanan tetap tanpa bekerja","Kos pelupusan sampah berkurangan dan harga barang menjadi sifar","Pelabur asing memuji sikap boros penduduk tempatan"],"correctIndex":0,"explanation":"SP 7.3.4 menyenaraikan peningkatan pemiutang tidak berlesen, inflasi, import dan kos pelupusan sebagai kesan kepada masyarakat dan negara."}]},{"id":"pm410-u4","title":"Unit 4: Kajian Kes Kewangan, Prabayar vs Pascabayar & Pendidikan Kewangan","subtitle":"SP 7.3.5 & 7.3.6 — Perasaan Gembira & Bersyukur, 4 Situasi Kewangan (Kuan Seng, Mary, Puan Tukinah, Encik Jaspal Singh) & Projek PIBG","iconType":"book","iconUrl":"../assets/icons/pm410-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Perasaan, 4 Kajian Kes Kewangan & Pelan Telco","voiceCaption":"Amalan pengurusan kewangan beretika melahirkan perasaan gembira dan bersyukur, seperti ditunjukkan melalui bajet Kuan Seng, pelan prabayar Puan Tukinah dan insurans pendidikan anak.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut buku teks, mengurus perbelanjaan secara beretika melahirkan perasaan GEMBIRA dan BERSYUKUR kerana hidup terurus dan bebas daripada bebanan hutang! Mari teliti empat situasi pengukuhan penting dalam buku teks! Situasi satu, Kuan Seng membuat perancangan awal bajet perbelanjaan sebelum membeli barang keperluan Tahun Baharu Cina — ini ialah pengurusan sangat beretika! Situasi dua, Mary menggunakan kad kredit hanya untuk mendapatkan beg pakaian percuma — ini amat berisiko memerangkap diri dalam hutang! Situasi tiga, Puan Tukinah teruja dengan iklan telefon percuma di bawah kontrak pascabayar dua tahun berjumlah lapan puluh lima ringgit sebulan, sedangkan pelan prabayar sedia ada cuma tiga puluh lima ringgit sebulan — kontrak dua tahun itu menelan dua ribu empat puluh ringgit berbanding lapan ratus empat puluh ringgit sahaja, menyebabkan pembaziran seribu dua ratus ringgit! Situasi empat, Encik Jaspal Singh membuat simpanan tetap melalui insurans pendidikan untuk masa depan anak — ini sangat bijak! Akhir sekali, projek keusahawanan P.I.B.G. bermodalkan dua ratus lima puluh ringgit melatih murid mengurus modal, hasil jualan dan keuntungan dengan jujur!","title":"7.3.5 & 7.3.6 Kajian Kes Buku Teks & Pendidikan Kewangan","acronym":"4•KES•PIBG","hook":"Teliti 4 kajian kes dan Galeri Arkib Unit 10 di bawah!","mediaKey":"pm410_perbelanjaan_etika","summary":"Perasaan: gembira dan bersyukur. Situasi 1 Kuan Seng (bajet awal TBC = beretika); Situasi 2 Mary (kad kredit demi hadiah beg = tak beretika); Situasi 3 Puan Tukinah (kontrak pascabayar RM85/bln x 24 = RM2,040 vs prabayar RM35/bln x 24 = RM840 -> rugi RM1,200!); Situasi 4 Encik Jaspal Singh (insurans pendidikan anak = bijak); Projek Keusahawanan PIBG modal RM250.","bullets":["Perasaan & Pendidikan Kewangan (SP 7.3.5): Mengamalkan perbelanjaan beretika menimbulkan rasa gembira dan bersyukur serta mencerminkan celik Pendidikan Kewangan.","Analisis 4 Situasi Buku Teks: Kuan Seng (rancang bajet awal TBC — bijak), Mary (mohon kad kredit demi beg percuma — tidak wajar), Puan Tukinah (telefon 'percuma' kontrak RM85/bln x 24 = RM2,040 berbanding prabayar RM35/bln = RM840, bazir RM1,200!), Encik Jaspal Singh (insurans pendidikan anak — pelaburan berfaedah).","Projek Karnival Keusahawanan PIBG: Modal RM250.00 melatih murid mencatat kos, hasil jualan serta agihan keuntungan secara amanah dan berhemah."],"labId":"pm410_galeri_arkib","labTitle":"Galeri Visual & Arkib Unit 10","labProps":{},"examTip":"Kajian kes Puan Tukinah (RM85 x 24 vs RM35 x 24) ialah contoh klasik KBAT SPM tentang menilai tawaran 'percuma' yang tersembunyi di sebalik kontrak mahal!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Nasihat Kewangan untuk Puan Tukinah","voiceCaption":"Ramalkan nasihat terbaik buat Puan Tukinah yang ditawarkan telefon pintar 'percuma' dengan kontrak pascabayar RM85 sebulan selama 24 bulan.","voiceScript":"[curious] Puan Tukinah membayar pelan prabayar tiga puluh lima ringgit sebulan, tetapi ditawar telefon percuma jika menukar ke kontrak pascabayar lapan puluh lima ringgit sebulan selama dua tahun. Apakah nasihat paling bijak?","hook":"Kira jumlah bayaran 24 bulan antara RM85/bln dengan RM35/bln!","scenario":"Syarikat telekomunikasi menawarkan telefon 'percuma' kepada Puan Tukinah dengan syarat melanggan pelan pascabayar RM85 sebulan selama 2 tahun (RM2,040), sedangkan penggunaan sebenarnya hanya memerlukan pelan prabayar RM35 sebulan (RM840 dalam 2 tahun).","prompt":"Apakah nasihat paling rasional kepada Puan Tukinah?","options":["Menolak kontrak pascabayar RM85/bln itu dan mengekalkan pelan prabayar RM35/bln supaya dapat menjimatkan RM1,200 dalam tempoh 2 tahun dan membeli telefon sederhana secara tunai jika perlu","Menerima kontrak RM85/bln tanpa mengira jumlah bayaran keseluruhan kerana perkataan 'percuma' menjimatkan wang","Memohon dua talian pascabayar serentak untuk mendapatkan dua buah telefon percuma","Berhenti membayar bil selepas bulan pertama supaya tidak rugi"],"correctIndex":0,"proofLabId":"pm410_fomca_sim","proofState":{"grp":"hak1"},"explanation":"RM85 x 24 = RM2,040 berbanding RM35 x 24 = RM840; lebihan RM1,200 bermakna telefon itu sebenarnya dibayar secara mahal melalui bil bulanan."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Bina Rumusan Perasaan & Sikap Kewangan","voiceCaption":"Susun frasa untuk melengkapkan perasaan dan kesan jangka panjang pengurusan kewangan beretika.","voiceScript":"[confident] Susun frasa berikut mengenai perasaan dan manfaat pengurusan perbelanjaan beretika!","prompt":"Susun frasa untuk melengkapkan pernyataan tentang SP 7.3.5:","hint":"Apabila saya menguruskan perbelanjaan secara beretika, saya berasa...","answerTokens":["Apabila saya menguruskan perbelanjaan secara beretika, saya berasa gembira dan bersyukur","kerana dapat berdikari serta mengelakkan pembaziran dan hutang,","di samping menjamin masa hadapan pendidikan yang lebih teratur."],"distractors":["sehingga terpaksa mencari pemiutang tidak berlesen setiap hujung bulan","untuk membeli barangan mewah mengikut nafsu semata-mata"],"explanation":"Perasaan gembira dan bersyukur lahir apabila keperluan dipenuhi secara terancang dan beretika."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Kad Kredit Mary vs Insurans Jaspal Singh","voiceCaption":"Bandingkan tindakan kewangan Mary dan Encik Jaspal Singh dalam buku teks.","voiceScript":"[excited] Bandingkan dua situasi buku teks ini dengan teliti!","prompt":"Mengapakah tindakan Encik Jaspal Singh dianggap beretika berbanding tindakan Mary dalam kajian kes buku teks?","options":["Encik Jaspal Singh merancang insurans pendidikan demi masa depan anaknya, manakala Mary memohon kad kredit hanya terpedaya oleh hadiah beg pakaian percuma tanpa menilai beban hutang","Encik Jaspal Singh meminjam wang along untuk membeli beg pakaian berjenama","Mary menggunakan kad kredit untuk melunaskan kos pelupusan barangan import","Kedua-duanya memborong barangan jualan murah melebihi bajet keluarga"],"correctIndex":0,"explanation":"Tabungan pendidikan adalah perancangan jangka panjang yang berfaedah, sedangkan kad kredit demi hadiah percuma mengundang risiko hutang."}]},{"id":"pm410-u5","title":"Unit 5: Ujian Boss — Pengurusan Perbelanjaan Beretika (SPM)","subtitle":"Cabaran Akhir Unit 10 — Integrasi 6 Cara Beretika, 8 Hak FOMCA, Kesan Pengabaian & Kajian Kes Kewangan","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Prinsip Penggunaan Kad Kredit","voiceCaption":"Pilih syarat beretika jika seseorang pengguna memilih untuk membayar menggunakan kad kredit.","voiceScript":"[excited] Ujian Boss Unit sepuluh bermula! Soalan pertama menguji syarat penggunaan kad kredit dalam buku teks.","prompt":"Antara berikut, syarat manakah yang perlu dipatuhi sekiranya pengguna terpaksa menggunakan kad kredit?","options":["Memastikan baki dibayar penuh dalam tempoh bebas faedah supaya tidak dikenakan caj faedah dan terjerat hutang","Hanya membayar jumlah ansuran minimum setiap bulan sepanjang tahun","Memiliki sekurang-kurangnya lima kad kredit berlainan bank demi hadiah beg percuma","Mengabaikan penyimpanan resit serta penyata transaksi bulanan"],"correctIndex":0,"explanation":"SP 7.3.2 menekankan pembelian tunai atau kad debit, dan jika menggunakan kad kredit mestilah membayar dalam tempoh bebas faedah."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2"," function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;

    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {

  }

}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

  var fullNotesItems = bullets.map(function (b, idx) {

  var deepDrawerHtml = !isBite
    ? '<details class="nota-deep-drawer">' +
        "<summary>" + tUi("Nota Lengkap Buku Teks &amp; Tip SPM", "Full Textbook Notes &amp; SPM Tip") + "</summary>" +
        '<div class="nota-deep-body">' +
          (step.summary ? '<p class="step-summary">' + escapeHtml(step.summary) + "</p>" : "") +
          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +
        "</div>" +
      "</details>"

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {
