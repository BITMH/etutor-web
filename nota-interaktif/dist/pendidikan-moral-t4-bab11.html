/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx]:hover {

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab11","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":11,"title":"Keunikan Rakyat Malaysia","subtitle":"Bidang 7 Unit 11 — Keunikan 6 Kaum Utama, 5 Kepentingan & 4 Cabaran (Polarisasi Kaum), Strategi SWOT, 3 Objektif Dasar Kebudayaan Kebangsaan & Vlog Makanan Warisan","estimatedMinutes":32,"themeAccent":"#b45309","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab11-labs.js","coverIcon":"../assets/icons/pm411-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Penghayatan kamu terhadap kepelbagaian dan keunikan budaya rakyat Malaysia amat membanggakan.","combo":"[excited] Hebat! Bahasa, makanan, pakaian, perayaan serta Dasar Kebudayaan Kebangsaan berjaya dikuasai.","encourage":"[gentle] Cuba semak semula jadual enam kaum utama, maksud polarisasi kaum serta strategi SWOT.","celebrate":"[celebratory] Syabas! Kamu telah menamatkan Unit sebelas Keunikan Rakyat Malaysia!"},"units":[{"id":"pm411-u1","title":"Unit 1: Keunikan 6 Kaum Utama (Bahasa, Makanan, Pakaian & Perayaan)","subtitle":"SP 7.4.1 — Keunikan Kaum Melayu, Cina, India, Kadazandusun, Iban & Punjabi serta Orang Asli, Baba dan Nyonya & Portugis","iconType":"globe","iconUrl":"../assets/icons/pm411-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Keunikan 6 Kaum Utama & Komuniti Malaysia","voiceCaption":"Keunikan rakyat Malaysia terserlah melalui bahasa, makanan, pakaian tradisional dan perayaan enam kaum utama iaitu Melayu, Cina, India, Kadazandusun, Iban dan Punjabi serta etnik lain.","voiceScript":"[warm] Selamat datang ke Unit sebelas: Keunikan Rakyat Malaysia! Lima nilai cadangan unit ini ialah Patriotisme, Kerajinan, Berdikari, Keberanian dan Berterima kasih. Dalam jadual buku teks muka surat seratus enam puluh, mari kita kenali keunikan enam kaum utama di Malaysia! Pertama, kaum Melayu bertutur bahasa Melayu, terkenal dengan nasi lemak, rendang dan sate, berbaju kurung dan baju Melayu serta menyambut Hari Raya Aidilfitri dan Aidiladha! Kedua, kaum Cina bertutur dialek Mandarin, Hakka, Kantonis, Hokkien, Hainan, Fuzhou dan Teochew, menikmati dim sum, kuih bulan, zongzi dan tang yuan, memakai ceongsam, samfu dan qipao serta meraikan Tahun Baharu Cina, Cap Goh Mei dan Dong Zhi! Ketiga, kaum India bertutur bahasa Tamil, Telugu dan Malayalam, menikmati tose dan idli, memakai sari dan doti serta menyambut Deepavali dan Thaipusam! Keempat, kaum Kadazandusun terkenal dengan tuhau, hinava dan bosou, pakaian himpogot, tangkong, siling dan tapi, serta Pesta Kaamatan dan Moginakan Nunuk Ragang! Kelima, kaum Iban terkenal dengan manuk pansuh, kasam ikan dan salai, pakaian sirat, kelambi, kain tenun dan baju burung, serta perayaan Gawai Dayak, Gawai Antu dan Gawai Batu! Keenam, kaum Punjabi menikmati capati, dhal, saag dan lassi, memakai serban, kurta-pejama, dupatta dan selwar-kameez serta menyambut Hari Vesakhi! Negara kita juga diperkaya dengan komuniti Orang Asli, Baba dan Nyonya serta Portugis!","title":"7.4.1 Keunikan 6 Kaum Utama & Etnik Malaysia","acronym":"M•C•I•K•I•P","hook":"Klik tab kaum dalam Makmal Keunikan Kaum Malaysia di bawah untuk membandingkan bahasa, makanan, pakaian dan perayaan!","mediaKey":"pm411_keunikan_rakyat","summary":"6 Kaum Utama (Jadual p.160): Melayu (nasi lemak/rendang, baju kurung/Melayu, Aidilfitri); Cina (Mandarin/dialek, dim sum/kuih bulan/zongzi/tang yuan, ceongsam/samfu/qipao, TBC/Cap Goh Mei/Dong Zhi); India (Tamil/Telugu/Malayalam, tose/idli, sari/doti, Deepavali/Thaipusam); Kadazandusun (tuhau/hinava/bosou, himpogot/tangkong/siling/tapi', Pesta Kaamatan/Moginakan Nunuk Ragang); Iban (manuk pansuh/kasam ikan/salai, sirat/kelambi/baju burung, Gawai Dayak/Antu/Batu); Punjabi (capati/dhal/saag/lassi, serban/kurta-pejama/dupatta/selwar-kameez, Hari Vesakhi).","bullets":["Semenanjung (Melayu, Cina, India & Punjabi): Makanan ikonik nasi lemak, dim sum, kuih bulan, zongzi, tang yuan, tose, idli, capati, saag & lassi; Perayaan Aidilfitri, TBC, Cap Goh Mei, Dong Zhi, Deepavali, Thaipusam & Hari Vesakhi.","Sabah & Sarawak (Kadazandusun & Iban): Kadazandusun (tuhau, hinava, bosou; himpogot, tangkong, siling, tapi'; Pesta Kaamatan, Moginakan Nunuk Ragang); Iban (manuk pansuh, kasam ikan, salai; sirat, kelambi, kain tenun, baju burung; Gawai Dayak, Gawai Antu, Gawai Batu).","Komuniti Lain & Nilai: Orang Asli, Baba dan Nyonya serta Portugis turut mewarnai warisan Malaysia; berteraskan nilai Patriotisme, Kerajinan, Berdikari, Keberanian dan Berterima kasih."],"labId":"pm411_keunikan_kaum_lab","labTitle":"Makmal Keunikan Bahasa, Makanan, Pakaian & Perayaan 6 Kaum","labProps":{"kaum":"melayu"},"examTip":"Dalam soalan keunikan kaum, jangan hanya sebut kaum Melayu, Cina dan India — sertakan juga contoh makanan atau perayaan Kadazandusun (hinava/Kaamatan), Iban (manuk pansuh/Gawai) dan Punjabi (capati/Vesakhi)!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Warisan Semenanjung vs Sabah & Sarawak","voiceCaption":"Kelaskan enam makanan, pakaian dan perayaan tradisional berikut mengikut asalnya.","voiceScript":"[confident] Kelaskan keenam-enam unsur budaya tradisional ini dengan tepat!","prompt":"Isihkan warisan budaya berikut mengikut kategori kaumnya:","buckets":[{"id":"sb","label":"Warisan Kadazandusun & Iban (Borneo)"},{"id":"sm","label":"Warisan Melayu, Cina, India & Punjabi"}],"items":[{"text":"Hinava, tuhau dan bosou serta sambutan Pesta Kaamatan","bucketId":"sb","note":"Tepat! Makanan dan perayaan utama kaum Kadazandusun di Sabah."},{"text":"Manuk pansuh, sirat, kelambi dan sambutan Hari Gawai Dayak","bucketId":"sb","note":"Betul! Warisan ikonik kaum Iban di Sarawak."},{"text":"Kuih bulan, zongzi, tang yuan serta pakaian ceongsam dan samfu","bucketId":"sm","note":"Tepat! Warisan budaya kaum Cina."},{"text":"Capati, saag, lassi serta perayaan Hari Vesakhi","bucketId":"sm","note":"Betul! Makanan dan perayaan kaum Punjabi."},{"text":"Pakaian tradisional himpogot, tangkong, siling dan tapi'","bucketId":"sb","note":"Tepat! Busana tradisional wanita kaum Kadazandusun."},{"text":"Tose, idli serta perayaan Deepavali dan Thaipusam","bucketId":"sm","note":"Betul! Warisan makanan dan perayaan kaum India."}],"explanation":"Penguasaan perincian makanan, pakaian dan perayaan pelbagai etnik Sabah, Sarawak dan Semenanjung memperkaya hujah SPM."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Kaum Malaysia dengan Bahasa & Perayaannya","voiceCaption":"Padankan lima kaum berikut dengan bahasa/dialek serta perayaannya.","voiceScript":"[confident] Padankan kelima-lima kaum di Malaysia ini dengan keunikan warisan masing-masing!","prompt":"Padankan kaum berikut dengan ciri budayanya dalam jadual buku teks:","pairs":[{"id":"pm411u1m1","left":"Kaum Cina","right":"Mandarin, Hakka, Hokkien, Teochew; Tahun Baharu Cina, Cap Goh Mei, Dong Zhi"},{"id":"pm411u1m2","left":"Kaum Kadazandusun","right":"Tuhau, hinava, bosou; Pesta Kaamatan & Moginakan Nunuk Ragang"},{"id":"pm411u1m3","left":"Kaum Iban","right":"Manuk pansuh, kasam ikan, salai; Gawai Dayak, Gawai Antu, Gawai Batu"},{"id":"pm411u1m4","left":"Kaum India","right":"Tamil, Telugu, Malayalam; Tose, idli; Deepavali & Thaipusam"},{"id":"pm411u1m5","left":"Kaum Punjabi","right":"Punjabi; Capati, dhal, saag, lassi; Serban, kurta-pejama & Hari Vesakhi"}],"explanation":"Setiap kaum menyumbang warna keunikan bahasa, sajian, busana dan perayaan kebangsaan."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Keunikan Makanan & Perayaan","voiceCaption":"Kenal pasti pasangan tepat makanan, busana dan perayaan kaum di Malaysia.","voiceScript":"[excited] Uji ketepatan fakta warisan pelbagai kaum dalam Unit sebelas!","prompt":"Pasangan manakah yang TEPAT bagi makanan tradisional, pakaian dan perayaan kaum Kadazandusun dalam buku teks?","options":["Hinava dan tuhau; pakaian himpogot, tangkong, siling dan tapi'; Pesta Kaamatan dan Moginakan Nunuk Ragang","Manuk pansuh dan salai; pakaian sirat dan baju burung; perayaan Hari Vesakhi","Zongzi dan tang yuan; pakaian qipao dan samfu; perayaan Thaipusam","Lassi dan dhal; pakaian baju kurung dan doti; perayaan Dong Zhi"],"correctIndex":0,"explanation":"Jadual muka surat 160 menyenaraikan tuhau, hinava, bosou, himpogot, tangkong, siling, tapi' dan Kaamatan sebagai warisan Kadazandusun."}]},{"id":"pm411-u2","title":"Unit 2: Kepentingan, 4 Cabaran & Polarisasi Kaum","subtitle":"SP 7.4.2 & 7.4.3 — 5 Kepentingan Keunikan Rakyat Malaysia & 4 Cabaran Utama (Bahasa, Budaya Luar, Polarisasi Kaum & Sosial)","iconType":"shield","iconUrl":"../assets/icons/pm411-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Kepentingan & 4 Cabaran Keunikan Rakyat Malaysia","voiceCaption":"Keunikan rakyat Malaysia mengukuhkan perpaduan, ekonomi pelancongan dan imej negara, namun dicabar oleh isu bahasa, budaya luar, polarisasi kaum dan sikap taasub budaya sendiri.","voiceScript":"[warm] Selamat datang ke Unit dua! Mengapakah keunikan rakyat Malaysia sangat penting dipelihara? Terdapat lima kepentingan mengikut SP tujuh perpuluhan empat perpuluhan dua: pertama, mengukuhkan perpaduan rakyat berbilang kaum; kedua, mengukuhkan kestabilan politik dan ekonomi melalui kedatangan pelancong serta pelabur asing; ketiga, melahirkan generasi pelapis yang menghargai kepelbagaian budaya; keempat, mewujudkan keseimbangan antara kemajuan negara dengan warisan budaya; dan kelima, menjadi kebanggaan negara yang menaikkan imej Malaysia di persada dunia! Walau bagaimanapun, usaha ini berhadapan empat cabaran utama! Pertama, cabaran bahasa yang menjejaskan komunikasi apabila sesuatu kaum kurang menguasai bahasa kebangsaan; kedua, cabaran budaya luar yang menghakis jati diri golongan muda; ketiga, polarisasi kaum iaitu menurut Kamus Dewan ialah keadaan apabila terdapat dua pihak atau lebih yang mempunyai prinsip atau pendapat bertentangan sama sekali hingga sukar mencapai persefahaman; dan keempat, cabaran sosial seperti sikap taasub terhadap budaya sendiri serta kecelaruan identiti bangsa!","title":"7.4.2 & 7.4.3 5 Kepentingan & 4 Cabaran (Polarisasi Kaum)","acronym":"B•L•P•S","hook":"Teliti 3 Objektif Dasar Kebudayaan Kebangsaan & SWOT pada Simulator di bawah!","mediaKey":"pm411_dasar_kebudayaan","summary":"5 Kepentingan: mengukuhkan perpaduan, kestabilan politik & ekonomi (pelancong/pelabur), generasi pelapis budaya, keseimbangan kemajuan & warisan, kebanggaan imej negara. 4 Cabaran: Cabaran Bahasa, Budaya Luar, Polarisasi Kaum (Kamus Dewan: dua pihak berprinsip/pendapat bertentangan sama sekali), Cabaran Sosial (taasub budaya sendiri, kecelaruan identiti).","bullets":["5 Kepentingan Keunikan (SP 7.4.2): Mengukuhkan perpaduan rakyat, menstabilkan politik & ekonomi (tarikan pelancong dan pelabur asing), melahirkan generasi pelapis budaya, keseimbangan kemajuan & warisan serta kebanggaan imej negara.","4 Cabaran Utama (SP 7.4.3): (1) Cabaran bahasa (jejas komunikasi), (2) Budaya luar (menghakis jati diri), (3) Polarisasi kaum (pertentangan prinsip/pendapat antara pihak), (4) Cabaran sosial (taasub budaya sendiri & kecelaruan identiti).","Maksud Polarisasi Kaum (Kamus Dewan): Keadaan apabila terdapat dua pihak atau lebih yang mempunyai prinsip atau pendapat yang bertentangan sama sekali."],"labId":"pm411_dasar_swot_sim","labTitle":"Simulator Dasar Kebudayaan Kebangsaan & Analisis SWOT","labProps":{"tab":"dasar"},"examTip":"Istilah 'polarisasi kaum' sangat berharga dalam jawapan SPM — jelaskan maksudnya sebagai sikap berpuak atau berprinsip bertentangan yang menghalang perpaduan!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 4 Cabaran Keunikan Rakyat Malaysia","voiceCaption":"Padankan empat cabaran SP 7.4.3 dan konsep kepentingan SP 7.4.2 dengan huraian tepatnya.","voiceScript":"[confident] Padankan kesemua cabaran dan kepentingan keunikan rakyat Malaysia ini!","prompt":"Padankan cabaran/kepentingan berikut dengan huraian yang tepat:","pairs":[{"id":"pm411u2m1","left":"Polarisasi kaum","right":"Keadaan dua pihak atau lebih mempunyai prinsip/pendapat bertentangan sama sekali"},{"id":"pm411u2m2","left":"Cabaran bahasa","right":"Kesukaran komunikasi akibat penguasaan bahasa kebangsaan yang lemah"},{"id":"pm411u2m3","left":"Cabaran budaya luar","right":"Pengaruh budaya asing melalui media sosial sehingga menghakis jati diri asal"},{"id":"pm411u2m4","left":"Cabaran sosial","right":"Sikap taasub terhadap budaya sendiri serta kecelaruan identiti masyarakat"},{"id":"pm411u2m5","left":"Kestabilan ekonomi & politik","right":"Kepelbagaian budaya menarik pelancong asing dan meyakinkan pelabur"}],"explanation":"Mengatasi empat cabaran ini memastikan keunikan budaya menjadi kekuatan nasional bukan punca perpecahan."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Bina Definisi Polarisasi Kaum & Kepentingan Budaya","voiceCaption":"Susun frasa berikut bagi menerangkan cabaran polarisasi kaum dan kepentingan mengekalkan keunikan Malaysia.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan huraian cabaran dan kepentingan keunikan rakyat!","prompt":"Susun frasa untuk menerangkan kepentingan dan cabaran keunikan rakyat Malaysia:","hint":"Keunikan rakyat Malaysia mengukuhkan kestabilan...","answerTokens":["Keunikan rakyat Malaysia mengukuhkan kestabilan politik dan ekonomi negara,","namun usaha ini berhadapan cabaran polarisasi kaum dan pengaruh budaya luar,","justeru generasi pelapis perlu dibentuk agar seimbang antara kemajuan dengan warisan."],"distractors":["kerana sikap taasub terhadap budaya sendiri patut dipupuk sejak kecil","supaya semua adat tradisi tempatan digantikan dengan budaya asing"],"explanation":"Keseimbangan kemajuan moden dengan warisan budaya menangkis cabaran budaya luar."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Kesan Taasub Budaya & Pengaruh Asing","voiceCaption":"Kenal pasti cabaran yang timbul apabila remaja terlalu mengagungkan budaya luar dan merendahkan budaya sendiri.","voiceScript":"[excited] Uji kefahaman kamu terhadap cabaran budaya luar dan cabaran sosial!","prompt":"Apakah kesan jangka panjang jika generasi muda terlalu mengagungkan budaya asing dan memandang rendah warisan budaya kaum di Malaysia?","options":["Menghakis jati diri bangsa dan menyebabkan kecelaruan identiti sehingga warisan budaya tempatan semakin pupus tanpa generasi pelapis","Mengukuhkan Dasar Kebudayaan Kebangsaan secara serta-merta","Menghapuskan masalah komunikasi bahasa kebangsaan antara kaum","Meningkatkan penggunaan pakaian tradisional dalam kalangan pelajar"],"correctIndex":0,"explanation":"SP 7.4.3 menjelaskan budaya luar dan cabaran sosial menghakis jati diri dan menjejaskan kesinambungan generasi pelapis."}]},{"id":"pm411-u3","title":"Unit 3: Strategi Pengekalan, Analisis SWOT & Dasar Kebudayaan Kebangsaan","subtitle":"SP 7.4.4 — Peranan Diri, Ibu Bapa & Kerajaan, Analisis SWOT (SO, WO, ST, WT) & 3 Objektif Dasar Kebudayaan Kebangsaan","iconType":"flag","iconUrl":"../assets/icons/pm411-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"3 Strategi Pengekalan, SWOT & Dasar Kebudayaan Kebangsaan","voiceCaption":"Keunikan rakyat dikekalkan melalui strategi diri, ibu bapa dan kerajaan serta Dasar Kebudayaan Kebangsaan yang mempunyai tiga objektif utama dan analisis SWOT.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bagaimanakah keunikan rakyat Malaysia dapat dikekalkan? SP tujuh perpuluhan empat perpuluhan empat menggariskan tiga peringkat strategi! Pertama, Diri sendiri: menerima serta menghormati keunikan pelbagai kaum, tidak memandang rendah budaya lain dan mengamalkan budaya dalam kehidupan! Kedua, Ibu bapa: mengamalkan adat budaya dalam keluarga, mendidik anak menghargai kepelbagaian serta membawa anak menyertai aktiviti kebudayaan! Ketiga, Kerajaan: menganjurkan aktiviti kesenian di sekolah, memartabatkan Dasar Kebudayaan Kebangsaan dan mewujudkan muzium mini warisan! Menurut laman J.K.K.N. dalam buku teks muka surat seratus enam puluh lima, Dasar Kebudayaan Kebangsaan mempunyai tiga objektif: mengukuhkan perpaduan bangsa dan negara melalui kebudayaan; memupuk serta memelihara keperibadian kebangsaan; dan memperkayakan kualiti kehidupan kemanusiaan serta kerohanian yang seimbang dengan pembangunan sosioekonomi! Di samping itu, Analisis S.W.O.T. menggabungkan Kekuatan dan Peluang menjadi strategi S.O. seperti kempen Tahun Melawat Malaysia, Kelemahan dan Peluang menjadi strategi W.O. iaitu pendidikan awal budaya, Kekuatan dan Ancaman menjadi strategi S.T. melalui promosi besar-besaran budaya asal, serta Kelemahan dan Ancaman menjadi strategi W.T. iaitu pendidikan agama yang kukuh!","title":"7.4.4 Strategi Diri, Ibu Bapa, Kerajaan, SWOT & Dasar Kebudayaan","acronym":"SO•WO•ST•WT","hook":"Klik tab 'Analisis SWOT' dalam Simulator di bawah untuk meneroka keempat-empat strategi SO, WO, ST dan WT!","mediaKey":"pm411_warisan_etnik","summary":"3 Strategi (Diri, Ibu Bapa, Kerajaan). 3 Objektif Dasar Kebudayaan Kebangsaan (JKKN p.165): kukuh perpaduan melalui kebudayaan, pupuk keperibadian kebangsaan, perkaya kualiti kemanusiaan & kerohanian seimbang sosioekonomi. SWOT (p.164): SO (kempen Tahun Melawat Malaysia), WO (pendidikan awal budaya), ST (promosi besar-besaran budaya asal), WT (pendidikan agama kukuh).","bullets":["3 Strategi Pengekalan (SP 7.4.4): Diri (terima, hormat & amal tanpa memandang rendah), Ibu bapa (amal, didik & bawa anak ke aktiviti budaya), Kerajaan (aktiviti kesenian sekolah, Dasar Kebudayaan Kebangsaan & muzium mini).","3 Objektif Dasar Kebudayaan Kebangsaan (p.165): (1) Mengukuhkan perpaduan bangsa & negara melalui kebudayaan; (2) Memupuk & memelihara keperibadian kebangsaan; (3) Memperkayakan kualiti kehidupan kemanusiaan & kerohanian seimbang sosioekonomi.","Analisis SWOT (p.164): SO (Kekuatan + Peluang = kempen Tahun Melawat Malaysia), WO (Kelemahan + Peluang = pendidikan awal budaya), ST (Kekuatan + Ancaman = promosi besar-besaran budaya asal), WT (Kelemahan + Ancaman = pendidikan agama kukuh)."],"labId":"pm411_dasar_swot_sim","labTitle":"Simulator Dasar Kebudayaan Kebangsaan & Strategi SWOT","labProps":{"tab":"swot"},"examTip":"Untuk soalan peranan kerajaan atau strategi kreatif, rujuk 3 Objektif Dasar Kebudayaan Kebangsaan serta strategi SWOT (SO Tahun Melawat Malaysia & WO pendidikan awal budaya)!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Peranan Diri/Ibu Bapa vs Kerajaan","voiceCaption":"Kelaskan enam strategi mengekalkan keunikan rakyat antara Peranan Diri & Ibu Bapa dengan Peranan Kerajaan.","voiceScript":"[confident] Kelaskan keenam-enam strategi pengekalan keunikan budaya ini mengikut pihak pelaksananya!","prompt":"Isihkan strategi mengekalkan keunikan rakyat Malaysia mengikut pihak:","buckets":[{"id":"keluarga","label":"Strategi Diri & Ibu Bapa"},{"id":"kerajaan","label":"Strategi Kerajaan & Dasar"}],"items":[{"text":"Membawa anak-anak menghadiri festival kebudayaan dan mengamalkan adat kaum sendiri","bucketId":"keluarga","note":"Tepat! Tanggungjawab didikan ibu bapa."},{"text":"Memartabatkan Dasar Kebudayaan Kebangsaan serta membina muzium mini warisan","bucketId":"kerajaan","note":"Betul! Strategi peringkat dasar kerajaan."},{"text":"Tidak memandang rendah budaya kaum lain dan menerima perbezaan secara terbuka","bucketId":"keluarga","note":"Tepat! Sikap terpuji pada peringkat diri sendiri."},{"text":"Menjalankan kempen Tahun Melawat Malaysia dan program pertukaran murid budaya","bucketId":"kerajaan","note":"Betul! Strategi SO dan peluang kerajaan."},{"text":"Memasukkan aktiviti kesenian dan permainan tradisional dalam kokurikulum sekolah","bucketId":"kerajaan","note":"Tepat! Dasar pendidikan kesenian peringkat sekolah."},{"text":"Mengenakan pakaian tradisional ketika majlis rasmi sekolah dengan penuh rasa bangga","bucketId":"keluarga","note":"Betul! Amalan diri memelihara warisan."}],"explanation":"Sinergi diri, ibu bapa dan kerajaan memastikan Dasar Kebudayaan Kebangsaan berjaya."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Strategi SWOT Menangkis Budaya Barat","voiceCaption":"Ramalkan strategi SWOT paling tepat untuk menangani ancaman budaya Barat dan media terhadap generasi muda.","voiceScript":"[curious] Berdasarkan jadual analisis S.W.O.T. dalam buku teks, pengaruh budaya Barat dan media massa merupakan ancaman terhadap keunikan tempatan. Apakah gabungan strategi terbaik menanganinya?","hook":"Ingat semula gandingan ST (Kekuatan + Ancaman) dan WT (Kelemahan + Ancaman)!","scenario":"Segelintir remaja semakin hanyut dengan gaya hidup budaya asing melalui media sosial sehingga melupakan adat resam dan nilai murni tempatan.","prompt":"Berdasarkan Analisis SWOT buku teks, apakah strategi ST dan WT yang paling berkesan untuk membendung ancaman ini?","options":["Melancarkan promosi besar-besaran budaya asal Malaysia (strategi ST) serta memperkukuh pendidikan agama dan moral sejak awal (strategi WT)","Mengharamkan terus semua pelancong asing memasuki negara","Membubarkan muzium mini warisan kerana dianggap ketinggalan zaman","Menghentikan pembelajaran semua bahasa etnik dan dialek tempatan"],"correctIndex":0,"proofLabId":"pm411_dasar_swot_sim","proofState":{"tab":"swot"},"explanation":"Jadual SWOT muka surat 164 memadankan ST = promosi besar-besaran budaya asal, dan WT = pendidikan agama yang kukuh."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: 3 Objektif Dasar Kebudayaan Kebangsaan","voiceCaption":"Kenal pasti objektif rasmi Dasar Kebudayaan Kebangsaan mengikut laman JKKN.","voiceScript":"[excited] Uji ketepatan pengetahuan kamu tentang Dasar Kebudayaan Kebangsaan!","prompt":"Antara berikut, manakah BUKAN merupakan tiga objektif Dasar Kebudayaan Kebangsaan yang dipetik daripada JKKN dalam buku teks?","options":["Menyeragamkan semua makanan, pakaian dan bahasa rakyat kepada satu kaum sahaja demi menghapuskan kepelbagaian","Mengukuhkan perpaduan bangsa dan negara melalui kebudayaan","Memupuk dan memelihara keperibadian kebangsaan yang tumbuh daripada kebudayaan kebangsaan","Memperkayakan dan mempertingkatkan kualiti kehidupan kemanusiaan dan kerohanian yang seimbang dengan pembangunan sosioekonomi"],"correctIndex":0,"explanation":"Dasar Kebudayaan Kebangsaan memupuk perpaduan dan keperibadian kebangsaan tanpa menghapuskan kepelbagaian budaya etnik."}]},{"id":"pm411-u4","title":"Unit 4: Keunikan Nama, Perkahwinan Campur, Cuti Umum & Vlog Makanan","subtitle":"SP 7.4.5 & 7.4.6 — Perasaan Bangga, Kisah Aryton Sikawah & Parameswary (Hanesh Sikawah), Aktiviti 'Jom Melangkah ke Hadapan' & Vlog Makanan","iconType":"users","iconUrl":"../assets/icons/pm411-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Keunikan Nama, Perkahwinan Campur & Harmoni Budaya","voiceCaption":"Menghormati keunikan nama rakyat, perkahwinan campur seperti kisah Aryton Sikawah dan Parameswary, serta cuti umum perayaan melahirkan rasa bangga sebagai rakyat Malaysia.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut SP tujuh perpuluhan empat perpuluhan lima, mengamalkan sikap menghormati keunikan kepelbagaian kaum melahirkan perasaan BANGGA, bersyukur dan gembira menjadi rakyat Malaysia! Buku teks muka surat seratus enam puluh enam hingga seratus tujuh puluh dua membawa beberapa pengisian hidup sebenar! Pertama, keunikan nama masyarakat majmuk termasuk Kadazan, Bidayuh, Cina, India, Orang Asli, Punjabi, Melayu, Dusun dan Iban yang mencerminkan identiti keturunan dan budaya masing-masing! Kedua, kisah perkahwinan campur antara Aryton Sikawah berketurunan Dusun dengan Parameswary berketurunan India — apabila anak mereka, Hanesh Sikawah dilahirkan, kedua-dua keluarga meraikan kepelbagaian adat resam, bahasa serta juadah kedua-dua kaum dengan harmoni! Ketiga, aktiviti 'Jom Melangkah ke Hadapan' mengajak murid menghargai keistimewaan rakan tanpa prejudis, di samping keunikan cuti umum perayaan pelbagai kaum yang memupuk semangat muhibah! Keempat, projek vlog makanan tradisi seperti dim sum, Laksa Sarawak, nasi kerabu dan tose menjadi saluran kreatif belia mempromosikan warisan Malaysia ke seluruh dunia!","title":"7.4.5 & 7.4.6 Nama Etnik, Perkahwinan Campur & Vlog Warisan","acronym":"H•V•C•P","hook":"Teliti Galeri Visual & Arkib Unit 11 di bawah untuk mengulang kaji kesemua kes budaya!","mediaKey":"pm411_keunikan_rakyat","summary":"Perasaan: bangga & bersyukur. Keunikan nama etnik (Kadazan, Bidayuh, Orang Asli, Punjabi, Dusun, Iban dll.). Perkahwinan campur: Aryton Sikawah (Dusun) + Parameswary (India) -> anak Hanesh Sikawah (amalan dua budaya dengan harmoni). Cuti umum perayaan pelbagai kaum. Vlog makanan: dim sum, Laksa Sarawak, nasi kerabu, tose.","bullets":["Keunikan Nama & Perkahwinan Campur: Menghormati struktur nama 9 kaum/etnik (termasuk Dusun, Bidayuh, Kadazan, Orang Asli, Punjabi); kisah Aryton Sikawah (Dusun) & Parameswary (India) membesarkan Hanesh Sikawah dalam suasana saling menghormati dua budaya.","Cuti Umum Perayaan & Aktiviti 'Jom Melangkah ke Hadapan': Cuti umum perayaan memberi peluang rakyat saling menziarahi rumah terbuka dan meraikan rakan berbeza latar belakang.","Projek Vlog Makanan Tradisional: Mempromosikan dim sum, Laksa Sarawak, nasi kerabu dan tose di media sosial sebagai duta kecil keunikan Malaysia."],"labId":"pm411_galeri_arkib","labTitle":"Galeri Visual & Arkib Unit 11","labProps":{},"examTip":"Contoh perkahwinan campur atau perkongsian cuti umum rumah terbuka ialah bukti terbaik amalan hidup bersama secara aman dalam masyarakat majmuk!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Sikap Harmoni Keluarga Perkahwinan Campur","voiceCaption":"Ramalkan amalan terbaik dalam keluarga perkahwinan campur antara kaum Dusun dan India dalam buku teks.","voiceScript":"[curious] Merujuk kisah Aryton Sikawah dan Parameswary dalam buku teks, bagaimanakah mereka memupuk keharmonian apabila membesarkan anak mereka Hanesh Sikawah?","hook":"Fokus pada elemen Menerima, Menghormati dan Mengurus kepelbagaian dalam keluarga!","scenario":"Dalam sebuah keluarga perkahwinan campur berbeza kaum dan budaya, dua tradisi perayaan iaitu Pesta Kaamatan dan Deepavali disambut dalam tahun yang sama.","prompt":"Apakah amalan paling beretika dan berteraskan nilai kekeluargaan Malaysia?","options":["Saling menghormati, mengajar anak mengenali bahasa, adat dan makanan kedua-dua belah keluarga serta meraikan perayaan bersama-sama dengan penuh kasih sayang","Memaksa sebelah pihak melupakan terus asal usul budaya serta bahasanya","Melarang ahli keluarga besar datang berkunjung semasa musim perayaan","Mengejek keunikan nama atau pakaian tradisional pasangan di hadapan anak"],"correctIndex":0,"proofLabId":"pm411_keunikan_kaum_lab","proofState":{"kaum":"borneo"},"explanation":"Keterbukaan dan saling menghargai adat kedua-dua belah kaum melahirkan keluarga Malaysia yang harmoni."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Bina Pernyataan Promosi Makanan Melalui Vlog","voiceCaption":"Susun frasa untuk menerangkan peranan generasi muda mempromosikan keunikan Malaysia melalui vlog makanan.","voiceScript":"[confident] Susun frasa berikut mengenai peranan remaja menghasilkan vlog makanan warisan!","prompt":"Susun frasa untuk melengkapkan peranan generasi muda memelihara keunikan makanan:","hint":"Generasi muda boleh menghasilkan vlog makanan...","answerTokens":["Generasi muda boleh menghasilkan vlog makanan tradisional seperti Laksa Sarawak, nasi kerabu, dim sum dan tose","dengan penuh rasa bangga dan semangat patriotisme,","supaya keunikan warisan rakyat Malaysia dikenali masyarakat antarabangsa."],"distractors":["agar semua makanan tradisional digantikan oleh makanan segera barat","untuk mencetuskan polarisasi kaum di ruangan komen media sosial"],"explanation":"Kreativiti digital seperti vlog makanan menyebarkan kebanggaan warisan tanpa meminggirkan teknologi moden."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Nilai Hormat & Cuti Umum Perayaan","voiceCaption":"Kenal pasti nilai dan faedah cuti umum perayaan pelbagai kaum di Malaysia.","voiceScript":"[excited] Uji kefahaman kamu tentang hikmah cuti umum perayaan di Malaysia!","prompt":"Mengapakah kerajaan mengisytiharkan hari kelepasan am bagi perayaan pelbagai kaum seperti Aidilfitri, Tahun Baharu Cina, Deepavali, Pesta Kaamatan dan Gawai Dayak?","options":["Memberi ruang kepada penganut menyambut perayaan dengan sempurna serta menggalakkan amalan kunjung-mengunjung rumah terbuka antara kaum","Menggalakkan rakyat mengelak daripada berhubung dengan jiran berlainan kaum","Menghapuskan kepelbagaian budaya etnik di Sabah dan Sarawak","Mengurangkan jumlah pelancong asing yang ingin melawat negara"],"correctIndex":0,"explanation":"Pengiktirafan cuti umum perayaan mencerminkan penghormatan kerajaan terhadap kepelbagaian dan membuka peluang interaksi mesra."}]},{"id":"pm411-u5","title":"Unit 5: Ujian Boss — Keunikan Rakyat Malaysia (SPM)","subtitle":"Cabaran Akhir Unit 11 — Integrasi Warisan 6 Kaum, Polarisasi Kaum, Dasar Kebudayaan Kebangsaan & Strategi SWOT","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Padanan Warisan Kaum Punjabi & Iban","voiceCaption":"Pilih pernyataan tepat tentang keunikan kaum Punjabi dan kaum Iban dalam buku teks.","voiceScript":"[excited] Ujian Boss Unit sebelas bermula! Soalan pertama menguji fakta keunikan kaum Punjabi dan Iban.","prompt":"Pasangan manakah yang TEPAT bagi makanan dan perayaan kaum Punjabi serta kaum Iban?","options":["Punjabi: capati, saag, lassi & Hari Vesakhi; Iban: manuk pansuh, kasam ikan, salai & Gawai Dayak","Punjabi: hinava & bosou; Iban: tang yuan & Tahun Baharu Cina","Punjabi: idli & Thaipusam; Iban: baju kurung & Cap Goh Mei","Punjabi: tuhau & Moginakan Nunuk Ragang; Iban: doti & Hari Vesakhi"],"correctIndex":0,"explanation":"Jadual muka surat 160 merekodkan capati/saag/lassi & Vesakhi untuk Punjabi, serta manuk pansuh/kasam ikan/salai & Gawai untuk Iban."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Isih Faktor SWOT (Kekuatan/Peluang vs Kelemahan/Ancaman)","voiceCaption":"Kelaskan enam pernyataan Analisis SWOT buku teks antara Faktor Positif (SO) dengan Cabaran yang Perlu Diatasi (WT).","voiceScript":"[confident] Soalan kedua! Asingkan kekuatan/peluang daripada kelemahan/ancaman dalam Analisis S.W.O.T.!","prompt":"Isihkan elemen Analisis SWOT Unit 11 berikut:","buckets":[{"id":"positif","label":"Kekuatan & Peluang (SO)"},{"id":"risiko","label":"Kelemahan & Ancaman (WT)"}],"items":[{"text":"Kepelbagaian kaum dan adat budaya yang kukuh menarik pelancong asing melalui Tahun Melawat Malaysia","bucketId":"positif","note":"Tepat! Kekuatan (S) + Peluang (O)."},{"text":"Program pertukaran murid budaya memupuk kefahaman antara negara","bucketId":"positif","note":"Betul! Peluang (O) memperluas pengiktirafan global."},{"text":"Pengaruh budaya Barat melalui media sosial menghakis jati diri golongan remaja","bucketId":"risiko","note":"Tepat! Ancaman (T) yang perlu ditangani strategi ST/WT."},{"text":"Segelintir pihak sukar menerima keunikan kaum lain dan terjebak polarisasi kaum","bucketId":"risiko","note":"Betul! Kelemahan (W) yang menjejaskan kesepaduan."},{"text":"Kesediaan pelbagai etnik menganjurkan rumah terbuka merentas sempadan agama","bucketId":"positif","note":"Tepat! Kekuatan unik sosial Malaysia."},{"text":"Sikap terikut-ikut gaya hidup asing akibat kurangnya penghayat function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

  var backBtn = document.getElementById("notaBackBtn");

    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx

  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {

  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;
  notaState.completedSteps = {};

  var applyStart = function () {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("is-lesson-open", true);
    }
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? tUi("Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!", "SPM Boss Challenge — apply your grammar & communication mastery!")
        : (step.type === "concept"
          ? tUi("Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!", "Tap visuals or interactive tabs below to lock in the concept!")
          : tUi("Baca rangsangan dengan teliti sebelum memilih jawapan!", "Read the prompt carefully before locking in your answer!"));
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    var canPrev = notaState.activeStepIdx > 0;
    var canRevisitNext = step.type !== "concept" && Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
    var canSkip = step.type !== "concept" && !canRevisitNext;
    if (canPrev || canRevisitNext || canSkip) {
      var footer = card.querySelector(".step-actions-footer");
      if (!footer) {
        footer = document.createElement("div");
        footer.className = "step-actions-footer";
        card.appendChild(footer);
      }
      var rightBox = document.createElement("div");
      rightBox.className = "step-footer-right";
      while (footer.firstChild) {
        rightBox.appendChild(footer.firstChild);
      }

      if (canPrev) {
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.id = "stepPrevBtn";
        prevBtn.className = "btn-3d btn-3d-ghost step-prev-btn";
        prevBtn.innerHTML = '<svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>' + tUi("UNDUR", "BACK") + "</span>";
        prevBtn.addEventListener("click", function () {
          if (notaState.activeStepIdx <= 0) return;
          NotaAudio.playTap();
          notaState.activeStepIdx--;
          renderActiveStep(false);
        });
        footer.appendChild(prevBtn);
      }
      if (canRevisitNext) {
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "stepNextRevisitBtn";
        nextBtn.className = "btn-3d btn-3d-blue step-next-revisit-btn";
        nextBtn.innerHTML = "<span>" + tUi("SETERUSNYA", "NEXT") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        nextBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(nextBtn);
      } else if (canSkip) {
        var skipBtn = document.createElement("button");
        skipBtn.type = "button";
        skipBtn.id = "stepSkipBtn";
        skipBtn.className = "btn-3d btn-3d-ghost step-skip-btn";
        skipBtn.title = tUi("Langkau ke langkah seterusnya (0 XP)", "Skip to next step (0 XP)");
        skipBtn.innerHTML = "<span>" + tUi("LANGKAU", "SKIP") + '</span><svg class="icon-xs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        skipBtn.addEventListener("click", function () {
          NotaAudio.playTap();
          notaState.activeStepIdx++;
          renderActiveStep(false);
        });
        rightBox.appendChild(skipBtn);
      }
      footer.appendChild(rightBox);
    }

    if (typeof NotaFeel !== "undefined") {
      NotaFeel.applySiblingFallback(card);
      if (NotaFeel.animateStepEntrance) NotaFeel.animateStepEntrance(card);
    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
