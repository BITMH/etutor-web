/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

  border: 2px solid rgba(255, 255, 255, 0.65);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }

    animation: fadeSlideIn 0.25s ease-out;

}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t4-bab12","subject":"Pendidikan Moral","subjectGroup":"teras","form":4,"chapterNumber":12,"title":"Kedaulatan Negara Tanggungjawab Bersama","subtitle":"Bidang 7 Unit 12 — Definisi & 5 Ciri Negara Berdaulat, 5 Kepentingan, Anasir Subversif, 5 Cabaran & Ancaman Keselamatan, Kesan Pengabaian, 4 Lambang Identiti & Peranan 6 Pihak","estimatedMinutes":32,"themeAccent":"#be123c","isFreePreview":false,"labScript":"../data/pendidikan-moral-t4-bab12-labs.js","coverIcon":"../assets/icons/pm412-u1.jpg","editionBadge":"Edisi Interaktif KSSM","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[cheerful] Tepat! Semangat patriotisme dan pemahaman kedaulatan negara kamu amat teguh.","combo":"[excited] Hebat! Ciri negara berdaulat, cabaran anasir subversif dan tanggungjawab rakyat berjaya dikuasai.","encourage":"[gentle] Cuba semak semula lima ciri negara berdaulat serta peranan enam pihak mempertahankan negara.","celebrate":"[celebratory] Tahniah! Kamu telah menamatkan kesemua 12 unit Pendidikan Moral Tingkatan empat!"},"units":[{"id":"pm412-u1","title":"Unit 1: Ciri Negara Berdaulat & 4 Lambang Identiti Nasional","subtitle":"SP 7.5.1 — Definisi Kedaulatan, 5 Ciri Negara Berdaulat, Pemisahan Kuasa, Raja Berperlembagaan, Jalur Gemilang, Jata Negara, Tugu Negara & Parlimen","iconType":"flag","iconUrl":"../assets/icons/pm412-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"5 Ciri Negara Berdaulat & Identiti Nasional","voiceCaption":"Negara berdaulat mempunyai kuasa tertinggi mentadbir sendiri dan dicirikan oleh lima ciri termasuk kemerdekaan, identiti nasional, bebas pengaruh luar serta struktur pemerintahan sendiri.","voiceScript":"[warm] Selamat datang ke Unit dua belas, unit terakhir Tingkatan empat: Kedaulatan Negara Tanggungjawab Bersama! Lima nilai cadangan unit ini ialah Patriotisme, Bertanggungjawab, Hormat, Keberanian dan Kerjasama. Negara berdaulat bermaksud negara yang mempunyai kuasa tertinggi serta bebas daripada penjajahan atau campur tangan kuasa asing untuk mentadbir urus sendiri! Menurut buku teks muka surat seratus tujuh puluh enam, terdapat lima ciri negara berdaulat! Pertama, Merdeka — bebas membuat keputusan sendiri dan menentukan hala tuju pentadbiran sendiri; kedua, Bermaruah dan Berwibawa — berpolitik stabil, ekonomi mantap dan memiliki warganegara berkualiti; ketiga, Beridentiti Nasional — memiliki bendera rasmi Jalur Gemilang, Jata Negara, Bahasa Melayu, Rukun Negara serta lagu kebangsaan Negaraku, di samping monumen penting seperti Tugu Negara dan Bangunan Parlimen; keempat, Bebas daripada pengaruh luar — tidak tunduk kepada tekanan kuasa asing; dan kelima, Berstruktur pemerintahan sendiri iaitu mengamalkan Demokrasi Berparlimen dan Raja Berperlembagaan dengan Yang di-Pertuan Agong sebagai ketua negara, serta doktrin pemisahan kuasa antara badan Perundangan, Kehakiman dan Eksekutif!","title":"7.5.1 5 Ciri Negara Berdaulat, Struktur Kuasa & Lambang","acronym":"M•B•I•B•S","hook":"Klik kedua-dua tab dalam Makmal Negara Berdaulat di bawah untuk meneliti 5 ciri dan 4 lambang identiti!","mediaKey":"pm412_negara_berdaulat","summary":"5 Ciri Negara Berdaulat: Merdeka (keputusan & pentadbiran sendiri), Bermaruah & Berwibawa (politik stabil, ekonomi mantap, warganegara berkualiti), Beridentiti Nasional (Jalur Gemilang, Jata Negara, Bahasa Melayu, Rukun Negara, Negaraku; monumen Tugu Negara & Parlimen), Bebas daripada pengaruh luar, Berstruktur pemerintahan sendiri (Raja Berperlembagaan — YDPA ketua negara; Demokrasi Berparlimen; pemisahan kuasa Perundangan, Kehakiman & Eksekutif).","bullets":["5 Ciri Negara Berdaulat (SP 7.5.1): (1) Merdeka, (2) Bermaruah & Berwibawa, (3) Beridentiti Nasional, (4) Bebas daripada pengaruh luar, (5) Berstruktur pemerintahan sendiri.","Struktur Pemerintahan Malaysia: Sistem Raja Berperlembagaan (Yang di-Pertuan Agong sebagai ketua negara) dan Demokrasi Berparlimen berasaskan pemisahan kuasa Badan Perundangan, Badan Eksekutif dan Badan Kehakiman.","4 Lambang/Monumen Identiti Nasional: Jalur Gemilang (bendera rasmi), Jata Negara, Tugu Negara dan Bangunan Parlimen bersama Bahasa Melayu, Rukun Negara dan lagu Negaraku."],"labId":"pm412_ciri_daulat_lab","labTitle":"Makmal 5 Ciri Negara Berdaulat & Lambang Identiti","labProps":{"tab":"ciri"},"examTip":"Apabila menghuraikan ciri 'berstruktur pemerintahan sendiri', sertakan sistem Raja Berperlembagaan (YDPA), Demokrasi Berparlimen dan pemisahan 3 badan kuasa!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 5 Ciri Kedaulatan vs Tindakan Jejas Kedaulatan","voiceCaption":"Kelaskan enam pernyataan berikut antara Ciri Negara Berdaulat dengan Tindakan yang Menjejaskan Kedaulatan.","voiceScript":"[confident] Kelaskan keenam-enam pernyataan berkaitan ciri negara berdaulat ini dengan tepat!","prompt":"Isihkan pernyataan berikut mengikut kategorinya:","buckets":[{"id":"ciri","label":"Ciri & Amalan Negara Berdaulat"},{"id":"jejas","label":"Menggugat Ciri Kedaulatan"}],"items":[{"text":"Pengasingan kuasa antara badan Perundangan, Eksekutif dan Kehakiman di bawah Perlembagaan","bucketId":"ciri","note":"Tepat! Ciri struktur pemerintahan sendiri."},{"text":"Menghormati Jalur Gemilang, Jata Negara, Rukun Negara dan lagu kebangsaan","bucketId":"ciri","note":"Betul! Memelihara identiti nasional negara."},{"text":"Membenarkan kuasa asing menentukan dasar pentadbiran dan undang-undang dalaman","bucketId":"jejas","note":"Tepat! Bercanggah dengan ciri bebas daripada pengaruh luar."},{"text":"Melakukan vandalisme ke atas Tugu Negara dan mencemarkan lambang rasmi","bucketId":"jejas","note":"Betul! Menghina identiti dan maruah negara."},{"text":"Sistem Raja Berperlembagaan dengan Yang di-Pertuan Agong sebagai ketua negara","bucketId":"ciri","note":"Tepat! Asas kestabilan pemerintahan Malaysia."},{"text":"Membocorkan rahsia pertahanan negara kepada pihak luar demi kepentingan peribadi","bucketId":"jejas","note":"Betul! Mengkhianati kemerdekaan dan keselamatan negara."}],"explanation":"Kedaulatan bergantung pada kebebasan daripada campur tangan luar serta penghormatan terhadap institusi dan identiti negara."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan 5 Ciri Negara Berdaulat & Huraiannya","voiceCaption":"Padankan lima ciri negara berdaulat berikut dengan huraian tepatnya.","voiceScript":"[confident] Padankan kelima-lima ciri negara berdaulat ini dengan keterangannya!","prompt":"Padankan ciri negara berdaulat berikut dengan huraiannya:","pairs":[{"id":"pm412u1m1","left":"Merdeka","right":"Bebas membuat keputusan dan menentukan hala tuju pentadbiran sendiri"},{"id":"pm412u1m2","left":"Bermaruah & Berwibawa","right":"Politik stabil, ekonomi mantap dan memiliki warganegara berkualiti"},{"id":"pm412u1m3","left":"Beridentiti Nasional","right":"Mempunyai Jalur Gemilang, Jata Negara, Bahasa Melayu, Rukun Negara & Negaraku"},{"id":"pm412u1m4","left":"Bebas Pengaruh Luar","right":"Berkuasa penuh tanpa campur tangan atau telunjuk kuasa asing"},{"id":"pm412u1m5","left":"Berstruktur Pemerintahan Sendiri","right":"Pemisahan kuasa Perundangan, Kehakiman & Eksekutif serta Raja Berperlembagaan"}],"explanation":"Kelima-lima ciri ini membuktikan Malaysia sebuah negara merdeka lagi berdaulat."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s4","voiceToneLabel":"Cabaran Unit 1: Struktur Pemerintahan Malaysia","voiceCaption":"Kenal pasti tiga badan dalam pemisahan kuasa serta ketua negara di Malaysia.","voiceScript":"[excited] Uji ketepatan fakta perlembagaan tentang struktur pemerintahan negara!","prompt":"Manakah padanan TEPAT bagi struktur pemerintahan sendiri negara Malaysia mengikut buku teks?","options":["Raja Berperlembagaan (Yang di-Pertuan Agong sebagai ketua negara), Demokrasi Berparlimen dan pemisahan kuasa Perundangan, Eksekutif serta Kehakiman","Penyatuan semua kuasa undang-undang dan kehakiman di bawah seorang pentadbir asing","Sistem tanpa perlembagaan bertulis atau bendera kebangsaan","Pentadbiran tanpa Parlimen serta tanpa pilihan raya umum"],"correctIndex":0,"explanation":"Pemisahan kuasa Perundangan, Kehakiman dan Eksekutif menjamin semak dan imbang di bawah Raja Berperlembagaan."}]},{"id":"pm412-u2","title":"Unit 2: Kepentingan Mempertahankan Kedaulatan & Anasir Subversif","subtitle":"SP 7.5.2 — 5 Kepentingan Kedaulatan Negara & Maksud Anasir Subversif serta Peranan Rukun Negara","iconType":"shield","iconUrl":"../assets/icons/pm412-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"5 Kepentingan Kedaulatan & Menolak Anasir Subversif","voiceCaption":"Mempertahankan kedaulatan mengekalkan kemerdekaan, memupuk patriotisme, memelihara maruah daripada anasir subversif, mengukuhkan perpaduan dan mengekalkan kestabilan politik.","voiceScript":"[warm] Selamat datang ke Unit dua! Mengapakah kedaulatan negara wajib dipertahankan oleh setiap warganegara? SP tujuh perpuluhan lima perpuluhan dua menetapkan lima kepentingan utama! Pertama, mengekalkan kemerdekaan negara agar bebas daripada penjajahan bentuk baharu; kedua, meningkatkan semangat patriotik iaitu perasaan cinta dan taat setia kepada raja serta negara berteraskan Rukun Negara; ketiga, memelihara maruah negara supaya bebas daripada anasir subversif — dalam buku teks, anasir subversif bermaksud perbuatan atau kegiatan yang bertujuan melemahkan atau memusnahkan sesuatu sistem politik atau kerajaan! Keempat, mengukuhkan perpaduan serta keharmonian pelbagai kaum; dan kelima, mengekalkan kestabilan politik agar pembangunan dan kebajikan rakyat berjalan lancar!","title":"7.5.2 5 Kepentingan Kedaulatan & Tolak Anasir Subversif","acronym":"K•P•M•H•S","hook":"Klik tab 'Lambang & Rukun Negara' dalam Makmal di bawah untuk memadankannya!","mediaKey":"pm412_rukun_lambang","summary":"5 Kepentingan (SP 7.5.2): (1) Mengekalkan kemerdekaan, (2) Meningkatkan semangat patriotik (cinta/setia raja & negara), (3) Maruah negara terpelihara (tolak anasir subversif = perbuatan melemahkan/memusnahkan sistem politik/kerajaan), (4) Mengukuhkan perpaduan & keharmonian, (5) Mengekalkan kestabilan politik.","bullets":["5 Kepentingan Mempertahankan Kedaulatan (SP 7.5.2): Mengekalkan kemerdekaan, menyemarakkan patriotisme, memelihara maruah daripada anasir subversif, mengukuhkan perpaduan/keharmonian dan mengekalkan kestabilan politik.","Maksud Anasir Subversif (Buku Teks): Perbuatan atau kegiatan pihak tertentu yang bertujuan melemahkan atau memusnahkan sistem politik dan kerajaan sedia ada.","Penghayatan Rukun Negara: Kepercayaan kepada Tuhan, Kesetiaan kepada Raja dan Negara, Keluhuran Perlembagaan, Kedaulatan Undang-undang, Kesopanan dan Kesusilaan."],"labId":"pm412_ciri_daulat_lab","labTitle":"Makmal Lambang Identiti & Kepentingan Kedaulatan","labProps":{"tab":"lambang"},"examTip":"Gunakan istilah tepat 'anasir subversif' dan terangkan maksudnya (perbuatan melemahkan atau memusnahkan sistem politik/kerajaan) dalam esei SPM!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan 4 Identiti Nasional & Konsep Kedaulatan","voiceCaption":"Padankan lambang serta konsep kenegaraan berikut dengan peranannya.","voiceScript":"[confident] Padankan kelima-lima lambang dan konsep kedaulatan berikut dengan tepat!","prompt":"Padankan lambang/konsep kenegaraan berikut dengan huraiannya:","pairs":[{"id":"pm412u2m1","left":"Jalur Gemilang & Jata Negara","right":"Simbol rasmi kedaulatan dan maruah negara yang wajib dihormati"},{"id":"pm412u2m2","left":"Tugu Negara","right":"Monumen memperingati pengorbanan perwira mempertahankan kemerdekaan"},{"id":"pm412u2m3","left":"Bangunan Parlimen","right":"Simbol sistem Demokrasi Berparlimen dan badan Perundangan negara"},{"id":"pm412u2m4","left":"Anasir subversif","right":"Kegiatan melemahkan atau memusnahkan sistem politik atau kerajaan sah"},{"id":"pm412u2m5","left":"Rukun Negara","right":"Lima prinsip asas perpaduan, kesetiaan kepada raja & kedaulatan undang-undang"}],"explanation":"Lambang identiti dan prinsip Rukun Negara menjadi benteng rohani mempertahankan kedaulatan."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Bina Pernyataan Kepentingan Pertahan Kedaulatan","voiceCaption":"Susun frasa untuk melengkapkan kepentingan mempertahankan kedaulatan negara.","voiceScript":"[confident] Susun frasa berikut bagi menghuraikan kepentingan mempertahankan kedaulatan negara!","prompt":"Susun frasa untuk melengkapkan kepentingan kedaulatan Malaysia:","hint":"Kedaulatan negara perlu dipertahankan supaya...","answerTokens":["Kedaulatan negara perlu dipertahankan supaya kemerdekaan dan kestabilan politik kekal terpelihara,","maruah negara dilindungi daripada ancaman anasir subversif,","serta semangat patriotik dan perpaduan rakyat terus diperkukuh."],"distractors":["agar kuasa asing mudah menentukan dasar pendidikan dan ekonomi negara","kerana prinsip Rukun Negara tidak lagi relevan pada zaman moden"],"explanation":"Kelima-lima kepentingan SP 7.5.2 saling berkait rapat antara kestabilan politik, perpaduan dan keselamatan."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s4","voiceToneLabel":"Cabaran Unit 2: Prinsip Rukun Negara & Kesetiaan","voiceCaption":"Kenal pasti peranan prinsip Rukun Negara dalam menolak anasir subversif.","voiceScript":"[excited] Uji kefahaman kamu tentang perkaitan Rukun Negara dengan kedaulatan!","prompt":"Bagaimanakah penghayatan prinsip 'Kesetiaan kepada Raja dan Negara' serta 'Kedaulatan Undang-undang' membantu mengekalkan kedaulatan Malaysia?","options":["Melahirkan warganegara patriotik yang mematuhi perlembagaan dan menolak sebarang anasir subversif yang cuba menggugat kestabilan kerajaan","Menggalakkan rakyat mengabaikan peraturan negara apabila tidak bersetuju","Membenarkan campur tangan luar bagi menggantikan institusi Yang di-Pertuan Agong","Mengurangkan rasa hormat terhadap pengorbanan perwira di Tugu Negara"],"correctIndex":0,"explanation":"Rukun Negara menyatukan kesetiaan warganegara dan ketaatan kepada undang-undang sebagai perisai daripada kegiatan subversif."}]},{"id":"pm412-u3","title":"Unit 3: Cabaran, Ancaman Keselamatan & Kesan Pengabaian","subtitle":"SP 7.5.3 & 7.5.4 — 5 Cabaran Kedaulatan, Cabaran Dalaman Remaja, 5 Ancaman Keselamatan (Penyeludupan/Pencerobohan) & 5 Kesan Pengabaian","iconType":"scale","iconUrl":"../assets/icons/pm412-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Cabaran, Ancaman Keselamatan & Kesan Pengabaian","voiceCaption":"Kedaulatan berdepan lima cabaran termasuk berita palsu, kurang jati diri dan kuasa besar, serta ancaman keselamatan dan lima kesan buruk pengabaian.","voiceScript":"[warm] Selamat datang ke Unit tiga! Menurut SP tujuh perpuluhan lima perpuluhan tiga, kedaulatan negara menghadapi lima cabaran besar: penularan berita yang menggugat kedaulatan; rakyat kurang jati diri dan mudah terpedaya hasutan; ketidakseimbangan ekonomi dan sosial; tindakan kuasa besar mencabar kedaulatan; serta generasi muda kurang patriotik! Dalam kehidupan harian muka surat seratus lapan puluh lima, cabaran dalaman turut merangkumi sikap memburukkan imej negara di luar atau media sosial, gagal mematuhi undang-undang, tiada kesedaran kebersihan, bahasa kurang sopan serta vandalisme! Sementara itu, muka surat seratus lapan puluh tujuh menyenaraikan lima ancaman keselamatan sempadan iaitu penyeludupan barangan terlarang, pencerobohan perairan negara, kegiatan pengganas, pendatang tanpa izin dan isu pelarian! Jika tanggungjawab mempertahankan kedaulatan diabaikan, lima kesan buruk akan menimpa: tradisi dan norma masyarakat dilupakan, perpaduan dan keharmonian terjejas, pembangunan ekonomi terbantut, ketidakstabilan politik serta campur tangan kuasa luar!","title":"7.5.3 & 7.5.4 Cabaran, Ancaman Sempadan & 5 Kesan Pengabaian","acronym":"5•CAB•5•KES","hook":"Buka kedua-dua mod 'Cabaran' dan 'Kesan' pada Simulator Cabaran Kedaulatan di bawah!","mediaKey":"pm412_cabaran_kedaulatan","summary":"5 Cabaran (SP 7.5.3): penularan berita gugat kedaulatan, kurang jati diri/terpedaya hasutan, ketidakseimbangan ekonomi & sosial, tindakan kuasa besar, generasi muda kurang patriotik. Cabaran dalaman (p.185): buruk imej, langgar undang-undang, kotor, bahasa kesat, vandalisme. Ancaman keselamatan (p.187): penyeludupan, pencerobohan perairan, pengganas, PATI, pelarian. 5 Kesan Pengabaian (SP 7.5.4): tradisi dilupakan, perpaduan terjejas, ekonomi terbantut, politik tak stabil, campur tangan kuasa luar.","bullets":["5 Cabaran Kedaulatan (SP 7.5.3): Berita gugat kedaulatan, kurang jati diri mudah dihasut, jurang ekonomi/sosial, tekanan kuasa besar, belia kurang patriotik.","Cabaran Dalaman (p.185) & Ancaman Keselamatan (p.187): Sikap memburukkan imej negara, vandalisme dan melanggar undang-undang; serta penyeludupan, pencerobohan perairan, pengganas, pendatang tanpa izin (PATI) dan isu pelarian.","5 Kesan Pengabaian (SP 7.5.4): (1) Tradisi & norma dilupakan, (2) Perpaduan & keharmonian terjejas, (3) Ekonomi terbantut, (4) Ketidakstabilan politik, (5) Campur tangan kuasa luar."],"labId":"pm412_cabaran_daulat_sim","labTitle":"Simulator Cabaran, Ancaman Sempadan & Kesan Pengabaian","labProps":{"mode":"cabaran"},"examTip":"Bezakan 'cabaran/ancaman' (punca seperti berita palsu, pencerobohan perairan, kurang patriotik) dengan 'kesan pengabaian' (akibat seperti ekonomi terbantut dan campur tangan kuasa luar)!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Cabaran/Ancaman vs Kesan Pengabaian Kedaulatan","voiceCaption":"Kelaskan enam pernyataan berikut antara Cabaran & Ancaman Keselamatan dengan Kesan Pengabaian Kedaulatan.","voiceScript":"[confident] Asingkan cabaran dan ancaman keselamatan daripada kesan pengabaian kedaulatan!","prompt":"Isihkan pernyataan berikut antara Cabaran/Ancaman dengan Kesan Pengabaian:","buckets":[{"id":"cab","label":"Cabaran & Ancaman Keselamatan"},{"id":"kesan","label":"Kesan Pengabaian Kedaulatan"}],"items":[{"text":"Penyeludupan, pencerobohan perairan negara, aktiviti pengganas dan pendatang tanpa izin","bucketId":"cab","note":"Tepat! Lima ancaman keselamatan sempadan buku teks muka surat 187."},{"text":"Penularan berita palsu yang menghasut rakyat bermusuhan dan kurang jati diri","bucketId":"cab","note":"Betul! Cabaran siber dan jati diri dalam SP 7.5.3."},{"text":"Campur tangan kuasa luar terhadap urusan pentadbiran serta ekonomi terbantut","bucketId":"kesan","note":"Tepat! Kesan langsung apabila kedaulatan diabaikan."},{"text":"Tradisi dan norma masyarakat dilupakan serta perpaduan kaum semakin terjejas","bucketId":"kesan","note":"Betul! Kesan pengabaian SP 7.5.4."},{"text":"Perbuatan memburukkan imej negara di media sosial, vandalisme dan gagal patuh undang-undang","bucketId":"cab","note":"Tepat! Cabaran dalaman sikap warganegara muka surat 185."},{"text":"Ketidakstabilan politik sehingga pelabur asing menarik keluar modal daripada negara","bucketId":"kesan","note":"Betul! Akibat politik tidak stabil daripada pengabaian tanggungjawab."}],"explanation":"Mengenal pasti punca cabaran dan kesannya membolehkan tindakan pencegahan diambil sebelum terlambat."},{"type":"predict","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Ramal Tindakan Remaja Hadapi Berita Gugat Kedaulatan","voiceCaption":"Ramalkan tindakan bertanggungjawab seorang murid apabila terbaca hantaran yang memburukkan imej negara dan menghasut permusuhan.","voiceScript":"[curious] Bayangkan anda terbaca perkongsian palsu yang menghina Jalur Gemilang serta memburukkan imej negara di media sosial. Apakah tindakan paling bertanggungjawab?","hook":"Gabungkan jati diri, semakan fakta sahih dan laporan kepada pihak berkuasa!","scenario":"Satu akaun media sosial menularkan maklumat tidak benar yang menghina kedaulatan negara dan mengajak warganet melakukan vandalisme terhadap harta awam.","prompt":"Apakah tindakan paling tepat demi mempertahankan kedaulatan negara?","options":["Tidak menyebarkan hantaran tersebut, menyemak fakta rasmi dan melaporkan akaun berkenaan kepada SKMM serta pihak berkuasa di samping menyebarkan mesej patriotik","Turut berkongsi hantaran itu kepada kumpulan rakan sekolah supaya cepat tular","Mengikut ajakan melakukan vandalisme di tempat awam sebagai tanda protes","Membiarkan diri terpedaya dengan hasutan kerana menyangka ia tidak menjejaskan negara"],"correctIndex":0,"proofLabId":"pm412_cabaran_daulat_sim","proofState":{"mode":"cabaran"},"explanation":"Menolak hasutan dan melaporkan kandungan subversif membuktikan jati diri kukuh dan keberanian moral."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s4","voiceToneLabel":"Cabaran Unit 3: Ancaman Sempadan & Implikasi Ekonomi","voiceCaption":"Kenal pasti kesan apabila ancaman pencerobohan perairan dan penyeludupan gagal dibendung.","voiceScript":"[excited] Uji analisis kesan pengabaian kedaulatan ke atas keselamatan dan ekonomi!","prompt":"Mengapakah isu pencerobohan perairan, penyeludupan dan kemasukan pendatang tanpa izin perlu ditangani segera oleh agensi penguat kuasa dan rakyat?","options":["Ancaman keselamatan yang tidak terkawal boleh menggugat ketenteraman, membantutkan pembangunan ekonomi dan membuka ruang campur tangan kuasa luar","Membantu melupakan tradisi serta norma murni masyarakat tempatan","Meningkatkan keyakinan penyeludup untuk melanggar undang-undang negara","Mengurangkan peranan agensi kerajaan menjaga sempadan negara"],"correctIndex":0,"explanation":"SP 7.5.4 menegaskan pengabaian kedaulatan menyebabkan ekonomi terbantut, politik tidak stabil dan campur tangan kuasa luar."}]},{"id":"pm412-u4","title":"Unit 4: Peranan 6 Pihak, Perasaan Patriotik & Dokumentari Aku Anak Malaysia","subtitle":"SP 7.5.5 & 7.5.6 — Perasaan Cinta, Bangga & Kekitaan, Peranan 6 Pihak (Sekolah, Ibu Bapa, Remaja, Media Massa, NGO, Kerajaan) & Meja Bulat 4 Kumpulan","iconType":"users","iconUrl":"../assets/icons/pm412-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Peranan 6 Pihak, Meja Bulat & Perasaan Kekitaan","voiceCaption":"Mempertahankan kedaulatan menyemai perasaan cinta, bangga dan semangat kekitaan, dan digerakkan secara bersama oleh enam pihak daripada sekolah hingga NGO dan agensi kerajaan.","voiceScript":"[warm] Selamat datang ke Unit empat! Menurut SP tujuh perpuluhan lima perpuluhan lima, melaksanakan tanggungjawab mempertahankan kedaulatan menyemai perasaan CINTA akan negara, BANGGA menjadi warganegara serta semangat KEKITAAN dalam diri rakyat! Buku teks muka surat seratus lapan puluh dua hingga seratus lapan puluh enam menganalisis peranan enam pihak secara menyeluruh! Pertama, Sekolah: menyemai patriotisme melalui mata pelajaran Sejarah dan Pendidikan Moral, sambutan Bulan Kebangsaan serta pasukan badan beruniform; kedua, Ibu bapa: membawa anak ke tempat bersejarah seperti Tugu Negara dan menjadi suri teladan mengibarkan Jalur Gemilang; ketiga, Remaja: menolak hasutan siber, memelihara imej negara, belajar bersungguh-sungguh dan menyumbang kepakaran; keempat, Media massa: menyiarkan dokumentari seperti 'Aku Anak Malaysia' serta menapis berita berunsur hasutan; kelima, Badan Bukan Kerajaan atau N.G.O.: menganjurkan kempen kesedaran kenegaraan, sukarelawan dan bantuan kemanusiaan; dan keenam, Agensi kerajaan: menguatkuasakan undang-undang sempadan, mempertahankan negara serta memupuk perpaduan! Aktiviti meja bulat empat kumpulan pula menyorot sumbangan Malaysia dalam bidang sukan, ekonomi, pendidikan dan teknologi serta menghargai jasa tiga tokoh negara!","title":"7.5.5 & 7.5.6 Peranan 6 Pihak, Meja Bulat & Semangat Kekitaan","acronym":"6•PIHAK","hook":"Ulang kaji galeri visual Unit 12 di bawah sebelum menghadapi Ujian Boss terakhir Tingkatan 4!","mediaKey":"pm412_negara_berdaulat","summary":"Perasaan: cinta akan negara, bangga, semangat kekitaan. Peranan 6 Pihak: Sekolah (didikan Sejarah/Moral, Bulan Kebangsaan, badan beruniform), Ibu bapa (teladan, tempat bersejarah), Remaja (tolak hasutan, jaga imej, cemerlang ilmu), Media massa (dokumentari 'Aku Anak Malaysia', tapis berita palsu), NGO (kempen patriotisme & sukarelawan), Agensi kerajaan (kawal sempadan & kuat kuasa undang-undang). Meja bulat 4 kumpulan: sukan, ekonomi, pendidikan/teknologi, tokoh negara.","bullets":["Perasaan (SP 7.5.5): Cinta dan kasih akan negara, bangga atas pencapaian tanah air serta semangat kekitaan dalam masyarakat majmuk.","Peranan 6 Pihak: Sekolah (pendidikan & sambutan Bulan Kebangsaan), Ibu bapa (suri teladan & lawatan sejarah), Remaja (tapis maklumat & harumkan nama negara), Media massa (dokumentari patriotik seperti 'Aku Anak Malaysia'), NGO (kempen kesedaran & kesukarelawanan), Agensi kerajaan (pertahanan & penguatkuasaan undang-undang).","Aktiviti Meja Bulat 4 Kumpulan: Mengangkat pencapaian Malaysia dalam sukan, ekonomi, pendidikan/teknologi dan meneladani tokoh perjuangan kemerdekaan."],"labId":"pm412_galeri_arkib","labTitle":"Galeri Visual & Arkib Unit 12","labProps":{},"examTip":"Soalan peranan mempertahankan kedaulatan sangat mudah dijawab penuh apabila anda pecahkan mengikut pihak: Individu/Remaja, Ibu Bapa, Sekolah, Media Massa, NGO dan Kerajaan!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan 6 Pihak dengan Peranan Pertahan Kedaulatan","voiceCaption":"Padankan lima pihak berikut dengan tanggungjawab khususnya dalam buku teks.","voiceScript":"[confident] Padankan kelima-lima pihak ini dengan peranannya mempertahankan kedaulatan negara!","prompt":"Padankan pihak berikut dengan peranan tepatnya:","pairs":[{"id":"pm412u4m1","left":"Sekolah","right":"Sambutan Bulan Kebangsaan, badan beruniform serta didikan Pendidikan Moral & Sejarah"},{"id":"pm412u4m2","left":"Ibu bapa","right":"Membawa anak ke tempat bersejarah dan menjadi suri teladan mengibar Jalur Gemilang"},{"id":"pm412u4m3","left":"Media massa","right":"Menyiarkan dokumentari 'Aku Anak Malaysia' dan menapis berita berunsur hasutan"},{"id":"pm412u4m4","left":"NGO (Badan Bukan Kerajaan)","right":"Menganjurkan kempen kesedaran patriotisme dan misi sukarelawan kemasyarakatan"},{"id":"pm412u4m5","left":"Agensi kerajaan","right":"Mengawal perairan sempadan daripada pencerobohan serta menguatkuasakan undang-undang"}],"explanation":"Kedaulatan ialah tanggungjawab bersama kesemua lapisan masyarakat daripada remaja hingga agensi kerajaan."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Bina Rumusan Semangat Kekitaan & Tanggungjawab Remaja","voiceCaption":"Susun frasa untuk melengkapkan perasaan dan tanggungjawab remaja terhadap kedaulatan Malaysia.","voiceScript":"[confident] Susun frasa berikut bagi melengkapkan peranan dan perasaan seorang warganegara patriotik!","prompt":"Susun frasa untuk menerangkan peranan dan perasaan remaja patriotik:","hint":"Sebagai remaja yang mempunyai semangat kekitaan...","answerTokens":["Sebagai remaja yang mempunyai semangat kekitaan dan cinta akan negara,","saya bertanggungjawab menjaga imej Malaysia, mematuhi undang-undang serta menolak hasutan,","supaya negara terus berdaulat, aman dan dihormati pada peringkat antarabangsa."],"distractors":["dengan melakukan vandalisme dan menggunakan bahasa tidak sopan di ruang awam","agar generasi muda semakin melupakan pengorbanan tokoh kemerdekaan"],"explanation":"Sikap berdisiplin, menolak hasutan dan menjaga nama baik negara ialah sumbangan nyata pelajar kepada kedaulatan."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s4","voiceToneLabel":"Cabaran Unit 4: Peranan Dokumentari Media & Meja Bulat","voiceCaption":"Kenal pasti bagaimana sumbangan bidang sukan, ekonomi dan teknologi serta media menyokong kedaulatan negara.","voiceScript":"[excited] Uji kefahaman kamu tentang peranan media massa dan pencapaian negara!","prompt":"Bagaimanakah penyiaran dokumentari seperti 'Aku Anak Malaysia' oleh media massa dan kejayaan atlet atau saintis negara memperkukuh kedaulatan?","options":["Menyemarakkan perasaan bangga, cinta akan negara serta meningkatkan wibawa dan maruah Malaysia di mata dunia","Menimbulkan rasa takut rakyat terhadap keselamatan sempadan negara","Menggantikan peranan agensi penguat kuasa mengawal penyeludupan","Menggalakkan rakyat meninggalkan bahasa kebangsaan dan Rukun Negara"],"correctIndex":0,"explanation":"Penyiaran karya patriotik dan kejayaan antarabangsa mengukuhkan ciri negara bermaruah serta berwibawa."}]},{"id":"pm412-u5","title":"Unit 5: Ujian Boss — Kedaulatan Negara Tanggungjawab Bersama (SPM)","subtitle":"Cabaran Akhir Unit 12 — Integrasi 5 Ciri Negara Berdaulat, Anasir Subversif, Ancaman Keselamatan & Peranan 6 Pihak","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: Maksud Anasir Subversif","voiceCaption":"Pilih takrifan paling tepat bagi istilah 'anasir subversif' mengikut buku teks.","voiceScript":"[excited] Ujian Boss terakhir Pendidikan Moral Tingkatan empat bermula! Soalan pertama menguji maksud anasir subversif.","prompt":"Dalam konteks mempertahankan maruah dan kedaulatan negara, apakah yang dimaksudkan dengan 'anasir subversif' dalam buku teks?","options":["Perbuatan atau kegiatan pihak tertentu yang bertujuan melemahkan atau memusnahkan sesuatu sistem politik atau kerajaan","Program pertukaran pelajar bagi memperkenalkan makanan tradisional Malaysia","Pelaksanaan pemisahan kuasa antara badan Perundangan, Kehakiman dan Eksekutif","Amalan sukarelawan NGO membantu mangsa banjir dengan penuh kerjasama"],"correctIndex":0,"explanation":"Anasir subversif merujuk usaha melemahkan atau menjatuhkan sistem pemerintahan sah negara."},{"type":"sort","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Isih Tindakan Memelihara vs Menggugat Kedaulatan","voiceCaption":"Kelaskan enam amalan harian rakyat antara Memelihara function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
