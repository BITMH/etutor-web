/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;

  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);

}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;

.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);

}
.node-done-badge {
  position: absolute;

  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);

}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;

@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;

.node-float-tag {

  font-size: 0.74rem;
  font-weight: 800;

.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t5-bab01","subject":"Pendidikan Moral","subjectGroup":"teras","form":5,"chapterNumber":1,"title":"Norma Masyarakat Global Membentuk Keharmonian Sejagat","subtitle":"Bidang 5 Unit 1 KSSM — Konsep & 5 Aspek Norma Masyarakat Global (SP 5.1.1–5.1.2), Kempen Earth Hour WWF, Kepentingan vs Kesan Pengabaian (SP 5.1.3–5.1.4) & Nilai Universal.","estimatedMinutes":25,"themeAccent":"#0284c7","isFreePreview":false,"labScript":"pendidikan-moral-t5-bab01-labs.js","coverIcon":"../assets/icons/pm51-u1.jpg","editionBadge":"Edisi Multimedia & Moral Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penghayatan kamu terhadap norma masyarakat global sangat cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Kamu bijak mengimbangi kemajuan global dengan jati diri tempatan!","encourage":"[softly] Hampir tepat... semak semula lima nilai cadangan Unit satu atau kesan pengabaian norma global!","celebrate":"[excited] Syabas! Unit satu Norma Masyarakat Global Membentuk Keharmonian Sejagat berjaya kamu kuasai!"},"units":[{"id":"pm51-u1","title":"Unit 1: Konsep & Contoh Norma Masyarakat Global","subtitle":"SP 5.1.1 & 5.1.2 — Lima Nilai Cadangan serta Contoh Amalan Ekonomi, Sosial, Alam Sekitar, Hak Asasi & Teknologi","iconType":"globe","iconUrl":"../assets/icons/pm51-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Konsep & Aspek Norma Global","voiceCaption":"Norma masyarakat global merujuk tingkah laku yang diterima secara meluas di peringkat antarabangsa merentasi ekonomi, sosial, alam sekitar, undang-undang dan teknologi.","voiceScript":"[warm] Selamat datang ke Pendidikan Moral Tingkatan lima, Bidang lima Insan Bermoral, Unit satu: Norma Masyarakat Global Membentuk Keharmonian Sejagat! Lima nilai universal cadangan K S S M bagi unit ini ialah Hormat, Hemah Tinggi, Rasional, Kesederhanaan dan Kebebasan. Norma masyarakat global bermaksud perlakuan atau amalan yang diterima secara meluas oleh masyarakat dunia merentas sempadan negara dan budaya! Contohnya termasuk pembelian tanpa tunai, transaksi dalam talian, menghormati kepelbagaian adat sambil berbangga dengan jati diri asal, budaya mesra alam, perlindungan hak asasi manusia serta perkongsian kepakaran perubatan untuk mengawal penyakit berjangkit! Terokai kesemua aspek ini dalam makmal interaktif!","title":"5.1.1 & 5.1.2 Maksud & 5 Aspek Norma Masyarakat Global","acronym":"H•H•R•K•K","hook":"Buka makmal Norma Masyarakat Global untuk menerokai contoh ekonomi, alam sekitar, teknologi dan undang-undang antarabangsa!","mediaKey":"pm51_norma_global","summary":"Norma masyarakat global ialah perlakuan wajar yang diamalkan bersama oleh masyarakat dunia demi keamanan, kemajuan dan kelestarian sejagat.","bullets":["Nilai Cadangan Unit 1: Hormat, Hemah tinggi, Rasional, Kesederhanaan dan Kebebasan.","Ekonomi & Teknologi (SP 5.1.2): Pembelian tanpa tunai, mata wang standard, transaksi dalam talian, inovasi teknologi canggih serta perkongsian penyelidikan perubatan dan kawalan wabak.","Sosial, Alam Sekitar & Undang-undang: Menyantuni pelawat global, mengurus kepelbagaian budaya, budaya mesra alam dan pembangunan terancang, serta mematuhi undang-undang antarabangsa."],"labId":"pm51_norma_global_lab","labTitle":"Makmal Norma Masyarakat Global (SP 5.1.1–5.1.4)","labProps":{"tab":"aspek"},"examTip":"Skema SPM: Dalam soalan struktur yang meminta nilai universal Unit 1, pilih daripada 5 nilai cadangan rasmi (Hormat, Hemah tinggi, Rasional, Kesederhanaan, Kebebasan) diikuti penerangan perlakuan moral."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Norma Ekonomi/Teknologi vs Alam/Sosial","voiceCaption":"Kelaskan enam contoh norma masyarakat global berikut mengikut bidang Ekonomi dan Teknologi atau Sosial dan Alam Sekitar.","voiceScript":"[curious] Asingkan keenam-enam amalan norma masyarakat global ini mengikut domain bidangnya yang tepat!","prompt":"Kelaskan contoh norma masyarakat global berikut mengikut domainnya:","buckets":[{"id":"eko","label":"Ekonomi & Teknologi Global"},{"id":"sos","label":"Sosial, Hak Asasi & Alam Sekitar"}],"items":[{"text":"Pembelian tanpa tunai dan transaksi e-dagang rentas sempadan","bucketId":"eko","note":"Betul! Norma kewangan digital masyarakat global."},{"text":"Pembangunan terancang dan pengurusan isu alam sekitar secara sistematik","bucketId":"sos","note":"Tepat! Menjamin kelestarian ekologi bumi."},{"text":"Perkongsian kepakaran perubatan serta penyelidikan vaksin penyakit berjangkit","bucketId":"eko","note":"Betul! Kolaborasi sains dan perubatan global."},{"text":"Menghormati hak asasi manusia serta kepelbagaian adat dan tradisi","bucketId":"sos","note":"Tepat! Tonggak keharmonian sosial dunia."},{"text":"Jalinan telekomunikasi yang merapatkan jurang digital antara negara","bucketId":"eko","note":"Betul! Norma kesalinghubungan teknologi maklumat."},{"text":"Bangga dengan jati diri negara asal ketika menyantuni masyarakat dunia","bucketId":"sos","note":"Tepat! Norma sosial seimbang dengan patriotisme."}],"explanation":"Norma masyarakat global merangkumi dimensi kewangan moden, inovasi saintifik, hak asasi dan kelestarian alam."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Nilai Universal & Amalan Global","voiceCaption":"Padankan empat nilai cadangan Unit 1 dengan contoh tindakan bermoral dalam masyarakat global.","voiceScript":"[confident] Padankan setiap nilai cadangan K S S M Unit satu ini dengan perlakuannya dalam kehidupan harian!","prompt":"Padankan nilai universal berikut dengan contoh perlakuannya:","pairs":[{"id":"pm51u1m1","left":"Nilai Hormat","right":"Menerima dan mengurus kepelbagaian adat serta hak asasi masyarakat dunia"},{"id":"pm51u1m2","left":"Nilai Rasional","right":"Menapis norma global yang bercanggah dengan budaya tempatan sebelum ditiru"},{"id":"pm51u1m3","left":"Nilai Kesederhanaan","right":"Menggunakan sumber elektrik dan air secara berhemah semasa kempen alam"},{"id":"pm51u1m4","left":"Nilai Hemah Tinggi","right":"Beradab sopan dan berbudi bahasa ketika berkomunikasi di platform global"}],"explanation":"Mengaitkan nilai tepat dengan perlakuan konkrit sangat penting dalam penulisan esei SPM Pendidikan Moral."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Definisi Norma Masyarakat Global","voiceCaption":"Pilih pernyataan yang paling tepat mentakrifkan norma masyarakat global.","voiceScript":"[confident] Berdasarkan buku teks Pendidikan Moral Tingkatan lima, apakah maksud tepat bagi norma masyarakat global?","prompt":"Manakah definisi yang paling TEPAT bagi norma masyarakat global (SP 5.1.1)?","options":["Perlakuan atau amalan sosial yang diterima secara meluas dan dipatuhi oleh komuniti dunia merentasi sempadan negara","Peraturan tempatan yang hanya terpakai kepada penduduk sesebuah kampung sahaja","Amalan meminggirkan budaya negara asal demi meniru gaya hidup Barat sepenuhnya","Larangan menggunakan teknologi internet dan transaksi tanpa tunai"],"correctIndex":0,"explanation":"Norma masyarakat global ialah perilaku wajar yang diterima masyarakat antarabangsa demi kesejahteraan bersama tanpa menghapuskan jati diri asal."}]},{"id":"pm51-u2","title":"Unit 2: Kelestarian Alam & Kempen Earth Hour (WWF)","subtitle":"SP 5.1.2 & 5.1.3 — Kempen Earth Hour, Penghasilan Produk Kitar Semula vs Eksploitasi Sumber Haiwan","iconType":"globe","iconUrl":"../assets/icons/pm51-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Earth Hour & Produk Mesra Alam","voiceCaption":"Kempen Earth Hour oleh WWF mengajak dunia menutup suis elektrik selama sejam untuk kesedaran pemanasan global, di samping memilih produk kitar semula berbanding produk berasaskan sumber haiwan.","voiceScript":"[warm] Selamat datang ke Unit dua! Buku teks mengetengahkan dua contoh praktikal norma alam sekitar global: pertama, Kempen Earth Hour yang digerakkan oleh World Wide Fund for Nature atau W W F dengan tindakan menutup semua suis elektrik selama satu jam untuk mencetuskan kesedaran tentang pemanasan global dan perubahan iklim! Kedua, perbandingan antara penghasilan produk daripada bahan kitar semula yang mengurangkan sisa buangan dengan penghasilan barangan mewah daripada kulit atau bahagian haiwan yang menjejaskan keseimbangan ekologi dan berisiko menyebabkan kepupusan fauna!","title":"Kempen Earth Hour (WWF) & Etika Produk Mesra Alam","acronym":"WWF•3R","hook":"Fahami peranan kempen Earth Hour dan bezakan produk kitar semula daripada produk eksploitasi haiwan!","mediaKey":"pm51_earth_hour","summary":"Amalan penjimatan tenaga dan pilihan produk kitar semula mencerminkan tanggungjawab moral masyarakat global melestarikan bumi.","bullets":["Kempen Earth Hour (WWF): Menutup suis elektrik tidak perlu selama 1 jam sebagai simbol kesedaran global menentang pemanasan global dan perubahan iklim.","Produk Bahan Kitar Semula: Mengurangkan longgokan sampah, menjimatkan sumber mentah baharu dan mengurangkan pencemaran.","Pengabaian Norma Alam (Produk Sumber Haiwan): Pembunuhan haiwan terancam demi fesyen menyebabkan kepupusan spesies dan ketidakseimbangan rantaian makanan."],"examTip":"Apabila diminta mencadangkan cara menjayakan Earth Hour di sekolah, nyatakan tindakan konkrit seperti memadamkan lampu kelas ketika rehat dan kempen kesedaran jimat elektrik."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kesan Pembaziran Tenaga Elektrik","voiceCaption":"Ramalkan kesan jangka panjang sekiranya masyarakat global mengabaikan amalan penjimatan elektrik seperti kempen Earth Hour.","voiceScript":"[curious] Ramalkan implikasi utama apabila penduduk dunia terus membazirkan tenaga elektrik dan mengabaikan norma kelestarian alam sekitar!","hook":"Fikirkan kaitan antara penjanaan elektrik bahan api fosil dengan pemanasan global!","scenario":"Masyarakat global terus membiarkan lampu dan pendingin hawa terpasang tanpa kawalan sepanjang masa.","prompt":"Apakah kesan UTAMA sekiranya amalan penjimatan tenaga elektrik diabaikan oleh masyarakat global?","options":["Peningkatan pelepasan gas rumah hijau yang mempercepat pemanasan global, perubahan iklim serta kehabisan sumber bahan api","Suhu bumi menjadi semakin sejuk dan bekalan arang batu bertambah tanpa had","Bil elektrik isi rumah menurun secara mendadak setiap bulan","Haiwan liar terancam bertambah banyak secara semula jadi"],"correctIndex":0,"proofLabId":"pm51_norma_global_lab","proofState":{"tab":"impak"},"explanation":"Penggunaan tenaga elektrik berlebihan meningkatkan pembakaran bahan api fosil dan memperburuk krisis perubahan iklim global."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Inisiatif Hijau & Rasional Moralnya","voiceCaption":"Padankan empat tindakan pemeliharaan alam sekitar global dengan impak positifnya.","voiceScript":"[confident] Padankan keempat-empat inisiatif kelestarian norma global ini dengan rasional moralnya!","prompt":"Padankan inisiatif alam sekitar berikut dengan kesannya:","pairs":[{"id":"pm51u2m1","left":"Menutup suis semasa Earth Hour","right":"Menyemai kesedaran kolektif mengurangkan jejak karbon dunia"},{"id":"pm51u2m2","left":"Karya kreatif bahan kitar semula","right":"Mengurangkan pembuangan sisa plastik dan kertas ke tapak pelupusan"},{"id":"pm51u2m3","left":"Boikot produk daripada kulit haiwan terancam","right":"Melindungi kepelbagaian biologi dan mencegah kepupusan fauna"},{"id":"pm51u2m4","left":"Pembangunan terancang mesra alam","right":"Mengimbangi kemajuan infrastruktur dengan pemuliharaan hutan"}],"explanation":"Setiap tindakan individu menyokong kelestarian ekosistem global secara langsung."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Organisasi Penggerak Earth Hour","voiceCaption":"Pilih pernyataan yang betul mengenai kempen Earth Hour berdasarkan Info Tambahan buku teks.","voiceScript":"[confident] Mengikut Info Tambahan buku teks Unit satu, siapakah penggerak kempen Earth Hour dan apakah matlamat utamanya?","prompt":"Manakah maklumat yang TEPAT mengenai kempen Earth Hour mengikut buku teks?","options":["Digerakkan oleh WWF bagi memberi kesedaran dunia tentang pemanasan global dan perubahan iklim dengan menutup suis elektrik selama sejam","Dianjurkan untuk menggalakkan kilang beroperasi pada kapasiti elektrik maksimum","Kempen menggalakkan penggunaan beg plastik sekali guna di seluruh dunia","Acara menyalakan semua lampu jalan selama dua puluh empat jam"],"correctIndex":0,"explanation":"World Wide Fund for Nature (WWF) menggerakkan Earth Hour untuk meningkatkan kesedaran pemanasan global."}]},{"id":"pm51-u3","title":"Unit 3: Kepentingan vs Kesan Pengabaian Norma Global","subtitle":"SP 5.1.3 & 5.1.4 — Keharmonian Sejagat, Kemajuan Ekonomi vs Konflik Budaya, Jenayah Siber & Ekosistem","iconType":"scale","iconUrl":"../assets/icons/pm51-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kepentingan & Kesan Pengabaian Norma Global","voiceCaption":"Amalan norma masyarakat global menjamin keharmonian dan kemajuan teknologi, manakala pengabaiannya mencetuskan konflik budaya, kepupusan alam dan jurang ketidaksamaan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bagi menjawab soalan esei lapan atau sepuluh markah S P M, pelajar wajib menguasai perbandingan antara KEPENTINGAN mengamalkan norma masyarakat global dengan KESAN PENGABAIANNYA! Antara kepentingan utama ialah menjamin keselamatan serta keamanan dunia, mengeratkan hubungan diplomatik dan kerjasama perubatan, serta memacu ekonomi global tanpa sempadan! Sebaliknya, jika norma ini diabaikan, wujudlah ketegangan kaum dan agama, kemusnahan alam sekitar, pencabulan hak asasi manusia serta kesukaran berinteraksi di peringkat antarabangsa! Teliti banding beza ini dengan cermat.","title":"5.1.3 Kepentingan vs 5.1.4 Kesan Pengabaian Norma Masyarakat Global","acronym":"MANFAAT•KESAN","hook":"Bandingkan kesan positif pematuhan norma global dengan akibat buruk pengabaiannya dalam makmal!","summary":"Norma masyarakat global bertindak sebagai panduan sejagat yang mengekalkan kestabilan hubungan manusia dan alam; pengabaiannya mengundang krisis sosial dan ekologi.","bullets":["Kepentingan Norma Global (SP 5.1.3): Memupuk perpaduan dan toleransi sejagat, menjamin perlindungan hak asasi manusia, memajukan perkongsian teknologi dan kesihatan, serta melestarikan bumi.","Kesan Pengabaian Norma Global (SP 5.1.4): Menggugat keharmonian dan keselamatan antarabangsa, meningkatkan pencemaran dan kepupusan haiwan, menjejaskan peluang kerjasama ekonomi dan melebarkan jurang digital.","Ekspresi Perasaan Bermoral (SP 5.1.5): Berasa bangga, gembira dan tenang apabila mengamalkan norma global; berasa kesal dan bimbang apabila berlaku pengabaian."],"examTip":"Dalam soalan meramalkan kesan pengabaian (SP 5.1.4), gunakan kata hubung akibat ('mengakibatkan', 'menyebabkan', 'akan terjejas') supaya hujah jelas bersifat ramalan masa hadapan."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Kepentingan vs Kesan Pengabaian","voiceCaption":"Kelaskan enam pernyataan berikut kepada Kepentingan Mengamalkan atau Kesan Mengabaikan Norma Masyarakat Global.","voiceScript":"[curious] Asingkan keenam-enam situasi ini kepada Kepentingan Mengamalkan atau Kesan Mengabaikan Norma Masyarakat Global!","prompt":"Kelaskan pernyataan berikut mengikut kategori SP 5.1.3 atau SP 5.1.4:","buckets":[{"id":"penting","label":"Kepentingan Amalan Norma Global"},{"id":"abai","label":"Kesan Pengabaian Norma Global"}],"items":[{"text":"Mengeratkan kerjasama antarabangsa dalam pengawalan penyakit berjangkit","bucketId":"penting","note":"Betul! Manfaat nyata keselamatan kesihatan sejagat."},{"text":"Berlakunya pencabulan hak asasi manusia dan konflik antara kaum","bucketId":"abai","note":"Tepat! Kesan serius pengabaian nilai hormat dan keadilan."},{"text":"Memudahkan transaksi ekonomi tanpa tunai dan perdagangan global","bucketId":"penting","note":"Betul! Memacu pertumbuhan ekonomi moden."},{"text":"Pemanasan global semakin meruncing akibat pengabaian amalan mesra alam","bucketId":"abai","note":"Tepat! Kesan ekologis akibat ketamakan manusia."},{"text":"Merapatkan jurang digital melalui jaringan telekomunikasi bersepadu","bucketId":"penting","note":"Betul! Memudahkan akses pendidikan dan ilmu global."},{"text":"Individu sukar menyesuaikan diri dan dipandang serong di peringkat antarabangsa","bucketId":"abai","note":"Tepat! Menjejaskan imej diri serta negara asal."}],"explanation":"Menguasai kedua-dua sisi (kepentingan vs kesan pengabaian) membolehkan murid menjawab soalan KBAT SPM dengan lengkap."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Tindakan Moral & Kesan Sosialnya","voiceCaption":"Padankan empat amalan harian daripada bahagian 'Buat Baik Dibalas Baik' dengan nilainya.","voiceScript":"[confident] Padankan setiap perlakuan bermoral dalam masyarakat ini dengan impak positifnya!","prompt":"Padankan amalan bermoral berikut dengan impaknya:","pairs":[{"id":"pm51u3m1","left":"Membantu golongan Orang Kurang Upaya (OKU)","right":"Memastikan tiada golongan terpinggir dan memupuk empati sejagat"},{"id":"pm51u3m2","left":"Meringankan tugasan rakan di sekolah","right":"Mengeratkan semangat setia kawan dan kerjasama"},{"id":"pm51u3m3","left":"Menghormati adat sambutan tahun baharu pelbagai budaya","right":"Mengurangkan salah faham dan membina keharmonian global"},{"id":"pm51u3m4","left":"Berkongsi kepakaran perubatan ketika wabak","right":"Menyelamatkan nyawa manusia merentas sempadan negara"}],"explanation":"Amalan kecil di peringkat komuniti seperti menyantuni OKU ialah cerminan nilai universal masyarakat global."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ekspresi Perasaan Bermoral SP 5.1.5","voiceCaption":"Pilih ungkapan perasaan yang paling tepat apabila seseorang berjaya mengamalkan norma masyarakat global dengan baik.","voiceScript":"[confident] Mengikut S P lima perpuluhan satu perpuluhan lima, apakah perasaan yang wajar diekspresikan apabila kita berjaya mengamalkan norma masyarakat global tanpa menggugat jati diri?","prompt":"Apakah perasaan yang wajar dialami apabila dapat mengamalkan norma masyarakat global dengan berkesan?","options":["Berasa bangga, gembira dan bersyukur kerana dapat menyumbang kepada keharmonian serta kelestarian dunia","Berasa marah dan cemburu melihat kemajuan negara lain","Berasa angkuh sehingga memandang rendah terhadap budaya tempatan sendiri","Berasa kecewa kerana terpaksa menghormati hak asasi orang lain"],"correctIndex":0,"explanation":"Dalam skema Pendidikan Moral SPM, ekspresi perasaan positif (gembira/bangga/puas hati/bersyukur) mesti disusuli sebab moralnya."}]},{"id":"pm51-u4","title":"Unit 4: Mengurus Konflik Norma Setempat vs Global","subtitle":"SP 5.1.5 & 5.1.6 — Imbangan Norma Global dalam Konteks Malaysia serta Kempen Kesedaran Moral","iconType":"crown","iconUrl":"../assets/icons/pm51-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Tapisan Norma Global Konteks Malaysia","voiceCaption":"Tidak semua norma global sesuai ditiru bulat-bulat; rakyat Malaysia perlu menapis amalan luar mengikut norma setempat, adat ketimuran, agama dan undang-undang negara.","voiceScript":"[warm] Selamat datang ke Unit empat! Bahagian akhir Unit satu buku teks meminta murid mencadangkan tindakan untuk mengurangkan konflik antara norma masyarakat setempat dengan norma masyarakat global berserta justifikasi! Mengapa? Kerana ada norma global yang positif seperti transaksi tanpa tunai, etika menjaga masa dan budaya kitar semula, tetapi ada juga budaya luar yang bercanggah dengan kesopanan ketimuran, ajaran agama serta undang-undang Malaysia! Oleh itu, berpandukan nilai Rasional, Kesederhanaan dan Hormat, kita mengambil norma global yang membawa kemajuan sambil mempertahankan adab sopan serta jati diri tempatan!","title":"Mengimbangi Norma Global dengan Konteks & Nilai Malaysia (SP 5.1.6)","acronym":"TAPIS•ADAB","hook":"Ketahui kriteria menapis norma global supaya kemajuan teknologi seiring dengan jati diri Malaysia!","summary":"Pengamalan norma global secara bijaksana menerima inovasi positif sambil menolak budaya luar yang merosakkan akhlak dan perpaduan tempatan.","bullets":["Norma Global Sesuai Konteks Malaysia: Penggunaan teknologi e-pembayaran, budaya menepati masa, kebersihan awam, kesukarelawanan dan penjimatan tenaga.","Norma Asing Perlu Ditapis/Ditolak: Budaya hedonisme melampau, pergaulan bebas, bahasa kesat di media sosial dan eksploitasi sumber alam.","Cara Mengurangkan Konflik Norma: Berfikiran rasional menilai baik buruk, berpegang pada Rukun Negara dan ajaran agama, serta melaksanakan e-kempen kesedaran berhemah."],"examTip":"Dalam soalan dilema moral SPM, nyatakan pendirian 'setuju' atau 'tidak setuju' secara tegas pada ayat pertama, diikuti nilai universal dan huraian justifikasi."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Justifikasi Mengurus Konflik Norma","voiceCaption":"Susun ayat untuk membina justifikasi lengkap tentang cara mengimbangi norma masyarakat global dengan norma tempatan Malaysia.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk satu jawapan justifikasi S P M yang mantap bagi konflik norma global dan tempatan!","prompt":"Susun ayat berikut menjadi satu hujah justifikasi cara mengurus konflik norma global:","hint":"Mulakan dengan prinsip nilai rasional menapis budaya luar, contoh amalan diterima, penolakan unsur negatif dan kesan keharmonian...","answerTokens":["Kita wajar berfikiran rasional dengan menapis norma masyarakat global sebelum mengamalkannya di Malaysia.","Amalan positif seperti pembayaran tanpa tunai, menepati masa dan kempen kitar semula patut dicontohi demi kemajuan.","Sebaliknya, budaya luar yang bertentangan dengan ajaran agama dan kesopanan ketimuran hendaklah ditolak.","Pendekatan seimbang ini membolehkan kita bersaing di peringkat dunia tanpa menggadaikan jati diri bangsa."],"distractors":["Oleh itu, semua teknologi komputer dari luar negara mesti diharamkan terus.","Tambahan pula, adat resam tempatan patut dilupakan oleh remaja."],"explanation":"Jawapan seimbang menggunakan nilai Rasional serta membezakan norma kemajuan daripada budaya negatif."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Situasi Konflik & Penyelesaian Moral","voiceCaption":"Padankan situasi harian antara norma global dengan norma tempatan dengan tindakan penyelesaian yang tepat.","voiceScript":"[curious] Padankan keempat-empat situasi konflik norma berikut dengan penyelesaian bermoral yang paling wajar!","prompt":"Padankan situasi berikut dengan tindakan penyelesaian yang tepat:","pairs":[{"id":"pm51u4m1","left":"Sambutan Tahun Baharu pelbagai negara","right":"Menghormati kepelbagaian budaya sambil meraikan secara sederhana dan selamat"},{"id":"pm51u4m2","left":"Kebebasan bersuara di media sosial global","right":"Menggunakan bahasa sopan dan tidak menyentuh sensitiviti agama atau kaum"},{"id":"pm51u4m3","left":"Gaya hidup konsumerisme & plastik berlebihan","right":"Mengamalkan kesederhanaan, membawa beg guna semula dan kitar semula"},{"id":"pm51u4m4","left":"E-kempen kesedaran norma global sekolah","right":"Menyebarkan mesej moral berfokuskan nilai hormat melalui aplikasi rasmi"}],"explanation":"Penyelesaian konflik norma sentiasa berteraskan keseimbangan nilai Hormat, Rasional dan Kesederhanaan."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Sikap Wajar Terhadap Kebebasan Global","voiceCaption":"Pilih tindakan paling berhemah bagi remaja Malaysia dalam menghayati nilai Kebebasan Unit 1.","voiceScript":"[confident] Bagaimanakah nilai Kebebasan dalam Unit satu patut diamalkan ketika berinteraksi dengan masyarakat global?","prompt":"Apakah pengamalan nilai KEBEBASAN yang paling tepat dalam konteks norma masyarakat global?","options":["Bebas menyuarakan pendapat dan berkarya secara kreatif selagi mematuhi peraturan, undang-undang serta tidak menyinggung budaya lain","Bebas melakukan vandalisme dan membuang sampah di tempat awam sesuka hati","Bebas memaki hamun rakan siber dari negara lain tanpa batasan","Bebas meniru segala fesyen ekstrem walaupun melanggar peraturan sekolah"],"correctIndex":0,"explanation":"Mengikut definisi DSKP Pendidikan Moral, nilai Kebebasan bermaksud bebas melakukan sesuatu tertakluk kepada peraturan dan undang-undang."}]},{"id":"pm51-u5","title":"Unit 5: Cabaran Boss Unit 1 — Norma Masyarakat Global","subtitle":"Penilaian Sumatif SPM Unit 1: 5 Nilai Universal, Aspek Global, Earth Hour & Konflik Budaya","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: 5 Nilai Universal Unit 1","voiceCaption":"Pilih senarai kesemua lima nilai cadangan KSSM bagi Unit 1 Norma Masyarakat Global.","voiceScript":"[excited] Cabaran Boss Unit satu bermula! Kenal pasti himpunan kesemua lima nilai cadangan rasmi K S S M bagi Unit satu Norma Masyarakat Global!","prompt":"Manakah himpunan KESEMUA lima nilai cadangan KSSM bagi Unit 1?","options":["Hormat, Hemah tinggi, Rasional, Kesederhanaan dan Kebebasan","Patriotisme, Kerajinan, Berdikari, Keberanian dan Kejujuran","Kasih sayang, Kerjasama, Berterima kasih, Harga diri dan Tanggungjawab","Kesetiaan, Ketekunan, Kemesraan, Kekayaan dan Kemasyhuran"],"correctIndex":0,"explanation":"Lima nilai cadangan Unit 1 dalam buku teks ialah Hormat, Hemah tinggi, Rasional, Kesederhanaan dan Kebebasan."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Impak Eksploitasi Sumber Haiwan","voiceCaption":"Ramalkan akibat buruk pengabaian norma alam sekitar apabila manusia membeli produk daripada sumber haiwan terancam.","voiceScript":"[curious] Berdasarkan gambar pemulihan buku teks mengenai produk sumber haiwan, ramalkan impak jangka panjang pengabaian norma ini!","hook":"Fikirkan kesan kepada kepelbagaian biologi dan keseimbangan ekosistem global!","scenario":"Permintaan terhadap barangan kulit dan gading haiwan eksotik terus meningkat dalam kalangan pengguna global.","prompt":"Apakah ramalan kesan UTAMA jika amalan tidak bermoral tersebut berterusan?","options":["Populasi haiwan liar terancam mengalami kepupusan sekali gus mengganggu keseimbangan ekosistem bumi","Bilangan spesies hidupan liar meningkat dengan lebih pesat","Sisa plastik kitar semula hilang sepenuhnya dari lautan","Semua negara bersatu menghentikan perdagangan ekonomi yang sah"],"correctIndex":0,"explanation":"Eksploitasi sumber haiwan menyebabkan kepupusan fauna serta merosakkan keseimbangan rantaian makanan alam."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Jawapan Esei SPM Unit 1","voiceCaption":"Susun struktur jawapan esei Pendidikan Moral SPM mengenai kepentingan menghormati norma masyarakat global.","voiceScript":"[confident] Susun elemen jawapan esei S P M mengikut struktur Nilai, Huraian, Contoh dan Kesan!","prompt":"Susun segmen berikut menjadi jawapan esei SPM yang lengkap bagi Unit 1:","hint":"Mulakan dengan nilai universal, definisi/fakta kepentingan, contoh amalan global (Earth Hour/perubatan) dan kesan akhir...","answerTokens":["Nilai yang patut diamalkan ialah nilai hormat dan rasional terhadap norma masyarakat global.","Norma ini penting untuk menjamin keharmonian sejagat dan memelihara kelestarian alam sekitar daripada pencemaran.","Sebagai contoh, masyarakat dunia menyertai kempen Earth Hour dengan menutup suis elektrik selama sejam serta berkongsi kepakaran perubatan.","Kesannya, kesejahteraan hidup manusia terpelihara dan hubungan baik antara negara semakin kukuh."],"distractors":["Nilai kedekut dan individualistik wajar diamalkan dalam semua urusan.","Oleh itu, kerjasama mengawal penyakit berjangkit perlu ditolak."],"explanation":"Struktur Nilai -> Fakta -> Contoh Konkrit -> Kesan memperoleh markah maksimum dalam Bahagian B/C SPM Pendidikan Moral."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Standard Pembelajaran Unit 1","voiceCaption":"Padankan empat Standard Pembelajaran SP 5.1.1 hingga 5.1.4 dengan fokus kandungannya.","voiceScript":"[confident] Padankan kesemua empat Standard Pembelajaran Unit satu dengan fokus masing-masing!","prompt":"Padankan Standard Pembelajaran berikut dengan kandungannya:","pairs":[{"id":"pm51u5m1","left":"SP 5.1.1 Maksud","right":"Perlakuan sosial diterima luas merentas sempadan dan budaya"},{"id":"pm51u5m2","left":"SP 5.1.2 Contoh","right":"Transaksi tanpa tunai, budaya mesra alam, hak asasi, perkongsian perubatan"},{"id":"pm51u5m3","left":"SP 5.1.3 Kepentingan","right":"Keharmonian sejagat, komunikasi mudah, ekonomi mampan"},{"id":"pm51u5m4","left":"SP 5.1.4 Kesan Abai","right":"Konflik budaya, kemusnahan alam, jurang ketidakadilan sosial"}],"explanation":"Menguasai keempat-empat SP menjamin persediaan lengkap soalan struktur dan esei Unit 1."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Penutup: Pilihan Keputusan Moral Terbaik","voiceCaption":"Pilih tindakan paling bermoral bagi seorang pelajar Malaysia yang menyertai program pertukaran antarabangsa.","voiceScript":"[excited] Soalan penutup Boss Unit satu! Apakah tindakan paling tepat seorang pelajar Malaysia ketika berinteraksi dalam program pertukaran antarabangsa?","prompt":"Tindakan manakah yang PALING mencerminkan penghayatan norma masyarakat global secara seimbang?","options":["Menghormati adat tuan rumah dan mengamalkan gaya hidup mesra alam sambil mengekalkan kesopanan serta jati diri Malaysia","Mengejek makanan tradisi peserta negara lai function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
