/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t5-bab05","subject":"Pendidikan Moral","subjectGroup":"teras","form":5,"chapterNumber":5,"title":"Integriti Pemacu Kecemerlangan Organisasi","subtitle":"Bidang 6 Unit 5 KSSM — Konsep Integriti Organisasi (SP 6.1.1), Cara Pelaksanaan (SP 6.1.2), Kepentingan vs Kesan Pengabaian (SP 6.1.3–6.1.4), Pekerja A/B & Kajian Kepuasan Pelanggan + Video Narasi.","estimatedMinutes":26,"themeAccent":"#059669","isFreePreview":false,"labScript":"pendidikan-moral-t5-bab05-labs.js","coverIcon":"../assets/icons/pm55-u1.jpg","editionBadge":"Edisi Multimedia, Video & Moral Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan kamu terhadap integriti organisasi dan etika kerja sangat cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Teruskan ketelusan dan tanggungjawab dalam setiap situasi organisasi!","encourage":"[softly] Hampir tepat... semak semula maksud kod etika, piagam pelanggan atau peranan majikan dan pekerja berintegriti!","celebrate":"[excited] Syabas! Unit lima Integriti Pemacu Kecemerlangan Organisasi berjaya kamu kuasai!"},"units":[{"id":"pm55-u1","title":"Unit 1: Konsep & Pelaksanaan Integriti Organisasi","subtitle":"SP 6.1.1 & 6.1.2 — Kod Etika, Piagam Pelanggan, Elemen Integriti & Video Etika Integriti","iconType":"book","iconUrl":"../assets/icons/pm55-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Integriti Organisasi & Piagam Pelanggan","voiceCaption":"Integriti organisasi bermaksud pematuhan amalan terbaik berteraskan kod etika, piagam pelanggan, sistem dan proses kerja yang telus.","voiceScript":"[warm] Selamat datang ke Bidang enam Jati Diri Moral, Unit lima: Integriti Pemacu Kecemerlangan Organisasi! Lima nilai cadangan K S S M unit ini ialah Kejujuran, Kerjasama, Bertanggungjawab, Kebebasan dan Berdikari. Apakah maksud integriti organisasi mengikut S P enam perpuluhan satu perpuluhan satu? Integriti organisasi bermaksud pematuhan amalan terbaik berdasarkan pelaksanaan kod etika, piagam pelanggan, sistem serta proses kerja agar organisasi kekal telus dan bebas daripada pengaruh pihak berkepentingan! Tujuh elemen terasnya termasuk kepantasan, inovasi, kerja berpasukan, prihatin, tanggungjawab, adil dan disiplin! Tonton juga video penerangan bersuara yang terpaut serta terokai makmal di bawah!","title":"6.1.1 & 6.1.2 Maksud, 7 Elemen & Cara Integriti Organisasi","acronym":"ETIKA•PIAGAM","hook":"Tonton video penerangan bersuara dan terokai makmal Integriti Organisasi di bawah!","mediaKey":"pm55_integriti_organisasi","videoClip":{"src":"../assets/pendidikan-moral-t5-integriti/video/pm5_video_etika_integriti_narasi.mp4","hasNarration":true,"posterKey":"pm55_integriti_organisasi","caption":"Prinsip integriti organisasi, pematuhan kod etika kerja, piagam pelanggan dan pembasmian salah guna kuasa."},"summary":"Integriti organisasi menjamin ketelusan sistem kerja, membendung rasuah serta memastikan layanan adil kepada pelanggan dan pekerja.","bullets":["Nilai Cadangan Unit 5: Kejujuran, Kerjasama, Bertanggungjawab, Kebebasan dan Berdikari.","Maksud Integriti Organisasi (SP 6.1.1): Pematuhan amalan terbaik berasaskan kod etika, piagam pelanggan, sistem dan proses kerja supaya organisasi telus serta bebas kepentingan peribadi.","Cara Pelaksanaan (SP 6.1.2): Mematuhi kod etika kerja, program kesedaran antirasuah dan salah guna kuasa, menghayati visi-misi serta menguatkuasakan peraturan organisasi."],"labId":"pm55_integriti_organisasi_lab","labTitle":"Makmal Integriti Organisasi (SP 6.1.1–6.1.5)","labProps":{"tab":"laksana"},"examTip":"Kata kunci skema SPM bagi definisi integriti organisasi ialah 'pematuhan amalan terbaik', 'kod etika', 'piagam pelanggan' dan 'proses kerja telus'."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Pekerja A (Berintegriti) vs Pekerja B","voiceCaption":"Asingkan enam ciri pekerja daripada bahagian Pemulihan buku teks kepada Pekerja A Berintegriti atau Pekerja B Tidak Berintegriti.","voiceScript":"[curious] Berdasarkan situasi Pekerja A dan Pekerja B dalam buku teks Unit lima, kelaskan keenam-enam perlakuan kerja ini!","prompt":"Kelaskan perlakuan pekerja berikut mengikut tahap integriti organisasi:","buckets":[{"id":"patuh","label":"Pekerja A (Berintegriti)"},{"id":"lalai","label":"Pekerja B (Tidak Berintegriti)"}],"items":[{"text":"Menepati masa bekerja serta menerima tugasan dengan penuh tanggungjawab","bucketId":"patuh","note":"Betul! Disiplin masa ialah asas integriti pekerja."},{"text":"Datang lewat ke pejabat dan melakukan urusan peribadi pada waktu bekerja","bucketId":"lalai","note":"Tepat! Mencuri masa majikan melanggar kod etika kerja."},{"text":"Akur dengan arahan sah, tidak menangguhkan kerja dan bersikap positif","bucketId":"patuh","note":"Betul! Ciri warga organisasi yang komited."},{"text":"Mengganggu rakan sekerja yang sedang tekun menyiapkan tugasan","bucketId":"lalai","note":"Tepat! Menjejaskan keharmonian dan produktiviti pasukan."},{"text":"Sentiasa berkeyakinan menyiapkan tugas mengikut piagam pelanggan","bucketId":"patuh","note":"Betul! Memastikan kualiti perkhidmatan organisasi terjamin."},{"text":"Bersikap malas dan gagal menyiapkan kerja pada masa ditetapkan","bucketId":"lalai","note":"Tepat! Kelewatan menjejaskan kepercayaan pelanggan."}],"explanation":"Integriti individu seperti ketepatan masa dan amanah tugas menentukan kejayaan organisasi."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan 4 Nilai Unit 5 & Tindakan Organisasi","voiceCaption":"Padankan empat nilai cadangan Unit 5 dengan contoh pengamalannya dalam organisasi.","voiceScript":"[confident] Padankan setiap nilai cadangan Unit lima dengan contoh tindakan bermoral di tempat kerja!","prompt":"Padankan nilai universal Unit 5 berikut dengan amalannya:","pairs":[{"id":"pm55u1m1","left":"Nilai Kejujuran","right":"Tidak memalsukan tuntutan perbelanjaan atau rekod kehadiran kerja"},{"id":"pm55u1m2","left":"Nilai Kerjasama","right":"Berganding bahu antara majikan dan pekerja mencapai visi organisasi"},{"id":"pm55u1m3","left":"Nilai Bertanggungjawab","right":"Menyiapkan tugasan mengikut tarikh akhir dan piawaian piagam pelanggan"},{"id":"pm55u1m4","left":"Nilai Berdikari","right":"Menjalankan amanah kerja secara proaktif tanpa perlu diawasi sentiasa"}],"explanation":"Keempat-empat nilai ini membentuk budaya kerja bersih, cekap dan amanah."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Peranan Majikan Berintegriti","voiceCaption":"Pilih ciri majikan berintegriti mengikut situasi Pemulihan buku teks Unit 5.","voiceScript":"[confident] Berdasarkan buku teks Unit lima, apakah ciri utama seorang majikan yang mengamalkan integriti dalam organisasi?","prompt":"Manakah ciri MAJIKAN BERINTEGRITI mengikut buku teks Unit 5?","options":["Mengagihkan kerja sama rata, tidak pilih kasih dalam kenaikan pangkat dan memberi sokongan moral kepada pekerja","Memberikan semua kenaikan gaji hanya kepada rakan karib tanpa menilai prestasi","Membiarkan pekerja yang bermasalah mengganggu rakan sekerja lain","Mengabaikan terus maklum balas aduan pelanggan"],"correctIndex":0,"explanation":"Keadilan majikan mengagihkan kerja dan menilai prestasi tanpa pilih kasih memupuk integriti seluruh organisasi."}]},{"id":"pm55-u2","title":"Unit 2: Kepentingan vs Kesan Pengabaian Integriti","subtitle":"SP 6.1.3 & 6.1.4 — Kepuasan Pelanggan, Bersih Cekap Amanah vs Rasuah, Penyelewengan & Ketidakpuasan","iconType":"scale","iconUrl":"../assets/icons/pm55-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Kepentingan & Implikasi Pengabaian","voiceCaption":"Integriti organisasi meningkatkan kepuasan pelanggan dan membentuk pekerja bersih cekap amanah, manakala pengabaiannya mencetuskan rasuah dan kemerosotan reputasi.","voiceScript":"[warm] Selamat datang ke Unit dua! Bahagian Konsep buku teks menyenaraikan enam kepentingan utama amalan integriti dalam organisasi untuk S P enam perpuluhan satu perpuluhan tiga: pertama, keputusan yang cekap dan pantas dapat diambil; kedua, etika organisasi dipatuhi; ketiga, kepuasan pelanggan dapat ditingkatkan; keempat, anggota organisasi yang bersih, cekap dan amanah dapat dibentuk; kelima, visi dan misi organisasi tercapai; dan keenam, memperoleh pengiktirafan daripada masyarakat! Sebaliknya, jika integriti diabaikan, wujudlah penyelewengan, budaya rasuah, konflik dalaman pekerja, penurunan kualiti perkhidmatan dan kehilangan kepercayaan awam!","title":"6.1.3 Kepentingan vs 6.1.4 Implikasi Pengabaian Integriti Organisasi","acronym":"BCA•PELANGGAN","hook":"Bandingkan hasil organisasi berintegriti dengan akibat buruk kecuaian dan rasuah dalam makmal!","mediaKey":"pm55_piagam_kerja","summary":"Amalan integriti menjamin keberkesanan keputusan, kesetiaan pelanggan dan pencapaian misi; pengabaiannya melemahkan moral pasukan dan meruntuhkan nama baik organisasi.","bullets":["Kepentingan Integriti (SP 6.1.3): Keputusan cekap & pantas, etika dipatuhi, anggota bertanggungjawab dihargai, kepuasan pelanggan meningkat, budaya Bersih Cekap Amanah (BCA) terbentuk serta mendapat pengiktirafan masyarakat.","Implikasi Pengabaian (SP 6.1.4): Penurunan produktiviti dan kualiti, aduan pelanggan meningkat, berleluasa rasuah & pecah amanah, perbalahan staf dan risiko gulung tikar atau tindakan undang-undang.","Kepuasan Pelanggan: Skrin maklum balas perkhidmatan membolehkan organisasi mengesan kelemahan layanan staf dan mengambil tindakan pembetulan telus."],"labId":"pm55_integriti_organisasi_lab","labTitle":"Impak Integriti Organisasi & Kajian Sekolah (SP 6.1.3–6.1.4)","labProps":{"tab":"impak"},"examTip":"Slogan 'Bersih, Cekap dan Amanah' disebut secara khusus dalam Konsep Unit 5 — gunakannya sebagai frasa pengukuhan dalam esei Pendidikan Moral anda!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kesan Pekerja B Kepada Organisasi","voiceCaption":"Ramalkan akibat jangka panjang kepada organisasi apabila pekerja bersikap seperti Pekerja B (lewat, urusan peribadi, malas).","voiceScript":"[curious] Ramalkan kesan utama kepada organisasi sekiranya semakin ramai pekerja meniru sikap Pekerja B!","hook":"Pertimbangkan kesannya kepada pelanggan, rakan sekerja dan pencapaian misi!","scenario":"Pekerja kerap datang lewat, melayari media sosial peribadi semasa waktu kerja dan melengah-lengahkan permohonan pelanggan.","prompt":"Manakah ramalan implikasi (SP 6.1.4) yang paling TEPAT?","options":["Kepuasan pelanggan merosot, beban rakan sekerja bertambah, misi organisasi gagal dicapai dan imej syarikat tercemar","Organisasi memperoleh pengiktirafan antarabangsa sebagai majikan terbaik","Keputusan pengurusan menjadi semakin pantas dan telus","Semua pelanggan berasa puas hati menunggu lama di kaunter"],"correctIndex":0,"proofLabId":"pm55_integriti_organisasi_lab","proofState":{"tab":"impak"},"explanation":"Kelalaian seorang pekerja melumpuhkan aliran kerja berpasukan, mengecewakan pelanggan dan mencemarkan imej organisasi."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Elemen Integriti & Kepentingannya","voiceCaption":"Padankan empat kepentingan integriti organisasi daripada buku teks dengan huraiannya.","voiceScript":"[confident] Padankan setiap kepentingan integriti organisasi daripada buku teks Unit lima ini dengan impak nyatanya!","prompt":"Padankan kepentingan integriti organisasi berikut dengan penerangannya:","pairs":[{"id":"pm55u2m1","left":"Pematuhan Piagam Pelanggan","right":"Menjamin tempoh urusan tepat dan meningkatkan kepuasan pelanggan"},{"id":"pm55u2m2","left":"Keadilan Pengurusan & Tiada Pilih Kasih","right":"Anggota organisasi berasa dihargai serta kekal bermotivasi tinggi"},{"id":"pm55u2m3","left":"Program Kesedaran Antirasuah","right":"Mencegah penyelewengan, suapan dan penyalahgunaan kuasa"},{"id":"pm55u2m4","left":"Budaya Bersih, Cekap dan Amanah","right":"Membolehkan organisasi memperoleh pengiktirafan serta kepercayaan masyarakat"}],"explanation":"Kesemua kepentingan ini memastikan organisasi berdaya saing secara lestari."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Fungsi Maklum Balas Khidmat Pelanggan","voiceCaption":"Pilih sebab utama paparan maklum balas kepuasan pelanggan penting bagi sesebuah organisasi.","voiceScript":"[confident] Mengapakah penilaian maklum balas khidmat pelanggan di kaunter sangat penting untuk memperkukuh integriti organisasi?","prompt":"Mengapakah sistem maklum balas kepuasan pelanggan penting dalam sesebuah organisasi?","options":["Mengukur mutu layanan staf secara telus supaya penambahbaikan berterusan dapat dilaksanakan mengikut piagam pelanggan","Menghukum pelanggan yang memberikan ulasan jujur tentang kelewatan kaunter","Menyembunyikan kelemahan perkhidmatan daripada pihak pengurusan atasan","Menggantikan sepenuhnya tanggungjawab pekerja di kaunter"],"correctIndex":0,"explanation":"Maklum balas pelanggan memberi data objektif kepada pengurusan untuk mengekalkan piawaian integriti."}]},{"id":"pm55-u3","title":"Unit 3: Penilaian Perkhidmatan Sekolah & Cabaran Kerajaan","subtitle":"SP 6.1.2–6.1.6 — Audit Kantin, Koperasi & Tandas Sekolah serta Cabaran Mengukuhkan Integriti Organisasi","iconType":"globe","iconUrl":"../assets/icons/pm55-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Integriti di Sekolah & Cabaran Nasional","voiceCaption":"Murid mempraktikkan integriti organisasi di sekolah melalui audit koperasi, kantin dan kokurikulum sambil memahami cabaran kerajaan membanteras salah laku.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bagaimanakah murid Tingkatan lima mengamalkan integriti organisasi dalam kehidupan harian di bawah S P enam perpuluhan satu perpuluhan enam? Buku teks menyarankan kajian kepuasan pengguna secara jujur menggunakan soal selidik, pemerhatian dan temu bual terhadap perkhidmatan kantin, koperasi, kelas serta unit kokurikulum sekolah! Selain itu, pelajar perlu menganalisis cabaran pihak kerajaan mengukuhkan integriti organisasi seperti kerenah birokrasi, sikap segelintir individu tamak yang enggan berubah, kekurangan pemantauan berterusan serta ketakutan saksi melaporkan salah laku!","title":"Pengamalan Integriti Sekolah & Cabaran Pemerkasaan Integriti","acronym":"AUDIT•ADIL","hook":"Lihat bagaimana pelajar mengaudit perkhidmatan sekolah dan memahami cabaran kerajaan memerangi penyelewengan!","summary":"Amalan integriti bermula di organisasi terdekat iaitu kelas, koperasi dan kelab sekolah melalui pelaporan fakta jujur serta pematuhan peraturan.","bullets":["Kajian Kepuasan Sekolah (SP 6.1.6): Menilai kebersihan kantin & tandas serta ketelusan urus niaga koperasi melalui soal selidik, pemerhatian dan temu bual sebelum berkongsi dapatan secara berhemah dengan pentadbir.","Integriti Kokurikulum & Kelas: Mencatat rekod kewangan kelab secara telus, hadir menepati waktu mesyuarat serta tidak memalsukan kehadiran.","Cabaran Kerajaan Mengukuhkan Integriti: Kerenah birokrasi, sikap individu tamak kuasa/wang, kekangan pemantauan menyeluruh dan keengganan pekerja menjadi pemberi maklumat (whistleblower)."],"examTip":"Apabila ditanya cadangan cara anda membantu pekerja mengekalkan integriti sebagai pelanggan, nyatakan: mematuhi giliran beratur, menolak tawaran suapan untuk mempercepat urusan, dan mengisi borang maklum balas dengan jujur."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Susun Langkah Audit Kepuasan Sekolah","voiceCaption":"Susun empat langkah menjalankan kajian kepuasan perkhidmatan kantin dan koperasi sekolah secara berintegriti.","voiceScript":"[confident] Susun keempat-empat langkah menjalankan kajian kepuasan pengguna sekolah mengikut urutan buku teks!","prompt":"Susun langkah melaksanakan kajian kepuasan perkhidmatan sekolah secara berintegriti:","hint":"Bermula dengan penyediaan instrumen soal selidik, pengumpulan data telus, analisis dapatan dan perkongsian cadangan kepada pentadbiran...","answerTokens":["1. Menyediakan borang soal selidik dan senarai semak pemerhatian yang adil bagi kantin serta koperasi.","2. Mengumpul maklum balas murid melalui temu bual dan pemerhatian tanpa sebarang paksaan.","3. Menganalisis peratusan dapatan secara jujur tanpa memalsukan skor penilaian.","4. Membentangkan laporan cadangan penambahbaikan kepada pihak pentadbiran sekolah secara bertatasusila."],"distractors":["Mengubah markah koperasi supaya mendapat ganjaran peribadi.","Menulis fitnah di papan kenyataan tanpa bukti soal selidik."],"explanation":"Kajian kepuasan pengguna berlandaskan data sahih memupuk nilai Kejujuran dan Kerjasama membina organisasi sekolah cemerlang."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Cabaran Integriti & Langkah Mengatasinya","voiceCaption":"Padankan empat cabaran memperkukuh integriti organisasi dengan langkah penyelesaian kerajaan dan pengurusan.","voiceScript":"[curious] Padankan cabaran kerajaan dalam mengukuhkan integriti organisasi ini dengan langkah penyelesaian terbaiknya!","prompt":"Padankan cabaran integriti organisasi berikut dengan langkah mengatasinya:","pairs":[{"id":"pm55u3m1","left":"Kerenah birokrasi kelulusan lambat","right":"Mendigitalkan proses kerja supaya telus dan dapat dijejak"},{"id":"pm55u3m2","left":"Ketakutan saksi melaporkan penyelewengan","right":"Melindungi identiti pemberi maklumat di bawah akta berkaitan"},{"id":"pm55u3m3","left":"Kurang kesedaran etika kerja staf baharu","right":"Menganjurkan latihan integriti berkala dan ikrar bebas rasuah"},{"id":"pm55u3m4","left":"Pemantauan operasi tidak konsisten","right":"Mengadakan audit dalaman mengejut serta sistem maklum balas pelanggan"}],"explanation":"Pendigitalan prosedur kerja, perlindungan pemberi maklumat dan audit berkala menutup ruang rasuah."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Tindakan Pelanggan Menyokong Integriti","voiceCaption":"Pilih tindakan paling berintegriti sebagai pelanggan apabila menghadapi barisan panjang di kaunter perkhidmatan.","voiceScript":"[confident] Sebagai pelanggan yang berintegriti, apakah tindakan terbaik anda untuk membantu kakitangan kaunter mengekalkan integriti mereka?","prompt":"Apakah tindakan pelanggan yang membantu pekerja mengekalkan amalan integriti (SP 6.1.6)?","options":["Mematuhi peraturan giliran, melengkapkan borang dengan jujur serta tidak menawarkan wang sogokan untuk memotong giliran","Menghulurkan wang imbuhan secara senyap supaya permohonan diluluskan segera","Memarahi petugas kaunter dengan kata-kata kesat di hadapan orang ramai","Memalsukan dokumen pengesahan demi memudahkan urusan"],"correctIndex":0,"explanation":"Integriti organisasi memerlukan kerjasama dua hala antara petugas kaunter dengan pelanggan yang menolak rasuah."}]},{"id":"pm55-u4","title":"Unit 4: 7 Elemen Teras Integriti & Ekspresi Perasaan","subtitle":"SP 6.1.1–6.1.5 — Aplikasi Elemen Kepantasan, Inovasi, Kerja Berpasukan, Prihatin, Adil & Disiplin dalam Organisasi","iconType":"crown","iconUrl":"../assets/icons/pm55-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"7 Elemen Integriti Organisasi","voiceCaption":"Halaman rangsangan Unit 5 memaparkan tujuh elemen integriti organisasi iaitu kepantasan, inovasi, kerja berpasukan, prihatin, tanggungjawab, adil dan disiplin.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari kita kuasai ketujuh-tujuh elemen integriti daripada halaman rangsangan Unit lima buku teks: satu, KEPANTASAN memberi perkhidmatan menepati piagam; dua, INOVASI menambah baik sistem telus; tiga, KERJA BERPASUKAN saling menyokong rakan sekerja; empat, PRIHATIN terhadap keperluan pelanggan dan staf; lima, TANGGUNGJAWAB memikul amanah; enam, ADIL tanpa pilih kasih; dan tujuh, DISIPLIN mematuhi waktu serta peraturan! Apabila kita berurusan dengan staf berintegriti dan mesra atau mengamalkan sendiri tujuh elemen ini mengikut S P enam perpuluhan satu perpuluhan lima, kita berasa gembira, berpuas hati dan yakin terhadap kecekapan organisasi!","title":"Penghayatan 7 Elemen Integriti Organisasi & Ekspresi Perasaan","acronym":"7•ELEMEN","hook":"Fahami perkaitan antara 7 elemen integriti dengan pengurusan koperasi, persatuan dan kerjaya masa depan!","summary":"Tujuh elemen integriti membentuk budaya organisasi unggul yang diyakini pelanggan dan membanggakan setiap anggotanya.","bullets":["Elemen Prestasi Kerja: Kepantasan (cekap mengurus masa), Inovasi (penambahbaikan sistem kerja) & Tanggungjawab (siap tugas tanpa tangguh).","Elemen Etika Sosial Organisasi: Kerja berpasukan (saling membantu), Prihatin (melayan mesra pelanggan), Adil (agihan tugas saksama) & Disiplin (patuh kod etika).","Ekspresi Perasaan (SP 6.1.5): Pelanggan dan pekerja berasa gembira, selesa, terharu dan berkeyakinan tinggi apabila integriti menjadi budaya kerja."],"examTip":"Apabila diminta menghuraikan perasaan menerima layanan mesra dan cekap di sesebuah organisasi, nyatakan perasaan positif ('gembira dan berpuas hati') serta alasannya ('kerana urusan diselesaikan pantas tanpa kerenah birokrasi')."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Elemen Prestasi vs Etika Hubungan Organisasi","voiceCaption":"Kelaskan enam situasi organisasi berikut mengikut elemen Kepantasan/Inovasi/Disiplin atau elemen Adil/Prihatin/Kerja Berpasukan.","voiceScript":"[curious] Asingkan keenam-enam perlakuan dalam organisasi berikut mengikut elemen integritinya yang tepat!","prompt":"Kelaskan amalan organisasi berikut mengikut kelompok elemen integriti Unit 5:","buckets":[{"id":"prestasi","label":"Kepantasan, Inovasi & Disiplin"},{"id":"sosial","label":"Adil, Prihatin & Kerja Berpasukan"}],"items":[{"text":"Membangunkan sistem temu janji dalam talian untuk mempercepat urusan kaunter","bucketId":"prestasi","note":"Betul! Menggabungkan elemen Inovasi dan Kepantasan."},{"text":"Majikan menilai kenaikan pangkat berdasarkan rekod prestasi tanpa pilih kasih","bucketId":"sosial","note":"Tepat! Mencerminkan elemen Adil dalam kepimpinan."},{"text":"Mematuhi waktu mula kerja tepat jam lapan pagi setiap hari tanpa ponteng","bucketId":"prestasi","note":"Betul! Teras elemen Disiplin diri."},{"text":"Membantu rakan sepasukan menyiapkan projek kecemasan sebelum tarikh tutup","bucketId":"sosial","note":"Tepat! Menunjukkan elemen Kerja Berpasukan."},{"text":"Menyiapkan laporan kewangan persatuan mengikut peraturan audit dalaman","bucketId":"prestasi","note":"Betul! Elemen Tanggungjawab dan Disiplin."},{"text":"Menyantuni pelanggan warga emas dengan mesra dan memberi keutamaan tempat duduk","bucketId":"sosial","note":"Tepat! Menonjolkan elemen Prihatin."}],"explanation":"Keseimbangan antara kecekapan sistem kerja dengan keprihatinan sosial menjadikan organisasi disegani."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Padan Elemen Integriti dengan Situasi Koperasi","voiceCaption":"Padankan empat elemen integriti daripada buku teks dengan aplikasinya oleh AJK Koperasi Sekolah.","voiceScript":"[confident] Padankan empat elemen integriti Unit lima ini dengan peranan jawatankuasa koperasi sekolah!","prompt":"Padankan elemen integriti berikut dengan amalan di koperasi sekolah:","pairs":[{"id":"pm55u4m1","left":"Elemen Kepantasan","right":"Mengira baki jualan buku dengan cekap agar barisan pelajar lancar"},{"id":"pm55u4m2","left":"Elemen Adil","right":"Menetapkan jadual bertugas ahli jawatankuasa secara bergilir dan saksama"},{"id":"pm55u4m3","left":"Elemen Inovasi","right":"Memperkenalkan sistem imbasan kod bar stok supaya rekod tepat"},{"id":"pm55u4m4","left":"Elemen Prihatin","right":"Membantu murid tingkatan satu mencari senarai alat tulis yang betul"}],"explanation":"Aplikasi di koperasi sekolah membuktikan pelajar mampu mempraktikkan integriti organisasi secara nyata."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Tindakan Menghadapi Layanan Kurang Mesra","voiceCaption":"Pilih cara paling berhemah untuk memberi teguran sekiranya menerima layanan kurang mesra di kaunter organisasi.","voiceScript":"[confident] Jika anda berhadapan dengan layanan kurang mesra di sebuah kaunter perkhidmatan, apakah tindakan paling berintegriti dan sopan?","prompt":"Apakah tindakan paling berintegriti apabila menerima layanan kurang mesra di sesebuah organisasi?","options":["Mengemukakan aduan atau maklum balas berfakta melalui saluran rasmi organisasi secara bertatasusila demi penambahbaikan","Merakam wajah petugas tanpa izin lalu menularkan kata-kata hinaan di media sosial","Merosakkan peralatan di ruang menunggu kaunter kerana berasa marah","Menawarkan wang kepada pengurus supaya petugas itu dibuang kerja serta-merta"],"correctIndex":0,"explanation":"Saluran maklum balas rasmi memelihara adab serta membantu organisasi membetulkan kelemahan sistemik."}]},{"id":"pm55-u5","title":"Unit 5: Cabaran Boss Unit 5 — Integriti Organisasi","subtitle":"Penilaian Sumatif SPM Unit 5: 5 Nilai Cadangan, Definisi Kod Etika/Piagam, Pekerja A/B & Impak","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: 5 Nilai Cadangan Unit 5","voiceCaption":"Pilih himpunan kesemua lima nilai cadangan rasmi KSSM bagi Unit 5 Integriti Pemacu Kecemerlangan Organisasi.","voiceScript":"[excited] Cabaran Boss Unit lima bermula! Pilih himpunan kesemua lima nilai cadangan rasmi K S S M bagi Unit lima Integriti Pemacu Kecemerlangan Organisasi!","prompt":"Manakah himpunan KESEMUA lima nilai cadangan KSSM bagi Unit 5?","options":["Kejujuran, Kerjasama, Bertanggungjawab, Kebebasan dan Berdikari","Hormat, Rasional, Toleransi, Patriotisme dan Kesederhanaan","Kepercayaan kepada Tuhan, Kasih sayang, Baik hati dan Harga diri","Keberanian, Berterima kasih, Kerajinan dan Kesetiaan"],"correctIndex":0,"explanation":"Lima nilai cadangan Unit 5 ialah Kejujuran, Kerjasama, Bertanggungjawab, Kebebasan dan Berdikari."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Impak Majikan Pilih Kasih","voiceCaption":"Ramalkan kesan terhadap semangat berpasukan apabila seorang majikan bersikap pilih kasih dalam pemberian ganjaran.","voiceScript":"[curious] Ramalkan implikasi utama apabila pihak pengurusan organisasi bersikap pilih kasih dalam mengagihkan tugas dan kenaikan pangkat!","hook":"Fikirkan kesannya kepada motivasi pekerja cemerlang dan keharmonian organisasi!","scenario":"Seorang penyelia hanya menaikkan pangkat rakan rapatnya walaupun pekerja lain menunjukkan rekod kerja cemerlang.","prompt":"Apakah kesan UTAMA tindakan tidak berintegriti tersebut?","options":["Motivasi pekerja berdedikasi merosot, berlaku konflik dalaman dan organisasi kehilangan bakat terbaik","Semua pekerja menjadi semakin bersemangat dan mesra pelanggan","Piagam pelanggan tercapai dengan lebih pantas","Pengiktirafan masyarakat terhadap ketelusan organisasi meningkat"],"correctIndex":0,"explanation":"Amalan pilih kasih meruntuhkan kepercayaan warga kerja serta melumpuhkan daya saing organisasi."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Jawapan Esei SPM Unit 5","voiceCaption":"Susun struktur jawapan esei Pendidikan Moral SPM mengenai kepentingan integriti dalam organisasi.","voiceScript":"[confident] Susun keempat-empat segmen ini membentuk jawapan esei S P M Unit lima yang lengkap dengan Nilai, Kepentingan, Contoh dan Kesan!","prompt":"Susun segmen berikut menjadi jawapan esei SPM yang mantap bagi Unit 5:","hint":"Mulakan dengan nilai cadangan Unit 5, kepentingan terhadap pelanggan & BCA, contoh pematuhan etika/piagam dan pengiktirafan...","answerTokens":["Nilai yang patut diamalkan ialah nilai kejujuran dan bertanggungjawab dalam pengurusan organisasi.","Amalan integriti penting untuk meningkatkan kepuasan pelanggan serta membentuk warga kerja yang bersih, cekap dan amanah.","Sebagai contoh, kakitangan menepati waktu kerja, mematuhi piagam pelanggan dan menolak sebarang bentuk rasuah.","Kesannya, visi dan misi organisasi mudah tercapai serta mendapat pengiktirafan tinggi daripada masyarakat."],"distractors":["Pekerja digalakkan menangguhkan tugasan dan membuat kerja peribadi di pejabat.","Maklum balas pelanggan wajar diabaikan supaya pekerja tidak tertekan."],"explanation":"Jawapan mengintegrasikan nilai Unit 5, SP 6.1.3, amalan nyata dan kesan pengiktirafan masyarakat."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Standard Pembelajaran Unit 5","voiceCaption":"Padankan empat Standard Pembelajaran SP 6.1.1 hingga 6.1.4 dengan intipatinya.","voiceScript":"[confident] Padankan kesemua empat Standard Pembelajaran Unit lima ini dengan fokus kandungannya!","prompt":"Padankan Standard Pembelajaran Unit 5 berikut dengan maksudnya:","pairs":[{"id":"pm55u5m1","left":"SP 6.1.1 Maksud","right":"Pematuhan amalan terbaik berteraskan kod etika, piagam pelanggan dan proses kerja"},{"id":"pm55u5m2","left":"SP 6.1.2 Cara Laksana","right":"Patuh kod etika, program antirasuah, hayati visi-misi dan kuat kuasa peraturan"},{"id":"pm55u5m3","left":"SP 6.1.3 Kepentingan","right":"Keputusan pantas, kepuasan pelanggan, budaya BCA & pengiktirafan masyarakat"},{"id":"pm55u5m4","left":"SP 6.1.4 Implikasi Abai","right":"Produktiviti merosot, rasuah menular dan keyakinan awam hilang"}],"explanation":"Keempat-empat SP membentuk teras penguasaan topik Integriti Organisasi."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Penutup: Definisi Tepat Integriti Organisasi","voiceCaption":"Pilih pernyataan yang paling tepat merumuskan maksud dan nilai teras integriti organisasi.","voiceScript":"[excited] Soalan penutup Boss Unit li function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
