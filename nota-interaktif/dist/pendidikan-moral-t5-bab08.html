/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);

}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

libatan Diri Peneraju Komuniti! Lima nilai cadangan K S S M unit ini ialah Patriotisme, Berterima Kasih, Kerjasama, Kerajinan dan Kasih Sayang. Penglibatan diri dalam program komuniti ialah tindakan sukarela berganding bahu bersama-sama Badan Kerajaan seperti Jabatan Kebajikan Masyarakat dan Pertubuhan Bukan Kerajaan atau N G O! Antara contoh program dalam buku teks termasuklah program amal, bantuan bencana, santunan golongan gelandangan, kutipan dana pembedahan jantung bayi, gotong-royong membersihkan pantai, program Pembelajaran Berkhidmat atau Service Learning serta Minggu Wira Alam Sekitar! Terokai semua panduan dalam makmal di bawah!","title":"7.1.1 & 7.1.2 Program Komuniti Kerajaan/NGO & Cara Pelaksanaan","acronym":"NGO•BAKTI","hook":"Buka makmal Komuniti untuk meneliti contoh program NGO, 5 kluster Dasar Kebersihan Negara dan kesan kurang penglibatan!","mediaKey":"pm58_komuniti_ngo","summary":"Program komuniti kerajaan dan NGO memberi peluang warganegara berbakti secara sukarela membangunkan masyarakat setempat dan membantu golongan memerlukan.","bullets":["Nilai Cadangan Unit 8: Patriotisme, Berterima kasih, Kerjasama, Kerajinan dan Kasih sayang.","Contoh Program Komuniti (SP 7.1.1): Program amal, bantuan bencana alam, santunan gelandangan, kutipan dana pembedahan jantung bayi, kempen kesedaran kerajaan, gotong-royong pantai & Minggu Wira Alam Sekitar.","Cara Melaksanakan (SP 7.1.2): Merancang objektif bersama-sama NGO/badan kerajaan (JKM), mendaftar sebagai sukarelawan, menghebahkan kempen melalui media sosial, dan melaksanakan Pembelajaran Berkhidmat (Service Learning)."],"labId":"pm58_komuniti_lab","labTitle":"Makmal Komuniti & Dasar Kebersihan 2030 (SP 7.1.1–7.1.4)","labProps":{"tab":"program"},"examTip":"Semasa menjawab soalan cara menghebahkan program komuniti (SP 7.1.2), sebutkan saluran moden dan bersemuka: poster digital media sosial, laman sesawang JKM/NGO, siar raya sekolah serta kerjasama pemimpin komuniti setempat."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Program Kebajikan vs Pemuliharaan Alam","voiceCaption":"Kelaskan enam aktiviti komuniti daripada buku teks Unit 8 mengikut fokus Kebajikan Sosial atau Kelestarian Alam Sekitar.","voiceScript":"[curious] Asingkan keenam-enam aktiviti komuniti daripada buku teks Unit lapan ini mengikut fokus utamanya!","prompt":"Kelaskan program komuniti berikut mengikut bidang fokusnya:","buckets":[{"id":"kebajikan","label":"Kebajikan Sosial & Kesihatan"},{"id":"alam","label":"Kelestarian Alam Sekitar"}],"items":[{"text":"Kutipan dana untuk pembedahan jantung bayi berusia tujuh bulan","bucketId":"kebajikan","note":"Betul! Bantuan kemanusiaan menyelamatkan nyawa."},{"text":"Aktiviti sifar sampah dan penghasilan baja organik daripada sisa makanan","bucketId":"alam","note":"Tepat! Aktiviti Minggu Wira Alam Sekitar."},{"text":"Agihan makanan serta khidmat sokongan kepada golongan gelandangan","bucketId":"kebajikan","note":"Betul! Kerjasama badan kebajikan dengan NGO."},{"text":"Gotong-royong membersihkan pantai bersama-sama komuniti setempat","bucketId":"alam","note":"Tepat! Mengurangkan pencemaran marin dan plastik."},{"text":"Misi bantuan kecemasan kepada mangsa banjir dan bencana alam","bucketId":"kebajikan","note":"Betul! Tindakan sukarelawan ketika krisis."},{"text":"Pertandingan inovasi bahan kitar semula yang boleh dikomersialkan","bucketId":"alam","note":"Tepat! Menyokong ekonomi kitaran komuniti."}],"explanation":"Penglibatan komuniti meliputi kebajikan golongan terpinggir dan kelestarian alam sekitar secara seimbang."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan 4 Nilai Unit 8 & Tindakan Komuniti","voiceCaption":"Padankan empat nilai cadangan Unit 8 dengan pengamalannya dalam kerja kesukarelawanan.","voiceScript":"[confident] Padankan setiap nilai cadangan Unit lapan ini dengan contoh tindakan sukarelanya!","prompt":"Padankan nilai universal Unit 8 berikut dengan amalannya:","pairs":[{"id":"pm58u1m1","left":"Nilai Kerjasama","right":"Berganding bahu dengan NGO dan jiran membersihkan kawasan komuniti"},{"id":"pm58u1m2","left":"Nilai Patriotisme","right":"Menjayakan dasar kebersihan kebangsaan demi imej dan kesejahteraan negara"},{"id":"pm58u1m3","left":"Nilai Kerajinan","right":"Tekun menghasilkan baja organik dan inovasi kitar semula dalam kempen"},{"id":"pm58u1m4","left":"Nilai Berterima Kasih","right":"Menghargai pengorbanan sukarelawan, JKM dan penderma dana kebajikan"}],"explanation":"Kesemua nilai ini menggerakkan semangat kekitaan dalam masyarakat majmuk."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Pendaftaran Sukarelawan Jabatan Kebajikan Masyarakat","voiceCaption":"Pilih cara paling berkesan membantu rakan yang gementar untuk menyertai aktiviti kesukarelawanan buat kali pertama.","voiceScript":"[confident] Mengikut situasi dialog rakan Darshana yang teringin menyertai sukarelawan tetapi gementar berhadapan orang ramai, bagaimanakah cara terbaik membantunya?","prompt":"Apakah cara terbaik membantu rakan yang berminat menjadi sukarelawan tetapi berasa gementar (situasi dialog buku teks)?","options":["Menemaninya mendaftar secara rasmi, bermula dengan tugasan sokongan logistik secara berkumpulan dan memberi dorongan moral","Mengejek perasaan gementarnya di hadapan ahli kumpulan lain","Menyuruhnya menarik diri terus daripada semua program kemasyarakatan","Memaksanya berucap bersendirian di pentas utama pada hari pertama tanpa persediaan"],"correctIndex":0,"explanation":"Sokongan moral rakan dan pendedahan berperingkat dalam kumpulan membantu membina keyakinan sukarelawan baharu."}]},{"id":"pm58-u2","title":"Unit 2: Dasar Kebersihan Negara 2030 (5 Kluster KPKT)","subtitle":"SP 7.1.1–7.1.6 — Lima Kluster Dasar Kebersihan Negara, Ekonomi Kitaran & Sasaran Tahun 2030","iconType":"scale","iconUrl":"../assets/icons/pm58-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Dasar Kebersihan Negara Tahun 2030","voiceCaption":"Dasar Kebersihan Negara oleh Kementerian Perumahan dan Kerajaan Tempatan memberi tumpuan kepada lima kluster utama bagi mencapai sasaran negara bersih menjelang tahun 2030.","voiceScript":"[warm] Selamat datang ke Unit dua! Antara bahan rujukan utama buku teks Unit lapan ialah DASAR KEBERSIHAN NEGARA terbitan Kementerian Perumahan dan Kerajaan Tempatan atau K P K T! Dasar ini bertujuan membentuk negara bersih, mampan dan sejahtera menjelang tahun dua ribu tiga puluh berteraskan LIMA KLUSTER: satu, kesedaran tentang kebersihan; dua, kelestarian alam sekitar; tiga, ekonomi kitaran atau circular economy iaitu mengubah sisa menjadi sumber bernilai; empat, tadbir urus dan penguatkuasaan; dan lima, modal insan berkualiti dan berkemahiran! Antara sasaran penting tahun dua ribu tiga puluh ialah mengurangkan sisa ke tapak pelupusan, menurunkan kes penyakit bawaan vektor seperti denggi serta mengurangkan kos pembersihan kerajaan menerusi penglibatan komuniti! Klik tab Dasar Kebersihan dalam makmal untuk menelitinya!","title":"5 Kluster Dasar Kebersihan Negara & Sasaran Tahun 2030 (KPKT)","acronym":"5•DKN•2030","hook":"Lihat kesemua 5 kluster Dasar Kebersihan Negara dan sasaran 2030 dalam makmal komuniti!","mediaKey":"pm58_dasar_kebersihan","summary":"Kejayaan Dasar Kebersihan Negara 2030 bergantung pada sinergi lima kluster antara kerajaan, pihak swasta, NGO dan pembudayaan sikap bersih setiap komuniti.","bullets":["5 Kluster Dasar Kebersihan Negara (KPKT): (1) Kesedaran kebersihan, (2) Kelestarian alam sekitar, (3) Ekonomi kitaran (Circular economy), (4) Tadbir urus & penguatkuasaan, (5) Modal insan berkualiti & berkemahiran.","Sasaran Utama Tahun 2030: Perubahan minda masyarakat, peningkatan kadar kitar semula & pengurangan sisa tapak pelupusan, penurunan penyakit bawaan vektor serta peningkatan kemahiran pekerja pembersihan.","Sinergi Kerajaan–NGO–Komuniti: Penglibatan aktif masyarakat dan swasta mengurangkan beban pembiayaan kerajaan dalam pengurusan sisa pepejal."],"labId":"pm58_komuniti_lab","labTitle":"5 Kluster Dasar Kebersihan Negara 2030 (KPKT)","labProps":{"tab":"dkn"},"examTip":"Dalam soalan esei SPM, sebutkan 'Ekonomi Kitaran (Circular Economy)' daripada Kluster 3 Dasar Kebersihan Negara sebagai hujah bagaimana sisa makanan/kitar semula boleh menjana pendapatan komuniti!"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Susun 5 Kluster Dasar Kebersihan Negara","voiceCaption":"Susun kelima-lima kluster Dasar Kebersihan Negara (KPKT) mengikut senarai rasmi buku teks Unit 8.","voiceScript":"[confident] Susun kelima-lima kluster Dasar Kebersihan Negara K P K T yang tercatat dalam buku teks Unit lapan!","prompt":"Susun 5 kluster utama Dasar Kebersihan Negara mengikut urutan buku teks:","hint":"Bermula dengan kesedaran kebersihan, kelestarian alam, ekonomi kitaran, tadbir urus/penguatkuasaan dan modal insan...","answerTokens":["1. Kesedaran tentang kebersihan","2. Kelestarian alam sekitar","3. Ekonomi kitaran (Circular economy)","4. Tadbir urus, penguatkuasaan serta modal insan berkualiti"],"distractors":["Peningkatan pembuangan sampah tanpa pengasingan sisa","Pengurangan program kesedaran awam di kawasan perumahan"],"explanation":"Kelima-lima kluster tersebut menjadi teras pelaksanaan Dasar Kebersihan Negara 2020–2030."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan Kluster DKN & Sasaran 2030","voiceCaption":"Padankan elemen Dasar Kebersihan Negara dengan sasaran impaknya menjelang 2030.","voiceScript":"[curious] Padankan elemen Dasar Kebersihan Negara ini dengan sasarannya menjelang tahun dua ribu tiga puluh!","prompt":"Padankan elemen Dasar Kebersihan Negara berikut dengan sasarannya:","pairs":[{"id":"pm58u2m1","left":"Ekonomi Kitaran (Kluster 3)","right":"Mengurangkan sisa tapak pelupusan & menukar bahan terpakai bernilai"},{"id":"pm58u2m2","left":"Penurunan Penyakit Bawaan Vektor","right":"Membasmi tempat pembiakan nyamuk aedes dan tikus melalui gotong-royong"},{"id":"pm58u2m3","left":"Kerjasama Komuniti, NGO & Swasta","right":"Mengurangkan beban pembiayaan kerajaan mengurus sisa pepejal awam"},{"id":"pm58u2m4","left":"Modal Insan Berkualiti (Kluster 5)","right":"Meningkatkan kemahiran serta kebajikan pekerja sektor pembersihan"}],"explanation":"Setiap sasaran 2030 hanya tercapai jika kerajaan dan komuniti bekerjasama secara aktif."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Maksud Ekonomi Kitaran dalam Kebersihan","voiceCaption":"Pilih pernyataan tepat tentang konsep ekonomi kitaran (circular economy) dalam Dasar Kebersihan Negara.","voiceScript":"[confident] Apakah yang dimaksudkan dengan pelaksanaan Ekonomi Kitaran dalam Kluster tiga Dasar Kebersihan Negara?","prompt":"Apakah fokus utama Kluster Ekonomi Kitaran (Circular Economy) dalam Dasar Kebersihan Negara?","options":["Mengguna semula, membaiki dan mengitar semula bahan sisa seperti sisa makanan atau plastik menjadi produk bernilai ekonomi","Membakar semua sisa plastik secara terbuka di kawasan perumahan","Membuang semua barangan sekali pakai terus ke tapak pelupusan sampah","Menghentikan semua aktiviti kitar semula di sekolah dan komuniti"],"correctIndex":0,"explanation":"Ekonomi kitaran mengubah sisa buangan menjadi sumber baharu (contoh: baja kompos sisa makanan atau inovasi kitar semula) untuk mengurangkan sisa ke tapak pelupusan."}]},{"id":"pm58-u3","title":"Unit 3: Kepentingan vs Implikasi Kurang Penglibatan Komuniti","subtitle":"SP 7.1.3 & 7.1.4 — Semangat Kekitaan & Pengurangan Vandalisme vs Pengabaian Golongan Memerlukan & Isu Sukarela Paksaan","iconType":"globe","iconUrl":"../assets/icons/pm58-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Kepentingan & Kesan Kurang Penglibatan","voiceCaption":"Penglibatan aktif komuniti merentas kaum membina semangat kekitaan dan mengurangkan vandalisme, manakala kurangnya penyertaan meminggirkan golongan memerlukan.","voiceScript":"[warm] Selamat datang ke Unit tiga! Mengikut S P tujuh perpuluhan satu perpuluhan tiga, apakah enam kepentingan melaksanakan program komuniti bersama-sama badan kerajaan dan N G O? Satu, melibatkan masyarakat tanpa mengira kaum; dua, mengurangkan gejala sosial seperti vandalisme; tiga, mewujudkan semangat kekitaan dan kerja berpasukan; empat, meningkatkan keyakinan dalam kalangan anggota masyarakat; lima, menyumbang kepada pembangunan negara; dan enam, memastikan program komuniti berjaya dilaksanakan! Sebaliknya, jika masyarakat kurang terlibat — contohnya dalam kutipan dana pembedahan jantung bayi atau gotong-royong pantai — golongan memerlukan gagal diselamatkan tepat waktu, pencemaran pantai memburuk dan beban kerajaan bertambah! Buku teks turut mengajak kita mengulas isu: mengapa penglibatan secara paksaan lebih banyak daripada sukarela, dan bagaimana menyemai kesedaran tulus?","title":"7.1.3 Kepentingan vs 7.1.4 Implikasi Kurang Penglibatan Komuniti","acronym":"KEKITAAN•VOL","hook":"Bandingkan kesan penglibatan aktif dengan implikasi pengabaian dana pembedahan bayi dan gotong-royong!","summary":"Kesukarelawanan tulus mengatasi budaya paksaan, menyatukan masyarakat berbilang kaum serta membela kebajikan golongan rentan dan alam sekitar.","bullets":["Kepentingan Program Komuniti (SP 7.1.3): Penyertaan merentas kaum, pengurangan vandalisme, semangat kekitaan & berpasukan, peningkatan keyakinan diri, sumbangan pembangunan negara serta kejayaan program.","Implikasi Kurang Penglibatan (SP 7.1.4): Kos pembedahan jantung bayi tidak mencukupi dan mengancam nyawa; kempen kesedaran kerajaan gagal mencapai sasaran; sampah pantai menjejaskan hidupan marin dan pelancongan.","Sukarela vs Paksaan: Mengatasi penglibatan kerana paksaan melalui pendidikan empati sejak sekolah, pengiktirafan khidmat masyarakat serta teladan pemimpin muda."],"labId":"pm58_komuniti_lab","labTitle":"Impak Komuniti & Dilema Sukarelawan (SP 7.1.3–7.1.4)","labProps":{"tab":"impak"},"examTip":"Dalam soalan refleksi 'Mengapa penyertaan sukarela lebih berkesan daripada paksaan?', huraikan faktor kesungguhan hati, komitmen berterusan tanpa mengharapkan ganjaran dan kepuasan moral sejati."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Impak Penglibatan Aktif vs Kurang Penglibatan","voiceCaption":"Kelaskan enam kesan sosial berikut antara Impak Penglibatan Aktif Komuniti dengan Implikasi Kurang Penglibatan.","voiceScript":"[curious] Asingkan keenam-enam kesan berikut mengikut Kepentingan Penglibatan Aktif atau Implikasi Kurang Penglibatan!","prompt":"Kelaskan pernyataan berikut mengikut SP 7.1.3 atau SP 7.1.4:","buckets":[{"id":"aktif","label":"Kepentingan Penglibatan Aktif"},{"id":"kurang","label":"Implikasi Kurang Penglibatan"}],"items":[{"text":"Mewujudkan semangat kekitaan dan pengurangan gejala vandalisme remaja","bucketId":"aktif","note":"Betul! Tanggungjawab bersama melindungi harta komuniti."},{"text":"Kos pembedahan jantung bayi gagal ditampung tepat pada masanya","bucketId":"kurang","note":"Tepat! Mengancam peluang hidup pesakit memerlukan."},{"text":"Mengeratkan kerjasama merentas kaum serta meningkatkan keyakinan diri","bucketId":"aktif","note":"Betul! Tercatat dalam senarai kepentingan buku teks."},{"text":"Sampah di pantai semakin menimbun sehingga mencemarkan hidupan laut","bucketId":"kurang","note":"Tepat! Kesan gotong-royong tidak mendapat sambutan."},{"text":"Membantu meringankan kos kerajaan dalam pengurusan kebersihan awam","bucketId":"aktif","note":"Betul! Salah satu sasaran kerjasama komuniti DKN 2030."},{"text":"Kempen kesedaran penyakit bawaan vektor gagal mengubah tabiat penduduk","bucketId":"kurang","note":"Tepat! Kes denggi dan vektor sukar dibendung."}],"explanation":"Penyertaan komuniti secara sukarela adalah pemangkin kejayaan projek kebajikan dan kelestarian."},{"type":"match","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Padan Situasi Penglibatan & Implikasinya","voiceCaption":"Padankan empat situasi daripada bahagian Penilaian buku teks Unit 8 dengan kesannya.","voiceScript":"[confident] Padankan setiap situasi daripada bahagian Penilaian Unit lapan dengan kesan atau nilai moralnya!","prompt":"Padankan situasi program komuniti berikut dengan impaknya:","pairs":[{"id":"pm58u3m1","left":"Minggu Wira Alam Sekitar sekolah","right":"Mendidik murid inovasi kitar semula dan aktiviti sifar sampah"},{"id":"pm58u3m2","left":"Tabung pembedahan jantung bayi","right":"Menyelamatkan nyawa bayi menerusi solidariti derma masyarakat"},{"id":"pm58u3m3","left":"Penglibatan komuniti secara sukarela","right":"Melahirkan komitmen tulus berbanding kehadiran kerana paksaan"},{"id":"pm58u3m4","left":"Kempen kesedaran kerajaan + penduduk","right":"Meningkatkan kesedaran kebersihan diri dan pengurangan denggi"}],"explanation":"Setiap situasi membuktikan kekuatan tindakan kolektif komuniti berbanding usaha terpencil."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Kelebihan Sukarela Berbanding Paksaan","voiceCaption":"Pilih pernyataan tepat tentang mengapa kesukarelawanan tulus lebih baik daripada penyertaan kerana paksaan.","voiceScript":"[confident] Mengikut refleksi buku teks Unit lapan, mengapakah penglibatan secara sukarela lebih berkesan berbanding penglibatan secara paksaan?","prompt":"Mengapakah penglibatan secara SUKARELA dalam program komuniti lebih bermakna daripada paksaan?","options":["Kerana sukarelawan bertindak dengan ikhlas, bertanggungjawab dan berterusan tanpa menunggu arahan atau ganjaran luar","Kerana sukarelawan tidak perlu mematuhi peraturan keselamatan program","Kerana paksaan lebih menjamin rasa gembira dan keikhlasan dalam kalangan belia","Kerana kerja amal hanya sesuai dilakukan apabila diberikan markah hukuman"],"correctIndex":0,"explanation":"Kesukarelawanan lahir daripada kesedaran moral dalaman (emosi dan penaakulan moral) yang menghasilkan impak berpanjangan."}]},{"id":"pm58-u4","title":"Unit 4: Dilema Misi Wabak & Ekspresi Sukarelawan","subtitle":"SP 7.1.5 & 7.1.6 — Dilema Moral Sukarelawan Wabak Negara Jiran serta Perasaan Apabila Berbakti","iconType":"crown","iconUrl":"../assets/icons/pm58-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Dilema Misi Wabak & Perasaan Berbakti","voiceCaption":"Dilema moral menyertai misi kemanusiaan wabak negara jiran diselesaikan dengan mematuhi SOP perlindungan kesihatan lengkap serta merundingi restu keluarga secara berhemah.","voiceScript":"[warm] Selamat datang ke Unit empat! Mari kita selesaikan DILEMA MORAL paling mencabar dalam Unit lapan buku teks: anda merupakan sukarelawan pertubuhan Malaysia yang terpilih mengikuti misi bantuan kemanusiaan ke negara jiran yang sedang dilanda wabak berbahaya, tetapi keluarga anda amat khuatir akan keselamatan diri anda! Apakah tindakan paling bermoral dan rasional? Pertama, bincangkan secara berhemah bersama keluarga dengan menjelaskan langkah perlindungan kesihatan S O P lengkap, pemakaian alat pelindung diri serta protokol insurans dan kuarantin pihak pertubuhan; kedua, pastikan kesihatan fizikal sendiri benar-benar cergas sebelum menyertai misi; atau sekiranya perlu menjaga keselamatan keluarga berisiko tinggi, sumbangkan tenaga di pusat pengumpulan logistik tanah air! Apabila berjaya berbakti mengikut S P tujuh perpuluhan satu perpuluhan lima, sukarelawan berasa gembira, bangga dan bersyukur!","title":"Penyelesaian Dilema Sukarelawan Wabak & Ekspresi Perasaan","acronym":"SOP•RESTU","hook":"Susun hujah justifikasi seimbang bagi menyelesaikan dilema antara panggilan kemanusiaan dengan kerisauan keluarga!","summary":"Kesukarelawanan bijaksana mengimbangi semangat kemanusiaan dan patriotisme dengan prosedur keselamatan diri serta ketenangan hati keluarga.","bullets":["Dilema Misi Wabak Negara Jiran: Jelaskan jaminan SOP perubatan & peralatan pelindung diri (PPE) kepada keluarga bagi memperoleh keizinan yang tenang, atau ambil peranan logistik tanah air jika berisiko tinggi.","Ekspresi Perasaan Sukarelawan (SP 7.1.5): Berasa gembira, puas hati, terharu dan bersyukur apabila melihat penerima bantuan tersenyum serta komuniti semakin bersih.","Amalan Sekolah (SP 7.1.6): Menganjurkan projek Pembelajaran Berkhidmat (Service Learning) bersama PIBG, JKM atau NGO alam sekitar setempat."],"examTip":"Dalam soalan Dilema Moral SPM, nyatakan pilihan tindakan anda dengan jelas ('Saya akan menyertai misi setelah memenuhi SOP keselamatan dan mendapat restu keluarga') diikuti 2 nilai dan 3 huraian sebab!"},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Susun Justifikasi Dilema Sukarelawan Wabak","voiceCaption":"Susun empat segmen ayat menyelesaikan dilema sukarelawan misi wabak negara jiran secara rasional dan berhemah.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk jawapan justifikasi terbaik bagi dilema sukarelawan misi wabak!","prompt":"Susun segmen penyelesaian dilema sukarelawan misi wabak negara jiran berikut:","hint":"Mulakan dengan pendirian menyertai dengan syarat SOP & restu keluarga, penerangan perlindungan PPE/kesihatan, nilai moral dan kesannya...","answerTokens":["Saya wajar menyertai misi kemanusiaan tersebut setelah memastikan protokol keselamatan perubatan lengkap dan mendapat restu keluarga.","Saya akan menerangkan prosedur pemakaian alat pelindung diri, latihan kesihatan serta jaminan pemantauan NGO bagi melegakan kerisauan ibu bapa.","Langkah ini menzahirkan nilai kasih sayang dan keberanian yang diimbangi dengan pertimbangan rasional.","Kesannya, mangsa wabak terbantu dengan selamat manakala keharmonian hubungan kekeluargaan tetap terpelihara."],"distractors":["Saya akan pergi secara senyap-senyap tanpa memberitahu keluarga langsung.","Saya akan menolak pemakaian pelitup muka dan sarung tangan demi menjimatkan kos."],"explanation":"Penyelesaian ini mengimbangi nilai Kasih Sayang kepada mangsa serta Hormat dan Rasional terhadap kebimbangan keluarga."},{"type":"match","xp":20,"voiceIdKey":"u4-s3","   return Boolean(CHAPTER && /inggeris|english/i.test(String(CHAPTER.subject || "")));
}

function tUi(msText, enText) {
  return isEnglishNota() ? enText : msText;
}

var notaState = {
  mode: "map",
  activeUnitIdx: 0,
  activeStepIdx: 0,
  hearts: 5,
  maxHearts: 5,
  xp: 0,
  unitXpEarned: 0,
  combo: 0,
  maxCombo: 0,
  unitCorrect: 0,
  unitTotal: 0,
  completedUnits: {},
  muted: false,
  voiceAutoplay: true,
  answeredCurrent: false,
  activeLabCleanups: []
};

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* Procedural Web Audio Synthesizer — Zero external MP3s, iframe-sandbox safe */
var NotaAudio = (function () {
  var ctx = null;
  function getCtx() {
    if (notaState.muted || typeof window === "undefined") return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") {
      try { ctx.resume(); } catch (e2) {}
    }
    return ctx;
  }
  function tone(freq, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  var noiseBuf = null;
  function noiseBurst(dur, filterFreq, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
      var len = Math.floor(c.sampleRate * 0.5);
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    var t0 = c.currentTime + (delay || 0);
    var src = c.createBufferSource();
    src.buffer = noiseBuf;
    var filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(filterFreq || 1200, t0);
    filter.Q.setValueAtTime(1.1, t0);
    var gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.09, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }
  function sweepTone(fStart, fEnd, dur, type, gainVal, delay) {
    var c = getCtx();
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(fStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  return {
    playTap: function () { tone(540, 0.06, "triangle", 0.07, 0); },
    playSnap: function () {
      tone(620, 0.045, "triangle", 0.1, 0);
      tone(930, 0.08, "sine", 0.11, 0.03);
    },
    playLaserZap: function () {
      sweepTone(520, 170, 0.18, "sawtooth", 0.065, 0);
      tone(210, 0.12, "triangle", 0.06, 0.06);
    },
    playMatch: function () { tone(659.25, 0.1, "sine", 0.11, 0); tone(880, 0.13, "sine", 0.11, 0.06); },
    playCorrect: function (combo) {
      var shift = Math.min(6, Number(combo) || 0) * 28;
      tone(523.25 + shift, 0.12, "triangle", 0.13, 0);
      tone(659.25 + shift, 0.14, "triangle", 0.13, 0.08);
      tone(783.99 + shift, 0.22, "sine", 0.14, 0.16);
    },
    playWrong: function () {
      tone(240, 0.15, "sawtooth", 0.08, 0);
      tone(190, 0.22, "sawtooth", 0.08, 0.12);
    },
    playFanfare: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        tone(f, 0.24, "triangle", 0.13, i * 0.09);
      });
    },
    playPaperRustle: function () {
      noiseBurst(0.11, 1650, 0.08, 0);
      noiseBurst(0.08, 2200, 0.05, 0.04);
    },
    playPrintingPress: function () {
      sweepTone(145, 70, 0.16, "triangle", 0.14, 0);
      noiseBurst(0.06, 1850, 0.09, 0.04);
      sweepTone(125, 65, 0.15, "triangle", 0.12, 0.13);
      tone(980, 0.06, "square", 0.04, 0.2);
    },
    playOceanWave: function () {
      noiseBurst(0.36, 420, 0.07, 0);
      tone(1046.5, 0.14, "sine", 0.05, 0.06);
    },
    playFortressBoom: function () {
      sweepTone(105, 38, 0.34, "triangle", 0.16, 0);
      noiseBurst(0.18, 480, 0.08, 0.02);
    },
    playTypewriterTick: function () {
      tone(2100, 0.022, "square", 0.035, 0);
    },
    playBossDrum: function () {
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0);
      sweepTone(150, 82, 0.15, "triangle", 0.14, 0.14);
      sweepTone(210, 110, 0.26, "triangle", 0.16, 0.28);
    }
  };
})();

function resolveNotaWorldTheme_() {
  var subj = String((CHAPTER && CHAPTER.subject) || "");
  if (/sejarah/i.test(subj)) return "sejarah";
  if (/melayu/i.test(subj)) return "bm";
  if (/inggeris|english/i.test(subj)) return "bi";
  if (/matematik/i.test(subj)) return "math";
  if (/islam/i.test(subj)) return "pi";
  if (/geografi/i.test(subj)) return "geo";
  return "sains";
}

}

function renderTopHud() {
  var inLesson = notaState.mode === "lesson";
  var progWrap = document.getElementById("notaProgressWrap");
  var brandWrap = document.getElementById("notaBrandWrap");
  var backBtn = document.getElementById("notaBackBtn");
  if (progWrap) progWrap.hidden = !inLesson;
  if (brandWrap) brandWrap.hidden = inLesson;
  if (backBtn) {
    var canStepBack = inLesson && notaState.activeStepIdx > 0;
    var backLabel = canStepBack
      ? tUi("Undur ke langkah ", "Back to step ") + notaState.activeStepIdx
      : (inLesson ? tUi("Kembali ke Peta Bab", "Back to Chapter Map") : tUi("Kembali ke Katalog Nota", "Back to Notes Catalog"));
    backBtn.setAttribute("aria-label", backLabel);
    backBtn.setAttribute("title", backLabel);
  }
  var mapExitBtn = document.getElementById("notaMapExitBtn");
  if (mapExitBtn) {
    mapExitBtn.hidden = !(inLesson && notaState.activeStepIdx > 0);
    if (isEnglishNota()) {
      mapExitBtn.setAttribute("aria-label", "Back to Chapter Map");
      mapExitBtn.setAttribute("title", "Back to Chapter Map");
    }
  }

  var subjEl = document.getElementById("notaTopSubject");
  var titleEl = document.getElementById("notaTopTitle");
  if (subjEl) subjEl.textContent = (CHAPTER.subject || "SPM") + (isEnglishNota() ? " • Form " : " • Ting. ") + (CHAPTER.form || 4);
  if (titleEl) titleEl.textContent = (isEnglishNota() ? "Chapter " : "Bab ") + (CHAPTER.chapterNumber || 1) + ": " + (CHAPTER.title || "");

  if (inLesson) {
    var units = CHAPTER.units || [];
    var unit = units[notaState.activeUnitIdx] || { steps: [] };
    var total = (unit.steps || []).length || 1;
    var pct = Math.min(100, Math.round(((notaState.activeStepIdx + (notaState.answeredCurrent ? 1 : 0)) / total) * 100));
    var fill = document.getElementById("notaProgressFill");
    var counter = document.getElementById("notaStepCounter");
    if (fill) fill.style.width = pct + "%";
    if (counter) counter.textContent = Math.min(total, notaState.activeStepIdx + 1) + " / " + total;
  }

  var xpEl = document.getElementById("notaXpValue");
  var heartEl = document.getElementById("notaHeartsValue");
  var comboEl = document.getElementById("notaComboPill");
  var muteBtn = document.getElementById("notaMuteBtn");
  var muteIcon = document.getElementById("notaMuteIcon");
  if (xpEl) xpEl.textContent = notaState.xp + " XP";
  if (heartEl) heartEl.textContent = String(notaState.hearts);
  if (comboEl) {
    comboEl.hidden = notaState.combo < 2;
    comboEl.innerHTML = '<span class="combo-prefix">' + tUi("Kombo&nbsp;", "Combo&nbsp;") + "</span>x" + notaState.combo;
    comboEl.classList.toggle("hud-combo-fire", notaState.combo >= 3);
  }
  if (muteBtn) muteBtn.setAttribute("aria-pressed", notaState.muted ? "true" : "false");
  if (muteIcon) muteIcon.innerHTML = getSvgIcon(notaState.muted ? "volumeOff" : "volumeOn", "");
}

        nextBtn.addEventListener("click", function () {

    }

  };

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}
