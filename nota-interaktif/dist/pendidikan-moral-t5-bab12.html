/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;

.node-label-card[data-unit-idx]:hover {

}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);

  font-size: 0.74rem;

}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {

}

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

.lab-shell {

.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

}

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

}

}

/* Modals & Celebration */
.modal-overlay {

.modal-card {

.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"pendidikan-moral-t5-bab12","subject":"Pendidikan Moral","subjectGroup":"teras","form":5,"chapterNumber":12,"title":"Malaysia dalam Hubungan Antarabangsa","subtitle":"Bidang 7 Unit 12 KSSM — Hubungan Dua Hala & Pelbagai Hala (SP 7.5.1–7.5.2), Pertubuhan ASEAN/PBB/OIC/NAM/Komanwel & Agensi PBB, Kepentingan (SP 7.5.3) & Cabaran Diplomasi (SP 7.5.4).","estimatedMinutes":26,"themeAccent":"#15803d","isFreePreview":false,"labScript":"pendidikan-moral-t5-bab12-labs.js","coverIcon":"../assets/icons/pm512-u1.jpg","editionBadge":"Edisi Multimedia & Moral Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Syabas! Pengetahuan diplomasi dan hubungan antarabangsa Malaysia kamu amat cemerlang!","combo":"[laughs warmly] Kombo yang sangat mantap! [excited] Teruskan penguasaan peranan Malaysia dalam ASEAN, PBB, OIC, NAM dan Komanwel!","encourage":"[softly] Hampir tepat... semak semula beza hubungan dua hala dengan pelbagai hala atau lima nilai cadangan Unit dua belas!","celebrate":"[excited] Tahniah! Kesemua dua belas unit Pendidikan Moral Tingkatan lima berjaya kamu tamatkan dengan penuh cemerlang!"},"units":[{"id":"pm512-u1","title":"Unit 1: Konsep Hubungan Antarabangsa & Dasar Luar Malaysia","subtitle":"SP 7.5.1 & 7.5.2 — Hubungan Dua Hala vs Pelbagai Hala (ASEAN, PBB, OIC, NAM, Komanwel) & Agensi Khusus PBB","iconType":"globe","iconUrl":"../assets/icons/pm512-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Hubungan Dua Hala & Pelbagai Hala","voiceCaption":"Hubungan antarabangsa Malaysia meliputi hubungan dua hala dengan negara seperti China, Jepun dan UAE serta hubungan pelbagai hala menerusi ASEAN, PBB, OIC, NAM dan Komanwel.","voiceScript":"[warm] Selamat datang ke Unit dua belas, unit penutup Pendidikan Moral Tingkatan lima: Malaysia dalam Hubungan Antarabangsa! Lima nilai cadangan K S S M unit ini ialah Hormat, Tanggungjawab, Keberanian, Kerjasama dan Berterima Kasih. Mengikut S P tujuh perpuluhan lima perpuluhan satu, hubungan antarabangsa ialah pertalian dan interaksi antara negara di dunia serta organisasi antarabangsa untuk memupuk kesefahaman dan memelihara kepentingan negara demi kemakmuran sejagat! Kementerian Luar Negeri menegaskan Malaysia menolak pemencilan dan tindakan sebelah pihak atau unilateral, sebaliknya memilih penglibatan bersama menerusi HUBUNGAN DUA HALA bersama negara seperti Australia, China, Indonesia, Jepun dan U A E, serta HUBUNGAN PELBAGAI HALA dalam A S E A N, P B B, O I C, N A M, Komanwel dan agensi seperti I C A O, I M O, I T U, U N H R C dan U N W T O! Terokai dalam makmal!","title":"7.5.1 Konsep, Dasar Luar & Hubungan Dua Hala vs Pelbagai Hala","acronym":"H•T•K•K•B","hook":"Buka makmal Hubungan Antarabangsa untuk membezakan hubungan dua hala, pelbagai hala dan agensi khusus PBB!","mediaKey":"pm512_hubungan_antarabangsa","summary":"Malaysia mengamalkan dasar luar berprinsip diplomasi efektif melalui hubungan dua hala dan keanggotaan aktif dalam pertubuhan serantau serta antarabangsa.","bullets":["Nilai Cadangan Unit 12: Hormat, Tanggungjawab, Keberanian, Kerjasama dan Berterima kasih.","Hubungan Dua Hala (Antara 2 Negara): Contoh rakan dua hala dalam buku teks — Australia, China, Indonesia, Jepun dan Emiriah Arab Bersatu (UAE) merangkumi keselamatan, ekonomi, politik dan sosial.","Hubungan Pelbagai Hala: ASEAN (serantau), PBB/UN, OIC, NAM dan Komanwel; serta agensi PBB — ICAO (penerbangan), IMO (maritim), ITU (telekomunikasi), UNHRC (hak asasi), UN Women, UNIDO (perindustrian) & UNWTO (pelancongan)."],"labId":"pm512_hubungan_antarabangsa_lab","labTitle":"Makmal Hubungan Antarabangsa (SP 7.5.1–7.5.4)","labProps":{"tab":"hala"},"examTip":"Info Tambahan KLN: Istilah 'menolak tindakan sebelah pihak (unilateral) dan sikap pemencilan' adalah poin emas untuk huraian dasar luar Malaysia dalam esei SPM!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih Hubungan Dua Hala vs Pelbagai Hala","voiceCaption":"Kelaskan enam bentuk pertalian antarabangsa daripada buku teks Unit 12 mengikut Hubungan Dua Hala atau Hubungan Pelbagai Hala.","voiceScript":"[curious] Asingkan keenam-enam bentuk hubungan diplomatik daripada buku teks Unit dua belas ini!","prompt":"Kelaskan bentuk pertalian antarabangsa berikut mengikut kategorinya:","buckets":[{"id":"duahala","label":"Hubungan Dua Hala (2 Negara)"},{"id":"pelbagai","label":"Hubungan Pelbagai Hala (>2 Negara/Pertubuhan)"}],"items":[{"text":"Kerjasama perdagangan dan perkongsian teknologi secara langsung Malaysia–Jepun","bucketId":"duahala","note":"Betul! Perhubungan dua buah negara secara langsung."},{"text":"Keanggotaan Malaysia dalam Persatuan Negara-Negara Asia Tenggara (ASEAN)","bucketId":"pelbagai","note":"Tepat! Pertubuhan serantau melibatkan sepuluh lebih negara."},{"text":"Lawatan kerja rasmi pemimpin Malaysia ke China dan Emiriah Arab Bersatu","bucketId":"duahala","note":"Betul! Diplomasi dua hala antara negara."},{"text":"Penglibatan aktif dalam PBB, Pertubuhan Kerjasama Islam (OIC), NAM dan Komanwel","bucketId":"pelbagai","note":"Tepat! Pertubuhan antarabangsa pelbagai hala."},{"text":"Rundingan dua hala keselamatan sempadan maritim Malaysia dengan Indonesia","bucketId":"duahala","note":"Betul! Interaksi keselamatan dua negara berjiran."},{"text":"Penyertaan dalam agensi PBB seperti ICAO, IMO, ITU, UNIDO dan UNWTO","bucketId":"pelbagai","note":"Tepat! Kerjasama teknikal pelbagai hala di bawah naungan PBB."}],"explanation":"Hubungan dua hala dan pelbagai hala saling memperkukuh kedudukan diplomasi serta perdagangan Malaysia."},{"type":"match","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Padan Agensi PBB Unit 12 dengan Bidangnya","voiceCaption":"Padankan lima agensi khusus Pertubuhan Bangsa-Bangsa Bersatu dalam Unit 12 dengan fokus masing-masing.","voiceScript":"[confident] Padankan kesemua lima agensi antarabangsa daripada buku teks Unit dua belas ini dengan bidang tugasnya!","prompt":"Padankan akronim agensi PBB berikut dengan bidangnya:","pairs":[{"id":"pm512u1m1","left":"ICAO (Civil Aviation)","right":"Piawaian keselamatan penerbangan awam antarabangsa"},{"id":"pm512u1m2","left":"IMO (Maritime)","right":"Keselamatan perkapalan dan pengurusan maritim dunia"},{"id":"pm512u1m3","left":"ITU (Telecommunication)","right":"Penyelarasan teknologi maklumat dan telekomunikasi global"},{"id":"pm512u1m4","left":"UNHRC & UN Women","right":"Pemeliharaan hak asasi manusia serta pemerkasaan wanita"},{"id":"pm512u1m5","left":"UNIDO & UNWTO","right":"Pembangunan perindustrian serta pelancongan dunia"}],"explanation":"Keanggotaan aktif dalam agensi khusus PBB membolehkan Malaysia menyumbang kepakaran teknikal global."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Prinsip Dasar Luar Kementerian Luar Negeri","voiceCaption":"Pilih pernyataan tepat tentang prinsip dasar luar Malaysia menurut Info Tambahan Kementerian Luar Negeri.","voiceScript":"[confident] Berdasarkan Info Tambahan Kementerian Luar Negeri dalam Unit dua belas, apakah prinsip yang dipegang dan ditolak dalam dasar luar Malaysia?","prompt":"Manakah prinsip dasar luar Malaysia menurut Info Tambahan Kementerian Luar Negeri (Unit 12)?","options":["Berpegang pada penglibatan bersama dan kerjasama adil, serta menolak sikap pemencilan dan tindakan sebelah pihak (unilateral)","Mengamalkan pemencilan diri daripada semua pertubuhan PBB dan ASEAN","Menjalankan tindakan ketenteraan sebelah pihak tanpa rundingan","Menolak sebarang bentuk hubungan dagangan dengan negara bukan jiran"],"correctIndex":0,"explanation":"KLN menegaskan komitmen Malaysia terhadap diplomasi saksama serta penolakan tindakan unilateral."}]},{"id":"pm512-u2","title":"Unit 2: 4 Bidang Hubungan Dua Hala & Kepentingan","subtitle":"SP 7.5.2 & 7.5.3 — Aspek Keselamatan/Undang-undang, Ekonomi, Politik & Sosial serta 5 Kepentingan Hubungan Luar","iconType":"scale","iconUrl":"../assets/icons/pm512-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"4 Bidang Dua Hala & Kepentingan","voiceCaption":"Hubungan dua hala Malaysia merangkumi keselamatan, ekonomi, politik dan sosial yang penting bagi memelihara kedaulatan, menjana pendapatan, membina keselamatan dan menghasilkan vaksin.","voiceScript":"[warm] Selamat datang ke Unit dua! Bahagian Konsep Unit dua belas memperincikan EMPAT bidang hubungan dua hala Malaysia dengan negara luar mengikut S P tujuh perpuluhan lima perpuluhan dua: pertama, Keselamatan dan undang-undang antarabangsa (memelihara kedaulatan dan hak asasi manusia); kedua, Ekonomi (perdagangan global, pelaburan asing serta perkongsian teknologi); ketiga, Politik (memupuk hubungan baik dan lawatan kerja pemimpin); dan keempat, Sosial (bantuan kemanusiaan, silang seni budaya serta pelestarian alam)! Kepentingannya mengikut S P tujuh perpuluhan lima perpuluhan tiga merangkumi lima sektor iaitu memelihara kedaulatan negara, memperkukuh kualiti pendidikan bertaraf dunia, meningkatkan pendapatan dan peluang pekerjaan, membina dunia selamat daripada jenayah antarabangsa, serta meningkatkan keupayaan perubatan seperti penghasilan vaksin!","title":"7.5.2 Empat Bidang Dua Hala & 7.5.3 Kepentingan Hubungan Luar","acronym":"KES•EKO•POL","hook":"Teliti 5 kepentingan hubungan antarabangsa daripada politik hingga penghasilan vaksin dalam makmal!","mediaKey":"pm512_pertubuhan_pbb","summary":"Hubungan dua hala melindungi kedaulatan negara di samping membuka pasaran ekonomi, pelaburan asing, institusi pendidikan dunia serta perkongsian vaksin perubatan.","bullets":["4 Bidang Hubungan Dua Hala (SP 7.5.2): Keselamatan & undang-undang (kedaulatan & hak asasi), Ekonomi (perdagangan, teknologi, pelaburan), Politik (hubungan baik & lawatan pemimpin), Sosial (bantuan kemanusiaan, silang budaya, alam).","Kepentingan Politik, Ekonomi & Pendidikan (SP 7.5.3): Memelihara kedaulatan & imej negara; meningkatkan pendapatan, kepelbagaian ekonomi & peluang pekerjaan; menubuhkan institusi pendidikan bertaraf dunia.","Kepentingan Keselamatan & Sains: Membanteras jenayah antarabangsa dan menjamin keamanan; pertukaran teknologi serta peningkatan keupayaan perubatan seperti penghasilan vaksin."],"labId":"pm512_hubungan_antarabangsa_lab","labTitle":"Kepentingan Hubungan Antarabangsa (SP 7.5.3)","labProps":{"tab":"penting"},"examTip":"Buku teks menyebut contoh sangat terkini dalam SP 7.5.3 Sains dan Teknologi iaitu 'Meningkatkan keupayaan negara dalam bidang perubatan seperti penghasilan vaksin' — gunakan fakta ini!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Aspek Dua Hala Keselamatan/Politik vs Ekonomi/Sosial","voiceCaption":"Kelaskan enam inisiatif hubungan dua hala daripada buku teks Unit 12 mengikut bidangnya.","voiceScript":"[curious] Asingkan keenam-enam inisiatif hubungan dua hala Malaysia daripada buku teks Unit dua belas ini!","prompt":"Kelaskan inisiatif hubungan dua hala berikut mengikut bidang SP 7.5.2:","buckets":[{"id":"polkes","label":"Politik, Keselamatan & Undang-undang"},{"id":"ekosos","label":"Ekonomi & Sosial"}],"items":[{"text":"Memastikan komitmen negara di bawah undang-undang antarabangsa dan kedaulatan terpelihara","bucketId":"polkes","note":"Betul! Bidang keselamatan dan perundangan."},{"text":"Hubungan perdagangan global, pelaburan asing serta perkongsian teknologi","bucketId":"ekosos","note":"Tepat! Teras hubungan ekonomi dua hala."},{"text":"Memudah cara lawatan negara, lawatan rasmi dan lawatan kerja pemimpin","bucketId":"polkes","note":"Betul! Inisiatif diplomasi politik."},{"text":"Bantuan kemanusiaan serta perkongsian silang seni dan silang budaya","bucketId":"ekosos","note":"Tepat! Mengukuhkan hubungan sosial rakyat kedua-dua negara."},{"text":"Memantau perkembangan politik luar dan kesannya kepada kestabilan negara","bucketId":"polkes","note":"Betul! Langkah proaktif keselamatan politik."},{"text":"Kerjasama pemeliharaan alam sekitar serantau dan jerebu rentas sempadan","bucketId":"ekosos","note":"Tepat! Tanggungjawab sosial dan ekologi bersama."}],"explanation":"Kesemua empat bidang memastikan tiada aspek kepentingan negara terabai dalam rundingan dua hala."},{"type":"match","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Padan 5 Kepentingan Hubungan Luar dengan Huraiannya","voiceCaption":"Padankan lima sektor kepentingan hubungan luar SP 7.5.3 dengan manfaat konkrit kepada Malaysia.","voiceScript":"[confident] Padankan setiap sektor kepentingan hubungan antarabangsa ini dengan manfaat tepatnya!","prompt":"Padankan sektor kepentingan SP 7.5.3 berikut dengan huraiannya:","pairs":[{"id":"pm512u2m1","left":"Sektor Politik","right":"Memelihara kedaulatan serta meningkatkan imej negara di mata dunia"},{"id":"pm512u2m2","left":"Sektor Pendidikan","right":"Menubuhkan institusi pendidikan bertaraf dunia dan inovasi pengajaran"},{"id":"pm512u2m3","left":"Sektor Ekonomi","right":"Mempelbagaikan sumber pendapatan dan membuka peluang pekerjaan"},{"id":"pm512u2m4","left":"Sektor Keselamatan","right":"Membina dunia selamat dan membanteras jenayah antarabangsa"},{"id":"pm512u2m5","left":"Sektor Sains & Teknologi","right":"Pertukaran kepakaran serta keupayaan penghasilan vaksin perubatan"}],"explanation":"Kelima-lima kepentingan ini membuktikan diplomasi aktif membawa pulangan langsung kepada kesejahteraan rakyat."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Kesan Penubuhan Universiti Antarabangsa","voiceCaption":"Pilih pernyataan tepat tentang faedah kerjasama pendidikan tinggi melalui penubuhan kampus antarabangsa di Malaysia.","voiceScript":"[confident] Mengikut kepentingan bidang Pendidikan S P tujuh perpuluhan lima perpuluhan tiga, apakah faedah penubuhan institusi pendidikan antarabangsa hasil hubungan luar?","prompt":"Apakah kebaikan penubuhan cawangan institusi pendidikan antarabangsa di Malaysia hasil hubungan diplomatik?","options":["Meningkatkan kualiti pendidikan bertaraf dunia, menggalakkan inovasi ilmu dan menarik pelajar luar sekali gus menjimatkan kos belajar di luar negara","Menutup semua sekolah dan universiti awam tempatan","Menyekat pertukaran pensyarah dan penyelidikan sains","Mengurangkan peluang pekerjaan bagi rakyat tempatan"],"correctIndex":0,"explanation":"Malaysia muncul sebagai hab pendidikan serantau yang bermutu tinggi serta menjimatkan tukaran wang asing."}]},{"id":"pm512-u3","title":"Unit 3: Cabaran Hubungan Antarabangsa & Isu Semasa","subtitle":"SP 7.5.4 — Perbezaan Agama/Ideologi/Budaya/Geografi, Kejatuhan Mata Wang, Penyeludupan PATI & Perubahan Iklim","iconType":"globe","iconUrl":"../assets/icons/pm512-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Cabaran Hubungan Antarabangsa","voiceCaption":"Malaysia berhadapan cabaran mengekalkan hubungan antarabangsa termasuk perbezaan agama, ideologi dan mata wang selain isu penyeludupan PATI, perubahan iklim dan hak asasi manusia.","voiceScript":"[warm] Selamat datang ke Unit tiga! Bahagian Konsep dan Pengukuhan Unit dua belas mengenal pasti cabaran besar yang perlu ditangani oleh Malaysia di bawah S P tujuh perpuluhan lima perpuluhan empat! Cabaran struktur merangkumi lima perkara: perbezaan agama, perbezaan ideologi politik, kepelbagaian budaya dan bahasa, kedudukan geografi sesebuah negara serta kejatuhan nilai mata wang negara yang menjejaskan kuasa dagangan! Selain itu, bahagian Pengukuhan turut mengetengahkan tiga isu semasa dunia untuk diselesaikan secara berhemah dalam simulasi persidangan iaitu penyeludupan pendatang asing tanpa izin ke dalam negara, kesan perubahan iklim kepada dunia serta isu kebebasan bersuara dan hak asasi manusia! Terokai kesemuanya dalam makmal!","title":"7.5.4 Cabaran Hubungan Antarabangsa & Isu Simulasi Persidangan","acronym":"IKLIM•PATI","hook":"Klik tab Cabaran & Dasar Luar dalam makmal untuk menganalisis cabaran struktur serta isu PATI dan iklim!","summary":"Cabaran perbezaan ideologi, kejatuhan mata wang, penyeludupan PATI dan perubahan iklim menuntut ketegasan mempertahankan kedaulatan berserta diplomasi kerjasama.","bullets":["5 Cabaran Struktur (SP 7.5.4): Perbezaan agama, perbezaan ideologi, kepelbagaian budaya & bahasa, kedudukan geografi serta kejatuhan nilai mata wang negara.","3 Isu Simulasi Persidangan (Pengukuhan): (1) Penyeludupan pendatang asing tanpa izin (PATI) mengancam keselamatan sempadan, (2) Kesan perubahan iklim & pemanasan global, (3) Kebebasan bersuara & hak asasi manusia.","Pendekatan Malaysia: Menyelesaikan isu sempadan, PATI dan jerebu/iklim menerusi saluran undang-undang serta rundingan dua hala atau ASEAN."],"labId":"pm512_hubungan_antarabangsa_lab","labTitle":"Cabaran Hubungan & Isu Semasa (SP 7.5.4)","labProps":{"tab":"cabaran"},"examTip":"Dalam soalan cabaran SP 7.5.4, bezakan isu ekonomi ('kejatuhan nilai mata wang') daripada isu keselamatan sempadan ('penyeludupan pendatang asing tanpa izin / PATI')!"},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Impak Penyeludupan PATI & Kejatuhan Mata Wang","voiceCaption":"Ramalkan cabaran berganda jika isu penyeludupan PATI dan kejatuhan nilai mata wang tidak diurus secara diplomatik serta berkesan.","voiceScript":"[curious] Ramalkan kesan terhadap keselamatan sempadan dan perdagangan jika isu penyeludupan P A T I serta kejatuhan nilai mata wang gagal ditangani bersama negara jiran!","hook":"Fikirkan kesannya kepada kos import, keselamatan dalaman dan hubungan diplomatik!","scenario":"Kemasukan PATI tanpa kawalan meningkat di sempadan perairan ketika nilai mata wang tempatan menyusut.","prompt":"Apakah ramalan kesan UTAMA jika kedua-dua cabaran tersebut tidak ditangani?","options":["Kos import meningkat menjejaskan perdagangan manakala penyeludupan menggugat keselamatan sempadan serta membebankan sumber sosial negara","Hubungan ekonomi dengan negara jiran bertambah kukuh tanpa kawalan undang-undang","Kadar jenayah rentas sempadan menurun menjadi sifar","Perubahan iklim global berhenti serta-merta"],"correctIndex":0,"proofLabId":"pm512_hubungan_antarabangsa_lab","proofState":{"tab":"cabaran"},"explanation":"Isu PATI memerlukan penguatkuasaan bersama negara asal/transit manakala kejatuhan mata wang menuntut dasar ekonomi stabil."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s3","voiceToneLabel":"Susun Usul Simulasi Persidangan Perubahan Iklim","voiceCaption":"Susun empat segmen usul persidangan antarabangsa tentang langkah negara-negara mengatasi perubahan iklim dunia.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk usul simulasi persidangan perubahan iklim dunia yang bernas!","prompt":"Susun usul simulasi persidangan tentang isu perubahan iklim dunia berikut:","hint":"Mulakan dengan pengiktirafan krisis iklim global, cadangan tenaga hijau dan kawalan pelepasan karbon, kerjasama teknologi & dana, dan harapan...","answerTokens":["Perubahan iklim merupakan krisis sejagat yang mengancam keselamatan makanan serta kestabilan cuaca semua negara.","Oleh itu, setiap negara anggota PBB wajar mengurangkan pelepasan gas rumah hijau dan beralih kepada tenaga boleh baharu.","Pada masa sama, negara maju perlu berkongsi teknologi hijau serta pembiayaan iklim dengan negara membangun secara adil.","Kerjasama multilateral yang tegas ini amat penting bagi menjamin bumi kekal selamat untuk generasi akan datang."],"distractors":["Negara membangun patut dibebankan dengan semua kos pemulihan alam tanpa bantuan teknologi.","Pembakaran hutan dan bahan api fosil wajar digandakan demi industri berat."],"explanation":"Usul simulasi persidangan ini selari dengan aktiviti Pengukuhan buku teks Unit 12 dan nilai Keadilan/Kerjasama."},{"type":"mcq","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Menangani Perbezaan Agama & Ideologi","voiceCaption":"Pilih sikap terbaik Malaysia dalam menghadapi perbezaan agama serta ideologi politik dengan negara rakan.","voiceScript":"[confident] Bagaimanakah Malaysia mengekalkan hubungan baik dengan negara luar walaupun berbeza agama dan ideologi pemerintahan?","prompt":"Bagaimanakah Malaysia mengatasi cabaran perbezaan agama dan ideologi dalam hubungan antarabangsa?","options":["Mengamalkan nilai hormat, dasar berkecuali serta tidak mencampuri urusan politik dalaman negara lain demi keamanan bersama","Memutuskan hubungan diplomatik dengan semua negara yang berlainan ideologi","Mengkritik secara kasar amalan agama negara jiran dalam sidang media","Memaksa negara rakan menukar perlembagaan politik mereka"],"correctIndex":0,"explanation":"Prinsip hormat dan tidak campur tangan (ZOPFAN ASEAN) mengekalkan keharmonian walaupun berbeza ideologi."}]},{"id":"pm512-u4","title":"Unit 4: Peranan Murid dalam Hubungan Antarabangsa","subtitle":"SP 7.5.5 & 7.5.6 — Perasaan Apabila Mengekalkan Hubungan Luar & Pengamalan Harian Rakyat Bermoral","iconType":"crown","iconUrl":"../assets/icons/pm512-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Amalan Harian Sokong Hubungan Luar","voiceCaption":"Walaupun hubungan diplomatik dikendalikan kerajaan, murid menyumbang melalui interaksi sopan bersama rakan antarabangsa, pengetahuan isu global dan menolak sentimen kebencian.","voiceScript":"[warm] Selamat datang ke Unit empat! Bagaimanakah murid Tingkatan lima mengamalkan kerjasama mengekalkan hubungan antarabangsa dalam kehidupan harian mengikut S P tujuh perpuluhan lima perpuluhan enam? Pertama, ikuti perkembangan isu semasa dunia dengan minda terbuka supaya memahami impak ekonomi dan keselamatan global terhadap Malaysia; kedua, santuni warga asing yang menetap, belajar atau melancong secara sah di Malaysia dengan adab serta nilai Hormat tanpa sikap perkauman; ketiga, gunakan media sosial secara bertanggungjawab dengan tidak menyebarkan komen menghina pemimpin atau rakyat negara lain; dan keempat, sertai program pertukaran atau perdebatan P B B sekolah! Mengikut S P tujuh perpuluhan lima perpuluhan lima, kita berasa bangga dan bersyukur melihat Malaysia dihormati sebagai negara berdaulat yang aman!","title":"Pengamalan Harian Rakyat & Ekspresi Kedaulatan (SP 7.5.5–7.5.6)","acronym":"DIPLO•KITA","hook":"Ketahui bagaimana tingkah laku digital dan adab rakyat biasa membantu mengekalkan hubungan diplomatik negara!","summary":"Setiap warganegara memelihara hubungan antarabangsa Malaysia dengan menjaga tutur kata di alam maya, menyantuni pelawat sah dan menyokong dasar luar damai.","bullets":["Amalan Rakyat & Murid (SP 7.5.6): Menyantuni pelancong dan pelajar antarabangsa sah dengan mesra, mengelakkan komentar provokatif terhadap negara lain di media sosial, peka isu global dan menyertai Model PBB (MUN) sekolah.","Tanggungjawab Nilai Berterima Kasih & Hormat: Menghargai peranan diplomat KLN dan anggota keselamatan serta menghormati kedaulatan bendera dan budaya asing.","Ekspresi Perasaan (SP 7.5.5): Berasa bangga, gembira, aman dan bersyukur kerana negara menikmati kestabilan tanpa peperangan."],"examTip":"Elakkan salah faham antara isu PATI (pendatang asing tanpa izin yang melanggar undang-undang) dengan pekerja/pelajar/pelancong asing yang masuk secara SAH — golongan sah wajib dilayan dengan hormat!"},{"type":"match","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Amalan Warga Muda & Impak Hubungan Luar","voiceCaption":"Padankan empat amalan harian murid dengan sumbangannya kepada hubungan antarabangsa Malaysia.","voiceScript":"[confident] Padankan setiap amalan harian rakyat muda berikut dengan sumbangannya kepada hubungan diplomatik Malaysia!","prompt":"Padankan amalan harian berikut dengan kesannya kepada hubungan antarabangsa:","pairs":[{"id":"pm512u4m1","left":"Menahan diri daripada komen menghina negara luar","right":"Mengelakkan ketegangan diplomatik dan menjaga imej budi bahasa Malaysia"},{"id":"pm512u4m2","left":"Menyertai persidangan Model PBB (MUN) sekolah","right":"Melatih kemahiran rundingan pelbagai hala serta kefahaman isu global"},{"id":"pm512u4m3","left":"Melayan mesra pelancong & penuntut asing sah","right":"Meninggalkan tanggapan positif dan menggalakkan pelancongan berulang"},{"id":"pm512u4m4","left":"Menghargai jasa diplomat dan Wisma Putra","right":"Menghayati nilai berterima kasih atas keamanan serta kedaulatan negara"}],"explanation":"Diplomasi rakyat (people-to-people diplomacy) melengkapkan usaha rasmi kerajaan di persada dunia."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s3","voiceToneLabel":"Susun Hujah Kepentingan Dasar Diplomasi Malaysia","voiceCaption":"Susun empat segmen ayat menjelaskan sebab Malaysia memilih diplomasi kerjasama berbanding pemencilan.","voiceScript":"[confident] Susun keempat-empat segmen ini supaya membentuk hujah lengkap mengapa Malaysia berpegang teguh pada diplomasi kerjasama!","prompt":"Susun segmen berikut membentuk hujah dasar diplomasi kerjasama Malaysia:","hint":"Mulakan dengan prinsip nilai hormat/kerjasama KLN, penolakan tindakan unilateral, manfaat vaksin/ekonomi/keselamatan, dan perasaan bangga...","answerTokens":["Malaysia berpegang teguh pada nilai hormat dan kerjasama dengan menolak dasar pemencilan serta tindakan sebelah pihak.","Pendekatan diplomasi dua hala dan pelbagai hala ini memelihara kedaulatan negara di samping membanteras jenayah rentas sempadan.","Selain itu, kerjasama melalui ASEAN dan PBB membuka peluang perdagangan, pendidikan bertaraf dunia serta penghasilan vaksin perubatan.","Justeru, rakyat berasa bangga dan bersyukur kerana dapat menikmati keamanan serta kemakmuran yang berterusan."],"distractors":["Oleh itu, Malaysia harus keluar daripada PBB, OIC dan ASEAN mulai tahun hadapan.","Lawatan rasmi pemimpin antara negara hanya membazirkan masa dan sumber."],"explanation":"Hujah menggabungkan prinsip KLN, contoh pertubuhan dan kesan nyata SP 7.5.3 serta perasaan SP 7.5.5."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Sikap Terhadap Pelajar Asing Berdaftar di Malaysia","voiceCaption":"Pilih layanan paling bermoral terhadap rakan pelajar dari negara luar yang belajar secara sah di Malaysia.","voiceScript":"[confident] Bagaimanakah sikap paling bermoral yang wajar ditunjukkan terhadap pelajar atau pekerja asing yang datang secara sah ke Malaysia?","prompt":"Manakah layanan paling bermoral terhadap pelajar atau pelancong asing yang berada secara sah di negara kita?","options":["Melayan mereka dengan hormat dan sopan, membantu mereka memahami budaya tempatan serta memelihara hubungan persahabatan baik","Memulaukan mereka kerana perbezaan bahasa dan budaya","Mengenakan bayaran berganda ketika mereka membeli barangan keperluan","Menyamakan mereka dengan pendatang asing tanpa izin walaupun mempunyai dokumen sah"],"correctIndex":0,"explanation":"Layanan mesra dan adil mencerminkan nilai Hormat dan Hemah Tinggi rakyat Malaysia."}]},{"id":"pm512-u5","title":"Unit 5: Cabaran Boss Unit 12 — Hubungan Antarabangsa","subtitle":"Penilaian Sumatif Akhir Pendidikan Moral Tingkatan 5: 5 Nilai Cadangan, Dua Hala/Pelbagai Hala, Kepentingan & Cabaran","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u5-s1","voiceToneLabel":"Boss Soalan 1: 5 Nilai Cadangan Unit 12","voiceCaption":"Pilih senarai kesemua lima nilai cadangan rasmi KSSM bagi Unit 12 Malaysia dalam Hubungan Antarabangsa.","voiceScript":"[excited] Cabaran Boss penutup Pendidikan Moral Tingkatan lima bermula! Kenal pasti kesemua lima nilai cadangan rasmi K S S M bagi Unit dua belas!","prompt":"Manakah himpunan KESEMUA lima nilai cadangan KSSM bagi Unit 12?","options":["Hormat, Tanggungjawab, Keberanian, Kerjasama dan Berterima kasih","Patriotisme, Kerajinan, Berdikari, Hemah tinggi dan Kesederhanaan","Kasih sayang, Kejujuran, Harga diri, Toleransi dan Baik hati","Kepercayaan kepada Tuhan, Rasional, Kebebasan dan Kesetiaan"],"correctIndex":0,"explanation":"Lima nilai cadangan Unit 12 ialah Hormat, Tanggungjawab, Keberanian, Kerjasama dan Berterima kasih."},{"type":"predict","xp":25,"voiceIdKey":"u5-s2","voiceToneLabel":"Boss Soalan 2: Ramal Kesan Penglibatan Unilateral & Pemencilan","voiceCaption":"Ramalkan akibat sekiranya sesebuah negara mengamalkan dasar pemencilan diri serta bertindak sebelah pihak tanpa diplomasi.","voiceScript":"[curious] Ramalkan implikasi utama apabila sesebuah negara menolak diplomasi dan memilih dasar pemencilan atau tindakan sebelah pihak!","hook":"Fikirkan kesannya kepada perdagangan, keselamatan vaksin, pelancongan dan imej antarabangsa!","scenario":"Negara X menarik diri daripada pertubuhan antarabangsa, memutuskan perdagangan dua hala dan menutup pintu rundingan damai.","prompt":"Apakah ramalan kesan UTAMA dasar pemencilan tersebut?","options":["Negara terpinggir daripada perdagangan global, kehilangan perkongsian teknologi perubatan/vaksin serta mudah berdepan ketegangan keselamatan","Negara tersebut menjadi pusat pendidikan bertaraf dunia dengan segera","Pendapatan eksport dan pelaburan asing meningkat mendadak","Jenayah rentas sempadan selesai tanpa kerjasama risikan negara jiran"],"correctIndex":0,"explanation":"Pemencilan memutuskan rantaian ekonomi, pendidikan, teknologi kesihatan dan kestabilan keselamatan negara."},{"type":"wordbank","xp":25,"voiceIdKey":"u5-s3","voiceToneLabel":"Boss Soalan 3: Susun Jawapan Esei SPM Unit 12","voiceCaption":"Susun struktur jawapan esei Pendidikan Moral SPM mengenai kepentingan mengekalkan hubungan antarabangsa Malaysia.","voiceScript":"[confident] Susun keempat-empat segmen ini membentuk jawapan esei S P M Unit dua belas yang lengkap!","prompt":"Susun segmen berikut menjadi jawapan esei SPM yang mantap bagi Unit 12:","hint":"Mulakan dengan nilai cadangan Unit 12, kepentingan kedaulatan & ekonomi/vaksin, contoh hubungan dua/pelbagai hala, dan keamanan sejagat...","answerTokens":["Nilai yang patut diamalkan ialah nilai hormat dan kerjasama dalam mengekalkan hubungan antarabangsa.","Hubungan luar penting untuk memelihara kedaulatan negara, menjana ekonomi serta meningkatkan keupayaan perubatan seperti penghasilan vaksin.","Sebagai contoh, Malaysia menjalin hubungan dua hala dengan Jepun serta aktif dalam pertubuhan ASEAN, PBB dan OIC.","Kesannya, keselamatan negara terjamin daripada jenayah antarabangsa dan kemakmuran sejagat dapat dinikmati bersama."],"distractors":["Malaysia perlu memulaukan semua lawatan rasmi pemimpin negara luar.","Perbezaan agama dan budaya mesti dijadikan punca pertelingkahan diplomatik."],"explanation":"Jawapan merangkum nilai Unit 12, SP 7.5.3, SP 7.5.2 (dua hala & pelbagai hala) serta kestabilan serantau."},{"type":"match","xp":25,"voiceIdKey":"u5-s4","voiceToneLabel":"Boss Soalan 4: Padan Standard Pembelajaran Unit 12","voiceCaption":"Padankan empat Standard Pembelajaran SP 7.5.1 hingga 7.5.4 dengan intipatinya.","voiceScript":"[confident] Padankan kesemua empat Standard Pembelajaran Unit dua belas ini dengan fokus kandungannya!","prompt":"Padankan Standard Pembelajaran Unit 12 berikut dengan maksudnya:","pairs":[{"id":"pm512u5m1","left":"SP 7.5.1 Maksud","right":"Interaksi antara negara, organisasi antarabangsa & syarikat demi kemakmuran"},{"id":"pm512u5m2","left":"SP 7.5.2 Dua Hala","right":"Kerjasama keselamatan, ekonomi, politik & sosial antara dua buah negara"},{"id":"pm512u5m3","left":"SP 7.5.3 Kepentingan","right":"Pelihara kedaulatan, ekonomi, pendidikan dunia & penghasilan vaksin"},{"id":"pm512u5m4","left":"SP 7.5.4 Cabaran","right":"Ideologi, nilai mata wang, PATI, perubahan iklim & perbezaan geografi"}],"explanation":"Keempat-empat SP melengkapkan penguasaan Unit 12 dan keseluruhan Pendidikan Moral Tingkatan 5."},{"type":"mcq","xp":30,"voiceIdKey":"u5-s5","voiceToneLabel":"Boss Penutup: Pengelasan Pertubuhan Pelbagai Hala Malaysia","voiceCaption":"Pilih pernyataan yang kesemuanya tepat mengenai pertubuhan serantau dan antarabangsa yang disertai oleh Malaysia.","voiceScript":"[excited] Soalan penutup keseluruhan Pendidikan Moral Tingkatan lima! Pilih pernyataan yang seratus peratus tepat tentang keanggotaan Malaysia dalam pertubuhan pelbagai hala!","prompt":"Manakah padanan pertubuhan pelbagai hala yang disertai oleh Malaysia mengikut buku teks Unit 12?","options":["ASEAN (serantau) serta PBB, OIC, NAM dan Komanwel (antarabangsa), di samping agensi seperti ICAO, IMO, ITU, UNHRC dan UNWTO","Malaysia hanya menyertai hubungan dua hala dan tidak menganggotai PBB mahupun ASEAN","ASEAN ialah agensi penerbangan awam manakala ICAO ialah persatuan sukan","Komanwel dan OIC mengharamkan sebarang kerjasama ekonomi antara negara anggota"],"correctIndex":0,"explanation":"Tahniah! Semua pertubuhan tersebut tercatat tepat dalam buku teks Unit 12 Malaysia dalam Hubungan Antarabangsa."}]}]};</script>

function getStorageKey() {
  return "etutor_nota_state_" + String(CHAPTER.id || "default");
}

function getChapterStats() {
  var units = Array.isArray(CHAPTER.units) ? CHAPTER.units : [];
  var totalUnits = units.length;
  var completedCount = 0;
  var totalStars = 0;
  units.forEach(function (u) {
    var rec = notaState.completedUnits[u.id];
    if (rec && rec.stars > 0) {
      completedCount++;
      totalStars += Number(rec.stars) || 0;
    }
  });
  var masteryPct = totalUnits > 0 ? Math.round((completedCount / totalUnits) * 100) : 0;
  var avgStars = totalUnits > 0 ? Math.min(3, Math.round((totalStars / totalUnits) * 10) / 10) : 0;
  return {
    completedUnits: completedCount,
    totalUnits: totalUnits,
    masteryPct: masteryPct,
    totalStars: totalStars,
    maxStars: totalUnits * 3,
    avgStars: avgStars
  };
}

function serializeProgress() {
  return JSON.stringify({
    xp: notaState.xp,
    muted: notaState.muted,
    voiceAutoplay: notaState.voiceAutoplay,
    completedUnits: notaState.completedUnits
  });
}

function applySavedStateJson(rawJson) {
  if (!rawJson) return;
  try {
    var parsed = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
    if (!parsed || typeof parsed !== "object") return;
    if (typeof parsed.xp === "number" && parsed.xp >= 0) notaState.xp = Math.round(parsed.xp);
    if (typeof parsed.muted === "boolean") notaState.muted = parsed.muted;
    if (typeof parsed.voiceAutoplay === "boolean") notaState.voiceAutoplay = parsed.voiceAutoplay;
    if (parsed.completedUnits && typeof parsed.completedUnits === "object") {
      notaState.completedUnits = parsed.completedUnits;
    }
  } catch (e) {}
}

function loadNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      applySavedStateJson(localStorage.getItem(getStorageKey()));
    }
  } catch (e) {}
}

function saveNotaState() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(getStorageKey(), serializeProgress());
    }
  } catch (e) {}
  emitPortalEvent("ETUTOR_NOTA_PROGRESS", { syncOnly: true });
}

function emitPortalEvent(type, extra) {
  if (typeof window === "undefined" || !window.parent || window.parent === window) return;
  var stats = getChapterStats();
  var payload = Object.assign({
    type: type,
    noteId: CHAPTER.id,
    subject: CHAPTER.subject,
    title: CHAPTER.title,
    completedUnits: stats.completedUnits,
    totalUnits: stats.totalUnits,
    masteryPct: stats.masteryPct,
    xp: notaState.xp,
    stars: stats.totalStars,
    maxStars: stats.maxStars,
    stateJson: serializeProgress()
  }, extra || {});
  try {
    window.parent.postMessage(payload, "*");
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function shuffleList(arr) {
  var copy = Array.isArray(arr) ? arr.slice() : [];
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function runLabCleanups() {
  if (typeof NotaVoice !== "undefined" && NotaVoice.stop) {
    try { NotaVoice.stop(); } catch (e) {}
  }
  while (notaState.activeLabCleanups.length > 0) {
    var fn = notaState.activeLabCleanups.pop();
    try { if (typeof fn === "function") fn(); } catch (e) {}
  }
}

function mountLabWidget(mountEl, labId, options) {
  if (!mountEl || !labId || !window.ETUTOR_NOTA_LABS) return false;
  var builder = window.ETUTOR_NOTA_LABS[labId];
  if (typeof builder !== "function") return false;
  var cleanup = builder(mountEl, options || {});
  if (typeof cleanup === "function") {
    notaState.activeLabCleanups.push(cleanup);
  }
  return true;
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}
