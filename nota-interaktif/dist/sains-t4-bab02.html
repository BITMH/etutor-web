/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);

.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }

    animation: fadeSlideIn 0.25s ease-out;

}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}

  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sains-t4-bab02","subject":"Sains","form":4,"chapterNumber":2,"title":"Bantuan Kecemasan (CPR & Heimlich Manoeuvre)","subtitle":"Subtopik 2.1 & 2.2 KSSM — Talian 999, Kaedah & Kepentingan CPR (30:2), Heimlich Manoeuvre & Penyelamatan Diri Sendiri.","estimatedMinutes":22,"themeAccent":"#10b981","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Interaktif Webflow Bento 3D","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/sai2-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Kecekapan bantuan kecemasan kamu boleh menyelamatkan nyawa!","combo":"[laughs warmly] Kombo yang luar biasa! Setiap saat dalam kecemasan sangat berharga!","encourage":"[softly] Hampir tepat... mari semak semula langkah dan angka wajib dalam rajah di bawah.","celebrate":"[excited] Tahniah! Kamu telah menguasai kesemua teknik Bantuan Kecemasan Bab dua!"},"units":[{"id":"sai2-u1","title":"Unit 1: Talian 999, Definisi & Keadaan Perlu CPR","subtitle":"Subtopik 2.1 & Rencana Sains (m/s 19–21) — 5 Agensi 999, 3 Tanda & 4 Punca CPR","iconType":"book","iconUrl":"../assets/icons/sai2-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c1","voiceToneLabel":"Talian Kecemasan 999 & 5 Agensi","voiceCaption":"Talian 999 menghubungkan lima agensi penyelamat negara secara percuma dan merekodkan nombor pemanggil bagi menyekat panggilan palsu.","voiceScript":"[warm] Selamat datang ke Bab dua, Bantuan Kecemasan! Sebelum merawat mangsa, dail nombor sembilan sembilan sembilan secara percuma. Lima agensi bergabung di bawah talian ini termasuk K K M, Polis, Bomba, A P M dan A P M M!","title":"Rencana Sains: Talian Kecemasan 999 (5 Agensi Negara)","acronym":"A•P•K•J•A","hook":"Setiap panggilan ke talian 999 adalah PERCUMA, tetapi nombor pemanggil direkod serta-merta bagi menjejak pemanggil palsu!","mediaKey":"sai2_emergency_999_scene","summary":"Satu nombor kecemasan menyelaraskan lima agensi keselamatan dan kesihatan utama Malaysia dengan pantas.","bullets":["Lima Agensi Talian 999: Angkatan Pertahanan Awam Malaysia (APM), Polis DiRaja Malaysia (PDRM), Kementerian Kesihatan Malaysia (KKM), Jabatan Bomba dan Penyelamat Malaysia (JBPM), dan APMM.","Etika Panggilan: Panggilan kecemasan percuma dan nombor pemanggil direkod; hubungi 999 hanya apabila benar-benar memerlukan bantuan kecemasan."],"labId":"sai2_cpr_flip_deck_lab","labTitle":"Kad Agensi 999 & Punca CPR","labProps":{"tab":"999"},"examTip":"APMM merujuk kepada Agensi Penguatkuasaan Maritim Malaysia manakala APM ialah Angkatan Pertahanan Awam Malaysia."},{"type":"match","voiceIdKey":"u1-s2","voiceToneLabel":"Padan 5 Agensi Talian Kecemasan 999","voiceCaption":"Padankan singkatan agensi talian kecemasan 999 dengan nama penuh rasminya.","voiceScript":"[curious] Mari semak ingatan kamu tentang lima agensi penyelamat di bawah talian kecemasan sembilan sembilan sembilan. Padankan setiap singkatan dengan peranannya.","prompt":"Padankan singkatan agensi kecemasan Malaysia (m/s 20) dengan nama penuhnya:","pairs":[{"id":"ag1","left":"APM","right":"Angkatan Pertahanan Awam Malaysia"},{"id":"ag2","left":"JBPM","right":"Jabatan Bomba dan Penyelamat Malaysia"},{"id":"ag3","left":"APMM","right":"Agensi Penguatkuasaan Maritim Malaysia"},{"id":"ag4","left":"KKM & PDRM","right":"Kementerian Kesihatan & Polis DiRaja Malaysia"}],"explanation":"Kelima-lima agensi (APM, PDRM, KKM, JBPM, APMM) disatukan melalui talian 999 supaya masyarakat mendapat bantuan segera.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-c2","voiceToneLabel":"Definisi & 3 Keadaan Individu Perlu CPR","voiceCaption":"CPR menggabungkan tekanan dada dan hembusan mulut ke mulut bagi mengembalikan degupan jantung serta pernafasan mangsa.","voiceScript":"[curious] Apakah maksud Resusitasi Kardiopulmonari atau C P R? Ia ialah gabungan tekanan dada dan hembusan mulut ke mulut untuk mengembalikan degupan jantung serta pernafasan mangsa yang tiada nadi dan tidak bertindak balas!","title":"2.1 Definisi CPR, 3 Tanda (Rajah 2.1) & 4 Punca (Rajah 2.2)","acronym":"S•R•L•P","hook":"Jangan lakukan CPR sembarangan! Semak 3 tanda wajib dahulu: tidak bernafas, tiada respons, dan tiada nadi.","mediaKey":"sai2_cpr_causes_cards","summary":"CPR dilakukan kepada individu yang pengsan secara tiba-tiba serta mengalami kegagalan pernafasan dan degupan jantung.","bullets":["Tiga Keadaan Wajib CPR (Rajah 2.1): Individu TIDAK bernafas, TIDAK memberi respons terhadap rangsangan, dan TIADA degupan jantung atau nadi.","Empat Punca Utama (Rajah 2.2): Serangan jantung, renjatan elektrik, lemas dan panahan petir."],"labId":"sai2_cpr_flip_deck_lab","labTitle":"Kad Pastel 3D: 4 Punca CPR","labProps":{"tab":"causes"},"examTip":"Ketik kesemua 4 kad pastel 3D di atas untuk menyemak punca Rajah 2.2 sebelum menjawab soalan!"},{"type":"sort","voiceIdKey":"u1-s4","voiceToneLabel":"Isih Keadaan Perlu CPR vs Bukan CPR","voiceCaption":"Asingkan situasi mangsa yang memerlukan bantuan CPR segera daripada kes tercekik atau kes sedar.","voiceScript":"[confident] Kini uji ketepatan diagnos kamu! Kelaskan enam situasi berikut kepada kes yang memerlukan C P R segera ataupun tidak.","prompt":"Kelaskan keadaan individu berikut mengikut keperluan bantuan kecemasan CPR:","buckets":[{"id":"need_cpr","label":"Perlu CPR Segera"},{"id":"not_cpr","label":"Bukan Prosedur CPR"}],"items":[{"text":"Mangsa lemas ditarik dari kolam, tiada nadi & tidak bernafas","bucketId":"need_cpr","note":"Memenuhi kesemua 3 keadaan Rajah 2.1 + punca lemas."},{"text":"Pekerja terkena renjatan elektrik lalu pengsan tanpa denyutan jantung","bucketId":"need_cpr","note":"Renjatan elektrik merupakan punca utama Rajah 2.2."},{"text":"Murid memegang leher dengan kedua-dua tangan sambil cuba batuk di kantin","bucketId":"not_cpr","note":"Mangsa sedar dan tercekik; memerlukan Heimlich Manoeuvre."},{"text":"Pesakit serangan jantung rebah dan tidak memberi respons apabila ditepuk bahu","bucketId":"need_cpr","note":"Tiada respons + serangan jantung memerlukan CPR pantas."},{"text":"Pejalan kaki dipanah petir lalu pernafasan berhenti","bucketId":"need_cpr","note":"Panahan petir disenaraikan dalam Rajah 2.2."},{"text":"Mangsa tergelincir, masih sedar penuh dan bernafas laju akibat buku lali bengkak","bucketId":"not_cpr","note":"Masih sedar serta bernafas normal tidak perlukan tekanan dada."}],"explanation":"CPR hanya diberikan jika mangsa tidak memberi respons, tidak bernafas, dan tiada degupan jantung/nadi.","xp":20},{"type":"mcq","voiceIdKey":"u1-s5","voiceToneLabel":"Uji Kefahaman 3 Keadaan CPR (Rajah 2.1)","voiceCaption":"Kenal pasti pernyataan paling tepat mengenai tujuan dan keperluan bantuan CPR.","voiceScript":"[curious] Soalan uji cepat! Mengapakah seseorang individu yang mengalami serangan jantung boleh mengalami kerosakan otak kekal jika tiada sesiapa memulakan C P R sementara menanti ambulans?","prompt":"Mengapakah talian 999 merekodkan setiap nombor pemanggil kecemasan menurut Rencana Sains (m/s 20)?","options":["Supaya bil telefon kecemasan dapat dicaj kepada pemilik nombor.","Supaya pemanggil yang membuat panggilan palsu dapat dikesan dengan segera.","Untuk membolehkan hospital memberi ubat tanpa berjumpa mangsa.","Untuk menghadkan panggilan hanya kepada pegawai polis bertugas."],"correctIndex":1,"explanation":"Panggilan 999 adalah percuma, manakala rakaman nombor bertujuan menjejak serta membendung panggilan palsu yang membazirkan masa penyelamat.","xp":20}]},{"id":"sai2-u2","title":"Unit 2: Teknik 5 Langkah CPR & Kepentingannya","subtitle":"Subtopik 2.1.2 & 2.1.3 (m/s 22–24) — Kedalaman 5–6 cm, Kadar 100–120/min & Kitaran 30:2","iconType":"atom","iconUrl":"../assets/icons/sai2-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c1","voiceToneLabel":"5 Langkah Kaedah CPR Dewasa","voiceCaption":"Pelajari urutan rasmi 5 langkah CPR daripada pemeriksaan keselamatan hingga kitaran 30 tekanan dada dan 2 hembusan.","voiceScript":"[warm] Mari ikuti lima langkah C P R yang betul! Pertama periksa respons dan hubungi sembilan sembilan sembilan. Kedua dongak kepala serta angkat dagu. Ketiga lakukan tekanan dada sedalam lima hingga enam sentimeter pada kadar seratus hingga seratus dua puluh kali seminit!","title":"5 Langkah Kaedah CPR Dewasa (Rajah 2.3)","acronym":"5•6•30:2","hook":"Tekanan dada yang terlalu lemah gagal mengepam darah; tekanan melebihi 6 cm pula boleh mematahkan tulang rusuk mangsa!","mediaKeys":["cpr_training_wiki","sai2_cpr_rhythm_visual"],"summary":"Setiap angka piawai KKM dalam langkah 1 hingga 5 wajib dipatuhi agar darah beroksigen sampai ke otak mangsa dengan selamat.","bullets":["Langkah 1–2 (Keselamatan & Saluran Nafas): Pastikan sekitar selamat -> tepuk bahu ('Adakah anda OK?') -> minta tolong & dail 999 -> baring terlentang, dongak kepala dan angkat dagu.","Langkah 3–5 (Tekanan & Hembusan): Tekan tengah dada sedalam 5–6 cm pada kadar 100–120 tek/min -> picit hidung & hembus 1 saat -> ulang kitaran 30 tekanan dada : 2 hembusan."],"labId":"sai2_cpr_orbital_dial_lab","labTitle":"Dial Berputar 5 Langkah CPR & Latihan Ritma","labProps":{"mode":"dial"},"formula":"Kedalaman 5–6 cm   |   Kadar 100–120 tek/min   |   Kitaran 30 : 2","examTip":"Jika mangsa kembali bernafas tetapi masih pengsan, ubah mangsa ke posisi MENGIRING (m/s 23)."},{"type":"predict","voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Kedalaman & Kadar Tekanan Dada","voiceCaption":"Ramalkan julat kedalaman dan kadar tekanan dada yang betul menurut manual KKM dalam buku teks.","voiceScript":"[curious] Sebelum menguji simulator ritma C P R, ramalkan julat kedalaman dan kelajuan tekanan dada yang tepat mengikut buku teks Sains Tingkatan empat!","prompt":"Semasa melakukan tekanan dada langkah 3 CPR dewasa, berapakah julat kedalaman dan kadar tekanan seminit yang tepat mengikut KKM?","scenario":"Tangan diletakkan lurus berselang jari di tengah dada dengan bahu condong tegak.","mediaKey":"cpr_training_wiki","options":["2 – 3 cm pada kadar 60 – 70 tekanan per minit.","5 – 6 cm (tidak lebih 6 cm) pada kadar 100 – 120 tekanan per minit.","8 – 10 cm pada kadar 140 – 160 tekanan per minit.","1 – 2 cm pada kadar 30 tekanan per minit sahaja."],"correctIndex":1,"proofLabId":"sai2_cpr_orbital_dial_lab","proofState":{"mode":"dial","stepIdx":2},"explanation":"Manual Basic Life Support KKM (m/s 23) menetapkan tekanan ke bawah kira-kira 5 cm dan tidak lebih daripada 6 cm pada kadar 100–120 tekanan per minit.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-c2","voiceToneLabel":"Kepentingan CPR & Garis Panduan AHA 2016","voiceCaption":"CPR mengekalkan peredaran darah buatan ke otak dan seluruh tubuh untuk mencegah kerosakan sel otak akibat kekurangan oksigen.","voiceScript":"[confident] Mengapakah C P R penting? Tekanan dada mengepam darah secara buatan sementara hembusan mulut menghantar oksigen melalui trakea ke peparu lalu ke otak! Ingat petua A H A dua ribu enam belas: tekanan dada sahaja pun boleh selamatkan nyawa jika tidak selesa bantuan mulut ke mulut!","title":"Kepentingan CPR & Galeri Sains (AHA 2016)","acronym":"O2•OTAK","hook":"Tidak tahu atau tidak selesa melakukan hembusan mulut ke mulut? Garis Panduan AHA 2016 membolehkan TEKANAN DADA SAHAJA!","mediaKey":"sai2_oxygen_brain_flow","summary":"Tanpa aliran oksigen berterusan ke otak walaupun beberapa minit, sel otak mangsa boleh mengalami kerosakan kekal.","bullets":["Kepentingan 2 Teknik: Tekanan dada menghasilkan peredaran darah buatan mengepam darah melalui jantung; hembusan 1 saat membekalkan udara beroksigen ke peparu dan otak.","Galeri Sains (AHA 2016) & Risiko: Jika kurang yakin bantuan mulut ke mulut, teknik tekanan dada sahaja tetap membantu; kesilapan teknik berisiko mematahkan tulang rusuk."],"labId":"sai2_cpr_orbital_dial_lab","labTitle":"Simulator Ritma CPR (100-120 BPM)","labProps":{"mode":"arcade"},"examTip":"Jawapan wajib Kertas 2: 'Menghasilkan peredaran darah buatan' + 'membekalkan oksigen ke otak bagi mengelakkan kerosakan otak'."},{"type":"wordbank","voiceIdKey":"u2-s4","voiceToneLabel":"Susun Urutan Langkah CPR Dewasa","voiceCaption":"Susun lima frasa utama kaedah CPR mengikut kronologi rasmi Rajah 2.3.","voiceScript":"[confident] Susun semula lima peringkat utama prosedur C P R berikut daripada langkah pertama sehingga kitaran berulang!","prompt":"Susun prosedur lengkap kaedah CPR (m/s 22–23) mengikut urutan yang betul:","hint":"Mula dengan keselamatan & respons -> saluran pernafasan -> tekan dada -> hembusan -> ulang 30:2.","answerTokens":["Periksa respons & hubungi 999","Dongak kepala & angkat dagu","30 tekanan dada (5–6 cm)","2 hembusan mulut (1 saat)","Ulang 30:2 hingga ambulans tiba"],"distractors":["Beri minum air suam segera"],"explanation":"Urutan rasmi KKM: Periksa respons/999 -> Buka saluran nafas -> 30 tekanan dada (100–120/min) -> 2 hembusan 1 saat -> Ulang hingga bantuan tiba.","xp":20},{"type":"mcq","voiceIdKey":"u2-s5","voiceToneLabel":"Aplikasi Praktis Formatif 2.1 (Situasi Muthu)","voiceCaption":"Uji pemahaman situasi rumah tangga daripada Praktis Formatif 2.1 Soalan 3 dan 4.","voiceScript":"[curious] Berdasarkan Praktis Formatif dua perpuluhan satu: jika seorang remaja tidak tahu teknik C P R lengkap semasa ayahnya terkena serangan jantung, apakah tindakan terbaik yang masih boleh membantu sementara menunggu paramedik?","prompt":"Jika seseorang tidak selesa melakukan hembusan mulut ke mulut semasa memberi bantuan CPR, apakah tindakan yang disyorkan oleh Garis Panduan AHA 2016 (Galeri Sains m/s 24)?","options":["Memberi mangsa minuman manis bagi memulihkan tenaga jantung.","Melakukan kaedah tekanan dada sahaja (Hands-Only CPR) secara berterusan dan menghubungi 999.","Menunggu di tepi mangsa tanpa menyentuh dada mangsa langsung.","Mendudukkan mangsa menegak serta mengipas muka mangsa."],"correctIndex":1,"explanation":"Galeri Sains m/s 24 menyatakan garis panduan AHA 2016 mengesahkan kaedah tekanan dada sahaja masih berkesan mengekalkan aliran darah sementara menunggu ambulans.","xp":20}]},{"id":"sai2-u3","title":"Unit 3: Tanda Tercekik & Teknik Heimlich Manoeuvre","subtitle":"Subtopik 2.2 (m/s 25–27) — 4 Tanda Rajah 2.4, 4 Langkah Rajah 2.5 & Kepentingan O2","iconType":"scale","iconUrl":"../assets/icons/sai2-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c1","voiceToneLabel":"Definisi, 4 Tanda Tercekik & Kepentingan Oksigen","voiceCaption":"Kenali empat tanda mangsa tercekik dalam Rajah 2.4 serta mengapa bantuan Heimlich mesti diberi segera sebelum otak kekurangan oksigen.","voiceScript":"[warm] Sekarang kita ke subtopik dua perpuluhan dua, Heimlich Manoeuvre! Jika saluran pernafasan mangsa tersekat makanan, perhatikan empat tanda Rajah dua perpuluhan empat: memegang leher dua tangan, gagal bercakap atau batuk, kulit dan bibir kebiruan, serta sukar bernafas!","title":"2.2 Definisi, 4 Tanda Tercekik (Rajah 2.4) & Kepentingan","acronym":"4T•CEKIK","hook":"Apabila trakea tersumbat, oksigen tidak sampai ke peparu dan otak — kelewatan beberapa minit boleh membawa maut!","mediaKey":"sai2_choking_signs","summary":"Heimlich Manoeuvre dilakukan tanpa sebarang peralatan untuk menyelamatkan individu tercekik makanan atau bendasing.","bullets":["Empat Tanda Tercekik (Rajah 2.4): (1) Memegang leher dengan kedua-dua tangan, (2) Tidak boleh bercakap atau batuk, (3) Kulit, bibir & kuku kebiruan/kehitaman, (4) Sukar bernafas.","Kepentingan Segera: Saluran nafas tersekat menyekat bekalan oksigen ke peparu dan otak sehingga berisiko menyebabkan kerosakan otak atau kematian."],"labId":"sai2_heimlich_bento_lab","labTitle":"Kad 3D: 4 Tanda Mangsa Tercekik","labProps":{"tab":"signs"},"examTip":"Jangan tanya 'awak OK?' terlalu lama jika mangsa pegang leher sambil membisu & bibir kebiruan — bertindak segera!"},{"type":"sort","voiceIdKey":"u3-s2","voiceToneLabel":"Isih Tanda Tercekik vs Keadaan Lain","voiceCaption":"Kenal pasti empat tanda tepat mangsa tercekik mengikut Rajah 2.4.","voiceScript":"[curious] Asingkan gejala yang benar-benar menunjukkan mangsa tercekik mengikut Rajah dua perpuluhan empat daripada simptom kecederaan biasa.","prompt":"Kelaskan simptom berikut kepada Tanda Mangsa Tercekik (Rajah 2.4) atau Bukan Tanda Tercekik:","buckets":[{"id":"choking","label":"Tanda Mangsa Tercekik (Rajah 2.4)"},{"id":"other","label":"Bukan Tanda Tercekik"}],"items":[{"text":"Memegang leher dengan kedua-dua belah tangan","bucketId":"choking","note":"Isyarat kecemasan sejagat bagi sekatan saluran nafas."},{"text":"Tidak dapat bercakap atau mengeluarkan batuk kuat","bucketId":"choking","note":"Udara tersekat menghalang getaran pita suara."},{"text":"Kulit, bibir dan kuku kelihatan kebiruan atau kehitaman","bucketId":"choking","note":"Sianosis akibat darah kekurangan oksigen."},{"text":"Mangsa masih boleh menjerit kuat serta batuk bertalu-talu","bucketId":"other","note":"Masih ada aliran udara; galakkan terus batuk dahulu."},{"text":"Mengalami kesukaran bernafas dengan ketara","bucketId":"choking","note":"Sekatan bendasing pada saluran trakea."},{"text":"Kecederaan luka calar kecil pada tapak tangan tanpa sesak nafas","bucketId":"other","note":"Tidak melibatkan sekatan saluran udara."}],"explanation":"Kesemua 4 tanda Rajah 2.4 (pegang leher, tak boleh cakap/batuk, kebiruan, sukar bernafas) menandakan perlunya Heimlich Manoeuvre.","xp":20},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-c2","voiceToneLabel":"4 Langkah Kaedah Heimlich Manoeuvre","voiceCaption":"Pelajari kedudukan tangan di antara pusat dengan bawah rusuk serta mekanisme peningkatan tekanan peparu untuk menolak bendasing keluar.","voiceScript":"[confident] Bagaimana kaedah Heimlich Manoeuvre menolak keluar bendasing? Berdiri di belakang mangsa dan bongkokkan badannya ke hadapan. Letakkan genggaman tangan kanan di antara pusat dengan bawah rusuk, kemudian tekan dan sentak kuat ke atas agar tekanan peparu menolak makanan terkeluar!","title":"4 Langkah Kaedah Heimlich Manoeuvre (Rajah 2.5)","acronym":"B•G•P•S","hook":"Lokasi tangan tepat adalah antara PUSAT dengan BAWAH RUSUK — sentakan ke atas menambah tekanan peparu untuk menolak keluar bendasing!","mediaKey":"sai2_heimlich_action","summary":"Sentakan ke dalam dan ke atas menaikkan tekanan udara dalam peparu mangsa seperti pam udara kecemasan.","bullets":["Langkah 1–3 (Posisi & Genggaman): Berdiri di belakang mangsa & bongkokkan sedikit ke hadapan -> kelilingkan tangan & genggam tangan kanan -> letak genggaman di antara pusat dengan bawah rusuk, lapik dengan tangan kiri.","Langkah 4 (Sentakan Fizik): Tekan dan sentak ke atas dengan kuat serta cepat; tindakan ini meningkatkan tekanan di dalam peparu menyebabkan bendasing tertolak keluar."],"labId":"sai2_heimlich_bento_lab","labTitle":"Simulator Sentakan Diafragma & Tekanan Peparu","labProps":{"tab":"sim"},"examTip":"Soalan lazim SPM: 'Bagaimana Heimlich menolak makanan?' -> 'Menambahkan tekanan di dalam peparu supaya bendasing tertolak keluar'."},{"type":"predict","voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Mekanisme Sains Sentakan Heimlich","voiceCaption":"Ramalkan sebab saintifik bendasing boleh terpancut keluar dari saluran trakea semasa sentakan ke atas.","voiceScript":"[curious] Gunakan konsep tekanan udara Sains! Apakah yang berlaku di dalam rongga peparu apabila genggaman tangan disentak kuat ke atas di bawah rusuk mangsa?","prompt":"Berdasarkan prinsip sains (m/s 27), mengapakah tekanan dan sentakan kuat ke atas dapat mengeluarkan makanan yang tersekat?","scenario":"Genggaman diletakkan di antara pusat dan bawah rusuk lalu disentak ke dalam dan atas.","mediaKey":"sai2_heimlich_action","options":["Sentakan menyebabkan mangsa tertelan makanan terus ke dalam perut.","Tekanan di dalam peparu bertambah dengan cepat lalu menolak bendasing keluar dari saluran pernafasan.","Otot leher menjadi kendur supaya makanan jatuh ke bawah dengan graviti.","Suhu badan mangsa meningkat mendadak bagi mencairkan makanan tersebut."],"correctIndex":1,"proofLabId":"sai2_heimlich_bento_lab","proofState":{"tab":"sim"},"explanation":"Seperti dinyatakan di m/s 27, tekanan dan sentakan ke atas menambahkan tekanan di dalam peparu sekali gus menolak keluar bendasing daripada trakea.","xp":20},{"type":"wordbank","voiceIdKey":"u3-s5","voiceToneLabel":"Susun 4 Langkah Heimlich Manoeuvre","voiceCaption":"Susunkan empat langkah pelaksanaan Heimlich Manoeuvre dari Rajah 2.5 mengikut urutan yang betul.","voiceScript":"[confident] Susunkan semula empat langkah utama Heimlich Manoeuvre mengikut susunan yang betul!","prompt":"Susun langkah pelaksanaan Heimlich Manoeuvre (Rajah 2.5) mengikut urutan tepat:","hint":"Berdiri belakang -> genggam tangan kanan -> antara pusat & bawah rusuk -> tekan & sentak ke atas.","answerTokens":["Berdiri di belakang & bongkokkan mangsa","Kelilingkan tangan & genggam tangan kanan","Letak di antara pusat dengan bawah rusuk","Tekan & sentak ke atas dengan kuat & cepat"],"distractors":["Tekan di bahagian atas tulang belakang"],"explanation":"Urutan Rajah 2.5: (1) Berdiri belakang & bongkokkan badan -> (2) Genggam tangan kanan -> (3) Antara pusat & bawah rusuk -> (4) Tekan & sentak ke atas kuat & cepat.","xp":20}]},{"id":"sai2-u4","title":"Unit 4: Penyelamatan Diri Sendiri & Kes Khas KBAT","subtitle":"Rajah 2.6 & Praktis Sumatif 2 (m/s 28, 31–32) — Objek Separas Pinggang, Mengiring & Ibu Hamil","iconType":"compass","iconUrl":"../assets/icons/sai2-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c1","voiceToneLabel":"Heimlich Pada Diri Sendiri & KBAT Wanita Hamil","voiceCaption":"Pelajari cara menyelamatkan diri sendiri jika tercekik bersendirian serta teknik khas tekanan dada bagi wanita mengandung.","voiceScript":"[warm] Bagaimana pula jika kamu tercekik ketika bersendirian di rumah, atau membantu wanita mengandung yang tercekik? Bagi diri sendiri, tolak bahagian abdomen pada penyandar kerusi atau tepi meja separas pinggang! Bagi wanita hamil pula, jangan tekan abdomen — guna teknik tekanan dada!","title":"Heimlich Diri Sendiri (Rajah 2.6) & KBAT Ibu Mengandung","acronym":"KERUSI • DADA","hook":"Sendirian? Guna penyandar kerusi atau tepi meja separas pinggang! Wanita mengandung? Ganti tekanan perut kepada tekanan DADA!","mediaKey":"sai2_self_heimlich_chair","summary":"Pengubahsuaian teknik menyelamatkan diri dan melindungi keselamatan janin merupakan aplikasi KBAT kegemaran peperiksaan SPM.","bullets":["Diri Sendiri (Rajah 2.6): Letakkan tangan antara pusat dan bawah rusuk lalu tekan sambil membongkok; jika lemah, tolak abdomen sekuat tenaga pada objek separas pinggang seperti kerusi atau meja.","KBAT Wanita Mengandung (Sumatif 3c): Teknik Heimlich abdomen TIDAK sesuai kerana boleh mencederakan janin; gantikan dengan tekanan dada (chest thrusts)."],"labId":"sai2_heimlich_bento_lab","labTitle":"Mod Diri Sendiri & KBAT Wanita Mengandung","labProps":{"tab":"self"},"examTip":"Ketinggian objek sokongan diri sendiri mestilah SEPARAS PINGGANG (seperti kerusi atau meja), bukan terlalu tinggi atau tajam."},{"type":"match","voiceIdKey":"u4-s2","voiceToneLabel":"Padan Lokasi Tekanan Mengikut Kes Khas","voiceCaption":"Padankan jenis mangsa atau situasi kecemasan dengan tindakan serta lokasi tekanan yang tepat.","voiceScript":"[curious] Mari padankan setiap kes khas Bantuan Kecemasan dengan kaedah dan lokasi tekanan yang betul!","prompt":"Padankan situasi mangsa di sebelah kiri dengan tindakan atau lokasi teknik yang betul:","pairs":[{"id":"sp1","left":"Mangsa tercekik seorang diri & lemah","right":"Tolak abdomen pada kerusi/meja separas pinggang"},{"id":"sp2","left":"Wanita mengandung tercekik makanan","right":"Tekanan dada (elak tekanan abdomen)"},{"id":"sp3","left":"Mangsa CPR mula bernafas tetapi belum sedar","right":"Ubah kedudukan badan kepada mengiring"},{"id":"sp4","left":"Mangsa CPR dewasa tidak bernafas & tiada nadi","right":"Tekan tengah dada sedalam 5–6 cm (30:2)"}],"explanation":"Mengubah mangsa ke posisi mengiring mengekalkan saluran pernafasan terbuka; wanita hamil diberi tekanan dada; mangsa sendirian boleh guna kerusi separas pinggang.","xp":15},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-c2","voiceToneLabel":"Konsol Triaj Praktis Sumatif 2","voiceCaption":"Bandingkan kes CPR dan Heimlich dalam Konsol Diagnostik Triaj Webflow untuk mengukuhkan keputusan pantas semasa kecemasan.","voiceScript":"[confident] Tiba masanya untuk konsol triaj interaktif! Bezakan kes Saiful, Ronnie, Datuk Amirul dan wanita mengandung daripada Praktis Sumatif dua buku teks supaya kamu sentiasa memilih bantuan yang betul dalam beberapa saat sahaja!","title":"Perbandingan Triaj Pantas: CPR vs Heimlich & Praktis Sumatif","acronym":"P•K•T•M","hook":"Satu soalan pembeza paling pantas: Masih sedar sambil memegang leher = Heimlich; pengsan & tiada nadi = CPR!","mediaKey":"sai2_triage_compare","summary":"Menilai sama ada masalah mangsa ialah henti jantung atau saluran pernafasan tersumbat menentukan nyawa dalam beberapa saat pertama.","bullets":["Triaj CPR vs Heimlich: Tidak respons + tiada nadi + tidak bernafas -> CPR (atau mengiring jika mula bernafas sebelum sedar). Sedar + pegang leher + tak boleh batuk/bercakap -> Heimlich.","Etika Pencegahan: Elakkan makan sambil bercakap atau ketawa (kes Jia Hui) bagi mengelakkan makanan memasuki saluran trakea."],"labId":"sai2_triage_scorecard_lab","labTitle":"Konsol Diagnostik Triaj Webflow","examTip":"Kunci skor penuh Kertas 2 Soalan 5 (Cabar Minda): Kenal pasti tujuan -> analisis pilihan -> pilih kaedah tepat ikut urutan -> beri sebab oksigen ke otak!"},{"type":"predict","voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Tindakan Selepas CPR (Kes Ronnie)","voiceCaption":"Ramalkan langkah susulan bagi Ronnie selepas dia mula bernafas hasil CPR tetapi belum sedarkan diri.","voiceScript":"[curious] Berdasarkan Praktis Sumatif dua soalan dua: Ronnie berjaya diselamatkan daripada lemas dan kini sudah bernafas semula hasil bantuan C P R, namun dia masih belum sedarkan diri. Apakah langkah seterusnya?","prompt":"Ronnie yang pengsan ditarik dari sungai. Selepas diberi CPR, beliau kembali bernafas tetapi masih belum sedar. Apakah tindakan seterusnya?","scenario":"Merujuk langkah 5 prosedur CPR di halaman 23 dan Praktis Sumatif 2(b).","mediaKey":"sai2_triage_compare","options":["Teruskan menekan dada sebanyak 30 kali lagi tanpa berhenti.","Ubah kedudukan badan Ronnie dalam keadaan mengiring sementara menunggu ambulans.","Tinggalkan mangsa terbaring terlentang atau berikan minuman panas.","Lakukan Heimlich Manoeuvre pada bahagian perut Ronnie."],"correctIndex":1,"proofLabId":"sai2_triage_scorecard_lab","proofState":{"caseIdx":2},"explanation":"Halaman 23 menetapkan: 'Jika mangsa bernafas tetapi masih belum sedar, ubah kedudukan badan mangsa dalam keadaan mengiring' untuk mengelakkan lidah atau muntah menghalang saluran nafas.","xp":20},{"type":"mcq","voiceIdKey":"u4-s5","voiceToneLabel":"Uji KBAT Wanita Mengandung Tercekik","voiceCaption":"Pilih alasan dan teknik penggantian yang tepat bagi menyelamatkan wanita mengandung yang tercekik.","voiceScript":"[curious] Bolehkah kaedah Heimlich abdomen biasa digunakan kepada seorang wanita yang sedang mengandung sekiranya beliau tercekik? Pilih jawapan dan alternatif paling tepat!","prompt":"Bolehkah kaedah Heimlich abdomen dilakukan kepada wanita mengandung yang tercekik? Apakah teknik gantiannya (Praktis Sumatif 3c)?","options":["Boleh; gunakan kekuatan sentakan berganda pada perut.","Tidak boleh; boleh mencederakan janin — gantikan dengan tekanan pada bahagian dada (chest thrusts).","Boleh; jika wanita tersebut diletakkan dalam posisi berbaring terlentang.","Tidak perlu sebarang bantuan; tunggu sahaja ambulans tiba."],"correctIndex":1,"explanation":"Tekanan pada bahagian abdomen berisiko mencederakan rahim dan janin; penyelamat hendaklah melakukan tekanan pada bahagian tengah dada (chest thrusts).","xp":20}]},{"id":"sai2-u5","title":"Unit 5: Cabaran Boss SPM — Bantuan Kecemasan","subtitle":"5 Pusingan Sintesis Kertas 1 & Kertas 2 Berasaskan Praktis Sumatif Bab 2","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","voiceIdKey":"u5-s1","voiceToneLabel":"Boss Round 1: Kes Saiful Pengsan (Cabar Minda)","voiceCaption":"Selesaikan soalan Cabar Minda mengenai seorang lelaki yang tiba-tiba rebah di pusat beli-belah.","voiceScript":"[excited] Selamat datang ke Cabaran Boss Bab dua! Pusingan pertama: Saiful tiba-tiba rebah dan tidak sedarkan diri di sebuah pusat beli-belah. Apakah langkah pertama yang perlu kamu ambil apabila tiba di tempat kejadian?","prompt":"Saiful tiba-tiba rebah dan tidak sedarkan diri di sebuah pusat beli-belah (Praktis Sumatif Soalan 5). Apakah urutan langkah awal paling tepat?","mediaKey":"sai2_emergency_999_scene","options":["Terus lakukan tekanan dada tanpa memeriksa kawasan sekitar atau nadi.","Pastikan persekitaran selamat -> periksa respons mangsa -> minta bantuan orang sekeliling hubungi 999 -> semak pernafasan/nadi sebelum CPR.","Terus lakukan Heimlich Manoeuvre di tengah perut Saiful.","Angkat Saiful ke dalam kereta sendiri tanpa menghubungi talian kecemasan."],"correctIndex":1,"explanation":"Prosedur sistematik langkah 1–2 KKM wajib memeriksa keselamatan lokasi dan respons mangsa serta menghubungi 999 sebelum menentukan keperluan tekanan dada CPR.","xp":25},{"type":"predict","voiceIdKey":"u5-s2","voiceToneLabel":"Boss Round 2: Kes Datuk Amirul Tercekik di Restoran","voiceCaption":"Analisis langkah menyelamatkan warga emas yang tercekik di restoran daripada Praktis Formatif 2.2.","voiceScript":"[curious] Pusingan kedua! Amirul sedang makan malam dengan datuknya di restoran apabila datuknya tiba-tiba memegang leher dan tidak dapat bersuara. Mengapakah Amirul tidak boleh melengahkan bantuan Heimlich?","prompt":"Datuk Amirul menunjukkan tanda tercekik ketika makan di restoran (Praktis Formatif 2.2). Mengapakah bantuan Heimlich mesti diberi serta-merta?","scenario":"Bendasing menyekat saluran pernafasan daripada menerima udara beroksigen.","options":["Supaya makanan hadam dengan lebih pantas di dalam perut.","Kerana saluran nafas yang tersumbat menghalang oksigen ke peparu dan otak sehingga berisiko menyebabkan kerosakan otak atau kematian.","Supaya degupan jantung mangsa boleh diturunkan ke bawah 50 seminit.","Supaya mangsa boleh terus makan semula dengan selesa."],"correctIndex":1,"proofLabId":"sai2_triage_scorecard_lab","proofState":{"caseIdx":1},"explanation":"Buku teks m/s 25 menegaskan sekatan saluran nafas menghalang pengangkutan oksigen ke otak; kelewatan bantuan mengakibatkan kerosakan otak atau kematian.","xp":25},{"type":"sort","voiceIdKey":"u5-s3","voiceToneLabel":"Boss Round 3: Isih Protokol CPR vs Heimlich","voiceCaption":"Bezakan parameter fizikal, posisi dan sasaran teknik antara CPR dan Heimlich Manoeuvre.","voiceScript":"[confident] Pusingan ketiga Boss Challenge! Asingkan keenam-enam parameter teknik ini ke dalam protokol C P R ataupun Heimlich Manoeuvre tanpa satu pun kesilapan!","prompt":"Isih parameter prosedur berikut kepada protokol yang sepadan (CPR vs Heimlich Manoeuvre):","buckets":[{"id":"b_cpr","label":"Protokol CPR (2.1)"},{"id":"b_heim","label":"Protokol Heimlich Manoeuvre (2.2)"}],"items":[{"text":"Kadar 100 – 120 tekanan seminit sedalam 5–6 cm","bucketId":"b_cpr","note":"Spesifikasi tekanan dada KKM."},{"text":"Genggaman diletakkan di antara pusat dengan bawah rusuk","bucketId":"b_heim","note":"Titik sentakan abdomen ke atas."},{"text":"Kitaran 30 tekanan dada diikuti 2 hembusan 1 saat","bucketId":"b_cpr","note":"Rasio rasmi bantuan pernafasan dan peredaran darah buatan."},{"text":"Menaikkan tekanan udara di dalam peparu supaya bendasing tertolak keluar","bucketId":"b_heim","note":"Mekanisme pelepasan sekatan trakea."},{"text":"Dongakkan kepala dan angkat dagu mangsa terlentang","bucketId":"b_cpr","note":"Langkah membuka saluran pernafasan mangsa tidak sedar."},{"text":"Tolak abdomen pada penyandar kerusi/meja separas pinggang jika sendirian","bucketId":"b_heim","note":"Kaedah penyelamatan diri sendiri (Rajah 2.6)."}],"explanation":"Menguasai perbezaan antara CPR (pam darah + oksigen ke otak) dan Heimlich (tingkatkan tekanan peparu tolak bendasing) mengukuhkan jawapan Kertas 1 dan 2.","xp":25},{"type":"wordbank","voiceIdKey":"u5-s4","voiceToneLabel":"Boss Round 4: Rumusan Penjanaan Tekanan Heimlich","voiceCaption":"Bina ayat jawapan Kertas 2 yang lengkap bagi menerangkan fungsi Heimlich Manoeuvre.","voiceScript":"[curious] Pusingan keempat! Susunkan frasa berikut menjadi satu jawapan skema Kertas dua yang padat dan tepat menerangkan fungsi Heimlich Manoeuvre.","prompt":"Susun perkataan berikut menjadi jawapan tepat Kertas 2 mengenai mekanisme Heimlich Manoeuvre:","hint":"Genggaman + sentakan ke atas + tambah tekanan dalam peparu + bendasing tertolak keluar.","answerTokens":["Tekanan dan sentakan ke atas","akan menambahkan tekanan","di dalam peparu mangsa","lalu menolak bendasing keluar."],"distractors":["lalu menolak bendasing ke perut"],"explanation":"Jawapan skema tepat berdasarkan halaman 27: tekanan & sentakan ke atas -> menambah tekanan di dalam peparu -> bendasing tertolak keluar.","xp":25},{"type":"mcq","voiceIdKey":"u5-s5","voiceToneLabel":"Boss Final: Pencegahan & Risiko Kecemasan","voiceCaption":"Selesaikan soalan akhir menyentuh keselamatan pelaksanaan CPR dan pencegahan tercekik.","voiceScript":"[excited] Pusingan terakhir Boss Challenge! Apakah risiko fizikal yang boleh menimpa mangsa sekiranya prosedur tekanan dada C P R dilakukan dengan teknik serta kekuatan yang salah?","prompt":"Apakah risiko utama jika teknik tekanan dada CPR dilakukan secara salah atau terlalu kasar pada dada mangsa (m/s 22)?","options":["Tekanan darah mangsa meningkat menjadi terlalu tinggi.","Tulang rusuk mangsa boleh patah atau udara gagal s   window.ETUTOR_NOTA_LABS.sai2_cpr_flip_deck_lab = function (shell, ctx) {

    var flipped = {};

      { id: "c1", num: "01", tone: "is-ice", title: "Serangan Jantung", front: "Ketik untuk punca & kesan", back: "Aliran darah ke jantung tersumbat -> degupan nadi terhenti serta-merta (Rajah 2.2)." },

      { id: "c3", num: "03", tone: "is-cream", title: "Lemas di Air", front: "Ketik untuk punca & kesan", back: "Air menyekat kemasukan oksigen ke peparu lalu mangsa tidak bernafas & tiada respons." },
      { id: "c4", num: "04", tone: "is-lavender", title: "Panahan Petir", front: "Ketik untuk punca & kesan", back: "Kejutan voltan tinggi melumpuhkan pusat kawalan pernafasan dan ritma jantung." }

      { tag: "jp-violet", code: "PDRM", name: "Polis DiRaja Malaysia" },
      { tag: "jp-mint", code: "KKM", name: "Kementerian Kesihatan Malaysia" },
      { tag: "jp-amber", code: "JBPM", name: "Jabatan Bomba dan Penyelamat Malaysia" },
      { tag: "jp-rose", code: "APMM", name: "Agensi Penguatkuasaan Maritim Malaysia" }
    ];

    function render() {
      var pillRow =
        '<div class="wf-jucas-pills">' +
          '<button type="button" class="wf-jpill jp-mint" data-wf-tab="causes" aria-pressed="' + (tab === "causes") + '">Kad 3D: 4 Punca Utama CPR</button>' +

                "</div>" +
              "</div>" +
            "</button>"

function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
