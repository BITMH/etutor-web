  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sains-t4-bab03","subject":"Sains","form":4,"chapterNumber":3,"title":"Teknik Mengukur Parameter Kesihatan Badan","subtitle":"Subtopik 3.1–3.4 KSSM (48 Langkah Bit-by-Bit) — Termometer 3D, Titik Nadi & Eksperimen 3.1, Sfigmomanometer & CPG 2018, Rumus BMI & Pinggan Sihat Malaysia.","estimatedMinutes":32,"themeAccent":"#0ea5e9","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Animasi 3D Three.js & Suara AI","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableThreeJs":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/sai3-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Teknik pengukuran kesihatan kamu memang bertaraf doktor muda!","combo":"[laughs warmly] Kombo yang hebat! Data vital kamu tepat dan kemas!","encourage":"[softly] Hampir tepat... mari semak semula angka piawai dan teknik dalam simulasi tiga dimensi.","celebrate":"[excited] Tahniah! Kamu telah menguasai kesemua empat puluh lapan langkah Bab tiga!"},"units":[{"id":"sai3-u1","title":"Unit 1: Suhu Badan & Empat Jenis Termometer","subtitle":"Subtopik 3.1 & Rencana Sains — Suhu Normal 36.9°C, 4 Termometer, Pencerutan & Demam","iconType":"atom","iconUrl":"../assets/icons/sai3-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"4 Parameter Kesihatan","voiceCaption":"Pemeriksaan berkala mengukur empat parameter utama: suhu badan, kadar nadi, tekanan darah dan BMI.","voiceScript":"[warm] Selamat datang ke Bab tiga, Teknik Mengukur Parameter Kesihatan Badan! Selaras Kempen Gaya Hidup Sihat, kita perlu memantau empat bacaan penting iaitu suhu badan, kadar denyutan nadi, tekanan darah dan indeks jisim badan B M I!","title":"Rencana Sains: 4 Parameter Kesihatan & Homeostasis Suhu","acronym":"S•N•T•B","hook":"Suhu badan manusia ialah darjah kepanasan badan kita yang dikawal oleh kulit dan sistem endokrin!","mediaKey":"sai3_health_checkup_hero","summary":"Suhu normal memastikan tindak balas biokimia dan organ badan beroperasi pada tahap paling optimum.","bullets":["4 Parameter Kesihatan Utama: Suhu badan, kadar denyutan nadi, tekanan darah serta Indeks Jisim Badan (BMI) membantu mengesan penyakit secara awal sebelum menjadi kronik.","Kawalan Homeostasis Suhu: Kulit dan sistem endokrin bekerjasama mengawal atur suhu badan manusia agar sentiasa stabil berhampiran 36.9°C."],"labId":"sai3_three_thermometer_lab","labTitle":"Makmal 3D: 4 Jenis Termometer","labProps":{"tab":"types","device":"klinik"},"examTip":"Jika ditanya organ dan sistem yang mengawal atur suhu badan dalam soalan Imbas Kembali, tulis: kulit dan sistem endokrin (melalui mekanisme homeostasis)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Fungsi Pencerutan","voiceCaption":"Mengapakah bacaan termometer makmal merosot sebaik sahaja dikeluarkan dari mulut?","voiceScript":"[curious] Cuba ramalkan! Jika kamu mengeluarkan termometer makmal dari mulut pesakit untuk membaca suhu di bawah lampu, apakah yang akan berlaku kepada paras merkurinya?","hook":"Tiub sempit atau lurus? Perbezaan kecil pada kaca menentukan ketepatan bacaan!","scenario":"Seorang murid cuba menyukat suhu ketiaknya menggunakan termometer makmal (-10°C hingga 110°C), lalu mengeluarkannya sebelum mencatat bacaan.","prompt":"Apakah yang berlaku pada turus merkuri termometer makmal sejurus dikeluarkan daripada badan?","options":["Merkuri jatuh cepat ke suhu bilik kerana tiada bahagian pencerutan pada tiubnya","Merkuri kekal membeku pada bacaan tertinggi selama beberapa jam","Merkuri naik mendadak ke 110°C akibat terkena udara luar","Merkuri bertukar warna menjadi biru dan berhenti bergerak"],"correctIndex":0,"proofLabId":"sai3_three_thermometer_lab","proofState":{"tab":"klinik","device":"makmal","tempC":38.5},"explanation":"Termometer makmal tidak mempunyai bahagian pencerutan pada turus merkuri. Apabila dikeluarkan, bacaan turun cepat. Jika terpaksa menggunakannya, bacaan mesti diambil semasa masih berada di dalam mulut atau ketiak.","voiceIdKeyHint":"u1-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Klinik vs Makmal 3D","voiceCaption":"Termometer klinik (35–42°C) ada pencerutan untuk menahan merkuri; termometer makmal (-10–110°C) tiada pencerutan.","voiceScript":"[warm] Lihat model kaca tiga dimensi ini! Termometer klinik menyukat tiga puluh lima hingga empat puluh dua darjah Celsius dan mempunyai bahagian pencerutan supaya merkuri kekal tepat walaupun dikeluarkan. Sebelum guna, kibaskan di bawah tiga puluh lima darjah Celsius ya!","title":"Termometer Klinik (35–42°C) vs Termometer Makmal (-10–110°C)","acronym":"35•42•K•M","hook":"WAJIB kibas termometer klinik di bawah 35°C dahulu sebelum diletakkan di bawah ketiak atau mulut selama 2–3 minit!","mediaKey":"sai3_thermometer_constriction","summary":"Bahagian pencerutan pada tiub kapilari membezakan fungsi termometer klinik dengan termometer makmal.","bullets":["Termometer Klinik (35°C – 42°C): Mempunyai pencerutan supaya turus merkuri tidak turun cepat selepas dikeluarkan; biarkan 2–3 minit (atau tunggu bunyi 'Bip' digital) sebelum bacaan dicatat.","Termometer Makmal (-10°C – 110°C): Direka menyukat suhu cecair dan tiada pencerutan; jika menyukat suhu badan, wajib baca ketika bebuli masih berada di bawah ketiak atau di dalam mulut."],"labId":"sai3_three_thermometer_lab","labTitle":"Uji Pencerutan 3D: Klinik vs Makmal","labProps":{"tab":"klinik","device":"klinik"},"examTip":"Soalan SPM sangat gemar menyoal tujuan pencerutan: 'Supaya merkuri tidak turun dengan cepat setelah dikeluarkan daripada mulut atau ketiak untuk memberikan sukatan lebih tepat'."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan 4 Termometer","voiceCaption":"Padankan setiap jenis termometer dengan julat atau ciri penggunaan khasnya.","voiceScript":"[confident] Jom padankan keempat-empat jenis termometer dengan julat dan kegunaan paling tepat!","prompt":"Padankan jenis termometer dengan julat dan kegunaan yang betul:","pairs":[{"id":"p1","left":"Termometer klinik","right":"Julat 35°C – 42°C; ada pencerutan untuk bacaan badan"},{"id":"p2","left":"Termometer makmal","right":"Julat -10°C – 110°C; menyukat suhu cecair tanpa pencerutan"},{"id":"p3","left":"Termometer rektal","right":"Khusus untuk bayi kurang daripada 3 bulan melalui dubur"},{"id":"p4","left":"Termometer inframerah","right":"Tanpa bersentuhan badan pada jarak ~5 cm; bacaan sangat pantas"}],"explanation":"Setiap termometer mempunyai julat skala dan protokol klinikal tersendiri agar keputusan selamat dan tepat."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"SOP Rektal & Inframerah","voiceCaption":"Termometer rektal dimasukkan 1.5–2.5 cm dengan jeli petroleum; termometer inframerah dihalakan ~5 cm tanpa terkena mata.","voiceScript":"[warm] Bagaimana pula cara selamat menyukat suhu bayi dan imbasan tanpa sentuhan? Bagi bayi di bawah tiga bulan, bersihkan termometer rektal dengan alkohol, sapu jeli petroleum, angkat kaki bayi dan masukkan satu perpuluhan lima hingga dua perpuluhan lima sentimeter sahaja!","title":"SOP Termometer Rektal (Bayi <3 Bulan) & Inframerah (~5 cm)","acronym":"1.5•2.5•5CM","hook":"Termometer inframerah mesti dihalakan pada jarak ~5 cm dan DILARANG sama sekali diarahkan ke mata!","mediaKey":"sai3_rectal_infrared_sop","summary":"Prosedur klinikal khas memastikan keselamatan bayi serta ketepatan imbasan pantas tanpa sentuhan.","bullets":["SOP Termometer Rektal (< 3 bulan): Nyahkuman muncung dengan alkohol, sapu jeli petroleum sebagai pelincir, angkat kaki bayi, masukkan 1.5 – 2.5 cm dan tunggu bunyi 'Bip' sebelum merekod.","SOP Termometer Inframerah: Imbas tanpa sentuhan pada jarak kira-kira 5 cm ke dahi/badan, baca keputusan serta-merta dan jauhkan sinaran daripada mata secara langsung atau tidak langsung."],"labId":"sai3_three_thermometer_lab","labTitle":"Simulator Jarak Inframerah 5 cm 3D","labProps":{"tab":"rektal_ir","device":"inframerah"},"examTip":"Hafal 3 angka penting Subtopik 3.1: bayi < 3 bulan, kedalaman dubur 1.5–2.5 cm, dan jarak inframerah ~5 cm!"},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun SOP Termometer","voiceCaption":"Susun turutan langkah penggunaan termometer klinik dari mula hingga rekod bacaan.","voiceScript":"[curious] Susun langkah menggunakan termometer klinik secara berturutan sebelum diletak di bawah ketiak sehingga bacaan direkodkan!","prompt":"Susun langkah betul menyukat suhu badan menggunakan termometer klinik:","hint":"Mula dengan memastikan bacaan berada di bawah 35°C.","answerTokens":["Kibas di bawah 35°C","Letak bawah ketiak 2–3 minit","Keluarkan dan rekod bacaan"],"distractors":["Sapu jeli petroleum","Halakan 5 cm ke mata"],"explanation":"Prosedur termometer klinik: (1) kibaskan supaya < 35°C, (2) letak bawah ketiak atau mulut selama 2–3 minit (atau bunyi 'Bip'), dan (3) keluarkan serta rekod bacaan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s7","voiceToneLabel":"Suhu Normal & 3 Faktor Demam","voiceCaption":"Suhu normal ialah 36.9°C; demam melebihi 37°C boleh berpunca daripada jangkitan, panas melampau, atau senaman berat.","voiceScript":"[warm] Ingat nombor keramat ini: suhu badan normal manusia ialah tiga puluh enam perpuluhan sembilan darjah Celsius! Jika melebihi tiga puluh tujuh darjah Celsius, anda mengalami demam. Tiga puncanya ialah jangkitan bakteria atau virus, dedahan panas melampau serta senaman berat!","title":"Menginterpretasi Suhu: 36.9°C Normal, >37°C Demam & Sejuk Melampau","acronym":"36.9•37•JPS","hook":"Jika suhu kekal melebihi normal lebih daripada 3 hari, segera jumpa doktor! Suhu terlampau sejuk pula boleh membawa maut.","mediaKey":"sai3_fever_factors_chart","videoClip":{"youtubeId":"-wB7Vu4eB0c","title":"Perbandingan Termometer Klinik & Inframerah (3.1 Suhu Badan)","posterKey":"sai3_rectal_infrared_sop","caption":"Video 3D HanaStudio: Perbandingan imbasan termometer klinik & inframerah tanpa sentuhan"},"summary":"Suhu badan melebihi atau menurun jauh dari julat normal menandakan gangguan kesihatan atau stres persekitaran.","bullets":["Ambang Bacaan Suhu: Suhu normal manusia ialah 36.9°C; suhu melebihi 37°C menandakan demam, manakala pendedahan kepada sejuk melampau menurunkan suhu di bawah normal sehingga boleh membawa maut.","3 Faktor Peningkatan Suhu (Rajah 3.4): (1) Jangkitan bakteria atau virus, (2) Terdedah kepada panas melampau seperti strok haba dan selaran matahari melampau, serta (3) Senaman berat."],"examTip":"Bezakan angka buku teks dengan tepat: suhu normal = 36.9°C; disahkan demam = melebihi 37°C; rujuk doktor jika demam > 3 hari."},{"type":"sort","xp":20,"voiceIdKey":"u1-s8","voiceToneLabel":"Isih Keadaan Suhu","voiceCaption":"Kelaskan situasi mengikut kategori suhu normal, punca suhu tinggi, atau prosedur yang betul.","voiceScript":"[confident] Kelaskan setiap pernyataan suhu badan berikut ke dalam tiga bakul yang tepat!","prompt":"Isihkan pernyataan berikut mengikut kategori yang tepat:","buckets":[{"id":"punca","label":"Faktor Suhu > Normal"},{"id":"normal_bahaya","label":"Fakta Bacaan / Risiko"},{"id":"alat","label":"Ciri Alat Termometer"}],"items":[{"text":"Jangkitan bakteria dan virus","bucketId":"punca","note":"Merangsang tindak balas imun yang menaikkan suhu"},{"text":"Strok haba & selaran matahari melampau","bucketId":"punca","note":"Terdedah kepada panas melampau"},{"text":"Senaman berat yang berpanjangan","bucketId":"punca","note":"Respirasi otot membebaskan haba tambahan"},{"text":"Suhu badan normal ialah 36.9°C","bucketId":"normal_bahaya","note":"Julat optimum fungsi organ"},{"text":"Sejuk melampau boleh membawa maut","bucketId":"normal_bahaya","note":"Hipotermia menggagalkan sistem badan"},{"text":"Pencerutan halang merkuri jatuh cepat","bucketId":"alat","note":"Kelebihan eksklusif termometer klinik"}],"explanation":"Tiga punca utama suhu > normal dalam Rajah 3.4 ialah jangkitan, panas melampau dan senaman berat."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s9","voiceToneLabel":"Cabaran Unit 1","voiceCaption":"Selesaikan soalan aplikasi Praktis Sumatif tentang pemilihan termometer bagi bayi.","voiceScript":"[excited] Uji penguasaan Unit satu! Pilih termometer paling sesuai untuk bayi berumur dua bulan serta sebabnya.","prompt":"Bayi Puan Aminah baru berumur 2 bulan dan mengalami demam ringan. Termometer dan langkah manakah paling sesuai digunakan?","options":["Termometer rektal berlabel khas dengan jeli petroleum dimasukkan 1.5–2.5 cm ke dalam dubur","Termometer makmal berskala -10°C hingga 110°C diletakkan terus di dalam mulut bayi","Termometer inframerah dihalakan rapat tepat ke dalam anak mata bayi","Termometer klinik merkuri diletakkan di bawah ketiak tanpa dikibaskan dahulu"],"correctIndex":0,"explanation":"Bagi bayi kurang daripada 3 atau 4 bulan, termometer rektal digunakan bersama sapuan alkohol serta jeli petroleum dan dimasukkan 1.5–2.5 cm sehingga bunyi 'Bip'."}]},{"id":"sai3-u2","title":"Unit 2: Kadar Denyutan Nadi & Eksperimen 3.1","subtitle":"Subtopik 3.2 — Titik Nadi Arteri, Kesan Jantina, Umur, Aktiviti Fizikal & Kehamilan","iconType":"book","iconUrl":"../assets/icons/sai3-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Titik Nadi & Arteri 3D","voiceCaption":"Kadar denyutan nadi ialah bilangan degupan jantung per minit (bpm) yang paling mudah dikesan di pergelangan tangan.","voiceScript":"[warm] Mari lihat jantung tiga dimensi kita berdegup menghantar gelombang nadi sepanjang arteri! Mengapa doktor suka mengambil bacaan nadi di pergelangan tangan? Kerana di situ arteri berada sangat dekat dengan kulit, jelas, menonjol dan mudah dirasai!","title":"Kadar Denyutan Nadi (bpm) & Titik Nadi pada Badan","acronym":"B•P•M•A","hook":"Setiap degupan jantung menghantar gelombang tekanan ke arteri yang boleh dirasai di permukaan kulit dalam unit bpm!","mediaKey":"sai3_pulse_points_body","summary":"Titik nadi wujud di bahagian badan yang mana salur arteri berada hampir dengan permukaan kulit.","bullets":["Definisi & Sebab Pergelangan Tangan Dipilih: Kadar denyutan nadi ialah pengukuran bilangan degupan jantung per minit (bpm); doktor kerap memeriksa di pergelangan tangan kerana arteri terletak sangat dekat kulit, jelas, menonjol dan mudah.","Titik Nadi Lain (Rajah 3.5): Selain pergelangan tangan, denyutan nadi turut boleh dirasai di bahagian leher, pelipis, siku, belakang lutut dan buku lali."],"labId":"sai3_three_heart_pulse_lab","labTitle":"Simulasi Jantung & Gelombang Nadi 3D","labProps":{"tab":"points","profile":"wrist","bpm":74},"examTip":"Untuk soalan cara mengukur nadi: letakkan dua jari (jari telunjuk dan jari hantu — BUKAN ibu jari kerana ibu jari ada nadi sendiri!) pada pergelangan tangan selama 1 minit menggunakan jam randik."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Nadi Atlet & Bayi","voiceCaption":"Ramalkan perbezaan kadar denyutan nadi antara bayi, remaja 20 tahun dan seorang atlet terlatih.","voiceScript":"[curious] Agak-agak antara bayi berumur dua bulan dengan seorang atlet maraton berumur dua puluh dua tahun, siapakah yang mempunyai kadar nadi rehat lebih rendah?","hook":"Adakah jantung atlet berdegup lebih laju atau lebih perlahan semasa berehat?","scenario":"Fareeza (22 tahun) ialah seorang atlet terlatih peringkat kebangsaan, manakala adiknya baru berusia 2 bulan.","prompt":"Antara perbandingan kadar denyutan nadi rehat berikut, manakah yang tepat berdasarkan umur dan tahap kecergasan?","options":["Atlet terlatih (~45–60 bpm) jauh lebih rendah daripada dewasa biasa (~70 bpm) dan bayi (~130 bpm)","Atlet terlatih (~140 bpm) lebih tinggi daripada bayi kerana otot kakinya lebih besar","Bayi mempunyai kadar nadi paling rendah (~50 bpm) kerana saiz badannya kecil","Semua peringkat umur mengekalkan kadar nadi tetap 75 bpm sepanjang hayat"],"correctIndex":0,"proofLabId":"sai3_three_heart_pulse_lab","proofState":{"tab":"exp_gender_age","profile":"atlet","bpm":52},"explanation":"Semakin meningkat umur, semakin rendah kadar denyutan nadi (Bayi ~130 bpm -> 6 thn 100 -> 10 thn 80 -> 20 thn 70 bpm). Atlet terlatih mempunyai kadar nadi rehat lebih rendah (~45–60 bpm) kerana otot jantungnya lebih kuat dan cekap mengepam darah setiap degupan.","voiceIdKeyHint":"u2-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Eksperimen 3.1A & 3.1B","voiceCaption":"Perempuan mencatat kadar nadi lebih tinggi berbanding lelaki, dan kadar nadi menurun apabila umur meningkat.","voiceScript":"[warm] Dalam Eksperimen tiga perpuluhan satu A dan B, perempuan lazimnya mempunyai kadar nadi lebih tinggi daripada lelaki, manakala semakin meningkat umur, semakin rendah bacaan B P M! Wanita hamil, stres dan emosi cemas juga menaikkan kadar nadi!","title":"Eksperimen 3.1A (Jantina) & 3.1B (Umur) + Kecergasan & Kehamilan","acronym":"J•U•H•S","hook":"Kadar denyutan nadi wanita hamil LEBIH TINGGI daripada wanita tidak hamil kerana jantung mengepam lebih banyak darah untuk bayi!","mediaKey":"sai3_pulse_gender_age","summary":"Faktor fisiologi seperti jantina, umur, tahap kecergasan, emosi, stres dan kehamilan mempengaruhi kadar nadi.","bullets":["Eksperimen 3.1A (Jantina) & 3.1B (Umur): Murid perempuan lazimnya mencatat kadar nadi lebih tinggi berbanding murid lelaki; apabila umur meningkat dari bayi ke dewasa, kadar nadi semakin menurun.","Kecergasan, Emosi, Stres & Kehamilan: Atlet terlatih mempunyai nadi rehat lebih rendah, manakala stres, emosi takut/gembira serta wanita hamil mencatat kadar nadi lebih tinggi untuk membekalkan lebih banyak oksigen."],"labId":"sai3_three_heart_pulse_lab","labTitle":"Uji Profil Umur & Jantina 3D","labProps":{"tab":"exp_gender_age","profile":"bayi"},"examTip":"Data penting Praktis Sumatif 3 Jadual 1: 2 bulan (~130 bpm), 6 tahun (100 bpm), 10 tahun (80 bpm), 20 tahun (70 bpm), atlet terlatih (~45–60 bpm)."},{"type":"match","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Padan Profil & BPM","voiceCaption":"Padankan individu mengikut umur dan keadaan dengan kadar denyutan nadi yang paling munasabah.","voiceScript":"[confident] Jom padankan setiap profil pelajar, bayi, atlet dan wanita hamil dengan bacaan nadinya!","prompt":"Padankan profil individu dengan corak kadar denyutan nadi yang betul:","pairs":[{"id":"m1","left":"Bayi berumur 2 bulan","right":"Sangat tinggi (~120–140 bpm)"},{"id":"m2","left":"Murid 10 tahun vs Dewasa 20 tahun","right":"80 bpm menurun kepada 70 bpm"},{"id":"m3","left":"Atlet terlatih semasa berehat","right":"Lebih rendah (~45–60 bpm) kerana jantung lebih cekap"},{"id":"m4","left":"Ruzzana yang sedang hamil","right":"Lebih tinggi bagi mengepam darah & oksigen kepada janin"}],"explanation":"Umur lebih muda, kehamilan dan stres meningkatkan kadar nadi, manakala umur meningkat dan latihan kecergasan atletik merendahkan nadi rehat."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Eksperimen 3.1C: Aktiviti","voiceCaption":"Semakin lasak aktiviti fizikal (berehat -> berjalan -> berlari), semakin tinggi kadar denyutan nadi; wajib rehat 5 minit antara aktiviti.","voiceScript":"[warm] Lihat Eksperimen tiga perpuluhan satu C! Murid melakukan aktiviti berehat, berjalan dan berlari selama dua minit setiap satu. Penting dalam S P M: pastikan murid berehat lima minit sebelum memulakan aktiviti seterusnya supaya kadar nadi kembali kepada aras normal!","title":"Eksperimen 3.1C: Kesan Aktiviti Fizikal & Langkah Rehat 5 Minit","acronym":"R•J•L•5M","hook":"WAJIB berehat 5 minit sebelum memulakan aktiviti fizikal seterusnya agar bacaan awal kembali stabil!","mediaKey":"sai3_pulse_activity_lab","videoClip":{"youtubeId":"nopgNM3lPvA","title":"Degupan Jantung & Gelombang Nadi Arteri (3.2 Kadar Denyutan Nadi)","posterKey":"sai3_pulse_points_body","caption":"Video 3D HanaStudio: Degupan jantung menghantar gelombang nadi sepanjang arteri pergelangan tangan"},"summary":"Aktiviti yang semakin lasak memerlukan lebih banyak oksigen bagi respirasi sel otot, memaksa jantung mengepam lebih pantas.","bullets":["Hipotesis & Pemboleh Ubah 3.1C: Semakin lasak aktiviti fizikal, semakin tinggi kadar denyutan nadi. PM = Jenis aktiviti (berehat, berjalan, berlari); PB = Kadar nadi (1 minit); PD = Tempoh masa aktiviti (2 minit), umur dan jantina.","Radas & Langkah Kawalan: Gunakan jam randik untuk mengambil kiraan 1 minit sebaik aktiviti 2 minit tamat, dan wajibkan tempoh rehat 5 minit sebelum menukar aktiviti berikutnya."],"labId":"sai3_three_heart_pulse_lab","labTitle":"Simulator Jantung: Berehat vs Berlari 3D","labProps":{"tab":"exp_activity","profile":"lari"},"examTip":"Jika soalan Kertas 2 meminta inferens: Kadar nadi bertambah tinggi selepas berlari kerana otot memerlukan lebih banyak oksigen dan glukosa bagi respirasi sel untuk membebaskan tenaga."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Bina Hipotesis 3.1C","voiceCaption":"Susun perkataan menjadi kesimpulan tepat Eksperimen 3.1C.","voiceScript":"[curious] Susun perkataan ini untuk membentuk pernyataan hipotesis Eksperimen tiga perpuluhan satu C dengan tepat!","prompt":"Lengkapkan kesimpulan hubungan jenis aktiviti fizikal dengan kadar denyutan nadi:","answerTokens":["Semakin lasak aktiviti fizikal,","semakin tinggi","kadar denyutan nadi manusia"],"distractors":["semakin rendah","tekanan suhu termometer"],"explanation":"Hipotesis Eksperimen 3.1C yang diterima ialah: Semakin lasak aktiviti fizikal yang dilakukan, semakin tinggi kadar denyutan nadi."},{"type":"sort","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Isih Pemboleh Ubah 3.1","voiceCaption":"Kelaskan pemboleh ubah Eksperimen 3.1C (Aktiviti Fizikal) kepada PM, PB dan PD.","voiceScript":"[confident] Tentukan yang mana pemboleh ubah dimanipulasikan, bergerak balas, dan dimalarkan dalam Eksperimen tiga perpuluhan satu C!","prompt":"Kelaskan pemboleh ubah Eksperimen 3.1C (Kesan Aktiviti Fizikal Terhadap Nadi):","buckets":[{"id":"pm","label":"Dimanipulasikan (PM)"},{"id":"pb","label":"Bergerak Balas (PB)"},{"id":"pd","label":"Dimalarkan (PD)"}],"items":[{"text":"Jenis aktiviti fizikal (rehat, jalan, lari)","bucketId":"pm","note":"Diubah sengaja oleh pengkaji"},{"text":"Kadar denyutan nadi (bpm)","bucketId":"pb","note":"Diukur selepas setiap aktiviti"},{"text":"Tempoh masa pengambilan bacaan (1 minit)","bucketId":"pd","note":"Ditetapkan sama bagi semua ujian"},{"text":"Umur dan jantina murid yang sama","bucketId":"pd","note":"Mengekalkan ujian yang adil"}],"explanation":"Dalam Eksperimen 3.1C: PM ialah jenis aktiviti fizikal, PB ialah kadar denyutan nadi, dan PD ialah tempoh masa (1 minit), umur serta jantina."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Cabaran Unit 2","voiceCaption":"Selesaikan soalan Praktis Formatif 3.2 mengenai kes Azril selepas berlari di taman.","voiceScript":"[excited] Uji kemahiran Unit dua! Bandingkan bacaan nadi Azril sebelum dan selepas dia berlari di taman.","prompt":"Azril mengambil kadar nadinya pada waktu pagi (70 bpm), kemudian mengambil bacaan semula sebaik tamat berlari di taman (136 bpm). Mengapakah bacaan kedua lebih tinggi?","options":["Jantung mengepam darah lebih cepat untuk membekalkan lebih banyak oksigen kepada sel otot yang aktif","Salur arteri di pergelangan tangannya membeku seketika selepas terdedah angin taman","Jantina dan umur Azril berubah serta-merta semasa aktiviti berlari","Kadar respirasi sel Azril berhenti ketika berlari menyebabkan nadi memantul"],"correctIndex":0,"explanation":"Semasa berlari (aktiviti lasak), otot memerlukan lebih banyak oksigen dan tenaga; jantung mengepam lebih cepat bagi menghantar darah beroksigen ke otot, menaikkan kadar denyutan nadi."}]},{"id":"sai3-u3","title":"Unit 3: Tekanan Darah, Sfigmomanometer & CPG 2018","subtitle":"Subtopik 3.3 — Unit mmHg, Sistolik/Diastolik, Jadual CPG, Hipertensi & Pencegahan","iconType":"scale","iconUrl":"../assets/icons/sai3-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Sfigmomanometer & mmHg","voiceCaption":"Tekanan darah diukur menggunakan sfigmomanometer (+ stetoskop di klinik) dalam unit milimeter merkuri (mmHg).","voiceScript":"[warm] Selamat datang ke Unit tiga! Tekanan darah ialah tekanan yang dikenakan oleh darah pada dinding salur darah semasa peredaran darah. Alat piawaian terbaik di hospital ialah sfigmomanometer bersama stetoskop, manakala di rumah kita guna sfigmomanometer digital dengan unit milimeter merkuri, m m H g!","title":"Alat Mengukur Tekanan Darah & Unit Piawai mmHg","acronym":"S•S•mmHg","hook":"Alat terbaik di hospital menggabungkan sfigmomanometer + stetoskop, manakala pemantauan rumah guna sfigmomanometer digital!","mediaKey":"sai3_sphygmomanometer_types","summary":"Sfigmomanometer mengukur daya tekanan darah terhadap dinding arteri dalam unit piawai milimeter merkuri.","bullets":["Definisi & Unit mmHg: Tekanan darah ialah tekanan yang dikenakan oleh darah ke atas dinding salur darah semasa peredaran darah; unit piawainya ialah milimeter merkuri (mmHg).","Piawaian Alat Pengukur: Pengamal perubatan klinik/hospital menggunakan sfigmomanometer bersama stetoskop (piawaian paling tepat), manakala individu di rumah boleh memantau dengan sfigmomanometer digital."],"labId":"sai3_three_bp_artery_lab","labTitle":"Simulasi 3D Salur Darah & Sfigmomanometer","labProps":{"tab":"instrument","sys":118,"dia":76},"examTip":"Pastikan ejaan tepat dalam peperiksaan: 'sfigmomanometer' (bukan termometer atau stetoskop sahaja!) dan unitnya 'mmHg'."},{"type":"predict","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Ramal Sistolik vs Diastolik","voiceCaption":"Bezakan tekanan apabila otot jantung mengecut dengan keadaan otot jantung berehat.","voiceScript":"[curious] Perhatikan bacaan satu ratus dua puluh per lapan puluh! Nombor manakah yang terhasil ketika otot jantung sedang mengecut dengan kuat?","hook":"Dua nombor dalam satu bacaan: nombor atas mengepam, nombor bawah berehat!","scenario":"Keputusan pemeriksaan kesihatan Cikgu Hakim mencatatkan bacaan tekanan darah 124/82 mmHg.","prompt":"Berdasarkan bacaan 124/82 mmHg, apakah yang diwakili oleh nombor 124 dan nombor 82?","options":["124 ialah tekanan sistolik (otot jantung mengecut); 82 ialah tekanan diastolik (otot jantung berehat)","124 ialah tekanan diastolik (jantung berehat); 82 ialah kadar denyutan nadi","124 ialah suhu badan; 82 ialah tekanan sistolik di dalam paru-paru","Kedua-dua nombor ialah purata berat darah di dalam vena dan kapilari"],"correctIndex":0,"proofLabId":"sai3_three_bp_artery_lab","proofState":{"tab":"sys_dia","sys":124,"dia":82},"explanation":"Tekanan darah direkod sebagai sistolik/diastolik. Nombor atas (sistolik = 124 mmHg) berlaku apabila otot jantung mengecut; nombor bawah (diastolik = 82 mmHg) berlaku semasa otot jantung berehat.","voiceIdKeyHint":"u3-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Sistolik Atas • Diastolik Bawah","voiceCaption":"Sistolik mengukur tekanan ketika otot jantung mengecut; diastolik mengukur tekanan ketika otot jantung berehat.","voiceScript":"[warm] Lihat animasi sel darah merah tiga dimensi ini! Apabila jantung mengecut, salur arteri mengembang menahan tekanan atas iaitu sistolik. Antara degupan pula, otot jantung berehat menghasilkan tekanan bawah iaitu diastolik. Sebutannya: sistolik per diastolik!","title":"Mengukur & Merekod Tekanan Darah: Sistolik / Diastolik","acronym":"S-KECUT • D-REHAT","hook":"Cara ingatan pantas: Si-tolik (S) = otot jantung Mengecut (nombor tinggi/atas); Di-astolik (D) = otot jantung berehat!","mediaKey":"sai3_systolic_diastolic_cycle","videoClip":{"youtubeId":"EvEBCW66kQA","title":"Sfigmomanometer & Tekanan Darah Sistolik/Diastolik (3.3 Tekanan Darah)","posterKey":"sai3_systolic_diastolic_cycle","caption":"Video 3D HanaStudio: Tekanan kaf sfigmomanometer & aliran sel darah merah di dalam arteri"},"summary":"Setiap denyutan kitaran jantung menghasilkan dua nilai tekanan yang direkodkan secara sistolik/diastolik.","bullets":["Tekanan Sistolik (Nombor Atas): Tekanan yang dikenakan oleh darah pada dinding salur darah semasa otot jantung mengecut untuk mengepam darah keluar.","Tekanan Diastolik (Nombor Bawah): Tekanan pada dinding salur darah apabila otot jantung berehat antara denyutan jantung; direkod dan disebut sebagai sistolik per diastolik."],"labId":"sai3_three_bp_artery_lab","labTitle":"Uji Fasa Sistolik & Diastolik 3D","labProps":{"tab":"sys_dia","sys":118,"dia":76},"examTip":"Praktis Sumatif 3 No. 6(c) kerap menyoal perbezaan tekanan sistolik dengan tekanan diastolik — tekankan frasa 'otot jantung mengecut' vs 'otot jantung berehat (antara denyutan)'!"},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan Jadual CPG 2018","voiceCaption":"Padankan bacaan tekanan darah dengan klasifikasi CPG Hypertension 2018.","voiceScript":"[confident] Jom padankan julat tekanan sistolik dan diastolik daripada Jadual tiga perpuluhan satu dengan kategori rasminya!","prompt":"Padankan bacaan tekanan darah dewasa berikut mengikut Jadual 3.1 (CPG 2018):","pairs":[{"id":"c1","left":"< 120 / < 80 mmHg","right":"Optimum"},{"id":"c2","left":"120–129 / 80–84 mmHg","right":"Normal"},{"id":"c3","left":"130–139 / 85–89 mmHg","right":"Berisiko"},{"id":"c4","left":"140–159 / 90–99 mmHg","right":"Tekanan darah tinggi peringkat 1"}],"explanation":"Jadual 3.1 CPG (5th Ed., 2018): Optimum (<120/<80), Normal (120–129/80–84), Berisiko (130–139/85–89), Peringkat 1 (140–159/90–99), Peringkat 2 (160–179/100–109), Peringkat 3 (>=180/>=110)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s5","voiceToneLabel":"Jadual 3.1 CPG (6 Kategori)","voiceCaption":"Klasifikasi CPG 2018 membahagikan tekanan darah kepada enam kategori dari Optimum sehingga Peringkat 3.","voiceScript":"[warm] Cuba gerakkan gelangsar sfigmomanometer tiga dimensi ini! Setiap kenaikan dua puluh untuk sistolik dan sepuluh untuk diastolik selepas normal menaikkan peringkat risiko daripada Berisiko, Peringkat satu, Peringkat dua, hingga kecemasan Peringkat tiga pada seratus lapan puluh per seratus sepuluh ke atas!","title":"Jadual 3.1: Klasifikasi Tekanan Darah Orang Dewasa (CPG 2018)","acronym":"120•140•160•180","hook":"Peringkat 2 ialah 160–179 / 100–109 mmHg, manakala Peringkat 3 kritikal pada >= 180 / >= 110 mmHg!","summary":"Garis Panduan Amalan Klinikal (CPG, Edisi ke-5, 2018) mengelaskan enam tahap bacaan dewasa.","bullets":["Zon Selamat & Amaran Awal: Optimum (< 120 / < 80), Normal (120–129 / 80–84) dan Berisiko (130–139 / 85–89 mmHg).","Zon Hipertensi Peringkat 1 hingga 3: Peringkat 1 (140–159 / 90–99), Peringkat 2 (160–179 / 100–109), dan Peringkat 3 (>= 180 / >= 110 mmHg) yang memerlukan rawatan segera."],"labId":"sai3_three_bp_artery_lab","labTitle":"Kalkulator & Pengelasan 3D CPG 2018","labProps":{"tab":"cpg_table","sys":150,"dia":95},"examTip":"Gunakan pola tangga +20/+10 mmHg: Peringkat 1 bermula 140/90, Peringkat 2 bermula 160/100, dan Peringkat 3 bermula 180/110!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Isih Sistolik vs Diastolik vs CPG","voiceCaption":"Kelaskan istilah sistolik, diastolik dan peringkat hipertensi CPG 2018.","voiceScript":"[confident] Isihkan setiap bacaan dan definisi tekanan darah ke dalam kategori yang tepat!","prompt":"Kelaskan setiap butiran mengikut kategori yang tepat:","buckets":[{"id":"sys","label":"Tekanan Sistolik"},{"id":"dia","label":"Tekanan Diastolik"},{"id":"ht","label":"Hipertensi (Peringkat 1–3)"}],"items":[{"text":"Nombor atas ketika otot jantung mengecut","bucketId":"sys","note":"Tekanan puncak semasa pengepaman"},{"text":"Nombor bawah ketika jantung berehat antara degupan","bucketId":"dia","note":"Tekanan rehat dalam salur darah"},{"text":"Bacaan berlarutan 150/95 mmHg (Peringkat 1)","bucketId":"ht","note":"Melebihi ambang 140/90 mmHg"},{"text":"Bacaan 182/112 mmHg (Peringkat 3)","bucketId":"ht","note":"Hipertensi teruk (>= 180 / >= 110)"},{"text":"Nilai 120 dalam bacaan 120/80 mmHg","bucketId":"sys","note":"Angka pertama sentiasa sistolik"},{"text":"Nilai 80 dalam bacaan 120/80 mmHg","bucketId":"dia","note":"Angka kedua sentiasa diastolik"}],"explanation":"Angka atas sentiasa tekanan sistolik (jantung mengecut), angka bawah ialah diastolik (jantung berehat), manakala >= 140/90 mmHg dikelas sebagai hipertensi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s7","voiceToneLabel":"Hipertensi, Strok & Pencegahan","voiceCaption":"Tekanan darah tinggi (hipertensi) selalunya tiada gejala jelas dan berisiko menyebabkan strok; cegah melalui diet, senaman dan pemeriksaan berkala.","voiceScript":"[warm] Mengapa tekanan darah tinggi digelar pembunuh senyap? Kerana lazimnya tiada tanda awal yang jelas, namun jika dibiarkan boleh menyebabkan strok serta serangan jantung! Cegah awal dengan mengurangkan garam dan lemak, bersenam tetap, mengawal stres dan membuat pemeriksaan berkala!","title":"Hipertensi, Tekanan Darah Rendah, Risiko Strok & 4 Pencegahan","acronym":"H•S•P•4","hook":"Hipertensi lazimnya TIDAK menunjukkan gejala awal — hanya pemeriksaan berkala dengan sfigmomanometer dapat mengesannya!","mediaKey":"sai3_bp_prevention_guide","summary":"Pengesanan awal mengelakkan komplikasi strok, kerosakan jantung atau pitam akibat tekanan darah rendah berlarutan.","bullets":["Hipertensi vs Hipotensi: Bacaan tinggi berlarutan ialah hipertensi (boleh menyebabkan strok & serangan jantung tanpa tanda jelas), manakala bacaan rendah berlarutan menandakan tekanan darah rendah.","4 Langkah Pencegahan Awal: Kurangkan garam dan makanan tinggi lemak/kolesterol, amalkan senaman sederhana berkala, urus stres serta jalani pemeriksaan tekanan darah secara berkala."],"examTip":"Praktis Formatif 3.3 No. 5 meminta 4 langkah pencegahan awal: tulis jawapan praktikal seperti bersenam, kurangkan garam/lemak, kawal stres, dan pemeriksaan berkala."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s8","voiceToneLabel":"Bina Definisi Tekanan Darah","voiceCaption":"Susun definisi tekanan darah dan alat pengukurannya dengan tepat.","voiceScript":"[curious] Susun blok perkataan berikut untuk membentuk pernyataan saintifik tentang tekanan darah dan alat pengukurannya!","prompt":"Lengkapkan penerangan mengenai tekanan darah dan alat pengukurannya:","answerTokens":["Tekanan darah ialah tekanan","pada dinding salur darah","yang disukat guna sfigmomanometer","dalam unit mmHg"],"distractors":["pada tulang rusuk","dalam unit bpm"],"explanation":"Tekanan darah ialah tekanan yang dikenakan oleh darah pada dinding salur darah dan disukat menggunakan sfigmomanometer dalam unit milimeter merkuri (mmHg)."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s9","voiceToneLabel":"Cabaran Kes Siva","voiceCaption":"Analisis Kes Siva daripada Praktis Sumatif 3 (150/95 mmHg selama tiga hari berturut-turut).","voiceScript":"[excited] Uji kemahiran klinikal kamu pada Kes Siva dalam Praktis Sumatif tiga! Bacaannya seratus lima puluh per sembilan puluh lima selama tiga hari berturut-turut!","stimulusHtml":"<div class='stimulus-note'><strong>Kes Praktis Sumatif 3:</strong> Siva memeriksa tekanan darahnya selama 3 hari berturut-turut dan mendapati bacaannya sekitar <strong>150/95 mmHg</strong> setiap hari.</div>","prompt":"Apakah inferens tepat tentang keadaan Siva dan tindakan paling wajar yang perlu dilakukannya?","options":["Siva menghidap tekanan darah tinggi (hipertensi peringkat 1) dan perlu berjumpa doktor segera untuk pemeriksaan serta rawatan lanjut","Tekanan darah Siva berada pada tahap Optimum mengikut Jadual 3.1 dan boleh terus bersukan lasak","Siva mengalami tekanan darah rendah dan hanya perlu menambah garam dalam masakannya","Bacaan Siva tidak sah kerana melebihi julat maksimum sfigmomanometer 140 mmHg"],"correctIndex":0,"explanation":"Bacaan normal ialah sekitar 120/80 mmHg (Normal 120–129 / 80–84). Bacaan 150/95 mmHg berlarutan berada dalam julat Hipertensi Peringkat 1 (140–159 / 90–99), maka Siva menghidap tekanan darah tinggi dan wajib berjumpa doktor."}]},{"id":"sai3-u4","title":"Unit 4: Mengira & Menentukan Indeks Jisim Badan (BMI)","subtitle":"Subtopik 3.4A — Rumus BMI (kg ÷ m²), Penukaran Unit cm ke m & Carta Jadual 3.2","iconType":"formula","iconUrl":"../assets/icons/sai3-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Rumus BMI & Penukaran m","voiceCaption":"BMI mengira jisim badan (kg) dibahagi kuasa dua ketinggian (m²); sentiasa tukar sentimeter kepada meter dahulu!","voiceScript":"[warm] Selamat datang ke Unit empat! Indeks Jisim Badan atau B M I ialah ukuran jisim badan berbanding ketinggian. Rumusnya: B M I sama dengan jisim badan dalam kilogram bahagi ketinggian dalam meter kuasa dua! Awas perangkap S P M: sentiasa tukar sentimeter kepada meter dahulu sebelum mengkuasadua!","title":"Definisi & Rumus Indeks Jisim Badan (BMI)","acronym":"KG•÷•M²","hook":"Perangkap utama peperiksaan: tinggi selalu diberi dalam cm (cth. 160 cm) — WAJIB tukar ke 1.60 m sebelum kuasa dua!","formula":"BMI (kg m⁻²) = Jisim badan (kg) ÷ [Ketinggian (m)]²","mediaKey":"sai3_bmi_formula_visual","summary":"BMI menilai keseimbangan antara berat badan dengan ketinggian seseorang secara saintifik.","bullets":["Rumus Rasmi & Unit: Indeks Jisim Badan (BMI) ialah nisbah jisim badan dalam kilogram (kg) dibahagikan dengan kuasa dua ketinggian dalam meter (m²), menghasilkan unit kg m⁻².","Sebab Penukaran Unit Wajib: Jika ketinggian diukur sebagai 160 cm, tukarkan dahulu kepada 1.60 m supaya nilai h² = 1.60 × 1.60 = 2.56 m² adalah tepat."],"labId":"sai3_three_bmi_studio_lab","labTitle":"Studio Timbang & Kalkulator BMI 3D","labProps":{"tab":"calc"},"examTip":"Sentiasa tulis jalan kerja dua langkah dalam kertas bertulis SPM: (1) h = tinggi(cm) / 100 m, kemudian (2) BMI = m / h² supaya tiada markah cuai hilang!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Kiraan BMI","voiceCaption":"Kira BMI murid berjisim 54 kg dengan ketinggian 150 cm dan tentukan kategorinya.","voiceScript":"[curious] Cuba kira cepat! Seorang murid mempunyai jisim lima puluh empat kilogram dan ketinggian seratus lima puluh sentimeter. Berapakah bacaan B M I beliau?","hook":"150 cm = 1.50 m -> kuasa duakan dahulu menjadi 2.25 m²!","scenario":"Data pemeriksaan kelas: Jisim Daniel = 54 kg, Ketinggian = 150 cm.","prompt":"Berapakah Indeks Jisim Badan (BMI) Daniel dan kategorinya?","options":["24.0 kg m⁻² (Jisim badan unggul)","18.0 kg m⁻² (Kurang jisim badan)","27.5 kg m⁻² (Berlebihan jisim badan)","0.36 kg m⁻² (Ralat tidak tukar unit)"],"correctIndex":0,"proofLabId":"sai3_three_bmi_studio_lab","proofState":{"tab":"calc"},"explanation":"150 cm = 1.50 m. (1.50)² = 2.25 m². Maka BMI = 54 ÷ 2.25 = 24.0 kg m⁻². Dalam Jadual 3.2, julat 18.5 – 24.9 ialah Jisim badan unggul.","voiceIdKeyHint":"u4-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Carta 4 Kategori BMI","voiceCaption":"Jadual 3.2 membahagikan BMI kepada empat kategori utama: Kurang jisim, Unggul, Berlebihan, dan Obes.","voiceScript":"[warm] Lihat arka pelangi empat warna pada Studio B M I tiga dimensi! Kurang daripada lapan belas perpuluhan lima ialah kurang jisim badan. Lapan belas perpuluhan lima hingga dua puluh empat perpuluhan sembilan ialah unggul. Dua puluh lima hingga dua puluh sembilan perpuluhan sembilan berlebihan, dan tiga puluh ke atas ialah obes!","title":"Jadual 3.2: Carta Indeks Jisim Badan (4 Kategori KSSM)","acronym":"18.5•25•30","hook":"Tiga titik sempadan keramat yang wajib dihafal untuk SPM: 18.5, 25.0, dan 30.0!","summary":"Jadual 3.2 membolehkan kita menafsirkan status kesihatan berat badan sebaik nilai BMI dikira.","bullets":["Kategori Bawah & Unggul: BMI < 18.5 kg m⁻² dikelas sebagai Kurang jisim badan, manakala 18.5 – 24.9 kg m⁻² ialah Jisim badan unggul.","Kategori Berlebihan & Obes: BMI 25.0 – 29.9 kg m⁻² ialah Berlebihan jisim badan, manakala 30.0 kg m⁻² atau lebih dikelaskan sebagai Obes."],"labId":"sai3_three_bmi_studio_lab","labTitle":"Carta & Jarum Pengukur BMI 3D","labProps":{"tab":"chart"},"examTip":"Perhatikan sempadan tepat: 24.9 masih Unggul, tetapi tepat 25.0 masuk Berlebihan; 29.9 masih Berlebihan, tetapi tepat 30.0 masuk Obes!"},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Julat BMI","voiceCaption":"Padankan setiap julat nilai BMI dalam Jadual 3.2 dengan kategorinya.","voiceScript":"[confident] Jom padankan keempat-empat julat B M I mengikut Jadual tiga perpuluhan dua!","prompt":"Padankan julat BMI (kg m⁻²) dengan kategori Jadual 3.2 yang tepat:","pairs":[{"id":"b1","left":"Kurang daripada 18.5","right":"Kurang jisim badan"},{"id":"b2","left":"18.5 – 24.9","right":"Jisim badan unggul"},{"id":"b3","left":"25.0 – 29.9","right":"Berlebihan jisim badan"},{"id":"b4","left":"30.0 atau lebih","right":"Obes"}],"explanation":"Keempat-empat julat dalam Jadual 3.2 tidak bertindih kerana menggunakan sempadan .9 dan .0."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Kepentingan Mengira BMI","voiceCaption":"Mengira BMI mengenal pasti lebihan atau kekurangan jisim badan supaya tindakan pemakanan dan senaman boleh dirancang lebih awal.","voiceScript":"[warm] Mengapakah penting untuk kita mengira B M I secara berkala? Kerana bacaan ini bertindak sebagai amaran awal jika badan kekurangan zat atau berlebihan lemak supaya kita boleh mengubah pemakanan dan rutin senaman sebelum penyakit serius menyerang!","title":"Kepentingan Mengira BMI & Pemantauan Berkala","acronym":"K•T•S","hook":"Berat badan yang kelihatan 'biasa' belum tentu unggul jika ketinggian tidak sepadan — rumus BMI membongkarnya!","mediaKey":"sai3_bmi_formula_visual","summary":"BMI merupakan saringan pantas, mudah dan tanpa kos untuk mengesan ketidakseimbangan komposisi tubuh.","bullets":["Mengesan Masalah Jisim Awal: Membantu mengenal pasti sama ada seseorang mengalami jisim badan unggul, berlebihan, obes atau kekurangan jisim badan.","Panduan Tindakan Kesihatan: Membolehkan individu membuat keputusan wajar mengubah pelan pemakanan, kalori serta kekerapan aktiviti fizikal (Praktis Formatif 3.4)."],"examTip":"Untuk soalan KBAT 'Nyatakan kepentingan mengira BMI': kaitkan dengan mengenal pasti masalah jisim badan (obes/kurang berat) agar langkah pengawalan kesihatan dapat diambil."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Langkah Kira BMI","voiceCaption":"Susun urutan betul langkah menentukan Indeks Jisim Badan (Aktiviti 3.3).","voiceScript":"[curious] Susun empat langkah menyiasat dan mengira B M I daripada pengukuran hingga penentuan kategori!","prompt":"Susun turutan betul menentukan status BMI seseorang murid:","answerTokens":["Ukur jisim (kg) dan tinggi (cm)","Tukar ketinggian cm ke meter","Kira jisim bahagi tinggi²","Rujuk Jadual Carta BMI"],"distractors":["Bahagi tinggi dengan jisim","Guna sfigmomanometer dahulu"],"explanation":"Aktiviti 3.3: ukur jisim (kg) dan ketinggian (cm -> m), gunakan rumus BMI = jisim / tinggi², dan tentukan kategori dalam Jadual 3.2."},{"type":"sort","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Isih Nilai BMI","voiceCaption":"Isihkan nilai BMI sampel pelajar mengikut kategori Jadual 3.2.","voiceScript":"[confident] Kelaskan nilai-nilai B M I berikut ke dalam kategori masing-masing tanpa terkeliru pada nombor sempadan!","prompt":"Kelaskan nilai BMI (kg m⁻²) berikut mengikut kategori Jadual 3.2:","buckets":[{"id":"kurang","label":"Kurang (< 18.5)"},{"id":"unggul","label":"Unggul (18.5–24.9)"},{"id":"tinggi","label":"Berlebihan / Obes (>= 25.0)"}],"items":[{"text":"BMI = 17.4 kg m⁻²","bucketId":"kurang","note":"Bawah sempadan 18.5"},{"text":"BMI = 18.5 kg m⁻²","bucketId":"unggul","note":"Tepat 18.5 masuk Unggul"},{"text":"BMI = 24.9 kg m⁻²","bucketId":"unggul","note":"Had atas Unggul"},{"text":"BMI = 25.0 kg m⁻²","bucketId":"tinggi","note":"Berlebihan jisim badan"},{"text":"BMI = 30.0 kg m⁻²","bucketId":"tinggi","note":"Tepat 30.0 masuk Obes"},{"text":"BMI = 33.8 kg m⁻²","bucketId":"tinggi","note":"Obes"}],"explanation":"Sentiasa semak titik sempadan: < 18.5 (Kurang), 18.5–24.9 (Unggul), 25.0–29.9 (Berlebihan), dan 30.0 ke atas (Obes)."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Cabaran Unit 4","voiceCaption":"Uji soalan Praktis Formatif 3.4 mengenai nilai sempadan BMI 30.0 kg m⁻².","voiceScript":"[excited] Uji ketelitian kamu! Jika seseorang mendapat bacaan B M I tepat tiga puluh perpuluhan sifar, dalam kategori manakah dia dikelaskan?","prompt":"Sekiranya seseorang mencatat BMI tepat 30.0 kg m⁻², dalam kategori manakah beliau dikelaskan mengikut Jadual 3.2?","options":["Obes","Berlebihan jisim badan","Jisim badan unggul","Kurang jisim badan"],"correctIndex":0,"explanation":"Jadual 3.2 menetapkan kategori Berlebihan jisim badan tamat pada 29.9, manakala '30.0 atau lebih' dikelaskan sebagai Obes (Praktis Formatif 3.4 No. 3)."}]},{"id":"sai3-u5","title":"Unit 5: Interpretasi BMI, Pinggan Sihat & Kawalan Berat","subtitle":"Subtopik 3.4B — 5 Penyakit Obesiti, 5 Risiko Kurang Berat, 4 Cara Tambah & 7 Cara Turun Berat","iconType":"crown","iconUrl":"../assets/icons/sai3-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"5 Penyakit Akibat Obesiti","voiceCaption":"Jisim badan berlebihan meningkatkan risiko serangan jantung, tekanan darah tinggi, strok, diabetes melitus dan komplikasi sendi/tulang.","voiceScript":"[warm] Jangan pandang ringan bacaan B M I melebihi dua puluh lima! Obesiti dan jisim badan berlebihan mengundang lima penyakit serius iaitu serangan jantung, tekanan darah tinggi, strok, diabetes melitus atau kencing manis serta komplikasi sendi dan tulang!","title":"5 Penyakit Serius Akibat Jisim Badan Berlebihan & Obesiti","acronym":"J•D•S•K•T","hook":"Cabar Minda No. 8 meminta tepat LIMA penyakit serius akibat jisim berlebihan — hafal akronim J•D•S•K•T!","mediaKey":"sai3_health_checkup_hero","summary":"Lebihan lemak badan membebankan sistem peredaran darah, metabolisme glukosa dan rangka sokongan tubuh.","bullets":["3 Risiko Kardiovaskular & Metabolik: Serangan jantung, tekanan darah tinggi (hipertensi), strok dan diabetes melitus (kencing manis).","Risiko Sokongan Tubuh: Berat badan berlebihan memberi tekanan mekanikal berterusan yang mencetuskan komplikasi sendi dan tulang."],"examTip":"Jika soalan meminta 'kencing manis', tulis istilah sains rasminya: diabetes melitus (atau kedua-duanya sekali)."},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Mitos Kurang Berat Badan","voiceCaption":"Adakah individu yang terlalu kurus (BMI < 18.5) bebas daripada masalah kesihatan?","voiceScript":"[curious] Ramai pelajar menyangka orang yang sangat kurus sentiasa sihat! Pada pendapat kamu, adakah individu kurang berat badan terlepas daripada masalah kesihatan?","hook":"Terlalu kurus BUKAN jaminan sihat — kekurangan nutrien turut mengancam jantung dan sistem imun!","scenario":"Seorang murid mempunyai BMI 16.5 kg m⁻² berasa bangga kerana menyangka hanya orang obes sahaja berisiko mendapat penyakit jantung.","prompt":"Adakah benar orang kurang jisim badan bebas daripada penyakit? Wajarkan berdasarkan buku teks.","options":["Tidak! Kurang jisim badan juga berisiko penyakit jantung, imuniti rendah, keletihan, anemia dan kemurungan","Ya! Selagi BMI di bawah 18.5, semua organ badan mendapat zat dan tenaga berlebihan","Tidak, tetapi kesannya hanya terhad kepada kenaikan tinggi badan secara mendadak","Ya, kerana kekurangan berat menghalang sebarang jangkitan virus atau bakteria"],"correctIndex":0,"explanation":"Praktis Formatif 3.4 No. 5: Tidak! Kurang jisim badan meningkatkan risiko penyakit jantung, penurunan daya tahan badan melawan penyakit, keletihan, anemia serta kemurungan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Risiko Kurus & Tambah Berat","voiceCaption":"Kurang jisim badan berisiko keletihan, anemia, kemurungan, imuniti rendah & sakit jantung; tambah berat dengan 4 cara sihat.","voiceScript":"[warm] Lihat Pinggan Sihat Malaysia tiga dimensi ini! Bagi mengatasi lima risiko kurang berat seperti anemia, keletihan dan imuniti lemah, amalkan empat cara menambah berat secara sihat: ikut Pinggan Sihat Malaysia, makan pada waktu tetap, ambil snek padat nutrien, dan makan makanan berkhasiat lebih daripada biasa!","title":"5 Risiko Kurang Berat Badan & 4 Cara Menambah Jisim Badan","acronym":"I•K•A•M + S•W•N","hook":"Tambah berat badan BUKAN dengan makanan segera berlemak tinggi, tetapi melalui snek padat nutrien dan jadual makan tetap!","mediaKey":"sai3_pinggan_sihat_malaysia","summary":"Pengurusan berat badan kekurangan jisim mesti meningkatkan jisim otot dan nutrien dengan cara yang seimbang.","bullets":["5 Risiko Kurang Jisim Badan: Penyakit jantung, penurunan daya tahan badan melawan penyakit, keletihan, anemia (kurang sel darah merah/zat besi), serta kemurungan.","4 Cara Menambah Jisim Badan: (1) Ikut Piramid Makanan & Pinggan Sihat Malaysia, (2) Makan ikut waktu tetap, (3) Ambil snek padat nutrien bagi menambah kalori, (4) Makan makanan berkhasiat lebih daripada biasa."],"labId":"sai3_three_bmi_studio_lab","labTitle":"Pinggan Sihat Malaysia 3D (#SukuSukuSeparuh)","labProps":{"tab":"plate"},"examTip":"Bezakan konsep 'snek padat nutrien' (kacang badam, susu, buah kering) berbanding makanan ringan berkalori kosong dalam jawapan Kertas 2!"},{"type":"sort","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Isih Risiko Berat Badan","voiceCaption":"Kelaskan penyakit dan simptom antara risiko obesiti dengan risiko kurang jisim badan.","voiceScript":"[confident] Kelaskan masalah kesihatan ini sama ada berpunca daripada obesiti atau kekurangan jisim badan!","prompt":"Kelaskan risiko kesihatan berikut mengikut puncanya:","buckets":[{"id":"obes","label":"Risiko Obesiti (> 25.0)"},{"id":"kurang","label":"Risiko Kurang Berat (< 18.5)"}],"items":[{"text":"Diabetes melitus (kencing manis)","bucketId":"obes","note":"Berkaitan rintangan insulin & lebihan lemak"},{"text":"Tekanan darah tinggi & strok","bucketId":"obes","note":"Salur darah terbeban oleh kolesterol & lemak"},{"text":"Komplikasi sendi dan tulang","bucketId":"obes","note":"Menampung jisim badan berlebihan"},{"text":"Anemia & keletihan berpanjangan","bucketId":"kurang","note":"Kekurangan zat besi & tenaga"},{"text":"Penurunan daya tahan melawan penyakit","bucketId":"kurang","note":"Kekurangan protein/vitamin melemahkan imun"},{"text":"Kemurungan","bucketId":"kurang","note":"Antara 5 kesan kurang berat disebut buku teks"}],"explanation":"Kedua-dua ekstrem (terlalu berat mahupun terlalu kurang berat) mengundang penyakit serius; sasaran terbaik ialah mengekalkan jisim badan unggul (18.5–24.9)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s5","voiceToneLabel":"7 Cara Turun Berat & Pinggan 3D","voiceCaption":"Turunkan berat badan secara realistik (~0.5 kg seminggu) dengan Pinggan Sihat Malaysia, kurangkan gula/lemak serta senaman 30 minit × 3 hari seminggu.","voiceScript":"[warm] Bagaimana pula cara menurunkan berat badan tanpa membahayakan organ? Buku teks menggariskan tujuh langkah: tetapkan sasaran realistik seperti setengah kilogram seminggu, pantau setiap minggu, amal Pinggan Sihat Malaysia suku-suku-separuh, ubah cara penyediaan, kurangkan gula dan lemak, bersenam tiga puluh minit tiga hari seminggu, dan dapatkan sokongan keluarga!","title":"Pinggan Sihat Malaysia (#SukuSukuSeparuh) & 7 Cara Turun Berat","acronym":"0.5KG•30M•3H","hook":"Jangan berlapar melampau! Sasaran selamat buku teks ialah 0.5 kg seminggu + senaman 30 minit, 3 hari seminggu!","mediaKey":"sai3_bp_prevention_guide","summary":"Tujuh langkah pengurangan jisim badan mengutamakan perubahan gaya hidup kekal dan selamat.","bullets":["Pinggan Sihat Malaysia & Pantau: Isi 1/4 pinggan dengan karbohidrat, 1/4 dengan protein dan 1/2 dengan sayur/buah; ubah cara memasak (kukus/panggang berbanding goreng), kurangkan gula/lemak, pantau berat seminggu sekali dan dapatkan sokongan orang rapat.","Sasaran Realistik & Senaman: Tetapkan penurunan realistik 0.5 kg seminggu serta lakukan senaman sederhana (berjalan laju, berbasikal, berenang) sekurang-kurangnya 30 minit, 3 hari seminggu."],"labId":"sai3_three_bmi_studio_lab","labTitle":"Teroka Sektor Pinggan Sihat 3D","labProps":{"tab":"plate"},"examTip":"Hafal 3 angka penting cara menurunkan jisim badan: 0.5 kg seminggu, rekod seminggu sekali, senaman >= 30 minit dan 3 hari seminggu!"},{"type":"match","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Padan Amalan Berat Badan","voiceCaption":"Padankan angka dan panduan pemakanan sihat dengan tujuannya.","voiceScript":"[confident] Jom padankan panduan Pinggan Sihat Malaysia dan pelan pengurusan berat badan dengan tepat!","prompt":"Padankan panduan pengurusan jisim badan dengan penerangannya:","pairs":[{"id":"p1","left":"Sasaran turun 0.5 kg / minggu","right":"Sasaran realistik & selamat menurunkan jisim badan"},{"id":"p2","left":"Senaman 30 minit, 3 hari seminggu","right":"Berjalan laju, berbasikal atau berenang secara sederhana"},{"id":"p3","left":"Konsep #SukuSukuSeparuh","right":"1/4 karbohidrat, 1/4 protein dan 1/2 sayur serta buah"},{"id":"p4","left":"Snek padat nutrien & waktu tetap","right":"Cara menambah jisim badan secara berkhasiat"}],"explanation":"Gabungan Pinggan Sihat Malaysia, perubahan teknik memasak serta senaman konsisten memelihara jisim badan unggul."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s7","voiceToneLabel":"Susun Pelan Turun Berat","voiceCaption":"Susun strategi penurunan berat badan yang tepat mengikut buku teks.","voiceScript":"[curious] Susun perkataan berikut menjadi pelan penurunan berat badan yang selamat dan realistik!","prompt":"Lengkapkan pelan menurunkan jisim badan yang betul mengikut KSSM:","answerTokens":["Tetapkan sasaran 0.5 kg seminggu,","amal Pinggan Sihat Malaysia,","kurangkan gula dan lemak,","bersenam 30 minit 3 hari seminggu"],"distractors":["skip makan sepanjang hari","makan makanan goreng bergula"],"explanation":"Penurunan berat yang sihat menggabungkan sasaran 0.5 kg/minggu, pemakanan seimbang Pinggan Sihat, pengurangan gula/lemak, serta senaman 30 minit sebanyak 3 hari seminggu."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s8","voiceToneLabel":"Cabaran Sarapan Marissa","voiceCaption":"Selesaikan soalan Cabar Minda No. 9 tentang pilihan sarapan Marissa di kantin sekolah.","voiceScript":"[excited] Uji kemahiran membuat keputusan diet! Marissa sedang berusaha menurunkan berat badan — sarapan manakah paling sesuai dibeli di kantin sekolah?","stimulusHtml":"<div class='stimulus-note'><strong>Cabar Minda No. 9 (Kantin Sekolah):</strong> Menu sarapan pagi yang dijual ialah <em>Sandwic telur</em>, <em>Bihun goreng &amp; telur goreng</em>, serta <em>Nasi lemak &amp; ayam goreng berempah</em>.</div>","prompt":"Marissa sedang berusaha menurunkan berat badan. Menu manakah paling sesuai diambil oleh Marissa dan apakah wajarannya?","options":["Sandwic telur — menyediakan karbohidrat & protein berkhasiat dengan kandungan lemak dan minyak gorengan paling rendah","Nasi lemak dan ayam goreng berempah — membekalkan santan serta minyak goreng untuk mempercepat pembakaran lemak","Bihun goreng dan telur goreng — digoreng dengan minyak tambahan agar tidak perlu minum air kosong","Tidak bersarapan langsung sehingga waktu makan malam untuk menurunkan 5 kg dalam sehari"],"correctIndex":0,"explanation":"Sandwic telur mengandungi kalori terkawal serta lemak jauh lebih rendah berbanding nasi lemak ayam goreng atau bihun goreng berlemak — selari prinsip mengurangkan lemak tinggi dan mengubah cara penyediaan makanan."}]},{"id":"sai3-u6","title":"Unit 6: Cabaran Boss — Klinik Saringan Kesihatan SPM","subtitle":"Sintesis Kertas 1 & Kertas 2 — Gabungan Suhu, Nadi, Tekanan Darah & BMI","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss Kes 1: Klinik Azni","voiceCaption":"Selesaikan soalan Cabar Minda No. 7 tentang penggunaan termometer rektal oleh pesakit dewasa berusia 27 tahun.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama daripada Cabar Minda: Azni berumur dua puluh tujuh tahun dan mendapati suhunya tidak menentu. Bolehkah dia menggunakan termometer rektal?","prompt":"Azni berumur 27 tahun mendapati suhu badannya tidak konsisten. Bolehkah Azni menggunakan termometer rektal (dubur) untuk menyukat suhu badannya?","options":["Tidak sesuai, kerana termometer rektal khusus untuk bayi berumur kurang daripada 3 bulan; Azni patut guna termometer klinik atau inframerah","Ya, termometer rektal wajib digunakan oleh semua individu berumur antara 20 hingga 40 tahun","Ya, selagi termometer makmal (-10°C hingga 110°C) dimasukkan sedalam 5 cm","Tidak sesuai kerana termometer rektal hanya boleh menyukat suhu air mendidih"],"correctIndex":0,"explanation":"Cabar Minda No. 7: Termometer rektal direka khusus untuk bayi kurang daripada 3 bulan. Individu dewasa berumur 27 tahun perlu menggunakan termometer klinik (mulut/ketiak) atau termometer inframerah (dahi ~5 cm)."},{"type":"predict","xp":30,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss Kes 2: Bukti Pulse 3D","voiceCaption":"Ramalkan gabungan dapatan nadi atlet terlatih berbanding murid biasa selepas berlari pecut.","voiceScript":"[curious] Gunakan pengetahuan Eksperimen tiga perpuluhan satu! Antara atlet terlatih ketika berehat dengan murid selepas larian dua minit, bagaimanakah kadar denyutan nadi mereka berubah?","hook":"Perhatikan gelombang nadi sian 3D apabila profil bertukar daripada Atlet ke Berlari!","prompt":"Murid A mengambil nadinya selepas berlari pecut 2 minit lalu terus berlari pusingan kedua tanpa rehat 5 minit. Apakah kesannya terhadap kesahan eksperimen?","options":["Bacaan menjadi tidak adil dan tidak tepat kerana kadar nadi belum kembali ke aras rehat normal sebelum aktiviti seterusnya","Bacaan menjadi lebih rendah secara mendadak kerana arteri tertidur seketika","Kadar nadi langsung tidak dipengaruhi oleh tempoh rehat antara aktiviti fizikal","Bacaan suhu badan akan bertukar secara langsung menjadi bacaan tekanan diastolik"],"correctIndex":0,"proofLabId":"sai3_three_heart_pulse_lab","proofState":{"tab":"exp_activity","profile":"lari","bpm":146},"explanation":"Nota penting Eksperimen 3.1C mengarahkan murid berehat selama 5 minit sebelum aktiviti seterusnya supaya kadar denyutan nadi kembali ke tahap rehat normal dan hasil ujian kekal adil."},{"type":"match","xp":30,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss: 4 Parameter & Alat","voiceCaption":"Padankan kesemua empat parameter kesihatan Bab 3 dengan alat serta angka piawai utamanya.","voiceScript":"[confident] Padankan keempat-empat parameter kesihatan Bab tiga dengan alat serta bacaan normalnya dengan tepat!","prompt":"Padankan parameter kesihatan Bab 3 dengan alat dan nilai piawai tepatnya:","pairs":[{"id":"x1","left":"Suhu badan (normal 36.9°C)","right":"Termometer klinik ada pencerutan / inframerah (~5 cm)"},{"id":"x2","left":"Kadar denyutan nadi (bpm)","right":"Jam randik di arteri pergelangan tangan (1 minit)"},{"id":"x3","left":"Tekanan darah (Optimum < 120/< 80)","right":"Sfigmomanometer + stetoskop dalam unit mmHg"},{"id":"x4","left":"BMI (Unggul 18.5–24.9 kg m⁻²)","right":"Penimbang jisim (kg) & alat ukur tinggi (meter)"}],"explanation":"Penguasaan penuh empat parameter kesihatan melengkapkan keseluruhan Bab 3 Sains Tingkatan 4."},{"type":"sort","xp":30,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss: Isih Subtopik 3.1–3.4","voiceCaption":"Isihkan fakta peperiksaan SPM penting mengikut pasangan subtopik yang tepat.","voiceScript":"[confident] Pecutan akhir Boss! Kelaskan enam fakta peperiksaan wajib ini ke bahagian Subtopik tiga perpuluhan satu hingga dua atau tiga perpuluhan tiga hingga empat!","prompt":"Isihkan fakta SPM penting ini mengikut subtopiknya:","buckets":[{"id":"s12","label":"Subtopik 3.1–3.2 (Suhu & Nadi)"},{"id":"s34","label":"Subtopik 3.3–3.4 (Darah & BMI)"}],"items":[{"text":"Pencerutan halang merkuri turun cepat","bucketId":"s12","note":"Ciri termometer klinik (3.1)"},{"text":"Sapu jeli petroleum & masuk 1.5–2.5 cm","bucketId":"s12","note":"Termometer rektal bayi (3.1)"},{"text":"Semakin tua umur semakin rendah bpm","bucketId":"s12","note":"Eksperimen 3.1B (3.2)"},{"text":"Sistolik = jantung mengecut; Diastolik = berehat","bucketId":"s34","note":"Merekod tekanan darah (3.3)"},{"text":"160–179 / 100–109 mmHg ialah Peringkat 2","bucketId":"s34","note":"Jadual CPG 2018 (3.3)"},{"text":"Rumus kg ÷ m² & nilai 30.0 = Obes","bucketId":"s34","note":"Carta Jadual 3.2 BMI (3.4)"}],"explanation":"Semua enam fakta ini merupakan soalan kerap diuji merentasi Subtopik 3.1 hingga 3.4!"},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss: Misi Gaya Hidup Sihat","voiceCaption":"Susun kesimpulan amalan pemeriksaan kesihatan berkala.","voiceScript":"[warm] Susun rumusan terakhir Bab tiga tentang kepentingan saringan berkala dan amalan hidup sihat!","prompt":"Lengkapkan rumusan Kempen Gaya Hidup Sihat Bab 3:","answerTokens":["Pemeriksaan berkala mengukur suhu,","kadar nadi, tekanan darah","dan BMI untuk mengesan","masalah kesihatan lebih awal"],"distractors":["hanya ketika sakit teruk","mengguna termometer makmal sentiasa"],"explanation":"Seseorang tidak sewajarnya menunggu sakit baru berjumpa doktor — pemantauan berkala keempat-empat parameter mengesan risiko awal agar rawatan pantas dapat diambil."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Saringan Lengkap","voiceCaption":"Soalan akhir Boss menguji gabungan pengiraan BMI tepat dan interpretasi tekanan darah.","voiceScript":"[excited] Soalan terakhir Boss! Kira B M I Encik Faris dan tentukan kategori tekanan darahnya serentak!","stimulusHtml":"<div class='stimulus-note'><strong>Rekod Klinik Encik Faris:</strong> Jisim = <strong>81 kg</strong>, Tinggi = <strong>180 cm</strong>, Tekanan Darah = <strong>134/86 mmHg</strong>, Suhu = <strong>36.9°C</strong>.</div>","prompt":"Apakah diagnosis tepat bagi parameter Encik Faris berdasarkan Jadual 3.1 (CPG 2018) dan Jadual 3.2 (BMI)?","options":["BMI = 25.0 kg m⁻² (Berlebihan jisim badan), tekanan darah Berisiko (130–139 / 85–89 mmHg) dan suhu badan normal","BMI = 25.0 kg m⁻² (Jisim badan unggul), tekanan darah Optimum dan mengalami demam panas","BMI = 45.0 kg m⁻² (Obes), tekanan darah Peringkat 2 dan suhu badan sejuk melampau","BMI = 0.0025 kg m⁻² (Kurang jisim badan) dan tekanan darah rendah"],"correctIndex":0,"explanation":"180 cm = 1.80 m -> (1.80)² = 3.24 m². BMI = 81 ÷ 3.24 = 25.0 kg m⁻² (tepat pada permulaan julat Berlebihan jisim badan: 25.0–29.9). Tekanan 134/86 mmHg tergolong kategori Berisiko (130–139 / 85–89), manakala 36.9°C ialah suhu badan normal! Tahniah, Bab 3 dikuasai 100%!"}]}]};</script>

  /* Pembantu Teras Three.js: Orbit Drag, Jeda/Main, contentvisibilityautostatechange + IntersectionObserver + Sandaran 2D */
  function createManagedThreeStage(hostEl, opts) {
    var shell = document.createElement("div");
    shell.className = "three-stage-shell";
    shell.setAttribute("aria-label", opts.ariaLabel || "Simulasi 3D Interaktif");

    var wrap = document.createElement("div");
    wrap.className = "three-canvas-wrap";

    var hud = document.createElement("div");
    hud.className = "three-hud-bar";

    var hintPill = document.createElement("span");
    hintPill.className = "three-hint-pill";

    var pauseBtn = document.createElement("button");
    pauseBtn.type = "button";
    pauseBtn.className = "lab-pause-btn";

    hud.appendChild(hintPill);
    hud.appendChild(pauseBtn);
    shell.appendChild(wrap);
    shell.appendChild(hud);
    hostEl.appendChild(shell);

    var reduced = prefersReduced();
    var userPaused = reduced;
    var isRenderSkipped = false;
    var isOffscreen = false;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;
    var rafId = 0;
    var rotY = typeof opts.initRotY === "number" ? opts.initRotY : 0.25;
    var rotX = typeof opts.initRotX === "number" ? opts.initRotX : 0.14;
    var dragging = false;
    var lastPx = 0;
    var lastPy = 0;
    var simTime = 0;
    var prevTs = 0;

    var THREE = typeof window !== "undefined" ? window.THREE : null;
    var renderer = null;
    var scene = null;
    var camera = null;
    var pivotGroup = null;
    var apiRef = null;
    var fallbackCanvas = null;
    var fallbackCtx = null;
    var usingWebGL = false;

    if (THREE && THREE.WebGLRenderer) {
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping || THREE.NoToneMapping;
        renderer.toneMappingExposure = 1.12;
        scene = new THREE.Scene();
        var initW = Math.max(280, wrap.clientWidth || 520);
        var initH = Math.max(200, wrap.clientHeight || 290);
        renderer.setSize(initW, initH, false);
        wrap.appendChild(renderer.domElement);

        camera = new THREE.PerspectiveCamera(42, initW / initH, 0.1, 100);
        camera.position.set(0, opts.camY || 0.8, opts.camZ || 6.4);
        camera.lookAt(0, opts.lookY || 0, 0);

        var amb = new THREE.AmbientLight(0xdbeafe, 0.95);
        scene.add(amb);
        var keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
        keyLight.position.set(4.5, 6.5, 5.5);
        scene.add(keyLight);
        var rimLight = new THREE.DirectionalLight(0x38bdf8, 0.68);
        rimLight.position.set(-5, 2, -4);
        scene.add(rimLight);
        var fillLight = new THREE.PointLight(0x10b981, 0.45, 24);
        fillLight.position.set(0, -3.5, 4);
        scene.add(fillLight);

        pivotGroup = new THREE.Group();
        scene.add(pivotGroup);
        apiRef = opts.buildScene ? opts.buildScene(THREE, pivotGroup, camera, scene) : {};
        usingWebGL = true;
      } catch (e) {
        if (renderer) {
          try { renderer.dispose(); } catch (err) {}
          renderer = null;
        }
        usingWebGL = false;
      }
    }

    if (!usingWebGL) {
      fallbackCanvas = document.createElement("canvas");
      fallbackCanvas.width = 640;
      fallbackCanvas.height = 360;
      wrap.appendChild(fallbackCanvas);
      fallbackCtx = fallbackCanvas.getContext("2d");
    }

    hintPill.textContent = usingWebGL
      ? (opts.hintText || "Seret 360 darjah • Animasi 3D WebGL")
      : (opts.fallbackHint || "Mod Interaktif 2D • Seret Untuk Sudut");

    function updatePauseBtn() {
      pauseBtn.setAttribute("aria-pressed", userPaused ? "true" : "false");
      pauseBtn.textContent = userPaused ? "Main 3D" : "Jeda 3D";
    }
    updatePauseBtn();

    function renderFrameNow(dt) {
      if (usingWebGL && renderer && scene && camera) {
        if (pivotGroup) {
          pivotGroup.rotation.y = rotY;
          pivotGroup.rotation.x = rotX;
        }
        if (opts.onAnimate) opts.onAnimate(simTime, dt || 0.016, apiRef, THREE);
        renderer.render(scene, camera);
      } else if (fallbackCtx && opts.onFallbackDraw2D) {
        var w = fallbackCanvas.width;
        var h = fallbackCanvas.height;
        fallbackCtx.clearRect(0, 0, w, h);
        opts.onFallbackDraw2D(fallbackCtx, w, h, simTime, rotY, rotX);
      }
    }

    function canAnimate() {
      return !userPaused && !isRenderSkipped && !isOffscreen && !isDocHidden;
    }

    function stepLoop(ts) {
      rafId = 0;
      if (!canAnimate()) return;
      var dt = prevTs ? Math.min(0.05, Math.max(0.004, (ts - prevTs) / 1000)) : 0.016;
      prevTs = ts;
      simTime += dt;
      if (!dragging && opts.autoSpinSpeed) {
        rotY += dt * opts.autoSpinSpeed;
      }
      renderFrameNow(dt);
      rafId = window.requestAnimationFrame(stepLoop);
    }

    function syncAnimState() {
      if (canAnimate()) {
        if (!rafId) {
          prevTs = 0;
          rafId = window.requestAnimationFrame(stepLoop);
        }
      } else if (rafId) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    pauseBtn.addEventListener("click", function () {
      userPaused = !userPaused;
      updatePauseBtn();
      playTap();
      syncAnimState();
      if (userPaused) renderFrameNow(0);
    });

    function onPointerDown(ev) {
      dragging = true;
      lastPx = ev.clientX;
      lastPy = ev.clientY;
      if (opts.onInteract) opts.onInteract();
    }
    function onPointerMove(ev) {
      if (!dragging) return;
      var dx = ev.clientX - lastPx;
      var dy = ev.clientY - lastPy;
      lastPx = ev.clientX;
      lastPy = ev.clientY;
      rotY += dx * 0.011;
      rotX = Math.max(-0.75, Math.min(0.75, rotX + dy * 0.008));
      renderFrameNow(0);
    }
    function onPointerUp() { dragging = false; }

    wrap.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);

    function handleResize() {
      var w = wrap.clientWidth;
      var h = wrap.clientHeight;
      if (!w || !h) return;
      if (usingWebGL && renderer && camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        renderFrameNow(0);
      } else if (fallbackCanvas) {
        fallbackCanvas.width = w;
        fallbackCanvas.height = h;
        renderFrameNow(0);
      }
    }

    var ro = null;
    if (typeof ResizeObserver === "function") {
      ro = new ResizeObserver(handleResize);
      ro.observe(wrap);
    }
    window.addEventListener("resize", handleResize);

    /* Pematuhan efficient-background-processing */
    function onContentVisChange(ev) {
      isRenderSkipped = Boolean(ev && ev.skipped);
      syncAnimState();
    }
    shell.addEventListener("contentvisibilityautostatechange", onContentVisChange);

    var io = null;
    var supportsContentVis = typeof CSS !== "undefined" && typeof document !== "undefined" && "contentVisibility" in document.documentElement.style;
    if (!supportsContentVis && typeof IntersectionObserver === "function") {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          isOffscreen = !entry.isIntersecting;
          syncAnimState();
        });
      }, { rootMargin: "200px" });
      io.observe(shell);
    }

    function onDocVisChange() {
      isDocHidden = Boolean(document.hidden);
      syncAnimState();
    }
    document.addEventListener("visibilitychange", onDocVisChange);

    renderFrameNow(0);
    syncAnimState();

    return {
      api: apiRef,
      renderNow: function () { renderFrameNow(0); },
      setRotation: function (y, x) {
        rotY = y;
        if (typeof x === "number") rotX = x;
        renderFrameNow(0);
      },
      cleanup: function () {
        if (rafId) window.cancelAnimationFrame(rafId);
        rafId = 0;
        wrap.removeEventListener("pointerdown", onPointerDown);
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", onPointerUp);
        window.removeEventListener("resize", handleResize);
        shell.removeEventListener("contentvisibilityautostatechange", onContentVisChange);
        document.removeEventListener("visibilitychange", onDocVisChange);
        if (ro) { try { ro.disconnect(); } catch (e) {} }
        if (io) { try { io.disconnect(); } catch (e) {} }
        if (scene) disposeObjectTree(scene);
        if (renderer) {
          try { renderer.dispose(); } catch (e) {}
        }
      }
    };
  }

      "</div>" +

      hintText: "Seret 360° • Zoom & Uji Pencerutan 3D",
      buildScene: function (THREE, root) {

        var capGold = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35, metalness: 0.6 });
        var capBlue = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.35 });
        var mercMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b, emissiveIntensity: 0.38, roughness: 0.25 });

        function buildTubeTherm(xPos, hasConstriction, scaleH, capMat) {
          var g = new THREE.Group();
          g.position.set(xPos, 0, 0);
          var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 18), mercMat);
          bulb.position.y = -1.35;
          g.add(bulb);
          var outerTube = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, scaleH, 24), glassMat);
          outerTube.position.y = -1.2 + scaleH / 2;
          g.add(outerTube);
          var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.24, 20), capMat);
          cap.position.y = -1.2 + scaleH;
          g.add(cap);
          if (hasConstriction) {
            var ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.035, 12, 28), capGold);

            ring.position.y = -0.92;
            g.add(ring);
          }
          var colGeo = new THREE.CylinderGeometry(0.055, 0.055, 1, 16);
          colGeo.translate(0, 0.5, 0);
          var mercCol = new THREE.Mesh(colGeo, mercMat);
          mercCol.position.y = -1.2;
          g.add(mercCol);
          return { group: g, mercCol: mercCol };
        }

        var klin = buildTubeTherm(-2.2, true, 2.5, new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 }));

      },
      onAnimate: function (t, dt, api) {

  window.ETUTOR_NOTA_LABS.sai3_three_heart_pulse_lab = function (shell, ctx) {

      kanak: { label: "Kanak-kanak (6 tahun)", bpm: 100, note: "Jadual Praktis Sumatif 3: Kanak-kanak berumur 6 tahun mencatatkan purata ~100 bpm." },

      atlet: { label: "Atlet Terlatih (22 tahun)", bpm: 52, note: "Atlet terlatih mempunyai otot jantung yang lebih kuat dan cekap mengepam darah — kadar nadi rehat rendah (~45–55 bpm)!" },

      rehat: { label: "Berehat (2 minit)", bpm: 68, note: "Eksperimen 3.1C: Kadar denyutan nadi terendah ketika berehat. Wajib rehat 5 minit sebelum menukar aktiviti!" },
      jalan: { label: "Berjalan (2 minit)", bpm: 98, note: "Eksperimen 3.1C: Kadar nadi meningkat sederhana untuk membekalkan oksigen tambahan ke otot." },
      lari: { label: "Berlari (2 minit)", bpm: 146, note: "Eksperimen 3.1C: Semakin lasak aktiviti fizikal, semakin tinggi kadar denyutan nadi untuk menampung kadar respirasi sel yang tinggi." }
    };

    shell.innerHTML =
      '<div class="wf-jucas-pills">' +
        '<button type="button" class="wf-jpill jp-rose" data-h-tab="points" aria-pressed="' + (tab === "points") + '">Titik Nadi &amp; Jantung 3D</button>' +
        '<button type="button" class="wf-jpill jp-violet" data-h-tab="exp_gender_age" aria-pressed="' + (tab === "exp_gender_age") + '">Eksperimen 3.1A/B (Jantina &amp; Umur)</button>' +
        '<button type="button" class="wf-jpill jp-mint" data-h-tab="exp_activity" aria-pressed="' + (tab === "exp_activity") + '">Eksperimen 3.1C (Aktiviti Fizikal)</button>' +
      "</div>" +
      '<div id="h3StageMount"></div>' +
