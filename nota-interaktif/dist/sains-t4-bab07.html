  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sains-t4-bab07","subject":"Sains","form":4,"chapterNumber":7,"title":"Koordinasi Badan","subtitle":"Subtopik 7.1–7.3 KSSM (46 Langkah Bit-by-Bit) — Sistem Endokrin & 6 Kelenjar Utama, Ketidakseimbangan Hormon, 4 Kategori Dadah, Kesan Alkohol & Minda yang Sihat.","estimatedMinutes":32,"themeAccent":"#0284c7","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/sai7-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep koordinasi badan kamu memang mantap!","combo":"[laughs warmly] Kombo yang cemerlang! Fakta hormon dan saraf kamu sangat tajam!","encourage":"[softly] Hampir tepat... mari semak semula rajah interaktif dan panduan di bawah.","celebrate":"[excited] Tahniah! Kamu telah menakluki kesemua empat puluh enam langkah Bab tujuh!"},"units":[{"id":"sai7-u1","title":"Unit 1: Sistem Endokrin & 6 Kelenjar Utama","subtitle":"Subtopik 7.1a — Kelenjar Tanpa Duktus, Hormon, Organ Sasaran & Rencana HRT","iconType":"atom","iconUrl":"../assets/icons/sai7-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Sistem Endokrin & Hormon","voiceCaption":"Kelenjar endokrin tanpa duktus merembeskan hormon terus ke dalam aliran darah menuju ke sel organ sasaran.","voiceScript":"[warm] Selamat datang ke Bab tujuh, Koordinasi Badan! Selain sistem saraf, tubuh kita diselaraskan secara kimia oleh sistem endokrin. Kelenjar tanpa duktus ini merembeskan hormon terus ke dalam aliran darah dalam kuantiti sedikit untuk merangsang organ sasaran yang mempunyai reseptor khusus.","title":"Cara Tindakan Sistem Endokrin, Hormon & Organ Sasaran","acronym":"D•H•R•S","hook":"Walaupun tiada salur khas, molekul hormon menggunakan lebuh raya darah untuk mencari satu atau lebih organ sasaran!","mediaKey":"sai7_endocrine_system","summary":"Sistem endokrin menyelaraskan aktiviti fisiologi tubuh melalui pengutusan bahan kimia organik berpanjangan yang dibawa oleh peredaran darah.","bullets":["Kelenjar Tanpa Duktus & Sifat Hormon: Kelenjar endokrin merembeskan hormon (bahan kimia organik sejenis protein) secara terus ke dalam aliran darah dalam kuantiti kecil; gerak balasnya lebih perlahan berbanding impuls saraf tetapi kesannya kekal lama.","Reseptor Organ Sasaran: Satu hormon hanya dapat dikenali dan bertindak balas dengan tisu atau organ sasaran yang memiliki reseptor sepadan; satu jenis hormon boleh bertindak ke atas lebih daripada satu organ sasaran."],"labId":"sai7_endokrin_body_map","labTitle":"Peta Interaktif 6 Kelenjar Endokrin Manusia","labProps":{"gland":"pituitari"},"examTip":"Dalam soalan struktur Kertas 2, nyatakan kata kunci 'kelenjar tanpa duktus' dan 'dirembes terus ke dalam aliran darah' apabila mentakrifkan kelenjar endokrin.","videoClip":{"src":"../assets/sains-t4-bab07/video/sai7_video_endocrine_hormone.mp4","posterKey":"sai7_endocrine_system","caption":"Animasi 3D: Molekul hormon bergerak melalui salur darah menuju ke sel sasaran"}},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Reaksi Kecemasan","voiceCaption":"Apakah perubahan fisiologi yang tercetus apabila seseorang terserempak dengan ular secara tiba-tiba?","voiceScript":"[curious] Cuba ramalkan tindak balas kecemasan badan kita! Bayangkan kamu sedang bermain di padang lalu tiba-tiba terserempak dengan seekor ular. Kelenjar adrenal segera merembeskan hormon adrenalina. Apakah kesan langsungnya terhadap otot dan salur darah kamu?","hook":"Situasi cemas memicu mod 'lawan atau lari' dalam beberapa saat sahaja!","scenario":"Ketika berjalan di tepi semak, Danial terserempak dengan seekor ular berbisa lalu terus berlari menyelamatkan diri.","prompt":"Antara berikut, kombinasi tindak balas manakah yang berlaku akibat rembesan hormon adrenalina semasa Danial menyelamatkan diri?","options":["Denyutan jantung, kadar pernafasan, tekanan darah, aras glukosa darah dan kadar metabolisme meningkat bagi membekalkan lebih banyak oksigen serta tenaga ke otot","Denyutan jantung serta tekanan darah menurun sementara semua glukosa darah ditukar menjadi glikogen di hati","Kadar pernafasan terhenti seketika dan saiz anak mata mengecil untuk mengurangkan kemasukan cahaya","Otot rangka mengendur sepenuhnya kerana hormon bertindak melalui duktus air liur"],"correctIndex":0,"proofLabId":"sai7_endokrin_body_map","proofState":{"gland":"adrenal"},"explanation":"Semasa kecemasan, kelenjar adrenal merembeskan adrenalina yang meningkatkan denyutan jantung, kadar pernafasan, tekanan darah, kadar metabolisme, membesarkan saiz anak mata serta menukar lebih banyak glikogen simpanan kepada glukosa agar otot menerima oksigen dan tenaga tinggi."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Pituitari, Tiroid & Adrenal","voiceCaption":"Kelenjar pituitari bertindak sebagai kelenjar induk manakala tiroid dan adrenal mengawal metabolisme serta tindak balas kecemasan.","voiceScript":"[warm] Mari kenali tiga kelenjar endokrin di bahagian kepala hingga ginjal! Pertama ialah kelenjar pituitari di bawah serebrum yang digelar kelenjar induk kerana mengawal kelenjar lain melalui hormon pertumbuhan G H dan hormon antidiuresis A D H. Di leher pula ada kelenjar tiroid, dan di atas ginjal terletak kelenjar adrenal!","title":"Kelenjar Induk Pituitari, Kelenjar Tiroid & Kelenjar Adrenal","acronym":"P•T•A","hook":"Kelenjar pituitari mengawal kelenjar lain seperti konduktor orkestra hormon manusia!","mediaKey":"sai7_thyroid_goiter","summary":"Setiap kelenjar mempunyai kedudukan anatomi khusus dan merembeskan hormon pengawal atur air, tumbesaran, metabolisme serta kecemasan.","bullets":["Kelenjar Pituitari (Bawah Serebrum): Digelar kelenjar induk kerana menghasilkan hormon yang mengawal kelenjar endokrin lain; merembeskan Hormon Antidiuresis (ADH) untuk mengawal penyerapan semula air oleh ginjal dan Hormon Pertumbuhan (GH) bagi tumbesaran kanak-kanak serta mengekalkan jisim otot, tulang dan komposisi badan dewasa.","Kelenjar Tiroid (Hadapan Trakea) & Adrenal (Atas Ginjal): Tiroid merembeskan tiroksina untuk mengawal kadar metabolisme serta perkembangan fizikal dan mental kanak-kanak; adrenal pula merembeskan adrenalina bagi persediaan kecemasan (meningkatkan nadi, metabolisme, glukosa darah dan membesarkan anak mata)."],"labId":"sai7_endokrin_body_map","labTitle":"Teroka Kedudukan Pituitari, Tiroid & Adrenal","labProps":{"gland":"tiroid"},"examTip":"Bezakan fungsi dua hormon pituitari dalam Jadual 7.1: ADH -> kawal kuantiti air diserap semula oleh ginjal; GH -> rangsang tumbesaran serta kekalkan jisim otot dan tulang orang dewasa."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Kelenjar & Hormon","voiceCaption":"Padankan lima kelenjar endokrin utama dengan hormon yang dirembeskan dan kedudukannya.","voiceScript":"[confident] Jom uji kecekapan ingatan kamu mengenai Jadual tujuh perpuluhan satu! Padankan setiap kelenjar endokrin dengan kedudukan serta hormon utamanya.","prompt":"Padankan kelenjar endokrin berikut dengan kedudukan dan hormon yang dirembeskan:","pairs":[{"id":"e1","left":"Kelenjar pituitari (bawah serebrum)","right":"Hormon antidiuresis (ADH) & Hormon pertumbuhan (GH)"},{"id":"e2","left":"Kelenjar tiroid (hadapan trakea)","right":"Tiroksina pengawal kadar metabolisme badan"},{"id":"e3","left":"Kelenjar adrenal (atas ginjal)","right":"Adrenalina untuk tindakan kecemasan dan membesarkan anak mata"},{"id":"e4","left":"Pankreas (belakang perut)","right":"Insulin penukar glukosa berlebihan kepada glikogen di hati"},{"id":"e5","left":"Ovari & Testis (pelvis)","right":"Estrogen, progesteron dan testosteron (aktif selepas akil baligh)"}],"explanation":"Keenam-enam kelenjar endokrin utama mempunyai kedudukan anatomi tersendiri dan merembeskan hormon khusus terus ke dalam aliran darah."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"Pankreas, Ovari, Testis & HRT","voiceCaption":"Pankreas mengawal aras glukosa darah menerusi insulin dan glukagon, manakala ovari dan testis mula aktif selepas akil baligh.","voiceScript":"[warm] Sekarang lihat pula kelenjar di bahagian abdomen dan pelvis! Pankreas di belakang perut merembeskan insulin untuk menukar glukosa berlebihan kepada glikogen di hati, dibantu glukagon apabila aras glukosa terlalu rendah. Sementara itu, ovari wanita menghasilkan estrogen dan progesteron, manakala testis lelaki merembeskan testosteron!","title":"Pankreas, Ovari, Testis & Rawatan Menopaus (HRT)","acronym":"I•E•P•T","hook":"Ovari dan testis wujud sejak lahir, tetapi hanya mula aktif merembeskan hormon seks selepas akil baligh!","mediaKey":"sai7_insulin_glucose","summary":"Kawalan glukosa oleh pankreas dan kematangan pembiakan oleh gonad melengkapkan enam kelenjar endokrin utama tubuh manusia.","bullets":["Pankreas (Insulin & Glukagon): Terletak di belakang perut; insulin menukarkan glukosa berlebihan dalam darah kepada glikogen untuk disimpan di dalam hati, manakala glukagon bertindak sebaliknya meningkatkan semula aras glukosa apabila aras gula darah terlalu rendah.","Ovari, Testis & Menopaus (HRT): Ovari (ruang pelvis) merembeskan estrogen (ciri seks sekunder wanita, penghasilan ovum, sediakan uterus) dan progesteron (kekalkan ketebalan dinding uterus); testis merembeskan testosteron (suara garau, misai, penghasilan sperma). Semasa menopaus (umur 45–55 tahun), kemerosotan estrogen boleh dirawat melalui Terapi Penggantian Hormon (EPT jika masih ada rahim, atau ET jika rahim dibuang)."],"labId":"sai7_endokrin_body_map","labTitle":"Pemeriksa Pankreas, Ovari & Testis","labProps":{"gland":"pankreas"},"examTip":"Praktis Sumatif 7 Soalan 2: Ovari dan testis sudah wujud sejak lahir tetapi TIDAK aktif; kedua-duanya hanya mula aktif selepas mencapai akil baligh!"},{"type":"sort","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Isih Fungsi 6 Hormon","voiceCaption":"Kelaskan enam hormon utama mengikut kumpulan kelenjar pengeluarnya dengan pantas.","voiceScript":"[confident] Kelaskan kesemua enam jenis hormon ini mengikut kelenjar pengeluar yang tepat: kumpulan Pituitari dan Tiroid, Adrenal dan Pankreas, ataupun Ovari dan Testis.","prompt":"Kelaskan hormon berikut mengikut kelenjar endokrin yang merembeskannya:","buckets":[{"id":"atas","label":"Pituitari & Tiroid"},{"id":"tengah","label":"Adrenal & Pankreas"},{"id":"gonad","label":"Ovari & Testis"}],"items":[{"text":"Hormon antidiuresis (ADH) pengawal serapan air ginjal","bucketId":"atas","note":"ADH dirembeskan oleh kelenjar pituitari di bawah serebrum."},{"text":"Tiroksina pengawal kadar metabolisme badan","bucketId":"atas","note":"Tiroksina dihasilkan oleh kelenjar tiroid di hadapan trakea."},{"text":"Adrenalina yang membesarkan saiz anak mata ketika cemas","bucketId":"tengah","note":"Adrenalina dirembeskan oleh kelenjar adrenal di atas ginjal."},{"text":"Insulin penukar glukosa berlebihan kepada glikogen","bucketId":"tengah","note":"Insulin dirembeskan oleh pankreas di belakang perut."},{"text":"Progesteron pengekalan ketebalan dinding uterus","bucketId":"gonad","note":"Progesteron bersama estrogen dirembeskan oleh ovari wanita."},{"text":"Testosteron perangsang suara garau dan penghasilan sperma","bucketId":"gonad","note":"Testosteron dirembeskan oleh testis lelaki selepas akil baligh."}],"explanation":"Mengaitkan kedudukan anatomi (kepala/leher -> abdomen -> pelvis) memudahkan pelajar mengingati kesemua hormon Jadual 7.1."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Susun Laluan Hormon","voiceCaption":"Susun urutan perjalanan molekul hormon daripada kelenjar endokrin sehingga tindak balas sel sasaran.","voiceScript":"[curious] Susun semula empat langkah urutan perjalanan hormon dalam koordinasi endokrin daripada mula dirembeskan sehingga dikesan oleh organ sasaran.","prompt":"Susun urutan yang betul bagi cara koordinasi hormon bertindak dalam badan manusia:","hint":"Bermula dengan rembesan kelenjar tanpa duktus ke dalam peredaran darah.","answerTokens":["Kelenjar tanpa duktus rembes hormon","Hormon meresap ke salur darah","Diangkut melalui sistem peredaran darah","Dikesan oleh reseptor organ sasaran"],"distractors":["Dialirkan melalui duktus khas","Menyerang sel darah merah"],"explanation":"Kelenjar endokrin tidak mempunyai duktus; hormon dirembes terus ke dalam aliran darah lalu dibawa menuju ke organ sasaran yang memiliki reseptor khusus."},{"type":"mcq","xp":20,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Menopaus & HRT","voiceCaption":"Soalan pengukuhan Unit satu menguji konsep menopaus serta Terapi Penggantian Hormon.","voiceScript":"[confident] Soalan penutup Unit satu! Berdasarkan Rencana Sains, apakah jenis Terapi Penggantian Hormon yang sesuai untuk wanita menopaus yang telah menjalani pembedahan membuang rahim?","prompt":"Seorang wanita berusia 50 tahun mengalami menopaus dengan simptom sukar tidur dan sakit sendi akibat penurunan hormon estrogen. Jika beliau telah menjalani pembedahan membuang rahim, terapi manakah yang paling sesuai?","options":["Terapi Estrogen (ET) kerana wanita tanpa rahim tidak memerlukan tambahan progestin","Terapi Estrogen-Progestin (EPT) khas untuk pesakit yang mengalami kekurangan insulin","Suntikan hormon pertumbuhan (GH) bagi menebalkan dinding uterus semula","Pengambilan ubat penenang secara berterusan untuk menghentikan aktiviti tiroid"],"correctIndex":0,"explanation":"Mengikut Rencana Sains Bab 7 (m.s. 143), Terapi Estrogen-Progestin (EPT) diberikan jika wanita masih mempunyai rahim, manakala Terapi Estrogen (ET) diberikan kepada mereka yang telah menjalani pembedahan membuang rahim."}]},{"id":"sai7-u2","title":"Unit 2: Punca & Kesan Ketidakseimbangan Hormon","subtitle":"Subtopik 7.1b — Diabetes Insipidus & Melitus, Akromegali, Kretinisme, Goiter & Hormon Seks","iconType":"scale","iconUrl":"../assets/icons/sai7-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Imbangan GH & ADH","voiceCaption":"Kekurangan atau kelebihan hormon pertumbuhan dan hormon antidiuresis mencetuskan kekerdilan, akromegali atau diabetes insipidus.","voiceScript":"[warm] Rembesan hormon mesti sentiasa seimbang! Gaya hidup tidak sihat, pemakanan kurang baik atau pendedahan sinaran berbahaya boleh menyebabkan ketidakseimbangan hormon. Kekurangan hormon pertumbuhan mengakibatkan kekerdilan, manakala kelebihannya mencetuskan kegergasian dan akromegali!","title":"Punca Ketidakseimbangan & Gangguan Hormon GH dan ADH","acronym":"G•H•A•D","hook":"Kekurangan ADH dan kekurangan insulin sama-sama menggunakan nama 'diabetes', tetapi punca dan kesannya sangat berbeza!","mediaKey":"sai7_endocrine_system","summary":"Gangguan pada kelenjar pituitari mengubah kadar rembesan hormon pertumbuhan (GH) dan hormon antidiuresis (ADH), lalu menjejaskan saiz fizikal serta imbangan air tubuh.","bullets":["Punca Umum & Ketidakseimbangan GH: Ketidakseimbangan boleh berpunca daripada gaya hidup dan pemakanan tidak sihat atau pendedahan kepada sinaran berbahaya. Kekurangan GH menyebabkan kekerdilan, manakala kelebihan GH menyebabkan pertumbuhan tidak terkawal iaitu kegergasian serta akromegali (pembesaran luar biasa pada orang dewasa).","Ketidakseimbangan ADH: Kekurangan ADH menghalang penyerapan semula air di duktus pengumpul ginjal -> penghasilan urin berlebihan dan sentiasa dahaga (diabetes insipidus); kelebihan ADH pula mengakibatkan sakit kepala dan pening."],"labId":"sai7_hormon_balance_sim","labTitle":"Simulator Klinikal Imbangan Hormon","labProps":{"tab":"sliders","insulin":100,"tiroksina":100,"gh":185,"adrenalina":20},"examTip":"Jangan kelirukan dua jenis diabetes dalam Aktiviti 7.2: Diabetes INSIPIDUS disebabkan kurang ADH (ginjal gagal serap air); Diabetes MELITUS disebabkan kurang INSULIN (aras glukosa darah tinggi)!"},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Punca Diabetes Insipidus","voiceCaption":"Ramalkan hormon dan organ yang terlibat apabila pesakit kerap membuang air kencing dalam isi padu tinggi.","voiceScript":"[curious] Cuba selesaikan kes klinikal ini! Seorang pesakit sentiasa berasa dahaga melampau dan membuang air kencing cair secara berlebihan, namun ujian darah menunjukkan paras glukosa adalah normal. Hormon manakah yang mengalami kekurangan?","hook":"Ujian gula darah normal menyingkirkan diabetes melitus — jadi hormon pituitari manakah yang bermasalah?","scenario":"Doktor mendapati duktus pengumpul di ginjal pesakit tidak menyerap semula air dengan berkesan walaupun paras glukosa darahnya normal.","prompt":"Apakah hormon yang kurang dirembeskan oleh kelenjar pituitari pesakit tersebut dan nama penyakitnya?","options":["Kekurangan hormon antidiuresis (ADH) yang menyebabkan penyakit diabetes insipidus","Kekurangan hormon insulin yang menyebabkan penyakit hipoglisemia","Kelebihan hormon pertumbuhan (GH) yang menyebabkan penyakit akromegali","Kekurangan hormon tiroksina yang menyebabkan penyakit kretinisme"],"correctIndex":0,"proofLabId":"sai7_hormon_balance_sim","proofState":{"tab":"extra","extraHormone":"adh_low"},"explanation":"Kekurangan hormon antidiuresis (ADH) menyebabkan air tidak dapat diserap semula di duktus pengumpul ginjal, menghasilkan urin berlebihan serta rasa sentiasa dahaga — inilah penyakit diabetes insipidus."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Imbangan Tiroksina Tiroid","voiceCaption":"Kekurangan tiroksina mencetuskan kretinisme, miksedema dan goiter, manakala kelebihannya meningkatkan kadar metabolisme terlampau tinggi.","voiceScript":"[warm] Kelenjar tiroid bertindak seperti termostat metabolisme tubuh! Apabila hormon tiroksina kurang, kanak-kanak berisiko mengalami kretinisme manakala orang dewasa mengalami miksedema dan goiter. Sebaliknya, jika tiroksina berlebihan, kadar metabolisme melonjak sehingga pesakit kurus, berpeluh panas dan bola mata menonjol keluar!","title":"Ketidakseimbangan Tiroksina: Kretinisme, Miksedema, Goiter & Hipertiroidisme","acronym":"K•M•G","hook":"Bengkak di bahagian leher (goiter) boleh berlaku apabila kelenjar tiroid mengalami gangguan rembesan tiroksina!","mediaKey":"sai7_thyroid_goiter","summary":"Aras hormon tiroksina yang terlalu rendah atau terlalu tinggi mengubah kadar metabolisme sel, berat badan, suhu tubuh serta rupa bentuk leher.","bullets":["Kekurangan Tiroksina: Menyebabkan kadar metabolisme rendah, tidak tahan sejuk, perkembangan fizikal dan mental terbantut pada kanak-kanak (kretinisme), kurang tenaga pada orang dewasa (miksedema), cenderung menjadi gemuk serta pembengkakan kelenjar tiroid (goiter).","Berlebihan Tiroksina: Menyebabkan kadar metabolisme tinggi, berpeluh dan sentiasa berasa panas, sukar tidur, kuat selera makan tetapi cenderung menjadi kurus, pembesaran kelenjar tiroid, leher bengkak dan bola mata yang menonjol keluar."],"labId":"sai7_hormon_balance_sim","labTitle":"Uji Gelangsar Tiroksina Rendah vs Tinggi","labProps":{"tab":"sliders","insulin":100,"tiroksina":25,"gh":100,"adrenalina":20},"examTip":"Bezakan dua istilah KSSM: KRETINISME berlaku pada kanak-kanak (fizikal & mental terbantut); MIKSEDEMA berlaku pada orang dewasa (kurang tenaga & cenderung gemuk)."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Simptom Tiroksina","voiceCaption":"Kelaskan enam gejala klinikal kepada kekurangan tiroksina ataupun kelebihan tiroksina.","voiceScript":"[confident] Uji ketelitian klinikal kamu! Kelaskan enam gejala berikut sama ada berpunca daripada kekurangan hormon tiroksina ataupun kelebihan hormon tiroksina.","prompt":"Kelaskan simptom berikut mengikut punca ketidakseimbangan hormon tiroksina:","buckets":[{"id":"kurang","label":"Kekurangan Tiroksina"},{"id":"lebih","label":"Berlebihan Tiroksina"}],"items":[{"text":"Kretinisme iaitu perkembangan fizikal dan mental kanak-kanak terbantut","bucketId":"kurang","note":"Kekurangan tiroksina sejak kecil merencatkan pertumbuhan otak dan tulang."},{"text":"Miksedema (kurang tenaga pada orang dewasa) dan tidak tahan sejuk","bucketId":"kurang","note":"Metabolisme perlahan menjana kurang tenaga haba dan menyebabkan keletihan."},{"text":"Cenderung menjadi gemuk bersama masalah goiter","bucketId":"kurang","note":"Pembakaran nutrien rendah menyebabkan berat badan mudah naik."},{"text":"Kadar metabolisme terlampau tinggi, berpeluh dan sentiasa panas","bucketId":"lebih","note":"Tiroksina berlebihan memecut respirasi sel dan penjanaan haba."},{"text":"Kuat selera makan namun cenderung menjadi kurus serta sukar tidur","bucketId":"lebih","note":"Tenaga daripada makanan digunakan terlalu pantas oleh metabolisme tinggi."},{"text":"Bola mata menonjol keluar bersama pembesaran kelenjar tiroid","bucketId":"lebih","note":"Ciri khas keadaan tiroksina berlebihan (hipertiroidisme)."}],"explanation":"Kekurangan tiroksina melambatkan metabolisme (sejuk, gemuk, kretinisme, miksedema); kelebihannya memecut metabolisme (panas, kurus, mata menonjol)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Insulin & Hormon Seks","voiceCaption":"Kekurangan insulin mencetuskan diabetes melitus manakala kekurangan progesteron boleh membawa kepada keguguran kandungan.","voiceScript":"[warm] Mari lengkapi peta ketidakseimbangan hormon! Kekurangan insulin menghalang penukaran glukosa berlebihan kepada glikogen lalu menyebabkan diabetes melitus, sedangkan insulin berlebihan pula menyebabkan hipoglisemia! Bagi hormon seks pula, ketidakseimbangan testosteron, estrogen dan progesteron menjejaskan ciri seks serta kehamilan.","title":"Ketidakseimbangan Insulin & Hormon Seks (Testosteron, Estrogen, Progesteron)","acronym":"I•T•E•P","hook":"Kekurangan progesteron bukan sekadar mengganggu kitar haid, malah boleh mengundang risiko keguguran kandungan!","mediaKey":"sai7_insulin_glucose","summary":"Imbangan insulin memastikan paras glukosa darah stabil, manakala kestabilan hormon seks mengawal akil baligh, kesuburan dan kehamilan.","bullets":["Insulin (Diabetes Melitus vs Hipoglisemia): Kekurangan insulin menyebabkan glukosa berlebihan gagal ditukar kepada glikogen lalu aras glukosa darah meningkat (diabetes melitus); sebaliknya insulin berlebihan menyebabkan aras glukosa darah terlalu rendah (hipoglisemia) dan dahaga berlebihan.","Testosteron, Estrogen & Progesteron: Kurang testosteron melambatkan akil baligh dan mengurangkan sperma (berlebihan mencetus sifat kelelakian pada wanita); kurang estrogen menjejaskan ciri seks sekunder wanita (berlebihan mencetus sifat keperempuanan pada lelaki); kurang progesteron pula menyebabkan masalah haid, sakit kepala, sembelit serta keguguran kandungan."],"labId":"sai7_hormon_balance_sim","labTitle":"Uji Diabetes Melitus vs Hipoglisemia","labProps":{"tab":"sliders","insulin":20,"tiroksina":100,"gh":100,"adrenalina":20},"examTip":"Apabila menghuraikan diabetes melitus dalam Kertas 2, nyatakan tiga rantaian markah: (1) pankreas kurang merembeskan insulin, (2) glukosa berlebihan gagal ditukar kepada glikogen di hati, (3) aras glukosa darah meningkat!"},{"type":"match","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Padan Penyakit Endokrin","voiceCaption":"Padankan lima penyakit atau gangguan endokrin dengan ketidakseimbangan hormon penyebabnya.","voiceScript":"[confident] Padankan lima penyakit sistem endokrin berikut dengan punca ketidakseimbangan hormon yang tepat.","prompt":"Padankan setiap penyakit berikut dengan punca ketidakseimbangan hormonnya:","pairs":[{"id":"p1","left":"Diabetes melitus","right":"Kekurangan hormon insulin daripada pankreas"},{"id":"p2","left":"Diabetes insipidus","right":"Kekurangan hormon antidiuresis (ADH) daripada pituitari"},{"id":"p3","left":"Akromegali & Kegergasian","right":"Hormon pertumbuhan (GH) dirembeskan secara berlebihan"},{"id":"p4","left":"Kekerdilan","right":"Kekurangan hormon pertumbuhan (GH) sejak kanak-kanak"},{"id":"p5","left":"Hipoglisemia","right":"Rembesan hormon insulin berlebihan menurunkan glukosa darah"}],"explanation":"Menguasai lima padanan klasik ini menjamin markah penuh untuk soalan Kertas 1 dan struktur Praktis Formatif 7.1."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Bina Jawapan Diabetes Melitus","voiceCaption":"Susun penjelasan Kertas dua tentang bagaimana kegagalan pankreas mencetuskan diabetes melitus.","voiceScript":"[curious] Susun jawapan struktur S P M yang tepat untuk menerangkan bagaimana kegagalan fungsi pankreas menyebabkan penyakit diabetes melitus!","prompt":"Susun huraian lengkap Praktis Sumatif 7 tentang punca penyakit diabetes melitus:","hint":"Mulakan dengan kekurangan rembesan hormon daripada pankreas.","answerTokens":["Pankreas kurang merembeskan insulin","Glukosa berlebihan dalam darah","tidak ditukar kepada glikogen","menyebabkan penyakit diabetes melitus"],"distractors":["Ginjal menyerap semula air","Tiroksina meningkatkan suhu"],"explanation":"Kekurangan insulin menghalang penukaran glukosa berlebihan kepada glikogen simpanan di hati, lalu aras glukosa darah kekal tinggi dan mencetuskan diabetes melitus."},{"type":"mcq","xp":20,"voiceIdKey":"u2-s8","voiceToneLabel":"Uji Kesan Progesteron","voiceCaption":"Uji kefahaman tentang gejala khusus kekurangan hormon progesteron dan testosteron.","voiceScript":"[confident] Soalan penutup Unit dua! Antara berikut, pasangan kesan ketidakseimbangan hormon seks manakah yang benar mengikut sukatan K S S M?","prompt":"Seorang pesakit wanita kerap mengalami masalah haid, sakit kepala, sembelit serta pernah berdepan risiko keguguran kandungan. Kekurangan hormon manakah yang berkemungkinan besar dialaminya?","options":["Hormon progesteron daripada ovari","Hormon testosteron daripada kelenjar tiroid","Hormon adrenalina daripada kelenjar pituitari","Hormon pertumbuhan (GH) daripada pankreas"],"correctIndex":0,"explanation":"Kekurangan hormon progesteron yang dirembeskan oleh ovari menjejaskan ketebalan dinding uterus dan dikaitkan dengan masalah haid, sakit kepala, sembelit serta keguguran kandungan."}]},{"id":"sai7-u3","title":"Unit 3: 4 Kategori Dadah & Gangguan Impuls","subtitle":"Subtopik 7.2a — Penenang, Perangsang, Inhalan, Halusinogen, Perubatan & Simptom Penarikan","iconType":"atom","iconUrl":"../assets/icons/sai7-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Dadah: Perubatan & Penenang/Perangsang","voiceCaption":"Dadah boleh merawat penyakit di bawah pengawasan doktor tetapi penyalahgunaannya mengganggu impuls neuron dengan kategori seperti penenang dan perangsang.","voiceScript":"[warm] Sekarang kita masuk ke Subtopik tujuh perpuluhan dua, Gangguan kepada Koordinasi Badan! Tahukah kamu morfin dan steroid ialah dadah yang digunakan secara sah sebagai ubat di bawah pengawasan doktor? Namun tanpa kawalan, dadah mengganggu pergerakan impuls neuron. Mari bandingkan dua kategori pertama iaitu penenang dan perangsang!","title":"Kegunaan Perubatan vs Penyalahgunaan: Penenang & Perangsang","acronym":"P•P•M•S","hook":"Dadah di hospital ialah penyelamat nyawa apabila dikawal doktor, tetapi penyalahgunaan menukar ubat menjadi racun sistem saraf!","mediaKey":"sai7_drug_categories","summary":"Dadah ialah bahan kimia yang mengubah kelajuan atau laluan penghantaran impuls saraf; dua kelas terasnya bertindak secara bertentangan sebagai depresan dan stimulan.","bullets":["Dadah sebagai Ubat vs Penenang (Depresan): Morfin dan steroid digunakan secara sah untuk merawat penyakit di bawah pengawasan doktor. Dadah penenang seperti barbiturat dan alkohol pula menghalang atau melambatkan pergerakan impuls saraf sehingga pengguna berasa mengantuk serta kurang cemas.","Perangsang (Stimulan): Dadah perangsang seperti amfetamina dan metamfetamina mempercepat pergerakan impuls dalam koordinasi badan; pengguna menjadi sangat yakin dan berwaspada secara melampau mengikut dos yang diambil."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Kad 3D: 4 Kategori Dadah & Kesan","labProps":{"tab":"deck"},"examTip":"Jika disoal contoh dadah yang digunakan sebagai ubat perubatan di bawah pengawasan doktor (m.s. 153), sebutkan 'morfin' dan 'steroid'!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Penenang vs Perangsang","voiceCaption":"Bezakan contoh bahan serta kesan fisiologi antara kategori Penenang dengan Perangsang.","voiceScript":"[confident] Kelaskan enam ciri dan contoh berikut kepada dua kategori bertentangan, iaitu Dadah Penenang ataupun Dadah Perangsang!","prompt":"Kelaskan contoh dan kesan berikut kepada Dadah Penenang atau Dadah Perangsang:","buckets":[{"id":"penenang","label":"Penenang (Depresan)"},{"id":"perangsang","label":"Perangsang (Stimulan)"}],"items":[{"text":"Contoh utama ialah barbiturat dan alkohol","bucketId":"penenang","note":"Barbiturat dan alkohol menindas aktiviti sistem saraf pusat."},{"text":"Contoh utama ialah amfetamina dan metamfetamin","bucketId":"perangsang","note":"Amfetamina dan metamfetamin ialah perangsang sintetik kuat."},{"text":"Menghalang atau melambatkan pergerakan impuls saraf","bucketId":"penenang","note":"Melambatkan penghantaran isyarat di antara neuron."},{"text":"Mempercepat pergerakan impuls serta aktif dan ganas","bucketId":"perangsang","note":"Merangsang sel otak secara berlebihan sehingga menjadi agresif."},{"text":"Menyebabkan rasa mengantuk, kurang cemas dan koordinasi lemah","bucketId":"penenang","note":"Kesan langsung penindasan sistem saraf bergantung pada dos."},{"text":"Meningkatkan degupan jantung, kadar pernafasan dan tekanan darah","bucketId":"perangsang","note":"Perangsang memacu sistem kardiovaskular dan pernafasan."}],"explanation":"Penenang (barbiturat, alkohol) melambatkan impuls dan membuatkan pengguna mengantuk; Perangsang (amfetamina, metamfetamina) mempercepat impuls, menaikkan tekanan darah serta berisiko perlakuan ganas."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Inhalan, Halusinogen & Faktor","voiceCaption":"Inhalan disedut melalui pernafasan dan merosakkan otak, peparu serta ginjal, manakala halusinogen mengubah laluan impuls otak.","voiceScript":"[warm] Selain penenang dan perangsang, terdapat dua kategori berbahaya lain! Inhalan seperti pelarut gam dan bahan gas disedut melalui pernafasan lalu merosakkan otak, peparu serta ginjal. Halusinogen seperti ketamin dan L S D pula mengubah laluan impuls di dalam otak hingga pesakit terdengar suara dan melihat objek khayalan!","title":"Kategori Inhalan, Halusinogen & 4 Faktor Penyalahgunaan Dadah","acronym":"I•H•K•L","hook":"Menghidu pelarut atau mengambil LSD bukan sekadar khayalan seketika — ia memusnahkan neuron otak dan organ penting!","mediaKey":"sai7_drug_categories","summary":"Inhalan merosakkan organ pernafasan dan perkumuhan secara terus, manakala halusinogen memesongkan laluan impuls otak serta persepsi realiti.","bullets":["Inhalan & Halusinogen: Inhalan (pelarut/gam dan bahan gas) disedut melalui pernafasan, menyebabkan halusinasi serta merosakkan otak, peparu dan ginjal. Halusinogen (ketamin dan LSD atau dietilamida asid lisergik) mengubah laluan impuls di dalam otak -> khayal, menjejaskan persepsi dan koordinasi otot, terdengar suara serta terlihat objek tidak wujud.","4 Faktor Penyalahgunaan Dadah: Didorong oleh sifat ingin tahu, pengaruh rakan sebaya, mencari keseronokan serta ingin mengatasi kesedihan atau melupakan masalah."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Buka Kesemua 4 Kad Kategori Dadah","labProps":{"tab":"deck"},"examTip":"Pastikan tiga organ sasaran kerosakan INHALAN disebut lengkap jika ditanya dalam peperiksaan: 'otak, peparu dan ginjal'."},{"type":"match","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Padan 4 Kategori Dadah","voiceCaption":"Padankan keempat-empat kategori dadah dengan contoh bahan dan kesannya mengikut Rajah tujuh perpuluhan empat.","voiceScript":"[confident] Uji penguasaan keempat-empat kategori dadah daripada Rajah tujuh perpuluhan empat! Padankan setiap kategori dengan contoh serta kesannya.","prompt":"Padankan keempat-empat kategori dadah berikut dengan contoh dan ciri utamanya:","pairs":[{"id":"k1","left":"Penenang (Depresan)","right":"Barbiturat & alkohol — melambatkan impuls dan menyebabkan mengantuk"},{"id":"k2","left":"Perangsang (Stimulan)","right":"Amfetamina & metamfetamin — mempercepat impuls dan meningkatkan kewaspadaan"},{"id":"k3","left":"Inhalan","right":"Pelarut & bahan gas — disedut melalui pernafasan; rosak otak, peparu dan ginjal"},{"id":"k4","left":"Halusinogen","right":"Ketamin & LSD — mengubah laluan impuls otak, khayal dan jejas persepsi"}],"explanation":"Keempat-empat kelas dadah ini berbeza dari segi cara pengambilan (disedut bagi inhalan) dan mekanisme gangguan impuls pada neuron serta otak."},{"type":"predict","xp":20,"voiceIdKey":"u3-s5","voiceToneLabel":"Ramal Bahaya Kopi Berlebihan","voiceCaption":"Apakah kesan fisiologi pengambilan kafein dalam kopi secara berlebihan menurut Cabar Minda Bab tujuh?","voiceScript":"[curious] Soalan Cabar Minda daripada Praktis Sumatif Bab tujuh! Mengapakah minum kopi pekat secara berlebihan setiap hari tidak baik untuk kesihatan dan koordinasi badan seseorang?","hook":"Kopi mengandungi kafein, sejenis bahan perangsang (stimulan) semula jadi kepada sistem saraf!","scenario":"Faris minum lima cawan kopi pekat setiap malam untuk berjaga menyiapkan tugasan sekolahnya.","prompt":"Apakah kesan utama pengambilan kafein berlebihan dalam kopi terhadap sistem koordinasi dan kesihatan Faris?","options":["Kafein bertindak sebagai perangsang yang meningkatkan degupan jantung dan tekanan darah, menyebabkan sukar tidur, resah serta mengganggu kestabilan emosi dan koordinasi","Kafein bertindak sebagai inhalan yang membekukan selaput peparu serta-merta","Kopi menyebabkan kelenjar pituitari berhenti menghasilkan semua hormon ADH selama-lamanya","Kafein memperlahankan impuls saraf sehingga pengguna terus pengsan dalam beberapa saat"],"correctIndex":0,"proofLabId":"sai7_dadah_alkohol_deck","proofState":{"tab":"braking","substance":"stimulan"},"explanation":"Kafein dalam kopi ialah bahan perangsang sistem saraf. Pengambilan berlebihan mempercepat degupan jantung dan kadar metabolisme, mengakibatkan sukar tidur (insomnia), kegelisahan, peningkatan tekanan darah dan gangguan koordinasi."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Susun Kesan Bahan Psikoaktif","voiceCaption":"Susun penerangan tentang lokasi dan cara bahan psikoaktif serta etanol menghalang impuls saraf.","voiceScript":"[curious] Susun penjelasan saintifik tentang di manakah bahan kimia psikoaktif dan etanol bertindak untuk melambatkan gerak balas sistem saraf!","prompt":"Susun ayat yang menerangkan mekanisme bahan kimia dadah dan alkohol di dalam laluan neuron (Praktis Formatif 7.2):","hint":"Bahan psikoaktif atau etanol bertindak di ruang antara dua jenis neuron.","answerTokens":["Bahan kimia psikoaktif atau etanol","berada antara neuron aferen dan interneuron","menghalang pergerakan impuls saraf","lalu melambatkan penghantaran maklumat ke otak"],"distractors":["berada di dalam duktus hempedu","mempercepat pembahagian mitosis tulang"],"explanation":"Bahan psikoaktif dalam dadah dan etanol dalam alkohol berada di antara neuron aferen dengan interneuron, menghalang pergerakan impuls serta melambatkan penghantaran maklumat ke otak."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s7","voiceToneLabel":"Ketagihan & Simptom Penarikan","voiceCaption":"Penghentian dadah secara mendadak menimbulkan simptom penarikan seperti menggigil, loya, resah dan sedih.","voiceScript":"[warm] Apakah yang terjadi apabila penagih berhenti mengambil dadah? Tubuh yang sudah bergantung secara kimia akan mengalami simptom penarikan yang menyakitkan seperti menggigil, loya, resah dan sedih! Selain itu, Rajah tujuh perpuluhan lima turut merumuskan dua kesan utama dadah sama ada merangsang ataupun melambatkan fungsi badan.","title":"Ketagihan, Simptom Penarikan & Ringkasan Kesan Rajah 7.5","acronym":"M•L•R•S","hook":"Ketagihan memerangkap penagih apabila kekurangan dos mencetuskan seksaan fizikal dan emosi yang dipanggil simptom penarikan!","mediaKey":"sai7_drug_categories","summary":"Penyalahgunaan dadah membentuk kebergantungan fisiologi yang sukar diputuskan serta mencetuskan perubahan ekstrem pada degupan jantung, pernafasan dan tingkah laku.","bullets":["Ketagihan & Simptom Penarikan: Apabila penagih cuba berhenti atau tidak mengambil dadah, mereka mengalami simptom penarikan seperti menggigil, loya, resah dan sedih yang memaksa mereka mencari bekalan semula tanpa rawatan pemulihan.","Dua Cabang Kesan (Rajah 7.5): Dadah yang merangsang menaikkan degupan jantung, pernafasan dan tekanan darah (lebih aktif, perasaan tak menentu, ganas); dadah yang melambatkan pula menurunkan parameter tersebut (lambat gerak balas, mengantuk, koordinasi otot lemah) di samping gangguan persepsi, halusinasi serta ilusi."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Bandingkan Impuls dalam Kanvas 60fps","labProps":{"tab":"braking","substance":"normal"},"examTip":"Hafal empat tanda simptom penarikan KSSM pada muka surat 154: menggigil, loya, resah dan sedih!"},{"type":"mcq","xp":20,"voiceIdKey":"u3-s8","voiceToneLabel":"Uji Ketagihan & Halusinogen","voiceCaption":"Soalan pengukuhan Unit tiga menguji perbezaan halusinogen, inhalan dan simptom penarikan.","voiceScript":"[confident] Soalan penutup Unit tiga! Kenal pasti kategori dadah dan contoh tepat yang mengubah laluan impuls otak sehingga menyebabkan pengguna terdengar suara yang tidak wujud.","prompt":"Seorang pesakit sering terlihat bayangan objek yang tiada dan terdengar suara bisikan akibat gangguan laluan impuls di dalam otaknya. Apakah kategori dadah dan contoh yang paling tepat mencetuskan kesan ini?","options":["Halusinogen seperti ketamin dan LSD (dietilamida asid lisergik)","Penenang perubatan seperti steroid di bawah pengawasan doktor","Hormon antidiuresis daripada kelenjar pituitari","Perangsang ringan bagi meningkatkan daya tahan terhadap kesejukan"],"correctIndex":0,"explanation":"Halusinogen seperti ketamin dan LSD mengubah laluan impuls di dalam otak sehingga menjejaskan persepsi, koordinasi otot, mencetuskan khayalan serta halusinasi audio dan visual."}]},{"id":"sai7-u4","title":"Unit 4: Kesan Penyalahgunaan Dadah & Alkohol","subtitle":"Subtopik 7.2b — Tindakan Refleks, Serebrum, Sirosis Hati, Ulser Perut, Fetus & Sosial","iconType":"graph","iconUrl":"../assets/icons/sai7-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Koordinasi Saraf & Serebrum","voiceCaption":"Dadah dan alkohol menjejaskan serebrum, melambatkan tindakan refleks dan melemahkan koordinasi otot hingga hilang keseimbangan.","voiceScript":"[warm] Bagaimanakah alkohol dan dadah merosakkan koordinasi pergerakan harian? Pengambilan alkohol menjejaskan serebrum yang mengawal pertuturan sehingga percakapan menjadi tidak jelas dan meracau! Selain itu, etanol di antara neuron aferen dan interneuron melambatkan tindakan refleks serta menyebabkan cara berjalan terhuyung-hayang!","title":"Kesan kepada Koordinasi Badan: Pertuturan, Refleks & Keseimbangan","acronym":"P•R•K","hook":"Memandu selepas minum alkohol ibarat menekan brek dalam gerak perlahan — sepersepuluh saat kelewatan mampu membawa maut!","mediaKey":"sai7_liver_alcohol","summary":"Etanol dalam alkohol dan bahan psikoaktif dadah menindas fungsi serebrum, melambatkan transmisi impuls refleks serta menjejaskan kestabilan otot.","bullets":["Pertuturan Tidak Jelas & Hilang Keseimbangan: Alkohol merosakkan fungsi bahagian serebrum otak yang mengawal pertuturan sehingga percakapan menjadi pelat dan meracau; koordinasi otot yang lemah turut menyebabkan individu berjalan terhuyung-hayang dan mudah jatuh.","Tindakan Refleks Lambat: Bahan kimia psikoaktif dadah dan etanol alkohol berada di antara neuron aferen dengan interneuron, menghalang pergerakan impuls dan melambatkan penghantaran maklumat ke otak."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Simulator Kanvas 60fps Masa Gerak Balas Brek","labProps":{"tab":"braking","substance":"alkohol"},"examTip":"Bahagian otak yang mengawal pertuturan dan terjejas oleh alkohol dalam buku teks ialah SEREBRUM!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Jarak Membrek Alkohol","voiceCaption":"Bandingkan masa tindak balas dan risiko kemalangan antara pemandu normal dengan pemandu di bawah pengaruh etanol.","voiceScript":"[curious] Jalankan uji kaji ramalan jalan raya! Jika seorang pemandu minum minuman beralkohol lalu melihat seorang penunggang basikal melintas secara tiba-tiba, apakah yang berlaku terhadap jarak berhenti keretanya?","hook":"Simulasi kanvas akan membandingkan kelajuan impuls saraf pemandu sedar dengan pemandu mabuk secara langsung!","scenario":"Dua pemandu memandu pada kelajuan sama apabila halangan muncul secara tiba-tiba di hadapan kereta mereka.","prompt":"Mengapakah pemandu yang mengambil minuman beralkohol mengambil masa lebih lama untuk menekan brek dan berisiko tinggi melanggar halangan?","options":["Etanol menghalang pergerakan impuls antara neuron aferen dengan interneuron ke otak, memanjangkan masa tindak balas dan jarak membrek","Etanol meningkatkan penghasilan hormon tiroksina yang melajukan kereta secara automatik","Alkohol menyebabkan hormon estrogen mengeras di dalam otot kaki pemandu","Serebrum menghantar impuls elektrik terus ke tayar kereta tanpa melalui otot"],"correctIndex":0,"proofLabId":"sai7_dadah_alkohol_deck","proofState":{"tab":"braking","substance":"alkohol"},"explanation":"Etanol dalam alkohol melambatkan pengaliran impuls saraf di antara neuron aferen dengan interneuron. Masa gerak balas meningkat hampir dua kali ganda berbanding pemandu sedar sehingga kereta gagal berhenti sebelum halangan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Gangguan Hormon & Ganas","voiceCaption":"Dadah dan alkohol mencetuskan ketidakseimbangan hormon pituitari serta gonad di samping mendorong perlakuan ganas.","voiceScript":"[warm] Selain saraf, penyalahgunaan dadah dan alkohol turut mengganggu sistem endokrin! Kerosakan kelenjar pituitari menyebabkan pertumbuhan melampau atau terbantut, manakala gangguan estrogen dan testosteron merencatkan ciri seks sekunder serta menimbulkan kemurungan dan perlakuan ganas!","title":"Ketidakseimbangan Hormon & Perlakuan Ganas Akibat Dadah dan Alkohol","acronym":"H•S•G","hook":"Ketidakseimbangan hormon akibat dadah dan alkohol menjejaskan pertumbuhan fizikal, daya ingatan serta kawalan kelakuan!","mediaKey":"sai7_endocrine_system","summary":"Bahan toksik psikoaktif merosakkan kelenjar endokrin dan pusat kawalan emosi otak sehingga memicu perubahan fizikal serta keganasan.","bullets":["Ketidakseimbangan Hormon: Kerosakan pada kelenjar pituitari mengakibatkan pertumbuhan melampau atau terhenti, manakala kegagalan fungsi estrogen dan testosteron membantutkan ciri seks sekunder; penghidap menunjukkan gejala tubuh terlalu besar/kurus, murung dan kurang daya ingatan.","Perlakuan Ganas: Amfetamina mengaktifkan sel-sel otak dan meningkatkan metabolisme secara melampau (terlalu aktif, tak dapat tidur, ganas dan agresif), manakala mabuk alkohol melenyapkan kewarasan fikiran sehingga bertindak di luar kawalan."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Pemeriksa Kesan Organ & Hormon","labProps":{"tab":"organs"},"examTip":"Praktis Formatif 7.2 Soalan 3: Terangkan secara spesifik kesan kerosakan pituitari (pertumbuhan) DAN estrogen/testosteron (ciri seks sekunder terbantut)."},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Bahagian Badan Terjejas","voiceCaption":"Padankan lima bahagian atau organ tubuh dengan kesan patologi akibat penyalahgunaan alkohol dan dadah.","voiceScript":"[confident] Padankan setiap bahagian badan dan organ berikut dengan kesan khusus akibat penyalahgunaan alkohol serta dadah.","prompt":"Padankan organ atau struktur berikut dengan kesan penyalahgunaan dadah dan alkohol:","pairs":[{"id":"o1","left":"Serebrum otak","right":"Pertuturan tidak jelas dan meracau apabila mabuk alkohol"},{"id":"o2","left":"Neuron aferen & interneuron","right":"Aliran impuls terhalang lalu melambatkan tindakan refleks"},{"id":"o3","left":"Hati (Sirosis hati)","right":"Kerosakan kronik, berparut, mengeras dan hilang fungsi sepenuhnya"},{"id":"o4","left":"Selaput dalam perut (Ulser peptik)","right":"Asid perut berlebihan menghakis dinding menyebabkan pedih ulu hati dan muntah darah"},{"id":"o5","left":"Fetus wanita hamil","right":"Perkembangan fizikal serta mental janin terencat dan risiko kecacatan"}],"explanation":"Alkohol dan dadah memberikan kesan menyeluruh daripada sel neuron mikroskopik sehinggalah kegagalan organ utama dan risiko kepada janin."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Sirosis Hati, Ulser & Fetus","voiceCaption":"Alkohol menyebabkan sirosis hati yang berparut dan mengeras, ulser perut berasid, halusinasi serta kecacatan pada fetus.","voiceScript":"[warm] Lihatlah perbandingan tisu hati sihat dan sirosis hati! Alkohol bersifat toksik kepada hati sehingga sel hati mati, berparut dan mengeras. Dalam perut pula, alkohol menghasilkan asid berlebihan yang melukakan selaput perut menjadi ulser peptik! Bagi wanita hamil, alkohol turut mengancam perkembangan fizikal dan mental fetus!","title":"Kerosakan Organ Dalaman: Sirosis Hati, Ulser Perut, Halusinasi & Fetus","acronym":"S•U•H•F","hook":"Parut sirosis hati merebak secara senyap sehingga organ penapis toksik utama tubuh berhenti berfungsi sepenuhnya!","mediaKey":"sai7_liver_alcohol","summary":"Kesan toksik kronik alkohol dan dadah merosakkan struktur organ pencernaan, sistem keimunan, kestabilan mental serta perkembangan janin.","bullets":["Sirosis Hati & Ulser Perut: Toksin alkohol dan dadah menyebabkan sirosis hati (kerosakan kronik, hati berparut, mengeras dan hilang fungsi) serta melemahkan sistem keimunan. Di perut, alkohol merangsang rembesan asid berlebihan yang mengiritasi selaput perut hingga luka (ulser peptik) dengan gejala pedih ulu hati, kembung, loya, muntah darah dan najis hitam.","Halusinasi, Kesan Fetus & Sosial: Ganja mengganggu otak menyebabkan halusinasi, paranoid (syak wasangka/takut) serta agresif. Bagi ibu hamil (Cabar Minda 4), penagihan alkohol mendedahkan fetus kepada kecacatan fizikal dan mental, selain memicu kemalangan, jenayah serta pengabaian tanggungjawab keluarga dan kerja."],"labId":"sai7_dadah_alkohol_deck","labTitle":"Teroka Kad Patologi Sirosis & Ulser","labProps":{"tab":"organs"},"examTip":"Soalan Kertas 2 kerap meminta dua gejala serius ulser perut: tulis 'muntah darah' dan 'najis berwarna hitam' selain pedih ulu hati, kembung dan loya."},{"type":"sort","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Isih Kesan Koordinasi vs Organ","voiceCaption":"Kelaskan enam kesan penyalahgunaan kepada gangguan koordinasi badan atau kerosakan organ dan mental.","voiceScript":"[confident] Kelaskan enam kesan buruk penyalahgunaan dadah dan alkohol ini sama ada tergolong dalam Gangguan Koordinasi Badan ataupun Kerosakan Organ dan Kesihatan Mental!","prompt":"Kelaskan kesan berikut mengikut kategori sukatan Subtopik 7.2:","buckets":[{"id":"koordinasi","label":"Gangguan Koordinasi Badan"},{"id":"organ","label":"Kerosakan Organ & Mental"}],"items":[{"text":"Pertuturan tidak jelas dan meracau akibat gangguan serebrum","bucketId":"koordinasi","note":"Gangguan kawalan saraf pertuturan pada serebrum."},{"text":"Berjalan terhuyung-hayang dan hilang keseimbangan otot","bucketId":"koordinasi","note":"Koordinasi otot rangka menjadi lemah."},{"text":"Tindakan refleks lambat di antara neuron aferen dan interneuron","bucketId":"koordinasi","note":"Melambatkan gerak balas motor terhadap rangsangan luar."},{"text":"Sirosis hati yang berparut, mengeras dan gagal berfungsi","bucketId":"organ","note":"Kerosakan tisu organ dalaman akibat sifat toksik."},{"text":"Ulser perut dengan pedih ulu hati, muntah darah dan najis hitam","bucketId":"organ","note":"Luka pada selaput perut akibat lebihan asid gastrik."},{"text":"Paranoid, syak wasangka dan kelakuan ganas terhadap orang lain","bucketId":"organ","note":"Masalah kesihatan mental dan tingkah laku sosial."}],"explanation":"Buku teks memisahkan kesan kepada (1) koordinasi saraf/hormon serta refleks dan (2) kerosakan fizikal organ (hati, perut, keimunan) dan kesihatan mental."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Susun Mekanisme Ulser Perut","voiceCaption":"Susun urutan berlakunya ulser peptik akibat pengambilan minuman beralkohol secara berlebihan.","voiceScript":"[curious] Susun empat blok jawapan berikut bagi menerangkan bagaimana minuman beralkohol menyebabkan ulser perut!","prompt":"Susun langkah kejadian ulser perut (ulser peptik) akibat pengambilan alkohol berlebihan:","hint":"Alkohol bertindak balas merangsang rembesan sejenis cecair di dalam perut.","answerTokens":["Alkohol merangsang perut menghasilkan","lebih banyak asid daripada biasa","menyebabkan iritasi dan radang selaput perut","lalu membentuk luka ulser peptik"],"distractors":["menghalang penyerapan air ginjal","mengurangkan jisim tulang rangka"],"explanation":"Alkohol merangsang rembesan asid perut yang berlebihan, menyebabkan iritasi serta keradangan pada selaput dalam perut sehingga terhasil luka ulser."},{"type":"mcq","xp":20,"voiceIdKey":"u4-s8","voiceToneLabel":"Uji Kesan Fetus & Sirosis","voiceCaption":"Soalan pengukuhan Unit empat mengenai kesan alkohol kepada wanita hamil dan kegagalan fungsi hati.","voiceScript":"[confident] Soalan penutup Unit empat! Apakah risiko terbesar jika seorang wanita hamil kekal menagih minuman beralkohol sepanjang tempoh kehamilannya?","prompt":"Berdasarkan Cabar Minda Bab 7, apakah kemungkinan yang berlaku kepada fetus di dalam kandungan seorang wanita hamil yang merupakan penagih alkohol?","options":["Perkembangan fizikal dan mental fetus terjejas teruk, berisiko kecacatan kekal, keguguran atau kelahiran pramatang kerana alkohol merentasi plasenta","Fetus akan menghasilkan hormon adrenalina berlebihan yang menyembuhkan sirosis hati ibunya","Fetus tumbuh menjadi lebih pintar kerana menerima lebih banyak oksigen daripada etanol","Tiada kesan kepada fetus kerana selaput perut ibu menapis keseluruhan alkohol"],"correctIndex":0,"explanation":"Etanol boleh meresap ke dalam peredaran darah fetus dan mengganggu pembahagian serta perkembangan sel otak dan organ, menyebabkan kecacatan fizikal dan mental, berat lahir rendah serta risiko keguguran."}]},{"id":"sai7-u5","title":"Unit 5: Minda yang Sihat & Tanggungjawab Sosial","subtitle":"Subtopik 7.3 — 10 Ciri Minda Sihat, 6 Faktor Kesihatan Mental, 4 Kepentingan & Langkah Menjaga","iconType":"book","iconUrl":"../assets/icons/sai7-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Maksud & 10 Ciri Minda Sihat","voiceCaption":"Minda ialah fungsi otak berkaitan kesedaran manakala minda sihat mampu menaakul dan berfikir secara logik sebelum bertindak.","voiceScript":"[warm] Selamat tiba di Subtopik tujuh perpuluhan tiga, Minda yang Sihat! Minda merujuk kepada fungsi otak berkaitan kesedaran seperti personaliti, pemikiran, ingatan, pertimbangan, intelek dan emosi. Minda yang sihat pula membolehkan seseorang menaakul dan membuat pertimbangan logik sebelum mengambil sebarang tindakan!","title":"Maksud Minda & 10 Ciri Individu Berminda Sihat","acronym":"P•T•O•B","hook":"Minda yang sihat bukan bermakna tidak pernah sedih — ia bermakna mampu berfikir logik, terbuka dan mengawal emosi!","mediaKey":"sai7_healthy_mind","summary":"Kesihatan mental menentukan kualiti pertimbangan moral, keupayaan menghadapi cabaran hidup serta ketenteraman emosi seseorang individu.","bullets":["Definisi Minda & Minda Sihat: Minda ialah fungsi otak berkaitan kesedaran (personaliti, pemikiran, ingatan, pertimbangan, intelek dan emosi). Minda yang sihat ialah keupayaan otak menaakul dan berfikir secara logik sebelum bertindak, disertai sikap positif, berdikari, penyayang dan bertanggungjawab.","10 Ciri Minda Sihat (m.s. 158): Boleh berfikir dan membuat pertimbangan wajar, mengesan rangsangan dan bergerak balas sewajarnya, mengingat peristiwa silam sedih dan gembira, sanggup menerima cabaran, mampu membezakan betul dengan salah, bertanggungjawab, hidup tenteram serta positif, bebas daripada prasangka, berfikiran terbuka serta tidak emosional, dan mampu menaakul."],"labId":"sai7_minda_sihat_lab","labTitle":"Makmal Triage Faktor Minda Sihat","labProps":{"tab":"triage","caseIdx":0},"examTip":"Soalan Praktis Formatif 7.3 meminta 5 ciri minda sihat: tulis frasa lengkap seperti 'mampu menaakul dan membuat pertimbangan wajar' dan 'berfikiran terbuka serta bebas daripada prasangka'."},{"type":"sort","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Isih Ciri Minda Sihat","voiceCaption":"Asingkan enam tingkah laku kepada ciri minda yang sihat ataupun tanda minda yang terjejas.","voiceScript":"[confident] Kelaskan enam ciri pemikiran dan tingkah laku berikut sama ada mencerminkan Minda yang Sihat ataupun Minda yang Terjejas!","prompt":"Kelaskan pernyataan berikut kepada Ciri Minda yang Sihat atau Tanda Minda Terjejas:","buckets":[{"id":"sihat","label":"Ciri Minda yang Sihat"},{"id":"terjejas","label":"Minda Terjejas"}],"items":[{"text":"Mampu menaakul dan membuat pertimbangan wajar sebelum bertindak","bucketId":"sihat","note":"Pertimbangan logik adalah teras utama minda yang sihat."},{"text":"Berfikiran terbuka, tidak emosional dan bebas daripada prasangka","bucketId":"sihat","note":"Membantu menangani kritikan secara matang."},{"text":"Sanggup menerima cabaran dan bersikap bertanggungjawab","bucketId":"sihat","note":"Ciri ketahanan mental positif dalam buku teks m.s. 158."},{"text":"Bersikap paranoid, cepat marah dan gagal mengawal emosi","bucketId":"terjejas","note":"Tanda gangguan keseimbangan mental akibat dadah, alkohol atau stres."},{"text":"Mengabaikan kewajipan terhadap keluarga dan pelajaran","bucketId":"terjejas","note":"Kesan penyalahgunaan dadah terhadap tanggungjawab diri."},{"text":"Gagal membezakan antara tindakan yang betul dengan salah","bucketId":"terjejas","note":"Kehilangan pertimbangan moral dan keupayaan menaakul."}],"explanation":"Individu berminda sihat masih mengingati peristiwa silam yang sedih dan gembira tetapi mampu membezakan betul/salah, bebas prasangka serta terus bersikap positif."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"6 Faktor Kesihatan Mental","voiceCaption":"Enam faktor mempengaruhi minda ialah ketidakseimbangan hormon, alkohol, dadah, tekanan mental, kecederaan otak dan penuaan.","voiceScript":"[warm] Mengapakah kesihatan minda seseorang boleh merosot? Rajah tujuh perpuluhan enam menyenaraikan enam faktor utama: ketidakseimbangan hormon semasa prahaid atau putus haid, kecederaan otak akibat patogen, kemalangan atau tumor, penyalahgunaan dadah, alkohol berlebihan, tekanan mental dan penuaan!","title":"6 Faktor yang Mempengaruhi Kesihatan Minda (Rajah 7.6)","acronym":"H•O•D•A•T•P","hook":"Bukan stres sahaja — gangguan hormon, jangkitan patogen pada otak dan penuaan juga mengubah fungsi minda!","mediaKey":"sai7_healthy_mind","summary":"Kesihatan mental dipengaruhi oleh faktor biologi dalaman (hormon, struktur otak, penuaan) serta faktor psikososial dan kimia luaran (tekanan, dadah, alkohol).","bullets":["Faktor Biologi (Hormon, Kecederaan Otak & Penuaan): Ketidakseimbangan hormon sebelum/semasa haid (sindrom prahaid) dan selepas putus haid menyebabkan sakit kepala, murung dan cepat marah; kecederaan bahagian otak akibat jangkitan mikroorganisma/patogen, kemalangan atau tumor menyebabkan hilang ingatan, kurang daya intelek dan mudah dipengaruhi perasaan; selain faktor penuaan semula jadi.","Faktor Luaran (Tekanan Mental, Dadah & Alkohol): Alkohol berlebihan menjejaskan pemikiran, penaakulan serta kawalan emosi hingga menjadi agresif; penyalahgunaan dadah menggagalkan tanggungjawab diri dan mencetus masalah mental serius; tekanan mental berpanjangan pula menjejaskan kestabilan minda jika tidak diurus."],"labId":"sai7_minda_sihat_lab","labTitle":"Uji Triage Kes Hormon & Tekanan","labProps":{"tab":"triage","caseIdx":1},"examTip":"Jika disoal bagaimana kecederaan otak berlaku dalam Rajah 7.6, sebutkan ketiga-tiga puncanya: jangkitan mikroorganisma/patogen, kemalangan atau tumor!"},{"type":"match","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Padan Faktor & Kesan Minda","voiceCaption":"Padankan lima faktor kesihatan mental daripada Subtopik tujuh perpuluhan tiga dengan akibatnya terhadap minda.","voiceScript":"[confident] Padankan kesemua lima faktor yang mempengaruhi minda dengan kesannya terhadap tingkah laku dan emosi manusia!","prompt":"Padankan faktor yang mempengaruhi minda berikut dengan kesannya yang tepat:","pairs":[{"id":"m1","left":"Ketidakseimbangan hormon (prahaid / putus haid)","right":"Sakit kepala, rasa murung dan cepat marah"},{"id":"m2","left":"Kecederaan otak (patogen, kemalangan, tumor)","right":"Hilang ingatan, kurang daya intelek dan mudah dipengaruhi perasaan"},{"id":"m3","left":"Pengambilan alkohol berlebihan","right":"Menjejaskan menaakul, kawalan emosi serta bertindak agresif"},{"id":"m4","left":"Penyalahgunaan dadah","right":"Gagal melaksanakan kewajipan kepada keluarga, kerja atau pelajaran"},{"id":"m5","left":"Tekanan mental tidak terkawal","right":"Mengganggu ketenteraman pemikiran dan kesihatan mental"}],"explanation":"Mengenal pasti punca spesifik bagi setiap gejala membolehkan rawatan perubatan atau sokongan kaunseling yang tepat diberikan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s5","voiceToneLabel":"4 Kepentingan & Langkah Menjaga","voiceCaption":"Minda yang sihat memperkukuh keluarga, tempat kerja, masyarakat dan ekonomi negara melalui amalan hidup positif.","voiceScript":"[warm] Mengapakah seluruh masyarakat perlu memiliki minda yang sihat? Minda sihat membina keluarga bahagia, melahirkan pekerja berdisiplin, mewujudkan masyarakat yang saling membantu serta menjanakan ekonomi negara! Mari susun pelan tindakan harian kamu dalam makmal interaktif!","title":"Kepentingan Minda Sihat kepada 4 Tonggak & Langkah Pengekalan","acronym":"K•T•M•N","hook":"Minda sihat bermula daripada diri sendiri dan meluas membina negara yang makmur serta harmoni!","mediaKey":"sai7_healthy_mind","summary":"Setiap individu berminda sihat memainkan peranan membina dalam empat lingkungan utama kehidupan sambil mengamalkan langkah pencegahan stres dan penyalahgunaan bahan.","bullets":["4 Kepentingan Minda Sihat (m.s. 160): Keluarga (membina keluarga bahagia, keputusan bijak, menjadi teladan); Tempat kerja (hubungan baik pekerja-majikan dan rakan sekerja, hasil kerja berkualiti, berdisiplin); Masyarakat (tangani kritikan baik, rakan bertukar fikiran, bantu golongan susah); Negara (berfikir positif, amalkan nilai keagamaan/moral, cara hidup sihat, menjanakan ekonomi negara).","Langkah Mengekalkan Minda Sihat: Mengawal tekanan mental dengan pengurusan masa dan rehat cukup, mengamalkan pemakanan seimbang dan bersenam, menjauhi dadah serta alkohol, berfikiran terbuka dan berkongsi masalah dengan ahli keluarga atau kaunselor."],"labId":"sai7_minda_sihat_lab","labTitle":"Perancang Tindakan & 4 Kepentingan Minda Sihat","labProps":{"tab":"planner"},"examTip":"Untuk soalan esei kepentingan minda sihat, sentiasa bahagikan jawapan kepada empat skop jelas: Keluarga, Tempat Kerja, Masyarakat dan Negara!"},{"type":"predict","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Bantu Rakan Tertekan (KBAT)","voiceCaption":"Apakah tindakan berkesan yang patut dilakukan apabila seorang rakan sekelas tertekan oleh masalah keluarga?","voiceScript":"[curious] Soalan Cabar Minda terakhir Bab tujuh! Jika sahabat baik kamu di kelas mengaku amat tertekan akibat masalah keluarga sehingga menyendiri, apakah tindakan paling bijak untuk membantunya?","hook":"Sokongan rakan sebaya yang positif boleh menjadi penyelamat kesihatan mental seseorang!","scenario":"Irfan kelihatan murung sepanjang minggu dan menceritakan kepada anda bahawa dia tertekan kerana masalah di rumah.","prompt":"Sebagai rakan sekelas yang prihatin, apakah tindakan paling wajar untuk membantu Irfan mengekalkan minda yang sihat?","options":["Menjadi pendengar yang baik dengan penuh empati, memberi nasihat positif serta menemaninya berjumpa guru bimbingan dan kaunseling sekolah","Membiarkannya bersendirian dan memaksanya menjauhi semua aktiviti kelas supaya tidak mengganggu orang lain","Mengajaknya mencuba inhalan atau minum kopi berlebihan untuk melupakan masalah seketika","Menyebarkan masalah keluarganya kepada rakan lain di media sosial sebagai pengajaran"],"correctIndex":0,"proofLabId":"sai7_minda_sihat_lab","proofState":{"tab":"triage","caseIdx":2},"explanation":"Individu berminda sihat berperanan sebagai rakan bertukar fikiran dan membantu mereka yang dalam kesusahan. Mendengar tanpa prasangka serta merujuk kepada guru kaunseling ialah langkah selamat dan berkesan."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s7","voiceToneLabel":"Bina Definisi Minda Sihat","voiceCaption":"Susun takrif lengkap minda yang sihat mengikut sukatan K S S M Tingkatan empat.","voiceScript":"[curious] Susun semula empat blok frasa berikut bagi membentuk takrifan rasmi minda yang sihat!","prompt":"Susun definisi minda yang sihat daripada Subtopik 7.3:","hint":"Bermula dengan keupayaan otak melakukan proses penaakulan.","answerTokens":["Keupayaan otak untuk menaakul","dan berfikir secara logik","sebelum mengambil tindakan","dengan sikap positif dan bertanggungjawab"],"distractors":["tanpa memerlukan sebarang pertimbangan","mengikut perasaan marah serta-merta"],"explanation":"Minda yang sihat merujuk kepada keupayaan otak menaakul dan membuat pertimbangan logik sebelum bertindak serta mengamalkan sikap positif, berdikari, penyayang dan bertanggungjawab."},{"type":"mcq","xp":20,"voiceIdKey":"u5-s8","voiceToneLabel":"Uji 4 Tonggak Kepentingan","voiceCaption":"Uji keupayaan mengaitkan kepentingan minda sihat dengan sumbangan kepada masyarakat dan negara.","voiceScript":"[confident] Soalan penutup Unit lima! Antara padanan berikut, manakah kepentingan minda yang sihat khusus kepada tempat kerja dan negara?","prompt":"Manakah padanan yang TEPAT mengenai kepentingan mempunyai minda yang sihat mengikut Gambar foto 7.6?","options":["Tempat kerja: menghasilkan kerja berkualiti dan berdisiplin; Negara: mengamalkan nilai moral serta menjanakan ekonomi negara","Tempat kerja: mengalami sindrom prahaid; Negara: mengurangkan kadar metabolisme pekerja","Keluarga: menjanakan eksport industri berat; Masyarakat: menyebarkan prasangka sesama jiran","Masyarakat: menghalang penyerapan air ginjal; Keluarga: menolak semua kritikan membina"],"correctIndex":0,"explanation":"Di tempat kerja, minda sihat menjalin hubungan baik pekerja-majikan, menghasilkan kerja berkualiti dan berdisiplin; di peringkat negara, ia memupuk nilai moral, cara hidup sihat serta menjanakan ekonomi negara."}]},{"id":"sai7-u6","title":"Unit 6: Cabaran Boss SPM — Sintesis Bab 7","subtitle":"Gabungan Soalan Kertas 1, Praktis Sumatif 7 & Huraian KBAT Kertas 2 (7.1–7.3)","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss 1: Kelenjar Endokrin Sumatif","voiceCaption":"Cabaran Boss pertama menyemak pengenalan kelenjar induk pituitari, tiroid, pankreas dan testis daripada Praktis Sumatif tujuh.","voiceScript":"[excited] Selamat datang ke Cabaran Boss S P M Bab tujuh! Soalan pertama menguji sintesis Praktis Sumatif tujuh: kenal pasti kelenjar induk, hormon tiroksina, punca diabetes melitus dan fungsi testosteron!","prompt":"Sebuah rajah menunjukkan empat kelenjar endokrin: P (bawah serebrum), Q (hadapan trakea), R (belakang perut) dan S (skrotum lelaki). Kombinasi manakah yang BENAR?","options":["P ialah kelenjar induk (pituitari); kekurangan tiroksina Q menyebabkan kretinisme/goiter; kegagalan R merembes insulin mencetuskan diabetes melitus; S merembes testosteron","Q ialah kelenjar induk; kekurangan hormon R menyebabkan diabetes insipidus manakala S merembes progesteron","P merembes adrenalina; Q mengawal penempelan embrio manakala R merembes estrogen","S aktif sejak lahir untuk menghasilkan sperma manakala P terletak di atas ginjal"],"correctIndex":0,"explanation":"Mengikut Praktis Sumatif 7 Soalan 1: P ialah kelenjar pituitari (kelenjar induk), Q ialah tiroid (tiroksina -> kekurangan menyebabkan kretinisme/miksedema/goiter), R ialah pankreas (kurang insulin -> glukosa tinggi -> diabetes melitus) dan S ialah testis (testosteron)."},{"type":"predict","xp":30,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss 2: Diagnosis Imbangan Hormon","voiceCaption":"Ramalkan gabungan hormon yang terjejas pada dua pesakit berdasarkan profil gejala mereka.","voiceScript":"[curious] Soalan Boss kedua menguji kemahiran diagnosis doktor makmal! Pesakit X cepat berpeluh, kurus walaupun kuat makan dan bola matanya menonjol. Pesakit Y pula kerap membuang air kencing dan sentiasa dahaga dengan gula darah normal. Apakah diagnosis bagi X dan Y?","hook":"Gabungkan simptom metabolisme tinggi dan keseimbangan air ginjal untuk membongkar kedua-dua hormon!","scenario":"Dua pesakit diuji di klinik endokrin: Pesakit X mempunyai kadar metabolisme sangat tinggi, leher bengkak dan bola mata menonjol; Pesakit Y menghasilkan urin berlebihan serta sentiasa dahaga walaupun ujian glukosanya normal.","prompt":"Apakah punca ketidakseimbangan hormon bagi Pesakit X dan Pesakit Y?","options":["Pesakit X mengalami kelebihan hormon tiroksina; Pesakit Y mengalami kekurangan hormon antidiuresis (ADH) yang menyebabkan diabetes insipidus","Pesakit X mengalami kekurangan insulin; Pesakit Y mengalami kelebihan hormon pertumbuhan (GH)","Pesakit X mengalami kekurangan tiroksina (miksedema); Pesakit Y mengalami diabetes melitus","Kedua-dua pesakit mengalami kelebihan hormon progesteron dan testosteron"],"correctIndex":0,"proofLabId":"sai7_hormon_balance_sim","proofState":{"tab":"sliders","insulin":100,"tiroksina":185,"gh":100,"adrenalina":30},"explanation":"Tiroksina berlebihan memacu metabolisme tinggi, berpeluh, kurus, leher bengkak dan bola mata menonjol (Pesakit X); kekurangan ADH menghalang penyerapan air di duktus pengumpul ginjal menghasilkan urin berlebihan atau diabetes insipidus (Pesakit Y)."},{"type":"match","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss 3: Padan Silang Subtopik","voiceCaption":"Padankan lima konsep berimpak tinggi merentasi Subtopik tujuh perpuluhan satu hingga tujuh perpuluhan tiga.","voiceScript":"[confident] Cabaran Boss ketiga! Padankan kesemua lima istilah penting merentasi sistem hormon, dadah, kerosakan organ dan minda sihat!","prompt":"Padankan istilah sains Bab 7 berikut dengan huraian paling tepat:","pairs":[{"id":"z1","left":"Akromegali vs Kekerdilan","right":"Kesan hormon pertumbuhan (GH) berlebihan berbanding kekurangan GH"},{"id":"z2","left":"Inhalan (pelarut & gas)","right":"Disedut melalui pernafasan lalu merosakkan otak, peparu dan ginjal"},{"id":"z3","left":"Sirosis hati","right":"Kerosakan hati kronik, berparut, mengeras dan hilang fungsi akibat toksin alkohol"},{"id":"z4","left":"Simptom penarikan","right":"Menggigil, loya, resah dan sedih apabila penagih tidak mengambil dadah"},{"id":"z5","left":"Sindrom prahaid & putus haid","right":"Ketidakseimbangan hormon yang mencetuskan murung dan cepat marah"}],"explanation":"Kelima-lima pasangan ini merangkumi titik wajib peperiksaan SPM daripada Subtopik 7.1, 7.2 dan 7.3."},{"type":"sort","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss 4: Isih Kawalan vs Gangguan","voiceCaption":"Kelaskan enam situasi kepada koordinasi hormon semula jadi yang sihat ataupun gangguan dadah dan alkohol.","voiceScript":"[confident] Cabaran Boss keempat! Bezakan enam perubahan fisiologi dan tingkah laku berikut sama ada tindak balas koordinasi endokrin yang sihat ataupun gangguan dadah dan alkohol!","prompt":"Kelaskan situasi berikut kepada Koordinasi Endokrin Semula Jadi atau Gangguan Dadah & Alkohol:","buckets":[{"id":"endokrin","label":"Koordinasi Endokrin Semula Jadi"},{"id":"gangguan","label":"Gangguan Dadah & Alkohol"}],"items":[{"text":"Adrenalina merangsang jantung dan penukaran glikogen ketika ancaman bahaya","bucketId":"endokrin","note":"Tindak balas 'lawan atau lari' semula jadi untuk menyelamatkan diri."},{"text":"Insulin menurunkan gula darah berlebihan dengan menyimpan glikogen di hati","bucketId":"endokrin","note":"Mekanisme homeostasis normal pankreas."},{"text":"Progesteron mengekalkan ketebalan dinding uterus bagi penempelan embrio","bucketId":"endokrin","note":"Fungsi semula jadi hormon ovari wanita."},{"text":"Halusinogen LSD mengubah laluan impuls otak sehingga melihat objek khayalan","bucketId":"gangguan","note":"Gangguan persepsi berbahaya oleh bahan psikoaktif."},{"text":"Etanol menghalang impuls antara neuron aferen dan interneuron ketika memandu","bucketId":"gangguan","note":"Melambatkan tindakan refleks dan menyebabkan kemalangan."},{"text":"Asid perut berlebihan akibat alkohol menghakis dinding menjadi ulser peptik","bucketId":"gangguan","note":"Kerosakan organ pencernaan akibat toksin alkohol."}],"explanation":"Hormon endokrin menyelaras homeostasis serta keselamatan badan secara terkawal, sedangkan dadah dan alkohol merosakkan neuron, kelenjar endokrin dan organ dalaman."},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss 5: Esei Refleks Alkohol","voiceCaption":"Bina jawapan lengkap Kertas dua menerangkan cara alkohol dan dadah melambatkan tindakan refleks serta pertuturan.","voiceScript":"[curious] Soalan esei Kertas du   /* =========================================================================
   * MAKMAL 2: sai7_hormon_balance_sim
   * Simulator Klinikal Imbangan Hormon (Insulin, Tiroksina, GH, Adrenalina + ADH/Seks)
   * ========================================================================= */
  window.ETUTOR_NOTA_LABS.sai7_hormon_balance_sim = function (mountEl, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "extra" ? "extra" : "sliders";

    var state = {
      insulin: typeof ps.insulin === "number" ? ps.insulin : 100,
      tiroksina: typeof ps.tiroksina === "number" ? ps.tiroksina : 100,
      gh: typeof ps.gh === "number" ? ps.gh : 100,
      adrenalina: typeof ps.adrenalina === "number" ? ps.adrenalina : 20
    };
    var extraKey = ps.extraHormone || "adh_low";

    var extraCases = {
      adh_low: {
        title: "Kekurangan Hormon Antidiuresis (ADH)",
        tag: "DIABETES INSIPIDUS",
        badgeCls: "is-bad",
        gland: "Kelenjar Pituitari",
        mechanism: "Air gagal diserap semula di duktus pengumpul dalam ginjal.",
        symptoms: "Penghasilan urin yang sangat berlebihan serta pesakit sentiasa berasa dahaga.",
        compare: "Beza penting SPM: Diabetes insipidus berpunca daripada kekurangan ADH (air tak diserap ginjal), bukan insulin!"
      },
      adh_high: {
        title: "Hormon Antidiuresis (ADH) Berlebihan",
        tag: "KELEBIHAN ADH",
        badgeCls: "is-warn",
        gland: "Kelenjar Pituitari",
        mechanism: "Terlalu banyak air diserap semula oleh ginjal menyebabkan bendalir badan berlebihan.",
        symptoms: "Pesakit mengalami sakit kepala dan pening.",
        compare: "Imbangan ADH perlu dikawal tepat supaya kepekatan darah dan isi padu air kencing kekal normal."
      },
      prog_low: {
        title: "Kekurangan Hormon Progesteron",
        tag: "RISIKO KEHAMILAN & HAID",
        badgeCls: "is-bad",
        gland: "Ovari",
        mechanism: "Ketebalan dinding uterus tidak dapat dikekalkan dengan stabil untuk penempelan embrio.",
        symptoms: "Masalah kitaran haid, sakit kepala, sembelit dan risiko keguguran kandungan.",
        compare: "Estrogen menyediakan dinding uterus dan ciri seks sekunder; Progesteron mengekalkan ketebalan dinding uterus."
      },
      est_test: {
        title: "Ketidakseimbangan Estrogen & Testosteron",
        tag: "CIRI SEKS SEKUNDER",
        badgeCls: "is-warn",
        gland: "Ovari & Testis (Aktif Selepas Akil Baligh)",
        mechanism: "Rembesan tidak seimbang mengubah ekspresi ciri seks sekunder dan penghasilan gamet.",
        symptoms: "Kurang Testosteron: lambat akil baligh & sperma rendah; Lebih Testosteron: sifat kelelakian pada wanita. Kurang Estrogen: ciri seks wanita terjejas (menopaus, dirawat dengan HRT: EPT atau ET); Lebih Estrogen: sifat keperempuanan pada lelaki.",
        compare: "Rencana Sains: Wanita menopaus (45–55 thn) mengalami penurunan estrogen dan boleh dibantu Terapi Penggantian Hormon (HRT)."
      }
    };

    function computeClinical() {
      // Base blood glucose around 5.0 mmol/L; low insulin raises glucose steeply; adrenaline mobilizes glycogen -> glucose
      var insulinDelta = (100 - state.insulin) * 0.068;
      var adrenBoost = Math.max(0, state.adrenalina - 30) * 0.025;
      var glucose = Math.max(2.1, Math.min(16.5, 5.0 + insulinDelta + adrenBoost));

      // Metabolic rate (%) driven by tiroksina & adrenalina
      var metaPct = Math.round(state.tiroksina * 0.85 + state.adrenalina * 0.45);
      // Heart rate (bpm)
      var hrBpm = Math.round(62 + Math.max(0, state.tiroksina - 100) * 0.28 + state.adrenalina * 0.42);
      // Pupil diameter (mm)
      var pupilMm = (3.2 + (state.adrenalina / 200) * 3.6).toFixed(1);

      var issues = [];
      if (state.insulin < 60) {
        issues.push({ cls: "is-bad", title: "Diabetes Melitus (Kurang Insulin)", text: "Glukosa berlebihan gagal ditukar kepada glikogen di hati; aras glukosa darah melonjak (" + glucose.toFixed(1) + " mmol/L)." });
      } else if (state.insulin > 145) {
        issues.push({ cls: "is-bad", title: "Hipoglisemia (Insulin Berlebihan)", text: "Terlalu banyak glukosa ditukar kepada glikogen -> aras glukosa darah terlalu rendah (" + glucose.toFixed(1) + " mmol/L) & dahaga berlebihan." });
      }

      if (state.tiroksina < 60) {
        issues.push({ cls: "is-warn", title: "Kretinisme / Miksedema / Goiter (Kurang Tiroksina)", text: "Metabolisme rendah, tak tahan sejuk, terbantut fizikal & mental kanak-kanak (kretinisme), kurang tenaga dewasa (miksedema), cenderung gemuk & bengkak tiroid (goiter)." });
      } else if (state.tiroksina > 145) {
        issues.push({ cls: "is-warn", title: "Hipertiroidisme (Tiroksina Berlebihan)", text: "Metabolisme terlalu tinggi, berpeluh & panas, sukar tidur, kuat makan tapi kurus, leher bengkak & bola mata menonjol keluar." });
      }

      if (state.gh < 60) {
        issues.push({ cls: "is-warn", title: "Kekerdilan (Kurang Hormon Pertumbuhan GH)", text: "Pertumbuhan tulang dan otot di peringkat kanak-kanak terbantut menyebabkan saiz tubuh kerdil." });
      } else if (state.gh > 145) {
        issues.push({ cls: "is-warn", title: "Kegergasian / Akromegali (GH Berlebihan)", text: "Pertumbuhan tidak terkawal; menyebabkan kegergasian (kanak-kanak) atau akromegali pada orang dewasa." });
      }

      if (state.adrenalina >= 110) {
        issues.push({ cls: "is-info", title: "Mod Kecemasan 'Lawan atau Lari' (Adrenalina Tinggi)", text: "Jantung mengepam laju membekalkan oksigen & glukosa ke otot, glikogen ditukar kepada glukosa dan saiz anak mata membesar!" });
      }

      if (issues.length === 0) {
        issues.push({ cls: "is-ok", title: "Homeostasis & Sistem Endokrin Seimbang", text: "Kesemua paras hormon berada dalam julat sihat. Glukosa darah (5.0 mmol/L), kadar metabolisme (~94%) dan denyutan jantung (~70 bpm) terkawal rapi." });
      }

      return { glucose: glucose, metaPct: metaPct, hrBpm: hrBpm, pupilMm: pupilMm, issues: issues };
    }

    function applyPreset(name) {
      if (name === "normal") state = { insulin: 100, tiroksina: 100, gh: 100, adrenalina: 20 };
      else if (name === "diabetes") state = { insulin: 20, tiroksina: 100, gh: 100, adrenalina: 20 };
      else if (name === "goiter") state = { insulin: 100, tiroksina: 25, gh: 100, adrenalina: 20 };
      else if (name === "hyper") state = { insulin: 100, tiroksina: 185, gh: 100, adrenalina: 35 };
      else if (name === "akromegali") state = { insulin: 100, tiroksina: 100, gh: 185, adrenalina: 20 };
      else if (name === "ular") state = { insulin: 100, tiroksina: 105, gh: 100, adrenalina: 180 };
    }

    function render() {
      var navHtml =
        '<div class="wf-jucas-pills">' +
          '<button type="button" class="wf-jpill jp-mint" data-hb-tab="sliders" aria-pressed="' + (tab === "sliders") + '">Simulator 4 Hormon Utama</button>' +
          '<button type="button" class="wf-jpill jp-violet" data-hb-tab="extra" aria-pressed="' + (tab === "extra") + '">ADH &amp; Hormon Seks (Menopaus HRT)</button>' +
        "</div>";

      if (tab === "extra") {
        var ec = extraCases[extraKey] || extraCases.adh_low;
        var exBtns = [
          { k: "adh_low", lbl: "ADH Kurang (Diabetes Insipidus)" },
          { k: "adh_high", lbl: "ADH Berlebihan" },
          { k: "prog_low", lbl: "Progesteron Kurang" },
          { k: "est_test", lbl: "Estrogen, Testosteron & HRT" }
        ].map(function (it) {
          return '<button type="button" class="sai7-pill-btn" data-ex-key="' + it.k + '" aria-pressed="' + (extraKey === it.k) + '">' + esc(it.lbl) + "</button>";
        }).join("");

        mountEl.innerHTML =
          navHtml +
          '<div class="sai7-chip-bar">' + exBtns + "</div>" +
          '<div class="sai7-card">' +
            '<span class="sai7-badge ' + ec.badgeCls + '">' + esc(ec.tag) + " • " + esc(ec.gland) + "</span>" +
            "<h4>" + esc(ec.title) + "</h4>" +
            '<p style="margin:0 0 6px;"><strong>Mekanisme:</strong> ' + esc(ec.mechanism) + "</p>" +
            '<p style="margin:0 0 6px;"><strong>Kesan Klinikal:</strong> ' + esc(ec.symptoms) + "</p>" +
            '<div class="lab-callout" style="margin-top:6px;"><strong>Catatan SPM:</strong> ' + esc(ec.compare) + "</div>" +
          "</div>";

        mountEl.querySelectorAll("[data-hb-tab]").forEach(function (b) {
          b.addEventListener("click", function () {
            tab = b.getAttribute("data-hb-tab");
            playSfx("tap");
            if (ctx && ctx.markInteracted) ctx.markInteracted();
            render();
          });
        });
        mountEl.querySelectorAll("[data-ex-key]").forEach(function (b) {
          b.addEventListener("click", function () {
            extraKey = b.getAttribute("data-ex-key");
            playSfx("snap");
            if (ctx && ctx.markInteracted) ctx.markInteracted();
            render();
          });
        });
        return;
      }

      var c = computeClinical();
      var gluRatio = Math.min(1, Math.max(0.05, c.glucose / 16));
      var gluWidth = Math.round(gluRatio * 220);
      var gluCol = c.glucose > 7.8 ? "#ef4444" : (c.glucose < 3.6 ? "#f59e0b" : "#10b981");
      var metaRatio = Math.min(1, Math.max(0.05, c.metaPct / 220));
      var metaWidth = Math.round(metaRatio * 220);
      var metaCol = c.metaPct > 155 ? "#ef4444" : (c.metaPct < 60 ? "#38bdf8" : "#10b981");
      var ghScale = (0.55 + (state.gh / 200) * 0.75).toFixed(2);

      mountEl.innerHTML =

        '<div class="lab-controls">' +
          '<button type="button" class="lab-seg-btn" data-hb-pre="normal">Normal Seimbang</button>' +
          '<button type="button" class="lab-seg-btn" data-hb-pre="diabetes">Diabetes Melitus</button>' +
