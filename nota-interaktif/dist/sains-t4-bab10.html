  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sains-t4-bab10","subject":"Sains","form":4,"chapterNumber":10,"title":"Kimia dalam Perubatan dan Kesihatan","subtitle":"Subtopik 10.1–10.4 KSSM (45 Langkah Bit-by-Bit) — Perubatan Tradisional, Moden & Komplementari, Radikal Bebas, Antioksidan, Eksperimen Pengoksidaan Epal & Produk Kesihatan KKM.","estimatedMinutes":32,"themeAccent":"#0d9488","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Simulasi 3D & Video Interaktif","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":false,"voicePendingElevenLabs":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/sai10-u1.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan konsep kimia perubatan dan kesihatan kamu memang bertaraf ahli farmasi!","combo":"[laughs warmly] Kombo yang hebat! Fakta ubat, antioksidan dan semakan K K M semuanya melekat kemas!","encourage":"[softly] Hampir tepat... mari semak semula ciri kaedah perubatan, mekanisme elektron dan panduan label di bawah.","celebrate":"[excited] Tahniah! Kamu telah berjaya menguasai kesemua empat puluh lima langkah Bab sepuluh!"},"units":[{"id":"sai10-u1","title":"Unit 1: Kaedah Perubatan, Herba Tradisional & Komplementari","subtitle":"Subtopik 10.1 (Bhg. 1) — Kitab Tib, Ciri 3 Kaedah Perubatan, 6 Herba Tradisional & 5 Amalan Komplementari","iconType":"book","iconUrl":"../assets/icons/sai10-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"3 Kaedah Perubatan","voiceCaption":"Tiga kaedah rawatan utama ialah perubatan tradisional, moden dan komplementari dengan Kitab Tib sebagai warisan manuskrip Melayu silam.","voiceScript":"[warm] Selamat datang ke Bab sepuluh, Kimia dalam Perubatan dan Kesihatan! Apabila jatuh sakit, kita boleh memilih antara tiga kaedah rawatan iaitu perubatan tradisional, perubatan moden dan perubatan komplementari. Tahukah kamu masyarakat Melayu silam juga merujuk manuskrip Kitab Tib yang dinamakan sempena karya agung Ibnu Sina!","title":"Kitab Tib & Ciri Perubatan Tradisional, Moden serta Komplementari","acronym":"TR•MO•KO","hook":"Setiap kaedah perubatan saling melengkapi: tradisional berasaskan pengalaman silam, moden melalui ujian klinikal, manakala komplementari menyokong pemulihan holistik!","mediaKey":"sai10_herba_tradisional","summary":"Ubat ialah bahan untuk mengawal kesihatan, merawat atau mencegah penyakit yang mesti diperoleh daripada pengamal bertauliah menerusi tiga pendekatan perubatan utama.","bullets":["Perubatan Tradisional vs Moden: Tradisional (termasuk manuskrip Melayu silam Kitab Tib sempena Al-Qanun Fi Al-Tibb karya Ibnu Sina) menggunakan bahan semula jadi tumbuhan/haiwan, berkos rendah, diwarisi turun-temurun, dibuktikan secara pengalaman serta bertindak lebih perlahan; Moden pula menggunakan ubat sintetik, pembedahan, laser dan radioterapi dengan bukti klinikal pantas walaupun berkos lebih mahal.","Perubatan Komplementari: Pendekatan penjagaan kesihatan holistik (produk semula jadi serta senaman badan dan minda) yang tidak melibatkan pembedahan, jahitan, dadah atau bahan kimia sintetik, serta mempertimbangkan nasihat pengamal moden dan tradisional secara serentak."],"labId":"sai10_perubatan_deck","labTitle":"Kad 3D: 3 Kaedah Perubatan & Kitab Tib","labProps":{"tab":"deck"},"examTip":"Bezakan kata kunci pembuktian dalam Rajah 10.1 dan 10.2: Perubatan Tradisional dibuktikan 'secara pengalaman', manakala Perubatan Moden dibuktikan 'secara klinikal'."},{"type":"sort","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Isih 3 Kaedah Perubatan","voiceCaption":"Kelaskan ciri rawatan antara Perubatan Tradisional, Perubatan Moden dengan Perubatan Komplementari.","voiceScript":"[confident] Jom uji kefahaman ciri tiga kaedah perubatan! Kelaskan enam pernyataan ini kepada Perubatan Tradisional, Moden atau Komplementari.","prompt":"Isihkan ciri rawatan berikut mengikut kaedah perubatannya:","buckets":[{"id":"trad","label":"Perubatan Tradisional"},{"id":"mod","label":"Perubatan Moden"},{"id":"komp","label":"Perubatan Komplementari"}],"items":[{"text":"Rawatan herba semula jadi berkos rendah yang diwarisi turun-temurun dan bertindak perlahan","bucketId":"trad","note":"Ciri asas dalam Rajah 10.1"},{"text":"Pembuktian keberkesanan melalui kepercayaan dan pengalaman orang terdahulu","bucketId":"trad","note":"Tiada ujian makmal klinikal moden"},{"text":"Menggunakan ubat sintetik, pembedahan, rawatan laser dan radioterapi","bucketId":"mod","note":"Kaedah bioperubatan klinikal pantas"},{"text":"Pembuktian keberkesanan secara klinikal yang bertindak pantas tetapi berkos tinggi","bucketId":"mod","note":"Ciri teras dalam Rajah 10.2"},{"text":"Tanpa pembedahan, jahitan atau dadah sintetik tetapi dilakukan bersama rawatan moden","bucketId":"komp","note":"Fokus kesihatan holistik fizikal, mental dan emosi"},{"text":"Mengambil kira pandangan pengamal perubatan moden dan tradisional serentak","bucketId":"komp","note":"Sering membantu pesakit kanser selepas radioterapi"}],"explanation":"Tradisional bergantung pada bahan semula jadi dan pengalaman; Moden menggunakan teknologi klinikal serta ubat sintetik; Komplementari melengkapi rawatan moden secara holistik tanpa pembedahan."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"Ubat Tradisional Tempatan","voiceCaption":"Aloe vera merawat selaran matahari, halia menghilangkan angin badan, bunga raya merawat rambut gugur dan kuinina merawat malaria.","voiceScript":"[warm] Sekarang mari teroka khasiat ubat tradisional daripada tumbuhan tanpa pemprosesan kimia! Gel daun Aloe vera disapu pada kulit terbakar matahari, halia melegakan sengal dan angin badan, ginseng memelihara kesihatan dalam tradisi Cina, daun bunga raya merawat sakit kepala serta keguguran rambut, kulit pokok kuinina merawat malaria dan asam jawa melegakan batuk!","title":"Contoh Ubat & Herba Tradisional (Gambar Foto 10.1)","acronym":"A•G•H•B•K","hook":"Kuinina yang diekstrak daripada kulit pokok Cinchona sp. menjadi penyelamat berjuta-juta pesakit demam malaria!","mediaKey":"sai10_herba_tradisional","summary":"Ubat tradisional diperoleh terus daripada bahagian tumbuhan dan bahan semula jadi tanpa diproses secara kimia di makmal.","bullets":["Aloe vera, Halia & Asam Jawa: Gel lendiran daun Aloe vera disapu pada kulit bagi meredakan kesakitan selaran matahari atau melecur ringan; rizom halia mengurangkan bengkak, sengal badan dan membuang angin; isi buah asam jawa melegakan batuk serta sakit tekak.","Ginseng, Pokok Bunga Raya & Kuinina: Akar ginseng diamalkan untuk menjaga kecergasan badan; ramasan daun bunga raya meredakan sakit kepala dan masalah rambut gugur; manakala kulit pokok Cinchona sp. menghasilkan kuinina untuk merawat penyakit malaria."],"labId":"sai10_perubatan_deck","labTitle":"Peneroka Khasiat Herba Tradisional","labProps":{"tab":"trad","herb":"aloe"},"examTip":"Kaitkan setiap tumbuhan dengan bahagian tepatnya: Aloe vera = lendiran daun (sunburn), Kuinina = kulit pokok Cinchona sp. (malaria), Bunga raya = daun (sakit kepala & gugur rambut)."},{"type":"match","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan 5 Ubat Tradisional","voiceCaption":"Padankan lima bahan ubat tradisional dengan kegunaan perubatannya yang tepat.","voiceScript":"[confident] Uji ingatan Gambar foto sepuluh perpuluhan satu! Padankan kelima-lima ubat tradisional ini dengan penyakit atau simptom yang dirawatnya.","prompt":"Padankan tumbuhan ubat tradisional berikut dengan khasiat tepatnya:","pairs":[{"id":"tr1","left":"Aloe vera (lidah buaya)","right":"Lendiran daun merawat kulit akibat selaran matahari atau benda panas"},{"id":"tr2","left":"Halia","right":"Melegakan bengkak, sengal badan dan membuang angin"},{"id":"tr3","left":"Daun pokok bunga raya","right":"Melegakan sakit kepala dan merawat masalah keguguran rambut"},{"id":"tr4","left":"Kuinina (kulit pokok Cinchona sp.)","right":"Menghasilkan ubat merawat penyakit demam malaria"},{"id":"tr5","left":"Ginseng & Asam jawa","right":"Memelihara kesihatan badan (ginseng) dan melegakan batuk (asam jawa)"}],"explanation":"Kesemua bahan tradisional ini digunakan dalam keadaan semula jadi tanpa tindak balas sintesis kimia makmal."},{"type":"predict","xp":20,"voiceIdKey":"u1-s5","voiceToneLabel":"Ramal Kes Selaran Matahari","voiceCaption":"Selesaikan soalan Praktis Formatif 10.1 No. 3 mengenai rawatan tradisional untuk kulit perit Lai Yee.","voiceScript":"[curious] Cuba selesaikan situasi Praktis Formatif sepuluh perpuluhan satu! Selepas bercuti di Pulau Perhentian, kulit Lai Yee menjadi merah dan berasa perit akibat selaran matahari. Tumbuhan tradisional manakah patut disapu pada kulitnya?","hook":"Pilih bahagian tumbuhan yang mempunyai lendiran penyejuk untuk melegakan keradangan kulit terbakar sinaran matahari!","scenario":"Lai Yee pulang daripada percutian pantai di Pulau Perhentian dan mendapati kulit lengannya kemerahan serta perit akibat terdedah terik matahari.","prompt":"Apakah rawatan tradisional paling sesuai membantu meredakan keadaan kulit Lai Yee tersebut?","options":["Menyapukan gel lendiran daripada daun Aloe vera (lidah buaya) untuk menyejukkan dan melegakan sakit selaran matahari","Membalut lengan dengan kulit pokok Cinchona sp. yang mengandungi kuinina","Menggosokkan serbuk ginseng kering pada kulit yang melecur","Menyapu ekstrak halia panas bagi menambah angin dalam kulit"],"correctIndex":0,"proofLabId":"sai10_perubatan_deck","proofState":{"tab":"trad","herb":"aloe"},"explanation":"Praktis Formatif 10.1 No. 3: Lendiran gel daripada daun Aloe vera (lidah buaya) disapu terus pada kulit untuk mengurangkan kesakitan serta melegakan kulit akibat selaran matahari (sunburn) atau terkena benda panas."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Bina Definisi Komplementari","voiceCaption":"Susun definisi serta peranan perubatan komplementari bersama rawatan moden.","voiceScript":"[curious] Susun frasa berikut bagi melengkapkan maksud serta fungsi utama perubatan komplementari mengikut skema K S S M!","prompt":"Susun blok menerangkan konsep Perubatan Komplementari:","hint":"Mulakan dengan perubatan komplementari sebagai rawatan tambahan...","answerTokens":["Perubatan komplementari ialah rawatan tambahan","yang dilakukan bersama perubatan moden","secara holistik merangkumi fizikal dan emosi","tanpa pembedahan atau bahan sintetik kimia"],"distractors":["menggantikan semua pembedahan kecemasan hospital","menggunakan dadah penenang berdos tinggi"],"explanation":"Perubatan komplementari melengkapkan rawatan moden dari aspek fizikal, mental dan emosi tanpa menggunakan pembedahan, jahitan atau dadah sintetik."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s7","voiceToneLabel":"5 Amalan Komplementari","voiceCaption":"Lima amalan perubatan komplementari ialah akupunktur, kiropraktik, urutan tradisional, homeopati dan terapi herba.","voiceScript":"[warm] Mari kenali lima amalan perubatan komplementari yang popular di Malaysia! Akupunktur menggunakan jarum steril merangsang sistem saraf, kiropraktik membetulkan kedudukan tulang dengan tangan, urutan memanipulasi tisu lembut, homeopati menguatkan daya tahan badan melawan penyakit, manakala terapi herba memanfaatkan khasiat tumbuhan tanpa dadah berbahaya!","title":"5 Amalan Perubatan Komplementari (Gambar Foto 10.3)","acronym":"A•K•U•H•T","hook":"Perbezaan utama Homeopati: ubatnya TIDAK membunuh kuman secara terus seperti antibiotik, sebaliknya merangsang keupayaan tubuh sendiri melawan penyakit!","mediaKey":"sai10_komplementari","summary":"Amalan perubatan komplementari merawat keresahan, sakit otot, sakit sendi dan memulihkan keseimbangan pesakit di samping rawatan hospital.","bullets":["Akupunktur, Kiropraktik & Urutan Tradisional: Akupunktur memasukkan jarum steril ke titik kulit bagi merangsang saraf meredakan sakit; Kiropraktik membetulkan semula kedudukan tulang menggunakan kemahiran tangan (sakit belakang, leher, sendi & sukan); Urutan memanipulasi tisu lembut dengan tangan, jari dan penumbuk bagi melegakan ketegangan otot, keletihan, keresahan serta masalah urat saraf.","Homeopati & Terapi Herba: Homeopati memberi ubat mengikut gejala (demam, batuk, sakit) untuk menguatkan keupayaan tubuh melawan penyakit (bukan membunuh kuman terus); Terapi herba memanfaatkan tumbuhan berkhasiat yang diyakini kurang kesan sampingan serta bebas dadah memudaratkan."],"labId":"sai10_perubatan_deck","labTitle":"Teroka 5 Amalan Komplementari","labProps":{"tab":"komp","komp":"akupunktur"},"examTip":"Untuk Praktis Sumatif 10 No. 4 (kaedah urutan), wajib sertakan: 'memanipulasi tisu lembut badan menggunakan tangan, jari dan penumbuk' dan kesannya ('melegakan keresahan, kesakitan, keletihan, ketegangan otot & urat saraf')."},{"type":"mcq","xp":25,"voiceIdKey":"u1-s8","voiceToneLabel":"Cabaran Unit 1: Komplementari","voiceCaption":"Uji pemahaman mekanisme homeopati, kiropraktik dan akupunktur dalam kaedah komplementari.","voiceScript":"[excited] Uji penguasaan Unit satu! Seorang pemain badminton mengalami kecederaan tulang belakang dan sakit otot leher serta mahu mengelakkan ubat sintetik atau pembedahan. Kaedah komplementari manakah tepat?","prompt":"Manakah padanan kaedah komplementari dan mekanismenya yang PALING tepat?","options":["Akupunktur menggunakan tekanan penumbuk untuk menjajarkan semula tulang belakang yang terkehel","Homeopati menyuntik antibiotik penisilin berdos tinggi bagi membunuh semua bakteria usus","Kiropraktik menggunakan kemahiran tangan ahli kiropraktor tanpa ubat untuk membetulkan kedudukan tulang belakang, leher dan sendi","Urutan tradisional melibatkan jahitan kulit dan pembedahan laser pada urat saraf"],"correctIndex":2,"explanation":"Kiropraktik tidak menggunakan sebarang ubat atau pembedahan, sebaliknya menggunakan kemahiran tangan membetulkan semula kedudukan tulang bagi merawat sakit belakang, leher, sendi dan kecederaan sukan."}]},{"id":"sai10-u2","title":"Unit 2: 3 Kelas Ubat Moden, Jadual 10.1 & Salah Guna Ubat","subtitle":"Subtopik 10.1 (Bhg. 2) — Analgesik, Antibiotik (+ Kerintangan Bakteria), Psikoteraputik, Buatan Manusia vs Semula Jadi & Rajah 10.4","iconType":"scale","iconUrl":"../assets/icons/sai10-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"3 Jenis Ubat Moden","voiceCaption":"Ubat moden dibahagikan kepada tiga kelas iaitu analgesik, antibiotik yang wajib dihabiskan dosnya, serta psikoteraputik bagi rawatan psikiatrik.","voiceScript":"[warm] Mari dalami tiga kelas utama ubat moden buatan makmal dalam bentuk pil, kapsul, pasta atau larutan! Analgesik melegakan kesakitan seperti parasetamol dan aspirin; Antibiotik seperti penisilin membunuh bakteria dan wajib dihabiskan dosnya; manakala Psikoteraputik merawat pesakit mental menerusi stimulan, antidepresan serta antipsikotik!","title":"3 Kelas Ubat Moden: Analgesik, Antibiotik & Psikoteraputik","acronym":"A•A•P","hook":"Jangan berhenti makan antibiotik walaupun demam sudah kebah pada hari ketiga — bakteria separa tahan akan membiak menjadi bakteria rintang antibiotik!","mediaKey":"sai10_ubat_moden","summary":"Ubat moden dikelaskan kepada tiga kumpulan utama berdasarkan fungsi klinikalnya dan mesti diambil mengikut preskripsi doktor serta bimbingan ahli farmasi.","bullets":["Analgesik & Antibiotik: Analgesik (aspirin, parasetamol, kodeina) berfungsi melegakan kesakitan dan demam; Antibiotik (penisilin, streptomisin daripada mikroorganisma atau sintesis kimia) membunuh atau menghalang pertumbuhan bakteria (cth. tibi, sifilis) dan wajib dihabiskan mengikut dos agar bakteria terhapus sepenuhnya tanpa kerintangan.","Psikoteraputik (Merawat Pesakit Psikiatrik Mengikut Dos Doktor): Terbahagi kepada Stimulan (cth. amfetamina — mengaktifkan kegiatan otak, badan dan perasaan), Antidepresan (cth. imipramin, amitriptilin — mengawal kemurungan), dan Antipsikotik (cth. trankuiliser, barbiturat, haloperidol — ubat penenang)."],"labId":"sai10_perubatan_deck","labTitle":"Simulator Ubat Moden & Antibiotik","labProps":{"tab":"antibiotik","modClass":"antibiotik","completedCourse":true},"examTip":"Dalam soalan esei Kertas 2, apabila ditanya contoh psikoteraputik, nyatakan sekali ketiga-tiga subkelasnya (Stimulan, Antidepresan, Antipsikotik) beserta satu contoh bahan bagi setiap satu!"},{"type":"match","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Padan Kelas Ubat Moden","voiceCaption":"Padankan kelas ubat moden dan subkelas psikoteraputik dengan contoh serta fungsinya.","voiceScript":"[confident] Uji ketajaman ingatan kamu terhadap tiga kelas ubat moden dan tiga subkelas psikoteraputik! Padankan setiap jenis ubat dengan contoh tepatnya.","prompt":"Padankan jenis ubat moden berikut dengan contoh bahan dan fungsinya:","pairs":[{"id":"md1","left":"Analgesik (melegakan kesakitan)","right":"Aspirin, parasetamol dan kodeina"},{"id":"md2","left":"Antibiotik (hapuskan bakteria berjangkit)","right":"Penisilin dan streptomisin"},{"id":"md3","left":"Stimulan (aktifkan otak dan badan)","right":"Amfetamina"},{"id":"md4","left":"Antidepresan (kawal kemurungan)","right":"Imipramin dan amitriptilin"},{"id":"md5","left":"Antipsikotik (ubat penenang psikiatrik)","right":"Trankuiliser, barbiturat dan haloperidol"}],"explanation":"Aspirin/parasetamol/kodeina ialah analgesik; penisilin/streptomisin ialah antibiotik; manakala stimulan, antidepresan dan antipsikotik ialah subkelas ubat psikoteraputik."},{"type":"predict","xp":20,"voiceIdKey":"u2-s3","voiceToneLabel":"Ramal Kesan Henti Antibiotik","voiceCaption":"Ramalkan akibat yang berlaku apabila pesakit berhenti mengambil antibiotik pada hari ketiga sebaik gejala demam hilang.","voiceScript":"[curious] Cuba ramalkan! Doktor membekalkan antibiotik penisilin untuk tujuh hari, tetapi pesakit berhenti memakannya pada hari ketiga kerana berasa sudah sihat. Apakah yang berlaku kepada bakteria di dalam badannya?","hook":"Lihat perbezaan koloni bakteria dalam Simulator Antibiotik apabila kursus dos tidak dihabiskan!","scenario":"Seorang pesakit jangkitan bakteria menghentikan pengambilan tablet penisilin selepas 3 hari walaupun preskripsi doktor mengarahkan supaya dihabiskan selama 7 hari.","prompt":"Apakah kesan jangka pendek dan jangka panjang daripada tindakan menghentikan antibiotik sebelum tamat tempoh dos?","options":["Antibiotik bertukar menjadi vitamin penenang yang menguatkan sistem saraf","Sebahagian bakteria yang masih terselamat terus hidup, membiak semula dan membina kerintangan terhadap antibiotik sehingga penyakit sukar dirawat","Semua bakteria mati secara automatik kerana separuh dos sudah mencukupi","Pesakit serta-merta menjadi kebal terhadap semua penyakit virus seperti selesema"],"correctIndex":1,"proofLabId":"sai10_perubatan_deck","proofState":{"tab":"antibiotik","modClass":"antibiotik","completedCourse":false},"explanation":"Antibiotik wajib dihabiskan mengikut tempoh dos doktor supaya semua bakteria patogen terhapus 100%; jika dihentikan awal, bakteria terselamat akan membiak dan membina kerintangan antibiotik."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s4","voiceToneLabel":"Jadual 10.1 & Salah Guna","voiceCaption":"Jadual 10.1 membandingkan ubatan buatan manusia dengan ubatan bahan semula jadi, manakala Rajah 10.4 merumuskan empat kesan penyalahgunaan ubat.","voiceScript":"[warm] Mengapakah ubat buatan manusia di farmasi mempunyai struktur molekul hampir sama dengan bahan aktif herba tradisional? Kerana saintis meniru bahan aktif semula jadi dan mengujinya secara klinikal! Namun ingat, kedua-dua ubat buatan dan semula jadi tetap berisiko kesan sampingan jika diambil tanpa nasihat doktor atau melanggar dos!","title":"Jadual 10.1 (Buatan vs Semula Jadi) & Kesan Salah Guna Ubat","acronym":"J•A•S•U","hook":"Ramai tersilap sangka ubat semula jadi bebas risiko 100% — hakikatnya Jadual 10.1 menegaskan kedua-duanya tetap berisiko jika salah dos!","mediaKey":"sai10_ubat_moden","summary":"Ubat sintetik dihasilkan dengan struktur molekul sepadan bahan aktif semula jadi melalui ujian klinikal, manakala penyalahgunaan ubat membawa empat kesan berbahaya.","bullets":["Buatan Manusia vs Semula Jadi (Jadual 10.1): Ubat buatan (cth. pil Vitamin C) dihasilkan di makmal dengan bukti ujian klinikal dan diambil hingga sembuh atau berterusan bagi penyakit kronik; ubat semula jadi (cth. Vitamin C buah) dibuktikan secara pengalaman dan diamalkan berterusan dalam jangka panjang — kedua-duanya berisiko kesan sampingan tanpa nasihat doktor atau salah dos.","4 Kesan Penyalahgunaan Ubat (Rajah 10.4): Mengambil ubat melebihi dos, tidak mengikut umur, tanpa preskripsi atau bukan untuk merawat penyakit menyebabkan (1) kematian, (2) kesan sampingan teruk (alahan, muntah, sakit kepala, demam, pengsan), (3) ubat kurang berkesan dan penyakit tidak sembuh, serta (4) ketagihan ubat seperti ubat batuk."],"labId":"sai10_perubatan_deck","labTitle":"Kad Jadual 10.1 & Risiko Salah Guna","labProps":{"tab":"deck"},"examTip":"Soalan Jadual 10.1: Persamaan antara ubat buatan manusia dan ubat semula jadi ialah kedua-duanya berisiko mendapat kesan sampingan jika digunakan tanpa nasihat doktor atau tidak mengikut dos betul!"},{"type":"sort","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Isih Buatan vs Semula Jadi","voiceCaption":"Kelaskan ciri berikut antara ubatan buatan manusia dengan ubatan bahan semula jadi berdasarkan Jadual 10.1.","voiceScript":"[confident] Kelaskan enam pernyataan daripada Jadual sepuluh perpuluhan satu berikut sama ada merujuk ubat buatan manusia ataupun ubat daripada bahan semula jadi!","prompt":"Isihkan ciri Jadual 10.1 berikut antara Ubat Buatan Manusia atau Ubat Semula Jadi:","buckets":[{"id":"buatan","label":"Ubat Buatan Manusia (Sintetik)"},{"id":"semula","label":"Ubat daripada Bahan Semula Jadi"}],"items":[{"text":"Dihasilkan di makmal dan dikomersialkan besar-besaran seperti pil Vitamin C di farmasi","bucketId":"buatan","note":"Pengeluaran industri farmaseutikal moden"},{"text":"Bukti penyembuhannya disahkan melalui ujian klinikal saintifik","bucketId":"buatan","note":"Ujian makmal sebelum diluluskan kepada pesakit"},{"text":"Diambil secara berterusan bagi penyakit kronik atau dihentikan apabila telah sembuh","bucketId":"buatan","note":"Kadar tindakan molekul aktifnya konsisten"},{"text":"Diperoleh terus daripada tumbuhan dan haiwan seperti Vitamin C dalam buah sitrus","bucketId":"semula","note":"Tidak disintesis secara buatan di makmal"},{"text":"Perlu diamalkan secara berterusan dalam jangka masa lama supaya berkesan","bucketId":"semula","note":"Kepekatan bahan aktif lebih rendah dan bertindak perlahan"},{"text":"Bukti penyembuhan diasaskan melalui kepercayaan dan pengalaman orang terdahulu","bucketId":"semula","note":"Diwarisi daripada generasi terdahulu"}],"explanation":"Jadual 10.1 membezakan kaedah penghasilan, tempoh pengambilan dan jenis pembuktian kedua-dua asal ubat, sambil mengingatkan risiko kesan sampingan jika salah dos."},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s6","voiceToneLabel":"Susun Risiko Salah Guna Ubat","voiceCaption":"Susun blok perkataan menerangkan kesan penyalahgunaan ubat tidak mengikut preskripsi doktor.","voiceScript":"[curious] Susun frasa berikut bagi membentuk rumusan lengkap tentang akibat penyalahgunaan ubat mengikut Rajah sepuluh perpuluhan empat!","prompt":"Susun blok menerangkan akibat penyalahgunaan ubat-ubatan:","hint":"Mulakan dengan pengambilan ubat tidak mengikut preskripsi...","answerTokens":["Pengambilan ubat tanpa preskripsi doktor","menyebabkan kesan sampingan teruk seperti alahan","menjadikan ubat kurang berkesan","serta risiko ketagihan dan kematian"],"distractors":["menjamin penyembuhan penyakit dalam satu jam","menghalang semua jangkitan virus secara kekal"],"explanation":"Penyalahgunaan ubat (salah dos, salah peringkat umur atau tanpa arahan doktor) mencetuskan ketagihan, alahan teruk, ubat hilang keberkesanan hingga membawa maut."},{"type":"predict","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Ramal Rawatan Pesakit Psikiatrik","voiceCaption":"Ramalkan kelas ubat psikoteraputik tepat serta amaran keselamatan bagi pesakit kemurungan melampau.","voiceScript":"[curious] Seorang pesakit mengalami kemurungan berpanjangan dan telah dirujuk kepada pakar psikiatri. Kelas ubat moden manakah yang sesuai dipreskripsi serta mengapakah dosnya dikawal ketat?","hook":"Bezakan antara Antidepresan (kemurungan), Stimulan (aktif) dan Antipsikotik (penenang)!","scenario":"Doktor pakar psikiatri merawat seorang pesakit kemurungan klinikal manakala ahli farmasi menyediakan ubat mengikut sukatan preskripsi tepat.","prompt":"Ubat manakah dan peraturan penggunaan manakah yang PALING tepat untuk pesakit tersebut?","options":["Antibiotik streptomisin kerana kemurungan disebabkan jangkitan bakteria paru-paru","Ubat psikoteraputik jenis antidepresan seperti imipramin atau amitriptilin, dan wajib diambil tepat mengikut dos doktor kerana ia mengubah perasaan, pemikiran serta kelakuan","Analgesik parasetamol berdos berganda supaya pesakit tidur sepanjang hari","Stimulan amfetamina secara bebas tanpa nasihat doktor atau ahli farmasi"],"correctIndex":1,"proofLabId":"sai10_perubatan_deck","proofState":{"tab":"antibiotik","modClass":"psikoteraputik"},"explanation":"Antidepresan (imipramin, amitriptilin) ialah ubat psikoteraputik untuk mengawal kemurungan dan mesti dipatuhi dosnya kerana memberi kesan langsung kepada pemikiran, emosi dan tingkah laku."},{"type":"mcq","xp":25,"voiceIdKey":"u2-s8","voiceToneLabel":"Cabaran Unit 2: Farmasi & Dos","voiceCaption":"Uji kefahaman peranan ahli farmasi, struktur molekul ubat moden dan bahaya salah guna ubat batuk.","voiceScript":"[excited] Uji penguasaan Unit dua! Mengapakah ubat batuk tidak boleh diminum secara berlebihan sesuka hati dan apakah peranan ahli farmasi dalam rangkaian rawatan?","prompt":"Pernyataan manakah TEPAT mengenai penyediaan ubat moden dan kesan penyalahgunaan ubat batuk?","options":["Ubat batuk boleh diminum melebihi dos kerana ia merupakan ubat tradisional tanpa kesan ketagihan","Ahli farmasi hanya melakukan pembedahan laser manakala doktor mengagihkan herba mentah","Ahli farmasi terlatih dalam farmakologi menyediakan ubat secara selamat, dan pengambilan ubat batuk berlebihan tanpa preskripsi boleh menyebabkan ketagihan serta kesan sampingan teruk","Ubat buatan manusia sentiasa lebih lambat bertindak berbanding ubat tradisional turun-temurun"],"correctIndex":2,"explanation":"Kerjaya Sains (Ahli Farmasi) melatih pakar farmakologi menyediakan ubat tepat, manakala Rajah 10.4 menegaskan penyalahgunaan ubat batuk berlebihan mencetuskan ketagihan serta kesan sampingan berbahaya."}]},{"id":"sai10-u3","title":"Unit 3: Radikal Bebas & Mekanisme Bahan Antioksidan","subtitle":"Subtopik 10.2 & 10.3 (Bhg. 1) — Definisi Radikal Bebas, Faktor Dalaman & Luaran, Video 3D Antioksidan & 5 Contoh Makanan","iconType":"atom","iconUrl":"../assets/icons/sai10-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Radikal Bebas & Kesihatan","voiceCaption":"Radikal bebas ialah atom atau molekul yang kekurangan satu elektron lalu menjadi tidak stabil, reaktif dan menyerang molekul sel termasuk DNA.","voiceScript":"[warm] Pernah dengar istilah radikal bebas? Dalam Subtopik sepuluh perpuluhan dua, radikal bebas ialah atom atau molekul yang kekurangan satu elektron pada petala luarnya! Keadaan ini menjadikannya sangat tidak stabil, reaktif dan cenderung merampas elektron daripada sel sihat serta D N A lalu menyebabkan mutasi, kanser, penyakit jantung dan penuaan awal!","title":"Radikal Bebas: Punca Dalaman, Punca Luaran & Ancaman terhadap Sel","acronym":"R•D•L•K","hook":"Kekurangan satu elektron mencetuskan tindak balas berantai — seperti pencuri yang mencuri elektron jiran, menjadikan jiran itu pencuri baharu!","mediaKey":"sai10_radikal_bebas","summary":"Proses pengoksidaan (kehilangan elektron) membentuk radikal bebas menerusi faktor dalaman badan dan faktor luaran alam sekitar.","bullets":["Definisi & Faktor Pembentukan: Radikal bebas ialah atom atau molekul kurang satu elektron yang tidak stabil, reaktif dan menyerang molekul lain; terbentuk daripada faktor dalaman (metabolisme di mitokondria dan keradangan sel darah putih) serta faktor luaran (asap rokok, sinar ultraungu UV, pencemaran udara, sisa toksik dan sinaran mengion).","Kesan kepada Kesihatan: Radikal bebas merampas elektron daripada DNA menghasilkan bahan karsinogen (mutasi dan kanser), menyebabkan penyakit kardiovaskular serta ketidaksuburan, merosakkan buah pinggang, hati dan peparu, serta mempercepat penuaan awal (wajah berkedut, rambut beruban)."],"labId":"sai10_radikal_antioksidan_sim","labTitle":"Simulator Radikal Bebas & DNA 60fps","labProps":{"tab":"sim","internal":40,"smoke":70,"antioxidant":20},"examTip":"Dua kata kunci definisi wajib SPM untuk radikal bebas: 'atom atau molekul yang kekurangan satu elektron' dan 'tidak stabil, reaktif serta cenderung menyerang atom atau molekul lain'."},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Faktor Dalaman vs Luaran","voiceCaption":"Kelaskan punca pembentukan radikal bebas antara Faktor Dalaman (Rajah 10.5) dengan Faktor Luaran (Rajah 10.6).","voiceScript":"[confident] Kelaskan enam punca pembentukan radikal bebas berikut kepada Faktor Dalaman badan mengikut Rajah sepuluh perpuluhan lima atau Faktor Luaran persekitaran mengikut Rajah sepuluh perpuluhan enam!","prompt":"Isihkan punca pembentukan radikal bebas berikut mengikut kategorinya:","buckets":[{"id":"dalam","label":"Faktor Dalaman (Rajah 10.5)"},{"id":"luar","label":"Faktor Luaran (Rajah 10.6)"}],"items":[{"text":"Proses metabolisme tenaga di dalam mitokondria sel","bucketId":"dalam","note":"Pengoksidaan respirasi sel semula jadi"},{"text":"Tindak balas keradangan oleh sel darah putih melawan jangkitan","bucketId":"dalam","note":"Faktor dalaman badan manusia"},{"text":"Asap rokok yang disedut masuk ke peparu","bucketId":"luar","note":"Punca luaran utama merosakkan tisu peparu"},{"text":"Sinaran ultraungu (UV) daripada cahaya matahari terik","bucketId":"luar","note":"Mencetuskan penuaan kulit dan mutasi sel"},{"text":"Pencemaran udara, asap kilang dan sisa toksik","bucketId":"luar","note":"Pencemar kimia daripada persekitaran"},{"text":"Pendedahan kepada sinaran mengion (radiasi)","bucketId":"luar","note":"Mengionkan molekul sel menghasilkan radikal bebas"}],"explanation":"Hanya metabolisme dan keradangan tergolong sebagai faktor dalaman (Rajah 10.5), manakala asap rokok, UV, pencemaran udara, sisa toksik dan sinaran mengion ialah faktor luaran (Rajah 10.6)."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Tindakan Bahan Antioksidan","voiceCaption":"Bahan antioksidan menderma elektron kepada radikal bebas untuk membentuk sebatian stabil dan menghentikan pengoksidaan tanpa menjadi radikal bebas baharu.","voiceScript":"[warm] Bagaimanakah badan kita melawan serangan radikal bebas? Di sinilah hero Subtopik sepuluh perpuluhan tiga iaitu Bahan Antioksidan bertindak! Tonton video animasi tiga D bagaimana molekul antioksidan menderma elektron kepada radikal bebas yang kelaparan elektron, menukarkannya menjadi sebatian stabil dan melindungi D N A serta sel tubuh kita!","title":"Bahan Antioksidan: Perisai Penderma Elektron Menentang Pengoksidaan","acronym":"M•D•S•S","hook":"Keupayaan badan menghasilkan antioksidan sendiri semakin berkurang apabila usia meningkat — sebab itulah pemakanan berantioksidan amat kritikal!","mediaKey":"sai10_antioksidan_sel","summary":"Bahan antioksidan ialah sebatian kimia yang diperlukan oleh badan untuk melambatkan atau menghentikan proses pengoksidaan dengan menstabilkan radikal bebas.","bullets":["Definisi & Peranan Pertahanan: Bahan antioksidan melambatkan atau menghentikan pengoksidaan sel dengan bertindak sebagai barisan pertahanan melindungi DNA dan organ daripada risiko penyakit (penghasilannya oleh badan berkurang apabila usia meningkat, maka perlu diambil daripada makanan atau sintesis kimia).","Mekanisme Pendermaan Elektron: Apabila bahan antioksidan bertindak balas dengan radikal bebas, ia menderma elektron kepada radikal bebas (tanpa bertukar menjadi radikal bebas baharu yang berbahaya) lalu membentuk sebatian yang lebih stabil dan memutuskan tindak balas berantai pengoksidaan."],"labId":"sai10_radikal_antioksidan_sim","labTitle":"Simulator Perisai Antioksidan 60fps","labProps":{"tab":"sim","internal":30,"smoke":45,"antioxidant":85},"examTip":"Skema Praktis Sumatif 10 No. 3a: Apabila bahan antioksidan bertindak balas dengan radikal bebas, sebatian yang lebih stabil terhasil dan seterusnya menghentikan proses pengoksidaan!","videoClip":{"src":"../assets/sains-t4-bab10/video/sai10_video_antioxidant.mp4","posterKey":"sai10_antioksidan_sel","caption":"Animasi 3D: Molekul antioksidan menderma elektron untuk meneutralkan radikal bebas yang mengancam sel"}},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Tekanan Oksidatif Sel","voiceCaption":"Ramalkan keadaan integriti DNA sel jika individu terdedah asap rokok serta sinar UV tinggi tetapi kurang mengambil antioksidan.","voiceScript":"[curious] Cuba ramalkan! Jika seorang individu terdedah teruk kepada asap rokok dan sinaran U V tetapi dietnya sangat kekurangan bahan antioksidan, apakah kesannya terhadap molekul D N A dan tisu selnya?","hook":"Uji kombinasi slider Faktor Luaran tinggi dan Antioksidan rendah dalam Simulator Perisai Antioksidan!","scenario":"Seorang pekerja terdedah kepada asap rokok serta sinaran UV berpanjangan (faktor luaran 85%), namun hanya mengambil sedikit buah dan sayur berantioksidan (bekalan antioksidan 10%).","prompt":"Apakah kesan biokimia yang paling tepat berlaku pada peringkat sel?","options":["Radikal bebas berlebihan merampas elektron daripada molekul DNA sehingga menyebabkan kerosakan DNA, mutasi, risiko kanser, penyakit kardiovaskular dan penuaan awal","Antioksidan yang sedikit akan bertukar menjadi radikal bebas super untuk membaik pulih DNA","Asap rokok meneutralkan kesemua radikal bebas hasil metabolisme mitokondria","Sel badan membina lapisan sulfur pelindung secara automatik"],"correctIndex":0,"proofLabId":"sai10_radikal_antioksidan_sim","proofState":{"tab":"sim","internal":45,"smoke":85,"antioxidant":10},"explanation":"Apabila penghasilan radikal bebas melampaui keupayaan bekalan antioksidan, radikal bebas menyerang dan mengambil elektron daripada DNA, lalu mencetuskan mutasi, karsinogen kanser serta penuaan awal."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s5","voiceToneLabel":"5 Contoh Antioksidan Makanan","voiceCaption":"Lima antioksidan semula jadi ialah beta karotena, lutein, likopena, Vitamin C (asid askorbik) dan Vitamin E (alfa-tokoferol).","voiceScript":"[warm] Apakah lima contoh bahan antioksidan utama dalam makanan kita? Beta karotena dalam lobak merah dan mangga, Lutein dalam bayam dan brokoli untuk kesihatan mata, Likopena dalam tomato, betik dan tembikai, Vitamin C atau asid askorbik dalam sitrus dan strawberi, serta Vitamin E atau alfa-tokoferol dalam minyak sawit dan kekacang!","title":"5 Bahan Antioksidan Semula Jadi dalam Makanan (Gambar Foto 10.4)","acronym":"B•L•L•C•E","hook":"Nama saintifik wajib diingat: Vitamin C = Asid askorbik (larut air); Vitamin E = Alfa-tokoferol (larut dalam minyak/lemak)!","mediaKey":"sai10_antioksidan_makanan","summary":"Warna semula jadi buah-buahan, sayur-sayuran dan minyak tumbuhan mencerminkan kepelbagaian sebatian antioksidan yang melengkapi pertahanan badan.","bullets":["Beta Karotena, Lutein & Likopena: Beta karotena dalam makanan merah/kuning/jingga (lobak merah, mangga, ubi keledek, labu, aprikot); Lutein dalam sayur berdaun hijau untuk mata sihat (bayam, kubis, brokoli); Likopena dalam betik, jambu batu merah, tembikai, tomato, aprikot, limau gedang dan oren.","Vitamin C (Asid Askorbik) & Vitamin E (Alfa-Tokoferol): Vitamin C larut air terdapat dalam buah sitrus, kiwi, strawberi, kranberi, lada hijau, bayam, brokoli dan bijirin; Vitamin E pula terkandung dalam minyak kelapa sawit, minyak germa gandum, minyak jagung, minyak kacang soya, kekacang dan mangga."],"labId":"sai10_radikal_antioksidan_sim","labTitle":"Katalog 5 Antioksidan Makanan","labProps":{"tab":"makanan","food":"betakarotena"},"examTip":"Praktis Sumatif 10 No. 3c kerap meminta tiga bahan antioksidan bersama contoh makanan semula jadinya — pilih gabungan berbeza seperti Lutein (bayam/brokoli), Likopena (tomato/betik) dan Beta karotena (lobak merah/mangga)."},{"type":"match","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Padan 5 Antioksidan Makanan","voiceCaption":"Padankan kesemua lima bahan antioksidan makanan dengan contoh buah, sayur atau minyaknya yang tepat.","voiceScript":"[confident] Uji ingatan Foto sepuluh perpuluhan empat! Padankan kesemua lima bahan antioksidan ini dengan contoh makanannya yang tepat.","prompt":"Padankan bahan antioksidan berikut dengan makanan semula jadinya:","pairs":[{"id":"ao1","left":"Beta karotena","right":"Lobak merah, mangga, labu dan ubi keledek"},{"id":"ao2","left":"Lutein (kesihatan mata)","right":"Sayur berdaun hijau seperti bayam, kubis dan brokoli"},{"id":"ao3","left":"Likopena","right":"Tomato, betik, jambu batu merah dan tembikai"},{"id":"ao4","left":"Vitamin C (asid askorbik)","right":"Buah sitrus, kiwi, strawberi dan lada hijau"},{"id":"ao5","left":"Vitamin E (alfa-tokoferol)","right":"Minyak kelapa sawit, minyak germa gandum dan kekacang"}],"explanation":"Setiap kumpulan pigmen dan vitamin (karotenoid, asid askorbik dan tokoferol) datang daripada makanan harian berwarna terang, hijau serta minyak tumbuhan."},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Bina Ayat Tindakan Antioksidan","voiceCaption":"Susun mekanisme molekul bagaimana bahan antioksidan meneutralkan radikal bebas.","voiceScript":"[curious] Susun blok frasa berikut menjadi penjelasan tepat Kertas dua tentang tindakan bahan antioksidan terhadap radikal bebas!","prompt":"Susun blok membentuk penjelasan mekanisme Bahan Antioksidan:","hint":"Mulakan dengan bahan antioksidan menderma elektron...","answerTokens":["Bahan antioksidan menderma elektron","kepada radikal bebas yang tidak stabil","untuk menghasilkan sebatian yang lebih stabil","lalu menghentikan proses pengoksidaan"],"distractors":["dengan merampas elektron daripada DNA sel","untuk mempercepat tindak balas berantai oksidatif"],"explanation":"Dengan menderma elektron kepada radikal bebas tanpa membentuk radikal bebas baharu, antioksidan menghasilkan sebatian stabil dan menghentikan tindak balas pengoksidaan."},{"type":"mcq","xp":25,"voiceIdKey":"u3-s8","voiceToneLabel":"Cabaran Unit 3: Kesan Radikal","voiceCaption":"Uji pemahaman pembentukan karsinogen, penyakit kardiovaskular dan mengapa warga emas perlukan lebih antioksidan.","voiceScript":"[excited] Uji penguasaan Unit tiga! Mengapakah golongan berusia perlu memastikan pengambilan makanan kaya antioksidan dan apakah risiko jika radikal bebas menyerang D N A?","prompt":"Gabungan pernyataan manakah TEPAT tentang radikal bebas dan keperluan bahan antioksidan?","options":["Apabila usia meningkat penghasilan antioksidan badan bertambah lima kali ganda sehingga menyebabkan penuaan awal","Radikal bebas merosakkan struktur DNA lalu membentuk bahan karsinogen (mutasi dan kanser), manakala penghasilan antioksidan oleh badan berkurang apabila usia meningkat","Lutein ialah vitamin larut minyak dalam minyak sawit yang hanya merawat sakit sendi","Radikal bebas mempunyai lebihan dua elektron yang menjadikan sel terlalu stabil"],"correctIndex":1,"explanation":"Radikal bebas merampas elektron daripada molekul DNA lalu menghasilkan karsinogen pencetus mutasi dan kanser, manakala keupayaan badan menghasilkan antioksidan menurun seiring peningkatan usia."}]},{"id":"sai10-u4","title":"Unit 4: Eksperimen Pengoksidaan Hirisan Epal (10.3)","subtitle":"Subtopik 10.3 (Bhg. 2) — Pengoksidaan Makanan, Enzim Polifenol Oksidase & Eksperimen 5 Larutan pada Hirisan Epal","iconType":"graph","iconUrl":"../assets/icons/sai10-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Pengoksidaan Buah Epal","voiceCaption":"Hirisan epal dan pisang menjadi perang di udara apabila enzim polifenol oksidase bertindak balas dengan oksigen.","voiceScript":"[warm] Pernah lihat buah epal atau pisang yang baru dipotong berubah menjadi perang selepas beberapa minit? Itulah contoh jelas pengoksidaan makanan! Apabila sel buah terpotong dan terdedah kepada oksigen di udara, enzim polifenol oksidase memangkinkan tindak balas pengoksidaan sehingga permukaan buah bertukar perang!","title":"Pengoksidaan Makanan: Mengapa Hirisan Epal & Pisang Menjadi Perang?","acronym":"E•O•P•A","hook":"Permukaan epal yang terdedah kepada oksigen udara berubah perang dalam masa 15 minit kecuali disalut oleh bahan antioksidan seperti jus limau!","mediaKey":"sai10_epal_oksidasi","summary":"Pengoksidaan makanan berlaku apabila tisu buah yang terpotong terdedah kepada oksigen udara dan dihalang dengan melambatkan tindak balas oksidatif menggunakan antioksidan.","bullets":["Mekanisme Keperangan Enzim: Apabila epal atau pisang dipotong dan dibiarkan di udara terbuka, oksigen bertindak balas dengan sebatian fenolik dalam buah dengan bantuan enzim polifenol oksidase sehingga menghasilkan pigmen perang.","Fungsi Bahan Antioksidan Makanan: Bahan antioksidan seperti asid askorbik (Vitamin C) bertindak balas terlebih dahulu dengan oksigen atau menghalang pengoksidaan enzim supaya permukaan hirisan epal kekal cerah serta segar lebih lama."],"labId":"sai10_epal_oksidasi_lab","labTitle":"Meja Eksperimen Pengoksidaan Epal","labProps":{"solution":"air","minutes":15},"examTip":"Dalam soalan inferens Eksperimen Epal, sebut dengan tepat: 'oksigen di udara bertindak balas dengan sel epal (enzim polifenol oksidase) menyebabkan pengoksidaan membentuk warna perang'."},{"type":"predict","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Ramal Warna 5 Hirisan Epal","voiceCaption":"Ramalkan hirisan epal manakah yang tidak berubah menjadi perang selepas direndam seminit dan didedah 15 minit.","voiceScript":"[curious] Mari ramal keputusan Eksperimen pengoksidaan epal! Lima hirisan epal sama saiz disediakan: satu tidak direndam sebagai kawalan, manakala empat lagi direndam seminit dalam larutan gula, jus limau, larutan natrium bikarbonat dan larutan garam biasa lalu didedah lima belas minit. Manakah kekal segar tanpa perang?","hook":"Perhatikan peranan Vitamin C (asid askorbik) berbanding larutan beralkali dan larutan gula!","scenario":"Murid meletakkan 5 hirisan epal ke dalam piring Petri selepas rendaman 1 minit (larutan gula, jus limau, natrium bikarbonat, garam biasa serta kawalan tanpa rendaman) selama 15 minit.","prompt":"Hirisan epal manakah yang kekal segar dan TIDAK berubah menjadi perang selepas 15 minit?","options":["Hirisan yang direndam dalam larutan natrium bikarbonat kerana sifat beralkali menyekat oksigen","Hirisan yang direndam dalam jus limau kerana jus limau mengandungi asid askorbik (Vitamin C), iaitu bahan antioksidan","Hirisan kawalan yang tidak direndam langsung kerana tiada air mempercepat tindak balas","Hirisan yang direndam dalam larutan gula kerana sukrosa memusnahkan oksigen udara"],"correctIndex":1,"proofLabId":"sai10_epal_oksidasi_lab","proofState":{"solution":"all","minutes":15,"mode":"proof"},"explanation":"Jus limau mengandungi bahan antioksidan semula jadi iaitu asid askorbik (Vitamin C) yang melambatkan/menghentikan pengoksidaan hirisan epal sehingga ia tidak menjadi perang."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Pemboleh Ubah Eksperimen 10.3","voiceCaption":"Dalam Eksperimen Pengoksidaan Epal, jenis larutan dimanipulasikan, perubahan warna epal bergerak balas, dan suhu serta saiz hirisan dimalarkan.","voiceScript":"[warm] Mari kunci kesemua pemboleh ubah Eksperimen Pengoksidaan Epal untuk skor penuh Kertas dua! Jenis larutan ialah pemboleh ubah dimanipulasikan; perubahan warna hirisan epal ialah pemboleh ubah bergerak balas; manakala suhu persekitaran, saiz hirisan epal serta tempoh pendedahan lima belas minit dimalarkan!","title":"Reka Bentuk Lengkap Eksperimen Pengoksidaan Hirisan Epal (10.3)","acronym":"PM•PB•PMal","hook":"Prosedur tepat buku teks: rendam 1 minit -> pindahkan dengan forseps ke piring Petri -> dedahkan kepada udara selama 15 minit!","mediaKey":"sai10_epal_oksidasi","summary":"Eksperimen 10.3 (10.1 dalam buku teks) membuktikan hipotesis bahawa larutan yang mengandungi bahan antioksidan melambatkan pengoksidaan buah epal.","bullets":["Hipotesis & Pemboleh Ubah: Hipotesis diterima — larutan mengandungi bahan antioksidan (jus limau / asid askorbik) melambatkan pengoksidaan epal. PM = Jenis larutan (gula, jus limau, natrium bikarbonat, garam biasa); PB = Perubahan warna hirisan epal; PMal = Suhu persekitaran, saiz hirisan epal, tempoh rendaman (1 minit) & pendedahan (15 minit).","Perbandingan 5 Keadaan (Rajah 10.7): Kawalan & larutan natrium bikarbonat berubah menjadi perang ketara (tiada antioksidan), larutan gula & larutan garam biasa hanya mengalami keperangan perlahan (menghalang sedikit sentuhan oksigen/aktiviti enzim), manakala jus limau kekal segar tidak berubah perang."],"labId":"sai10_epal_oksidasi_lab","labTitle":"Simulasi 5 Piring Petri & Masa","labProps":{"solution":"all","minutes":15},"examTip":"Soalan SPM: Selain jus limau, bahan lain yang melambatkan pengoksidaan epal ialah larutan Vitamin C (asid askorbik), larutan garam atau larutan gula — namun jus limau/asid askorbik ialah antioksidan terbaik!"},{"type":"match","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Padan Keputusan 5 Larutan","voiceCaption":"Padankan kelima-lima keadaan hirisan epal dalam Eksperimen 10.3 dengan pemerhatian warna dan sebab kimianya.","voiceScript":"[confident] Uji ketepatan jadual keputus kan sedikit sentuhan oksigen permukaan"},{"text":"Hirisan epal kawalan yang terdedah terus di udara dalam piring Petri","bucketId":"perang","note":"Enzim polifenol oksidase bertindak balas dengan oksigen"},{"text":"Rendaman dalam larutan natrium bikarbonat (alkali)","bucketId":"perang","note":"Tiada sifat antioksidan pencegah pengoksidaan"},{"text":"Pisang dikupas kulit yang dibiarkan di atas meja selama 20 minit","bucketId":"perang","note":"Terdedah kepada oksigen udara tanpa perlindungan"}],"explanation":"Larutan berasid tinggi asid askorbik (jus limau/sitrus) paling berkesan melambatkan pengoksidaan, diikuti sedikit perlindungan larutan garam/gula, manakala pendedahan udara dan natrium bikarbonat menghasilkan keperangan."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Bina Kesimpulan Eksperimen 10.3","voiceCaption":"Susun hipotesis dan kesimpulan rasmi Eksperimen Pengoksidaan Buah Epal.","voiceScript":"[curious] Susun blok frasa berikut menjadi kesimpulan rasmi markah penuh bagi Eksperimen Pengoksidaan Buah Epal!","prompt":"Susun blok membentuk kesimpulan rasmi Eksperimen 10.3:","hint":"Mulakan dengan larutan yang mengandungi bahan antioksidan...","answerTokens":["Larutan yang mengandungi bahan antioksidan","seperti jus limau (asid askorbik)","dapat melambatkan proses pengoksidaan","pada permukaan hirisan buah epal"],"distractors":["mempercepat tindak balas enzim polifenol oksidase","menukarkan warna daging epal menjadi perang gelap"],"explanation":"Hipotesis eksperimen diterima: larutan mengandungi bahan antioksidan (asid askorbik dalam jus limau) melambatkan proses pengoksidaan hirisan buah epal."},{"type":"predict","xp":20,"voiceIdKey":"u4-s7","voiceToneLabel":"Ramal Teknik Dapur Antioksidan","voiceCaption":"Ramalkan cara praktikal di dapur untuk mengekalkan potongan pisang dan epal kekal cerah dalam salad buah.","voiceScript":"[curious] Seorang chef mahu menyediakan salad epal dan pisang segar lebih awal untuk jamuan sekolah tanpa buahnya menjadi perang sebelum dihidangkan. Apakah tindakan sains terbaik?","hook":"Aplikasikan prinsip asid askorbik dalam penyediaan makanan harian!","scenario":"Hirisan buah epal dan pisang perlu kekal cerah dan menyelerakan selama 30 minit sebelum majlis bermula.","prompt":"Apakah kaedah paling saintifik dan selamat untuk melambatkan pengoksidaan buah tersebut?","options":["Menaburkan serbuk natrium bikarbonat di atas kesemua buah potong","Merenjis atau merendam hirisan buah seketika dalam jus limau atau jus oren yang kaya Vitamin C (asid askorbik)","Memanaskan buah dengan penunu Bunsen supaya enzim membeku menjadi aloi","Mendedahkan buah di bawah sinaran matahari terik"],"correctIndex":1,"proofLabId":"sai10_epal_oksidasi_lab","proofState":{"solution":"limau","minutes":15},"explanation":"Jus limau dan jus oren mengandungi asid askorbik (Vitamin C) semula jadi yang selamat dimakan serta melambatkan pengoksidaan oleh enzim polifenol oksidase."},{"type":"mcq","xp":25,"voiceIdKey":"u4-s8","voiceToneLabel":"Cabaran Unit 4: Kertas 2 Epal","voiceCaption":"Selesaikan soalan kawalan pemboleh ubah Eksperimen Pengoksidaan Epal.","voiceScript":"[excited] Cabaran penutup Unit empat! Dalam Eksperimen Pengoksidaan Epal, mengapakah kesemua lima hirisan epal mesti dipotong sama saiz daripada biji epal yang sama dan dibiarkan pada suhu bilik yang sama?","prompt":"Mengapakah saiz hirisan epal dan suhu persekitaran dimalarkan sepanjang Eksperimen 10.3?","options":["Supaya hirisan epal dalam jus limau berubah perang lebih cepat daripada kawalan","Supaya tiada faktor lain seperti luas permukaan terdedah atau suhu mempengaruhi kadar pengoksidaan selain jenis larutan yang diuji","Kerana pemboleh ubah dimanipulasikan eksperimen ini ialah suhu piring Petri","Untuk memastikan enzim polifenol oksidase hanya wujud dalam hirisan kawalan"],"correctIndex":1,"explanation":"Memalarkan saiz hirisan (luas permukaan terdedah kepada oksigen) serta suhu persekitaran memastikan ujian adil — perubahan warna semata-mata disebabkan oleh jenis larutan yang dimanipulasikan."}]},{"id":"sai10-u5","title":"Unit 5: Produk Kesihatan, Bahan Aktif & Audit KKM","subtitle":"Subtopik 10.4 — Bahan Aktif, Kewajaran Suplemen, Pendaftaran MAL & Hologram MedTag serta Bahaya Merkuri/Hidrokuinon/Steroid","iconType":"formula","iconUrl":"../assets/icons/sai10-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"Bahan Aktif Produk","voiceCaption":"Bahan aktif ialah komponen tertentu dalam produk kesihatan yang memberi kesan penyembuhan atau pencegahan penyakit.","voiceScript":"[warm] Sekarang kita masuk ke Subtopik sepuluh perpuluhan empat: Produk Kesihatan! Sama ada dalam bentuk pil, serbuk ataupun losen, setiap produk kesihatan mempunyai bahan aktif iaitu komponen khusus yang memberi kesan penyembuhan atau pencegahan penyakit. Ingat, dua bahan aktif kadang-kala tidak boleh dicampur bersama tanpa nasihat doktor!","title":"Bahan Aktif dalam Produk Kesihatan & Risiko Interaksi Kimia","acronym":"B•A•S•I","hook":"Jenama botol boleh berbeza, tetapi jika bahan aktifnya ialah Vitamin C pada dos sama, kesan antioksidannya tetap sama!","mediaKey":"sai10_produk_kesihatan","summary":"Setiap produk kesihatan mengandungi bahan aktif penentu kesan terapeutik, namun pengguna wajib berwaspada terhadap tindak balas silang antara bahan aktif.","bullets":["Maksud & Sifat Bahan Aktif (Rajah 10.8): Bahan aktif ialah komponen tertentu di dalam suatu produk (pil, serbuk atau losen) yang mempunyai kesan terhadap penyembuhan atau pencegahan penyakit (cth. Vitamin C bertindak sebagai antioksidan); bahan aktif memberi kesan dan tujuan sama walaupun berlainan jenama.","Amaran Gabungan Bahan Aktif: Kadangkala dua atau lebih bahan aktif tidak boleh digunakan bersama kerana boleh bertindak balas secara kimia di dalam badan lalu menghasilkan kemudaratan kepada kesihatan — wajib semak label dan dapatkan nasihat doktor."],"labId":"sai10_produk_kesihatan_audit","labTitle":"Pemeriksa Bahan Aktif & Interaksi","labProps":{"tab":"aktif","pairIdx":0},"examTip":"Untuk Praktis Formatif 10.4 No. 1: Hafal ayat definisi tepat glosari KSSM — 'komponen tertentu di dalam sesuatu produk yang mempunyai kesan terhadap penyembuhan dan pencegahan penyakit'."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Susun Definisi Bahan Aktif","voiceCaption":"Susun blok membentuk definisi tepat bahan aktif serta amaran penggunaan dua bahan aktif serentak.","voiceScript":"[curious] Susun frasa berikut bagi melengkapkan definisi rasmi Bahan Aktif dalam produk kesihatan mengikut glosari buku teks!","prompt":"Susun blok membentuk definisi tepat Bahan Aktif:","hint":"Mulakan dengan komponen tertentu di dalam produk...","answerTokens":["Komponen tertentu di dalam sesuatu produk","yang mempunyai kesan terhadap","penyembuhan atau pencegahan penyakit","serta tidak boleh dicampur sewenang-wenangnya"],"distractors":["yang berfungsi mewarnakan botol produk","sentiasa selamat digabung dalam semua keadaan"],"explanation":"Bahan aktif merujuk komponen penentu kesan penyembuhan/pencegahan penyakit, dan sesetengah bahan aktif bertindak balas negatif apabila digabungkan tanpa pengawasan doktor."},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Kewajaran & Audit KKM","voiceCaption":"Sebelum membeli suplemen atau kosmetik, semak label, dapatkan nasihat doktor, sahkan nombor pendaftaran MAL serta pelekat hologram MedTag KKM.","voiceScript":"[warm] Mengapakah permintaan produk kesihatan tinggi? Kerana suplemen membantu memulihkan penyakit, menjamin tumbesaran normal kanak-kanak dan melengkapkan pemakanan gaya hidup sibuk! Namun awas produk tidak berdaftar yang dicampur merkuri, hidrokuinon atau steroid! Sentiasa semak nombor pendaftaran M A L dan pelekat hologram MedTag K K M!","title":"Kewajaran Suplemen, Semakan MAL/MedTag KKM & Bahan Terlarang","acronym":"M•A•L•M","hook":"Tiga racun terlarang popular produk 'ajaib' tanpa kelulusan KKM: Merkuri (rosak ginjal), Hidrokuinon (hakis kulit) dan Steroid (ganggu hormon & imuniti)!","mediaKey":"sai10_produk_kesihatan","summary":"Pengambilan produk kesihatan wajar bagi melengkapkan nutrisi dan tumbesaran dengan syarat disahkan selamat melalui semakan portal rasmi KKM.","bullets":["3 Kewajaran Penggunaan Produk Kesihatan (10.4.2): (1) Memulihkan penyakit dan mengekalkan kesihatan, (2) menjamin tumbesaran normal dan meningkatkan daya pencegahan penyakit (cth. multivitamin kanak-kanak), dan (3) pelengkap kepada pemakanan tidak seimbang akibat gaya hidup sibuk bekerja.","Semakan Keselamatan KKM & Bahan Terlarang: Sentiasa rujuk doktor dan portal rasmi KKM (NPRA) bagi mengesahkan nombor pendaftaran MAL serta pelekat hologram MedTag tulen — jauhi produk haram yang mengandungi merkuri (merosakkan buah pinggang/saraf), hidrokuinon (menghakis kulit/kanser kulit) dan steroid tersembunyi (menipiskan kulit/ganggu hormon)."],"labId":"sai10_produk_kesihatan_audit","labTitle":"Audit Label KKM (MAL & MedTag)","labProps":{"tab":"audit","productId":"suplemen_sah"},"examTip":"Apabila menjawab soalan wajaran produk kesihatan (Praktis Formatif 10.4 No. 2), selitkan ketiga-tiga faktor (pemulihan, tumbesaran/imuniti, pelengkap diet sibuk) DAN syarat keselamatan ('mendapatkan nasihat doktor dan menyemak label/MAL KKM')."},{"type":"predict","xp":20,"voiceIdKey":"u5-s4","voiceToneLabel":"Ramal Kesan Krim Tanpa MAL","voiceCaption":"Ramalkan bahaya produk kosmetik pemutih kilat yang tiada nombor MAL dan hologram MedTag KKM.","voiceScript":"[curious] Cuba audit kes pengguna ini! Seorang remaja membeli krim pemutih kilat dalam talian tanpa nombor pendaftaran K K M dan tanpa pelekat hologram MedTag yang menjanjikan kulit putih dalam tiga hari. Bahan kimia terlarang manakah mungkin dicampurkan dan apakah risikonya?","hook":"Jalankan ujian pengimbas NPRA ke atas Krim Wajah Kilat dalam makmal Audit KKM di bawah!","scenario":"Krim kecantikan murah dijual tanpa senarai bahan aktif jelas, tiada nombor pendaftaran KKM (MAL/NOT) dan tiada pelekat hologram MedTag.","prompt":"Apakah risiko keselamatan paling tepat jika produk tersebut mengandungi merkuri atau hidrokuinon terlarang?","options":["Kulit menjadi lebih kebal terhadap sinaran ultraungu untuk selamanya","Merkuri diserap ke dalam darah merosakkan buah pinggang serta sistem saraf, manakala hidrokuinon menghakis lapisan kulit dan meningkatkan risiko kanser kulit","Nombor pendaftaran MedTag akan tercetak sendiri selepas tujuh hari pemakaian","Vitamin C semula jadi terhasil secara automatik di permukaan epidermis"],"correctIndex":1,"proofLabId":"sai10_produk_kesihatan_audit","proofState":{"tab":"audit","productId":"krim_merkuri"},"explanation":"Produk pemutih haram tanpa kelulusan KKM sering dicampur merkuri (merosakkan buah pinggang dan sistem saraf) serta hidrokuinon tanpa kawalan (menghakis kulit dan mencetuskan kanser kulit)."},{"type":"match","xp":20,"voiceIdKey":"u5-s5","voiceToneLabel":"Padan Pengesahan KKM & Racun","voiceCaption":"Padankan tanda pengesahan KKM serta bahan terlarang produk kesihatan dengan kesan dan fungsinya.","voiceScript":"[confident] Uji kecekapan kamu sebagai pengaudit K K M! Padankan istilah pendaftaran dan bahan kimia terlarang berikut dengan huraian tepatnya.","prompt":"Padankan komponen pengesahan KKM dan bahan terlarang berikut dengan penerangannya:","pairs":[{"id":"kk1","left":"Nombor pendaftaran MAL","right":"Kod rasmi pengesahan produk berdaftar di portal NPRA KKM"},{"id":"kk2","left":"Pelekat hologram MedTag","right":"Ciri keselamatan fizikal pada bungkusan ubat berdaftar yang tulen"},{"id":"kk3","left":"Merkuri dalam krim haram","right":"Logam berat bertoksik yang merosakkan buah pinggang dan sistem saraf"},{"id":"kk4","left":"Hidrokuinon tanpa kawalan","right":"Menghakis kulit, menyebabkan keradangan dan risiko kanser kulit"},{"id":"kk5","left":"Steroid tersembunyi dalam jamu","right":"Menipiskan kulit, mengganggu hormon dan melemahkan sistem imuniti"}],"explanation":"Mengesahkan nombor MAL dan hologram MedTag di portal KKM melindungi pengguna daripada racun berjadual seperti merkuri, hidrokuinon dan steroid tersembunyi."},{"type":"sort","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Isih Produk Selamat vs Haram","voiceCaption":"Kelaskan ciri produk kesihatan yang sah dan selamat digunakan berbanding produk berisiko tinggi.","voiceScript":"[confident] Kelaskan enam ciri label dan amalan berikut kepada Produk Kesihatan Sah dan Selamat atau Produk Berbahaya serta Tidak Berdaftar!","prompt":"Isihkan petunjuk label produk berikut mengikut tahap keselamatannya:","buckets":[{"id":"sah","label":"Produk Sah & Amalan Selamat"},{"id":"haram","label":"Produk Haram / Berbahaya"}],"items":[{"text":"Mempunyai nombor pendaftaran MAL yang disemak sah di portal rasmi KKM","bucketId":"sah","note":"Disahkan kualiti dan keselamatannya oleh KKM"},{"text":"Dilengkapi pelekat hologram MedTag asli serta label bahan aktif dan dos lengkap","bucketId":"sah","note":"Ketelusan maklumat untuk pengguna dan doktor"},{"text":"Diambil selepas mendapat nasihat doktor tanpa mencampurkan bahan aktif bertentangan","bucketId":"sah","note":"Mengelakkan interaksi kimia memudaratkan"},{"text":"Krim pemutih pantas berlabel kabur yang mengandungi merkuri atau hidrokuinon","bucketId":"haram","note":"Mengancam kesihatan ginjal, saraf dan kulit"},{"text":"Pil tahan sakit 'ajaib' tanpa nombor MAL yang disyaki dicampur steroid","bucketId":"haram","note":"Berisiko gangguan hormon dan imuniti badan"},{"text":"Mengambil dua atau lebih suplemen berbahan aktif berbeza tanpa merujuk ahli farmasi/doktor","bucketId":"haram","note":"Bahan aktif boleh bertindak balas secara berbahaya"}],"explanation":"Pengguna bijak sentiasa menyemak status pendaftaran MAL, hologram MedTag, senarai bahan aktif serta meminta nasihat doktor sebelum mengambil sebarang produk kesihatan."},{"type":"mcq","xp":25,"voiceIdKey":"u5-s7","voiceToneLabel":"Cabaran Unit 5: Kewajaran & KKM","voiceCaption":"Uji kefahaman keseluruhan Subtopik 10.4 mengenai kewajaran pengambilan produk kesihatan dan semakan label.","voiceScript":"[excited] Soalan cabaran penutup Unit lima! Mengapakah golongan pekerja sibuk wajar mengambil suplemen berdaftar tetapi mesti menyemak label serta merujuk doktor terlebih dahulu?","prompt":"Pernyataan manakah MERUMUSKAN kewajaran serta langkah keselamatan pengambilan produk kesihatan dengan paling tepat?","options":["Produk kesihatan wajib menggantikan semua makanan harian dan tidak perlu disahkan oleh KKM","Suplemen membantu melengkapkan pemakanan tidak seimbang, menjamin tumbesaran dan mencegah penyakit, tetapi pengguna mesti merujuk doktor serta menyemak bahan aktif, nombor MAL dan hologram MedTag untuk mengelakkan kemudaratan","Semua produk herba semula jadi dijamin bebas daripada steroid dan merkuri tanpa ujian makmal","Mengambil dua bahan aktif berlainan serentak sentiasa menggandakan keberkesanan tanpa kesan sampingan"],"correctIndex":1,"explanation":"Subtopik 10.4 menekankan manfaat produk kesihatan sebagai pelengkap diet dan pencegahan penyakit, namun mesti disaring menerusi nasihat doktor serta pengesahan label KKM (MAL & MedTag)."}]},{"id":"sai10-u6","title":"Unit 6: Cabaran Boss SPM — Misi Kimia Perubatan Bab 10","subtitle":"Sintesis Kertas 1 & Kertas 2 — Praktis Sumatif 10 (No. 1–4), Cabar Minda (No. 5–7) & KBAT KKM","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":30,"voiceIdKey":"u6-s1","voiceToneLabel":"Boss Kes 1: Kaedah M & N","voiceCaption":"Selesaikan soalan Praktis Sumatif 10 No. 1 mengenai gabungan Perubatan Komplementari M dan Perubatan Moden N.","voiceScript":"[excited] Selamat datang ke Unit Boss! Cabaran pertama daripada Praktis Sumatif sepuluh nombor satu: Kaedah M ialah akupunktur manakala Kaedah N ialah rawatan ubat hospital dan radioterapi. Mengapakah kaedah M wajar digunakan bersama kaedah N?","stimulusHtml":"<div class='stimulus-note'><strong>Praktis Sumatif 10 (No. 1):</strong> Kaedah M ialah perubatan komplementari (seperti akupunktur dan urutan) manakala Kaedah N ialah perubatan moden (ubat analgesik, antibiotik, psikoteraputik dan radioterapi).</div>","prompt":"Wajaran dan fakta manakah TEPAT menerangkan gabungan Kaedah M bersama Kaedah N mengikut skema Sumatif 10?","options":["Kaedah M menggantikan terus antibiotik streptomisin bagi membunuh bakteria tibi tanpa preskripsi","Kaedah M (komplementari) boleh digabungkan bersama Kaedah N (moden) untuk menghilangkan kesan sampingan ubat serta tekanan selepas rawatan berat seperti radioterapi kanser","Kaedah N (moden) menggunakan jarum akupunktur dan tidak memerlukan ujian klinikal","Kaedah M melibatkan pembedahan dan dadah psikoteraputik penenang"],"correctIndex":1,"explanation":"Skema Praktis Sumatif 10 No. 1d: Kaedah perubatan komplementari (M) dapat mengurangkan atau menghilangkan kesan sampingan ubat serta tekanan daripada rawatan moden (N), contohnya susulan selepas rawatan radioterapi kanser."},{"type":"predict","xp":30,"voiceIdKey":"u6-s2","voiceToneLabel":"Boss Kes 2: Sumatif 10 No. 2c","voiceCaption":"Selesaikan soalan KBAT Praktis Sumatif 10 No. 2c mengapa radikal bebas menjejaskan sesetengah individu tetapi tidak bagi individu lain.","voiceScript":"[curious] Cabaran Boss kedua daripada Praktis Sumatif sepuluh nombor dua c! Radikal bebas terbentuk dalam badan setiap manusia melalui metabolisme. Mengapakah ia tidak menjadi masalah pada sesetengah individu tetapi menjadi punca penyakit pada individu lain?","hook":"Bandingkan keseimbangan antara radikal bebas dalaman dan luaran dengan bekalan antioksidan dalam Simulator!","scenario":"Individu P mengamalkan pemakanan seimbang dan menjauhi asap rokok, manakala Individu Q merokok serta terdedah kepada pencemaran udara dan radiasi.","prompt":"Mengapakah radikal bebas tidak memudaratkan Individu P tetapi menjejaskan kesihatan Individu Q (Praktis Sumatif 10 No. 2c)?","options":["Individu P langsung tidak menjalankan proses metabolisme atau respirasi di dalam mitokondrianya","Pada Individu P, radikal bebas daripada faktor dalaman berjaya dineutralkan oleh bahan antioksidan daripada makanan; bagi Individu Q, faktor luaran berlebihan (asap rokok/radiasi) menghasilkan terlalu banyak radikal bebas hingga tidak mampu dineutralkan","Asap rokok membekalkan Beta karotena berlebihan yang membekukan sel darah putih Individu Q","Individu Q mempunyai terlalu banyak vitamin C larut minyak yang merosakkan DNA"],"correctIndex":1,"proofLabId":"sai10_radikal_antioksidan_sim","proofState":{"tab":"sim","internal":35,"smoke":90,"antioxidant":15},"explanation":"Skema rasmi Praktis Sumatif 10 No. 2c: Radikal bebas semula jadi (faktor dalaman) lazimnya dineutralkan oleh bahan antioksidan dalam makanan. Pendedahan berlebihan faktor luaran (asap rokok, asap kilang, radiasi) menghasilkan radikal bebas berlebihan yang gagal dineutralkan lalu memudaratkan kesihatan."},{"type":"match","xp":30,"voiceIdKey":"u6-s3","voiceToneLabel":"Boss: Sintesis 5 Konsep Teras","voiceCaption":"Padankan lima istilah teras daripada kesemua empat subtopik Bab 10 dengan peranan saintifiknya.","voiceScript":"[confident] Cabaran Boss ketiga! Padankan kelima-lima istilah teras merentas Subtopik sepuluh perpuluhan satu hingga sepuluh perpuluhan empat dengan peranan tepatnya.","prompt":"Padankan lima istilah penting Bab 10 berikut dengan fungsi atau kesannya:","pairs":[{"id":"b1","left":"Kuinina (Cinchona sp.)","right":"Ubat tradisional daripada kulit pokok bagi merawat penyakit malaria"},{"id":"b2","left":"Antibiotik (Penisilin)","right":"Ubat moden yang wajib dihabiskan dos untuk elak kerintangan bakteria"},{"id":"b3","left":"Lutein (Bayam & Brokoli)","right":"Antioksidan semula jadi dalam sayur berdaun hijau untuk kesihatan mata"},{"id":"b4","left":"Asid Askorbik (Jus Limau)","right":"Melambatkan pengoksidaan enzim polifenol oksidase pada hirisan epal"},{"id":"b5","left":"Nombor MAL & MedTag","right":"Penanda pengesahan KKM bagi produk kesihatan bebas racun merkuri/steroid"}],"explanation":"Menguasai kaitan rentas keempat-empat subtopik (tradisional, moden, antioksidan, eksperimen epal dan semakan KKM) memastikan skor cemerlang Kertas 1 dan Kertas 2."},{"type":"sort","xp":30,"voiceIdKey":"u6-s4","voiceToneLabel":"Boss: Isih 6 Fakta Bab 10","voiceCaption":"Kelaskan enam konsep Bab 10 antara Kaedah Perubatan (10.1) dengan Kimia Oksidasi, Antioksidan & Produk Kesihatan (10.2–10.4).","voiceScript":"[confident] Pecutan Boss keempat! Kelaskan enam konsep berikut mengikut kelompok Subtopik sepuluh perpuluhan satu (Kaedah dan Ubat) ataupun kelompok Subtopik sepuluh perpuluhan dua hingga sepuluh perpuluhan empat (Radikal Bebas, Antioksidan dan Produk Kesihatan).","prompt":"Isihkan pernyataan Bab 10 berikut mengikut kelompok subtopiknya:","buckets":[{"id":"sub1","label":"Kaedah Perubatan & Ubat (10.1)"},{"id":"sub24","label":"Radikal, Antioksidan & Produk (10.2–10.4)"}],"items":[{"text":"Homeopati menguatkan keupayaan tubuh melawan penyakit berdasarkan gejala","bucketId":"sub1","note":"Amalan perubatan komplementari (10.1)"},{"text":"Psikoteraputik terbahagi kepada stimulan, antidepresan dan antipsikotik","bucketId":"sub1","note":"Kelas ubat moden merawat pesakit psikiatrik"},{"text":"Kitab Tib merakam perubatan Melayu silam menggunakan tumbuhan serta rempah","bucketId":"sub1","note":"Warisan perubatan tradisional tempatan"},{"text":"Radikal bebas kurang satu elektron mencetuskan kerosakan DNA dan penuaan awal","bucketId":"sub24","note":"Konsep teras Subtopik 10.2"},{"text":"Likopena dalam tomato/betik dan alfa-tokoferol dalam minyak sawit menderma elektron","bucketId":"sub24","note":"Bahan antioksidan semula jadi Subtopik 10.3"},{"text":"Semakan nombor MAL dan hologram MedTag mengelakkan keracunan merkuri atau steroid","bucketId":"sub24","note":"Keselamatan produk kesihatan Subtopik 10.4"}],"explanation":"Pemetaan yang jelas antara Subtopik 10.1 dan 10.2–10.4 membantu penyusunan isi esei KBAT Bahagian C Kertas 2 dengan teratur."},{"type":"wordbank","xp":30,"voiceIdKey":"u6-s5","voiceToneLabel":"Boss: Cabar Minda Kulit Kering","voiceCaption":"Susun penyelesaian masalah Cabar Minda No. 5 mengenai kulit kering dan kusam akibat kurang bahan antioksidan.","voiceScript":"[warm] Cabaran K B A T daripada Cabar Minda nombor lima! Seorang murid mengalami kulit kering dan kusam kerana pemakanannya kurang antioksidan. Susun punca dan langkah penyelesaian paling tepat!","prompt":"Susun blok menyelesaikan masalah Cabar Minda No. 5 (kulit kering dan kusam):","hint":"Mulakan dengan masalah kulit akibat radikal bebas dan kurang antioksidan...","answerTokens":["Kurang pengambilan antioksidan menyebabkan radikal bebas","merosakkan sel kulit hingga penuaan awal","dan diatasi dengan makan buah sitrus bervitamin C","sayur berdaun hijau serta elakkan sinaran UV"],"distractors":["menyapu krim pemutih merkuri berdos tinggi","mengambil ubat antibiotik tanpa menghabiskan dos"],"explanation":"Skema Cabar Minda No. 5: Punca kulit kusam ialah kekurangan antioksidan untuk meneutralkan radikal bebas akibat UV/pencemaran; diatasi dengan mengambil makanan kaya Vitamin C, Vitamin E dan beta karotena serta melindungi kulit daripada sinar UV."},{"type":"mcq","xp":35,"voiceIdKey":"u6-s6","voiceToneLabel":"Boss Akhir: Cabar Minda No. 7","voiceCaption":"Selesaikan soalan akhir Cabar Minda No. 7 mengenai pekerja kilang bekerja 12 jam serta langkah kesihatan KKM yang selamat.","voiceScript":"[excited] Soalan terakhir Unit Boss! Merujuk Cabar Minda nombor tujuh, Hasnah bekerja di kilang selama dua belas jam sehari yang sangat memenatkan. Apakah risiko kesihatannya dan langkah penyelesaian terbaik tanpa menukar pekerjaan?","stimulusHtml":"<div class='stimulus-note'><strong>Cabar Minda Praktis Sumatif 10 (No. 7):</strong> Hasnah ialah pekerja kilang yang bekerja 12 jam sehari dalam persekitaran memenatkan. Kenal pasti masalah kesihatan yang mungkin dialaminya serta penyelesaian saintifik dan selamat.</div>","prompt":"Gabungan risiko kesihatan dan pelan penyelesaian manakah PALING tepat untuk Hasnah berdasarkan keseluruhan Bab 10?","options":["Hasnah berisiko mengambil ubat penenang antipsikotik dan krim hidrokuinon secara bebas setiap malam tanpa preskripsi","Hasnah berisiko mengalami keletihan otot, stres dan pendedahan radikal bebas persekitaran kilang; diatasi dengan diet kaya antioksidan, suplemen vitamin berdaftar KKM (mempunyai nombor MAL & hologram MedTag), rehat cukup serta urutan tradisional atau nasihat doktor","Hasnah hanya perlu berhenti mengambil antibiotik pada hari kedua dan minum larutan natrium bikarbonat","Hasnah disarankan menyapu gel aloe vera pada makanan supaya epal tidak menjadi perang"],"correctIndex":1,"explanation":"Cabar Minda No. 7 merentasi seluruh Bab 10: Kerja panjang berisiko keletihan, stres, kurang nutrisi dan tekanan oksidatif radikal bebas; penyelesaian selamat ialah pemakanan kaya antioksidan (Vitamin C/E/beta karotena), urutan tradisional melegakan otot, nasihat doktor serta suplemen berdaftar KKM (nombor MAL & hologram MedTag). Tahniah — Bab 10 dikuasai 100%!"}]}]};</script>

  /* =========================================================================
     MAKMAL 2: sai10_radikal_antioksidan_sim
     Simulator Perisai Antioksidan Selular 60fps Canvas & 5 Bahan Makanan

  window.ETUTOR_NOTA_LABS.sai10_radikal_antioksidan_sim = function (shell, ctx) {
    ensureScopedStyles();
    var ps = (ctx && (ctx.proofState || ctx.labProps)) || {};
    var tab = ps.tab === "makanan" ? "makanan" : "sim";
    var internalFactor = typeof ps.internal === "number" ? ps.internal : 35;
    var externalFactor = typeof ps.smoke === "number" ? ps.smoke : (typeof ps.uv === "number" ? ps.uv : 55);
    var antioxidantLevel = typeof ps.antioxidant === "number" ? ps.antioxidant : 70;
    var foodKey = ps.food || "betakarotena";

    var paused = reducedMotion();
    var rafId = 0;
    var lastTs = 0;
    var simTime = 0;
    var isDocHidden = typeof document !== "undefined" ? Boolean(document.hidden) : false;

    var foods = {
      betakarotena: {
        name: "Beta Karotena",
        color: "#f97316",
        sources: "Lobak merah, mangga, ubi keledek, labu, aprikot & buah pic",
        trait: "Lazim ditemui dalam makanan berwarna merah, kuning atau jingga sebagai pelindung sel."
      },
      lutein: {
        name: "Lutein",
        color: "#22c55e",
        sources: "Bayam, kubis dan brokoli",
        trait: "Sayur-sayuran berdaun hijau tinggi lutein dan sering dikaitkan dengan mata yang sihat."
      },
      likopena: {
        name: "Likopena",
        color: "#ef4444",
        sources: "Betik, jambu batu, tembikai, tomato, aprikot, limau gedang & oren",
        trait: "Pigmen antioksidan buah berwarna merah-jingga yang meneutralkan radikal bebas."
      },
      vit_c: {
        name: "Vitamin C (Asid Askorbik)",
        color: "#eab308",
        sources: "Buah-buahan sitrus dan jusnya, kiwi, strawberi, kranberi, lada hijau, bayam, brokoli & bijirin",
        trait: "Vitamin larut air berkesan sebagai perisai antioksidan harian badan serta melambatkan pengoksidaan makanan."
      },
      vit_e: {
        name: "Vitamin E (Alfa-Tokoferol)",
        color: "#10b981",
        sources: "Minyak kelapa sawit, minyak germa gandum, minyak jagung, minyak kacang soya, kekacang, brokoli & mangga",
        trait: "Antioksidan larut lemak yang melindungi membran sel daripada serangan pengoksidaan radikal bebas."
      }
    };

    if (!foods[foodKey]) foodKey = "betakarotena";

    function computeMetrics() {
      var radicalLoad = Math.round(internalFactor * 0.45 + externalFactor * 0.85);
      var netThreat = Math.max(0, radicalLoad - Math.round(antioxidantLevel * 1.15));
      var dnaIntegrity = Math.max(12, Math.min(100, Math.round(100 - netThreat * 0.9)));
      return { radicalLoad: radicalLoad, netThreat: netThreat, dnaIntegrity: dnaIntegrity };
    }

    function drawSimCanvas() {
      var canvas = shell.querySelector("#sai10RadCanvas");
      if (!canvas) return;
      var c2d = canvas.getContext("2d");
      if (!c2d) return;
      var w = canvas.width;
      var h = canvas.height;
      var met = computeMetrics();
      var isSafe = met.dnaIntegrity >= 75;

      c2d.fillStyle = isSafe ? "#042f2e" : "#1e1118";
      c2d.fillRect(0, 0, w, h);

      c2d.strokeStyle = isSafe ? "#10b981" : "#f87171";
      c2d.lineWidth = 2;
      c2d.strokeRect(10, 10, w - 20, h - 20);

      // Healthy cell & DNA on right
      var cellX = 485;
      var cellY = 128;
      c2d.beginPath();
      c2d.arc(cellX, cellY, 68, 0, Math.PI * 2);
      c2d.fillStyle = isSafe ? "rgba(16,185,129,0.18)" : "rgba(239,68,68,0.2)";
      c2d.fill();
      c2d.lineWidth = 3;
      c2d.strokeStyle = isSafe ? "#34d399" : "#fb7185";
      c2d.stroke();

      // DNA double helix strands inside cell
      c2d.lineWidth = 3.5;
      for (var d = 0; d < 2; d++) {
        c2d.strokeStyle = d === 0 ? (isSafe ? "#6ee7b7" : "#fca5a5") : (isSafe ? "#38bdf8" : "#fdba74");
        c2d.beginPath();
        for (var s = 0; s <= 12; s++) {
          var py = cellY - 40 + (s / 12) * 80;
          var px = cellX + Math.sin(s * 0.8 + d * Math.PI + (paused ? 0 : simTime * 2)) * 16;
          if (s === 0) c2d.moveTo(px, py);
          else c2d.lineTo(px, py);
        }
        c2d.stroke();
      }

      // Protective Antioxidant Shield arc
      var shieldAlpha = Math.max(0.15, antioxidantLevel / 100);
      c2d.strokeStyle = "rgba(52, 211, 153, " + shieldAlpha.toFixed(2) + ")";
      c2d.lineWidth = 3 + (antioxidantLevel / 100) * 8;
      c2d.beginPath();
      c2d.arc(cellX, cellY, 92, Math.PI * 0.65, Math.PI * 1.35);
      c2d.stroke();

      // Draw Antioxidant molecules (green orbs) donating electrons
      var aoCount = Math.max(1, Math.round((antioxidantLevel / 100) * 5));
      for (var a = 0; a < aoCount; a++) {
        var ay = 64 + a * 34;
        var ax = 325 + Math.sin(simTime * 2 + a) * 10;
        c2d.fillStyle = "#10b981";
        c2d.beginPath();
        c2d.arc(ax, ay, 11, 0, Math.PI * 2);
        c2d.fill();
        c2d.fillStyle = "#ffffff";
        c2d.font = "800 8.5px JetBrains Mono, monospace";
        c2d.textAlign = "center";
        c2d.fillText("AO", ax, ay + 3);

        // Donated electron pulse moving left toward radicals
        var ePhase = paused ? 0.5 : ((simTime * 1.4 + a * 0.25) % 1);
        var ex = ax - 18 - ePhase * 42;
        c2d.fillStyle = "#fde047";
        c2d.beginPath();
        c2d.arc(ex, ay, 4.5, 0, Math.PI * 2);
        c2d.fill();
      }

      // Draw Free Radicals coming from left
      var radCount = Math.max(2, Math.round((met.radicalLoad / 110) * 7));
      for (var r = 0; r < radCount; r++) {
        var phase = paused ? ((r * 0.19) % 1) : ((simTime * 0.45 + r * 0.17) % 1);
        var reachMax = met.netThreat > 15 ? 430 : 285;
        var rx = 56 + phase * (reachMax - 56);
        var ry = 58 + ((r * 31) % 136) + Math.sin(simTime * 3 + r) * 5;
        var neutralized = rx >= 245 && met.netThreat <= 15;

        c2d.beginPath();
        c2d.arc(rx, ry, 10, 0, Math.PI * 2);
        c2d.fillStyle = neutralized ? "#38bdf8" : "#f97316";
        c2d.fill();
        c2d.lineWidth = 2;
        c2d.strokeStyle = neutralized ? "#bae6fd" : "#fef08a";
        c2d.stroke();

        c2d.fillStyle = "#0f172a";
        c2d.font = "800 8px JetBrains Mono, monospace";
        c2d.textAlign = "center";
        c2d.fillText(neutralized ? "OK" : "R*", rx, ry + 3);
      }

      // Labels with safe padding
      c2d.font = "800 11px Plus Jakarta Sans, sans-serif";
      c2d.textAlign = "left";
      c2d.fillStyle = "#fde68a";
      c2d.fillText("PUNCA RADIKAL BEBAS (DALAMAN & LUARAN)", 24, 30);

      c2d.textAlign = "right";
      c2d.fillStyle = isSafe ? "#6ee7b7" : "#fca5a5";
      c2d.fillText("INTEGRITI DNA & SEL: " + met.dnaIntegrity + "%", w - 24, 30);

      c2d.textAlign = "center";

    function stepLoop(ts) {
      rafId = 0;
      if (paused || isDocHidden || tab !== "sim") return;

      simTime += dt;
      drawSimCanvas();
      rafId = window.requestAnimationFrame(stepLoop);

          return '<button type="button" class="lab-seg-btn" data-food-k="' + fk + '" aria-pressed="' + (fk === foodKey) + '">' + esc(foods[fk].name) + "</button>";
        }).join("");

        bodyHtml = [
          '<div class="lab-controls">' + fBtns + "</div>",
          '<div class="sai10-card-panel" style="border-left:5px solid ' + curF.color + ';">',
          '  <span class="sai10-badge-ok">ANTIOKSIDAN SEMULA JADI (GAMBAR FOTO 10.4)</span>',

      var rInt = shell.querySelector("#rngSai10Int");

      var rExt = shell.querySelector("#rngSai10Ext");

          externalFactor = Number(rExt.value) || 0;
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          updateSliderDom();
        });
      }
      var rAo = shell.querySelector("#rngSai10Ao");
      if (rAo) {
        rAo.addEventListener("input", function () {
          antioxidantLevel = Number(rAo.value) || 0;
          if (ctx && ctx.markInteracted) ctx.markInteracted();
          updateSliderDom();
        });
      }

      var pBtn = shell.querySelector("#sai10RadPauseBtn");
      if (pBtn) {
        pBtn.addEventListener("click", function () {
          paused = !paused;
          pBtn.setAttribute("aria-pressed", paused ? "true" : "false");
