/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}

.nota-topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface-card);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-primary) 58%, var(--brand-accent) 100%);
  color: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 12px 28px rgba(30, 58, 138, 0.22);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #dbeafe; line-height: 1.5; }

.hero-mastery-box {
  background: rgba(15, 23, 42, 0.28);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #eff6ff; }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  text-align: center;
  width: 100%;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step-kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.step-heading { font-family: var(--font-heading); font-size: clamp(1.15rem, 1rem + 0.6vw, 1.4rem); color: var(--brand-navy); margin: 0; line-height: 1.3; }
.step-summary { margin: 0; font-size: 0.96rem; color: var(--text-secondary); line-height: 1.6; }

.concept-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.concept-bullets li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.bullet-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.concept-formula-box {
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--brand-navy);
  color: #f8fafc;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
}
.concept-exam-tip {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--grade-gold-soft);
  border: 1px solid #fde68a;
  color: #92400e;
  font-size: 0.88rem;
  line-height: 1.5;
}
.step-actions-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

@keyframes nodePulseRing { 0% { transform: scale(0.95); opacity: 0.55; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes floatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fadeSlideIn { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }

.skill-path-trail > .path-node-row,
.concept-bullets > li {

}

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;
  font-weight: 800;
}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */

.modal-card {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

.archival-dialog-title { margin: 2px 0 0; font-family: var(--font-heading); font-size: 1.06rem; color: var(--brand-navy); }
.archival-dialog-caption { margin: 0; font-size: 0.87rem; line-height: 1.5; color: var(--text-secondary); }
.archival-dialog-credit { margin: 0; font-size: 0.74rem; color: #475569; border-top: 1px solid #e2e8f0; padding-top: 8px; }

/* Mesin Cetak Jelutong Press & Skrol Sumpah Pemuda */
.jelutong-press-box, .sumpah-scroll-box {
  border-radius: 14px;
  border: 2px solid #d6c5a3;
  background: linear-gradient(180deg, #fcf6e8 0%, #f7edd6 100%);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.press-roller-track { position: relative; height: 8px; border-radius: 999px; background: #e7dbc0; overflow: hidden; }
.press-roller-head { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; border-radius: 999px; background: linear-gradient(90deg, #1e3a8a, #b45309); transform: translateX(-100%); }
.broadsheet-clipping {
  border: 1.5px solid #bfa77a;
  border-radius: 10px;
  background: #fffdf6;
  padding: 12px;
  color: #1c1917;
}
.broadsheet-masthead {
  border-bottom: 2px double #78350f;
  padding-bottom: 6px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.broadsheet-masthead strong { font-family: var(--font-heading); font-size: 1rem; letter-spacing: 0.04em; color: #451a03; }
.broadsheet-masthead span { font-family: var(--font-mono); font-size: 0.74rem; color: #78350f; font-weight: 700; }
.broadsheet-quote { margin: 0; font-size: 0.86rem; line-height: 1.5; color: #292524; }

.sumpah-pledge-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.sumpah-pledge-item {
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.78);
  border-left: 3px solid #059669;
  font-size: 0.84rem;
  line-height: 1.45;
  color: #1e293b;
}

/* Butang Suara Tunggal Gaya Duolingo (Khusus ElevenLabs v4 + WCAG 1.4.2) */
.voice-duolingo-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  padding: 0;
  border-radius: 13px;
  border: 2px solid #1d4ed8;
  border-bottom-width: 4px;
  background: #2563eb;
  color: #ffffff;
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.voice-duolingo-btn:hover { background: #1d4ed8; }
.voice-duolingo-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.voice-duolingo-btn[aria-pressed="true"],
.cikgu-companion-bar.is-speaking .voice-duolingo-btn {
  background: #059669;
  border-color: #047857;
}

.voice-eq-bars {
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2.5px;
  height: 16px;
}
.voice-eq-bar {
  width: 3px;
  height: 5px;
  border-radius: 2px;
  background: #ffffff;
}
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(1) { animation: voiceEqPulse 0.65s ease-in-out infinite 0s; }
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(2) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.16s; }
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
@keyframes voiceEqPulse {
  0%, 100% { height: 5px; }
  50% { height: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .cikgu-companion-bar.is-speaking .voice-eq-bar { animation: none; height: 10px; }
}

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */
.nota-table-wrapper {
  overflow: auto;
  max-inline-size: 100%;
  max-block-size: min(430px, 72vh);
  container-type: inline-size;
  border-radius: 12px;
  border: 1.5px solid var(--border-subtle);
  background: #ffffff;
}
.nota-table-wrapper:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }
.nota-data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.76rem;
  line-height: 1.38;
}
.nota-data-table caption {
  text-align: left;
  padding: 9px 10px;
  font-family: var(--font-heading);
  font-size: 0.79rem;
  font-weight: 800;
  color: var(--brand-primary);
  background: #eff6ff;
  border-block-end: 1.5px solid var(--brand-border);
}
.nota-data-table thead {
  position: sticky;
  inset-block-start: 0;
  z-index: 2;
}
.nota-data-table thead th {
  background: #f1f5f9;
  color: var(--brand-navy);
  font-weight: 800;
  text-align: left;
  padding: 7px 7px;
  border-block-end: 2px solid var(--border-subtle);
  white-space: normal;
}
.nota-data-table tbody th {
  position: sticky;
  inset-inline-start: 0;
  z-index: 1;
  background: #ffffff;
  color: var(--brand-navy);
  font-weight: 700;
  text-align: left;
  padding: 7px 7px;
  border-block-end: 1px solid #e2e8f0;
  vertical-align: top;
}
.nota-data-table tbody td {
  padding: 7px 7px;
  border-block-end: 1px solid #e2e8f0;
  color: var(--text-primary);
  vertical-align: top;
}
.nota-data-table tbody tr.is-interactive-row { cursor: pointer; }
.nota-data-table tbody tr.is-interactive-row:hover th,
.nota-data-table tbody tr.is-interactive-row:hover td { background: #f8fafc; }
.nota-data-table tbody tr.is-active-row th,
.nota-data-table tbody tr.is-active-row td { background: #ecfdf5; }
.nota-data-table tbody tr.is-active-row th { color: #047857; }
.tbl-mono { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; color: #1e3a8a; }
.tbl-tag-skalar { display: inline-block; padding: 2px 7px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 0.7rem; font-weight: 700; }
.tbl-tag-vektor { display: inline-block; padding: 2px 7px; border-radius: 999px; background: #fef3c7; color: #b45309; font-size: 0.7rem; font-weight: 700; }

@container (width < 500px) {
  .nota-data-table,
  .nota-data-table caption,
  .nota-data-table thead,
  .nota-data-table tbody,
  .nota-data-table tr,
  .nota-data-table th,
  .nota-data-table td { display: block; }
  .nota-data-table thead { display: none; }
  .nota-data-table tbody tr {
    margin: 8px;
    border: 1.5px solid var(--border-subtle);
    border-radius: 10px;
    overflow: hidden;
  }
  .nota-data-table tbody th {
    position: sticky;
    inset-block-start: 0;
    inset-inline-start: auto;
    z-index: 2;
    background: #f8fafc;
    border-block-end: 1px solid var(--border-subtle);
  }
  .nota-data-table tbody tr.is-active-row th { background: #d1fae5; color: #065f46; }
  .nota-data-table tbody td { padding: 6px 10px; border-block-end: 1px solid #f1f5f9; }
  .nota-data-table tbody td:last-child { border-block-end: 0; }
  .nota-data-table[data-tbl="jad11"] { --label-2: "Simbol Kuantiti"; --label-3: "Unit S.I."; --label-4: "Simbol Unit"; --label-5: "Catatan SPM"; }
  .nota-data-table[data-tbl="pref"] { --label-2: "Simbol"; --label-3: "Faktor Darab"; --label-4: "Kuasa 10"; --label-5: "Tukaran 98.5"; }
  .nota-data-table[data-tbl="jad13"] { --label-2: "Rumus"; --label-3: "Sebutan Asas"; --label-4: "Unit Asas S.I."; --label-5: "Nama Khas S.I."; --label-6: "Jenis"; }
  .nota-data-table[data-tbl="jad14"] { --label-2: "Kuantiti Skalar"; --label-3: "Kuantiti Vektor"; --label-4: "Nota SPM"; }
  .nota-data-table[data-tbl="pend"] { --label-2: "t₁ (s)"; --label-3: "t₂ (s)"; --label-4: "t_purata (s)"; --label-5: "Tempoh T (s)"; --label-6: "T² (s²)"; }
  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }
  .nota-data-table td:nth-child(3)::before { content: var(--label-3) ": "; font-weight: 700; color: var(--text-secondary); }
  .nota-data-table td:nth-child(4)::before { content: var(--label-4) ": "; font-weight: 700; color: var(--text-secondary); }
  .nota-data-table td:nth-child(5)::before { content: var(--label-5) ": "; font-weight: 700; color: var(--text-secondary); }
  .nota-data-table td:nth-child(6)::before { content: var(--label-6) ": "; font-weight: 700; color: var(--text-secondary); }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit"></p>
      </div>
    </dialog>
  </div>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sejarah-t4-bab01","subject":"Sejarah","form":4,"chapterNumber":1,"title":"Warisan Negara Bangsa","subtitle":"Dari Tujuh Kerajaan Alam Melayu hingga Pembesar Empat Lipatan, Dwi-Kanun Bertulis Melaka & Waadat — Lengkap Foto Arkib & Audio ElevenLabs v4","estimatedMinutes":24,"themeAccent":"#2563eb","isFreePreview":false,"enableMultimediaEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan fakta sejarah Kesultanan Melaka awak memang cemerlang!","combo":"[laughs warmly] Hebat betul kombo awak! [excited] Semangat juara S P M memang terserlah!","encourage":"[softly] Hampir tepat... jangan risau! [warm] Semak kembali fakta fasal atau ciri di bawah supaya melekat kemas.","celebrate":"[excited] Tahniah! Satu lagi unit Sejarah Bab Satu berjaya ditawan dengan cemerlang!"},"units":[{"id":"sej-u1","title":"Latar Belakang & Akar Alam Melayu","subtitle":"Subtopik 1.1 — 7 Kerajaan Alam Melayu, 4 Ciri Asas & Pewarisan Johor-Riau","iconType":"map","boss":false,"steps":[{"type":"concept","title":"Kesinambungan Tujuh Kerajaan Alam Melayu Sebelum Melaka","summary":"Pembentukan negara bangsa kita tidak bermula secara mendadak pada abad ke-15. Ia diwarisi merentasi Funan, Champa, Kedah Tua, Gangga Nagara, Srivijaya, Angkor dan Majapahit sebelum dimantapkan oleh Kesultanan Melayu Melaka lalu diteruskan Kesultanan Johor-Riau berteraskan Islam.","labId":"sej_alam_melayu_map","labTitle":"Peta Natural Earth & Arkib Kerajaan Alam Melayu","labCaption":"Klik mana-mana kerajaan pada peta atau buka foto arkib Inskripsi Telaga Batu & Candi Po Nagar (+5 XP Eksplorasi).","bullets":["Kerajaan Funan (abad ke-1) meluas dari Lembah Sungai Mekong dan Teluk Cam Ranh ke selatan Myanmar hingga Segenting Kra.","Raja dianggap tonggak suci yang ditaati (seperti Raja Champa yang dikaitkan dengan Dewa Siva); Majapahit pula melaksanakan undang-undang Kutara Manawa.","Kerajaan Srivijaya (Sanskrit: 'sri' = bercahaya, 'vijaya' = kemenangan) mewarisi ciri negara bangsa daripada Funan dan Champa, lalu dibuktikan melalui upacara meminum air sumpah Inskripsi Telaga Batu.","Kesultanan Melayu Melaka mewarisi asas tersebut, kemudian Kesultanan Johor-Riau meneruskannya dengan penekanan kuat terhadap kepentingan Islam."],"examTip":"Hafal 4 bukti khusus buku teks bagi ciri negara bangsa Alam Melayu: Champa (Dewa Siva), Majapahit (Kutara Manawa), Funan (Sungai Mekong hingga Segenting Kra), dan Srivijaya (air sumpah Inskripsi Telaga Batu).","xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Jelajah Peta Alam Melayu","voiceCaption":"Selamat datang ke Bab Satu! Pembentukan negara bangsa kita berakar sejak Kerajaan Funan abad pertama hingga Empayar Srivijaya. Teroka peta Natural Earth serta foto prasasti Inskripsi Telaga Batu dan Candi Champa di bawah untuk membuka +5 XP!","voiceScript":"[warm] Selamat datang ke Bab Satu! [excited] Pembentukan negara bangsa kita berakar sejak Kerajaan Funan abad pertama hingga Empayar Srivijaya. Teroka peta Natural Earth serta foto prasasti Inskripsi Telaga Batu dan Candi Champa di bawah untuk membuka lima X P!"},{"type":"match","prompt":"Padankan kerajaan Alam Melayu dengan bukti ciri negara bangsanya yang tepat:","pairs":[{"id":"am1","left":"Kerajaan Champa","right":"Raja dianggap suci dan dikaitkan dengan Dewa Siva"},{"id":"am2","left":"Kerajaan Majapahit","right":"Mengamalkan undang-undang Kutara Manawa di seluruh wilayah"},{"id":"am3","left":"Kerajaan Funan","right":"Wilayah pengaruh merangkumi Sungai Mekong hingga Segenting Kra"},{"id":"am4","left":"Kerajaan Srivijaya","right":"Upacara air sumpah rakyat menggunakan Inskripsi Telaga Batu"},{"id":"am5","left":"Kesultanan Johor-Riau","right":"Meneruskan warisan Melaka dengan penekanan kepentingan Islam"}],"explanation":"Setiap kerajaan membawa bukti konkrit: Champa pada kesucian raja, Majapahit pada Kutara Manawa, Funan pada keluasan wilayah Mekong–Segenting Kra, dan Srivijaya pada Inskripsi Telaga Batu.","xp":15,"voiceIdKey":"u1-s2","voiceToneLabel":"Padanan Bukti Arkeologi","voiceCaption":"Masa untuk padankan kerajaan Alam Melayu dengan bukti sejarah masing-masing! Perhatikan perbezaan antara Majapahit, Champa, Funan dan Srivijaya.","voiceScript":"[curious] Masa untuk padankan kerajaan Alam Melayu dengan bukti sejarah masing-masing! Perhatikan perbezaan antara Majapahit, Champa, Funan dan Srivijaya."},{"type":"wordbank","prompt":"Susun empat (4) ciri asas negara bangsa kerajaan Alam Melayu sebelum zaman Kesultanan Melayu Melaka:","hint":"Pilih 4 blok ciri asas dan abaikan dua pengganggu.","answerTokens":["Raja","Undang-undang","Wilayah Pengaruh","Rakyat"],"distractors":["Pilihan Raya","Parti Politik"],"acceptedSequences":[["Raja","Undang-undang","Wilayah Pengaruh","Rakyat"],["Raja","Rakyat","Wilayah Pengaruh","Undang-undang"],["Raja","Wilayah Pengaruh","Undang-undang","Rakyat"]],"explanation":"Kerajaan Alam Melayu sebelum Melaka memiliki 4 ciri asas negara bangsa iaitu Raja, Undang-undang, Wilayah Pengaruh dan Rakyat.","xp":20,"voiceIdKey":"u1-s3","voiceToneLabel":"Susun Empat Tonggak Awal","voiceCaption":"Sebelum zaman Melaka, kerajaan Alam Melayu sudah pun mempunyai empat ciri asas negara bangsa. Susun keempat-empat ciri tersebut dengan tepat!","voiceScript":"[confident] Sebelum zaman Melaka, kerajaan Alam Melayu sudah pun mempunyai empat ciri asas negara bangsa. Susun keempat-empat ciri tersebut dengan tepat!"},{"type":"predict","prompt":"Ramal & Uji: Mengapakah rakyat Kerajaan Srivijaya dikehendaki meminum air yang dituang melalui corong Inskripsi Telaga Batu?","scenario":"Upacara persetiaan ini dilakukan di pusat pemerintahan empayar maritim Palembang abad ke-7.","options":["Menunjukkan kesetiaan tidak berbelah bahagi rakyat kepada pemerintah tanpa menderhaka","Menentukan kadar cukai eksport hasil hutan yang perlu dibayar saudagar asing","Mengisytiharkan penamatan kuasa raja dan penubuhan majlis republik maritim","Mengesahkan perjanjian perdagangan emas dengan kerajaan Eropah"],"correctIndex":0,"proofLabId":"sej_alam_melayu_map","proofState":"srivijaya","explanation":"Tepat! Upacara menuang air pada Inskripsi Telaga Batu dan meminumnya merupakan simbol ikrar taat setia rakyat supaya tidak menderhaka kepada Raja Srivijaya.","xp":20,"voiceIdKey":"u1-s4","voiceToneLabel":"Ramal Kesan Air Sumpah","voiceCaption":"Bayangkan air dituang ke atas batu Inskripsi Telaga Batu di Palembang dan mengalir melalui corong di bawahnya... mengapakah rakyat Srivijaya meminum air tersebut?","voiceScript":"[curious] Bayangkan air dituang ke atas batu Inskripsi Telaga Batu di Palembang dan mengalir melalui corong di bawahnya... mengapakah rakyat Srivijaya meminum air tersebut?"},{"type":"mcq","prompt":"Dalam bahasa Sanskrit, perkataan 'Srivijaya' membawa maksud bercahaya dan kemenangan. Kerajaan manakah yang meneruskan ciri negara bangsa Melaka selepas zaman Melaka?","options":["Kesultanan Johor-Riau dengan menekankan kepentingan agama Islam","Kerajaan Funan dengan memperluaskan pengaruh ke Teluk Cam Ranh","Kerajaan Gangga Nagara melalui undang-undang Kutara Manawa","Kerajaan Angkor melalui pembinaan candi batu di Lembah Mekong"],"correctIndex":0,"explanation":"Selepas Kesultanan Melayu Melaka, ciri negara bangsa tersebut diteruskan oleh Kesultanan Johor-Riau yang menekankan kepentingan ajaran Islam.","xp":15,"voiceIdKey":"u1-s5","voiceToneLabel":"Uji Fakta Kesinambungan","voiceCaption":"Soalan penutup Unit Satu... uji ketepatan ingatan awak tentang maksud nama Srivijaya serta urutan pewarisan Melaka.","voiceScript":"[warm] Soalan penutup Unit Satu... uji ketepatan ingatan awak tentang maksud nama Srivijaya serta urutan pewarisan Melaka."}],"iconUrl":"../assets/icons/sej-u1.jpg"},{"id":"sej-u2","title":"6 Ciri Negara Bangsa Melaka","subtitle":"Subtopik 1.2 — Kedaulatan Dinasti Ming, 3 Cara Wilayah & Pengaruh Kanun","iconType":"crown","boss":false,"steps":[{"type":"concept","title":"Enam Tonggak Negara Bangsa Kesultanan Melayu Melaka","summary":"Pada abad ke-15, Melaka muncul sebagai empayar berdaulat kerana memiliki sistem pemerintahan Islam ('sultan'), rakyat yang merangkumi golongan merdeka serta hamba, kedaulatan antarabangsa, wilayah luas, dwi-undang-undang bertulis, dan lambang kebesaran diraja.","labId":"sej_6_tonggak_wheel","labTitle":"Roda 6 Tonggak Melaka & Galeri Hubungan Ming","labCaption":"Klik setiap nod pada roda untuk semak kata kunci wajib SPM serta klik foto arkib Kapal Cheng Ho & Pelabuhan Melaka.","bullets":["Kerajaan & Kedaulatan: Pemerintah menggunakan gelaran sultan selepas kedatangan Islam; bebas daripada campur tangan asing serta diiktiraf Dinasti Ming melalui utusan Laksamana Cheng Ho.","Rakyat: Terdiri daripada orang Melayu dan Orang Laut (merangkumi golongan merdeka serta hamba) yang menumpahkan taat setia sebagai balasan jaminan kesejahteraan daripada sultan.","Lambang Kebesaran: Adat istiadat, penggunaan warna kuning, alat muzik diraja nobat, regalia dan cap mohor bagi mengesahkan arahan rasmi sultan.","Warisan Perundangan Negeri: Undang-undang Melaka kemudiannya mempengaruhi penggubalan Undang-Undang Pahang serta Undang-Undang 99 Perak."],"examTip":"Ingat nama tokoh utusan Dinasti Ming yang mengukuhkan kedaulatan Melaka: Laksamana Cheng Ho! Dan ingat 5 lambang kebesaran: adat istiadat, warna, nobat, regalia, cap mohor.","xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Teroka 6 Tonggak Melaka","voiceCaption":"Kesultanan Melayu Melaka menyempurnakan enam ciri negara bangsa yang diiktiraf hingga ke China! Putar roda enam tonggak di bawah dan klik foto model kapal Laksamana Cheng Ho serta ilustrasi Pelabuhan Melaka!","voiceScript":"[excited] Kesultanan Melayu Melaka menyempurnakan enam ciri negara bangsa yang diiktiraf hingga ke China! Putar roda enam tonggak di bawah dan klik foto model kapal Laksamana Cheng Ho serta ilustrasi Pelabuhan Melaka!"},{"type":"sort","prompt":"Isihkan negeri atau wilayah berikut mengikut cara perolehan Wilayah Pengaruh Melaka:","buckets":[{"id":"takluk","label":"Wilayah Taklukan"},{"id":"naung","label":"Wilayah Naungan"},{"id":"kahwin","label":"Perolehan Perkahwinan"}],"items":[{"text":"Pahang, Kuala Linggi, Kelantan & Kampar","bucketId":"takluk","note":"Betul! Pahang, Kuala Linggi, Kelantan, Rokan, Inderagiri dan Kampar ditakluk melalui peperangan."},{"text":"Lingga, Patani dan Kedah","bucketId":"naung","note":"Tepat! Lingga, Patani dan Kedah menerima ketuanan Melaka sebagai wilayah naungan."},{"text":"Siantan (hadiah Majapahit kepada Sultan Mansur Shah)","bucketId":"kahwin","note":"Tepat! Majapahit menghadiahkan Siantan apabila Sultan Mansur Shah mengahwini Puteri Majapahit."},{"text":"Rokan dan Inderagiri di Sumatera","bucketId":"takluk","note":"Betul! Kedua-dua kawasan di pantai timur Sumatera ini merupakan wilayah taklukan Melaka."}],"explanation":"Hafal kumpulan wilayah buku teks: Taklukan (Pahang, Kuala Linggi, Kelantan, Rokan, Inderagiri, Kampar); Naungan (Lingga, Patani, Kedah); Perkahwinan (Siantan oleh Majapahit kepada Sultan Mansur Shah).","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Tiga Cara Wilayah","voiceCaption":"Wilayah pengaruh Melaka meluas ke seluruh Semenanjung Tanah Melayu dan pantai timur Sumatera melalui tiga cara — taklukan, naungan dan perkahwinan. Isihkan contoh negeri di bawah dengan jitu!","voiceScript":"[warm] Wilayah pengaruh Melaka meluas ke seluruh Semenanjung Tanah Melayu dan pantai timur Sumatera melalui tiga cara — taklukan, naungan dan perkahwinan. Isihkan contoh negeri di bawah dengan jitu!"},{"type":"match","prompt":"Padankan ciri negara bangsa Melaka dengan contoh atau fungsinya yang tepat:","pairs":[{"id":"c1","left":"Cap Mohor","right":"Mengesahkan arahan dan surat rasmi daripada Sultan Melaka"},{"id":"c2","left":"Kedaulatan","right":"Bebas campur tangan asing & diiktiraf utusan Laksamana Cheng Ho"},{"id":"c3","left":"Gelaran Sultan","right":"Digunakan oleh pemerintah Melaka selepas kedatangan Islam"},{"id":"c4","left":"Undang-Undang Pahang & 99 Perak","right":"Undang-undang negeri Melayu yang dipengaruhi Kanun Melaka"}],"explanation":"Setiap ciri negara bangsa Melaka mempunyai fungsi pemerintahan jelas serta diwarisi oleh negeri Melayu selepasnya seperti Pahang dan Perak.","xp":15,"voiceIdKey":"u2-s3","voiceToneLabel":"Padanan Ciri & Bukti","voiceCaption":"Cuba padankan setiap ciri negara bangsa Kesultanan Melayu Melaka dengan bukti sejarahnya yang paling tepat!","voiceScript":"[curious] Cuba padankan setiap ciri negara bangsa Kesultanan Melayu Melaka dengan bukti sejarahnya yang paling tepat!"},{"type":"predict","prompt":"Ramal & Uji: Bagaimanakah penghantaran utusan Dinasti Ming pimpinan Laksamana Cheng Ho mengukuhkan negara bangsa Melaka?","scenario":"Pada awal abad ke-15, Melaka menghadapi persaingan kuasa serantau seperti Siam di Asia Tenggara.","options":["Mengiktiraf kedaulatan Melaka secara antarabangsa dan mengelakkan ancaman luar","Menyerahkan seluruh kutipan cukai pelabuhan Melaka kepada Bendahara China","Menggantikan bahasa Melayu dengan bahasa Mandarin sebagai bahasa istana","Membubarkan pasukan Orang Laut dan armada kapal perang Melaka"],"correctIndex":0,"proofLabId":"sej_6_tonggak_wheel","proofState":"kedaulatan","explanation":"Tepat sekali! Hubungan diplomatik erat bersama Dinasti Ming membuktikan pengiktirafan antarabangsa terhadap kedaulatan Sultan Melaka dan menjamin kestabilan dari gangguan luar.","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramalan Pengiktirafan Ming","voiceCaption":"Mengapakah utusan Dinasti Ming yang diketuai Laksamana Cheng Ho amat penting bagi kedaulatan Melaka pada abad ke-15? Pilih ramalan terbaik!","voiceScript":"[curious] Mengapakah utusan Dinasti Ming yang diketuai Laksamana Cheng Ho amat penting bagi kedaulatan Melaka pada abad ke-15? Pilih ramalan terbaik!"},{"type":"wordbank","prompt":"Susun pernyataan tepat tentang perluasan wilayah pengaruh Melaka melalui perkahwinan diraja:","hint":"Susun 4 frasa tepat dan abaikan dua pengganggu.","answerTokens":["Kerajaan Majapahit","menghadiahkan Siantan","kepada Sultan Mansur Shah","kerana mengahwini Puteri Majapahit."],"distractors":["melalui serangan perang","kepada Bendahara Perak"],"explanation":"Perkahwinan diraja merupakan salah satu daripada tiga cara perluasan wilayah pengaruh Melaka selain penaklukan dan naungan.","xp":20,"voiceIdKey":"u2-s5","voiceToneLabel":"Susun Kesan Hadiah Siantan","voiceCaption":"Susun fakta perkahwinan diraja Sultan Mansur Shah dengan kem kemas sebagai persediaan soalan struktur Kertas 2!","voiceScript":"[confident] Susun fakta perkahwinan diraja Sultan Mansur Shah dengan kem kemas sebagai persediaan soalan struktur Kertas 2!"}],"iconUrl":"../assets/icons/sej-u2.jpg"},{"id":"sej-u3","title":"Pembesar Empat Lipatan & Tun Perak","subtitle":"Subtopik 1.3 — Pentadbiran Pusat/Jajahan, Pegangan & Kewangan Empayar","iconType":"scale","boss":false,"steps":[{"type":"concept","title":"Pentadbiran Pusat vs Jajahan & Kawasan Pegangan","summary":"Pentadbiran Melaka tersusun kepada Pentadbiran Peringkat Pusat oleh Pembesar Berempat dan Pentadbiran Peringkat Jajahan bagi daerah serta kampung. Permuafakatan dua hala Sultan bersama pembesar mengelakkan tindakan sewenang-wenangnya.","labId":"sej_pembesar_pyramid","labTitle":"Simulator Hierarki Pembesar & Pelabuhan Melaka","labCaption":"Uji keempat-empat senario tugas Pembesar Berempat dan klik foto Pelabuhan Melaka untuk menghayati sistem cukai & kawalan darat-laut.","bullets":["Pembesar Berempat & Pembantu: Bendahara, Penghulu Bendahari, Temenggung dan Laksamana dibantu Syahbandar, Bentara, Orang Kaya, hulubalang dan penghulu.","Kawasan Pegangan: Wilayah, sungai atau pulau yang dikurniakan Sultan kepada Pembesar Berempat untuk ditadbir serta dikutip cukainya.","Sistem Kewangan Teratur: Pendapatan datang daripada perdagangan, cukai pelabuhan (dikutip Syahbandar), cukai pegangan dan ufti wilayah; digunakan untuk membeli senjata dan membina istana.","Bendahara Tun Perak elaka (25 Fasal)","summary":"Kedua-dua undang-undang bertulis ini berteraskan hukum syariah dan hukum adat. Hukum Kanun Melaka mengawal urusan darat serta istana (44 Fasal), manakala Undang-Undang Laut Melaka digubal nakhoda (Jenal, Diri dan Sahak) atas perkenan Sultan Mahmud Shah (25 Fasal).","labId":"sej_kanun_laut_deck","labTitle":"Meja Manuskrip Interaktif Dwi-Kanun Melaka","labCaption":"Buka helaian Fasal 1, 4, 5.1, 26, 30 (Darat) dan Fasal 5, 6.3, 9, 13.1, 13.3 (Laut) untuk menguasai butiran wajib SPM (+5 XP).","bullets":["Hukum Kanun Melaka (44 Fasal): Fasal 1 (tugas Sultan, Bendahara, Temenggung, Penghulu Bendahari); Fasal 4 (bunuh jika ingkar arahan & palsukan titah); Fasal 5.1 (bunuh tanpa pengetahuan raja dihukum bunuh); Fasal 26 (nikah perlukan 4 saksi atau 2 jika tak cukup — hamba & wanita dilarang jadi saksi); Fasal 30 (haram riba, peniaga mesti akil baligh, siuman & lafaz niat).","Perkataan Khusus Raja: Hanya raja boleh menuturkan perkataan 'titah', 'murka', 'kurnia' dan 'anugerah' — rakyat dilarang mempersendakan atau menggunakannya.","Undang-Undang Laut Melaka (25 Fasal): Diusahakan Nakhoda Jenal, Nakhoda Diri dan Nakhoda Sahak, diperkenan Sultan Mahmud Shah. Pegawai kapal merangkumi nakhoda (ibarat raja di laut), jurumudi, malim dan jurubatu.","Fasal Utama Pelayaran: Fasal 5 (bunuh di kapal dihukum mati); Fasal 6.3 (cukai 1/10 jika penumpang turun awal); Fasal 9 (malim wajib tahu ombak, arus, bulan & bintang); Fasal 13.1 (keutamaan nakhoda berniaga 4 hari); Fasal 13.3 (mesyuarat jika singgah tempat luar senarai)."],"examTip":"Jangan sesekali tertukar nombor fasal SPM: Fasal 30 Hukum Kanun Melaka (haram riba/perdagangan darat) vs Fasal 13.1 Undang-Undang Laut Melaka (nakhoda berniaga 4 hari di pelabuhan)!","xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Meja Manuskrip Dwi-Kanun","voiceCaption":"Inilah bahagian yang amat kerap disoal dalam peperiksaan S P M — fasal demi fasal Hukum Kanun Melaka dan Undang-Undang Laut Melaka! Klik setiap fasal pada meja manuskrip di bawah!","voiceScript":"[excited] Inilah bahagian yang amat kerap disoal dalam peperiksaan S P M — fasal demi fasal Hukum Kanun Melaka dan Undang-Undang Laut Melaka! Klik setiap fasal pada meja manuskrip di bawah!"},{"type":"sort","prompt":"Asingkan fasal berikut sama ada terkandung dalam Hukum Kanun Melaka (44 Fasal) atau Undang-Undang Laut Melaka (25 Fasal):","buckets":[{"id":"kanun","label":"Hukum Kanun Melaka (44 Fasal)"},{"id":"laut","label":"Undang-Undang Laut Melaka (25 Fasal)"}],"items":[{"text":"Fasal 30: Pengharaman riba serta syarat akil baligh dalam perniagaan","bucketId":"kanun","note":"Betul! Fasal 30 ialah fasal ekonomi dalam Hukum Kanun Melaka."},{"text":"Fasal 9: Malim wajib mahir ilmu ombak, arus, bulan dan bintang","bucketId":"laut","note":"Tepat! Keselamatan pelayaran oleh malim ditetapkan dalam UU Laut Melaka."},{"text":"Fasal 26: Pernikahan memerlukan 4 saksi atau 2 saksi jika tidak cukup","bucketId":"kanun","note":"Betul! Undang-undang kekeluargaan terletak di bawah Hukum Kanun Melaka."},{"text":"Fasal 13.1: Nakhoda diberi keutamaan berniaga selama empat hari","bucketId":"laut","note":"Tepat! Keutamaan nakhoda sebagai raja di atas kapal terdapat dalam UU Laut Melaka."},{"text":"Fasal 4: Hukuman bunuh terhadap sesiapa yang memalsukan titah sultan","bucketId":"kanun","note":"Betul! Kesalahan ingkar perintah & memalsukan titah di darat dikawal Fasal 4 Hukum Kanun Melaka."}],"explanation":"Pemisahan jelas antara 44 fasal Hukum Kanun Melaka (darat/istana/nikah/riba) dan 25 fasal Undang-Undang Laut Melaka (pelayaran/malim/nakhoda) membuktikan kemodenan undang-undang Melaka.","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Peruntukan Fasal","voiceCaption":"Uji kecekapan awak membezakan fasal darat dan fasal pelayaran! Isihkan kelima-lima peruntukan berikut ke dalam kanun yang betul.","voiceScript":"[warm] Uji kecekapan awak membezakan fasal darat dan fasal pelayaran! Isihkan kelima-lima peruntukan berikut ke dalam kanun yang betul."},{"type":"match","prompt":"Padankan nombor fasal undang-undang Melaka dengan kandungannya yang tepat:","pairs":[{"id":"fs1","left":"Fasal 5.1 (Hukum Kanun Melaka)","right":"Hukuman bunuh jika membunuh tanpa pengetahuan raja atau pembesar"},{"id":"fs2","left":"Fasal 6.3 (UU Laut Melaka)","right":"Cukai 1/10 jika penumpang turun sebelum tamat janji 3 tahun/bulan/hari"},{"id":"fs3","left":"Fasal 13.3 (UU Laut Melaka)","right":"Nakhoda perlu bermesyuarat jika mahu singgah luar senarai"},{"id":"fs4","left":"Fasal 1 (Hukum Kanun Melaka)","right":"Menjelaskan bidang tugas Sultan, Bendahara, Temenggung & Penghulu Bendahari"}],"explanation":"Keempat-empat fasal ini adalah sasaran wajib soalan Kertas 1 dan bahagian struktur Kertas 2 Sejarah Tingkatan 4.","xp":15,"voiceIdKey":"u4-s3","voiceToneLabel":"Padanan Fasal Tepat","voiceCaption":"Sekarang padankan nombor fasal yang spesifik dengan hukumannya supaya awak tidak terkeliru dalam kertas peperiksaan!","voiceScript":"[curious] Sekarang padankan nombor fasal yang spesifik dengan hukumannya supaya awak tidak terkeliru dalam kertas peperiksaan!"},{"type":"wordbank","prompt":"Susun empat (4) perkataan khusus yang hanya boleh digunakan oleh raja mengikut Hukum Kanun Melaka:","hint":"Pilih 4 perkataan rasmi diraja dan abaikan dua pengganggu.","answerTokens":["titah,","murka,","kurnia","dan anugerah."],"distractors":["syahbandar,","waadat"],"acceptedSequences":[["titah,","murka,","kurnia","dan anugerah."],["murka,","titah,","kurnia","dan anugerah."]],"explanation":"Dalam Hukum Kanun Melaka, perkataan 'titah', 'murka', 'kurnia' dan 'anugerah' dikhaskan kepada raja dan dilarang sama sekali dipersendakan oleh rakyat.","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Susun Empat Kata Raja","voiceCaption":"Rakyat dilarang menuturkan empat perkataan khusus yang hanya dikhaskan untuk raja dalam Hukum Kanun Melaka! Susun keempat-empat perkataan tersebut.","voiceScript":"[confident] Rakyat dilarang menuturkan empat perkataan khusus yang hanya dikhaskan untuk raja dalam Hukum Kanun Melaka! Susun keempat-empat perkataan tersebut."},{"type":"mcq","prompt":"Berdasarkan Fasal 9 Undang-Undang Laut Melaka, seorang malim hendaklah arif tentang ilmu pelayaran termasuk ombak, arus serta kedudukan bulan dan bintang. Apakah hukuman jika malim lalai hingga menyebabkan pelanggaran dan kerosakan kapal?","options":["Dijatuhkan hukuman bunuh","Dikenakan denda cukai satu persepuluh sahaja","Digantikan serta-merta dengan Penghulu Bendahari","Dihalang daripada berniaga selama empat hari"],"correctIndex":0,"explanation":"Fasal 9 Undang-Undang Laut Melaka menetapkan bahawa malim yang cuai dalam tugasnya sehingga mengakibatkan pelanggaran dan kerosakan kapal akan dijatuhkan hukuman bunuh.","xp":20,"voiceIdKey":"u4-s5","voiceToneLabel":"Kes Lalai Malim Fasal 9","voiceCaption":"Bayangkan seorang malim gagal memerhatikan keadaan ombak dan bintang sehingga menyebabkan kapal dagang Melaka berlanggar dengan batu karang! Apakah hukumannya menurut Fasal sembilan?","voiceScript":"[curious] Bayangkan seorang malim gagal memerhatikan keadaan ombak dan bintang sehingga menyebabkan kapal dagang Melaka berlanggar dengan batu karang! Apakah hukumannya menurut Fasal sembilan?"}],"iconUrl":"../assets/icons/sej-u4.jpg"},{"id":"sej-u5","title":"Waadat Pemerintah & Rakyat","subtitle":"Subtopik 1.4 — Hierarki Sosial, Sistem Serah/Kerah, Perumpamaan & Tulah","iconType":"crown","boss":false,"steps":[{"type":"concept","title":"Golongan Pemerintah, Diperintah & Perjanjian Waadat Bukit Seguntang","summary":"Masyarakat Melaka terbahagi kepada Golongan Pemerintah dan Golongan Diperintah yang dihubungkan oleh Waadat (perjanjian setia Sang Sapurba mewakili raja dengan Demang Lebar Daun mewakili rakyat). Sejarah Melayu mengibaratkan rakyat umpama akar dan raja umpama pohon.","labId":"sej_waadat_scale","labTitle":"Neraca Interaktif Waadat & Hierarki Sosial","labCaption":"Uji kesan pemerintah adil, zalim, atau rakyat derhaka pada neraca di bawah serta semak   function isReducedMotion() {
    return Boolean(typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function makePauseBtnHtml(paused) {
    var icon = paused
      ? '<polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>'
      : '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>';
    return '<button type="button" class="lab-pause-btn" data-pause-toggle="1"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">' + icon + '</svg><span>' + (paused ? "Mainkan Laluan" : "Jeda Laluan") + "</span></button>";
  }

  function buildArchivalPlateHtml(slug, captionText, priorityFirst) {
    var m = SEJ01_MEDIA[slug];
    if (!m) return "";
    var prioAttr = priorityFirst ? ' fetchpriority="high"' : ' loading="lazy"';
    return (
      '<button type="button" class="archival-plate-btn" data-arch-slug="' + slug + '" data-arch-cap="' + captionText.replace(/"/g, "&quot;") + '">' +
        '<img class="archival-plate-img" src="' + m.dataUri + '" alt="' + m.label.replace(/"/g, "&quot;") + '" width="' + m.width + '" height="' + m.height + '"' + prioAttr + ">" +
        '<span class="archival-plate-title">' + m.label + "</span>" +
        '<span class="archival-plate-era">' + m.era + "</span>" +
        '<span class="archival-plate-credit">' + m.credit + "</span>" +
      "</button>"
    );
  }

  function wireArchivalLightbox(mountEl, ctx) {
    mountEl.addEventListener("click", function (ev) {
      var card = ev.target.closest("[data-arch-slug]");
      if (!card) return;
      var slug = card.getAttribute("data-arch-slug");
      var cap = card.getAttribute("data-arch-cap") || "";
      var m = SEJ01_MEDIA[slug];
      if (!m) return;
      if (typeof NotaFeel !== "undefined" && NotaFeel.openArchivalLightbox) {
        NotaFeel.openArchivalLightbox({
          era: m.era,
          title: m.label,
          caption: cap,
          credit: m.credit + (m.sourceUrl ? " • commons.wikimedia.org" : ""),
          src: m.dataUri,
          alt: m.label
        });
      }
      if (ctx && ctx.markInteracted) ctx.markInteracted();
    });
  }

function startUnit(unitIdx) {
  var units = CHAPTER.units || [];
  if (!units[unitIdx]) return;
  if (CHAPTER.enableMultimediaEdition && units[unitIdx].boss && NotaAudio.playBossDrum) {
    NotaAudio.playBossDrum();
  } else {
    NotaAudio.playTap();
  }
  notaState.mode = "lesson";
  notaState.activeUnitIdx = unitIdx;
  notaState.activeStepIdx = 0;
  notaState.hearts = notaState.maxHearts;
  notaState.unitXpEarned = 0;
  notaState.combo = 0;
  notaState.maxCombo = 0;
  notaState.unitCorrect = 0;
  notaState.unitTotal = 0;
  notaState.answeredCurrent = false;

  var applyStart = function () {
    var pathView = document.getElementById("pathView");
    var lessonView = document.getElementById("lessonView");
    if (pathView) pathView.hidden = true;
    if (lessonView) lessonView.hidden = false;
    renderActiveStep(true);
  };
  if (typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStart, "#activeStepHeading");
  } else {
    applyStart();
  }
}

function renderActiveStep(skipViewTransition) {
  var unit = (CHAPTER.units || [])[notaState.activeUnitIdx];
  if (!unit || !Array.isArray(unit.steps) || notaState.activeStepIdx >= unit.steps.length) {
    showCelebration();
    return;
  }

  var applyStep = function () {
    runLabCleanups();
    hideFeedbackDrawer();
    notaState.answeredCurrent = false;
    renderTopHud();
    var lessonView = document.getElementById("lessonView");
    if (!lessonView) return;
    var hasMulti = Boolean(CHAPTER.enableMultimediaEdition);
    lessonView.innerHTML = (hasMulti ? '<div id="cikguCompanionHost"></div>' : "") + '<article class="step-card" id="activeStepCard"></article>';
    var card = document.getElementById("activeStepCard");
    var step = unit.steps[notaState.activeStepIdx];

    if (hasMulti && typeof NotaFeel !== "undefined" && NotaFeel.renderCikguCompanion) {
      var host = document.getElementById("cikguCompanionHost");
      var mood = unit.boss ? "boss" : (notaState.combo >= 3 ? "combo" : "explore");
      var msg = unit.boss
        ? "Ini Cabaran Boss SPM — gabungkan fakta Kertas 1 & teknik huraian Kertas 2!"
        : (step.type === "concept" ? "Klik foto arkib atau peta interaktif untuk membuka butiran lanjut!" : "Baca rangsangan dengan teliti sebelum memilih jawapan!");
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined") {
        msg = NotaVoice.getCleanStepText(step, unit) || msg;
      }
      NotaFeel.renderCikguCompanion(host, mood, msg, step);
      if (CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined" && NotaVoice.autoplayStep) {
        var nextStep = (unit.steps || [])[notaState.activeStepIdx + 1] || null;
        NotaVoice.autoplayStep(unit, step, nextStep);
      }
    }

    if (step.type === "concept") renderConceptStep(step, card);
    else if (step.type === "predict") renderPredictStep(step, card);
    else if (step.type === "match") renderMatchStep(step, card);
    else if (step.type === "wordbank") renderWordbankStep(step, card);
    else if (step.type === "sort") renderSortStep(step, card);
    else renderMcqStep(step, card);

    if (typeof NotaFeel !== "undefined") NotaFeel.applySiblingFallback(card);
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {
    NotaFeel.runViewTransition(applyStep, "#activeStepHeading");
  } else {
    applyStep();
  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function renderConceptStep(step, card) {
  var bulletsHtml = (Array.isArray(step.bullets) ? step.bullets : []).map(function (b) {
    return '<li><span class="bullet-dot" aria-hidden="true"></span><span>' + escapeHtml(b) + "</span></li>";
  }).join("");

  var formulaHtml = step.formula
    ? '<div class="concept-formula-box tabular-nums">' + escapeHtml(step.formula) + "</div>"
    : "";
  var tipHtml = step.examTip
    ? '<div class="concept-exam-tip"><strong>Tip Skor SPM:</strong> ' + escapeHtml(step.examTip) + "</div>"
    : "";
  var labHtml = step.labId
    ? '<div class="lab-shell">' +
        '<div class="lab-header-row">' +
          '<span class="lab-title-pill">' + escapeHtml(step.labTitle || "Eksplorasi Visual Interaktif") + "</span>" +
          '<span id="labInteractedBadge" class="lab-interacted-pill" hidden>+5 XP Eksplorasi!</span>' +
        "</div>" +
        '<div id="conceptLabMount"></div>' +
        (step.labCaption ? '<p class="node-unit-sub" style="margin:0">' + escapeHtml(step.labCaption) + "</p>" : "") +
      "</div>"
    : "";

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("book", "icon-sm") + " <span>Nota Konsep Visual</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || "Konsep Utama") + "</h2>" +
    '<p class="step-summary">' + escapeHtml(step.summary || "") + "</p>" +
    labHtml +
    (bulletsHtml ? '<ul class="concept-bullets">' + bulletsHtml + "</ul>" : "") +
    formulaHtml +
    tipHtml +
    '<div class="step-actions-footer">' +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green">FAHAM &amp; TERUSKAN</button>' +
    "</div>";

  var bonusEarned = false;
  if (step.labId) {
    var mount = document.getElementById("conceptLabMount");
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) badge.hidden = false;
        NotaAudio.playMatch();
      }
    });
  }

  var btn = document.getElementById("conceptDoneBtn");
  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var prevXp = notaState.xp;
      var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0);
      notaState.xp += gain;
      notaState.unitXpEarned += gain;
      NotaAudio.playCorrect(1);
      spawnXpFloat(gain, btn);
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(btn, 8);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      saveNotaState();
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderPredictStep(step, card) {
  var letters = ["A", "B", "C", "D"];
  var opts = Array.isArray(step.options) ? step.options : [];
  var optsHtml = opts.map(function (opt, idx) {
    return (
      '<button type="button" class="tactile-choice js-predict-opt" data-opt-idx="' + idx + '">' +
        '<span class="choice-key">' + (letters[idx] || (idx + 1)) + "</span>" +
        "<span>" + escapeHtml(opt) + "</span>" +
      "</button>"
    );
  }).join("");

  var scenarioHtml = step.scenario
    ? '<div class="lab-callout">' + escapeHtml(step.scenario) + "</div>"
    : "";
  var stimulusHtml = step.stimulusHtml
    ? '<div class="stimulus-box">' + step.stimulusHtml + "</div>"
    : "";

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("atom", "icon-sm") + " <span>Ramal &amp; Uji</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || "Buat ramalan anda dahulu:") + "</h2>" +
    scenarioHtml +
    stimulusHtml +
    '<div id="predictOptionsList" class="choice-grid">' + optsHtml + "</div>" +
    '<div id="predictProofShell" class="lab-shell" hidden>' +
      '<div class="lab-header-row"><span class="lab-title-pill">Bukti Visual Langsung</span></div>' +
      '<div id="predictProofMount"></div>' +
    "</div>";

  card.querySelectorAll(".js-predict-opt").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      var chosenIdx = Number(btn.getAttribute("data-opt-idx"));
      var isCorrect = chosenIdx === Number(step.correctIndex);

      card.querySelectorAll(".js-predict-opt").forEach(function (b, idx) {
        b.disabled = true;
        if (idx === Number(step.correctIndex)) b.classList.add("is-correct");
        else if (idx === chosenIdx && !isCorrect) b.classList.add("is-wrong");
      });

      if (step.proofLabId) {
        var proofShell = document.getElementById("predictProofShell");
        var proofMount = document.getElementById("predictProofMount");
        if (proofShell && proofMount) {
          proofShell.hidden = false;
          mountLabWidget(proofMount, step.proofLabId, {
            mode: "proof",
            proofState: step.proofState || null,
            markInteracted: function () {}
          });
        }
      }

      handleStepOutcome(isCorrect, step.explanation || "", Number(step.xp) || 20, btn);
    });
  });
}
