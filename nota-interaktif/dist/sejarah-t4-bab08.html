/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}

.nota-topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface-card);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-primary) 58%, var(--brand-accent) 100%);
  color: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 12px 28px rgba(30, 58, 138, 0.22);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #dbeafe; line-height: 1.5; }

.hero-mastery-box {
  background: rgba(15, 23, 42, 0.28);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #eff6ff; }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface-card);
  border: 2px solid var(--border-subtle);
  text-align: center;
  width: 100%;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */
:root {

  --dom-media: #7c3aed;
}

.lab-shell {
  border-radius: 16px;
  border: 2px solid var(--brand-border);

  flex-direction: column;
  gap: 12px;
}
.lab-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lab-title-pill { font-family: var(--font-heading); font-size: 0.82rem; font-weight: 700; color: var(--brand-primary); }
.lab-interacted-pill {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;

  border: 1px solid #a7f3d0;
}
.lab-stage {

  border-radius: 12px;
  padding: 10px;
  overflow: hidden;
}
.lab-stage svg, .lab-stage canvas { display: block; width: 100%; height: auto; }
.lab-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.lab-seg-btn {
  min-height: 44px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}
.lab-seg-btn[aria-pressed="true"] { border-color: var(--brand-accent); background: var(--brand-accent); color: #ffffff; }
.lab-pause-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 12px;
  border-radius: 10px;
  border: 2px solid var(--brand-border);
  background: var(--surface-card);

  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.lab-pause-btn:hover { background: var(--brand-soft); border-color: var(--brand-accent); }
.lab-pause-btn:focus-visible, .lab-seg-btn:focus-visible, .lab-tokoh-pill:focus-visible { outline: 3px solid var(--brand-accent); outline-offset: 2px; }

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-tokoh-pill {
  min-height: 38px;
  padding: 6px 11px;
  border-radius: 999px;
  border: 1.5px solid var(--border-subtle);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.lab-tokoh-pill[aria-pressed="true"] { border-color: var(--dom-media); background: #f5f3ff; color: #5b21b6; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1.5px solid var(--border-subtle);
  font-size: 0.79rem;
  line-height: 1.42;
  color: var(--text-secondary);
}
.lab-phase-step strong { display: block; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--brand-primary); margin-bottom: 2px; }
.lab-metric-card { padding: 10px 12px; border-radius: 12px; background: var(--surface-card); border: 1.5px solid var(--brand-border); }

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }
.lab-slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.lab-meter {
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
}
.lab-meter-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.lab-meter-val { display: block; font-family: var(--font-mono); font-size: 0.94rem; font-weight: 800; color: var(--brand-navy); }
.lab-callout {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border-left: 4px solid var(--brand-accent);
  font-size: 0.86rem;
  line-height: 1.5;
  color: var(--text-primary);
}
.stimulus-box {
  padding: 12px;
  border-radius: 12px;
  background: var(--surface-page);
  border: 1px solid var(--border-subtle);

}

/* Modals & Celebration */
.modal-overlay {
  position: fixed;
  inset: 0;

  background: rgba(15, 23, 42, 0.62);
  backdrop-filter: blur(4px);

  place-items: center;

}
.modal-overlay[hidden] { display: none; }
.confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 71; }
.modal-card {

  max-width: 440px;

.cel-stars-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }

@media (prefers-reduced-motion: no-preference) {

.cel-eyebrow {

.cel-title { font-family: var(--font-heading); font-size: 1.35rem; color: var(--brand-navy); margin: 8px 0 6px; }
.cel-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin: 0 0 16px; line-height: 1.5; }
.cel-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.cel-stat-box { padding: 10px 6px; border-radius: 12px; background: var(--surface-page); border: 1px solid var(--border-subtle); }
.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.cel-stat-val { display: block; font-size: 1.02rem; font-weight: 800; color: var(--brand-primary); margin-top: 2px; }
.cel-actions { display: flex; flex-direction: column; gap: 10px; }
.heart-modal-icon {

  height: 60px;

}

/* Butang Suara Tunggal Gaya Duolingo (Khusus ElevenLabs v4 + WCAG 1.4.2) */

}

  height: 5px;
  border-radius: 2px;

}

.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(2) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.16s; }
.cikgu-companion-bar.is-speaking .voice-eq-bar:nth-child(3) { animation: voiceEqPulse 0.65s ease-in-out infinite 0.32s; }
.cikgu-mascot-svg .cikgu-wing-l { transform-box: fill-box; transform-origin: right center; }

.cikgu-companion-bar.is-speaking .cikgu-mascot-svg { animation: owlSpeakBob 0.55s ease-in-out infinite; }

.cikgu-companion-bar.is-speaking .cikgu-wing-r { animation: owlWingR 0.45s ease-in-out infinite; }
@keyframes owlSpeakBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}</style>
</head>
<body>
  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>
  </div>

n":"Susun empat detik perkembangan pilihan raya awal dari tahun 1950 hingga pilihan raya Sabah 1962.","voiceScript":"[curious] Susun empat tonggak utama perkembangan pilihan raya awal daripada Ordinan seribu sembilan ratus lima puluh sehingga pilihan raya tempatan Sabah seribu sembilan ratus enam puluh dua!","prompt":"Susun kronologi perkembangan pilihan raya peringkat awal di negara kita mengikut urutan tahun:","hint":"Bermula dengan Ordinan Pihak Berkuasa Tempatan (1950) dan berakhir di Sabah pada Disember 1962.","answerTokens":["Ordinan Pilihan Raya Pihak Berkuasa Tempatan (1950) & George Town (1951)","UMNO KL & MCA Selangor menang 9/12 kerusi di Kuala Lumpur (Feb 1952)","Pilihan Raya Negeri menyaksikan Perikatan menang 226/268 kerusi (1954)","Sarawak mula pilihan raya KMC (1956) & Sabah adakan 118 ward (16 Dis 1962)"],"distractors":["Pembubaran Kabinet Pertama di King's House (1949)","Penyerahan SBUB di Jesselton (1964)"],"explanation":"Pilihan raya bermula secara berperingkat daripada peringkat tempatan George Town (1951), Kuala Lumpur (1952), negeri (1954), serta Sarawak (1956) dan Sabah (1962).","voiceIdKeyHint":"u1-s7"},{"type":"mcq","xp":20,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Fakta 8.1 & Soalan Buku Teks","voiceCaption":"Semak penguasaan tentang pilihan raya terawal negara serta gabungan UMNO-MCA di Kuala Lumpur.","voiceScript":"[confident] Soalan terakhir Unit satu! Berdasarkan fakta buku teks dan jadual keputusan seribu sembilan ratus lima puluh dua, apakah bukti utama yang ditunjukkan oleh kemenangan dua ratus dua puluh enam kerusi Perikatan pada tahun seribu sembilan ratus lima puluh empat?","prompt":"Apakah bukti penting daripada kejayaan gabungan UMNO-MCA di Majlis Perbandaran Kuala Lumpur (1952) dan Pilihan Raya Negeri 1954 (226 daripada 268 kerusi)?","options":["Penerimaan meluas masyarakat terhadap kerjasama politik antara kaum ke arah berkerajaan sendiri","Gabenor Negeri-negeri Selat melantik semula semua ahli majlis perbandaran tanpa undian","Parti Buruh dan IMP memperoleh kemenangan mutlak di seluruh kawasan Petaling Jaya","Pilihan raya majlis daerah hanya boleh disertai oleh golongan pegawai pentadbiran British"],"correctIndex":0,"explanation":"Kemenangan 9/12 kerusi di Kuala Lumpur (1952) dan 226/268 kerusi negeri (1954) membuktikan rakyat menyokong kerjasama antara kaum UMNO-MCA sebagai asas menuju berkerajaan sendiri.","voiceIdKeyHint":"u1-s8"}]},{"id":"sej8-u2","title":"Unit 2: Rundingan Sebelum PRU & Rombongan ke London (1954)","subtitle":"Subtopik 8.2 (Bahagian A) — Jawatankuasa Pilihan Raya (Bentuk A vs Bentuk B), Misi London & Pengorbanan Rakyat","iconType":"scale","iconUrl":"../assets/icons/sej8-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Jawatankuasa 1954: Bentuk A vs B","voiceCaption":"Jawatankuasa Pilihan Raya 46 ahli yang ditubuhkan pada 1 Februari 1954 mencadangkan dua penyata susunan MPP iaitu Bentuk A dan Bentuk B.","voiceScript":"[warm] Sebelum Pilihan Raya Umum Pertama seribu sembilan ratus lima puluh lima boleh diadakan, isu bilangan ahli Majlis Perundangan Persekutuan yang dipilih rakyat perlu diselesaikan! Pada satu Februari seribu sembilan ratus lima puluh empat, Jawatankuasa Pilihan Raya seramai empat puluh enam ahli mengemukakan Bentuk A dengan enam puluh kerusi dipilih berbanding Bentuk B dengan empat puluh empat kerusi dipilih!","title":"8.2 Rundingan Awal: Bentuk A (60) vs Bentuk B (44)","acronym":"46•A60•B44","mediaKey":"sej8_london_delegation_1954","hook":"Tunku Abdul Rahman mahu sekurang-kurangnya tiga perlima anggota MPP dipilih rakyat (Bentuk A), bukan dilantik British!","summary":"Raja-raja Melayu bersetuju mengadakan pilihan raya MPP yang diisytiharkan oleh Sir Donald MacGillivray, lalu Jawatankuasa Pilihan Raya mencadangkan Bentuk A dan Bentuk B.","bullets":["Penubuhan & Pengisytiharan: Raja-raja Melayu bersetuju mengadakan pilihan raya memilih anggota MPP lalu diisytiharkan Sir Donald MacGillivray; sebelum ini keanggotaan MPP dilantik Pesuruhjaya Tinggi dengan mengundang parti politik, pertubuhan kaum serta badan pekerja dan perniagaan.","Perbandingan Bentuk A vs B (1 Feb 1954): Kedua-dua penyata jawatankuasa 46 ahli berkongsi 1 Speaker, 3 ahli dilantik, 11 wakil negeri, 20 wakil kepentingan tertentu, 3 wakil minoriti dan 2 ahli rasmi (Setiausaha Pertahanan & Ekonomi); bezanya Bentuk A (pilihan Tunku & Perikatan) menetapkan 60 ahli dipilih dan pilihan raya selewatnya Nov 1954, manakala Bentuk B (pilihan Jawatankuasa) menetapkan 44 ahli dipilih + 8 tambahan lantikan Pesuruhjaya Tinggi tanpa tarikh tetap."],"labId":"sej8_proses_pru1955_lab","labTitle":"Bandingkan Bentuk A vs Bentuk B & Misi London","labProps":{"tab":"rundingan","bentuk":"A"},"examTip":"Jangan tertukar: Bentuk A = 60 kerusi dipilih (Tunku & Perikatan, selewatnya Nov 1954); Bentuk B = 44 dipilih + 8 lantikan Pesuruhjaya Tinggi (Jawatankuasa Pilihan Raya, tiada tarikh)."},{"type":"predict","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Ramal Pendirian Perikatan Tolak Bentuk B","voiceCaption":"Fikirkan sebab Parti Perikatan menolak Bentuk B walaupun ia turut memperuntukkan 44 kerusi pilihan raya.","voiceScript":"[curious] Mengapakah Tunku Abdul Rahman dan Parti Perikatan tegas menolak cadangan Bentuk B yang disokong oleh Jawatankuasa Pilihan Raya dan sanggup berunding sehingga ke London?","hook":"Apabila suara lantikan Pesuruhjaya Tinggi masih menguasai dewan, bagaimanakah wakil rakyat hendak melaksanakan dasar sendiri?","scenario":"Dalam Bentuk B, hanya 44 orang ahli dipilih melalui pilihan raya manakala 8 orang tambahan serta kerusi lain dilantik oleh Pesuruhjaya Tinggi tanpa menetapkan tarikh pilihan raya.","prompt":"Mengapakah Tunku Abdul Rahman dan Parti Perikatan memilih Bentuk A berbanding Bentuk B?","options":["Memastikan sekurang-kurangnya tiga perlima anggota MPP dipilih terus oleh rakyat dan menetapkan tarikh pilihan raya selewat-lewatnya November 1954","Supaya jawatan Speaker dan Setiausaha Pertahanan turut dimansuhkan sebelum pilihan raya tempatan di George Town","Untuk mengehadkan wakil negeri kepada lima buah negeri sahaja tanpa penyertaan Negeri-negeri Selat","Kerana Bentuk B tidak mengandungi seorang pun ahli rasmi daripada kalangan pegawai kerajaan"],"correctIndex":0,"proofLabId":"sej8_proses_pru1955_lab","proofState":{"tab":"rundingan","bentuk":"B"},"explanation":"Bentuk A menjamin tiga perlima (60) anggota MPP dipilih oleh rakyat supaya kerajaan yang terbentuk benar-benar mewakili mandat pengundi serta menetapkan tempoh tidak lewat November 1954.","voiceIdKeyHint":"u2-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Rombongan ke London & Kompromi 52","voiceCaption":"Rombongan Tunku Abdul Rahman ke London pada April hingga Mei 1954 membawa kepada kompromi 52 kerusi dipilih pada awal Julai 1954.","voiceScript":"[warm] Pada dua puluh satu April seribu sembilan ratus lima puluh empat, Tunku Abdul Rahman bersama Tan Cheng Lock, T H Tan serta Dato Abdul Razak Hussein berangkat ke London! Dengan bantuan Lord Ogmore dan rundingan bersama Setiausaha Tanah Jajahan Oliver Lyttelton, akhirnya pihak British dan Perikatan bersetuju lima puluh dua ahli dipilih melalui pilihan raya!","title":"Rombongan ke London (1954) & Kompromi 52 Kerusi","acronym":"L•O•52K","mediaKey":"sej8_london_delegation_1954","hook":"Walaupun rundingan awal bersama Oliver Lyttelton pada 14 Mei 1954 gagal, ketegasan Perikatan membuahkan kompromi 52 kerusi!","summary":"Diplomasi rombongan Perikatan di Parlimen Britain dan sokongan ahli politik British membuka jalan kepada persetujuan 52 kerusi MPP dipilih rakyat.","bullets":["Misi ke London (21 Apr - 14 Mei 1954): Tunku Abdul Rahman, Tan Cheng Lock dan T.H. Tan disertai Dato' Abdul Razak Hussein menemui ahli Parlimen Parti Buruh, Konservatif dan Liberal dengan pertolongan Lord Ogmore, menghebahkan hasrat melalui akhbar serta berunding dengan Setiausaha Tanah Jajahan Oliver Lyttelton pada 14 Mei 1954.","Kompromi 52 Kerusi & RUU Ogos 1954: Walaupun rundingan 14 Mei gagal mencapai 3/5 ahli dipilih, rombongan disambut meriah di tanah air; awal Julai 1954 British dan Perikatan bersetuju 52 ahli MPP dipilih, diikuti kelulusan Rang Undang-Undang Pilihan Raya Persekutuan Tanah Melayu pada 18-19 Ogos 1954."],"labId":"sej8_proses_pru1955_lab","labTitle":"Kronologi Rundingan London & Persetujuan 52 Kerusi","labProps":{"tab":"rundingan","bentuk":"A"},"examTip":"Ingat 4 tokoh rombongan London 1954: Tunku Abdul Rahman, Tan Cheng Lock, T.H. Tan dan Dato' Abdul Razak Hussein, serta nama Lord Ogmore dan Oliver Lyttelton."},{"type":"sort","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Isih Ciri Bentuk A vs Bentuk B vs Kompromi","voiceCaption":"Kelaskan ciri perbezaan antara Bentuk A (pilihan Perikatan) dengan Bentuk B (pilihan Jawatankuasa Pilihan Raya).","voiceScript":"[curious] Asingkan enam peruntukan berikut sama ada termasuk dalam Bentuk A yang disokong Parti Perikatan atau Bentuk B yang dipilih Jawatankuasa Pilihan Raya!","prompt":"Isihkan peruntukan penyata susunan MPP 1954 berikut mengikut kategori yang tepat:","buckets":[{"id":"ba","label":"Bentuk A (Pilihan Tunku & Perikatan)"},{"id":"bb","label":"Bentuk B (Pilihan Jawatankuasa)"}],"items":[{"text":"60 orang ahli dipilih melalui pilihan raya","bucketId":"ba","note":"Memastikan majoriti tiga perlima ahli dipilih rakyat."},{"text":"44 orang dipilih + 8 tambahan lantikan Pesuruhjaya Tinggi","bucketId":"bb","note":"Mengekalkan pengaruh lantikan Pesuruhjaya Tinggi dalam dewan."},{"text":"Pilihan raya mesti diadakan tidak lewat bulan November 1954","bucketId":"ba","note":"Menetapkan garis masa jelas ke arah pilihan raya umum."},{"text":"Tidak menetapkan tarikh atau masa tertentu bagi pilihan raya","bucketId":"bb","note":"Melambatkan kepastian pelaksanaan pilihan raya umum."}],"explanation":"Bentuk A dan Bentuk B hanya berbeza pada nisbah ahli dipilih vs lantikan Pesuruhjaya Tinggi serta tempoh pelaksanaan sebelum kompromi 52 kerusi dicapai pada Julai 1954.","voiceIdKeyHint":"u2-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Pengorbanan Gelang Emas Siti Rahmah","voiceCaption":"Datuk Siti Rahmah Kassim yang berusia 23 tahun menghulurkan gelang emasnya dan mengumpul barang kemas kaum ibu demi membiayai tambang rombongan Tunku ke London.","voiceScript":"[thoughtful] Detik paling menyentuh hati dalam perjuangan pilihan raya ialah pengorbanan rakyat! Seorang wanita muda berusia dua puluh tiga tahun bernama Siti Rahmah Kosim melangkah menghulurkan gelang emasnya untuk membiayai tambang Tunku ke London, lalu diikuti kaum ibu lain menanggalkan subang, rantai, kerongsang dan cincin ke dalam selendang merah beliau!","title":"Pengorbanan Siti Rahmah Kosim & Kaum Ibu (1954)","acronym":"S•R•K","mediaKey":"sej8_siti_rahmah_sacrifice","hook":"Sanggupkah kamu menyerahkan barang kemas berharga demi membiayai tambang kapal terbang pemimpin negara menuntut hak mengundi?","summary":"Kesungguhan rakyat membiayai rombongan ke London membuktikan perjuangan pilihan raya 1955 lahir daripada pengorbanan seluruh masyarakat.","bullets":["Gelang Emas Siti Rahmah Kosim: Ketika Tunku memaklumkan kekangan dana rombongan ke London, Siti Rahmah Kosim (Datuk Siti Rahmah Kassim, 23 tahun) menghulurkan gelang emasnya lalu mendorong kaum ibu menanggalkan subang, rantai, kerongsang, pin baju dan cincin ke dalam selendang merah.","Sumbangan Hadirin & Rakaman Sejarah: Hadirin di tingkat atas dewan turut menggugurkan wang kertas bernilai RM1 hingga 10 sen ke bawah dewan seperti dicatatkan oleh Ibrahim Mahmood dalam buku Sejarah Perjuangan Bangsa Melayu (1981)."],"examTip":"Kisah Datuk Siti Rahmah Kassim merupakan contoh utama KBAT tentang semangat pengorbanan, jati diri dan kebersamaan rakyat menyokong pemimpin berwibawa."},{"type":"match","xp":15,"voiceIdKey":"u2-s6","voiceToneLabel":"Padan Tokoh Misi London 1954","voiceCaption":"Padankan tokoh tempatan dan British dengan sumbangan mereka semasa rundingan sebelum PRU 1955.","voiceScript":"[confident] Jom padankan empat tokoh penting yang terlibat dalam rundingan Pilihan Raya Umum Pertama dari Tanah Melayu ke kota London!","prompt":"Padankan tokoh berikut dengan peranannya dalam rundingan awal Pilihan Raya Umum Pertama (1954):","pairs":[{"id":"ln1","left":"Datuk Siti Rahmah Kassim","right":"Menghulurkan gelang emas bagi membiayai tambang rombongan ke London"},{"id":"ln2","left":"Lord Ogmore","right":"Membantu Tunku bertemu ahli Parlimen Parti Buruh, Konservatif & Liberal"},{"id":"ln3","left":"Oliver Lyttelton","right":"Setiausaha Tanah Jajahan British yang berunding dengan Tunku (14 Mei 1954)"},{"id":"ln4","left":"Sir Donald MacGillivray","right":"Mengisytiharkan persetujuan Raja-raja Melayu mengadakan pilihan raya MPP"}],"explanation":"Setiap tokoh memainkan peranan unik daripada sokongan akar umbi di Tanah Melayu hingga rundingan rasmi di Pejabat Tanah Jajahan London.","voiceIdKeyHint":"u2-s6"},{"type":"wordbank","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Susun Kronologi Rundingan 1954","voiceCaption":"Susun peristiwa rundingan prapilihan raya dari Februari 1954 hingga kelulusan rang undang-undang pada Ogos 1954.","voiceScript":"[curious] Susun empat langkah rundingan dari penubuhan Jawatankuasa Pilihan Raya pada Februari seribu sembilan ratus lima puluh empat hingga kelulusan undang-undang pilihan raya pada Ogos tahun yang sama!","prompt":"Susun kronologi rundingan awal sebelum Pilihan Raya Umum Pertama pada tahun 1954:","hint":"Bermula dengan pembentukan Jawatankuasa Pilihan Raya 46 ahli (1 Feb 1954) dan berakhir dengan kelulusan RUU (Ogos 1954).","answerTokens":["Jawatankuasa Pilihan Raya 46 ahli bentang Bentuk A & B (1 Feb 1954)","Rombongan Tunku berlepas ke London & jumpa Oliver Lyttelton (Apr-Mei 1954)","British & Perikatan capai kompromi 52 ahli dipilih (Julai 1954)","Rang Undang-Undang Pilihan Raya Persekutuan diluluskan (18-19 Ogos 1954)"],"distractors":["Suruhanjaya Cobbold ditubuhkan di Sarawak","Parlimen Persekutuan bersidang buat pertama kali"],"explanation":"Pertikaian Bentuk A (60) vs Bentuk B (44) dibawa ke London pada April-Mei 1954, menghasilkan kompromi 52 kerusi pada Julai 1954 dan Ordinan Pilihan Raya pada 18-19 Ogos 1954.","voiceIdKeyHint":"u2-s7"},{"type":"mcq","xp":20,"voiceIdKey":"u2-s8","voiceToneLabel":"Uji Hikmah Diplomasi & Perjuangan Rakyat","voiceCaption":"Nilai iktibar daripada kegagalan awal rundingan 14 Mei 1954 yang disambut meriah dan membawa hasil pada Julai 1954.","voiceScript":"[confident] Mengapakah rombongan Tunku Abdul Rahman tetap disambut meriah di Tanah Melayu walaupun rundingan pada empat belas Mei seribu sembilan ratus lima puluh empat bersama Oliver Lyttelton belum mendapat tiga perlima kerusi?","prompt":"Walaupun rundingan dengan Oliver Lyttelton pada 14 Mei 1954 gagal mencapai tuntutan tiga perlima kerusi, mengapakah kepulangan rombongan Tunku tetap disambut meriah di Tanah Melayu?","options":["Rakyat menghargai kesungguhan, keberanian dan perpaduan pemimpin berbilang kaum memperjuangkan hak demokrasi negara","Oliver Lyttelton telah membubarkan Majlis Perundangan Persekutuan serta-merta pada hari yang sama","Semua 46 ahli Jawatankuasa Pilihan Raya bersetuju membatalkan terus pelaksanaan pilihan raya 1955","Lord Ogmore menggantikan Pesuruhjaya Tinggi British sebagai Ketua Menteri sementara"],"correctIndex":0,"explanation":"Sambutan meriah rakyat membuktikan sokongan padu terhadap ketegasan pemimpin berbilang kaum (Tunku, Tan Cheng Lock, Razak, T.H. Tan) yang kemudiannya mendorong British berkompromi dengan 52 kerusi dipilih pada Julai 1954.","voiceIdKeyHint":"u2-s8"}]},{"id":"sej8-u3","title":"Unit 3: 8 Langkah Proses PRU 1955, Pengundi & Keputusan 51 vs 1","subtitle":"Subtopik 8.2 (Bahagian B) — Lord Merthyr, Syarat Pengundi & Calon, Jadual 8.1-8.3 & Laporan Pilihan Raya","iconType":"scroll","iconUrl":"../assets/icons/sej8-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"Langkah 1-4: Sempadan & Pendaftaran","voiceCaption":"Suruhanjaya Penentuan Sempadan Kawasan pimpinan Lord Merthyr membentuk 52 kawasan pada 26 April 1954 sebelum pendaftaran pengundi bermula pada Oktober 1954.","voiceScript":"[warm] Mari kita ikuti lapan langkah rasmi Pilihan Raya Majlis Perundangan Persekutuan seribu sembilan ratus lima puluh lima! Bermula dengan Suruhanjaya Penentuan Sempadan Kawasan pimpinan Lord Merthyr pada dua puluh enam April seribu sembilan ratus lima puluh empat yang melakar lima puluh dua kawasan, diikuti kelulusan rang undang-undang, pendaftaran pengundi pada lapan belas Oktober di Tanah Melayu dan dua puluh sembilan Oktober di Terengganu, serta penamaan calon pada lima belas Jun seribu sembilan ratus lima puluh lima!","title":"8.2 Langkah 1-4: Lord Merthyr, Pendaftaran & Penamaan Calon","acronym":"S•R•P•C","mediaKey":"sej8_boundary_commission_1954","hook":"Pihak British melantik T.E. Smith khas untuk menyelia urusan PRU 1955 secara telus dan sistematik!","summary":"Empat peringkat awal PRU 1955 merangkumi persempadanan 52 kawasan, penguatkuasaan ordinan, pendaftaran pemilih dan penamaan calon.","bullets":["Sempadan (26 Apr 1954) & Ordinan (Ogos 1954): Suruhanjaya Penentuan Sempadan Kawasan pimpinan Lord Merthyr membentuk 52 kawasan parlimen (contoh: Nombor 17 Kawasan Kuala Lumpur Barat); kemudian Rang Undang-Undang diluluskan Ogos 1954 serta Parti Perikatan mendaftar sebagai komponen rasmi.","Daftar Pengundi (Okt 1954) & Penamaan (15 Jun 1955): Pendaftaran bermula 18 Okt 1954 di seluruh Tanah Melayu dan 29 Okt 1954 di Terengganu (Sarawak & Sabah tidak terlibat); syarat pengundi dan syarat calon ditetapkan berbeza dan diselia oleh T.E. Smith."],"labId":"sej8_proses_pru1955_lab","labTitle":"Simulator 8 Langkah PRU 1955 & Syarat Pengundi vs Calon","labProps":{"tab":"proses","idx":0},"examTip":"Perhatikan perbezaan tarikh pendaftaran pengundi: 18 Oktober 1954 seluruh Tanah Melayu, KECUALI Terengganu bermula 29 Oktober 1954!"},{"type":"sort","xp":20,"voiceIdKey":"u3-s2","voiceToneLabel":"Isih Syarat Pengundi vs Syarat Calon 1955","voiceCaption":"Kelaskan kelayakan yang diwajibkan kepada pengundi berbanding kelayakan tambahan yang dikenakan ke atas calon bertanding dalam PRU 1955.","voiceScript":"[curious] Hati-hati dengan tempoh bermastautin! Isihkan enam syarat ini antara syarat menjadi pengundi dengan syarat menjadi calon Pilihan Raya Umum seribu sembilan ratus lima puluh lima!","prompt":"Kelaskan syarat kelayakan Pilihan Raya MPP 1955 berikut mengikut kategori yang tepat:","buckets":[{"id":"undi","label":"Syarat Menjadi Pengundi (1955)"},{"id":"calon","label":"Syarat Khusus Menjadi Calon (1955)"}],"items":[{"text":"Tinggal di Persekutuan Tanah Melayu dalam tempoh 6 bulan terdahulu","bucketId":"undi","note":"Dikira dari 17 Okt 1954 (atau 28 Okt 1954 bagi Terengganu)."},{"text":"Tinggal di Persekutuan Tanah Melayu dalam tempoh 12 bulan sebelum hari penamaan calon","bucketId":"calon","note":"Tempoh bermastautin calon dua kali lebih lama daripada pengundi."},{"text":"Berpengetahuan dalam bahasa Inggeris dan bahasa Melayu","bucketId":"calon","note":"Diperlukan agar wakil rakyat boleh berbahas dalam persidangan MPP."},{"text":"Layak memohon sebagai pemilih bermula 18 Okt 1954 (29 Okt di Terengganu)","bucketId":"undi","note":"Kedua-dua pengundi & calon mesti warganegara berumur 21 tahun ke atas."}],"explanation":"Walaupun kedua-duanya mesti warganegara PTM berumur 21 tahun ke atas, pengundi perlu bermastautin 6 bulan terdahulu sedangkan calon wajib bermastautin 12 bulan sebelum penamaan calon serta mahir bahasa Melayu dan Inggeris.","voiceIdKeyHint":"u3-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Langkah 5-8: Kempen 45 Hari & Mengundi","voiceCaption":"Kempen 45 hari menampilkan manifesto kemerdekaan empat tahun oleh Parti Perikatan sebelum hari mengundi bersejarah pada 27 Julai 1955.","voiceScript":"[excited] Selepas penamaan calon, kempen pilihan raya berlangsung selama empat puluh lima hari! Parti Perikatan menggunakan manifesto mencapai kemerdekaan dalam masa empat tahun dan mewajibkan pendidikan semua kaum. Hari mengundi pula diadakan pada dua puluh tujuh Julai seribu sembilan ratus lima puluh lima di bawah kawalan ketat kerani pengundian dan wakil parti!","title":"Langkah 5-8: Kempen 45 Hari, Manifesto & Mengundi (27 Julai 1955)","acronym":"45H•27J•6P","mediaKey":"sej8_campaign_manifesto_1955","hook":"Manifesto Parti Perikatan menjanjikan kemerdekaan dalam tempoh empat tahun sebagai tarikan utama kepada 1.28 juta pengundi!","summary":"Empat langkah terakhir meliputi kempen 45 hari dengan poster serta manifesto, pengundian 27 Julai 1955, pengiraan undi dan pengumuman keputusan.","bullets":["Kempen 45 Hari & Manifesto Perikatan: Calon berkempen menggunakan poster dan ceramah; manifesto Perikatan ialah mencapai kemerdekaan dalam masa 4 tahun, mewajibkan pendidikan kepada semua kaum, menjadikan perkhidmatan awam bercorak tempatan, menjaga hak asasi manusia dan melindungi hak Raja-raja Melayu sebagai Raja Berperlembagaan.","Hari Mengundi (27 Julai 1955) & Pengiraan: Bilik mengundi dikawal kerani pengundian, tempat mengundi, kotak undi, wakil parti politik dan ketua bilik mengundi sebelum peti undi dikira dan keputusan diumumkan; masa kini SPR mengendalikan 6 peringkat bermula Pengeluaran Writ hingga Pengumuman Keputusan."],"labId":"sej8_proses_pru1955_lab","labTitle":"Teroka Kempen 45 Hari, Bilik Mengundi & 6 Peringkat SPR","labProps":{"tab":"proses","idx":4},"examTip":"Hafal 5 isi manifesto Parti Perikatan (1955) untuk soalan KBAT/Aktiviti Fail Edar buku teks."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Sebab Syarat Dwibahasa Calon 1955","voiceCaption":"Analisis sebab syarat calon PRU 1955 mewajibkan penguasaan bahasa Melayu dan bahasa Inggeris.","voiceScript":"[curious] Mengapakah syarat menjadi calon Pilihan Raya Umum seribu sembilan ratus lima puluh lima mewajibkan pengetahuan dalam kedua-dua bahasa iaitu bahasa Melayu dan bahasa Inggeris?","hook":"Apakah bahasa rasmi perundangan dan dokumen perlembagaan yang diguna pakai dalam Majlis Perundangan Persekutuan pada tahun 1955?","scenario":"Selain warganegara Persekutuan Tanah Melayu, berumur 21 tahun ke atas dan bermastautin 12 bulan sebelum penamaan calon, calon PRU 1955 wajib berpengetahuan dalam bahasa Inggeris dan bahasa Melayu.","prompt":"Mengapakah pengetahuan bahasa Melayu dan bahasa Inggeris disyaratkan kepada setiap calon Pilihan Raya MPP 1955?","options":["Membolehkan wakil rakyat berbahas dasar, memahami draf undang-undang British dan menyampaikan suara rakyat tempatan dalam MPP secara berkesan","Supaya semua calon boleh dihantar bertanding dalam pilihan raya perbandaran di Kota London","Untuk membatalkan hak mengundi pengundi luar bandar di Terengganu dan Kelantan","Kerana T.E. Smith hanya membenarkan pengundi menulis nama calon dalam bahasa Inggeris di atas kertas undi"],"correctIndex":0,"proofLabId":"sej8_proses_pru1955_lab","proofState":{"tab":"proses","idx":3},"explanation":"Pentadbiran MPP ketika fasa peralihan 1955 masih mengendalikan dokumen rasmi dan perbahasan dalam bahasa Inggeris di samping keperluan berkhidmat dan berkomunikasi dengan rakyat dalam bahasa Melayu.","voiceIdKeyHint":"u3-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s5","voiceToneLabel":"Jadual 8.1-8.3: 1.28 Juta & 51 vs 1","voiceCaption":"Sebanyak 1.28 juta pengundi berdaftar menyertai PRU 1955 dengan Parti Perikatan memenangi 51 kerusi manakala PAS memenangi 1 kerusi di Kerian, Perak.","voiceScript":"[excited] Inilah data paling penting dalam Jadual lapan perpuluhan satu hingga lapan perpuluhan tiga! Daripada satu perpuluhan dua lapan juta pengundi berdaftar dengan lapan puluh empat perpuluhan dua peratus Melayu, sebelas perpuluhan dua peratus Cina dan tiga perpuluhan sembilan peratus India, Parti Perikatan menyapu bersih lima puluh satu daripada lima puluh dua kerusi manakala PAS memenangi satu kerusi di Kerian Perak melalui Haji Ahmad Tuan Hussain!","title":"Data Jadual 8.1-8.3: Pengundi, 52 Kerusi & Keputusan 51 vs 1","acronym":"1.28J•51-1","mediaKey":"sej8_polling_day_1955","hook":"Perikatan meraih 79.6% undi (51 kerusi), sedangkan Parti Negara bertanding 30 kerusi namun gagal memenangi walau satu kerusi pun!","summary":"Jadual 8.1 hingga 8.3 merakam pecahan pengundi mengikut kaum, agihan 52 kerusi di 11 negeri dan keputusan kemenangan besar Parti Perikatan.","bullets":["Jadual 8.1 & 8.2 (1,280,000 Pengundi & 52 Kerusi): Pengundi terdiri daripada Melayu 1,078,000 (84.2%), Cina 143,000 (11.2%), India 50,000 (3.9%) dan Lain-lain 9,000 (0.7%); agihan 52 kerusi negeri ialah Perak (10), Johor (8), Selangor (7), Kedah (6), Kelantan (5), Pulau Pinang (4), N. Sembilan (3), Pahang (3), Terengganu (3), Melaka (2) dan Perlis (1).","Jadual 8.3 Keputusan & Laporan 1955: Perikatan (52 calon, 51 kerusi, 818,013 undi / 79.6%), PAS (11 calon, 1 kerusi iaitu Haji Ahmad Tuan Hussain di Kerian Perak, 40,667 undi / 3.9%), Parti Negara (30 calon, 0 kerusi, 78,909 undi), Bebas (18 calon, 0 kerusi), Parti Kebangsaan Perak, Liga Melayu Perak, Parti Buruh & Parti Progresif Perak (0 kerusi); Laporan Pilihan Raya Pertama MPP 1955 menggariskan aturan pembahagian kawasan dan perjalanan pilihan raya."],"labId":"sej8_proses_pru1955_lab","labTitle":"Graf Data Jadual 8.1, 8.2 (52 Kerusi) & Keputusan 8.3","labProps":{"tab":"keputusan"},"examTip":"Hafal jumlah pengundi 1.28 juta (84.2% Melayu) dan pemenang tunggal bukan Perikatan: Haji Ahmad Tuan Hussain (PAS) di Kerian, Perak."},{"type":"match","xp":15,"voiceIdKey":"u3-s6","voiceToneLabel":"Padan Data Jadual 8.1-8.3 PRU 1955","voiceCaption":"Padankan parti, negeri dan data demografi pengundi Jadual 8.1-8.3 dengan angka yang tepat.","voiceScript":"[confident] Uji ketelitian kamu terhadap jadual buku teks! Padankan empat fakta statistik Pilihan Raya Umum seribu sembilan ratus lima puluh lima ini dengan angka yang betul.","prompt":"Padankan entiti Pilihan Raya MPP 1955 berikut dengan datanya dalam Jadual 8.1-8.3:","pairs":[{"id":"jd1","left":"Parti Perikatan (52 calon)","right":"Memenangi 51 kerusi dengan 818,013 undi (79.6%)"},{"id":"jd2","left":"PAS (Haji Ahmad Tuan Hussain)","right":"Memenangi 1 kerusi di Kerian, Perak dengan 40,667 undi keseluruhan (3.9%)"},{"id":"jd3","left":"Perak & Johor (Jadual 8.2)","right":"Dua negeri dengan agihan kerusi terbanyak iaitu 10 kerusi dan 8 kerusi"},{"id":"jd4","left":"Parti Negara (30 calon)","right":"Memperoleh 78,909 undi (7.6%) namun gagal memenangi sebarang kerusi"}],"explanation":"Jadual 8.2 menunjukkan Perak (10) dan Johor (8) mendapat kerusi terbanyak daripada 52 kerusi, manakala Jadual 8.3 menunjukkan Perikatan meraih 51 kerusi dan PAS 1 kerusi.","voiceIdKeyHint":"u3-s6"},{"type":"wordbank","xp":20,"voiceIdKey":"u3-s7","voiceToneLabel":"Susun 8 Peringkat Proses PRU 1955","voiceCaption":"Susun urutan proses pelaksanaan Pilihan Raya Majlis Perundangan Persekutuan 1955 daripada penentuan sempadan hingga pengumuman.","voiceScript":"[curious] Susun empat fasa utama proses Pilihan Raya Majlis Perundangan Persekutuan seribu sembilan ratus lima puluh lima dari April seribu sembilan ratus lima puluh empat hingga Julai seribu sembilan ratus lima puluh lima!","prompt":"Susun urutan pelaksanaan Pilihan Raya Majlis Perundangan Persekutuan 1955 secara kronologi:","hint":"Bermula dengan Suruhanjaya Lord Merthyr membentuk 52 kawasan dan berakhir dengan pengiraan serta pengumuman.","answerTokens":["Suruhanjaya Penentuan Sempadan bentuk 52 kawasan (26 Apr 1954) & RUU (Ogos 1954)","Pendaftaran 1.28 juta pengundi bermula (18 Okt 1954 / 29 Okt Terengganu)","Penamaan calon (15 Jun 1955) diikuti kempen pilihan raya selama 45 hari","Hari mengundi (27 Julai 1955), pengiraan peti undi & pengumuman keputusan"],"distractors":["Pengeluaran writ Suruhanjaya Pilihan Raya Sabah (1962)","Majlis Perbandaran George Town mula mendaftar pengundi (1951)"],"explanation":"Proses lengkap PRU 1955 berjalan teratur dalam lapan langkah dari persempadanan (Apr 1954), undang-undang (Ogos 1954), daftar pengundi (Okt 1954), penamaan (15 Jun 1955), kempen 45 hari, hingga mengundi (27 Julai 1955) dan pengumuman.","voiceIdKeyHint":"u3-s7"},{"type":"mcq","xp":20,"voiceIdKey":"u3-s8","voiceToneLabel":"Uji Integriti Bilik Mengundi & Jadual 8.2","voiceCaption":"Fahami sebab perbezaan agihan kerusi negeri dalam Jadual 8.2 serta kepentingan mengawal ketat proses mengundi.","voiceScript":"[confident] Mengapakah terdapat perbezaan jumlah kerusi antara negeri dalam Jadual lapan perpuluhan dua, misalnya Perak sepuluh kerusi manakala Perlis hanya satu kerusi?","prompt":"Berdasarkan Jadual 8.2, mengapakah Perak diperuntukkan 10 kerusi sedangkan Perlis hanya diperuntukkan 1 kerusi dalam Pilihan Raya Umum 1955?","options":["Bilangan kerusi diagihkan mengikut keluasan kawasan serta taburan jumlah penduduk atau pengundi yang berdaftar di setiap negeri","Perlis enggan menghantar wakil menyertai Jawatankuasa Pilihan Raya 46 orang ahli pada Februari 1954","Hanya negeri-negeri di pantai barat yang dibenarkan menamakan calon bertanding di bawah Parti Perikatan","Suruhanjaya Lord Merthyr mengehadkan kerusi berdasarkan jumlah kerusi Majlis Perbandaran tahun 1951"],"correctIndex":0,"explanation":"Pembahagian 52 kawasan oleh Suruhanjaya Lord Merthyr mengambil kira jumlah penduduk, keluasan dan taburan pengundi supaya perwakilan setiap negeri adalah seimbang.","voiceIdKeyHint":"u3-s8"}]},{"id":"sej8-u4","title":"Unit 4: Penubuhan Majlis Perundangan Persekutuan (MPP)","subtitle":"Subtopik 8.3 — Banding MPP 1948 vs MPP 1955, Halimahton Abdul Majid, Speaker Raja Muhammad Uda & Kesannya","iconType":"crown","iconUrl":"../assets/icons/sej8-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"Banding MPP 1948 vs MPP 1955","voiceCaption":"Kemenangan 51 kerusi Perikatan menukar komposisi Majlis Perundangan Persekutuan daripada 77 anggota lantikan (1948) kepada 100 anggota (1955) yang didominasi 52 wakil dipilih rakyat.","voiceScript":"[warm] Berikutan kemenangan besar dalam pilihan raya, Tunku Abdul Rahman dilantik sebagai Ketua Menteri pertama dan Majlis Perundangan Persekutuan berubah wajah! Pada tahun seribu sembilan ratus empat puluh lapan, MPP mempunyai tujuh puluh tujuh ahli yang semuanya dilantik; pada tahun seribu sembilan ratus lima puluh lima pula, jumlahnya meningkat kepada seratus ahli dengan lima puluh dua orang dipilih langsung oleh rakyat!","title":"8.3 Evolusi Struktur MPP 1948 (77) vs MPP 1955 (100)","acronym":"77->100","mediaKey":"sej8_mpp_chamber_1955","hook":"Buat julung kalinya, suara rakyat yang dipilih melalui peti undi mengatasi jumlah pegawai yang dilantik oleh kerajaan penjajah!","summary":"Penubuhan MPP 1955 merombak keanggotaan majlis menggubal undang-undang daripada ahli lantikan British kepada majoriti wakil pilihan rakyat.","bullets":["MPP 1948 (Jumlah 77 Anggota): 52 ahli tidak rasmi dilantik daripada masyarakat tertentu, 3 ex officio (Ketua Setiausaha Kerajaan, Setiausaha Kewangan, Peguam Besar Persekutuan), 9 Residen British mewakili Majlis Negeri, 2 wakil Negeri-negeri Selat (Pulau Pinang & Melaka) dan 11 ahli rasmi Pegawai Pentadbiran Kerajaan.","MPP 1955 (Jumlah 100 Anggota): 52 ahli dipilih melalui pilihan raya, 35 ahli lantikan mewakili kumpulan berkepentingan (keusahawanan, perlombongan, perindustrian & pertanian), 11 Menteri Besar mewakili negeri serta 2 wakil Negeri-negeri Selat (Pulau Pinang & Melaka)."],"labId":"sej8_mpp_comparator_lab","labTitle":"Komparator Struktur Dewan MPP 1948 vs MPP 1955","labProps":{"tab":"banding","year":"1955"},"examTip":"Hafal perbezaan tepat Jadual MPP buku teks: 1948 = 77 ahli (9 Residen + 11 rasmi + 3 ex officio); 1955 = 100 ahli (52 dipilih rakyat + 35 lantikan berkepentingan + 11 Menteri Besar + 2 NNS)."},{"type":"sort","xp":20,"voiceIdKey":"u4-s2","voiceToneLabel":"Isih Komposisi MPP 1948 vs MPP 1955","voiceCaption":"Kelaskan kategori keanggotaan sama ada tergolong dalam Majlis Perundangan Persekutuan 1948 atau 1955.","voiceScript":"[curious] Asingkan enam kumpulan keanggotaan berikut ke dalam Dewan Majlis Perundangan Persekutuan tahun seribu sembilan ratus empat puluh lapan atau tahun seribu sembilan ratus lima puluh lima!","prompt":"Isihkan komposisi ahli Majlis Perundangan Persekutuan (MPP) berikut mengikut tahun yang tepat:","buckets":[{"id":"mpp48","label":"MPP 1948 (77 Anggota)"},{"id":"mpp55","label":"MPP 1955 (100 Anggota)"}],"items":[{"text":"52 orang ahli yang dipilih melalui pilihan raya oleh rakyat","bucketId":"mpp55","note":"Menggantikan 52 ahli tidak rasmi lantikan pada tahun 1948."},{"text":"9 orang Residen British mewakili sembilan Majlis Negeri","bucketId":"mpp48","note":"Pada tahun 1955 tugas perwakilan negeri diambil alih 11 Menteri Besar."},{"text":"35 orang ahli lantikan mewakili kumpulan keusahawanan, perlombongan & pertanian","bucketId":"mpp55","note":"Mewakili sektor ekonomi dan kepentingan utama negara."},{"text":"52 orang ahli tidak rasmi dilantik daripada masyarakat tertentu","bucketId":"mpp48","note":"Belum dipilih melalui undian rakyat pada tahun 1948."},{"text":"11 orang Menteri Besar mewakili negeri masing-masing","bucketId":"mpp55","note":"Kepimpinan anak watan menggantikan pegawai Residen British."},{"text":"3 orang ex officio serta 11 ahli rasmi Pegawai Pentadbiran Kerajaan","bucketId":"mpp48","note":"Mengukuhkan kawalan pentadbiran kolonial pada peringkat awal PTM 1948."}],"explanation":"Anjakan paling besar antara MPP 1948 (77 ahli) kepada MPP 1955 (100 ahli) ialah kemunculan 52 wakil pilihan rakyat dan 11 Menteri Besar tempatan.","voiceIdKeyHint":"u4-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Halimahton, Speaker & 31 Ogos 1955","voiceCaption":"Halimaton Abd Majid mengangkat sumpah sebagai ahli wanita pertama MPP, manakala Raja Muhammad Uda dilantik sebagai Yang Dipertua MPP pada perasmian 31 Ogos 1955.","voiceScript":"[excited] Persidangan MPP seribu sembilan ratus lima puluh lima di Dewan Tunku Abdul Rahman pada tiga puluh satu Ogos turut mencipta dua sejarah baharu! Halimaton Abdul Majid mengangkat sumpah sebagai ahli wanita pertama M P P, manakala Raja Muhammad Uda menjadi Yang Dipertua atau Speaker mempengerusikan dewan bersejarah itu!","title":"Halimaton Abd Majid, Yang Dipertua & Sidang 31 Ogos 1955","acronym":"H•U•31O","mediaKey":"sej8_halimahton_woman_mp","hook":"Tepat dua tahun sebelum tarikh kemerdekaan, Tunku berucap pada 31 Ogos 1955 menyifatkan sidang pertama MPP sebagai hari paling bersejarah!","summary":"Sidang sulung MPP 1955 menghimpunkan wakil rakyat termasuk ahli wanita pertama di bawah kepimpinan Yang Dipertua sebelum lahirnya Parlimen Persekutuan 1959.","bullets":["Tokoh Wanita & Speaker: Halimaton Abd Majid (Halimahton Abdul Majid) mengangkat sumpah sebagai ahli wanita pertama MPP, manakala Raja Muhammad Uda (Raja Tun Uda) dilantik sebagai Yang Dipertua Majlis Perundangan Persekutuan.","Ucapan 31 Ogos 1955 & Parlimen 1959: MPP bersidang buat julung kalinya di Dewan Tunku Abdul Rahman, Jalan Ampang KL (31 Ogos 1955) dengan ucapan Tunku tentang rasa muhibah, kesabaran dan keazaman; Parlimen Persekutuan Malaya ditubuhkan pada 11 Sept 1959 dan dirasmikan oleh YDPA Tuanku Abdul Rahman pada 12 Sept 1959."],"labId":"sej8_mpp_comparator_lab","labTitle":"Sorotan Halimahton Abdul Majid, Raja Muhammad Uda & 31 Ogos 1955","labProps":{"tab":"tokoh"},"examTip":"Hafal nama Halimaton Abd Majid (ahli wanita pertama MPP 1955) dan tarikh perasmian MPP (31 Ogos 1955 di Dewan Tunku Abdul Rahman, Jalan Ampang)."},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Tafsir Ucapan Tunku 31 Ogos 1955","voiceCaption":"Buat interpretasi terhadap ungkapan Tunku Abdul Rahman tentang 'hari yang amat penting dalam sejarah Majlis ini'.","voiceScript":"[curious] Mengapakah Tunku Abdul Rahman menyifatkan persidangan pembukaan M P P pada tiga puluh satu Ogos seribu sembilan ratus lima puluh lima sebagai hari yang amat penting dalam sejarah Majlis ini?","hook":"Apakah yang membezakan persidangan 31 Ogos 1955 dengan kesemua persidangan Majlis Perundangan antara tahun 1948 hingga 1954?","scenario":"Dalam ucapannya di Dewan Tunku Abdul Rahman, Jalan Ampang, Kuala Lumpur pada 31 Ogos 1955, Tunku menyeru sokongan Ahli Yang Kehormat serta rakyat dengan semangat muhibah, kesabaran dan keazaman.","prompt":"Apakah maksud ungkapan Tunku Abdul Rahman bahawa 31 Ogos 1955 ialah 'hari yang amat penting dalam sejarah Majlis ini'?","options":["Buat julung kalinya Majlis bersidang sebagai badan berparlimen dengan majoriti ahlinya dipilih rakyat dan diketuai Ketua Menteri tempatan ke arah kemerdekaan","Kerana semua pegawai British termasuk Pesuruhjaya Tinggi telah meninggalkan Tanah Melayu pada pagi tersebut","Menandakan Singapura dan Borneo Utara telah digabungkan secara rasmi dalam Perlembagaan 1955","Kerana Parlimen Persekutuan Tanah Melayu dirasmikan buat kali kedua oleh Yang di-Pertuan Agong"],"correctIndex":0,"proofLabId":"sej8_mpp_comparator_lab","proofState":{"tab":"tokoh"},"explanation":"Buat pertama kalinya, MPP bersidang dengan majoriti ahli dipilih rakyat serta dipimpin oleh Ketua Menteri tempatan menuju status berkerajaan sendiri dan merdeka.","voiceIdKeyHint":"u4-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"4 Kesan Penubuhan MPP 1955","voiceCaption":"Penubuhan MPP membolehkan Ketua Menteri mengambil alih tugas pentadbiran, memansuhkan Sistem Ahli dan mengukuhkan amalan demokrasi berparlimen.","voiceScript":"[warm] Apakah kesan terbesar penubuhan Majlis Perundangan Persekutuan seribu sembilan ratus lima puluh lima? Pertama, Tunku Abdul Rahman mengambil alih pentadbiran daripada Pesuruhjaya Tinggi British secara berperingkat. Kedua, kuasa pegawai British dipindahkan kepada rakyat tempatan sementara Sistem Ahli dimansuhkan!","title":"4 Kesan Utama Penubuhan Majlis Perundangan Persekutuan","acronym":"K•P•S•D","mediaKey":"sej8_mpp_chamber_1955","hook":"Susulan pembentukan MPP dan Kabinet Pertama, Sistem Ahli yang diperkenalkan pada tahun 1951 dimansuhkan secara rasmi!","summary":"Penubuhan MPP membawa pemindahan kuasa pentadbiran berperingkat kepada rakyat tempatan, memansuhkan Sistem Ahli dan membuktikan perkongsian kuasa antara kaum.","bullets":["Peralihan Kuasa & Pemansuhan Sistem Ahli: Kerajaan diketuai Tunku Abdul Rahman sebagai Ketua Menteri mengambil alih pentadbiran daripada Pesuruhjaya Tinggi secara berperingkat (Pesuruhjaya Tinggi masih pegang kepimpinan atasan penentu hala tuju); kuasa pegawai British berpindah kepada rakyat tempatan sementara British menjadi penasihat keselamatan, lalu Sistem Ahli dimansuhkan.","Amalan Demokrasi & Kompromi Kaum: Menunjukkan kejayaan Kerajaan Persekutuan yang dibentuk dan dipimpin oleh rakyat tempatan hasil pilihan pengundi, di samping membuktikan kompromi melalui perkongsian kuasa antara kaum bagi mencapai kemerdekaan."],"labId":"sej8_mpp_comparator_lab","labTitle":"Teroka 4 Kesan Penubuhan MPP 1955","labProps":{"tab":"kesan"},"examTip":"Fakta penting Kertas 2: Selepas MPP 1955 ditubuhkan, Sistem Ahli dimansuhkan, namun Pesuruhjaya Tinggi masih memegang kepimpinan atasan secara berperingkat."},{"type":"match","xp":15,"voiceIdKey":"u4-s6","voiceToneLabel":"Padan Tokoh & Kesan MPP 1955","voiceCaption":"Padankan tokoh dan konsep utama Subtopik 8.3 dengan peranannya dalam sejarah parlimen Malaysia.","voiceScript":"[confident] Padankan empat tokoh dan badan utama dalam penubuhan Majlis Perundangan Persekutuan seribu sembilan ratus lima puluh lima!","prompt":"Padankan tokoh dan institusi Subtopik 8.3 berikut dengan fakta yang tepat:","pairs":[{"id":"mp1","left":"Halimaton Abd Majid","right":"Ahli wanita pertama yang mengangkat sumpah menganggotai MPP 1955"},{"id":"mp2","left":"Raja Muhammad Uda","right":"Dilantik sebagai Yang Dipertua (Speaker) Majlis Perundangan Persekutuan"},{"id":"mp3","left"
