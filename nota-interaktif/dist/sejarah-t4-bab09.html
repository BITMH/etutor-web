 Kelayakan Anggota & Terma Rujukan","voiceCaption":"Semak persamaan latar belakang anggota Suruhanjaya Reid serta perubahan gelaran Ketua Negara dalam Terma Rujukan.","voiceScript":"[confident] Apakah ciri persamaan kesemua lima anggota Suruhanjaya Perlembagaan Persekutuan Tanah Melayu yang dilantik pada tahun seribu sembilan ratus lima puluh enam?","prompt":"Mengapakah kesemua lima anggota Suruhanjaya Perlembagaan PTM yang dilantik dari Britain, Australia, India dan Pakistan dianggap berwibawa menjalankan tugas tersebut?","options":["Mereka berkongsi latar belakang pengajian dalam bidang undang-undang dan berpengalaman dalam sistem Perundangan Komanwel yang sama","Mereka pernah berkhidmat sebagai Menteri Besar di Negeri-negeri Melayu Tidak Bersekutu","Mereka dipilih secara langsung melalui undian Pilihan Raya Majlis Perundangan Persekutuan 1955","Mereka merupakan wakil tetap parti politik UMNO, MCA, MIC dan Parti Negara"],"correctIndex":0,"explanation":"Anggota Suruhanjaya Reid dipilih khusus kerana latar belakang pengajian undang-undang serta pengalaman dalam sistem Perundangan Komanwel untuk menggubal perlembagaan yang adil.","voiceIdKeyHint":"u3-s8"}]},{"id":"sej9-u4","title":"Unit 4: Penggubalan Perlembagaan: Memorandum, Reaksi & Pindaan (1957)","subtitle":"Subtopik 9.3 — 131 Memorandum, Testament Amanah Politik Perikatan, Draf Feb 1957, Reaksi & Kelulusan MPP","iconType":"book","iconUrl":"../assets/icons/sej9-u4.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s1","voiceToneLabel":"131 Memorandum & Testament Perikatan","voiceCaption":"Sebanyak 131 memorandum bertulis diterima daripada Raja-raja Melayu, Parti Perikatan melalui Testament Amanah Politik Perikatan, dewan perniagaan, MCA dan pihak awam.","voiceScript":"[warm] Mari masuk ke Subtopik sembilan perpuluhan tiga! Sebanyak seratus tiga puluh satu memorandum bertulis diterima daripada Raja-raja Melayu, parti politik, badan awam dan individu. Parti Perikatan mengemukakan memorandum bernama Testament Amanah Politik Perikatan manakala Raja-raja Melayu mencadangkan jawatan Yang di-Pertuan Agong untuk tempoh lima tahun!","title":"9.3 Langkah 1: 131 Memorandum Raja Melayu, Perikatan & Pihak Awam","acronym":"131•R•T","mediaKey":"sej9_memorandum_stacks","hook":"131 memorandum bertulis dikemukakan merangkumi corak pentadbiran, kewarganegaraan, kedudukan istimewa Melayu, bahasa serta pendidikan!","summary":"Pelbagai pihak mengemukakan tuntutan dan syor bertulis secara terbuka kepada Suruhanjaya Perlembagaan sebelum draf dirangka.","bullets":["Memorandum Raja-Raja Melayu: Mencadangkan Ketua Negara bernama Yang di-Pertuan Agong yang dipilih Raja-raja berdasarkan kekananan untuk tempoh 5 tahun (boleh meletakkan jawatan dengan persetujuan Majlis Raja-Raja) serta melindungi kedudukan istimewa Melayu dan kepentingan sah kaum lain.","Testament Perikatan, Badan Awam & MCA: Parti Perikatan menghantar Testament Amanah Politik Perikatan (meskipun terdapat ahli UMNO menolak jus soli); Dewan Perniagaan Melayu memohon syarat kewarganegaraan diperketat, Dewan Perniagaan Cina se-Malaya menggesa kewarganegaraan kelahiran, kaum India menuntut penelitian kewarganegaraan, Serani mempertahankan hak, manakala MCA menuntut sekolah Inggeris dan vernakular diteruskan serta semua sekolah kebangsaan mempelajari bahasa Inggeris, Melayu, Cina dan Tamil."],"labId":"sej9_memorandum_reaksi_lab","labTitle":"Peneroka 131 Memorandum, Draf & Reaksi Penggubalan","labProps":{"tab":"memo"},"examTip":"Hafal tajuk memorandum Parti Perikatan iaitu ***Testament Amanah Politik Perikatan*** serta dua tuntutan pendidikan daripada **MCA**!"},{"type":"match","xp":15,"voiceIdKey":"u4-s2","voiceToneLabel":"Padan Pengemuka Memorandum & Syor","voiceCaption":"Padankan pihak pengemuka memorandum bertulis dengan syor atau tuntutan khusus masing-masing.","voiceScript":"[confident] Uji ketepatan kamu tentang seratus tiga puluh satu memorandum bertulis! Padankan lima pihak berikut dengan syor utama mereka kepada Suruhanjaya Reid.","prompt":"Padankan pihak berikut dengan kandungan memorandum yang dikemukakan kepada Suruhanjaya Perlembagaan:","pairs":[{"id":"mm1","left":"Pihak Raja-raja Melayu","right":"YDPA dipilih berdasarkan kekananan bagi tempoh lima tahun dan boleh letak jawatan dengan persetujuan Majlis Raja-Raja"},{"id":"mm2","left":"Parti Perikatan","right":"Menyuarakan cadangan melalui memorandum bertajuk Testament Amanah Politik Perikatan"},{"id":"mm3","left":"Dewan Perniagaan Melayu","right":"Memohon agar syarat kewarganegaraan diperketatkan"},{"id":"mm4","left":"Persatuan Dewan Perniagaan Cina se-Malaya","right":"Menggesa suruhanjaya membuat peruntukan bagi kewarganegaraan menerusi kelahiran"},{"id":"mm5","left":"Memorandum MCA (Bahasa & Pendidikan)","right":"Menuntut sekolah Inggeris dan vernakular diteruskan serta mempelajari empat bahasa di sekolah kebangsaan"}],"explanation":"Kepelbagaian pandangan dalam 131 memorandum memperlihatkan amalan demokrasi dan sikap terbuka masyarakat Tanah Melayu dalam membentuk asas negara.","voiceIdKeyHint":"u4-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s3","voiceToneLabel":"Draf Feb 1957 & Reaksi Pelbagai Pihak","voiceCaption":"Draf Perlembagaan Februari 1957 menerima pelbagai reaksi daripada UMNO, PAS, Parti Negara menerusi Kongres 4–7 Mei 1957, pertubuhan Cina serta MIC.","voiceScript":"[warm] Pada Februari seribu sembilan ratus lima puluh tujuh, Suruhanjaya Reid mengeluarkan Draf Perlembagaan yang mencadangkan Parlimen dua dewan dan kewarganegaraan jus soli. Draf ini dibahaskan hebat oleh ahli U M N O, Parti P A S, Parti Negara pimpinan Dato' Onn Jaafar yang menganjurkan kongres pada empat hingga tujuh Mei, serta pertubuhan Cina dan M I C!","title":"Langkah 2 & 3: Draf Perlembagaan (Feb 1957) & Reaksi Masyarakat","acronym":"D•J•P•2D","mediaKey":"sej9_public_debate_hall","hook":"Parti Negara, PAS dan Parti Rakyat bersatu menganjurkan kongres pada 4–7 Mei 1957 bagi membahas syarat kewarganegaraan Draf Perlembagaan!","summary":"Draf awal Suruhanjaya Reid mencetuskan perdebatan membina mengenai jus soli, agama Islam, bahasa Melayu dan bahasa kaum lain.","bullets":["5 Teras Draf Perlembagaan (Feb 1957): Kerajaan Persekutuan dengan kuasa negeri, kewarganegaraan jus soli kepada semua yang lahir di Tanah Melayu, kedudukan istimewa Melayu diteruskan, Raja Berperlembagaan dengan seorang Yang di-Pertuan Agong, serta Parlimen dua Majlis Mesyuarat (Dewan Negara dan Dewan Rakyat).","Reaksi Pelbagai Pihak: Ahli UMNO menolak jus soli longgar dan menuntut Islam agama rasmi serta bahasa Melayu bahasa rasmi; PAS mengkritik kewarganegaraan dan mahu Islam asas pemerintahan serta bahasa Melayu bahasa rasmi; Dato' Onn Jaafar (Parti Negara) menolak syarat longgar dan bersama PAS serta Parti Rakyat menganjurkan kongres 4–7 Mei 1957; sebahagian pertubuhan Cina mahu bahasa Mandarin bahasa kebangsaan manakala MIC menuntut perhatian kewarganegaraan dan bahasa Tamil."],"labId":"sej9_memorandum_reaksi_lab","labTitle":"Bandingkan Draf Feb 1957 & Reaksi Semua Parti","labProps":{"tab":"reaksi"},"examTip":"Hafal 3 parti yang menganjurkan kongres pada 4–7 Mei 1957: Parti Negara, PAS dan Parti Rakyat!"},{"type":"predict","xp":20,"voiceIdKey":"u4-s4","voiceToneLabel":"Ramal Tujuan Rombongan 9 Mei 1957 ke London","voiceCaption":"Mengapakah Tunku Abdul Rahman mengetuai wakil Melayu, Cina dan India ke London sekali lagi pada 9 Mei 1957?","voiceScript":"[curious] Cuba ramalkan! Pada sembilan Mei seribu sembilan ratus lima puluh tujuh, Tunku Abdul Rahman berangkat sekali lagi ke London bersama Dato' Abdul Razak Hussein, Ong Yoke Lin dan V T Sambanthan. Apakah tujuan utama misi kedua ini?","hook":"Rombongan 9 Mei 1957 menampilkan empat tokoh utama Perikatan merentas kaum bagi memuktamadkan isu sensitif!","scenario":"Selepas Draf Perlembagaan Februari 1957 mendapat reaksi keras mengenai prinsip jus soli, kedudukan bahasa Melayu, agama Islam serta tuntutan masyarakat Cina dan India, terdapat beberapa perkara yang masih belum muktamad.","prompt":"Mengapakah Tunku Abdul Rahman, Dato' Abdul Razak Hussein, Ong Yoke Lin dan V.T. Sambanthan berangkat ke London pada 9 Mei 1957?","options":["Berbincang dengan kerajaan British mengenai isu kewarganegaraan dan perkara belum muktamad sehingga beberapa pindaan dibuat pada draf perlembagaan","Memohon penangguhan tarikh kemerdekaan daripada 31 Ogos 1957 kepada tahun 1960","Menandatangani semula perjanjian penubuhan Malayan Union bersama Sir Edward Gent","Menggantikan kelima-lima anggota Suruhanjaya Reid dengan wakil Majlis Raja-Raja"],"correctIndex":0,"proofLabId":"sej9_memorandum_reaksi_lab","proofState":{"tab":"lulus"},"explanation":"Rombongan muhibah 9 Mei 1957 berjaya merundingkan pindaan bersama British dan Jawatankuasa Kerja mengenai syarat kewarganegaraan, agama Islam, bahasa Melayu serta kedudukan istimewa sebelum dibawa ke Majlis Raja-Raja.","voiceIdKeyHint":"u4-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u4-s5","voiceToneLabel":"Pindaan Mei hingga Kelulusan Ogos 1957","voiceCaption":"Pindaan London dan semakan Jawatankuasa Kerja disembah perkenan Majlis Raja-Raja, dibahaskan di MPP 10–11 Julai serta diluluskan 27 Ogos sebelum berkuat kuasa 31 Ogos 1957.","voiceScript":"[warm] Mari lihat bagaimana draf pindaan diluluskan! Selepas rundingan sembilan Mei di London dan semakan Jawatankuasa Kerja, hasilnya disembah perkenan dalam Majlis Raja-Raja, dibahaskan di Majlis Perundangan Persekutuan pada sepuluh hingga sebelas Julai, diluluskan Parlimen British serta diluluskan M P P pada dua puluh tujuh Ogos seribu sembilan ratus lima puluh tujuh!","title":"Langkah 4–7: Rundingan London, Majlis Raja-Raja & Kelulusan MPP","acronym":"9M•MRR•MPP","mediaKey":"sej9_london_may1957_talks","hook":"Setiap pindaan daripada London wajib mendapat perkenan Majlis Raja-Raja dan dibahas dalam Majlis Perundangan Persekutuan sebelum dikuatkuasakan!","summary":"Proses perundangan berlapis dari London ke Majlis Raja-Raja dan MPP menjamin keabsahan perlembagaan pada 31 Ogos 1957.","bullets":["9 Mei 1957 & Majlis Raja-Raja: Tunku Abdul Rahman, Dato' Abdul Razak Hussein, Ong Yoke Lin dan V.T. Sambanthan berunding di London pada 9 Mei 1957 (diperhalusi Jawatankuasa Kerja Mei–Jun 1957), lalu hasil pindaan disembah perkenan dan dibincangkan dalam Majlis Raja-Raja.","MPP & Penguatkuasaan 31 Ogos 1957: Draf dibentang dan dibahaskan di Majlis Perundangan Persekutuan (MPP) pada 10–11 Julai 1957, diluluskan Parlimen British dan diluluskan oleh MPP pada 27 Ogos 1957 sebelum Perlembagaan Persekutuan Tanah Melayu 1957 berkuat kuasa rasmi pada 31 Ogos 1957."],"labId":"sej9_memorandum_reaksi_lab","labTitle":"Kronologi Langkah 4–7: 9 Mei hingga 31 Ogos 1957","labProps":{"tab":"lulus"},"examTip":"Hafal 4 nama rombongan 9 Mei 1957 ke London: Tunku Abdul Rahman, Dato' Abdul Razak Hussein, Ong Yoke Lin dan V.T. Sambanthan."},{"type":"wordbank","xp":20,"voiceIdKey":"u4-s6","voiceToneLabel":"Susun Langkah 4–7 Penggubalan Perlembagaan","voiceCaption":"Susun turutan langkah akhir penggubalan Perlembagaan daripada Mei hingga 31 Ogos 1957.","voiceScript":"[curious] Susun empat langkah terakhir penggubalan Perlembagaan Persekutuan Tanah Melayu daripada misi sembilan Mei di London sehingga berkuat kuasa pada tiga puluh satu Ogos!","prompt":"Susun langkah akhir penggubalan Perlembagaan PTM (Mei–Ogos 1957) mengikut kronologi:","hint":"Bermula dengan pemergian empat pemimpin Perikatan ke London pada 9 Mei 1957.","answerTokens":["Rombongan 4 pemimpin ke London buat pindaan (9 Mei 1957)","Hasil pindaan disembah perkenan & dibincang Majlis Raja-Raja","Draf dibentang di MPP (10–11 Julai) lalu diluluskan Parlimen British & MPP (27 Ogos 1957)","Perlembagaan PTM 1957 berkuat kuasa rasmi (31 Ogos 1957)"],"distractors":["Suruhanjaya Reid mula ditubuhkan di Tanjung Pagar","Rakyat Sarawak menubuhkan Rukun 13"],"explanation":"Aliran perlembagaan bergerak dari rundingan London (9 Mei) -> semakan & Majlis Raja-Raja -> perbahasan  MCA dan MIC diselaraskan melalui kompromi muafakat sebelum dibentang ke MPP.","voiceIdKeyHint":"u4-s7"},{"type":"mcq","xp":20,"voiceIdKey":"u4-s8","voiceToneLabel":"Uji Tokoh Rombongan Mei & Parlimen Dwidewan","voiceCaption":"Semak anggota rombongan 9 Mei 1957 ke London dan dua majlis mesyuarat Parlimen dalam Draf Perlembagaan.","voiceScript":"[confident] Siapakah empat pemimpin yang berlepas ke London pada sembilan Mei seribu sembilan ratus lima puluh tujuh untuk meminda draf perlembagaan mengenai isu kewarganegaraan?","prompt":"Pilih senarai tepat empat pemimpin yang menyertai rombongan ke London pada 9 Mei 1957 bagi membincangkan pindaan Draf Perlembagaan:","options":["Tunku Abdul Rahman, Dato' Abdul Razak Hussein, Ong Yoke Lin dan V.T. Sambanthan","Tunku Abdul Rahman, Dato' Onn Jaafar, Ahmad Boestamam dan H.S. Lee","Lord Reid, Sir Ivor Jennings, Hakim B. Malik dan Hakim Abdul Hamid","Ghafar Baba, Leong Yew Koh, E.E.C. Thuraisingham dan Sheikh Abdullah Fahim"],"correctIndex":0,"explanation":"Pada 9 Mei 1957, Tunku Abdul Rahman bersama Dato' Abdul Razak Hussein, Ong Yoke Lin dan V.T. Sambanthan berangkat ke London untuk menyelaraskan pindaan isu kewarganegaraan dan hal belum muktamad.","voiceIdKeyHint":"u4-s8"}]},{"id":"sej9-u5","title":"Unit 5: Perjanjian Persekutuan Tanah Melayu 1957 & Inti Pati (5 Ogos 1957)","subtitle":"Subtopik 9.4 — King's House Kuala Lumpur, 5 Inti Pati Perlembagaan 1957 & Evolusi 1946–1948–1957","iconType":"crown","iconUrl":"../assets/icons/sej9-u5.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s1","voiceToneLabel":"King's House 5 Ogos & Perkara 32","voiceCaption":"Perjanjian PTM ditandatangani pada 5 Ogos 1957 di King's House Kuala Lumpur oleh Raja-raja Melayu dan Sir Donald MacGillivray, mengasaskan institusi Yang di-Pertuan Agong.","voiceScript":"[warm] Pada lima Ogos seribu sembilan ratus lima puluh tujuh, Perjanjian Persekutuan Tanah Melayu ditandatangani antara Raja-raja Melayu dengan Sir Donald MacGillivray bagi pihak Queen Elizabeth kedua di King's House, Kuala Lumpur. Inti pati pertamanya termaktub dalam Perkara tiga puluh dua, iaitu pemilihan Yang di-Pertuan Agong oleh Majlis Raja-Raja setiap lima tahun sekali!","title":"9.4 King's House 5 Ogos 1957 & Inti Pati 1: Raja Berperlembagaan","acronym":"5O•KH•DM","mediaKey":"sej9_kings_house_signing","hook":"Perjanjian 5 Ogos 1957 di King's House Kuala Lumpur menjadi asas pembentukan Perlembagaan Persekutuan Tanah Melayu 1957!","summary":"Institusi Yang di-Pertuan Agong dan Raja Permaisuri Agong dalam sistem Raja Berperlembagaan serta Demokrasi Berparlimen termaktub jelas di bawah Perkara 32.","bullets":["King's House Kuala Lumpur (5 Ogos 1957): Perjanjian Persekutuan Tanah Melayu dimeterai antara Raja-raja Melayu dengan Sir Donald MacGillivray bagi pihak Queen Elizabeth II sebagai asas pembentukan Perlembagaan PTM 1957.","Perkara 32 — Raja Berperlembagaan & YDPA: Yang di-Pertuan Agong (diikuti Raja Permaisuri Agong) berkedudukan teratas dan tidak boleh dibicarakan di mahkamah; baginda dipilih Majlis Raja-Raja selama 5 tahun dan boleh meletakkan jawatan atau dipecat Majlis Raja-Raja mengikut Jadual Ketiga."],"labId":"sej9_intipati_ptm1957_lab","labTitle":"Peneroka 5 Inti Pati & Fasal Perjanjian PTM 1957","labProps":{"tab":"ydpa"},"examTip":"Hafal tempat dan penandatangan 5 Ogos 1957: King's House, Kuala Lumpur — Raja-raja Melayu bersama Sir Donald MacGillivray (wakil Queen Elizabeth II)."},{"type":"predict","xp":20,"voiceIdKey":"u5-s2","voiceToneLabel":"Ramal Kompromi Kewarganegaraan PTM 1957","voiceCaption":"Analisis bagaimana tiga saluran kewarganegaraan (Perkara 14, 15 dan 19) meredakan pertikaian jus soli dalam Draf Reid.","voiceScript":"[curious] Cuba ramalkan! Isu kewarganegaraan pernah mencetuskan bantahan hebat pada Draf Reid. Bagaimanakah Perkara empat belas, lima belas dan sembilan belas dalam Perjanjian lima Ogos seribu sembilan ratus lima puluh tujuh menyelesaikan isu ini secara adil?","hook":"Setiap orang yang lahir dalam Persekutuan pada atau selepas Hari Merdeka diiktiraf sebagai warganegara melalui saluran perundangan jelas!","scenario":"Perlembagaan Persekutuan 1957 menyusun kewarganegaraan di bawah Bahagian III merangkumi kuat kuasa undang-undang, pendaftaran dan naturalisasi sambil mengekalkan perlindungan kedudukan Melayu.","prompt":"Apakah kebijaksanaan struktur kewarganegaraan tiga cara dalam Perjanjian PTM 1957 berbanding prinsip jus soli longgar Malayan Union 1946?","options":["Menetapkan saluran tersusun — kuat kuasa undang-undang (Perkara 14), permohonan didaftarkan (Perkara 15) serta naturalisasi (Perkara 19) — dengan syarat kesetiaan yang jelas","Membatalkan kewarganegaraan kesemua warganegara Persekutuan Tanah Melayu 1948 secara serta-merta","Memberikan hak mengundi hanya kepada pegawai pentadbir British dan peniaga asing di pelabuhan","Menggugurkan terus peruntukan Perkara 153 bagi mengimbangi pemberian kewarganegaraan"],"correctIndex":0,"proofLabId":"sej9_intipati_ptm1957_lab","proofState":{"tab":"warga"},"explanation":"Pembahagian tiga saluran — Perkara 14 (kuat kuasa undang-undang bagi kelahiran pada/selepas Merdeka & warga PTM 1948), Perkara 15 (pendaftaran) dan Perkara 19 (naturalisasi) — mewujudkan keseimbangan hak dan tanggungjawab.","voiceIdKeyHint":"u5-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s3","voiceToneLabel":"Kewarganegaraan (P.14/15/19) & Perkara 153","voiceCaption":"Kewarganegaraan diperoleh melalui 3 cara (Perkara 14, 15 dan 19), manakala Perkara 153 menugaskan YDPA menjaga kedudukan istimewa Melayu dan hak sah kaum lain.","voiceScript":"[warm] Inti pati kedua dan ketiga Perjanjian lima Ogos sangat penting! Kewarganegaraan diberikan melalui tiga cara: kuat kuasa undang-undang Perkara empat belas, memohon didaftarkan Perkara lima belas dan naturalisasi Perkara sembilan belas. Di bawah Perkara seratus lima puluh tiga pula, Yang di-Pertuan Agong menjaga kedudukan istimewa orang Melayu serta hak halal kaum lain!","title":"Inti Pati 2 & 3: Kewarganegaraan (3 Cara) & Perkara 153 Melayu/Kaum Lain","acronym":"14•15•19•153","mediaKey":"sej9_mpp_legislature_chamber","hook":"Perkara 14 turut mengiktiraf warga PTM 1948 sebelum Hari Merdeka dan anak warganegara lahir di luar negara yang didaftarkan dalam setahun!","summary":"Perjanjian PTM 1957 menggabungkan keadilan kewarganegaraan tiga saluran bersama pemeliharaan kedudukan istimewa penduduk asal dan hak sah kaum lain.","bullets":["3 Cara Kewarganegaraan (P.14, 15, 19): Pertama, kuat kuasa undang-undang [Perkara 14] (termasuk warga PTM 1948, kelahiran pada/selepas Hari Merdeka serta anak bapa warganegara di luar Persekutuan didaftarkan di Kedutaan dalam 1 tahun); kedua, memohon didaftarkan [Perkara 15]; ketiga, menukar kewarganegaraan / naturalisasi [Perkara 19].","Perkara 153 — Melayu & Kepentingan Kaum Lain: YDPA menjaga kedudukan istimewa orang Melayu (jawatan kerajaan Persekutuan, biasiswa/elaun pelajaran serta latihan, surat kebenaran/lesen perusahaan dan perniagaan) di samping memelihara hak yang halal bagi kaum lain."],"labId":"sej9_intipati_ptm1957_lab","labTitle":"Semak Teks Fasal Perkara 14, 15, 19 & Perkara 153","labProps":{"tab":"melayu"},"examTip":"Hafal 3 keutamaan di bawah Perkara 153(2): (1) jawatan kerajaan Persekutuan, (2) biasiswa/elaun pelajaran dan latihan, (3) lesen/surat kebenaran perniagaan."},{"type":"match","xp":15,"voiceIdKey":"u5-s4","voiceToneLabel":"Padan Perkara Perlembagaan & Inti Pati","voiceCaption":"Padankan lima nombor Perkara Perlembagaan Persekutuan 1957 dengan inti pati masing-masing.","voiceScript":"[confident] Uji penguasaan nombor Perkara Perlembagaan Persekutuan seribu sembilan ratus lima puluh tujuh! Padankan setiap Perkara berikut dengan peruntukan yang tepat.","prompt":"Padankan nombor Perkara Perlembagaan Persekutuan 1957 dengan inti pati Perjanjian PTM 1957:","pairs":[{"id":"ip1","left":"Perkara 32","right":"Pemilihan Yang di-Pertuan Agong oleh Majlis Raja-Raja selama lima tahun"},{"id":"ip2","left":"Perkara 14, 15 & 19","right":"Tiga cara kewarganegaraan: kuat kuasa undang-undang, pendaftaran dan naturalisasi"},{"id":"ip3","left":"Perkara 153","right":"Tanggungjawab YDPA menjaga kedudukan istimewa orang Melayu dan hak halal kaum lain"},{"id":"ip4","left":"Perkara 3(1) & Perkara 11","right":"Agama Islam agama Persekutuan serta kebebasan mengamalkan agama lain dengan aman"},{"id":"ip5","left":"Perkara 152(1)","right":"Bahasa Melayu bahasa kebangsaan tanpa menegah pengajaran bahasa kaum lain"}],"explanation":"Menguasai padanan tepat Perkara 32, 14/15/19, 153, 3/11 dan 152 menjadikan jawapan esei SPM Kertas 2 kamu bertaraf cemerlang.","voiceIdKeyHint":"u5-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s5","voiceToneLabel":"Agama Islam & Bahasa Melayu (P.3, 11 & 152)","voiceCaption":"Perkara 3(1) dan 11 mengiktiraf Islam agama Persekutuan dengan kebebasan agama lain, manakala Perkara 152(1) mengiktiraf Bahasa Melayu sebagai bahasa kebangsaan.","voiceScript":"[warm] Inti pati keempat dan kelima menzahirkan semangat toleransi tanah air! Perkara tiga perpuluhan satu menetapkan agama Islam sebagai agama Persekutuan tetapi agama lain bebas diamalkan aman damai di bawah Perkara sebelas. Perkara seratus lima puluh dua pula memartabatkan bahasa Melayu sebagai bahasa kebangsaan tanpa menyekat penggunaan bahasa kaum lain!","title":"Inti Pati 4 & 5: Agama Islam (P.3 & 11) & Bahasa Melayu (P.152)","acronym":"3(1)•11•152","mediaKey":"sej9_merdeka_cabinet_unity","hook":"Tiada sesiapa boleh dipaksa membayar cukai khusus agama lain, dan bahasa kaum lain tetap dipelihara penggunaannya!","summary":"Peruntukan agama dan bahasa mencerminkan keseimbangan antara jati diri kebangsaan dengan keharmonian masyarakat berbilang kaum.","bullets":["Perkara 3(1) & 11 — Kedudukan Agama Islam: Islam ialah agama Persekutuan manakala agama lain boleh diamalkan aman dan damai; Perkara 11 menjamin hak beragama, larangan paksaan cukai agama lain serta hak mengurus hal agama sendiri, menubuhkan rumah ibadat atau khairat dan memiliki harta mengikut undang-undang.","Perkara 152(1) — Kedudukan Bahasa Melayu: Bahasa Melayu ialah bahasa kebangsaan, bahasa pengantar dan bahasa komunikasi dengan tulisan yang diundang-undangkan Parlimen; namun tidak menghalang penggunaan (selain maksud rasmi), pengajaran atau pembelajaran bahasa kaum lain yang dipelihara haknya."],"labId":"sej9_intipati_ptm1957_lab","labTitle":"Teroka Perkara 3(1), 11 & Perkara 152(1)","labProps":{"tab":"bahasa"},"examTip":"Bezakan dalam jawapan SPM: Perkara 3(1) menetapkan kedudukan **agama Islam**, Perkara 11 menghuraikan **kebebasan beragama**, manakala Perkara 152(1) menetapkan **Bahasa Melayu bahasa kebangsaan**."},{"type":"wordbank","xp":20,"voiceIdKey":"u5-s6","voiceToneLabel":"Susun Detik Kemerdekaan Ogos 1957","voiceCaption":"Susun empat detik kemuncak daripada pemeteraian 5 Ogos 1957 di King's House hingga pembentukan Kabinet PTM merdeka.","voiceScript":"[curious] Susun empat peristiwa kemuncak bulan Ogos seribu sembilan ratus lima puluh tujuh daripada majlis di King's House sehingga berkuat kuasanya Perlembagaan merdeka!","prompt":"Susun kronologi kemuncak pembentukan Perlembagaan Persekutuan Tanah Melayu (Ogos 1957):","hint":"Bermula di King's House, Kuala Lumpur pada 5 Ogos 1957.","answerTokens":["Raja-raja Melayu & Sir Donald MacGillivray tandatangan Perjanjian PTM di King's House (5 Ogos 1957)","Majlis Perundangan Persekutuan meluluskan draf rang undang-undang perlembagaan (27 Ogos 1957)","Perlembagaan Persekutuan Tanah Melayu 1957 berkuat kuasa secara rasmi (31 Ogos 1957)","Ahli Kabinet PTM 1957 bekerjasama mentadbir negara berlandaskan keluhuran perlembagaan"],"distractors":["Lord Reid menandatangani Kertas Putih 6274 di Singapura","Rombongan merdeka menaiki kapal M.V. Asia ke Karachi"],"explanation":"Pemeteraian 5 Ogos 1957 di King's House disusuli kelulusan MPP 27 Ogos 1957 lalu berkuat kuasa rasmi pada 31 Ogos 1957 bersama pentadbiran Kabinet PTM merdeka.","voiceIdKeyHint":"u5-s6"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u5-s7","voiceToneLabel":"Evolusi Perlembagaan 1946–1948–1957","voiceCaption":"Bandingkan transformasi daripada Malayan Union 1946 kepada PTM 1948 sehingga Perjanjian PTM Merdeka 1957 dan nilai keluhuran perlembagaan.","voiceScript":"[warm] Mari lihat lonjakan besar sejarah negara kita! Daripada tanah jajahan Malayan Union seribu sembilan ratus empat puluh enam kepada negeri naungan P T M seribu sembilan ratus empat puluh lapan, akhirnya Perjanjian P T M seribu sembilan ratus lima puluh tujuh melahirkan negara merdeka berdaulat dengan prinsip keluhuran perlembagaan!","title":"Evolusi Perlembagaan (1946 -> 1948 -> 1957) & Keluhuran Perlembagaan","acronym":"46•48•57","mediaKey":"sej9_merdeka_cabinet_unity","hook":"Toleransi kaum dan permuafakatan pemimpin membolehkan Tanah Melayu mencapai kemerdekaan penuh tanpa pertumpahan darah!","summary":"Perbandingan tiga era perlembagaan menyerlahkan pemulihan kedaulatan beraja, kestabilan demokrasi dan tanggungjawab menjunjung keluhuran perlembagaan.","bullets":["Lonjakan 1946 ke 1957: Malayan Union 1946 menjadikan negeri Melayu tanah jajahan Gabenor dan jus soli longgar; PTM 1948 memulihkan negeri naungan di bawah Pesuruhjaya Tinggi; Perjanjian PTM 1957 menubuhkan negara merdeka penuh dengan Yang di-Pertuan Agong, Parlimen dwidewan serta kontrak sosial perpaduan.","Keluhuran Perlembagaan & Nilai Sivik: Kejayaan Ahli Kabinet PTM 1957 membuktikan nilai menghormati keputusan pemimpin, permuafakatan untuk kestabilan, keterbukaan menerima pandangan serta kewajipan menjunjung keluhuran perlembagaan."],"labId":"sej9_banding_1948_1957_lab","labTitle":"Jadual Komparator: Malayan Union 1946 vs PTM 1948 vs PTM 1957","labProps":{"filter":"semua"},"examTip":"Untuk soalan Kajian Kes / KBAT Bab 9: kaitkan *permuafakatan + tolak ansur + kepimpinan berwibawa* sebagai kunci kemerdekaan tanpa pertumpahan darah."},{"type":"sort","xp":20,"voiceIdKey":"u5-s8","voiceToneLabel":"Isih 5 Inti Pati Mengikut Kelompok Perkara","voiceCaption":"Kelaskan peruntukan Perjanjian PTM 1957 mengikut kelompok Raja & Kewarganegaraan atau Agama, Bahasa & Kedudukan Melayu.","voiceScript":"[curious] Asingkan enam peruntukan Perjanjian Persekutuan Tanah Melayu seribu sembilan ratus lima puluh tujuh ke dalam tiga kelompok Perkara Perlembagaan yang tepat!","prompt":"Kelaskan peruntukan Perlembagaan PTM 1957 berikut mengikut kelompok Perkara masing-masing:","buckets":[{"id":"raja_153","label":"Perkara 32 & 153 (YDPA & Melayu)"},{"id":"warga","label":"Perkara 14, 15 & 19 (Warganegara)"},{"id":"agama_bahasa","label":"Perkara 3, 11 & 152 (Agama & Bahasa)"}],"items":[{"text":"YDPA dipilih oleh Majlis Raja-Raja bagi tempoh lima tahun (tidak boleh dibicarakan di mahkamah)","bucketId":"raja_153","note":"Termaktub dalam Perkara 32 Bahagian IV Perlembagaan."},{"text":"Warga PTM 1948 sebelum Hari Merdeka terus menjadi warganegara menurut kuat kuasa undang-undang","bucketId":"warga","note":"Termaktub dalam Perkara 14(1)(a) Bahagian III."},{"text":"Agama Islam ialah agama Persekutuan dan agama lain boleh diamalkan dengan aman dan damai","bucketId":"agama_bahasa","note":"Termaktub dalam Perkara 3(1) dan Perkara 11."},{"text":"Peruntukan jawatan perkhidmatan awam persekutuan, biasiswa serta lesen perniagaan Melayu dan hak halal kaum lain","bucketId":"raja_153","note":"Tanggungjawab YDPA di bawah Perkara 153(1)-(2)."},{"text":"Kewarganegaraan menerusi permohonan didaftarkan dan permohonan naturalisasi","bucketId":"warga","note":"Saluran Perkara 15 dan Perkara 19."},{"text":"Bahasa Melayu sebagai bahasa kebangsaan tanpa menegah pengajaran bahasa kaum lain","bucketId":"agama_bahasa","note":"Termaktub dalam Perkara 152(1)(a)-(b)."}],"explanation":"Kelompok Perkara 32/153, Perkara 14/15/19, dan Perkara 3/11/152 membentuk lima inti pati asas negara merdeka.","voiceIdKeyHint":"u5-s8"},{"type":"mcq","xp":20,"voiceIdKey":"u5-s9","voiceToneLabel":"Uji Fasal Perkara 14 & Sir Donald MacGillivray","voiceCaption":"Semak perincian Perkara 14 bagi kelahiran di luar Persekutuan dan wakil Queen Elizabeth II di King's House.","voiceScript":"[confident] Mengikut Perkara empat belas Perlembagaan Persekutuan seribu sembilan ratus lima puluh tujuh, apakah syarat bagi anak yang lahir di luar Persekutuan pada atau selepas Hari Merdeka supaya diiktiraf sebagai warganegara melalui kuat kuasa undang-undang?","prompt":"Berdasarkan petikan Perkara 14(1)(d) Perlembagaan Persekutuan 1957, bagaimanakah anak yang lahir di luar Persekutuan pada atau selepas Hari Merdeka (bapanya warganegara) memperoleh kewarganegaraan menurut kuat kuasa undang-undang?","options":["Surat beranaknya didaftarkan di sebuah Kedutaan Tanah Melayu dalam tempoh satu tahun selepas kelahirannya atau tempoh yang dibenarkan Kerajaan Persekutuan","Memohon menukar kewarganegaraan melalui proses naturalisasi selepas berumur dua puluh satu tahun","Mendapatkan surat sokongan terus daripada Pesuruhjaya Tinggi Sir Donald MacGillivray di King's House","Bermastautin di Pulau Pinang atau Melaka selama lima belas tahun berturut-turut"],"correctIndex":0,"explanation":"Perkara 14(1)(d) menetapkan kelahiran di luar Persekutuan bagi anak bapa warganegara diiktiraf mengikut kuat kuasa undang-undang apabila didaftarkan di Kedutaan Tanah Melayu dalam tempoh satu tahun (atau tempoh yang dibenarkan).","voiceIdKeyHint":"u5-s9"}]},{"id":"sej9-u6","title":"Unit 6: Cabaran Boss SPM — Penggubalan & Keluhuran Perlembagaan 1957","subtitle":"Sintesis Kertas 1 & KBAT Kertas 2 — Rundingan London, Suruhanjaya Reid, Permuafakatan Kaum & Perjanjian PTM 1957","iconType":"trophy","iconUrl":"../assets/icons/boss-spm-trophy.jpg","boss":true,"steps":[{"type":"mcq","xp":25,"voiceIdKey":"u6-s1","voiceToneLabel":"Cabaran Boss 1: Soalan Berasaskan Teks SPM","voiceCaption":"Nilai kesan pengenalan PTM 1948 bersama Pilihan Raya Majlis Perundangan Persekutuan 1955 dan peranan Suruhanjaya Reid.","voiceScript":"[excited] Selamat tiba di Peringkat Boss S P M! Soalan pertama menggabungkan dua situasi buku teks: apakah kesan utama pengenalan Persekutuan Tanah Melayu seribu sembilan ratus empat puluh lapan diikuti Pilihan Raya Majlis Perundangan Persekutuan seribu sembilan ratus lima puluh lima?","stimulusHtml":"<div class=\"lab-callout\"><strong>Situasi 1:</strong> Pengenalan Persekutuan Tanah Melayu 1948.<br><strong>Situasi 2:</strong> Pilihan Raya Majlis Perundangan Persekutuan 1955.</div>","prompt":"Apakah kesan langsung kedua-dua peristiwa bersejarah di atas terhadap perkembangan politik Tanah Melayu?","options":["Negara menuju ke arah berkerajaan sendiri dan merintis asas penggubalan perlembagaan merdeka","Pentadbiran Tentera British (BMA) mula diperkenalkan semula di Negeri-negeri Selat","Imperialisme kolonial semakin diperluas melalui penghapusan institusi Raja-raja Melayu","Kewarganegaraan jus soli Malayan Union 1946 dikuatkuasakan serta-merta tanpa pindaan"],"correctIndex":0,"explanation":"PTM 1948 memulihkan status negeri naungan, manakala Pilihan Raya MPP 1955 melantik wakil rakyat yang menerajui misi ke arah berkerajaan sendiri dan kemerdekaan penuh 1957.","voiceIdKeyHint":"u6-s1"},{"type":"predict","xp":25,"voiceIdKey":"u6-s2","voiceToneLabel":"Cabaran Boss 2: Perbandingan 1948 vs 1957","voiceCaption":"Bandingkan taraf kedaulatan Perjanjian Persekutuan Tanah Melayu 1948 dengan Perjanjian Persekutuan Tanah Melayu 5 Ogos 1957.","voiceScript":"[curious] Soalan K B A T S P M! Mengapakah Perjanjian Persekutuan Tanah Melayu lima Ogos seribu sembilan ratus lima puluh tujuh menandakan pencapaian kedaulatan yang jauh berbeza berbanding Perjanjian P T M seribu sembilan ratus empat puluh lapan?","hook":"Walaupun kedua-dua perjanjian berlangsung di King's House Kuala Lumpur, hanya satu daripadanya menamatkan penguasaan British sepenuhnya!","scenario":"Pada 21 Januari 1948 Raja-raja Melayu menandatangani Perjanjian PTM 1948 bersama Sir Edward Gent, manakala pada 5 Ogos 1957 Raja-raja Melayu menandatangani Perjanjian PTM 1957 bersama Sir Donald MacGillivray.","prompt":"Apakah lonjakan perlembagaan paling asas yang membezakan Perjanjian PTM 5 Ogos 1957 daripada PTM 1948?","options":["PTM 1957 membentuk negara merdeka berdaulat dalam Komanwel dengan Yang di-Pertuan Agong sebagai Ketua Negara dan Parlimen dwidewan, bukannya lagi negeri naungan di bawah Pesuruhjaya Tinggi British","PTM 1957 menyerahkan semula jawatan Menteri Kewangan dan Pertahanan kepada pegawai British di London","PTM 1957 mengekalkan penasihat British di setiap negeri Melayu bagi mengawal Majlis Eksekutif","PTM 1957 memansuhkan sistem Raja Berperlembagaan dan menggantikannya dengan Gabenor kolonial"],"correctIndex":0,"proofLabId":"sej9_banding_1948_1957_lab","proofState":{"filter":"status"},"explanation":"PTM 1948 masih berada di bawah naungan Pesuruhjaya Tinggi British, sedangkan Perjanjian PTM 5 Ogos 1957 mengiktiraf kemerdekaan penuh dengan Yang di-Pertuan Agong, Dewan Negara dan Dewan Rakyat.","voiceIdKeyHint":"u6-s2"},{"type":"match","xp":25,"voiceIdKey":"u6-s3","voiceToneLabel":"Cabaran Boss 3: Lima Tarikh Keramat Bab 9","voiceCaption":"Padankan lima tarikh utama sepanjang tahun 1956 dan 1957 dengan peristiwa bersejarah yang tepat.","voiceScript":"[confident] Uji ketajaman kronologi kamu untuk Kertas satu dan Kertas dua S P M! Padankan lima tarikh bersejarah Bab sembilan berikut dengan peristiwanya.","prompt":"Padankan lima tarikh keramat penggubalan Perlembagaan Persekutuan Tanah Melayu 1957 dengan peristiwa yang betul:","pairs":[{"id":"tk1","left":"1 Januari 1956","right":"Rombongan kemerdekaan berlepas dari Pelabuhan Tanjung Pagar menaiki M.V. Asia"},{"id":"tk2","left":"8 Februari 1956","right":"Perjanjian Kemerdekaan Tanah Melayu dimeterai di London selepas rundingan Lancaster House"},{"id":"tk3","left":"20 Februari 1956","right":"Tunku mengumumkan tarikh merdeka di hadapan 100 ribu rakyat di Padang Banda Hilir Melaka"},{"id":"tk4","left":"8 Mac 1956","right":"Kerajaan British mengumumkan pembentukan Suruhanjaya Perlembagaan PTM (Suruhanjaya Reid)"},{"id":"tk5","left":"5 Ogos 1957","right":"Perjanjian Persekutuan Tanah Melayu ditandatangani di King's House Kuala Lumpur"}],"explanation":"Lima tarikh keramat ini (1 Jan 1956, 8 Feb 1956, 20 Feb 1956, 8 Mac 1956, 5 Ogos 1957) membentuk tulang belakang kronologi lengkap Bab 9.","voiceIdKeyHint":"u6-s3"},{"type":"sort","xp":25,"voiceIdKey":"u6-s4","voiceToneLabel":"Cabaran Boss 4: Isih Tokoh Merentas Subtopik","voiceCaption":"Kelaskan tokoh penting Bab 9 ke dalam peranan Rombongan 1956, Suruhanjaya Reid atau Peristiwa Melaka dan Mei 1957.","voiceScript":"[curious] Asingkan enam tokoh terkenal Bab sembilan mengikut peranan masing-masing dalam Rombongan Januari seribu sembilan ratus lima puluh enam, Suruhanjaya Reid atau Sambutan Melaka dan Misi Mei seribu sembilan ratus lima puluh tujuh!","prompt":"Kelaskan tokoh-tokoh sejarah Bab 9 berikut mengikut fasa penglibatan utama mereka:","buckets":[{"id":"jan56","label":"Rombongan Rundingan Jan 1956"},{"id":"reid","label":"Suruhanjaya Reid (1956)"},{"id":"melaka_mei57","label":"Sambutan Melaka & Misi Mei 1957"}],"items":[{"text":"Dato' Panglima Bukit Gantang & Dato' Mohamad Seth","bucketId":"jan56","note":"Wakil Raja-raja Melayu (MB Perak dan MB Johor) menaiki M.V. Asia."},{"text":"Sir William Ivor Jennings & Hakim B. Malik","bucketId":"reid","note":"Anggota pakar perundangan Komanwel dari Britain dan India."},{"text":"Ghafar Baba & Leong Yew Koh","bucketId":"melaka_mei57","note":"Ketua perhimpunan dan pemidato di Padang Banda Hilir (20 Feb 1956)."},{"text":"H.S. Lee & Dr. Ismail Abdul Rahman","bucketId":"jan56","note":"Wakil Parti Perikatan dalam rundingan Lancaster House."},{"text":"Sir William McKell & Hakim Abdul Hamid","bucketId":"reid","note":"Anggota Suruhanjaya Reid dari Australia dan Pakistan."},{"text":"Ong Yoke Lin & V.T. Sambanthan","bucketId":"melaka_mei57","note":"Menyertai rombongan kedua bersama Tunku ke London pada 9 Mei 1957."}],"explanation":"Menguasai pengelasan tokoh mengikut fasa menghalang kekeliruan nama antara misi Jan 1956, anggota Suruhanjaya Reid dan rombongan 9 Mei 1957.","voiceIdKeyHint":"u6-s4"},{"type":"wordbank","xp":25,"voiceIdKey":"u6-s5","voiceToneLabel":"Cabaran Boss 5: Garis Masa Bersepadu Bab 9","voiceCaption":"Susun empat peristiwa besar dari pelayaran M.V. Asia 1956 hingga penguatkuasaan Perlembagaan 31 Ogos 1957.","voiceScript":"[curious] Susun empat peristiwa induk sepanjang Bab sembilan daripada pelepasan kapal M V Asia sehingga Perlembagaan Persekutuan Tanah Melayu berkuat kuasa secara rasmi!","prompt":"Susun kronologi bersepadu penggubalan Perlembagaan Persekutuan Tanah Melayu 1957:","hint":"Bermula di Pelabuhan Tanjung Pagar (Jan 1956) dan berakhir pada Hari Merdeka 31 Ogos 1957.","answerTokens":["M.V. Asia berlepas dari Tanjung Pagar ke Karachi menuju Lancaster House (Jan 1956)","Suruhanjaya Reid ditubuhkan (8 Mac 1956) & adakan 118 perjumpaan terima 131 memorandum","Draf Feb 1957 dipinda di London (9 Mei), diperkenan Majlis Raja-Raja & dilulus MPP (27 Ogos 1957)","Perjanjian PTM ditandatangani (5 Ogos 1957) & Perlembagaan berkuat kuasa rasmi (31 Ogos 1957)"],"distractors":["Sir Harold MacMichael memperoleh sembilan tandatangan Raja Melayu","Pentadbiran Tentera British membubarkan Parti Perikatan"],"explanation":"Empat fasa ini melengkapkan keseluruhan bab 9: usaha rundingan, Suruhanjaya Reid, langkah penggubalan berunding dan pemeteraian Perjanjian PTM 1957.","voiceIdKeyHint":"u6-s5"},{"type":"mcq","xp":30,"voiceIdKey":"u6-s6","voiceToneLabel":"Cabaran Boss 6: KBAT Toleransi & Keluhuran Perlembagaan","voiceCaption":"Soalan akhir merumuskan nilai kewarganegaraan, toleransi antara kaum dan keluhuran perlembagaan dalam Bab 9.","voiceScript":"[excited] Soalan terakhir Peringkat Boss! Bagaimanakah sikap toleransi antara kaum serta permuafakatan pemimpin dalam penggubalan Perlembagaan seribu sembilan ratus lima puluh tujuh memberi pengajaran kepada generasi muda Malaysia hari ini?","prompt":"Berdasarkan Kajian Kes dan Nilai Sivik Bab 9, mengapakah pendekatan toleransi antara kaum dan sikap keterbukaan pemimpin pada tahun 1956–1957 berjaya memerdekakan negara tanpa pertumpahan darah?","options":["Pemimpin pelbagai kaum dan Raja-raja Melayu sedia bermuafakat, bertolak ansur menerima pandangan melalui rundingan dan menyelaraskan kepentingan semua pihak dalam perlembagaan yang luhur","Rakyat Tanah Melayu menggunakan kekuatan ketenteraan untuk memaksa kerajaan British menandatangani Perjanjian King's House","Semua pertubuhan politik dan dewan perniagaan dilarang menghantar sebarang memorandum kepada Suruhanjaya Reid","Bahasa ibunda, agama lain dan kewarganegaraan bukan Melayu dihapuskan sepenuhnya demi penyeragaman mutlak"],"correctIndex":0,"explanation":"Permuafakatan Raja-raja Melayu, pemimpin berbilang kaum (Melayu, Cina, India, Ceylon, Serani) serta sikap keterbukaan meneliti 131 memorandum membolehkan kemerdekaan dicapai secara aman dan mewajibkan kita menjunjung prinsip keluhuran perlembagaan.","voiceIdKeyHint":"u6-s6"}]}]};</script>

        skipBtn.addEventListener("click", function () {

    }
    var mainEl = document.getElementById("notaMain");
    if (mainEl) mainEl.scrollTop = 0;
  };

  if (!skipViewTransition && typeof NotaFeel !== "undefined") {

  } else {

  }
}

/* 03-step-concept-and-predict.js — Explorable Concept Cards & Predict-Then-Reveal Steps */
function trimTrailingConnectors(words) {
  var stop = { "&": 1, "+": 1, "-": 1, "/": 1, "DAN": 1, "ATAU": 1, "VS": 1, "DI": 1, "KE": 1, "DARI": 1, "YANG": 1, "UNTUK": 1, "BAGI": 1, "AND": 1, "OR": 1, "OF": 1, "IN": 1, "THE": 1, "TO": 1, "WITH": 1 };
  var out = words.slice();
  while (out.length > 1 && stop[out[out.length - 1].toUpperCase()]) {
    out.pop();
  }
  return out;
}

function distillNodeHook(text, idx) {
  var raw = String(text || "").replace(/\s+/g, " ").trim();
  if (!raw) return { hook: "POIN " + (idx + 1), flash: "", words: ["POIN"] };
  var head = raw.split(/[:\-–]|->/)[0].trim();
  var cleanWords = head
    .replace(/\([^)]*\)/g, " ")
    .replace(/['".,!?]/g, " ")
    .trim()
    .split(/\s+/)
    .filter(function (w) { return w.length > 0; });
  var hookWords = trimTrailingConnectors(cleanWords.slice(0, 3));
  if (hookWords.length === 0) hookWords = ["FAKTA", String(idx + 1)];
  var hook = hookWords.join(" ").toUpperCase();
  if (hook.length > 22 && hookWords.length > 2) {
    hookWords = trimTrailingConnectors(hookWords.slice(0, 2));
    hook = hookWords.join(" ").toUpperCase();
  }
  if (hook.length > 22 && hookWords.length > 1) {
    hookWords = [hookWords[0]];
    hook = hookWords[0].toUpperCase();
  }
  if (hook.length > 22) hook = hook.slice(0, 21);
  var flash = raw.length > 125 ? raw.slice(0, 122).replace(/\s+\S*$/, "") + "..." : raw;
  return { hook: hook, flash: flash, words: hookWords };
}

function buildMnemonicCode(step, nodes) {
  if (step.acronym) return String(step.acronym);
  if (!nodes || nodes.length === 0) return "";
  var wordFreq = {};
  nodes.forEach(function (n) {
    var seen = {};
    (n.words || []).forEach(function (w) {
      var u = String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      if (u && !seen[u]) {
        seen[u] = true;
        wordFreq[u] = (wordFreq[u] || 0) + 1;
      }
    });
  });
  var picks = nodes.map(function (n) {
    var ws = (n.words || []).map(function (w) {
      return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }).filter(Boolean);
    var distinct = ws.filter(function (u) { return wordFreq[u] === 1; });
    var target = distinct[0] || ws[ws.length - 1] || "P";
    return target.charAt(0);
  });
  var uniqueCheck = {};
  picks.forEach(function (c) { uniqueCheck[c] = true; });
  if (Object.keys(uniqueCheck).length === 1 && nodes.length >= 2) {
    picks = nodes.map(function (n, idx) {
      var ws = (n.words || []).map(function (w) {
        return String(w || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }).filter(Boolean);
      var target = ws[ws.length - 1] || ("P" + (idx + 1));
      return target.slice(0, 2);
    });
  }
  return picks.join("•");
}

function splitHubLines(rawLabel) {
  var words = String(rawLabel || "PETA KONSEP").trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return ["PETA KONSEP"];
  var l1 = "";
  var l2 = "";
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!l2 && (l1 ? l1.length + 1 + w.length : w.length) <= 18) {
      l1 = l1 ? (l1 + " " + w) : w;
    } else if ((l2 ? l2.length + 1 + w.length : w.length) <= 20) {
      l2 = l2 ? (l2 + " " + w) : w;
    } else {
      break;
    }
  }
  if (!l1) l1 = words[0].slice(0, 18);
  return l2 ? [l1, l2] : [l1];
}

function extractYouTubeId(raw) {
  var s = String(raw || "").trim();
  if (!s) return "";
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var patterns = [
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i,
    /[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/i,
    /youtube(?:-nocookie)?\.com\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})(?:[?&#/]|$)/i
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = s.match(patterns[i]);
    if (m && m[1]) return m[1];
  }
  return "";
}

        '<div class="nota-deep-body">' +

          (fullNotesItems ? '<ul class="concept-bullets">' + fullNotesItems + "</ul>" : "") +
          (step.examTip ? '<div class="concept-exam-tip"><strong>' + tUi("Tip Skor SPM:", "SPM Score Tip:") + "</strong> " + escapeHtml(step.examTip) + "</div>" : "") +

  var btnText = isBite ? tUi("FAHAM &amp; UJI", "GOT IT &amp; TEST") : tUi("FAHAM &amp; TERUSKAN", "GOT IT &amp; CONTINUE");
  var hookHtml = buildHookRibbonHtml(step);
  var titleHtml = '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.title || tUi("Konsep Utama", "Key Concept")) + "</h2>";

  var slides = buildConceptSlides(step, {

    bullets: bullets,
    nodes: nodes,
    hookHtml: hookHtml,
    titleHtml: titleHtml,
    biteSummaryHtml: biteSummaryHtml,
    heroMediaHtml: heroMediaHtml,
    heroVideoHtml: heroVideoHtml,
    labHtml: labHtml,
    formulaHtml: formulaHtml,
    biteTipHtml: biteTipHtml,
    mindMapHostHtml: mindMapHostHtml,
    deepDrawerHtml: deepDrawerHtml
  });

  var totalSlides = slides.length;
  var topRowHtml =
    '<div class="step-top-row">' +
      '<span id="flashCounterPill" class="flash-counter-pill tabular-nums">' + tUi("KAD", "CARD") + " 1 / " + totalSlides + "</span>" +
      (acronymPill || "") +
    "</div>";

  var navTabsHtml = totalSlides > 1
    ? '<div class="flash-deck-nav" role="tablist" aria-label="' + escapeHtml(tUi("Navigasi Kad Nota", "Flashcard Deck Navigation")) + '">' +
        slides.map(function (sl, idx) {
          var isFirst = idx === 0;
          return (
            '<button type="button" class="flash-tab-btn' + (isFirst ? " is-active is-seen" : "") + '" role="tab" aria-selected="' + (isFirst ? "true" : "false") + '" data-slide-idx="' + idx + '">' +
              '<span class="flash-tab-num tabular-nums">' + (idx + 1) + "</span>" +
              "<span>" + escapeHtml(sl.label) + "</span>" +
            "</button>"
          );
        }).join("") +
      "</div>"
    : "";

  var panelsHtml = slides.map(function (sl, idx) {
    return (
      '<div class="flash-slide-panel" role="tabpanel" data-slide-panel="' + idx + '"' + (idx === 0 ? "" : " hidden") + ">" +
        sl.html +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    topRowHtml +
    navTabsHtml +
    '<div class="flash-deck-stage">' + panelsHtml + "</div>" +
    '<div class="step-actions-footer">' +
      '<button type="button" id="flashPrevBtn" class="btn-3d btn-3d-ghost" hidden>' + tUi("KAD SEBELUM", "PREV CARD") + "</button>" +
      '<button type="button" id="flashNextBtn" class="btn-3d btn-3d-blue"' + (totalSlides <= 1 ? " hidden" : "") + ">" + tUi("KAD SETERUSNYA", "NEXT CARD") + " (2/" + totalSlides + ")</button>" +
      '<button type="button" id="conceptDoneBtn" class="btn-3d btn-3d-green"' + (totalSlides > 1 ? " hidden" : "") + ">" + btnText + "</button>" +
    "</div>";

  bindHeroMediaClicks(card, step);

  var bonusEarned = false;
  var extraChallengeXp = 0;
  var biteTappedMap = {};
  card.querySelectorAll(".js-bite-card").forEach(function (bBtn) {
    bBtn.addEventListener("click", function () {
      var bIdx = bBtn.getAttribute("data-bite-idx");
      if (biteTappedMap[bIdx]) {
        NotaAudio.playTap();
        return;
      }
      biteTappedMap[bIdx] = true;
      bBtn.classList.add("is-mastered");
      bBtn.setAttribute("aria-pressed", "true");
      var pill = bBtn.querySelector("[data-bite-badge]");
      if (pill) pill.textContent = tUi("DIKUASAI", "MASTERED");
      var alreadyStepDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyStepDone) {
        extraChallengeXp += 2;
        if (typeof NotaAudio !== "undefined" && NotaAudio.playSnap) NotaAudio.playSnap();
        spawnXpFloat(2, bBtn);
      } else {
        NotaAudio.playTap();
      }
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(bBtn, 7);
      }
      if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
        window.gsap.fromTo(bBtn, { scale: 0.96 }, { scale: 1, duration: 0.34, ease: "back.out(2)", clearProps: "scale" });
      }
    });
  });

  function renderMindMap(triggerAnimIdx) {
    var host = document.getElementById("conceptMindMapHost");
    if (!host || nodes.length === 0) return;
    host.innerHTML = buildMindMapHtml(step, nodes, unlockedMap, activeNodeIdx, mindMapBonusDone);

    if (typeof triggerAnimIdx === "number" && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      var br = host.querySelector('[data-mm-branch="' + triggerAnimIdx + '"]');
      if (br && br.getTotalLength) {
        var bLen = br.getTotalLength();
        br.style.strokeDasharray = String(bLen);
        window.gsap.fromTo(br, { strokeDashoffset: bLen }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", clearProps: "strokeDasharray,strokeDashoffset" });
      }
      var nd = host.querySelector('[data-mm-idx="' + triggerAnimIdx + '"]');
      if (nd) {
        window.gsap.fromTo(nd, { scale: 0.88, svgOrigin: "280 121" }, { scale: 1, duration: 0.34, ease: "back.out(1.8)", clearProps: "transform" });
      }
      var pill = document.getElementById("mmFlashPill");
      if (pill) {
        window.gsap.fromTo(pill, { y: 8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.24, ease: "power2.out", clearProps: "transform,opacity" });
      }
    }

    host.querySelectorAll("[data-mm-idx]").forEach(function (gEl) {
      var activate = function () {
        var idx = Number(gEl.getAttribute("data-mm-idx"));
        var wasNew = !unlockedMap[idx];
        unlockedMap[idx] = true;
        activeNodeIdx = idx;
        if (wasNew && NotaAudio.playSnap) NotaAudio.playSnap();
        else NotaAudio.playTap();

        if (wasNew && typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(gEl, 8);
        }
        if (Object.keys(unlockedMap).length >= nodes.length && !mindMapBonusDone) {
          mindMapBonusDone = true;
          extraChallengeXp += 5;
          NotaAudio.playCorrect(1);
        }
        renderMindMap(idx);
      };
      gEl.addEventListener("click", activate);
      gEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
      });
    });
  }

  var activeSlide = 0;
  var seenSlides = { 0: true };
  var labMounted = false;
  var mindMapMounted = false;
  var counterEl = document.getElementById("flashCounterPill");
  var prevBtn = document.getElementById("flashPrevBtn");
  var nextBtn = document.getElementById("flashNextBtn");
  var btn = document.getElementById("conceptDoneBtn");

  function mountLabOnSlide() {
    var mount = document.getElementById("conceptLabMount");
    if (!mount || !step.labId) return;
    mountLabWidget(mount, step.labId, {
      mode: "explore",
      labProps: step.labProps || null,
      markInteracted: function () {
        if (bonusEarned) return;
        bonusEarned = true;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          if (window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
            window.gsap.fromTo(badge, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.34, ease: "back.out(2)", clearProps: "transform,opacity" });
          }
        }
        NotaAudio.playMatch();
      },
      awardMiniGameXp: function (amount, anchorEl, customLabel) {
        var pts = Math.max(1, Number(amount) || 5);
        extraChallengeXp += pts;
        var badge = document.getElementById("labInteractedBadge");
        if (badge) {
          badge.hidden = false;
          badge.textContent = customLabel || ("+" + (5 + extraChallengeXp) + " XP Eksplorasi & Cabaran!");
        }
        if (anchorEl) spawnXpFloat(pts, anchorEl);
        if (typeof NotaFeel !== "undefined" && anchorEl) NotaFeel.burstRewardParticles(anchorEl, 10);
        NotaAudio.playCorrect(2);
      }
    });
  }

  function showSlide(nextIdx, animate) {
    if (nextIdx < 0 || nextIdx >= totalSlides) return;
    activeSlide = nextIdx;
    seenSlides[nextIdx] = true;

    var targetPanel = null;
    card.querySelectorAll(".flash-slide-panel").forEach(function (pEl) {
      var pIdx = Number(pEl.getAttribute("data-slide-panel"));
      var isTarget = pIdx === nextIdx;
      pEl.hidden = !isTarget;
      if (isTarget) targetPanel = pEl;
    });

    card.querySelectorAll(".flash-tab-btn").forEach(function (tEl) {
      var tIdx = Number(tEl.getAttribute("data-slide-idx"));
      var isCur = tIdx === nextIdx;
      tEl.classList.toggle("is-active", isCur);
      tEl.classList.toggle("is-seen", Boolean(seenSlides[tIdx]));
      tEl.setAttribute("aria-selected", isCur ? "true" : "false");
    });

    if (counterEl) {
      counterEl.textContent = tUi("KAD", "CARD") + " " + (nextIdx + 1) + " / " + totalSlides;
    }
    var isLast = nextIdx >= totalSlides - 1;
    if (prevBtn) prevBtn.hidden = nextIdx <= 0;
    if (nextBtn) {
      nextBtn.hidden = isLast;
      if (!isLast) {
        nextBtn.textContent = tUi("KAD SETERUSNYA", "NEXT CARD") + " (" + (nextIdx + 2) + "/" + totalSlides + ")";
      }
    }
    if (btn) btn.hidden = totalSlides > 1 && !isLast;

    var curSlide = slides[nextIdx] || {};
    if (curSlide.hasLab) {
      if (!labMounted) {
        labMounted = true;
        mountLabOnSlide();
      } else if (typeof window !== "undefined" && window.requestAnimationFrame) {
        window.requestAnimationFrame(function () {
          try { window.dispatchEvent(new Event("resize")); } catch (e) {}
        });
      }
    }
    if (curSlide.hasMindMap && !mindMapMounted) {
      mindMapMounted = true;
      renderMindMap(null);
    }

    if (animate && targetPanel && window.gsap && typeof NotaFeel !== "undefined" && !NotaFeel.prefersReducedMotion()) {
      window.gsap.fromTo(
        targetPanel,
        { y: 8, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.22, ease: "power2.out", clearProps: "transform,opacity,visibility" }
      );
    }
  }

  card.querySelectorAll(".flash-tab-btn").forEach(function (tBtn) {
    tBtn.addEventListener("click", function () {
      var idx = Number(tBtn.getAttribute("data-slide-idx"));
      if (idx === activeSlide) return;
      NotaAudio.playTap();
      showSlide(idx, true);
    });
  });
  if (prevBtn) {
    prevBtn.addEventListener("click", function () {
      if (activeSlide <= 0) return;
      NotaAudio.playTap();
      showSlide(activeSlide - 1, true);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener("click", function () {
      if (activeSlide >= totalSlides - 1) return;
      NotaAudio.playTap();
      showSlide(activeSlide + 1, true);
    });
  }

  if (totalSlides > 1 && typeof document !== "undefined") {
    var onDeckKeydown = function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      var tgt = ev.target;
      var tag = tgt && tgt.tagName ? tgt.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tgt && tgt.isContentEditable)) return;
      if (ev.key === "ArrowRight" && activeSlide < totalSlides - 1) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide + 1, true);
      } else if (ev.key === "ArrowLeft" && activeSlide > 0) {
        ev.preventDefault();
        NotaAudio.playTap();
        showSlide(activeSlide - 1, true);
      }
    };
    document.addEventListener("keydown", onDeckKeydown);
    if (!Array.isArray(notaState.activeLabCleanups)) notaState.activeLabCleanups = [];
    notaState.activeLabCleanups.push(function () {
      try { document.removeEventListener("keydown", onDeckKeydown); } catch (e) {}
    });
  }

  showSlide(0, false);

  if (btn) {
    btn.addEventListener("click", function () {
      if (notaState.answeredCurrent) return;
      notaState.answeredCurrent = true;
      var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
      if (!alreadyDone) {
        if (!notaState.completedSteps) notaState.completedSteps = {};
        notaState.completedSteps[notaState.activeStepIdx] = true;
        var prevXp = notaState.xp;
        var gain = (Number(step.xp) || 10) + (bonusEarned ? 5 : 0) + extraChallengeXp;
        notaState.xp += gain;
        notaState.unitXpEarned += gain;
        NotaAudio.playCorrect(1);
        spawnXpFloat(gain, btn);
        if (typeof NotaFeel !== "undefined") {
          NotaFeel.burstRewardParticles(btn, 8);
          NotaFeel.animateXpCounter(prevXp, notaState.xp);
        }
        saveNotaState();
      } else {
        NotaAudio.playTap();
      }
      notaState.activeStepIdx++;
      renderActiveStep();
    });
  }
}

function renderPredictStep(step, card) {

            proofState: step.proofState || null,
            markInteracted: function () {}
          });
        }
      }

      handleStepOutcome(isCorrect, step.explanation || "", Number(step.xp) || 20, btn);
    });
  });
}

/* 04-step-minigames.js — Tap-to-Match, Word-Bank Assembly, Card Sort & Tactile MCQ */
function renderMatchStep(step, card) {
  var pairs = Array.isArray(step.pairs) ? step.pairs : [];
  var leftList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.left }; }));
  var rightList = shuffleList(pairs.map(function (p) { return { id: p.id, text: p.right }; }));

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("scale", "icon-sm") + " <span>" + tUi("Padan Pantas", "Speed Match") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Padankan pasangan yang tepat:", "Match the correct pairs:")) + "</h2>" +
    '<div class="match-columns">' +
      '<div class="match-col" id="matchLeftCol">' +
        leftList.map(function (it) {
          return '<button type="button" class="match-tile js-m-left" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
      '<div class="match-col" id="matchRightCol">' +
        rightList.map(function (it) {
          return '<button type="button" class="match-tile js-m-right" data-id="' + escapeHtml(it.id) + '">' + escapeHtml(it.text) + "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  var selLeft = null;
  var selRight = null;
  var matchedCount = 0;
  var mistakes = 0;

  function tryPair() {
    if (!selLeft || !selRight || notaState.answeredCurrent) return;
    var lid = selLeft.getAttribute("data-id");
    var rid = selRight.getAttribute("data-id");
    var leftBtn = selLeft;
    var rightBtn = selRight;
    selLeft = null;
    selRight = null;

    if (lid === rid) {
      leftBtn.classList.remove("is-selected");
      rightBtn.classList.remove("is-selected");
      leftBtn.classList.add("is-matched");
      rightBtn.classList.add("is-matched");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      matchedCount++;
      NotaAudio.playMatch();
      spawnXpFloat(5, rightBtn);
      var prevXp = notaState.xp;
      notaState.xp += 5;
      notaState.unitXpEarned += 5;
      renderTopHud();
      if (typeof NotaFeel !== "undefined") {
        NotaFeel.burstRewardParticles(rightBtn, 6);
        NotaFeel.animateXpCounter(prevXp, notaState.xp);
      }
      if (matchedCount >= pairs.length) {
        var cleanRun = mistakes <= 1;
        handleStepOutcome(cleanRun, step.explanation || "Semua pasangan berjaya dipadankan dengan tepat!", Number(step.xp) || 15, card, true);
      }
    } else {
      mistakes++;
      NotaAudio.playWrong();
      leftBtn.classList.add("is-wrong", "is-shaking");
      rightBtn.classList.add("is-wrong", "is-shaking");
      setTimeout(function () {
        leftBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
        rightBtn.classList.remove("is-selected", "is-wrong", "is-shaking");
      }, 420);
    }
  }

  card.querySelectorAll(".js-m-left").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-left").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selLeft = btn;
      tryPair();
    });
  });

  card.querySelectorAll(".js-m-right").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      NotaAudio.playTap();
      card.querySelectorAll(".js-m-right").forEach(function (b) { b.classList.remove("is-selected"); });
      btn.classList.add("is-selected");
      selRight = btn;
      tryPair();
    });
  });
}

function renderWordbankStep(step, card) {
  var answerTokens = Array.isArray(step.answerTokens) ? step.answerTokens : [];
  var allTokens = shuffleList(answerTokens.concat(Array.isArray(step.distractors) ? step.distractors : [])).map(function (txt, idx) {
    return { idx: idx, text: txt };
  });
  var chosen = [];

  card.innerHTML =
    '<span class="step-kicker">' + getSvgIcon("formula", "icon-sm") + " <span>" + tUi("Bina Ayat &amp; Rumus", "Sentence Builder") + "</span></span>" +
    '<h2 id="activeStepHeading" class="step-heading" tabindex="-1">' + escapeHtml(step.prompt || tUi("Susun blok jawapan yang betul:", "Arrange the blocks into the correct sentence:")) + "</h2>" +
    (step.hint ? '<p class="node-unit-sub" style="text-align:left;margin:0">' + escapeHtml(step.hint) + "</p>" : "") +
    '<div id="wbTray" class="wordbank-tray"><span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span></div>" +
    '<div id="wbPool" class="wordbank-pool"></div>' +
    '<div class="step-actions-footer">' +
      '<button type="button" id="wbClearBtn" class="btn-3d btn-3d-ghost">' + tUi("KOSONGKAN", "CLEAR") + "</button>" +
      '<button type="button" id="wbCheckBtn" class="btn-3d btn-3d-blue" disabled>' + tUi("SEMAK JAWAPAN", "CHECK ANSWER") + "</button>" +
    "</div>";

  function syncWb() {
    var tray = document.getElementById("wbTray");
    var pool = document.getElementById("wbPool");
    var checkBtn = document.getElementById("wbCheckBtn");
    if (!tray || !pool) return;

    tray.innerHTML = chosen.length === 0
      ? '<span class="wordbank-placeholder">' + tUi("Ketik blok di bawah untuk menyusun jawapan...", "Tap tiles below to build your sentence...") + "</span>"
      : chosen.map(function (tok, pos) {
          return '<button type="button" class="word-chip in-tray js-wb-tray" data-pos="' + pos + '">' + escapeHtml(tok.text) + "</button>";
        }).join("");

    var usedSet = {};
    chosen.forEach(function (tok) { usedSet[tok.idx] = true; });
    pool.innerHTML = allTokens.map(function (tok) {
      return '<button type="button" class="word-chip js-wb-pool ' + (usedSet[tok.idx] ? "is-used" : "") + '" data-tok-idx="' + tok.idx + '">' + escapeHtml(tok.text) + "</button>";
    }).join("");

    if (checkBtn) checkBtn.disabled = chosen.length === 0 || notaState.answeredCurrent;

    tray.querySelectorAll(".js-wb-tray").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        NotaAudio.playTap();
        chosen.splice(Number(b.getAttribute("data-pos")), 1);
        syncWb();
      });
    });
    pool.querySelectorAll(".js-wb-pool").forEach(function (b) {
      b.addEventListener("click", function () {
        if (notaState.answeredCurrent) return;
        var tid = Number(b.getAttribute("data-tok-idx"));
        var found = allTokens.find(function (t) { return t.idx === tid; });
        if (!found) return;
        NotaAudio.playTap();
        chosen.push(found);
        syncWb();
      });
    });
  }

  syncWb();
  document.getElementById("wbClearBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent) return;
    chosen = [];
    syncWb();
  });

  document.getElementById("wbCheckBtn").addEventListener("click", function () {
    if (notaState.answeredCurrent || chosen.length === 0) return;
    var userJoined = chosen.map(function (t) { return t.text; }).join(" ");
    var validList = [answerTokens.join(" ")];
    if (Array.isArray(step.acceptedSequences)) {
      step.acceptedSequences.forEach(function (seq) {
        if (Array.isArray(seq)) validList.push(seq.join(" "));
      });

function renderSortStep(step, card) {
  var items = shuffleList(Array.isArray(step.items) ? step.items : []);
  var buckets = Array.isArray(step.buckets) ? step.buckets : [];
  var curIdx = 0;
  var misses = 0;

    if (cEl && items[curIdx]) cEl.textContent = items[curIdx].text;
  }

  showCard();
  card.querySelectorAll(".js-sort-bucket").forEach(function (btn) {

          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback ok";
          msgEl.textContent = item.note || tUi("Tepat!", "Spot on!");
        }
        curIdx++;
        if (curIdx >= items.length) {
          handleStepOutcome(misses <= 1, step.explanation || tUi("Semua kad berjaya diisihkan dengan tepat!", "All cards sorted accurately!"), Number(step.xp) || 20, btn, true);
        } else {
          showCard();
        }
      } else {
        misses++;
        NotaAudio.playWrong();
        btn.classList.add("is-wrong", "is-shaking");
        setTimeout(function () { btn.classList.remove("is-wrong", "is-shaking"); }, 380);
        if (msgEl) {
          msgEl.hidden = false;
          msgEl.className = "sort-mini-feedback bad";
          msgEl.textContent = tUi("Kurang tepat — fikirkan semula fungsi atau sifat istilah ini.", "Not quite — check the grammar rule and clues.");
        }
      }
    });
  });
}

function handleStepOutcome(isCorrect, explanation, xpBase, anchorEl, noHeartPenalty) {
  if (notaState.answeredCurrent) return;
  notaState.answeredCurrent = true;
  var alreadyDone = Boolean(notaState.completedSteps && notaState.completedSteps[notaState.activeStepIdx]);
  if (!notaState.completedSteps) notaState.completedSteps = {};
  notaState.completedSteps[notaState.activeStepIdx] = true;
  if (!alreadyDone) notaState.unitTotal++;

  var prevXp = notaState.xp;
  var xpGain = 0;
  if (isCorrect) {
    if (!alreadyDone) {
      notaState.unitCorrect++;
      notaState.combo++;
      if (notaState.combo > notaState.maxCombo) notaState.maxCombo = notaState.combo;
      var bonus = notaState.combo >= 3 ? 5 : 0;
      xpGain = (Number(xpBase) || 15) + bonus;
      notaState.xp += xpGain;
      notaState.unitXpEarned += xpGain;
      NotaAudio.playCorrect(notaState.combo);
      spawnXpFloat(xpGain, anchorEl);
    } else {
      NotaAudio.playMatch();
    }
  } else {
    notaState.combo = 0;
    if (!noHeartPenalty && !alreadyDone) {
      notaState.hearts = Math.max(0, notaState.hearts - 1);
    }
    NotaAudio.playWrong();
  }

  renderTopHud();
  var hasVoice = Boolean(CHAPTER.enableVoiceNarration && typeof NotaVoice !== "undefined");
  var voiceStepMeta = hasVoice ? { voiceToneLabel: isCorrect ? (notaState.combo >= 3 ? tUi("Kombo Membara!", "On Fire!") : tUi("Pujian Cikgu AI", "Cikgu AI Praise")) : tUi("Bimbingan Cikgu AI", "Cikgu AI Hint") } : null;
  if (typeof NotaFeel !== "undefined") {
    if (isCorrect) {
      NotaFeel.burstRewardParticles(anchorEl, notaState.combo >= 3 ? 12 : 9);
      NotaFeel.animateXpCounter(prevXp, notaState.xp);
      NotaFeel.pulseComboEscalation(notaState.combo);
      if (NotaFeel.spawnComboBanner && notaState.combo >= 2 && !alreadyDone) {
        NotaFeel.spawnComboBanner(notaState.combo, notaState.combo >= 3 ? 5 : 0);
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var winMsg = hasVoice
          ? NotaVoice.getCleanReactionText(true, notaState.combo)
          : (notaState.combo >= 3 ? tUi("Mantap! Kombo x" + notaState.combo + " aktif sekarang!", "Brilliant! Combo x" + notaState.combo + " active!") : tUi("Tepat sekali! Teruskan momentum cemerlang.", "Spot on! Keep that momentum going."));
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), notaState.combo >= 3 ? "combo" : "correct", winMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(true, notaState.combo);
      }
    } else {
      if (!noHeartPenalty) {
        NotaFeel.pulseHeartLoss();
      }
      if (CHAPTER.enableMultimediaEdition && NotaFeel.renderCikguCompanion) {
        var encMsg = hasVoice
          ? NotaVoice.getCleanReactionText(false, 0)
          : tUi("Tidak mengapa — semak semula nota penjelasan di bawah untuk kukuhkan ingatan.", "Don't worry — review the explanation below to lock in the rule.");
        NotaFeel.renderCikguCompanion(document.getElementById("cikguCompanionHost"), "encourage", encMsg, voiceStepMeta);
        if (hasVoice && NotaVoice.autoplayReaction) NotaVoice.autoplayReaction(false, 0);
      }
    }
  }
  saveNotaState();
  showFeedbackDrawer({
    isCorrect: isCorrect,
    explanation: explanation,
    xpGain: xpGain
  });
}

function launchConfetti() {
  var canvas = document.getElementById("confettiCanvas");
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ["#2563eb", "#059669", "#f59e0b", "#38bdf8", "#ec4899"];
  var pieces = [];
  for (var i = 0; i < 95; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 160,
      w: 7 + Math.random() * 6,
      h: 5 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4.5,
      vy: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    });
  }
  var frames = 0;
  function tick() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (frames < 130) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}
