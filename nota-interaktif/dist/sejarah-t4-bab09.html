/* 01-tokens-and-topbar.css — MASTER.md Academic Tokens + Tactile 3D Duolingo Controls */
:root {
  --brand-navy: #0f172a;
  --brand-primary: #1e3a8a;
  --brand-accent: #2563eb;
  --brand-accent-dark: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-border: #bfdbfe;

  --grade-emerald: #059669;
  --grade-emerald-dark: #047857;
  --grade-emerald-soft: #ecfdf5;
  --grade-gold: #d97706;
  --grade-gold-dark: #b45309;
  --grade-gold-soft: #fffbeb;
  --status-danger: #dc2626;
  --status-danger-dark: #b91c1c;
  --status-danger-soft: #fef2f2;

  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-subtle: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;

  --font-heading: "Lexend", system-ui, -apple-system, sans-serif;
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; }
.tabular-nums { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; display: block; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 26px; height: 26px; }

.nota-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 46%);
}
.nota-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: cover;
  background-position: center 32%;
  background-repeat: no-repeat;
}
.nota-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 15, 36, 0.56) 0%, rgba(6, 15, 36, 0.28) 46%, rgba(6, 15, 36, 0.44) 100%);
  transition: background 0.25s ease, backdrop-filter 0.25s ease;
}
body[data-world-theme="sejarah"] .nota-shell::before { background-image: url("../assets/world-bg/world-sejarah.jpg"); }
body[data-world-theme="sains"] .nota-shell::before { background-image: url("../assets/world-bg/world-sains.jpg"); }
body[data-world-theme="bm"] .nota-shell::before { background-image: url("../assets/world-bg/world-bm.jpg"); }
body[data-world-theme="bi"] .nota-shell::before { background-image: url("../assets/world-bg/world-bi.jpg"); }
body[data-world-theme="math"] .nota-shell::before { background-image: url("../assets/world-bg/world-math.jpg"); }
body[data-world-theme="pi"] .nota-shell::before { background-image: url("../assets/world-bg/world-pi.jpg"); }
body[data-world-theme="geo"] .nota-shell::before { background-image: url("../assets/world-bg/world-geo.jpg"); }
body.is-lesson-open .nota-shell::after {
  background: rgba(248, 250, 252, 0.84);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.nota-topbar {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border-subtle);
  z-index: 20;
}

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.hud-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.hud-icon-btn:hover { background: var(--surface-subtle); border-color: var(--border-strong); color: var(--brand-primary); }
.hud-icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.hud-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.hud-subject-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand-primary);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hud-chapter-title {
  font-family: var(--font-heading);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--brand-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 44px; max-width: 460px; }
.hud-progress-track {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(15, 23, 42, 0.08);
}
.hud-progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-accent) 0%, var(--grade-emerald) 100%);
  transition: width 0.35s var(--spring);
  position: relative;
}
.hud-progress-fill::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 8px;
  right: 8px;
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}
.hud-step-counter { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

.hud-stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 44px;
  padding: 6px 11px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  border: 2px solid var(--border-subtle);
  background: var(--surface-card);
}
.pill-xp { color: var(--grade-gold-dark); background: var(--grade-gold-soft); border-color: #fde68a; }
.pill-hearts { color: var(--status-danger); background: var(--status-danger-soft); border-color: #fecaca; }
.hud-combo-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  transition: box-shadow 0.2s ease, background-color 0.2s ease;
}
.hud-combo-fire {
  background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28), 0 6px 14px rgba(217, 119, 6, 0.32);
}
@media (prefers-reduced-motion: no-preference) {
  .hud-combo-pill {
    animation: popBounce 0.32s var(--spring);
  }
}

/* Tactile 3D Chunky Buttons */
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 2px solid transparent;
  border-bottom-width: 4px;
  transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, background-color 0.15s ease;
}
.btn-3d:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-3d-blue { background: var(--brand-accent); border-color: var(--brand-accent-dark); color: #ffffff; }
.btn-3d-blue:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-green { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); color: #ffffff; }
.btn-3d-green:hover:not(:disabled) { filter: brightness(1.06); }
.btn-3d-gold { background: var(--grade-gold); border-color: var(--grade-gold-dark); color: #ffffff; }
.btn-3d-ghost { background: var(--surface-card); border-color: var(--border-subtle); color: var(--brand-primary); }
.btn-3d-ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-border); }

.hud-cikgu-btn { min-height: 44px; padding: 6px 12px; font-size: 0.82rem; }
.nota-main { position: relative; z-index: 2; background: transparent; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 124px; }

.xp-pop-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.xp-float-badge {
  position: absolute;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 0.88rem;
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
}
.reward-particle-glint {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .xp-float-badge {
    animation: xpFloatUp 0.95s ease-out forwards;
  }
  .is-shaking {
    animation: shakeWrong 0.36s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  .xp-float-badge {
    animation: xpFadeStatic 0.85s ease-out forwards;
  }
  .hud-progress-fill {
    transition: width 0.01ms linear;
  }
}

@keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes xpFloatUp { 0% { transform: translateY(0) scale(0.85); opacity: 1; } 100% { transform: translateY(-54px) scale(1.08); opacity: 0; } }
@keyframes xpFadeStatic { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 22% { transform: translateX(-7px); } 48% { transform: translateX(7px); } 74% { transform: translateX(-4px); } }

@media (max-width: 640px) {
  .nota-topbar { padding: 8px 10px; gap: 6px; }
  .topbar-left, .topbar-right { gap: 5px; }
  .hud-chapter-title { display: none; }
  .hud-cikgu-label { display: none; }
  .combo-prefix { display: none; }
  .hud-stat-pill { padding: 6px 8px; font-size: 0.76rem; gap: 4px; }
  .hud-combo-pill { padding: 4px 8px; font-size: 0.74rem; }
}
@media (max-width: 420px) {
  .hud-step-counter { display: none; }
  .hud-subject-pill { font-size: 0.7rem; padding: 4px 8px; }
}

body.wf-edition { background: #fafaf9; }
body.wf-edition .hud-progress-fill {
  background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 28%, #10b981 56%, #f59e0b 80%, #f97316 100%);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.35);
}

/* === styles/02-path-map-and-cards.css === */
/* 02-path-map-and-cards.css — Duolingo Winding Skill Path & Explorable Concept Cards */
.path-view { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.chapter-hero-banner {
  background: transparent;
  color: #ffffff;
  border-radius: 0;
  border: none;
  padding: 10px 6px 8px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-badges-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(6, 15, 36, 0.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 700;
}
.hero-tag-free { background: rgba(5, 150, 105, 0.35); border-color: rgba(167, 243, 208, 0.5); }
.chapter-hero-title { font-family: var(--font-heading); font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.85rem); margin: 0; line-height: 1.22; color: #ffffff; text-shadow: 0 2px 12px rgba(2, 6, 23, 0.88); }
.chapter-hero-sub { margin: 0; font-size: 0.94rem; color: #f1f5f9; line-height: 1.5; text-shadow: 0 1px 8px rgba(2, 6, 23, 0.85); }

.hero-mastery-box {
  background: rgba(6, 15, 36, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-mastery-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: #f8fafc; text-shadow: 0 1px 6px rgba(2, 6, 23, 0.78); }
.hero-mastery-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
.hero-mastery-fill { height: 100%; border-radius: 999px; background: #34d399; transition: width 0.4s var(--spring); }

/* Winding Duolingo Skill Path */
.skill-path-trail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 26px 0 32px;
}
.path-node-row {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 340px;
  transition: transform 0.2s ease;
}
.path-node-row.offset-left { transform: translateX(-46px); }
.path-node-row.offset-right { transform: translateX(46px); }
.path-node-row.offset-center { transform: translateX(0); }

.path-connector-line {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  background: repeating-linear-gradient(to bottom, var(--brand-border) 0 6px, transparent 6px 12px);
  margin-bottom: -14px;
}
.path-node-row.is-completed + .path-node-row .path-connector-line { background: var(--grade-emerald); }

.path-node-btn {
  position: relative;
  width: 82px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent-dark);
  border-bottom-width: 7px;
  background: var(--brand-accent);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
  transition: transform 0.12s ease, border-bottom-width 0.12s ease;
}
.path-node-btn:hover { transform: translateY(-2px); }
.path-node-btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.path-node-btn.state-completed { background: var(--grade-emerald); border-color: var(--grade-emerald-dark); box-shadow: 0 10px 20px rgba(5, 150, 105, 0.22); }
.path-node-btn.state-boss { background: var(--grade-gold); border-color: var(--grade-gold-dark); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.24); }

/* Taktil 3D Game-Badge Medallion untuk Ikon Unit Bergambar */
.path-node-btn.has-art {
  width: 98px;
  height: 94px;
  padding: 5px;
  border-width: 4px;
  border-bottom-width: 8px;
  background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #1e40af;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.path-node-btn.has-art.state-boss {
  width: 106px;
  height: 102px;
  background: linear-gradient(155deg, #fbbf24 0%, #d97706 100%);
  border-color: #92400e;
  box-shadow: 0 14px 28px rgba(217, 119, 6, 0.42), inset 0 2px 4px rgba(255, 255, 255, 0.55);
}
.path-node-btn.has-art.state-completed {
  background: linear-gradient(155deg, #10b981 0%, #059669 100%);
  border-color: #065f46;
  box-shadow: 0 12px 24px rgba(5, 150, 105, 0.34), inset 0 2px 3px rgba(255, 255, 255, 0.45);
}
.node-fallback-icon { display: none; }
.path-node-btn:not(.has-art) .node-art-frame { display: none; }
.path-node-btn:not(.has-art) .node-fallback-icon { display: inline-flex; }
.node-art-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  background: #0f172a;
  box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.42), inset 0 -4px 8px rgba(15, 23, 42, 0.45);
}
.node-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.22s var(--spring);
}
.path-node-btn.has-art:hover .node-art-img { transform: scale(1.07); }
.node-art-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 48%);
  pointer-events: none;
}
.node-done-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--grade-emerald);
  border: 3px solid #ffffff;
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
  z-index: 2;
}
.node-done-badge .icon-xs { width: 14px; height: 14px; stroke-width: 3; }

.path-node-btn.state-current::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--brand-accent);
  opacity: 0.45;
}
@media (prefers-reduced-motion: no-preference) {
  .path-node-btn.state-current::after {
    animation: nodePulseRing 1.9s ease-out infinite;
  }
}

.node-float-tag {
  position: absolute;
  top: -32px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 2px solid var(--brand-border);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
}
@media (prefers-reduced-motion: no-preference) {
  .node-float-tag {
    animation: floatBob 2s ease-in-out infinite;
  }
}
.node-stars-strip { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.node-stars-strip .icon { width: 16px; height: 16px; }
.star-filled { color: #f59e0b; fill: #f59e0b; }
.star-empty { color: var(--border-strong); fill: none; }

.node-label-card {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.65);
  text-align: center;
  width: 100%;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.24);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.node-label-card[data-unit-idx] { cursor: pointer; }
.node-label-card[data-unit-idx]:hover {
  transform: translateY(-2px);
  border-color: var(--brand-border);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
}
.node-unit-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 700; color: var(--brand-navy); margin: 0 0 3px; }
.node-unit-sub { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
.node-unit-cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-primary);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

/* Active Lesson Container, Same-Document View Transitions & Sibling Stagger */
#pathView:not([hidden]),
#lessonView:not([hidden]) {
  view-transition-name: nota-surface;
}
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.lesson-view { max-width: 760px; margin: 0 auto; padding-bottom: 52px; }
@media (prefers-reduced-motion: no-preference) {
  .lesson-view {
    animation: fadeSlideIn 0.25s ease-out;
  }
}
.step-card {

/* === styles/03-minigames-and-drawer.css === */
/* 03-minigames-and-drawer.css — Playable Mini-Game Mechanics & Duolingo Slide-Up Drawer */
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice-grid.two-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.tactile-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  text-align: left;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.93rem;
  font-weight: 600;
  line-height: 1.45;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
}
.tactile-choice:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.tactile-choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.tactile-choice.is-selected { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }
.tactile-choice.is-correct { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.tactile-choice.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger-dark); }
.choice-key {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
}
.tactile-choice.is-selected .choice-key { background: var(--brand-accent); color: #ffffff; border-color: var(--brand-accent); }

/* Match Pairs Mechanic */
.match-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-tile {
  min-height: 54px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.35;
  transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease, opacity 0.25s ease;
}
.match-tile:hover:not(:disabled) { border-color: var(--brand-border); background: var(--brand-soft); }
.match-tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.match-tile.is-selected { border-color: var(--brand-accent); background: #dbeafe; color: var(--brand-primary); }
.match-tile.is-matched { border-color: var(--grade-emerald); background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); opacity: 0.58; cursor: default; }
.match-tile.is-wrong { border-color: var(--status-danger); background: var(--status-danger-soft); color: var(--status-danger); }

/* Word-Bank / Formula Tile Assembly */
.wordbank-tray {
  min-height: 68px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--brand-border);
  background: var(--surface-page);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.wordbank-placeholder { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
.wordbank-pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.word-chip {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  background: var(--surface-card);
  color: var(--brand-navy);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.word-chip:hover:not(:disabled) { border-color: var(--brand-accent); background: var(--brand-soft); }
.word-chip:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.word-chip.is-used { opacity: 0.22; pointer-events: none; }
.word-chip.in-tray { border-color: var(--brand-accent); background: var(--brand-soft); color: var(--brand-primary); }

/* Sort / Classify Cards */
.sort-progress-bar { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; }
.sort-active-card {
  padding: 20px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
  border: 2px solid var(--brand-border);
  text-align: center;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand-navy);
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
}
.sort-buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sort-bucket-btn {
  min-height: 64px;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--brand-border);
  border-bottom-width: 5px;
  background: var(--surface-card);
  color: var(--brand-primary);
  font-family: var(--font-heading);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sort-bucket-btn:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand-accent); }
.sort-bucket-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.sort-bucket-btn.is-correct { background: var(--grade-emerald-soft); border-color: var(--grade-emerald); color: var(--grade-emerald-dark); }
.sort-bucket-btn.is-wrong { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.sort-mini-feedback { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.sort-mini-feedback.ok { background: var(--grade-emerald-soft); color: var(--grade-emerald-dark); }
.sort-mini-feedback.bad { background: var(--status-danger-soft); color: var(--status-danger-dark); }

/* Bottom Duolingo Feedback Drawer */
.feedback-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--grade-emerald-soft);
  border-top: 3px solid var(--grade-emerald);
  box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.14);
}
@media (prefers-reduced-motion: no-preference) {
  .feedback-drawer {
    animation: slideUpDrawer 0.24s var(--spring);
  }
}
.choice-grid > .tactile-choice {
  --stagger-time: 0.045s;
  animation: fadeSlideIn 0.3s ease-out both;
  animation-delay: calc(var(--sibling-index, 1) * var(--stagger-time));
}
@supports (animation-delay: calc(sibling-index() * 0.1s)) {
  .choice-grid > .tactile-choice {
    animation-delay: calc(sibling-index() * var(--stagger-time));
  }
}
@media (prefers-reduced-motion: reduce) {
  .choice-grid > .tactile-choice,
  .feedback-drawer {
    animation: none;
  }
}
.feedback-drawer.is-wrong { background: var(--status-danger-soft); border-top-color: var(--status-danger); }
.feedback-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.feedback-content { display: flex; align-items: flex-start; gap: 12px; flex: 1; }
.feedback-badge-icon {

  height: 36px;
  border-radius: 50%;
  background: var(--grade-emerald);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feedback-drawer.is-wrong .feedback-badge-icon { background: var(--status-danger); }
.feedback-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.feedback-title { font-family: var(--font-heading); font-size: 1rem; color: var(--grade-emerald-dark); }
.feedback-drawer.is-wrong .feedback-title { color: var(--status-danger-dark); }
.feedback-xp-tag {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--grade-gold);
  color: #ffffff;
  font-size: 0.74rem;

}
.feedback-explain { margin: 0; font-size: 0.87rem; color: var(--text-primary); line-height: 1.45; }
.feedback-continue-btn { min-width: 148px; }

@keyframes slideUpDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (max-width: 600px) {
  .choice-grid.two-cols { grid-template-columns: 1fr; }
  .feedback-inner { flex-direction: column; align-items: stretch; }
  .feedback-continue-btn { width: 100%; }
}

/* === styles/04-labs-and-celebration.css === */
/* 04-labs-and-celebration.css — Interactive Explorable Labs, Color-Stable Tokens, Celebration Confetti & Modals */

.lab-shell {

.lab-tokoh-pills { display: flex; flex-wrap: wrap; gap: 6px; }

.lab-phase-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.lab-phase-step {

.lab-slider-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 170px; }

.lab-range { width: 100%; accent-color: var(--brand-accent); min-height: 28px; cursor: pointer; }

.lab-readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

/* Modals & Celebration */
.modal-overlay {

.cel-stat-label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.heart-modal-icon {

/* Jadual Data Semantik Responsif (Desktop Sticky Header -> Mobile @container Stacked Cards) */

  .nota-data-table td:nth-child(2)::before { content: var(--label-2) ": "; font-weight: 700; color: var(--text-secondary); }

}
.nota-yt-facade-btn:hover .nota-yt-thumb {
  transform: scale(1.03);
  filter: brightness(0.84);
}
.nota-yt-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.15) 45%, rgba(15, 23, 42, 0.86) 100%);
}
.nota-yt-pill {
  align-self: flex-start;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(220, 38, 38, 0.92);
  color: #ffffff;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.nota-yt-play-badge {
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #dc2626;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(2, 6, 23, 0.45);
}
.nota-yt-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #ffffff;
}
.nota-yt-meta strong { font-size: 0.9rem; font-weight: 800; line-height: 1.3; }
.nota-yt-meta span { font-size: 0.74rem; font-weight: 700; color: #7dd3fc; }
.nota-yt-inline-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #020617;
}
.nota-yt-inline-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .nota-yt-thumb { transition: none; }
  .nota-yt-facade-btn:hover .nota-yt-thumb { transform: none; }
}

/* Concept Multi-Flashcard Micro-Deck */
.flash-counter-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 999px;
  background: #e0f2fe;
  border: 1.5px solid #7dd3fc;
  color: #0369a1;
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.flash-deck-nav {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex-wrap: wrap;
}
.flash-tab-btn {
  flex: 1 1 0;
  min-width: 108px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 2px solid #e2e8f0;
  background: #f8fafc;
  color: #475569;
  font-family: var(--font-heading);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.flash-tab-btn:hover {
  border-color: #93c5fd;
  background: #eff6ff;
  color: #1e3a8a;
  transform: translateY(-1px);
}
.flash-tab-btn:focus-visible {
  outline: 3px solid var(--brand-accent);
  outline-offset: 2px;
}
.flash-tab-btn.is-seen:not(.is-active) {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}
.flash-tab-btn.is-active {
  border-color: #2563eb;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.24);
}
.flash-tab-num {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.08);
  color: inherit;
  font-size: 0.72rem;
  font-weight: 900;
  flex-shrink: 0;
}
.flash-tab-btn.is-active .flash-tab-num {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
.flash-deck-stage {
  display: flex;
  flex-direction: column;
}
.flash-slide-panel:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.flash-slide-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: clamp(1.02rem, 0.94rem + 0.4vw, 1.18rem);
  font-weight: 800;
  color: var(--brand-navy);
  line-height: 1.3;
}
.step-actions-footer #flashNextBtn,
.step-actions-footer #conceptDoneBtn {
  margin-left: auto;
}
.step-footer-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 560px) {
  .flash-deck-nav {
    gap: 6px;
  }
  .flash-tab-btn {
    min-width: 0;
    flex: 1 1 calc(33.33% - 6px);
    padding: 7px 6px;
    font-size: 0.74rem;
    gap: 5px;
  }
  .flash-tab-num {
    width: 19px;
    height: 19px;
    font-size: 0.68rem;
  }
}
@media (prefers-reduced-motion: reduce) {
  .flash-tab-btn { transition: none; }
}

  <div id="notaShell" class="nota-shell">
    <header id="notaTopBar" class="nota-topbar">
      <div class="topbar-left">
        <button type="button" id="notaBackBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Bab">
          <span id="notaBackIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaMapExitBtn" class="hud-icon-btn" aria-label="Kembali ke Peta Unit" title="Kembali ke Peta Unit" hidden>
          <span id="notaMapExitIcon" aria-hidden="true"></span>
        </button>
        <div id="notaProgressWrap" class="hud-progress-wrap" hidden>
          <div class="hud-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Kemajuan unit">
            <div id="notaProgressFill" class="hud-progress-fill"></div>
          </div>
          <span id="notaStepCounter" class="hud-step-counter tabular-nums">1 / 4</span>
        </div>
        <div id="notaBrandWrap" class="hud-brand-wrap">
          <span id="notaTopSubject" class="hud-subject-pill">SPM</span>
          <span id="notaTopTitle" class="hud-chapter-title">Nota Interaktif</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="notaComboPill" class="hud-combo-pill tabular-nums" hidden>x2</div>
        <div id="notaXpPill" class="hud-stat-pill pill-xp tabular-nums" title="Jumlah Mata XP">
          <span id="notaXpIcon" aria-hidden="true"></span>
          <span id="notaXpValue">0 XP</span>
        </div>
        <div id="notaHeartsPill" class="hud-stat-pill pill-hearts tabular-nums" title="Nyawa Semasa">
          <span id="notaHeartIcon" aria-hidden="true"></span>
          <span id="notaHeartsValue">5</span>
        </div>
        <button type="button" id="notaMuteBtn" class="hud-icon-btn" aria-label="Tukar bunyi kesan permainan" aria-pressed="false">
          <span id="notaMuteIcon" aria-hidden="true"></span>
        </button>
        <button type="button" id="notaAskCikguBtn" class="btn-3d btn-3d-ghost hud-cikgu-btn">
          <span id="notaCikguIcon" aria-hidden="true"></span>
          <span class="hud-cikgu-label">Cikgu AI</span>
        </button>
      </div>
    </header>

    <main id="notaMain" class="nota-main">
      <section id="pathView" class="path-view" aria-label="Peta Laluan Unit Pembelajaran"></section>
      <section id="lessonView" class="lesson-view" aria-label="Aktiviti Pembelajaran Interaktif" hidden></section>
    </main>

    <div id="xpPopLayer" class="xp-pop-layer" aria-hidden="true"></div>

    <aside id="feedbackDrawer" class="feedback-drawer" aria-live="polite" hidden>
      <div class="feedback-inner">
        <div class="feedback-content">
          <div id="feedbackBadgeIcon" class="feedback-badge-icon" aria-hidden="true"></div>
          <div class="feedback-copy">
            <div class="feedback-head-row">
              <strong id="feedbackTitle" class="feedback-title">Tepat!</strong>
              <span id="feedbackXpTag" class="feedback-xp-tag tabular-nums" hidden>+15 XP</span>
            </div>
            <p id="feedbackExplain" class="feedback-explain"></p>
          </div>
        </div>
        <button type="button" id="feedbackContinueBtn" class="btn-3d btn-3d-green feedback-continue-btn">TERUSKAN</button>
      </div>
    </aside>

    <div id="celebrationOverlay" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="celTitle">
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="modal-card celebration-card">
        <div id="celStarsRow" class="cel-stars-row" aria-label="Penilaian Bintang"></div>
        <span id="celEyebrow" class="cel-eyebrow">UNIT SELESAI</span>
        <h2 id="celTitle" class="cel-title">Tahniah, Hebat!</h2>
        <p id="celSubtitle" class="cel-subtitle"></p>
        <div class="cel-stats-grid">
          <div class="cel-stat-box">
            <span class="cel-stat-label">Ketepatan</span>
            <strong id="celAccuracy" class="cel-stat-val tabular-nums">100%</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Mata XP</span>
            <strong id="celXp" class="cel-stat-val tabular-nums">+60 XP</strong>
          </div>
          <div class="cel-stat-box">
            <span class="cel-stat-label">Kombo Maks</span>
            <strong id="celCombo" class="cel-stat-val tabular-nums">x4</strong>
          </div>
        </div>
        <div class="cel-actions">
          <button type="button" id="celNextBtn" class="btn-3d btn-3d-green">UNIT SETERUSNYA</button>
          <button type="button" id="celMapBtn" class="btn-3d btn-3d-ghost">KEMBALI KE PETA BAB</button>
        </div>
      </div>
    </div>

    <div id="heartModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="heartModalTitle">
      <div class="modal-card heart-card">
        <div id="heartModalIcon" class="heart-modal-icon" aria-hidden="true"></div>
        <h2 id="heartModalTitle" class="cel-title">Nyawa Habis Buat Seketika</h2>
        <p class="cel-subtitle">Jangan risau! Kesilapan ialah sebahagian daripada proses menguasai konsep SPM. Pulihkan nyawa anda untuk meneruskan latihan.</p>
        <div class="cel-actions">
          <button type="button" id="recoverHeartsBtn" class="btn-3d btn-3d-blue">PULIHKAN 3 NYAWA &amp; TERUSKAN</button>
          <button type="button" id="heartBackMapBtn" class="btn-3d btn-3d-ghost">ULANG KAJI DI PETA BAB</button>
        </div>
      </div>
    </div>

    <dialog id="archivalLightboxDialog" class="archival-dialog" closedby="any" aria-labelledby="archivalDialogTitle">
      <div class="archival-dialog-body">
        <div class="archival-dialog-head">
          <span id="archivalDialogEra" class="archival-era-pill tabular-nums">ARKIB SEJARAH</span>
          <form method="dialog" class="archival-close-form">
            <button type="submit" class="lab-pause-btn">Tutup</button>
          </form>
        </div>
        <figure class="archival-dialog-figure">
          <img id="archivalDialogImg" src="" alt="" width="360" height="280" fetchpriority="low">
        </figure>
        <h3 id="archivalDialogTitle" class="archival-dialog-title"></h3>
        <p id="archivalDialogCaption" class="archival-dialog-caption"></p>
        <p id="archivalDialogCredit" class="archival-dialog-credit" hidden></p>
      </div>
    </dialog>

  <script>window.__ETUTOR_NOTA_CHAPTER__ = {"id":"sejarah-t4-bab09","subject":"Sejarah","form":4,"chapterNumber":9,"title":"Perlembagaan Persekutuan Tanah Melayu 1957","subtitle":"Subtopik 9.1–9.4 KSSM (46 Langkah Bit-by-Bit) — Rundingan Kemerdekaan London, Suruhanjaya Reid, Penggubalan & Inti Pati Perjanjian PTM 1957.","estimatedMinutes":32,"themeAccent":"#2563eb","isFreePreview":false,"subjectGroup":"teras","editionBadge":"Edisi Peta Kartografi & Suara AI","enableMultimediaEdition":true,"enableWebflowEdition":true,"enableVoiceNarration":true,"voiceModelId":"eleven_v4","voiceDefaultId":"P2iny3EEOzVk8EzrU7Bq","coverIcon":"../assets/icons/sej9-u2.jpg","voiceReactions":{"correct":"[excited] Tepat sekali! Penguasaan kamu tentang penggubalan perlembagaan merdeka memang mantap!","combo":"[laughs warmly] Kombo yang hebat! Kronologi, tokoh dan perkara perlembagaan kamu tersusun kemas!","encourage":"[softly] Hampir tepat... mari kita semak semula tarikh, tokoh serta inti pati perlembagaan kita.","celebrate":"[excited] Tahniah! Kamu telah berjaya menamatkan kesemua empat puluh enam langkah Bab sembilan!"},"units":[{"id":"sej9-u1","title":"Unit 1: Misi Rombongan Kemerdekaan ke London (1955–1956)","subtitle":"Subtopik 9.1 — Latar Belakang Rundingan, Sokongan Kaum, 4 Wakil Raja, 4 Wakil Perikatan & Pelayaran M.V. Asia","iconType":"map","iconUrl":"../assets/icons/sej9-u1.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s1","voiceToneLabel":"Latar Belakang Rundingan Kemerdekaan","voiceCaption":"Kebangkitan pascaperang serta Pilihan Raya Umum 1955 mendorong Tunku Abdul Rahman mengetuai misi rundingan merdeka dengan sokongan segenap kaum.","voiceScript":"[warm] Selamat datang ke Bab sembilan! Selepas Perang Dunia Kedua, gelombang kemerdekaan di Mesir, India, Burma dan Filipina serta kejayaan Pilihan Raya Umum seribu sembilan ratus lima puluh lima mendorong Tunku Abdul Rahman dan Raja-raja Melayu merintis rundingan ke London dengan sokongan segenap kaum.","title":"9.1 Latar Belakang & Kepentingan Rundingan Kemerdekaan","acronym":"P•J•P","mediaKey":"sej9_tanjung_pagar_ship","hook":"Pilihan Raya Umum 1955 menjadi asas perlembagaan ke arah berkerajaan sendiri sebelum rombongan merdeka bertolak ke London!","summary":"Perubahan geopolitik pascaperang dan jaminan British berkerajaan sendiri menyatukan pemimpin pelbagai kaum menyokong misi kemerdekaan.","bullets":["Konteks Pascaperang & PRU 1955: Kebangkitan menentang penjajah di Mesir, India, Burma dan Filipina mengiringi jaminan kerajaan British membantu Tanah Melayu berkerajaan sendiri secepat mungkin serta asas Pilihan Raya Umum 1955.","Agenda & Sokongan Segenap Kaum: Misi ke London membincangkan keselamatan, hubungan British-Tanah Melayu serta perlembagaan negara merdeka dengan sokongan E.E.C. Thuraisingham (wakil orang Ceylon), Ahmad Boestamam (Ketua Parti Rakyat yang menyeru rakyat menyokong rombongan), Parti Negara, Parti Buruh dan wakil kaum Serani."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Peta Kartografi: Perwakilan & Laluan Misi Merdeka 1956","labProps":{"mode":"perwakilan"},"examTip":"Hafal 4 negara pembebasan selepas PD2 (Mesir, India, Burma, Filipina) serta 3 agenda utama rundingan di London (keselamatan, hubungan British-Tanah Melayu, perlembagaan)."},{"type":"predict","xp":20,"voiceIdKey":"u1-s2","voiceToneLabel":"Ramal Strategi Pelayaran Kapal Laut","voiceCaption":"Mengapakah Tunku Abdul Rahman memilih kapal laut M.V. Asia ke Karachi dan bukan terus menaiki pesawat ke London?","voiceScript":"[curious] Cuba ramalkan! Pada satu Januari seribu sembilan ratus lima puluh enam, Tunku Abdul Rahman memilih menaiki kapal laut M V Asia dari Tanjung Pagar ke Karachi sebelum terbang ke London. Mengapakah beliau menyusun perjalanan laut terlebih dahulu?","hook":"Kapal terbang lebih pantas, namun Tunku Abdul Rahman sengaja memilih pelayaran kapal laut M.V. Asia!","scenario":"Rombongan kemerdekaan menghimpunkan dua kelompok utama — empat wakil Raja-raja Melayu dan empat wakil Parti Perikatan — sebelum berdepan meja rundingan dengan kerajaan British di London.","prompt":"Apakah tujuan strategik Tunku Abdul Rahman memilih pelayaran kapal laut M.V. Asia dari Singapura ke Karachi?","options":["Menggunakan masa pelayaran untuk berbincang dengan wakil Raja-raja Melayu agar dapat menyusun strategi bersama apabila berunding dengan British","Menunggu keputusan Pilihan Raya Majlis Perundangan Persekutuan yang sedang berlangsung di Kuala Lumpur","Mengelakkan pemeriksaan kastam British di Lapangan Terbang Batu Berendam Melaka","Menghadiri persidangan Suruhanjaya Reid yang bersidang di Pelabuhan Karachi"],"correctIndex":0,"proofLabId":"sej9_rombongan_merdeka_map","proofState":{"mode":"pelayaran","idx":1},"explanation":"Tunku Abdul Rahman merancang pelayaran laut ke Karachi supaya mempunyai masa yang cukup untuk berunding dengan wakil Raja-raja Melayu bagi mencapai persetujuan dan menyusun strategi bersama berdepan kerajaan British.","voiceIdKeyHint":"u1-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s3","voiceToneLabel":"4 Wakil Raja & 4 Wakil Perikatan","voiceCaption":"Rombongan kemerdekaan menggabungkan empat Menteri Besar wakil Raja-raja Melayu bersama empat pemimpin utama Parti Perikatan.","voiceScript":"[warm] Rombongan ke London terdiri daripada lapan tokoh utama! Empat wakil Raja-raja Melayu ialah Menteri Besar Perak Dato' Panglima Bukit Gantang, Menteri Besar Selangor Encik Abdul Aziz Abdul Majid, Menteri Besar Johor Dato' Mohamad Seth dan Menteri Besar Kelantan Dato' Nik Ahmad Kamil, bersama empat wakil Perikatan diketuai Tunku Abdul Rahman.","title":"Empat Wakil Raja-Raja Melayu & Empat Wakil Parti Perikatan","acronym":"4R•4P","mediaKey":"sej9_voyage_strategy_deck","hook":"Gabungan padu empat Menteri Besar wakil istana dan empat pemimpin Parti Perikatan menutup peluang British memecahbelahkan suara Tanah Melayu!","summary":"Lapan anggota rombongan merdeka mewakili institusi diraja dan mandat rakyat dalam menghadapi kerajaan British.","bullets":["4 Wakil Raja-Raja Melayu: Menteri Besar Perak Dato' Panglima Bukit Gantang (Dato' Haji Abdul Wahab Abd Aziz), Menteri Besar Selangor Encik Abdul Aziz Abdul Majid, Menteri Besar Johor Dato' Mohamad Seth Mohammad Said dan Menteri Besar Kelantan Dato' Nik Ahmad Kamil Haji Mahmood.","4 Wakil Parti Perikatan: Diketuai Tunku Abdul Rahman bersama Dato' Abdul Razak Hussein, H.S. Lee dan Dr. Ismail Abdul Rahman yang bersefahaman penuh sepanjang pelayaran ke Karachi sebelum terbang ke London."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Teroka Peta Negeri Wakil Raja-Raja & Perikatan","labProps":{"mode":"perwakilan"},"examTip":"Jangan keliru dengan nama negeri bagi setiap Menteri Besar: Perak (Dato' Panglima Bukit Gantang), Selangor (Abdul Aziz Abdul Majid), Johor (Mohamad Seth), Kelantan (Nik Ahmad Kamil)."},{"type":"match","xp":15,"voiceIdKey":"u1-s4","voiceToneLabel":"Padan Wakil Raja-Raja & Negeri","voiceCaption":"Padankan keempat-empat Menteri Besar wakil Raja-raja Melayu dengan negeri masing-masing dalam misi kemerdekaan 1956.","voiceScript":"[confident] Jom padankan keempat-empat Menteri Besar yang mewakili Raja-raja Melayu dalam rombongan kemerdekaan ke London dengan negeri masing-masing!","prompt":"Padankan wakil Raja-raja Melayu berikut dengan negeri yang diwakilinya:","pairs":[{"id":"w1","left":"Dato' Panglima Bukit Gantang (Haji Abdul Wahab Abd Aziz)","right":"Menteri Besar Perak"},{"id":"w2","left":"Encik Abdul Aziz Abdul Majid","right":"Menteri Besar Selangor"},{"id":"w3","left":"Dato' Mohamad Seth Mohammad Said","right":"Menteri Besar Johor"},{"id":"w4","left":"Dato' Nik Ahmad Kamil Haji Mahmood","right":"Menteri Besar Kelantan"}],"explanation":"Keempat-empat Menteri Besar dari Perak, Selangor, Johor dan Kelantan tersebut berganding bahu bersama empat wakil Parti Perikatan dalam misi ke London.","voiceIdKeyHint":"u1-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u1-s5","voiceToneLabel":"Kronologi Pelayaran 1–14 Januari 1956","voiceCaption":"Bermula dari Kuala Lumpur ke Tanjung Pagar, sepuluh ribu rakyat menghantar M.V. Asia pada 1 Januari 1956 sebelum singgah di Karachi dan tiba di London 14 Januari 1956.","voiceScript":"[warm] Mari ikuti kronologi perjalanan ke London! Tunku terbang dari Kuala Lumpur ke Singapura lalu rombongan bertolak dari Pelabuhan Tanjung Pagar menaiki M V Asia pada satu Januari seribu sembilan ratus lima puluh enam pukul lima petang diiringi sepuluh ribu rakyat, singgah di Karachi sebelum terbang ke London pada empat belas Januari.","title":"Perjalanan Bersejarah dari Kuala Lumpur hingga London (1–14 Jan 1956)","acronym":"K•S•K•L","mediaKey":"sej9_tanjung_pagar_ship","hook":"Dianggarkan 10 ribu orang membanjiri Pelabuhan Tanjung Pagar, Singapura pada petang 1 Januari 1956 mengiringi kapal M.V. Asia!","summary":"Laluan udara dan laut yang tersusun menyatukan tekad delegasi merdeka dari tanah air ke ibu kota empayar British.","bullets":["KL ke Tanjung Pagar (1 Jan 1956): Tunku Abdul Rahman berangkat dari Kuala Lumpur ke Singapura menaiki kapal terbang sebelum rombongan bertolak pukul 5:00 petang dari Pelabuhan Tanjung Pagar menaiki kapal laut M.V. Asia.","Singgah Karachi ke London (14 Jan 1956): Selepas merangka strategi bersama wakil Raja-raja sepanjang pelayaran, rombongan singgah di Karachi, Pakistan lalu menaiki kapal terbang menuju London dan tiba pada 14 Januari 1956."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Peta Laluan: Kuala Lumpur -> Tanjung Pagar -> Karachi -> London","labProps":{"mode":"pelayaran"},"examTip":"Ingat mod pengangkutan tepat setiap segmen: KL ke Singapura (kapal terbang), Singapura ke Karachi (kapal laut M.V. Asia), Karachi ke London (kapal terbang)."},{"type":"wordbank","xp":20,"voiceIdKey":"u1-s6","voiceToneLabel":"Susun Kronologi Perjalanan ke London","voiceCaption":"Susun empat peringkat perjalanan rombongan kemerdekaan daripada Kuala Lumpur hingga mendarat di London pada 14 Januari 1956.","voiceScript":"[curious] Susun empat peringkat perjalanan bersejarah rombongan kemerdekaan dari Kuala Lumpur sehingga selamat tiba di kota London!","prompt":"Susun kronologi perjalanan rombongan kemerdekaan ke London dengan tepat:","hint":"Bermula apabila Tunku terbang dari Kuala Lumpur menuju Singapura.","answerTokens":["Tunku Abdul Rahman terbang dari Kuala Lumpur ke Singapura","Berlepas dari Pelabuhan Tanjung Pagar menaiki kapal laut M.V. Asia (1 Jan 1956)","Singgah di Karachi setelah menyusun strategi bersama wakil Raja-raja Melayu","Menaiki kapal terbang dan tiba di London (14 Jan 1956)"],"distractors":["Mendarat di Lapangan Terbang Batu Berendam Melaka terlebih dahulu","Menghadiri pembentangan Draf Perlembagaan di Parlimen Pakistan"],"explanation":"Urutan kronologi KSSM bermula dari penerbangan KL ke Singapura, pelayaran M.V. Asia pada 1 Jan 1956 pukul 5:00 petang, persinggahan di Karachi, dan ketibaan udara di London pada 14 Jan 1956.","voiceIdKeyHint":"u1-s6"},{"type":"sort","xp":20,"voiceIdKey":"u1-s7","voiceToneLabel":"Isih 4 Wakil Raja vs 4 Wakil Perikatan","voiceCaption":"Kelaskan lapan tokoh utama Rombongan Kemerdekaan sama ada mewakili Raja-raja Melayu atau mewakili Parti Perikatan.","voiceScript":"[curious] Asingkan lapan anggota rombongan merdeka ke dalam kategori Wakil Raja-raja Melayu atau Wakil Parti Perikatan!","prompt":"Isihkan anggota rombongan rundingan kemerdekaan ke London mengikut kumpulan perwakilan masing-masing:","buckets":[{"id":"raja","label":"Wakil Raja-Raja Melayu"},{"id":"perikatan","label":"Wakil Parti Perikatan"}],"items":[{"text":"Dato' Panglima Bukit Gantang (Haji Abdul Wahab Abd Aziz)","bucketId":"raja","note":"Menteri Besar Perak mewakili Raja-raja Melayu."},{"text":"Tunku Abdul Rahman","bucketId":"perikatan","note":"Ketua rombongan mewakili Parti Perikatan."},{"text":"Dato' Mohamad Seth Mohammad Said","bucketId":"raja","note":"Menteri Besar Johor mewakili Raja-raja Melayu."},{"text":"H.S. Lee dan Dr. Ismail Abdul Rahman","bucketId":"perikatan","note":"Tokoh kanan Parti Perikatan bersama Dato' Abdul Razak Hussein."},{"text":"Encik Abdul Aziz Abdul Majid & Dato' Nik Ahmad Kamil","bucketId":"raja","note":"Masing-masing Menteri Besar Selangor dan Menteri Besar Kelantan."},{"text":"Dato' Abdul Razak Hussein","bucketId":"perikatan","note":"Pemimpin kanan Parti Perikatan ke Lancaster House."}],"explanation":"Kejayaan rundingan London terhasil daripada gandingan empat Menteri Besar wakil Raja-raja Melayu dan empat pemimpin teras Parti Perikatan.","voiceIdKeyHint":"u1-s7"},{"type":"mcq","xp":20,"voiceIdKey":"u1-s8","voiceToneLabel":"Uji Sokongan Rakyat & Parti Politik","voiceCaption":"Semak tokoh dan parti pelbagai kaum yang menyokong misi rundingan kemerdekaan ke London.","voiceScript":"[confident] Sebelum rombongan bertolak ke London, pemimpin parti lain turut bersatu memberi sokongan. Siapakah Ketua Parti Rakyat yang menyeru seluruh rakyat menyokong usaha rombongan tersebut?","prompt":"Siapakah pemimpin Parti Rakyat yang menyeru agar rakyat menyokong usaha rombongan kemerdekaan ke London, bersama wakil Ceylon E.E.C. Thuraisingham dan pemimpin Parti Negara serta Parti Buruh?","options":["Ahmad Boestamam","Sir Donald MacGillivray","Lord Reid","Sir William McKell"],"correctIndex":0,"explanation":"Ahmad Boestamam selaku Ketua Parti Rakyat menyeru rakyat menyokong misi ke London, menunjukkan perpaduan merentas kaum dan ideologi bersama E.E.C. Thuraisingham, Parti Negara, Parti Buruh serta kaum Serani.","voiceIdKeyHint":"u1-s8"}]},{"id":"sej9-u2","title":"Unit 2: Rundingan Lancaster House & Sambutan Banda Hilir (1956)","subtitle":"Subtopik 9.1 — Rundingan 18 Jan–6 Feb 1956, Perjanjian 8 Feb 1956, Sheikh Abdullah Fahim & Sambutan 20 Feb 1956","iconType":"scroll","iconUrl":"../assets/icons/sej9-u2.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s1","voiceToneLabel":"Rundingan Lancaster House London","voiceCaption":"Dari 18 Januari hingga 6 Februari 1956 di Lancaster House, British dan perwakilan Tanah Melayu merundingkan kuasa menteri, pertahanan, kewangan dan tarikh merdeka.","voiceScript":"[warm] Setibanya di London, rundingan kemerdekaan berlangsung di Lancaster House dari lapan belas Januari hingga enam Februari seribu sembilan ratus lima puluh enam. Tunku Abdul Rahman menuntut taraf berkerajaan sendiri serta-merta dan kemerdekaan penuh tahun hadapan, termasuk melantik rakyat tempatan menjadi Menteri Kewangan, Menteri Hal Ehwal Ekonomi dan Menteri Pertahanan.","title":"Rundingan Kemerdekaan di Lancaster House (18 Jan–6 Feb 1956)","acronym":"18J•6F•8F","mediaKey":"sej9_lancaster_house_london","hook":"Tunku menegaskan di Lancaster House: Tanah Melayu menuntut taraf berkerajaan sendiri serta-merta dan kemerdekaan penuh tidak lewat 31 Ogos 1957!","summary":"Meja rundingan Lancaster House merungkai peralihan kuasa pentadbiran, pertahanan dan perlembagaan antara kerajaan British dengan perwakilan Tanah Melayu.","bullets":["Pendirian Pihak British: Ahli Majlis Eksekutif selain Ketua Setiausaha dan Peguam Negara dilantik oleh Pesuruhjaya Tinggi atas nasihat Ketua Menteri, kerajaan PTM memberi ganti rugi kepada pegawai British yang diberhentikan, serta memeterai Perjanjian Pertahanan dan Bantuan Bersama PTM-British dengan bantuan Komanwel.","Tuntutan Perwakilan Tanah Melayu: Menghapuskan Setiausaha Kewangan digantikan Menteri Kewangan, Menteri Hal Ehwal Ekonomi daripada rakyat PTM, Menteri Pertahanan rakyat PTM menggantikan Pengarah Gerakan British, tarikh merdeka tidak lewat 31 Ogos 1957, serta rundingan Suruhanjaya Perlembagaan, kewangan, keselamatan dalam negeri dan perkhidmatan awam."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Bandingkan Tuntutan Lancaster House (British vs Tanah Melayu)","labProps":{"mode":"lancaster"},"examTip":"Bezakan jawatan yang bertukar tangan di Lancaster House: Setiausaha Kewangan -> Menteri Kewangan; Pengarah Gerakan (pegawai British) -> Menteri Pertahanan rakyat PTM."},{"type":"sort","xp":20,"voiceIdKey":"u2-s2","voiceToneLabel":"Isih Syarat British vs Tuntutan Tanah Melayu","voiceCaption":"Kelaskan perkara yang dirundingkan di Lancaster House antara pendirian kerajaan British dengan tuntutan perwakilan Tanah Melayu.","voiceScript":"[curious] Mari isihkan enam perkara yang dibincangkan di Lancaster House mengikut pihak yang mengemukakannya: kerajaan British atau perwakilan Tanah Melayu!","prompt":"Isihkan perkara rundingan di Lancaster House (18 Jan–6 Feb 1956) berikut mengikut pihak yang betul:","buckets":[{"id":"brit","label":"Pendirian Kerajaan British"},{"id":"ptm","label":"Tuntutan Perwakilan Tanah Melayu"}],"items":[{"text":"Kerajaan PTM memberi ganti rugi kepada pegawai British yang diberhentikan","bucketId":"brit","note":"Syarat pampasan perkhidmatan pegawai British semasa peralihan kuasa."},{"text":"Menghapuskan jawatan Setiausaha Kewangan digantikan Menteri Kewangan","bucketId":"ptm","note":"Menyerahkan kawalan dasar kewangan kepada menteri tempatan."},{"text":"Mengadakan Perjanjian Pertahanan dan Bantuan Bersama PTM-British","bucketId":"brit","note":"British dan Komanwel kekal membantu aspek pertahanan Tanah Melayu."},{"text":"Menteri Pertahanan rakyat PTM menggantikan Pengarah Gerakan British","bucketId":"ptm","note":"Memastikan tanggungjawab pertahanan dipimpin anak watan."},{"text":"Ahli Majlis Eksekutif dilantik Pesuruhjaya Tinggi dengan nasihat Ketua Menteri","bucketId":"brit","note":"Kecuali Ketua Setiausaha dan Peguam Negara yang masih dikekalkan."},{"text":"Menuntut tarikh kemerdekaan tidak lewat dari 31 Ogos 1957","bucketId":"ptm","note":"Sasaran muktamad kedaulatan penuh negara."}],"explanation":"Kedua-dua pihak bertolak ansur secara diplomatik sehingga semua hasil rundingan dirakam dalam laporan setebal 20 halaman.","voiceIdKeyHint":"u2-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s3","voiceToneLabel":"Perjanjian 8 Feb & Sheikh Abdullah Fahim","voiceCaption":"Laporan 20 halaman melahirkan Perjanjian Kemerdekaan Tanah Melayu 8 Februari 1956, manakala Sheikh Abdullah Fahim membantu menetapkan tarikh 31 Ogos 1957.","voiceScript":"[warm] Hasil rundingan di Lancaster House dimuatkan dalam satu laporan setebal dua puluh halaman dan dimeterai melalui Perjanjian Kemerdekaan Tanah Melayu pada lapan Februari seribu sembilan ratus lima puluh enam. Tarikh tiga puluh satu Ogos seribu sembilan ratus lima puluh tujuh pula ditentukan selepas Tunku meminta pandangan ulama besar Kepala Batas, Sheikh Abdullah Fahim.","title":"Perjanjian Kemerdekaan 8 Feb 1956 & Peranan Sheikh Abdullah Fahim","acronym":"20H•8F•SAF","mediaKey":"sej9_lancaster_house_london","hook":"Perjanjian 8 Februari 1956 mengesahkan persetujuan British memberikan kemerdekaan serta menubuhkan Suruhanjaya Perlembagaan!","summary":"Laporan 20 halaman dan panduan ulama besar melengkapkan langkah diplomatik sebelum kepulangan rombongan ke tanah air.","bullets":["Laporan 20 Halaman & Perjanjian 8 Feb 1956: Segala perbincangan dirakam dalam laporan setebal 20 halaman yang membawa kepada Perjanjian Kemerdekaan Tanah Melayu pada 8 Februari 1956 serta persetujuan kedua-dua pihak menubuhkan Suruhanjaya Perlembagaan.","Sheikh Abdullah Fahim (Kepala Batas, Pulau Pinang): Penetapan tarikh keramat Kemerdekaan Persekutuan Tanah Melayu pada 31 Ogos 1957 ditentukan selepas Tunku Abdul Rahman dan pemimpin negara meminta pandangan ulama besar tersebut."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Lihat Lokasi Kepala Batas & Melaka di Peta Interaktif","labProps":{"mode":"melaka"},"examTip":"Bezakan dua tarikh perjanjian penting: 8 Februari 1956 = Perjanjian Kemerdekaan Tanah Melayu di London; 5 Ogos 1957 = Perjanjian Persekutuan Tanah Melayu di King's House Kuala Lumpur."},{"type":"predict","xp":20,"voiceIdKey":"u2-s4","voiceToneLabel":"Ramal Makna Pemilihan Padang Banda Hilir","voiceCaption":"Fahami sebab kepulangan rombongan merdeka disambut di Padang Banda Hilir, Melaka dengan laungan Merdeka oleh lebih 100 ribu rakyat.","voiceScript":"[curious] Pada dua puluh Februari seribu sembilan ratus lima puluh enam, rombongan merdeka tiba di Batu Berendam dan diarak ke Padang Banda Hilir, Melaka. Mengapakah Melaka menjadi lokasi simbolik bagi pengumuman tarikh kemerdekaan negara?","hook":"Di atas runtuhan Kota Melaka kita dirikan negara baru — simbol kebangkitan kedaulatan tanah air!","scenario":"Lebih kurang 100 ribu orang menaiki bas, lori dan berjalan kaki dari seluruh negara membanjiri Padang Banda Hilir, Melaka untuk mendengar ucapan Tunku Abdul Rahman mengumumkan tarikh kemerdekaan.","prompt":"Mengapakah Padang Banda Hilir, Melaka mempunyai nilai simbolik paling mendalam sebagai lokasi pengisytiharan tarikh kemerdekaan pada 20 Februari 1956?","options":["Melaka merupakan tapak kejatuhan kesultanan Melayu akibat penjajahan asing, maka pengumuman merdeka di situ melambangkan pemulihan semula kedaulatan negara","Melaka merupakan satu-satunya negeri yang belum menyertai Persekutuan Tanah Melayu pada tahun 1956","Semua wakil Suruhanjaya Reid berasal dari kawasan Bandar Hilir dan Batu Berendam","Undang-undang British melarang sebarang perhimpunan awam diadakan di Kuala Lumpur"],"correctIndex":0,"proofLabId":"sej9_rombongan_merdeka_map","proofState":{"mode":"melaka"},"explanation":"Melaka menjadi pintu masuk kejatuhan kedaulatan tanah air sejak 1511; mengumumkan tarikh merdeka di Banda Hilir menzahirkan kebangkitan semula maruah bangsa serta penyatuan pemimpin pelbagai kaum di hadapan 100 ribu rakyat.","voiceIdKeyHint":"u2-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u2-s5","voiceToneLabel":"Sambutan Bersejarah di Melaka (20 Feb 1956)","voiceCaption":"Lebih 100 ribu rakyat membanjiri Padang Banda Hilir bersama Ghafar Baba, V.T. Sambanthan, Leong Yew Koh dan Tunku Abdul Rahman.","voiceScript":"[excited] Pada dua puluh Februari seribu sembilan ratus lima puluh enam, Tunku tiba di Lapangan Terbang Batu Berendam dan diarak ke Padang Banda Hilir. Perhimpunan seratus ribu rakyat itu diketuai Ghafar Baba, disambut kalungan bunga oleh V T Sambanthan dan ucapan Leong Yew Koh sebelum Tunku mengumumkan tarikh keramat tiga puluh satu Ogos seribu sembilan ratus lima puluh tujuh!","title":"Sambutan Bersejarah di Padang Banda Hilir, Melaka (20 Feb 1956)","acronym":"20F•100R•BH","mediaKey":"sej9_banda_hilir_melaka","hook":"Laungan gemuruh 'Merdeka' bergema daripada lebih 100 ribu rakyat apabila Tunku memberi isyarat kemerdekaan kini dalam genggaman!","summary":"Kepulangan rombongan merdeka ke Melaka membuktikan sokongan padu rakyat pelbagai kaum terhadap gandingan kepimpinan negara.","bullets":["Batu Berendam ke Banda Hilir: Rombongan tiba di Lapangan Terbang Batu Berendam pada 20 Feb 1956 dan diarak ke Padang Banda Hilir; lebih 100 ribu orang hadir menaiki bas, lori dan berjalan kaki mendengar pengumuman merdeka pada 31 Ogos 1957.","Tokoh & Memorial Pengisytiharan: Ghafar Baba mengetuai perhimpunan, V.T. Sambanthan menyambut dengan kalungan bunga dan Leong Yew Koh berucap menyokong kemerdekaan; peristiwa bersejarah ini diabadikan di Memorial Pengisytiharan Kemerdekaan Melaka."],"labId":"sej9_rombongan_merdeka_map","labTitle":"Teroka Tokoh & Detik Sambutan 20 Feb 1956","labProps":{"mode":"melaka"},"examTip":"Hafal 3 tokoh yang mengiringi Tunku pada majlis Banda Hilir 20 Feb 1956: Ghafar Baba (ketua perhimpunan), V.T. Sambanthan (kalungan bunga), Leong Yew Koh (berucap)."},{"type":"match","xp":15,"voiceIdKey":"u2-s6","voiceToneLabel":"Padan Tokoh & Lokasi Peristiwa Melaka","voiceCaption":"Padankan tokoh dan mercu tanda peristiwa bersejarah 20 Februari 1956 di Melaka dengan peranannya.","voiceScript":"[confident] Uji ingatan kamu tentang peristiwa dua puluh Februari seribu sembilan ratus lima puluh enam di Melaka! Padankan setiap tokoh dan lokasi berikut dengan sumbangan mereka.","prompt":"Padankan tokoh dan tempat dalam Sambutan Bersejarah di Melaka (20 Feb 1956) dengan peranan masing-masing:","pairs":[{"id":"m1","left":"Lapangan Terbang Batu Berendam","right":"Lokasi pesawat rombongan merdeka mendarat pada 20 Feb 1956 sebelum diarak"},{"id":"m2","left":"Ghafar Baba","right":"Mengetuai perhimpunan lebih 100 ribu rakyat di Padang Banda Hilir"},{"id":"m3","left":"V.T. Sambanthan","right":"Menyambut kepulangan Tunku Abdul Rahman dengan kalungan bunga"},{"id":"m4","left":"Leong Yew Koh","right":"Berucap di Padang Banda Hilir menzahirkan sokongan masyarakat Cina"},{"id":"m5","left":"Memorial Pengisytiharan Kemerdekaan","right":"Bangunan peringatan perjalanan negara dan pengumuman tarikh merdeka"}],"explanation":"Penyertaan Tunku Abdul Rahman bersama Ghafar Baba, V.T. Sambanthan dan Leong Yew Koh menyerlahkan gandingan kaum menuju kemerdekaan.","voiceIdKeyHint":"u2-s6"},{"type":"mcq","xp":20,"voiceIdKey":"u2-s7","voiceToneLabel":"Uji Hasil Perjanjian 8 Februari 1956","voiceCaption":"Semak persetujuan utama dalam Perjanjian Kemerdekaan Tanah Melayu 8 Februari 1956 serta laporan 20 halaman.","voiceScript":"[confident] Soalan penutup Unit dua! Selain menetapkan persetujuan British memberikan kemerdekaan kepada Tanah Melayu, apakah badan baharu yang dipersetujui untuk ditubuhkan menerusi Perjanjian Kemerdekaan pada lapan Februari seribu sembilan ratus lima puluh enam?","prompt":"Apakah persetujuan penting yang turut dimeterai dalam Perjanjian Kemerdekaan Tanah Melayu pada 8 Februari 1956 di London?","options":["Pembentukan sebuah Suruhanjaya Perlembagaan bagi merangka perlembagaan negara merdeka","Pemansuhan kesemua Majlis Mesyuarat Negeri dan Majlis Raja-Raja","Penyerahan semula pentadbiran Tanah Melayu kepada Pentadbiran Tentera British","Pelantikan Sir Harold MacMichael sebagai Pengerusi Majlis Perundangan Persekutuan"],"correctIndex":0,"explanation":"Laporan 20 halaman dan Perjanjian Kemerdekaan 8 Feb 1956 memastikan persetujuan membentuk Suruhanjaya Perlembagaan (Suruhanjaya Reid) bagi merangka perlembagaan negara merdeka.","voiceIdKeyHint":"u2-s7"}]},{"id":"sej9-u3","title":"Unit 3: Peranan Suruhanjaya Perlembagaan PTM / Suruhanjaya Reid (1956)","subtitle":"Subtopik 9.2 — Pembentukan 8 Mac 1956, 5 Anggota Komanwel, Terma Rujukan & Gerak Kerja 118 Perjumpaan","iconType":"scale","iconUrl":"../assets/icons/sej9-u3.jpg","boss":false,"steps":[{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s1","voiceToneLabel":"5 Anggota Suruhanjaya Reid (8 Mac 1956)","voiceCaption":"Suruhanjaya Perlembagaan PTM diumumkan pada 8 Mac 1956 dan dianggotai lima pakar undang-undang Komanwel diketuai Lord Reid.","voiceScript":"[warm] Berikutan persetujuan di London dan perkenan Raja-raja Melayu, pada lapan Mac seribu sembilan ratus lima puluh enam kerajaan British mengumumkan pembentukan Suruhanjaya Perlembagaan Persekutuan Tanah Melayu atau Suruhanjaya Reid. Suruhanjaya ini dianggotai lima pakar perundangan Komanwel dari Britain, Australia, India dan Pakistan!","title":"9.2 Pembentukan & Lima Anggota Suruhanjaya Perlembagaan PTM","acronym":"8M•5A•K","mediaKey":"sej9_reid_commission_bench","hook":"Kesemua lima anggota suruhanjaya bebas ini berkongsi latar belakang undang-undang dan berpengalaman dalam sistem Perundangan Komanwel!","summary":"Diumumkan pada 8 Mac 1956 dan mula bertugas akhir Jun 1956 untuk membincangkan, menyusun dan merangka perlembagaan negara merdeka.","bullets":["Pembentukan & Kelayakan Komanwel: Diumumkan pada 8 Mac 1956 setelah mendapat persetujuan Raja-raja Melayu lalu memulakan tugas pada akhir bulan Jun 1956; kelima-lima anggotanya berpengalaman dalam bidang undang-undang serta sistem Perundangan Komanwel.","5 Anggota Suruhanjaya Reid: Lord Reid dari Britain (Pengerusi), Sir William Ivor Jennings (Britain), Sir William McKell (Australia), Hakim B. Malik (India) dan Hakim Abdul Hamid (Pakistan)."],"labId":"sej9_suruhanjaya_reid_deck","labTitle":"Dek Kad 3D: 5 Anggota Komanwel, Terma Rujukan & Gerak Kerja","labProps":{"tab":"anggota"},"examTip":"Hafal 5 nama anggota dan negara mereka: Lord Reid (Britain), Sir William Ivor Jennings (Britain), Sir William McKell (Australia), Hakim B. Malik (India), Hakim Abdul Hamid (Pakistan)."},{"type":"match","xp":15,"voiceIdKey":"u3-s2","voiceToneLabel":"Padan 5 Anggota Suruhanjaya Reid","voiceCaption":"Padankan kelima-lima tokoh perundangan Suruhanjaya Perlembagaan Persekutuan Tanah Melayu dengan negara dan jawatan mereka.","voiceScript":"[confident] Uji ketepatan nama anggota Suruhanjaya Perlembagaan! Padankan kelima-lima pakar undang-undang berikut dengan negara asal serta peranan masing-masing.","prompt":"Padankan lima anggota Suruhanjaya Perlembagaan Persekutuan Tanah Melayu (Suruhanjaya Reid) dengan maklumat yang tepat:","pairs":[{"id":"sr1","left":"Lord Reid","right":"Pengerusi Suruhanjaya (Britain)"},{"id":"sr2","left":"Sir William Ivor Jennings","right":"Anggota pakar perlembagaan dari Britain"},{"id":"sr3","left":"Sir William McKell","right":"Anggota dari Australia"},{"id":"sr4","left":"Hakim B. Malik","right":"Anggota dari India"},{"id":"sr5","left":"Hakim Abdul Hamid","right":"Anggota dari Pakistan"}],"explanation":"Pelantikan pakar bebas daripada empat negara Komanwel memastikan penggubalan perlembagaan bersifat profesional dan adil kepada semua kaum.","voiceIdKeyHint":"u3-s2"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s3","voiceToneLabel":"Terma Rujukan Suruhanjaya Reid","voiceCaption":"Terma rujukan menggariskan unit tunggal Komanwel, Demokrasi Berparlimen dua dewan, pusat kuat bersama autonomi negeri, Raja Berperlembagaan serta kedudukan Melayu.","voiceScript":"[warm] Apakah panduan tugas Suruhanjaya Reid? Terma Rujukan mengarahkan mereka meneliti aturan perlembagaan sedia ada dengan menghormati martabat Ratu England dan Raja-raja Melayu, mencadangkan persekutuan tunggal berkerajaan sendiri dengan dua dewan, kerajaan pusat kuat berserta autonomi negeri, serta jawatan Yang di-Pertuan Agong.","title":"Terma Rujukan Suruhanjaya Perlembagaan Persekutuan Tanah Melayu","acronym":"T•D•P•R•Y","mediaKey":"sej9_reid_commission_bench","hook":"Dalam Terma Rujukan asal, jawatan Ketua Negara disebut sebagai Yang di-Pertuan Besar sebelum dimasyhurkan sebagai Yang di-Pertuan Agong!","summary":"Lima teras Terma Rujukan memastikan keseimbangan antara kerajaan persekutuan yang kukuh, autonomi negeri, institusi beraja dan hak semua penduduk.","bullets":["Bentuk Kerajaan & Parlimen: Memeriksa aturan perlembagaan sedia ada dengan mengambil kira martabat Ratu England dan Raja-raja Melayu; mencadangkan Perlembagaan Persekutuan sebagai unit tunggal bebas dalam Komanwel berasaskan Demokrasi Berparlimen dua Dewan Perundangan dengan kerajaan pusat kuat dan autonomi negeri.","Raja Berperlembagaan, Ketua Negara & Hak Kaum: Melindungi Raja-raja Melayu sebagai Raja Berperlembagaan di negeri masing-masing, mencadangkan Ketua Negara iaitu Yang di-Pertuan Besar (kini Yang di-Pertuan Agong), mewujudkan kewarganegaraan sama rata serta menjaga kedudukan istimewa Melayu dan kepentingan sah kaum lain."],"labId":"sej9_suruhanjaya_reid_deck","labTitle":"Balikkan Kad 3D: Terma Rujukan Suruhanjaya Reid","labProps":{"tab":"terma"},"examTip":"Untuk soalan esei Kertas 2 tentang Terma Rujukan, pastikan kamu menyebut frasa lengkap: 'kerajaan pusat yang kuat dengan kerajaan negeri mempunyai autonomi tertentu' dan 'Yang di-Pertuan Besar -> Yang di-Pertuan Agong'."},{"type":"predict","xp":20,"voiceIdKey":"u3-s4","voiceToneLabel":"Ramal Rasional Kuasa Pusat & Autonomi Negeri","voiceCaption":"Analisis keperluan mewujudkan kerajaan pusat yang kuat sambil mengekalkan autonomi tertentu bagi kerajaan negeri dalam Terma Rujukan.","voiceScript":"[curious] Fikirkan secara strategik! Mengapakah Terma Rujukan Suruhanjaya Reid menetapkan supaya Persekutuan Tanah Melayu mempunyai kerajaan pusat yang kuat, tetapi pada masa yang sama kerajaan negeri masih diberi autonomi tertentu?","hook":"Persekutuan yang merdeka perlu mengimbangi kecekapan pentadbiran pusat dengan kedaulatan sembilan negeri beraja!","scenario":"Tanah Melayu terdiri daripada sembilan negeri Melayu yang mempunyai Sultan serta dua Negeri-negeri Selat iaitu Pulau Pinang dan Melaka sebelum mencapai kemerdekaan 1957.","prompt":"Mengapakah Terma Rujukan menggabungkan konsep kerajaan pusat yang kuat dengan pemberian autonomi tertentu kepada kerajaan negeri?","options":["Menjamin kestabilan pentadbiran, keselamatan dan ekonomi negara secara berpusat sambil menghormati hak tadbir urus tradisional setiap negeri","Membolehkan setiap negeri menubuhkan pasukan tentera dan mata wang berasingan daripada Persekutuan","Menghapuskan kuasa perundangan Majlis Raja-Raja dalam hal agama Islam dan adat istiadat","Menjadikan Tanah Melayu sebagai tanah jajahan langsung di bawah Gabenor Singapura"],"correctIndex":0,"proofLabId":"sej9_suruhanjaya_reid_deck","proofState":{"tab":"terma"},"explanation":"Kerajaan pusat yang kuat menyelaras pertahanan, kewangan dan dasar nasional, manakala autonomi negeri memelihara hak negeri beraja dalam hal tanah, agama Islam serta adat istiadat Melayu.","voiceIdKeyHint":"u3-s4"},{"type":"concept","biteSize":true,"xp":10,"voiceIdKey":"u3-s5","voiceToneLabel":"Gerak Kerja 118 Perjumpaan (Jun–Okt 1956)","voiceCaption":"Suruhanjaya Reid mengumpul cadangan bertulis dan lisan, melawat negeri Melayu dan Negeri-negeri Selat serta mengadakan 118 perjumpaan dari Jun hingga Oktober 1956.","voiceScript":"[warm] Bagaimanakah Suruhanjaya Reid melaksanakan gerak kerjanya? Mereka meminta cadangan penduduk secara bertulis dan lisan, menghadap Raja-raja Melayu, Menteri Besar dan pegawai negeri serta melawat negeri Melayu dan Negeri-negeri Selat. Sebanyak seratus lapan belas perjumpaan diadakan dari Jun hingga Oktober seribu sembilan ratus lima puluh enam!","title":"Gerak Kerja Suruhanjaya Reid: Lawatan Negeri & 118 Perjumpaan","acronym":"118P•131M","mediaKey":"sej9_reid_listening_tour","hook":"Daripada Jun hingga Oktober 1956, Suruhanjaya Reid mengadakan 118 perjumpaan merentas seluruh Tanah Melayu untuk mendengar suara setiap lapisan masyarakat!","summary":"Tiga kaedah gerak kerja memastikan laporan dan draf perlembagaan digubal dengan sikap prihatin dan terbuka.","bullets":["Cadangan Penduduk & Lawatan Rasmi: Meminta cadangan bertulis atau lisan daripada penduduk (menerima memorandum bertulis pelbagai pihak), meneliti perlembagaan negeri, menghadap Raja-raja Melayu, Menteri Besar, Penasihat British dan pegawai negeri serta melawat negeri Melayu dan Negeri-negeri Selat.","118 Perjumpaan (Jun–Okt 1956): Mengadakan persidangan membincangkan pelbagai isu sebanyak 118 perjumpaan dari Jun hingga Oktober 1956 untuk mengkaji dan menyusun laporan serta cadangan membentuk perlembagaan merdeka."],"labId":"sej9_suruhanjaya_reid_deck","labTitle":"Kad 3D: Gerak Kerja Suruhanjaya (Jun–Okt 1956)","labProps":{"tab":"gerak"},"examTip":"Beza angka peperiksaan: **118 perjumpaan** (Jun–Okt 1956) dalam Subtopik 9.2, manakala **131 memorandum bertulis** diterima dalam Subtopik 9.3."},{"type":"sort","xp":20,"voiceIdKey":"u3-s6","voiceToneLabel":"Isih Terma Rujukan vs Gerak Kerja","voiceCaption":"Kelaskan peruntukan berikut sama ada termasuk dalam Terma Rujukan ataupun Gerak Kerja Suruhanjaya Perlembagaan.","voiceScript":"[curious] Asingkan enam fakta berikut kepada Terma Rujukan atau Gerak Kerja Suruhanjaya Perlembagaan Persekutuan Tanah Melayu!","prompt":"Kelaskan butiran berikut kepada Terma Rujukan atau Gerak Kerja Suruhanjaya Reid:","buckets":[{"id":"terma","label":"Terma Rujukan Suruhanjaya"},{"id":"gerak","label":"Gerak Kerja Lapangan (Jun–Okt 1956)"}],"items":[{"text":"Mencadangkan Persekutuan sebagai unit tunggal Demokrasi Berparlimen dua Dewan","bucketId":"terma","note":"Garis panduan asas bentuk kerajaan dalam Terma Rujukan."},{"text":"Mengadakan sebanyak 118 perjumpaan dari Jun hingga Oktober 1956","bucketId":"gerak","note":"Bilangan persidangan perbincangan isu oleh anggota Suruhanjaya."},{"text":"Mencadangkan jawatan Ketua Negara iaitu Yang di-Pertuan Besar (YDPA)","bucketId":"terma","note":"Ketentuan struktur ketua negara bagi Persekutuan Tanah Melayu."},{"text":"Menghadap Raja-raja Mela
